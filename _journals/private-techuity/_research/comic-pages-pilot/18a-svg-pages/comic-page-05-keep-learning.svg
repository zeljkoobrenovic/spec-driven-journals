<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1346" viewBox="0 0 600 1346" role="img" aria-labelledby="title desc">
<title id="title">Keep the conversation alive</title><desc id="desc">Three-strip comic: keep the conversation alive. Keep the relationship useful. Review what the learning changed. Let evidence shape the next decision.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#337d79"/></marker></defs>
