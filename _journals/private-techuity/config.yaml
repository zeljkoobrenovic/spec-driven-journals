    description: "Learn through the investor’s network, ask for help the company can use and agree the cost, who decides and what support the company will keep needing."
    posts:
      - part-3-intro/index.md
      - 09-plan-investor-support/index.md
      - 10-learn-through-investors-network/index.md
      - 11-choose-right-help/index.md
      - 12-set-terms-of-help/index.md
      - 13-clarify-adviser-role/index.md
      - 14-technology-operating-partners/index.md
  - title: "Part IV — COMMIT: Turn Expectations Into Work You Can Deliver"
    description: "Turn investor expectations into feasible commitments to customers, systems and teams."
    posts:
      - part-4-intro/index.md
      - 15-adopt-outcome-thinking/index.md
      - 16-have-your-numbers-ready/index.md
      - 17-set-priorities/index.md
      - 18-test-revenue-assumptions/index.md
      - 19-clarify-ai-strategy/index.md
      - 20-assess-capability/index.md
      - 21-manage-funding-delays/index.md
  - title: "Part V — SCALE: Change the Team, the Systems and the Company Deliberately"
    description: "Change the company’s size and shape on purpose: add people only where the work needs them, stop work before cutting jobs, change systems for the growth the plan expects, and account for the work a purchase or a separation adds."
    posts:
      - part-5-intro/index.md
      - 22-scale-the-team-up/index.md
      - 23-scale-the-team-down/index.md
      - 24-scale-the-team-with-ai/index.md
      - 25-plan-for-growth/index.md
      - 26-plan-acquisitions-separations/index.md
  - title: "Part VI — SUSTAIN: Keep the Technology You Run Worth Its Cost"
    description: "Keep the technology the company already runs worth its cost: put a lower cloud bill on a comparable basis and prove that backups restore the service before calling either an improvement."
    posts:
      - part-6-intro/index.md
      - 27-manage-technical-debt/index.md
      - 28-build-test-resilience/index.md
      - 29-evaluate-cloud-costs/index.md
      - 30-evaluate-ai-costs/index.md
  - title: "Part VII — LEAD: Manage Funding and Ownership Changes"
    description: "Lead when the company’s money or owners change: check the business before an investment, fund the first plan, and hand over the evidence and unfinished promises."
