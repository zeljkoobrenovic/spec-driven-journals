title: "OWNED: Product & Engineering Leadership Under Investors"
description: "A practical guide to making product and engineering decisions when investors shape the money, authority and expectations around your company. This is a living journal and a work in progress: a draft built by [Željko Obrenović](https://obren.io), who keeps evolving it as he learns more about the topics it covers."
logo: "assets/pexels-chairs-2181916.jpg"
logo_credit: "Image by Pexels from Pixabay"
book_pdf: "https://zeljkoobrenovic.github.io/owned-book/book.pdf"
book_epub: "https://zeljkoobrenovic.github.io/owned-book/book.epub"

