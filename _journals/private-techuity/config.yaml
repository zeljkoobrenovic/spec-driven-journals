title: "OWNED: Product & Engineering Leadership Under Investors"
description: "A practical guide to making product and engineering decisions when investors shape the money, authority and expectations around your company. This is a living journal and a work in progress: I revise it as I learn more through [my work](https://obren.io)."
logo: "assets/pexels-chairs-2181916.jpg"
logo_credit: "Image by Pexels from Pixabay"
book_pdf: "https://zeljkoobrenovic.github.io/owned-book/book.pdf"
book_epub: "https://zeljkoobrenovic.github.io/owned-book/book.epub"

sections:
  - title: Preface
    posts:
      - introduction/index.md
      - where-investment-goes-wrong/index.md
  - title: "Part I — UNDERSTAND: Financing and Ownership"
    description: "Identify your owners’ expectations and the money and decisions you can rely on."
    posts:
      - part-1-intro/index.md
      - 00-understand-expectations/index.md
      - 01-understand-funding-control/index.md
      - 02-understand-valuation/index.md
      - 03-understand-investor-returns/index.md
      - 04-understand-funding-choices/index.md
      - 05-understand-cash-flow/index.md
  - title: "Part II — ALIGN: Clarify Who Decides and What Is at Stake"
    description: "Establish who decides, what each party wants and how to resolve competing demands."
    posts:
      - part-2-intro/index.md
      - 06-clarify-authority/index.md
      - 07-compare-incentives-stakes/index.md
      - 08-assess-investor-fit/index.md
