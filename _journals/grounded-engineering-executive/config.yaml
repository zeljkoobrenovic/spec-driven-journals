title: Grounded Engineering Executive
description: Željko Obrenović's vision of how he operates as an engineering executive — durable operating principles, each grounded in a concrete working checklist. Informed by practice and by Will Larson's "The Engineering Executive's Primer".
logo: "assets/images/iStock-1376008059.jpg"
logo_credit: "Image by brightstars from iStock"
sections:
  - title: Start Here
    description: "What this journal is, why it exists in writing, and how to read it."
    posts:
      - introduction/index.md

  - title: Getting the Role
    description: "How I approach finding, evaluating, and starting an engineering executive role: deliberate search, and a first 90 days that prioritizes learning over change."
    posts:
      - getting-the-job/index.md
      - first-90-days/index.md

  - title: Setting Direction
    description: "How I set direction for an engineering organization: strategy that creates real leverage, planning that serves the business, values that are actually used, and measurement that speaks to both engineers and the CEO."
    posts:
      - engineering-strategy/index.md
      - planning/index.md
      - organizational-values/index.md
      - measuring-engineering-organizations/index.md

  - title: Operating the Organization
    description: "How I run the engineering organization day to day: clearly owned processes, meetings that earn their cost, deliberate internal communication, calibrated standards, and trust that is inspected rather than assumed."
    posts:
      - run-engineering-processes/index.md
      - meetings/index.md
      - internal-communication/index.md
      - calibrating-your-standards/index.md
      - inspected-trust/index.md

  - title: Talent
    description: "How I build the team: an executive's role in hiring, onboarding that turns new engineers into productive colleagues, and ; gelling the leadership team."
    posts:
      - hiring/index.md
      - engineering-onboarding/index.md
      - gelling-your-engineering-leadership-team/index.md

  - title: Working with Peers and the Business
    description: "How I work beyond the engineering organization: balancing the CEO, executive peers, and Engineering; onboarding peer executives; curating a network; and engineering's role in mergers and acquisitions."
    posts:
      - working-with-your-ceo-peers-and-engineering/index.md
      - onboarding-peer-executives/index.md
      - your-network/index.md
      - mergers-and-acquisitions/index.md

  - title: Leading Yourself
    description: "How I lead myself so the organization gets a sustainable executive: deliberate leadership styles, managed priorities and energy, and prestige built for the organization, not the ego."
    posts:
      - leadership-styles/index.md
      - managing-energy/index.md
      - personal-and-organizational-prestige/index.md

  - title: "Appendix: An Elegant Puzzle"
    description: "The management-systems layer beneath the executive role, from Will Larson's earlier \"An Elegant Puzzle\": organizational design, management systems and tools, management approaches, engineering culture, and career and performance systems — read through an executive lens."
    posts:
      - organizational-design/index.md
      - systems-and-tools/index.md
      - management-approaches/index.md
      - engineering-culture/index.md
      - careers-and-performance/index.md

