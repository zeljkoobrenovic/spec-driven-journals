title: Grounded Product Management
description: Željko Obrenović's vision of how product management should work — durable operating principles for vision-led, outcome-driven product work, each grounded in a concrete working checklist. Informed by practice, by Ben Foster and Rajesh Nerlikar's "Build What Matters", by Marty Cagan's "EMPOWERED", and by John Cutler's "The Beautiful Mess".
logo: "assets/images/iStock-1126482102.jpg"
logo_credit: "Image by ma_rish from iStock"

sections:
  - title: Start Here
    description: "What this journal is, why an engineering executive writes down a product operating model, and how to read it."
    posts:
      - introduction/index.md

  - title: Build What Matters
    description: "Vision-led product management, from Foster and Nerlikar's \"Build What Matters\": the dysfunctions that make product work drift, a customer-journey vision, a strategy that connects vision to work, key outcomes over outputs, a balanced roadmap, and the team and processes that deliver it."
    posts:
      - dysfunctions/index.md
      - customer-journey-vision/index.md
      - product-strategy/index.md
      - outcomes/index.md
      - balanced-roadmap/index.md
      - right-team/index.md
      - right-processes/index.md

  - title: EMPOWERED
    description: "Empowered product teams and product leadership, from Cagan and Jones's \"EMPOWERED\": coaching as the first job of leaders, deliberate staffing, product vision and principles, team topology, product strategy, team objectives, and collaborating with the business."
    posts:
      - coaching/index.md
      - staffing/index.md
      - product-vision-and-principles/index.md
      - empowered-product-strategy/index.md
      - team-topology/index.md
      - team-objectives/index.md
      - business-collaboration/index.md

  - title: Operating Takes
    description: "How the model runs day to day, from John Cutler's \"20 Unfiltered Operating Takes\" (The Beautiful Mess, TBM 435): durable outcome-oriented lanes instead of alignment pyramids, working small at a deliberate tempo, routines as the heartbeat, reading the shapes of work instead of templating them, and goals and questions as habits backed by causal models."
    posts:
      - lanes/index.md
      - working-small/index.md
      - routines/index.md
      - shapes-of-work/index.md
      - goals-and-questions/index.md
