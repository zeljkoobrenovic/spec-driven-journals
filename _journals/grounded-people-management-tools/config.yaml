title: Grounded People Management Tools
description: Željko Obrenović's people-management toolkit — the concrete tools I run people management with: checklists, templates, rubrics, and process guides for the management basics, the operating cadence, hiring, team development, and performance. Informed by practice and by the companion workbooks to Claire Hughes Johnson's "Scaling People".
logo: "assets/images/journal-logo.jpeg"
logo_credit: "Image generated by Google Gemini (gemini-3-pro-image-preview)"

sections:
  - title: Start Here
    description: "What this journal is, why a management toolkit is written down as records, and how to read it."
    posts:
      - introduction/index.md

  - title: Management Foundations
    description: "The baseline before any tool helps: the management hygiene every manager owes their people, and the self-awareness work — values, work style, strengths — that management quality is built on."
    posts:
      - management-prerequisites/index.md
      - self-awareness/index.md

  - title: The Operating System
    description: "The written core of how a team runs: operating principles, a team charter, objectives and metrics that survive scrutiny, and a quarterly business review that tells leadership the truth."
    posts:
      - operating-principles/index.md
      - team-charter/index.md
      - writing-okrs/index.md
      - quarterly-business-reviews/index.md

  - title: Hiring and Onboarding
    description: "A structured hiring system: a competency-mapped interview loop with rubrics, a consistent question bank, written exercises, a candidate review that keeps decisions honest, and the transitions and onboarding tools that make the hire succeed."
    posts:
      - interview-loop/index.md
      - interview-question-bank/index.md
      - hiring-written-exercises/index.md
      - candidate-review/index.md
      - manager-transitions/index.md
      - working-with-me/index.md
      - new-leader-onboarding/index.md

  - title: Team Development
    description: "Developing the team you have: career conversations that trace motivation, offsites that earn their cost, leadership updates that keep context flowing, and an unblocking process that turns disagreement into decisions."
    posts:
      - career-conversations/index.md
      - team-offsites/index.md
      - leadership-team-updates/index.md
      - unblocking-process/index.md

  - title: Feedback and Performance
    description: "The performance mechanisms nobody enjoys and everybody needs: written performance reviews, compensation conversations owned rather than outsourced, and a documented, humane path through underperformance."
    posts:
      - performance-reviews/index.md
      - compensation-conversations/index.md
      - managing-underperformance/index.md
