title: "LISTED: Architecting Large-Scale Classifieds and Marketplace Platforms"
description: "How architects and engineering leaders design, scale, govern and evolve the systems behind classifieds and listing marketplaces — listings, ingestion, search, trust, monetization and the multi-country platforms beneath them. This is a living journal and a work in progress: I revise it as I learn more through [my work](https://obren.io)."
logo: "assets/images/markusspiske-newspaper-595478.jpg"
logo_credit: "Image by Markus Spiske from Pixabay"
book_pdf: "https://zeljkoobrenovic.github.io/listed-book/book.pdf"
book_epub: "https://zeljkoobrenovic.github.io/listed-book/book.epub"

