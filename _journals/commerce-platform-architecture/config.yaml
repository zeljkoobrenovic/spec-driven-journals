title: "ORDERED: Architecting Commerce Platforms"
description: "How commerce systems fit together, why the architectural decisions behind them matter, and how those decisions evolve as a business grows — from the catalog, the cart and the payment to the warehouse, the stores, the marketplaces and the back office, following one order from discovery to delivery and back. Written for readers new to commerce architecture, platform-neutral, with a fictional running example and dated public evidence. This is a living journal and a work in progress: I revise it as I learn more through [my work](https://obren.io)."
logo: "assets/images/konkapo-small-business-10207329.jpg"
logo_credit: "Image by kazuharu kondo from Pixabay"
book_pdf: "https://zeljkoobrenovic.github.io/ordered-book/book.pdf"
book_epub: "https://zeljkoobrenovic.github.io/ordered-book/book.epub"

ai_credit: "AI-assisted: researched and written with Claude Code and Codex; illustrations generated with Gemini and OpenAI image tools. [How this works](https://zeljkoobrenovic.github.io/spec-driven-journals/foundations/ai-mediated-authoring.html)"

