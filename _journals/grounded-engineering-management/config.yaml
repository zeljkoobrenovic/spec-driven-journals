title: Grounded Engineering Management
description: Željko Obrenović's engineering-management operating model, written as records across the whole ladder — from being managed, through mentoring, tech lead, and first-line management, to managing managers and senior leadership — plus the engineer career expectations that management exists to serve. Each record ships its working checklist. Informed by practice, by Camille Fournier's "The Manager's Path", Julie Zhuo's "The Making of a Manager", and Gergely Orosz's "The Software Engineer's Guidebook".
logo: "assets/images/journal-logo.jpeg"
logo_credit: "Image generated by Google Gemini (gemini-3-pro-image-preview)"

sections:
  - title: Start Here
    description: "What this journal is, why an engineering executive writes the management ladder down as records, and how to read it."
    posts:
      - introduction/index.md

  - title: The Manager's Path
    description: "The management ladder, rung by rung, from Camille Fournier's \"The Manager's Path\": what I owe my reports and ask of them, mentoring, the tech lead role, managing people, a team, multiple teams, managers, and senior leadership."
    posts:
