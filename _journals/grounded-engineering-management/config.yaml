      - managing-managers/index.md
      - senior-leadership/index.md

  - title: Operational Excellence
    description: "The operational bar I hold software teams to — launch readiness, incidents, on-call, system health, and CI/CD — based on Kate Matsudaira's \"Software Managers' Guide to Operational Excellence\"."
    posts:
      - operational-excellence/index.md

  - title: The Making of a Manager
    description: "First-line management fundamentals, from Julie Zhuo's \"The Making of a Manager\": what the job is, the first three months, leading a small team, feedback, managing yourself, meetings, hiring, execution, growing teams, and culture — plus supplementary records on downturns and remote teams."
