  - title: The Software Engineer's Guidebook
    description: "The engineer career ladder seen from the manager's side, from Gergely Orosz's \"The Software Engineer's Guidebook\": the expectations I hold engineers to from competent to staff and principal, and the career mechanics — ownership, reviews, promotions, job changes, paths, and environments — I coach them through."
