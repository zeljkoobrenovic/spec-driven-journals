title: "BOOKED: Architecting Travel Accommodation and Hosted Stays Marketplaces"
description: "How architects and engineering leaders design, scale, govern and evolve the systems behind accommodation marketplaces — the OTA that sells hotel rooms by rate plan and the hosted-stays marketplace that sells nights in someone's home — from supply connectivity and availability to search, booking, money, trust and the platforms beneath them. This is a living journal and a work in progress: I revise it as I learn more through [my work](https://obren.io)."
logo: "assets/images/journal-logo.jpeg"
logo_credit: "Image generated by Google Gemini (gemini-3-pro-image-preview)"

