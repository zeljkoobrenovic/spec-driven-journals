title: "RECONCILED: Enterprise Architecture for Financial Systems"
description: "How a Chief Architect designs, integrates, governs and evolves the finance technology of a multinational enterprise — ERP, payments, close, consolidation and the custom platforms between them — as one coherent system. This is a living journal and a work in progress: I revise it as I learn more through [my work](https://obren.io)."
