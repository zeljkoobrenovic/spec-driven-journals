<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "# Spec: Working With Investors: Operating Model Blueprints\n\n## Intent\n\nOpen Part IV with a chapter based on `_drafts/operating-models/INPUT-1.md` and `INPUT-2.md`. Help a product or technology leader choose and agree a workable relationship between investor involvement and company delivery. Combine business priorities and forms of investor involvement in a practical selection guide. Make blueprints usable through their decisions, people, funding, review practices and conditions for change.\n\n## Audience\n\nProduct and engineering leaders inside investor-backed companies; chief executives, finance leaders and operating partners are secondary readers. Assume no finance or investment background. Expand every executive abbreviation at first use, and explain operating model, investment thesis, value creation plan, shared service, federated arrangements, private equity, portfolio, diligence, subsidiary, budget, forecast, revenue, profit, cash, runway and the technical terms of the worked example (platform, pilot, migration, rollout, production acceptance, shared identity, roadmap) in plain language at their first meaningful use. Carry the same essential explanations into the summary and the comic, each of which must read independently. Use private-equity evidence with brief, qualified venture and growth comparisons.\n\n## Success criteria\n\n- Hand off to [Learn Through Your Investor’s Network: Knowledge, Peers and New Perspectives](learn-through-investors-network.html) before sourcing a specific capability gap; keep the existing operating-model argument and all artwork.\n\n- Distinguish the investor’s own internal operations, its relationship with portfolio companies, and the company’s internal organization. Concentrate on the latter two.\n- Present four proposed blueprints: management delivery with board oversight, an operating adviser, shared specialists, and dedicated execution inside the company. They are combinations to adapt, with no universal ranking or maturity ladder.\n- Provide a selection guide covering growth, profitability, acquisitions and scaling. For each priority, connect the missing capability to possible investor contributions and the company's internal design; explain why the same priority can need different combinations.\n- For each blueprint, explain suitable conditions, decision rights, delivery capacity, funding, review evidence, failure signs and a condition for changing or ending the arrangement. Include concrete product or technology consequences.\n- Treat local autonomy, common standards, shared services and integration as a separate design choice. Distinguish sharing expertise across a fund’s portfolio from integrating functions inside an acquired corporate group.\n- Tie formal authority to the actual appointment, delegation and governing arrangements. Separate advice, assessment, approval and executive direction; make company and investor commitments visible.\n- Include a reusable blueprint record, a suggested review rhythm and one explicitly fictional acquisition example independent of Larkspur’s existing scenarios. State what is funded, what company capacity is used and what changes at review. Every activity between week one and week twelve has a named person and a stated funding arrangement; name the role that approves live customer use, distinguish it from the continuing service owner, and make any extension or permanent capability conditional on renewed approval and resources. Do not imply specialist availability after week six or a guaranteed delivery date. The volunteer-customer trial runs weeks seven to ten and closes at week ten, with both customers returned to their original sign-ins inside the same eight reserved engineer-days and the deferred internal improvements held through week ten; weeks eleven and twelve carry no customer service and no build work, only preparation of the next proposal. No week-ten obligation may depend on the later twelve-week decision, and all three formats state the same sequence.\n- Explain where AI affects capability, data access, implementation and accountability without making a common tool or specialist team a universal prescription. Link the technology operating partner chapter and existing AI, hiring, governance and acquisition chapters.\n- Review the supplied links directly, identify the sections actually consulted, and separate source observations from the author’s blueprint designs. Date the 2018 survey and current firm examples; do not infer causal performance, universal board behavior, promised savings or current market prevalence from them.\n- Preserve the book’s learning objective, three KEY POINTS, questions and further reading. Aim for 3,000–4,000 words of article prose, readable captions, and no more than two substantial tables. Where the plain-language requirement in *Audience* conflicts with that ceiling, the explanations win: after the September 2026 reviews the article stands at about 5,900 words, with the byline unchanged at 22 minutes.\n- Add a chapter logo, navigation icon and seven explanatory figures in the book’s ivory, navy, muted teal and ochre style. Retain the connected-model, support-choice and pilot-review figures. Add one distinct visual within each of the four blueprint sections: board oversight with company-led delivery; an adviser supporting a company decision; a booked specialist assignment with a company owner; and a dedicated company assignment with agreed reporting and handover. Depict advice and shared expertise without implying additional executive authority. Use accurate labels, descriptive alt text and numbered captions; name the fourth blueprint consistently across the prose and the figures; preserve generation prompts and provenance. Where a figure or comic page letters an executive abbreviation, the surrounding prose, caption or alt text expands it.\n- Place the article immediately after the Part IV introduction, before `learn-through-investors-network`. End with a transition to learning through the investor’s network. Retain the permalink and artwork, number its source folder `09-operating-model-blueprints`, and align the reading guide, contents and manuscript with 34 main chapters.\n- Add a TL;DR and a five-page illustrated comic. The TL;DR targets 300–500 words, but the plain-language requirement in *Audience* wins where the two conflict: after the round-3 review it stands at about 740 words, because it must explain profitability, revenue, shared services, budget, forecast, investor return and the trial's closure and forecast conditions to a reader who sees only this page. Both preserve the distinction between investor support and company organization, all four proposed blueprints, explicit authority and committed capacity, and the fictional pilot's six-week and twelve-week reviews. The comic uses the journal's familiar cast to act out this independent example, with three strips per page, accurate dialogue and labels in the artwork, descriptive alt text, short captions and rendered transcripts. Alt text describes a prospective capacity conflict as prospective, never as an obstruction that already happened. Preserve the scripts and image provenance; inspect every generated page against its script.\n\n## Non-goals\n\nA fund-administration manual, company-wide reorganization instructions, a jurisdiction-specific governance document, an investment-return model or a replacement for the existing engagement charter. Do not assume that all portfolio companies form a corporate group or can share customer data. Do not repeat the main chapters’ financial calculations or restore the discontinued Productscapes appendix.\n\n## Modalities\n\n- Article: the existing illustrated draft, with its chapter logo, navigation icon and seven explanatory figures.\n- TL;DR: `summary.md`, a self-contained 300–500-word summary in the journal's concise prose style, reusing the support-choice overview after the opening paragraph.\n- Comic: `comics.md`, five illustrated pages of three strips each, following the independent fictional identity pilot from the proposal through its review and possible handover. The page scripts are the source for the artwork, captions and transcripts.\n\n## Open questions\n\nNone for this draft. The author confirmed connecting the investor–company relationship and the company’s internal operating model from a product and technology leader’s perspective; combining business priorities and investor involvement in a practical selection guide; and using private equity as the main evidence base with brief venture and growth comparisons.\n\n## Decision log\n\n- 2026-09-21: Read both supplied inputs and check their linked sources before drafting. Keep the useful distinction between investor support and company organization; convert the conversational notes into a chapter in the book’s voice.\n- 2026-09-21: Reuse S01 for the SEC guide’s expense/conflict discussion; register the selected new evidence with stable identifiers. Record reviewed but unused background separately.\n- 2026-09-21: Keep the investment assumptions, company capacity and decision rights together in each proposed blueprint. Use one independent fictional acquisition scenario to show combinations and revision.\n- 2026-09-21: Apply all three author answers. Introduce a business-priority selection guide that points to the four involvement blueprints and the company-design choices. Keep the company leader’s perspective and qualified venture/growth comparisons.\n\n## Sources\n\nAuthor input: `_drafts/operating-models/INPUT-1.md` and `INPUT-2.md`, unchanged. Selected linked material from McKinsey, Spencer Stuart, Vista, Bain and Investor.gov was consulted on 2026-09-21. The bibliography and `_research/operating-model-blueprints-20260921.md` record dates, consultation scope and evidence limits. The British Business Bank guide and Bain report landing page are background, not additional evidence for the blueprint designs.\n\n## Changelog\n\n- 2026-09-22 (investor learning): Hand off to [Learn Through Your Investor’s Network: Knowledge, Peers and New Perspectives](learn-through-investors-network.html) before sourcing a specific capability gap; keep the existing operating-model argument and all artwork.\n\n- 2026-09-22 (in-depth review, round 3): Settle the trial's ending before editing the article. The volunteer-customer trial closes at week ten with both customers returned inside the eight reserved engineer-days; the week-ten-to-week-twelve continuation branch is removed, so no week-ten obligation waits on the twelve-week decision. Carry that boundary into the summary, the Figure 7 caption and the comic. Also: explain revenue, shared services and the group's formation independently in the summary and comic; pair PE with private equity and gloss refinancing in the article; separate shared identity from identity expertise in the comic introduction; carry the wider migration's funding condition into both shorter formats, with the comic forecasting rather than asserting the later date; and split the longest explanatory blocks, moving the comic's term glosses beside the page that first needs each one. No change to the title, permalink, evidence, figure set, staffing arithmetic or funded commitments. No comic page was regenerated: the week-ten boundary and the forecast condition live in caption and transcript, and none of the five images letters a conflicting date or claim. The manuscript export-manifest drift reported in round 2 was repaired by syncing the chapter's recorded generated hash to the prior export before re-exporting; `validate_manuscript.py` now reports `[valid]`.\n- 2026-09-22 (in-depth review, round 2): Correct the financial vocabulary and complete the example's service coverage before editing the article. Define revenue as income earned from supplying products or services and keep it distinct from cash collected; define runway on net cash consumption after receipts; drop the unsupported claim that portfolio companies usually share no parent, keeping the authority point instead; state who supports the two live trial customers after week ten and what happens if the assignment ends; make the deferred launch timing explicit or drop the year-boundary claim; and carry the essential financial, governance and technical explanations into the standalone summary and comic. No change to the title, permalink, evidence, figure set, staffing arithmetic or fictional commitments.\n- 2026-09-22 (in-depth review, round 1): Extend the contract before implementing the review. Require plain-language expansion of every executive, investment, financial and technical term at first meaningful use in all three formats; complete the fictional example's staffing and funding through week twelve; name the role that approves live customer use; keep the fourth blueprint's name consistent between prose and figures; and keep alt text truthful about prospective conflicts. No change to the article's title, permalink, evidence, figure set or fictional commitments.\n- 2026-09-22: Extend the contract before adding the requested TL;DR and Comic modalities. Reuse the existing summary overview artwork; generate and inspect five comic pages without changing the article, its fictional commitments or its evidence limits.\n- 2026-09-21 (Part IV order): Move the illustrated article into the main reading sequence as the first chapter of Part IV, at the author’s request. Preserve its title, evidence, seven figures, logo and icon; update its opening and closing transitions.\n- 2026-09-21: Write the contract before drafting the requested appendix. Ask three scope questions and state provisional defaults while source verification proceeds.\n- 2026-09-21: Confirm scope with the author and revise the selection-guide contract before updating the article.\n\n- 2026-09-21 (artwork): Extend the specification before adding the author-requested logo and illustrations. Keep the established editorial palette and use the built-in image generator; retain the original PNGs and their prompt/provenance record.\n\n- 2026-09-21 (individual blueprint visuals): Add the author-requested standalone visual to each blueprint section, preserving the overview figures, logo, icon and current article title. Number the resulting seven figures in reading order and retain the generation prompts and original masters.\n"}]}]}</script>

    (function () {

        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');

            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');

            while (i < lines.length) {

                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
