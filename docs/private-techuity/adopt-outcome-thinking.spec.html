<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "# Spec: Adopt Outcome Thinking: Balance Customer and Business KPIs\n\n## Intent\n\nOpen Part IV with the practice that keeps a company building things that create real value for customers while connecting that value, explicitly and on an honest clock, to the business results and investor metrics the plan is held to. The chapter delivers an artifact rather than a culture: an **outcome record** with one key customer outcome in the customer's language, one key business outcome the leadership agrees on, the causal chain between them (drivers, leading and input metrics, lagging results), the investor metric each business outcome feeds and the horizon on which it moves, and the split between what product influences and what sales and customer success own. Every later chapter of Part IV uses that record: priorities are set against it, the revenue chain is tested through it, AI questions are sorted by it, capability is sized to it. The reader leaves able to answer an investor's \"what is your north star\", \"why is product not judged on this quarter's revenue\" and \"which of our metrics does product actually move\", and to say no to a loud request with the record rather than with a fight.\n\nThe chapter is a translation for leaders under investors of the author's product-management operating model ([Outcomes](../grounded-product-management/outcomes.html), [Goals and Questions](../grounded-product-management/goals-and-questions.html), [Lanes](../grounded-product-management/lanes.html), [Balanced Roadmap](../grounded-product-management/balanced-roadmap.html), [Business Collaboration](../grounded-product-management/business-collaboration.html)) and of the customer-and-business KPI pyramids of the Productscape domain model, written in the book's third-person, evidence-first voice rather than the journal's first person.\n\n## Context\n\nLarkspur, the book's fictional scheduling-software company, at the start of the shared chain that the chapters [Use Diligence: Correct the Plan Before It Is Signed](diligence-corrects-the-plan.html), [Plan the First Hundred Days: Turn Expectations Into Funded Work](first-hundred-days.html), [Set Priorities: You Cannot Fund Everything at Once](cannot-fund-everything.html), [Test Revenue Assumptions: Do Customers Respond as Expected?](roadmap-to-revenue.html) and [Manage the Handover: Carry Forward the Evidence and Obligations](handover-of-obligations.html) follow (canonical facts in `_research/shared-scenario-record.md`, which the article must not contradict): setting up a new customer, called onboarding, takes about 80 hours of Larkspur staff time in total (the specialist's manual configuration is only part of it, but it holds the queue); in the week after closing that figure and the median wait of about ten weeks from signed contract to first real schedule are provisional (Morgan's diligence sample of five implementations, three of which needed the specialist's manual configuration), and the day-20 baseline reconstructed from the twelve implementations of the previous two quarters confirms both; the diligence finding D-3 says setup depends on one specialist; the initiative ONB-1 (€180,000, twelve engineer-weeks, €30,000 a year maintenance) targets the setup work; the day-90 cohort of eight came in at 62 hours; gate 2 at month six needs ≤ 50 hours and a median wait of eight weeks or less; capacity at €75 an hour is capacity, never cash, until a dated conversion; the investor's original ambition was a second country within twelve months and a third within two years, but diligence moved the second country out of year one and made it conditional on the pilot's evidence, so the plan approved at closing is 50% more customers in the first year with the same team and a second country only if the evidence supports it; the chapter must not carry the original country dates into the record as current commitments. Same people (Alex technology, Priya product, Ines the company, Sam finance, Morgan the investor's adviser). The chapter writes the outcome record those chapters later execute and measure; it introduces no new shared figures.\n\n## Audience\n\nProduct and engineering leaders inside companies working under investors, including leaders who inherit an ownership arrangement. Assume no specialist finance or product-management background; explain necessary terms before use. Investor-side readers are secondary.\n\n## Success criteria\n\n- **Outcomes, not outputs, defined so a newcomer can apply it.** Define outcome (a measurable change in the customer's or the company's reality), output (what was shipped), key performance indicator (KPI), leading and lagging indicator, and vanity metric in plain words at first use. Give the test for a strong customer metric: it would still matter if the product changed completely, and customers confirm they would pay, renew or expand to get it. Show the contrast table \"what this says / what it does not say\" (shipping still matters; usage counts only when it connects to value; product is judged over quarters and years but is still accountable).\n- **One customer outcome, one business outcome, agreed.** For Larkspur, name the key customer outcome in the customer's language (a new customer scheduling real work within weeks of signing, without Larkspur's specialist doing the setup by hand) with its metric (median weeks from contract to first real schedule; setup hours per customer as the driver) and the key business outcome the leadership agrees on (retention and expansion of paying customers, feeding the investor's second-country thesis), and show Ines getting the executive team and the investor director to agree on the one business result product optimizes for, so the roadmap is not a treaty negotiation.\n- **Two pyramids and the chain between them.** Build the customer-outcome pyramid and the business-outcome pyramid with one explicit structure used in every format: the outcome at the top, the named contributing factors beneath it, and their measures beneath those, parallel branches at the same level. The business pyramid holds only what enters net revenue retention (renewal and expansion of the customers the company already has); cost to serve is shown feeding gross margin and new customers signed feeding annual recurring revenue, outside that pyramid. Connect the two pyramids at the one shared measure: the share of customers reaching a first real schedule within eight weeks, read from the same signing and first-schedule dates as the customer outcome's median and shown in the customer outcome node as well as in the renewal branch, a customer confirmation and a renewal input (the median, in weeks, and the share, a percentage of customers, stay distinct in every format, and the share is never drawn as a single customer's event); staff hours per setup are a customer driver that also feeds cost to serve and gross margin outside the retention pyramid, not a measure shared between the pyramids. Label the business pyramid's measures as a selection of operating indicators, not a complete breakdown of net revenue retention, and explain that the renewal rate counts customers while net revenue retention counts revenue (all customers renewing smaller subscriptions gives 100% renewal and a falling NRR). Describe the baseline hours and wait as measured quantities and the relationship between them as a working explanation still under test, in the figure captions and the TL;DR as well as the prose (the pilot tests whether lowering the hours brings the first schedule forward); label the setup-to-retention link as the working hypothesis with the test that would confirm or weaken it, presenting the fast-versus-slow renewal comparison as evidence to weigh with customer differences and group size, with an inconclusive reading allowed; and attach responsibility to specific measures, in the figures as well as the prose: which product is accountable for, which it influences, which are shared with the customer or the support team, and which sales, pricing and customer success are accountable for. Apply the removal test as a usefulness test (a measure whose removal changes what a team does next week earns its place; one that changes only a slide is decoration), separate from the test of whether the measure causes the outcome.\n- **The investor bridge, on an honest clock.** Define annual recurring revenue (ARR), net revenue retention (NRR), gross margin and cash conversion in plain words, state which of them the business outcome feeds and when the effect can first be observed, each measure anchored to its own trigger and observation window rather than a single chronological axis (setup hours as each pilot customer's setup finishes; first-schedule weeks within a quarter of that customer's signing; month-one support requests a month after that customer's activation; gross margin on the ordinary quarterly accounts; renewal rate and the pilot cohort's NRR at the same first-anniversary review, about a year after each signing; company-wide NRR later, as pilot customers become a larger share of the base), with numbered project days (day 20, day 90) stated to count from day 0, the board meeting held within days after closing that adopted the operating plan (as in [Plan the First Hundred Days: Turn Expectations Into Funded Work](first-hundred-days.html) and the shared scenario record; closing is not day 0 and the gap is not assumed to be zero), signing, setup start, activation and go-live kept as distinct customer dates that need not coincide, quarter, activation and going live defined, labelled as the scenario's expected observation schedule, and show the negotiation with the investor about grading product on its natural horizon while still reporting the lagging indicators when they arrive. Relate the metrics to what Parts I and II already defined (revenue, profit, cash, the valuation multiple, the thesis) rather than introducing a parallel vocabulary, but explain revenue, recurring revenue, subscription, gross margin (as an amount and as a share of revenue) and annual recurring revenue at or before their first substantive use in this chapter; where EBITDA is named, expand it and say in plain words that it is a profit measure, not cash, or leave it out. In every format the per-measure windows are labelled as expected observation windows (setup hours when the setup finishes; first-schedule evidence within three months of signing), not as delivery dates.\n- **Balance as an allocation.** Show customer value before value capture (charging more than the delivered value shows up as complaints, customers leaving and lost trust, on a timing set by customer choices and contract terms; at Larkspur, where subscriptions renew yearly, mostly at the anniversaries), and show the roadmap as an allocation across innovation, iteration and operation decided before ranking, with the outcome record deciding what enters each slice through three admission routes (an item moves a measure in either pyramid, protects an outcome or meets an obligation, or tests an assumption the record depends on; mandatory obligations and operational safeguards such as the recovery work enter the operation slice by the second route, with their own record); hand the ranking and the cash and capacity limits to [Set Priorities: You Cannot Fund Everything at Once](cannot-fund-everything.html) without repeating it.\n- **Outcome-centricity has a price list.** State, with Cutler, that it is a causal model plus habits, not a mindset: a few durable outcome lanes per team with a couple of metrics and a weekly rhythm; goals mixed across learning, shipping and outcome types and kept as a habit; powerful ideas imperfectly measured preferred to perfect measures of weak ideas, with the measurement bar improving over time rather than filtering for small ideas. Name the anti-patterns (feature factory, vanity dashboard, afterthought metric, measurement veto, grading product on the sales clock, deckware pyramid).\n- **The recorded outcome record.** End with Larkspur's record: customer outcome and metric, business outcome and metric, the pyramids' top three levels, the investor metric and horizon, what product does not own, the lanes and their input metrics for the next two quarters, who agreed (Ines, Priya, Alex, Sam, the investor director) and the review cadence; and say which later chapters test each part of it (priorities in [Set Priorities: You Cannot Fund Everything at Once](cannot-fund-everything.html), the chain in [Test Revenue Assumptions: Do Customers Respond as Expected?](roadmap-to-revenue.html), the gates in [Plan the First Hundred Days: Turn Expectations Into Funded Work](first-hundred-days.html)).\n- **Investor questions answered as they are asked.** \"What is your north star\", \"why is product not judged on this quarter's ARR\", and \"which of our metrics does product actually move\", each pointing at the record; the last answer keeps direct influence, indirect influence and accountability apart in every format (product can affect renewal through the customer's experience but is not solely accountable for renewal decisions; sales is accountable for new customers signed, which the setup experience and available capabilities can affect indirectly, and the record does not attribute this quarter's signings to the setup work; never say product moves them \"not at all\").\n- **House rules.** Opening blocks and key points state the practical problem (delivering a setup feature does not by itself get a customer working sooner) before any framework vocabulary; specialist terms (investor and investment fund, closing, diligence, thesis, bookings, revenue, recurring revenue, retention, expansion in both senses, churn, margin, holding period, median, cohort, pilot, onboarding, customer success, lanes, innovation/iteration/operation) explained in ordinary words at first meaningful use in each format, including the TL;DR and the comic, with secondary jargon replaced by ordinary wording in the short formats (\"when the investment completed\", \"customers' repeat subscription payments\", \"new capabilities, improvements and maintenance\"); each paragraph and comic caption with one identifiable purpose (company and cast separate from the investment-plan history; competing requests, agreed outcome and reason for choosing it as separate paragraphs; long captions as short sentences); no unsupported prevalence figures or general timetables; the company leader's decision, authority and funding assumptions explicit; fictional scenarios labelled and consistent with the shared ledger; a meaningful counterargument (an investor with a short holding period can reasonably want lagging results sooner; the answer is a dated plan with leading indicators reported now, not a refusal) with the evidence that would change the judgment; hand-off to [Set Priorities: You Cannot Fund Everything at Once](cannot-fund-everything.html); TL;DR and comic consistent with the article. The short formats say three months rather than quarter, introduce the pilot as a small trial, explain data readiness (records complete and consistent enough to load) and data days (days from signing until those records arrive), define revenue beside its first comic use, and replace vision bet with an explained plain phrase. They also give each early-use measure its activity, interval and starting event (week-one use: scheduling real work in the first week after the customer's account is activated, the day it becomes ready to use, which need not be the signing date; month-one requests: setup-related requests for help in the first month from that same activation date), state the median's even-group rule at its first definition (the average of the two middle waits), and define gross margin as a share of revenue with gross profit as the amount (revenue 100 and direct costs 60 give gross profit 40 and gross margin 40%). Long explanatory paragraphs are split so that each answers one question; comic captions are short paragraphs (definitions; evidence and timing; responsibility or decision) and do not repeat what the artwork and transcript already show. Comic responsibility boards keep the article's assignments exact: data readiness (product, the customer, customer success), early use and month-one requests (product, customer success, support), renewal rate (customer success, pricing), expansion (sales, customer success), new customers (sales). The retention reference is described as a way to judge a proposed target; Larkspur's 105% is an illustrative calculation, not a target it has set.\n\n## Non-goals\n\n- Not a product-management textbook, a discovery or research method, or an OKR manual; the chapter delivers the outcome record and the investor bridge, and links the journal records and sources for the rest.\n- Not the prioritization arithmetic (that is [Set Priorities: You Cannot Fund Everything at Once](cannot-fund-everything.html)), not the pilot measurement and its six kinds of benefit (that is [Test Revenue Assumptions: Do Customers Respond as Expected?](roadmap-to-revenue.html)), not team topology or coaching.\n- Not a claim that outcome practice guarantees results; no invented study results, no prevalence claims about what companies \"usually\" measure, no new figures in the shared ledger.\n\n## Modalities\n\n- [ ] `checklist.md` — not used in this journal's main chapters.\n- [x] `summary.md` — TL;DR of 300–500 words with one overview visual; it explains the shared title's key performance indicators (KPIs) near its opening so a reader entering at `#summary` needs no other tab (about 770 words excluding image alt text since the round-2 to round-5 reviews: the overage is the first-use explanations of KPIs, day 0, investor, board, median, retention, expansion, data readiness, customer success, net revenue retention, cohort, the early-use clocks and the three work categories that the review asked the summary to carry on its own).\n- [ ] `dialog.md` — not used.\n- [x] `comics.md` — comic pages of three stacked strips, same cast as the neighbouring chapters, reaching the agreed outcome record causally.\n- Accessibility (all formats): each image's alt text is a short identification of the diagram and its key relationship; complex diagrams (Figure 1's two pyramids) carry their full content in a clearly labelled, structured description in the surrounding prose, keeping every measure and responsibility assignment.\n\n## Open questions\n\n- Whether the SaaS metric definitions (ARR, NRR, gross margin, cash conversion) also go into the glossary.\n- Whether to register the external sources (Build What Matters, EMPOWERED, TBM 435, the North Star Playbook, Outcomes Over Output) as S-ids or cite them inline and through the journal records.\n\n## Decision log\n\n- 2026-09-24: The author asked for a first chapter of Part IV on adopting an outcome culture and product thinking, balancing customer and business KPIs, motivated as one of the best frameworks for building what creates real customer value while connecting it explicitly to business KPIs and investor metrics; inspiration: the author's grounded-product-management journal and the Productscape start packages (customers, products, teams, objectives, with customer- and business-outcome KPI pyramids per customer type), plus conventional product-management literature.\n- 2026-09-24: Author's choices from the proposal: title \"Adopt Outcome Thinking: Balance Customer and Business KPIs\" (rejected: the longer \"Adopt Outcome Culture and Product Thinking: …\", and \"Judge Work by Outcomes: …\"); the shared onboarding chain carries the outcome record (rejected: a separate example); the SaaS investor metrics are named and defined explicitly (rejected: staying with the book's existing finance terms only). Suggestions accepted into the contract: deliver an artifact rather than a culture; make the chapter the frame for Part IV with one forward link from each later chapter; the investor bridge with horizons as the distinctive part; balance as an allocation; Cutler's corrective against \"mindset\" talk.\n- 2026-09-24: The Productscape overview page is script-rendered and unreadable by fetch; its KPI pyramid model was taken from the local toolkit reference (`productscape/skills/_references/domain-model.md`) and the travel-accommodations example (customer-outcome and business-outcome pyramids per persona; team metrics linked by name to pyramid nodes).\n\n## Sources\n\n- Author's intent from the 24 September 2026 conversation (no `INPUT.md`).\n- The author's grounded-product-management journal: [Outcomes](../grounded-product-management/outcomes.html) (Build What Matters: outcome pair, strong metrics, two pyramids, time horizons), [Goals and Questions](../grounded-product-management/goals-and-questions.html) and [Lanes](../grounded-product-management/lanes.html) (Cutler, TBM 435: causal model, lanes, mixed goals, powerful ideas imperfectly measured, removal test), [Balanced Roadmap](../grounded-product-management/balanced-roadmap.html) (innovation, iteration, operation allocation), [Business Collaboration](../grounded-product-management/business-collaboration.html) (EMPOWERED: partnership, not stakeholder management), [Team Objectives](../grounded-product-management/team-objectives.html).\n- Productscape domain model, local toolkit reference `productscape/skills/_references/domain-model.md` (KPI pyramid model: customerOutcomes and businessOutcomes per persona, shape invariant, team metrics linked by name) and the travel-accommodations example (search-to-book conversion; net booked room-night contribution), read 24 September 2026.\n- John Cutler, [TBM 435: 20 Unfiltered Operating Takes](https://cutlefish.substack.com/p/tbm-435-20-unfiltered-operating-takes), The Beautiful Mess, 8 August 2026, fetched 24 September 2026.\n- Amplitude, [The North Star Playbook](https://amplitude.com/north-star) (John Cutler co-author), fetched 24 September 2026: North Star metric with input metrics; used as a teaching tool per Cutler's caveat.\n- Ben Foster and Rajesh Nerlikar, *Build What Matters* (2020), and Marty Cagan with Chris Jones, *EMPOWERED* (2020), through the journal records above; Josh Seiden, *Outcomes Over Output* (2019), candidate for Probe Further after fetching.\n- Book records: [Set Priorities: You Cannot Fund Everything at Once](cannot-fund-everything.html), [Test Revenue Assumptions: Do Customers Respond as Expected?](roadmap-to-revenue.html), [Plan the First Hundred Days: Turn Expectations Into Funded Work](first-hundred-days.html), [Use Diligence: Correct the Plan Before It Is Signed](diligence-corrects-the-plan.html), [Understand Investor Returns: Same Performance, Different Outcomes](three-different-returns.html) and [Understand Cash Flow: Confirm the Cash Before You Commit](obligations-before-budget.html) (the finance terms already defined), [Compare Incentives and Stakes: Equity, Carry and Jobs](different-bets.html) (investor incentives and horizons).\n\n## Changelog\n\n- 2026-09-24: In-depth review round 5 (AOT-003, -014, -019, -020, -021): numbered project days count from day 0, the board meeting within days after closing that adopted the plan, matching [Plan the First Hundred Days: Turn Expectations Into Funded Work](first-hundred-days.html) and the scenario record, in every format and in the clock artwork; the TL;DR explains KPIs near its opening; the responsibility, holding-period and admission-route passages are split into single-claim sentences and bullets; alt texts are short, with Figure 1's full content in a labelled structured description; the comic's page-1 heading no longer carries a stray full stop.\n- 2026-09-24: In-depth review round 4 (AOT-003, -014, -017, -018): the short formats state what week-one use and month-one reques <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
