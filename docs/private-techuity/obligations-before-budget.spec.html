<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "# Spec: Find the Cash Behind Your Technology Budget\n\n## Intent\n\nShow that positive EBITDA does not establish the cash available for a new initiative: reconcile it with investment, tax, financing payments, working capital and cash on hand, then check dates and restrictions. Work through the cash bridge, separate the lines that are obligations under an agreement from those that are management choices, price three options for one initiative with decision dates and deciders, and teach runway and financing downside in a separate loss-funded scenario. No universal payment hierarchy and no contrast with companies that have no investors.\n\n## Audience\n\nProduct and engineering leaders inside companies working under investors, including leaders who inherit an ownership arrangement. Assume no specialist finance background; explain necessary terms before use. Investor-side readers are secondary.\n\n## Success criteria\n\n- Add one whole-post overview visual to the TL;DR after its opening paragraph, generated with the Nano Banana article illustrator. Keep the 300–500-word summary prose, bold emphasis and citations; provide alt text and a concise numbered caption.\n- Provide a distinctive article header logo and a simple navigation icon with unique asset paths. Keep both consistent with the journal’s visual style.\n- Include two explanatory article figures with accurate short labels, alt text and numbered captions. Labels displayed at ordinary text size in the article figures and the TL;DR overview are set in dark navy lettering with at least 4.5:1 contrast against the ivory background; teal and ochre stay in shapes, arrows and accents, not in lettering. Use restrained bold emphasis for key claims; preserve the words, citations and historical data. The comic modality is a sequence of comic pages: each page is one image of two or three stacked strips that carries its dialogue, labels and amounts in the artwork, with consistent fictional characters and a short caption under each page.\n- Distinguish cash remaining in the annual planning model from cash available to commit; make accounting recognition criteria and omitted cash assumptions explicit. Place the qualification (planning calculation, not a payment priority; engineering salaries are already in operating costs) beside the bridge, with a table saying which lines can move and under whose agreement.\n- Complete the €1 million initiative decision: minimum-continuity, staged and full-funding options with cash, engineer-weeks, next decision date and who decides; state the chosen option, alternatives rejected, funding, scarce capacity, authority and the evidence that would change it; link to [You Cannot Fund Every Good Project at Once](cannot-fund-everything.html).\n- State that capitalization changes when costs enter profit and that later amortization is excluded from EBITDA.\n- Make the company leader’s decision, authority and funding assumptions explicit. Distinguish the stated ownership arrangement from a claim about every investor. Map every approval in the options table to a stated delegation or contractual term: Ines’s delegated limit, the board, the shareholders for new shares, and, for new borrowing, a fictional loan term that requires the existing lender’s consent for debt above a permitted amount (a restriction on action, distinct from the periodic year-end leverage test) plus a lender willing to make the new loan.\n- Keep historical findings within their source scope and label new comparative scenarios as fictional.\n- Introduce necessary terms in ordinary language before using them in explanations, examples, tables, or diagrams; keep opening key points readable without prior study. The excerpt, highlights, key points, working-capital passage and summary describe the working-capital adjustment as the change in unpaid customer invoices over the period (an increase ties up cash; cash arrives only when customers pay), never as the whole amount owed, with a worked contrast (€2 million owed at the start and €3 million at the end is a €1 million adjustment); collecting an invoice is distinguished from writing one off.\n- Move from a concrete question through explanation and example to a practical conclusion; connect the conclusion to the next chapter in the configured reading order.\n- Make summaries and comic storyboards understandable on their own; preserve source limits and label fictional scenarios, including changes in example assumptions.\n- Explain the title question and its implications for a concrete company decision.\n- Distinguish sourced observations, the manuscript's analysis, and explicitly fictional examples.\n- Include a meaningful trade-off or counterargument and identify the evidence that would change the judgment.\n- Link related chapters and cite substantive external factual claims close to the text.\n- Keep the TL;DR and the comic page script consistent with the full article.\n- Explain finance vocabulary at its first reader-facing use in every format, in ordinary language before the label: the excerpt and opening highlights use plain words; EBITDA, depreciation and amortization, capitalization, working capital, covenants, distributions, shareholders’ agreement, equity, private equity (PE), sponsor, SEC, IAS and non-GAAP are each explained where the reader first needs them, and the summary and comic carry their own concise explanations rather than relying on the article. The board is explained at its first use in the opening; the bridge writes principal and distributions in plain words on the line itself; the pilot is introduced as a small trial in the article, the summary and the comic’s three-priced-options page; the summary explains the operating reserve (money the board keeps back for running needs) and Ines’s delegated limit (the spending the board has authorized her to approve alone).\n- Introduce the onboarding example concretely inside this chapter: what onboarding automation and the reusable setup step do, the roles of Ines (chief executive), Sam (finance), Priya (product) and Alex (engineering), the 80-hour baseline and 50-hour target, the cohort as eight customers, engineer-weeks as effort rather than elapsed time, the staffing (three engineers for four weeks, step usable from about day 35) and the day-90 measurement date.\n- Give one chronology for the pilot from approval through day 90 (evidence), day 100 (board decides what comes next, releases no second-stage money), an optional month-six second-stage gate (≤ 50 hours with waiting time down) and the next annual budget round as the default forum; any second stage needs its own priced, funded approval.\n- Give the pilot a complete cost boundary: say what the €180,000 buys (contractor time for the customer-type templates, tooling and services, all outside payroll), that the three engineers are on Larkspur’s payroll inside EBITDA (capacity, not additional cash), that the contract implementation specialist’s days on the build come out of the first-quarter engagement already in the operating plan and are not billed again (a capacity cost to the setup queue, not additional cash, as [Match the Funding to the Work](raise-what-you-need.html) treats the specialist’s hours), that only the engagement’s extension is additional (€37,500 a quarter, €150,000 a year), that the first-quarter engagement ends on 31 March, before either fallback date, so availability is arranged at approval rather than assumed (a no-charge option in that engagement lets Larkspur extend it once for three months at the same rate by notice on or before day 100; the extension then runs from mid-April, invoiced at €12,500 a month; no reservation fee or interim cost; the option lapses unused; option 1 is a separate arrangement, not a use of that one-quarter option: chosen at approval, it is a six-month extension agreed with the firm on day 0, from 1 April to 30 September at the same rate (€75,000), so both peak quarters are secured then with no gap; the mid-year fallback depends on the firm confirming the same specialist or a briefed replacement at the same rate on 30 June, failing which the implementation team carries the peak with the step as it stands and the expansion question goes to the budget round; each fallback is conditional on both an available specialist and cash), that the pilot carries no transition budget (migration of existing configurations and parallel running belong to a second stage, priced there as in [Match the Funding to the Work](raise-what-you-need.html)), and that the €210,000 is additional to the €2 million of planned capital expenditure in the bridge. Each specialist payment is assigned once: operating-plan engagement, extension, or neither; the €180,000 contains no specialist days. The funded pilot cost reproduces without another chapter.\n- Present the pilot so a newcomer can find its purpose, additional cash, staffing, approver, evidence date and fallback without reconstructing them: short labelled paragraphs (what the pilot buys; who does the work; the specialist after March; what it leaves out; the calendar; the maintenance charge; who approves, with dates and authority in separate paragraphs) and one compact two-column at-a-glance table; the opening carries no second recap of the chapter’s plan; the day-100 check is a short table followed by its qualifications and its conclusion in separate paragraphs; the comic gives the immediate choice and the later review a page each (three priced options; evidence, then money); the numbered sequence remains the main chronology; comparisons with other chapters sit in one labelled scenario note; in the fallback, the cash conclusion and the covenant explanation are separate paragraphs. The specialist passage separates the option’s terms, the dates on each path (including option 1) and the mid-year case; the mid-year check separates the payments already made, the remaining commitments, the scenario exclusion, the continuing collection shortfall, and the 30 June balance arithmetic into their own short paragraphs; the covenant section separates the definition and types, the leverage example, and the breach consequences. The day-100 table uses the template’s compact-table treatment (few short columns, cells wrap) so a 390-pixel phone shows both descriptions and amounts without sideways scrolling; wide tables keep the scrolling treatment.\n- Anchor the pilot chronology to the financial year: day 0 is the first day of the financial year (approval), the step enters service about day 35 (early February), day 90 is 1 April, day 100 about 10 April, the mid-year review 30 June, and the residual is counted at each quarter end. Maintenance is charged at €2,500 a month from the month the step enters service, so €27,500 falls in this financial year and the last €2,500 of the first maintenance year in January (so the payments still due after day 100 are at most €150,000 through December and €152,500 including January); state that this deliberately differs from [Match the Funding to the Work](raise-what-you-need.html) and the day-100 ledger, which place the first year of maintenance in the following financial year, and that Ines reserves the full €30,000 at approval.\n- Show the fallback’s affordability with dated checks rather than the original annual total: for a poor day-90 cohort (decided at day 100) and for weak first-half collections (decided at mid-year), state cash above the protected reserve with maintenance already paid deducted, remaining non-cancellable build payments, remaining maintenance only and the €37,500 specialist cost. For the mid-year case give a short dated schedule (30 June to 30 September) with the payment dates, state whether the collection shortfall persists (assume it continues at the same rate in the second half) and show the first date cash would cross the protected reserve; make the fallback conditional on the revised forecast covering those dates, naming the alternatives (spending reduction, board approval, funding) when it does not. State the day-100 assurance narrowly: the roughly €330,000 above the reserve covers the listed additional pilot payments through year end on the assumption that ordinary payroll, tax, interest and other operating obligations stay funded from the operating plan and that later quarters add no further surplus; it is not a claim that the business could survive with no customer receipts, and the quarter-end residual is a simplified timing convention, not proof against a cash shortage inside a quarter. If collections are already behind plan at day 100, the forecast is rerun then, with actual receipts, the payments already made and every remaining commitment including the specialist once the option is exercised; an April shortfall is never deferred to the June check. Check two is a separate mid-year illustration whose balances assume the day-100 option was not exercised; once it has been, the specialist cost is already committed and partly paid, and those balances are not reused.\n- In the downside case, say why the covenant is rechecked: lower countable cash raises net debt, defined there beside its first consequential use (borrowing less the cash the loan agreement lets the company count against it); whether EBITDA also falls depends on whether the shortfall is late payment of recorded invoices (cash down, earnings unchanged) or weaker trading (both down). No unsupported “usually” claim.\n- Label the accounting comparison table with its currency and scale (illustrative amounts, € millions) and name its first column; state that the crisis study concerns almost 500 UK PE-backed companies during the 2008 crisis compared with matched non-PE peers.\n- The comic’s first page must distinguish money customers owe Larkspur (not yet arrived) from Larkspur’s own payments, in artwork, caption and alt text: interest, tax and planned investment go into trays on Sam’s desk, while the bar for unpaid invoices is still in a customer’s hands, so the picture shows money owed to the company. Its caption describes the adjustment as the increase in unpaid customer invoices during the period, not their whole balance, with the €2 million to €3 million contrast, so the standalone comic leads to a €1 million adjustment. The three-priced-options page must show the decision: the sum that gives the €0.8 million capacity, the three priced options against it, and Ines approving the €210,000 pilot. Its caption reads on its own: it opens with short complete sentences that state, as an explicit fictional assumption, that after interest, tax, loan repayment, planned investment and the operating reserve the board protects, the forecast leaves about €800,000 across the year to commit, subject to checking payment dates and separate from the runway page’s €3 million scenario; it says the pilot automates part of the manual setup of new customers and carries no backward reference to the article. The final page shows the day-100 board review and the later conditional gate as the undecided part. Every amount, label and line of dialogue drawn in a page comes from the page script, which traces to the article. Generated artwork is inspected against the script (spelling of every string, cast identity, which speaker each bubble points to, counts and sizes), not assumed.\n- The summary reads on its own: it explains capital expenditure, a floating interest rate and Sam’s finance role at first use, says that rising floating rates can raise borrowing costs at the same time as sales weaken (not that they must), states the month-six gate’s conditions as the article does (a further eight customers whose average is no more than 50 staff hours per setup, so one 60-hour setup among seven 48-hour setups still passes; waiting time down; satisfactory cash timing; a separate priced approval, at the board’s discretion), and splits the decision into a short choice paragraph and a short review-and-fallback paragraph. The comic explains interest, asset and expense at first use and says “unpaid customer invoices” where the article says working capital; the article explains inventory, research versus development and GAAP in plain words. The summary also explains inventory (goods held for sale or use), asset (equipment or software that benefits the company for years), cohort (another group of customers), the month-six gate (a review that must be passed before more spending can be approved) and parent company (the company that owns this one) locally, stays within 300–500 words of prose counted as published (cross-link titles expanded; image line and caption excluded), and ends with an explicit transition naming who may approve spending and funding commitments. The article describes Larkspur’s transaction as a buyout that was, in this case, financed largely with borrowing (a leveraged buyout), not as if every buyout were borrowing-financed.\n\n## Non-goals\n\nUniversal prescriptions, invented evidence, promises of investment performance, or disclosure of confidential inputs. The chapter is not a legal or tax opinion.\n\n## Modalities\n\n- Full Article: index.md, the substantive argument.\n- TL;DR: summary.md, the practical implications in concise prose.\n- Comic: comics.md, seven illustrated fictional comic pages of three strips each, with the dialogue, labels and amounts in the artwork, alt text, short visible captions, dialogue transcripts and machine-readable page scripts.\n\n## Open questions\n\nEvidence gaps and chapter-specific next research are tracked in the separate editorial backlog. The book uses the author’s accepted working title; evidence and role questions remain open.\n\n## Decision log\n\n- 2026-09-13: The author requested Owned and substantive comparative treatment of leadership under investors; this supersedes the previous private-equity-first framing.\n- 2026-09-12: Use an explanatory essay rather than the repository's ADR template. Preserve per-post folders and stable permalinks. User explicitly requested varied chapter structures.\n\n## Sources\n\nThe supplied book brief establishes scope. Public citations appear in the article and bibliography. Private provenance is recorded separately in _research/input-reading.md and is excluded from the site configuration.\n\n## Changelog\n\n- 2026-09-18: Comic format changed from six single-scene panels (one speech bubble, no amounts in the artwork, long captions) to seven comic pages of three strips each, after the author found the panels unclear and uninformative: the dialogue, labels and amounts now sit in the artwork and the captions are short. The first page keeps the unpaid-invoices requirement (the bar is still in a customer’s hands); the three-priced-options page and the final page carry the former panel 6 requirements. Pages that change the example’s assumptions label the change once, in the artwork, by stating the new assumption (“Now suppose €60 million of floating-rate debt”), not by repeating that the page is a separate illustration. The page script lives in the `comic-page` blocks of comics.md and is generated with the explainer-comics skill’s `generate_comic_pages.py`; the pilot record and rejected variants are in `_research/comic-pages-pilot/`. Article and summary unchanged.\n- 2026-09-17: Implement the in-depth review of run `20260917-211023` round 3 (`round-03.review.md`, OBB-013/016/017/018): the mid-year check split into payments already made, remaining commitments, the scenario exclusion, the continuing shortfall and the 30 June balance arithmetic (the specialist and covenant splits were already present from the parallel run); the day-100 table wrapped in the compact-table treatment so phones show descriptions and amounts together; the summary’s gate condition restated as the cohort’s average (no more than 50 staff hours per setup); comic Extend the illustrated edition to post logos, navigation icons and, where applicable, the existing six-panel comics.\n- 2026-09-13: Define the requested article-illustration and bold-emphasis pass before implementing the illustrated edition.\n- 2026-09-13: Clarify the editorial acceptance criterion above before polishing the article and checking its related reading formats.\n- 2026-09-13: Reconcile the revised article and applicable reading formats with the Owned contract; specification accepted as matching the draft manuscript.\n- 2026-09-13: Revise the contract for Owned before adapting the article and its reading formats.\n- 2026-09-13: Revise for readers starting from scratch; define terms before use, explain reasoning steps, and connect the configured chapter sequence.\n- 2026-09-13: Readability pass. Intro cut 260 → 166 words (five paragraphs to three): removed the full EBITDA re-definition, which [A Valuation Is an Estimate, Not a Fact](valuation-is-an-estimate.html) now teaches, keeping only a clause at first use in the body. The SEC non-GAAP citation moved to the adjusted-earnings paragraph, where it argues something. summary.md rewritten around Larkspur's actual bridge figures rather than describing that a bridge exists.\n- 2026-09-12: Explain financial concepts before their implications, connect valuation assumptions to business and technology choices, and add the author-requested KEY POINTS opening.\n- 2026-09-12: Initial spec, status draft; supports a substantial first manuscript and later evidence-led revision.\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
