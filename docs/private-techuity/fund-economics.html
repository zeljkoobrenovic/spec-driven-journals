<script id="data" type="application/json">{"meta": {"title": "Fund Economics: Fees, Distributions and Performance Reports", "date": "2026-09-14", "author": "Owned working manuscript", "excerpt": "Optional reference on management fees, carried interest, the distribution waterfall and the ratios in a fund performance report, and what each means for a company leader.", "permalink": "fund-economics", "timetoread": "7 min read"}, "tags": [], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **IN THIS SECTION, YOU WILL:** Learn how a fund’s manager and investors are paid, how a fund performance report separates cash returned from estimated value, and what that means for the requests a company receives.\n\n\n> **KEY POINTS:**\n>\n> * A fund's manager is paid through **a management fee and a share of profits**. The distribution waterfall sets the order in which proceeds are paid out; a preferred return, catch-up and clawback are terms of the agreement, not guarantees.\n> * A fund performance report **separates cash returned from estimated value still held**: DPI counts distributions, RVPI counts unsold holdings at their current estimate, and TVPI adds the two. Gross, net and borrowing-adjusted figures differ.\n> * For a company leader, these mechanics explain **the timing and kind of requests** a company receives. A valuation increase pays nobody until it is realized; ask whether a reported result was received or estimated.\n\n<br>\nThis page is optional depth. It collects the fund-side mechanics that sit behind [An Investment Announcement Is Not a Budget](announcement-is-not-a-budget.html) and [Same Company, Same Performance, Three Different Returns](three-different-returns.html) in Part I, for readers who want to know what a fund's investors and its manager are paid and how a fund reports its results. Nothing here is needed to follow the main chapters; the [Glossary](glossary.html) defines each term in one line. The examples are deliberately simple, and every rate is an illustrative assumption rather than a typical or recommended term.\n\n## How Fees and Profit Sharing Work\n\nA **management fee** supports the manager's business under the agreed fee basis. The basis, whether committed capital, invested capital or another measure, and the period over which it applies are set in the fund agreement. **Carried interest**, or carry, is a contractual share of investment profits allocated to the general partner or other entitled recipients. Carry is different from a company's executive bonus and different again from management's shares in that company.\n\nA **distribution waterfall** sets the order in which money coming out of a fund is paid. Take €160 of proceeds from €100 originally contributed, in a deliberately simple arrangement with no fees or taxes:\n\n| Step | Who gets it | Amount |\n| --- | --- | ---: |\n| 1. Return the capital | LPs get their €100 back first | €100 |\n| 2. Split the €60 profit | 20% carry to the GP | €12 |\n| | remainder to the LPs | €48 |\n| | **LPs receive in total** | **€148** |\n\nHere the LPs receive their original €100 before the profit is shared. Actual agreements can distribute profits at different stages. They may include a **preferred return**, a threshold before specified profit sharing begins; a **catch-up**, a rule allowing the manager to receive a larger share of the next payments; or a **clawback**, a requirement to return excess profit distributions. The preferred return is not a guaranteed investment return. The 20% rate here is an illustrative assumption.\n\n### How the Three Terms Change the Example\n\nExtend the same €160 to see what each term does. Suppose the agreement gives the LPs an 8% preferred return and, to keep the arithmetic short, the €100 was invested for one year, so the hurdle is €8.\n\n- **Preferred return without a catch-up.** The LPs receive €100, then the €8 hurdle. Only the remaining €52 is shared 80/20: €41.60 to the LPs and €10.40 to the GP. The LPs end with €149.60 and the GP with €10.40. The hurdle has moved money from the manager to the investors.\n- **Preferred return with a full catch-up.** After the €8 hurdle, the GP receives the next distributions until it holds 20% of all profit paid so far: €2, since €2 is 20% of the €10 then distributed. The remaining €50 is shared 80/20, €40 to the LPs and €10 to the GP. The result is again €148 to the LPs and €12 to the GP. A full catch-up restores the headline 20% share once the hurdle is cleared; a partial catch-up lands between the two cases.\n- **Clawback.** Funds distribute investment by investment over years. If early sales paid the GP carry and later investments lost money, the GP may have received more than 20% of the fund's total profit. A clawback obliges it to return the excess at the point the agreement specifies, often the end of the fund. How it is secured and whether it is calculated before or after tax are terms to read, not assume.\n\nWhat matters for a reader of company plans is the implication: the manager's profit share depends on realized proceeds, on their timing relative to the hurdle, and on the fund's whole result rather than one company's. Fees, allocation of shared expenses and related-party services also create conflicts. The SEC's guide explicitly discusses the possibility that the manager's interests differ from those of its funds. [S01: SEC investor guide](https://www.investor.gov/introduction-investing/investing-basics/investment-products/private-investment-funds/private-equity) A company leader should therefore ask who funds an operating intervention and whether the provider has a financial interest in the recommendation. Useful support can still involve a conflict that needs to be understood.\n\n## Reading a Fund Performance Report\n\nThe chapters in Part I concern one company at a time. A fund can hold several companies and sell them at different times. Its investors need to separate money actually received from the estimated value of investments still held. Three ratios do that, all measured against what the investor has paid in.\n\nTake an investor who has put in €100, has received €60 back, and whose remaining unsold holdings are currently valued at €90:\n\n| Measure | Here | What it counts |\n| --- | ---: | --- |\n| **DPI** — distributions to paid-in | 0.6× | Cash actually returned |\n| **RVPI** — residual value to paid-in | 0.9× | Estimated value still held |\n| **TVPI** — total value to paid-in | 1.5× | The two combined |\n\n**In this cash-only example, DPI describes cash returned; RVPI describes value still held.** All three figures are ratios. The €90 estimate may rise or fall before sale. A high total alongside little money returned therefore contains more unrealized value; it doesn't demonstrate the same cash outcome as a completed sale.\n\nA **gross return** is measured before specified fees and other deductions; a **net return** is measured after them. State which investor receives the return and which deductions apply. Also identify the currency, valuation date and treatment of borrowing. A **subscription line**, also called a subscription facility, is a loan to the fund that can cover the period before its investors supply cash. The Institutional Limited Partners Association (ILPA) provides performance guidance that separates the effects of this borrowing. [S05: ILPA performance guidance](https://ilpa.org/industry-guidance/templates-standards-model-documents/ilpa-templates-hub/ilpa-performance-template/) The loan can delay those cash calls; a higher measured **IRR**, the internal rate of return calculated from the amounts and dates of payments, can result from that changed timing without establishing additional company value. [Same Company, Same Performance, Three Different Returns](three-different-returns.html) explains IRR and the multiple on invested capital for a single investment.\n\n## What This Means for the Company Leader\n\n**Fund incentives can shape the timing and kind of requests.** A fund near the end of its term, or a manager whose carry depends on a realization that has not yet cleared the hurdle, has reasons to prefer work that shows up in a sale price soon, such as earnings improvements or a completed sale, over longer-dated capability work. A fund early in its investment period may accept spending that raises the estimated value of a holding before any cash returns. Which applies to your company is a matter of fact, not of label: ask which fund owns the company, where it is in its life and what its agreements say. [Management Equity, Fund Carry and Employee Jobs Are Different Bets](different-bets.html) compares the incentives of different investors, and [An Investment Announcement Is Not a Budget](announcement-is-not-a-budget.html) gives the one-page record for locating the payer and the approver.\n\n**A valuation increase pays nobody until it is realized.** The year-three row in the announcement chapter's capital-call timeline and the RVPI ratio here are the same fact seen from two sides. When told that the investment \"is performing well\", ask whether the statement rests on distributions or on residual value. An agreed sale value is a contractual commitment with conditions until the cash moves; a term sheet is an expression of interest before that. Never describe an announced or agreed figure as received.\n\n**Received value and estimated value in your own plans.** A company plan that depends on an expected exit, a future funding round or an announced valuation is financed by an estimate. State which of your commitments rest on cash received, which on a contractual commitment with conditions, and which on an expectation, and revisit the plan when one of those states changes. [Same Company, Same Performance, Three Different Returns](three-different-returns.html) shows why the same company performance produces different investor returns, one more reason to keep the company's evidence of what it can do separate from the fund's report of what it is worth.\n"}]}]}</script>

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
