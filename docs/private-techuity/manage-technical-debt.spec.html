<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "# Spec: Manage Technical Debt: Fund the Fix by the Cost, the Risk and the Speed It Buys\n\n## Intent\n\nGive a leader under investors a way to manage technical debt and the large projects that reduce it (refactors, rewrites, migrations, forced platform and vendor moves) as a running cost with three columns rather than as a backlog or a percentage: what the debt costs to carry each month, what risk it carries, and what it slows. Show how to put those three on figures the company already has, separate where the debt came from so each part has an owner and a remedy, present a reduction project to the board by the revenue it protects or enables, the cost or risk it removes and the decision it keeps open, and fund it in tranches, each released against a measured reduction in the carrying cost. The reader leaves able to answer \"how much technical debt do we have\" with a carrying cost, \"why not a rewrite\" with a transition plan, and \"why fund work that changes nothing customers see\" with the risk and speed columns.\n\nThe chapter is the fourth chapter of Part VI, after cloud costs and AI costs. It takes the *execution and funding over time* of debt-reduction work; the choice of design belongs to [Plan for Growth: Decide What (Not) to Change in Your Systems](growth-into-design.html), transition costing to [Assess Capability: Can the Team Deliver?](can-the-team-deliver.html), integration to [Plan Acquisitions and Separations: Account for Extra Work, Not Just Expected Value](acquisition-adds-work-first.html).\n\n## Context\n\nLarkspur, the book's fictional scheduling-software company, has completed option B from [Plan for Growth: Decide What (Not) to Change in Your Systems](growth-into-design.html): the country-specific billing rules were separated out of the invoicing module into a component Larkspur owns, the month-four replay passed, the second country went live in month eight, and the billing engineer now maintains the component. That project is the chapter's model of a tranche done right, and the module that remains is still fragile in other ways. The chapter adds a fictional **debt register** of four or five items across the estate (the remaining tangles in the invoicing module; a reporting stack on an unsupported framework version; the scheduling engine's single-node design that limits the largest customers; the AI feature's hard-coded prompt logic kept from the trial; a retiring vendor model with a dated notice from [Critically Evaluate AI Costs: Measure the Return per Task and per Period](ai-worth-its-cost.html)), each with its three-column carrying cost. Same people (Alex technology, Priya product, Ines the company, Sam finance, Morgan the investor's adviser). Every new figure is fictional; the shared Larkspur ledger is not touched, and the €300,000 expansion budget of the design chapter is not reused.\n\n## Audience\n\nProduct and engineering leaders inside companies working under investors, including leaders who inherit an ownership arrangement. Assume no specialist finance background; explain necessary terms before use. Investor-side readers are secondary.\n\n## Success criteria\n\n- **Three-column carrying cost, on figures the company has.** Define technical debt in plain words and put each register item on one table with three columns per month: cost carried (engineering hours on workarounds and the old stack's licences and hosting, labelled cash or cost-based estimate), risk carried (incidents, unsupported or insecure components, restore evidence from [Build And Test Resilience: Backups Are Not Enough](prove-you-can-restore.html), a dated vendor retirement), and speed lost (lead time on the change types customers pay for, from the trace in [Scale the Team Up: Headcount Is Not Capacity](fix-decisions-before-hiring.html), and releases that cannot ship). No item is described by a count of issues, a percentage of the codebase or a \"debt ratio\". The reader can build the same table for their own estate.\n- **Separate where the debt came from.** Sort the register by origin, deliberate dated shortcut, growth outrunning design, acquired system not yet integrated, ageing platform or retiring vendor, and state for each origin who owns it and what the remedy usually is. Say that a deliberate shortcut with a recorded date and owner is not a failure; an undated one is.\n- **Present the project the way the board reads money.** For the chosen tranche, state what revenue it protects or enables, what cost or risk it removes and, only where a real dated decision is being kept open, what decision it preserves; use the three benefit kinds as the book's own vocabulary and cite the Grounded Architecture economics page, Fowler and Hohpe as sources, with the caveat that neither internal quality nor an option's value can be measured precisely, so the tranche is judged on the carrying-cost columns it moves. Explain why the board rarely sees the failures a fix prevented, citing Repenning and Sterman, and answer it with the register's before-and-after figures rather than with a plea.\n- **Large projects are transitions funded in tranches.** Compare, for one register item, three ways to reduce it: a big-bang rewrite whose benefit arrives at the end, a tranche plan in which each stage releases a measured reduction in carrying cost and the next stage is funded by a gate, and living with it at a stated cost; show dual-running cost, the work that waits, and the point at which spent money no longer counts, as [Plan for Growth: Decide What (Not) to Change in Your Systems](growth-into-design.html) does. Name the anti-pattern of the rewrite with the benefit at the end and the one situation in which it is still right (a retiring platform with a hard date).\n- **A recorded decision with a gate.** End with the funded first tranche: chosen option, alternatives rejected, funding, scarce capacity, who is authorized, the gate that releases the second tranche (for each of the three columns either a named reduction or a measure that must not worsen, with what happens when it is met, missed or falls between), what waits, and the evidence that would stop or reprioritize; the register is revisited on a stated cadence, and items with a dated external deadline (vendor retirement, an unsupported version) are sequenced by the date when the time left is not much more than the work needs, weighed against what missing the date would cost; a distant date with little work can wait behind an undated item doing harm now, and no short form of the rule (figure, TL;DR, comic) may make proximity alone decisive or show money as the only benefit. Where a vendor event meets a contract (the AI model's retirement notice arriving before the commitment approved in [Critically Evaluate AI Costs: Measure the Return per Task and per Period](ai-worth-its-cost.html) is signed), the article puts signing, access, testing, switch and retirement in one order in which every obligation and every exercised right has a signed agreement behind it, names the date each clock starts from, keeps the company's own decision separate from delivery, and states the actual switch date from which each fallback starts, its owner and customer agreement, the model it needs (a passing model for automation, a tested model for review-aid mode, suspension when none has been measured) and who prices and approves its usage, including a decision that comes after the board's January meeting and a refusal of extra spending. An exception that brings work forward states the approval's period, staffing and the effort spent if it is later refused.\n- **Investor questions answered as they are asked.** Give the answers to \"how much technical debt do we have\", \"why not just rewrite it\" and \"why are we funding work customers will not see\", each pointing at the register, the tranche plan and the three columns.\n- **House rules.** Status highlight and key points readable without prior study; terms explained at first use in each format (technical debt, refactor, migration, rewrite, dual running, tranche, unsupported version, carrying cost); the company leader's decision, authority and funding assumptions explicit; historical findings within source scope, fictional scenarios labelled; a meaningful counterargument (some debt is worth carrying to the exit and saying so is honest) with the evidence that would change the judgment; hand-off to Part VII; TL;DR and comic consistent with the article.\n\n## Non-goals\n\n- Not a second treatment of the design choice (configure, own the boundary, replace the core); that stays in [Plan for Growth: Decide What (Not) to Change in Your Systems](growth-into-design.html) and is linked.\n- Not a code-quality or architecture tutorial, a tooling recommendation, or a metric such as a debt ratio or a static-analysis score; the chapter's measures are the three carrying-cost columns.\n- Not a cloud-provider migration, which is handled by reference to [Critically Evaluate Cloud Costs: A Lower Bill Is Not Always Better](cheaper-cloud-bill.html), and not a treatment of an acquired system's integration, which is [Plan Acquisitions and Separations: Account for Extra Work, Not Just Expected Value](acquisition-adds-work-first.html).\n- No prevalence claims about how much debt companies \"typically\" carry; no invented study results; the downtime-cost figures on the inspiration page are not reused.\n\n## Modalities\n\n- [ ] `checklist.md` — not used in this journal's main chapters.\n- [x] `summary.md` — TL;DR of 300–500 words with one overview visual.\n- [ ] `dialog.md` — not used.\n- [x] `comics.md` — comic pages of three stacked strips, same cast as the neighbouring chapters, reaching the first tranche decision causally.\n\n## Open questions\n\n- Which register item carries the tranche comparison: the scheduling engine's single-node design (speed and opportunity dominate) or the unsupported reporting stack (risk and a hard date dominate). Default: the scheduling engine for the tranche comparison, with the reporting stack as the dated item that is sequenced first regardless of size, so both kinds appear.\n- Whether to register the three external sources in the bibliography as new S-ids (they were fetched and verified on 24 September 2026; see Sources) or cite them inline only.\n\n## Decision log\n\n- 2026-09-24: The author asked for a SUSTAIN chapter on technical-debt management and similar projects (big refactors, migrations), taking the Grounded Architecture economics page as inspiration. The author's correction to the first proposal: the chapter is not only about cutting cost but about reducing risk (an old stack can be unstable and insecure) and creating opportunity (moving and releasing faster); hence the three-column carrying cost and the title. Author's choices: continue the design chapter's completed project as the model tranche rather than a separate example; scope includes own-code debt and platform or vendor migrations; the inspiration page's frameworks (top line and bottom line, options, the debt ROI compounding of operating cost, delay and instability) are absorbed into the book's vocabulary and cited rather than presented as named frameworks.\n- 2026-09-24: Title chosen by the author from three candidates: \"Manage Technical Debt: Fund the Fix by the Cost, the Risk and the Speed It Buys\". Rejected: \"…: Pay Down What Costs You, Risks You and Slows You\"; \"…: Fund the Fix by What It Removes and What It Frees\"; the earlier cost-only \"…: Fund the Fix by the Cost It Removes\".\n- 2026-09-24: Placed fourth in Part VI so the unit-cost and commitment methods (cloud, AI) and the quality prerequisite (resilience) precede it.\n- 2026-09-24 (in-depth review, round 5): The retirement notice of 30 September 2027 arrives before the vendor commitment exists: [Critically Evaluate AI Costs: Measure the Return per Task and per Period](ai-worth-its-cost.html) approved it at the September review for Ines to sign in November, with the offer held open until 30 November, and lists a retirement notice among the evidence that reopens that decision. So the chapter tests before signing: Alex runs the successor's samples by 29 October; Ines signs only if they pass (the successor's usage priced first); on a failure nothing is signed, no termination notice is needed or given, usage stays at flexible list prices, and Larkspur's own decision between another vendor's tested model and the failed successor with review-aid mode is due by 29 November. The contract's retirement rights (access, testing, ending) protect against retirements notified after signing, as that chapter's worked example shows; they are not exercised here. With later access Ines still signs nothing untested; the decision comes within sixty days of access and no later than 31 January 2028, leaving February for the switch. The switch is planned for February and happens no later than 31 March 2028; every fallback branch starts on the actual switch day, so planner time is agreed before it; with no measured model there is nothing to switch to, and sorting is suspended on the retirement date. Extra AI spending beyond the approved 2028 provision is approved by the board in the 14 January plan when the decision comes before that meeting, and by written approval between meetings, before the switch, when it comes after; if the board refuses, Larkspur moves only to a tested model the provision covers, and otherwise keeps the old model until 31 March and then suspends sorting with the changed service agreed. The TL;DR names the five items, describes tranche 1, drops maintenance jargon, names the fixed-payment agreement and gives the March 2028 security-review deadline. Dense article passages (Morgan's question, Fowler and the crossover, the sequencing rule, the portal dates) are split. Comic captions carry the words on each page's boards and cards, the intro promises exactly that, and page 5's artwork has Ines say she signs nothing on a failure.\n- 2026-09-24 (in-depth review, round 4): The termination notice (by 29 November 2027) is kept apart from its effect (the commitment ends on 31 March 2028, and every fixed payment up to then stays owed) in every format. Late access is recomputed: the contract's thirty days end on 30 October 2027, Sam escalates from 31 October, and access on that last day gives samples by 28 November and notice and decision by 29 December; this corrects the round-3 entry's 29 November sample date. The fallback has three explicit branches: a model that passed the samples carries automated sorting; a model that was tested and failed can carry review-aid mode, for customers with confirmed planner time; with no measured model, sorting is suspended for every customer on the retirement date and the changed service is agreed. Review-aid mode needs no new Larkspur staff, but its supplier cost is not assumed equal: after the commitment ends usage is at flexible list prices, so Sam prices the chosen model's usage at the decision and either confirms the approved 2028 AI cash provision covers it or adds the difference to the 2028 plan the board approves in January. The early start of tranche 1 after a third incident moves below the decision table and is bounded: the board's written approval covers the two named engineers from Monday 20 December 2027 to the board's January meeting on Friday 14 January 2028 and up to €8,000 of 2027 cash; if the 2028 line is then refused, 14 working days each (the office closed 24 December to 2 January) is 28 engineer-days, about 5.6 engineer-weeks and about €11,000, and the portal redesign starts on 17 January, two weeks late. The fallback paragraph, the early-start row and the TL;DR decision paragraph are split into shorter units. Comic page 4's tranche 2 bar and flag end at month seven, tranche 1 carries its own flag nd so needs the board's written approval, not Ines's delegation; the refusal branches are stated. \"Cash\" is declared shorthand for additional supplier cash (payroll is cash too). Figure 1 says measured monthly, reviewed quarterly; the sequencing figure, TL;DR visual and comic pages 2 and 5 carry the qualified rule (deadline risk weighed against harm now; the rest by cost, risk and delay removed per effort). The opening callouts and key points are cut to about half again with a one-line definition first; cost definitions and units are separate paragraphs; the retirement sequence is a dated list; the Capacity and Gate cells are shortened with their detail moved below the table; the TL;DR is cut to the 300–500-word target with AI expanded; comic captions are split into short paragraphs. The Stripe annotation names the read switch in phase two.\n- 2026-09-24 (in-depth review, round 2): The successor-model schedule is reconciled with [Critically Evaluate AI Costs: Measure the Return per Task and per Period](ai-worth-its-cost.html): the contract gives the right to test the successor on the release-gate samples and to end the commitment on the retirement date if they fail; that chapter's timeline has Alex run the samples within sixty days of the 30 September 2027 notice, so the test deadline is 29 November 2027, the decision deadline on a failure is Larkspur's own sixty-day rule (28 January 2028), the termination notice is a separate step, and 31 March 2028 is the retirement date. The 15 January test date and the \"negotiated sixty-day window\" wording are withdrawn. The fallback is the customer-planner review-aid mode from that chapter (switches on per customer, no Larkspur staffing, readiness confirmed at the November test and at the decision), with the manual-sorting branch if no model is usable on the date; the support-agent staffing claim is withdrawn. The customer portal redesign's dates are conditional and stated in months (April to June if the work stops after tranche 1; August to October if tranche 2 starts in April; later if approval or the gate slips). Cash is money paid outside the company over and above payroll; cost-based time is already-budgeted employment cost, and freeing it releases no cash by itself. A gate checks the improvements a stage promised and the measures it must not worsen; tranche 1 reduces cost and recovery risk while preserving delivery speed. The sequencing rule is a latest-start rule (time left against work plus a margin, weighed against the cost of missing the date) and a recorded shortcut is accountable, not necessarily wise; the same qualifications reach the TL;DR, its visual and the comic. The opening callouts are shortened, the origins are explained once, the ledger disclaimer stays in this spec, and the gate's miss responses move into a list after the decision table. Figure 1's common \"per month\" label is replaced (reviewed monthly; euros per month only for cost carried).\n- 2026-09-24 (in-depth review, round 1): The register's figures are put on one stated rate (about €2,000 an engineer-week, about €400 a day, Larkspur's fully loaded cost of an engineer) and the monthly total is reported as cash plus valued staff time (about €5,500 cash and about €4,600 of time, about €10,000); incident counts stay with their systems. The rewrite's €340,000 is always labelled €300,000 of staff time plus €40,000 of cash, and the month-five bridge reconciles (€180,000 gone, €160,000 still to decide); sunk cost is explained once and the wrong \"stops counting only at the end\" wording is dropped. Failover, response time and monthly availability are three separate measures. The reporting-stack migration is described as the model of a benefit-at-the-end project that is right only when no useful half-way state exists; the sequencing rule compares the slack before a date with the effort and severity rather than letting any date outrank any cost. The five-item table is the board's shortlist over a longer register. The gate has a go-live date (29 February 2028), a stated one-month observation window, a response for every unmet condition and a requirement that all four pass at one reading; tranche 2 is a conditional line in the 2028 plan released by Ines against the gate evidence; the capacity schedule names which engineers move and what the customer portal redesign's original and revised dates are; the successor-model test has a latest date (15 January 2028), a stated successor-availability assumption and a staffed fallback (the review-aid mode). The invoicing extraction's benefit is stated as the design chapter's two-year crossover, not a payback; the core replacement is kept open at a price still to be estimated, with Hohpe's fixed exercise price marked as the limit of the analogy.\n\n## Sources\n\n- Author's intent from the 24 September 2026 conversation (no `INPUT.md`).\n- [Grounded Architecture: Economics](https://grounded-architecture.io/economics), the author's own framework page, fetched 24 September 2026: ROI and options metaphors, the top-line/bottom-line value framework, the technical-debt ROI compounding (extra operating cost, cost of delay, instability cost) and the unsustainable-code spiral. Linked also through [Appendix: Grounded Architecture Across an Investment Portfolio](grounded-architecture-portfolio.html).\n- Martin Fowler, [Is High Quality Software Worth the Cost?](https://martinfowler.com/articles/is-quality-worth-cost.html), 29 May 2019, fetched 24 September 2026: internal quality lowers the cost of later change; the author's caveat that delivered functionality cannot be measured precisely.\n- Gregor Hohpe, [Architecture: Selling Options](https://architectelevator.com/architecture/architecture-options/), 17 October 2016, fetched 24 September 2026: architecture as deferring a decision at a known price; value rises with uncertainty.\n- Nelson P. Repenning and John D. Sterman, [Nobody Ever Gets Credit for Fixing Problems that Never Happened: Creating and Sustaining Process Improvement](https://web.mit.edu/nelsonr/www/Repenning=Sterman_CMR_su01_.pdf), California Management Review 43(4), Summer 2001, fetched 24 September 2026 (first page confirmed): why improvement work is under-invested when its benefit is invisible.\n- [Plan for Growth: Decide What (Not) to Change in Your Systems](growth-into-design.html) (the completed option B, its replay gate and fallback), [Scale the Team Up: Headcount Is Not Capacity](fix-decisions-before-hiring.html) (the trace and lead time), [Build And Test Resilience: Backups Are Not Enough](prove-you-can-restore.html) (restore evidence as the risk column), [Critically Evaluate AI Costs: Measure the Return per Task and per Period](ai-worth-its-cost.html) (the retiring-model notice), [Assess Capability: Can the Team Deliver?](can-the-team-deliver.html) (transition costing), [Plan Acquisitions and Separations: Account for Extra Work, Not Just Expected Value](acquisition-adds-work-first.html) (integration as a boundary transition), [TeamSystem: Each New Owner Inherits Progress and Unfinished Work](teamsystem.html) (acquired systems not yet working together).\n\n## Changelog\n\n- 2026-09-24 (review round 5): Decision log extended with the round-5 corrections (test before signing, no termination of an unsigned commitment, switch day as the fallback start, late-decision funding route and refusal, standalone TL;DR, shorter passages, comic board text). Contract success criterion reworded to require one signed-agreement order and the late-decision and refusal routes. Status stays `accepted`; article, TL;DR and comic revised to match.\n- 2026-09-24 (review round 4): Decision log extended with the round-4 corrections (notice versus effective date, late-access dates, three fallback branches with pricing, bounded early start, shorter units, comic page 4 timeline). Contract-clock success criterion extended to cover model prerequisites, funding and early-start exceptions. Status stays `accepted`; article, u-can-restore.html), [Critically Evaluate Cloud Costs: A Lower Bill Is Not Always Better](cheaper-cloud-bill.html) and [Critically Evaluate AI Costs: Measure the Return per Task and per Period](ai-worth-its-cost.html). Article otherwise unchanged; folder to be renumbered `26-manage-technical-debt`.\n- 2026-09-24: Created as `draft` after the author validated the approach; scenario, scope, framing and title decisions recorded. No `index.md` yet.\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
