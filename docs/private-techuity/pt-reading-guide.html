<script id="data" type="application/json">{"meta": {"title": "Private Techuity — Purpose and Reading Guide", "date": "2026-09-12", "permalink": "pt-reading-guide", "status": "draft:orange", "excerpt": "The accepted working title, financial foundations, book architecture and routes through the living manuscript."}, "tags": [], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **KEY POINTS:**\n>\n> * **Begin with the financial foundations.** Follow ownership, valuation, returns and cash, then connect them to decisions about products, architecture and leadership.\n> * **Read the book in depth or use its shorter adaptations.** Each chapter has a full article, a concise summary and a readable comic storyboard; artwork remains pending.\n> * **Treat this as a living, evidence-led manuscript.** The accepted working title and connected argument provide continuity while research gaps and revision priorities remain explicit.\n\n<br>\nPrivate equity changes the conditions under which product and engineering leaders work. It introduces an investment thesis, ownership rights, financing commitments, and a realization horizon. These conditions can fund useful change, create discipline, and supply capabilities. They can also constrain reinvestment, distort incentives, and transfer costs to people who did not choose the arrangement.\n\nThis book helps experienced technical leaders understand those mechanisms and act with better judgment. It also develops a Technology Principal perspective: connecting investment assumptions with the actual capabilities, obligations, and choices of a company. Financial terms are introduced when they first matter; prior knowledge of private equity is not required.\n\n**The emerging argument:** durable value depends on the fit among the investment thesis, financing, governance, and the company's capacity to execute and reinvest. Technology contributes when a specific capability changes a customer outcome, economic constraint, or material exposure. Product thinking can improve the support offered by an investment firm, but it cannot make conflicting interests disappear.\n\n## A Living First Draft\n\nThis is a substantial first manuscript, researched and drafted on September 12, 2026, rather than a finished commercial book. It contains 28 connected chapters, shorter adaptations, worked examples, practical tools, a glossary, and an evidence guide. Chapters are designed to be read independently and then connected through the book's argument.\n\nThe current case spine includes Hilton, Skype, Visma, Toys R Us and TeamSystem, complemented by empirical research on buyouts and healthcare ownership and by technology experiments. These cases were selected for explanatory contrasts and usable evidence. They are not a representative sample of private equity, and the manuscript still needs independent customer and employee evidence, more lower mid-market software engagements, growth-investment cases and carve-outs. TeamSystem adds a European software history beginning at a smaller regional-company scale; it does not make every later ownership period a lower mid-market case.\n\nThe supplied role brief grounds the Principal chapters. Its organization-specific details remain confidential, and its responsibilities are not presented as a universal job definition. Productscapes is developed as the author's starting hypothesis, with explicit tests and criticisms. **Larkspur and the financial teaching examples explicitly labeled fictional are illustrations**, not portfolio-company results. Separately sourced case figures and reconciliations describe their named historical companies.\n\nEvidence carries its own date. Historical company assessments are labeled by period; the Visma case is principally through 2024. The AI discussion includes a February 2026 research update, without claiming to capture every subsequent model or experiment. Sponsor-reported returns, interim valuations, company outcomes, and causal explanations remain distinct.\n\n## Three Ways to Read Each Chapter\n\n- **Full Article:** the argument, explanations, evidence, and qualifications in `index.md`. The site's existing tab is labeled “Article.”\n- **TL;DR:** a 300–500-word adaptation in `summary.md`, useful for orientation and recall.\n- **Comic:** a six-panel textual storyboard in `comics.md`, with visible scenes, dialogue, captions, and structured illustration prompts. **Artwork is pending.** The fictional cast carries the concepts; real cases are discussed through documents rather than reenacted.\n\nThe shorter modalities preserve the article's conclusions and significant caveats. They are entry points to the evidence, not substitutes for the case sources or full analysis. Reference pages use a single Article modality.\n\n## Recommended Reading Order\n\nRead Parts I–VI in order for the full narrative: learn the economic system, beginning with ownership and a plain-language valuation introduction, examine the relationship, evaluate operating interventions, understand the Principal's work, develop the product hypothesis, and assess durable outcomes.\n\nFor a shorter first pass, read chapters **1, 2, 3, 4, 6, 7, 10, 18, 23 and 28** in the numbered contents below — financing, ownership, valuation, returns, cash, governance, product value, the Principal's role, support as a product and durable outcomes. A product leader can continue with 10–13 and 16–18. A CTO entering a new ownership arrangement can prioritize 6–9 and 19–22. A developing Technology Principal should connect the foundations with Parts IV–V, then use the cases to challenge the proposed methods.\n\nIf financial terms are unfamiliar, start at the beginning: [How a Company Is Financed Decides Who You Answer To](pt-how-companies-get-money.html) explains how companies are financed at all, and [A Valuation Is an Estimate, Not a Fact](pt-valuation-and-architecture.html) introduces revenue, EBITDA, cash and value before any return calculations. The glossary supports recall; it is not a prerequisite. Each article opens with Key points and briefly introduces the financial concepts it needs.\n\n## Contents\n\n### Part I — Understanding private equity\n\nStart with how companies are financed at all, then ownership, valuation, returns, investment fit and cash.\n\n- **1.** [How a Company Is Financed Decides Who You Answer To](pt-how-companies-get-money.html)\n- **2.** [An Investment Announcement Is Not a Budget](pt-capital-and-ownership.html)\n- **3.** [A Valuation Is an Estimate, Not a Fact](pt-valuation-and-architecture.html)\n- **4.** [The Company Improved and the Investor Was Disappointed](pt-return-mechanics.html)\n- **5.** [Capital Should Fit the Company's Problem](pt-investment-fit.html)\n- **6.** [A Profitable Company Can Still Run Out of Cash](pt-cash-and-constraints.html)\n\n### Part II — The investor–company relationship\n\nTurn ownership into explicit decisions, incentives, and a partnership that can withstand disagreement.\n\n- **7.** [Decide Who Decides, Before You Disagree](pt-governance.html)\n- **8.** [Shared Ownership Does Not Create Identical Interests](pt-incentives.html)\n- **9.** [Judge an Investor by Their Behavior Under Pressure](pt-investor-fit.html)\n\n### Part III — Creating value through product and technology\n\nConnect interventions to customers, economics, risk, and the capabilities needed to execute.\n\n- **10.** [The Chain From Roadmap to Revenue Breaks Easily](pt-product-value.html)\n- **11.** [Fund the Engineering the Business Case Requires](pt-engineering-and-architecture.html)\n- **12.** [From Valuation Assumptions to Architecture Choices](pt-valuation-and-design.html)\n- **13.** [A Smaller Bill Is Not Always an Improvement](pt-cloud-economics.html)\n- **14.** [Security Is an Investment Under Uncertainty, Not a Cost](pt-security-and-resilience.html)\n- **15.** [An AI Strategy Contains Three Different Investment Questions](pt-data-and-ai.html)\n- **16.** [Capability Includes How People Decide and Coordinate](pt-people-and-operating-models.html)\n- **17.** [A Transaction Changes Ownership Before It Changes Operations](pt-acquisitions-and-carveouts.html)\n\n### Part IV — The Technology Principal’s work\n\nCarry evidence from sourcing and diligence through company-owned action, learning, and exit.\n\n- **18.** [The Technology Principal Works for the Owner](pt-technology-principal.html)\n- **19.** [Diligence Should Change the Investment, or It Was Reading](pt-diligence-and-thesis.html)\n- **20.** [The First 100 Days Establish a Funded Plan](pt-first-hundred-days.html)\n- **21.** [Useful Support Changes Decisions, Through to Exit](pt-execution-and-exit.html)\n\n### Part V — Private equity and technology capabilities as products\n\nDevelop Productscapes as a testable service model while examining power, boundaries, and evidence.\n\n- **22.** [An Investment Partnership as a Product: A Hypothesis](pt-investment-firm-as-product.html)\n- **23.** [Build Reusable Support Around Recurring Decisions](pt-technology-capability-as-product.html)\n\n### Part VI — Durable value, success, and failure\n\nCompare outcomes and ask what survives beyond a favorable investment result.\n\n- **24.** [Two Successful Exits, Two Different Explanations](pt-hilton-and-skype.html)\n- **25.** [Visma: Continuity of Manager Is Not Continuity of Money](pt-visma.html)\n- **26.** [Toys R Us: Out of Time, Not Out of Ideas](pt-toys-r-us.html)\n- **27.** [TeamSystem: What a Buy-and-Build Actually Accumulates](pt-teamsystem.html)\n- **28.** [Durable Success Is What Remains After the Investors Leave](pt-durable-value.html)\n\n### Reference Material\n\n- [Practical Tools for Ownership and Technology Decisions](pt-toolkit.html) — reusable decision and outcome records.\n- [Glossary](pt-glossary.html) — consistent financial, ownership, and operating definitions.\n- [Bibliography and Evidence Guide](pt-bibliography.html) — consulted sources, dates, evidence types, and access limits.\n\n"}]}]}</script>

    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
