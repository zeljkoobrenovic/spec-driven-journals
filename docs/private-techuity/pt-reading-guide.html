<script id="data" type="application/json">{"meta": {"title": "Private Techuity — Purpose and Reading Guide", "date": "2026-09-12", "permalink": "pt-reading-guide", "status": "draft:orange", "excerpt": "A practical guide to leading product and technology under private equity ownership, with lessons for working effectively with investors across other ownership models."}, "tags": [], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **KEY POINTS:**\n>\n> * **The company leader’s work organizes the book.** Learn how to understand investment expectations, influence decisions, choose work and obtain useful support.\n> * **Private equity is the primary setting, with wider applications made explicit.** Check the actual funding, ownership and decision arrangements before transferring a lesson.\n> * **Start from the basics.** Terms and calculations are introduced step by step; the cases and fictional examples have different roles in learning.\n\n<br>\nWhy might a profitable company struggle to fund a needed software change? What changes when an investor enters? How can a product or technology leader use the relationship to build capabilities the company could not easily develop alone?\n\n**Private Techuity: Product and Engineering Leadership in Private Equity** is a practical guide to those questions. Its primary reader leads product or technology inside a company, including someone joining or inheriting an ownership arrangement they did not choose.\n\n**Private equity** means investment in company ownership outside public stock markets. The book concentrates on **buyouts**, purchases that give an investor control of a business, often involving borrowing and an intended later sale. That setting gives the explanations and historical cases a concrete context.\n\n## How the Wider Lessons Apply\n\nThe book also explains when the same questions help under other arrangements. A company may obtain investment for uncertain early growth, raise money to expand an established product, sell shares to another operating business or keep funding work from its own customer payments.\n\nCompare arrangements using five questions: where does the money go, who has authority, what outcome does the investor expect, how much time is available, and what support can actually be provided? The answers depend on the terms and circumstances, rather than the investor’s label alone.\n\nThe historical cases principally examine private equity. They do not establish the same results for every ownership model. Wider applications are explanations to examine against your situation, not a claim that every company follows the same path.\n\n## Follow the Learning Sequence\n\nPart I introduces money, ownership and financial results. Part II explains how investment changes authority and the decisions you make or influence. Part III helps you choose and evaluate product and technology investments. Part IV shows how to use investor support beyond money. Part V follows your responsibilities through the ownership cycle. Part VI uses historical cases and research to assess what lasts.\n\nYou can begin without an accounting, investment or software-architecture background. Read in order on a first pass. The two valuation chapters serve different purposes: [A Valuation Is an Estimate, Not a Fact](pt-valuation-and-architecture.html) teaches the financial concepts; [From Valuation Assumptions to Architecture Choices](pt-valuation-and-design.html) applies them to technical choices after the product and engineering foundations.\n\nThe **ownership cycle** is a way to organize the period before, during and after an investment. This preview gives you the map; Part V develops the practical work:\n\n| Stage | The company leader’s question |\n| --- | --- |\n| Investigation before investment | What can we demonstrate, and which assumptions need to change? |\n| Early ownership | Which priorities have funding, team capacity and an accountable owner? |\n| Ongoing ownership | What are we learning, and when must the plan or support change? |\n| Sale or another ownership transition | Can the next owner understand the business, its capabilities and its unfinished work? |\n\nA new investment need not replace the owner, and a planned sale does not provide a guaranteed timetable. The financial and decision arrangements determine which stages matter in your situation.\n\n## Meet the Fictional Company\n\n**Larkspur** sells scheduling software to maintenance businesses. It helps organize appointments and assign people to work. A recurring challenge is **customer onboarding**: the setup and help needed before a new customer can use the product successfully.\n\nInes is the **chief executive officer (CEO)**, responsible for leading the company. Alex is the **chief technology officer (CTO)**, leading technology. Sam is the **chief financial officer (CFO)**, leading finance. Priya leads product decisions. Morgan is a **Technology Principal**, the investment firm’s technology adviser in these examples.\n\nLarkspur is a teaching example, not a documented company. The chapters explore alternative situations and proposals. Their figures do not form one continuous set of accounts. Assess each example within its stated assumptions; do not add different planning exercises, pilots and programs together. “€m” means millions of euros.\n\n## Choose a Reading Format or Route\n\nThe 29 main chapters and two appendix essays each provide three formats:\n\n- **Article:** the full explanation, worked examples, evidence and limits.\n- **TL;DR:** a 300–500-word summary for orientation and recall. The label means “too long; didn’t read.”\n- **Comic:** six fictional scenes showing the idea in conversation. These are readable storyboards; artwork is pending.\n\nThe six part introductions, appendix introduction and four reference or guide pages use the Article format. The [Productscapes: Designing Investor Support as a Product](pt-appendix.html) is optional: it develops **Productscapes**, the author’s proposed approach to designing investor support from the provider’s side.\n\nFor a shorter first pass, read the part introductions and summaries. If an immediate situation brought you here, the following routes provide a starting point; use Part I when an unfamiliar financial concept appears.\n\n| Your situation | Start with |\n| --- | --- |\n| New ownership has changed how decisions are made | [Decide Who Decides, Before You Disagree](pt-governance.html), [Shared Ownership Does Not Create Identical Interests](pt-incentives.html) and [Judge an Investor by Their Behavior Under Pressure](pt-investor-fit.html) |\n| Several valuable projects compete for the same resources | [Choosing What to Fund—and What to Stop](pt-choosing-investments.html), then [The Chain From Roadmap to Revenue Breaks Easily](pt-product-value.html) and [A Profitable Company Can Still Run Out of Cash](pt-cash-and-constraints.html) |\n| You need help that the investor may be able to provide | [Working With the Investor’s Technology Adviser](pt-technology-principal.html), [Find the Help That Changes What Your Team Can Do](pt-investor-support.html) and [Turn an Offer of Help into a Useful Engagement](pt-making-support-work.html) |\n| A transaction or new ownership period is approaching | [Leading Through the Ownership Cycle](pt-part-5.html), then its three chapters in order |\n| You are designing an investment firm’s support services | Part IV for the receiving company’s needs, then [Productscapes: Designing Investor Support as a Product](pt-appendix.html) |\n\n## Read the Evidence With Its Limits\n\nThis is a living manuscript, first drafted in September 2026. The cases cover Hilton, Skype, Visma, Toys R Us and TeamSystem in specified historical periods. Company filings, investor accounts and research answer different questions. Missing customer or employee evidence remains explicit.\n\nThe technology-adviser chapter draws on a supplied role brief; confidential organizational details remain outside the published text, and the role is not universal. Proposed working methods and fictional results do not establish proven effectiveness. The [Bibliography and Evidence Guide](pt-bibliography.html) explains the sources and consultation scope.\n\nBegin with [Understanding Private Equity: Money, Ownership and Returns](pt-part-1.html) and [How Companies Get Money](pt-how-companies-get-money.html). The [Practical Tools for Ownership and Technology Decisions](pt-toolkit.html) provides practical records, and the [Glossary](pt-glossary.html) helps you recall terms as needed.\n\n\n## Contents\n\n### Part I — Understanding Private Equity: Money, Ownership and Returns\n\nWhere does the money come from, what does the investor expect, and what can the company afford?\n\n- [Understanding Private Equity: Money, Ownership and Returns](pt-part-1.html) — part introduction\n- **1.** [How Companies Get Money](pt-how-companies-get-money.html)\n- **2.** [An Investment Announcement Is Not a Budget](pt-capital-and-ownership.html)\n- **3.** [A Valuation Is an Estimate, Not a Fact](pt-valuation-and-architecture.html)\n- **4.** [How Company Value Becomes an Investor Return](pt-return-mechanics.html)\n- **5.** [Capital Should Fit the Company's Problem](pt-investment-fit.html)\n- **6.** [A Profitable Company Can Still Run Out of Cash](pt-cash-and-constraints.html)\n\n### Part II — How Investment Changes Ownership, Governance and Decision-Making\n\nUnderstand what changes when an investor enters: authority, priorities, accountability and the decisions leaders can make or influence.\n\n- [How Investment Changes Ownership, Governance and Decision-Making](pt-part-2.html) — part introduction\n- **7.** [Decide Who Decides, Before You Disagree](pt-governance.html)\n- **8.** [Shared Ownership Does Not Create Identical Interests](pt-incentives.html)\n- **9.** [Judge an Investor by Their Behavior Under Pressure](pt-investor-fit.html)\n\n### Part III — Turning Investment into Product and Technology Value\n\nChoose where to invest money and team capacity, then connect the work to customer outcomes, business results and lasting capability.\n\n- [Turning Investment into Product and Technology Value](pt-part-3.html) — part introduction\n- **10.** [Choosing What to Fund—and What to Stop](pt-choosing-investments.html)\n- **11.** [The Chain From Roadmap to Revenue Breaks Easily](pt-product-value.html)\n- **12.** [Fund the Engineering the Business Case Requires](pt-engineering-and-architecture.html)\n- **13.** [From Valuation Assumptions to Architecture Choices](pt-valuation-and-design.html)\n- **14.** [A Smaller Bill Is Not Always an Improvement](pt-cloud-economics.html)\n- **15.** [How to Evaluate Security and Recovery Investments](pt-security-and-resilience.html)\n- **16.** [An AI Strategy Contains Three Different Investment Questions](pt-data-and-ai.html)\n- **17.** [Capability Includes How People Decide and Coordinate](pt-people-and-operating-models.html)\n- **18.** [A Transaction Changes Ownership Before It Changes Operations](pt-acquisitions-and-carveouts.html)\n\n### Part IV — Beyond Money: Using Investor Support to Build Capability and Accelerate Progress\n\nFind useful people, expertise and connections, agree what help will achieve, and leave the company able to sustain the result.\n\n- [Beyond Money: Using Investor Support to Build Capability and Accelerate Progress](pt-part-4.html) — part introduction\n- **19.** [Working With the Investor’s Technology Adviser](pt-technology-principal.html)\n- **20.** [Find the Help That Changes What Your Team Can Do](pt-investor-support.html)\n- **21.** [Turn an Offer of Help into a Useful Engagement](pt-making-support-work.html)\n\n### Part V — Leading Through the Ownership Cycle\n\nNavigate the investigation before an investment, the first hundred days, ongoing ownership and preparation for a sale.\n\n- [Leading Through the Ownership Cycle](pt-part-5.html) — part introduction\n- **22.** [Shape the Investment Plan Before the Deal Is Done](pt-diligence-and-thesis.html)\n- **23.** [The First 100 Days Establish a Funded Plan](pt-first-hundred-days.html)\n- **24.** [Lead Through Ownership and Prepare the Next Handover](pt-execution-and-exit.html)\n\n### Part VI — Lessons from the Field\n\nUse real company histories to examine what happened, what leaders can learn and where the evidence remains incomplete.\n\n- [Lessons from the Field](pt-part-6.html) — part introduction\n- **25.** [Hilton and Skype: Two Successful Exits](pt-hilton-and-skype.html)\n- **26.** [Visma: Continuity of Manager Is Not Continuity of Money](pt-visma.html)\n- **27.** [Toys R Us: Technology Plans Under Cash Pressure](pt-toys-r-us.html)\n- **28.** [TeamSystem: What a Buy-and-Build Actually Accumulates](pt-teamsystem.html)\n- **29.** [Durable Success Is What Remains After the Investors Leave](pt-durable-value.html)\n\n### Appendix — Productscapes: Designing Investor Support as a Product\n\nOptional material for readers designing support from the investment firm’s side.\n\n- [Productscapes: Designing Investor Support as a Product](pt-appendix.html) — appendix introduction\n- **A1.** [An Investment Partnership as a Product: A Hypothesis](pt-investment-firm-as-product.html)\n- **A2.** [Build Reusable Support Around Recurring Decisions](pt-technology-capability-as-product.html)\n\n### Reference Material\n\n- [Practical Tools for Ownership and Technology Decisions](pt-toolkit.html) — practical decision and support records.\n- [Glossary](pt-glossary.html) — plain-language definitions.\n- [Bibliography and Evidence Guide](pt-bibliography.html) — sources, consultation dates and evidence limits.\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing

            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
