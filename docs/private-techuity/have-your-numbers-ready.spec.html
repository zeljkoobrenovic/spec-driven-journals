<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "# Spec: Have Your Numbers Ready: Metrics for Investors, Goals and Dashboards\n\n## Intent\n\nFollow [Adopt Outcome Thinking: Balance Customer and Business KPIs](adopt-outcome-thinking.html) in Part IV with the practical companion to the outcome record: the numbers a product or engineering leader should be able to produce, explain and defend at any time — in a conversation with the investor, when setting goals and when building dashboards. The chapter gives the reader a working catalogue of the measures that matter under investors (money and runway; customers and growth; product and customer outcomes; delivery and execution; technology health and cost; people), each with what it tells, who usually owns it and where it misleads; then shows how to hold a small set of them ready: defined once, owned by name, refreshed on a schedule, given its context and labelled by kind (actual, target, forecast, assumption, committed) so a projection is never read as a result. It closes by showing how the same numbers serve three uses at three resolutions — the investor conversation, goals, and dashboards from the board down to the team — and who in the company does the work (product operations). The reader leaves able to answer an investor's number questions with a record rather than a scramble, and to build a board dashboard whose every figure traces down to a team's work.\n\nThe chapter replaces the appendix \"Data Foundations for Alignment With Investors\", which is removed from the book; it keeps that appendix's strongest ideas (sources you already have, the measure record, number context, the labelling rule, internal versus shared, product operations, build order) and drops its elaborate derivation from Grounded Architecture, which is mentioned once and linked.\n\n## Context\n\nLarkspur, the book's fictional scheduling-software company, in the same week as [Adopt Outcome Thinking: Balance Customer and Business KPIs](adopt-outcome-thinking.html): the outcome record is agreed; the investor's portfolio team asks for its standard reporting and the first quarterly board pack is being prepared. The chapter uses only facts the shared ledger (`_research/shared-scenario-record.md`) already holds and introduces no new shared figures: setup effort about 80 staff hours per customer and a median wait of about ten weeks, both provisional (Morgan's diligence sample of five, three needing the specialist's manual configuration) until the day-20 baseline of twelve setups; the setup proposal's target of 50 hours; its case of €225,000 a year (100 setups × 30 hours × €75) as capacity, not cash; the proposal's request of €180,000 and twelve engineer-weeks, committed only once the board funds it ([Set Priorities: You Cannot Fund Everything at Once](cannot-fund-everything.html)); the contract implementation specialist's €150,000 for months 1–12, agreed before day 0 and paid from the operating budget; the one-person dependence on the scheduling engine (diligence finding D-5); the day-90 decision thresholds (under 60, 60 to 70, over 70 hours) set by the plan ([Plan the First Hundred Days: Turn Expectations Into Funded Work](first-hundred-days.html)). Company-level financial figures (revenue, ARR, cash, burn) are not in the ledger: the chapter names who produces them and how, but gives no Larkspur values for them. Illustrative arithmetic that is not Larkspur's is labelled as such.\n\n## Audience\n\nProduct and engineering leaders inside companies working under investors, including leaders who inherit an ownership arrangement. Assume no specialist finance or product-management background; explain necessary terms before use. Investor-side readers are secondary.\n\n## Success criteria\n\n- [ ] **The practical problem first.** The opening blocks state the problem before any vocabulary: the investor's questions arrive before the numbers exist, each function has its own version of a figure, and a number produced in a hurry gets less weight than it deserves. The investor relies on reported figures for work it does not observe day to day; nothing says it cannot verify them.\n- [ ] **Who is who, before any approval rule.** Every format distinguishes the investor (an owner), the board (the directors who oversee the company for its owners, approving the plan and spending outside it) and the chief executive (who runs the company and authorizes spending inside the plan) at the board's first substantive mention, before the day-90 thresholds.\n- [ ] **A working catalogue.** Six groups of measures, each as a table (measure, what it tells you, where it misleads), with every term explained in plain words at first use: money and runway (revenue, recurring revenue, ARR, gross margin, operating costs by function, burn, runway, cash conversion); customers and growth (new customers and bookings, gross and net revenue retention, customer churn and renewal rate with their different denominators and units (churn counts customers, the renewal rate counts contracts, neither weighted by revenue), customer acquisition cost and payback on the monthly amount left after serving the customer, lifetime value on a gross-profit basis with its caution, pipeline and conversion); product and customer outcomes (time to first value, activation defined as in [Adopt Outcome Thinking: Balance Customer and Business KPIs](adopt-outcome-thinking.html) (the day the customer's account is ready to use, the date month-one support requests count from), distinguished from first value (the first real schedule) and from depth of use, cost to serve, support requests, customer feedback scores with their caution); delivery and execution (commitments against outcomes, allocation against plan, the five software delivery measures in DORA's current guide — DORA spelled out as DevOps Research and Assessment, deployment (putting a version into the live service) distinguished from release (making it available to customers), used the same way in the key-person row and the comic, recovery scoped to failed deployments — predictability); technology health and cost (reliability against an objective, tested recovery, security findings, technology cost per customer and as a share of revenue, technical debt register, key-person concentration); people (headcount against plan, unwanted departures, open roles). The catalogue says which the product and engineering leader owns, which they must understand but finance or sales owns, and links the chapters that treat a group in depth. No prevalence claims about what investors \"usually\" demand; no benchmark values.\n- [ ] **Pick a small set.** A rule for choosing: start from the decisions and the outcome record, a dozen or so numbers for the investor, lanes' measures for teams; add a measure only when a decision needs it.\n- [ ] **Hold each number ready.** The measure record (definition, source, owner, refresh, boundaries — [Tool 15](toolkit.html#tool-15)), illustrated with Larkspur's setup-effort measure, reported as the average (mean) per setup — total included hours divided by the number of setups in the group; day 0 defined (the board meeting that adopts the operating plan) before any numbered day; the four pieces of context (baseline, comparison, direction and confidence, decision link) with thresholds agreed before the result that guide the day-100 board review of the day-90 measurement, recommending a response without approving spending — a new stage, or spending outside the approved plan (such as a draw on the reserve), needs the board's approval, while the chief executive authorizes spending within the plan ([Clarify Authority: Decide Who Decides Before You Disagree](decide-who-decides.html)); definition changes restated or marked as a break.\n- [ ] **Label the kind.** Actual, target, forecast, assumption, and committed for an authorized resource, shown on Larkspur's proposal figures (80 hours provisional actual; 50 hours target; €225,000 a year forecast, shown as 3,000 hours a year valued at €75 an hour, never as an equality between hours and euros; three assumptions — 100 setups a year, €75 an hour, and the 50-hour target reached and sustained — named wherever the forecast is quoted; the contract specialist's €150,000 committed; the pilot request committed only once funded); every finance term (fund, profit, cash) explained where it first carries the argument; capacity is not cash until a dated conversion — a scheduled payment actually avoided, or additional customers paying more than their additional cash costs — stated the same way in every format; one forward sentence to the day-100 result without restating it.\n- [ ] **Three uses, three resolutions.** The investor conversation (information rights against courtesy; aggregated and curated; share what supports decisions the recipient takes part in); goals (goals on leading measures, lagging ones reported; a measure that becomes a target changes behaviour, so pair it with a counter-measure); dashboards in three layers (board, leadership, team) where every board figure traces to team work, with refresh automated and interpretation not.\n- [ ] **Someone does the work.** Product operations as Perri and Tilles describe it (three pillars mapped to the catalogue); a small company names an owner per measure and one person accountable for the board pack.\n- [ ] **Grounded Architecture only mentioned.** One or two sentences naming Lightweight Architectural Analytics as the author's approach for the technology part, with its link; no derivation of the chapter's qualities from it.\n- [ ] **Investor questions answered as they are asked** (\"what is your burn and runway?\", \"why is this number different from last quarter's?\", \"can we have access to your systems?\", \"what is your NRR?\"), each pointing at the record.\n- [ ] **House rules.** Opening blocks (IN ORA measures also enter the glossary.\n\n## Decision log\n\n- 2026-09-25: The author asked for a new Part IV chapter after [Adopt Outcome Thinking: Balance Customer and Business KPIs](adopt-outcome-thinking.html) on \"Having Your Number Ready\": the metrics and measurements handy to track and use with investors, when defining goals and when setting dashboards; inspiration from the appendix *Data Foundations for Alignment With Investors*, which is to be removed; Grounded Architecture only mentioned and linked; the product operations link stays.\n- 2026-09-25: Title \"Have Your Numbers Ready: Metrics for Investors, Goals and Dashboards\" (imperative, matching the book's chapter titles); permalink `have-your-numbers-ready`. Every former link to the appendix is retargeted to this chapter; the appendix's figures, logo and icon are reused; its comic (day-100 scenes) is not.\n- 2026-09-25 (in-depth review round 1): The catalogue describes DORA's current five delivery measures rather than the original four, because the linked guide is presented as the current definitions. Setup effort is reported as the arithmetic mean per setup, matching the shared ledger's \"cohort average effort\" in the day-90 rule; the median stays the statistic for waiting time.\n- 2026-09-25 (in-depth review round 2): The key-person row and the comic keep the shared ledger's wording for D-5 (\"release and recover\"), with release defined as making a new version available to customers, consistent with the deployment/release distinction; the comic artwork is not changed for it. Board authority follows [Set Priorities: You Cannot Fund Everything at Once](cannot-fund-everything.html): Ines authorizes spending inside the approved plan; reserve draws, new stages and changes to funded work go to the board.\n\n- 2026-09-25 (in-depth review round 3): Activation keeps [Adopt Outcome Thinking: Balance Customer and Business KPIs](adopt-outcome-thinking.html)'s definition (the account is ready to use), because that chapter starts the month-one support window from it; the first real schedule is named as first value. The aggregation example uses setups of 65, 75 and 100 hours (average 80, median 75), so the example shows why the rule matters instead of giving the same 80 either way.\n\n## Sources\n\n- The removed appendix *Data Foundations for Alignment With Investors* (git history), its spec and bibliography entries S106–S109.\n- Melissa Perri and Denise Tilles, *Product Operations* (S109).\n- Željko Obrenović, [Lightweight Architectural Analytics](https://grounded-architecture.io/analytics) (S106).\n- Nicole Forsgren, Jez Humble and Gene Kim, *Accelerate* (2018); [DORA's software delivery performance metrics](https://dora.dev/guides/dora-metrics/) (five measures since the original four keys gained deployment rework rate).\n- Douglas W. Hubbard, *How to Measure Anything* (3rd ed., 2014).\n- Book records: [Adopt Outcome Thinking: Balance Customer and Business KPIs](adopt-outcome-thinking.html), [Understand Cash Flow: Confirm the Cash Before You Commit](obligations-before-budget.html), [Set Priorities: You Cannot Fund Everything at Once](cannot-fund-everything.html), [Test Revenue Assumptions: Do Customers Respond as Expected?](roadmap-to-revenue.html), [Assess Capability: Can the Team Deliver?](can-the-team-deliver.html), [Build And Test Resilience: Backups Are Not Enough](prove-you-can-restore.html), [Critically Evaluate Cloud Costs: A Lower Bill Is Not Always Better](cheaper-cloud-bill.html), [Manage Technical Debt: Fund the Fix by the Cost, the Risk and the Speed It Buys](manage-technical-debt.html), [Plan the First Hundred Days: Turn Expectations Into Funded Work](first-hundred-days.html), [Clarify Authority: Decide Who Decides Before You Disagree](decide-who-decides.html).\n\n## Changelog\n\n- 2026-09-25: In-depth review round 3 (HNR-003, R08A-005, HNR-007, HNR-008): activation realigned with the outcome record (account ready to use; first real schedule is first value);         // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
