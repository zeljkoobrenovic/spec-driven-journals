<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "# Spec: Scale the Team With AI: Capacity Claims Need the Same Evidence as Headcount\n\n## Intent\n\nGive a leader under investors a way to answer the claim that artificial intelligence (AI) changes what the existing team can complete, whether the claim arrives as a reason to reorganize teams to leverage AI better, hire fewer people, as a reason to cut, or as a reason to buy tools. The chapter treats an AI capacity claim exactly as [Scale the Team Up: Headcount Is Not Capacity](fix-decisions-before-hiring.html) treats a headcount claim: trace the work, find which constraint the tool touches (decision, knowledge or staffing), measure the change in the work that actually completes, count the cost before payback, and record a decision with a dated gate and the evidence that would reverse it. The reader leaves able to say, for one piece of work, what an AI tool would change, what it would not, what it costs, and what an investor's \"AI means fewer people\" argument is really asking for.\n\nThe chapter is the third team chapter of Part V: scaling up ([Scale the Team Up: Headcount Is Not Capacity](fix-decisions-before-hiring.html)), scaling down ([Scale the Team Down: Decide What Work Stops, Not Just Who Leaves](anatomy-of-a-layoff.html)), and scaling with AI. It complements [Clarify AI Strategy: Three Different Investment Questions](ai-strategy-three-questions.html) rather than repeating it: that chapter sorts an AI strategy request into three investments; this one takes the capacity question inside the second of them and puts it through the sizing discipline of this part.\n\n## Context\n\nLarkspur, the book's fictional scheduling-software company, is where [Scale the Team Up: Headcount Is Not Capacity](fix-decisions-before-hiring.html) left it: the two invoicing specialists' queue remains after the delegation changes, the forecast end-to-end lead time for a pricing change is about ten working days of which seven wait for the two specialists, one billing engineer is being brought into the module, and a second team is deferred pending demand, committed funding and board approval. This chapter continues that scenario with the same people (Alex technology, Priya product, Ines the company, Sam finance, Morgan the investor's adviser) and the same figures, and says so once. The shared Larkspur ledger (`_research/shared-scenario-record.md`) is not touched; no new recurring cost is invented.\n\n## Audience\n\nProduct and engineering leaders inside companies working under investors, including leaders who inherit an ownership arrangement. Assume no specialist finance background; explain necessary terms before use. Investor-side readers are secondary.\n\n## Success criteria\n\n- **Same trace, new question.** Reuse the hiring chapter's traced pricing change and its three constraints. For each constraint, say whether an AI tool can touch it: decision waits (no; they are authority), the specialists' knowledge queue (only if the tool lets someone other than the two specialists change the module safely, which is a knowledge-transfer question tested the way the hiring chapter tests it), building and release (yes, and measurably). The reader can repeat this sorting on their own trace.\n- **Capacity, not activity.** Define capacity as the work that completes, as in the hiring chapter, and reject activity measures (lines written, requests handled, tokens used, tool seats active) as evidence of capacity. Every claimed gain in every format is stated as work completed per period with the same quality checks that applied before the tool.\n- **Product and engineering, not developers only.** Give one engineering example (the pricing change) and one implementation or support example (customer setup work, which the book has traced since Part III), and show that the measurement method is the same while the risks differ (code defects versus wrong customer configuration).\n- **The evidence box, kept in scope.** Reuse the dated coding-study evidence already registered ([S19] Copilot experiment 2022/2023, [S20] METR early-2025 randomized study, [S21] METR 2026 update) with the distinction between the date an experiment ran and its publication date, the measured quantity and the participant group, and say what none of them measures (Larkspur's own work). Add newer registered evidence only if verified; do not cite from memory.\n- **The investor argument as a capacity claim.** Give the \"AI means fewer people\" argument its own section: separate a formal condition (a funding condition or reserved matter), a director's vote and an adviser's benchmark, as [Scale the Team Down: Decide What Work Stops, Not Just Who Leaves](anatomy-of-a-layoff.html) does for reduction pressure, and answer each with the response it requires. Show one Larkspur version: Morgan proposes that the deferred second team is no longer needed because of AI tools; the chapter tests that claim against the trace instead of accepting or refusing it.\n- **Cost before payback, in full.** For the tool pilot, separate additional cash (licences, usage-based charges, any data or security work required by [S18]) from existing employees' time (training, review of generated work, the specialists' time in the pilot), one-off from recurring, and label estimates built from internal time as cost-based estimates rather than cash. No option is described as free because no licence is bought.\n- **A recorded decision with a dated gate.** End the Larkspur example with the chosen option, alternatives rejected, funding, scarce capacity, who is authorized, a dated gate with what happens when the condition is met, missed or falls between thresholds, and the evidence that would reopen it. Quality is a prerequisite for every continuation branch, and the decision about the deferred second team is explicitly *not* changed by the pilot until the gate is passed.\n- **House rules.** Status highlight and key points that read without prior study; terms explained at first use in each format (AI, capacity, lead time, pilot, licence, funding condition); the company leader's decision, authority and funding assumptions explicit; historical findings within source scope; fictional scenarios labelled; a meaningful counterargument (the tool may raise output while lowering the quality of what completes, or shift the constraint to review) with the evidence that would change the judgment; hand-off to [Plan for Growth: Decide What (Not) to Change in Your Systems](growth-into-design.html) with the system constraint still open; TL;DR and comic consistent with the article.\n\n## Non-goals\n\n- Not a second treatment of the three AI investment questions, the customer-facing AI product or the substitute threat; those stay in [Clarify AI Strategy: Three Different Investment Questions](ai-strategy-three-questions.html) and are linked.\n- Not a tool comparison, a vendor recommendation or a prediction of how good AI tools will be; the chapter's claims are about measurement and decision, not about the technology's trajectory.\n- Not a reduction method; when the pilot result bears on staffing, the chapter hands the reduction question to [Scale the Team Down: Decide What Work Stops, Not Just Who Leaves](anatomy-of-a-layoff.html).\n- No prevalence claims about what companies \"usually\" gain; no invented study results; no new figures in the shared Larkspur ledger.\n\n## Modalities\n\n- [ ] `checklist.md` — not used; the book's main chapters use article, TL;DR and comic.\n- [x] `summary.md` — TL;DR of 300–500 words with one overview visual, as every main chapter.\n- [ ] `dialog.md` — not used in this journal.\n- [x] `comics.md` — comic pages of three stacked strips, VERA-style cast as in the neighbouring chapters, with the Morgan proposal and the gate decision reached causally rather than by assertion.\n\n## Open questions\n\n- Whether to register new external evidence (for example DORA's reports on AI adoption and delivery performance) as S-ids; each candidate must be fetched and checked before it enters the bibliography.\n- Whether the implementation/support example uses the onboarding specialist from the shared ledger (then its figures must match `shared-scenario-record.md`) or a separate, smaller example.\n\n## Decision log\n\n- 2026-09-24: The author proposed the chapter after the SCALE part was created, first as a move of the existing AI chapter (\"Scaling With AI\"), then as a new chapter once it was agreed that the existing chapter is an investment-choice chapter that belongs in COMMIT. Rejected: renaming or moving [Clarify AI Strategy: Three Different Investment Questions](ai-strategy-three-questions.html).\n- 2026-09-24: Scenario continues the hiring chapter's invoicing-queue trace (author's choice) rather than a separate scenario, so the three team chapters read as one story and the capacity definition is inherited rather than restated.\n- 2026-09-24: Scope is product and engineering including customer setup and support (author's choice), not developers only, because the book's traced work is onboarding as much as code.\n- 2026-09-24: The investor's \"AI means fewer people\" argument is a central section (author's choice), treated as a capacity claim to test, not as a reduction to plan.\n- 2026-09-24: Title form \"Scale the Team With AI: …\" chosen to match the retitled neighbours \"Scale the Team Up\" and \"Scale the Team Down\"; subtitle \"Capacity Claims Need the Same Evidence as Headcount\" states the argument. Alternatives considered: \"Scaling With AI: Three Different Investment Questions\" (rejected: the three questions belong to the COMMIT chapter).\n\n## Sources\n\n- Author's intent from the 24 September 2026 conversation (no `INPUT.md`).\n- [Scale the Team Up: Headcount Is Not Capacity](fix-decisions-before-hiring.html) — the trace, the three constraints,         function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');

                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
