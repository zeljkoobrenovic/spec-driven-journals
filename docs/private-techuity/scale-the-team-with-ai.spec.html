<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "# Spec: Scale the Team With AI: Capacity Claims Need the Same Evidence as Headcount\n\n## Intent\n\nGive a leader under investors a way to answer the claim that artificial intelligence (AI) changes what the existing team can complete, whether the claim arrives as a reason to reorganize teams to leverage AI better, hire fewer people, as a reason to cut, or as a reason to buy tools. The chapter treats an AI capacity claim exactly as [Scale the Team Up: Headcount Is Not Capacity](fix-decisions-before-hiring.html) treats a headcount claim: trace the work, find which constraint the tool touches (decision, knowledge or staffing), measure the change in the work that actually completes, count the cost before payback, and record a decision with a dated gate and the evidence that would reverse it. The reader leaves able to say, for one piece of work, what an AI tool would change, what it would not, what it costs, and what an investor's \"AI means fewer people\" argument is really asking for.\n\nThe chapter is the third team chapter of Part V: scaling up ([Scale the Team Up: Headcount Is Not Capacity](fix-decisions-before-hiring.html)), scaling down ([Scale the Team Down: Decide What Work Stops, Not Just Who Leaves](anatomy-of-a-layoff.html)), and scaling with AI. It complements [Clarify AI Strategy: Three Different Investment Questions](ai-strategy-three-questions.html) rather than repeating it: that chapter sorts an AI strategy request into three investments; this one takes the capacity question inside the second of them and puts it through the sizing discipline of this part.\n\n## Context\n\nLarkspur, the book's fictional scheduling-software company, is where [Scale the Team Up: Headcount Is Not Capacity](fix-decisions-before-hiring.html) left it: the two invoicing specialists' queue remains after the delegation changes, the forecast end-to-end lead time for a pricing change is about ten working days of which seven wait for the two specialists, one billing engineer is being brought into the module, and a second team is deferred pending demand, committed funding and board approval. This chapter continues that scenario with the same people (Alex technology, Priya product, Ines the company, Sam finance, Morgan the investor's adviser) and the same figures, and says so once. One timeline governs every month count: the billing engineer moved into the billing area on the day the hire was funded (day 0 of the hiring chapter's decision); Morgan's note arrives ninety days later; the pilots start about four weeks after the note, once the data review is done, so their first day falls about four months (roughly day 118) after the engineer started. The hiring chapter's six-month transfer review is a reassessment deadline at about day 182 (about pilot day 65, early in the pilot's third month); a solo release in the pilot's first month has its thirty-day invoice follow-up read at the pilot's day-60 reconciliation, about day 177, so its evidence is available by the reassessment. No format assigns the whole first pilot month to one tenure month. The ten-day forecast is the standard case, a change inside Priya's rule catalogue with no decision wait; a rule outside the catalogue adds up to three days (10 to 13). The seven-day queue is the wait for one of the two specialists to be free to take the change up; the specialists build and test it themselves. The shared Larkspur ledger (`_research/shared-scenario-record.md`) is not touched; no new recurring cost is invented.\n\n## Audience\n\nProduct and engineering leaders inside companies working under investors, including leaders who inherit an ownership arrangement. Assume no specialist finance background; explain necessary terms before use. Investor-side readers are secondary.\n\n## Success criteria\n\n- **Same trace, new question.** Reuse the hiring chapter's traced pricing change and its three constraints. For each constraint, say whether an AI tool can touch it: decision waits (no; they are authority), the specialists' knowledge queue (only if the tool lets someone other than the two specialists change the module safely, which is a knowledge-transfer question tested the way the hiring chapter tests it), building and release (yes, and measurably). The reader can repeat this sorting on their own trace.\n- **Capacity, not activity.** Define capacity as the work that completes, as in the hiring chapter, and reject activity measures (lines written, requests handled, tokens used, tool seats active) as evidence of capacity. Every claimed gain in every format is stated as work completed per period with the same quality checks that applied before the tool.\n- **Product and engineering, not developers only.** Give one engineering example (the pricing change) and one implementation or support example (customer setup work, which the book has traced since Part III), and show that the measurement method is the same while the risks differ (code defects versus wrong customer configuration).\n- **The evidence box, kept in scope.** Reuse the dated coding-study evidence already registered ([S19] Copilot experiment 2022/2023, [S20] METR early-2025 randomized study, [S21] METR 2026 update) with the distinction between the date an experiment ran and its publication date, the measured quantity and the participant group, and say what none of them measures (Larkspur's own work). Add newer registered evidence only if verified; do not cite from memory.\n- **The investor argument as a capacity claim.** Give the \"AI means fewer people\" argument its own section: separate a formal condition (a funding condition or reserved matter), a director's vote and an adviser's benchmark, as [Scale the Team Down: Decide What Work Stops, Not Just Who Leaves](anatomy-of-a-layoff.html) does for reduction pressure, and answer each with the response it requires. Show one Larkspur version: Morgan proposes that the deferred second team is no longer needed because of AI tools; the chapter tests that claim against the trace instead of accepting or refusing it.\n- **Cost before payback, in full.** For the tool pilot, separate additional cash (licences, usage-based charges, any data or security work required by [S18]) from existing employees' time (training, review of generated work, the specialists' time in the pilot), one-off from recurring, and label estimates built from internal time as cost-based estimates rather than cash. No option is described as free because no licence is bought.\n- **A recorded decision with a dated gate.** End the Larkspur example with the chosen option, alternatives rejected, funding, scarce capacity, who is authorized, a dated gate with what happens when the condition is met, missed or falls between thresholds, and the evidence that would reopen it. The gate is executable: the measured period is days 1 to 90 of tool use; the gate's sample is defined by completion date (a change that reaches production, or a setup that goes live, on or before day 90), work still open on day 90 is recorded as carried over rather than counted or dropped, and the decision is taken on day 120, when every item in the sample has had thirty days of live evidence (the setup's thirty-day correction window; the reconciliation of every invoice issued up to day 120, run on the pilot's clock). The tools stay on for the same seats and the same work through day 120; items completed in days 91 to 120 are followed the same way and reported beside the gate as interim evidence, outside the sample. The extension runs on the same shape (sixty measured days, days 121 to 180, thirty days of observation, decision on day 210) and a month lost to a tool-free check moves every later date back thirty days; each of these is funded (licences for the observation month, management time to the decision day) and authorized by name. The gain is defined as the pilot's monthly average minus the baseline's, divided by the baseline's, as a percentage, with a worked example and a rule for a zero baseline. The rules are mutually exclusive and cover missing evidence, worse quality, worse lead time, a gain of 0% or less, a gain above 0% and below 20% (one sixty-day extension with a stated terminal rule) and a gain of 20% or more. Quality is a prerequisite for every continuation branch and is defined as a rate against the baseline rate: faulty items per hundred delivered items, faulty items included in the denominator, an item being faulty if it caused at least one error in the same thirty days after delivery (a failed invoice for a change, a customer correction for a setup). The rate counts items, not wrong invoices, because one change can touch many invoices; the number of wrong invoices (the correction burden) and wrong invoices per hundred checked are reported beside it, and a change that breaks many invoices is investigated, but neither is the gate's test, since both depend on invoice volume and on how many invoices a change touches. Every customer setup is followed for thirty days and the engineering check is the full monthly reconciliation with each error traced to the change that caused it and to whether the tool was used on it. Delayed evidence is handled by delivery month: a month's completed rate exists at the end of the following month, when every item in it has had its thirty days; before that its rate is provisional (faulty items found so far over every item delivered that month), which can only rise, so a provisional rate above the baseline at a month-end check is already a breach and triggers the tool-free month from the next day; nothing is switched off retrospectively, and a late error found during a pause joins its own delivery month's count for the restart decision without starting a second pause (worked cases: a setup delivered on day 29 corrected on day 55; a correction found during a pause). The company leader's written restart decision marks the breach it answers as investigated: every tool month delivered before the pause is complete by then, so its rate can no longer change; it stays in the final sample with its faulty items but does not trigger another pause. After a restart only a tool month delivered after it can start another pause, by the same steps, each further tool-free month moving later dates back thirty more days (worked case: a 10% baseline and two faulty setups in ten in the first month; tool off days 31 to 60; restart on day 60; the unchanged 20% does not pause the pilot again on day 90; decision on day 150). A tool-free month after a quality failure is diagnostic evidence, not proof of cause, and the pilot restarts only on an explicit written decision by the company leader. Expected spend, the authorized ceiling and who authorizes an extension or a lengthened month are stated separately. Review burden has a decision attached: a throughput gain that meets the numerical rule is technical eligibility, and the tool continues only if the added reviewer hours (pilot minus baseline, per month) are funded on the gate day by the company leader naming the work they displace, which may not be the specialists' transfer day or committed customer dates; a gain the company cannot afford to review is recorded as such and the tool withdrawn, and every visual that shows the 20% band shows it as conditional on funded review, never as automatic continuation or extra seats (worked case: ten to twelve changes a month with review rising from two to ten hours an item is a 20% gain and twenty to 120 reviewer-hours a month). An interruption is defined precisely: deliveries in the tool-free month go into a diagnostic record outside the sample, marked by whether the tool was used on them; work finished after a restart counts in the month of completion; the sample stays three measured months of tool use (the monthly average divides by three) and every later date moves back thirty days. The month-end check runs at every month end while a tool is in use (days 30, 60, 90 and 120, the extension's month ends, and after the gate for as long as the tool continues), so the observation months are monitored too; on a gate day the sample's own months are judged by the quality rule and the check reads only the months outside the sample. A breach in an observation month never enters the gain calculation, but it holds the gate result: the tool is off for that work for a diagnostic month, and the company leader then decides in writing whether to withdraw it or let the gate result take effect (worked case: a passing sample with a 20% gain, then ten observation-month deliveries with two faulty against a 10% baseline; the gate result is held, the tool is off for days 121 to 150, and the decision falls on day 150). Alex or Priya apply a pause, which the rules make automatic, and report it the same day; only the company leader authorizes an added month, a restart, an extension or the release of a held result. The extension has its own calculation: its sample is the items of the narrowed task types delivered in its two measured months (no initial-pilot or observation deliveries), its monthly average divides by two, and its baseline is the same three pre-pilot months restricted to those task types, divided by three (worked case: 24 qualifying deliveries in two months against ten a month is 20%); a pause keeps two measured months and moves dates back thirty days; task types with no baseline deliveries cannot enter the narrowed measure, and with none left the extension is not granted. Worse lead time withdraws the tool and is recorded as slower delivery; a moved constraint, and review as its place, are named only when the stage-by-stage trace and the reviewers' hours show it. Equally, when building falls, review rises and lead time is unchanged, every format describes review absorbing the building saving and adding pressure to the existing specialist constraint (the reviewers are the two specialists), not a constraint that has moved; the comic's dialogue, caption, transcript and artwork say the same. The review-burden vignette reaches the affordability condition only after the gain, quality and lead-time rules have been met. The decision record puts what a newcomer needs first, in short cells: the normal schedule, the six rules and the affordability condition, with a short safety-stop paragraph; the detailed interruption steps, the shifted schedule, the delayed-evidence cases, the observation-month case and the extension calculation sit in a clearly labelled supporting note at the end of the section. The decision about the deferred second team is explicitly *not* changed by the pilot until the gate is passed.\n- **House rules.** Status highlight and key points that read without prior study; terms explained at first use in each format (AI, capacity, lead time, pilot, licence, seat, gate, throughput, delegation, operating budget, payback, invoice reconciliation, invoicing module, customer configuration, board and director, funding condition, term sheet as a proposal that is not itself a funding guarantee); review effort compared as the difference between baseline and pilot reviewer hours, elapsed lead time reported directly, euros, hours, days and percentages kept apart (a throughput gain is never netted against tool charges or review hours; a euro value for saved time needs a stated period and an assumed hourly cost); the seven-day queue stated in every format as a fixed assumption of the calculation that the pilot's lead-time measure tests, never as something a tool can move only through knowledge transfer; a funding round, committed funding, delegation, median, lines accepted and one concrete pricing-rule and customer-setting example explained at first use, with the example reused across formats; the closing quality-failure vignette stated as a rise in the error rate that fails the gate, not as a fall in successful items, with the cause investigated (review, requirements or tests) rather than asserted, and small error differences treated as possible chance to investigate, not as chance; one counting rule in every format (every delivered item counted, errors reported beside the count as a rate, a rise in throughput recognized as capacity only while the rate holds); before/after figures recorded with task mix, demand, staffing and other workflow changes so that the engineer's own learning or easier work is not credited to the tool; the company leader's decision, authority and funding assumptions explicit; historical findings within source scope; fictional scenarios labelled; a meaningful counterargument (the tool may raise output while lowering the quality of what completes, or shift the constraint to review) with the evidence that would change the judgment; hand-off to [Plan for Growth: Decide What (Not) to Change in Your Systems](growth-into-design.html) with the system constraint still open; a trace (the record of the stages and waits a piece of work passes through), release (putting a finished change into the live system, as distinct from building it) and tokens (small pieces of text or code an AI service processes and bills by, a measure of activity rather than completed work) explained at first use in each format that uses them; the TL;DR states the extension's terminal rule (judged after thirty more days of follow-up; 20% or more with quality, lead time and funded review, or the tool is withdrawn); the TL;DR and the comic each state the month-end safety stop and its consequence (a quality breach in any month of tool use pauses the tool for a month, moves later dates back, and holds even a passing gate result until the company leader's written restart decision) and call days 120 and 210 the normal, uninterrupted dates; the DevEx reading note presents developers' perceptions as a complement to the pilot's workflow measures, not as something reviewer-recorded hours already supply; TL;DR and comic consistent with the article.\n\n## Non-goals\n\n- Not a second treatment of the three AI investment questions, the customer-facing AI product or the substitute threat; those stay in [Clarify AI Strategy: Three Different Investment Questions](ai-strategy-three-questions.html) and are linked.\n- Not a tool comparison, a vendor recommendation or a prediction of how good AI tools will be; the chapter's claims are about measurement and decision, not about the technology's trajectory.\n- Not a reduction method; when the pilot result bears on staffing, the chapter hands the reduction question to [Scale the Team Down: Decide What Work Stops, Not Just Who Leaves](anatomy-of-a-layoff.html).\n- No prevalence claims about what companies \"usually\" gain; no invented study results; no new figures in the shared Larkspur ledger.\n\n## Modalities\n\n- [ ] `checklist.md` — not used; the book's main chapters use article, TL;DR and comic.\n- [x] `summary.md` — TL;DR of 300–500 words with one overview visual, as every main chapter; a successful independent release by the billing engineer is transfer evidence only if it passes the invoice checks, and it does not by itself prove that the tool accelerated learning or that engineers are unnecessary.\n- [ ] `dialog.md` — not used in this journal.\n- [x] `comics.md` — comic pages of three stacked strips, VERA-style cast as in the neighbouring chapters, with the Morgan proposal and the gate decision reached causally rather than by assertion.\n\n## Open questions\n\n- Whether to register new external evidence (for example DORA's reports on AI adoption and delivery performance) as S-ids; each candidate must be fetched and checked before it enters the bibliography.\n- Whether the implementation/support example uses the onboarding specialist from the shared ledger (then its figures must match `shared-scenario-record.md`) or a separate, smaller example.\n\n## Decision log\n\n- 2026-09-24: The author proposed the chapter after the SCALE part was created, first as a move of the existing AI chapter (\"Scaling With AI\"), then as a new chapter once it was agreed that the existing chapter is an investment-choice chapter that belongs in COMMIT. Rejected: renaming or moving [Clarify AI Strategy: Three Different Investment Questions](ai-strategy-three-questions.html).\n- 2026-09-24: Scenario continues the hiring chapter's invoicing-queue trace (author's choice) rather than a separate scenario, so the three team chapters read as one story and the capacity definition is inherited rather than restated.\n- 2026-09-24: Scope is product and engineering including customer setup and support (author's choice), not developers only, because the book's traced work is onboarding as much as code.\n- 2026-09-24: The investor's \"AI means fewer people\" argument is a central section (author's choice), treated as a capacity claim to test, not as a reduction to plan.\n- 2026-09-24: Title form \"Scale the Team With AI: …\" chosen to match the retitled neighbours \"Scale the Team Up\" and \"Scale the Team Down\"; subtitle \"Capacity Claims Need the Same Evidence as Headcount\" states the argument. Alternatives considered: \"Scaling With AI: Three Different Investment Questions\" (rejected: the three questions belong to the COMMIT chapter).\n\n- 2026-09-24 (in-depth review, round 3, SAI-001, SAI-004, SAI-006, SAI-007, SAI-012 and SAI-015 to SAI-018): the gate let a 20% gain continue however much review it consumed, so continuation now requires the added reviewer hours to be funded by name on the gate day (technical eligibility plus an affordability decision); an interrupted pilot now defines its sample (three tool months, diagnostic month outside), its numerator and its shifted dates; the decision record is split into short cells, a schedule table and numbered interruption steps; the opening is shortened so Morgan's proposal follows the key points; one counting rule (every delivered item counted, errors reported beside it) replaces the comic's \"counts only if it reconciles\"; causes of a quality failure are investigated, not asserted; board, director, operating budget, payback, invoicing module and customer configuration are explained at first use in every format; the TL;DR returns to 300–500 words. Rejected: a fixed reviewer-hour ceiling, because it would add a figure the shared ledger does not carry.\n- 2026-09-24 (in-depth review, round 2, SAI-001 to SAI-010 and SAI-014): the day-90 admission rule still let a setup started on day 89 finish after the decision's evidence window, so the sample is now defined by completion date with thirty days of live evidence for every item, interim use to day 120 is separated from the measurement cutoff, and the extension and an interrupted pilot get their own observation and decision days with funding; the gain formula is stated as a percentage change over the baseline (the earlier wording was a ratio); the tool-free month is downgraded from proof to diagnostic evidence with a reviewed restart; the error-rate denominator is delivered items; throughput, lead time and cost stay in their own units; the queue is a held-fixed assumption in every format. Figure 1, Figure 3, the TL;DR visual and comic pages 3, 5, 7 and 8 follow.\n- 2026-09-24 (in-depth review SAI-001 to SAI-013): the day-90 gate could not observe the thirty-day follow-up of late setups, so the design separates ninety days of use from a day-120 decision; the gate rules are made mutually exclusive with a terminal rule after the single extension and a tool-free retest month after a monthly quality failure; quality becomes a rate with stated denominators and the \"fresh samples\" rule becomes \"every item, same checks\"; the ten-day trace is identified as the catalogue case (10 to 13 with a decision wait) and the queue as the wait for a specialist's attention, held fixed as an assumption; the billing engineer's clock is stated once and the transfer result is no longer claims the pilot already pairs perceptions with workflow data. Rejected: renaming the section and comic page \"When the Pilot Shifts the Constraint\", because the first outcome can still establish a constraint by trace and the heading asks the question rather than asserting the answer.\n\n## Sources\n\n- Author's intent from the 24 September 2026 conversation (no `INPUT.md`).\n- [Scale the Team Up: Headcount Is Not Capacity](fix-decisions-before-hiring.html) — the trace, the three constraints, the capacity definition, the deferred second team and the appointment-authority pattern this chapter inherits.\n- [Scale the Team Down: Decide What Work Stops, Not Just Who Leaves](anatomy-of-a-layoff.html) — the three kinds of reduction pressure and the \"find the real source\" method reused for the investor argument.\n- [Clarify AI Strategy: Three Different Investment Questions](ai-strategy-three-questions.html) — the three investment questions and the registered coding-study evidence box; this chapter links rather than repeats.\n- [Assess Capability: Can the Team Deliver?](can-the-team-deliver.html) — the capability finding behind the scenario.\n- Bibliography: [S18] NIST generative AI profile (data and security obligations of a pilot), [S19] Peng et al. Copilot experiment, [S20] METR early-2025 experiment, [S21] METR 2026 update. Further external evidence only after verification.\n\n## Changelog\n\n- 2026-09-24: Revised after round 8 of the in-depth review (SAI-025 to SAI-027): the TL;DR's closing transfer point now says what the billing engineer is learning and what an independent error-free change does and does not show; comic captions on pages 1, 2, 3 and 5 split into single-idea paragraphs with definitions kept; open-source gloss now includes the licence rights to modify and share. Intent unchanged; status stays `accepted`; post revised in step.\n- 2026-09-24: Revised after round 7 of the in-depth review (SAI-007, SAI-008, SAI-019, SAI-024): review absorbing TL;DR condensed to the 300–500-word target, DevOps definition corrected. Status stays `accepted`; post revised in step.\n- 2026-09-24: Revised after round 2 of the in-depth review (SAI-001 to SAI-010, SAI-014): completion-dated gate sample with thirty days of evidence per item, extension and interruption dates, percentage-change gain formula, diagnostic tool-free month, delivered-item denominator, units kept apart, queue as a stated assumption, first-use explanations (funding round, delegation, median, lines accepted, a pricing-rule example). Status stays `accepted`; post revised in step.\n- 2026-09-24: Revised after the in-depth review (SAI-001 to SAI-013): executable gate (day 120 decision after ninety days of use), mutually exclusive rules, rate-based quality with full customer follow-up, one timeline for the billing engineer, cash expected versus ceiling, lay explanations of reconciliation, gate, seats, throughput, delegation and term sheet. Status stays `accepted`; post revised in step.\n- 2026-09-24: Status `accepted` at the author's instruction (“all of it”) after the article, TL;DR, comic, figures, logo, icon and Probe Further were produced; the folder-placement open question is resolved by the renumbering.\n- 2026-09-24: Created as `draft` from the author's intent; scenario, scope and investor-angle decisions recorded. No `index.md` yet.\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
