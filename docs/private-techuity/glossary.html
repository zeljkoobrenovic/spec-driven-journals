nsactions) · [Management fee](#organizations) · [Management rollover](#transactions) · [Manager](#organizations) · [Mandate](#roles) · [Margin](#earnings) · [Market approach](#returns) · [Materiality](#evidence) · [Maturity](#earnings) · [Microservices](#technology) · [Minimum operating reserve](#arrangements) · [Minority investment](#arrangements) · [Model inference](#technology) · [Modularity](#technology) · [MOIC](#returns) · [Multiple compression](#returns) · [Multiple expansion](#returns)\n- **N** — [Nearshoring](#technology) · [Net cash burn](#arrangements) · [Net debt](#returns) · [Net debt to EBITDA ratio](#returns) · [Net loss](#earnings) · [Net profit](#earnings) · [Net return](#returns) · [Net revenue retention](#earnings) · [Notice period](#choosing)\n- **O** — [Observation](#evidence) · [Observational research](#evidence) · [Offshoring](#technology) · [On-call rota](#technology) · [Onboarding](#technology) · [One-off cost](#earnings) · [Operating cash flow](#earnings) · [Operating earnings](#earnings) · [Operating model](#technology) · [Operating plan](#roles) · [Operating profit](#earnings) · [Operating team](#roles) · [Opportunity cost](#choosing) · [Option](#transactions) · [Organic growth](#earnings) · [Outplacement](#choosing) · [Ownership cycle](#proposed)\n- **P** — [Payables](#earnings) · [PE](#funding) · [Peer network](#choosing) · [Percentage](#evidence) · [Percentage point](#evidence) · [Platform company](#transactions) · [Portfolio](#organizations) · [Portfolio company](#organizations) · [Post-money valuation](#arrangements) · [Preference](#transactions) · [Preferred return](#organizations) · [Pre-money valuation](#arrangements) · [Present value](#returns) · [Primary share issue](#arrangements) · [Principal](#funding) · [Private company](#funding) · [Private equity](#funding) · [Private-to-private](#transactions) · [Pro forma](#earnings) · [Profit](#earnings) · [Public company](#funding) · [Public-to-private](#transactions)\n- **R** — [Reali capital](#arrangements) · [Vesting](#transactions)\n- **W** — [Working capital](#earnings) · [Writedown](#transactions)\n\n## <a id=\"funding\"><\/a>Basic Funding and Ownership\n\nStart with the chapter [Understand Expectations: Customers, Lenders and Investors](customers-lenders-investors.html). The stock and public-company definitions use Investor.gov’s educational material; the capital-structure definition follows Damodaran’s finance teaching. [S54: Stock basics](https://www.investor.gov/introduction-investing/investing-basics/investment-products/stocks) [S55: Public companies](https://www.investor.gov/introduction-investing/investing-basics/how-stock-markets-work/public-companies) [S57: Capital structure](https://people.stern.nyu.edu/adamodar/pdfiles/cf2E/capstru.pdf)\n\n| Term | Plain-language meaning |\n| --- | --- |\n| Financing | Arranging the money a business needs. |\n| Capital | Money or other resources supplied to fund an activity or investment; the exact meaning depends on context. |\n| Debt | Money owed under a borrowing arrangement. The lender’s return is repayment and interest under the contract, not a share of ownership. |\n| Lender | A person or organization that supplies money as debt, such as a bank or a bondholder. A lender is an investor too; what differs from a shareholder is the instrument and the rights it carries, which come from the loan agreement rather than from ownership ([Understand Expectations: Customers, Lenders and Investors](customers-lenders-investors.html)). |\n| Principal | The amount borrowed, as distinct from interest. In “Technology Principal,” Principal is a job title. |\n| Interest | The charge for using borrowed money. |\n| Equity | An ownership interest. In a balance sheet, equity is the accounting amount remaining after liabilities are deducted from assets. |\n| Share / shareholder | A unit of company ownership / its holder. Ten of 1,000 identical shares represents 1% of those shares; share classes can have different rights. Use “shareholder” for ownership; for responsibility, see accountable company leader. |\n| Dividend | A payment to shareholders under the company’s arrangements. |\n| Asset / liability | Teaching description only: a resource the business controls that can provide future benefit / an obligation, such as an amount owed. Accounting standards set stricter tests for when either is recognized and at what amount. |\n| Capital structure | The mix of debt and equity financing. It is distinct from a list of all cash sources, such as customer payments and asset sales. |\n| Stock exchange | An organized market where investors trade shares and other securities. |\n| Public company | In this book, usually a company with publicly traded shares. Legal public-reporting categories can be broader; reporting obligations vary. |\n| Private company | A company without shares traded on a public stock market. It may still have many owners and significant reporting obligations. |\n| Audited financial statements | Financial statements examined by an independent auditor, who reports whether they give a true and fair view under the applicable accounting rules. Public companies must publish audited statements regularly; many private companies must also, depending on size, jurisdiction and financing agreements. An audit checks the statements, not the wisdom of the decisions behind them. |\n| Initial public offering (IPO) | The first public offering of a company’s shares. It may raise company money, let existing owners sell, or do both. |\n| Private equity (PE) | Ownership investment outside public stock markets, including transactions taking public companies private. Broad usage includes venture and growth investment; narrower usage often means buyouts. |\n| Investor | Anyone supplying money in exchange for a claim on the business: an ownership interest (an equity investor or shareholder) or a contractual right to repayment with interest (a lender or bondholder). Lenders are investors too; equity investors expect the share rights they negotiated, lenders the repayment and protections in their contracts. The investor may be a person, a fund, an investment firm acting for a fund, a bank or a corporate business. The chapters say “the investor” when the distinction does not matter and name the fund, firm, lender or person wherever money or authority depends on it. |\n| The company | The operating business the reader works in. Its cash, obligations and decisions are separate from those of any fund, holding company or shareholder, even when one shareholder controls it. |\n\n## <a id=\"arrangements\"><\/a>Comparing Ownership and Funding Arrangements\n\nThese definitions support the comparisons in the chapter [Understand Funding Choices: Match the Money to the Work](raise-what-you-need.html); they do not replace the terms of a particular arrangement. The last five rows describe the funding states the book uses from the chapter [Understand Funding and Control: An Investment Announcement Is Not a Budget](announcement-is-not-a-budget.html) onward: expression of interest → approval pending → contractual commitment with conditions → cash received. Record each planned commitment against the state its money has reached. A commitment can be funded from cash the company holds, from a facility it is authorized to draw or from forecast operating receipts in a dated cash plan; an expected round, or a commitment whose conditions are unmet, is not yet any of those. Before an irreversible commitment, establish when usable funds will be available, which conditions remain and which fallback is authorized (see the chapters [Understand Cash Flow: Confirm the Cash Before You Commit](obligations-before-budget.html) and [Manage Funding Delays: Revise the Cash Plan and Commitments](the-financing-slipped.html)).\n\n| Term | Plain-language meaning |\n| --- | --- |\n| Investor ownership | An arrangement in which investors hold an interest in the company; the amount of ownership and the rights attached to it vary. |\n| Venture capital | Equity funding commonly used by young businesses pursuing uncertain growth; funding can occur through successive rounds. |\n| Growth equity / expansion capital | Equity funding for expansion of a business with established activity; the investor’s rights and control depend on the terms. |\n| Corporate investor | Another operating business, or its investment organization, holding an interest for financial or commercial reasons. |\n| Corporate venture capital (CVC) | Venture investment backed by a corporate business; it is distinct from acquiring the whole company. |\n| Strategic acquisition | A purchase motivated by expected commercial benefits for the buyer as well as the acquired business’s standalone economics. |\n| Minority investment | Ownership of less than a majority of shares; the percentage alone does not describe voting power or approval rights. |\n| Funding round | A financing event in which investors supply capital on agreed terms; it need not replace the controlling owner. |\n| Primary share issue | The company issues new shares and receives the subscription money. |\n| Secondary share sale | Existing holders sell shares; payment goes to those sellers rather than automatically funding the company. |\n| Pre-money valuation / post-money valuation | In a simplified equity round, negotiated equity value before new cash / that value plus the new cash. Rights and other instruments can complicate the calculation. |\n| Fully diluted ownership | A percentage calculated after including the specified options and other rights to shares; check exactly what is included. |\n| Net cash burn | Cash spending minus cash receipts over a stated period when spending is greater. |\n| Collected revenue | Money customers have actually paid in the period, as distinct from revenue invoiced, recognized or forecast. A cash plan is built on it. |\n| Fully loaded cost | The full monthly or annual cost of an employee: salary plus employer charges, benefits, equipment and tools. It is the figure that changes when a person joins or leaves. |\n| One-off cost / recurring saving | A cost paid once (severance, a transition, a contract exit) against a saving that repeats each period once it has fully arrived. Compare them by date, not as two totals ([Manage Funding Delays: Revise the Cash Plan and Commitments](anatomy-of-a-layoff.html)). |\n| Runway | Estimated time until available cash reaches a stated limit under a cash forecast. Cash divided by constant net burn is a simplifying illustration. |\n| Minimum operating reserve | The amount of cash a board agrees the company will not fall below, so that a slip can be absorbed while a decision is taken. Reaching it is a dated event a plan is measured against, not the moment the money runs out ([Manage Funding Delays: Revise the Cash Plan and Commitments](the-financing-slipped.html)). |\n| Bridge (bridge loan, bridge financing) | A shorter, smaller financing, often from the existing investors, meant to carry the company until a larger round or other event closes. It is an investment decision on the investor’s side, may carry conditions the company must meet before the money is transferred, and is not cash until it is drawn. |\n| Convertible loan | A loan whose repayment can be replaced by shares, typically in the next funding round at agreed terms. Interest may accrue and settle in shares rather than be paid in cash. |\n| Drawdown | The moment a committed loan or facility is actually transferred to the company’s account. Before it, the money is a commitment; after it, cash received. |\n| Subscription agreement | The contract in which an investor commits to buy new shares on stated terms. A contractual commitment with conditions, one stage past a term sheet and still not cash received. |\n| Expression of interest | A statement that an investor may want to invest, without approval or binding terms. It supplies no money. |\n| Approval pending | Terms are being negotiated or await a decision by the body authorized to approve them, such as a fund’s investment committee. Still not money. |\n| Contractual commitment | A signed agreement to supply money, normally subject to conditions such as regulatory clearance, completion steps or milestones. Read the conditions; money arrives only when they are met, so a written commitment is not cash received. A plan may rely on it only where the decision-maker has authorized that reliance, with a dated cash forecast and a funded fallback if the conditions fail. |\n| Cash received | Money actually in the company’s bank account. It is the only one of the four states that is money, but not all of it is available: part may be restricted or already required for obligations, and a budget may also draw on facilities the company is authorized to use and on forecast operating receipts inside a dated cash plan. Keep received cash, contractual funding and forecast receipts on separate lines. Do not describe an announced or agreed transaction value as received until the money has arrived. |\n| Conditional commitment | Company-side: work promised subject to an explicit event, such as funding or approval, with a date, an authorized fallback and a stated response if the condition is not met by that date. See the dated cash plan in [Manage Funding Delays: Revise the Cash Plan and Commitments](the-financing-slipped.html) and the approval record in [Clarify Authority: Decide Who Decides Before You Disagree](decide-who-decides.html). |\n\nCarve-outs, turnarounds, acquisitions and refinancing describe changes or conditions; they do not by themselves identify who owns the business. Follow the money and authority separately.\n\n## <a id=\"organizations\"><\/a>The Investment Organizations and Their Payments\n\nFor the money-flow example, read the chapter [Understand Funding and Control: An Investment Announcement Is Not a Budget](announcement-is-not-a-budget.html). Fund terms depend on the agreement. The waterfall, preferred-return, catch-up, clawback and subscription-line rows are explained with a worked report in [Fund Economics: Fees, Distributions and Performance Reports](fund-economics.html), which is optional depth for company leaders. [S01: SEC private equity guide](https://www.investor.gov/introduction-investing/investing-basics/investment-products/private-investment-funds/private-equity) [S02: ILPA principles](https://ilpa.org/wp-content/uploads/2019/06/ILPA-Principles-3.0_2019.pdf)\n\n| Term | Plain-language meaning |\n| --- | --- |\n| Investment firm / manager | The organization that raises and manages funds and decides investments on their behalf. It is not the fund and not the company. One firm can manage several funds. |\n| Fund | An investment vehicle with its own investors, committed capital, agreements and term. Committed capital may not yet have been paid in. The fund, not the firm, usually holds the investment. |\n| General partner (GP) | The partner with management responsibilities and powers under the fund arrangements. The term is also used informally for the manager. |\n| Limited partner (LP) | An investor in the fund under its partnership arrangements. |\n| Endowment | A pool of assets invested to support an institution, such as a university. |\n| Commitment (fund) | A fund investor’s promise to supply money under agreed conditions, drawn through capital calls. Distinct from a contractual commitment to the company (see the funding states above). |\n| Capital call | A request for a fund investor to pay part of its commitment. |\n| Investment period | The period in which a fund may make specified new investments. Agreements govern extensions and further investments. |\n| Fund term | The wider lifetime of the fund, after which it is expected to have sold its investments and distributed the proceeds. |\n| Holding company / acquisition vehicle | A company used to hold or acquire an investment. It may also borrow and have its own obligations. |\n| Portfolio / portfolio company | The collection of investments / an operating business owned wholly or partly through an investment. |\n| Management fee | A payment for managing investments under an agreed calculation. |\n| Carried interest / carry | A contractual share of investment profits allocated to the manager or other entitled recipients. It is separate from company executives’ shares. |\n| Distribution | Money or other assets paid out to fund investors. State whether a reported distribution is cash. |\n| Distribution waterfall | The order and formulas used to allocate investment payments between fund investors and the manager, applied investment by investment or to the fund as a whole, as the agreement specifies. |\n| Preferred return / hurdle | A threshold relevant to when specified profit sharing begins. It is not a guaranteed investment return. |\n| Catch-up | A rule that allocates a larger share of certain subsequent payments to a recipient after earlier conditions are met. Its rate sets how quickly the recipient reaches its agreed share; the final share is set by the agreement’s end condition and by whether enough proceeds arrive to complete the catch-up. |\n| Clawback | A requirement to return excess payments previously received, under the agreement’s conditions. |\n| Subscription line | Borrowing by a fund that can cover spending before its investors supply cash. It can change the timing of investor payments and the reported rate of return. |\n\n## <a id=\"roles\"><\/a>Roles, Authority and Sponsors\n\nThe chapters keep three questions separate: who owns shares, who is accountable for a result, and who is authorized to approve it. See the chapter [Clarify Authority: Decide Who Decides Before You Disagree](decide-who-decides.html) for authority, [Clarify the Adviser’s Role: Are They Helping, Assessing or Deciding?](investors-adviser.html) for the adviser role and [Set the Terms of Help: Agree the Work, Authority and Handover](useful-engagement.html) for sponsors of support work.\n\n| Term | Plain-language meaning |\n| --- | --- |\n| Shareholder | A holder of shares. Use this word for ownership; ownership by itself says nothing about who runs the work or who approves it. Any approval rights a shareholder holds come from the agreements, not from the shares alone. |\n| Accountable company leader | The person answerable for delivery or a result within a stated remit. Accountability and approval are related but separate: the accountable leader may decide within delegated limits and carries work whose approval sits elsewhere (in the Larkspur examples, Priya is accountable for the onboarding pilot; the board approves its expansion). Name the approver separately. Use this phrase, not “owner”, for responsibility: ask “who is accountable for this” and “who is authorized to decide”, not “who owns the decision”. |\n| Board of directors | The body overseeing a company within its authority, including approval of company plans and funding above executives’ limits. Its responsibilities differ from executives’ day-to-day management. |\n| Investment committee | The body within a fund’s arrangements authorized to approve the fund’s investments and transaction terms. It approves investments, not the company’s operating work; a company decision goes to the company’s board or executives. Its consent becomes relevant where a company decision needs a new investment from the fund, such as a bridge, or where reserved rights in the agreements say so; read those agreements rather than assuming the company label settles the approval path. |\n| CEO / CTO / CFO | Chief executive officer, leading the company; chief technology officer, leading technology; chief financial officer, leading finance. Actual duties and authority vary. |\n| CIO | Chief Information Officer: leads the enterprise information systems and their business use within the assigned remit; duties can overlap with a CTO’s. See the role comparison in [Understand Technology Operating Partners: How They Work With Your Team](tech-operating-partner.html). |\n| CPO | Chief Product Officer: leads product direction, customer priorities and product investment choices, working with engineering and other executives. Actual decision authority depends on the company’s arrangements ([Understand Technology Operating Partners: How They Work With Your Team](tech-operating-partner.html)). |\n| Chief Architect | Leads the coherence and evolution of technical architecture. The assignment establishes whether the role advises or approves designs and whether it manages people or budget ([Understand Technology Operating Partners: How They Work With Your Team](tech-operating-partner.html)). |\n| Authority | Permission to make a particular decision. It is established by an executive role, board responsibilities, rights the shareholders have agreed, an explicit assignment, or an applicable company rule or law. Influence, information access and proximity to a shareholder do not by themselves create it; an advisory role carries exactly the authority those sources grant, which is often none ([Clarify Authority: Decide Who Decides Before You Disagree](decide-who-decides.html), [Clarify the Adviser’s Role: Are They Helping, Assessing or Deciding?](investors-adviser.html)). |\n| Governance | The arrangements for making decisions and overseeing their execution: which body decides what, on what information, and how it is reviewed. |\n| Decision rights | Authority over specified decisions, such as who may approve spending above a limit. |\n| Reserved matters | Matters that require approval from a designated party, often the board or a shareholder, under the company’s agreements. |\n| Investor director | A board member appointed by an investor under the agreements. The seat is a formal right; what the director may veto or consent to depends on the reserved matters, not on the title. |\n| Operating plan | The company’s plan for a period, with its revenue, costs, headcount and initiatives. The body that approves it also approves material changes to it; spending inside it is usually delegated to executives. |\n| Funding condition | A condition attached to money: a bridge drawn only once a cost plan is adopted, a round that wants a particular executive in place. It is neither an approval right nor influence; the company meets it or does without the money ([Manage Funding Delays: Revise the Cash Plan and Commitments](anatomy-of-a-layoff.html)). |\n| Mandate | The agreed scope of investments, responsibilities or authority. State which meaning applies. |\n| Escalation | Taking an unresolved issue to someone authorized or equipped to act, through a path agreed in advance. |\n| Financial sponsor | The investment firm behind a transaction, acting for its fund. This is the usual meaning of “sponsor” in deal documents. |\n| Investor-side sponsor | The person at the investment firm who backs a particular support engagement and answers for the investor’s side of it. This book’s Tool 4 names this role explicitly. |\n| Company sponsor | The executive who backs a piece of work inside the company and answers for its use of company resources. |\n| Engagement sponsor | The person backing a support assignment. Always say whether the investor-side sponsor or the company sponsor is meant; an engagement usually needs both. |\n| Investor’s technology adviser | The general term for a person the investor uses to assess technology, product and engineering questions, before or after an investment. The role carries influence and, often, the information access the investor’s agreements already grant; it carries decision authority over company work only where the sources in the authority row grant it. Scope and resources vary by firm. |\n| Technology operating partner / technical operating partner | A senior practitioner working with an investment firm across technology assessment and operating support for its portfolio companies. The function may be internal, external or a team; company decision authority requires an explicit basis ([Understand Technology Operating Partners: How They Work With Your Team](tech-operating-partner.html)). |\n| AI operating partner | An investor-side operating specialist focused on AI-related investment questions and company capabilities. The role may be separate or combined with a technology operating partner; specialist expertise does not transfer company accountability ([Understand Technology Operating Partners: How They Work With Your Team](tech-operating-partner.html)). |\n| Technology Principal | This book’s supplied example of an investor’s technology adviser role, played by Morgan in the fictional Larkspur examples. A role description for teaching purposes, not evidence about how all advisers work. |\n| Operating team | People associated with an investment firm who help companies improve how they work. Actual services and availability vary; any authority over company decisions has to be granted, not assumed. |\n\n## <a id=\"earnings\"><\/a>Sales, Earnings and Cash\n\nThe chapter [Understand Valuation: An Estimate, Not a Fact](valuation-is-an-estimate.html) introduces the earnings calculation; the chapter [Understand Cash Flow: Confirm the Cash Before You Commit](obligations-before-budget.html) follows the payments it leaves out and builds the cash bridge. Accounting and reported adjustments need their own definitions. Whenever a chapter names a profit or cash figure, it names the measure, the scope (the consolidated group or the part attributable to particular shareholders) and the period. [S06: SEC non-GAAP guidance](https://www.sec.gov/rules-regulations/staff-guidance/corporation-finance-interpretations/non-gaap-financial-measures) [S07: IAS 38 overview](https://www.ifrs.org/issued-standards/list-of-standards/ias-38-intangible-assets/)\n\n| Term | Plain-language meaning |\n| --- | --- |\n| Revenue | Sales recognized during a period. Customer payment may occur earlier or later. |\n| Earnings / profit | Income less the costs included in a stated measure. Always name the measure, the scope and the period; an unqualified “profitable” can reverse the careful body of a report. |\n| Operating profit / operating earnings | Earnings from the business’s operations before interest, income taxes and items outside operations. The same period can show positive operating earnings and a net loss once interest and other charges are deducted ([Toys R Us: Positive Operating Earnings, Too Little Cash](toys-r-us.html)). |\n| Net profit / net loss | The final positive or negative result after the income statement’s income and charges. |\n| Consolidated / attributable | Figures for the whole group under one parent / the part of a result belonging to a specified set of shareholders after other claims. State which one a figure is. |\n| Income statement | A financial statement showing income and expenses over a period. |\n| Balance sheet | A statement of assets, liabilities and equity at a particular date. |\n| Depreciation / amortization | Charges spreading certain asset costs over time. Depreciation commonly concerns equipment; amortization commonly concerns intangible assets such as qualifying software. |\n| EBITDA | Earnings before interest, taxes, depreciation and amortization. Here taxes means income taxes. The excluded costs and other cash needs still matter. |\n| EBIT | Earnings before interest and taxes. It is not identical to every company’s reported operating-profit measure. |\n| Adjusted EBITDA | EBITDA modified by additional specified adjustments, such as removing costs presented as non-recurring. Ask which costs are excluded, whether they recur, and how the adjusted figure reconciles to the statutory result ([TeamSystem: Each New Owner Inherits Progress and Unfinished Work](teamsystem.html), [Understand Valuation: An Estimate, Not a Fact](valuation-is-an-estimate.html)). |\n| Reconciliation / financial bridge | A line-by-line calculation showing how one financial number becomes another. |\n| Margin | A stated profit measure divided by revenue. €4m of EBITDA on €20m of revenue gives a 20% EBITDA margin. |\n| Financial contribution | Revenue from an activity less the costs assigned to it, over a stated period. State those costs; the result need not equal final company profit. Use this phrase for the measure; for a causal claim say “helped produce” or “contributed to” (see causal contribution). |\n| Cash flow | Actual money received or paid during a period. |\n| Operating cash flow | Cash generated or used by operating activities under the applicable reporting rules. Check whether interest and tax are included before making further deductions. |\n| Working capital | In the book’s simplified examples, unpaid customer invoices plus inventory less amounts owed to suppliers. An increase uses cash; customer prepayments can change the pattern. Other definitions exist. |\n| Receivables / payables | Amounts customers owe the company / amounts the company owes suppliers. |\n| Capital expenditure / capex | Spending on assets, such as equipment or qualifying development. |\n| Capitalization | Recording qualifying spending as an asset, with expenses recognized over time. The cash payment still occurs. |\n| Free cash flow (FCF) | A measure of cash after specified spending. Definitions differ; check which taxes, investment and financing payments it includes. |\n| Cash conversion | A comparison of a stated cash measure with an earnings measure over the same period, for example operating cash flow divided by EBITDA. It needs explicit definitions; a business can report positive operating earnings and still run short of cash ([Toys R Us: Positive Operating Earnings, Too Little Cash](toys-r-us.html), [Understand Cash Flow: Confirm the Cash Before You Commit](obligations-before-budget.html)). |\n| Liquidity | The ability to meet payments when they fall due. A valuable or profitable company can still lack immediate cash. |\n| Debt service | Payments required to meet financing obligations, including interest and any principal due under the chosen definition. |\n| Covenant | A condition in a financing agreement. Consequences of a breach depend on the agreement and available remedies. |\n| Maturity | The date on which borrowing falls due for repayment. |\n| Refinancing | Replacing existing financing with new financing. Replacement is not assured on the previous terms. |\n| Floating-rate debt | Borrowing whose interest rate can change with a reference rate or other agreed conditions. |\n| Collateral | Assets pledged as security for borrowing. Lender rights depend on the agreement and law. |\n| Run-rate | A rate inferred from current conditions, such as turning one month’s saving into an annual estimate. It assumes those conditions continue. |\n| Realized saving | A reduction actually reflected in the relevant spending or cash measure, with scope, costs and comparison stated. |\n| Capacity benefit | Time or resources made available for other work. It becomes a cash saving only if an additional decision reduces or avoids spending. |\n| Statutory accounts / statutory result | Financial information reported under the applicable legal and accounting requirements / the profit or loss those accounts show. |\n| Pro forma | A constructed comparison showing results as if specified events had occurred at another time or under another arrangement. Read its assumptions. |\n| Organic growth | Growth within a defined business comparison, adjusted for specified changes such as acquisitions. Definitions vary; it does not isolate the effect of technology. |\n| Constant currency | A comparison adjusted to remove specified exchange-rate movements. |\n| Annual recurring revenue (ARR) | A yearly measure of recurring revenue, often used for subscriptions. Visma’s case instead uses **annualized repeatable revenue**, which also includes certain transaction revenue. Read the source definition. [S31: Visma Q4 report](https://cdn.prod.website-files.com/69787181d8720ea08c1f22fe/69787181d8720ea08c1f4589_Visma%202024%20Q4.pdf) |\n| Gross revenue retention / net revenue retention | Revenue kept from a starting customer group, excluding additional sales to that group for gross retention and including them for net retention. Define the period and treatment of losses and price changes. |\n\n## <a id=\"returns\"><\/a>Value and Investment Returns\n\nRead the chapter [Understand Investor Returns: Same Performance, Different Outcomes](three-different-returns.html) for the worked investment and [Understand Valuation: An Estimate, Not a Fact](valuation-is-an-estimate.html) for valuation techniques. The fund performance ratios (DPI, RVPI, TVPI) and gross versus net returns are worked through in [Fund Economics: Fees, Distributions and Performance Reports](fund-economics.html). [S03: Buyout overview](https://www.nber.org/system/files/working_papers/w14207/w14207.pdf) [S05: ILPA performance guidance](https://ilpa.org/industry-guidance/templates-standards-model-documents/ilpa-templates-hub/ilpa-performance-template/) [S52: IPEV valuation guidelines](https://www.privateequityvaluation.com/Portals/0/Documents/Guidelines/2025%20IPEV%20Valuation%20Guidelines.pdf)\n\n| Term | Plain-language meaning |\n| --- | --- |\n| Valuation | An estimate of value at a date and for a purpose. A reporting estimate and a negotiated purchase price can differ. |\n| Enterprise value (EV) | Value attributed to the operating business before the adjustments used to reach shareholder value. |\n| Equity value | Value attributed to shares. In the simple examples, enterprise value less net debt; actual transactions can require more adjustments. |\n| Net debt | Borrowing minus the cash included in the calculation. Transaction and lender definitions can differ. |\n| Leverage | Use of borrowing alongside equity. It can magnify gains and losses on the equity investment. |\n| Net debt to EBITDA ratio | A leverage ratio comparing net debt with a specified annual earnings measure. Gross debt is a different numerator; dates and earnings definitions also affect comparisons. |\n| Valuation multiple | Value divided by a financial measure. €60m of enterprise value divided by €4m of EBITDA gives 15×. |\n| Multiple expansion / multiple compression | A rise / fall in that ratio. Market conditions and business prospects can both contribute. |\n| Market approach / comparable multiple | Estimating value using evidence from sufficiently similar businesses or transactions. |\n| Discounted cash flow (DCF) | Estimating what expected future cash is worth today. Match the cash flows and rate to the business or ownership interest being valued. |\n| Discount rate / present value | The rate used to translate future money into today’s value / the resulting value today. The rate reflects time and risk under the model. |\n| Terminal value | The estimated value of what comes after the explicit forecast period. It still depends on future costs and investment. |\n| Asset-based valuation | Estimating value from assets and relevant obligations. Historical spending is not automatically an asset’s current value. |\n| Simple payback | Time until cumulative undiscounted benefits recover the initial spending. It does not capture all risk or benefits after that date. |\n| Investment return | A comparison of money invested with proceeds received and, where included, the value still held. Some measures also account for timing. |\n| MOIC | Multiple of invested capital. Total proceeds and any included remaining value divided by money invested. €110 received from €40 invested gives 2.75×; state whether unsold value is included. |\n| IRR | Internal rate of return. An annual rate calculated from the amounts and dates of investment payments. With one payment in and one out, it is the compound annual rate linking them. More complex payment patterns can complicate interpretation. |\n| DPI | Distributions to paid-in capital: amounts distributed divided by fund investors’ contributions. State whether distributions are cash. |\n| RVPI | Residual value to paid-in capital: the fund’s remaining net asset value at its current estimate, divided by fund investors’ contributions. An estimate, not money received. |\n| TVPI | Total value to paid-in capital: distributions plus remaining estimated value, divided by contributions. With consistent definitions, TVPI = DPI + RVPI. |\n| Gross return / net return | Return before / after specified fees and deductions. Name the investor whose return is measured and the deductions included. |\n| Retained investment value | The estimated value of the interest an investor still holds after a partial sale, or after reinvesting in a transaction. It remains a valuation until that interest is sold; a total that adds it to cash received mixes an estimate with money ([TeamSystem: Each New Owner Inherits Progress and Unfinished Work](teamsystem.html), [Fund Economics: Fees, Distributions and Performance Reports](fund-economics.html)). |\n\n## <a id=\"transactions\"><\/a>Transactions and Incentives\n\nFor examples, use the chapters [Understand Funding Choices: Match the Money to the Work](raise-what-you-need.html), [Compare Incentives and Stakes: Equity, Carry and Jobs](different-bets.html) and [Plan Acquisitions and Separations: Account for Extra Work, Not Just Expected Value](acquisition-adds-work-first.html); the chapter [Use Diligence: Correct the Plan Before It Is Signed](diligence-corrects-the-plan.html) shows a thesis being revised.\n\n| Term | Plain-language meaning |\n| --- | --- |\n| Investment thesis | The investor’s explanation of why the investment should succeed, including assumptions about price, funding and the work required. It is a revisable prediction, not an instruction to the company; diligence findings and operating results can and should change it. |\n| Underwriting | The financial and risk assessment used to justify an investment. |\n| Term sheet | A document setting out proposed transaction terms. It does not by itself establish an unconditional commitment to fund; which of its provisions bind, such as exclusivity or confidentiality, depends on the document, so distinguish those from the investment itself. |\n| Announced transaction value / received proceeds | The value stated when a deal is agreed or announced / the cash a seller has actually received after completion, adjustments and any deferred or conditional payments. An announcement alone does not establish receipt or realization: a value can be announced before or after completion, part of it can be deferred, conditional or paid in shares, and different holders receive different amounts. Say what was received, by whom and when ([TeamSystem: Each New Owner Inherits Progress and Unfinished Work](teamsystem.html)). |\n| Acquisition / buyout | Purchase of a business or interest in it / a purchase giving control. |\n| Leveraged buyout | A buyout financed with substantial debt alongside equity. |\n| Public-to-private / private-to-private | A purchase taking a publicly traded company into private ownership / a purchase of an already privately held business. |\n| Carve-out | Separation of a business from a larger owner, often requiring replacement of services the parent supplied. |\n| Turnaround | Work to restore the viability of a business in difficulty. |\n| Restructuring | Changes to operations or financing. Debt restructuring can change payment dates, rates or amounts owed. |\n| Platform company / add-on | A business used as a base for acquisitions / a business subsequently acquired and attached to it. |\n| Buy-and-build | A strategy of developing a group through repeated acquisitions. Each acquisition adds integration work before it adds benefit ([Plan Acquisitions and Separations: Account for Extra Work, Not Just Expected Value](acquisition-adds-work-first.html)). |\n| Synergy | A benefit expected from combining activities. It needs evidence and must include the cost of achieving it. |\n| Secondary transaction | A sale of an existing investment interest. Specify whether company shares, fund interests or another interest changes hands. |\n| Continuation vehicle | A new investment vehicle used to continue holding assets associated with an existing manager or fund arrangement. |\n| Exit / realization | A sale or other process through which an investor receives value and reduces or ends its investment. An announcement or partial sale is not full cash realization. |\n| Strategic buyer | An operating business buying another business for commercial reasons, such as complementary products or customers. |\n| Management rollover | Executives retaining or reinvesting an interest in the business when it is sold, rather than taking all proceeds in cash. |\n| Management equity | Company-level ownership or economic rights held by executives, such as shares or options. |\n| Option / vesting | A right to buy shares on stated terms / the conditions under which rights are earned over time or through performance. |\n| Preference | A right giving some shares priority in specified payments, such as on a sale or liquidation. The terms set the amount, order and whether the holder also shares in what remains. |\n| Dilution | Reduction in an existing holder’s percentage ownership, and possibly in its share of proceeds, when more shares or rights to shares are issued. Check whether any protection applies. |\n| Leaver provisions | Rules setting what happens to a departing participant’s shares or options, often with different outcomes for different categories of leaver. |\n| Good leaver / bad leaver | Categories in leaver provisions that decide what a departing person keeps: a good leaver, such as someone made redundant, is usually treated more generously than someone dismissed for cause. The company or board often decides the category within the plan’s rules. |\n| Assumption of debt | Taking on existing borrowing as part of a purchase. The share purchase price may exclude that amount. |\n| Writedown / impairment | Reducing an asset’s recorded value. This changes an estimate rather than making a cash payment. |\n| Dividend recapitalization | Borrowing used to pay a distribution to shareholders, leaving debt in the company or ownership structure. |\n| Chapter 11 | A US bankruptcy process that can allow continued trading while obligations are reorganized. |\n| Liquidation | Selling assets and winding down the relevant business. |\n\n## <a id=\"choosing\"><\/a>Choosing and Supporting Company Work\n\nSee the chapters [Set Priorities: You Cannot Fund Everything at Once](cannot-fund-everything.html), [Choose the Right Help: Compare Investor Support With Other Options](help-that-changes-capability.html) and [Set the Terms of Help: Agree the Work, Authority and Handover](useful-engagement.html). These terms describe the proposed working methods used in the main narrative.\n\n| Term | Plain-language meaning |\n| --- | --- |\n| Company investment | A commitment of company resources now for an expected future benefit, such as a useful product change or a stronger team capability. |\n| Team capacity | The time and capability people have available to do work. It can constrain a plan even when cash is available. |\n| Engineer-week | A planning unit representing one engineer’s working time for a week. It does not imply that people or skills are interchangeable. |\n| Opportunity cost | The benefit of the best alternative a choice gives up. |\n| Sunk cost | Resources already spent that cannot be recovered. The next decision still needs an assessment of remaining costs and benefits. |\n| Funding stage | A commitment of resources to a defined piece of work before deciding whether to commit more. |\n| Value-creation plan | A plan connecting expected benefits to work, accountable people, funding and review. Its title does not establish that the benefits occur. |\n| Peer network | Connections among people in similar roles who can exchange relevant experience; one source of help among several. |\n| Engagement | An agreed piece of support with a purpose, participants and boundaries. |\n| Capability left with the company | What the company can do on its own after support ends. It does not require internalizing every specialty; see the next row. |\n| Continuing specialist service | A specialist service the company deliberately keeps buying because owning that skill would cost more than it is worth. A legitimate outcome of an engagement when the decision is explicit and funded, not a failure of independence. |\n| Handover | Transfer of the knowledge, information, evidence and obligations needed to continue work, including at a change of ownership ([Manage the Handover: Carry Forward the Evidence and Obligations](handover-of-obligations.html)). |\n| Headcount plan | The roles a plan funds, by period, and the roles that are conditional on money or evidence not yet received. Hires outside it, and reductions to it, need whoever approves the plan ([Clarify Authority: Decide Who Decides Before You Disagree](decide-who-decides.html)). |\n| Hiring freeze | A decision to fill no new or vacant roles for a period. It saves only what would otherwise have been spent; a freeze already in force adds nothing to a later reduction. |\n| Redeployment | Moving people from work that ends or stops to work that continues, so that a gap is filled without a hire and a role is kept without a dismissal. |\n| Reduction in force (layoff, redundancy) | Ending roles, and the employment of the people in them, because the work stops or the plan can no longer fund it. Choose the roles by the work that stops; the terms and the process belong to the jurisdiction ([Manage Funding Delays: Revise the Cash Plan and Commitments](anatomy-of-a-layoff.html)). |\n| Notice period | The time between telling a person their employment ends and the end itself, set by contract or law and paid whether or not it is worked. It delays the saving from a reduction. |\n| Severance | A payment on ending employment, set by law, contract or company policy, paid before the saving from a reduction begins. |\n| Collective consultation | A legal duty, in some jurisdictions above a threshold number of dismissals counted per establishment over a stated window, to consult employee representatives before dismissals take effect; often paired with a separate duty to notify a public authority, after which a waiting period runs. The thresholds and the two duties together decide the calendar of a reduction; national law can go further than the floor a directive sets ([Manage Funding Delays: Revise the Cash Plan and Commitments](anatomy-of-a-layoff.html)). |\n| Accrued leave | Holiday or leave a person has earned but not yet taken. On leaving it is usually paid out, and counts among the one-off costs of a reduction. |\n| Fixed-term contract | Employment with an agreed end date, used in this book to retain a departing specialist for a defined piece of work. Its cost and end date belong in the cash table. |\n| Outplacement | Help with finding the next job, paid for by the employer as part of a departure package. |\n| Contingency (funded) | Money held in a plan for a stated risk and spent only if a stated trigger occurs. A contingency without a trigger, a limit and a review date is just a bigger budget. |\n| Restart rule | The single rule under which deferred spending may resume: cash received, or a conditional commitment the board has specifically authorized counting against a dated cash forecast and a funded downside ([Manage Funding Delays: Revise the Cash Plan and Commitments](the-financing-slipped.html)). |\n\n## <a id=\"technology\"><\/a>Technology and Company Work\n\nThe company-investment sequence begins at the chapters [Set Priorities: You Cannot Fund Everything at Once](cannot-fund-everything.html) and [Test Revenue Assumptions: Do Customers Respond as Expected?](roadmap-to-revenue.html); delivery measures are discussed in the chapter [Assess Capability: Can the Team Deliver?](can-the-team-deliver.html), recovery in [Build Resilience: Backups Are Not Enough](prove-you-can-restore.html) and AI in [Clarify AI Strategy: Three Different Investment Questions](ai-strategy-three-questions.html). Sources for the frameworks named below: [S13: SPACE](https://www.microsoft.com/en-us/research/publication/the-space-of-developer-productivity-theres-more-to-it-than-you-think/) [S14: DORA metrics](https://dora.dev/guides/dora-metrics/) [S16: FinOps unit economics](https://www.finops.org/framework/capabilities/unit-economics/) [S17: NIST framework](https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf) and, for the AI definition, [S63: OECD AI-system definition memorandum](https://www.oecd.org/content/dam/oecd/en/publications/reports/2024/03/explanatory-memorandum-on-the-updated-oecd-definition-of-an-ai-system_3c815e51/623da898-en.pdf).\n\n| Term | Plain-language meaning |\n| --- | --- |\n| Capability | Something the company can reliably do, such as setting up a customer or restoring a service. |\n| Roadmap | Intended product or technology changes and priorities over time. |\n| Onboarding | Setup and support needed before a new customer can use a product successfully. |\n| Operating model | How people, responsibilities, decisions, work, information and resources are arranged to carry out a strategy. The investor–company relationship and the company’s internal organization are connected design choices; see [Plan Investor Support: Match the Help to Company Priorities](operating-model-blueprints.html). |\n| Technical due diligence | Investigation of product, technology, people and risks to inform an investment decision. Its findings are observations, reported assertions and inferences; keep them apart (see the evidence section). |\n| Data room | A controlled collection of information shared for a transaction. |\n| Architecture | A system’s main parts, their responsibilities and their connections. |\n| Interface | An agreed way for parts of a system, or different systems, to exchange information. |\n| Modularity / coupling | Dividing software into parts with clear responsibilities / the degree to which parts depend on one another. |\n| Microservices | An architecture of smaller services designed to be deployed separately. Whether each service can actually be released and operated on its own depends on how it was built; coordination and operating costs apply either way. |\n| Configuration / feature flag | Settings that change behavior / a control enabling or disabling selected behavior. |\n| Deployment | Putting a software version into use. |\n| Go-live | The date a customer, or a product, starts being used in production. A promise of go-live is a delivery commitment; a contractual termination right after a later date is a separate remedy, not agreement to that date. |\n| On-call rota | The schedule of engineers on standby for production problems outside working hours. Fewer people on it means more frequent duty for each, which a reduction has to account for. |\n| End-to-end work lead time | Elapsed time from starting a change (for example, when work on it begins) to delivering it to users. Name the start and end points; it includes waiting, approvals and hand-offs. |\n| DORA change lead time | DORA’s defined measure: time from a code commit to that change running in production. Narrower than end-to-end lead time; do not use one number for both. |\n| Tenant isolation | Keeping customers’ data or workloads appropriately separated in a shared service. |\n| Technical debt | Future effort or risk from earlier technical choices or postponed work. It is a metaphor, not a literal loan balance. |\n| Engineering effectiveness | Ability to deliver useful, reliable work and sustain that ability. Activity counts alone are insufficient. |\n| SPACE | A research framework examining several dimensions of developer productivity (satisfaction, performance, activity, communication, efficiency). |\n| DORA | A research program on software delivery and organizational performance; its current guidance lists five delivery metrics. |\n| Cloud | Computing resources rented from a supplier rather than owned. |\n| Managed service | A service operated by a supplier on the customer’s behalf, such as a managed database. |\n| FinOps | Collaborative management of the financial value of technology spending, especially cloud. |\n| Unit economics | Cost or value per defined unit of useful work, such as cost per processed transaction. A lower total bill can hide a worse unit cost ([Evaluate Cloud Costs: A Lower Bill Is Not Always Better](cheaper-cloud-bill.html)). |\n| Rightsizing | Matching computing capacity to demand and service requirements. |\n| Latency | The delay before a response or result. |\n| Security | Protection of systems and data against threats. |\n| Resilience / recovery | Ability to continue or restore essential work / the work of restoring service after failure. A backup is not evidence of recovery until a restore has been tested. |\n| Recovery objective | An agreed target for how quickly service must resume and how much data may be lost; the fictional Larkspur objective is dispatch within four hours with under fifteen minutes of lost updates ([Build Resilience: Backups Are Not Enough](prove-you-can-restore.html)). |\n| Residual risk | Risk remaining after the chosen protections or actions. |\n| AI system | A machine-based system that, for explicit or implicit objectives, infers from the input it receives how to generate outputs such as predictions, content, recommendations or decisions. This covers both learned (machine-learning) and knowledge-based approaches; this book mainly discusses learning-based systems. |\n| Generative AI | AI systems whose output is new content, such as text, code or images, produced by models trained on large collections of examples. Correctness for the intended use has to be checked. |\n| Model inference | Running a trained model on new input to produce output. It is a recurring operating cost, distinct from the cost of training, licensing or buying the model. |\n| Software as a service (SaaS) | Software accessed as an ongoing subscription service run by the supplier, rather than installed and operated by the customer. |\n| Information technology (IT) | The computing systems, networks and services a company runs, and the function that runs them. |\n| Intellectual property (IP) | Legal rights concerning assets such as software, inventions, designs and brands. Who holds these rights matters in every transaction. |\n| Transition services agreement (TSA) | An agreement providing temporary services, often from a seller to a separated business. It needs a replacement plan as well as an end date. |\n| Stranded cost | A cost that remains after the activity benefiting from it has ended or moved. |\n| Nearshoring / offshoring | Nearshoring locates work in a nearby country; offshoring is the broader practice of locating work abroad. Total costs and coordination matter alongside wages. |\n\n## <a id=\"evidence\"><\/a>Evidence and Lasting Outcomes\n\nFor application, read the chapter [Success for Whom, and for How Long?](success-for-whom.html) or use [Practical Tools for Ownership and Technology Decisions](toolkit.html); the chapter [Use Diligence: Correct the Plan Before It Is Signed](diligence-corrects-the-plan.html) shows the observed / reported / inferred split in use.\n\n| Term | Plain-language meaning |\n| --- | --- |\n| Hypothesis | An explanation or expectation that evidence can support or challenge. |\n| Baseline | The starting observation used for comparison, measured before a change. |\n| Cohort | A defined group tracked over time, such as the customers onboarded in one quarter. |\n| Counterfactual | An estimate of what would have happened without the change being studied. |\n| Observation / assertion / inference | Something observed directly / a claim someone reports / a conclusion drawn from evidence and reasoning. A diligence finding should say which of the three each statement is. |\n| Attribution | Assigning an outcome to a cause. It needs a comparison, not just a sequence of events. |\n| Causal contribution | Explaining how an intervention helped produce an outcome alongside other causes. Say “helped produce” or “contributed to”; this differs from financial contribution, the measure defined above. |\n| Correlation / causation | Things changing together / one thing helping cause another. The first does not establish the second. |\n| Materiality | Importance to a decision. An important risk can remain uncertain. |\n| Confidence | Strength of the supporting evidence for a claim. |\n| Empirical research / observational research | Research using observations and data / research examining events that occurred without researchers randomly assigning the exposure. |\n| Control or comparison group | A group used to help estimate what would have happened without the event or intervention. |\n| Generalizability | How far findings can reasonably apply beyond the people, businesses or period studied. |\n| Percentage / percentage point | A relative change / an arithmetic difference between percentages. From 4% to 5% is one percentage point, or a 25% increase relative to 4%. |\n| Stakeholder | A person or group affected by the company, including those who did not choose its owner. |\n\n## <a id=\"proposed\"><\/a>Terms This Book Proposes\n\nThese are the author’s constructs, labelled as such so they are not mistaken for accounting or industry definitions.\n\n| Term | Plain-language meaning |\n| --- | --- |\n| Durable value | The author’s proposed evaluative standard: useful outcomes the company can sustain through continued investment, capability and attention to consequences for people, judged by who received the gains, who carried the costs and what the company can continue to do ([Success for Whom, and for How Long?](success-for-whom.html)). It is not an accounting measure or a guarantee. |\n| Ownership cycle | The author’s map of possible funding and ownership changes, including further rounds, refinancing, sales and continued ownership. Each can require investigation, planning and review; they need not occur in a fixed sequence. |\n| Engagement charter | The short agreement this book proposes for a support assignment: purpose, accountable company leader, investor-side sponsor, resources, information access and ending ([Set the Terms of Help: Agree the Work, Authority and Handover](useful-engagement.html)). |\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
