<script id="data" type="application/json">{"meta": {"title": "Bibliography and Evidence Guide", "date": "2026-09-12", "permalink": "bibliography", "excerpt": "Find the sources by topic or by chapter, understand what kind of evidence each provides and see the limits of what was consulted.", "logo": "assets/images/bibliography/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)", "icon": "assets/icons/bibliography.png"}, "tags": [], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **IN THIS SECTION, YOU WILL:** Learn where the book’s evidence comes from, what kind of evidence each source provides, which chapters use it and the limits of what was consulted.\n\n\n> **KEY POINTS:**\n>\n> * **Sources are listed because they were consulted.** Each entry identifies the document, the version and date consulted, the evidence type, the material limits on the reading and the chapters that cite it.\n> * **Source interests and evidence strength matter.** Company announcements, investor accounts, guidance documents and original research answer different questions and need different qualifications.\n> * **Keep evidence, proposed methods and fictional examples distinct.** The cases and studies here are evidence about what happened in particular settings; the book’s templates and worked examples are the author’s proposals.\n\n<br>\nThis page lists the sources consulted for the book. Sources were consulted between September 12 and September 16, 2026; each entry carries its own consultation date. Each entry states the version and the material consulted; access to a document does not imply that every page was reviewed, and publication dates and study periods differ from the consultation dates. Where an individual date affects how a figure or a claim should be read, the entry gives it.\n\nSource identifiers are stable. **S** marks a public source and **P** a supplied private input; the numbers identify, they do not rank. Identifiers are never reassigned, so gaps stay (there is no S38) and a citation in a chapter keeps meaning the same document. The register currently runs to S78. Private inputs are described without publishing their contents or file details.\n\n## Topic Index\n\nUse this table to find evidence by question. A source can appear under more than one topic. The chapter column names the main home of each topic; every entry below also carries a **Used in** line listing the chapters that cite it.\n\n| Topic | Identifiers | Start with |\n| --- | --- | --- |\n| Valuation, earnings measures and investor returns | S03, S04, S05, S06, S52, S53, S73, S74 | [A Valuation Is an Estimate, Not a Fact](valuation-is-an-estimate.html), [Same Company, Same Performance, Three Different Returns](three-different-returns.html), [Fund Economics: Fees, Distributions and Performance Reports](fund-economics.html) |\n| Cash, funding forms and financing documents | S01, S02, S07, S54, S55, S56, S57, S58, S59, S60, S61, S72 | [Customers, Lenders and Investors: What Each Expects in Return](customers-lenders-investors.html), [An Investment Announcement Is Not a Budget](announcement-is-not-a-budget.html), [Find the Cash Behind Your Technology Budget](obligations-before-budget.html) |\n| Governance, rights and incentives | S01, S02, S04, S61, S76 | [Decide Who Decides, Before You Disagree](decide-who-decides.html), [Management Equity, Fund Carry and Employee Jobs Are Different Bets](different-bets.html), [Fix the Decision Problem Before Adding People](fix-decisions-before-hiring.html) |\n| Workforce reductions and employment process | S77, S78 | [When the Headcount Plan Shrinks](headcount-plan-shrinks.html) |\n| Delivery, architecture and cloud cost | S13, S14, S15, S16, S53, S75 | [Can the Software and the Team Deliver What Was Promised?](can-the-team-deliver.html), [The Chain From Roadmap to Revenue Breaks Easily](roadmap-to-revenue.html), [Why a Cheaper Cloud Bill Can Be Bad News](cheaper-cloud-bill.html) |\n| Security and resilience | S17 | [Prove You Can Restore, Not Just That You Back Up](prove-you-can-restore.html) |\n| AI evidence | S18, S19, S20, S21, S63 | [An AI Strategy Hides Three Investment Questions](ai-strategy-three-questions.html) |\n| Investor support and advisers | S22, P01, P02 | [Is the Investor’s Adviser Helping, Assessing or Deciding?](investors-adviser.html), [Find the Help That Changes What Your Team Can Do](help-that-changes-capability.html) |\n| Case: Hilton and Skype | S23, S24, S25, S26, S27, S28, S29, S64, S65 | [Hilton and Skype: A Successful Exit Still Needs Explaining](hilton-and-skype.html) |\n| Case: Visma | S30, S31, S32, S33, S43, S44, S62 | [Visma: Continuity of Manager Is Not Continuity of Money](visma.html) |\n| Case: Toys R Us | S34, S35, S36, S37, S40, S41, S50, S51 | [Toys R Us: Positive Operating Earnings, Too Little Cash](toys-r-us.html) |\n| Case: TeamSystem | S45, S46, S47, S48, S49, S66, S67, S68, S69, S70, S71 | [TeamSystem: Each New Owner Inherits Progress and Unfinished Work](teamsystem.html) |\n| Wider research on ownership outcomes | S08, S09, S10, S11, S12, S39, S42 | [Success for Whom, and for How Long?](success-for-whom.html) |\n\nThe historical cases and the outcome research concern private equity. Venture, expansion and corporate funding are supported by institutional guidance (S58–S61) and introductory regulator material (S54–S57), which describe funding forms and the existence of distinct venture financing documents. Those sources support the book’s financial orientation; they do not establish comparative investor performance, and they are not additional case studies. Comparisons across ownership models elsewhere in the book use explicitly fictional scenarios and the author’s reasoning about stated constraints. Transferring a question about funding, rights or capacity to another ownership model is different from transferring a causal finding.\n\n## How to Read and Use an Entry\n\nEach entry has the same parts.\n\n- **Citation line** — author or organization, title, link, and the version or date consulted. Where the version matters (a working paper against a journal version, a revised estimate, a living web page), the entry says which one the book uses. **DOI** is a persistent identifier used for many research publications.\n- **Evidence type** — what kind of document it is. A company filing records reported information under a formal disclosure process. A company or investor account describes its own actions and may favor its own interpretation. A research study investigates a question using a stated method; its findings hold within its sample, period and design. A guidance document recommends or explains a practice; it does not show that every company follows it.\n- **Consulted scope** — what was actually examined: a whole short page, selected pages or sections, or only an abstract (the short summary at the start of a research paper). Limits specific to the source, such as partial access or a contradictory date inside the document, stay attached to the entry.\n- **Used in** — the chapters that cite the entry by its identifier, so a reader can move from a source to the argument it supports and back.\n\nThree general rules apply to every entry and are stated once here. Treat reported financial figures as figures under the named source’s period and definitions. Treat company and investor statements as accounts by interested parties. Treat empirical findings within their sample and design; historical studies and current technology experiments answer different questions. When a chapter draws an inference, the cited document supports its premises; it does not necessarily make or validate that inference.\n\nFor a first reading, follow the citations attached to the chapter you are studying and return here for a source’s date, scope or limits. Technical vocabulary is explained in [Glossary](glossary.html).\n\n## Proposed Methods and Empirical Evidence\n\nThe book contains two kinds of material, and this register supports them differently. The historical cases, filings and research studies are evidence about what happened in particular settings, within the limits each entry states. The templates, checklists, fictional calculations, the Larkspur examples and the Technology Principal example role are proposed methods: the author’s reasoning about how to work under the conditions the evidence describes. No source on this page validates those methods. The studies were not designed to test them, the guidance documents describe practices rather than measure their effect, and the private inputs supply ideas rather than operating results. Judge a method by whether it fits your decision, not by the citations near it.\n\n## Evidence Used Versus Further Reading\n\nThe main chapters end with a “To Probe Further” list; the reading guide, the part introductions and the reference pages do not. Those lists are optional reading, chosen to help a reader go deeper on the chapter’s subject. Their one-sentence annotations were checked for scope, meaning that the description stays within what the resource covers. They are not part of this consulted-evidence register unless the same resource also carries an S identifier, and a chapter’s argument does not rest on them. Listing a resource there does not mean the author consulted it for the book’s claims. Where a chapter’s claim depends on a source, that source is cited inline with an S or P identifier and appears below.\n\nOne annotation carries a figure precise enough to need its version stated. [A Valuation Is an Estimate, Not a Fact](valuation-is-an-estimate.html) cites Gornall and Strebulaev on unicorn valuations and says reported post-money valuations averaged “about 50%” above the authors’ modeled fair values. That is the figure in the [2017 NBER working paper](https://www.nber.org/papers/w23895), which reports an average of 50% above fair value with 15 of the 135 US unicorns more than 100% above. The version published in the *Journal of Financial Economics* 135(1), 2020, pp. 120–143 reports 48%, with 14 more than 100% above. The chapter links the working paper and names the journal version, and “about 50%” covers both estimates; the direction is the source’s own. Reported values average roughly half again above modeled fair value, which is not the same statement as fair values being 50% below reported values, and an average ratio cannot be inverted to obtain the average of the reverse ratio.\n\n## Public Evidence\n\n### S01 — SEC investor guide\n\nU.S. Securities and Exchange Commission, Investor.gov. [Private Equity Funds](https://www.investor.gov/introduction-investing/investing-basics/investment-products/private-investment-funds/private-equity). Undated; accessed 2026-09-12.\n\n**Evidence type:** Regulator education. **Consulted scope:** Guide consulted for fund structure, investment forms, illiquidity, and investor considerations. An introduction, not a particular fund agreement. Rechecked September 13, 2026 for the distinction between controlling and minority investment strategies.\n\n**Used in:** [Customers, Lenders and Investors: What Each Expects in Return](customers-lenders-investors.html), [An Investment Announcement Is Not a Budget](announcement-is-not-a-budget.html), [Fund Economics: Fees, Distributions and Performance Reports](fund-economics.html), [Glossary](glossary.html).\n\n### S02 — ILPA principles\n\nInstitutional Limited Partners Association (ILPA). [ILPA Principles 3.0: Fostering Transparency, Governance and Alignment of Interests for General and Limited Partners](https://ilpa.org/wp-content/uploads/2019/06/ILPA-Principles-3.0_2019.pdf). June 2019.\n\n**Evidence type:** LP industry guidance. **Consulted scope:** Selected sections on alignment, economics, governance, transparency, and continuation transactions. An LP perspective and voluntary principles, not law or proof of universal practice.\n\n**Used in:** [An Investment Announcement Is Not a Budget](announcement-is-not-a-budget.html), [Management Equity, Fund Carry and Employee Jobs Are Different Bets](different-bets.html), [Judge an Investor by Their Behavior Under Pressure](investor-under-pressure.html), [Hand Over the Obligations, Not Just the Company](handover-of-obligations.html), [Glossary](glossary.html).\n\n### S03 — Kaplan and Strömberg\n\nSteven N. Kaplan and Per Strömberg. [Leveraged Buyouts and Private Equity](https://www.nber.org/system/files/working_papers/w14207/w14207.pdf). July 2008; NBER Working Paper 14207.\n\n**Evidence type:** Academic synthesis. **Consulted scope:** Abstract, introduction, and selected discussion of mechanisms consulted. Cite this working-paper version; a journal version appeared in 2009. DOI: 10.3386/w14207. Historical evidence does not establish current market averages.\n\n**Used in:** [Same Company, Same Performance, Three Different Returns](three-different-returns.html), [Glossary](glossary.html).\n\n### S04 — PE practitioner survey\n\nPaul Gompers, Steven N. Kaplan, and Vladimir Mukharlyamov. [What Do Private Equity Firms Say They Do?](https://www.nber.org/papers/w21133). April 2015; NBER Working Paper 21133.\n\n**Evidence type:** Original survey research. **Consulted scope:** Working-paper abstract and indexed overview consulted, not the full underlying survey dataset. Self-reported practices of 79 firms; not independent verification of their performance. DOI: 10.3386/w21133.\n\n**Used in:** [Match the Funding to the Work](raise-what-you-need.html), [Decide Who Decides, Before You Disagree](decide-who-decides.html).\n\n### S05 — ILPA performance guidance\n\nInstitutional Limited Partners Association (ILPA). [ILPA Performance Template](https://ilpa.org/industry-guidance/templates-standards-model-documents/ilpa-templates-hub/ilpa-performance-template/). 2025 release; living guidance accessed 2026-09-12.\n\n**Evidence type:** Industry methodology. **Consulted scope:** Template landing page and January 22, 2025 launch announcement consulted for scope and methodology. The manuscript's simplified calculations are its own examples, not claims of completed template compliance.\n\n**Used in:** [Fund Economics: Fees, Distributions and Performance Reports](fund-economics.html), [Glossary](glossary.html).\n\n### S06 — SEC non-GAAP guidance\n\nU.S. Securities and Exchange Commission, Division of Corporation Finance. [Non-GAAP Financial Measures: Compliance and Disclosure Interpretations](https://www.sec.gov/rules-regulations/staff-guidance/corporation-finance-interpretations/non-gaap-financial-measures). Living page; interpretation 103.01 dated January 11, 2010, and 103.02 dated May 17, 2016; accessed September 12, 2026 and rechecked September 13, 2026.\n\n**Evidence type:** Regulator staff guidance. **Consulted scope:** Relevant EBITDA and adjusted-measure interpretations consulted. US disclosure context; not a universal accounting definition for every private company.\n\n**Used in:** [Find the Cash Behind Your Technology Budget](obligations-before-budget.html), [A Valuation Is an Estimate, Not a Fact](valuation-is-an-estimate.html), [Glossary](glossary.html).\n\n### S07 — IAS 38 overview\n\nIFRS Foundation. [IAS 38: Intangible Assets](https://www.ifrs.org/issued-standards/list-of-standards/ias-38-intangible-assets/). Undated standard overview; accessed 2026-09-12.\n\n**Evidence type:** Accounting standard issuer. **Consulted scope:** Public overview consulted for research expense and development recognition criteria. The overview was rechecked on September 13, 2026 to clarify that recognition criteria determine the treatment. The complete standard and any particular company's application were not audited.\n\n**Used in:** [Find the Cash Behind Your Technology Budget](obligations-before-budget.html), [Glossary](glossary.html).\n\n### S08 — Davis et al., 2024 revision\n\nSteven J. Davis, John Haltiwanger, Kyle Handley, Ben Lipsius, Josh Lerner, and Javier Miranda. [The (Heterogeneous) Economic Effects of Private Equity Buyouts](https://www.nber.org/system/files/working_papers/w26371/w26371.pdf). October 2019; revised April 2024; NBER Working Paper 26371.\n\n**Evidence type:** Original empirical research. **Consulted scope:** Revised PDF abstract, introduction, design, and selected results consulted. US buyouts over 1980–2013; transaction types differ. Use the April 2024 estimates, not the earlier digest's figures. DOI: 10.3386/w26371.\n\n**Used in:** [Success for Whom, and for How Long?](success-for-whom.html).\n\n### S09 — Davis et al., jobs study\n\nSteven J. Davis, John C. Haltiwanger, Kyle Handley, Ron S. Jarmin, Josh Lerner, and Javier Miranda. [Private Equity, Jobs, and Productivity](https://www.nber.org/papers/w19458). September 2013; NBER Working Paper 19458.\n\n**Evidence type:** Original empirical research. **Consulted scope:** Abstract and indexed study description consulted for the distinction between establishment and firm outcomes; full tables were not reanalyzed. Journal version published in 2014. DOI: 10.3386/w19458.\n\n**Used in:** [Success for Whom, and for How Long?](success-for-whom.html).\n\n### S10 — Bernstein et al., crisis study\n\nShai Bernstein, Josh Lerner, and Filippo Mezzanotti. [Private Equity and Financial Fragility during the Crisis](https://www.nber.org/system/files/working_papers/w23626/w23626.pdf). July 2017; NBER Working Paper 23626.\n\n**Evidence type:** Original empirical research. **Consulted scope:** PDF abstract, introduction, sample and selected mechanism discussion consulted. UK financial-crisis setting and matched observational design limit generalization. Journal version appeared in 2019. DOI: 10.3386/w23626.\n\n**Used in:** [Find the Cash Behind Your Technology Budget](obligations-before-budget.html), [Success for Whom, and for How Long?](success-for-whom.html).\n\n### S11 — Gupta et al., nursing homes\n\nAtul Gupta, Sabrina T. Howell, Constantine Yannelis, and Abhinav Gupta. [Owner Incentives and Performance in Healthcare: Private Equity Investment in Nursing Homes](https://www.nber.org/system/files/working_papers/w28474/w28474.pdf). February 2021; revised August 2023; NBER Working Paper 28474.\n\n**Evidence type:** Original empirical research. **Consulted scope:** Revised PDF abstract, introduction, identification discussion, and selected results consulted. Short-stay Medicare patient population and identification assumptions are material. Not a claim about every care setting. DOI: 10.3386/w28474.\n\n**Used in:** [Success for Whom, and for How Long?](success-for-whom.html).\n\n### S12 — Kannan et al., adverse events\n\nSneha Kannan, Joseph Dov Bruch, and Zirui Song. [Changes in Hospital Adverse Events and Patient Outcomes Associated With Private Equity Acquisition](https://jamanetwork.com/journals/jama/fullarticle/2813379). December 26, 2023; JAMA 330(24):2365–2375.\n\n**Evidence type:** Peer-reviewed original research. **Consulted scope:** Methods, results, and relevant table consulted. Difference-in-differences comparison of acquired and control hospitals; associations, patient composition, and study period matter. DOI: 10.1001/jama.2023.23147.\n\n**Used in:** [Success for Whom, and for How Long?](success-for-whom.html).\n\n### S13 — SPACE framework\n\nNicole Forsgren, Margaret-Anne Storey, Chandra Maddila, Tom Zimmermann, Brian Houck, and Jenna Butler. [The SPACE of Developer Productivity: There's More to It Than You Think](https://www.microsoft.com/en-us/research/publication/the-space-of-developer-productivity-theres-more-to-it-than-you-think/). February 2021; ACM Queue 19(1):20–48.\n\n**Evidence type:** Original research framework. **Consulted scope:** Author-hosted publication page and abstract consulted; ACM page was inaccessible. Supports a multidimensional productivity frame, not a formula assigning economic value to each dimension.\n\n**Used in:** [Can the Software and the Team Deliver What Was Promised?](can-the-team-deliver.html), [Glossary](glossary.html).\n\n### S14 — DORA metrics guide\n\nDORA. [DORA's Software Delivery Performance Metrics](https://dora.dev/guides/dora-metrics/). Living guide; accessed September 12, 2026.\n\n**Evidence type:** Original practitioner research guidance. **Consulted scope:** Current guide consulted. Metric definitions have evolved; this draft notes five current delivery-performance metrics rather than treating the historical four as timeless.\n\n**Used in:** [Can the Software and the Team Deliver What Was Promised?](can-the-team-deliver.html), [Glossary](glossary.html).\n\n### S15 — DORA 2024 report\n\nDORA / Google Cloud. [2024 Accelerate State of DevOps Report](https://dora.dev/research/2024/dora-report/). 2024.\n\n**Evidence type:** Original industry survey. **Consulted scope:** Report landing page, findings summary, and errata consulted; no independent reanalysis of the full survey. Associations support questions about operating conditions, not automatic causal or financial claims.\n\n**Used in:** [The Chain From Roadmap to Revenue Breaks Easily](roadmap-to-revenue.html), [Fix the Decision Problem Before Adding People](fix-decisions-before-hiring.html).\n\n### S16 — FinOps unit economics\n\nFinOps Foundation. [Unit Economics](https://www.finops.org/framework/capabilities/unit-economics/). Living framework capability; accessed September 12, 2026.\n\n**Evidence type:** Practitioner framework. **Consulted scope:** Capability guidance consulted for connecting cost with business units and value. All manuscript euro examples are fictional calculations.\n\n**Used in:** [Why a Cheaper Cloud Bill Can Be Bad News](cheaper-cloud-bill.html), [Glossary](glossary.html).\n\n### S17 — NIST CSF 2.0\n\nNational Institute of Standards and Technology (NIST). [The NIST Cybersecurity Framework (CSF) 2.0](https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf). February 26, 2024; NIST CSWP 29.\n\n**Evidence type:** Government framework. **Consulted scope:** Framework overview, functions, governance, and implementation orientation consulted. A structure for risk management, not evidence that adopting it eliminates incidents. DOI: 10.6028/NIST.CSWP.29.\n\n**Used in:** [Prove You Can Restore, Not Just That You Back Up](prove-you-can-restore.html), [Glossary](glossary.html).\n\n### S18 — NIST generative AI profile\n\nChloe Autio, Reva Schwartz, Jesse Dunietz, Shomik Jain, Martin Stanley, Elham Tabassi, Patrick Hall, and Kamie Roberts; NIST. [Artificial Intelligence Risk Management Framework: Generative Artificial Intelligence Profile](https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf). July 26, 2024; NIST AI 600-1.\n\n**Evidence type:** Government framework. **Consulted scope:** Risk categories and management orientation consulted. Applies as a question structure; no claim of certification or quantified loss reduction. DOI: 10.6028/NIST.AI.600-1.\n\n**Used in:** [An AI Strategy Hides Three Investment Questions](ai-strategy-three-questions.html).\n\n### S19 — Peng et al., Copilot experiment\n\nSida Peng, Eirini Kalliamvakou, Peter Cihon, and Mert Demirer. [The Impact of AI on Developer Productivity: Evidence from GitHub Copilot](https://arxiv.org/abs/2302.06590). February 13, 2023; arXiv:2302.06590.\n\n**Evidence type:** Original controlled experiment. **Consulted scope:** Original abstract and task description consulted. A recheck on September 13, 2026 covered the [study design and results](https://arxiv.org/html/2302.06590v1): the experiment ran in 2022, and the 55.8% figure is a reduction in average completion time among those who completed the task. The bounded task, tool generation and industry affiliations limit interpretation.\n\n**Used in:** [An AI Strategy Hides Three Investment Questions](ai-strategy-three-questions.html).\n\n### S20 — METR early-2025 experiment\n\nMETR. [Measuring the Impact of Early-2025 AI on Experienced Open-Source Developer Productivity](https://metr.org/blog/2025-07-10-early-2025-ai-experienced-os-dev-study/). July 10, 2025.\n\n**Evidence type:** Original randomized experiment report. **Consulted scope:** Study report, setting, headline result, and limits consulted. Experienced developers on familiar repositories; not every developer, task, or later model.\n\n**Used in:** [An AI Strategy Hides Three Investment Questions](ai-strategy-three-questions.html).\n\n### S21 — METR 2026 update\n\nJoel Becker, Nate Rush, Tom Cunningham, David Rein, and Khalid Mahamud; METR. [We Are Changing Our Developer Productivity Experiment Design](https://metr.org/blog/2026-02-24-uplift-update/). February 24, 2026.\n\n**Evidence type:** Original research update. **Consulted scope:** Full update consulted. Selection and participation changes undermine a simple interpretation of later speed estimates; the chapter does not present those estimates as a settled current effect.\n\n**Used in:** [An AI Strategy Hides Three Investment Questions](ai-strategy-three-questions.html).\n\n### S22 — KKR Capstone description\n\nKKR. [Capstone](https://www.kkr.com/approach/capstone). Undated capability page; accessed September 12, 2026.\n\n**Evidence type:** Interested practitioner account. **Consulted scope:** Operating-support description consulted. Evidence of a stated offering and collaboration model; no causal attribution of returns or universal role charter. Rechecked September 13, 2026 for the investor-support chapters: management collaboration, specialist and partner networks, technology, growth and people support.\n\n**Used in:** [Decide Who Decides, Before You Disagree](decide-who-decides.html), [Judge an Investor by Their Behavior Under Pressure](investor-under-pressure.html), [Find the Help That Changes What Your Team Can Do](help-that-changes-capability.html).\n\n### S23 — Hilton registration filing\n\nHilton Worldwide Holdings Inc. [Form S-1 Registration Statement](https://www.sec.gov/Archives/edgar/data/1585689/000119312513364703/d593452ds1.htm). September 12, 2013.\n\n**Evidence type:** Company regulatory filing. **Consulted scope:** Prospectus business/commercial-services discussion, debt restructuring, and selected operating comparisons consulted. Financial disclosures and management narratives have different evidentiary roles; not a full independent audit of the filing.\n\n**Used in:** [Hilton and Skype: A Successful Exit Still Needs Explaining](hilton-and-skype.html).\n\n### S24 — Blackstone 2018 investor call\n\nThe Blackstone Group L.P. [Second Quarter 2018 Earnings Investor Call](https://ir.blackstone.com/files/doc_events/BLACKSTONE-Second-Quarter-2018-Earnings-Investor-Call.pdf). July 19, 2018.\n\n**Evidence type:** Interested investor account. **Consulted scope:** Hilton realization discussion consulted for sponsor-reported 3.1× multiple and $14 billion profit. Not an independently reconstructed net LP cash-flow series.\n\n**Used in:** [Hilton and Skype: A Successful Exit Still Needs Explaining](hilton-and-skype.html), [Hand Over the Obligations, Not Just the Company](handover-of-obligations.html).\n\n### S25 — PEI Hilton retrospective\n\nPrivate Equity International. [North American Exit of the Year: Blackstone for Hilton Hotels](https://www.blackstone.com/wp-content/uploads/sites/2/2019/03/pei_blackstone_hilton.pdf). 2019, reporting the 2018 awards; exact publication day unverified.\n\n**Evidence type:** Industry journalism / award retrospective. **Consulted scope:** Retrospective consulted for the initial transaction and ownership narrative. Sponsor-hosted award coverage has selection and promotional context; triangulated with the Hilton filing where possible.\n\n**Used in:** [Hilton and Skype: A Successful Exit Still Needs Explaining](hilton-and-skype.html).\n\n### S26 — eBay Skype sale announcement\n\neBay Inc. [eBay Inc. Completes Sale of Skype](https://investors.ebayinc.com/investor-news/press-release-details/2009/EBay-Inc-Completes-Sale-of-Skype/default.aspx). November 19, 2009.\n\n**Evidence type:** Company transaction announcement. **Consulted scope:** Completion, valuation, retained stake, and consideration description consulted. Does not supply the buyer consortium's complete equity cash flows.\n\n**Used in:** [Hilton and Skype: A Successful Exit Still Needs Explaining](hilton-and-skype.html).\n\n### S27 — Skype registration filing\n\nSkype S.à r.l., to be converted into Skype S.A. [Amendment No. 3 to Form S-1 Registration Statement](https://www.sec.gov/Archives/edgar/data/1498209/000119312511096544/ds1a.htm). April 13, 2011; SEC registration 333-168646.\n\n**Evidence type:** Company regulatory filing. **Consulted scope:** Prospectus summary pp. 1–4, recent developments, intellectual-property settlement, selected financial data and financing discussion consulted. Pro forma periods, adjusted EBITDA, and management claims require care.\n\n**Used in:** [An Acquisition Adds Work Before It Adds Value](acquisition-adds-work-first.html), [Diligence Is Your Chance to Correct the Plan Before It Is Signed](diligence-corrects-the-plan.html), [Hilton and Skype: A Successful Exit Still Needs Explaining](hilton-and-skype.html).\n\n### S28 — Microsoft Skype completion\n\nMicrosoft. [Microsoft Officially Welcomes Skype](https://news.microsoft.com/source/2011/10/13/microsoft-officially-welcomes-skype/). October 13, 2011.\n\n**Evidence type:** Buyer announcement. **Consulted scope:** Completion announcement and May 10, 2011 acquisition announcement consulted. The former states completion and recounts the announced $8.5 billion transaction; neither establishes fund-level net returns.\n\n**Used in:** [Hilton and Skype: A Successful Exit Still Needs Explaining](hilton-and-skype.html).\n\n### S29 — Microsoft Skype retirement\n\nMicrosoft Support. [Skype Is Retiring in May 2025: What You Need to Know](https://support.microsoft.com/en-us/skype/22ccebb6-0cf9-4e1d-916f-aaf978e1b129). Living support page; retirement event May 5, 2025; accessed September 12, 2026.\n\n**Evidence type:** Product owner ** Announcement consulted for acquisition, R&D, and operating-model claims. Not a claim to have read both complete annual and sustainability reports or independently verified their impact.\n\n**Used in:** [Visma: Continuity of Manager Is Not Continuity of Money](visma.html).\n\n### S33 — Visma current financials page\n\nVisma. [Financial Results](https://www.visma.com/investors/financials). Living page; accessed September 12, 2026.\n\n**Evidence type:** Company financial presentation. **Consulted scope:** Financials landing page inspected September 12, 2026. Its rounded EUR 904 million adjusted EBITDA for 2024 is reconciled using S43–S44: EUR 892.646 million EBITDA plus EUR 11.665 million M&A expenses equals EUR 904.311 million adjusted EBITDA. The page is a current presentation of historical figures, not a new operating result.\n\n**Used in:** [Visma: Continuity of Manager Is Not Continuity of Money](visma.html).\n\n### S34 — Toys R Us annual filing excerpts\n\nToys R Us, Inc. [Form 10-K for Fiscal Year Ended January 28, 2017](https://www.sec.gov/Archives/edgar/data/1005414/000100541417000011/tru201610k.htm). 2017 filing; fiscal 2016.\n\n**Evidence type:** Company regulatory filing; partial access. **Consulted scope:** Only indexed excerpts concerning the e-commerce platform and risk were consulted. Full-page browser and download attempts failed with access errors. Do not treat this as a full 10-K review; financial table claims use S35 instead. A second attempt at complete access through the SEC and mirrors, also on September 12, 2026, did not obtain the full document; the access limit remains. S50 supplies separately consulted primary court evidence, not a substitute claim that this full 10-K was read.\n\n**Used in:** [Toys R Us: Positive Operating Earnings, Too Little Cash](toys-r-us.html).\n\n### S35 — Toys R Us fiscal 2016 results\n\nToys R Us, Inc. [Toys R Us, Inc. Reports Results for the Full Year and Fourth Quarter of Fiscal 2016](https://www.sec.gov/Archive ortfolio case; historical 2000–2004 account; accessed September 12, 2026.\n\n**Evidence type:** Interested investor retrospective. **Consulted scope:** Case page read. Regional-company context, management and investment claims, exit scale and reported 4.1x investment multiple consulted. Header says December 2000 exit while narrative says December 2004; the latter is supported by Bain’s account in S47. Undefined “profitability” figure is not relabeled EBITDA. No independently reconstructed investor return or employee outcome.\n\n**Used in:** [TeamSystem: Each New Owner Inherits Progress and Unfinished Work](teamsystem.html).\n\n### S46 — TeamSystem acquisition announcement\n\nHgCapital / HgCapital Trust plc. [HgCapital acquires TeamSystem, the leading provider of regulatory-driven SMB business software in Italy](https://www.hgcapitaltrust.com/news-insights/news/archive/08032010). August 3, 2010.\n\n**Evidence type:** Investor transaction announcement. **Consulted scope:** Announcement read for agreed majority acquisition, stated EUR 565 million enterprise value and 11.3x FY2010 EBITDA, thesis and expected September completion. Wording mixes agreement and acquisition language; manuscript treats the terms as announced rather than audited closing amounts. Present webpage contains some apparent company-name substitutions; no altered quotations reproduced.\n\n**Used in:** [TeamSystem: Each New Owner Inherits Progress and Unfinished Work](teamsystem.html).\n\n### S47 — TeamSystem sale announcement\n\nHgCapital / HgCapital Trust plc; statements from transaction participants. [HgCapital announces sale of TeamSystem](https://www.hgcapitaltrust.com/news-insights/news/archive/12072015). December 7, 2015.\n\n**Evidence type:** Investor transaction announcement. **Consulted scope:** Agreement to sell to Hellman & Friedman, retained minority investment and participant accounts consulted. Bain’s statement places its initial acquisition in 2004. The announcement anticipated 2016 completion; subsequent S48 supplies completion evidence. Interested parties’ descriptions are not independent causal evaluation.\n\n**Used in:** [TeamSystem: Each New Owner Inherits Progress and Unfinished Work](teamsystem.html).\n\n### S48 — HgCapital Trust 2015 results\n\nHgCapital Trust plc / HgCapital. [2015 Full Year Results Presentation](https://www.hgcapitaltrust.com/~/media/Files/H/Hgcapital-Trust-V2/documents/investors/financial-calendar/hgcapitaltrust-dec-2015-general.pdf). March 2016; results presentation for year ended December 31, 2015, including subsequent events.\n\n**Evidence type:** Listed investment trust / manager results presentation. **Consulted scope:** Selected portfolio context, TeamSystem case on p. 14 and subsequent-event summary on p. 17 read. Presentation reports 2016 completion, GBP 39 million Trust cash proceeds, GBP 6.1 million retained value and a 1.8x return. Product, pricing, collection, M&A and refinancing claims are the manager’s. No full investor cash-flow reconstruction or inference of net LP return; presentation itself refers readers to the full annual report.\n\n**Used in:** [TeamSystem: Each New Owner Inherits Progress and Unfinished Work](teamsystem.html).\n\n### S49 — TeamSystem 2017 consolidated report\n\nTeamSystem Holding S.p.A. and subsidiaries. [Consolidated Financial Statements as at and for the year ended 31 December 2017 of TeamSystem Group](https://www.teamsystem.com/media/files/865_Consolidated%20Financial%20Statements%20as%20at%20and%20for%20the%20year%20ended%2031%20December%202017%20of%20TeamSystem%20Group.pdf). February 28, 2018, directors’ signature; reporting year ended December 31, 2017.\n\n**Evidence type:** Company consolidated financial statements and directors’ report. **Consulted scope:** Full 87-page PDF obtained and text extracted; selected directors’ report, 2016 comparability explanation, statements, earnings reconciliation, development spending, acquisitions and financing notes read. Cited page numbers use PDF display pages: 9–15, 23, 26, 45 and 48–49. The consolidated statement of cash flows (p. 26) and Notes 7, 8 and 10 (pp. 48–49) were read for the distinction between the accounting charge and the cash paid: Note 8 reports finance costs of €79.674 million and Note 7 finance income of €7.618 million, while Note 10 states that €52.1 million of finance costs was paid during 2017, including €49.8 million of interest on the notes (€13.5 million on the €150 million senior notes and €36.3 million on the €570 million senior secured notes) and €1.9 million mainly of other interest and bank charges. Interest paid is not shown on the face of the cash-flow statement; its financing line nets those payments against new borrowing, which is why Note 10 is required. Scanned auditor-opinion page 84 visually inspected: Deloitte opines on the consolidated statements under EU-adopted IFRS, not on causal sponsor contribution or every management claim. Statutory 2016 operations cover March–December; pro forma income comparisons also adjust acquisition scope. Capitalized-development comparative is ten months and must not be described as matched annual growth.\n\n**Used in:** [TeamSystem: Each New Owner Inherits Progress and Unfinished Work](teamsystem.html).\n\n### S50 — Brandon first-day declaration\n\nDavid A. Brandon, Chairman and Chief Executive Officer of Toys “R” Us, Inc. [Declaration in support of Chapter 11 petitions and first day motions](https://profhayesuwla.com/wp-content/uploads/2017/09/toys-r-us-first-day-dec-chairman.pdf). Filed September 19, 2017; U.S. Bankruptcy Court, Eastern District of Virginia, case 17-34665-KLP, document 20.\n\n**Evidence type:** Primary court-filed debtor declaration, public document mirror. **Consulted scope:** Complete 47-page stamped filing obtained and text extracted. Selected paragraphs 10–12, 19–32, 53–55, 60, 74 and 91–95 consulted for debt, maturities, supplier terms, technology constraints and proposed investment. Sworn management account supporting an application, not a court finding of causation. Funding table is a September 2017 snapshot, not a reconstructed 2005 sources-and-uses statement. Future project spending is a plan, not a realized result.\n\n**Used in:** [Toys R Us: Positive Operating Earnings, Too Little Cash](toys-r-us.html).\n\n### S51 — Hasbro 2018 annual report\n\nHasbro, Inc. [2018 Annual Report, including Form 10-K for the year ended December 30, 2018](https://www.annualreports.com/HostedData/AnnualReportArchive/h/NYSE_HAS_2018.pdf). 2019; fiscal year ended December 30, 2018.\n\n**Evidence type:** Supplier annual report and financial statements, public report mirror. **Consulted scope:** Full report obtained and text extracted; selected management discussion, segment results, operating expenses and receivables note consulted. Printed pp. 38 and 67 support USD 60.4 million related costs and approximately USD 49 million bad-debt expense respectively; the latter is included, not additive. Separate supplier-side evidence, but Hasbro is an interested participant. Its overall revenue/profit change has other causes; these costs do not measure all supplier or social losses.\n\n**Used in:** [Toys R Us: Positive Operating Earnings, Too Little Cash](toys-r-us.html).\n\n### S52 — IPEV valuation guidelines\n\nInternational Private Equity and Venture Capital Valuation Board (IPEV). [International Private Equity and Venture Capital Valuation Guidelines](https://www.privateequityvaluation.com/Portals/0/Documents/Guidelines/2025%20IPEV%20Valuation%20Guidelines.pdf). December 2025; issuer states publication December 11, 2025; effective for quarterly reporting periods beginning on or after April 1, 2026.\n\n**Evidence type:** Industry valuation guidance. **Consulted scope:** Issuer landing page and selected primary PDF sections consulted: introduction, technique selection, revenue/earnings multiples, comparability, DCF and net assets (sections 3.1–3.9; especially pp. 21–25, 29 and 34–37). A recheck on September 13, 2026 additionally covered the enterprise-to-equity adjustments, surplus cash and debt treatment on sale. Not every application section was reviewed. This is fair-value reporting guidance, not a negotiated transaction price, legal standard or prescription for business strategy and architecture.\n\n**Used in:** [A Valuation Is an Estimate, Not a Fact](valuation-is-an-estimate.html), [Glossary](glossary.html).\n\n### S53 — Damodaran growth value drivers\n\nAswath Damodaran, NYU Stern School of Business. [Growth companies—Value Drivers, The Little Book of Valuation companion material](https://pages.stern.nyu.edu/~adamodar/New_Home_Page/littlebook/growthvaluedrivers.htm). Undated teaching page; accessed September 12, 2026.\n\n**Evidence type:** Original author teaching material. **Consulted scope:** Full short page consulted on scalable revenue growth, sustainable margins and reinvestment. Used for the economic relationship, not as an empirical causal study of software architecture or a current market benchmark. Related growth pages were discovery leads, not additional cited publications.\n\n**Used in:** [A Valuation Is an Estimate, Not a Fact](valuation-is-an-estimate.html).\n\n### S54 — Investor.gov stock basics\n\nU.S. Securities and Exchange Commission, Investor.gov. [Stocks: FAQs](https://www.investor.gov/introduction-investing/investing-basics/investment-products/stocks). Undated educational page; accessed September 13, 2026.\n\n**Evidence type:** Regulator education. **Consulted scope:** Ownership, reasons for issuing shares, dividends and differences between common and preferred shares. Used for introductory definitions, not particular shareholder agreements.\n\n**Used in:** [Customers, Lenders and Investors: What Each Expects in Return](customers-lenders-investors.html), [Glossary](glossary.html).\n\n### S55 — Investor.gov public-company reporting\n\nU.S. Securities and Exchange Commission, Investor.gov. [Public Companies](https://www.investor.gov/introduction-investing/investing-basics/how-stock-markets-work/public-companies). Undated educational page; accessed September 13, 2026.\n\n**Evidence type:** Regulator education. **Consulted scope:** Different meanings of public company, public-reporting obligations and annual versus quarterly reports. US context; not a universal reporting schedule for every jurisdiction.\n\n**Used in:** [Customers, Lenders and Investors: What Each Expects in Return](customers-lenders-investors.html), [Glossary](glossary.html).\n\n### S56 — SBA grant overview\n\nU.S. Small Business Administration. [Grants](https://www.sba.gov/loans/additional-funding-opportunities/grants/). Living page; accessed September 13, 2026.\n\n**Evidence type:** Government program information. **Consulted scope:** Overview and research-and-development grant section. Establishes that eligible grants are another possible funding source; the book does not assess an individual company’s eligibility or promise general startup funding.\n\n**Used in:** [Customers, Lenders and Investors: What Each Expects in Return](customers-lenders-investors.html).\n\n### S57 — Damodaran on capital structure\n\nAswath Damodaran, NYU Stern School of Business. [Finding the Right Financing Mix: The Capital Structure Decision](https://people.stern.nyu.edu/adamodar/pdfiles/cf2E/capstru.pdf). Undated teaching slides; accessed September 13, 2026.\n\n**Evidence type:** Original author teaching material. **Consulted scope:** Introductory financing-choice and debt/equity-mix slides, especially slides 2–8. Used for the capital-structure definition, not historical tax examples, a mandatory company lifecycle or current financing recommendations.\n\n**Used in:** [Customers, Lenders and Investors: What Each Expects in Return](customers-lenders-investors.html), [Glossary](glossary.html).\n\n### S58 — Venture capital\n\nBritish Business Bank. [Venture capital](https://www.british-business-bank.co.uk/business-guidance/guidance-articles/finance/venture-capital). Undated guidance page; accessed September 13, 2026.\n\n**Evidence type:** Public development-bank business guidance. **Consulted scope:** Guide consulted for early-stage equity, minority participation and successive funding rounds. Not evidence of outcomes for the manuscript’s fictional examples; no universal funding or holding timetable is inferred.\n\n**Used in:** [Customers, Lenders and Investors: What Each Expects in Return](customers-lenders-investors.html).\n\n### S59 — Expansion capital\n\nBritish Business Bank. [Expansion capital](https://www.british-business-bank.co.uk/business-guidance/guidance-articles/finance/expansion-capital). Undated guidance page; accessed September 13, 2026.\n\n**Evidence type:** Public development-bank business guidance. **Consulted scope:** Guide consulted for equity supporting business expansion and possible retention of control. Its typical ranges are not applied as requirements or market-wide estimates.\n\n**Used in:** [Customers, Lenders and Investors: What Each Expects in Return](customers-lenders-investors.html).\n\n### S60 — Corporate venture capital\n\nBritish Business Bank. [Corporate venture capital (CVC)](https://www.british-business-bank.co.uk/business-guidance/guidance-articles/finance/corporate-venture-capital). Undated guidance page; accessed September 13, 2026.\n\n**Evidence type:** Public development-bank business guidance. **Consulted scope:** Guide consulted for corporate funding, commercial purposes, expertise and network access. Not a review of corporate acquisition law, specific investor agreements or universal CVC behavior.\n\n**Used in:** [Customers, Lenders and Investors: What Each Expects in Return](customers-lenders-investors.html).\n\n### S61 — NVCA model-document overview\n\nNational Venture Capital Association. [Model Legal Documents — overview](https://nvca.org/model-legal-documents/). Living overview page; accessed September 13, 2026.\n\n**Evidence type:** US venture industry model-document overview. **Consulted scope:** The overview and document list were consulted, including its description of time- or milestone-based financing mechanics. Individual downloadable agreements were not reviewed. The citation supports checking distinct rights, voting and purchase documentation, not a clause-level or jurisdiction-independent legal claim.\n\n**Used in:** [Decide Who Decides, Before You Disagree](decide-who-decides.html).\n\n### S62 — Hg 2017 Visma announcement\n\nHg. [Hg leads $5.3bn buyout of Visma](https://hgcapital.com/insights/hg-leads-usd5-3bn-buyout-of-visma). June 26, 2017; accessed September 14, 2026.\n\n**Evidence type:** Investment manager's transaction announcement. **Consulted scope:** The announcement was read in full for the funds named for the 2006 and 2014 investments, the 2017 buyout value, KKR's realization of its stake and the stated post-transaction ownership shares. The announcement states that completion is subject to regulatory approval. An interested account of announced terms, not an audited record; it does not state who sold in each round or how much money reached the operating company.\n\n**Used in:** [Visma: Continuity of Manager Is Not Continuity of Money](visma.html).\n\n### S63 — OECD AI-system definition memorandum\n\nOECD. [Explanatory memorandum on the updated OECD definition of an AI system](https://www.oecd.org/content/dam/oecd/en/publications/reports/2024/03/explanatory-memorandum-on-the-updated-oecd-definition-of-an-ai-system_3c815e51/623da898-en.pdf). OECD Artificial Intelligence Papers No. 8, March 2024; accessed September 14, 2026.\n\n**Evidence type:** Intergovernmental definitional guidance. **Consulted scope:** The definition and its explanation of machine-learning and knowledge-based approaches were consulted for the glossary's AI entry. A definition, not evidence about any company's AI use.\n\n**Used in:** [Glossary](glossary.html).\n\n### S64 — Hilton 2003 annual filing\n\nHilton Hotels Corporation. [Form 10-K for the fiscal year ended December 31, 2003](https://www.sec.gov/Archives/edgar/data/47580/000104746904007535/a2128996z10-k.htm). Filed March 2004; accessed September 15, 2026.\n\n**Evidence type:** Company regulatory filing. **Consulted scope:** The business description's statements that the proprietary OnQ system was introduced in 2003 and had been installed at substantially all hotels in the system. Consulted to date the platform before the 2007 buyout; not read for its financial statements.\n\n**Used in:** [Hilton and Skype: A Successful Exit Still Needs Explaining](hilton-and-skype.html).\n\n### S65 — Hilton 2005 annual filing\n\nHilton Hotels Corporation. [Form 10-K for the fiscal year ended December 31, 2005](https://www.sec.gov/Archives/edgar/data/47580/000110465906016388/a06-2283_110k.htm). Filed March 2006; accessed September 15, 2026.\n\n**Evidence type:** Company regulatory filing. **Consulted scope:** The statement that OnQ had been installed at virtually all hotels in the system as of December 31, 2005, and the intention to install it in hotels acquired in the Hilton International transaction. Consulted to establish the inherited platform's reach before the 2007 buyout; not read for its financial statements.\n\n**Used in:** [Hilton and Skype: A Successful Exit Still Needs Explaining](hilton-and-skype.html).\n\n### S66 — HgCapital Trust January 2021 TeamSystem announcement\n\nHgCapital Trust plc. [Hg invests in TeamSystem](https://www.hgcapitaltrust.com/news-insights/news/2021/18-01-2021-131229553). January 18, 2021; accessed September 15, 2026.\n\n**Evidence type:** Investor transaction announcement. **Consulted scope:** Statements that Hg's Genesis 6 fund would sell its minority holding to a vehicle controlled by Hellman & Friedman Capital Partners IX, that the Trust would invest about GBP 14.3 million through the Hg Genesis 8 fund, that the transaction valued the Trust's existing investment at GBP 21.3 million, and that Hg would remain a minority investor. No completion date or conditions stated; completion is taken from S67. Announced values, not cash received.\n\n**Used in:** [TeamSystem: Each New Owner Inherits Progress and Unfinished Work](teamsystem.html).\n\n### S67 — HgCapital Trust 2021 annual report\n\nHgCapital Trust plc. [Annual Report & Accounts 2021](https://www.hgcapitaltrust.com/~/media/Files/H/Hgcapital-Trust-V2/documents/investors/publications/2021/hgt-annual-report-and-accounts-2021.pdf). Approved March 4, 2022; year ended December 31, 2021; accessed September 15, 2026.\n\n**Evidence type:** Listed investment trust annual report. **Consulted scope:** PDF pp. 45, 48, 50, 51 and 54: February 2021 completion of the GBP 14.3 million investment through Hg Genesis 8 and of the Genesis 6 sale with GBP 21.4 million returned to the Trust; realisations table (GBP 21.373 million, secondary sale); investments table (GBP 14.250 million); TeamSystem carried at GBP 18.316 million against cost of GBP 14.250 million at 31 December 2021. Gross fund-level figures, not net distributions to the Trust's shareholders.\n\n**Used in:** [TeamSystem: Each New Owner Inherits Progress and Unfinished Work](teamsystem.html).\n\n### S68 — Silver Lake TeamSystem announcement\n\nSilver Lake. [Silver Lake to Make €600M Strategic Investment in TeamSystem](https://www.silverlake.com/silver-lake-to-make-e600m-strategic-investment-in-teamsystem/). May 19, 2023; accessed September 15, 2026.\n\n**Evidence type:** Buyer's transaction announcement. **Consulted scope:** Definitive agreement to acquire a EUR 600 million minority stake from Hellman & Friedman, which would remain the majority shareholder; closing expected around the end of 2023, subject to customary conditions and regulatory approvals. Hg is not mentioned. Completion not verified; an interested party's description of its own transaction.\n\n**Used in:** [TeamSystem: Each New Owner Inherits Progress and Unfinished Work](teamsystem.html).\n\n### S69 — HgCapital Trust 2023 annual report\n\nHgCapital Trust plc. [Annual Report & Accounts 2023](https://www.hgcapitaltrust.com/~/media/Files/H/Hgcapital-Trust-V2/documents/investors/publications/2023/hgt-annual-report-and-accounts-2023-v1.pdf). Approved March 8, 2024; year ended December 31, 2023; accessed September 15, 2026.\n\n**Evidence type:** Listed investment trust annual report. **Consulted scope:** PDF pp. 45–46: the August 2023 announced partial sale of the Trust's TeamSystem investment, listed under realisations after the year end with an estimated GBP 8 million to be returned, Hg remaining a minority investor and the holding valued at about GBP 33.3 million; portfolio table carrying TeamSystem (Hg Genesis 8, 2021 investment) at GBP 31.897 million against cost of GBP 10.586 million at 31 December 2023. Estimated and gross figures; completion of the partial sale not stated.\n\n**Used in:** [TeamSystem: Each New Owner Inherits Progress and Unfinished Work](teamsystem.html).\n\n### S70 — HgCapital Trust July 2024 TeamSystem announcement\n\nHgCapital Trust plc. [Sale of remaining investment in TeamSystem](https://www.hgcapitaltrust.com/news-insights/news/2024/08-07-2024). July 8, 2024; accessed September 15, 2026.\n\n**Evidence type:** Investor transaction announcement. **Consulted scope:** Agreed sale of the Trust's remaining investment to funds advised by Hellman & Friedman, valuing it at about GBP 24.3 million against a GBP 22.1 million carrying value at 31 March 2024 (a GBP 2.2 million uplift); completion subject to applicable closing conditions. Agreed value, not cash received.\n\n**Used in:** [TeamSystem: Each New Owner Inherits Progress and Unfinished Work](teamsystem.html).\n\n### S71 — HgCapital Trust 2024 annual report\n\nHgCapital Trust plc. [Annual Report & Accounts 2024](https://www.hgcapitaltrust.com/~/media/Files/H/Hgcapital-Trust-V2/documents/investors/publications/2024/hgt-fy-2024-report-and-accounts.pdf). Approved March 7, 2025; year ended December 31, 2024; accessed September 15, 2026.\n\n**Evidence type:** Listed investment trust annual report. **Consulted scope:** PDF pp. 9 and 46–47: TeamSystem listed among full realisations made during 2024 with GBP 34.189 million of gross proceeds (secondary sale) and \"GBP 34.2m returned to HgT\"; the narrative repeats the July 2024 agreed-sale wording; the table footnote states that the figures are gross realisations before performance-fee and facility deductions and timing differences between company realisations and fund distributions, and that a full exit can coexist with a stake retained through another Hg fund. The report does not reconcile the gross figure with the announced GBP 24.3 million or say whether it includes the 2023 partial-sale proceeds; not a net distribution to the Trust's shareholders.\n\n**Used in:** [TeamSystem: Each New Owner Inherits Progress and Unfinished Work](teamsystem.html).\n\n### S72 — Investor.gov bonds page\n\nU.S. Securities and Exchange Commission, Investor.gov. [Bonds](https://www.investor.gov/introduction-investing/investing-basics/investment-products/bonds-or-fixed-income-products/bonds). Undated educational page; accessed September 15, 2026.\n\n**Evidence type:** Regulator education. **Consulted scope:** The description of a bond as a loan to the issuer, which promises a stated rate of interest over the life of the bond and repayment of the principal, also called face or par value, at maturity. Used for the introductory point that a lender is an investor of a different kind; not a guide to any particular bond or loan agreement.\n\n**Used in:** [Customers, Lenders and Investors: What Each Expects in Return](customers-lenders-investors.html).\n\n### S73 — ILPA whole-of-fund model LPA\n\nInstitutional Limited Partners Association (ILPA). [ILPA Model Limited Partnership Agreement (whole-of-fund waterfall)](https://ilpa.org/wp-content/uploads/2019/10/ILPA-Model-Limited-Partnership-Agreement-October-2019.pdf). October 2019.\n\n**Evidence type:** LP industry model document. **Consulted scope:** The distribution waterfall at sections 14.3.3 and 14.3.4, read for a partial general-partner catch-up that keeps the same end condition, and section 14.4.1 on distributions in kind and the treatment of remaining value. A voluntary model drafted under Delaware law from the LP side; it is not the agreement any particular fund signed and not evidence of prevailing market terms.\n\n**Used in:** [Fund Economics: Fees, Distributions and Performance Reports](fund-economics.html).\n\n### S74 — ILPA deal-by-deal model LPA\n\nInstitutional Limited Partners Association (ILPA). [ILPA Model Limited Partnership Agreement — Deal By Deal](https://ilpa.org/resources-tools/resource-library/deal-by-deal-model-limited-partnership-agreement-pdf/). July 1, 2020.\n\n**Evidence type:** LP industry model document. **Consulted scope:** The resource page was consulted to establish that ILPA publishes model agreements for both a whole-of-fund and a deal-by-deal distribution waterfall, which is the point the chapter rests on. The deal-by-deal document itself was not read clause by clause. Publishing two models does not make either the rule for any fund.\n\n**Used in:** [Fund Economics: Fees, Distributions and Performance Reports](fund-economics.html).\n\n### S75 — Fastly fourth-quarter 2020 shareholder letter\n\nFastly, Inc. [Fourth Quarter and Fiscal Year 2020 Shareholder Letter](https://www.sec.gov/Archives/edgar/data/1517413/000151741321000007/ex991-shareholderletter123.htm). February 2021; quarter and fiscal year ended December 31, 2020; filed as an exhibit.\n\n**Evidence type:** Company financial communication filed with the SEC. **Consulted scope:** The definitions of the two retention measures: a dollar-based net expansion rate computed from customers who remained customers on the last day of the current period, and a separate net retention rate that reflects contraction and churn. Consulted as one filed example of a public software company defining these ratios its own way, which is why a plan should write its own definition down. One company's definitions, not a standard; no claim about Fastly's results or about the ratios' behavior anywhere else.\n\n**Used in:** [Management Equity, Fund Carry and Employee Jobs Are Different Bets](different-bets.html).\n\n### S76 — Avalyn Pharma investors' rights agreement\n\nAvalyn Pharma Inc. [Amended and Restated Investors' Rights Agreement, sections 3.2 (Inspection Rights) and 5.4 (Board Matters Requiring Approval of Preferred Directors)](https://www.sec.gov/Archives/edgar/data/1540171/000119312526147573/ck0001540171-ex4_2.htm). April 25, 2025; filed as an exhibit.\n\n**Evidence type:** Filed contract between a company and its investors. **Consulted scope:** Section 3.2, read for a right granted to each major investor and its authorized representatives to visit and inspect the company's properties, examine its corporate and financial records and discuss its affairs, finances and accounts with its officers, during normal business hours, with carve-outs for trade secrets, confidential information and material whose disclosure would affect attorney-client privilege, and excluding investors the board has determined to be competitors. Section 5.4(g), read on September 16, 2026, which lists among the board matters requiring the preferred directors' approval the decision to \"hire, terminate, or change the compensation of the executive officers, including approving any option grants or stock awards to executive officers\". One filed example showing that such rights are commonly written down in advance; it does not establish what any other company's agreement grants.\n\n**Used in:** [Is the Investor’s Adviser Helping, Assessing or Deciding?](investors-adviser.html), [Fix the Decision Problem Before Adding People](fix-decisions-before-hiring.html).\n\n### S77 — Council Directive 98/59/EC\n\nCouncil of the European Union. [Council Directive 98/59/EC of 20 July 1998 on the approximation of the laws of the Member States relating to collective redundancies](https://www.legislation.gov.uk/eudr/1998/59). 20 July 1998; consulted September 16, 2026 in the UK statute-book copy on legislation.gov.uk, because EUR-Lex (CELEX 31998L0059) refused automated access during the session.\n\n**Evidence type:** Union legislation. **Consulted scope:** Article 1(1)(a) thresholds (over 30 days: at least 10 dismissals in establishments of 20 to 100 workers, at least 10% in 100 to 300, at least 30 in 300 or more; or at least 20 over 90 days where a member state so chooses), Article 2(1) consultation of workers’ representatives in good time with a view to reaching an agreement, Article 3(1) written notification of the competent public authority and Article 4(1) the 30-day period before notified redundancies take effect. Minimum requirements that member states transpose and may exceed; not the law of any particular country, and the book does not say which law governs the fictional company. Later amendments were not reviewed.\n\n**Used in:** [When the Headcount Plan Shrinks](headcount-plan-shrinks.html).\n\n### S78 — US WARN Act, 29 U.S.C. §§ 2101–2102\n\nUnited States Code, Title 29, Chapter 23. [§ 2101, Definitions; exclusions from definition of loss of employment](https://www.law.cornell.edu/uscode/text/29/2101) and [§ 2102, Notice required before plant closings and mass layoffs](https://www.law.cornell.edu/uscode/text/29/2102) (the Worker Adjustment and Retraining Notification Act). Consulted September 16, 2026 in the Legal Information Institute’s copy of the US Code.\n\n**Evidence type:** Federal statute. **Consulted scope:** The definitions of employer (100 or more employees, excluding part-time employees), plant closing (an employment loss for 50 or more employees at a single site) and mass layoff (at least 33 percent of the employees and at least 50 employees, or at least 500), and the requirement in § 2102(a) not to order a plant closing or mass layoff until 60 days after written notice to the employees’ representatives or the employees, the state and the local government. The implementing regulations, state notice laws and the statutory exceptions were not reviewed.\n\n**Used in:** [When the Headcount Plan Shrinks](headcount-plan-shrinks.html).\n\n## Supplied Private Inputs\n\n### P01 — supplied role brief\n\nSupplied private role brief; organization omitted from reader-facing prose. *Technology operations principal role description*. Undated supplied PDF; reviewed September 12, 2026.\n\nBoth pages read. One role brief, not an industry-wide mandate. Heading/body title variation and actual decision rights require clarification. Exact file and page mapping remain in private editorial notes.\n\n**Used in:** [Is the Investor’s Adviser Helping, Assessing or Deciding?](investors-adviser.html).\n\n### P02 — Productscapes hypothesis\n\nŽeljko Obrenović, supplied Productscapes material. *Private equity and technology capability as products: working domain models and proposals*. Supplied working files, individually versioned; reviewed September 12, 2026.\n\nBoth domain overviews, technology-capability input and audit, structured record inventories, and selected substantive tutorials/models read. Not every repeated generated HTML/JSON prose field was read line by line. Proposals, example values, and null baselines are not verified operating results.\n\n**Used in:** No chapter cites P02 directly. It is recorded as an intellectual input to the drafting of the support and role chapters (Part IV); the book states its own reasoning in ordinary terms, and readers do not need to learn the Productscapes model.\n\n## Remaining Research Limits\n\nThe research is broad but selective. It does not establish the typical return of a current fund, a complete financing history for every case, a universal charter for an investor’s technology adviser, or the causal effect of the book’s proposed support model. Full access to the Toys R Us fiscal 2016 10-K (S34) was not obtained. The editorial chronology of this register, meaning which revision added or rechecked which entries, is kept in the working notes rather than on this page; the dates that matter for reading a source are in its entry.\n"}]}]}</script>
