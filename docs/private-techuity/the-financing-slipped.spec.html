<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "# Spec: Planning on Money That Hasn't Arrived\n\n## Intent\n\nShow a company leader how to respond when an expected round, refinancing or parent budget arrives late while delivery is on track: put cash and commitments on a calendar, find the latest useful decision date, price the alternatives, obtain one authorized fallback, tell customers and teams which plan is running, and restart deferred spending only under an explicit rule that separates counting promised money in the forecast from spending against it. Handover through ownership changes is a separate chapter, [Manage the Handover: Carry Forward the Evidence and Obligations](handover-of-obligations.html); the deeper workforce reduction that the 1 October review has to decide is a separate chapter, [Scale the Team Down: Decide What Work Stops, Not Just Who Leaves](anatomy-of-a-layoff.html), which continues this scenario’s figures.\n\n## Audience\n\nProduct and engineering leaders inside companies working under investors, including leaders who inherit an ownership arrangement. Assume no specialist finance background; explain necessary terms before use. Investor-side readers are secondary.\n\n## Success criteria\n\n- Open with the actual scenario (September round now likely in December) rather than a general account of ownership, and avoid contrasts with “companies without investors”; name the specific condition the arrangement changes. Keep the opening callouts and key points short (under 250 words together): the delayed investment and the three practical actions (name the money’s stage, work the decision by date, authorize one fallback). Committee mechanics, the bridge and the detailed restart rule belong in their own sections, not the opening.\n- Work one fictional Larkspur scenario with this chapter’s own figures (€1.6m on 1 July, €200,000 monthly burn, €400,000 reserve reached 31 December, hires at €30,000 a month, €120,000 portal contract), stated in the text as deliberately separate from the shared Larkspur ledger (no ONB-1 identifier or shared ledger figures), through to a dated board decision: chosen option, alternatives rejected, funding, scarce capacity, who is authorized, review date and the evidence that would change it.\n- State one restart rule for deferred spending that separates two permissions: **counting** a signed-but-conditional commitment in the dated cash forecast (only when the board specifically authorizes it) and **spending** against money not yet received (only if a forecast that counts cash already received, and nothing promised, still holds the reserve **until 30 June** with the new obligation included). Define that forecast in every format: it starts from cash in the bank, leaves out investment and loan money not yet received, and keeps the plan’s stated assumptions about future customer payments and operating costs (the net monthly burn). The hires and the portal are the deferred spending the test governs; whether the bridge may be counted is a separate permission, because it is financing being pursued, not spending. Give the horizon’s reason (two further slips of the three-month size already seen: December to March, March to June) so a reader can apply the test without inventing a period. Show that at Larkspur’s figures the test fails before anything is added (B with R1 and no new money reaches the reserve about 20 January; with the bridge’s cash received, about 20 May, still short of 30 June), and that new spending only makes it worse. Name the financing assumption of every such calculation: without the bridge, a portal paid in mid-December leaves €380,000 on 31 December (below the reserve before year-end) and the hires from 1 November leave €440,000 (reserve about 7 January); with the bridge’s cash received, the same portal payment leaves €980,000 (reserve about late April, still short of 30 June). So offers and the portal signature wait for the round’s cash, confirmed by Sam. Give the same action for each state (cash received; signed with conditions outstanding; money fails to arrive) in the article, summary and comic, and in the short formats state the spending test in full: cash already received, with the new hires or contract payments included, keeps the company at or above the €400,000 reserve until 30 June.\n- Make the failed-money response honest and dated. The board decides on 10 August that R1’s notice is served on 1 October unless cash already received by then passes the same test without it; uncertain money (anything short of cash received) does not stop the notice, and serving it on time is what secures November’s saving. Trace three cases, each with notices already served, approval authority, cash position and the next decision before the reserve is breached: (1) nothing signed on 1 October; (2) a signed conditional agreement (the bridge) failing after 1 October; (3) the bridge’s cash received, then the round failing in December (€600,000 plus interest owed at maturity). Wherever a format mentions case 3, it ends in a December board decision on the spending level Larkspur can continue at and on repaying or renegotiating the loan, not in a spending cut already made. The deeper reduction needs its own board approval and pays its transition costs before it saves, so it is not a fallback for missing money. Say that it cannot replace the bridge only as a result of Larkspur’s later-costed terms (see [Scale the Team Down: Decide What Work Stops, Not Just Who Leaves](anatomy-of-a-layoff.html)), not as a general rule about reductions, in the summary as well as the article; what Larkspur does if neither the bridge nor the round arrives is stated as unresolved in this chapter. Never write “if closing fails, R1 and the deeper cut run”.\n- State the bridge’s payer, amount, arrival date and loan terms behind the March date: a convertible loan, no arrangement fee, interest added to the loan and converted with it, no principal, interest or other charge payable in cash before maturity twelve months after receipt (after every date in the chapter, including the R1 extension to about 20 May), and what is owed if the round never closes. Cost at least one post-December reduction with its latest useful date (R1: about 20 January without the bridge, about 20 May with it) and hand the deeper continuation level to [Scale the Team Down: Decide What Work Stops, Not Just Who Leaves](anatomy-of-a-layoff.html); do not describe R1 as a complete fallback.\n- Derive the 15 August latest useful decision date from stated fictional events: offers and the portal contract are both due on 16 August; the portal’s €120,000 is committed at signature and paid on 15 September. Do not present sending an offer as a universal legal point of no return.\n- Explain every finance term and role abbreviation at first meaningful use in each format, including the standalone summary and comic (round, shares as ownership stakes, bridge, interest, closing, burn, reserve, expression of interest, investment committee, convertible loan, term sheet, subscription agreement, collected revenue, Reduction 1 (R1), CFO/CTO/CEO), and say briefly what Larkspur sells and what the pilot, portal and recovery work are, in the comic as well as the article. The excerpt uses plain words (no unexplained “round”, “refinancing” or “parent budget”). Reading-list annotations define fund, buyout fund (including a controlling stake: enough ownership and votes to decide major company matters), portfolio company and preferred stock (with one concrete priority, such as being paid from a sale before ordinary shareholders). The article explains the dispatch service (the software that sends field staff to their jobs) and avoids the unexplained “roadmap”; the summary states the recovery requirement concretely (restoring, within four hours of a failure, the software that assigns field staff to jobs) rather than as “four-hour service recovery”. Short formats say a term sheet “does not count as incoming cash in Larkspur’s forecast”, never that it counts for nothing. Every document drawn in a comic panel is one the story has established (panel 6: the operating record and a customer contract).\n- Make the latest useful decision date (15 August) central, and distinguish the stages of a commitment: expression of interest, approval pending, signed commitment with conditions, cash received.\n- Retain only the escalation step this decision needs, with a link to the governance chapter; keep the distinction between a failed hypothesis, poor execution and an unfunded dependency.\n- Include two short variations (a refinancing that leaves less cash; a corporate parent withdrawing budget) without developing a second full case.\n- Keep Figure 1 (ownership paths from a review junction) with a caption that matches the revised text; keep the article header logo and navigation icon.\n- Keep the TL;DR (300–500 words) and the comic page scripts consistent with the article; inspect every generated page against its script and regenerate pages whose artwork cannot carry the financing story rather than re-captioning them misleadingly. The comic must show an on-schedule delivery plan and a funding date moving from September to December; compare reserve dates with C marked as B plus a conditional €600,000 receipt, not a lower burn; and carry the decision dates (10 August, 15 August, 1 September, 1 October) as lettered timelines, not decorative calendars.\n- Keep historical and research references within their source scope, with current publication status and subgroup qualifications; say that a term sheet may state an expected closing date but does not guarantee closing or cash; label fictional figures as fictional.\n- Close with the next-chapter handoff to the handover chapter, and trim Questions to Consider to three.\n\n## Non-goals\n\nThe deeper reduction decision and its employee consequences (owned by [Scale the Team Down: Decide What Work Stops, Not Just Who Leaves](anatomy-of-a-layoff.html)); handover, exit readiness, exit-period distortions and transaction forms (moved to [Manage the Handover: Carry Forward the Evidence and Obligations](handover-of-obligations.html)); regular investor cadence and peer networks (governance and Part IV chapters); universal prescriptions, invented evidence, promises of investment performance, or disclosure of confidential inputs. The chapter is not a legal or tax opinion.\n\n## Modalities\n\n- Full Article: index.md, the substantive argument.\n- TL;DR: summary.md, the practical implications in concise prose.\n- Comic: comics.md, eight illustrated pages of three strips each — each image one page with the dialogue, labels, amounts and dates lettered in the artwork — with alt text, visible captions and per-strip transcripts rendered from the page blocks that are also the artwork scripts.\n\n## Open questions\n\nNone for the artwork: the comic was rebuilt as eight generated pages on 23 September and every page was inspected against its script. Evidence gaps and chapter-specific next research are tracked in the separate editorial backlog.\n\n## Decision log\n\n- 2026-09-14: Split the chapter. Delayed financing stays here; everything from exit readiness onward moves to the new handover chapter; peer-network material moves to the help chapter; cadence and escalation material is cut to the one escalation step the funding decision needs.\n- 2026-09-13: The author requested Owned and substantive comparative treatment of leadership under investors; this supersedes the previous private-equity-first framing.\n- 2026-09-12: Use an explanatory essay rather than the repository's ADR template. Preserve per-post folders and stable permalinks. User explicitly requested varied chapter structures.\n\n## Sources\n\nThe supplied book brief establishes scope, including the shared Larkspur delayed-financing figures. Public citations appear in the article and bibliography. Private provenance is recorded separately in _research/input-reading.md and is excluded from the site configuration.\n\n## Changelog\n\n- 2026-09-24 (part order): Moved from LEAD to the end of Part IV (COMMIT) as the chapter that revises the cash plan and commitments when expected money is late; opening now cites [Plan the First Hundred Days: Turn Expectations Into Funded Work](first-hundred-days.html) as a Part VII chapter that builds a funded plan on money expected by a date. Folder renumbered to `20-the-financing-slipped`; permalink and id unchanged.\n- 2026-09-23 (comic pages): The six single-scene panels replaced by eight comic pages of three strips each, so the slipped date and the four stages of money, the €1.6m / €200,000 / €400,000 cash arithmetic and staircase, the sorted commitments and the 15 August latest useful date, the three alternatives with A's breach arithmetic and the bridge's terms, the escalation and the 10 August decision, R1 with its standing instruction and its 20 January / 20 May dates, the counting-versus-spending rule with the 30 June test and its failure at Larkspur's figures, and the three failure cases are drawn into the artwork rather than carried by captions. Page images live under `assets/images/20-the-financing-slipped/`; captions and transcripts are rendered from the page blocks; the previous panel comic is archived under `_research/comic-pages-pilot/`. No figure, date or decision changed; permalink unchanged.\n- 2026-09-23 (round 6): In-depth review FIN-010, FIN-013. Summary trimmed from 520 to 499 body words, within the 300–500 target: the cash baseline and recovery obligation now form one paragraph and the hires, portal and 15 August decision date another; R1's reserve dates moved into the spending-test paragraph, where they show why the test fails. The article says money is \"in\" the bank account and that R1's notice, not R1 itself, is served on 1 October. No contract clause, number or date changed.\n- 2026-09-23 (round 5): In-depth review FIN-011, FIN-002. The summary’s third failure case is a December board decision on continuing spending and on repaying or renegotiating the bridge loan, not a completed cut; its four-hour recovery requirement is explained as restoring the software that assigns field staff to jobs after a failure, funded in every alternative.\n- 2026-09-23 (round 4): In-depth review FIN-001, FIN-010, FIN-002, FIN-011. The restart forecast defined in all formats (cash in the bank, no unreceived investment or loan money, the stated customer-payment and cost assumptions kept) and the bridge’s counting permission separated from the deferred hires and portal; opening callouts and key points shortened to the problem and three actions; dispatch service, controlling stake and preferred-share priority explained, “roadmap” replaced; the summary’s deeper-cut conclusion limited to Larkspur’s later-costed terms.\n- 2026-09-23 (round 3): In-depth review FIN-001, FIN-012, FIN-002, FIN-010. Short formats state the spending test with the new obligation included; the article’s deferred-spending calculations are labelled as the no-bridge case, the portal payment is dated (signed mid-November, paid mid-December) and the with-bridge result (€980,000) is shown; “reported returns” and the Baik study’s low-reputation category glossed; overloaded summary and comic sentences split.\n- 2026-09-23 (round 2): In-depth review FIN-011, FIN-001, FIN-002, FIN-006. Restart test given a stated horizon (reserve held to 30 June on cash already received); R1’s 1 October notice made a standing 10 August instruction; three dated failure cases replace “if closing fails, R1 and the deeper cut run”, and the no-money response is stated as unresolved; shares, interest, R1, pilot, portal, recovery work, fund, buyout fund and portfolio company glossed in the formats that use them; excerpt in plain words; term-sheet wording narrowed in the short formats itment with cash; one restart rule (cash received, or a board-authorized conditional commitment with a dated forecast and a funded downside) replaces the three differing gates; bridge assumptions (payer, €600,000, arrival by 30 November, no fee or cash interest before March) stated; Reduction R1 (€50,000 a month from 1 November, decision date 1 October) costed and the post-December continuation level left open; ONB-1 identifier and the €180,000 ledger figure removed and the scenario declared separate from the shared Larkspur ledger; NVCA model term sheet added to the reading list; timetoread 13 min.\n- 2026-09-14: Refocus the post on the delayed-financing decision with a completed dated Larkspur scenario; move exit readiness, exit-period distortions, transaction forms, handover and post-handoff learning to the new chapter `handover-of-obligations`, peer-network material to `help-that-changes-capability`, and cut cadence and escalation to the single step the decision needs; comic panels 2–4 flagged for regeneration; permalink and id unchanged.\n- 2026-09-14: Retitle the post from “Keep the Plan Credible Through Funding and Ownership Changes” to “The Roadmap Did Not Slip, the Financing Did”. Permalink and id unchanged; body unchanged.\n- 2026-09-13: Add the requested single Nano Banana overview visual to the TL;DR modality.\n- 2026-09-13: Extend the illustrated edition to post logos, navigation icons and, where applicable, the existing six-panel comics.\n- 2026-09-13: Define the requested article-illustration and bold-emphasis pass before implementing the illustrated edition.\n- 2026-09-13: Reconcile the revised article and applicable reading formats with the Owned contract; specification accepted as matching the draft manuscript.\n- 2026-09-13: Revise the contract for Owned before adapting the article and its reading formats.\n- 2026-09-13: Apply the agreed company-leader perspective, private-equity focus with wider applications, and revised part structure.\n- 2026-0         const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
