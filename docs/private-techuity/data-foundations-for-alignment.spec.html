<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "# Spec: Build the Evidence Everyone Trusts: Data Foundations for Alignment\n\n## Intent\n\nHelp product and engineering leaders assemble, maintain and share the data that makes alignment with investors productive: financial and business results, planning and execution evidence, and product and technology evidence. Treat shared data as a working foundation for discussing priorities, testing assumptions and agreeing realistic commitments, not as a reporting duty or a pile assembled for diligence. Extend the author's Lightweight Architectural Analytics practice from Grounded Architecture — curate existing sources into a current, credible picture — from the technology landscape to the investor relationship.\n\n## Audience\n\nCompany product and engineering leaders, including people who inherited an investor relationship and have no financial background. Secondary: chief executives and finance leaders who assemble the same material. Assume the reader owns part of the evidence, not all of it.\n\n## Success criteria\n\n- Place the chapter in the Appendix, after [Appendix: Grounded Architecture Across an Investment Portfolio](grounded-architecture-portfolio.html), as optional depth that Part II's chapters and [COMMIT: Turn Expectations Into Work You Can Deliver](part-3.html) rely on; keep the hand-off to [COMMIT: Turn Expectations Into Work You Can Deliver](part-3.html) and [Set Priorities: You Cannot Fund Everything at Once](cannot-fund-everything.html), where the evidence is used to choose and fund work. The folder stays `08a-` on disk so existing paths remain stable; the appendix is unnumbered.\n- Cover the three requested areas with enough specificity to act on, and make their connection the argument rather than three separate lists:\n  - **Financial and business:** revenue, profitability, cash flow, cost structure, unit economics, customer retention, sales pipeline, and the assumptions behind growth forecasts.\n  - **Planning and execution:** strategic priorities, investment plans, roadmaps, milestones, resource allocation, dependencies, delivery performance, and the gap between commitments and outcomes.\n  - **Product and technology:** product adoption, usage, customer outcomes, portfolio performance, architecture, technical debt, reliability, security, scalability, technology cost, and engineering delivery capability.\n- Connect explicitly to Lightweight Architectural Analytics: bring together existing sources (source code repositories, cloud billing, incident reports, business metrics) rather than buying a platform or building a warehouse; distil five qualities — curated, current, credible, actionable, accessible — from the practice's account of its data and apply them to investor alignment. Present the five as this chapter's adaptation, not as the source's own enumeration (the source's headings differ). Name the author's own prior work plainly, as the journal does for CTO Starter Kit, and label the extension to investor alignment as a proposal rather than demonstrated practice. Register S106–S108.\n- Connect the chapter to **product operations** as described by Melissa Perri and Denise Tilles, mapping its three pillars — business data and insights, customer and market insights, process and governance — onto the chapter's three evidence areas. Make the point that the work falls between existing roles and must be assigned, that standardized definitions are the named mechanism, and that the function supplies evidence without taking over decisions. Register S109 and keep the mapping identified as the book's own.\n- Stay practical: start from existing sources, agree one definition per measure and record it, assign a named owner per measure, state a refresh frequency, and give context (baseline, comparison, direction, uncertainty) instead of isolated numbers.\n- Make the actual/target/forecast/assumption distinction operational — a labelling rule applied to a real figure, not an exhortation — and show what goes wrong when a projection is read as a result. A target is the desired result by a stated date, not a contractual promise. The four labels cover every figure that describes a result or a future; resources authorized to the work (money, engineer-weeks) are inputs that carry a fifth, explicit label, *committed*, with the part already consumed reported as an actual (incurred), so the rule can be applied to every figure in the chapter's own example (62 h actual, 50 h target, €135,000 forecast, €75 assumption, €180,000 committed, €90,000 incurred). The capacity valuation's assumptions stay separate from the further conditions a cash forecast would need, and there are three of them, not two: the future volume, the hourly valuation and the continuation of the observed 18-hour difference across those future customers. Distinguish an agreed decision rule (which settles the recommendation) from spending authorization (which the board still gives).\n- Address the sharing boundary: what should be readily available internally, what is appropriate to share with an investor and at what level of detail; distinguish an investor's information rights from courtesy disclosure; cover raw-access requests, cadence and confidentiality. Do not imply a universal entitlement or a legal standard: entitlement depends on applicable law, the governing documents, the contracts and the recipient's role (an investor-appointed director, an investor with a consent right and a shareholder with a statutory inspection right are different cases), and the board's approval of the plan is distinct from any separately negotiated investor consent. Keep the recipient explicit whenever the chapter says who sees what: an investor-appointed director receives board evidence as a director, the investor receives what its own rights and any permitted sharing arrangement provide, and a board seat is never described as giving the investor itself access. Aggregation and keeping personal data internal are default practices, subject to those obligations.\n- Use the canonical shared Larkspur ledger (`_research/shared-scenario-record.md`) without changing any number: baseline about 80 h reconstructed from twelve implementations, day-90 cohort of eight customers averaging 62 h (8 × 62 = 496 h worked, against 640 h at the baseline, so 144 h fewer — never \"144 hours of work\"), the 1,800 h / €135,000 a year as a projection (100 × 18 × €75) that revises the original plan's 3,000 h / €225,000 at 50 h, capacity versus cash (the contract implementation specialist runs to month twelve, so no payment could be avoided by day 100; the two-specialist hire is spending avoided, not reduced), gate 2 at ≤ 50 h with median waiting time ≤ 8 weeks (passing permits a request and approves nothing), ONB-1 €180,000 committed / ≈€90,000 incurred by day 100 (incurred is not paid), and the €40,000 / four-engineer-week data-quality step as a reserve draw the board approves. Keep the observed difference, its causal explanation and the annual projection apart: the pilot group averaged fewer hours than the earlier group, and the comparison's limits (sales chose the pilot customers, the same specialist served both groups, the baseline was reconstructed) travel with the figure, as in [Test Revenue Assumptions: Do Customers Respond as Expected?](roadmap-to-revenue.html). The chapter's contribution is the labelling and definition of these figures, not new ones.\n- Include a small reusable measure record and review questions. Add Tool 15 without changing existing tool numbers.\n- Use the journal's opening convention (IN THIS SECTION / WHY INVESTORS CARE / WHY YOU SHOULD CARE, then exactly three KEY POINTS), Title Case headings, restrained bold, plain language with terms defined before use, and cross-links via `[[permalink]]`. Target 2,500–3,000 words. Explain finance and technology terms at first meaningful use in every format that must stand alone (article, summary, comic): among others cohort, engineer-week, incurred versus paid, fully loaded cost, debt service, capitalization table, conversion rate, discretionary cost, financial close, diligence, repositories and version control; introduce ONB-1 as the onboarding pilot's identifier or omit it. Define revenue as the amount earned from supplying goods or services in a period, whichever way payment timing falls, illustrated with a service that has been fully delivered but not yet paid for; do not present completed setup work that merely enables a continuing subscription as revenue earned on completion.\n- Ship an independently readable 300–500-word summary (three plain-English questions with examples rather than a catalogue of terms; the hours example says what work the hours measure, shows the 18-hour reduction and the €135,000 arithmetic with its three assumptions, and says why freed time is not cash; information rights and aggregation explained locally) and a short illustrated comic of generated comic pages with captions and dialogue transcripts. Illustrate the article with three Gemini figures in the journal's ivory, navy, teal and ochre palette: the three connected areas over shared sources; the labelling of actual, target, forecast and assumption; and the internal-versus-shared boundary. Descriptive alt text and captions; no invented statistics in artwork.\n- Update Part II's intro to four chapters, the neighbouring handoffs, the reading guide, glossary, bibliography and toolkit. Preserve existing public permalinks and asset namespaces. Build and inspect the rendered article and reading formats.\n\n## Non-goals\n\nA metrics catalogue or KPI taxonomy; a tooling or vendor recommendation; a data-governance or warehouse programme; a reporting-pack template for finance; legal advice on information rights; any claim that better data resolves disagreement or that the proposed extension has measured results. Not a repeat of [Test Revenue Assumptions: Do Customers Respond as Expected?](roadmap-to-revenue.html)'s benefit arithmetic or [Assess Capability: Can the Team Deliver?](can-the-team-deliver.html)'s delivery assessment — this chapter says what evidence must exist and how it is defined, owned and labelled, then points to those chapters for the reasoning applied to it.\n\n## Modalities\n\n- `index.md`: article with three explanatory Gemini figures.\n- `summary.md`: independent summary reusing one figure. Runs to about 700 words, a justified exception to the 300–500 target: to stand alone for a lay reader it must carry the three evidence questions with examples, the product-operations mapping, the worked hours example (496 h over eight customers, 62 average, 18 fewer, 100 × 18 × €75 = €135,000) and why freed time is not cash, plus local explanations of information rights and aggregation (round-1 review, R08A-006).\n- `comics.md`: six generated comic pages (three strips each, numbers lettered in the artwork) following one measure from ambiguity to a labelled, owned figure. Every page is generated and inspected against its script; the under-60 threshold reads as permission to request a further stage; the threshold page's caption and alt text carry all three bands as average onboarding hours per customer and say what the data-quality step does, so the accessible text alone recovers the decision rule; the calculation page labels the continuation of the 18-hour difference as an assumption; the measured page's board states the 62 hours as an average, not as each customer's result; and the cash page names the events that actually turn freed time into money — an outgoing payment avoided or extra incoming receipts above their cash costs — tied to the dates payments fall due rather than to the decision not to hire.\n\n## Open questions\n\nWhether a later chapter should carry a worked investor data pack. The consulted sources describe analytics practice and reporting conventions; they do not establish that shared definitions improve investor relationships, and the chapter says so.\n\n## Decision log\n\n- 2026-09-22: The author requested the chapter for the ALIGN part. Placed last in Part II so authority, incentives and fit are settled before the evidence that serves them, and so the handoff into COMMIT carries the data forward.\n- 2026-09-22: Use the shared Larkspur ledger rather than a new fictional company. The chapter's subject is definition, ownership and labelling of figures that already exist across the book, so reuse demonstrates the point at no cost to consistency.\n- 2026-09-22: Name Lightweight Architectural Analytics and the author's authorship explicitly, following the S105 precedent, and mark the investor-alignment extension as a proposal.\n- 2026-09-22: At the author's request, add a product-operations section connecting Perri and Tilles' three pillars to the chapter's three areas. Placed after the measure record, where the question of who maintains definitions arises naturally, and framed as assigning work rather than requiring a function.\n- 2026-09-22: At the author's request, retitle from \"Build the Evidence Both Sides Trust\" to \"Build the Evidence Everyone Trusts\" and remove \"both sides\" phrasing throughout, so the chapter frames the relationship as collaborative rather than two-sided. Permalink unchanged.\n\n- 2026-09-23: At the author's request, moved from the end of Part II to the Appendix, after the Grounded Architecture chapter. The chapter remains the evidence foundation that Part II's arrangements and Part III's choices use, but as optional depth rather than a numbered chapter; Part II's intro and the investor-under-pressure hand-off now name it as the appendix chapter.\n\n## Sources\n\n- [S106: Željko Obrenović, Lightweight Architectural Analytics](https://grounded-architecture.io/analytics): the author's own practice; source-code, cloud-billing, incident and business/finance sources; the curated, current, credible, actionable and accessible requirements.\n- [S107: Željko Obrenović, Building Lightweight Architectural Analytics](https://grounded-architecture.io/data-website): lean implementation, version-controlled documents, maintainability by a small team.\n- [S108: Grounded Architecture (book site)](https://grounded-architecture.io/): the framework the analytics practice belongs to.\n- [S109: Melissa Perri and Denise Tilles, *Product Operations*](https://melissaperri.com/book): the three pillars, standardized definitions as the stated mechanism, and product operations as an infrastructure rather than approval function.\n- `_research/shared-scenario-record.md`: canonical Larkspur figures (private working note, not a published source).\n- [Clarify Authority: Decide Who Decides Before You Disagree](decide-who-decides.html), [Compare Incentives and Stakes: Equity, Carry and Jobs](different-bets.html), [Assess Investor Fit: Behavior Under Pressure](investor-under-pressure.html), [Set Priorities: You Cannot Fund Everything at Once](cannot-fund-everything.html), [Test Revenue Assumptions: Do Customers Respond as Expected?](roadmap-to-revenue.html), [Assess Capability: Can the Team Deliver?](can-the-team-deliver.html), [Use Diligence: Correct the Plan Before It Is Signed](diligence-corrects-the-plan.html), [Plan the First Hundred Days: Turn Expectations Into Funded Work](first-hundred-days.html), [Manage the Handover: Carry Forward the Evidence and Obligations](handover-of-obligations.html): boundaries and connections.\n\n## Changelog\n\n- 2026-09-23: Moved to the Appendix after [Appendix: Grounded Architecture Across an Investment Portfolio](grounded-architecture-portfolio.html); placement criterion rewritten, closing hand-off reworded, contents lists renumbered (chapters 11–35 became 10–34).\n- 2026-09-23: Round-3 in-depth review (R08A-009, -010, -011, -015, -016). The cash comic page's dialogue must cover both cash mechanisms (payment avoided, extra receipts above costs), the measured page's board must say average, the sharing rule must keep director and investor as distinct recipients, the label table lists Committed last so row references hold, and the densest paragraphs in article and summary are split by purpose.\n- 2026-09-23: Round-2 in-depth review (R08A-004, -005, -009, -011, -013, -014, -015). The labelling rule gains an explicit *committed* label for authorized resources so every figure in the example can be labelled without contradiction; the forecast's third assumption (the 18-hour difference holding for future customers) is named in every format; the revenue example uses a delivered, unpaid service and excludes setup that merely enables a subscription; the threshold comic page must carry its bands in accessible text; the cash comic page ties avoided hiring to payment dates; remaining plain-language gaps (median, uptime, revenue, cloud bills, incident records, version control) and paragraph splits added.\n- 2026-09-23: Round-1 in-depth review (R08A-001 to R08A-012). Ledger criterion corrected: 144 h is the reduction (8 × 18), not hours worked (8 × 62 = 496); the projection revises the original €225,000 case; the contract specialist runs to month twelve. Added: decision rule versus spending authorization, target versus resource commitment, comparison limits and no-trend wording, revenue definition, plain-language first-use list, qualified information rights, the five qualities as this chapter's distillation, summary shape, and six generated comic pages.\n- 2026-09-22: Add the product-operations connection (S109) and the collaborative retitle; both requested by the author during drafting.\n- 2026-09-22: Initial spec, written before the chapter; status draft.\n"}]}]}</script>

                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
