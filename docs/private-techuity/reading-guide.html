<script id="data" type="application/json">{"meta": {"title": "OWNED — Reading Guide", "date": "2026-09-12", "permalink": "reading-guide", "excerpt": "A practical guide to making product and engineering decisions when investors shape the money, authority and expectations around your company.", "logo": "assets/images/reading-guide/logo.jpeg", "logo_credit": "AI-generated illustration", "icon": "assets/icons/reading-guide.png"}, "tags": [], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **KEY POINTS:**\n>\n> * Ownership changes the **conditions in which you lead**. Find out which money, decisions and expectations your product and engineering commitments depend on.\n> * Different arrangements require **different choices**. A funding round, a buyout and a corporate acquisition can put the same roadmap under different constraints.\n> * You remain **responsible for the company’s work**. Challenge assumptions, make feasible commitments and explain consequences for customers and teams.\n\n<br>\nYour company has new investors. The announcement promises growth and support. Within weeks, you are asked to hire faster, demonstrate a new product, reduce costs or connect to the owner’s systems. The requests may each sound reasonable. Together, they can exceed the company’s money, authority and ability to deliver.\n\n**OWNED: Product & Engineering Leadership Under Investors** is about doing your job in that situation. Its primary reader leads product or engineering inside the company, including someone joining an arrangement they did not choose. Understanding the investor matters because it changes the decisions you must make, the commitments you can support and the arguments you need to bring to the people who decide.\n\nCompany’s ownership setting does not remove your judgment or responsibility. Sometimes you can approve a change yourself. Sometimes you must negotiate funding, challenge a target or ask the board to choose between incompatible outcomes. The book helps you distinguish those situations and make the consequences clear.\n\n\n## Owners, Rights, Funding, and Change\n\nThis book focuses mainly on private companies working with **outside investors**. Funding by founders themselves serves as a useful point of comparison, and public markets come up where they influence financing or changes in ownership, but leadership in public companies is not covered in detail.\n\nTo understand the impact of any **outside investment** in a company, keep **four questions** separate: who the owners are, what rights they have, how the company is funded, and what is changing.\n\nThe first question, who the owners are, is where most of the labels and jargon come from. A **venture investor** funds a young company still searching for a repeatable business. A **growth investor** funds the expansion of a business with established demand. A **buyout investor** purchases control. A **corporate investor** is another operating business investing for financial or commercial reasons; it may hold a minority stake or acquire the company outright.\n\nThese labels tell you roughly what kind of investor you are dealing with, but not the answers to the other three questions. Rights do not automatically follow from stake size: a minority investment can carry important approval rights without conferring control. Funding does not follow from deal type: borrowing is a way to raise money and is not confined to buyouts. And the nature of the change is a separate matter again: a **carve-out** means taking a business out of a larger company, a **turnaround** means fixing serious business problems, and either can involve any of the owner types above.\n\nThe practical impact of any investment therefore depends on its actual terms, **established case by case**: the investor's rights, the financing arrangements, the support available, and the time horizon.\n\n\n![A company commitment depends on actual owners, funding, decision rights and expectations.](assets/images/reading-guide/four-questions-before-a-commitment.jpeg)\n**Figure 1:** *A company commitment depends on actual owners, funding, decision rights and expectations..*\n\n## How to Read This Book\n\nThis book aims to build a **shared understanding** of external investment dynamics so that all parties can collaborate more concretely. Part I supplies the financial tools to understand your owners and your available cash. Part II establishes authority, incentives and working relationships. Part III turns expectations into choices about product, engineering and people. Part IV helps you obtain useful investor support. Part V prepares you for funding and ownership changes. Part VI examines historical cases and what remains after a transaction.\n\nNo accounting or technical background is required. On a first pass, read the chapters in order, since each builds on terms introduced earlier. For example, [A Valuation Is an Estimate, Not a Fact](valuation-is-an-estimate.html) teaches financial valuation, and [Turn “We Expect Growth” Into a Design Decision](growth-into-design.html) later applies those concepts to technical choices once the product and engineering foundations are in place.\n\n![The book moves from money and decisions through company work, support, ownership changes and field lessons.](assets/images/reading-guide/owned-reading-journey.jpeg)\n**Figure 2:** *The reading sequence builds the foundations before applying them to work, support and changing ownership.*\n\nThe parts are **ordered for learning**, not by a company's timeline. The events a leader actually faces make up the **ownership cycle**, and they can arrive in any order. Each one raises its own question and sends you back to different parts of the book:\n\n| Event | The company leader's question | Where to look |\n| --- | --- | --- |\n| A first or further funding round | What evidence justifies new money, which rights change, and what can we still fund if it arrives late? | Parts I and V |\n| A purchase of control | Which decisions, obligations and operating commitments change? | Parts II and V |\n| Early work after funding or a transaction | Which promises have money, capacity and an accountable owner? | Parts II and III |\n| A missed target, refinancing or revised investor plan | Which assumptions failed, and which commitment or constraint must change? | Parts I, III and IV |\n| A sale, partial investor exit or corporate integration | Who decides next, and what must keep working through the transition? | Parts V and VI |\n| Continued ownership | What remains worth doing if no transaction happens on the expected date? | Parts IV and VI |\n\n## Meet the Fictional Company\n\n**Larkspur** sells scheduling software to maintenance businesses. Its customers organize appointments and assign people to work. A recurring challenge is **customer onboarding**: the setup and help needed before a customer can use the product successfully.\n\nInes is the **chief executive officer (CEO)**, leading the company. Alex is the **chief technology officer (CTO)**, leading technology. Sam is the **chief financial officer (CFO)**, leading finance. Priya leads product. Morgan is the investor’s technology adviser in fund-backed scenarios.\n\nThe chapters place Larkspur in alternative situations: learning with limited cash, expanding with growth funding, operating after a buyout, or working with a corporate owner. These are fictional decision exercises, not a single company history. Each example states its own assumptions; its figures do not combine into one set of accounts. “€m” means millions of euros.\n\n## Choose a Reading Format or Route\n\nThe 29 main chapters each provide an **Article**, a 300–500-word **TL;DR** summary, and a six-panel **Comic**. TL;DR means “too long; didn’t read.” The comics are illustrated, with captions and dialogue transcripts. The six part introductions and four guide/reference pages do not include TL;DR and comic modalities.\n\nFor a shorter first pass, read the introductions and summaries. For a current decision, use the routes below and return to Part I when a financial term is unfamiliar.\n\n| Your situation | Start with                                                                           |\n| --- |--------------------------------------------------------------------------------------|\n| A funding round has changed targets or decision rights | [An Investment Announcement Is Not a Budget](announcement-is-not-a-budget.html)<br>[Decide Who Decides, Before You Disagree](decide-who-decides.html)<br>[Management Equity, Fund Carry and Employee Jobs Are Different Bets](different-bets.html)                          |\n| New funding may arrive after your current cash runs short | [Interest, Tax and Loan Repayments Come Before Your Budget](obligations-before-budget.html)<br>[You Cannot Fund Every Good Project at Once](cannot-fund-everything.html)<br>[The Roadmap Did Not Slip, the Financing Did](the-financing-slipped.html)           |\n| Owners want more growth or earnings than the team can support | [Raise the Money You Need, Not the Most You Can](raise-what-you-need.html)<br>[You Cannot Fund Every Good Project at Once](cannot-fund-everything.html)<br>[Fix the Decision Problem Before Adding People](fix-decisions-before-hiring.html)        |\n| Investor requests compete with customer needs | [The Chain From Roadmap to Revenue Breaks Easily](roadmap-to-revenue.html)<br>[Decide Who Decides, Before You Disagree](decide-who-decides.html)<br>[Judge an Investor by Their Behavior Under Pressure](investor-under-pressure.html)                                  |\n| A corporate investor wants integration or access to data | [An Acquisition Adds Work Before It Adds Value](acquisition-adds-work-first.html)<br>[Prove You Can Restore, Not Just That You Back Up](prove-you-can-restore.html)<br>[Turn an Offer of Help Into a Useful Engagement](useful-engagement.html) |\n| The investor offers expertise or introductions | [Is the Investor’s Adviser Helping, Assessing or Deciding?](investors-adviser.html)<br>[Find the Help That Changes What Your Team Can Do](help-that-changes-capability.html)<br>[Turn an Offer of Help Into a Useful Engagement](useful-engagement.html)              |\n| A transaction or ownership transition is approaching | [PART V — Leading Through Funding and Ownership Changes](part-5.html), then its three chapters in order                                         |\n\n## Read the Evidence With Its Limits\n\nThis living manuscript was first drafted in September 2026. Its historical cases examine specified periods at Hilton, Skype, Visma, Toys R Us and TeamSystem. The evidence concentrates on private equity and related ownership transitions. It does not establish how all venture, growth or corporate investors behave or perform.\n\nInstitutional funding guides support descriptions of other arrangements. The comparative Larkspur exercises are the author’s illustrations of decisions under stated assumptions. Company filings, investor accounts and research answer different questions; none makes an unobserved customer or employee outcome known.\n\nThe [Bibliography and Evidence Guide](bibliography.html) records consultation scope and evidence limits.\n\n## Contents\n\n### Part I — Understanding Financing and Ownership: Money, Authority and Returns\n\nIdentify your owners’ expectations and the money and decisions you can rely on.\n\n- [PART I — Understanding Financing and Ownership](part-1.html) — part introduction\n- **1.** [Customers, Lenders and Investors: What Each Expects in Return](customers-lenders-investors.html)\n- **2.** [An Investment Announcement Is Not a Budget](announcement-is-not-a-budget.html)\n- **3.** [A Valuation Is an Estimate, Not a Fact](valuation-is-an-estimate.html)\n- **4.** [Same Company, Same Performance, Three Different Returns](three-different-returns.html)\n- **5.** [Raise the Money You Need, Not the Most You Can](raise-what-you-need.html)\n- **6.** [Interest, Tax and Loan Repayments Come Before Your Budget](obligations-before-budget.html)\n\n### Part II — How Investor Ownership Changes Decisions\n\nEstablish who decides, what each party wants and how to resolve competing demands.\n\n- [PART II — How Investor Ownership Changes Decisions](part-2.html) — part introduction\n- **7.** [Decide Who Decides, Before You Disagree](decide-who-decides.html)\n- **8.** [Management Equity, Fund Carry and Employee Jobs Are Different Bets](different-bets.html)\n- **9.** [Judge an Investor by Their Behavior Under Pressure](investor-under-pressure.html)\n\n### Part III — Turning Investor Expectations into Commitments\n\nTurn investor expectations into feasible commitments to customers, systems and teams.\n\n- [PART III — Turning Investor Expectations Into Commitments](part-3.html) — part introduction\n- **10.** [You Cannot Fund Every Good Project at Once](cannot-fund-everything.html)\n- **11.** [The Chain From Roadmap to Revenue Breaks Easily](roadmap-to-revenue.html)\n- **12.** [Can the Software and the Team Deliver What Was Promised?](can-the-team-deliver.html)\n- **13.** [Turn “We Expect Growth” Into a Design Decision](growth-into-design.html)\n- **14.** [Why a Cheaper Cloud Bill Can Be Bad News](cheaper-cloud-bill.html)\n- **15.** [Prove You Can Restore, Not Just That You Back Up](prove-you-can-restore.html)\n- **16.** [An AI Strategy Hides Three Investment Questions](ai-strategy-three-questions.html)\n- **17.** [Fix the Decision Problem Before Adding People](fix-decisions-before-hiring.html)\n- **18.** [An Acquisition Adds Work Before It Adds Value](acquisition-adds-work-first.html)\n\n### Part IV — Beyond Money: Using Investor Support to Build Capability and Accelerate Progress\n\nAsk for help the company can use and agree the cost, authority and continuing dependence.\n\n- [PART IV — Beyond Money: Getting Useful Help From Your Investor](part-4.html) — part introduction\n- **19.** [Is the Investor’s Adviser Helping, Assessing or Deciding?](investors-adviser.html)\n- **20.** [Find the Help That Changes What Your Team Can Do](help-that-changes-capability.html)\n- **21.** [Turn an Offer of Help Into a Useful Engagement](useful-engagement.html)\n\n### Part V — Leading Through Funding and Ownership Changes\n\nLead through funding and ownership changes, including delays and continued ownership.\n\n- [PART V — Leading Through Funding and Ownership Changes](part-5.html) — part introduction\n- **22.** [Diligence Is Your Chance to Correct the Plan Before It Is Signed](diligence-corrects-the-plan.html)\n- **23.** [The First Hundred Days: Turn Expectations Into a Funded Plan](first-hundred-days.html)\n- **24.** [The Roadmap Did Not Slip, the Financing Did](the-financing-slipped.html)\n\n### Part VI — Lessons from the Field\n\nTest leadership judgments against specific histories while keeping the evidence in scope.\n\n- [PART VI — Lessons from the Field](part-6.html) — part introduction\n- **25.** [Hilton and Skype: A Successful Exit Still Needs Explaining](hilton-and-skype.html)\n- **26.** [Visma: Continuity of Manager Is Not Continuity of Money](visma.html)\n- **27.** [Toys R Us: Profitable on Paper, Out of Cash in Practice](toys-r-us.html)\n- **28.** [TeamSystem: Each New Owner Buys the Last Owner’s Progress](teamsystem.html)\n- **29.** [Success for Whom, and for How Long?](success-for-whom.html)\n\n### Reference Material\n\n- [Practical Tools for Ownership and Technology Decisions](toolkit.html) — practical decision and support records.\n- [Glossary](glossary.html) — plain-language definitions.\n- [Bibliography and Evidence Guide](bibliography.html) — sources, consultation dates and evidence limits.\n"}]}]}</script>

                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
