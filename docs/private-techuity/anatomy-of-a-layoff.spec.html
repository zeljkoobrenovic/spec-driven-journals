<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "# Spec: Anatomy of a Layoff\n\n## Intent\n\nFollow a product and engineering reduction from the investor’s request to an authorized, funded operating plan and its consequences for people and delivery. Continue the separate delayed-financing scenario from [Planning on Money That Hasn't Arrived](the-financing-slipped.html) into the deeper reduction it left open: establish the staffing and payroll baseline that chapter never stated, name where the reduction pressure actually comes from (a condition on the bridge, a director’s formal vote, an adviser’s benchmark), compare the alternatives (hiring freeze, contractor reduction, redeployment, pay measures, a reduction), and reconcile notice periods, severance, transition spending, recurring savings and cash by date. Show the resulting team, the work stopped, the customer commitments revised, the knowledge transferred and the responsibilities retained, and address both the people who leave and the people who remain.\n\n## Audience\n\nProduct and engineering leaders inside companies working under investors, including leaders who inherit an ownership arrangement. Assume no specialist finance background; explain necessary terms before use. Investor-side readers are secondary.\n\n## Success criteria\n\n- Frame the chapter, at the author’s request, with the two-sided effect of outside investment on a team: it can expand headcount significantly and quickly, and it adds obligations and financial pressures that can require cost reduction just as quickly, which is how unpopular and damaging layoffs come about; state this as the leader’s condition, not as a prevalence claim.\n- Open on 1 October in the delayed-financing scenario with the board’s costing request and the bridge commitment’s condition; state once that this scenario is deliberately separate from the shared Larkspur ledger and every figure is fictional.\n- State the missing baseline (40 employees, €324,000 monthly payroll by function, €50,000 contractors, €76,000 non-payroll, €250,000 collected revenue, €200,000 net burn) so that it reproduces the earlier chapter’s €200,000 burn, €150,000 after R1 and €500,000 at 31 December without the bridge.\n- Distinguish three pressures with different responses: the investors’ funding condition on the bridge (a cash date, not a headcount number), the investor director’s formal vote and the fictional reserved matter over the operating plan, and the “20% of engineering” benchmark as influence.\n- Compare the alternatives in one table (freeze already in force, R1, redeployment, an executive pay deferral, reduced hours, the chosen reduction R2, the revenue-only floor R3) on recurring saving, one-off cost, first full month of saving and what each removes.\n- Reconcile R2 by date: eight roles, notices on 31 October; three leave payroll on 30 November, three on 31 December, one second-country engineer on 31 January and the other, retained on an agreed fixed term at about €8,500 a month (€17,000), on 31 March; savings of €20,000 in December, €45,000 in January, €63,500 in February and March and €72,000 a month from April; one-off costs of €120,000 paid between November and March (€30,000, €45,000, €32,000, €13,000); a cash table showing €488,000 at 30 June with the bridge (condition met, reserve reached in the first week of August), €200,000 at 30 June without R2 (condition failed) and the reserve breached in January without the bridge whatever R2 does; one contingency of one further month for the retained specialist (€8,500, to 30 April) leaving about €480,000 at 30 June if used.\n- State the cash-timing conclusion conditionally: at Larkspur’s notice periods, severance terms and dates the reduction cannot stand in for the late bridge; elsewhere the answer depends on the costs, savings and funding dates, so the general lesson is to compare them by date. Key points, TL;DR, comic captions and illustration prompts carry the same qualification.\n- Record the decision with chosen option, alternatives rejected, funding, scarce capacity, who is authorized (the board on 15 October with the investor director’s consent; Ines for individual notices within the plan and the law), review dates and the evidence that would change it, including that a later round does not reverse the reduction. Reviews read only evidence that exists by their date: 1 December (notices, bridge, the first customer’s amendment, second-customer progress), 1 February (readiness: departures executed, retention in force, December and January savings against the ramp), 1 March (February’s actual savings), 15 March (transfer test), 1 April (second customer live, March savings, the round’s stage), 1 May (April’s actual full-month savings; contingency outcome).\n- Show the team after R2 (12 engineers, Priya, one product manager, one designer; onboarding, core with the second-country rules, the recovery pair redeployed), the work stopped (the field-worker mobile app, further countries), the customer commitments (both contracts promise first-quarter go-live, with a separate right to terminate after 30 June; the first customer signs an amendment to 30 September before the notices; the second declines any change, so its 31 March promise is kept by retaining one second-country specialist to 31 March, with the engineer-month arithmetic stated and the termination right recorded as the remaining risk; three mobile beta customers), the knowledge-transfer test run on the real second-country work before the specialist leaves (first week of March, read on 15 March; one funded further month to 30 April as the only fallback, retest read on 15 April; board re-planning on 1 May with three recorded options and no contractor assumed), and the on-call and workload consequences for the people who remain.\n- Treat the people who leave concretely (notice, severance formula, accrued leave, options under the leaver terms in [Management Equity, Fund Carry and Employee Jobs Are Different Bets](different-bets.html), references and outplacement) and the people who remain (a published stopped list, the on-call change, what they are not expected to absorb, what would restore the plan), with one communication sequence derived from the same dated cash table.\n- Tie employment-process details to jurisdiction: cite [S77] for the directive’s definition, its establishment-size bands (more than 20 and fewer than 100; at least 100 and fewer than 300; 300 or more, over 30 days) and 90-day alternative, the assimilation of other employer-initiated terminations once there are at least five redundancies, consultation of representatives as a duty distinct from written notification of the authority and the 30-day period, and member states’ freedom to be more favourable; cite [S78] for the US statute’s employer definition (100 or more employees excluding part-time employees, or 100 or more who in aggregate work at least 4,000 hours a week exclusive of overtime), the single-site 30-day plant-closing and mass-layoff tests (33 percent and 50, or 500), the 90-day aggregation rule, 60 days’ notice and its recipients, and the reduced-notice exceptions; present the passage in several short paragraphs; keep Larkspur’s fictional notice, severance and retention terms distinct from any statutory minimum; make no claim about which law governs Larkspur.\n- Add two short variations without a second full case: a profitable company pursuing a margin target (no cash date; the [Management Equity, Fund Carry and Employee Jobs Are Different Bets](different-bets.html) consolidation is the worked example) and an acquisition-related consolidation (the synergy date follows the knowledge-transfer test in [Headcount Is Not Capacity: Trace the Work Before You Hire](fix-decisions-before-hiring.html) and the completion tests in [An Acquisition Adds Work Before It Adds Value](acquisition-adds-work-first.html)).\n- Keep the company leader’s decisions central; distinguish investor influence, formal approval rights and funding conditions throughout; avoid duplicating the delegation, incentive and location material owned by other chapters.\n- Provide a TL;DR of 300–500 words and a six-panel comic consistent with the article, two article figures with numbered captions, the TL;DR overview visual, a header logo and a navigation icon, all generated with the journal’s workflows and read back against their prompts.\n- Close with a handoff to [Hand Over the Obligations, Not Just the Company](handover-of-obligations.html).\n\n## Non-goals\n\nLegal or tax advice on dismissals in any jurisdiction; universal severance or notice formulas; the shared Larkspur ledger (this scenario stays separate); the incentive comparison already worked in [Management Equity, Fund Carry and Employee Jobs Are Different Bets](different-bets.html); the location comparison and knowledge-transfer test already in [Headcount Is Not Capacity: Trace the Work Before You Hire](fix-decisions-before-hiring.html); promises of investment performance or disclosure of confidential inputs.\n\n## Modalities\n\n- Full Article: index.md, the substantive argument.\n- TL;DR: summary.md, the practical implications in concise prose (overview visual pending).\n- Comic: comics.md, six fictional panels generated on 2026-09-16 with the journal’s cast reference (panels 3 and 6 regenerated after a read-back); alt text, visible captions, dialogue transcripts and machine-readable prompts.\n\n## Open questions\n\nArtwork is complete (generated 2026-09-16 once an image-generation key was available). No evidence on Larkspur’s jurisdiction is asserted; readers must check their own thresholds.\n\n## Decision log\n\n- 2026-09-16: Created in Part V after [Planning on Money That Hasn't Arrived](the-financing-slipped.html) rather than in Part III beside the organization chapter, so that the assessment → organization → design sequence of Part III stays intact and the reduction continues the delayed-financing scenario whose figures it needs. Rejected: folding the reduction into the financing chapter (already 13 minutes; the reduction needs its own baseline and record) and reusing the shared ledger (its envelope and dates are the wrong scale for a company-wide reduction).\n- 2026-09-16: Continue the separate scenario’s figures (€1.6m on 1 July, €200,000 burn, €400,000 reserve, R1 at €50,000 a month, the €600,000 bridge) and invent only what that chapter left undefined: the staffing baseline, the bridge’s condition and the reduction itself.\n\n## Sources\n\nThe delayed-financing chapter supplies the scenario; the organization chapter supplies the knowledge-transfer test; the governance chapter supplies the approval map. External: Council Directive 98/59/EC [S77] and the US Worker Adjustment and Retraining Notification Act [S78], consulted for the thresholds, notice and consultation mechanics named in the text. Chapter-end reading (Sucher and Gupta; Trevor and Nyberg; Datta and others; Brockner) verified by title, authors and venue on 16 September 2026.\n\n## Changelog\n\n- 2026-09-16 (artwork): six comic panels, the TL;DR visual, two article figures and the header logo generated with the journal’s generators and read back; panels 3 and 6 regenerated with corrected scene prompts (first renders archived in `_research/discarded-comic-variants/`); the navigation icon generated by the author earlier the same day kept. Status accepted.\n- 2026-09-16 (second review response): the second customer’s first-quarter promise is kept rather than reinterpreted (one specialist retained to 31 March, €17,000 now in the plan; €488,000 at 30 June as the base case, one further month as the only contingency); the transfer test moved onto the real second-country work in March with a bounded fallback and no contractor assumed; the review calendar re-dated so each review reads evidence that exists; the employment-law passage split into short paragraphs with the exact 33 percent test and the overtime exclusion. Supersedes the first response’s sequencing-to-June and December-test entries.\n- 2026-09-16 (author request): opening paragraph added on how outside investment both expands headcount quickly and brings the obligations and pressures that can force equally quick reductions; TL;DR opening aligned.\n- 2026-09-16 (review response): second customer’s contractual date met by sequencing with a funded contingency instead of an unagreed September date; knowledge-transfer fallback bounded and funded (retest 15 January, extension to 31 March of up to €17,000 by agreement, re-planning at 1 April) with the contingency case costed (€488,000 at 30 June); the cash-timing conclusion made conditional on Larkspur’s terms and dates across article, key points, TL;DR, comic and figure prompts; employment-law summary corrected and qualified against S77 and S78 (band boundaries, assimilation rule, consultation versus notification, aggregation, exceptions, national and state rules).\n- 2026-09-16: Rename the folder to `32-anatomy-of-a-layoff` and the permalink to `anatomy-of-a-layoff` at the author’s request, before any public deployment of the chapter; asset paths and every cross-reference updated; body unchanged.\n- 2026-09-16: Retitle the post from “When the Headcount Plan Shrinks” to “Anatomy of a Layoff” at the author’s request. Permalink and folder unchanged at that point (renamed later the same day, see the entry above); body unchanged.\n- 2026-09-16: Initial spec, status accepted; article, TL;DR and comic storyboard written the same day; artwork pending.\n"}]}]}</script>

    (function () {

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');

                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
