<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "# Spec: Critically Evaluate AI Costs: Measure the Return per Task and per Period\n\n## Intent\n\nShow a leader under investors how to read the running cost and the return of AI the company already runs, in the product it sells and in the tools its staff use, the way [Critically Evaluate Cloud Costs: A Lower Bill Is Not Always Better](cheaper-cloud-bill.html) reads a cloud bill: choose a unit of useful customer work, put every figure on one comparable basis, separate why the cost changed (usage, rates, the way the feature is built), decide how much to commit under a stated demand range, and record the exposure that remains. The reader leaves able to compute the return on an AI feature or tool per period from figures they actually have, to say what would make it stop paying, and to answer an investor who asks for \"the AI ROI\" with a number that has a unit, a period and a condition attached.\n\nThe chapter is the third chapter of Part VI, after cloud costs and resilience. It continues [Clarify AI Strategy: Three Different Investment Questions](ai-strategy-three-questions.html), whose product trial and support pilot it takes as having passed, and it complements [Scale the Team With AI: Capacity Claims Need the Same Evidence as Headcount](scale-the-team-with-ai.html), which measures capacity; this chapter measures money.\n\n## Context\n\nLarkspur, the book's fictional scheduling-software company, is in 2027. The document-sorting feature that three customers trialled at €300 a month each (running cost about €60 a month per customer at trial volume) passed its release gate on 11 December 2026 and is in general release to paying customers. The support assistant from the same chapter is rolled out to six agents (licences about €3,600 a year, evaluation upkeep about €4,400 a year). The coding and setup pilots of [Scale the Team With AI: Capacity Claims Need the Same Evidence as Headcount](scale-the-team-with-ai.html) have ended and their gate results are stated as assumptions, not re-argued. The people are the same (Alex technology, Priya product, Ines the company, Sam finance, Morgan the investor's adviser). Every new figure is fictional; the shared Larkspur ledger is not touched.\n\n## Audience\n\nProduct and engineering leaders inside companies working under investors, including leaders who inherit an ownership arrangement. Assume no specialist finance background; explain necessary terms before use. Investor-side readers are secondary.\n\n## Success criteria\n\n- **A unit that explains the business.** For the product feature, cost and return are expressed per useful customer task (a document sorted and accepted without correction), never per token or per model call alone; for the internal tools, per ticket resolved and per change completed, inheriting the definitions of [Scale the Team With AI: Capacity Claims Need the Same Evidence as Headcount](scale-the-team-with-ai.html). Explain token, model call, inference and context at first use, and show why the same feature's model cost per task rises as prompts, retrieved context and retries grow, even when the price per token falls. Construction effects (the 80% rise, the 35% proposed saving) are stated as changes in model cost per document at unchanged vendor prices, so that model mix (retries to a costlier model, easy documents routed to a cheaper one) and cached context billed at a reduced rate are inside the measure; a raw token count is never equated with spending.\n- **One comparable basis.** A table puts the feature's monthly figures on one basis: price paid by the customer, model and hosting charges, evaluation and monitoring upkeep, the share of engineering time that keeps it working, and support load, for at least two dated months, so that a margin per customer and per task can be read off and compared.\n- **Separate why the cost changed.** Decompose a cost change into usage (more customers, more documents per customer), rates (vendor price per token, up or down) and construction (longer prompts, more context, retries, a larger model chosen for quality), as the cloud chapter separates usage, rates and architecture. Each cause has a different owner and a different remedy, stated.\n- **Return with a unit, a period and a condition.** Define return on investment (ROI) in ordinary words with a plain example at its first meaningful use, compute it for the feature and for one internal tool for a stated period, separate customer value (the estimated value of time freed, not money, derived from the trial's review-effort limit rather than presented as a measured result) from revenue from contribution before existing payroll (supplier costs counted in the months they concern, with the money actually collected and paid reconciled against them so that no period cost is called cash), and state the condition under which it holds (quality above the release threshold on both samples, review effort below its per-customer limit). Every ROI figure in every format carries its period and its condition; none is presented as a permanent property of the feature, and a figure that includes an estimated month or a year not yet closed is labelled a projection wherever it is quoted (artwork included: Figure 2's period figures carry \"projected\" and the €540 its per-customer unit), with the assistant's €64,000 named as employment cost and its €8,000 as licences and upkeep. The assistant's 300% is labelled a return on those recurring payments, excluding the €2,000 of rollout and training time, with the result including that time (€22,000 on €10,000, 220%) beside it in every format; the seventh agent's licence is accounted for (the agent works unassisted during induction in 2027, as the pilot chapter's six-licence figure assumes; seven licences, €4,200, plus €4,400 of upkeep make the 2028 cost about €8,600, labelled as licences plus upkeep in the artwork and alt text, and the pilot chapter's \"about €8,000 from 2028\" explained as its six-licence figure). The feature's running return is a return on supplier running cost before staff costs, named as such in the definition, the artwork and the comic, with the result after allocated staff time (about €800 short over the six months) stated beside it. A compact before-and-after calculation shows what the proposed construction saving does to the monthly operating result and to the cost-per-customer rule, with the one-off engineering effort kept separate; €914.40 is the projected monthly surplus and €2,038.40 the improvement on August, and a better month reduces the unrecovered balances only gradually, never establishing payback by itself. The −€18,098 and −€79,398 are unrecovered balances, not spending totals. Period totals reconcile to monthly inputs, and any cumulative balance names every one-off and operating cost it includes, cash and allocated staff time separately, so that no cost is counted twice or dropped.\n- **A commitment decision under a demand range.** The vendor offers a committed-spend discount for a year on the usage the fixed payment covers, with excess usage at list price. Derive the demand range explicitly from customers × documents per customer × post-change cost per document, show the cost at the low, expected and high ends with and without the commitment, state the crossover points between options, treat a committed minimum as an obligation like the cloud chapter's minimum spend, and check what an ownership change, a vendor price change (in the correct direction: a higher price means the fixed payment covers fewer tokens) or a model retirement does to it, with a timeline of notice, successor test access, decision and payments still owed, written as explicit branches for timely, late and absent successor access (for each: the notice action, the last fixed payment, the pricing and processing mode from the retirement date and the suspension path), with the access deadline (sixty days before the retirement date) named separately from the sixty-day testing window after access, missing usable access by that deadline stated as a negotiated termination trigger in its own right, and a successor that passes in time staying under the commitment, where ending the commitment is a right, not a delivery guarantee: sorting continues from the retirement date only on a model measured on the release-gate samples, with each customer's planner capacity confirmed for the review-aid mode, and is otherwise suspended with the service change agreed with the customer. The funded usage period (2028) is distinguished in every format from the payment tail that 2028 usage produces in early 2029, which is reserved, not a further year of usage; the payment dates follow from stated invoice terms (overage invoiced on the first day of the following month, due 45 days later, so November and December usage is paid by 15 January and 15 February 2029). Ordinary non-cancellation is stated separately from any negotiated termination right. The chronology is one line: the September review approves the option conditionally, the release-gate samples and October's measured bill supply the evidence, and the signature follows that evidence in a named month; no format shows a signature before the evidence exists. Record the decision with chosen option, alternatives rejected, funding, who is authorized, a dated review and the evidence that would reopen it.\n- **The stop and reprice rules.** State, before the review, what would make the feature stop paying: a token cost per task above a named fraction of the price, quality below the threshold (ordinary and safety samples kept separate, as in the trial), review effort at or above its per-customer limit, a vendor price rise above a named level, or customers declining the price at renewal, and what the response to each is (reprice, change the construction, change model, review-aid mode, suspend, withdraw), including who performs any fallback, that continued processing depends on the customer confirming planner capacity for it (otherwise processing is suspended and the service change agreed with the customer), and that a review-effort failure is answered by remeasuring the time saved against that customer's manual baseline and agreeing revised scope or price or withdrawing the feature for that customer, never by a higher fee alone. Tie the customer promise to the trial's conditions, not to open-ended continuation. Any retention exception is a provisional continuation test with comparable groups, a window and a minimum sample, not proof of causation (the TL;DR and comic included), and its loss cap and expiry are unconditional.\n- **Investor questions answered as they are asked.** Give the leader answers to \"what is our AI ROI\", \"why is the AI bill growing faster than revenue\" and \"should we commit to a bigger contract\" that each point at the unit, the decomposition and the commitment decision above rather than at a single number.\n- **House rules.** Status highlight and key points readable without prior study and in ordinary words (essential terms such as token introduced where first used, including in the highlights); long explanations split so that each paragraph carries one point (calculation, projection and consequence for the assistant; eligibility, evidence, loss cap and expiry for the retention exception); quantitative figures drawn from numeric coordinates on one consistent scale, or labelled schematic; the opening leads with the concrete problem and the three questions before the history; terms explained in each format at first meaningful use (AI, ROI, tokens, margin, loaded cost, customer-months, overage, arrears, percentage points, source-title abbreviations), independently in the TL;DR and the comic, with plain substitutes preferred over jargon in the TL;DR (reused background text billed more cheaply rather than cached context; document samples used to check release quality rather than release-gate samples; a replacement model that fails those checks rather than a failed successor; a minimum payment owed even when usage falls rather than a floor); the comic's stated calculation order matches the order applied (usage, construction, rates); the final comic's return figures carry their periods (April to September 2027; 2027) in the artwork; each comic caption paragraph carries one point (contract rights, deadline, fallback; one paragraph per investor answer); figure labels readable at phone width without relying on colour; claims about billing models scoped to this feature, not to AI or licences in general; the company leader's decision, authority and funding assumptions explicit; historical findings within source scope, fictional scenarios labelled; a meaningful counterargument (a feature can be worth keeping at a loss for a period if it wins renewals, but only with a dated limit and the loss stated) with the evidence that would change the judgment; hand-off to Part VII; TL;DR and comic consistent with the article.\n\n## Non-goals\n\n- Not a repeat of the three AI investment questions, the trial design or the support pilot; those are taken as done and linked.\n- Not a capacity or headcount argument; that is [Scale the Team With AI: Capacity Claims Need the Same Evidence as Headcount](scale-the-team-with-ai.html).\n- Not a vendor or model comparison, a price list, or a forecast of token prices; figures illustrate the method and are labelled fictional. No prevalence claims about AI margins in general.\n- Not a data-protection or security treatment beyond what the commitment decision needs; the NIST profile is linked, not taught.\n\n## Modalities\n\n- [ ] `checklist.md` — not used in this journal's main chapters.\n- [x] `summary.md` — TL;DR of 300–500 words (counted without image alt text) with one overview visual; it keeps the decision, the supplier-versus-staff distinction and the essential conditions, says what the support assistant does and the €32,000 of 2027 employment cost its deferred hire avoids, states each deadline with the event that starts it (a price-rise notice; the testing window after successor access, or the access deadline when access never arrives), and points at the article for the detailed stop rules rather than repeating them.\n- [ ] `dialog.md` — not used.\n- [x] `comics.md` — comic pages of three stacked strips, same cast as the neighbouring chapters, reaching the commitment decision causally.\n\n## Open questions\n\n- Which external sources to register: [S16] FinOps unit economics already exists and fits; a vendor pricing page or a published token-pricing history would need fetching and dating before use, and the chapter may do without it by keeping all prices fictional.\n- Whether the internal-tool return uses the support assistant (figures exist in [Clarify AI Strategy: Three Different Investment Questions](ai-strategy-three-questions.html)) or the coding tool (figures exist in [Scale the Team With AI: Capacity Claims Need the Same Evidence as Headcount](scale-the-team-with-ai.html)); the default is the support assistant, whose annual figures are already stated, with the coding tool mentioned once.\n\n## Decision log\n\n- 2026-09-24: The author asked for an AI chapter in SUSTAIN about AI return on investment and token costs. Scope is both AI in the product and internal tools (author's choice over product-only or tools-only), the scenario continues the AI strategy chapter's product example (author's choice over a separate example), and the endpoint is a recorded commitment decision under a demand range like the cloud chapter (author's choice over a method-only chapter).\n- 2026-09-24: Title form follows the SUSTAIN neighbours' imperative-plus-claim pattern. First title “Keep AI Worth Its Cost: Tokens Are a Running Cost, Not a Licence” was rejected by the author as unclear (it compressed the part name and the licence-versus-usage point into jargon); replaced by “Critically Evaluate AI Costs: Measure the Return per Task and per Period”, which parallels the cloud chapter and names the method. Also considered: “Measure AI Return on Investment: The Bill Grows With Use and With How You Build”, “Track AI Running Costs: A Usage Bill Moves After You Approve It”.\n- 2026-09-24: In-depth review round 1 (AIC-001 to AIC-013). The August model charges are recomputed from unrounded inputs (€1,400 ÷ 9,000 documents, +80% tokens per document, −20% price) and land at €5,824 instead of €5,840, so the running cost, margins and period totals follow; the 2028 demand range is now derived from the forecast customers (35 / 55 / 80 at 650 documents each) at the post-construction cost per document (about 14.6 cents), giving about €3,300 / €5,200 / €7,600 with a €2,000 stress case, and the commitment options are resized to that range (C commits €2,400 covering €3,200; B commits €3,900 covering €5,200); the cumulative balance is reconciled cash and staff time separately (about €18,000 and about €79,000 short); the price-change clause is corrected (a higher price means the fixed payment covers fewer tokens); the failed-successor termination right is separated from ordinary non-cancellation; the retention exception becomes a provisional test with groups, window and minimum sample. Alternative considered and rejected: keeping the €5,000–€14,000 range by assuming higher document volumes or prices, which would have needed undisclosed inputs.\n- 2026-09-24: In-depth review round 2 (AIC-004 to AIC-010, AIC-014, AIC-015). The operating result is renamed contribution before payroll with supplier costs in the months they concern, and reconciled to money movements (€57,000 collected, €22,674 paid for April to August, September's €7,424 payable in October); the 80% and 35% construction figures are redefined as model cost per document at unchanged prices; the successor clause gains an access deadline (usable access with the notice or within thirty days; if not at least sixty days before retirement, the right to end applies as if the samples had failed); the review-aid fallback is conditional on confirmed planner capacity with suspension otherwise, and the review-effort rule remeasures time saved against the manual baseline; the assistant's result is a projection with its conditions and its €64,000 named as employment cost; the chronology is September approval, October bill, November signature; Figures 1 and 3 are rendered from numeric coordinates (authored SVG via Playwright, the same method as the layoff chapter's cash chart) rather than re-rolled through Gemini, which twice failed to keep the scale. Alternative considered and rejected: keeping the cash labels and adding a footnote, which would still call a period cost cash.\n- 2026-09-24: In-depth review round 3 (AIC-004 to AIC-006, AIC-008 to AIC-010, AIC-016, AIC-017). The running return is renamed a return on supplier running cost before staff costs in the article, Figure 2, the comic's page 4 artwork and the TL;DR, with the six-month result after allocated staff time (−€798) stated beside it; a before-and-after paragraph shows the 35% saving at August's volume (model charges €3,785.60, supplier running cost €5,385.60, €134.64 per customer, €914.40 after staff time), separate from the €4,200 of one-off engineering effort and from recovery of historical costs; the successor clause is written as three branches (timely, late, absent access) in which ending the commitment is a right, not a fallback, and sorting from the retirement date depends on a model measured on the samples plus confirmed planner capacity, otherwise suspension; the funded 2028 usage is distinguished from the January and February 2029 payments for November and December usage (article, comic page 5 artwork and dialogue); Figure 2 gains \"projected, September estimated\" and \"per customer\"; the comic's final answer carries the assistant's conditions in the artwork; the page 3 caption names the applied order usage, construction, rates; the TL;DR is cut to under 500 words with plain substitutes for cached context, release-gate samples, failed successor and floor; long paragraphs in the article and comic captions are split. Alternative considered and rejected: dropping the staff-time figure from the running return so as to keep a single headline number, which would have left the 90% readable as operating profitability.\n- 2026-09-24: In-depth review round 4 (AIC-006, AIC-008, AIC-010, AIC-016 to AIC-020). The retirement clause names two dates, the access deadline sixty days before retirement and the sixty-day testing window after access, and makes missing access by the deadline a negotiated termination trigger; a successor that passes in time stays under the commitment, and every other branch runs at flexible prices from the retirement date (worked through for a 1 February 2028 notice and a 1 August retirement). Overage is invoiced on the first of the following month and due 45 days later, which yields the 15 January and 15 February 2029 payments; alternative considered and rejected: keeping 30 days, which moves November's payment into December 2028 and the schedule off the stated months. The assistant's 300% is labelled a return on recurring licence and upkeep payments, with 220% after the €2,000 of rollout time; the seventh agent's 2027 licence is handled as an explicit assumption (unassisted induction, consistent with the pilot chapter's €3,600 for six licences) rather than recomputing to about 293%, which would have broken the pilot chapter's €24,000; 2028 carries seven licences, about €8,600. The TL;DR's retention clause no longer claims causation; €914.40 is the monthly surplus, €2,038.40 the improvement.\n- 2026-09-24: In-depth review round 5 (AIC-006, AIC-010, AIC-018, AIC-021, AIC-022). The €540 customer value is described as a conservative estimate at the trial's 1.5-hour review limit, (4 − 1.5) × 4.3 <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
