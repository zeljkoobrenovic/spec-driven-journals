<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "# Spec: Critically Evaluate AI Costs: Measure the Return per Task and per Period\n\n## Intent\n\nShow a leader under investors how to read the running cost and the return of AI the company already runs, in the product it sells and in the tools its staff use, the way [Critically Evaluate Cloud Costs: A Lower Bill Is Not Always Better](cheaper-cloud-bill.html) reads a cloud bill: choose a unit of useful customer work, put every figure on one comparable basis, separate why the cost changed (usage, rates, the way the feature is built), decide how much to commit under a stated demand range, and record the exposure that remains. The reader leaves able to compute the return on an AI feature or tool per period from figures they actually have, to say what would make it stop paying, and to answer an investor who asks for \"the AI ROI\" with a number that has a unit, a period and a condition attached.\n\nThe chapter is the third chapter of Part VI, after cloud costs and resilience. It continues [Clarify AI Strategy: Three Different Investment Questions](ai-strategy-three-questions.html), whose product trial and support pilot it takes as having passed, and it complements [Scale the Team With AI: Capacity Claims Need the Same Evidence as Headcount](scale-the-team-with-ai.html), which measures capacity; this chapter measures money.\n\n## Context\n\nLarkspur, the book's fictional scheduling-software company, is in 2027. The document-sorting feature that three customers trialled at €300 a month each (running cost about €60 a month per customer at trial volume) passed its release gate on 11 December 2026 and is in general release to paying customers. The support assistant from the same chapter is rolled out to six agents (licences about €3,600 a year, evaluation upkeep about €4,400 a year). The coding and setup pilots of [Scale the Team With AI: Capacity Claims Need the Same Evidence as Headcount](scale-the-team-with-ai.html) have ended and their gate results are stated as assumptions, not re-argued. The people are the same (Alex technology, Priya product, Ines the company, Sam finance, Morgan the investor's adviser). Every new figure is fictional; the shared Larkspur ledger is not touched.\n\n## Audience\n\nProduct and engineering leaders inside companies working under investors, including leaders who inherit an ownership arrangement. Assume no specialist finance background; explain necessary terms before use. Investor-side readers are secondary.\n\n## Success criteria\n\n- **A unit that explains the business.** For the product feature, cost and return are expressed per useful customer task (a document sorted and accepted without correction), never per token or per model call alone; for the internal tools, per ticket resolved and per change completed, inheriting the definitions of [Scale the Team With AI: Capacity Claims Need the Same Evidence as Headcount](scale-the-team-with-ai.html). Explain token, model call, inference and context at first use, and show why the same feature's token cost per task rises as prompts, retrieved context and retries grow, even when the price per token falls.\n- **One comparable basis.** A table puts the feature's monthly figures on one basis: price paid by the customer, model and hosting charges, evaluation and monitoring upkeep, the share of engineering time that keeps it working, and support load, for at least two dated months, so that a margin per customer and per task can be read off and compared.\n- **Separate why the cost changed.** Decompose a cost change into usage (more customers, more documents per customer), rates (vendor price per token, up or down) and construction (longer prompts, more context, retries, a larger model chosen for quality), as the cloud chapter separates usage, rates and architecture. Each cause has a different owner and a different remedy, stated.\n- **Return with a unit, a period and a condition.** Define return on investment (ROI) in ordinary words, compute it for the feature and for one internal tool for a stated period, separate customer value from revenue from cash, and state the condition under which it holds (quality above the release threshold, review effort below its limit). Every ROI figure in every format carries its period and its condition; none is presented as a permanent property of the feature.\n- **A commitment decision under a demand range.** The vendor offers a committed-spend discount for a year. Decide how much to commit against a stated range of expected usage, show the cost at the low, expected and high ends with and without the commitment, treat a committed minimum as an obligation like the cloud chapter's minimum spend, and check what an ownership change or a vendor price change does to it. Record the decision with chosen option, alternatives rejected, funding, who is authorized, a dated review and the evidence that would reopen it.\n- **The stop and reprice rules.** State, before the review, what would make the feature stop paying: a token cost per task above a named fraction of the price, quality below the threshold, a vendor price rise above a named level, or customers declining the price at renewal, and what the response to each is (reprice, change the construction, change model, withdraw). Tie the customer promise to the trial's conditions, not to open-ended continuation.\n- **Investor questions answered as they are asked.** Give the leader answers to \"what is our AI ROI\", \"why is the AI bill growing faster than revenue\" and \"should we commit to a bigger contract\" that each point at the unit, the decomposition and the commitment decision above rather than at a single number.\n- **House rules.** Status highlight and key points readable without prior study; terms explained in each format; the company leader's decision, authority and funding assumptions explicit; historical findings within source scope, fictional scenarios labelled; a meaningful counterargument (a feature can be worth keeping at a loss for a period if it wins renewals, but only with a dated limit and the loss stated) with the evidence that would change the judgment; hand-off to Part VII; TL;DR and comic consistent with the article.\n\n## Non-goals\n\n- Not a repeat of the three AI investment questions, the trial design or the support pilot; those are taken as done and linked.\n- Not a capacity or headcount argument; that is [Scale the Team With AI: Capacity Claims Need the Same Evidence as Headcount](scale-the-team-with-ai.html).\n- Not a vendor or model comparison, a price list, or a forecast of token prices; figures illustrate the method and are labelled fictional. No prevalence claims about AI margins in general.\n- Not a data-protection or security treatment beyond what the commitment decision needs; the NIST profile is linked, not taught.\n\n## Modalities\n\n- [ ] `checklist.md` — not used in this journal's main chapters.\n- [x] `summary.md` — TL;DR of 300–500 words with one overview visual.\n- [ ] `dialog.md` — not used.\n- [x] `comics.md` — comic pages of three stacked strips, same cast as the neighbouring chapters, reaching the commitment decision causally.\n\n## Open questions\n\n- Which external sources to register: [S16] FinOps unit economics already exists and fits; a vendor pricing page or a published token-pricing history would need fetching and dating before use, and the chapter may do without it by keeping all prices fictional.\n- Whether the internal-tool return uses the support assistant (figures exist in [Clarify AI Strategy: Three Different Investment Questions](ai-strategy-three-questions.html)) or the coding tool (figures exist in [Scale the Team With AI: Capacity Claims Need the Same Evidence as Headcount](scale-the-team-with-ai.html)); the default is the support assistant, whose annual figures are already stated, with the coding tool mentioned once.\n\n## Decision log\n\n- 2026-09-24: The author asked for an AI chapter in SUSTAIN about AI return on investment and token costs. Scope is both AI in the product and internal tools (author's choice over product-only or tools-only), the scenario continues the AI strategy chapter's product example (author's choice over a separate example), and the endpoint is a recorded commitment decision under a demand range like the cloud chapter (author's choice over a method-only chapter).\n- 2026-09-24: Title form follows the SUSTAIN neighbours' imperative-plus-claim pattern. First title “Keep AI Worth Its Cost: Tokens Are a Running Cost, Not a Licence” was rejected by the author as unclear (it compressed the part name and the licence-versus-usage point into jargon); replaced by “Critically Evaluate AI Costs: Measure the Return per Task and per Period”, which parallels the cloud chapter and names the method. Also considered: “Measure AI Return on Investment: The Bill Grows With Use and With How You Build”, “Track AI Running Costs: A Usage Bill Moves After You Approve It”.\n- 2026-09-24: Placed third in Part VI so that the unit-cost method arrives from the cloud chapter and the quality prerequisite from the resilience chapter before both are applied to AI.\n\n## Sources\n\n- Author's intent from the 24 September 2026 conversation (no `INPUT.md`).\n- [Clarify AI Strategy: Three Different Investment Questions](ai-strategy-three-questions.html) — the document-sorting trial (€300 price, about €60 running cost per customer at trial volume, quality and review thresholds, release gate 11 December 2026) and the support assistant's annual figures; this chapter continues them.\n- [Critically Evaluate Cloud Costs: A Lower Bill Is Not Always Better](cheaper-cloud-bill.html) — the unit, the comparable basis, the usage/rates/architecture decomposition, the commitment decision under a demand range and the minimum-spend treatment this chapter mirrors.\n- [Scale the Team With AI: Capacity Claims Need the Same Evidence as Headcount](scale-the-team-with-ai.html) — the capacity definitions the internal-tool return inherits.\n- [Build And Test Resilience: Backups Are Not Enough](prove-you-can-restore.html) — quality as a prerequisite before a saving is counted.\n- Bibliography: [S16] FinOps unit economics; [S18] NIST generative AI profile (linked only). Further sources only after verification.\n\n## Changelog\n\n- 2026-09-24: Status `accepted` at the author's instruction (“all of it”) after the article, TL;DR, comic, figures, logo, icon and Probe Further were produced; the folder-placement open question is resolved by the renumbering.\n- 2026-09-24: Retitled at the author's request (see decision log); permalink `ai-worth-its-cost` unchanged.\n- 2026-09-24: Created as `draft` from the author's intent; scope, scenario and endpoint decisions recorded. No `index.md` yet.\n"}]}]}</script>

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);

                    }

                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {

                        i++;
                    }

                    const cellOpen = function (tag, idx) {

                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
