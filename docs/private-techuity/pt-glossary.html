<script id="data" type="application/json">{"meta": {"title": "Glossary", "date": "2026-09-12", "permalink": "pt-glossary", "status": "draft:orange", "excerpt": "Plain-language definitions organized in the order you encounter the book’s main subjects."}, "tags": [], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **KEY POINTS:**\n>\n> * **Use this page to recall a term when you need it.** The chapters teach the ideas and calculations in sequence.\n> * **Check what each number describes.** Sales, profit, cash and estimated value answer different questions.\n> * **Read the definition in the actual document too.** Contracts and company reports may use more specific calculations than these teaching definitions.\n\n<br>\nThe glossary follows the book’s learning sequence: basic funding, investment organizations, financial measures, transactions, investment choices, company work and evidence. Use your browser’s Find command to look for a word or abbreviation. Related terms are separated where that makes them easier to distinguish.\n\n## Basic Funding and Ownership\n\nStart with [How Companies Get Money](pt-how-companies-get-money.html). The stock and public-company definitions use Investor.gov’s educational material; the capital-structure definition follows Damodaran’s finance teaching. [S54: Stock basics](https://www.investor.gov/introduction-investing/investing-basics/investment-products/stocks) [S55: Public companies](https://www.investor.gov/introduction-investing/investing-basics/how-stock-markets-work/public-companies) [S57: Capital structure](https://people.stern.nyu.edu/adamodar/pdfiles/cf2E/capstru.pdf)\n\n| Term | Plain-language meaning |\n| --- | --- |\n| Financing | Arranging the money a business needs. |\n| Capital | Money or other resources supplied to fund an activity or investment; the exact meaning depends on context. |\n| Debt | Money owed under a borrowing arrangement. |\n| Principal | The amount borrowed, as distinct from interest. In “Technology Principal,” Principal is a job title. |\n| Interest | The charge for using borrowed money. |\n| Equity | An ownership interest. In a balance sheet, equity is the accounting amount remaining after liabilities are deducted from assets. |\n| Share / shareholder | A unit of company ownership / its holder. Ten of 1,000 identical shares represents 1% of those shares; share classes can have different rights. |\n| Dividend | A payment to shareholders under the company’s arrangements. |\n| Asset / liability | A resource the business controls that can provide future benefit / an obligation, such as an amount owed. |\n| Capital structure | The mix of debt and equity financing. It is distinct from a list of all cash sources, such as customer payments and asset sales. |\n| Stock exchange | An organized market where investors trade shares and other securities. |\n| Public company | In this book, usually a company with publicly traded shares. Legal public-reporting categories can be broader; reporting obligations vary. |\n| Private company | A company without shares traded on a public stock market. It may still have many owners and significant reporting obligations. |\n| Initial public offering (IPO) | The first public offering of a company’s shares. It may raise company money, let existing owners sell, or do both. |\n| Private equity (PE) | Ownership investment outside public stock markets, including transactions taking public companies private. Broad usage includes venture and growth investment; narrower usage often means buyouts. |\n| Board of directors | The body overseeing a company within its authority. Its responsibilities differ from executives’ day-to-day management. |\n| CEO / CTO / CFO | Chief executive officer, leading the company; chief technology officer, leading technology; chief financial officer, leading finance. Actual duties and authority vary. |\n\n## The Investment Organizations and Their Payments\n\nFor the money-flow example, read [An Investment Announcement Is Not a Budget](pt-capital-and-ownership.html). Fund terms depend on the agreement. [S01: SEC private equity guide](https://www.investor.gov/introduction-investing/investing-basics/investment-products/private-investment-funds/private-equity) [S02: ILPA principles](https://ilpa.org/wp-content/uploads/2019/06/ILPA-Principles-3.0_2019.pdf)\n\n| Term | Plain-language meaning |\n| --- | --- |\n| Investment firm / manager / sponsor | The organization managing investments. “Sponsor” commonly refers to the firm behind a transaction; it can mean the leader backing a project in an operating discussion. |\n| Fund | A pool of investment money with its own investors, agreements and lifetime. One firm can manage several funds. |\n| General partner (GP) | The partner with management responsibilities and powers under the fund arrangements. The term is also used informally for the manager. |\n| Limited partner (LP) | An investor in the fund under its partnership arrangements. |\n| Endowment | A pool of assets invested to support an institution, such as a university. |\n| Commitment | A promise to supply money under agreed conditions. |\n| Capital call | A request for an investor to pay part of its commitment. |\n| Investment period / fund term | The period for making specified new investments / the wider lifetime of the fund. Agreements govern extensions and further investments. |\n| Holding company / acquisition vehicle | A company used to hold or acquire an investment. It may also borrow and have its own obligations. |\n| Portfolio / portfolio company | The collection of investments / an operating business owned wholly or partly through an investment. |\n| Investment committee | The body authorized to make investment decisions within the fund’s arrangements. |\n| Mandate | The agreed scope of investments, responsibilities or authority. State which meaning applies. |\n| Management fee | A payment for managing investments under an agreed calculation. |\n| Carried interest / carry | A contractual share of investment profits allocated to the manager or other entitled recipients. It is separate from company executives’ shares. |\n| Distribution | Money or other assets paid out to investors. State whether a reported distribution is cash. |\n| Distribution waterfall | The order and formulas used to allocate investment payments. |\n| Preferred return / hurdle | A threshold relevant to when specified profit sharing begins. It is not a guaranteed investment return. |\n| Catch-up | A rule that allocates a larger share of certain subsequent payments to a recipient after earlier conditions are met. |\n| Clawback | A requirement to return excess payments previously received, under the agreement’s conditions. |\n| Subscription line | Borrowing by a fund that can cover spending before its investors supply cash. It can change the timing of investor payments. |\n\n## Sales, Earnings and Cash\n\n[A Valuation Is an Estimate, Not a Fact](pt-valuation-and-architecture.html) introduces the earnings calculation; [A Profitable Company Can Still Run Out of Cash](pt-cash-and-constraints.html) follows the payments it leaves out. Accounting and reported adjustments need their own definitions. [S06: SEC non-GAAP guidance](https://www.sec.gov/rules-regulations/staff-guidance/corporation-finance-interpretations/non-gaap-financial-measures) [S07: IAS 38 overview](https://www.ifrs.org/issued-standards/list-of-standards/ias-38-intangible-assets/)\n\n| Term | Plain-language meaning |\n| --- | --- |\n| Revenue | Sales recognized during a period. Customer payment may occur earlier or later. |\n| Earnings / profit | Income less the costs included in a stated measure. Always name the measure. |\n| Net profit / net loss | The final positive or negative result after the income statement’s income and charges. |\n| Income statement | A financial statement showing income and expenses over a period. |\n| Balance sheet | A statement of assets, liabilities and equity at a particular date. |\n| Depreciation / amortization | Charges spreading certain asset costs over time. Depreciation commonly concerns equipment; amortization commonly concerns intangible assets such as qualifying software. |\n| EBITDA | Earnings before interest, taxes, depreciation and amortization. Here taxes means income taxes. The excluded costs and other cash needs still matter. |\n| EBIT | Earnings before interest and taxes. It is not identical to every company’s reported operating-profit measure. |\n| Adjusted EBITDA | EBITDA modified by additional specified adjustments. Ask which costs are excluded and whether they recur. |\n| Reconciliation / financial bridge | A line-by-line calculation showing how one financial number becomes another. |\n| Margin | A stated profit measure divided by revenue. €4 million of EBITDA on €20 million of revenue gives a 20% EBITDA margin. |\n| Financial contribution | Revenue from an activity less the costs assigned to it. State those costs; the result need not equal final company profit. |\n| Cash flow | Actual money received or paid during a period. |\n| Operating cash flow | Cash generated or used by operating activities under the applicable reporting rules. Check whether interest and tax are included before making further deductions. |\n| Working capital | In the book’s simplified examples, unpaid customer invoices plus inventory less amounts owed to suppliers. An increase uses cash; customer prepayments can change the pattern. Other definitions exist. |\n| Receivables / payables | Amounts customers owe the company / amounts the company owes suppliers. |\n| Capital expenditure / capex | Spending on assets, such as equipment or qualifying development. |\n| Capitalization | Recording qualifying spending as an asset, with expenses recognized over time. The cash payment still occurs. |\n| Free cash flow (FCF) | A measure of cash after specified spending. Definitions differ; check which taxes, investment and financing payments it includes. |\n| Cash conversion | A comparison of a stated cash measure with an earnings measure over a stated period. It needs explicit definitions. |\n| Liquidity | The ability to meet payments when they fall due. A valuable or profitable company can still lack immediate cash. |\n| Debt service | Payments required to meet financing obligations, including interest and any principal due under the chosen definition. |\n| Covenant | A condition in a financing agreement. Consequences of a breach depend on the agreement and available remedies. |\n| Maturity / refinancing | The date borrowing is due / replacing existing financing with new financing. Replacement is not assured on preferred terms. |\n| Floating-rate debt | Borrowing whose interest rate can change with a reference rate or other agreed conditions. |\n| Collateral | Assets pledged as security for borrowing. Lender rights depend on the agreement and law. |\n| Run-rate | A rate inferred from current conditions, such as turning one month’s saving into an annual estimate. It assumes those conditions continue. |\n| Realized saving | A reduction actually reflected in the relevant spending or cash measure, with scope, costs and comparison stated. |\n| Capacity benefit | Time or resources made available for other work. It becomes a cash saving only if an additional decision reduces or avoids spending. |\n| Statutory accounts / result | Financial information reported under the applicable legal and accounting requirements. |\n| Pro forma | A constructed comparison showing results as if specified events had occurred at another time or under another arrangement. Read its assumptions. |\n| Organic growth | Growth within a defined business comparison, adjusted for specified changes such as acquisitions. Definitions vary; it does not isolate the effect of technology. |\n| Constant currency | A comparison adjusted to remove specified exchange-rate movements. |\n| Annual recurring revenue (ARR) | A yearly measure of recurring revenue, often used for subscriptions. Visma’s case instead uses **annualized repeatable revenue**, which also includes certain transaction revenue. Read the source definition. [S31: Visma Q4 report](https://cdn.prod.website-files.com/69787181d8720ea08c1f22fe/69787181d8720ea08c1f4589_Visma%202024%20Q4.pdf) |\n| Gross / net revenue retention | Revenue kept from a starting customer group, excluding additional sales to that group for gross retention and including them for net retention. Define the period and treatment of losses and price changes. |\n\n## Value and Investment Returns\n\nRead [How Company Value Becomes an Investor Return](pt-return-mechanics.html) for the worked investment. Valuation techniques are introduced in [A Valuation Is an Estimate, Not a Fact](pt-valuation-and-architecture.html). [S03: Buyout overview](https://www.nber.org/system/files/working_papers/w14207/w14207.pdf) [S05: ILPA performance guidance](https://ilpa.org/industry-guidance/templates-standards-model-documents/ilpa-templates-hub/ilpa-performance-template/) [S52: IPEV valuation guidelines](https://www.privateequityvaluation.com/Portals/0/Documents/Guidelines/2025%20IPEV%20Valuation%20Guidelines.pdf)\n\n| Term | Plain-language meaning |\n| --- | --- |\n| Valuation | An estimate of value at a date and for a purpose. A reporting estimate and a negotiated purchase price can differ. |\n| Enterprise value (EV) | Value attributed to the operating business before the adjustments used to reach shareholder value. |\n| Equity value | Value attributed to shares. In the simple examples, enterprise value less net debt; actual transactions can require more adjustments. |\n| Net debt | Borrowing minus the cash included in the calculation. Transaction and lender definitions can differ. |\n| Leverage | Use of borrowing alongside equity. It can magnify gains and losses on the equity investment. |\n| Net debt / EBITDA | A leverage ratio comparing net debt with a specified annual earnings measure. Gross debt is a different numerator; dates and earnings definitions also affect comparisons. |\n| Valuation multiple | Value divided by a financial measure. €60 million of enterprise value divided by €4 million of EBITDA gives 15×. |\n| Multiple expansion / compression | A rise / fall in that ratio. Market conditions and business prospects can both contribute. |\n| Market approach / comparable multiple | Estimating value using evidence from sufficiently similar businesses or transactions. |\n| Discounted cash flow (DCF) | Estimating what expected future cash is worth today. Match the cash flows and rate to the business or ownership interest being valued. |\n| Discount rate / present value | The rate used to translate future money into today’s value / the resulting value today. The rate reflects time and risk under the model. |\n| Terminal value | The estimated value of what comes after the explicit forecast period. It still depends on future costs and investment. |\n| Asset-based valuation | Estimating value from assets and relevant obligations. Historical spending is not automatically an asset’s current value. |\n| Simple payback | Time until cumulative undiscounted benefits recover the initial spending. It does not capture all risk or benefits after that date. |\n| Investment return | A comparison of money invested with proceeds received and, where included, the value still held. Some measures also account for timing. |\n| MOIC | Multiple of invested capital. Total proceeds and any included remaining value divided by money invested. €110 received from €40 invested gives 2.75×; state whether unsold value is included. |\n| IRR | Internal rate of return. An annual rate calculated from the amounts and dates of investment payments. With one payment in and one out, it is the compound annual rate linking them. More complex payment patterns can complicate interpretation. |\n| DPI | Distributions to paid-in capital: amounts distributed divided by investor contributions. State whether distributions are cash. |\n| RVPI | Residual value to paid-in capital: estimated value still held divided by investor contributions. |\n| TVPI | Total value to paid-in capital: distributions plus remaining estimated value, divided by contributions. With consistent definitions, TVPI = DPI + RVPI. |\n| Gross / net return | Return before / after specified fees and deductions. Name the investor whose return is measured and the deductions included. |\n\n## Transactions and Incentives\n\nFor examples, use [Capital Should Fit the Company's Problem](pt-investment-fit.html), [Shared Ownership Does Not Create Identical Interests](pt-incentives.html) and [A Transaction Changes Ownership Before It Changes Operations](pt-acquisitions-and-carveouts.html).\n\n| Term | Plain-language meaning |\n| --- | --- |\n| Investment thesis | The explanation of why an investment should succeed, including assumptions about price, funding and the work required. |\n| Underwriting | The financial and risk assessment used to justify an investment. |\n| Term sheet | A document setting out proposed transaction terms. The legal effect of its provisions depends on the document. |\n| Acquisition / buyout | Purchase of a business or interest in it / a purchase giving control. |\n| Leveraged buyout | A buyout financed with substantial debt alongside equity. |\n| Public-to-private / private-to-private | A purchase taking a publicly traded company into private ownership / a purchase of an already privately held business. |\n| Venture capital / growth equity | Equity investment for uncertain early growth / investment to fund expansion with more evidence of demand. Boundaries overlap. |\n| Carve-out | Separation of a business from a larger owner, often requiring replacement of services the parent supplied. |\n| Turnaround / restructuring | Work to restore business viability / changes to operations or financing. Debt restructuring can change payment dates, rates or amounts owed. |\n| Platform company / add-on / buy-and-build | A business used as a base for acquisitions / a business subsequently acquired / a strategy of developing a group through repeated acquisitions. |\n| Synergy | A benefit expected from combining activities. It needs evidence and must include the cost of achieving it. |\n| Secondary transaction | A sale of an existing investment interest. Specify whether company shares, fund interests or another interest changes hands. |\n| Continuation vehicle | A new investment vehicle used to continue holding assets associated with an existing manager or fund arrangement. |\n| Exit / realization | A sale or other process through which an investor receives value and reduces or ends its investment. An announcement or partial sale is not necessarily full cash realization. |\n| Strategic buyer | An operating business buying another business for commercial reasons, such as complementary products or customers. |\n| Management rollover / management equity | Retaining or reinvesting an interest after a sale / company-level ownership or economic rights held by executives. |\n| Option / vesting | A right to buy shares on stated terms / the conditions under which rights are earned over time or through performance. |\n| Preferences / dilution / leaver provisions | Payment priorities / changes to existing ownership or payouts when more equity is issued / rules applying when a participant leaves. |\n| Assumption of debt | Taking on existing borrowing as part of a purchase. The share purchase price may exclude that amount. |\n| Writedown / impairment | Reducing an asset’s recorded value. This changes an estimate rather than making a cash payment. |\n| Dividend recapitalization | Borrowing used to pay a distribution to owners, leaving debt in the company or ownership structure. |\n| Chapter 11 / liquidation | A US bankruptcy process that can allow continued trading while obligations are reorganized / selling assets and winding down the relevant business. |\n\n## Choosing and Supporting Company Work\n\nSee [Choosing What to Fund—and What to Stop](pt-choosing-investments.html), [Find the Help That Changes What Your Team Can Do](pt-investor-support.html) and [Turn an Offer of Help into a Useful Engagement](pt-making-support-work.html). These terms describe the proposed working methods used in the main narrative.\n\n| Term | Plain-language meaning |\n| --- | --- |\n| Company investment | A commitment of company resources now for an expected future benefit, such as a useful product change or a stronger team capability. |\n| Team capacity | The time and capability people have available to do work. It can constrain a plan even when cash is available. |\n| Engineer-week | A planning unit representing one engineer’s working time for a week. It does not imply that people or skills are interchangeable. |\n| Opportunity cost | The benefit of the best alternative a choice gives up. |\n| Sunk cost | Resources already spent that cannot be recovered. The next decision still needs an assessment of remaining costs and benefits. |\n| Funding stage | A commitment of resources to a defined piece of work before deciding whether to commit more. |\n| Operating team | People associated with an investment firm who help companies improve how they work. Actual services, authority and availability vary. |\n| Peer network | Connections among people in similar roles who can exchange relevant experience. |\n| Engagement | An agreed piece of support with a purpose, participants and boundaries. |\n| Engagement sponsor | The person backing a particular support assignment. Specify whether they represent the company or the investment firm. |\n| Handover | Transfer of the knowledge, information and responsibilities needed to continue work. |\n| Ownership cycle | The book’s organizing sequence of investigation, early planning, ongoing ownership and a possible sale or other transition. It is not a fixed timetable. |\n\n## Technology and Company Work\n\nThe company-investment sequence begins at [Choosing What to Fund—and What to Stop](pt-choosing-investments.html) and [The Chain From Roadmap to Revenue Breaks Easily](pt-product-value.html). Part IV explains the adviser and practical support; Part V follows the ownership cycle. The Productscapes design proposal is in [Productscapes: Designing Investor Support as a Product](pt-appendix.html).\n\n| Term | Plain-language meaning |\n| --- | --- |\n| Capability | Something the company can reliably do, such as setting up a customer or restoring a service. |\n| Roadmap | Intended product or technology changes and priorities over time. |\n| Onboarding | Setup and support needed before a new customer can use a product successfully. |\n| Operating model | How teams, responsibilities, processes and decisions are arranged to do the work. |\n| Governance / decision rights / reserved matters | Arrangements for decisions and oversight / authority over specified decisions / matters requiring approval from a designated party. |\n| Escalation | Taking an unresolved issue to someone authorized or equipped to act. |\n| Engagement charter | A short agreement defining a support assignment, including purpose, responsibility, resources, information access and ending. |\n| Value-creation plan | A plan connecting expected benefits to work, responsible people, funding and review. Its title does not establish that the benefits occur. |\n| Technical due diligence | Investigation of product, technology, people and risks to inform an investment decision. |\n| Data room | A controlled collection of information shared for a transaction. |\n| Technology Principal | The investment-firm technology adviser and operating-support role developed in this book. Scope, authority and resources vary. |\n| Architecture / interface | A system’s main parts and connections / an agreed way for those parts to exchange information. |\n| Modularity / coupling | Dividing software into parts with clear responsibilities / the degree to which parts depend on one another. |\n| Microservices | Smaller software services that can be deployed and operated separately, with coordination and operating costs to consider. |\n| Configuration / feature flag | Settings that change behavior / a control enabling or disabling selected behavior. |\n| Deployment / lead time | Putting a software version into use / elapsed time between defined stages of a change, such as starting work and delivering it. |\n| Tenant isolation | Keeping customers’ data or workloads appropriately separated in a shared service. |\n| Technical debt | Future effort or risk from earlier technical choices or postponed work. It is a metaphor, not a literal loan balance. |\n| Engineering effectiveness | Ability to deliver useful, reliable work and sustain that ability. Activity counts alone are insufficient. |\n| SPACE / DORA | A research framework examining several dimensions of developer productivity / a research program on software delivery and organizational performance. [S13: SPACE](https://www.microsoft.com/en-us/research/publication/the-space-of-developer-productivity-theres-more-to-it-than-you-think/) [S14: DORA metrics](https://dora.dev/guides/dora-metrics/) |\n| Cloud / managed service | Rented computing resources and related services / a service operated by a supplier on the customer’s behalf. |\n| FinOps / unit economics | Collaborative management of technology’s financial value / cost or value per defined unit of useful work. [S16: FinOps unit economics](https://www.finops.org/framework/capabilities/unit-economics/) |\n| Rightsizing / latency | Matching computing capacity to demand and service requirements / the delay before a response or result. |\n| Security / resilience / recovery | Protection against threats / ability to continue or restore essential work / the work of restoring service. [S17: NIST framework](https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf) |\n| Residual risk | Risk remaining after the chosen protections or actions. |\n| AI / generative AI / inference | Artificial intelligence, software performing tasks from learned patterns / AI generating content / running a trained model to produce output. |\n| SaaS / IT / IP | Software as a service, accessed as an ongoing service / information technology / intellectual property, legal rights concerning assets such as software and inventions. |\n| Transition services agreement (TSA) | An agreement providing temporary services, often from a seller to a separated business. It needs a replacement plan as well as an end date. |\n| Stranded cost | A cost that remains after the activity benefiting from it has ended or moved. |\n| Nearshoring / offshoring | Locating work in relatively nearby / more distant countries. Total costs and coordination matter alongside wages. |\n| Productscapes / accelerator | The author’s proposed approach to designing investment and technology-support offerings / a reusable support package within that proposal. Neither label implies proven effectiveness. |\n\n## Evidence and Lasting Outcomes\n\nFor application, read [Durable Success Is What Remains After the Investors Leave](pt-durable-value.html) or use [Practical Tools for Ownership and Technology Decisions](pt-toolkit.html).\n\n| Term | Plain-language meaning |\n| --- | --- |\n| Hypothesis | An explanation or expectation that evidence can support or challenge. |\n| Baseline / cohort | The starting observation used for comparison / a defined group tracked over time. |\n| Counterfactual | An estimate of what would have happened without the change being studied. |\n| Observation / assertion / inference | Something observed / a claim someone reports / a conclusion drawn from evidence and reasoning. |\n| Attribution / causal contribution | Assigning an outcome to a cause / explaining how an intervention helped alongside other causes. This use of contribution differs from the financial measure above. |\n| Correlation / causation | Things changing together / one thing helping cause another. The first does not establish the second. |\n| Materiality / confidence | Importance to a decision / strength of the supporting evidence. An important risk can remain uncertain. |\n| Empirical / observational research | Research using observations and data / research examining events that occurred without researchers randomly assigning the exposure. |\n| Control or comparison group | A group used to help estimate what would have happened without the event or intervention. |\n| Generalizability | How far findings can reasonably apply beyond the people, businesses or period studied. |\n| Percentage / percentage point | A relative change / an arithmetic difference between percentages. From 4% to 5% is one percentage point, or a 25% increase relative to 4%. |\n| Stakeholder | A person or group affected by the company, including those who did not choose its owner. |\n| Durable value | This book’s proposed standard: useful outcomes the company can sustain through continued investment, capability and attention to consequences for people. It is not an accounting measure or guarantee. |\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
