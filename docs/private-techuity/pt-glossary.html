<script id="data" type="application/json">{"meta": {"title": "Glossary", "date": "2026-09-12", "permalink": "pt-glossary", "status": "draft:orange", "excerpt": "Consistent definitions for the financial, ownership, and operating concepts used in the book."}, "tags": [], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **KEY POINTS:**\n>\n> * **Financial terms distinguish different questions.** Revenue, earnings, cash and valuation cannot substitute for one another.\n> * **Definitions still depend on the document and decision.** Check actual agreements, reporting periods and reconciliations before applying a familiar label.\n> * **Use the glossary alongside the chapters.** The valuation introduction supplies worked explanations; this reference helps keep later reading consistent.\n\n<br>\nThese definitions provide the book's working vocabulary. Actual agreements, accounting policies, and reporting methodologies govern a real engagement. The foundational sources are the SEC investor guide, Kaplan and Strömberg's overview, ILPA's principles and performance guidance, the SEC's non-GAAP guidance, and the IFRS overview. [S01: SEC investor guide](https://www.investor.gov/introduction-investing/investing-basics/investment-products/private-investment-funds/private-equity) [S02: ILPA principles](https://ilpa.org/wp-content/uploads/2019/06/ILPA-Principles-3.0_2019.pdf) [S03: Kaplan and Strömberg](https://www.nber.org/system/files/working_papers/w14207/w14207.pdf) [S05: ILPA performance guidance](https://ilpa.org/industry-guidance/templates-standards-model-documents/ilpa-templates-hub/ilpa-performance-template/) [S06: SEC non-GAAP guidance](https://www.sec.gov/rules-regulations/staff-guidance/corporation-finance-interpretations/non-gaap-financial-measures) [S07: IAS 38 overview](https://www.ifrs.org/issued-standards/list-of-standards/ias-38-intangible-assets/) Technology framework terms link to their sources below. The manuscript's proposed measures remain proposals.\n\n## Valuation Foundations\n\nFor the step-by-step introduction and fictional examples, read [How Does Company Valuation Shape Technology Decisions?](pt-valuation-and-architecture.html). The method descriptions draw on IPEV’s December 2025 guidance; the architectural implications are the manuscript’s analysis. [S52: IPEV valuation guidelines](https://www.privateequityvaluation.com/Portals/0/Documents/Guidelines/2025%20IPEV%20Valuation%20Guidelines.pdf)\n\n| Term | Meaning in this manuscript |\n| --- | --- |\n| Revenue | Income recognized from selling goods or services during a period. Recognition and customer payment can occur at different times. |\n| Earnings / profit | Revenue and other applicable income less the costs included in the particular profit measure. Always identify which measure. |\n| Margin | A defined profit measure divided by revenue. EBITDA margin and net profit margin have different numerators. |\n| Depreciation / amortization | Accounting allocation of the cost of certain assets over time; generally tangible assets for depreciation and intangible assets for amortization. The charge and the cash payment need not occur together. |\n| Valuation | Estimate of the value of a business or investment interest at a date and for a purpose. A reporting estimate, negotiated price and investment hurdle are distinct. |\n| Market approach / comparable multiple | Estimate informed by values of sufficiently comparable businesses or transactions and a consistent financial measure and period. |\n| Discounted cash flow (DCF) | Valuation based on the present value of expected future cash flows. Specify whose cash flows are modeled and use a consistent discount rate. |\n| Discount rate / present value | The rate used to translate future money into a value today, reflecting time and risk under the model; the resulting value is present value. |\n| Terminal value | Value assigned to cash flows or an investment beyond an explicit forecast period, under stated assumptions. It does not eliminate continuing investment requirements. |\n| Asset-based valuation | An approach examining asset values and relevant liabilities. Historical expenditure or book value is not automatically current market value. |\n| Simple payback | Time for cumulative undiscounted benefits to recover an outlay under stated timing assumptions. It omits benefits after payback and does not itself account for risk or the time value of money. |\n| Pro forma | A presentation constructed as if specified events had occurred at another time or under another stated arrangement. It can improve comparability but is not identical to the actual reported history or necessarily a measure of organic growth. |\n| Liquidity / debt service | Ability to meet payments as they fall due; cash needed to satisfy financing obligations. Solvency, earnings and long-term value do not by themselves establish immediate liquidity. |\n| Contribution | Revenue from an activity minus costs attributed to it under a defined boundary. It need not include all corporate overhead or equal net profit. |\n\n## Capital, Ownership, and Transactions\n\n| Term | Meaning in this manuscript |\n| --- | --- |\n| Private equity (PE) | Investment in privately held equity, or transactions taking public companies private. Usage varies: the broad asset category can include venture and growth, while practitioners sometimes use PE more narrowly for buyouts. |\n| General partner (GP) | The partner with the fund-management responsibilities and powers specified in the fund structure and agreements. “GP” is also used informally for the investment organization; keep the legal entity distinct when rights or money matter. |\n| Limited partner (LP) | An investor in the fund under its partnership arrangements. The LP is different from a customer or creditor of a portfolio company. |\n| Manager / investment firm | The organization supplying investment-management and related capabilities, often through several entities and multiple funds. A long relationship with a manager is not a single fund holding period. |\n| Fund | A defined investment vehicle with its own investors, commitments, agreements, assets, and lifecycle. It is not the same entity as the manager or a portfolio company. |\n| Commitment / capital call | A contractual capital commitment is an obligation subject to its terms. A capital call requests a payment under that commitment. Neither is a company operating budget. |\n| Investment period / fund term | The period for making specified new investments and the wider life of the fund, respectively. Follow-ons, extensions, realizations, and other rules depend on the agreements. |\n| Holding company / acquisition vehicle | An entity used to hold an investment or undertake an acquisition. Debt and rights must be located at the correct entity rather than assumed to sit in the trading company. |\n| Portfolio company | A business owned wholly or partly through an investment vehicle. It has its own customers, people, assets, obligations, and governing bodies. |\n| Investment thesis | An explanation of why this investment, at this price and with this financing and operating path, is expected to produce an acceptable outcome. It contains assumptions that can fail. |\n| Buyout / public-to-private | A transaction acquiring control; a public-to-private takes a publicly traded business into private ownership. A private-to-private deal buys a business that was already privately held. |\n| Venture capital / growth equity | Different orientations within private investment: funding uncertain early or new growth, and funding expansion with more evidence of demand, respectively. Boundaries overlap and do not define a compulsory company journey. |\n| Carve-out | Separation of a business from a larger owner. Independence may require functions, contracts, technology, and people previously supplied by the seller. |\n| Turnaround | An operating and often financial effort to restore a business's viability. Liquidity and continuity can dominate the timetable. |\n| Add-on acquisition / buy-and-build | An acquisition added to an existing platform company; a strategy using repeated acquisitions to develop a group. Purchased revenue is distinct from organic growth. |\n| Secondary transaction | A sale of an existing investment interest. It can concern company shares, fund interests, or another ownership layer; specify which. A secondary buyout transfers a company between sponsors or their vehicles. |\n| Continuation vehicle | A new vehicle used to continue holding one or more assets beyond an existing fund arrangement. Valuation, conflicts, investor choice, costs, and governance require explicit examination. |\n| Exit / realization | A transaction or process through which an investor reduces or ends an investment and receives value. An IPO, announcement, or partial sale does not necessarily represent full cash realization. |\n| Management rollover | Management or selling owners retain or reinvest an economic interest in the new ownership arrangement. It is separate from any additional incentive award. |\n| Management equity | Company-level ownership or economic rights held by executives, subject to the plan's terms. A quoted percentage alone is insufficient to determine payout. |\n\n## Money, Returns, and Accounting\n\n| Term | Meaning in this manuscript |\n| --- | --- |\n| Enterprise value (EV) | Value attributed to the operating business for a transaction or valuation purpose, before the specified bridge to equity. Treatment of leases, minorities, pensions, and other items must be stated. |\n| Equity value / net debt | Equity value is the amount attributable to equity after relevant adjustments. In simplified examples, equity value = EV − net debt, with net debt defined as debt less included cash. Actual transaction definitions can differ. |\n| Leverage | Use of debt or other financing exposure relative to equity or earnings. It can amplify equity gains and losses and creates payment and contractual obligations. |\n| Covenant / maturity / refinancing | A covenant is a contractual condition. Maturity is when a debt obligation falls due. Refinancing replaces or changes financing and is not assured at a preferred price or time. |\n| EBITDA / EBIT | Earnings before interest, taxes, depreciation, and amortization; earnings before interest and taxes, respectively. EBITDA does not deduct all the cash needed to run and finance a company. |\n| Adjusted EBITDA | EBITDA modified by specified adjustments. Examine the reconciliation, recurring nature of excluded costs, and consistency between periods. |\n| Valuation multiple | A ratio relating value to a defined financial measure, such as EV/EBITDA. Different accounting definitions, business mix, and growth expectations affect comparability. |\n| Multiple expansion / compression | An increase or decrease in the valuation ratio. It can reflect markets, buyers, business characteristics, or several factors; it is not automatically an operational effect. |\n| MOIC | Multiple of invested capital: investment value and/or proceeds divided by contributed capital on a specified basis. Label realized versus residual components and gross versus net treatment. |\n| IRR | Internal rate of return: the discount rate making the net present value of dated cash flows zero. It depends on timing, can be problematic for some cash-flow patterns, and is not the same as a simple average annual profit. |\n| DPI / RVPI / TVPI | Distributions to paid-in capital; residual value to paid-in capital; total value to paid-in capital. With consistent definitions, TVPI = DPI + RVPI. Residual valuations are not cash distributions. |\n| Gross / net return | A return before or after specified fees, expenses, and allocations. Always name the investor layer and inclusions; the words alone do not ensure comparability. |\n| Management fee / carried interest | A contractual fee for management and an allocation of investment profits, respectively. Basis, timing, offsets, expenses, and distribution terms vary. Carry is not management's company equity plan. |\n| Waterfall / hurdle / catch-up / clawback | Contractual distribution sequence; a threshold relevant to profit allocation; a mechanism accelerating a recipient's allocation after conditions are met; and a mechanism returning excess prior distributions. Exact economics depend on the agreement. |\n| Operating cash flow | Cash generated or used by operating activities under the applicable reporting rules. Check interest and tax treatment before adding or subtracting items in a separate bridge. |\n| Working capital | Operating balances that can absorb or release cash, including receivables, inventory, and payables under the chosen definition. A sale is not necessarily a collected payment. |\n| Capex / capitalization | Cash expenditure on assets; recognition of eligible expenditure as an asset rather than an immediate expense. Capitalization changes timing in the accounts, not the fact that cash was spent. |\n| Free cash flow (FCF) | A non-universal label for cash remaining after specified spending. Read the source's definition. Visma's measure in the case is before tax; other definitions differ. |\n| Cash conversion | A relationship between an earnings measure and a cash measure. Specify numerator, denominator, period, acquisitions, and accounting treatment. |\n| Run-rate / realized saving | A rate inferred from current conditions versus a reduction actually reflected in the relevant spending or cash measure. Annualizing a short period assumes that conditions persist. |\n| Capacity benefit | Time or capability made available for other work. It becomes a cash benefit only through a feasible additional operating decision; it may instead create service or growth value. |\n| ARR | Often annual recurring revenue in software reporting. Definitions vary. Visma's case uses **annualized repeatable revenue**, which includes a transaction-revenue component; do not substitute one definition for the other. [S31: Visma Q4 2024 report](https://cdn.prod.website-files.com/69787181d8720ea08c1f22fe/69787181d8720ea08c1f4589_Visma%202024%20Q4.pdf) |\n| Gross / net revenue retention | Revenue retained from a starting customer cohort, excluding expansion for gross retention and including expansion for net retention, under explicitly defined contraction, churn, currency, and period rules. |\n\n## Operating Decisions and Evidence\n\n| Term | Meaning in this manuscript |\n| --- | --- |\n| Value-creation plan | An operating plan connecting a thesis to initiatives, owners, resources, dependencies, outcomes, and review decisions. The title does not establish that value will be created. |\n| Technical diligence | Investigation of technology-related assumptions, capabilities, obligations, and uncertainty material to an investment decision and subsequent plan. |\n| Decision rights / reserved matters | Authority to make specified decisions; matters that require approval by designated parties under the governing arrangements. Informal influence can exceed formal rights. |\n| Technology Principal | The investment-and-operating role developed from the supplied brief in this manuscript. Actual title, scope, authority, and resources vary by firm and engagement. |\n| Technical debt | Future effort, risk, or constraint arising from past technical choices or postponed work. Its economic relevance depends on the changes and commitments the company expects to make. |\n| Engineering effectiveness | Ability to produce useful, reliable outcomes sustainably. Activity counts alone do not capture it; SPACE offers a multidimensional frame and DORA addresses delivery performance. [S13: SPACE framework](https://www.microsoft.com/en-us/research/publication/the-space-of-developer-productivity-theres-more-to-it-than-you-think/) [S14: DORA metrics guide](https://dora.dev/guides/dora-metrics/) |\n| Unit economics | Cost and value per defined unit of useful business activity, interpreted with quality, volume, and mix. A convenient denominator can still be misleading. [S16: FinOps unit economics](https://www.finops.org/framework/capabilities/unit-economics/) |\n| Resilience / recovery | Ability to maintain or restore required service through disruption. Recovery includes operating dependencies, not merely a successful data backup. [S17: NIST CSF 2.0](https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf) |\n| Transition service agreement (TSA) | An agreement for temporary services, often from a seller to a carved-out business. Scope, cost, service levels, duration, dependencies, and exit conditions matter. |\n| Nearshoring / offshoring | Locating work in another, respectively relatively nearby or more distant, geography. Distance alone does not determine communication quality, operating effectiveness, or full cost. |\n| Baseline / cohort / counterfactual | A defined starting observation; a comparable group tracked over time; and an estimate of what would have happened without the intervention. A before-and-after chart is not automatically a counterfactual. |\n| Attribution / contribution | Attribution assigns an outcome causally to an intervention. Contribution makes a qualified account of how an intervention helped within a wider system. Neither should hide competing explanations. |\n| Correlation / causation | Co-movement versus a causal relationship. Selection, omitted variables, reverse causality, and timing can complicate inference. A research design determines what claim is supportable. |\n| Percentage / percentage point | A relative change versus an arithmetic difference between percentages. A rate rising from 4% to 5% rises by one percentage point and by 25% relative to its starting level. |\n| Materiality / confidence | Importance to a decision and strength of the evidence, respectively. A material risk can remain uncertain; a precise observation can be immaterial. |\n| Accelerator | In the proposed Productscapes model, a reusable support intervention connecting diagnosis to a decision, action, and outcome review. The term does not imply proven speed or value. |\n| Durable value | The manuscript's evaluative proposal: useful economic performance supported by the capabilities, reinvestment, and obligations needed to sustain it, considered alongside stakeholder consequences and post-exit outcomes. It is not an accounting standard or a claim that interests always align. |\n\nFor worked return calculations, see [How Does a Private Equity Investment Make Money?](pt-return-mechanics.html). For the cash bridge, see [Why Can a Profitable Company Still Run Out of Room?](pt-cash-and-constraints.html). For how to turn definitions into usable evidence, see [Practical Tools for Ownership and Technology Decisions](pt-toolkit.html).\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
