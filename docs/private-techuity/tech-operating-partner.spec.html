<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "# Spec: The Rise of the Technology Operating Partner\n\n## Intent\n\nClose Part IV with a chapter explaining why technology operating partners and the functions around them are gaining importance in private equity. Connect the investor's need for technical judgment to the company leader's need for useful support, while distinguishing a growing remit from an unmeasured increase in headcount or investment returns. Extend Part IV's practical treatment of advisers without repeating its engagement charter.\n\n## Audience\n\nProduct and engineering leaders working under investors; secondarily investment professionals building an operating capability and technology executives considering the role. Define portfolio, investment thesis and operating partner before relying on them. Private equity is the evidence base; other ownership models are comparisons, not an assumed equivalent.\n\n## Success criteria\n\n- Explain the pressures behind the function: technology-dependent operating plans, continuity after diligence, acquisitions and shared learning, and AI as both an opportunity and a risk to an investment thesis.\n- Define technology operating partner (including the technical operating partner wording) and distinguish the function from a job title, company CTO/CIO, investment partner and temporary consultant. Treat organizational models as choices, not a universal maturity ladder.\n- Review all seven supplied sources: six directly accessible web pages and the author-supplied text copy of David Mackey’s LinkedIn post. Identify the copy as the consulted version and distinguish the recruiter’s experience-based route into the role from evidence about hiring frequency or career outcomes. Supplement with direct descriptions from KKR and Blackstone.\n- Attribute industry observations and date examples. Do not invent hiring growth, average holding periods, performance premiums or a universal need for a separate AI partner.\n- Map responsibilities across investment assessment, the funded early plan, delivery, leadership, acquisitions, portfolio learning and exit. Define useful outputs and the boundaries of company responsibility.\n- Compare the operating partner with CIO, CTO, CPO, Chief Architect and VP/Head of Engineering by scope, accountability, delegated authority, practical collaboration and evidence of success; explain overlapping and combined roles.\n- Explain the operating partner’s contribution to hiring at portfolio companies: assess the capability gap, define roles and funding, support sourcing and candidate assessment, clarify appointment and compensation authority, and help with onboarding, development and succession. Distinguish the operating partner from the company hiring manager, HR and recruiters; assess internal development and interim help alongside permanent hiring, including AI appointments.\n- Explain AI as a change to investment assumptions, a company capability and a tool for the operating function itself; address evaluation, data boundaries, running costs and the case for a dedicated AI specialist.\n- Explain internal, specialist-team and external models; CIO/CTO experience and AI specialization; availability, costs and supplier conflicts. Keep formal authority tied to the actual assignment and agreements.\n- Include one explicitly fictional worked comparison and practical ways for a company leader to assess the function. Keep cash, released capacity and attribution distinct.\n- Use the book's opening learning objective and three KEY POINTS. Aim for 3,800–4,700 words, with readable prose and at most two substantial comparison tables. Link relevant existing chapters and the bibliography.\n- Add a chapter hero logo, a matching navigation icon and three explanatory figures in the book’s ivory, navy, teal and ochre visual style. Illustrate the boundary between portfolio support and company leadership, alternatives in capability building and hiring, and the fictional companies’ different AI decisions. Use descriptive alt text and captions; retain generation prompts and provenance.\n- Place the article last in Part IV, immediately after `investors-adviser`, in source folder `22-tech-operating-partner`. Connect the preceding adviser chapter to the wider operating function and hand off to Part V. Retain all permalinks and align navigation and counts with 33 main chapters.\n- Add a 300–500-word TL;DR and a five-page illustrated comic. Preserve the operating function's continuity across the investment, company leadership and appointment authority, alternatives to hiring, and AI's effects on investment assumptions, company work and the operating function. Follow the article's independent fictional three-company AI comparison; retain the distinction between released capacity, cash savings and attribution. Reuse the journal cast as presenters, give each page three strips with dialogue and labels in the artwork, and include alt text, short captions and rendered transcripts. Preserve scripts and image provenance and inspect every page against its script.\n\n## Non-goals\n\nA comprehensive career guide, compensation survey, financial forecast, endorsement of a supplier, or claim that an operating partner replaces company management. Do not restore the discontinued Productscapes appendix or rewrite the existing Larkspur scenario.\n\n## Modalities\n\n- Article: the existing illustrated article, chapter hero logo, navigation icon and three explanatory figures.\n- TL;DR: `summary.md`, a self-contained 300–500-word summary in the journal's concise prose style, reusing the portfolio-support overview after the opening paragraph.\n- Comic: `comics.md`, five illustrated pages of three strips each. The familiar fictional cast presents the three-company AI example alongside the operating function's role, capability choices and review evidence; the page scripts drive artwork, captions and transcripts.\n\n## Open questions\n\nThe LinkedIn source has been reviewed through the author-supplied text copy; its exact publication date remains unverified. The reviewed material does not establish an industry-wide hiring time series or the causal effect of this function on returns.\n\n## Decision log\n\n- 2026-09-20: Use the standard source terminology, “technology operating partner,” and explain the user's “technical” wording in the definition.\n- 2026-09-20: Create one optional Appendix chapter, keeping the main reader journey and reference section intact. Use qualitative evidence for a widening function and direct firm examples for its existence.\n- 2026-09-20: Present the responsibility map, fictional example and assessment questions as the author's synthesis and proposals, separate from reported observations.\n\n## Sources\n\nDraft link list: `_drafts/tech-operating-partner/online-source.md`. Consulted public sources registered as S79–S90: Korn Ferry, EE Solutions, Redgrave, Vertex CIO Advisory, Acertitude, Vaultinum, KKR Capstone and Blackstone; role comparisons also consult GitLab’s CPO role description, IBM’s 2021 CIO study and the UK government’s GovS 005 role definitions. David Mackey’s LinkedIn post (S90) was read through the author-supplied text copy after the initial direct retrieval failed. All consulted 2026-09-20. Individual scopes and exclusions belong in the bibliography and `_research/tech-operating-partner-20260920.md`.\n\n## Changelog\n\n- 2026-09-22: Extend the contract before adding the requested TL;DR and Comic modalities. Reuse an existing overview figure and generate five comic pages, preserving company authority, the different AI decisions and the article's limits on outcome claims.\n- 2026-09-21 (Part IV order): Move the article to the end of Part IV, immediately after the adviser chapter. Preserve the role comparisons, portfolio hiring, AI coverage, sources and artwork; add the transition to Part V.\n- 2026-09-20 (illustrated appendix): Add the author-requested logo and explanatory figures, with a matching index icon. Keep the existing book palette and record the built-in image generator’s prompts and asset provenance.\n\n- 2026-09-20 (portfolio hiring): Extend the appendix at the author’s request with role design, candidate sourcing and assessment, appointment authority, onboarding and succession at portfolio companies. Recheck S81 and S85 for talent-support scope; keep company accountability and alternatives to external hiring explicit. Expand the length range for the added section.\n- 2026-09-20 (LinkedIn follow-up): Read the supplied cached post, register S90, add its account of building credibility through interim, fractional and advisory assignments, and replace the unresolved-access note with the actual consultation scope.\n- 2026-09-20: Extend the contract at the author’s request to compare company leadership roles and explain AI’s effect on the function and its own work; expand the length range to keep those comparisons substantive.\n- 2026-09-20: Write the appendix contract before drafting the chapter; reconcile the completed article, role comparisons and AI coverage with the contract. Build, content/link checks, manuscript validation and desktop/mobile browser checks passed.\n"}]}]}</script>

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,

        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');

            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;

                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {

                    const cellOpen = function (tag, idx) {

                        }

                        const mOrd = cur.match(ordered);

                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
