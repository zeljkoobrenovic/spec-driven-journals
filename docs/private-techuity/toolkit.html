<script id="data" type="application/json">{"meta": {"title": "Practical Tools for Ownership and Technology Decisions", "date": "2026-09-12", "permalink": "toolkit", "excerpt": "Records for mapping owners and funding, negotiating feasible commitments, obtaining support and carrying evidence through funding or ownership changes.", "logo": "assets/images/toolkit/logo.jpeg", "logo_credit": "AI-generated illustration", "icon": "assets/icons/toolkit.png"}, "tags": [], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **KEY POINTS:**\n>\n> * Use the records to make a **real decision concrete**. Adapt the questions to the investment thesis, company and people who will carry out the work.\n> * Record **cost, responsibility and uncertainty** alongside ambition. A template is useful when it changes a decision or preserves evidence, not merely when every field is filled.\n> * **Review outcomes and revise the plan**. Keep baselines, assumptions and reasons for stopping or changing an intervention visible.\n\n<br>\nThese are **proposed working tools** for company leaders applying the book’s financial, decision and support concepts. Some also serve readers designing support services in the optional appendix. They have not been validated as a universal operating standard. Start with the smallest record that improves a real decision, and remove fields that impose work without changing understanding or accountability.\n\nYou do not need to fill in every tool. Choose the record for the decision in front of you:\n\n| Your immediate question | Start with |\n| --- | --- |\n| Who receives the investment money, and who can approve the work? | Tool 1: ownership and decision map |\n| What should we check before an investment? | Tools 2–3: investment explanation and findings |\n| What exactly will the adviser help us do? | Tool 4: support agreement |\n| Can we fund and deliver this improvement? | Tool 5: initiative record; Tool 11 for the financial-to-design connection |\n| Which combination of improvements should we fund? | Tool 12: investment choices and capacity |\n| Did the work help? | Tools 6–7: results record and a small set of measures |\n| Are we reviewing an investor, combining businesses or preparing for a funding or ownership change? | Tools 8, 9 or 10 respectively |\n\nAn **initiative** is a defined piece of improvement work. A **baseline** records the starting situation. A **dependency** is something required before other work can proceed. A **material finding** is important enough to affect a decision. A record’s “owner” means the person responsible for the work or decision, unless it explicitly refers to a shareholder.\n\nUse the same finding or initiative identifier through related records. Restrict distribution according to the engagement and company permissions. A filled template does not establish that its claims are true: preserve dates, definitions, evidence links, and disagreement.\n\n## 1. Map the Owners, Funding and Decision\n\nUse before translating an ownership announcement into an operating promise. See [An Investment Announcement Is Not a Budget](capital-and-ownership.html), [Profit Is Not Money You Can Spend](cash-and-constraints.html) and [Decide Who Decides, Before You Disagree](governance.html). Complete this for the actual arrangement, rather than assuming every investor has a fund or controls the company.\n\n| Field | Record |\n| --- | --- |\n| Operating company and relevant entities | Which entity holds the cash, debt, contract or asset needed for this decision? |\n| Owners and their roles | Founder, fund, corporate or other shareholders; distinguish the manager from the actual investing entity where relevant |\n| Event | New share issue, sale of existing shares, control acquisition, refinancing, separation, or continued ownership |\n| Money and conditions | Amount paid to the company, amount paid elsewhere, fees, restrictions, payment dates and conditions before further money arrives |\n| Expectations | The outcome each relevant investor seeks; record disagreement rather than averaging incompatible targets |\n| Authority | Who proposes, approves, funds and implements; source of the right, decision threshold and escalation route |\n| Time | Cash forecast, minimum operating reserve, debt dates, funding or group-budget decision and the latest safe date to change course |\n| Support | Named provider, available capacity, information boundaries, costs and continuing dependence |\n| Company commitment | What you can deliver with confirmed resources, and what remains conditional |\n| Consequences | Customer, employee and supplier effects of delay, failure or the chosen trade-off |\n| Review | Evidence that would change the plan, decision owner and next review date |\n\nFor fictional Larkspur, “hire two engineers after €2m arrives and the board approves the plan” is a different commitment from “hire now because an investor is interested.” Record which one the company has actually authorized.\n\n## 2. Write a One-Page Technology Thesis\n\nUse when investigating a proposed investment, then revise with the company leaders responsible for the plan after the transaction completes. See [Shape the Investment Plan Before the Deal Is Done](diligence-and-thesis.html).\n\n**Company and date:** [fill in]. **Ownership and rights:** [investors, control and approvals]. **Funding or transaction:** [new shares, sale, refinancing, separation or continued ownership]. **Decision and responsible person:** [fill in].\n\n**The business must be able to:** [customer or operating capability, at the required scale and quality].\n\n**The proposed value mechanism is:** [revenue, retention, margin, cash, risk, resilience, or flexibility; explain the chain].\n\n**For this to work, the following must be true:** [list the few assumptions that could change the investment, funding, or timetable].\n\n**What we observed:** [source, date, scope, and any sampling limit]. **What management reports:** [separate assertions]. **What we infer:** [reasoning and confidence]. **What remains untested:** [material gaps].\n\n**Required operating change:** [people, process, product, architecture, or contractual change]. **Cash and capacity:** [implementation, ongoing cost, work displaced, and funding owner]. **Dependencies:** [what must happen first].\n\n**Decision implication:** [proceed; change terms or resources; defer pending evidence; decline; consciously accept uncertainty]. **What would change this recommendation:** [specific evidence or scenario].\n\nA thesis is useful if a decision-maker can explain **what would make it fail**. Rewording a growth ambition in technical language does not achieve that.\n\n## 3. Record a Material Diligence Finding\n\nThe seven dimensions are a coverage aid: product, architecture, engineering, data and AI, security and resilience, organization, and economics. Do not average their scores into a false precision. See [Shape the Investment Plan Before the Deal Is Done](diligence-and-thesis.html).\n\n| Field | Record |\n| --- | --- |\n| Finding ID / dimension | Stable identifier and relevant dimension(s) |\n| Claim and scope | What is being claimed, for which product, system, customer cohort, or period |\n| Evidence and access | Documents, observations, interviews, sample selection, dates, and access limits |\n| Kind of claim | What we observed, what someone reported, what we infer, what we propose to test, or what remains unknown |\n| Business consequence | Effect on the thesis, customers, cost, cash, risk, timing, or strategic options |\n| Alternatives | Other explanations and evidence that would distinguish them |\n| Confidence / importance | How strong is the evidence, and how much could the issue affect the decision? Explain each separately. |\n| Agreed response | Investment implication, required condition, funded initiative, accepted residual risk, or further investigation |\n| Company handoff | Named recipient, acceptance date, resources, and next evidence check |\n\n**Example of a better finding formulation, fictional:** “Three observed onboarding engagements required the same specialist's manual configuration. We have not established how representative these engagements are. The sales-growth thesis requires higher throughput, so investigate the dependency before assuming that additional bookings become timely revenue.” This is stronger than “architecture maturity: amber” because it exposes the economic assumption and evidence limit.\n\n## 4. Agree an Investor Support Engagement\n\nUse when agreeing a specific source of investor support. See [Find the Help That Changes What Your Team Can Do](investor-support.html), [Turn an Offer of Help Into a Useful Engagement](making-support-work.html) and [Is the Investor’s Adviser Helping, Assessing or Deciding?](technology-principal.html).\n\nRecord the question, expected useful output, engagement sponsor at the investor, accountable company leader, participants, scope, exclusions and end date. Name the adviser’s or specialist’s authority and the company’s decision-maker. Define the time commitment, specialist budget, availability during deal peaks, and escalation path if resources change.\n\nSpecify information access and permitted recipients. Distinguish confidential coaching from work that feeds a governance report. Explain which material matters require escalation and through what process. Agree how the company can challenge, revise, or end the support.\n\nDefine success as a decision or capability left with the company, including its ability to continue after the engagement. Review service cost and company effort along with satisfaction. Before extending the engagement, ask what additional useful outcome requires continued involvement.\n\n## 5. Build a Funded Initiative Record\n\nUse for an early operating plan or later intervention. See [A Hundred Days Is Enough to Agree the Plan, Not to Finish It](first-hundred-days.html).\n\n| Field | Record |\n| --- | --- |\n| Initiative ID and linked findings | Trace back to the thesis and evidence |\n| Problem and affected users | Describe the constraint without assuming the solution |\n| Intended mechanism | Intervention → operating/customer change → economic consequence |\n| Baseline and target | Definition, period, source, owner, uncertainty, and quality guardrail |\n| Accountable company leader | Person who can make the operating decision, with executive backing where needed |\n| Work and dependencies | Milestones, sequencing, specialists, contracts, and required access |\n| Resources | Cash by period, people and skills, management attention, and displaced work |\n| Options considered | Minimum continuity, staged improvement, larger investment, or another feasible choice |\n| Downside and continuity | What happens if delivery, benefits, or financing disappoint |\n| Review / stop / expand conditions | Observable evidence and authority to act on it |\n| Accepted obligations | Risks, customer commitments, and future costs remaining after completion |\n\nA brief fictional example shows the level of detail to start with:\n\n| Field | Larkspur’s smaller onboarding pilot |\n| --- | --- |\n| Problem | Each new customer requires repeated manual setup before using the scheduling product. |\n| Proposed change | Test one reusable setup step with a comparable group of customers. |\n| Starting measurement | The teaching model assumes 100 implementations a year at 80 hours each. Confirm whether the actual customer records support that assumption. |\n| Intended result | Test whether effort falls toward 50 hours without increasing customer waiting, errors or support work. |\n| Funding to examine | The separate pilot example assumes €180,000 to build and €30,000 a year to maintain; approval still needs a funding source. |\n| Responsibility and review | Name one responsible company leader, agree the team’s capacity and set a review date before expanding. |\n| Financial limit | Fewer hours are capacity; count cash savings only when spending is actually reduced or avoided. |\n\nThe example comes from [The Chain From Roadmap to Revenue Breaks Easily](product-value.html). It is a smaller alternative to the earlier €1 million program, not additional spending already approved alongside it.\n\nA collection of records must still fit total company capacity. Adding realistic estimates to each initiative does not make their sum feasible.\n\n### If Funding Is Still Conditional\n\nRecord the amount and date required, who can commit it, the conditions and what the team may do before it arrives. Include the last date at which hiring, contracts or customer promises can still change affordably. Review that date alongside delivery milestones.\n\nDistinguish cash received, a binding commitment with understood conditions, an approval still pending and an expression of interest. Show the plan using currently available resources and the additional work that becomes possible if funding arrives.\n\n![An initiative record brings evidence, responsibility, cash, capacity and review together before a commitment is authorized.](assets/images/toolkit/decision-record-to-funded-work.jpeg)\n**Figure 1:** *Use the record to expose and resolve the conditions needed for the work.*\n\n## 6. Keep an Outcome and Contribution Ledger\n\nUse to prevent an activity, a capacity gain, and a financial result from becoming the same claim. See [The Chain From Roadmap to Revenue Breaks Easily](product-value.html), [A Smaller Bill Is Not Always an Improvement](cloud-economics.html), and [Same Company, Same Performance, Three Different Returns](return-mechanics.html).\n\nRecord the original baseline and its definition; the intervention and actual cost; the observed result and period; relevant customer or service quality; demand and mix changes; acquisition effects; and other initiatives. Link the underlying evidence rather than repeatedly copying uncontrolled numbers.\n\n**Capacity bridge:** What time or resource was released? How was it measured? Where did the capacity go? If no spending changed, describe the benefit as capacity or capability, not a cash saving.\n\n**Financial bridge:** Which line or cash flow changed? Is it gross or net of implementation and ongoing cost? Is it observed, annualized, projected, or realized? Which accounting definitions and currency are used? Has finance reconciled the claim? Have benefits already been counted elsewhere?\n\n**Explanation of the result:** What comparison is available? What competing explanations remain? Does the evidence support saying the work caused the result, helped alongside other changes, or only happened at the same time? State confidence and what evidence would improve it.\n\n**Valuation implication, if used:** Show the assumptions separately, including earnings basis, multiple, financing, timing, and uncertainty. Do not add a speculative equity-value estimate to realized cost savings as if they were independent benefits.\n\n## 7. Use a Small Outcome Scorecard\n\nChoose measures around the thesis, with explicit owners and definitions. The rows below are examples of questions, not a mandatory portfolio dashboard.\n\n<div style=\"overflow-x: auto;\" role=\"region\" aria-label=\"Outcome scorecard\" tabindex=\"0\">\n\n| Perspective | Outcome question | Possible evidence | Necessary guardrail |\n| --- | --- | --- | --- |\n| Customer | Are customers reaching and retaining useful value? | Onboarding cohorts, retention, service performance | Mix, contract terms, and quality must remain visible |\n| Delivery | Can the company make useful changes reliably? | Lead time, recovery, rework, representative work samples | Avoid individual rankings from activity counts |\n| Economics | Have unit economics or cash generation improved? | Cost per successful outcome, reconciled spending and cash | Include transition cost, volume, and quality |\n| Risk and resilience | Can critical services withstand or recover from relevant failure? | Tested recovery, material exposure, accepted exceptions | Absence of reported incidents is not proof of safety |\n| Organization | Can the company sustain and adapt the work? | Knowledge dependencies, decision delays, retention context | Employee evidence and displaced work matter |\n| Support service | Did the support engagement help at a reasonable cost? | Decision changed, outcome record, company effort and feedback | Adoption and satisfaction alone do not establish value |\n\n<\/div>\n\nFor each selected measure, record its baseline, owner, reporting period, decision trigger, and next review. Remove a metric when nobody can identify **a decision it informs**. Investigate a surprising change before attaching an incentive to it.\n\n## 8. Interview for Investor Fit\n\nUse before and during an engagement. See [Judge an Investor by Their Behavior Under Pressure](investor-fit.html). Ask for evidence and concrete examples rather than assurances.\n\n- Describe a case where the original thesis was wrong. What changed, and who decided?\n- Show how an operating investment was funded when the base case deteriorated.\n- Which support people would actually work with this company, for how much time, and at whose cost?\n- What happens when a CEO or CTO declines an offered intervention?\n- Give an example of a technology standard that was deliberately adapted to company context.\n- How are leadership changes investigated and implemented? Which operating conditions are examined alongside the person?\n- Which outcomes are tracked after exit? What evidence is available from employees, customers, and suppliers?\n- How are management equity, reporting, information access, and decision rights documented?\n\nCompare the answers across participants and permitted references. An absent document may be fixable; repeated contradictions about authority, funding, or consequences require a more substantial response. The aim is a realistic engagement, not a personality verdict.\n\n## 9. Plan Acquisition Integration or Separation\n\nUse alongside the transaction timetable, with appropriate legal and financial specialists. See [The Deal Closes Long Before the Integration Does](acquisitions-and-carveouts.html).\n\nIdentify the value mechanism that requires each integration: reporting, commercial collaboration, shared capability, or product convergence. Record the customer impact, permitted data flows, license and intellectual-property rights, identity and access boundaries, product commitments, supplier dependencies, and knowledge owners.\n\nFor a carve-out, separate Day 1 continuity from the final independent state. List each transition service, contract owner, duration, cost, service expectation, dependency, and exit condition. Build standalone cost from required capabilities rather than accepting a seller's historical allocation as the answer.\n\nSequence changes around customer continuity and scarce expertise. Show dual-running costs, rollback options where feasible, migration acceptance, and the point at which the business can operate independently. A synergy target should include the expense and time needed to realize it.\n\n## 10. Prepare a Funding or Ownership Handover\n\nUse for another round, a sale, corporate integration or a material change in authority. See [Shape the Investment Plan Before the Deal Is Done](diligence-and-thesis.html) and [The Roadmap Did Not Slip, the Financing Did](execution-and-exit.html). A new fundraise and an investor selling existing shares need different cash explanations.\n\n| Field | Record |\n| --- | --- |\n| Event and decision | What changes, who decides and when authority transfers or funding becomes available |\n| Evidence | Original baseline, current result, definitions, sources and unresolved uncertainty |\n| Funding | Cash received or committed, conditions, obligations and funding needed to finish the plan |\n| Continuing customer work | Service commitments, migrations, support obligations and accountable leaders |\n| Technical and people dependencies | Systems, contracts, knowledge and shared services that must continue |\n| Changed authority | New approvals, delegated decisions and escalation routes |\n| Open work | Remaining costs, risks, accepted limitations and the owner of the next decision |\n| Delayed-event plan | What continues, what changes and when to act if the event is postponed or cancelled |\n\n**Preserve the operating history across the transition**. A new owner’s reporting format should not erase the original cost, the uncertain result or the obligation left with the next team.\n\n## 11. Connect Valuation to Architecture\n\nUse this companion to the decision record when a financial target is driving a technology proposal. Start with [A Valuation Is an Estimate, Not a Fact](valuation-and-architecture.html) for the underlying terms.\n\n| Record | Questions to answer together |\n| --- | --- |\n| Value assumption | Which growth, earnings, cash or risk expectation makes this proposal important? Which period and financial definition apply? |\n| Business capability | What must become easier, safer or cheaper for customers or the company? |\n| Design alternatives | What could a small boundary change, configuration improvement, consolidation or larger redesign achieve? Include retaining the present design where credible. |\n| Transition | Who does the work, what cash is needed, what runs in parallel and what gets postponed? |\n| Outcome and limits | What observable result justifies the work, what might offset it, and what triggers revision? |\n\nA valuation ratio is context for this conversation. It does not replace the customer, operating and technical evidence needed to choose the design.\n\n\n## 12. Compare Investment Choices and Capacity\n\nUse before approving a combination of projects. See [You Cannot Fund Every Good Project at Once](choosing-investments.html). This record complements the individual initiative record in Tool 5: each project can be feasible on its own while the combination is not.\n\n| Field | Record |\n| --- | --- |\n| Decision and period | The combination of work being chosen, the planning period and the person authorized to decide |\n| Required commitments | Existing customer, operating or other obligations, and the minimum result the company has agreed to provide |\n| Available money | Cash that can be committed after existing obligations; distinguish new funding from money paid to selling owners |\n| Available team capacity | People, skills and time available after current work; identify specialists shared across proposals |\n| Options | Expected result, evidence, cash, team time, dependencies, continuing cost and the consequence of delay for each option |\n| Combination proposed | Selected work, total cash and capacity, sequencing, work deferred or stopped and resources left uncommitted |\n| Uncertainty and first stages | What a smaller commitment can test, and what must remain workable if later work does not proceed |\n| Review decision | Evidence, date and authority for continuing, changing, expanding or stopping |\n\nCalculate cash and team time separately. Identify overlapping benefits and costs, as well as prerequisites that prevent projects from running in parallel. A resource estimate should say what is included; avoid adding existing payroll to a proposal a second time if the budget already contains it.\n\nRecord the reason for the selected combination in ordinary language. A score can organize estimates, but the accountable decision-maker must still explain the trade-off and what evidence would change it.\n\n![Arrangement, options, funded work and outcome records connect through an ongoing decision and review loop.](assets/images/toolkit/records-form-a-decision-loop.jpeg)\n**Figure 2:** *The records are useful when evidence from the work changes the next decision.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
