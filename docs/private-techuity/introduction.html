<script id="data" type="application/json">{"meta": {"title": "Introduction & Reading Guide", "date": "2026-09-12", "author": "Željko Obrenović", "permalink": "introduction", "excerpt": "A practical guide to making product and engineering decisions when investors shape the money, authority and expectations around your company.", "logo": "assets/images/introduction/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)", "icon": "assets/icons/introduction.png"}, "tags": [], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **IN THIS SECTION, YOU WILL:** Learn what this book is for, which route to take for the decision in front of you, and how to read fictional examples and historical evidence.\n\n\n> **KEY POINTS:**\n>\n> * Ownership changes the **conditions in which you lead**. Find out which money, decisions and expectations your product and engineering commitments depend on.\n> * Different arrangements require **different choices**. Raising money from investors, a buyout in which an investor buys the power to direct the company, and a purchase by another business can put the same roadmap, the plan of what the team builds next, under different constraints.\n> * You remain **responsible for the company’s work**. Challenge assumptions, make feasible commitments and explain consequences for customers and teams.\n\n<br>\nYour company has new investors. The announcement promises growth and support. Within weeks, you are asked to hire faster, demonstrate a new product, reduce costs or connect to the owner’s systems. The requests may each sound reasonable. Together, they can exceed the company’s money, authority and ability to deliver.\n\n**OWNED: Product & Engineering Leadership Under Investors** is for product and engineering leaders inside a company whose investors affect its funding, authority and expectations, including leaders who have joined an arrangement they didn’t choose. It assumes no finance training and explains the financial terms needed to question a plan, budget or ownership claim. It does assume an interest in fairly detailed questions about how software is built and released, how systems are structured, how teams are organized and what counts as evidence, because those are where the investor’s expectations land. Founders, finance colleagues and investor advisers may find it useful as a shared vocabulary.\n\nThe company’s ownership setting **doesn’t remove your judgment or responsibility**. Sometimes you can approve a change yourself. Sometimes you must negotiate funding, challenge a target or ask the board, the directors who oversee the company on behalf of its owners, to choose between incompatible outcomes. The book helps you distinguish those situations and make the consequences clear.\n\n## Why This Book Exists, and How It Is Written\n\nThe financial, legal, and general business aspects of outside investment are well covered. There is no shortage of material on term sheets (the documents that propose an investment’s main conditions), valuations (estimates of what a company is worth), fund structures (how investors’ pooled money is organized and managed) and deal mechanics (the steps that complete an investment or a purchase). In the author’s experience as a technology leader and adviser, far less has been written about **what an external investment does to product and engineering**: which commitments it creates, which money and authority the team can actually count on, and how a roadmap, a decision about how the software is structured, or a hiring plan should change once the ownership changes.\n\nThe same experience suggests what the gap costs. Inside companies it breeds **confusion**, and it **costs them opportunities**, because leaders who cannot read the arrangement cannot use it. It also **invites misuse**: a sentence that begins “investors want us to…” can carry an agenda nobody in the room has examined, sometimes without anyone knowing what the investors actually require or whether they were even asked.\n\nThis book is the response, written from the company leader’s side: the vocabulary to read the arrangement, working methods to test such claims, and worked decisions that show what a commitment the team can keep looks like.\n\nThis book is a living journal and a work in progress: a draft by [Željko Obrenović](https://obren.io), who keeps revising it as he learns more about its topics. Chapters change as better evidence, sharper examples, and reader questions arrive. Each chapter’s page carries a “View spec” link to the specification it was written against; the changelog at the end of that specification records what changed and why. Read the book as current thinking with its limits stated, not as a finished text.\n\n## Start With the Decision in Front of You\n\nThe eight parts are ordered for learning, and the complete sequence is the default for a first reading. If a decision is already waiting, pick the row that matches it, read the chapter in the **Start with** column, and return to Part I when a financial term is unfamiliar. The **Then** column is optional further reading, in a suggested order.\n\nThe chapter titles in the table appear in full on this page, and a few of them use words that Part I explains properly. Until then, read them this way:\n\n- **Money words.** **Revenue** is the money a company earns from selling its product, before any costs are taken off. **Profit** is what remains after costs. **Cash** is the money actually available to spend, which can run short even when revenue and profit look healthy, and **cash flow** is money moving into and out of the company over time. **Operating earnings** are a profit figure from the company’s ordinary business, worked out under accounting rules; they are not cash in the bank. A **lender** provides money that must be repaid, usually with **interest**, the extra charge for borrowing it.\n- **Ownership words.** **Equity** means ownership; an owner’s equity is its share of the company. **Carry** is short for carried interest: the share of investment profits that the firm managing a fund can receive under the fund’s agreed conditions, separate from what the fund’s own investors earn. **Diligence** is short for due diligence, the investigation of a business before investing in or buying it. An **exit** is an investor selling or otherwise cashing in its investment; it is not the company closing.\n- **People and systems words.** **Headcount** is the number of employees; **capacity** is the amount of work those people can actually handle, which is not the same thing. **Resilience** is the ability of the company’s systems to withstand and recover from disruption, and a **backup** is a saved copy of data or software kept for that recovery. **Cloud costs** are the charges for computing services rented from an outside provider.\n\nThe [Glossary](glossary.html) covers the rest.\n\n| Your immediate need | Start with | Then |\n| --- | --- | --- |\n| A promised investment must become a budget | [Understand Funding and Control: An Investment Announcement Is Not a Budget](announcement-is-not-a-budget.html) | [Understand Cash Flow: Confirm the Cash Before You Commit](obligations-before-budget.html), [Clarify Authority: Decide Who Decides Before You Disagree](decide-who-decides.html), [Set Priorities: You Cannot Fund Everything at Once](cannot-fund-everything.html), [Manage Funding Delays: Revise the Cash Plan and Commitments](the-financing-slipped.html) |\n| A change to how the business works needs a credible case | [Set Priorities: You Cannot Fund Everything at Once](cannot-fund-everything.html) | [Test Revenue Assumptions: Do Customers Respond as Expected?](roadmap-to-revenue.html), [Assess Capability: Can the Team Deliver?](can-the-team-deliver.html), the Part IV, V or VI chapter for your area, and the [Practical Tools for Ownership and Technology Decisions](toolkit.html) records of an initiative and its outcome |\n| The investor has its own technology adviser (a “technology operating partner”) or a specialist in artificial intelligence (AI): software that generates text or makes predictions from patterns in data | [Understand Technology Operating Partners: How They Work With Your Team](tech-operating-partner.html) | [Clarify the Adviser’s Role: Are They Helping, Assessing or Deciding?](investors-adviser.html), [Set the Terms of Help: Agree the Work, Authority and Handover](useful-engagement.html) |\n| Agree or reset how we work with the investor | [Plan Investor Support: Match the Help to Company Priorities](operating-model-blueprints.html) | [Clarify Authority: Decide Who Decides Before You Disagree](decide-who-decides.html), [Set the Terms of Help: Agree the Work, Authority and Handover](useful-engagement.html) |\n| Investor help is on offer | [Clarify the Adviser’s Role: Are They Helping, Assessing or Deciding?](investors-adviser.html) | [Choose the Right Help: Compare Investor Support With Other Options](help-that-changes-capability.html), [Set the Terms of Help: Agree the Work, Authority and Handover](useful-engagement.html) |\n| Explore the investor’s network: its events, and the leaders of the other companies it has invested in | [Learn Through Your Investor’s Network: Knowledge, Peers and New Perspectives](learn-through-investors-network.html) | the [Practical Tools for Ownership and Technology Decisions](toolkit.html) learning brief, then [Choose the Right Help: Compare Investor Support With Other Options](help-that-changes-capability.html) when a specific need emerges |\n| The investor wants better reporting, or we keep arguing about what a number means | [Have Your Numbers Ready: Metrics for Investors, Goals and Dashboards](have-your-numbers-ready.html) | the [Practical Tools for Ownership and Technology Decisions](toolkit.html) measure record, then [Test Revenue Assumptions: Do Customers Respond as Expected?](roadmap-to-revenue.html) for the benefit arithmetic |\n| The investor wants to oversee technology across all the companies it has invested in (its portfolio) | [Appendix: Grounded Architecture Across an Investment Portfolio](grounded-architecture-portfolio.html) | [Plan Investor Support: Match the Help to Company Priorities](operating-model-blueprints.html), [Have Your Numbers Ready: Metrics for Investors, Goals and Dashboards](have-your-numbers-ready.html) |\n| The company is about to be bought, or to take new investment | [Use Diligence: Correct the Plan Before It Is Signed](diligence-corrects-the-plan.html) | [Plan the First Hundred Days: Turn Expectations Into Funded Work](first-hundred-days.html), [Manage the Handover: Carry Forward the Evidence and Obligations](handover-of-obligations.html) |\n| Owners want more growth or profit than the team can support | [Understand Funding Choices: Match the Money to the Work](raise-what-you-need.html) | [Set Priorities: You Cannot Fund Everything at Once](cannot-fund-everything.html), [Scale the Team Up: Headcount Is Not Capacity](fix-decisions-before-hiring.html) |\n| Investor requests compete with customer needs | [Test Revenue Assumptions: Do Customers Respond as Expected?](roadmap-to-revenue.html) | [Clarify Authority: Decide Who Decides Before You Disagree](decide-who-decides.html), [Assess Investor Fit: Behavior Under Pressure](investor-under-pressure.html), [Success for Whom, and for How Long?](success-for-whom.html) |\n| A business that has invested in us wants to connect its systems to ours, or wants access to our data | [Plan Acquisitions and Separations: Account for Extra Work, Not Just Expected Value](acquisition-adds-work-first.html) | [Build And Test Resilience: Backups Are Not Enough](prove-you-can-restore.html), [Set the Terms of Help: Agree the Work, Authority and Handover](useful-engagement.html) |\n| The investor wants a leadership change | [Clarify Authority: Decide Who Decides Before You Disagree](decide-who-decides.html) | [Scale the Team Up: Headcount Is Not Capacity](fix-decisions-before-hiring.html), [Choose the Right Help: Compare Investor Support With Other Options](help-that-changes-capability.html), [Clarify the Adviser’s Role: Are They Helping, Assessing or Deciding?](investors-adviser.html) |\n| We must reduce the number of employees | [Manage Funding Delays: Revise the Cash Plan and Commitments](the-financing-slipped.html) | [Scale the Team Down: Decide What Work Stops, Not Just Who Leaves](anatomy-of-a-layoff.html), then [Compare Incentives and Stakes: Equity, Carry and Jobs](different-bets.html) on how three different rewards shape what people push for: the managers’ ownership shares, the fund manager’s carry and employees’ jobs; then the [Practical Tools for Ownership and Technology Decisions](toolkit.html) workforce-decision record |\n\nIf your decision is the first one in the table — an announced investment that someone expects to become a hiring plan — read the chapter [Understand Funding and Control: An Investment Announcement Is Not a Budget](announcement-is-not-a-budget.html) now and the rest in order later.\n\n## Owners, Rights, Funding, and Change\n\nThis book focuses mainly on **private companies**, whose shares (the units of ownership in a company) are not traded on a public stock exchange, working with **outside investors**: people or organizations from outside the company who commit money expecting a **financial return**, the gain they hope to make on it, and accepting the risk of loss.\n\nAn investor’s money can go to two different places, and a deal sometimes combines both. When the company issues new shares, the investor pays the company, which then has new funding to spend. When the investor buys shares from existing owners, the money goes to those sellers, and the company itself receives nothing to spend: the ownership changes, the budget does not.\n\nTwo cases sit outside that main scope. A founder funding the company from their own resources serves as a point of comparison. Public stock markets come up where they influence financing or ownership changes, but leadership in publicly traded companies, whose shares anyone can buy on an exchange, is not covered in detail.\n\nTo understand the impact of any outside investment, keep **four questions** separate: who the owners are, what rights they have, how the company is funded, and what is changing.\n\nTwo words recur in the answers. An owner’s **stake** is the share of the company it holds, usually stated as a percentage. **Control** is the power to direct the company’s main decisions, such as appointing its leaders or approving its budget. Holding more than half the shares normally brings control, but the rights agreed in the investment can move it.\n\nThe first question, who the owners are, is where most of the labels come from. A **venture investor** typically funds a young company that is still proving its product or the way it earns money, though venture funds also invest in later **funding rounds** (each round is one occasion on which the company raises money from investors on agreed terms) of companies already scaling an established product. A **growth investor** funds the expansion of a business with established demand; the venture and growth labels overlap at that later stage, and the round’s terms matter more than its name. A **buyout investor** purchases control: it buys enough of the company, on terms that give it the power to direct the main decisions. A **corporate investor** is another operating business investing for financial or commercial reasons; it may hold a **minority stake** (less than half the company) or acquire the company outright, which is a corporate **acquisition**.\n\nThese labels tell you roughly what kind of investor you’re dealing with, but not the answers to the other three questions. **Rights** don’t automatically follow from **stake size**: a minority investment can carry important **approval rights** without conferring control. An investor holding a fifth of the shares may, for example, have the agreed right to say no to new borrowing above a set amount or to a sale of the company, while having no say in day-to-day decisions. **Funding** doesn’t follow from deal type: borrowing (money that must be repaid, usually with interest) is a way to raise money and isn’t confined to buyouts. And the nature of the **change** is separate again: a **carve-out** takes a business out of a larger company, a **turnaround** fixes serious business problems, and either can involve any of the owner types above.\n\nThe practical impact of any investment therefore depends on its actual terms, **established case by case**: the investor’s rights, the financing, the support available and how long the investor expects to remain involved. The events a leader faces, from a first funding round to a sale of the company or continued ownership, arrive in any order; each sends you to a different part of the book, which is why the routes above exist.\n\n![Four cards feed one notebook labelled Commitment: Owners (three people in business clothes), Rights (a signed document stamped APPROVED beside a ticked checkbox), Funding (a money bag, stacked coins and a rising line chart) and What is changing (a small building moving out of a larger building outline, labelled Leaving a larger company, and a cracked building being repaired with a wrench and propped by a beam, labelled Fixing a struggling business).](assets/images/introduction/four-questions-before-a-commitment.jpeg)\n**Figure 1:** *Keep the four questions separate before a commitment: who the owners are, what rights they have, how the company is funded and what is changing, for instance a business leaving a larger company or a struggling business being fixed.*\n\n## How the Parts Build on Each Other\n\n- **Part I** supplies the financial tools to understand your owners and the cash you can actually count on.\n- **Part II** establishes who has the authority to decide, which rewards and pressures shape those decisions (the incentives), and the working relationships around them.\n- **Part III** connects the investor–company working arrangement with useful help, the agreements that define an adviser’s or specialist’s work and authority, and the people who provide that support.\n- **Part IV** turns expectations into choices about product, engineering, people and AI, and revises them when expected money is late. It is the center of the book.\n- **Part V** changes the company’s size and shape deliberately: adding people, reducing them, changing systems for expected growth, and buying or separating a business.\n- **Part VI** keeps the technology the company already runs worth its cost: a lower cloud bill and backups that must actually restore.\n- **Part VII** follows the events around a funding or ownership change: the investigation before an investment, the first hundred days, and the handover to the next owners.\n- **Part VIII** examines historical cases and closes with the book’s standard for success.\n\nEach part introduction explains its chapters and the order. On a first pass, read in order, since each chapter builds on terms introduced earlier: for instance, the chapter [Understand Valuation: An Estimate, Not a Fact](valuation-is-an-estimate.html) teaches how a company’s worth is estimated, and the chapter [Plan for Growth: Decide What (Not) to Change in Your Systems](growth-into-design.html) later applies those concepts to a design choice once the product and engineering foundations are in place.\n\nThe eight parts work together around one purpose: **commitments the company can keep**. Funding and obligations (the payments and duties the company must fulfil) set the conditions; authority and incentives shape decisions; the working arrangement with the investor adds capability; those decisions become feasible work, deliberate changes of size and a technology estate kept worth its cost. Funding and ownership events require renewed commitments, and evidence from other companies helps you question the assumptions throughout.\n\n![Eight parts form a connected framework around commitments the company can keep: I Understand money and obligations; II Align authority and incentives; III Collaborate for useful help and capability; IV Commit to feasible work; V Scale the team, the systems and the company deliberately; VI Sustain the technology you run, worth its cost; VII Lead through funding and ownership changes; VIII Learn from evidence about other companies. A clockwise path connects the parts and returns from learning to understanding.](assets/images/introduction/owned-eight-part-framework.jpeg)\n**Figure 2:** *The eight parts share one leadership purpose. Read I–VIII to build the foundations, then revisit the relevant part as conditions and evidence change.*\n\n## Meet the Fictional Company\n\n**Larkspur** sells scheduling software to maintenance businesses. Its customers organize appointments and assign people to work. A recurring challenge is **customer onboarding**: the setup and help needed before a customer can use the product successfully.\n\nInes is the **chief executive officer (CEO)**, leading the company. Alex is the **chief technology officer (CTO)**, leading technology. Sam is the **chief financial officer (CFO)**, leading finance. Priya leads product. Morgan is the investor’s technology adviser in the scenarios where an investment fund, a pool of investors’ money run by a management firm, owns part or all of Larkspur.\n\nThe chapters place Larkspur in alternative situations: learning with limited cash, expanding with growth funding, operating after a buyout, or working with a corporate owner. These are fictional decision exercises, not a single company history. Each example states its own assumptions; its figures do not combine into one set of financial records.\n\nOne shared example is the deliberate exception, and it is the main one. A single onboarding finding, that setting up a new customer depends on one specialist’s manual work, is carried through six stages, nine chapters and the toolkit with the same identifiers:\n\n1. the investigation before the investment, [Use Diligence: Correct the Plan Before It Is Signed](diligence-corrects-the-plan.html), in which the buyer examines the business before committing;\n2. the funded early plan, [Plan the First Hundred Days: Turn Expectations Into Funded Work](first-hundred-days.html), which sets one approved budget and allocation of staff time for the first hundred days, and [Set Priorities: You Cannot Fund Everything at Once](cannot-fund-everything.html), which chooses within that budget to run a **pilot** (a limited trial of automated onboarding before any larger commitment) and revises the choice when a test fails;\n3. the recovery test funded beside the pilot, [Build And Test Resilience: Backups Are Not Enough](prove-you-can-restore.html), which checks that a failed system and its data can be restored;\n4. the investor’s support for the pilot, [Choose the Right Help: Compare Investor Support With Other Options](help-that-changes-capability.html) and [Set the Terms of Help: Agree the Work, Authority and Handover](useful-engagement.html);\n5. the pilot’s measured outcome and the decision it supports, [Test Revenue Assumptions: Do Customers Respond as Expected?](roadmap-to-revenue.html), and how those numbers are defined, owned and labelled, [Have Your Numbers Ready: Metrics for Investors, Goals and Dashboards](have-your-numbers-ready.html);\n6. the handover of what was paid, owed and left undone, [Manage the Handover: Carry Forward the Evidence and Obligations](handover-of-obligations.html).\n\nThe [Practical Tools for Ownership and Technology Decisions](toolkit.html) shows the record those chapters write, stage by stage. Follow that example to see one decision carried all the way through, from evidence to money to what was left undone.\n\nThe delayed-financing chapter ([Manage Funding Delays: Revise the Cash Plan and Commitments](the-financing-slipped.html)) and the staff-reduction chapter that continues it ([Scale the Team Down: Decide What Work Stops, Not Just Who Leaves](anatomy-of-a-layoff.html)) form a second, separate connected example. They show how a dated **cash forecast**, a month-by-month estimate of the money expected to come in and go out and the balance left, changes commitments when expected money arrives late. They also show when a staff reduction requires payments and when its savings begin. Their cash, the rate at which the company spends it, their people and their dates are their own and do not add to the main example’s figures. “€m” means millions of euros.\n\n## Choose a Reading Format\n\nAll thirty-nine main chapters provide an **Article**, a short **TL;DR** summary and an illustrated **Comic**, with captions and dialogue transcripts. TL;DR means “too long; didn’t read.” Summaries aim for 300–500 words; some current drafts run longer than that target. Most comics are pages of stacked strips with the dialogue drawn into the artwork; the three case comics on Visma, Toys R Us and TeamSystem use single-scene panels. The eight part introductions, the appendix and the reference pages use only the Article format. These counts describe the files at the time of writing and are rechecked as chapters are revised.\n\nFor a shorter first pass, read the part introductions and chapter summaries. The formats are companions rather than substitutes. Each one is written to reach the same decision and to keep the conditions that decide whether that decision holds; what varies is depth: the article gives the fullest calculations, the discussion of sources and the alternative cases, while every format keeps the conditions that would change the decision. The summaries and comics of this September 2026 revision are still being reconciled chapter by chapter, so where a short format and the article disagree, the article is the one to trust.\n\n## Read the Evidence With Its Limits\n\nThis living manuscript was first drafted in September 2026 and revised the same month. Its historical cases examine specified periods at Hilton, Skype, Visma, Toys R Us and TeamSystem. The evidence concentrates on **private equity**, investment in companies whose shares are not publicly traded, usually made through funds of pooled investor money and often taking control, and on related ownership transitions. It doesn’t establish how all venture, growth or corporate investors behave or perform.\n\nGuides published by regulators and by public development banks, publicly backed institutions that support business or economic development, underpin the descriptions of other arrangements. The comparative Larkspur exercises are the author’s illustrations of decisions under stated assumptions. Company filings (documents formally submitted to a regulator or public registry), investors’ own accounts of events and research answer different questions; none makes an unobserved customer or employee outcome known.\n\nThe [Bibliography and Evidence Guide](bibliography.html) records consultation scope and evidence limits. The chapter-end “To Probe Further” lists are optional reading for going deeper; the bibliography identifies which resources were also used as evidence, since a few appear in both places. A chapter’s argument rests only on the sources cited inline.\n\n## Contents\n\nThe site navigation lists the same chapters; this list is here for lookup.\n\n### Part I — UNDERSTAND: Financing and Ownership\n\n- [UNDERSTAND: Financing and Ownership](part-1.html) — part introduction\n- **1.** [Understand Expectations: Customers, Lenders and Investors](customers-lenders-investors.html)\n- **2.** [Understand Funding and Control: An Investment Announcement Is Not a Budget](announcement-is-not-a-budget.html)\n- **3.** [Understand Valuation: An Estimate, Not a Fact](valuation-is-an-estimate.html)\n- **4.** [Understand Investor Returns: Same Performance, Different Outcomes](three-different-returns.html)\n- **5.** [Understand Funding Choices: Match the Money to the Work](raise-what-you-need.html)\n- **6.** [Understand Cash Flow: Confirm the Cash Before You Commit](obligations-before-budget.html)\n\n### Part II — ALIGN: Clarify Who Decides and What Is at Stake\n\n- [ALIGN: Clarify Who Decides and What Is at Stake](part-2.html) — part introduction\n- **7.** [Clarify Authority: Decide Who Decides Before You Disagree](decide-who-decides.html)\n- **8.** [Compare Incentives and Stakes: Equity, Carry and Jobs](different-bets.html)\n- **9.** [Assess Investor Fit: Behavior Under Pressure](investor-under-pressure.html)\n\n### Part III — COLLABORATE: Get Useful Help From Your Investors\n\n- [COLLABORATE: Get Useful Help From Your Investor](part-3.html) — part introduction\n- **10.** [Plan Investor Support: Match the Help to Company Priorities](operating-model-blueprints.html)\n- **11.** [Learn Through Your Investor’s Network: Knowledge, Peers and New Perspectives](learn-through-investors-network.html)\n- **12.** [Choose the Right Help: Compare Investor Support With Other Options](help-that-changes-capability.html)\n- **13.** [Set the Terms of Help: Agree the Work, Authority and Handover](useful-engagement.html)\n- **14.** [Clarify the Adviser’s Role: Are They Helping, Assessing or Deciding?](investors-adviser.html)\n- **15.** [Understand Technology Operating Partners: How They Work With Your Team](tech-operating-partner.html)\n\n### Part IV — COMMIT: Turn Expectations Into Work You Can Deliver\n\n- [COMMIT: Turn Expectations Into Work You Can Deliver](part-4.html) — part introduction\n- **16.** [Adopt Outcome Thinking: Balance Customer and Business KPIs](adopt-outcome-thinking.html)\n- **17.** [Have Your Numbers Ready: Metrics for Investors, Goals and Dashboards](have-your-numbers-ready.html)\n- **18.** [Set Priorities: You Cannot Fund Everything at Once](cannot-fund-everything.html)\n- **19.** [Test Revenue Assumptions: Do Customers Respond as Expected?](roadmap-to-revenue.html)\n- **20.** [Clarify AI Strategy: Three Different Investment Questions](ai-strategy-three-questions.html)\n- **21.** [Assess Capability: Can the Team Deliver?](can-the-team-deliver.html)\n- **22.** [Manage Funding Delays: Revise the Cash Plan and Commitments](the-financing-slipped.html)\n\n### Part V — SCALE: Change the Team, the Systems and the Company Deliberately\n\n- [SCALE: Change the Team, the Systems and the Company Deliberately](part-5.html) — part introduction\n- **23.** [Scale the Team Up: Headcount Is Not Capacity](fix-decisions-before-hiring.html)\n- **24.** [Scale the Team Down: Decide What Work Stops, Not Just Who Leaves](anatomy-of-a-layoff.html)\n- **25.** [Scale the Team With AI: Capacity Claims Need the Same Evidence as Headcount](scale-the-team-with-ai.html)\n- **26.** [Plan for Growth: Decide What (Not) to Change in Your Systems](growth-into-design.html)\n- **27.** [Plan Acquisitions and Separations: Account for Extra Work, Not Just Expected Value](acquisition-adds-work-first.html)\n\n### Part VI — SUSTAIN: Keep the Technology You Run Worth Its Cost\n\n- [SUSTAIN: Keep the Technology You Run Worth Its Cost](part-6.html) — part introduction\n- **28.** [Manage Technical Debt: Fund the Fix by the Cost, the Risk and the Speed It Buys](manage-technical-debt.html)\n- **29.** [Build And Test Resilience: Backups Are Not Enough](prove-you-can-restore.html)\n- **30.** [Critically Evaluate Cloud Costs: A Lower Bill Is Not Always Better](cheaper-cloud-bill.html)\n- **31.** [Critically Evaluate AI Costs: Measure the Return per Task and per Period](ai-worth-its-cost.html)\n\n### Part VII — LEAD: Manage Funding and Ownership Changes\n\n- [LEAD: Manage Funding and Ownership Changes](part-7.html) — part introduction\n- **32.** [Use Diligence: Correct the Plan Before It Is Signed](diligence-corrects-the-plan.html)\n- **33.** [Plan the First Hundred Days: Turn Expectations Into Funded Work](first-hundred-days.html)\n- **34.** [Manage the Handover: Carry Forward the Evidence and Obligations](handover-of-obligations.html)\n\n### Part VIII — LEARN: Lessons From the Field\n\n- [LEARN: Lessons From the Field](part-8.html) — part introduction\n- **35.** [Hilton and Skype: A Successful Exit Still Needs Explaining](hilton-and-skype.html)\n- **36.** [Visma: Continuity of Manager Is Not Continuity of Money](visma.html)\n- **37.** [Toys R Us: Positive Operating Earnings, Too Little Cash](toys-r-us.html)\n- **38.** [TeamSystem: Each New Owner Inherits Progress and Unfinished Work](teamsystem.html)\n- **39.** [Success for Whom, and for How Long?](success-for-whom.html)\n\n### Appendix\n\n- [Appendix: Grounded Architecture Across an Investment Portfolio](grounded-architecture-portfolio.html) — the author’s Grounded Architecture framework applied across a portfolio, the set of companies one investor holds: reuse the shared data and people foundations, adapt the way decisions and responsibilities are organized in each company.\n\n### Reference Material\n\n- [Practical Tools for Ownership and Technology Decisions](toolkit.html) — practical decision and support records, with one finding followed all the way through.\n- [Fund Economics: Fees, Distributions and Performance Reports](fund-economics.html) — optional depth on how an investment fund’s money flows: the fees its manager charges, distributions (money the fund pays out to its own investors, which is not funding for the company) and reports on investment performance.\n- [Glossary](glossary.html) — plain-language definitions and an alphabetical index.\n- [Bibliography and Evidence Guide](bibliography.html) — sources, consultation dates and evidence limits.\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
