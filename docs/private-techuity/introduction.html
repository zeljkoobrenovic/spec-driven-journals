<script id="data" type="application/json">{"meta": {"title": "Introduction & Reading Guide", "date": "2026-09-12", "author": "Željko Obrenović", "permalink": "introduction", "excerpt": "A practical guide to making product and engineering decisions when investors shape the money, authority and expectations around your company.", "logo": "assets/images/introduction/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)", "icon": "assets/icons/introduction.png"}, "tags": [], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **IN THIS SECTION, YOU WILL:** Learn what this book is for, which route to take for the decision in front of you, and how to read its fictional examples and historical evidence.\n\n\n> **KEY POINTS:**\n>\n> * Ownership changes the **conditions in which you lead**. Find out which money, decisions and expectations your product and engineering commitments depend on.\n> * Different arrangements require **different choices**. A funding round, a buyout and a corporate acquisition can put the same roadmap under different constraints.\n> * You remain **responsible for the company’s work**. Challenge assumptions, make feasible commitments and explain consequences for customers and teams.\n\n<br>\nYour company has new investors. The announcement promises growth and support. Within weeks, you are asked to hire faster, demonstrate a new product, reduce costs or connect to the owner’s systems. The requests may each sound reasonable. Together, they can exceed the company’s money, authority and ability to deliver.\n\n**OWNED: Product & Engineering Leadership Under Investors** is for product and engineering leaders inside a company whose investors affect its funding, authority and expectations, including leaders who have joined an arrangement they didn’t choose. It assumes no finance training and explains the financial terms needed to question a plan, budget or ownership claim. It does assume an interest in fairly detailed questions about software delivery, architecture, organization and evidence, because those are where the investor’s expectations land. Founders, finance partners and investor advisers may find it useful as a shared vocabulary; the decisions it works through are the company leader’s.\n\nThe company’s ownership setting doesn’t remove your judgment or responsibility. Sometimes you can approve a change yourself. Sometimes you must negotiate funding, challenge a target or ask the board to choose between incompatible outcomes. The book helps you distinguish those situations and make the consequences clear.\n\n## Why This Book Exists, and How It Is Written\n\nThe financial, legal, and general business aspects of outside investment are well covered: there is no shortage of material on term sheets, valuations, fund structures, and deal mechanics. In the author’s experience as a technology leader and adviser, far less has been written about **what an external investment does to product and engineering**: which commitments it creates, which money and authority the team can actually count on, and how a roadmap, an architecture decision or a hiring plan should change once the ownership changes. That is an observation from practice, not a survey of the literature.\n\nThe same experience suggests what the gap costs. Inside companies it breeds **confusion**, and it **costs them opportunities**, because leaders who cannot read the arrangement cannot use it. It also **invites misuse**: a sentence that begins “investors want us to…” can carry an agenda nobody in the room has examined, sometimes without anyone knowing what the investors actually require or whether they were even asked. How often that happens is not measured here; that it happens at all is reason enough to be able to check.\n\nThis book is the response, written from the company leader’s side: the vocabulary to read the arrangement, working methods to test such claims, and worked decisions that show what a commitment the team can keep looks like.\n\nThis book is a living journal and a work in progress: a draft by [Željko Obrenović](https://obren.io), who keeps revising it as he learns more about its topics. Chapters change as better evidence, sharper examples, and reader questions arrive. Each chapter’s page carries a “View spec” link to the specification it was written against; the changelog at the end of that specification records what changed and why. Read the book as current thinking with its limits stated, not as a finished text.\n\n## Start With the Decision in Front of You\n\nThe six parts are ordered for learning, and the complete sequence is the default for a first reading. If a decision is already waiting, start with one of these routes and return to Part I when a financial term is unfamiliar.\n\n| Your immediate need | Suggested route |\n| --- | --- |\n| A promised investment must become a budget | [An Investment Announcement Is Not a Budget](announcement-is-not-a-budget.html) → [Find the Cash Behind Your Technology Budget](obligations-before-budget.html) → [Decide Who Decides, Before You Disagree](decide-who-decides.html) → [You Cannot Fund Every Good Project at Once](cannot-fund-everything.html) → [The Roadmap Did Not Slip, the Financing Did](the-financing-slipped.html) |\n| An operating improvement needs a credible case | [You Cannot Fund Every Good Project at Once](cannot-fund-everything.html) → [The Chain From Roadmap to Revenue Breaks Easily](roadmap-to-revenue.html) → [Can the Software and the Team Deliver What Was Promised?](can-the-team-deliver.html) → the relevant domain chapter in Part III → the [Practical Tools for Ownership and Technology Decisions](toolkit.html) initiative and outcome records |\n| Investor help is on offer | [Is the Investor’s Adviser Helping, Assessing or Deciding?](investors-adviser.html) → [Find the Help That Changes What Your Team Can Do](help-that-changes-capability.html) → [Turn an Offer of Help Into a Useful Engagement](useful-engagement.html) |\n| A transaction or ownership change is imminent | [Diligence Is Your Chance to Correct the Plan Before It Is Signed](diligence-corrects-the-plan.html) → [The First Hundred Days: Turn Expectations Into a Funded Plan](first-hundred-days.html) → [Hand Over the Obligations, Not Just the Company](handover-of-obligations.html) |\n| Owners want more growth or earnings than the team can support | [Match the Funding to the Work](raise-what-you-need.html) → [You Cannot Fund Every Good Project at Once](cannot-fund-everything.html) → [Fix the Decision Problem Before Adding People](fix-decisions-before-hiring.html) |\n| Investor requests compete with customer needs | [The Chain From Roadmap to Revenue Breaks Easily](roadmap-to-revenue.html) → [Decide Who Decides, Before You Disagree](decide-who-decides.html) → [Judge an Investor by Their Behavior Under Pressure](investor-under-pressure.html) → [Success for Whom, and for How Long?](success-for-whom.html) |\n| A corporate investor wants integration or access to data | [An Acquisition Adds Work Before It Adds Value](acquisition-adds-work-first.html) → [Prove You Can Restore, Not Just That You Back Up](prove-you-can-restore.html) → [Turn an Offer of Help Into a Useful Engagement](useful-engagement.html) |\n| The investor wants a leadership change | [Decide Who Decides, Before You Disagree](decide-who-decides.html) → [Fix the Decision Problem Before Adding People](fix-decisions-before-hiring.html) → [Find the Help That Changes What Your Team Can Do](help-that-changes-capability.html) → [Is the Investor’s Adviser Helping, Assessing or Deciding?](investors-adviser.html) |\n| We must reduce headcount | [The Roadmap Did Not Slip, the Financing Did](the-financing-slipped.html) → [Anatomy of a Layoff](headcount-plan-shrinks.html) → [Management Equity, Fund Carry and Employee Jobs Are Different Bets](different-bets.html) → the [Practical Tools for Ownership and Technology Decisions](toolkit.html) workforce-decision record |\n\nIf your decision is the first one in the table — an announced investment that someone expects to become a hiring plan — read [An Investment Announcement Is Not a Budget](announcement-is-not-a-budget.html) now and the rest in order later.\n\n## Owners, Rights, Funding, and Change\n\nThis book focuses mainly on private companies working with **outside investors**. Founder self-funding serves as a point of comparison, and public markets come up where they influence financing or ownership changes, but leadership in public companies is not covered in detail.\n\nTo understand the impact of any outside investment, keep **four questions** separate: who the owners are, what rights they have, how the company is funded, and what is changing.\n\nThe first question, who the owners are, is where most of the labels come from. A **venture investor** typically funds a young company that is still proving its product or business model, though venture funds also invest in successive rounds of companies already scaling an established product. A **growth investor** funds the expansion of a business with established demand; the venture and growth labels overlap at that later stage, and the round’s terms matter more than its name. A **buyout investor** purchases control. A **corporate investor** is another operating business investing for financial or commercial reasons; it may hold a minority stake or acquire the company outright.\n\nThese labels tell you roughly what kind of investor you’re dealing with, but not the answers to the other three questions. Rights don’t automatically follow from stake size: a minority investment can carry important approval rights without conferring control. Funding doesn’t follow from deal type: borrowing is a way to raise money and isn’t confined to buyouts. And the nature of the change is separate again: a **carve-out** takes a business out of a larger company, a **turnaround** fixes serious business problems, and either can involve any of the owner types above.\n\nThe practical impact of any investment therefore depends on its actual terms, **established case by case**: the investor’s rights, the financing, the support available and the time horizon. The events a leader faces, from a first round to a sale or continued ownership, arrive in any order; each sends you to a different part of the book, which is why the routes above exist.\n\n![A company commitment depends on four separate questions: who the owners are, what rights they have, how the company is funded and what is changing.](assets/images/introduction/four-questions-before-a-commitment.jpeg)\n**Figure 1:** *Keep the four questions separate before a commitment: who the owners are, what rights they have, how the company is funded and what is changing.*\n\n## How the Parts Build on Each Other\n\nPart I supplies the financial tools to understand your owners and your available cash. Part II establishes authority, incentives and working relationships. Part III turns expectations into choices about product, engineering and people; it is the center of the book. Part IV helps you obtain useful help, from the investor or elsewhere. Part V follows one finding from diligence into a funded early plan, its review and a handover; its delayed-financing chapter, and the reduction chapter that continues it, are a separate illustration of how a dated cash forecast changes commitments and, when the money is late enough, the team. Part VI examines historical cases and closes with the book’s standard for success.\n\nEach part introduction explains its chapters and the order. On a first pass, read in order, since each chapter builds on terms introduced earlier: [A Valuation Is an Estimate, Not a Fact](valuation-is-an-estimate.html) teaches financial valuation, and [Turn “We Expect Growth” Into a Design Decision](growth-into-design.html) later applies those concepts to a design choice once the product and engineering foundations are in place.\n\n![The book moves from money and decisions through company work, support, ownership changes and field lessons.](assets/images/introduction/owned-reading-journey.jpeg)\n**Figure 2:** *The reading sequence builds the foundations before applying them to work, support and changing ownership.*\n\n## Meet the Fictional Company\n\n**Larkspur** sells scheduling software to maintenance businesses. Its customers organize appointments and assign people to work. A recurring challenge is **customer onboarding**: the setup and help needed before a customer can use the product successfully.\n\nInes is the **chief executive officer (CEO)**, leading the company. Alex is the **chief technology officer (CTO)**, leading technology. Sam is the **chief financial officer (CFO)**, leading finance. Priya leads product. Morgan is the investor’s technology adviser in fund-backed scenarios.\n\nThe chapters place Larkspur in alternative situations: learning with limited cash, expanding with growth funding, operating after a buyout, or working with a corporate owner. These are fictional decision exercises, not a single company history. Each example states its own assumptions; its figures do not combine into one set of accounts.\n\nOne chain is a deliberate exception, and it is the only one. A single onboarding finding, that setting up a new customer depends on one specialist’s manual work, is carried through six chapters and the toolkit with the same identifiers:\n\n1. the investigation before the investment, [Diligence Is Your Chance to Correct the Plan Before It Is Signed](diligence-corrects-the-plan.html);\n2. the funded early plan, [The First Hundred Days: Turn Expectations Into a Funded Plan](first-hundred-days.html), which allocates one envelope, and [You Cannot Fund Every Good Project at Once](cannot-fund-everything.html), which chooses within it and revises the choice when a test fails;\n3. the recovery test funded beside the pilot, [Prove You Can Restore, Not Just That You Back Up](prove-you-can-restore.html);\n4. the investor’s support for the pilot, [Find the Help That Changes What Your Team Can Do](help-that-changes-capability.html) and [Turn an Offer of Help Into a Useful Engagement](useful-engagement.html);\n5. the pilot’s measured outcome and the decision it supports, [The Chain From Roadmap to Revenue Breaks Easily](roadmap-to-revenue.html);\n6. the handover of what was paid, owed and left undone, [Hand Over the Obligations, Not Just the Company](handover-of-obligations.html).\n\nThe [Practical Tools for Ownership and Technology Decisions](toolkit.html) shows the record those chapters write, stage by stage. Follow that chain to see one decision carried all the way through, from evidence to money to what was left undone.\n\nThe delayed-financing chapter ([The Roadmap Did Not Slip, the Financing Did](the-financing-slipped.html)) and the reduction chapter that continues it ([Anatomy of a Layoff](headcount-plan-shrinks.html)) are not part of that chain. They are a separate illustration of how a dated cash forecast changes commitments when expected money arrives late, and what a reduction costs by date; their cash, burn, people and dates are their own and do not add to the chain’s figures. “€m” means millions of euros.\n\n## Choose a Reading Format\n\nEach main chapter provides an **Article** and a 300–500-word **TL;DR** summary. TL;DR means “too long; didn’t read.” All thirty-one main chapters also have a six-panel **Comic** with captions and dialogue transcripts; thirty are illustrated, and the reduction chapter’s artwork is pending. The six part introductions and the reference pages have no TL;DR or comic.\n\nFor a shorter first pass, read the part introductions and the summaries. The formats are companions rather than substitutes. Each one is written to reach the same decision and to keep the conditions that decide whether that decision holds; what varies is depth: the article gives the fullest calculations, the discussion of sources and the alternative cases, while every format keeps the conditions that would change the decision. The summaries and comics of this September 2026 revision are still being reconciled chapter by chapter, so where a short format and the article disagree, the article is the one to trust.\n\n## Read the Evidence With Its Limits\n\nThis living manuscript was first drafted in September 2026 and revised the same month. Its historical cases examine specified periods at Hilton, Skype, Visma, Toys R Us and TeamSystem. The evidence concentrates on private equity and related ownership transitions, and doesn’t establish how all venture, growth or corporate investors behave or perform.\n\nInstitutional funding guides support descriptions of other arrangements. The comparative Larkspur exercises are the author’s illustrations of decisions under stated assumptions. Company filings, investor accounts and research answer different questions; none makes an unobserved customer or employee outcome known.\n\nThe [Bibliography and Evidence Guide](bibliography.html) records consultation scope and evidence limits. The chapter-end “To Probe Further” lists are optional reading for going deeper; the bibliography identifies which resources were also used as evidence, since a few appear in both places. A chapter’s argument rests only on the sources cited inline.\n\n## Contents\n\nThe site navigation lists the same chapters; this list is here for lookup.\n\n### Part I — Understanding Financing and Ownership: Money, Authority and Returns\n\n- [PART I — Understanding Financing and Ownership](part-1.html) — part introduction\n- **1.** [Customers, Lenders and Investors: What Each Expects in Return](customers-lenders-investors.html)\n- **2.** [An Investment Announcement Is Not a Budget](announcement-is-not-a-budget.html)\n- **3.** [A Valuation Is an Estimate, Not a Fact](valuation-is-an-estimate.html)\n- **4.** [Same Company, Same Performance, Three Different Returns](three-different-returns.html)\n- **5.** [Match the Funding to the Work](raise-what-you-need.html)\n- **6.** [Find the Cash Behind Your Technology Budget](obligations-before-budget.html)\n\n### Part II — How Investor Ownership Changes Decisions\n\n- [PART II — How Investor Ownership Changes Decisions](part-2.html) — part introduction\n- **7.** [Decide Who Decides, Before You Disagree](decide-who-decides.html)\n- **8.** [Management Equity, Fund Carry and Employee Jobs Are Different Bets](different-bets.html)\n- **9.** [Judge an Investor by Their Behavior Under Pressure](investor-under-pressure.html)\n\n### Part III — Turning Investor Expectations Into Commitments\n\n- [PART III — Turning Investor Expectations Into Commitments](part-3.html) — part introduction\n- **10.** [You Cannot Fund Every Good Project at Once](cannot-fund-everything.html)\n- **11.** [The Chain From Roadmap to Revenue Breaks Easily](roadmap-to-revenue.html)\n- **12.** [Can the Software and the Team Deliver What Was Promised?](can-the-team-deliver.html)\n- **13.** [Fix the Decision Problem Before Adding People](fix-decisions-before-hiring.html)\n- **14.** [Turn “We Expect Growth” Into a Design Decision](growth-into-design.html)\n- **15.** [Why a Cheaper Cloud Bill Can Be Bad News](cheaper-cloud-bill.html)\n- **16.** [Prove You Can Restore, Not Just That You Back Up](prove-you-can-restore.html)\n- **17.** [An AI Strategy Hides Three Investment Questions](ai-strategy-three-questions.html)\n- **18.** [An Acquisition Adds Work Before It Adds Value](acquisition-adds-work-first.html)\n\n### Part IV — Beyond Money: Getting Useful Help From Your Investor\n\n- [PART IV — Beyond Money: Getting Useful Help From Your Investor](part-4.html) — part introduction\n- **19.** [Is the Investor’s Adviser Helping, Assessing or Deciding?](investors-adviser.html)\n- **20.** [Find the Help That Changes What Your Team Can Do](help-that-changes-capability.html)\n- **21.** [Turn an Offer of Help Into a Useful Engagement](useful-engagement.html)\n\n### Part V — Leading Through Funding and Ownership Changes\n\n- [PART V — Leading Through Funding and Ownership Changes](part-5.html) — part introduction\n- **22.** [Diligence Is Your Chance to Correct the Plan Before It Is Signed](diligence-corrects-the-plan.html)\n- **23.** [The First Hundred Days: Turn Expectations Into a Funded Plan](first-hundred-days.html)\n- **24.** [The Roadmap Did Not Slip, the Financing Did](the-financing-slipped.html)\n- **25.** [Anatomy of a Layoff](headcount-plan-shrinks.html)\n- **26.** [Hand Over the Obligations, Not Just the Company](handover-of-obligations.html)\n\n### Part VI — Lessons from the Field\n\n- [PART VI — Lessons from the Field](part-6.html) — part introduction\n- **27.** [Hilton and Skype: A Successful Exit Still Needs Explaining](hilton-and-skype.html)\n- **28.** [Visma: Continuity of Manager Is Not Continuity of Money](visma.html)\n- **29.** [Toys R Us: Positive Operating Earnings, Too Little Cash](toys-r-us.html)\n- **30.** [TeamSystem: Each New Owner Inherits Progress and Unfinished Work](teamsystem.html)\n- **31.** [Success for Whom, and for How Long?](success-for-whom.html)\n\n### Reference Material\n\n- [Practical Tools for Ownership and Technology Decisions](toolkit.html) — practical decision and support records, with one finding followed all the way through.\n- [Fund Economics: Fees, Distributions and Performance Reports](fund-economics.html) — optional depth on fund fees, distributions and performance reports.\n- [Glossary](glossary.html) — plain-language definitions and an alphabetical index.\n- [Bibliography and Evidence Guide](bibliography.html) — sources, consultation dates and evidence limits.\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
