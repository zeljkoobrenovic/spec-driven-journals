<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Under the Hood</title>
    <link rel="stylesheet" href="site.css">
    <!-- Global site tag (gtag.js) - Google Analytics -->

    <style>
        header.site {
            padding-bottom: 4px;
            margin-bottom: 2px;
        }

        header.site .logo {
            display: block;
            width: 100%;
            max-height: 380px;
            object-fit: cover;
            margin-bottom: 0;
            border: 1px solid var(--rule);
        }

        header.site .logo-credit {
            color: var(--muted);
            font-size: 11px;
            margin: 0;
            padding-left: 2px;
            text-align: right;
        }

        header.site h1 {
            margin-top: 20px;
            margin-bottom: 8px;
            padding: 0;
            font-size: 51px;
            font-weight: 500;
            letter-spacing: -0.01em;
            line-height: normal;
        }

        header.site p {
            margin: 0;
            color: var(--muted);
        }

        .book-edition {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin: 10px 0 40px;
            padding: 4px;
        }

        .book-edition[hidden] {
            display: none;
        }

        .book-edition .book-cover {
            display: block;
            flex: 0 0 100px;
        }

        .book-edition .book-cover img {
            display: block;
            width: 100px;
            height: auto;
            border-radius: 4px;
        }

        .book-edition .book-details {
            flex: 1 1 180px;
            min-width: 0;
        }

        .book-edition h2 {
            margin: 0 0 0px;
            font-size: 24px;
            font-weight: 500;
        }

        .book-edition .book-links {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .book-edition .book-links a {
            padding: 8px 14px;
            border: 1px solid var(--accent);
            border-radius: 6px;
            color: var(--accent);
            background: #fff;
            font-size: 15px;
            text-decoration: none;
        }

        .book-edition .book-links a:hover {
            color: #fff;
            background: var(--accent);
        }

        .book-edition a:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 4px;
        }

        .search {
            margin: 0 0 38px;
        }

        .search input {
            width: 100%;
            padding: 12px 14px;
            font-size: 16px;
            border: 1px solid var(--rule);
            border-radius: 6px;
            background: #fff;
            font-family: inherit;
        }

        .search input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .hits {
            color: var(--muted);
            font-size: 13px;
            margin: 0 4px 20px;
        }

        .tag-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 0 0 24px;
        }

        .tag-filter button {
            font: inherit;
            font-size: 13px;
            padding: 4px 10px;
            border: 1px solid deepskyblue;
            border-radius: 999px;
            background: #fff;
            color: var(--fg);
            cursor: pointer;
        }

        .tag-filter button:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .tag-filter button.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .tag-filter button .count {
            color: var(--muted);
            margin-left: 4px;
        }

        .tag-filter button.active .count {
            color: rgba(255, 255, 255, 0.8);
        }

        .tag-filter button.hidden {
            display: none;
        }

        .tag-filter .tag-toggle {
            border-style: dashed;
            border-color: var(--muted);
            color: var(--muted);
        }

        .tag-filter .tag-toggle:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .status-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 0 0 10px;
        }

        .status-filter button {
            font: inherit;
            font-size: 13px;
            padding: 4px 10px;
            border: 1px solid var(--rule);
            border-radius: 999px;
            background: #fff;
            color: var(--fg);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .status-filter button:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .status-filter button.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .status-filter button .status-dot {
            display: inline-block;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--muted);
        }

        .status-filter button .count {
            color: var(--muted);
        }

        .status-filter button.active .count {
            color: rgba(255, 255, 255, 0.8);
        }

        ul.posts .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin: 6px 0 0;
        }

        ul.posts .tags .tag {
            font-size: 12px;
            padding: 1px 8px;
            border-radius: 999px;
            border: 1px solid deepskyblue;
            color: blue;
            background-color: var(--tag-bg);
        }

        section.group {
            margin-bottom: 48px;
        }

        section.group > h2 {
            font-size: 32px;
            margin: 0 0 4px;
            font-weight: 500;
            letter-spacing: -0.01em;
        }

        section.group > .group-desc {
            color: var(--muted);
            margin: -8px 0 16px;
            font-size: 15px;
        }

        section.group.empty {
            display: none;
        }

        ul.posts {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        ul.posts li {
            display: flex;
            gap: 14px;
            padding: 14px 0;
            border-top: 1px dashed var(--rule);
        }

        ul.posts li:last-child {
            border-bottom: 1px solid var(--rule);
        }

        ul.posts li.hidden {
            display: none;
        }

        ul.posts .icon {
            flex: 0 0 100px;
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 7px;
        }

        ul.posts .icon img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 10px;
        }

        ul.posts .icon.placeholder {
            background: var(--rule);
            border-radius: 4px;
        }

        ul.posts .meta {
            flex: 1;
            min-width: 0;
        }

        ul.posts .meta .post-id {
            color: var(--muted);
            font-size: 12px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            margin: 0 0 2px;
        }

        ul.posts .meta .post-status,
        ul.posts .meta .post-id-text {
            margin-right: 8px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        ul.posts .meta .post-status .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--muted);
        }

        ul.posts .meta .post-id .post-id-sep {
            margin-right: 8px;
            color: var(--rule);
        }

        ul.posts .meta a {
            color: rgb(23, 86, 169);
            text-decoration: none;
            font-weight: normal;
            font-size: 23px;
        }

        ul.posts .meta a:hover {
            color: var(--accent);
        }

        ul.posts .meta .excerpt {
            color: var(--muted);
            margin: 0;
            font-size: 15px;
        }

        .empty-msg {
            color: var(--muted);
            font-style: italic;
            display: none;
        }

        .empty-msg.show {
            display: block;
        }

        nav.view-tabs {
            display: flex;
            gap: 4px;
            border-bottom: 1px solid var(--rule);
            margin: 0 0 24px;
            flex-wrap: wrap;
        }

        nav.view-tabs button {
            background: none;
            border: none;
            cursor: pointer;
            font: inherit;
            font-size: 14px;
            color: var(--muted);
            padding: 8px 14px;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            letter-spacing: 0.02em;
        }

        nav.view-tabs button:hover {
            color: var(--accent);
        }

        nav.view-tabs button.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        #visual[hidden] {
            display: none;
        }

        .visual-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 18px;
            margin: 0 0 8px;
        }

        .visual-card {
            display: block;
            text-decoration: none;
            color: var(--fg);
        }

        .visual-card.hidden {
            display: none;
        }

        .visual-card img {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            border: 1px solid var(--rule);
            border-radius: 8px;
        }

        .visual-toolbar {
            display: flex;
            justify-content: flex-end;
            margin: 0 0 18px;
        }

        .visual-toolbar button {
            font: inherit;
            font-size: 13px;
            padding: 4px 12px;
            border: 1px solid var(--rule);
            border-radius: 999px;
            background: #fff;
            color: var(--fg);
            cursor: pointer;
        }

        .visual-toolbar button:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .visual-toolbar button.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        /* Expanded mode: one full-width image per row, uncropped; the image
           links to the image file itself, the title links to the article. */
        #visual.expanded .visual-grid {
            grid-template-columns: 1fr;
            gap: 32px;
        }

        #visual.expanded .visual-card img {
            aspect-ratio: auto;
            object-fit: contain;
            max-width: 100%;
        }

        #visual.expanded .visual-card .visual-title {
            font-size: 18px;
        }

        .visual-card .no-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            aspect-ratio: 4 / 3;
            background: var(--tag-bg, #f2f2f2);
            border: 1px dashed var(--rule);
            border-radius: 8px;
            color: var(--muted);
            font-size: 13px;
        }

        .visual-card .visual-title {
            margin: 8px 2px 0;
            font-size: 15px;
            line-height: 1.35;
            color: rgb(23, 86, 169);
        }

        .visual-card:hover .visual-title {
            color: var(--accent);
        }
    </style>
</head>
<body>
<main>
    <header class="site">
        <a href="assets/images/under_the_hood_3.jpg" target="_blank" rel="noopener noreferrer"><img class="logo" src="assets/images/under_the_hood_3.jpg" alt=""></a>
        <div style="padding: 4px;">
            <h1>Under the Hood</h1>
            <p>Notes on architecture, economics, and technology — by Željko Obrenović.</p>
        </div>
    </header>

    <div style="padding: 4px;">
        <section class="book-edition" id="book-edition" aria-label="Book edition" hidden></section>
        <nav class="view-tabs" id="view-tabs" role="tablist">
            <button type="button" id="tab-list" class="active" role="tab" aria-selected="true">Articles</button>
            <button type="button" id="tab-visual" role="tab" aria-selected="false">Visual Overview</button>
        </nav>
        <div class="status-filter" id="status-filter"></div>
        <div class="tag-filter" id="tag-filter"></div>
        <div class="search">
            <input id="q" type="search" placeholder="Search..." autocomplete="off" style="width: calc(100% - 150px)">
            <span class="hits" id="hits"></span>
        </div>

        <div id="sections"></div>
        <div id="visual" hidden></div>
        <p class="empty-msg" id="empty">No posts match your search.</p>
    </div>
</main>

<script id="data" type="application/json">{"sections": [{"title": "Architecture", "description": "Approaches and metaphors for the practice of architecture.", "posts": [{"id": "", "status": "", "title": "Architects as Superglue: One Approach To Being An Architect in IT Organizations", "excerpt": "This article is a written statement of my experiences on what it means to be an architect in IT organizations, how architects need to develop, and how architects should work together.", "url": "superglue.html", "icon": "assets/icons/superglue.png", "logo": null, "tags": []}, {"id": "", "status": "", "title": "Data + Automation + Curation = Useful Architectural Documentation", "excerpt": "This article summarizes my experiences in replacing classical architectural documentation with data-driven documents.", "url": "documentation.html", "icon": "assets/icons/oil.png", "logo": null, "tags": []}]}, {"title": "Economics & Cost", "description": "Thinking about the economic side of IT systems.", "posts": [{"id": "", "status": "", "title": "The IT Cost Box", "excerpt": "In this post, I introduce a simple model for thinking about IT costs in three dimensions. This model presents IT costs as the volume of the box, where each side of the box shows three drivers of the cost: unit costs, size, and time.", "url": "costbox.html", "icon": "assets/icons/costs.png", "logo": null, "tags": []}, {"id": "", "status": "", "title": "The Economic Value of Architecture: Two Metaphors", "excerpt": "In this post, I sketch two answers to the question of the economic value of architecture: the return on investment metaphor, and the financial options metaphor.", "url": "economics.html", "icon": "assets/icons/economics.png", "logo": null, "tags": []}, {"id": "", "status": "", "title": "What Digital Marketplaces Sell? A Short Memo", "excerpt": "Digital marketplaces facilitate transactions between buyers and sellers. The marketplace is not the seller (nor a buyer), but it sells a reduction in transaction costs. .", "url": "digital-marketplaces.html", "icon": "assets/icons/market.png", "logo": null, "tags": []}]}, {"title": "Cloud & Platforms", "description": "Cloud capabilities and the platforms built on top of them.", "posts": [{"id": "", "status": "", "title": "Uber's Payments Platform", "excerpt": "Recently, Uber has announced deeper push into financial services with Uber Money, a new division, including products such as a digital wallet and upgraded debit and credit cards. It is expected that Uber could soon offer a bank account to consumers on its platform. While many of the news articles focus on the business side of Uber move, limited resources are available to understand better the payment technology that Uber is building. I believe that we can learn from looking under the hood of Uber payment technologies, as the Uber approach may be the way how we will make the banks of the future.", "url": "uber-payments-platform.html", "icon": "assets/icons/uber.png", "logo": null, "tags": []}, {"id": "", "status": "", "title": "Public Cloud: Great Expectations", "excerpt": "This article enlists some of the key benefits we can expect from of cloud: development velocity, performance, scalability, functionality, uptime, costs, transparency, and security. The article also provides a reality check on these expectations. You need to earn the public cloud benefits; simply moving to the cloud rarely leads to immediate improvements.", "url": "cloud-expectations.html", "icon": "assets/icons/cloud.png", "logo": null, "tags": []}]}, {"title": "Media & Streaming", "description": "Distributing video and other media at scale.", "posts": [{"id": "", "status": "", "title": "Adaptive HTTP Streaming Technologies: The Problem Statement", "excerpt": "Adaptive HTTP Streaming technologies enable distributing video efficiently via the standard HTTP infrastructure and CDNs. These technologies offer three key elements that the technologies introduce to solve critical challenges: segmentation of video content in smaller blocks to minimize overhead, improve user experience, and improve caching performance, adaptivity by having multiple channels of variable quality to enable automatic switching among channels based on the device characteristics and network performance, and securing the video content while keeping the benefits of efficient HTTP content distribution.", "url": "adaptive-http-streaming.html", "icon": "assets/icons/streaming.png", "logo": null, "tags": []}]}, {"title": "AI & Tooling", "description": "Working with AI assistants in software development.", "posts": [{"id": "", "status": "", "title": "LLMs, ChatGPT and Evolution of Software Engineering: Patterns, Anti-Patterns, and Quality Imperative", "excerpt": "LLMs like ChatGPT can significantly impact software engineering by synergically combining Natural Language Processing (NLP), LLM-driven Soft Programming, and Traditional Hard Programming. Three synergy patterns: Generative Pattern, Learning and Explanation Pattern, and Hardening Pattern, can help developers harness the potential of these technologies.", "url": "chatgpt-se-evolution.html", "icon": "assets/icons/chatgpt.png", "logo": null, "tags": []}]}], "book_image": null, "book_pdf": null, "book_epub": null}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('sections');
        const visualRoot = document.getElementById('visual');
        const tabList = document.getElementById('tab-list');
        const tabVisual = document.getElementById('tab-visual');
        const empty = document.getElementById('empty');
        const hits = document.getElementById('hits');
        const tagFilter = document.getElementById('tag-filter');
        const statusFilter = document.getElementById('status-filter');
        const qInput = document.getElementById('q');

        function el(tag, attrs, children) {
            const e = document.createElement(tag);
            if (attrs) for (const k in attrs) {
                if (k === 'class') e.className = attrs[k];
                else if (k === 'text') e.textContent = attrs[k];
                else e.setAttribute(k, attrs[k]);
            }
            if (children) children.forEach(c => c && e.appendChild(c));
            return e;
        }

        const bookImage = (data.book_image || '').trim();
        const bookPdf = (data.book_pdf || '').trim();
        const bookEpub = (data.book_epub || '').trim();
        if (bookImage || bookPdf || bookEpub) {
            const book = document.getElementById('book-edition');
            if (bookImage) {
                book.appendChild(el('a', {
                    class: 'book-cover',
                    href: bookPdf || bookEpub || bookImage,
                    'aria-label': bookPdf ? 'Read the book as PDF' :
                        bookEpub ? 'Read the book as EPUB' : 'View the book cover'
                }, [el('img', {src: bookImage, alt: 'Book cover'})]));
            }
            const details = el('div', {class: 'book-details'});
            if (bookPdf || bookEpub) {
                const links = el('div', {class: 'book-links'});
                if (bookPdf) links.appendChild(el('a', {href: bookPdf, text: 'Download PDF'}));
                if (bookEpub) links.appendChild(el('a', {href: bookEpub, text: 'Download EPUB'}));
                details.appendChild(links);
            }
            book.appendChild(details);
            book.hidden = false;
        }

        // Tag and status counts across all posts.
        // status is stored as "name" or "name:color"; we count by name and
        // remember the (first observed) color per name so the filter chip dot
        // matches the inline post-status pill.
        const tagCounts = new Map();
        const statusCounts = new Map();
        const statusColors = new Map();
        let totalPosts = 0;
        data.sections.forEach(section => {
            section.posts.forEach(p => {
                totalPosts++;
                (p.tags || []).forEach(t => tagCounts.set(t, (tagCounts.get(t) || 0) + 1));
                if (p.status) {
                    const parts = String(p.status).split(':');
                    const name = parts[0].trim();
                    const color = (parts[1] || '').trim();
                    if (name) {
                        statusCounts.set(name, (statusCounts.get(name) || 0) + 1);
                        if (color && !statusColors.has(name)) statusColors.set(name, color);
                    }
                }
            });
        });

        // Build status filter buttons (sorted by count desc, then alpha).
        // Only renders if any post defines a status, so the row stays empty
        // and invisible otherwise.
        const sortedStatuses = Array.from(statusCounts.entries())
            .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
        const activeStatuses = new Set();
        sortedStatuses.forEach(([name, count]) => {
            const btn = el('button', {type: 'button', 'data-status': name});
            const dot = el('span', {class: 'status-dot'});
            const color = statusColors.get(name);
            if (color) dot.style.background = color;
            btn.appendChild(dot);
            btn.appendChild(document.createTextNode(name));
            btn.appendChild(el('span', {class: 'count', text: '(' + count + ')'}));
            btn.addEventListener('click', function () {
                if (activeStatuses.has(name)) activeStatuses.delete(name);
                else activeStatuses.add(name);
                btn.classList.toggle('active', activeStatuses.has(name));
                applyFilters();
            });
            statusFilter.appendChild(btn);
        });

        // Build tag filter buttons (sorted by count desc, then alpha).
        // Show only the first TAG_VISIBLE_LIMIT tags initially; the rest are
        // toggled via a "show more / fewer" button. Selected tags stay
        // visible even when collapsed, so an active filter never disappears.
        const TAG_VISIBLE_LIMIT = 12;
        const sortedTags = Array.from(tagCounts.entries())
            .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
        const activeTags = new Set();
        const overflowButtons = [];
        sortedTags.forEach(([tag, count], idx) => {
            const btn = el('button', {type: 'button', 'data-tag': tag});
            btn.appendChild(document.createTextNode(tag));
            btn.appendChild(el('span', {class: 'count', text: '(' + count + ')'}));
            btn.addEventListener('click', function () {
                if (activeTags.has(tag)) activeTags.delete(tag);
                else activeTags.add(tag);
                btn.classList.toggle('active', activeTags.has(tag));
                applyFilters();
            });
            if (idx >= TAG_VISIBLE_LIMIT) {
                btn.classList.add('hidden');
                overflowButtons.push(btn);
            }
            tagFilter.appendChild(btn);
        });

        let tagsExpanded = false;
        if (overflowButtons.length) {
            const toggle = el('button', {type: 'button', class: 'tag-toggle'});
            const hiddenLabel = '+ ' + overflowButtons.length + ' more';
            const shownLabel = 'show fewer';
            toggle.textContent = hiddenLabel;
            toggle.addEventListener('click', function () {
                tagsExpanded = !tagsExpanded;
                overflowButtons.forEach(b => {
                    // keep selected overflow tags visible even when collapsed
                    if (tagsExpanded || b.classList.contains('active')) {
                        b.classList.remove('hidden');
                    } else {
                        b.classList.add('hidden');
                    }
                });
                toggle.textContent = tagsExpanded ? shownLabel : hiddenLabel;
            });
            tagFilter.appendChild(toggle);
        }

        // Render sections
        data.sections.forEach(section => {
            const sec = el('section', {class: 'group'});
            sec.appendChild(el('h2', {text: section.title}));
            if (section.description) sec.appendChild(el('p', {class: 'group-desc', text: section.description}));
            const ul = el('ul', {class: 'posts'});
            section.posts.forEach(p => {
                const li = el('li');
                const tags = p.tags || [];
                const statusName = p.status ? String(p.status).split(':')[0].trim() : '';
                li.dataset.haystack = (p.title + ' ' + (p.excerpt || '') + ' ' + tags.join(' ') + ' ' + statusName).toLowerCase();
                li.dataset.tags = tags.join('|').toLowerCase();
                li.dataset.status = statusName.toLowerCase();
                const iconWrap = el('div', {class: p.icon ? 'icon' : 'icon placeholder'});
                if (p.icon) iconWrap.appendChild(el('img', {src: p.icon, alt: ''}));
                li.appendChild(iconWrap);
                const meta = el('div', {class: 'meta'});
                if (p.id || p.status) {
                    const idLine = el('p', {class: 'post-id'});
                    if (p.status) {
                        // status front-matter is "name" or "name:color".
                        const parts = String(p.status).split(':');
                        const statusName = parts[0].trim();
                        const statusColor = (parts[1] || '').trim();
                        const wrap = el('span', {class: 'post-status'});
                        const dot = el('span', {class: 'status-dot'});
                        if (statusColor) dot.style.background = statusColor;
                        wrap.appendChild(dot);
                        wrap.appendChild(document.createTextNode(statusName));
                        idLine.appendChild(wrap);
                    }
                    if (p.status && p.id) {
                        idLine.appendChild(el('span', {class: 'post-id-sep', text: '•'}));
                    }
                    if (p.id) idLine.appendChild(el('span', {class: 'post-id-text', text: '[' + p.id + ']'}));
                    meta.appendChild(idLine);
                }
                meta.appendChild(el('a', {href: p.url, text: p.title}));
                if (p.excerpt) meta.appendChild(el('p', {class: 'excerpt', text: p.excerpt}));
                if (tags.length) {
                    const tagWrap = el('div', {class: 'tags'});
                    tags.forEach(t => tagWrap.appendChild(el('span', {class: 'tag', text: t})));
                    meta.appendChild(tagWrap);
                }
                li.appendChild(meta);
                ul.appendChild(li);
            });
            sec.appendChild(ul);
            root.appendChild(sec);
        });

        // Render the Visual Overview pane: same sections, but each post is a
        // card showing its hero logo image (instead of the abstract). Cards
        // carry the same data-* attributes so search/tag/status filters apply
        // to both views.
        const visualToolbar = el('div', {class: 'visual-toolbar'});
        const expandBtn = el('button', {type: 'button', text: 'Expand images'});
        visualToolbar.appendChild(expandBtn);
        visualRoot.appendChild(visualToolbar);

        data.sections.forEach(section => {
            const sec = el('section', {class: 'group'});
            sec.appendChild(el('h2', {text: section.title}));
            if (section.description) sec.appendChild(el('p', {class: 'group-desc', text: section.description}));
            const grid = el('div', {class: 'visual-grid'});
            section.posts.forEach(p => {
                const tags = p.tags || [];
                const statusName = p.status ? String(p.status).split(':')[0].trim() : '';
                const card = el('a', {class: 'visual-card', href: p.url});
                card.dataset.haystack = (p.title + ' ' + (p.excerpt || '') + ' ' + tags.join(' ') + ' ' + statusName).toLowerCase();
                card.dataset.tags = tags.join('|').toLowerCase();
                card.dataset.status = statusName.toLowerCase();
                if (p.logo) {
                    card.appendChild(el('img', {src: p.logo, alt: p.title, loading: 'lazy'}));
                } else {
                    card.appendChild(el('div', {class: 'no-logo', text: 'no image'}));
                }
                card.appendChild(el('p', {class: 'visual-title', text: p.title}));
                grid.appendChild(card);
            });
            sec.appendChild(grid);
            visualRoot.appendChild(sec);
        });

        // Expand toggle: full-width uncropped images, one per row. Clicking
        // anywhere on a card opens the article in both modes.
        let visualExpanded = false;
        expandBtn.addEventListener('click', function () {
            visualExpanded = !visualExpanded;
            visualRoot.classList.toggle('expanded', visualExpanded);
            expandBtn.classList.toggle('active', visualExpanded);
            expandBtn.textContent = visualExpanded ? 'Compact grid' : 'Expand images';
        });

        // Tab switching between the article list and the visual overview.
        // #visual in the URL hash deep-links the visual tab.
        function selectView(visual) {
            root.hidden = visual;
            visualRoot.hidden = !visual;
            tabList.classList.toggle('active', !visual);
            tabVisual.classList.toggle('active', visual);
            tabList.setAttribute('aria-selected', String(!visual));
            tabVisual.setAttribute('aria-selected', String(visual));
            const hash = visual ? '#visual' : '';
            if (window.location.hash !== hash) {
                history.replaceState(null, '', window.location.pathname + window.location.search + hash);
            }
        }

        tabList.addEventListener('click', function () { selectView(false); });
        tabVisual.addEventListener('click', function () { selectView(true); });
        if (window.location.hash === '#visual') selectView(true);

        function applyFilters() {
            const q = qInput.value.trim().toLowerCase();
            let visibleCount = 0;

            function matchItem(item) {
                const matchQ = !q || item.dataset.haystack.indexOf(q) !== -1;
                let matchTag = true;
                if (activeTags.size) {
                    const itemTags = item.dataset.tags ? item.dataset.tags.split('|') : [];
                    // any-match: post must carry at least one selected tag
                    matchTag = false;
                    for (const t of activeTags) {
                        if (itemTags.indexOf(t.toLowerCase()) !== -1) {
                            matchTag = true;
                            break;
                        }
                    }
                }
                let matchStatus = true;
                if (activeStatuses.size) {
                    const itemStatus = item.dataset.status || '';
                    // any-match: post status must equal one of the selected statuses
                    matchStatus = false;
                    for (const s of activeStatuses) {
                        if (itemStatus === s.toLowerCase()) {
                            matchStatus = true;
                            break;
                        }
                    }
                }
                return matchQ && matchTag && matchStatus;
            }

            // Both views hold the same posts; count visibility once (list view)
            // but toggle hidden state in both so tab switches stay filtered.
            [root, visualRoot].forEach((pane, paneIdx) => {
                pane.querySelectorAll('section.group').forEach(sec => {
                    let secVisible = false;
                    sec.querySelectorAll('li, .visual-card').forEach(item => {
                        const match = matchItem(item);
                        item.classList.toggle('hidden', !match);
                        if (match) {
                            secVisible = true;
                            if (paneIdx === 0) visibleCount++;
                        }
                    });
                    sec.classList.toggle('empty', !secVisible);
                });
            });
            empty.classList.toggle('show', visibleCount === 0);
            hits.textContent = ' = ' + ((q || activeTags.size || activeStatuses.size)
                ? visibleCount + ' of ' + totalPosts + ''
                : totalPosts + '');
        }

        qInput.addEventListener('input', applyFilters);
        applyFilters();
    })();
</script>
</body>
</html>
