<script id="data" type="application/json">{"meta": {"id": "EM-PERFORMANCE-REVIEW-CYCLE", "status": "draft:gray", "title": "Working the Performance Review Cycle", "date": "2026-07-28", "author": "Željko Obrenović", "permalink": "performance-review-cycle", "timetoread": "6 min", "excerpt": "A performance review is written all year; the engineer who starts thinking about it at the cycle's end has already lost the information war. I coach engineers to work the cycle from its first week: learn how the system actually decides, set goals I can endorse, record wins continuously, write a self-review grounded in artifacts, and read the outcome with rater biases and perspective in mind — because I refuse to let their outcomes depend on my memory.", "tags": "engineering management, performance reviews, goals, self-review, calibration, evidence, coaching", "icon": "assets/icons/performance-review-cycle.png", "logo": "assets/images/performance-review-cycle/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering management", "performance reviews", "goals", "self-review", "calibration", "evidence", "coaching"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: A performance review is written all year — the meeting at the end only reads it out. So I coach engineers to work the cycle from its first week: learn how the system actually works and who actually decides, set goals I can explicitly endorse and confirm what achieving them would mean, record wins and glue work continuously instead of assuming I already know, arrive at review time with a self-review built from artifacts rather than memory, and read the outcome as a snapshot filtered through known rater biases — not as a verdict on a career. The engineer and I are on the same side of this process, and everything in this record exists to keep it that way.\n\n## Statement\n\nHow I expect engineers to work the review cycle, and what I do to make it workable:\n\n- **Learn the system before playing in it.** At the start of a cycle I expect an engineer to know what our team's goals are and how they connect to company goals, what the company actually rewards, who makes the final review decision, who gives input, and when decisions and calibration happen. I answer these questions plainly when asked — none of this is secret.\n- **Set goals I can endorse — and calibrate them up front.** Goals should support the engineer, the team, me, and the company; be shared with me and revised until I can support them; be recorded somewhere visible or official; and come with an explicit answer to the question the source insists on: *would achieving these goals meet or exceed expectations?*\n- **Build evidence habits for the whole cycle.** Wins recorded weekly or biweekly — completed projects, outcomes, metrics, screenshots, praise; a work log of notable work and impact; regular 1:1s that share progress, wins, and challenges. The operating assumption: I do *not* already know everything you are doing.\n- **Track glue work — and bound it.** Helping teammates, unblocking others, and holding things together counts, but only if it is visible; and I watch with the engineer for helping that grows at the expense of core responsibilities.\n- **Ask for feedback well before review time.** After meetings, incidents, presentations, projects — specific and early, so course corrections happen mid-cycle, not as review-day surprises.\n- **Prepare deliberately.** Before the review: ask me how I think you are performing, understand your standing relative to expectations, know the deadlines and calibration dates, and give me important context *before* decisions are finalized. Then write a self-review from artifacts: results over time (not just recent work), original goals and outcomes, competency examples for the level, qualitative contributions like mentoring and judgment, and peer feedback and praise.\n- **Interpret the outcome like an engineer.** The review is a snapshot, not a career; ratings pass through known biases — recency, strictness, leniency, horns, halo, similarity, central tendency, contrast; vague feedback deserves a request for specifics; and no major life plans get built on an uncertain bonus.\n\n## How to Read This\n\nThis journal is my engineering-management operating model. This record is grounded in the \"Performance Reviews\" chapter material from Gergely Orosz's *The Software Engineer's Guidebook* (Pragmatic Engineer, 2023), read from the manager's side: how I coach engineers to work the review cycle, and what I owe them in return. My own side of the same cycle — how I write and deliver reviews — is [Performance Reviews](../grounded-people-management-tools/performance-reviews.html) in the people-management journal; this record is the mirror image. The runnable version lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**The review is decided by information, and information has a deadline.** By the time calibration meets, the inputs are fixed: my written assessment, peer feedback, and whatever evidence exists. An engineer who starts assembling their case the week the self-review is due is negotiating with a decision that has mostly been made. That is why the source's first section is called \"start early\" — knowing who decides, who gives input, and when calibration happens is not politics, it is knowing the deadline for being understood.\n\n![Diagram of a year timeline where evidence accumulates from goals through wins to the self-review, ending at a closed calibration gate that a late runner with one thin sheet cannot pass.](assets/images/performance-review-cycle/review-written-all-year.jpeg)\n**Figure 1:** *The review is written all year: evidence accumulates until the calibration gate closes — the engineer who starts at the end arrives after the decision.*\n\n**Unendorsed goals are a trap I refuse to set.** The quiet failure mode of goal-setting is an engineer working all cycle toward goals their manager never really signed up for — and discovering at review time that hitting them counts as merely meeting expectations. The Guidebook's fix is mechanical and I enforce it: goals are shared, revised until I can genuinely support them, recorded officially, and accompanied by an explicit answer to \"would achieving these meet or exceed expectations?\" That one question, asked in week one, prevents the most common review-day dispute I know.\n\n![Diagram of a four-station goal pipeline — share, revise, record, confirm — contrasted with a crossed-out figure carrying an unendorsed goal toward a cliff.](assets/images/performance-review-cycle/endorsed-goals-gate.jpeg)\n**Figure 2:** *The mechanical fix: goals are shared, revised until endorsed, recorded — and the meets-or-exceeds question is answered in week one, not on review day.*\n\n**I refuse to let outcomes depend on my memory — and neither should the engineer.** I run reviews for multiple people and my unaided recall favors the recent, the loud, and the dramatic. Weekly recorded wins, a work log with links, and 1:1s that actually surface progress are the correction. The same goes double for glue work: mentoring, unblocking, holding a migration together — this work evaporates from reviews unless it is tracked, and the engineer is the only person positioned to track it. The counterweight comes from the same source page: watch for helping others growing at the expense of core responsibilities.\n\n**A self-review built from artifacts beats a self-review built from adjectives.** The document I can defend in calibration cites results delivered over the whole cycle, original goals with outcomes, competency examples for the level, qualitative contributions, and peer feedback — not enthusiasm. I also tell engineers the uncomfortable part the source makes explicit: assess honestly whether your manager will be a strong advocate, and give them the context they need before decisions are finalized. I would rather be handed my advocacy material than have an engineer assume I will improvise it well.\n\n**Ratings are measurements taken with an imperfect instrument.** Recency, strictness, leniency, horns, halo, similarity, central tendency, contrast — the biases the source lists are not exotic; they are the default failure modes of every rater, including me. Coaching engineers to know them is not cynicism. It lets a good engineer metabolize a mediocre rating without catastrophizing, push back with specifics instead of grievance, and keep the review in perspective within the larger arc of a career — long-term growth, relationships, skills, and impact are the game; the rating is one frame of it.\n\n![Diagram of a work record beamed through lenses labeled recency, halo, horns, and contrast, landing as one snapshot frame within a much longer film strip.](assets/images/performance-review-cycle/rating-through-bias-lenses.jpeg)\n**Figure 3:** *A rating is a measurement taken with an imperfect instrument: it passes through known biases, and it is one frame of a career, not the film.*\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| Learn who decides, who gives input, and when calibration happens. | Play politics — understanding the system is transparency, and I answer these questions openly. |\n| Goals are revised until I can endorse them, then recorded officially. | Goals are a private aspiration — unendorsed goals are a review-day trap. |\n| Record wins weekly; assume I do not know what you are doing. | Bombard the manager with noise — evidence is curated, linked, and shared in 1:1s. |\n| Track glue work so it is visible. | Glue work is unlimited — helping that eats core responsibilities gets flagged, together. |\n| Give me advocacy context before decisions are finalized. | Lobby after the outcome — post-calibration appeals are the expensive, low-yield path. |\n| Read outcomes with known rater biases in mind. | Dismiss feedback as bias — reflect first, ask for specifics, then decide what to act on. |\n| The review is a snapshot in a long career. | The review does not matter — it compounds; it is simply not the whole game. |\n\nConcretely: in the first weeks of a cycle, every engineer on my teams has endorsed, recorded goals and knows what achieving them would mean; mid-cycle, their work log and our 1:1s mean nothing about their year is news to me; at review time, their self-review assembles in hours from artifacts; and afterward, our conversation is about specifics and next-cycle growth, not about surprises.\n\n## Anti-Patterns\n\n- **The end-of-cycle sprint.** Discovering the review process in the week the self-review is due, and reconstructing a year from memory and commit history.\n- **Working to unendorsed goals.** A cycle of effort toward goals the manager never confirmed — and the \"meets expectations\" surprise that follows.\n- **Assuming the manager knows.** Skipping the wins, the metrics, and the hard parts in 1:1s because \"it's all visible in the tracker\" — it is not.\n- **Invisible glue work.** A cycle spent unblocking others, with nothing written down — generosity converted into a thin review.\n- **Recent-work self-reviews.** A self-review that covers the last two months because that is what memory retained, handing the recency bias a free win.\n- **Context after calibration.** Delivering the crucial advocacy material the week after decisions were finalized, then contesting the outcome.\n- **Catastrophizing the snapshot.** Treating one rating as a career verdict — or building major financial plans on an uncertain bonus — instead of keeping the review inside the larger arc.\n\n## Related Records\n\n- [Performance Reviews](../grounded-people-management-tools/performance-reviews.html) (people journal) — the manager's side of this same cycle: how I write, calibrate, and deliver reviews; this record is what I coach the engineer sitting across the table to do.\n- [Own Your Career](own-your-career.html) — the year-round ownership habit set; this record points those habits at one specific institutional process.\n- [Promotions](promotions.html) — the longer game the review cycle feeds; promotion cases are assembled from the same evidence, over more cycles.\n- [Management 101](management-101.html) — the manager–report contract; working the review cycle openly together is that contract under load.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs how I coach engineers to work the performance review cycle end to end — context, goals, evidence, self-review, and interpretation. I revisit it when the company changes its review system, cadence, or calibration mechanics; when an engineer who followed this record is still blindsided by an outcome (a failure of my side of the process); or when evidence habits decay into performative logging that no one reads.\n\n## Authoritative References\n\n- Gergely Orosz, *The Software Engineer's Guidebook* (Pragmatic Engineer, 2023) — the performance-review chapter this record distills, via the \"Performance Reviews\" checklist.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "5 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record — the one I hand the engineer. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Start early: gather context and set goals\n\n- [ ] Ask your manager what the team's goals are and how they connect to company goals\n- [ ] Ask what your manager personally cares about and what matters most to them\n- [ ] Talk with tenured teammates about what the company rewards\n- [ ] Listen to leadership priorities from all-hands, emails, presentations, or planning docs\n- [ ] Identify influential people involved in your review process\n- [ ] Understand what performance review system your company uses\n- [ ] Clarify who makes the final review decision, and who gives input on your review\n- [ ] Find out when review decisions, calibration, and outcomes happen\n- [ ] Ask peers for advice on how to ensure a fair review\n- [ ] Set goals that support you, your team, your manager, and the company\n- [ ] Share goals with your manager and ask for feedback\n- [ ] Revise goals until your manager can support and endorse them\n- [ ] Record agreed-upon goals somewhere visible or official\n- [ ] Ask whether achieving your goals would meet or exceed expectations\n\n## 2. Build strong habits throughout the cycle\n\n- [ ] Record wins weekly or biweekly\n- [ ] Capture completed projects, outcomes, metrics, screenshots, praise, and evidence\n- [ ] Keep a work log with notable work and impact\n- [ ] Hold regular 1:1s with your manager\n- [ ] Share progress, wins, challenges, and what is on your plate\n- [ ] Avoid assuming your manager already knows everything you are doing\n- [ ] Balance speed, quality, and meaningful impact\n- [ ] Build a reputation for getting important work done\n- [ ] Help teammates, your manager, and the company where appropriate\n- [ ] Track \"glue work\" and other helping work so it is visible\n- [ ] Watch for spending too much time helping others at the expense of core responsibilities\n- [ ] Ask for specific feedback well before review time\n- [ ] Seek feedback after meetings, incidents, presentations, projects, reviews, or new initiatives\n- [ ] Treat feedback seriously, but decide thoughtfully what to act on\n\n## 3. Prepare before the review\n\n- [ ] Assess whether your manager will be a strong advocate for you\n- [ ] Ask your manager how they think you are performing\n- [ ] Understand your standing relative to expectations and peers\n- [ ] Consider your manager's level of trust, influence, and tenure\n- [ ] Identify review deadlines, calibration dates, and decision timelines\n- [ ] Give your manager important context before decisions are finalized\n- [ ] Gather peer feedback from people who know your work well\n- [ ] Write down positive feedback and growth feedback you receive\n- [ ] Create a self-review document\n- [ ] Include results delivered over time, not just recent work\n- [ ] Include qualitative examples such as helping others, mentoring, and judgment\n- [ ] Include original goals and outcomes\n- [ ] Include examples of competencies for your role or level\n- [ ] Include feedback from peers, praise, and positive feedback\n- [ ] Decide whether to rate yourself in the self-review\n- [ ] Consider writing an honest self-assessment even if you do not assign a rating\n\n## 4. During and after the review\n\n- [ ] Remember the review is a snapshot, not your whole career\n- [ ] Set realistic expectations about ratings and outcomes\n- [ ] Avoid making major plans based on an uncertain bonus or rating\n- [ ] Be aware of common biases: recency, strictness, leniency, horns, halo, similarity, central tendency, and contrast\n- [ ] Consider whether your manager is skilled at giving feedback\n- [ ] Ask for specifics if feedback is vague\n- [ ] Reflect on negative feedback before deciding whether to act on it\n- [ ] Remember that you and your manager are ideally on the same side\n- [ ] Focus on long-term growth, relationships, skills, and impact\n- [ ] Keep the review in perspective within the larger arc of your career\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why a performance review is written all year — and how to work the cycle from its first week — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. ARLO: an eager early-career engineer climbing the ladder — in some strips a new lead or manager, in others the engineer being coached — buzz-cut hair, zip-up hoodie with rolled sleeves, sticker-covered laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Arlo digs through printouts at midnight facing a blank self-review form due tomorrow.](assets/images/performance-review-cycle/comic-01-the-deadline-week.jpeg)\n**Panel 1:** *The hook: the end-of-cycle sprint — reconstructing a year from memory the week the self-review is due.*\n\n![Comic panel: Arlo with one thin sheet arrives at a closed calibration-room door where the decision is finishing without him.](assets/images/performance-review-cycle/comic-02-the-decision-was-made.jpeg)\n**Panel 2:** *The problem: by the time calibration meets, the inputs are fixed — arriving late means negotiating with a decision already made.*\n\n![Comic panel: Arlo holds up a shelf of systems unseen while Vera's dashboard shows him as one dim thumbnail among many.](assets/images/performance-review-cycle/comic-03-assuming-the-manager-knows.jpeg)\n**Panel 3:** *The wrong way: assuming the manager knows — unaided memory favors the recent and the loud, and untracked glue work evaporates.*\n\n![Comic panel: Vera unrolls a year calendar and taps week one as evidence pages accumulate along its length.](assets/images/performance-review-cycle/comic-04-written-all-year.jpeg)\n**Panel 4:** *The principle: the review is written all year — the meeting at the end only reads it out. Start at week one.*\n\n![Comic panel: Vera stamps Arlo's goal card with an endorsement seal while he asks what achieving it will mean.](assets/images/performance-review-cycle/comic-05-goals-i-can-endorse.jpeg)\n**Panel 5:** *How it runs: goals are revised until the manager can endorse them, recorded — and 'would achieving these meet or exceed expectations?' is asked in week one.*\n\n![Comic panel: Arlo files a dated win card into a half-full wins jar next to a smaller jar tracking glue work.](assets/images/performance-review-cycle/comic-06-weekly-wins.jpeg)\n**Panel 6:** *The mechanic: wins recorded weekly with evidence, glue work tracked and bounded — the operating assumption is that the manager does not already know.*\n\n![Comic panel: Arlo hands Vera an evidence folder at the still-open calibration door as she nods.](assets/images/performance-review-cycle/comic-07-context-before-the-gate.jpeg)\n**Panel 7:** *The payoff: a self-review assembled from artifacts, handed over before the gate closes — advocacy material delivered, not improvised.*\n\n![Comic panel: Vera points at one scored frame in a long career film strip as she and Arlo view it together.](assets/images/performance-review-cycle/comic-08-one-frame-not-the-film.jpeg)\n**Panel 8:** *The closer: read the outcome like an engineer — a snapshot through imperfect lenses, one frame in a long career, examined together from the same side.*\n"}]}]}</script>

            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
