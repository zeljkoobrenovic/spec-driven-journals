<script id="data" type="application/json">{"meta": {"id": "EM-PROMOTIONS", "status": "draft:gray", "title": "Promotions", "date": "2026-07-28", "author": "Željko Obrenović", "permalink": "promotions", "timetoread": "6 min", "excerpt": "I treat promotion as an evidence-and-support problem, not a reward for waiting. I expect engineers to already be doing next-level work, to build the case themselves — produce, organize, publish — and to secure support beyond me. In return I am honest about gaps, co-own a plan with milestones, and never pretend headcount, budget, and approval rates don't exist.", "tags": "engineering management, promotions, career growth, evidence, sponsorship, engineering ladder", "icon": "assets/icons/promotions.png", "logo": "assets/images/promotions/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering management", "promotions", "career growth", "evidence", "sponsorship", "engineering ladder"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: A promotion is decided on evidence assembled long before the cycle opens — and the engineer, not the manager, owns assembling it. I expect engineers who want the next level to understand how the promotion system at their company actually works, to demonstrate next-level work before the title arrives, and to produce, organize, and publish their impact rather than relying on me to make it visible. My side of the contract: I tell them honestly where they stand, co-own a plan with milestones, recruit broader support — and I am straight about the parts neither of us controls: business need, headcount, budget, and the lower approval rates that come with senior levels.\n\n## Statement\n\nWhat I expect from engineers pursuing promotion, and what I commit to in return:\n\n- **Know the system before you play it.** I expect engineers to understand how promotions are actually decided at our company — informal, lightweight, heavyweight, or committee-based — who influences and approves the decision, and what the expectations are at their current and next levels, including whether a terminal level exists.\n- **Next-level work comes before the next-level title.** I promote people who are consistently exceeding expectations at their current level and already demonstrating the work expected at the next one, with impact visible beyond their immediate tasks.\n- **The case is built from evidence, continuously.** I expect a clear record of major projects, outcomes, and impact — tracked weekly, monthly, or quarterly — backed by artifacts: design docs, postmortems, launch notes, metrics, feedback. The work must connect to something the business cares about: revenue, cost, reliability, productivity, customer impact.\n- **Produce, organize, publish.** Producing high-quality work is a third of the job. I also expect engineers to organize — improve processes, coordinate groups, help teams execute — and to publish: share progress, outcomes, and learnings through 1:1s, docs, demos, and internal posts. Nobody should rely only on their manager to make their impact visible.\n- **Support is secured early, and it is broader than me.** I expect engineers to ask where they stand and what gaps remain well before the cycle, and to build support from peers, senior engineers, and skip-level leaders who understand their impact — earned partly by helping others succeed.\n- **I co-own the plan and the honesty.** When an engineer names a promotion goal, they get a straight answer on whether the path is realistic, an actionable plan with milestones, and a manager who can clearly explain their impact to others. No promotion case on my team should surprise either of us.\n- **Realism is part of the deal.** Promotion is not guaranteed. Business need, headcount, and budget gate it; senior-level promotions have lower approval rates. I expect every candidate to have a plan for the cycle where the answer is no.\n\n## How to Read This\n\nThis journal is my engineering-management operating model. This record is grounded in the Promotions chapter of Gergely Orosz's *The Software Engineer's Guidebook* (Pragmatic Engineer, 2023), read from the manager's side of the table: the book tells engineers how to earn a promotion; this record states what I expect engineers to bring to a promotion case and how I coach them through it. The runnable version — the checklist I hand an engineer who wants the next level — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**The promotion decision is made before the cycle opens.** By the time a packet reaches a committee or a calibration meeting, the evidence either exists or it doesn't. An engineer who starts assembling their case when the cycle is announced is writing fiction under deadline; an engineer who has tracked achievements and kept artifacts all along is writing a summary. That is why I push evidence-keeping as a continuous habit, not a cycle-time scramble — and why preparation \"well before the promotion cycle begins\" is a checklist item, not a nice-to-have.\n\n![Two timelines ending at a promotion cycle: one accumulates evidence steadily all year, the other crams a chaotic scramble into the final stretch.](assets/images/promotions/evidence-before-the-cycle.jpeg)\n**Figure 1:** *By the time the cycle opens, the evidence either exists or it doesn't — continuous tracking writes a summary; the scramble writes fiction.*\n\n\n\n**Demonstrated next-level work is the only argument that survives scrutiny.** Every credible promotion system asks the same question: is this person already operating at the next level? Potential, loyalty, and tenure do not survive a committee's skepticism; a record of next-level work does. So I coach engineers to close the gap in the work first — visible impact beyond their own tasks, a clear line from their work to business or organizational value — and treat the title as the system catching up with reality.\n\n**Visibility is the engineer's job, and \"publish\" is the neglected verb.** The source splits impact into produce, organize, and publish, and in my experience the third is where strong engineers stall. Managers change, forget, and summarize badly; a manager is a lossy channel for someone else's impact. An engineer who shares outcomes and learnings through docs, demos, and internal posts gives every decision-maker direct evidence — and gives me, at packet-writing time, material instead of memories.\n\n![Three pillars labeled produce, organize, and publish holding up a beam labeled impact; the publish pillar is half-built and the beam tilts.](assets/images/promotions/produce-organize-publish.jpeg)\n**Figure 2:** *Impact stands on three pillars — produce, organize, publish — and publish is the pillar most strong engineers leave half-built.*\n\n\n\n**A promotion case needs more supporters than one manager.** Whoever approves the promotion — a skip-level, a director, a committee — will weigh voices other than mine. Peer endorsements, senior engineers who have seen the work, skip-levels who recognize the name: that support is built over quarters, largely by helping others succeed and contributing to work that benefits the whole team. I tell engineers plainly: if I am the only person who can explain your impact, your case is fragile.\n\n![Split diagram: an engineer connected to only one manager by a fraying line, versus an engineer at the center of a sturdy support network of peers, seniors, and skip-levels.](assets/images/promotions/support-beyond-the-manager.jpeg)\n**Figure 3:** *If one manager is the only person who can explain the impact, the case is fragile — support is a network built over quarters, not a single channel.*\n\n\n\n**Honesty about the odds protects the career, not just the cycle.** Headcount, budget, and business need gate promotions regardless of merit, and approval rates fall at senior levels. Pretending otherwise sets people up to read a \"no\" as betrayal. So I keep two things true at once: an actionable plan with milestones, and an explicit understanding that promotion is not the only measure of success. The engineers who last are the ones investing in breadth, depth, and judgment that pay off regardless of when the title lands — without letting level define their self-worth or burning relationships to advance faster.\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| The engineer owns building the evidence and the visibility. | The engineer is on their own — I co-own the plan, the honesty, and the advocacy. |\n| Next-level work must be demonstrated before the promotion. | The bar is perfection — it is consistent next-level performance, visible beyond one's own tasks. |\n| Publish your work; don't rely only on your manager. | Self-promotion theater — publishing means sharing real outcomes and learnings, not noise. |\n| Build support from peers, seniors, and skip-levels. | Politics over substance — support is earned by helping others succeed and doing team-level work. |\n| Headcount, budget, and approval rates are real constraints. | A \"no\" means the work was wasted — the skills and evidence carry into the next cycle or the next role. |\n| Have a plan for not being promoted this cycle. | Accept a stalled path indefinitely — a system that never promotes ready people is a signal too. |\n\nConcretely: every engineer on my team who wants the next level has had the straight conversation about where they stand, has a written plan with milestones, keeps a running record of achievements and artifacts, and can name people beyond me who would speak for their work. When a cycle ends in a no, we both already know why, and the plan for the next cycle exists before the disappointment fades.\n\n## Anti-Patterns\n\n- **Waiting to be noticed.** Doing excellent work in silence and treating visibility as the manager's job — the packet then rests on one lossy channel.\n- **The cycle-time scramble.** Starting to gather evidence when the promotion cycle is announced, and reconstructing a year of impact from memory and closed tickets.\n- **Promotion as the only scoreboard.** Making the title the sole measure of success, so every cycle without one reads as failure and self-worth tracks level.\n- **Burning relationships to advance.** Grabbing scope, hoarding credit, or elbowing peers — buying one level at the price of the support the next one requires.\n- **The falsely encouraging manager.** Telling an engineer they are \"close\" every cycle without naming gaps, headcount limits, or the real approval odds at senior levels.\n- **Confusing tenure with readiness.** Arguing years-at-level instead of next-level evidence — no credible system promotes on waiting.\n- **Ignoring the system's shape.** Building a case for the process you wish existed — informal where it's committee-based, evidence-light where it's heavyweight — instead of the one that will actually judge it.\n\n## Related Records\n\n- [Own Your Career](own-your-career.html) — the general career-ownership contract; this record is the specific case of converting ownership into a promotion case.\n- [Working the Performance Review Cycle](performance-review-cycle.html) — the recurring review cycle whose ratings and feedback are the raw material a promotion case is built from.\n- [Changing Jobs](changing-jobs.html) — when the honest answer is that the path here is blocked, the move is the alternative; promotion odds versus external offers is a real comparison.\n- [Engineering Career Paths](engineering-career-paths.html) — the ladder and terminal-level context a promotion campaign runs inside.\n- [Career Conversations](../grounded-people-management-tools/career-conversations.html) (people journal) — the conversation where a promotion goal first surfaces with the motivational context behind it.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs how promotion cases are built and coached on my teams: the evidence expectations, the produce-organize-publish discipline, the support structure, and the honesty about constraints. I revisit it if the company's promotion process changes shape (informal to committee-based, or the reverse), if an engineer on my team is surprised by a promotion outcome — which means the honesty loop failed — or if I notice ready engineers stalling for multiple cycles on headcount alone, which is a signal about the organization rather than the candidates.\n\n## Authoritative References\n\n- Gergely Orosz, *The Software Engineer's Guidebook* (Pragmatic Engineer, 2023) — the Promotions chapter this record distills, via its companion checklist.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "4 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record — the one I hand an engineer pursuing the next level. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Understand the promotion system\n\n- [ ] I know how promotions are decided at my company.\n- [ ] I know whether the process is informal, lightweight, heavyweight, or committee-based.\n- [ ] I know who influences or approves promotion decisions.\n- [ ] I understand the expectations for my current and next levels.\n- [ ] I know whether my company has a \"terminal level\" or expected career level.\n\n## 2. Confirm next-level performance\n\n- [ ] I am consistently exceeding expectations at my current level.\n- [ ] I am already demonstrating work expected at the next level.\n- [ ] My impact is visible beyond my immediate tasks.\n- [ ] I can explain the business or organizational value of my work.\n- [ ] I have examples showing both **what** I delivered and **how** I delivered it.\n\n## 3. Build a strong promotion case\n\n- [ ] I have a clear record of major projects, outcomes, and impact.\n- [ ] I track weekly, monthly, or quarterly achievements.\n- [ ] I have artifacts: design docs, code reviews, postmortems, launch notes, metrics, feedback, or presentations.\n- [ ] I can connect my work to revenue, cost savings, reliability, productivity, customer impact, or strategic goals.\n- [ ] I have evidence that my work has affected a team-, organizational-, or company-level priority.\n\n## 4. Produce, organize, publish\n\n- [ ] I consistently **produce** high-quality work.\n- [ ] I **organize** work by improving processes, coordinating groups, or helping teams execute better.\n- [ ] I **publish** work by sharing progress, outcomes, learnings, and impact.\n- [ ] I make my work visible through 1:1s, docs, demos, meetings, or internal posts.\n- [ ] I am not relying only on my manager to make my impact visible.\n\n## 5. Get feedback early\n\n- [ ] I have asked my manager where I stand relative to the next level.\n- [ ] I have asked what gaps remain before promotion.\n- [ ] I have asked peers and senior colleagues for feedback.\n- [ ] I have spoken with people who have successfully gone through the process.\n- [ ] I have identified common promotion blockers at my company.\n\n## 6. Secure manager support\n\n- [ ] My manager understands my promotion goal.\n- [ ] My manager agrees that I am on a realistic path.\n- [ ] My manager can clearly explain my impact to others.\n- [ ] I have an actionable promotion plan with milestones.\n- [ ] I keep my manager updated on progress and risks.\n\n## 7. Build broader support\n\n- [ ] I have support from peers who understand my impact.\n- [ ] I have support from senior engineers, staff engineers, directors, or skip-level leaders where relevant.\n- [ ] I help others succeed so they are more likely to support me.\n- [ ] I mentor or support people at lower levels.\n- [ ] I contribute to work that benefits the broader team, not just myself.\n\n## 8. Prepare for the promotion packet\n\n- [ ] I have a self-review or promotion document ready.\n- [ ] My manager has enough evidence to write a strong review.\n- [ ] I have peer feedback or endorsements if required.\n- [ ] I have organized artifacts that support the case.\n- [ ] I have prepared well before the promotion cycle begins.\n\n## 9. Stay realistic\n\n- [ ] I understand promotion is not guaranteed.\n- [ ] I know whether there is business need, headcount, or budget for the next level.\n- [ ] I understand that senior-level promotions often have lower approval rates.\n- [ ] I am not making promotion my only measure of success.\n- [ ] I have a plan for what to do if I am not promoted this cycle.\n\n## 10. Long-term career health\n\n- [ ] I am not letting title or level define my self-worth.\n- [ ] I am not damaging relationships to advance faster.\n- [ ] I am investing in skills and experiences that may pay off later.\n- [ ] I am choosing work that broadens my breadth, deepens my depth, and sharpens my judgment.\n- [ ] I am building a career that remains meaningful even if promotion takes longer than expected.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why a promotion is won long before the cycle opens — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. ARLO: an eager early-career engineer climbing the ladder — in some strips a new lead or manager, in others the engineer being coached — buzz-cut hair, zip-up hoodie with rolled sleeves, sticker-covered laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Arlo watches a crossed-off wall calendar expectantly while Vera observes from the doorway.](assets/images/promotions/comic-01-waiting-for-the-title.jpeg)\n**Panel 1:** *The hook: promotion treated as a reward for waiting.*\n\n![Comic panel: Arlo digs through a chaotic pile of tickets and notes at night beneath a promotion cycle notice.](assets/images/promotions/comic-02-cycle-time-scramble.jpeg)\n**Panel 2:** *The problem: the cycle opens and the evidence has to be reconstructed from memory.*\n\n![Comic panel: Arlo works unseen behind a cubicle wall while Vera struggles to describe his work to a committee.](assets/images/promotions/comic-03-waiting-to-be-noticed.jpeg)\n**Panel 3:** *The wrong way: doing excellent work in silence and leaving visibility to one lossy channel.*\n\n![Comic panel: Vera taps a whiteboard timeline where the checkmark sits well before the flag labeled cycle.](assets/images/promotions/comic-04-decided-before-it-opens.jpeg)\n**Panel 4:** *The principle: the promotion is decided on evidence assembled long before the cycle opens — and the engineer owns assembling it.*\n\n![Comic panel: Arlo files a note into a tabbed evidence binder under wall labels reading produce, organize, publish.](assets/images/promotions/comic-05-produce-organize-publish.jpeg)\n**Panel 5:** *How it runs: track achievements continuously — produce the work, organize the team, publish the outcomes.*\n\n![Comic panel: Arlo demos to nodding peers, a senior engineer, and a skip-level leader while Vera watches from the side.](assets/images/promotions/comic-06-support-beyond-one-voice.jpeg)\n**Panel 6:** *The mechanic: a case needs supporters beyond one manager — peers, seniors, and skip-levels who have seen the work.*\n\n![Comic panel: Vera calmly explains a sheet with three closed gates labeled headcount, budget, and need to Arlo across a table.](assets/images/promotions/comic-07-the-honest-no.jpeg)\n**Panel 7:** *The cost: headcount, budget, and business need are real gates — every candidate needs a plan for the cycle where the answer is no.*\n\n![Comic panel: Vera shakes Arlo's hand as he holds a promotion letter, colleagues applauding behind them.](assets/images/promotions/comic-08-title-catches-up.jpeg)\n**Panel 8:** *The closer: no promotion case should surprise either side — the title is the system catching up with reality.*\n"}]}]}</script>

                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
