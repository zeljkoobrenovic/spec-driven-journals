<script id="data" type="application/json">{"meta": {"id": "EM-COMPETENT-SOFTWARE-ENGINEER", "status": "draft:gray", "title": "The Competent Software Engineer", "date": "2026-07-28", "author": "Željko Obrenović", "permalink": "competent-software-engineer", "timetoread": "6 min", "excerpt": "The baseline I hold every engineer to: know your single most important task each week and deliver it, notice within 30–60 minutes that you are blocked and do something about it, break work into shippable pieces, and estimate honestly. Underneath that sits craft — readable defensive code, real debugging, everyday refactoring, testing as part of development, mastered tools — and I coach it through mentors and a short weekly self-review.", "tags": "engineering management, career ladder, software engineers, coaching, productivity, coding craft", "icon": "assets/icons/competent-software-engineer.png", "logo": "assets/images/competent-software-engineer/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering management", "career ladder", "software engineers", "coaching", "productivity", "coding craft"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: Competence in a software engineer is not cleverness — it is reliably getting the right things done. The baseline I hold every engineer to has two layers: delivery habits (know your top priority each week and ship it, notice you are blocked within 30–60 minutes and act, break work into shippable pieces, estimate honestly and update loudly) and the craft underneath (readable defensive code, real debugging, everyday refactoring, testing as part of development, mastered tools). Both layers are learnable, so I coach them explicitly — through mentors, through goodwill on the team, and through a short weekly self-review — rather than waiting for engineers to absorb them by osmosis.\n\n## Statement\n\nThe expectations I hold every engineer to, and coach them along:\n\n- **Getting things done is the baseline, not a bonus.** I expect every engineer to know their single most important task each week, confirm it with their manager when unsure, deliver it in the agreed timeframe, and say \"no\" or renegotiate — with tradeoffs stated — when lower-priority work threatens it.\n- **Blocked is a state you notice and exit.** The rule of thumb I coach: no meaningful progress after 30–60 minutes means you are blocked. Try different approaches first — rubber-duck it, draw it, read the docs, search, ask a channel, use AI tools carefully and verify, take a break, undo recent changes — then ask a teammate, explaining what you already tried. When another person is the blocker, escalate politely and preserve the relationship.\n- **Work arrives broken down and honestly estimated.** Large projects split into epics, stories, and tasks until each is clear and actionable; the golden path identified and edge cases separated; estimates anchored on similar past work, prototyped where unfamiliar, worst-cased where uncertain, and updated when new information appears.\n- **Craft is practiced, not assumed.** Coding regularly on real problems, reading other people's code before changing it, writing readable code that follows team conventions, and writing defensive code: validate inputs, treat external input as potentially malicious, expect error states, prefer safe defaults.\n- **Debugging, refactoring, and testing are part of development.** A debugger used properly, root cause confirmed before fixing, refactoring as an everyday habit with small steps and tests after each, and testing — including edge cases and regression tests for bugs — done before review, not thrown to a later phase.\n- **Tools are mastered.** The IDE learned deeply, Git and the command line used confidently, basic SQL and regular expressions in hand, AI assistants used carefully, and pull requests kept small, focused, and clearly summarized.\n- **Growth is deliberate.** Every engineer at this stage seeks mentors — dedicated, ad hoc, and online — maintains goodwill by coming prepared and helping others back, takes initiative only after expected work is done, and runs a short weekly self-review.\n\n![Layer diagram of delivery habits resting on a craft foundation, wrapped in a growth loop of mentors, goodwill, and weekly self-review.](assets/images/competent-software-engineer/two-layers-of-competence.jpeg)\n**Figure 1:** *Two learnable layers — delivery habits on top of craft — held together by a deliberate growth loop of mentors, goodwill, and the weekly self-review.*\n\n## How to Read This\n\nThis journal is my engineering-management operating model; this record is the engineer career ladder seen from the manager's side. It is grounded in the Competent Software Developer chapters of Gergely Orosz's *The Software Engineer's Guidebook* (2023) — getting things done, coding, software development skills, and the tools of the productive developer. The article states the expectations I hold engineers to at this first career stage and how I coach them; the checklist I hand the engineer — written in their voice, ending with the weekly self-review — lives in the **Checklist** tab.\n\n## Rationale\n\n**Getting things done is what separates a competent engineer from a promising one.** The most common failure mode I see in early-career engineers is not weak code — it is busy weeks that ship nothing, because the single most important task was never identified or was quietly displaced by easier work. That is why the first expectation is prioritization, not syntax: name the top priority, confirm it when unsure, deliver it, and treat every extra request as a tradeoff to state out loud. An engineer who does only this reliably is already more valuable than a brilliant one who does not.\n\n**Self-unblocking is a learnable skill, and the 30–60 minute rule makes it coachable.** Left alone, engineers err in both directions — grinding silently for days, or asking for help before trying anything. The source's rule of thumb gives me a concrete standard to coach against: if there is no meaningful progress after 30–60 minutes, you are blocked, and being blocked triggers a repertoire — rubber-ducking, drawing it on paper, docs, search, a Q&A channel, AI tools with verification, a break, an undo — before it triggers a teammate. Asking with \"here is what I tried\" attached is what keeps help-seeking cheap for the team; it is also how goodwill is built, and goodwill is a real currency I watch.\n\n![Timeline of the 30-60 minute blocked rule: stalled work triggers a self-service repertoire before asking a teammate with attempts attached.](assets/images/competent-software-engineer/blocked-rule-timeline.jpeg)\n**Figure 2:** *Blocked is a state you notice and exit: the timer triggers the self-service repertoire first, and the ask arrives with \"here is what I tried\" attached.*\n\n**Readable, defensive code is a team obligation, not a style preference.** Code at this level is read and modified by others far more often than it is written, so I hold engineers to the team's conventions, small functions, names that explain themselves, comments that say why, and no unnecessary complexity or over-abstracted DRY. Defensiveness is the same obligation pointed at runtime: validate inputs, treat external input as potentially malicious, expect invalid responses and unknown states, prefer safe defaults. None of this is advanced — which is exactly why I treat it as a floor rather than a distinction.\n\n**Debugging, refactoring, and testing are the craft; tooling fluency is the multiplier.** I expect engineers to confirm a root cause before fixing, to refactor in small tested steps as a daily habit rather than a big-bang event without a safety net, and to treat testing — edge cases thought through, regression tests added for bugs — as part of development, not a separate afterthought. Around that craft sits tooling: an IDE learned deeply, Git and the shell used confidently, fast feedback loops preferred over slow edit-compile-run cycles. Tooling fluency is invisible in any single task and decisive over a year, which is why I ask about it in coaching conversations even when nothing is on fire.\n\n**The weekly self-review turns all of this into a habit loop.** The source closes with nine questions — did I deliver my most important work, ask for help early enough, break work into shippable pieces, communicate estimates and risks, write readable tested code, learn something, get feedback, help someone, improve my workflow — and I ask engineers at this stage to run them weekly. It takes five minutes, it surfaces drift before I have to, and it hands the engineer ownership of their own baseline, which is the point: my coaching is scaffolding, and the self-review is what remains when the scaffolding comes down.\n\n![Circular habit-loop diagram of the weekly self-review surfacing drift and feeding coaching, with a fading scaffold beside it.](assets/images/competent-software-engineer/weekly-self-review-loop.jpeg)\n**Figure 3:** *Five minutes a week: the self-review surfaces drift before the manager has to — and it is what remains when the coaching scaffold comes down.*\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| Every engineer knows and delivers their top priority each week. | Engineers only work on one thing — extra work is fine when the tradeoff is stated and the top priority is safe. |\n| No meaningful progress after 30–60 minutes means you are blocked, and blocked means act. | Ask for help the moment something is hard — the repertoire of self-service attempts comes first. |\n| Estimates are anchored, worst-cased under uncertainty, and updated loudly. | Estimates are commitments — they are honest forecasts that change when the facts do. |\n| Refactoring is an everyday habit in small, tested steps. | Large risky rewrites are welcome — not without a safety net. |\n| Testing happens before review, including edge cases and regression tests. | Every change needs every kind of automated test — manual verification and judgment still apply. |\n| Initiative is welcome — documenting, investigating, helping out. | Side efforts before the expected work is done — initiative comes after delivery, not instead of it. |\n| Growth runs on mentors, goodwill, and a weekly self-review. | Growth is the manager's job alone — I coach it, but the engineer owns it. |\n\nConcretely: when I coach an engineer at this stage, our 1:1 starts from their top priority and their self-review answers, not from a status list. When one is stuck, my first question is \"what have you tried?\" — and if the answer is \"nothing yet, it's been two days,\" the coaching topic is the 30–60 minute rule, not the bug.\n\n## Anti-Patterns\n\n- **The silent grinder.** Days without meaningful progress and no signal to anyone — the most expensive way to protect one's pride.\n- **Busy on everything, delivering nothing.** A full calendar and an untouched top priority; extra requests accepted without ever naming the tradeoff.\n- **The unbreakable task.** Week-sized tasks with no golden path and edge cases tangled in — unshippable, unreviewable, unestimatable.\n- **The heroic estimate.** Best-case numbers given under pressure, never worst-cased, never updated when reality diverges — until the delay announces itself.\n- **Clever, hostile code.** Unnecessary abstraction, names only the author understands, inputs trusted blindly — code optimized for writing, not reading or running.\n- **Help without homework.** Asking teammates before trying anything, arriving unprepared, never helping back — burning the goodwill the whole team runs on.\n- **Initiative as escape.** Starting side investigations and tool research while expected work slips — distraction dressed as proactivity.\n\n## Related Records\n\n- [The Well-Rounded Senior Engineer](well-rounded-senior-engineer.html) — the next stage: the developer-to-engineer shift this baseline prepares for.\n- [Own Your Career](own-your-career.html) — the career-ownership habits that sit alongside this competence baseline.\n- [Mentoring](mentoring.html) — the manager's side of the mentor-seeking this record expects from engineers.\n- [Management 101](management-101.html) — the two-sided contract this record plugs into: what I owe every report, and what I ask them to own.\n- [Getting Things Done](getting-things-done.html) — the manager's version of the same discipline: prioritization and delivery at the team level.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs the expectations I hold engineers to at the first career stage — delivery habits, coding craft, tooling, and self-directed growth — and how I coach against them. I revisit it if AI-assisted development shifts what \"competent\" means at this level (the source already flags careful, verified AI use; the balance may move), if the weekly self-review stops surfacing anything in coaching conversations, or if I find myself repeatedly excusing missed top priorities as circumstance rather than coaching them as habit.\n\n## Authoritative References\n\n- Gergely Orosz, *The Software Engineer's Guidebook* (self-published, 2023) — the Competent Software Developer chapters (getting things done, coding, software development skills, tools of the productive developer) this record distills.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "6 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record — the one I hand the engineer, written in their voice. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Prioritize work\n\n- [ ] I identify the single most important task or project each week\n- [ ] I confirm my priority with my manager or team when unsure\n- [ ] I deliver the top priority within the agreed timeframe\n- [ ] I say \"no\" or renegotiate when lower-priority work threatens the top priority\n- [ ] I communicate tradeoffs clearly when asked to take on extra work\n\n## 2. Unblock yourself\n\n- [ ] I notice when I am blocked, rather than continuing without making progress\n- [ ] I use a rule of thumb: no meaningful progress after 30–60 minutes means I am blocked\n- [ ] I try different approaches before asking for help: rubber-duck the problem, draw it on paper, read documentation, search online or internal resources, ask a Q&A forum or channel, use AI tools carefully and verify the answer, take a short break, or start from scratch / undo recent changes\n- [ ] I ask teammates for help when needed, explaining what I already tried\n- [ ] I escalate politely when blocked by another person, and preserve the relationship\n\n## 3. Break down work\n\n- [ ] I split large projects into epics, stories, tasks, and subtasks\n- [ ] I break tasks down until each one is clear and actionable\n- [ ] I identify the \"golden path\" or smallest useful implementation\n- [ ] I separate edge cases into their own tasks\n- [ ] I prioritize work that gets me closer to something shippable\n- [ ] I add, remove, or revise tasks as I learn more\n- [ ] I avoid spending more time managing tasks than doing the work\n\n## 4. Estimate work\n\n- [ ] I estimate using similar past work when possible\n- [ ] I ask teammates for examples when doing something new\n- [ ] I identify what is known, unknown, and risky\n- [ ] I prototype before estimating unfamiliar systems or technologies\n- [ ] I break work apart so each task contains fewer unknowns\n- [ ] I provide worst-case estimates when uncertainty is high\n- [ ] I update estimates when new information appears\n\n## 5. Seek mentors\n\n- [ ] I identify people I can learn from\n- [ ] I look for more than one mentor: a dedicated mentor, ad hoc mentors, and internet mentors\n- [ ] I ask specific questions rather than vague ones\n- [ ] I learn from experienced engineers' habits, decisions, and feedback\n- [ ] I verify advice from online sources or AI tools before using it\n\n## 6. Maintain goodwill\n\n- [ ] I try reasonable self-service steps before asking others for help\n- [ ] I respect other people's time and come prepared when asking for help\n- [ ] I summarize the problem, what I tried, and my next step\n- [ ] I help others when they are stuck, and share useful knowledge with the team\n- [ ] I thank people who help me\n- [ ] I avoid working alone for long stretches when pairing or feedback would help\n\n## 7. Take initiative\n\n- [ ] I finish expected work before taking on extra initiatives\n- [ ] I document unclear systems, decisions, or processes\n- [ ] I volunteer for investigations when appropriate\n- [ ] I research useful tools, frameworks, or internal systems\n- [ ] I talk with my manager about upcoming work\n- [ ] I offer help on smaller tasks when I have capacity\n- [ ] I avoid creating distractions by starting too many side efforts\n\n## 8. Practice coding\n\n- [ ] I code regularly, on meaningful real-world problems\n- [ ] I ask for code reviews and learn from repeated review comments\n- [ ] I pair with more experienced developers when possible\n- [ ] I build side projects, complete tutorials or structured training, and practice coding challenges when useful\n- [ ] I read and write code consistently\n\n## 9. Read code\n\n- [ ] I review teammates' code even when I am not the main reviewer\n- [ ] I read code outside my immediate team or company when helpful, including open-source projects using similar languages or patterns\n- [ ] I understand what code does before changing it\n- [ ] I take notes on unfamiliar patterns, conventions, and architecture\n- [ ] I ask the original author questions when something is unclear\n\n## 10. Write readable code\n\n- [ ] I use clear, self-explanatory names and follow team naming and formatting conventions\n- [ ] I keep functions and classes small, with well-structured classes and modules\n- [ ] I apply single responsibility and avoid unnecessary complexity\n- [ ] I use DRY appropriately, without over-abstracting\n- [ ] I add comments where they explain \"why,\" not obvious \"what\"\n- [ ] I refactor continuously as code grows\n- [ ] I ask others whether the code is easy to understand\n\n## 11. Write quality code\n\n- [ ] I use the right level of abstraction — no excessive tiny classes or unnecessary layers\n- [ ] I hide implementation details when it reduces complexity\n- [ ] I handle errors consistently\n- [ ] I validate inputs, especially user inputs, and treat external inputs as potentially malicious\n- [ ] I expect invalid responses from functions, APIs, or systems\n- [ ] I expect exceptions and error states, and handle unknown API or system states explicitly\n- [ ] I prefer safe defaults when response states are unclear\n\n## 12. Become proficient in a language\n\n- [ ] I learn the language fundamentals deeply: syntax, types, data structures, and control flow\n- [ ] I learn standard error-handling approaches\n- [ ] I understand memory management and performance basics, and how the language compiles or runs\n- [ ] I learn the main framework used with the language\n- [ ] I go deeper than \"just enough to ship\"\n- [ ] I learn a second language when useful, and compare language strengths and weaknesses\n\n## 13. Debug effectively\n\n- [ ] I use debugger tools in my IDE: breakpoints, variable inspection, stepping into/over/out of functions, call stacks\n- [ ] I use conditional breakpoints or watchpoints when helpful\n- [ ] I learn from experienced developers while they debug\n- [ ] I use logging when a debugger is unavailable, and paper debugging for complex logic\n- [ ] I write tests to reproduce bugs\n- [ ] I confirm the root cause before fixing\n\n## 14. Refactor regularly\n\n- [ ] I refactor my own code after it works\n- [ ] I act on refactoring ideas from code reviews\n- [ ] I read through code to identify confusing or duplicated areas, and keep a prioritized list of refactoring opportunities\n- [ ] I use IDE refactoring tools\n- [ ] I start with small refactors and test after each one\n- [ ] I refactor tests as well as production code\n- [ ] I avoid large risky refactors without a safety net\n- [ ] I make refactoring an everyday habit\n\n## 15. Test thoroughly\n\n- [ ] I test code before requesting review or committing\n- [ ] I manually verify behavior when needed\n- [ ] I think through edge cases, and confirm stakeholder expectations for unusual cases\n- [ ] I write automated tests when practical\n- [ ] I learn unit, integration, screenshot, and end-to-end testing\n- [ ] I add regression tests for bugs\n- [ ] I treat testing as part of development, not a separate afterthought\n\n## 16. Master your local environment\n\n- [ ] I learn my IDE or editor deeply: shortcuts for frequent actions, formatting and linting, search, replace, refactor, and navigation features\n- [ ] I configure my color scheme and workflow for comfort\n- [ ] I learn how to run, debug, and test quickly\n- [ ] I use hot reload or fast feedback loops where available, and avoid slow edit-compile-run cycles\n- [ ] I use playgrounds or scratch environments for quick experiments\n\n## 17. Learn frequently used tools\n\n- [ ] I learn Git fundamentals: branching, rebasing, merging, conflict resolution, cherry-picking — and use a Git client or the command line confidently\n- [ ] I learn command-line basics: navigating files and directories, running scripts and tools, searching files, setting environment variables\n- [ ] I learn enough regular expressions for search and editing\n- [ ] I learn basic SQL: SELECT, FROM, WHERE, ORDER BY, GROUP BY, HAVING, joins, and views\n- [ ] I use AI coding assistants carefully, and save useful prompts or workflows\n- [ ] I understand company-specific tools and systems\n- [ ] I create a personal productivity cheat sheet\n\n## 18. Iterate quickly\n\n- [ ] I read existing code before changing it, and ask someone to walk me through unfamiliar systems\n- [ ] I draw classes, modules, and connections, and share my code map with teammates\n- [ ] I record useful \"aha\" moments in a cheat sheet\n- [ ] I understand the CI/CD pipeline and know how to access its logs\n- [ ] I know how to access production logs, dashboards, and metrics, and safe processes for debugging production data\n- [ ] I make small, focused pull requests when possible\n- [ ] I summarize pull requests clearly: screenshots or examples for UI changes, covered and uncovered edge cases\n- [ ] I request code reviews instead of waiting too long, and ask for feedback on my work\n- [ ] I compare my output and pace with team norms without treating it as a competition\n\n## 19. Quick weekly self-review\n\n- [ ] Did I deliver my most important work?\n- [ ] Did I ask for help early enough when blocked?\n- [ ] Did I break work into clear, shippable pieces?\n- [ ] Did I communicate estimates, risks, and delays?\n- [ ] Did I write readable, tested code?\n- [ ] Did I learn something about the codebase, language, tools, or team?\n- [ ] Did I get feedback from code review, pairing, users, or production?\n- [ ] Did I help someone else or add goodwill to the team?\n- [ ] Did I improve my workflow or tools?\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why competence is reliably getting the right things done — not cleverness — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. ARLO: an engineer newly stepping into management, buzz-cut hair, zip-up hoodie with rolled sleeves, sticker-covered laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Arlo proudly shows a board full of in-progress tickets while the shipped column stands empty.](assets/images/competent-software-engineer/comic-01-busy-all-week.jpeg)\n**Panel 1:** *The hook: the most common failure mode is not weak code — it is busy weeks that ship nothing.*\n\n![Comic panel: a flagged top-priority ticket gathers cobwebs while Arlo follows a trail of small shiny tasks.](assets/images/competent-software-engineer/comic-02-the-displaced-priority.jpeg)\n**Panel 2:** *The problem: the top priority was never named — or was quietly displaced by whatever felt easier.*\n\n![Comic panel: Arlo grinds silently on a bug for two days as Vera arrives asking what he has tried.](assets/images/competent-software-engineer/comic-03-the-silent-grinder.jpeg)\n**Panel 3:** *The wrong way: the silent grinder — days without progress and no signal to anyone.*\n\n![Comic panel: Vera presents a two-layer stack of delivery habits over craft as Arlo takes notes.](assets/images/competent-software-engineer/comic-04-the-right-things-done.jpeg)\n**Panel 4:** *The principle: competence is not cleverness — delivery habits on top of craft, and both layers are learnable.*\n\n![Comic panel: Arlo confirms his flagged top-priority ticket while a big project splits into small shippable boxes.](assets/images/competent-software-engineer/comic-05-name-it-confirm-it-ship-it.jpeg)\n**Panel 5:** *How it runs: name the week's most important task, confirm it when unsure, and break work into shippable pieces.*\n\n![Comic panel: a timer rings and Arlo works through duck, docs, and search before asking a teammate with his attempts listed.](assets/images/competent-software-engineer/comic-06-the-thirty-minute-timer.jpeg)\n**Panel 6:** *The mechanic: no progress after 30-60 minutes means blocked — run the repertoire, then ask with 'here is what I tried.'*\n\n![Comic panel: Arlo does daily tests, small refactors, and defensive checks while a flashy trophy sits ignored.](assets/images/competent-software-engineer/comic-07-the-unglamorous-floor.jpeg)\n**Panel 7:** *The cost: the craft is a floor, not a flourish — tests, small refactors, and defensive code, practiced daily.*\n\n![Comic panel: Arlo runs his five-minute weekly self-review as a faded scaffold and Vera step back.](assets/images/competent-software-engineer/comic-08-the-scaffolding-comes-down.jpeg)\n**Panel 8:** *The closer: five minutes a week — the self-review is what remains when the coaching scaffolding comes down.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
