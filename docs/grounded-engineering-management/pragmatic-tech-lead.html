<script id="data" type="application/json">{"meta": {"id": "EM-PRAGMATIC-TECH-LEAD", "status": "draft:gray", "title": "The Pragmatic Tech Lead", "date": "2026-07-28", "author": "Željko Obrenović", "permalink": "pragmatic-tech-lead", "timetoread": "7 min", "excerpt": "The project-leadership bar I hold tech leads to, seen from the engineer's side of the ladder: role clarity, real kickoffs and written scope, small shippable milestones, respect for project physics, risks worked through prototypes and direct conversation, releases matched to risk, unsurprised stakeholders, a healthy team — and proper closure.", "tags": "engineering management, tech lead, project leadership, milestones, risk management, releases, stakeholders, team dynamics", "icon": "assets/icons/pragmatic-tech-lead.png", "logo": "assets/images/pragmatic-tech-lead/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering management", "tech lead", "project leadership", "milestones", "risk management", "releases", "stakeholders", "team dynamics"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: A tech lead is not a junior manager and not a superior engineer — they are accountable for a project succeeding while staying hands-on enough to understand the system and set its quality bar. The disciplines: clarify the role, start with a real kickoff and written scope, ship small milestones with estimates as forecasts, respect the physics binding scope, timeline, and people, work risks through prototypes and direct conversation, match releases to the product's risk, keep stakeholders unsurprised, and close projects properly. The job is to make the team succeed — not to make the team dependent on the lead.\n\n## Statement\n\nThe expectations I hold tech leads to:\n\n- **The role is clarified before it is exercised.** Whether \"tech lead\" is a formal title, an informal role, or a project responsibility is established; my expectations of the lead are explicit; the split between building software, strategy and alignment, and helping people grow is deliberate; the lead stays hands-on enough to understand the system and set a quality bar, does not act like a manager unless that responsibility is explicitly theirs, and never becomes the bottleneck everyone waits on.\n- **Projects start well or not at all.** A clear business goal, an explicit problem, a written scope, a named owner; a kickoff before major work that aligns stakeholders on why, what, how, and when; the proposal circulated and reviewed beforehand; open questions captured before implementation starts — followed by an engineering kickoff covering architecture, APIs, data, infrastructure, and operations, with decisions written down.\n- **Milestones are small and estimates are forecasts.** The project broken into shippable milestones that validate progress every few weeks or sooner; risks that could change the estimate visible; dates not locked in before engineering planning is done; when the business needs a fixed date, scope and quality tradeoffs discussed explicitly; stakeholders taught that dates firm up as milestones land.\n- **Software project physics are respected.** Scope, timeline, and people considered together: when scope grows, timeline, staffing, quality expectations, or scope elsewhere must adjust; added people cost onboarding and coordination before they add speed; changes are communicated, never hidden until they become crises.\n- **Risks and dependencies are worked, not hoped away.** Technology risk mitigated with prototypes, spikes, and simpler alternatives; upstream and downstream teams told what is needed and what will change; direct engineer-to-engineer conversation before escalation; work not started while the \"why\" or \"what\" is still unclear.\n- **Releases match the product's risk.** The release approach chosen consciously on the spectrum from YOLO shipping to highly regulated; changes verified before release (review, tests, CI, monitoring, on-call ownership, runbooks); safety nets — flags, canaries, staged rollouts, easy rollback — used where appropriate; any bypassed process bypassed intentionally, with stakeholders informed and incidents handled blamelessly.\n- **Stakeholders are unsurprised and the team is healthy.** Stakeholders identified broadly, kept informed through regular updates that become a shared source of truth; roles and on-call ownership clear; the team's focus protected from vague urgent interruptions; team health watched — psychological safety, engagement, conflicts addressed early — and problems escalated to me with suggested solutions, not surprises.\n- **Projects are closed properly.** \"Done\" defined and agreed; a final update written; contributors recognized; learnings captured in a retrospective before the team moves on.\n\n## How to Read This\n\nThis journal is my engineering-management operating model; this record is the tech-lead stage of the engineer career ladder seen from the manager's side — the project-leadership expectations I hold an engineer to when they lead a project or a team's execution **without managing people**. It is grounded in the Pragmatic Tech Lead chapters of Gergely Orosz's *The Software Engineer's Guidebook* (Pragmatic Engineer, 2023). The management-ladder view of the same rung — the tech lead as a first step on the manager's path — is the separate record [Tech Lead](tech-lead.html); **this one is the engineer's side**. The checklist I hand the tech lead lives in the **Checklist** tab.\n\n## Rationale\n\n**Tech lead is a role about outcomes, not a rank — and ambiguity about the role is the first project risk.** Most tech-lead failures I have seen begin before the project does: the engineer does not know whether they hold a title, a temporary responsibility, or a vague expectation, so they either under-lead (staying a senior engineer with a nicer name) or over-lead (**acting like a manager without the mandate**). So the first expectation is clarification — with me: what I expect, where their time should go across building, aligning, and growing people, and what is explicitly not theirs. The two standing constraints: stay hands-on enough to understand the system and set the quality bar, and **never become the decision bottleneck** the whole team queues behind. The seat also carries a quieter duty: watching team health — psychological safety, engagement, conflicts caught early — and bringing problems to me with suggested solutions rather than letting them surface as surprises.\n\n![Diagram of the tech lead positioned between two crossed-out wrong models — junior manager and superior engineer — standing on a three-part base labeled build, align, grow people.](assets/images/pragmatic-tech-lead/role-between-two-wrong-models.jpeg)\n**Figure 1:** *The role sits between two wrong models: not a junior manager, not a superior engineer — a deliberate split across building, aligning, and growing people.*\n\n**Most project failures are visible at kickoff — which is why I inspect beginnings, not just endings.** A project without a clear business goal, an explicit problem, and a written scope is not early; it is **already failing quietly**. The kickoff discipline — proposal circulated before the meeting, stakeholders across product, engineering, design, data, and business reviewing the plan, open questions captured before implementation — is **cheap insurance** against the expensive kind of surprise. The engineering kickoff is its twin on the technical side: the team discusses the approach, covers architecture through operations, writes decisions down, and includes dependent engineering teams early. When a project drifts later, the root cause is usually findable in a kickoff that skipped one of these.\n\n**Scope, timeline, and people form a physics you cannot negotiate with.** When scope increases, at least one of timeline, staffing, quality expectations, or scope elsewhere must move; when the timeline shrinks, scope shrinks or capacity grows; when people leave, the plan changes. Adding people is **not free speed** — onboarding and coordination costs arrive first. I hold tech leads accountable for **stating these tradeoffs out loud** to stakeholders at the moment they occur, because the alternative — absorbing the change silently and hoping — converts a manageable adjustment into a late crisis. The same physics govern estimates: they are rough forecasts that become reliable as milestones land, which is exactly why milestones must be small enough to validate progress every few weeks or sooner.\n\n![Diagram of a three-way balance with pans labeled scope, timeline, and people, showing that pushing one pan down forces the others to move.](assets/images/pragmatic-tech-lead/scope-timeline-people-physics.jpeg)\n**Figure 2:** *Project physics: scope, timeline, and people are one linked system — when one moves, something else must, visibly.*\n\n**Risk work is prototypes and conversations, not registers.** The risk disciplines in the source are strikingly concrete: prototype unfamiliar technology, split unknowns into spikes, prefer simpler alternatives to unstable tools; tell upstream teams what you need and downstream teams what will change; talk directly to the teams you depend on, offer to do the work yourself where appropriate, mock or stub the dependency, remove it from the critical path — and escalate only after engineer-to-engineer communication has been tried. I coach tech leads toward exactly this posture: a risk that has a prototype, a named contact, or a fallback is being managed; a risk that has **only a slide is being watched**.\n\n**The release process is a dial, and turning it consciously is the tech lead's job.** YOLO shipping, startup-style releases, QA-heavy processes, large-tech automation, regulated pipelines — none is universally right; what is wrong is **inheriting one by accident**. I expect tech leads to know the product's cost of bugs and need for feedback speed, and to set verification and safety nets accordingly: review, tests, CI, monitoring, on-call ownership, runbooks before rollout; flags, canaries, staged rollouts, and easy rollback where changes are risky. Pragmatic risk-taking is welcome under one condition — that it is conscious: bypassed process is **bypassed intentionally**, stakeholders and support know what may happen, a rollback plan exists, and incidents are handled blamelessly and measured.\n\n![Diagram of a release-process dial spanning YOLO to regulated, with a safety net of flags, canaries, staged rollouts, and rollback drawn beneath it.](assets/images/pragmatic-tech-lead/release-process-dial.jpeg)\n**Figure 3:** *The release process is a dial, not a default: choose the setting by the product's risk, and string the safety nets underneath.*\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| The tech lead stays hands-on: planning, writing, reviewing code, supporting releases, joining on-call where appropriate. | The tech lead is the team's best coder who takes the hardest tasks — leading by example is not hoarding the interesting work. |\n| The role's mandate is explicit, agreed with me. | The tech lead manages people — not unless that responsibility is explicitly theirs. |\n| Estimates are forecasts that firm up as milestones land. | Dates are commitments made at kickoff — **locking dates before engineering planning** is the anti-pattern, not the discipline. |\n| When scope, timeline, or people change, something else moves — visibly. | The lead absorbs changes to protect stakeholders from bad news — hiding the tradeoff until it becomes a crisis. |\n| Escalate dependency problems after direct engineer-to-engineer contact. | Escalation is the first move — most dependency friction dissolves in one direct conversation. |\n| Choose the release approach by the product's risk, with safety nets. | One correct release process exists — YOLO shipping and regulated pipelines are both legitimate at the right ends of the dial. |\n| The lead empowers the team and removes blockers. | The project depends on the lead — success that **evaporates when the lead is away** is a failure of the role. |\n\nConcretely: when an engineer steps into a tech-lead role on my watch, **our first conversation covers the mandate** (title, scope, time split, what is not theirs); my project reviews ask for the written scope, the next milestone, the top risks with their mitigations, and the last stakeholder update — and when a project ends, I look for **the final update and the retrospective** before I call it closed.\n\n## Anti-Patterns\n\n- **The undefined lead.** Stepping into the role without clarifying whether it is a title, a responsibility, or a hope — then improvising a mandate no one agreed to.\n- **The bottleneck.** Centralizing every decision so the team queues behind the lead — the opposite of the empowerment the role exists to create.\n- **The kickoff skipped.** Major work starting with no written scope, no aligned stakeholders, and open questions still open — a failure scheduled at the start and discovered at the end.\n- **The absorbed scope change.** Saying yes to growing scope without moving timeline, staffing, or quality expectations — hiding the physics until they assert themselves as a crisis.\n- **The date locked at kickoff.** Committing fixed dates before engineering planning is done, then treating the team's honest forecasts as underperformance.\n- **Escalation as first resort.** Raising every dependency problem to managers before a single engineer-to-engineer conversation has been tried — burning goodwill both ways.\n- **The unclosed project.** The team disbands, no final update is written, contributors go unrecognized, learnings evaporate — and the next project repeats the same lessons at full price.\n\n## Related Records\n\n- [Tech Lead](tech-lead.html) — the same rung seen from the management ladder (Camille Fournier's *The Manager's Path*); that record is about the step toward management, this one is the engineer-side project-leadership bar.\n- [The Well-Rounded Senior Engineer](well-rounded-senior-engineer.html) — the individual senior expectations this record assumes and builds on.\n- [Staff and Principal Engineers](staff-and-principal-engineers.html) — where project-level leadership widens into organization-level leverage.\n- [Operational Excellence](operational-excellence.html) — the operational bar (monitoring, on-call, incidents) that this record's release and safety-net expectations plug into.\n- [Managing a Team](managing-a-team.html) — my side of the pairing: what the engineering manager runs while the tech lead leads the project.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs the expectations I hold engineers to when they lead projects as tech leads — role clarity, kickoffs, milestones and estimates, project physics, risk and dependency mitigation, releases, stakeholder management, and team structure and dynamics — and how I review projects against them. I revisit it if the organization formalizes the tech-lead role differently (title, rotation, or mandate changes), if project post-mortems repeatedly trace failures to **causes this record does not cover**, or if our release-engineering baseline shifts enough that the release-approach spectrum here no longer matches practice.\n\n## Authoritative References\n\n- Gergely Orosz, *The Software Engineer's Guidebook* (Pragmatic Engineer, 2023) — the Pragmatic Tech Lead chapters (the role, project leadership, scope/timeline/people, day-to-day project management, risks and dependencies, shipping to production, stakeholders, team structure, and team dynamics) this record distills.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "8 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record — the one I hand the tech lead, in their voice. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Clarify the tech lead role\n\n- [ ] I understand whether \"tech lead\" is a formal title, an informal role, or a project-specific responsibility\n- [ ] I know what my manager expects from me as tech lead\n- [ ] I know where I should spend my time across: building software, strategy and alignment, and helping people and teams grow\n- [ ] I am still hands-on enough to understand the system and set a quality bar\n- [ ] I am not acting like a manager unless that responsibility is explicitly mine\n- [ ] I lead by example: planning, writing code, reviewing code, supporting releases, and joining on-call where appropriate\n- [ ] I avoid becoming a bottleneck where everyone waits for me to make a decision\n\n## 2. Start the project well\n\n- [ ] The project has a clear business goal, an explicit problem being solved, and a clear expected outcome\n- [ ] The project scope is written down\n- [ ] The project has an owner or project lead\n- [ ] The project has a kickoff before major work starts\n- [ ] The kickoff aligns stakeholders on: why we are doing this, what we are building, how we plan to build it, and when we expect milestones\n- [ ] The proposal or PRD is circulated before the kickoff\n- [ ] Product, engineering, design, data, business, and other relevant stakeholders have reviewed the plan\n- [ ] Open questions are captured before implementation starts\n\n## 3. Run an engineering kickoff\n\n- [ ] The engineering team understands the product and business goal\n- [ ] The team has discussed the technical approach\n- [ ] Architecture, APIs, data, infrastructure, and operational concerns are covered\n- [ ] Important decisions are written down; RFCs, ERDs, ADRs, or similar documents are created where useful\n- [ ] Relevant engineering teams are included early\n- [ ] The team understands dependencies and constraints\n- [ ] The plan is available for future onboarding and reference\n\n## 4. Establish milestones and estimates\n\n- [ ] The project is broken into small, shippable milestones — small enough to validate progress every few weeks or sooner\n- [ ] Estimates are treated as rough forecasts, not fixed commitments\n- [ ] The team understands what uncertainty remains, and risks that could change the estimate are visible\n- [ ] Stakeholders understand that dates become more reliable as milestones are reached\n- [ ] The team avoids locking in dates before engineering planning is complete\n- [ ] If the business needs a fixed date, scope and quality tradeoffs are discussed explicitly\n\n## 5. Manage \"software project physics\"\n\n- [ ] Scope, timeline, and people are considered together\n- [ ] When scope increases, we adjust at least one of: timeline, staffing, quality expectations, or scope elsewhere\n- [ ] When the timeline shrinks, we realistically reduce scope or increase capacity\n- [ ] When fewer people are available, we reduce scope or extend the timeline\n- [ ] When adding people, we account for onboarding and coordination costs, and avoid assuming more people automatically speed up delivery\n- [ ] We communicate tradeoffs clearly to stakeholders\n- [ ] We do not hide scope, timeline, or people changes until they become crises\n\n## 6. Keep the project moving\n\n- [ ] Everyone understands the current project status, knows the next milestone, and knows who owns each major workstream\n- [ ] Blockers are visible and decisions are written down\n- [ ] The team has a lightweight way to track progress\n- [ ] The project management approach fits the team, rather than blindly following a framework\n- [ ] The team inspects and adapts its process, and we avoid process for its own sake\n- [ ] We keep the ultimate business goal visible\n\n## 7. Make decisions responsibly\n\n- [ ] I know which decisions I can make independently and which require consultation\n- [ ] I consult the people closest to the information before making a decision\n- [ ] I inform stakeholders when a decision affects scope, timeline, people, quality, or risk\n- [ ] I share: the situation or problem, the options considered, the tradeoffs, and the recommended approach\n- [ ] I avoid surprising stakeholders with major changes\n- [ ] I become more predictable over time by consistently using good judgment\n\n## 8. Identify major risks\n\n- [ ] Technology risks are identified\n- [ ] Engineering and non-engineering dependencies are identified\n- [ ] Missing decisions or unclear context are identified\n- [ ] Unrealistic timelines are challenged\n- [ ] Bandwidth or staffing risks are visible\n- [ ] Surprises discovered mid-project are reassessed\n- [ ] Unknown estimate confidence is communicated\n\n## 9. Mitigate technology risk\n\n- [ ] We prototype unfamiliar technology\n- [ ] We review roadmap, maintenance, and support risks\n- [ ] We avoid unstable tools unless the risk is justified, and consider simpler or more reliable alternatives\n- [ ] We split unknown work into smaller explorations or spikes\n\n## 10. Mitigate dependency risk\n\n- [ ] Upstream teams know what we need from them; downstream teams know what changes may affect them\n- [ ] We talk directly to teams we depend on\n- [ ] We offer to do work ourselves where appropriate\n- [ ] We mock or stub dependencies when useful\n- [ ] We remove critical-path dependencies where feasible\n- [ ] We escalate only after trying engineer-to-engineer communication\n- [ ] We do not start work when the \"why\" or \"what\" is still unclear\n\n## 11. Close projects properly\n\n- [ ] \"Done\" is clearly defined\n- [ ] The project has a final update, written soon after the project team disbands\n- [ ] The update explains: what shipped, what changed, what impact was achieved, what was learned, and what remains open\n- [ ] Stakeholders are thanked, contributors are recognized, and the team celebrates the project\n- [ ] A retrospective is held where useful, and learnings are captured for future projects\n- [ ] Even failed or partially successful projects are wrapped up constructively\n\n## 12. Choose an appropriate release approach\n\n- [ ] The release process matches the product's risk\n- [ ] We know whether this is closer to: YOLO shipping, a startup-style release, a traditional QA-heavy release, a large-tech automated release, or a highly regulated release\n- [ ] The team understands the cost of bugs in production and how quickly it needs feedback\n- [ ] We are not overbuilding the release process unnecessarily\n- [ ] We are not under-protecting users or the business\n\n## 13. Verify changes before release\n\n- [ ] Code is reviewed and automated tests run\n- [ ] Edge cases are considered\n- [ ] Local or isolated verification is performed, and CI/CD checks are passing\n- [ ] Expensive tests are run where needed\n- [ ] Monitoring is ready before rollout\n- [ ] On-call or support ownership is clear\n- [ ] Runbooks or mitigation steps exist for likely failures\n\n## 14. Use safety nets where appropriate\n\n- [ ] Separate test or staging environments are used when useful\n- [ ] QA or exploratory testing is involved where appropriate\n- [ ] Feature flags are used for risky or gradual changes\n- [ ] Canary releases are used when production validation is needed, and staged rollouts are planned for risky changes\n- [ ] Automated rollback is available where possible, and rollback steps are easy to execute\n- [ ] Metrics define whether a rollout should continue\n- [ ] Customer feedback is monitored after release\n- [ ] Incidents are handled blamelessly\n\n## 15. Take pragmatic risks consciously\n\n- [ ] Any bypassed process is intentionally bypassed, not ignored accidentally\n- [ ] Risky changes are communicated to relevant stakeholders\n- [ ] There is a rollback plan\n- [ ] Customer support and on-call teams know what may happen\n- [ ] We inspect customer feedback after release\n- [ ] We track incidents and measure their impact\n- [ ] Error budgets or similar risk limits guide how much risk is acceptable\n\n## 16. Identify stakeholders\n\n- [ ] Customers or users are considered\n- [ ] Business, product, and engineering stakeholders are identified, plus external stakeholders where relevant\n- [ ] Upstream and downstream dependencies are identified\n- [ ] Strategic stakeholders are identified\n- [ ] The \"usual suspects\" are checked: engineering, product, design/UX, data science, security and compliance, infrastructure/DevOps/SRE, legal, marketing/growth, customer support, operations, sales/business development, and finance\n- [ ] Existing stakeholders are asked who else should be involved\n- [ ] Architecture and code ownership are reviewed to find hidden stakeholders\n\n## 17. Keep stakeholders informed\n\n- [ ] Stakeholders know the project goal, the current status, the major risks, and timeline changes\n- [ ] Stakeholders know when their input is needed\n- [ ] Updates are sent regularly, and are clear enough to become a shared source of truth\n- [ ] Meetings are used when discussion is needed; async updates are used when information sharing is enough; hybrid communication is used for important changes\n- [ ] Stakeholders are not surprised late in the project\n\n## 18. Handle problematic stakeholders\n\n- [ ] I distinguish between upstream, downstream, and strategic stakeholder problems\n- [ ] I talk face-to-face or via video when written communication fails\n- [ ] I explain what needs to happen, why, and where we are now\n- [ ] I educate impatient stakeholders with transparent updates\n- [ ] I ask for management or leadership support when direct communication fails\n- [ ] I avoid treating stakeholder management as a bureaucratic process; the goal is project success\n\n## 19. Learn from stakeholders\n\n- [ ] I ask stakeholders about their part of the business, the challenges they face, and what they do outside this project\n- [ ] I build relationships before crises\n- [ ] I shadow or observe other teams where useful\n- [ ] I learn enough about stakeholder domains to communicate in their language\n\n## 20. Clarify roles and responsibilities\n\n- [ ] Titles and roles are not confused, and temporary project roles are explicit where needed\n- [ ] The project lead is clear\n- [ ] Support or rotating responsibilities are clear, and on-call ownership is clear\n- [ ] The stakeholder point-of-contact is clear\n- [ ] Team members know who owns what\n- [ ] Role overlaps and role gaps are identified\n- [ ] Implicit roles become explicit when confusion arises\n\n## 21. Maintain useful team processes\n\n- [ ] Planning processes help the team move faster or deliver higher-quality work\n- [ ] Building processes support delivery; releasing processes reduce risk\n- [ ] Maintaining processes support reliability and ownership\n- [ ] Productivity processes remove friction; team health processes improve morale and collaboration\n- [ ] Redundant processes are removed, and time-consuming manual processes are candidates for automation\n- [ ] The team periodically asks: \"Does this process still help?\"\n\n## 22. Boost team focus\n\n- [ ] The team knows its current top priorities and why they matter\n- [ ] Priorities are written down and confirmed with management\n- [ ] I remind the team of the current focus regularly\n- [ ] Sudden priority changes are challenged respectfully\n- [ ] New work has a clear impact and a written spec or clear \"why\" and \"what\"\n- [ ] Engineering feasibility is assessed before committing\n- [ ] Context-switching cost is made explicit, and alternatives are offered before disrupting the whole team\n- [ ] I protect the team from vague, urgent, low-value interruptions\n\n## 23. Assess team health\n\n- [ ] The team has clarity\n- [ ] The team executes and ships\n- [ ] Morale is good, and communication is respectful and constructive\n- [ ] People feel psychologically safe and are comfortable raising concerns\n- [ ] Team members are engaged, and junior and new members are invited to participate\n- [ ] Good work is recognized\n- [ ] The team has healthy relationships with nearby teams\n\n## 24. Watch for unhealthy patterns\n\n- [ ] Lack of clarity is visible and poor execution is addressed\n- [ ] Conflict is handled constructively, and communication breakdowns are noticed\n- [ ] Feedback is specific and useful\n- [ ] Psychological safety is protected, and everyone contributes\n- [ ] Too much process is reduced; too little structure is corrected\n- [ ] Tech debt is not ignored\n- [ ] Excessive context switching is reduced, and the team is not stuck \"treading water\"\n\n## 25. Address team growing pains\n\n- [ ] Silent conflicts or cliques are noticed\n- [ ] Execution problems are addressed before they become crises\n- [ ] Good work outside the team is recognized\n- [ ] Attrition risk is handled carefully and empathetically\n- [ ] Senior-heavy teams have enough meaningful challenges; junior-heavy teams get enough support and review\n- [ ] New joiners are onboarded without overloading the team\n- [ ] Direction changes are communicated as temporary disruption, not failure\n\n## 26. Improve team dynamics\n\n- [ ] I observe before trying to fix things\n- [ ] I speak with team members privately to understand issues\n- [ ] I reduce negative interactions in group settings\n- [ ] I involve team members in relevant decisions\n- [ ] I escalate serious problems to the manager when needed, suggesting solutions, not just problems\n- [ ] I avoid surprising my manager with major team issues\n- [ ] I use my influence to help the team become healthier, not to dominate it\n\n## 27. Build relationships with other teams\n\n- [ ] I regularly catch up with engineering leads on other teams\n- [ ] I know managers or product managers on teams we depend on\n- [ ] I use verbal communication for problematic cross-team situations, and avoid letting written channels amplify misunderstanding\n- [ ] I share what is happening on my team, and offer help to other teams where possible\n- [ ] I build relationships before dependencies become urgent\n\n## 28. Final tech lead takeaways\n\n- [ ] I balance project leadership, technical contribution, stakeholder alignment, and team support\n- [ ] I keep stakeholders, product, and my manager in the loop\n- [ ] I empower team members instead of centralizing all decisions\n- [ ] I remove blockers\n- [ ] I protect quality by leading through example\n- [ ] I do not act superior to other engineers\n- [ ] I create an environment where engineers have voice, confidence, and ownership\n- [ ] I help the team and project succeed, rather than making the team dependent on me\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why a tech lead is neither a junior manager nor a superior engineer — and what project leadership actually looks like — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. ARLO: an eager early-career engineer climbing the ladder — in some strips a new lead or manager, in others the engineer being coached — buzz-cut hair, zip-up hoodie with rolled sleeves, sticker-covered laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Arlo holds a tech-lead badge, puzzled between a door labeled manager and a door labeled engineer.](assets/images/pragmatic-tech-lead/comic-01-the-nicer-name.jpeg)\n**Panel 1:** *The hook: tech lead is not a junior manager and not a superior engineer — so what is it?*\n\n![Comic panel: the team codes while the project board behind them shows question marks under goal, scope, and owner.](assets/images/pragmatic-tech-lead/comic-02-failing-quietly-at-kickoff.jpeg)\n**Panel 2:** *The problem: a project without a goal, a written scope, and an owner is not early — it is already failing quietly.*\n\n![Comic panel: engineers queue behind Arlo's desk as he stamps every decision himself.](assets/images/pragmatic-tech-lead/comic-03-the-bottleneck.jpeg)\n**Panel 3:** *The wrong way: centralizing every decision until the whole team queues behind the lead.*\n\n![Comic panel: Vera draws a tech-lead figure standing on blocks labeled build, align, and grow while Arlo takes notes.](assets/images/pragmatic-tech-lead/comic-04-accountable-and-hands-on.jpeg)\n**Panel 4:** *The principle: accountable for the project succeeding, hands-on enough to understand the system and set its quality bar.*\n\n![Comic panel: Arlo runs a kickoff over a written scope page while a path of small milestone stepping stones stretches behind him.](assets/images/pragmatic-tech-lead/comic-05-kickoff-and-milestones.jpeg)\n**Panel 5:** *How it runs: start with a real kickoff and written scope, then ship small milestones — estimates are forecasts that firm up as they land.*\n\n![Comic panel: a stakeholder adds a scope box to a balance whose timeline and people pans tilt, while Arlo states the tradeoff.](assets/images/pragmatic-tech-lead/comic-06-the-physics-conversation.jpeg)\n**Panel 6:** *The mechanic: when scope grows, timeline, staffing, or quality moves — and the tech lead says so at that moment, out loud.*\n\n![Comic panel: Arlo brings a rough prototype to another engineer's desk while an unused escalate lever stands behind him.](assets/images/pragmatic-tech-lead/comic-07-the-direct-conversation.jpeg)\n**Panel 7:** *The discipline: risks are worked, not hoped away — prototypes for the unknowns, and a direct conversation before any escalation.*\n\n![Comic panel: the team celebrates a finished project by a done board while Arlo watches from the back and Vera takes a note.](assets/images/pragmatic-tech-lead/comic-08-succeeds-without-him.jpeg)\n**Panel 8:** *The closer: the job is to make the team succeed — not to make the team dependent on the lead.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
