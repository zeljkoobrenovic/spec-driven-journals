<script id="data" type="application/json">{"meta": {"id": "EM-GETTING-THINGS-DONE", "status": "draft:gray", "title": "Getting Things Done", "date": "2026-07-28", "author": "Željko Obrenović", "permalink": "getting-things-done", "timetoread": "6 min", "excerpt": "I run execution as a loop: a concrete vision people can repeat without misinterpreting, a believable plan built on the team's real strengths, clear ownership of every decision and task, fast commitment once a call is made, a portfolio across time horizons, and blameless debriefs that turn repeated work into playbooks. A team executing well is recognizable — top priorities get the most attention, and mistakes make the team stronger.", "tags": "engineering management, execution, planning, prioritization, decision making, retrospectives, process", "icon": "assets/icons/getting-things-done.png", "logo": "assets/images/getting-things-done/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering management", "execution", "planning", "prioritization", "decision making", "retrospectives", "process"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: Execution starts with a vision so concrete that different people describe the goal the same way, and a plan believable because it is built on the team's real strengths and constraints — not on hope. From there it is ownership and speed: every decision and task has an owner and a deadline, decisions are made quickly when enough information exists, and once made, everyone commits and moves — until important new information forces a fast, honest reassessment. The loop closes with blameless debriefs that turn repeated work into playbooks, so the team gets stronger after every mistake.\n\n## Statement\n\nMy execution commitments:\n\n- **Set a direction that survives retelling.** I define a concrete vision with a clear, measurable outcome, keep it easy to repeat and hard to misinterpret, and test it by checking whether different people describe the goal the same way.\n- **Write believable plans.** Plans are based on the team's real strengths and constraints, pick the few priorities that matter most, cut or defer lower-value work, break big goals into smaller milestones, and carry buffer for delays, surprises, and changing conditions.\n- **Give everything an owner.** Every decision, task, and follow-up has a named owner, a clear \"what,\" and a \"by when.\" Work is prioritized from most important to least, and top priorities get the most time and attention.\n- **Decide fast, commit, and reassess honestly.** When enough information is available, I make the call — especially on reversible decisions — and expect commitment afterward even from people who disagreed. When important new information arrives, the plan is revisited promptly, not defended.\n- **Balance time horizons.** I define the long-term vision first and work backward, connect short-term work to long-term goals, and keep a portfolio of short-term improvements, medium-term projects, and longer-term bets — over-optimizing for the immediate term is as much a failure as clinging to a long-term plan that no longer fits reality.\n- **Turn learning into process.** I run regular debriefs focused on learning, not blame, capture and share the lessons, turn repeated work into playbooks and checklists, and update processes as the team learns.\n\n![Circular diagram of the execution loop: direction, plan, ownership, decision, and learning, with an amber arrow closing the loop back to direction.](assets/images/getting-things-done/execution-loop.jpeg)\n**Figure 1:** *Execution is a loop, not a list: direction, plan, ownership, decision, learning — and the learning arc feeds the next cycle, so the team gets stronger every pass.*\n\n## How to Read This\n\nThis journal is my engineering-management operating model, each record grounded in one source checklist. This record distills the \"getting things done\" chapter of Julie Zhuo's *The Making of a Manager* (Portfolio/Penguin, 2019): direction, believable plans, organized execution, balanced time horizons, and process that improves itself. The runnable version — including the \"signs the team is executing well\" self-check — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**A vision that cannot survive retelling is not a vision.** The test is not whether the goal sounds good when I present it — it is whether three different people, asked separately, describe it the same way. A concrete, measurable outcome that is easy to repeat and hard to misinterpret does coordination work while I am not in the room; a vague aspiration forces every ambiguous call back to me. That is why I test the retelling, not the slide.\n\n![Split diagram: a concrete goal repeated identically by three people versus a vague goal retold as three different shapes.](assets/images/getting-things-done/retelling-test.jpeg)\n**Figure 2:** *The test is not the slide — it is whether three people, asked separately, describe the goal the same way.*\n\n**Plans fail when they are written for the team you wish you had.** A believable plan is grounded in the team's real strengths and constraints — who is actually good at what, what will actually take longer than hoped. It concentrates on the few priorities that matter, defers the rest deliberately, and carries explicit buffer, because delays and surprises are a certainty, not a risk. Milestones exist so believability can be checked along the way rather than discovered at the deadline.\n\n**Ambiguous ownership is where execution quietly dies.** Work with no named owner and no deadline is work that everyone assumes someone else is doing. The unglamorous discipline — who owns each decision, what must be done, by whom, by when — is what makes a plan operational instead of aspirational. The same discipline governs decisions: made quickly when the information is sufficient, committed to once made, and revisited promptly when reality changes. Slow decisions and relitigated decisions are both taxes on the team; commitment after disagreement is what keeps speed from fracturing into churn.\n\n**A team that only ships this quarter is quietly borrowing from next year.** Over-optimizing the immediate term feels productive right up until the medium-term projects and long-term bets that should be maturing now were never started. Working backward from the long-term vision, and keeping an explicit portfolio across horizons, forces the trade-off into the open. The symmetric failure is just as real: staying locked into a long-term plan that new information has already invalidated. Both are cured by the same habit — connect short-term work to long-term goals, and reassess fast when the facts change.\n\n![Diagram of a balanced three-lane portfolio of short, medium, and long-term work, flanked by two failure modes: all work short-term, and a padlocked long-term plan.](assets/images/getting-things-done/three-horizon-portfolio.jpeg)\n**Figure 3:** *The portfolio spans horizons, with short-term work connected to long-term goals — and both failure modes in view: over-optimizing the immediate term, and defending a plan the facts have outrun.*\n\n**Blame buries the lesson; debriefs convert it into process.** A debrief focused on who failed produces defensiveness and thinner information next time. A debrief focused on what we learned produces lessons worth capturing — and lessons become durable only when repeated work turns into playbooks and checklists that outlive the people who learned them the hard way. That is the closing of the loop: a team that runs this cycle keeps learning and comes out of mistakes stronger, which is the most reliable sign of good execution I know.\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| The vision is concrete, measurable, and survives retelling. | The vision is a slogan — if people describe it differently, it has failed the test. |\n| Plans are built on real strengths, few priorities, and buffer. | Plans are exhaustive — cutting and deferring lower-value work is part of planning, not a failure of it. |\n| Every task and decision has an owner and a deadline. | The manager owns everything — ownership is distributed and named, not hoarded. |\n| Decide quickly when there is enough information. | Decide recklessly — speed applies most to reversible decisions; irreversible ones earn more care. |\n| Commit after the decision, even if you disagreed. | Disagreement is unwelcome — it belongs before the decision, and reassessment reopens when new information arrives. |\n| Debriefs are regular and blameless, and produce playbooks. | Debriefs are trials — a retrospective that assigns fault produces silence, not learning. |\n\nConcretely: my team's goal can be restated consistently by people who did not write it; the plan document names owners and deadlines and shows what was deliberately cut; the roadmap contains visible short-, medium-, and long-term work; decisions have dates; and our playbooks trace back to specific debriefs.\n\n## Anti-Patterns\n\n- **The unrepeatable vision.** A goal that sounds inspiring in the all-hands but comes back in three different versions when three people are asked what the team is doing.\n- **The hope-based plan.** A plan with every priority marked critical, zero buffer, and effort estimates written for the team you wish you had.\n- **Ownerless work.** Tasks and follow-ups that live in meeting notes with no name and no date attached — everyone's responsibility, so no one's.\n- **The stalled reversible decision.** Treating a cheaply undoable choice with the ceremony of a one-way door, while the team waits.\n- **Relitigating after commitment.** Reopening a made decision without new information — disagreement that should have been spent before the call, spent after it instead.\n- **The immovable long-term plan.** Defending last year's plan against this quarter's facts because changing course would mean admitting the plan was wrong.\n- **The blame-seeking debrief.** Retrospectives that produce a culprit instead of a playbook — after which people stop reporting problems early.\n\n## Related Records\n\n- [Managing a Team](managing-a-team.html) — the Manager's Path view of running a single team; this record is the execution loop that team runs on.\n- [Amazing Meetings](amazing-meetings.html) — decision meetings and reviews are where ownership, deadlines, and commitment become visible; badly run meetings are where they dissolve.\n- [Operational Excellence](operational-excellence.html) — the operational bar for running systems in production; the debrief-to-playbook loop here is the same muscle applied to delivery.\n- [Managing a Growing Team](managing-a-growing-team.html) — as the team grows, this loop must run without me in every room; delegation is how the execution discipline scales.\n- [Your First Three Months](first-three-months.html) — a new manager earns the credibility to set direction before setting it; this record assumes that foundation.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs how teams I manage set direction, plan, decide, and improve their own process. I revisit it if the retelling test starts failing on a goal I thought was clear, if a quarter passes with no playbook or checklist emerging from repeated work, or if I catch the roadmap fully consumed by short-term work with no medium- or long-term bets in flight.\n\n## Authoritative References\n\n- Julie Zhuo, *The Making of a Manager: What to Do When Everyone Looks to You* (Portfolio/Penguin, 2019) — the \"getting things done\" chapter this record distills.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "3 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Set direction\n\n- [ ] Define a concrete vision with a clear, measurable outcome\n- [ ] Make sure the vision is easy to repeat and hard to misinterpret\n- [ ] Test whether different people describe the goal the same way\n- [ ] Write a believable plan for how the team will get there\n\n## 2. Build the plan\n\n- [ ] Base the plan on the team's real strengths and constraints\n- [ ] Choose the few priorities that matter most\n- [ ] Cut or defer lower-value work\n- [ ] Break big goals into smaller milestones\n- [ ] Add buffer for delays, surprises, and changing conditions\n\n## 3. Organize execution\n\n- [ ] Define who owns each decision, task, and follow-up\n- [ ] Clarify what must be done, by whom, and by when\n- [ ] Prioritize work from most important to least important\n- [ ] Make decisions quickly when enough information is available\n- [ ] Once a decision is made, commit and move forward\n- [ ] Revisit plans promptly when important new information becomes available\n\n## 4. Balance time horizons\n\n- [ ] Define the long-term vision first, then work backward\n- [ ] Connect short-term work to long-term goals\n- [ ] Keep a portfolio of work: short-term improvements, medium-term projects, longer-term bets\n- [ ] Avoid over-optimizing for only the immediate term\n- [ ] Avoid locking into long-term plans that no longer fit reality\n\n## 5. Improve process\n\n- [ ] Run regular debriefs / retrospectives\n- [ ] Focus debriefs on learning, not blame\n- [ ] Capture lessons and share them with others\n- [ ] Turn repeated work into playbooks or checklists\n- [ ] Update processes as the team learns\n\n## 6. Signs the team is executing well\n\n- [ ] Top priorities get the most time and attention\n- [ ] There is a trusted process for making decisions\n- [ ] The team moves quickly, especially on reversible decisions\n- [ ] People commit after decisions, even if they disagreed earlier\n- [ ] New information leads to fast reassessment\n- [ ] Every task has a clear owner and deadline\n- [ ] The team keeps learning and gets stronger after mistakes\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why execution is a loop — direction, plan, ownership, decision, learning — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. ARLO: an engineer newly stepping into management, buzz-cut hair, zip-up hoodie with rolled sleeves, sticker-covered laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Arlo proudly presents a grand vision slide to an applauding team.](assets/images/getting-things-done/comic-01-the-inspiring-slide.jpeg)\n**Panel 1:** *The hook: the vision lands beautifully in the all-hands — or seems to.*\n\n![Comic panel: three team members picture three different goals in thought bubbles while Vera looks at Arlo.](assets/images/getting-things-done/comic-02-three-different-goals.jpeg)\n**Panel 2:** *The problem: asked separately, three people describe three different goals — the vision does not survive retelling.*\n\n![Comic panel: Arlo presents a wall of critical-flagged sticky notes with no slack and no owners while a teammate squints.](assets/images/getting-things-done/comic-03-the-hope-based-plan.jpeg)\n**Panel 3:** *The wrong way: every priority critical, zero buffer, no names — a plan written for the team you wish you had.*\n\n![Comic panel: Vera draws a five-node loop of compass, map, name tag, fork sign, and lightbulb on a whiteboard for Arlo.](assets/images/getting-things-done/comic-04-the-loop.jpeg)\n**Panel 4:** *The principle: execution is a loop — direction, plan, ownership, decision, learning — and the whole loop has to run.*\n\n![Comic panel: Arlo assigns avatars and dates to task cards, moving lower-value cards into a Later tray.](assets/images/getting-things-done/comic-05-owners-and-deadlines.jpeg)\n**Panel 5:** *How it runs: few priorities with real buffer, lower-value work cut on purpose, and every task carrying a name and a date.*\n\n![Comic panel: Arlo stamps a decision as a disagreeing teammate commits, with a new-information envelope curving back toward the decision.](assets/images/getting-things-done/comic-06-decide-commit-reassess.jpeg)\n**Panel 6:** *The mechanic: decide fast when there is enough information, commit even after disagreeing — and reassess promptly when the facts change.*\n\n![Comic panel: after a failed launch, Arlo runs a blameless debrief at a flip chart while the team volunteers lessons.](assets/images/getting-things-done/comic-07-the-blameless-debrief.jpeg)\n**Panel 7:** *The cost: after a failure, the discipline is asking what we learned, not who failed — blame would buy silence next time.*\n\n![Comic panel: Arlo hands over a playbook booklet in front of a rising spiral version of the execution loop, Vera nodding.](assets/images/getting-things-done/comic-08-stronger-every-cycle.jpeg)\n**Panel 8:** *The closer: lessons become playbooks, playbooks close the loop — and the team comes out of every mistake stronger.*\n"}]}]}</script>

    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,

        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');

            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
