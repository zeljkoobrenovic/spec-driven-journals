<script id="data" type="application/json">{"meta": {"id": "EM-OPERATIONAL-EXCELLENCE", "status": "draft:gray", "title": "Operational Excellence", "date": "2026-07-28", "author": "Željko Obrenović", "permalink": "operational-excellence", "timetoread": "6 min", "excerpt": "A system is not done when it ships — it is done when it can be launched, monitored, paged on, recovered, and improved without heroics. I hold every software team to a checkable operational bar across seven areas: launch readiness, incident management, on-call, operational data, customer issue tracking, failover and recovery, and CI/CD. The manager owns whether the answers are yes.", "tags": "engineering management, operational excellence, incident management, on-call, reliability, monitoring, CI/CD", "icon": "assets/icons/operational-excellence.png", "logo": "assets/images/operational-excellence/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering management", "operational excellence", "incident management", "on-call", "reliability", "monitoring", "CI/CD"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: A system is not done when it ships — it is done when it can be launched, monitored, paged on, recovered, and improved without heroics. Operational excellence is a management responsibility with a checkable bar, not an infrastructure team's hobby: invest in quality assurance, automate what is repetitive, standardize and improve the processes, measure and track the data, and keep improving continuously. I hold every software team I am responsible for to that bar across seven areas — launch readiness, incidents, on-call, operational data, customer issues, failover and recovery, and CI/CD — and the manager, not the pager, owns whether the answers are yes.\n\n## Statement\n\nThe operational bar I hold software teams to:\n\n- **Nothing launches unready.** Before launch: monitoring and dashboards work and are accessible, runbooks are understandable by unfamiliar team members, SLOs are defined and tracked, disaster recovery is in place and tested, dependency failure behavior is understood, load and performance testing has been done, and compliance requirements are met.\n- **Incidents produce learning, not just resolution.** Every team has an incident review process (retrospectives, root-cause analyses), follow-up items that are tracked to completion with weekly reviews of what is open, measured alert volume, and reviewed response quality.\n- **On-call is structured and humane.** A fair, defined schedule and rotation length, backup plans when someone does not respond to a page, engineers with the right skills, tools, and permissions, explicit expectations about feature work during on-call — and on-call pain that is measured and actively minimized.\n- **The team watches its data.** Dashboards give visibility into the health of the system *and* the business, are reviewed regularly, and the team knows what is currently in flight — feature flags, marketing campaigns, sales events — and where the scaling thresholds are.\n- **Customer-reported issues are a tracked signal.** Frequency and type of customer issues are tracked, trends are analyzed as growing or shrinking, timeouts, errors, and crashes are measured (especially on mobile), and quality is weighed whenever new features are considered.\n- **Recovery is designed, tested, and timed.** Disaster recovery plans are documented and tested, systems degrade gracefully, time to full recovery is measured and optimized, and rollback or failover to a known good instance is always possible.\n- **Deployment is a source of confidence, not fear.** CI/CD with high confidence in deployment quality, canary releases or feature flags for gradual rollouts, synthetic and real-user monitoring on key flows, and adequate observability throughout.\n\n## How to Read This\n\nThis journal is my engineering-management operating model, each record grounded in one source. This record is the exception in an otherwise book-grounded section: it distills Kate Matsudaira's article \"Software Managers' Guide to Operational Excellence\" — the source checklist names her article explicitly — into the operational bar I hold software teams to. The seven areas above map one-to-one onto her checklist; the runnable version lives in the **Checklist** tab.\n\n## Rationale\n\n**Operational excellence is a management responsibility because nobody else has the incentive to enforce it.** Engineers under delivery pressure will rationally defer runbooks, DR tests, and alert cleanup — every one of those is invisible until the night it isn't. Matsudaira's framing puts the accountability where the leverage is: the manager does not have to operate the systems, but the manager owns asking the questions and refusing to accept \"we'll get to it\" as a permanent answer. That is why the bar is written as checkable conditions, not aspirations.\n\n**The five keys are one loop, not five projects.** Invest in quality assurance, automate repetitive and manual tasks, standardize and improve engineering processes, measure and track performance data, foster a culture of continuous improvement. Each feeds the next: measurement exposes the repetitive pain, automation removes it, standardization keeps it removed, and the improvement culture is what makes the loop run again next quarter instead of decaying into a one-time cleanup.\n\n![Circular loop diagram of five stations: measure, automate, standardize, quality, improve, feeding back into each other.](assets/images/operational-excellence/five-keys-loop.jpeg)\n**Figure 1:** *The five keys are one loop, not five projects: measurement exposes the pain, automation removes it, standardization keeps it removed, and the improvement culture reruns the loop.*\n\n**Launch readiness is cheaper than launch archaeology.** Every item on the launch list — working dashboards, runbooks a stranger can follow, tracked SLOs, tested backups, understood dependency failures, load testing, compliance — costs a fraction before launch of what it costs during the first serious incident, when the team is simultaneously discovering how the system fails and how to observe it. A launch review against this list is the single highest-leverage operational meeting a manager runs.\n\n![Two scenes contrasting a cheap pre-launch readiness check with an expensive night-time dig through an incident.](assets/images/operational-excellence/readiness-vs-archaeology.jpeg)\n**Figure 2:** *Every readiness item costs a fraction before launch of what it costs during the first serious incident, when the team is discovering how the system fails and how to observe it at the same time.*\n\n**On-call quality is an operational metric, not a personnel perk.** A rotation with unmeasured paging pain, no backup plan, unclear feature-work expectations, or engineers missing the permissions to act burns people *and* lengthens incidents — the same neglect shows up in attrition and in time-to-recovery. Measuring alert volume and on-call pain, and treating high numbers as defects to fix, is how the incident load gets driven down instead of merely endured.\n\n**Recovery ability, not incident absence, is the real reliability measure.** Incidents are inevitable; unrecoverable ones are a choice. That is why the bar insists on documented *and tested* recovery plans, graceful degradation, a measured and optimized time to full recovery, and — always — a rollback or failover path to a known good instance. A deployment pipeline with canaries, feature flags, and real-user monitoring is part of the same stance: it turns every release into a small, observable, reversible experiment instead of a bet.\n\n![Pipeline diagram of a release passing canary, feature flags, and full rollout, with a rollback arrow returning to a known good instance from every stage.](assets/images/operational-excellence/reversible-release-path.jpeg)\n**Figure 3:** *A deployment pipeline with canaries, flags, and monitoring turns every release into a small, observable, reversible experiment — with a path back to a known good instance from every stage.*\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| The manager owns the operational bar and asks the questions. | The manager personally operates the systems — the craft of meeting the bar lives with the team. |\n| Nothing launches without the readiness list holding. | Launches are slow — the list is short, known in advance, and cheapest before launch. |\n| Incident follow-ups are tracked weekly to completion. | Retrospectives are enough — a review whose action items die in a backlog is theater. |\n| On-call pain is measured and minimized. | On-call is eliminated — someone carries the pager; the job is making that humane and effective. |\n| Dashboards cover system health *and* business health. | Observability is an infra concern — feature flags, campaigns, and sales events are operational context too. |\n| Rollback or failover to a known good instance is always possible. | Incidents are preventable — recovery ability, not incident absence, is what I hold teams to. |\n| Quality is weighed when new features are considered. | Features stop for quality — the trade-off is made explicitly, with customer-issue trends on the table. |\n\nConcretely: every service my teams run can pass the Checklist tab today or has a dated plan for each gap; launch reviews use the readiness section; open incident action items are reviewed weekly; and I can see alert volume, on-call pain, customer-issue trends, and time to recovery for any team without asking anyone to compile them.\n\n## Anti-Patterns\n\n- **Done means deployed.** Declaring a project finished at ship time, with monitoring, runbooks, and recovery \"to follow\" — they follow at 3 a.m., during the first incident.\n- **The untested recovery plan.** A DR document nobody has ever executed; backups nobody has restored. An untested plan is a hypothesis, not a plan.\n- **Retrospective theater.** Running incident reviews whose action items are never tracked to completion — the same incident returns wearing a different alert.\n- **Normalized pager pain.** Treating a loud, exhausting on-call rotation as the cost of doing business instead of a measured defect to drive down.\n- **The hero dependency.** A system only one person can operate or recover — runbooks that live in someone's head are an outage waiting for a vacation.\n- **Dashboards nobody reads.** Building observability for the audit and never reviewing it — visibility that is not looked at regularly is decoration.\n- **The irreversible deploy.** Shipping without canaries, flags, or a rollback path to a known good instance, turning every release into an all-or-nothing bet.\n\n## Related Records\n\n- [Senior Leadership](senior-leadership.html) — the True North commitment to protect quality, readiness, and operational standards; this record is the concrete bar behind it.\n- [Managing a Team](managing-a-team.html) — team health and system health degrade the same way, quietly; the manager who owns one owns both.\n- [Tech Lead](tech-lead.html) — the rung that runs projects day-to-day against this bar and surfaces the gaps first.\n- [Running Engineering Processes](../grounded-engineering-executive/run-engineering-processes.html) (executive journal) — launch reviews, incident reviews, and on-call rotations are exactly the kind of clearly owned processes an organization runs on.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs the operational bar for every software team and service I am accountable for — what must be true at launch and in steady state, and what I check when I review a team's operations. I revisit it when an incident exposes a failure mode the seven areas do not cover, when a team consistently passes the checklist while operational outcomes still degrade (a sign the bar has drifted from reality), or when platform changes (new runtime, new compliance regime) add conditions the list must absorb.\n\n## Authoritative References\n\n- Kate Matsudaira, \"Software Managers' Guide to Operational Excellence\" — the article this record and its checklist distill; the source checklist PDF names it explicitly.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "3 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record. The Article tab carries the rationale and anti-patterns.*\n\nBased on Kate Matsudaira's article \"Software Managers' Guide to Operational Excellence.\" Keys to success:\n\n- Invest in quality assurance.\n- Automate repetitive/manual tasks.\n- Standardize and improve engineering processes.\n- Measure and track performance data.\n- Foster a culture of continuous improvement.\n\n## 1. Launch Readiness\n\n- [ ] Monitoring and dashboards are working and accessible\n- [ ] Runbooks/playbooks exist and are understandable by unfamiliar team members\n- [ ] Service-level objectives (SLOs) are defined and tracked\n- [ ] Disaster recovery plans and backups are in place and tested\n- [ ] Dependency failure behavior is understood (e.g., graceful degradation)\n- [ ] Load and performance testing have been conducted\n- [ ] Compliance requirements (security, privacy, regulations) are met\n\n## 2. Incident Management\n\n- [ ] An incident review process (retrospectives, RCAs) has been established\n- [ ] Incident follow-up items are tracked and completed\n- [ ] Alert volume is measured; high volumes are addressed\n- [ ] Incident response quality is reviewed (e.g., SME coverage, focus on resolution)\n- [ ] Weekly reviews of open incident action items occur\n\n## 3. On-Call Management\n\n- [ ] Defined on-call schedule and rotation length\n- [ ] Backup plans are in place when someone doesn't respond to a pager\n- [ ] On-call engineers have the right skills, tools, and permissions\n- [ ] On-call pain (paging frequency, hours) is evaluated and minimized\n- [ ] Clear expectations about feature work during on-call duty\n- [ ] Rotation selection is fair and well-structured\n\n## 4. Operational Data & System Health\n\n- [ ] Dashboards provide visibility into the health of the system and the business\n- [ ] Dashboards are reviewed regularly\n- [ ] Awareness of current feature flags, marketing campaigns, and sales events\n- [ ] Systems scale elastically, and thresholds are known\n\n## 5. Customer Issue Tracking\n\n- [ ] Frequency and type of customer-reported issues are tracked\n- [ ] Trends in customer issues are analyzed (growing/shrinking)\n- [ ] Quality management is considered in the context of new features\n- [ ] Frequency of timeouts, errors, or crashes is tracked (especially mobile)\n\n## 6. Failover & Recovery\n\n- [ ] Disaster recovery plans are documented and tested\n- [ ] Systems degrade gracefully when needed\n- [ ] Time to full recovery is measured and optimized\n\n## 7. CI/CD, Testing, and Automation\n\n- [ ] High confidence in deployment quality\n- [ ] Canary releases or feature flags are used for gradual rollouts\n- [ ] Synthetic and real-user monitoring (RUM) are in place for key flows\n- [ ] Systems have adequate observability and instrumentation\n- [ ] Rollback/failover to a known good instance is always possible\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why a system is done when it can be run — not when it ships — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. ARLO: an eager early-career engineer climbing the ladder — in some strips a new lead or manager, in others the engineer being coached — buzz-cut hair, zip-up hoodie with rolled sleeves, sticker-covered laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: a manager celebrates a deploy with confetti while a pager on the desk starts to glow.](assets/images/operational-excellence/comic-01-it-shipped.jpeg)\n**Panel 1:** *The hook: 'done' is declared at ship time — while the pager is already warming up.*\n\n![Comic panel: an exhausted manager at 3 AM with a blank dashboard and an empty runbook binder.](assets/images/operational-excellence/comic-02-three-am-archaeology.jpeg)\n**Panel 2:** *The problem: the first serious incident becomes archaeology — the team digs for dashboards and runbooks that were never built.*\n\n![Comic panel: a manager waves off a leaning tower of deferred operational task cards while pointing at a feature roadmap.](assets/images/operational-excellence/comic-03-well-get-to-it.jpeg)\n**Panel 3:** *The wrong way: 'we'll get to it' — every deferred runbook, DR test, and alert cleanup is invisible until the night it isn't.*\n\n![Comic panel: a mentor crosses out 'done equals deployed' and draws icons for monitoring, paging, runbooks, recovery, and improvement.](assets/images/operational-excellence/comic-04-done-means-runnable.jpeg)\n**Panel 4:** *The principle: a system is done when it can be launched, monitored, paged on, recovered, and improved without heroics — and the manager owns whether the answers are yes.*\n\n![Comic panel: a manager runs a pre-launch review with a checklist while a rocket waits on the pad.](assets/images/operational-excellence/comic-05-the-launch-review.jpeg)\n**Panel 5:** *How it runs: the launch review — dashboards, runbooks, SLOs, tested recovery — is the cheapest, highest-leverage operational meeting a manager runs.*\n\n![Comic panel: a manager shows a shrinking alert chart while an on-call engineer sleeps beside a quiet pager.](assets/images/operational-excellence/comic-06-measure-the-pain.jpeg)\n**Panel 6:** *The mechanic: measure alert volume and on-call pain, treat high numbers as defects to fix — the same neglect shows up in attrition and in time-to-recovery.*\n\n![Comic panel: a mentor holds up a cobwebbed disaster-recovery document while an engineer runs a timed restore drill.](assets/images/operational-excellence/comic-07-the-untested-plan.jpeg)\n**Panel 7:** *The cost: the bar demands drills — recovery plans tested, backups restored, time to full recovery measured — not documents that age in a drawer.*\n\n![Comic panel: a relaxed manager deploys with a canary on a green dashboard and a rollback lever within reach.](assets/images/operational-excellence/comic-08-the-calm-deploy.jpeg)\n**Panel 8:** *The closer: with canaries, flags, monitoring, and a rollback path always ready, deployment becomes a source of confidence instead of fear.*\n"}]}]}</script>

                sectionEl.appendChild(document.createTextNode(postId));

            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
