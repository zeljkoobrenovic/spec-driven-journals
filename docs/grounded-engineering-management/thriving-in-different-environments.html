by its standards, help others succeed, and never burn bridges.\n\n## Statement\n\nWhat I expect engineers to read, and how I expect them to adapt:\n\n- **Know your team type and play it.** On a product team: understand the user problem, talk regularly with PMs, designers, and users, suggest improvements rather than just implementing specs, think through edge cases, and validate whether a feature actually worked after launch — building product intuition from outcomes. On a platform team: know who your customers are — usually other engineers — make feedback easy, communicate proactively with teams building on the platform, and spend time with product teams to understand downstream impact.\n- **Recognize the company's mode.** Wartime looks like existential pressure, mandatory deadlines, fewer meetings, tolerated conflict, bypassed process, and weak work-life balance. Peacetime looks like low immediate pressure, quality over speed, alignment meetings, discouraged conflict, and visible work-life priority. I expect engineers to diagnose the mode before judging the behavior around them.\n- **Adjust behavior to the mode.** In wartime: ship the important things fast, accept good-enough, don't take blunt feedback personally, stay aligned with the leadership chain, treat job stability as uncertain, and manage stress actively. In peacetime: execute at high quality, build alliances across teams, manage in every direction, invest in longer-term initiatives — and avoid getting comfortable or bored.\n- **Play the company type you are actually at.** Big Tech rewards tracked individual impact, evidence kept for reviews, and relationships across the organization. A scaleup rewards applied tenure — company knowledge turned into impact — plus awareness of whether your team is a cost or profit center, and alertness during slowing growth. A startup rewards work that moves the company toward product-market fit, autonomy used to take initiative, and making sure founders see impactful work.\n- **Hold the universal set everywhere.** Know what the company values most; adapt your working style to the current environment; do standout work by the company's standards; help people around you succeed; maintain relationships with peers and former colleagues; resolve conflict professionally; avoid burning bridges.\n- **Reassess, because environments shift.** Companies change modes and phases without announcements. I expect engineers to regularly re-check whether the environment has shifted — and to adapt when it has, rather than keep playing the previous game.\n\n## How to Read This\n\nThis journal is my engineering-management operating model. This record is grounded in the Thriving in Different Environments chapter of Gergely Orosz's *The Software Engineer's Guidebook* (2023), read from the manager's side of the table: the book tells engineers how to read and adapt to their environment; this record states why I treat that reading as a coachable, expected skill — and how I use it to explain why expectations differ across teams and company phases. The runnable version — the checklist I hand an engineer landing in a new team, or watching their company change around them — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**Most \"underperformance\" I've seen was a context mismatch, not a skill gap.** The careful engineer who polishes in wartime reads as slow; the fast-shipping pragmatist in peacetime reads as sloppy; the platform engineer who goes heads-down for a quarter without talking to customers reads as absent. In each case the skills were fine — the behavior was tuned to a different environment. That is why I coach environment-reading explicitly instead of letting engineers discover the local rules through failed review cycles.\n\n**Product and platform teams reward different instincts, and engineers switch between them blind.** A product engineer's standout move is judgment about users: suggesting improvements, thinking through edge cases, validating outcomes after launch. A platform engineer's standout move is customer empathy pointed inward: knowing who builds on the platform, making feedback easy, understanding downstream impact. An engineer moving between the two while keeping the same habits will do honest work that lands as mediocre — so the first question I ask anyone joining a team is which type of team they think they've joined.\n\n![Split diagram of the same engineer: on a product team the arrow points to end users and outcomes, on a platform team it points to internal engineer customers.](assets/images/thriving-in-different-environments/product-vs-platform-instincts.jpeg)\n**Figure 1:** *Same engineer, different instincts: product teams reward judgment about users; platform teams reward customer empathy pointed inward.*\n\n\n\n**Wartime and peacetime invert the scoreboard, and the transition is silent.** In wartime, bypassed process and blunt conflict are features; in peacetime the same behavior is a liability. The danger is the transition: companies rarely announce the mode change, and engineers keep optimizing for the previous game — polishing during a fight for survival, or bulldozing through process long after peace returned. The source's recognition signs (deadlines, meetings, conflict tolerance, work-life posture) are precisely the instruments I point engineers at — and in wartime I add its warning explicitly: manage stress and burnout actively, and treat job stability as uncertain.\n\n![An instrument panel with a central dial between wartime and peacetime and smaller gauges for deadlines, meetings, conflict, and work-life posture.](assets/images/thriving-in-different-environments/mode-instrument-panel.jpeg)\n**Figure 2:** *The mode is read off instruments, not announcements: deadlines, meetings, conflict tolerance, and work-life posture tell you which game the company is playing.*\n\n\n\n**Company type sets who must see your work.** In Big Tech, the system sees you: reviews and promotion committees run on tracked evidence and relationships across a big organization. At a scaleup, your accumulated knowledge is the asset — tenure pays only when it's converted into impact and shared through onboarding and documentation. At a startup, only outcomes matter, and it is on you to find the high-impact work by talking to founders and customers — and to make sure the people steering the company know what landed. Same engineer, three different visibility games; I coach whichever one my company is currently playing.\n\n**The universal set is what survives every environment — and it's mostly about other people.** Under all the contingency, the source ends on invariants: know what the company values, do standout work by its standards, help others succeed, keep relationships alive, resolve conflict professionally, never burn bridges. Careers are long and environments are temporary; the colleagues you helped and the bridges you kept follow you across every team type, mode, and company. That is the part I hold engineers to unconditionally.\n\n![The same small core of icons — helping others, relationships, standout work, an intact bridge — carried unchanged across four different environment scenes.](assets/images/thriving-in-different-environments/universal-set-core.jpeg)\n**Figure 3:** *Environments are temporary; the universal set travels: standout work by local standards, helping others, kept relationships, and no burned bridges.*\n\n\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| Read the environment — team type, mode, company type — before optimizing behavior. | Environments excuse everything — the universal set holds everywhere, in every mode. |\n| In wartime, ship fast, accept good-enough, and don't take bluntness personally. | Wartime is permanent or free — it burns people, so stress is managed and options stay open. |\n| In peacetime, invest in quality, alliances, and longer-term initiatives. | Peacetime means coasting — comfort and boredom are named failure modes. |\n| Adapt your working style when the company shifts modes or phases. | Chameleon opportunism — adapting style is not abandoning standards or integrity. |\n| Different company types reward different visibility games — play the one you're in. | Visibility replaces substance — the work must be standout by the company's own standards. |\n| Help others succeed and keep every bridge intact. | Nice-to-have — it is the invariant that pays across every environment for decades. |\n\nConcretely: an engineer joining one of my teams hears, in their first weeks, what type of team this is, what mode the company is in, and what standout work looks like here specifically — and when the environment shifts, we name the shift in 1:1s and adjust expectations explicitly, instead of letting people fail against rules that changed silently.\n\n## Anti-Patterns\n\n- **Judging behavior without reading context.** Calling the wartime pragmatist sloppy or the peacetime quality-investor slow, when each is playing their environment correctly.\n- **Playing the previous game.** Keeping peacetime habits after the company has gone to war — or wartime habits long after peace — because nobody announced the mode change.\n- **The heads-down platform team.** Building a platform for a quarter without talking to the engineers who use it, then discovering the downstream impact was imaginary.\n- **Spec-implementing on a product team.** Shipping exactly what was written, never suggesting improvements or validating outcomes — honest work that never becomes standout.\n- **Startup work nobody steering the company sees.** Creating real value at a startup while founders remain unaware — at that company type, unseen impact effectively didn't happen.\n- **Wartime heroics without a fuse.** Running wartime pace indefinitely without managing stress and burnout, or noticing that job stability is uncertain either way.\n- **Comfortable peacetime drift.** Using stability to stagnate — no longer-term initiatives, no new alliances, just maintenance until boredom curdles into disengagement.\n- **Burning bridges on exit or in conflict.** Winning a local fight at the cost of relationships that would have paid across the next twenty years of the same industry.\n\n## Related Records\n\n- [Engineering Career Paths](engineering-career-paths.html) — choosing and evaluating environments; this record is thriving inside the one you're in.\n- [Changing Jobs](changing-jobs.html) — when engineer and environment are truly mismatched, the move — done well — is the answer.\n- [Own Your Career](own-your-career.html) — the ownership contract; reading the environment is part of owning the career.\n- [Promotions](promotions.html) — the promotion case is always judged by an environment's standards; this record explains why those standards differ.\n- [Managing a Downturn](managing-downturn.html) — the manager's-side companion for the hardest wartime: leading a team through a downturn.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs how I set expectations across different teams and company phases, and how I coach engineers to read team type, company mode, and company type — while holding the universal set everywhere. I revisit it when the company visibly changes mode or growth phase (the expectations conversation must be rerun, not assumed), when a strong engineer's work stops landing after a team change — the signal of a context mismatch, not a skill loss — or if I catch myself judging behavior without first naming the environment it was tuned for.\n\n## Authoritative References\n\n- Gergely Orosz, *The Software Engineer's Guidebook* (2023) — the Thriving in Different Environments chapter this record distills, via its companion checklist.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "4 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record — the one I hand an engineer landing in a new team or watching the company change around them. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Identify your team type\n\n**Product team**\n\n- [ ] I understand the customer/user problem my team is solving.\n- [ ] I know how my work affects product, business, or user outcomes.\n- [ ] I regularly talk with product managers, designers, data scientists, support staff, and users.\n- [ ] I suggest product improvements, not just implement specs.\n- [ ] I think through edge cases and tradeoffs before shipping.\n- [ ] I validate whether a feature worked after launch.\n- [ ] I build product intuition over time by learning from outcomes.\n\n**Platform team**\n\n- [ ] I understand who uses my platform and what they need.\n- [ ] I know whether my customers are internal engineers, product teams, business teams, or end users.\n- [ ] I make it easy for users to contact me and give feedback.\n- [ ] I communicate proactively with teams building on the platform.\n- [ ] I work side by side with platform customers when useful.\n- [ ] I spend time with product teams to understand downstream impact.\n- [ ] I balance deep focus with urgency when priorities change.\n\n## 2. Recognize company mode: wartime or peacetime\n\n**Wartime signs**\n\n- [ ] The company faces existential or intense competitive pressure.\n- [ ] Shipping quickly matters more than perfect quality.\n- [ ] Deadlines are treated as mandatory.\n- [ ] Meetings are reduced in favor of execution.\n- [ ] Conflict is tolerated if it helps get important work done.\n- [ ] Processes may be bypassed to move faster.\n- [ ] Work-life balance is weak or deprioritized.\n\n**Peacetime signs**\n\n- [ ] The business has little immediate pressure.\n- [ ] Quality, alignment, and validation matter more than speed.\n- [ ] Deadlines are useful but not always critical.\n- [ ] Meetings are common to maintain alignment.\n- [ ] Conflict is discouraged.\n- [ ] Process is expected to be followed.\n- [ ] Work-life balance is a visible priority.\n\n## 3. Adjust your behavior to the mode\n\n**To thrive in wartime**\n\n- [ ] I prioritize getting important work done quickly.\n- [ ] I accept \"good enough\" when speed matters more than perfection.\n- [ ] I don't take blunt feedback or conflict personally.\n- [ ] I build only the alliances needed to unblock execution.\n- [ ] I stay aligned with my manager and skip-level leadership.\n- [ ] I focus on business-critical priorities.\n- [ ] I treat job stability as uncertain and keep options open.\n- [ ] I manage stress and burnout actively.\n\n**To thrive in peacetime**\n\n- [ ] I prioritize high-quality execution.\n- [ ] I avoid unnecessary conflict.\n- [ ] I build relationships and alliances across teams.\n- [ ] I manage upward, sideways, and downward.\n- [ ] I work on longer-term initiatives that benefit the business.\n- [ ] I use stability to improve systems and processes.\n- [ ] I keep momentum without stagnating.\n- [ ] I avoid becoming too comfortable or bored.\n\n## 4. Understand your company type\n\n**Big Tech / large tech company**\n\n- [ ] I know whether my team is closer to product or platform work.\n- [ ] I track my individual impact clearly.\n- [ ] I keep evidence of achievements for reviews and promotion.\n- [ ] I build relationships across the organization.\n- [ ] I help others, knowing relationships may matter later.\n- [ ] I understand how performance reviews and promotions work.\n\n**Mid- or late-stage scaleup**\n\n- [ ] I understand whether tenure is valuable in my organization.\n- [ ] I use company knowledge to create impact.\n- [ ] I help improve onboarding or knowledge sharing.\n- [ ] I know whether my team is viewed as a cost center or profit center.\n- [ ] I understand the company's growth phase and risk level.\n- [ ] I stay alert during slowing growth or restructuring.\n\n**Early-stage startup**\n\n- [ ] I understand how my work helps the company reach product-market fit.\n- [ ] I talk with founders, teammates, and customers to find high-impact work.\n- [ ] I know the company may be risky or unstable.\n- [ ] I use autonomy to move fast and take initiative.\n- [ ] I make sure founders and leaders are aware of impactful work.\n- [ ] I focus on creating value, not just completing assigned tasks.\n- [ ] I prioritize getting the most important things done quickly.\n\n## 5. Universal checklist for any company\n\n- [ ] I know what my company values most: speed, quality, impact, reliability, or growth.\n- [ ] I adapt my working style to the current environment.\n- [ ] I do standout work by my company's standards.\n- [ ] I help people around me succeed.\n- [ ] I maintain strong relationships with peers and former colleagues.\n- [ ] I resolve conflicts professionally.\n- [ ] I avoid burning bridges.\n- [ ] I regularly reassess whether the company has shifted modes.\n- [ ] I stay ready to adapt when the environment changes.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why there is no context-free \"great engineer\" — and how to read the environment you're in — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. ARLO: an engineer newly stepping into management, buzz-cut hair, zip-up hoodie with rolled sleeves, sticker-covered laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Arlo presents the same document twice — one team cheers, the other frowns at a clock.](assets/images/thriving-in-different-environments/comic-01-same-work-different-verdict.jpeg)\n**Panel 1:** *The hook: the same behavior earns applause in one environment and a frown in another.*\n\n![Comic panel: Arlo holds a great-engineer trophy, confused between doorways marked with different environment icons.](assets/images/thriving-in-different-environments/comic-02-no-context-free-great.jpeg)\n**Panel 2:** *The problem: there is no context-free 'great engineer' — each environment defines standout work differently.*\n\n![Comic panel: Arlo calmly polishes a small ornament while the building burns and colleagues run with buckets behind him.](assets/images/thriving-in-different-environments/comic-03-playing-the-previous-game.jpeg)\n**Panel 3:** *The wrong way: playing the previous game — polishing in wartime, or bulldozing in peace — after a silent mode change.*\n\n![Comic panel: Vera hands Arlo a compass in front of a chart asking team, mode, and company.](assets/images/thriving-in-different-environments/comic-04-read-the-environment.jpeg)\n**Panel 4:** *The principle: reading the environment — team type, company mode, company type — is a core engineering skill.*\n\n![Comic panel: Arlo talks with an end user on one side and hands a feedback card to an engineer on a platform slab on the other.](assets/images/thriving-in-different-environments/comic-05-product-vs-platform.jpeg)\n**Panel 5:** *How it runs: on a product team the customer holds a phone; on a platform team the customer is another engineer.*\n\n![Comic panel: Arlo and Vera study a wall dial between storm and sun zones with small gauges beside it.](assets/images/thriving-in-different-environments/comic-06-wartime-peacetime-dial.jpeg)\n**Panel 6:** *The mechanic: diagnose the mode from the instruments — deadlines, meetings, conflict tolerance — because the transition is silent.*\n\n![Comic panel: Arlo ships boxes fast in a storm as his battery icon runs low and Vera steadies his shoulder.](assets/images/thriving-in-different-environments/comic-07-wartime-has-a-fuse.jpeg)\n**Panel 7:** *The cost: wartime pace is real and so is the burn — manage stress actively and treat stability as uncertain.*\n\n![Comic panel: Arlo carries a glowing kit with star, heart, handshake, and bridge icons through different environment zones as colleagues wave.](assets/images/thriving-in-different-environments/comic-08-the-universal-set.jpeg)\n**Panel 8:** *The closer: environments are temporary — standout work, helping others, kept relationships, and unburned bridges pay everywhere.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
