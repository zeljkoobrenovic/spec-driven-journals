<script id="data" type="application/json">{"meta": {"id": "EM-OWN-YOUR-CAREER", "status": "draft:gray", "title": "Own Your Career", "date": "2026-07-28", "author": "Željko Obrenović", "permalink": "own-your-career", "timetoread": "6 min", "excerpt": "I can open doors, advocate, and coach — but I cannot drive anyone's career for them. So I coach every engineer into a concrete ownership habit set: define what you want, build a reputation for finishing, keep a work log, ask for feedback on specific work, give feedback well, make your manager an ally, and pace yourself between stretching, executing, and coasting. The engineers who practice these habits are the ones I can actually help.", "tags": "engineering management, career development, work log, feedback, manager relationship, pacing, coaching", "icon": "assets/icons/own-your-career.png", "logo": "assets/images/own-your-career/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering management", "career development", "work log", "feedback", "manager relationship", "pacing", "coaching"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: I cannot drive anyone's career for them — I can advocate, open doors, and coach, but the direction and the evidence have to come from the engineer. So I coach every engineer into a concrete habit set: know what you want and say it, finish what you commit to and make the finish visible, keep a work log, ask for feedback on specific work and give feedback generously, treat your manager as an ally rather than an obstacle or a savior, and pace yourself deliberately between stretching, executing, and coasting. Career ownership is not politics and not luck; it is habits — and the engineers who practice them are the ones I can actually help.\n\n## Statement\n\nWhat I expect engineers to own, and what I coach them into:\n\n- **Take charge — do not wait for me.** I expect every engineer to define what they want from their career, communicate their goals and interests regularly, look for opportunities to grow, and create chances for others to give them feedback. A manager who has to guess your goals will guess wrong.\n- **Be seen as someone who gets things done.** Finish the work you commit to, at high quality and a good pace; focus on impactful work over busywork; understand the team's and business's priorities; and make sure your manager and team know when important work lands — with measurable impact where possible.\n- **Keep a work log.** Record important work weekly: projects, decisions, code reviews, design docs, meetings, support work — with links to the artifacts. Review it regularly with me, and use it both as review-and-promotion evidence and as a tool to decide what to prioritize, stop, or decline.\n- **Ask for feedback on specific work.** Not \"how am I doing?\" but \"what went well and what could be improved in this design, this incident, this presentation?\" — from teammates, managers, product partners, and anyone you work with. Clarify vague feedback with concrete examples, ask about impact, and actually adjust.\n- **Give feedback as well as you take it.** Call out good work when you see it and mean it; keep critical feedback on situations, observations, and impact; make clear it is your observation, not absolute truth; never phrase it as an order to someone you do not manage; end the conversation positively.\n- **Make your manager an ally.** Regular 1:1s, honest sharing of what you are working on and where you want to grow, understanding my goals and challenges, delivering what you agree to — and giving updates *early* when a commitment is slipping. Trust built this way is what my advocacy runs on.\n- **Pace yourself.** Notice whether you are stretching, executing, or coasting; stretch when it grows you, execute enough to stay reliable, do not coast so long that motivation dies — and ask for support before overload becomes burnout.\n\n![Diagram of an engineer at the hub of a seven-spoke habit wheel — goals, finish, work log, ask, give, ally, pace — while a manager holds a door open outside the wheel.](assets/images/own-your-career/ownership-habit-wheel.jpeg)\n**Figure 1:** *Ownership is a habit set, not luck: seven habits the engineer drives — while the manager's part is opening doors.*\n\n## How to Read This\n\nThis journal is my engineering-management operating model. This record is grounded in the \"Own Your Career\" chapter material from Gergely Orosz's *The Software Engineer's Guidebook* (2023), read from the manager's side: the career-ownership habits I coach engineers into, and what I owe in return when they practice them. The engineer's side of the manager–report contract in [Management 101](management-101.html) is this record in miniature. The runnable version — written in the engineer's first person, as the source has it — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**A manager who has to guess your goals will guess wrong — and most managers are guessing.** The Guidebook's first instruction is the one I repeat most: do not wait for your manager to drive your growth. I manage multiple people, each with different ambitions, and my picture of what each person wants decays fast unless they refresh it. The engineers who state their goals plainly get staffed onto the work that serves those goals; the ones who stay silent get staffed by convenience. That is not favoritism — it is the information I was given.\n\n**Reputation compounds from finishing, not from starting.** \"Gets things done\" is the single most portable reputation an engineer can build, and it is built from three parts the source keeps separate for a reason: finishing what you commit to, choosing impactful work over busywork, and making sure the right people know when important work completes. I coach the third part hardest, because good engineers resist it as self-promotion. It is not — silent completion reads as no completion from where I sit, and I refuse to let an engineer's review depend on my memory.\n\n**The work log is the cheapest high-leverage habit in this record.** Fifteen minutes a week recording projects, decisions, reviews, and support work — with links — solves three problems at once: it makes performance reviews and promotion cases a matter of assembly rather than archaeology, it gives our 1:1s a factual backbone, and, least obviously, it is a prioritization instrument. An engineer who reads their own log can see where their time actually went, and use that to decide what to stop or say no to. I ask to see the log periodically not to audit it, but because reviewing it together is where the coaching happens.\n\n![Diagram of one work log fanning out into three uses: promotion evidence, a backbone for one-on-ones, and a prioritization list with an item crossed out.](assets/images/own-your-career/work-log-three-uses.jpeg)\n**Figure 2:** *One log, three payoffs: review evidence by assembly instead of archaeology, a factual backbone for 1:1s, and a tool for deciding what to stop.*\n\n**Feedback only flows to people who make it cheap to give.** Vague requests (\"any feedback for me?\") produce polite nothing. Specific requests tied to concrete work produce usable answers, and asking about impact — not just quality — is what turns feedback into behavioral change. The reciprocal habit matters just as much: an engineer who gives specific, honest, well-framed feedback becomes someone colleagues trust with the truth, which is exactly the raw material their own growth needs.\n\n**Pacing is a career-length concern, and both failure modes are silent.** The source names three modes — stretching, executing, coasting — and the skill is noticing which one you are in. Permanent stretch ends in burnout; permanent coast ends in stagnation and quiet disengagement. I watch for both, but I cannot see them as early as the engineer can, which is why the commitment I coach is \"ask for support before overload becomes burnout\" and \"address low motivation instead of ignoring it.\" An engineer who tells me they are coasting gets a challenge; one who hides it gets a surprise review.\n\n![Diagram of a career path alternating between stretch, execute, and coast segments, with burnout and stagnation marked as hazard zones at the two extremes.](assets/images/own-your-career/pacing-three-modes.jpeg)\n**Figure 3:** *Pacing is deliberate alternation: stretch, execute, coast — and both failure modes, burnout and stagnation, are silent until raised.*\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| The engineer defines and communicates career goals; I staff and advocate against them. | I design anyone's career for them — direction is theirs to set. |\n| Make completed work visible, with measurable impact where possible. | Self-promotion theater — visibility is reporting finished work, not marketing unfinished work. |\n| Keep a work log and review it with me regularly. | The log is surveillance — it is the engineer's evidence and prioritization tool; I only see what we review together. |\n| Ask for feedback on specific work, from many sources. | Act on every piece of feedback — take it seriously, then decide thoughtfully what to adopt. |\n| Make your manager an ally: early updates, honest 1:1s, delivered commitments. | Manage up with flattery — the alliance is built on transparency, not agreement. |\n| Stretch deliberately, and coast deliberately when recovery is needed. | Maximum intensity always — sustainable pacing beats permanent stretch. |\n\nConcretely: every engineer on my teams can tell me what they want from the next stage of their career, show a work log that is current within two weeks, name the last piece of specific feedback they asked for and what they changed because of it, and tell me — before I discover it — whether they are currently stretching, executing, or coasting.\n\n## Anti-Patterns\n\n- **Waiting to be discovered.** Doing excellent work silently and assuming the organization will notice — then reading the flat review as proof of politics rather than of missing information.\n- **Busywork mistaken for impact.** Full calendars and fast responses with nothing finished that the team's priorities actually needed.\n- **The empty-handed review.** Arriving at performance review time with no log, no links, no metrics — reconstructing a year from memory and losing half of it.\n- **Fishing for reassurance.** Asking \"any feedback?\" in a way calibrated to produce praise, and clarifying nothing when the answer is vague.\n- **Feedback as ammunition.** Giving critique framed as absolute truth or as orders to peers, spending trust the giver has not earned.\n- **Manager as adversary — or as savior.** Hiding slipping commitments until they explode, or outsourcing all career thinking to the 1:1 and calling it ownership.\n- **Unnoticed coasting.** Months of low-challenge work with motivation quietly draining, ignored instead of raised — until the engineer resigns \"unexpectedly.\"\n\n## Related Records\n\n- [Management 101](management-101.html) — the two-sided contract this record is half of: what I owe every report, and what I ask every report to own — this is the report's half, expanded.\n- [Performance Reviews](performance-review-cycle.html) — working the review cycle itself; the goals, work log, and feedback habits here are what make that record cheap to execute.\n- [Promotions](promotions.html) — the promotion case is assembled from the evidence this record's habits produce.\n- [The Art of Feedback](feedback.html) — my side of the feedback craft as a manager; this record asks engineers to practice the same craft peer-to-peer.\n- [Career Conversations](../grounded-people-management-tools/career-conversations.html) (people journal) — the manager-run conversation about a person's whole arc; this record is what the engineer does between those conversations.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs the career-ownership habits I coach engineers into at every level, and the advocacy I owe engineers who practice them. I revisit it when a strong engineer is surprised by a review outcome despite following these habits (a signal my side of the contract failed), when the company changes its review or promotion machinery in ways that shift what evidence matters, or when work logs drift into compliance theater instead of a tool engineers use for themselves.\n\n## Authoritative References\n\n- Gergely Orosz, *The Software Engineer's Guidebook* (Pragmatic Engineer, 2023) — the career-ownership chapter this record distills, via the \"Own Your Career\" checklist.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "4 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record — the one I hand the engineer, in the engineer's own voice. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Take charge of your career\n\n- [ ] I have defined what I want from my career\n- [ ] I am not waiting for my manager to drive my growth\n- [ ] I regularly communicate my goals and interests\n- [ ] I look for opportunities to grow, learn, and improve\n- [ ] I create chances for others to give me feedback\n\n## 2. Be seen as someone who gets things done\n\n- [ ] I finish the work I commit to\n- [ ] I deliver work of high quality and at a fast pace\n- [ ] I focus on impactful work, not just busy work\n- [ ] I understand my team's and business's priorities\n- [ ] I make sure my manager and team know when I complete important work\n- [ ] I share measurable impact when possible\n\n## 3. Keep a work log\n\n- [ ] I record important work each week\n- [ ] I track projects, decisions, code reviews, design docs, meetings, and support work\n- [ ] I note links to tickets, documents, pull requests, or artifacts\n- [ ] I capture work that may be useful for performance reviews or promotions\n- [ ] I review my log regularly with my manager\n- [ ] I use my log to decide what to prioritize, stop, or say \"no\" to\n\n## 4. Ask for feedback\n\n- [ ] I ask for feedback on specific work, not vague personal feedback\n- [ ] I seek feedback from teammates, managers, product partners, and others I work with\n- [ ] I ask what went well and what could be improved\n- [ ] I clarify vague feedback with concrete examples\n- [ ] I ask about the impact of my actions\n- [ ] I use feedback to adjust my behavior or approach\n\n## 5. Give feedback to others\n\n- [ ] I call out good work when I see it\n- [ ] I give specific positive feedback, and only when I genuinely mean it\n- [ ] I focus critical feedback on situations, observations, and impact\n- [ ] I avoid making feedback sound like an order unless I am responsible for managing that person\n- [ ] I give constructive feedback in person or by video when appropriate\n- [ ] I make it clear that my feedback is my observation, not an absolute truth\n- [ ] I end feedback conversations positively\n\n## 6. Make your manager an ally\n\n- [ ] I have regular 1:1s with my manager\n- [ ] I share what I have been working on\n- [ ] I discuss my goals and growth areas\n- [ ] I understand my manager's goals and challenges\n- [ ] I deliver what I agree to do\n- [ ] I give updates early when I cannot meet a commitment\n- [ ] I build trust by being open, honest, and transparent\n- [ ] I help my manager recognize my work by making my contributions visible\n- [ ] I ask my manager for specific feedback\n\n## 7. Pace yourself\n\n- [ ] I notice when I am stretching, executing, or coasting\n- [ ] I take on stretch work when it helps me grow\n- [ ] I avoid stretching so much that I risk burnout\n- [ ] I spend enough time executing reliably\n- [ ] I recognize when I am coasting for too long\n- [ ] I address low motivation or lack of challenge instead of ignoring it\n- [ ] I ask for support before overload becomes burnout\n- [ ] I balance growth, reliability, and recovery over the long term\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why nobody can drive your career for you — and the habit set that lets your manager actually help — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. ARLO: an engineer newly stepping into management, buzz-cut hair, zip-up hoodie with rolled sleeves, sticker-covered laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Arlo works alone at a glowing desk while a corridor of closed doors ignores him.](assets/images/own-your-career/comic-01-waiting-to-be-discovered.jpeg)\n**Panel 1:** *The hook: excellent work, done silently, waiting for the organization to notice.*\n\n![Comic panel: Arlo holds a thin flat review sheet and blames politics in a thought bubble.](assets/images/own-your-career/comic-02-the-flat-review.jpeg)\n**Panel 2:** *The problem: the flat review that follows — read as proof of politics, when it is proof of missing information.*\n\n![Comic panel: Arlo slides a tangled yarn ball labeled my career across the table to Vera.](assets/images/own-your-career/comic-03-outsourcing-the-career.jpeg)\n**Panel 3:** *The wrong way: handing the whole tangle to the manager — a savior cannot drive a career any more than an adversary can.*\n\n![Comic panel: Vera unrolls a seven-spoke habit wheel diagram in front of Arlo.](assets/images/own-your-career/comic-04-ownership-is-habits.jpeg)\n**Panel 4:** *The principle: ownership is a habit set — goals, finishing, evidence, feedback, alliance, pacing — not luck and not politics.*\n\n![Comic panel: Arlo hands Vera a goal card while she matches it against open slots on a project board.](assets/images/own-your-career/comic-05-say-what-you-want.jpeg)\n**Panel 5:** *How it runs: say what you want — a manager who has to guess your goals will guess wrong, and staff you by convenience.*\n\n![Comic panel: Arlo writes a weekly line in a small work-log notebook with link icons, clock showing fifteen minutes.](assets/images/own-your-career/comic-06-the-work-log.jpeg)\n**Panel 6:** *The mechanic: fifteen minutes a week in the work log — review evidence, 1:1 backbone, and a tool for saying no, all in one notebook.*\n\n![Comic panel: Arlo shows Vera a slipping commitment on a calendar long before the deadline while she calmly notes it.](assets/images/own-your-career/comic-07-the-early-update.jpeg)\n**Panel 7:** *The cost: telling your manager early when a commitment slips — the trust that advocacy runs on is built from exactly these moments.*\n\n![Comic panel: Vera holds a door open as Arlo walks through carrying his notebook and goal flag.](assets/images/own-your-career/comic-08-doors-open-for-owners.jpeg)\n**Panel 8:** *The closer: I can open doors and advocate — but the engineers who practice these habits are the ones I can actually help.*\n"}]}]}</script>

                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
