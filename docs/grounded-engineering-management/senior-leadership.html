<script id="data" type="application/json">{"meta": {"id": "EM-SENIOR-LEADERSHIP", "status": "draft:gray", "title": "Senior Leadership", "date": "2026-07-28", "author": "Željko Obrenović", "permalink": "senior-leadership", "timetoread": "7 min", "excerpt": "At the top of the engineering ladder the job reduces to four tasks — gather and synthesize information, nudge rather than command, decide under incomplete inputs, and role-model the values — run through a role whose real shape I clarify rather than assume from the title. Everything I say and do at this level echoes, so I change priorities cleanly, deliver bad news personally, define a True North for my function, and build trust rather than fear.", "tags": "engineering management, senior leadership, executive, strategy, CTO, communication, trust", "icon": "assets/icons/senior-leadership.png", "logo": "assets/images/senior-leadership/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering management", "senior leadership", "executive", "strategy", "CTO", "communication", "trust"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: At the top of the engineering ladder the job reduces to four core tasks — gathering and synthesizing information, nudging instead of over-commanding, deciding from conflicting and incomplete inputs, and role-modeling the company's values — and all four run through an echo: everything a senior leader says and does carries extra weight. A casual comment redirects work; a dumped anxiety multiplies through the organization; an undefined standard becomes whatever each team improvises. So I treat discipline in communication, priorities, and trust not as executive polish but as the work itself, and I never assume my title tells me what my job is — I clarify the role, match my time to the company's actual stage, and reassess as it grows.\n\n## Statement\n\nMy commitments as a senior engineering leader — and what I hold anyone in a VP-of-Engineering or CTO seat accountable for:\n\n- **Lead first.** I set the tone for how people act, think, and work together; I am explicit about what the organization should value; I make hard decisions without waiting for perfect information; and I hold people and teams accountable for outcomes. I disagree when needed, then commit once a decision is made.\n- **Do the four core tasks deliberately.** I gather information from meetings, docs, 1:1s, and stakeholders; synthesize it quickly; share the right information with the right people in a usable form; nudge instead of over-commanding; decide from conflicting and incomplete inputs; and role-model the company's values and commitments.\n- **Know which job I actually have.** I clarify whether the role is primarily R&D, strategy, organization, execution, external-facing, infrastructure, or business-oriented — titles do not mean the same thing at every company — and I match my time to the real needs of the company's stage, reassessing as it grows.\n- **Change priorities without chaos.** Before demanding a shift I confirm the true top priority, explicitly decide what will stop, slip, or be deprioritized, communicate up, down, and across, and repeat the key messages more than once.\n- **Set strategy from evidence and judgment.** I research the team, systems, bottlenecks, and business direction; talk to executives, peers, and engineers before drafting; think about architecture, team structure, and future business needs together; and make strategy forward-looking, not just reactive.\n- **Deliver bad news personally and honestly.** No impersonal mass messages for sensitive news; key individuals hear it first; and I never deliver a message I fundamentally cannot stand behind alone.\n- **Respect the echo.** Everything I say and do at this level carries extra weight, so I model the behavior I want copied, keep casual comments and vented anxieties out of circulation, and detach enough to lead clearly and fairly — without stopping being human.\n- **Build trust, not fear.** I get curious before reacting, treat disagreement as information rather than disloyalty, apologize honestly when I mess up, and hold people accountable without humiliating them — because people who fear me tell me what is safe, not what is true.\n- **Define my function's True North.** I am explicit about what excellence means, use risk analysis instead of absolutism, protect quality, readiness, and operational standards, and teach my leaders to make fast decisions using these principles.\n\n## How to Read This\n\nThis journal is **my engineering-management operating model**, each record grounded in one source. This record distills the \"Big Leagues\" chapter of Camille Fournier's *The Manager's Path* (O'Reilly, 2017) — the senior-leadership rung: the four core tasks, the VP-of-Engineering and CTO role shapes, changing priorities, strategy, bad news, the nontechnical boss, senior peers, the echo of leadership, trust, and True North. I write it as an executive who occupies this rung and holds others to it. The runnable version lives in the **Checklist** tab.\n\n## Rationale\n\n**The job compresses into four tasks because everything else is delegated.** By this level I no longer write the code, run the projects, or manage most of the people directly. What remains is **what cannot be delegated**: gathering and synthesizing large amounts of information, moving it to the right people in a usable form, making decisions from conflicting and incomplete inputs, and being the living example of what the company says it values. Fournier's point is that this is the whole job — and each task done badly **fails silently**, because nobody reviews an executive's synthesis or grades their nudges.\n\n![Diagram of a leader at the center of four task nodes, with echo rings radiating outward to teams.](assets/images/senior-leadership/four-core-tasks-echo.jpeg)\n**Figure 1:** *The four core tasks are the whole job — and all four run through an echo that amplifies everything the leader says and does.*\n\n**Titles are not job descriptions, so I clarify the role instead of assuming it.** A CTO at one company is a hands-on architect; at another, a business strategist with no reports. A VP of Engineering owns day-to-day execution and operational health, tracks multiple initiatives without losing the details, aligns roadmap, hiring plan, and team structure, and coaches managers — a job of **management strength backed by technical credibility**. A CTO's job is **business strategy seen through the lens of technology**: focused on the company's current stage, keeping enough management influence to move the organization, and protecting the tech team from becoming a feature factory for others. Taking either seat without clarifying which shape the company actually needs — and reassessing as it grows — is how senior leaders fail while working hard.\n\n![Two-panel diagram contrasting a VP of Engineering close to teams and operations with a CTO looking at business strategy through a technology telescope.](assets/images/senior-leadership/vp-vs-cto-role-shapes.jpeg)\n**Figure 2:** *VP and CTO are different jobs: one owns day-to-day execution and operational health, the other sees business strategy through technology — and neither title means the same thing at every company.*\n\n**Priority changes and bad news are where senior communication is really tested.** Anyone can communicate good news and stable plans. When priorities shift, I confirm the shift is real, **decide explicitly what stops or slips**, push for clarity on tradeoffs and in-flight work, and repeat the message until everyone shares the same understanding of reality — because a priority change communicated once is a priority change most of the organization never heard. When the news is bad, it goes to key individuals first, personally, honestly about likely outcomes, through trusted lieutenants or HR where appropriate — and I ask myself how I would want to hear it. A message I fundamentally cannot stand behind alone is a message I do not deliver. The same discipline runs upward and sideways: with a nontechnical boss I arrive with a clear agenda, bring solutions rather than problems, and repeat important issues until they land; with senior peers I disagree directly and kindly in the room, then present **a united front** once the decision is made.\n\n![Pipeline diagram of a clean priority change: confirm, decide what stops, communicate in all directions, repeat the message.](assets/images/senior-leadership/priority-shift-pipeline.jpeg)\n**Figure 3:** *A priority change is a pipeline, not an announcement: confirm it, decide explicitly what stops, communicate in every direction, and repeat until everyone shares the same reality.*\n\n**Everything I say echoes, so detachment is a kindness, not a coldness.** My words carry extra weight now: a casual comment in a hallway redirects a team's week; over-socializing with a few reports reads as favoritism to everyone else; an anxiety I vent becomes the organization's anxiety by Friday. The echo does not mean going silent — it means **modeling the behavior I want copied**, staying human and caring without slipping back into \"buddy\" mode, and detaching enough to lead clearly and fairly.\n\n**Trust, not fear, is what makes the rest work — and True North is what makes it fast.** If people are afraid to take risks around me, my information-gathering is already broken: I hear **what is safe, not what is true**. So I get curious before reacting, treat disagreement as information rather than disloyalty, apologize honestly and briefly when I mess up, and hold people accountable without humiliating them. On top of that trust I define a True North for my function — explicit standards for judgment calls, risk analysis instead of absolutism, a clear line on which risks are acceptable and when — so my leaders can make **fast decisions using shared principles** instead of escalating everything to me.\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| The senior job is the four core tasks: gather, synthesize, nudge, decide, model. | The senior leader stays the best engineer in the room — technical depth serves credibility, not day-to-day output. |\n| Clarify the real shape of the role; titles differ across companies. | VP and CTO are interchangeable — **they are different jobs**, and a company may need one, both, or a different split. |\n| Nudge instead of over-commanding. | Never decide — I make hard calls without waiting for perfect information, and hold people accountable for outcomes. |\n| Repeat priority changes until everyone shares the same reality. | Announce once and assume alignment — **repetition is the mechanism**, not a failure of the first message. |\n| Deliver bad news personally, key individuals first. | Carry every message alone — trusted lieutenants, managers, and HR are legitimate channels when appropriate. |\n| Detach enough to lead clearly and fairly. | Stop being human — I stay caring and connected without slipping into buddy mode or favoritism. |\n| Define a True North and teach leaders to decide with it. | Absolutism — the standards run on risk analysis, and they are revisited as the company and systems evolve. |\n\nConcretely: I can **name which shape my current role is** and how I spend my time against it; my last priority shift came with an explicit list of what stopped and a message repeated in more than one forum; my function has a **written True North my leaders actually use** in judgment calls; and I get coaching and a peer network outside the company, because at this level nobody inside it will fully play that role.\n\n## Anti-Patterns\n\n- **Assuming the title is the job.** Taking a CTO or VP seat and doing what that title meant at the last company, instead of clarifying what this company at this stage needs.\n- **Commanding instead of nudging.** Issuing detailed orders into organizations I no longer see clearly, instead of setting direction and letting the people closest to the work decide.\n- **The silent priority shift.** Demanding a new top priority without deciding what stops, slips, or gets deprioritized — so teams quietly keep everything and deliver nothing.\n- **The mass-email bad news.** Delivering sensitive news through impersonal broadcast, so key people learn about their own situation at the same moment as everyone else.\n- **Jargon at the nontechnical boss.** Burying the CEO in technical detail instead of arriving with a clear agenda, solutions rather than problems, and issues repeated until they land.\n- **Undermining peers after the meeting.** Relitigating a senior peer's decision in front of the wider org instead of disagreeing directly and kindly, then presenting a united front.\n- **Dumping executive anxieties on the team.** Venting the pressures of the seat downward, forgetting the echo — my worry becomes the organization's crisis.\n- **Leading by fear.** Reacting before getting curious, treating disagreement as disloyalty, humiliating people in the name of accountability — and then wondering why nobody takes risks or tells me the truth.\n\n## Related Records\n\n- [Managing Managers](managing-managers.html) — the rung below this one; the discipline of managing through managers is what the VP-of-Engineering shape scales up.\n- [Management 101](management-101.html) — the base contract with every report; the echo of leadership makes the same contract heavier, not different.\n- [Operational Excellence](operational-excellence.html) — the concrete operational bar behind this record's True North commitment to quality, readiness, and operational standards.\n- [First 90 Days](../grounded-engineering-executive/first-90-days.html) (executive journal) — the ramp into a senior seat is where \"know your role\" is first tested against reality.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs how I operate in senior engineering leadership roles — VP of Engineering, CTO, or equivalent — and what I hold others in those seats accountable for. I revisit it when the company's stage shifts enough that **my role shape should change and hasn't**, when a priority shift or bad-news moment goes badly enough to expose a gap in these commitments, or when the self-assessment in the Checklist tab shows I no longer understand the company's future and bottlenecks.\n\n## Authoritative References\n\n- Camille Fournier, *The Manager's Path: A Guide for Tech Leaders Navigating Growth and Change* (O'Reilly, 2017) — Chapter 9, \"The Big Leagues,\" which this record's checklist distills.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "4 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Lead first\n\n- [ ] Set the tone for how people act, think, and work together\n- [ ] Be clear about what the organization should value\n- [ ] Make hard decisions without waiting for perfect information\n- [ ] Understand the business context, not just the technical one\n- [ ] Help the organization follow through on needed change\n- [ ] Hold people and teams accountable for outcomes\n- [ ] Disagree when needed, then commit once a decision is made\n\n## 2. Do the four core management tasks\n\n- [ ] Gather information from meetings, docs, 1:1s, and stakeholders\n- [ ] Synthesize large amounts of information quickly\n- [ ] Share the right information with the right people in a usable way\n- [ ] Nudge instead of over-commanding\n- [ ] Make decisions from conflicting and incomplete inputs\n- [ ] Role-model the company's values and commitments\n\n## 3. Know your role\n\n- [ ] Clarify whether the role is primarily R&D, strategy, organization, execution, external-facing, infrastructure, or business-oriented\n- [ ] Match my time to the real needs of the company's stage\n- [ ] Avoid assuming titles mean the same thing at every company\n- [ ] Reassess the role as the company grows\n\n## 4. If the role is VP of Engineering\n\n- [ ] Own day-to-day execution and operational health\n- [ ] Track multiple initiatives without losing the details\n- [ ] Align roadmap, hiring plan, and team structure\n- [ ] Coach managers and grow leadership on the team\n- [ ] Improve processes and organizational effectiveness\n- [ ] Build trust through management strength and technical credibility\n- [ ] Stay close enough to the work to understand what is really happening\n\n## 5. If the role is CTO\n\n- [ ] Treat the role as a business strategy job, not a pure engineering job\n- [ ] Shape business strategy through the lens of technology\n- [ ] Focus on the company's current stage of evolution\n- [ ] Maintain enough management influence to move the organization\n- [ ] Protect the tech team from becoming a feature factory for others\n- [ ] Keep reporting power or equivalent influence where it matters\n- [ ] Stay accountable for both technical direction and organizational outcomes\n\n## 6. Change priorities well\n\n- [ ] Confirm the true top priority before demanding a shift\n- [ ] Explicitly decide what will stop, slip, or be deprioritized\n- [ ] Communicate changes up, down, and across the org\n- [ ] Make sure everyone shares the same understanding of reality\n- [ ] Repeat key messages more than once\n- [ ] Push for clarity on tradeoffs, timelines, and in-flight work\n- [ ] Help teams change direction without chaos\n\n## 7. Set strategy\n\n- [ ] Research the team, systems, bottlenecks, and business direction\n- [ ] Talk to executives, peers, and engineers before drafting a strategy\n- [ ] Combine evidence with my own judgment\n- [ ] Turn broad ideas into actionable plans\n- [ ] Think about architecture, team structure, and future business needs together\n- [ ] Tailor strategy communication to the audience, especially the board\n- [ ] Make strategy forward-looking, not just reactive\n\n## 8. Deliver bad news well\n\n- [ ] Do not rely on impersonal mass messages for sensitive news\n- [ ] Talk to key individuals first when possible\n- [ ] Be honest about likely outcomes\n- [ ] Do not deliver a message I fundamentally cannot stand behind alone\n- [ ] Use trusted lieutenants, managers, or HR when appropriate\n- [ ] Think about how I would want to hear the news myself\n\n## 9. Manage a nontechnical boss\n\n- [ ] Avoid jargon and unnecessary technical detail\n- [ ] Come to 1:1s prepared with a clear agenda\n- [ ] Bring solutions, not just problems\n- [ ] Ask for advice respectfully\n- [ ] Repeat important issues when needed\n- [ ] Show support and initiative\n- [ ] Find coaching and development outside of my boss if necessary\n\n## 10. Work well with senior peers\n\n- [ ] Respect peers' ownership of their areas\n- [ ] Let peers make decisions in their own domain\n- [ ] Address disagreements directly and kindly\n- [ ] Build trust across different working styles\n- [ ] Avoid undermining peers in front of the wider org\n- [ ] Present a united front after decisions are made\n- [ ] Communicate technical complexity in a way nontechnical peers can understand\n\n## 11. Understand \"the echo\" of leadership\n\n- [ ] Remember that my words carry extra weight\n- [ ] Avoid over-socializing with direct reports in ways that create favoritism\n- [ ] Detach enough to lead clearly and fairly\n- [ ] Be careful not to accidentally redirect work through casual comments\n- [ ] Model the behavior I want copied\n- [ ] Do not dump executive anxieties onto the team\n- [ ] Stay human and caring without slipping back into \"buddy\" mode\n\n## 12. Build trust, not fear\n\n- [ ] Notice whether people seem afraid to take risks around me\n- [ ] Practice relatedness and basic human connection\n- [ ] Apologize honestly and briefly when I mess up\n- [ ] Get curious before reacting or attacking\n- [ ] Treat disagreement as information, not disloyalty\n- [ ] Hold people accountable without humiliating them\n- [ ] Create safety for questions, mistakes, and learning\n\n## 13. Define the team's True North\n\n- [ ] Be explicit about what excellence means in my function\n- [ ] Define the standards the team should use in judgment calls\n- [ ] Use risk analysis instead of absolutism\n- [ ] Decide what kinds of risks are acceptable and when\n- [ ] Protect quality, readiness, and operational standards\n- [ ] Teach my leaders to make fast decisions using these principles\n- [ ] Revisit standards as the company and systems evolve\n\n## 14. Assess yourself regularly\n\n- [ ] Get coaching or mentorship outside the company\n- [ ] Build a peer network outside the workplace\n- [ ] Identify senior leaders I admire and why\n- [ ] Review how I handled the last priority shift\n- [ ] Check whether I understand the company's future and bottlenecks\n- [ ] Audit my relationships with the senior leadership team\n- [ ] Ask whether my team sees me as a role model\n- [ ] Examine whether I listen enough\n- [ ] Stay connected to people as humans, not just as resources\n- [ ] Clarify the principles I want my managers and engineers to follow\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why everything a senior leader says and does echoes — and why discipline in words, priorities, and trust is the job itself — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. ARLO: an eager early-career engineer climbing the ladder — in some strips a new lead or manager, in others the engineer being coached — buzz-cut hair, zip-up hoodie with rolled sleeves, sticker-covered laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: a leader makes a casual hallway remark while behind him a team frantically starts a rewrite.](assets/images/senior-leadership/comic-01-the-hallway-echo.jpeg)\n**Panel 1:** *The hook: at the top, a casual hallway comment redirects a team's week.*\n\n![Comic panel: echo rings spread from a small speech bubble across a floor of worried team figures.](assets/images/senior-leadership/comic-02-everything-carries-weight.jpeg)\n**Panel 2:** *The problem: everything a senior leader says carries extra weight — a vented anxiety becomes the organization's anxiety by Friday.*\n\n![Comic panel: a leader in a paper crown labeled CTO strides confidently away from a signpost pointing the other way.](assets/images/senior-leadership/comic-03-the-title-is-not-the-job.jpeg)\n**Panel 3:** *The wrong way: assuming the title is the job — doing what it meant at the last company instead of what this company needs.*\n\n![Comic panel: a whiteboard with four icons — gather, nudge, decide, model — presented as the whole job.](assets/images/senior-leadership/comic-04-four-tasks-one-job.jpeg)\n**Panel 4:** *The principle: the job reduces to four tasks — gather and synthesize, nudge rather than command, decide on incomplete inputs, model the values.*\n\n![Comic panel: a leader raises one project flag while explicitly marking another lane stopped.](assets/images/senior-leadership/comic-05-change-priorities-cleanly.jpeg)\n**Panel 5:** *How it runs: change priorities cleanly — confirm the shift, decide out loud what stops, and repeat the message until it lands.*\n\n![Comic panel: a mentor hands over a compass labeled True North while team leads navigate forks with their own compasses.](assets/images/senior-leadership/comic-06-true-north.jpeg)\n**Panel 6:** *The mechanic: a written True North — explicit standards and risk analysis — lets leaders decide fast without escalating everything upward.*\n\n![Comic panel: a leader steps away from a team gathering to personally deliver a difficult message.](assets/images/senior-leadership/comic-07-the-cost-of-detachment.jpeg)\n**Panel 7:** *The cost: bad news is delivered personally — never by broadcast, never a message you cannot stand behind.*\n\n![Comic panel: an engineer freely reports bad news while the leader reacts with curiosity instead of anger.](assets/images/senior-leadership/comic-08-trust-not-fear.jpeg)\n**Panel 8:** *The closer: build trust, not fear — when people can safely tell you the truth, the four tasks finally work.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
