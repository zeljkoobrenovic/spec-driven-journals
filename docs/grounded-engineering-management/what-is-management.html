<script id="data" type="application/json">{"meta": {"id": "EM-WHAT-IS-MANAGEMENT", "status": "draft:gray", "title": "What Is Management", "date": "2026-07-28", "author": "Željko Obrenović", "permalink": "what-is-management", "timetoread": "6 min", "excerpt": "Management is getting better outcomes from a group of people working together — a multiplier effect, not my personal output plus a title. I work the job through three levers: purpose, people, and process. I judge my management by the team's results, present and future, not by my own activity, and I run an honest self-check on whether I actually want this job before taking or keeping it.", "tags": "engineering management, management fundamentals, purpose, people, process, leadership, team outcomes", "icon": "assets/icons/what-is-management.png", "logo": "assets/images/what-is-management/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering management", "management fundamentals", "purpose", "people", "process", "leadership", "team outcomes"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: Management is one job: getting better outcomes from a group of people working together. A team can achieve more than any one person alone, so my value as a manager is the multiplier effect — not my individual output plus a title. I work that job through three levers — purpose, people, and process — and I judge myself by the team's results, present and future, never by how busy I am. Before I take or keep the role, I check honestly that I want the day-to-day work of management, because a manager who doesn't is a tax on the team, not a multiplier.\n\n## Statement\n\nMy operating model for the management job itself:\n\n- **The job is outcomes through a group, not output from me.** I focus on getting better outcomes from a group of people working together, and I aim for a multiplier effect rather than adding my own individual contribution on top.\n- **I work three levers: purpose, people, process.** Everything a manager can improve reduces to these three, and I deliberately invest in all of them rather than defaulting to the one I find most comfortable.\n- **Purpose means the team knows what success looks like and why it matters.** I check that people actually care about the goal, and I reinforce purpose in meetings, goals, and day-to-day communication — not just in kickoff decks.\n- **People means the right skills, real motivation, and trusting relationships.** I hire and develop well, understand each person's strengths and weaknesses, watch team happiness, support career goals, and give individuals what they need to do their best work.\n- **Process means work moves smoothly without me in every loop.** Who does what is clear, how decisions get made is defined, meetings are effective, we learn from past mistakes, the team culture stays healthy, and I plan for tomorrow, not just today.\n- **I judge my management by the team's results.** Present outcomes and whether the team is set up for great future outcomes — asking \"am I creating valuable, easy-to-use, well-crafted work through this team?\" and \"am I building a strong, satisfied team?\" — not by my activity level.\n- **I run the self-check before taking or keeping the role.** Do I enjoy the day-to-day work of management, am I motivated by helping a team achieve an outcome, am I comfortable spending much of my time talking with people, can I provide stability in emotionally challenging situations, and am I willing to adapt into the leader my team needs?\n\n## How to Read This\n\nThis journal is **my engineering-management operating model**, each record grounded in one source and written as a commitment I hold myself — and the managers who work for me — to. This record distills the opening of Julie Zhuo's *The Making of a Manager* (Portfolio/Penguin, 2019): her definition of the management job, the purpose–people–process frame, how to judge a manager, and the self-check on whether you should want the role at all. The runnable version lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**A team can achieve more than one person alone — that is the entire reason the role exists.** If a manager's presence doesn't make the group's outcome better than the sum of individual efforts, **the role is overhead**. This is why I refuse to measure management by personal output: a manager still acting mainly as an individual contributor is doing a different job and leaving the actual one vacant. My time shifts from doing the work myself to enabling others to do it, and I accept that much of that enabling work is **unglamorous but necessary**.\n\n![Two scenes contrasting a manager adding one block of personal output with a manager multiplying a team's shared outcome.](assets/images/what-is-management/adder-vs-multiplier.jpeg)\n**Figure 1:** *The value of the role is the multiplier effect: a manager still measuring themselves by personal output is doing a different job while the real one sits vacant.*\n\n**Purpose, people, and process are a complete decomposition of the job — and most managers over-invest in one.** Zhuo's frame is useful precisely because it is exhaustive: any improvement I can make to a team lands in one of the three. Engineers promoted into management tend to gravitate to process, because it feels like engineering; purpose and people feel softer and get deferred. But a team with crisp processes and no shared sense of why the work matters **ships efficiently in the wrong direction**, and a team whose members lack skills or motivation can't be processed into performing. I audit myself against all three levers, and I put deliberate effort into **the ones I would naturally skip**.\n\n![Illustration of three levers labeled purpose, people, and process lifting a tilting block of team outcomes, with only the process lever being pulled.](assets/images/what-is-management/three-levers.jpeg)\n**Figure 2:** *The three levers are a complete decomposition of the job — and a team lifted by only the comfortable lever ships efficiently in the wrong direction.*\n\n**Results are the only honest scorecard — and results have a time dimension.** Activity is easy to generate and easy to mistake for management. The two questions I actually ask are about outcomes: is this team producing valuable, easy-to-use, well-crafted work now, and is it set up for great future outcomes? The second half matters as much as the first — a manager can **strip-mine a team for a great quarter** and leave it hollow. Building a strong, satisfied team is not a nice-to-have alongside delivery; it is **what makes future delivery possible**.\n\n![Balance scale weighing present results against future outcomes, with a crossed-out heap of busy activity excluded on the floor.](assets/images/what-is-management/results-scorecard-two-horizons.jpeg)\n**Figure 3:** *The scorecard has two halves — valuable work now and a team set up for the future — and the manager's own busyness is not on the scale.*\n\n**Trust and inspiration outperform instruction.** People do their best work **when they want to follow**, not when they are merely told what to do. So I build trust and respect deliberately, inspire people to act rather than just directing them, and adapt to what this team and this organization need — rather than importing a fixed leadership persona and expecting the team to adapt to me.\n\n**The self-check is not a formality — the wrong person in the role damages everyone under it.** Management is a day-to-day discipline of conversations, emotional stability, and other people's growth. Someone who took the role for status, or because it was the only promotion path, and who does not enjoy that day-to-day, will neglect the levers and the team will feel it **long before the org chart does**. I ask the self-check questions of myself honestly and recurringly, and I ask them of every engineer considering the move.\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| The job is better outcomes from a group working together. | The manager's own technical output stops mattering entirely — it just stops being the measure of the job. |\n| Aim for a multiplier effect on the team. | Multiply by adding headcount or meetings — the multiplier comes from purpose, people, and process. |\n| Work all three levers deliberately. | Give each lever equal time every week — the mix depends on what the team currently lacks. |\n| Judge management by present and future team results. | Judge only by this quarter's delivery — a hollowed-out team is **a failed result arriving late**. |\n| Inspire people to act; build trust so they want to follow. | Never give direct instruction — **clarity is still part of the job**; command-and-control as the default is not. |\n| Run the self-check before taking or keeping the role. | One bad week means quitting management — the check is about the day-to-day work over time, not a mood. |\n\nConcretely: for each team I manage, I can say what success looks like and **confirm the team can say it too**; I know each person's strengths, motivation level, and career direction; the team's decision-making and ownership rules are written down; and my own review of myself starts from **team outcomes, not from my calendar**.\n\n## Anti-Patterns\n\n- **The player who kept playing.** Taking the manager title and continuing to act only as an individual contributor — measuring myself by personal output while the purpose, people, and process levers go untouched.\n- **Activity as evidence.** Judging my management by how many meetings I ran and messages I answered instead of by what the team produced and how the team is doing.\n- **Purpose by kickoff deck.** Stating the mission once and assuming it stuck, instead of reinforcing what success looks like and why it matters in meetings, goals, and daily communication.\n- **The single-lever manager.** Working only the comfortable lever — usually process for ex-engineers — while skills gaps, motivation problems, or a missing sense of purpose compound.\n- **Strip-mining the team.** Optimizing present outcomes while burning trust, happiness, and development — great quarters, hollow team, and the bill arrives with attrition.\n- **Telling instead of inspiring.** Relying on instruction and authority instead of building the trust and respect that make people want to follow.\n- **The reluctant manager who stays.** Keeping the role despite failing the self-check — not enjoying the conversations, the emotional load, or the day-to-day — because stepping back feels like demotion. The team pays for that pride.\n\n## Related Records\n\n- [Management 101](management-101.html) — the two-sided contract with each report that operationalizes the \"people\" lever from the manager's first rung.\n- [Leading a Small Team](leading-a-small-team.html) — this definition applied at the first concrete scale: trust, 1:1s, performance clarity, and fit on a small team.\n- [Managing Yourself](managing-yourself.html) — the manager's inner game; the self-check in this record is the entry gate to that ongoing work.\n- [Getting Things Done](getting-things-done.html) — the \"process\" lever expanded: how the team actually plans and executes.\n- [First 90 Days](../grounded-engineering-executive/first-90-days.html) (executive journal) — judging by future outcomes at executive scope; the same results-not-activity scorecard, one level up.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs how I define, do, and evaluate the management job itself, on my own teams and for the managers I hold accountable. I revisit it if I catch myself **reporting activity instead of team outcomes** for a full review cycle, if a team I manage cannot state what success looks like when asked, or if my honest answer to any self-check question stays \"no\" for more than a quarter.\n\n## Authoritative References\n\n- Julie Zhuo, *The Making of a Manager: What to Do When Everyone Looks to You* (Portfolio/Penguin, 2019) — the opening chapter on what management is, which this record distills.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "3 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Core job\n\n- [ ] Focus on getting better outcomes from a group of people working together\n- [ ] Remember that a team can achieve more than one person alone\n- [ ] Aim to create a multiplier effect, not just add my own individual output\n- [ ] Improve the team's purpose, people, and process\n\n## 2. Purpose\n\n- [ ] Make sure the team knows what success looks like\n- [ ] Make sure the team understands why the work matters\n- [ ] Check that people care about achieving the goal\n- [ ] Reinforce purpose in meetings, goals, and day-to-day communication\n\n## 3. People\n\n- [ ] Build a team that works well together\n- [ ] Support team members in reaching career goals\n- [ ] Hire and develop people well\n- [ ] Keep an eye on team happiness and satisfaction\n- [ ] Make sure people have the right skills for the work\n- [ ] Make sure people are motivated\n- [ ] Build trusting relationships with team members\n- [ ] Understand each person's strengths and weaknesses\n- [ ] Give individuals what they need to do their best work\n\n## 4. Process\n\n- [ ] Create processes that help work move smoothly and efficiently\n- [ ] Clarify who should do what\n- [ ] Define how decisions should be made\n- [ ] Run effective meetings\n- [ ] Learn from past mistakes\n- [ ] Plan for tomorrow, not just today\n- [ ] Help create and maintain a healthy team culture\n\n## 5. How I judge my management\n\n- [ ] Evaluate myself by my team's results, not just my activity\n- [ ] Look at my team's present outcomes\n- g)\n**Panel 1:** *The hook: the title arrives — and the new manager keeps doing his old job.*\n\n![Comic panel: team members drift in different directions behind a manager absorbed in his own work.](assets/images/what-is-management/comic-02-the-drifting-team.jpeg)\n**Panel 2:** *The problem: while the manager measures his own output, the group's outcome falls apart.*\n\n![Comic panel: a manager proudly displays an overloaded calendar while a mentor looks unimpressed.](assets/images/what-is-management/comic-03-activity-as-evidence.jpeg)\n**Panel 3:** *The wrong way: activity as evidence — a full calendar is easy to generate and easy to mistake for the job.*\n\n![Comic panel: a mentor draws a whiteboard equation contrasting one person's output with a team's multiplied outcome.](assets/images/what-is-management/comic-04-the-multiplier.jpeg)\n**Panel 4:** *The principle: management is one job — better outcomes from a group of people working together, a multiplier, not your output plus a title.*\n\n![Comic panel: a manager reaches for two dusty levers labeled purpose and people beside a shiny, already-pulled process lever.](assets/images/what-is-management/comic-05-three-levers.jpeg)\n**Panel 5:** *How it runs: three levers — purpose, people, process — worked deliberately, including the ones an ex-engineer would naturally skip.*\n\n![Comic panel: a manager reads a two-sided scorecard about present work and future team strength, his calendar in the bin.](assets/images/what-is-management/comic-06-the-two-questions.jpeg)\n**Panel 6:** *The mechanic: the scorecard is two questions — is the team producing valuable, easy-to-use, well-crafted work, and is it set up for great future outcomes?*\n\n![Comic panel: a manager faces a mirror whose reflection shows him listening to a teammate, with a self-check note on the frame.](assets/images/what-is-management/comic-07-the-self-check.jpeg)\n**Panel 7:** *The cost: an honest, recurring self-check — a manager who does not want the day         });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
