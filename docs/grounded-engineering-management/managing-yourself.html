<script id="data" type="application/json">{"meta": {"id": "EM-MANAGING-YOURSELF", "status": "draft:gray", "title": "Managing Yourself", "date": "2026-07-28", "author": "Željko Obrenović", "permalink": "managing-yourself", "timetoread": "6 min", "excerpt": "The first person I manage is me. I keep a written, reality-checked picture of my strengths, weaknesses, and triggers — calibrated against what my manager and trusted coworkers actually say, not against my inner critic. I engineer the conditions I work best in, protect my wellbeing as an operational necessity, treat imposter-syndrome stories as claims to be tested against evidence, and run a deliberate learning loop so I get better faster than the job gets harder.", "tags": "engineering management, self-management, self-awareness, imposter syndrome, wellbeing, learning, resilience", "icon": "assets/icons/managing-yourself.png", "logo": "assets/images/managing-yourself/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering management", "self-management", "self-awareness", "imposter syndrome", "wellbeing", "learning", "resilience"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: The first person I manage is me, and I refuse to do it by feel. I keep a written picture of my strengths, weaknesses, and triggers — and I calibrate that picture against reality by asking my manager and trusted coworkers, because self-knowledge that never leaves my own head is just my inner critic wearing a lab coat. I treat imposter-syndrome stories as claims to be tested against evidence, engineer the conditions I do my best work in, protect my wellbeing as operational necessity rather than indulgence, and run a deliberate learning loop — because a manager who is not managing themselves is managing everyone else worse.\n\n## Statement\n\nMy operating model for managing myself has six parts:\n\n- **Self-knowledge is written down, not felt.** I keep an explicit inventory: my top strengths and biggest weaknesses, the words people close to me would use to describe me, the traits that made me succeed before, the positive feedback I hear most often, my inner-critic patterns, and the situations that reliably trigger self-doubt or overreaction.\n- **The inventory is calibrated against reality.** I ask my manager where my biggest growth opportunities are, what holds me back from greater impact, and how my skills compare with the ideal person in my role. I ask three to seven trusted coworkers for honest, specific feedback — including task-specific feedback right after presentations, meetings, and projects — and I thank them without getting defensive.\n- **Imposter-syndrome stories get tested, not obeyed.** When I catch myself telling a worst-case story, I pause and ask what evidence I actually have, consider alternative explanations, and swap the fixed-mindset framing for a growth one. Discomfort is part of learning, not proof I am failing; early confusion in a management role is normal.\n- **I engineer my best conditions and know my triggers.** I identify the conditions I do my best work in, structure my calendar around them, protect time for thinking, and get enough sleep. I know which people and situations set me off, and I pause and cool down before responding or deciding when triggered.\n- **Wellbeing is operational, not optional.** Boundaries around work time, short non-work breaks in the day, time for exercise, hobbies, family, and friends — a manager whose work consumes all mental space has no reserve left for the moments that need it.\n- **I run a deliberate learning loop.** I ask for feedback often, use my manager as a coach rather than only an evaluator, bring hard problems early, learn from peers and mentors, review my week in writing, set six-month goals and revisit them — and I aim at better, not perfect, playing to my own strengths instead of copying someone else's style.\n\n## How to Read This\n\nThis journal is my engineering-management operating model, each record grounded in one source. This record distills the self-management chapter of Julie Zhuo's *The Making of a Manager* (Portfolio/Penguin, 2019) — her argument that the first half of the management journey is **learning to manage yourself**: your self-image, your fears, your energy, and your growth. The runnable version — the full self-inventory, calibration questions, and routines — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**Uncalibrated self-knowledge is just my inner critic with better vocabulary.** Everyone carries a self-image; the question is whether it matches what other people actually experience. Zhuo's move is to force the calibration: write the self-assessment down, then check it against my manager's view of my growth opportunities and against honest feedback from a handful of trusted coworkers. **Where the pictures disagree, reality wins.** This is also why I ask for specific, task-anchored feedback rather than general praise — \"that went well\" **calibrates nothing**.\n\n![Diagram of a written self-inventory receiving feedback arrows from a manager and three coworkers, with some lines corrected and others confirmed.](assets/images/managing-yourself/self-inventory-calibration.jpeg)\n**Figure 1:** *The written inventory is only half the tool; the calibration against manager and coworker feedback is what makes it real.*\n\n**Imposter syndrome is a story, and stories can be cross-examined.** The worst-case narrative — I'm failing, they've noticed, it was a mistake to give me this job — presents itself as perception but is **actually an interpretation**. So I treat it like any other unverified claim: what evidence do I actually have, and what alternative explanations fit the same facts? Zhuo's reassurance matters here because it is **factual, not motivational**: early confusion in management is the normal state, so treating discomfort as proof of failure misreads the data.\n\n![Diagram of a storm-cloud thought bubble weighed on a scale against solid evidence blocks, with alternative-explanation bubbles branching to the side.](assets/images/managing-yourself/imposter-story-cross-examined.jpeg)\n**Figure 2:** *The worst-case story presents itself as perception; weighed against actual evidence and alternative explanations, it usually loses.*\n\n**My output tracks my conditions more than my willpower.** I do measurably better work under some conditions — certain kinds of blocks on the calendar, protected thinking time, enough sleep, routines that support focus and recovery — and measurably worse under others. **Engineering those conditions is higher-leverage** than trying to out-discipline bad ones. The same logic applies to triggers: I cannot prevent certain people and situations from setting me off, but knowing my triggers in advance **turns a reflex into a pause** — and decisions made after cooling down are consistently better than replies fired while hot.\n\n**Wellbeing is what keeps my judgment available when it matters.** Boundaries, breaks, exercise, and time with family and friends are **not rewards for finishing the work**; they are what preserves the mental space the work draws on. A manager running on empty starts making their **worst decisions precisely in the hard weeks** that demand their best ones. When I am struggling, the recovery moves are equally concrete: stop punishing myself for feeling bad, name the worry directly, question my interpretation, recall challenges I have handled before, ask trusted people for help, and keep a record of small wins so progress is visible even when outcomes are not.\n\n**Learning speed is a system, and my manager is part of it.** The job gets harder every year; the only sustainable response is **getting better faster**. That does not happen by accident — it happens through a loop: frequent feedback requests, my manager used as a coach with hard problems brought early rather than confessed late, 1:1s treated as learning time, peers asked directly how they do what they do well, a weekly written review, and six-month goals that actually get revisited. The loop's aim is calibrated too: better, not perfect — good management is personal, and the goal is **a sharper version of my own style**, not an imitation of someone else's.\n\n![Circular loop of four nodes — asking for feedback, bringing hard problems early, weekly written review, six-month goals — with an upward arrow labeled better at the center.](assets/images/managing-yourself/deliberate-learning-loop.jpeg)\n**Figure 3:** *Learning speed is a system: a loop of feedback, early hard problems, written review, and revisited goals — aimed at better, not perfect.*\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| My strengths, weaknesses, and triggers are written down. | I navigate by an unexamined gut feel of who I am. |\n| The self-image is **checked against manager and peer feedback**. | Self-reflection alone is a reliable source of self-knowledge. |\n| Worst-case stories are tested against evidence. | Feeling like an imposter is proof of being one — or something to suppress. |\n| Discomfort and early confusion are part of learning. | Struggling in a new management role means I am failing at it. |\n| I engineer conditions, calendar, and routines for my best work. | **Willpower should compensate** for a hostile calendar and no sleep. |\n| Wellbeing boundaries are part of the operating model. | Boundaries are a luxury for after the hard quarter ends. |\n| I bring hard problems to my manager early, as coaching material. | My manager is an evaluator to whom I present only finished wins. |\n\nConcretely: I can show a written self-inventory and name the last time it was **corrected by someone else's feedback**. My calendar visibly reflects the conditions I work best in. When a trigger fires, there is **a pause before the reply**. And at any moment I can state my current six-month goals and what last week taught me — because the review actually happened, in writing.\n\n## Anti-Patterns\n\n- **Self-assessment in a vacuum.** Maintaining a confident picture of my strengths and weaknesses that no manager or coworker has ever been asked to confirm or correct.\n- **Obeying the worst-case story.** Letting an imposter-syndrome narrative drive decisions — declining opportunities, over-preparing, hiding problems — without ever asking what evidence supports it.\n- **Punishing myself for struggling.** Treating a bad stretch as a character verdict and adding self-criticism on top of the original problem, instead of naming the worry and working it.\n- **Replying while triggered.** Sending the message or making the call in the heat of the reaction, when I already know which situations reliably set me off.\n- **Hero-schedule wellbeing debt.** Letting work consume every boundary, break, and hobby \"temporarily,\" then wondering why judgment and patience degrade exactly when the pressure peaks.\n- **Manager as judge, not coach.** Curating what my manager sees, bringing only polished wins, and losing the coaching a hard problem raised early would have bought.\n- **Copying someone else's style.** Trying to become a different manager's impression of good management instead of playing my own strengths — forgetting that good management is personal.\n\n## Related Records\n\n- [Your First Three Months](first-three-months.html) — the transition period where self-doubt peaks and this record's calibration and imposter-syndrome disciplines matter most.\n- [What Is Management](what-is-management.html) — the definition of the job; this record covers the person doing it.\n- [Self-Awareness](../grounded-people-management-tools/self-awareness.html) (people journal) — the self-awareness toolkit; this record is that discipline applied to my own management practice, calibrated by other people's feedback.\n- [Managing Priorities and Energy](../grounded-engineering-executive/managing-energy.html) (executive journal) — the executive-level version of conditions and wellbeing; this record is the first-line-manager foundation it builds on.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs how I manage myself as a manager: the written self-inventory and its calibration against real feedback, the handling of imposter-syndrome stories and triggers, the conditions and wellbeing boundaries I maintain, and the learning loop I run. I revisit it if a self-assessment goes **six months without being checked** against anyone else's view, if I notice work consuming boundaries I had committed to protecting, or if I catch myself **hiding hard problems from my manager** rather than bringing them early.\n\n## Authoritative References\n\n- Julie Zhuo, *The Making of a Manager: What to Do When Everyone Looks to You* (Portfolio/Penguin, 2019) — the \"Managing Yourself\" chapter this record distills.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "4 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Know yourself\n\n- [ ] Identify my top strengths\n- [ ] Identify my biggest weaknesses\n- [ ] Write down 3 words people close to me would use to describe me\n- [ ] List 3 qualities I am most proud of\n- [ ] Name traits that helped me succeed in the past\n- [ ] List the most common positive feedback I receive\n- [ ] Notice my inner-critic patterns\n- [ ] Identify situations that trigger self-doubt or overreaction\n- [ ] Write down common feedback on how I could be more effective\n\n## 2. Calibrate with reality\n\n- [ ] Ask my manager where they see my biggest opportunities for growth\n- [ ] Ask my manager what is holding me back from greater impact\n- [ ] Ask how my skills compare with the ideal person in my role\n- [ ] Ask 3–7 trusted coworkers for honest feedback\n- [ ] Request specific, actionable feedback rather than general praise\n- [ ] Ask for task-specific feedback after presentations, meetings, or projects\n- [ ] Thank people for feedback without getting defensive\n\n## 3. Shift out of imposter syndrome\n\n- [ ] Notice when I am telling myself a worst-case story\n- [ ] Pause and ask: \"What evidence do I actually have?\"\n- [ ] Consider alternative explanations before assuming the worst\n- [ ] Replace fixed-mindset thoughts with growth-mindset thoughts\n- [ ] Treat discomfort as part of learning, not proof I am failing\n- [ ] Remind myself that early confusion in management is normal\n\n## 4. Understand my best conditions\n\n- [ ] Identify the conditions in which I do my best work\n- [ ] Notice what gives me energy and momentum\n- [ ] Protect time for thinking and reflection\n- [ ] Get enough sleep\n- [ ] Create routines that support focus and recovery\n- [ ] Structure my calendar in a way that helps me work well\n\n## 5. Understand my triggers\n\n- [ ] Notice which people or situations reliably set me off\n- [ ] Separate normal frustration from strong emotional triggers\n- [ ] Reflect on moments when I overreacted\n- [ ] Identify recurring pet peeves and why they affect me\n- [ ] Pause before responding when triggered\n- [ ] Cool down before making decisions or replying\n\n## 6. Build confidence when I'm struggling\n\n- [ ] Stop punishing myself for feeling bad\n- [ ] Name the worry directly instead of letting it swirl\n- [ ] Question whether my interpretation is accurate\n- [ ] Visualize handling hard situations successfully\n- [ ] Remember the previous challenges I have handled well\n- [ ] Ask trusted people for help when I am in a rut\n- [ ] Keep a record of small wins\n- [ ] Celebrate progress, not just big outcomes\n\n## 7. Protect my wellbeing\n\n- [ ] Set boundaries around work time\n- [ ] Schedule short non-work breaks into my day\n- [ ] Make time for exercise, hobbies, or rest\n- [ ] Preserve time with family and friends\n- [ ] Avoid letting work consume all mental space\n\n## 8. Learn faster as a manager\n\n- [ ] Ask for feedback often\n- [ ] Use my manager as a coach, not just an evaluator\n- [ ] Bring hard problems to my manager early\n- [ ] Treat 1:1s as learning time\n- [ ] Learn from peers and informal mentors\n- [ ] Ask skilled coworkers how they do what they do\n- [ ] Set aside regular time to reflect on what I learned\n- [ ] Review my week and write down key takeaways\n- [ ] Set goals for the next 6 months\n- [ ] Revisit goals and evaluate what worked\n- [ ] Take advantage of formal training when useful\n\n## 9. Keep perspective\n\n- [ ] Focus on becoming better, not perfect\n- [ ] Play to my strengths instead of copying someone else's style\n- [ ] Remember that good management is personal\n- [ ] Stay true to my values while improving my skills\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why the first person a manager manages is themselves — and why the inner critic never gets the last word — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. ARLO: an eager early-career engineer climbing the ladder — in some strips a new lead or manager, in others the engineer being coached — buzz-cut hair, zip-up hoodie with rolled sleeves, sticker-covered laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Vera draws a loop from Arlo's org-chart box back to himself.](assets/images/managing-yourself/comic-01-the-first-report.jpeg)\n**Panel 1:** *The hook: before the team, there is one report nobody assigned you — rsonal — aim at better, not perfect.*\n"}]}]}</script>

            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
