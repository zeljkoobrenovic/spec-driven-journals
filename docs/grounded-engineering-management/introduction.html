<script id="data" type="application/json">{"meta": {"id": "EM-INTRODUCTION", "status": "draft:gray", "title": "Introduction", "date": "2026-07-28", "author": "Željko Obrenović", "permalink": "introduction", "timetoread": "5 min", "excerpt": "This journal is my engineering-management operating model, written down as records across the whole ladder: from being managed, through mentoring, tech lead, and first-line management, to managing managers and senior leadership — plus the engineer career expectations that management exists to serve. Each record states the operating principle and ships its working checklist in the Checklist tab. Start here for the map.", "tags": "engineering management, management ladder, operating principles, introduction, career ladders", "icon": "assets/icons/introduction.png", "logo": "assets/images/introduction/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering management", "management ladder", "operating principles", "introduction", "career ladders"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **KEY POINTS:**\n>\n> * **This journal is my engineering-management operating model, written down** — 31 records covering the management ladder rung by rung, the first-line management fundamentals, the operational bar I hold software teams to, and the engineer career ladder seen from the manager's side — grounded in Camille Fournier's *The Manager's Path*, Julie Zhuo's *The Making of a Manager*, and Gergely Orosz's *The Software Engineer's Guidebook*.\n> * **Every record ships its working checklist, not just the argument** — the article states the principle I commit to and why; the **Checklist** tab carries the runnable checklist distilled from the source, ready to execute at that rung of the ladder.\n> * **Read it as an operating manual, not a book report** — the material is adapted from books I trust through a practitioner-executive lens; where my practice differs from a source, the record says so, and every record names the conditions under which I would revise it.\n\n<br>\n\nIf you work with me — as an engineer or manager in my organization, as my peer, or as my own manager — you should not have to guess what I think good management looks like at any rung of the ladder. This journal writes it down: what I owe every report and ask of them, how mentoring and the tech lead role are run, what changes when you manage a team, several teams, or other managers, what senior leadership is actually for, the operational bar I hold software teams to, and the expectations I hold engineers to as their careers grow from competent to staff and principal. Each record states the operating principle in the article; the runnable checklist lives in the record's **Checklist** tab.\n\n## Why an Executive Writes the Ladder Down\n\nBecause management quality at scale is a systems property, not a personality trait. An organization does not experience my intentions; it experiences what managers at every rung actually do — whether 1:1s happen and develop people, whether tech leads run projects or just write code, whether managers of managers hear ground truth or filtered reports, whether operational readiness is inspected or assumed. Writing the ladder down does two things: it tells the managers I work with what I will hold them to at each rung, and it tells everyone else what they are entitled to expect from their manager — including from me.\n\n![Diagram contrasting an executive's fading thought cloud with a written record propagating down every rung of a management ladder to the team.](assets/images/introduction/systems-property-not-intentions.jpeg)\n**Figure 1:** *An organization never experiences intentions — it experiences what managers at every rung actually do, so the ladder gets written down.*\n\nThis journal inherits its charter from its siblings. The [engineering-executive journal](../grounded-engineering-executive/introduction.html) commits me to an inspectable executive operating model; the [people-management-tools journal](../grounded-people-management-tools/introduction.html) carries the concrete instruments — interview loops, career conversations, performance mechanics. This journal covers the ladder itself: what each management role is for, how the step-changes between rungs work, and what the engineer's side of the contract looks like at every career stage.\n\n## What a Record Looks Like\n\nEvery record follows the same shape, so you always know where to look:\n\n| Part | What it gives you |\n| --- | --- |\n| **Status / Principle** blockquote | The operating principle in one quotable paragraph. |\n| **Statement → Rationale → Anti-Patterns** | The ADR-shaped body: what I commit to, why it holds, what it does *not* say, and the failure modes it guards against. |\n| **Checklist** tab | The working checklist distilled from the source — the part you run. |\n| **View spec** link | The authoring contract behind the post — intent, success criteria, and a decision log, versioned like everything else. |\n\nEvery record carries `status: draft`, deliberately: the material is adopted from sources I trust and adapted ahead of being fully worn in at my current scope, and each record names its own revisiting conditions.\n\n## Where the Material Comes From\n\nThree books and one article, credited openly and per record:\n\n- **Camille Fournier, *The Manager's Path*** (O'Reilly, 2017) — the management ladder, from being managed to senior leadership. The eight records in that section follow the book's chapters.\n- **Julie Zhuo, *The Making of a Manager*** (Portfolio/Penguin, 2019) — first-line management fundamentals. Ten records follow the book's chapters; [Managing a Downturn](managing-downturn.html) and [Managing Remote Teams](managing-remote-teams.html) are supplementary checklists extending the book's themes rather than chapter distillations.\n- **Gergely Orosz, *The Software Engineer's Guidebook*** (Pragmatic Engineer, 2023) — the engineer career ladder and its career mechanics, read from the manager's side.\n- **Kate Matsudaira, \"Software Managers' Guide to Operational Excellence\"** — the single record in the Operational Excellence section.\n\nThe sources are chapter checklists distilled from these books; the records state what *I* will run and hold people to, in first person, with the adaptations I have made.\n\n![Diagram of books passing through a practitioner lens and emerging as record cards that each carry an article tab and a checklist tab.](assets/images/introduction/books-to-records-pipeline.jpeg)\n**Figure 2:** *Trusted books, read through a practitioner lens, become first-person records — each shipping its argument and its runnable checklist.*\n\n## The Map\n\nFour sections after this one:\n\n- **The Manager's Path** — the ladder rung by rung: [Management 101](management-101.html), [Mentoring](mentoring.html), [Tech Lead](tech-lead.html), [Managing People](managing-people.html), [Managing a Team](managing-a-team.html), [Managing Multiple Teams](managing-multiple-teams.html), [Managing Managers](managing-managers.html), [Senior Leadership](senior-leadership.html).\n- **Operational Excellence** — the operational bar: [Operational Excellence](operational-excellence.html).\n- **The Making of a Manager** — first-line fundamentals: [What Is Management](what-is-management.html), [Your First Three Months](first-three-months.html), [Leading a Small Team](leading-a-small-team.html), [The Art of Feedback](feedback.html), [Managing Yourself](managing-yourself.html), [Amazing Meetings](amazing-meetings.html), [Hiring Well](hiring-well.html), [Getting Things Done](getting-things-done.html), [Managing a Growing Team](managing-a-growing-team.html), [Nurturing Culture](nurturing-culture.html), plus [Managing a Downturn](managing-downturn.html) and [Managing Remote Teams](managing-remote-teams.html).\n- **The Software Engineer's Guidebook** — the engineer's side of the ladder: [The Competent Software Engineer](competent-software-engineer.html), [The Well-Rounded Senior Engineer](well-rounded-senior-engineer.html), [The Pragmatic Tech Lead](pragmatic-tech-lead.html), [Staff and Principal Engineers](staff-and-principal-engineers.html), and the career mechanics: [Own Your Career](own-your-career.html), [Working the Performance Review Cycle](performance-review-cycle.html), [Promotions](promotions.html), [Changing Jobs](changing-jobs.html), [Engineering Career Paths](engineering-career-paths.html), [Thriving in Different Environments](thriving-in-different-environments.html).\n\nThe two ladders meet in the middle: [Tech Lead](tech-lead.html) (the management rung) and [The Pragmatic Tech Lead](pragmatic-tech-lead.html) (the engineer-side expectations) describe the same role from two sides, [Management 101](management-101.html) and [Own Your Career](own-your-career.html) are the two halves of the manager–report contract, and [Working the Performance Review Cycle](performance-review-cycle.html) is the engineer's side of the review the people-tools journal runs from the manager's chair. Follow the links rather than the section order if a thread pulls you.\n\n![Two parallel career ladders, management and engineering, joined by bridges at the tech lead rung and at the manager-report contract.](assets/images/introduction/two-ladders-meeting.jpeg)\n**Figure 3:** *The journal covers both ladders, and they meet in the middle: the tech lead role seen from two sides, and the manager–report contract signed from both ends.*\n\n## How to Read This Journal\n\n- **If you are a manager in my organization** — find your rung in The Manager's Path section and run its Checklist tab against yourself; then read the Making of a Manager records for the fundamentals the rung assumes.\n- **If you are an engineer** — [Management 101](management-101.html) tells you what you are entitled to expect from your manager and what I ask you to own; the Guidebook section tells you what I hold engineers to at each level and how I coach the career mechanics around it.\n- **If you are my peer or my manager** — read the Status/Principle blockquotes across the sections; that is the whole operating model in twenty minutes.\n- **If you are building your own model** — take the checklists and adapt them; that is what I did. The source books are worth your time in full, and disagreeing with my adaptations is a fine way to find your own.\n\n## Status and Revisiting\n\nThis journal is a living document. Records move from `draft` to `accepted` as practice wears them in, each on the revisiting conditions it declares for itself — and this introduction gets updated whenever the journal's shape changes.\n\n## Authoritative References\n\n- Camille Fournier, *The Manager's Path: A Guide for Tech Leaders Navigating Growth and Change* (O'Reilly, 2017).\n- Julie Zhuo, *The Making of a Manager: What to Do When Everyone Looks to You* (Portfolio/Penguin, 2019).\n- Gergely Orosz, *The Software Engineer's Guidebook* (Pragmatic Engineer, 2023).\n- Kate Matsudaira, \"Software Managers' Guide to Operational Excellence\".\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why an executive writes the whole management ladder down — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. ARLO: an eager early-career engineer climbing the ladder — in some strips a new lead or manager, in others the engineer being coached — buzz-cut hair, zip-up hoodie with rolled sleeves, sticker-covered laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Arlo stares up at a tall ladder vanishing into fog and asks what good management looks like, while Vera watches.](assets/images/introduction/comic-01-what-does-good-look-like.jpeg)\n**Panel 1:** *The hook: nobody working with me should have to guess what good management looks like at any rung.*\n\n![Comic panel: Vera contrasts an executive's faded thought cloud with a team facing an empty chair at a 1:1 table.](assets/images/introduction/comic-02-org-experiences-behavior.jpeg)\n**Panel 2:** *The problem: an organization never experiences intentions — it experiences what managers at every rung actually do.*\n\n![Comic panel: three managers each improvising the job differently while Arlo watches in dismay.](assets/images/introduction/comic-03-every-manager-improvises.jpeg)\n**Panel 3:** *The wrong way: leave the ladder unwritten and every manager improvises a different job.*\n\n![Comic panel: Vera taps a ladder whose rungs are written record cards stretching upward.](assets/images/introduction/comic-04-write-the-ladder-down.jpeg)\n**Panel 4:** *The principle: the whole management ladder, written down as records — what each rung is for and what I hold it to.*\n\n![Comic panel: Arlo holds a record card with an article tab and a checklist tab while Vera points at the checklist.](assets/images/introduction/comic-05-article-plus-checklist.jpeg)\n**Panel 5:** *How it runs: every record states the principle in the article and ships the runnable checklist in its own tab.*\n\n![Comic panel: Arlo stands on a bridge joining a manager ladder and an engineer ladder while Vera points.](assets/images/introduction/comic-06-two-ladders-meet.jpeg)\n**Panel 6:** *The mechanic: the management ladder and the engineer career ladder covered side by side — meeting at the tech lead rung and the manager–report contract.*\n\n![Comic panel: Vera stamps a record card DRAFT with source books on a shelf behind her as Arlo looks surprised.](assets/images/introduction/comic-07-draft-until-worn-in.jpeg)\n**Panel 7:** *The cost: this is an operating manual, not a book report — records stay draft until practice wears them in, and each names when it gets revised.*\n\n![Comic panel: Arlo climbs the ladder of records holding a checklist while Vera nods from below.](assets/images/introduction/comic-08-find-your-rung.jpeg)\n**Panel 8:** *The closer: find your rung, read what it commits to, and run its checklist against yourself.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
