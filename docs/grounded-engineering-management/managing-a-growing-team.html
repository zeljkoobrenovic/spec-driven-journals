<script id="data" type="application/json">{"meta": {"id": "EM-MANAGING-A-GROWING-TEAM", "status": "draft:gray", "title": "Managing a Growing Team", "date": "2026-07-28", "author": "Željko Obrenović", "permalink": "managing-a-growing-team", "timetoread": "6 min", "excerpt": "When the team grows past what direct involvement can cover, I shift from the front line to the macro view: vision, org design, delegation, and communication. I delegate big problems as a sign of trust, work deliberately to make truth easier to tell me as my authority grows, judge managers as multipliers by outcomes, and keep looking for parts of my own job someone else could do as well or better — putting myself out of a job is how the job grows.", "tags": "engineering management, delegation, scaling teams, org design, managing managers, leadership", "icon": "assets/icons/managing-a-growing-team.png", "logo": "assets/images/managing-a-growing-team/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering management", "delegation", "scaling teams", "org design", "managing managers", "leadership"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: A growing team changes the job whether I accept it or not — the only choice is whether I change with it. I shift to the macro view — vision, org design, delegation, communication — and ration direct involvement to where it matters most. Because authority makes truth expensive, I explicitly invite dissent and reward uncomfortable truths. And I judge managers as multipliers, by outcomes — \"would I hire this person again for this role?\" — applying the same test to myself: putting myself out of the current job is how the next one gets created.\n\n## Statement\n\nMy commitments as the team grows:\n\n- **Shift to the macro view, on purpose.** I accept that management changes as the team grows, move from front-line involvement to vision, org design, delegation, and communication, and stop trying to support everyone only through direct involvement. I pick and choose where my attention matters most, balancing diving in against stepping back.\n- **Make truth easier to hear.** I assume people hesitate to challenge me once I have authority, so I explicitly invite dissent, reward those who tell me uncomfortable truths, own my mistakes publicly, and use language that lowers the risk of speaking up.\n- **Delegate big problems as a sign of trust.** Delegation is a core leadership skill, not off-loading: I believe my reports can solve hard problems, publicly clarify who owns what, and stay available to coach without taking the work back.\n- **Become more people-centric.** I spend less time proving individual expertise and more time getting the best out of others — hiring strong leaders, building self-reliant teams, and communicating clearly and often. I use 1:1s to help the other person, align on people, purpose, and process, and help my managers establish healthy processes for their own teams.\n- **Judge managers as multipliers.** A manager should be a positive multiplier. I notice when one is slowing projects, making poor calls, or blocking team growth; I judge by outcomes, not effort or intent; I ask \"would I hire this person again for this role?\" — and make the hard move when the answer is no.\n- **Put myself out of a job, and spend the freed time on unique leverage.** I look for responsibilities someone else can do as well as me or better, delegate work that is important but not uniquely mine, and invest where my unique value is highest: communicating what matters across the organization, helping hire top talent, resolving priority conflicts between teams, and escalating decisions when my managers lack the full picture.\n\n## How to Read This\n\nThis journal is my engineering-management operating model, each record grounded in one source checklist. This record distills the chapter on managing a growing team from Julie Zhuo's *The Making of a Manager* (Portfolio/Penguin, 2019): the shift from managing individuals directly to managing at scale — perspective, dissent, delegation, and judging (and replacing) management, including my own role. The runnable version lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**The management style that got the team here stops working, and pretending otherwise breaks both.** With a handful of reports I can stay deep in every detail; past that point, trying to support everyone through direct involvement makes me the bottleneck and starves the actual work of the role — vision, org design, delegation, communication. The shift is not a loss of rigor; it is a change in where rigor is applied. Diving in remains legitimate, but it becomes a deliberate choice about where my attention matters most, not a default.\n\n![Split diagram showing a manager wired into every individual on the left, and elevated to vision, org design, delegation, and communication above self-running clusters on the right, with one deliberate dashed dive-in line.](assets/images/managing-a-growing-team/front-line-to-macro-shift.jpeg)\n**Figure 1:** *The shift is not a loss of rigor but a change in where it is applied: direct involvement becomes one deliberate, rationed line — not the default wiring.*\n\n**Authority silently raises the price of telling me the truth.** The same observation that was casual feedback to a peer becomes a career risk when aimed at the person who writes your performance review — so silence is the default I must assume, not an anomaly. That is why inviting dissent has to be explicit and repeated, why the messenger of an uncomfortable truth gets rewarded visibly, and why owning my mistakes publicly matters: each is a signal that lowers the price of the next hard truth. A growing team where only good news travels upward is a team whose problems I will learn about last.\n\n![Diagram of walls growing taller in front of each step of rising authority, with amber counterweights — invite, reward, own mistakes — pulling the wall down so a speech bubble can pass.](assets/images/managing-a-growing-team/rising-price-of-truth.jpeg)\n**Figure 2:** *Authority silently raises the wall in front of every uncomfortable truth; inviting dissent, rewarding messengers, and owning mistakes publicly are what pull it back down.*\n\n**Delegation is an act of trust, and half-delegation is an act of sabotage.** Giving someone a big problem says \"I believe you can solve this\" — provided ownership is clarified publicly, so the organization treats them as the owner too, and provided I coach without taking the work back. Delegating the task while retaining the decisions gives me the workload of doing it myself plus a report who has learned that ownership from me is provisional. Self-reliant teams are built from real ownership, repeatedly given.\n\n**A manager is a multiplier or a divider — and effort is not the metric.** A struggling engineer affects their own output; a struggling manager slows projects, degrades decisions, and blocks the growth of everyone under them. That asymmetry is why I judge managers by outcomes rather than effort or intent, and why the clarifying question is Zhuo's blunt one: would I hire this person again for this role? When the honest answer is no, the hard move is kinder than the slow erosion of the team that the avoidance buys.\n\n**Putting myself out of a job is the mechanism by which the job grows.** Any responsibility someone else can do as well as I can — or better — is one I should hand over, because my time is the scarcest resource I allocate and unique leverage is the only defensible use of it: cross-organizational communication, top-talent hiring, priority conflicts between teams, escalations where only I hold the full picture. The role that remains after each round of giving work away is the next, larger role — and the measure of success shifts accordingly, from what I can do to how much more the whole team can achieve.\n\n![Upward spiral diagram: hand off responsibility, gain freed time, spend it on unique leverage, and arrive at a larger role — repeating each cycle.](assets/images/managing-a-growing-team/out-of-a-job-growth-loop.jpeg)\n**Figure 3:** *Putting yourself out of the current job is the mechanism: each handoff frees capacity for unique leverage, and the role that remains is the next, larger one.*\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| I move to the macro view as the team grows. | I stop going deep — diving in stays available, rationed to where it matters most. |\n| I explicitly invite dissent and reward uncomfortable truths. | Every dissent changes the decision — it changes what I know before I decide. |\n| I delegate big problems and publicly clarify ownership. | I disappear — I stay available to coach, without taking the work back. |\n| I judge managers by outcomes as multipliers. | Effort and intent count for nothing — they matter in coaching, but not as substitutes for outcomes. |\n| \"Would I hire this person again?\" decides hard cases. | The first bad quarter ends a manager — the question is about the pattern, and it triggers action, starting with honesty. |\n| I keep giving away work others can do as well or better. | My job shrinks — the freed capacity goes to unique leverage, and the role keeps growing. |\n\nConcretely: my calendar shows macro work — vision, org design, hiring, cross-team conflicts — rather than a stack of project deep-dives; each of my leaders owns something big with their name on it publicly; my 1:1s produce help for the other person, not status for me; and at least once a year I can name a responsibility I used to hold that someone else now runs as well as I did or better.\n\n## Anti-Patterns\n\n- **Scaling by working harder.** Answering team growth with longer hours of the same front-line management instead of changing what the job is.\n- **The involvement bottleneck.** Staying deep in every detail of every project, so nothing ships faster than my calendar allows.\n- **The comfortable echo.** Never hearing disagreement and reading it as alignment, when it is actually the price of dissent having risen past what anyone will pay.\n- **Shooting the messenger, gently.** Responding to an uncomfortable truth with visible irritation — once — and then wondering why the flow of bad news stopped.\n- **Boomerang delegation.** Handing over a problem, hovering, and taking it back at the first wobble — teaching the team that ownership is decorative.\n- **Judging managers on effort.** Keeping a struggling manager in place because they work hard and mean well, while their team's projects slow and its best people leave.\n- **Hoarding the old job.** Keeping responsibilities I could hand off because they are comfortable and I am good at them — spending unique-leverage time on replaceable work.\n\n## Related Records\n\n- [Managing Multiple Teams](managing-multiple-teams.html) — the Manager's Path rung this growth leads into: running several teams through priorities, process, and delegated ownership.\n- [Managing Managers](managing-managers.html) — once the people I manage are managers, judging multipliers and making truth easy to hear become the core of the job.\n- [Leading a Small Team](leading-a-small-team.html) — the record this one grows out of: the direct, individual-level management that stops scaling past a handful of reports.\n- [Hiring Well](hiring-well.html) — hiring strong leaders is the enabling move; a growing team scales through the leaders it hires and grows.\n- [Getting Things Done](getting-things-done.html) — the execution loop must keep running without me in every room; delegation is how that discipline survives growth.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs how I manage teams that have grown past direct involvement — my own shift to macro work, the dissent I cultivate, the delegation I practice, and the standard I hold managers to, including myself. I revisit it if my calendar fills with front-line work at the expense of vision and org design, if a quarter passes without anyone telling me something I did not want to hear, or if I cannot name a responsibility I have handed off in the past year.\n\n## Authoritative References\n\n- Julie Zhuo, *The Making of a Manager: What to Do When Everyone Looks to You* (Portfolio/Penguin, 2019) — the chapter on managing a growing team this record distills.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "4 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Shift my perspective\n\n- [ ] Move from a front-line view to a macro view\n- [ ] Spend time on vision, org design, delegation, and communication\n- [ ] Accept that management changes as the team grows\n\n## 2. Adjust how I manage\n\n- [ ] Stop trying to support everyone only through direct involvement\n- [ ] Recognize when I have too many reports to stay deep in every detail\n- [ ] Find the right balance between diving in and stepping back\n- [ ] Pick and choose where my attention matters most\n\n## 3. Make truth easier to hear\n\n- [ ] Assume people may hesitate to challenge me once I have authority\n- [ ] Explicitly invite dissent and disagreement\n- [ ] Reward people who tell me uncomfortable truths\n- [ ] Own my mistakes publicly\n- [ ] Use language that lowers the risk of speaking up\n\n## 4. Get better at context switching\n\n- [ ] Prepare for meetings in advance\n- [ ] Build a reliable note-taking and task-management system\n- [ ] Create regular time for reflection\n- [ ] Accept that rapid context switching is part of the job\n\n## 5. Become more people-centric\n\n- [ ] Spend less time proving individual expertise\n- [ ] Spend more time getting the best out of other people\n- [ ] Focus on hiring strong leaders\n- [ ] Build self-reliant teams\n- [ ] Communicate clearly and often\n\n## 6. Delegate well\n\n- [ ] Treat delegation as a core leadership skill\n- [ ] Give people big problems as a sign of trust\n- [ ] Believe my reports can solve hard problems\n- [ ] Publicly clarify who owns what\n- [ ] Stay available to coach without taking the work back\n\n## 7. Build a shared vision\n\n- [ ] Use 1:1s to help the other person, not for information-gathering\n- [ ] Align on top priorities\n- [ ] Align on people, purpose, and process\n- [ ] Keep reinforcing why the work matters\n- [ ] Help my managers establish healthy processes for their own teams\n\n## 8. Address weak management honestly\n\n- [ ] Remember that a manager should be a positive multiplier\n- [ ] Notice when a manager is slowing projects, making poor calls, or blocking team growth\n- [ ] Judge based on outcomes, not just effort or intent\n- [ ] Ask: \"Would I hire this person again for this role?\"\n- [ ] Make the hard move when the answer is no\n\n## 9. Put myself out of a job\n\n- [ ] Look for responsibilities that someone else can do as well as me or better\n- [ ] Delegate work that is important but not uniquely dependent on me\n- [ ] Invest my time where my unique value is highest\n- [ ] Keep expanding my leadership capacity year over year\n\n## 10. Use my unique leverage\n\n- [ ] Identify and communicate what matters across the organization\n- [ ] Help hire top talent\n- [ ] Resolve priority conflicts between teams\n- [ ] Escalate decisions when my managers lack the full picture\n\n## 11. Keep growing with the team\n\n- [ ] Expect my role to evolve as the team grows\n- [ ] Create stretch opportunities for my leaders\n- [ ] Keep taking on bigger, less familiar challenges\n- [ ] Measure success by how much more the whole team can achieve\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why a growing team changes the manager's job whether they accept it or not — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. ARLO: an eager early-career engineer climbing the ladder — in some strips a new lead or manager, in others the engineer being coached — buzz-cut hair, zip-up hoodie with rolled sleeves, sticker-covered laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Arlo proudly shows a doubled team photo wall while juggling phone, laptop, and coffee.](assets/images/managing-a-growing-team/comic-01-the-team-doubled.jpeg)\n**Panel 1:** *The hook: the team doubles — and the job quietly becomes a different job.*\n\n![Comic panel: a bricked-solid calendar, a queue outside Arlo's door, and a project stuck at a gate shaped like Arlo.](assets/images/managing-a-growing-team/comic-02-the-calendar-bottleneck.jpeg)\n**Panel 2:** *The problem: staying deep in every detail makes the manager the bottleneck — nothing moves faster than his calendar.*\n\n![Comic panel: exhausted Arlo working alone at night surrounded by only good-news sticky notes.](assets/images/managing-a-growing-team/comic-03-scaling-by-working-harder.jpeg)\n**Panel 3:** *The wrong way: scaling by working harder — longer hours of the old job, while only good news travels upward, because nobody has yet invited dissent, rewarded a messenger, or owned a mistake out loud.*\n\n![Comic panel: Vera shows Arlo a whiteboard contrasting front-line wiring with the elevated macro view.](assets/images/managing-a-growing-team/comic-04-the-job-changes.jpeg)\n**Panel 4:** *The principle: a growing team changes the job whether you accept it or not — the only choice is whether you change with it.*\n\n![Comic panel: Arlo publicly hands a teammate a big glowing problem cube, ownership pinned on a public board.](assets/images/managing-a-growing-team/comic-05-delegate-as-trust.jpeg)\n**Panel 5:** *How it runs: delegate big problems as a sign of trust — and clarify ownership publicly, so the organization treats them as the owner too.*\n\n![Comic panel: Arlo coaches with hands behind his back while a teammate steadies a wobbling problem cube, ghost arms resisting the grab.](assets/images/managing-a-growing-team/comic-06-coach-dont-take-back.jpeg)\n**Panel 6:** *The mechanic: stay available to coach — and never take the work back, because boomerang delegation teaches the team that ownership is decorative.*\n\n![Comic panel: Arlo weighs a manager's outcomes against effort, pen hovering over the rehire question, Vera in the doorway.](assets/images/managing-a-growing-team/comic-07-the-rehire-question.jpeg)\n**Panel 7:** *The cost: judging managers by outcomes, not effort — and when the honest answer to 'would I hire them again?' is no, making the hard move.*\n\n![Comic panel: Arlo hands off his last old-job folder and steps onto a wider platform of unique-leverage icons, Vera smiling.](assets/images/managing-a-growing-team/comic-08-out-of-a-job-on-purpose.jpeg)\n**Panel 8:** *The closer: keep putting yourself out of the current job — the freed time goes to unique leverage, and that is how the next job gets created.*\n"}]}]}</script>

                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
