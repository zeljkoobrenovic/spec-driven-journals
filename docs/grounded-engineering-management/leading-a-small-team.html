<script id="data" type="application/json">{"meta": {"id": "EM-LEADING-A-SMALL-TEAM", "status": "draft:gray", "title": "Leading a Small Team", "date": "2026-07-28", "author": "Željko Obrenović", "permalink": "leading-a-small-team", "timetoread": "7 min", "excerpt": "On a small team, management reduces to a handful of relationships, so trust is the foundation and everything else is built on it. I hold a weekly 1:1 with every report focused on their priorities and growth rather than status, I keep expectations and my read of their performance transparent, I diagnose problems as skill, motivation, or fit before acting, I spend disproportionate time on my strongest people, and when fit is genuinely wrong I move the person out quickly and respectfully.", "tags": "engineering management, small teams, trust, 1:1s, performance, strengths, fit", "icon": "assets/icons/leading-a-small-team.png", "logo": "assets/images/leading-a-small-team/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering management", "small teams", "trust", "1:1s", "performance", "strengths", "fit"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: On a small team, management is a handful of relationships, and every one of them runs on trust — an environment where people tell me what they really think, bring me their biggest challenges, and where critical feedback flows both ways without being taken personally. The test I hold myself to is blunt: would my team choose to work for me again? On that foundation I run weekly 1:1s about the person's priorities and growth rather than status, keep expectations and my read of performance transparent, diagnose every problem as skill, motivation, or fit before acting on it, spend disproportionate time making strong people even better — and when the evidence says fit is wrong, I stop trying to make it work forever and move the person out quickly and respectfully.\n\n## Statement\n\nMy operating model for leading a small team:\n\n- **Trust is the foundation, and I test it honestly.** People can tell me what they really think and bring me their biggest challenges; critical feedback flows in both directions without being taken personally; 1:1s are allowed to include awkward but meaningful conversations. My standing self-check: would my team choose to work for me again?\n- **I treat each report as a person, not a performer.** I show care and respect for who they are, invest regular time in each of them, and ask more questions instead of jumping straight to advice.\n- **Every report gets a weekly 1:1 that is theirs, not mine.** At least one weekly 1:1 per direct report, focused on their priorities, growth, and obstacles — not a status update. I discuss top outcomes, calibrate what \"great\" looks like, share feedback in both directions, check how they're feeling, and ask: \"What's top of mind for you?\", \"How can I help?\", \"What was most useful about today's conversation?\"\n- **Performance is transparent, early, and diagnosed before treated.** Each report knows what I expect and how I think they're doing; I address concerns early instead of letting ambiguity linger; and I diagnose whether a problem is skill, motivation, or fit — because each has a different fix.\n- **I model vulnerability and accountability.** I admit my own mistakes quickly, apologize clearly when I get something wrong, share growth areas and uncertainties honestly, and lead with empathy during hard moments.\n- **I invest disproportionately in strengths.** I notice and name each person's strengths specifically, create opportunities to use them more, and spend extra time helping strong people get even better — refusing to let low performance consume all my attention.\n- **I protect the culture and am honest about fit.** No brilliant jerks, a high bar for collaboration and kindness — one divider can reduce the whole team's effectiveness. When someone's values, aspirations, or working style genuinely don't fit the role, I explore better-fit roles where possible and otherwise move them out quickly and respectfully.\n\n![Layered stack diagram with a wide foundation block labeled trust supporting four smaller blocks labeled 1:1s, performance, strengths, and fit.](assets/images/leading-a-small-team/trust-foundation-stack.jpeg)\n**Figure 1:** *On a small team everything is built on one foundation: 1:1s, performance clarity, strengths investment, and fit decisions all rest on trust.*\n\n## How to Read This\n\nThis journal is my engineering-management operating model. This record distills the small-team leadership chapter of Julie Zhuo's *The Making of a Manager* (Portfolio/Penguin, 2019): trust as the precondition for everything else, the shape of a useful 1:1, performance clarity, the skill–motivation–fit diagnosis, strengths-based investment, and respectful exits. The runnable version lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**Without trust, I am managing blind.** Everything a manager does on a small team — coaching, feedback, delegation, performance judgment — depends on knowing what is actually going on, and reports only surrender that information voluntarily. If people don't feel safe telling me what they really think or bringing me their biggest challenges, I learn about problems when they explode instead of when they start. That is why trust is not a soft nicety before the real work; it is the channel the real work travels through. The \"would they work for me again\" question keeps the test honest, because it is scored by them, not by me.\n\n**A 1:1 spent on status is a wasted 1:1.** Status has cheaper channels. The scarce thing a weekly 1:1 provides is dedicated attention on the report's priorities, growth, and obstacles — the conversation nobody schedules otherwise. Asking questions before giving advice matters for the same reason: the moment I jump to advice, the meeting becomes about my thinking instead of theirs, and I stop learning what I most need to know. The three closing questions — top of mind, how can I help, what was most useful — keep the meeting pointed at them and give me a running signal of whether the 1:1s are actually worth their time.\n\n**Ambiguity about performance is a manager's failure, not a report's.** Nobody should discover in a review that they have been falling short for months. Each report deserves to know what I expect and how I currently think they are doing, while there is still time to change the trajectory. And before I act on a problem, I diagnose it: a skill gap calls for coaching and opportunity; a motivation gap calls for understanding what changed; a fit gap calls for honesty about the role. Treating a fit problem with training, or a motivation problem with pressure, wastes months and erodes the trust everything else depends on.\n\n![Decision tree showing a performance problem branching into skill, motivation, and fit, each leading to a different response icon.](assets/images/leading-a-small-team/skill-motivation-fit-diagnosis.jpeg)\n**Figure 2:** *Diagnosis before treatment: a skill gap gets coaching, a motivation gap gets a conversation, a fit gap gets honesty about the role.*\n\n**Strengths compound; firefighting doesn't.** The instinctive allocation of a manager's attention is toward the weakest performer, because that is where the discomfort is. But the team's outcomes are driven mostly by what its strongest people do, and helping a strong person get even better usually returns more than dragging a struggling person to adequate. I keep deliberate time on my strongest people — noticing and naming strengths specifically, and building their work around them — precisely because nothing about the week will do it by default.\n\n![Before-and-after comparison of manager attention: all arrows on the weakest performer versus the strongest people receiving deliberate investment.](assets/images/leading-a-small-team/attention-allocation-before-after.jpeg)\n**Figure 3:** *The instinctive allocation follows the discomfort; the deliberate one follows the outcomes — strong people made even better.*\n\n**One divider costs more than their output, every time.** A brilliant jerk sets the real bar for the team, whatever the stated values say — every day they are tolerated teaches the team that collaboration and kindness are optional for the sufficiently talented. And when fit is genuinely wrong, endless \"making it work\" is not kindness: it exhausts the manager, blocks the team, and holds the person in a role where they cannot succeed. A quick, respectful move — into a better-fit role where one exists, out where one doesn't — is better for all three.\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| Build an environment where people say what they really think. | Manufacture comfort — trust is allowed to include awkward, meaningful conversations. |\n| Hold at least one weekly 1:1 with every direct report. | Use the 1:1 for status — priorities, growth, and obstacles are the agenda; status has cheaper channels. |\n| Be transparent about expectations and my current read. | Save the honest assessment for review season — concerns are raised early, while trajectory can change. |\n| Diagnose skill vs. motivation vs. fit before acting. | Every problem gets the same treatment — the diagnosis chooses between coaching, motivation work, and honesty about the role. |\n| Spend disproportionate time on the strongest people. | Ignore struggling reports — but low performance may not consume all my attention. |\n| Move people out quickly and respectfully when fit is wrong. | Fire at the first sign of trouble — exploring a better-fit role comes first, and \"quickly\" applies after the evidence is in. |\n\nConcretely: every report on my team has a weekly 1:1 that they would call useful, can state what I expect of them and how I think they're doing, and has heard me name their strengths specifically. When a performance concern exists, it has a diagnosis — skill, motivation, or fit — and a plan matched to it. And I can answer the \"would they work for me again\" question without flinching.\n\n## Anti-Patterns\n\n- **The status-meeting 1:1.** Reading the ticket board out loud once a week and calling it a relationship — the report's growth and obstacles never get a scheduled minute.\n- **Advice on reflex.** Jumping straight to solutions instead of asking questions, so the report stops bringing me problems and starts bringing me finished conclusions.\n- **Ambiguity as kindness.** Letting a performance concern linger unspoken because the conversation is uncomfortable — until the review lands as an ambush.\n- **The undiagnosed fix.** Sending a motivation problem to training, or pressuring a skill gap, because I never asked which problem it actually is.\n- **The squeaky-wheel allocation.** Letting the lowest performer absorb all my coaching time while my strongest people — the ones driving the team's outcomes — get none.\n- **Tolerating the brilliant jerk.** Excusing toxic behavior for the sake of individual output, while one divider quietly reduces the whole team's effectiveness.\n- **Making it work forever.** Cycling a poor-fit person through plan after plan when the evidence has been in for months, instead of moving them — respectfully — to a role where they can succeed.\n\n## Related Records\n\n- [What Is Management](what-is-management.html) — the job definition this record applies at small scale: better outcomes through people, people before process.\n- [Management 101](management-101.html) — the standing two-sided contract with each report; this record is that contract running week to week on a small team.\n- [The Art of Feedback](feedback.html) — the craft behind \"share feedback in both directions\" and the early performance conversations this record requires.\n- [Your First Three Months](first-three-months.html) — the ramp that precedes this steady state; the trust this record runs on is built there first.\n- [Career Conversations](../grounded-people-management-tools/career-conversations.html) (people journal) — the one-off deep conversation that gives the weekly 1:1 its motivational context, and the strengths discussion its raw material.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs how I run any team where I directly manage every member, and what I hold first-line managers reporting to me accountable for. I revisit it if 1:1s on my team drift into status meetings for more than a few weeks, if a performance concern reaches a formal review without the person having heard it from me first, or if I catch a fit problem that has been \"being made to work\" for more than a quarter without a decision.\n\n## Authoritative References\n\n- Julie Zhuo, *The Making of a Manager: What to Do When Everyone Looks to You* (Portfolio/Penguin, 2019) — the \"Leading a Small Team\" chapter this record distills.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "3 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Build trust\n\n- [ ] Create an environment where people can tell me what they really think\n- [ ] Make it safe for reports to bring me their biggest challenges\n- [ ] Give and receive critical feedback without taking it personally\n- [ ] Ask myself honestly whether my team would choose to work for me again\n- [ ] Let 1:1s include some awkward but meaningful conversations\n\n## 2. Be human\n\n- [ ] Show care and respect for each report as a person, not just as a performer\n- [ ] Invest regular time in each report\n- [ ] Hold at least one weekly 1:1 with each direct report\n- [ ] Focus 1:1s on the report's priorities, growth, and obstacles, not just status updates\n- [ ] Ask more questions instead of jumping straight to advice\n\n## 3. Run useful 1:1s\n\n- [ ] Discuss top priorities and most important outcomes\n- [ ] Calibrate what \"great\" looks like\n- [ ] Share feedback in both directions\n- [ ] Check how the person is feeling overall\n- [ ] Ask: \"What's top of mind for you right now?\"\n- [ ] Ask: \"How can I help?\"\n- [ ] Ask: \"What was most useful about today's conversation?\"\n\n## 4. Be clear about performance\n\n- [ ] Make sure each report knows what I expect\n- [ ] Be transparent about how I think they're doing\n- [ ] Address concerns early instead of letting ambiguity linger\n- [ ] Diagnose whether a problem is about skill, motivation, or fit\n\n## 5. Model vulnerability and accountability\n\n- [ ] Admit my own mistakes quickly\n- [ ] Apologize clearly when I get something wrong\n- [ ] Share growth areas and uncertainties honestly\n- [ ] Lead with empathy during hard moments\n\n## 6. Help people play to their strengths\n\n- [ ] Notice and name each person's strengths specifically\n- [ ] Create opportunities for people to use their strengths more\n- [ ] Spend disproportionate time helping strong people get even better\n- [ ] Avoid letting low performance consume all my attention\n\n## 7. Protect team culture\n\n- [ ] Refuse to tolerate brilliant jerks or toxic behavior\n- [ ] Hold a high bar for collaboration and kindness\n- [ ] Remember that one divider can reduce the whole team's effectiveness\n\n## 8. Be honest about fit\n\n- [ ] Recognize when someone's values, aspirations, or working style don't fit the role\n- [ ] Stop trying to \"make it work\" forever when evidence says otherwise\n- [ ] Explore better-fit roles when possible\n- [ ] Move people out of roles quickly and respectfully when needed\n\n## 9. Keep the big picture in mind\n\n- [ ] Remember that management is about getting better outcomes through people\n- [ ] Prioritize people first, then process\n- [ ] Build a small-team culture of honesty, debate, and collaboration\n- [ ] Leave conversations with clear next steps\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why a small team runs on trust — and why every hard people call gets a diagnosis before a treatment — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. ARLO: an engineer newly stepping into management, buzz-cut hair, zip-up hoodie with rolled sleeves, sticker-covered laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Vera taps a small org chart of five faces while a daunted Arlo looks on.](assets/images/leading-a-small-team/comic-01-a-handful-of-relationships.jpeg)\n**Panel 1:** *The hook: on a small team, management is a handful of relationships.*\n\n![Comic panel: Arlo reacts to an exploding alert while a team member hides a tangle of problems behind their back.](assets/images/leading-a-small-team/comic-02-managing-blind.jpeg)\n**Panel 2:** *The problem: without trust, problems arrive only after they explode.*\n\n![Comic panel: Arlo reads a ticket board aloud in a 1:1 while the team member looks bored.](assets/images/leading-a-small-team/comic-03-status-meeting-1-1.jpeg)\n**Panel 3:** *The wrong way: the status-meeting 1:1 — a relationship reduced to reading the board aloud.*\n\n![Comic panel: Vera points at a whiteboard drawing of a foundation block labeled trust while asking Arlo the test question.](assets/images/leading-a-small-team/comic-04-would-they-work-for-you-again.jpeg)\n**Panel 4:** *The principle: everything runs on trust — and the test is scored by them, not by you.*\n\n![Comic panel: Arlo, laptop closed, asks an open question while his             }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
