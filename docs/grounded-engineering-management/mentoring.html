<script id="data" type="application/json">{"meta": {"id": "EM-MENTORING", "status": "draft:gray", "title": "Mentoring", "date": "2026-07-28", "author": "Željko Obrenović", "permalink": "mentoring", "timetoread": "6 min", "excerpt": "Mentoring is the first leadership role most engineers ever hold, and I run it as a designed role, not an informal favor. The mentor prepares before the mentee's day one — purpose, a level-appropriate project broken into milestones, environment and access confirmed — runs a deliberate orientation, then tapers support toward independence. Interns get a real project sized to the internship; new hires improve the onboarding docs they trip over. And anyone who cannot mentor well right now is expected to say no.", "tags": "engineering management, mentoring, onboarding, interns, new hires, leadership development", "icon": "assets/icons/mentoring.png", "logo": "assets/images/mentoring/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering management", "mentoring", "onboarding", "interns", "new hires", "leadership development"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: Mentoring is the first leadership role most engineers ever hold, and I treat it as a designed role, not an informal favor. A mentor's work starts before the mentee's day one — purpose clarified, success defined, environment and access prepared, a level-appropriate project broken into small milestones — moves through a deliberate first-days orientation, and then tapers: listening before answering, pointing at docs instead of dispensing answers, encouraging independence without abandoning the person. Mentoring assigned casually and run vaguely damages the mentee, the mentor, and the team's view of what leadership is. So I match mentors to goals, count mentoring as meaningful work, and expect anyone who cannot do it well right now to say no.\n\n## Statement\n\nMy operating model for mentoring has five parts:\n\n- **Preparation happens before day one.** The mentor clarifies the purpose of the relationship, defines what success looks like for the mentee and for the team, prepares the environment — tools, systems, software, workspace access confirmed — collects the onboarding docs, and chooses a project that is clear, useful, and appropriate to the mentee's level, broken into small milestones with a check-in plan.\n- **The first days are an orientation, run deliberately.** The mentor orients the mentee to the team and workflow, introduces them to key people, walks through code, tools, and processes, explains both the formal rules and the unspoken norms, and checks in several times so nobody sits lost and silent.\n- **Ongoing mentoring is a taper toward independence.** Listen before answering; watch for confusion, hesitation, and overload; rephrase and use diagrams and walkthroughs when understanding fails; point to docs and resources instead of answering everything; make small course corrections early. Adjust support to progress — encourage independence without abandoning the person.\n- **Interns and new hires get distinct treatment.** An intern gets a real project — specific but not urgent, sized to finish within the internship with room for training and program activities — and is coached to present and demo it at the end. A new hire uses the onboarding docs actively, improves them wherever they hit surprises, and gets help building relationships and learning how things really get done, not just how they are documented.\n- **Mentoring is matched, resourced, and closed out.** I match mentoring assignments to goals and to the right mentor, count the time as meaningful work with explicit expectations and boundaries, and expect a mentor who cannot do it well right now to say no. At the end, mentor and mentee review what was learned and delivered, improvements flow back into onboarding and docs, and the mentee leaves with useful connections and next steps.\n\n![Timeline of the mentoring arc from preparation before day one through orientation and tapering support to an explicit close, with a descending support curve.](assets/images/mentoring/mentoring-arc-taper.jpeg)\n**Figure 1:** *Mentoring is an arc, not a favor: prepared before day one, run deliberately, tapered toward independence, and closed on purpose.*\n\n## How to Read This\n\nThis journal is my engineering-management operating model, one record per source checklist. This record is grounded in the \"Mentoring\" chapter of Camille Fournier's *The Manager's Path* (O'Reilly, 2017) — the first rung of the management ladder, where an engineer first becomes responsible for another person's progress. I write it as the executive who **assigns and resources mentoring**, and who holds mentors to the conduct below. The runnable version — pre-start preparation, first days, ongoing conduct, the intern and new-hire variants, mindset, pitfalls, and the close — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**Mentoring fails in the setup far more often than in the relationship.** A mentee who arrives to no working accounts, no docs, and no defined project loses their most impressionable weeks to logistics — and concludes that this is how the organization treats people. Every item in the pre-day-one list is cheap: confirming access, collecting docs, picking a project, slicing milestones. The reason the checklist front-loads them is that they cannot be recovered later; **a botched first week is permanent data** in the mentee's model of the company.\n\n**A clear, level-appropriate project is the actual curriculum.** Orientation tours and coffee chats do not teach anyone how the team works; a real project does. Fournier's requirements are precise: clear enough that the mentee can make progress without constant hand-holding, useful enough that finishing it matters, and sized to the person's level. Broken into small milestones, the project **generates its own feedback loop** — each milestone is a natural check-in, a natural place for a course correction, and a natural unit of visible progress.\n\n![Diagram of a project sliced into milestones, each generating a loop of check-in, course correction, and visible progress toward the goal.](assets/images/mentoring/milestone-feedback-loop.jpeg)\n**Figure 2:** *The milestone-sliced project is the curriculum: every milestone is a built-in check-in, an early course correction, and a visible unit of progress.*\n\n**The mentor's craft is calibrated withdrawal.** Early on, the mentor walks through everything; by the end, the mentee should be finding answers on their own. **The failure modes sit at both extremes** — answering every question forever (the mentee never becomes independent) and \"just figure it out\" abandonment (the mentee flounders and hides it). The middle path is deliberate: listen before jumping in, watch for the signals of confusion and overload, point at docs first, and adjust support based on actual progress rather than a fixed schedule.\n\n**Mentoring is leadership practice, and I treat it with that seriousness.** It is where an engineer first practices patience, empathy, clear communication, and responsibility for someone else's outcomes — the exact skills the later rungs of the ladder require. That is also why the mentee's questions are valuable to the mentor: they expose blind spots in the mentor's own understanding of systems everyone else has stopped questioning. Treating this as side work — unmatched, unresourced, uncounted — wastes **the best low-stakes leadership training** the organization has.\n\n**A bad mentor is worse than no mentor, so refusal is an allowed answer.** A mentor who intimidates, shows off, hoards knowledge, or lets the relationship drift into vagueness teaches the mentee that this is what senior engineers are like. I would rather **delay a mentoring assignment** than staff it with someone who lacks the time or inclination — which is why \"say no to mentoring if you cannot do it well\" is part of the model, not a loophole in it.\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| Mentoring starts before day one, with environment, docs, and a project prepared. | Mentoring starts when the mentee shows up and asks something. |\n| The mentee gets a clear, useful, level-appropriate project with milestones. | Any spare task will do — **vague or throwaway work teaches nothing**. |\n| The mentor tapers support toward independence. | The mentor either answers everything forever or lets the mentee \"just figure it out.\" |\n| Interns get a real, specific, non-urgent project sized to the internship. | Interns are staffed on the critical path — or given busywork nobody needs. |\n| New hires actively improve the onboarding docs they trip over. | Onboarding docs are read-only artifacts that decay untouched. |\n| Mentoring is **meaningful, matched, bounded work** — and refusable. | Mentoring is a free side duty anyone can be assigned regardless of fit or load. |\n\nConcretely: no mentee in my organization starts without a named mentor, working access, and **a milestone-sliced project chosen before their first day**. Mentors can state the purpose and the success definition of their assignment, and every completed mentoring round **leaves a trace** — improved docs, a closed retrospective, and a mentee with connections and next steps.\n\n![Quadrant chart placing the right intern project in the useful-but-not-urgent quadrant, away from critical-path urgency and throwaway busywork.](assets/images/mentoring/intern-project-quadrant.jpeg)\n**Figure 3:** *An intern project lives in one quadrant: real and useful, but off the critical path — sized to finish within the internship.*\n\n## Anti-Patterns\n\n- **Day-one scramble.** The mentee arrives and only then does anyone request accounts, hunt for docs, or wonder what they should work on.\n- **The vague relationship.** No purpose, no success definition, no cadence — \"just grab me whenever\" until both parties quietly stop trying.\n- **Mentoring as status theater.** Intimidating, belittling, showing off, or hoarding knowledge — using the mentee as an audience instead of serving their growth.\n- **\"Just figure it out.\"** Abandonment dressed up as respect for independence, leaving the mentee to flounder and to hide that they are floundering.\n- **The urgent intern project.** Putting an intern on the critical path, where the schedule cannot absorb their learning curve — or its twin, the throwaway project nobody will ever use.\n- **Unmatched assignment.** Handing mentoring to whoever has apparent slack, without matching the mentee's goals to the right mentor.\n- **The unclosed loop.** The mentorship just stops: no review of what was learned, no reflection, no doc improvements fed back, no connections or next steps for the mentee.\n\n## Related Records\n\n- [Management 101](management-101.html) — the two-sided manager–report contract; the mentor delivers a scoped slice of its support side without being the manager.\n- [Tech Lead](tech-lead.html) — the next rung: from guiding one person to leading a project and team without formal authority.\n- [Managing People](managing-people.html) — where a new report's onboarding continues once a manager, not just a mentor, owns the relationship.\n- [Engineering Onboarding](../grounded-engineering-executive/engineering-onboarding.html) (executive journal) — the onboarding system this record's new-hire mentoring plugs into and continuously improves.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs how mentoring assignments are prepared, matched, conducted, and closed in my organization — for interns, new hires, and any engineer taking on their first mentee. I revisit it if mentees keep reporting **lost first weeks** (the preparation is failing), if onboarding docs stop improving between mentoring rounds (the feedback loop is broken), or if mentoring assignments keep landing on people who did not want them (the matching and the right to say no are being ignored).\n\n## Authoritative References\n\n- Camille Fournier, *The Manager's Path: A Guide for Tech Leaders Navigating Growth and Change* (O'Reilly, 2017) — Chapter 2, \"Mentoring\", whose checklist this record distills.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "4 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Before the mentee starts\n\n- [ ] Clarify the purpose of the mentoring relationship\n- [ ] Decide what success looks like for the mentee and for the team\n- [ ] Prepare the mentee's environment before day one\n- [ ] Confirm they will have access to tools, systems, software, and workspace\n- [ ] Create or collect the onboarding docs they will need\n- [ ] Choose a project that is clear, useful, and appropriate to their level\n- [ ] Break the project into small milestones\n- [ ] Plan how often I will check in\n\n## 2. In the first few days\n\n- [ ] Help the mentee get oriented to the team, office, and workflow\n- [ ] Introduce them to key people and networks\n- [ ] Walk through code, tools, and processes with them\n- [ ] Make it easy for them to ask questions\n- [ ] Check in several times so they do not feel lost or overwhelmed\n- [ ] Explain both formal rules and unspoken norms\n\n## 3. While mentoring\n\n- [ ] Listen carefully before jumping in with answers\n- [ ] Pay attention to what they mean, not just the words they use\n- [ ] Watch for confusion, hesitation, or overload\n- [ ] Repeat or rephrase explanations when needed\n- [ ] Use diagrams, examples, and walkthroughs to improve understanding\n- [ ] Communicate clearly what should happen next\n- [ ] Point them to docs and resources instead of answering everything immediately\n- [ ] Encourage independence without abandoning them\n- [ ] Adjust my support based on their progress and response\n- [ ] Keep the mentee moving in the right direction with small course corrections\n\n## 4. For mentoring an intern\n\n- [ ] Make sure the intern has a real project to work on\n- [ ] Choose something specific but not urgent\n- [ ] Size the project so it can be completed within the internship\n- [ ] Leave room for onboarding, training, and intern program activities\n- [ ] Plan for the intern to present their work at the end\n- [ ] Coach them on how to explain and demo what they built\n\n## 5. For mentoring a new hire\n\n- [ ] Use onboarding documents actively, not passively\n- [ ] Ask the new hire to improve docs when they hit surprises\n- [ ] Help them build relationships across the company\n- [ ] Explain how things really get done, not just how they are documented\n\n## 6. Mentor mindset\n\n- [ ] Stay curious and open-minded\n- [ ] Use the mentee's questions to uncover blind spots in my own understanding\n- [ ] Practice patience, empathy, and clear communication\n- [ ] Treat mentoring as meaningful work, not side work\n- [ ] Be explicit about expectations, time commitment, and boundaries\n- [ ] Say no to mentoring if I cannot do it well\n\n## 7. Avoid these pitfalls\n\n- [ ] Do not intimidate, belittle, or show off\n- [ ] Do not hoard knowledge or use expertise as status\n- [ ] Do not assume the mentee should \"just figure it out\" alone\n- [ ] Do not let the relationship become vague or unstructured\n- [ ] Do not assign mentoring without matching goals to the right mentor\n\n## 8. At the end\n\n- [ ] Review what the mentee learned and delivered\n- [ ] Reflect on what I learned as a mentor\n- [ ] Note what should be improved in onboarding, docs, or process\n- [ ] Leave the mentee with useful connections and next steps\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why mentoring is a designed first leadership role, not an informal favor — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. ARLO: an eager early-career engineer climbing the ladder — in some strips a new lead or manager, in others the engineer being coached — buzz-cut hair, zip-up hoodie with rolled sleeves, sticker-covered laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Arlo is told he is mentoring the new hire waiting by the door, looking proud and panicked.](assets/images/mentoring/comic-01-first-mentee.jpeg)\n**Panel 1:** *The hook: mentoring is the first leadership role most engineers ever hold — and it usually arrives without warning.*\n\n![Comic panel: a mentee sits at a bare desk with login errors and padlocks while a week crosses off the calendar.](assets/images/mentoring/comic-02-lost-first-week.jpeg)\n**Panel 2:** *The problem: a mentee who loses their first week to logistics learns something permanent about how the organization treats people.*\n\n![Comic panel: Arlo walks away saying grab me whenever while the mentee hesitates with a raised hand.](assets/images/mentoring/comic-03-grab-me-whenever.jpeg)\n**Panel 3:** *The wrong way: 'just grab me whenever' — no purpose, no plan, until both sides quietly stop trying.*\n\n![Comic panel: Vera shows a pre-start checklist of access, docs, purpose, and a milestone-sliced project before day one.](assets/images/mentoring/comic-04-designed-before-day-one.jpeg)\n**Panel 4:** *The principle: mentoring is designed, not improvised — purpose, access, docs, and a milestone-sliced project ready before the mentee arrives.*\n\n![Comic panel: Arlo introduces the mentee to teammates and walks through a code map during orientation.](assets/images/mentoring/comic-05-deliberate-orientation.jpeg)\n**Panel 5:** *How it runs: the first days are an orientation run on purpose — people, code, process, and the unspoken norms, with check-ins so nobody sits lost.*\n\n![Comic panel: three scenes of Arlo gradually stepping back as the mentee grows independent.](assets/images/mentoring/comic-06-the-taper.jpeg)\n**Panel 6:** *The mechanic: calibrated withdrawal — listen first, point at docs instead of answering everything, and shrink support as the mentee grows.*\n\n![Comic panel: Vera shows that an overloaded mentor should decline, as an engineer politely raises a hand.](assets/images/mentoring/comic-07-say-no-if-you-cant.jpeg)\n**Panel 7:** *The cost: mentoring is counted as real work with real boundaries — and a bad mentor is worse than no mentor, so saying no is allowed.*\n\n![Comic panel: Arlo and the mentee close the mentorship with a handshake, improved docs, and next steps, as Vera nods.](assets/images/mentoring/comic-08-close-the-loop.jpeg)\n**Panel 8:** *The closer: the loop closes on purpose — what was learned gets reviewed, the docs get better, and the mentee leaves with connections and next steps.*\n"}]}]}</script>

                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
