<script id="data" type="application/json">{"meta": {"id": "EM-STAFF-AND-PRINCIPAL-ENGINEERS", "status": "draft:gray", "title": "Staff and Principal Engineers", "date": "2026-07-28", "author": "Željko Obrenović", "permalink": "staff-and-principal-engineers", "timetoread": "7 min", "excerpt": "Beyond senior, I stop grading craft alone. A staff or principal engineer on my teams is graded on five things together: business understanding, constructive influence, engineering execution across teams, end-to-end reliability ownership, and architecture judgment scaled to blast radius. The role is a partnership with managers and product, not a solo authority — and it only works while the engineer stays hands-on enough to make grounded decisions.", "tags": "engineering management, staff engineers, principal engineers, technical leadership, architecture, reliability, influence", "icon": "assets/icons/staff-and-principal-engineers.png", "logo": "assets/images/staff-and-principal-engineers/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering management", "staff engineers", "principal engineers", "technical leadership", "architecture", "reliability", "influence"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: Staff and principal is a change of axis, not a change of degree. A senior engineer is graded on the quality of their own work; a staff+ engineer on my teams is graded on five things together: whether they understand the business well enough to choose the right problems, whether they influence through earned trust rather than authority, whether they raise engineering execution across teams and not just their own output, whether they own reliability end to end, and whether their architecture judgment scales with the blast radius of their decisions. All five are anchored by one non-negotiable: staying hands-on enough that their decisions are grounded in the actual work.\n\n## Statement\n\nWhat I expect from staff and principal engineers, and what I coach senior engineers toward:\n\n- **Know the role before playing it.** I expect a staff+ engineer to clarify what the title means here — scope, blast radius, and whether they operate at team, group, org, or company level — and to treat the role as a partnership with engineering managers, product managers, business stakeholders, and senior engineers, with responsibilities explicitly clarified so no one steps on anyone's toes.\n- **Understand the business, not just the system.** North Star, KPIs, the OKRs the team supports, who the customers are and why they choose or churn, how the company makes money, and how their team's work maps to revenue, cost, reliability, or retention. I also expect them to question whether the right things are being measured and to add countermetrics where a target could cause harm.\n- **Influence through trust, not authority.** Trust capital is built through credibility, reliability, authenticity, and low self-interest. I expect staff+ engineers to get good proposals accepted, push back on damaging initiatives, support teammates' good ideas, choose the best solution even when it is not their own — and to roll up their sleeves and help execute.\n- **Raise execution across teams.** Keep coding — less than before, in focused high-impact bursts — and spend the freed capacity on what compounds: definitions of done, code review quality, CI/CD speed, trunk health and feature-flag hygiene, codebase structure, developer productivity tooling, and compliance, privacy, and security.\n- **Own reliability end to end.** Logging, monitoring, alerting, healthy on-call, incident management run as a learning system, and resilience designed and tested — not delegated to \"the ops side.\" I expect them to bring data to reliability conversations and advocate for engineering bandwidth when systems are unreliable.\n- **Exercise architecture judgment scaled to blast radius.** Start with the simplest architecture that could work, classify decisions as one-way or two-way doors and spend homework accordingly, estimate how many teams and customers a decision affects, and build scalability the business roadmap justifies — not scalability for hypothetical needs.\n- **Stay hands-on and make the work visible.** Enough connection to code, reviews, and operational reality to make practical decisions; a work log or regular written updates so the business impact of quiet work is seen; and deliberate sponsorship of engineers who are being overlooked.\n\n## How to Read This\n\nThis journal is my engineering-management operating model. This record is grounded in the \"Role-Model Staff and Principal Engineers\" chapter material from Gergely Orosz's *The Software Engineer's Guidebook* (2023), read from the manager's side: the expectations I hold staff+ engineers to, and the shape I coach senior engineers toward. The runnable version — the full checklist I hand the engineer, covering role, business, influence, execution, reliability, and architecture — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**The jump beyond senior changes the axis, not the volume.** Every failed staff transition I have seen came from doing more senior-engineer work harder: more code, more reviews, more designs. The Guidebook's checklist makes the real change visible — the sections on business understanding, influence, and cross-team execution outnumber the sections on personal craft. A staff+ engineer's calendar splits across building software, strategy and alignment, collaboration, mentoring, and business understanding, and I coach people to accept that split deliberately rather than resent it.\n\n![Diagram contrasting the senior track as a single deepening bar of craft with the staff-plus grade as five dimensions radiating from a hands-on core.](assets/images/staff-and-principal-engineers/change-of-axis-five-dimensions.jpeg)\n**Figure 1:** *The change of axis: senior deepens one bar — craft; staff+ is five dimensions graded together, anchored by a hands-on core.*\n\n**Business understanding is what makes technical judgment worth paying for.** A senior engineer can solve the problem in front of them; a staff+ engineer has to choose which problems are worth solving. That choice is impossible without knowing the North Star, the unit economics, the competitors, and whether the product is a profit center, a platform, or a strategic enabler. So I expect staff+ engineers to have 1:1s with product and business people, read the planning documents and — at a public company — the quarterly reports, and translate business goals into engineering goals the team understands. An engineer who cannot say how their work connects to revenue, cost, or risk is operating at senior scope, whatever their title says.\n\n**Politics at this level is unavoidable; the only choice is whether it is constructive.** Staff+ decisions cross team boundaries, so perception matters even when intent is good. The failure modes are precise: appearing self-serving or credit-grabbing, bulldozing decisions through authority, or being \"all talk, no action.\" The constructive alternative is trust capital — earned by helping others succeed rather than controlling decisions, spent by starting proposals with the problem, the preferred solution, the known unknowns, and the tradeoffs. I watch for both patterns and name them early.\n\n**Hands-on connection is the anchor that keeps everything else honest.** The ivory-tower architect — painfully precise at the expense of progress, relying on theory without practical context, a walk-away advisor who never stays for implementation — is the canonical staff+ failure, and the Guidebook is blunt about it. The antidote is structural: keep architecture close to where implementation happens, stay involved in code and reviews and operational reality, and coach others to make better architectural decisions rather than becoming the bottleneck through which every decision must pass.\n\n![Diagram contrasting a crossed-out ivory tower dropping diagrams from above with an architect working at ground level among the team, connected to code, reviews, and operations.](assets/images/staff-and-principal-engineers/grounded-vs-ivory-tower.jpeg)\n**Figure 2:** *The anchor: architecture stays close to where implementation happens — the ivory tower is the canonical staff+ failure mode.*\n\n**Reliability and blast radius are where staff+ judgment compounds — or fails publicly.** A wrong library choice costs a sprint; a wrong database model, protocol choice, or major rewrite costs quarters, because two-way doors quietly become one-way over time. I therefore expect decision discipline proportional to reversibility, deliberate shrinking of blast radius through adapters, migrations, and gradual rollouts — and reliability owned as a first-class responsibility, including the uncomfortable case where infrastructure metrics look healthy while business metrics show failure.\n\n![Diagram of a two-way door crossed quickly and a one-way vault door approached with a checklist, next to concentric blast-radius rings labeled team, teams, and customers.](assets/images/staff-and-principal-engineers/doors-and-blast-radius.jpeg)\n**Figure 3:** *Decision discipline is proportional: two-way doors move fast, one-way doors earn homework — and the homework scales with the blast radius.*\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| Staff+ engineers are graded on five dimensions together. | Craft stops mattering — hands-on excellence remains the anchor, not the whole grade. |\n| Business understanding is mandatory at this level. | Engineers become product managers — they translate business goals into engineering goals, not the reverse. |\n| Influence is earned through trust capital and helping others succeed. | Staff+ engineers get decision authority — bulldozing through title is a named failure mode. |\n| Keep coding, in focused, high-impact bursts. | Staff+ engineers code as much as before — they code less, and choose what for. |\n| Reliability is owned end to end by the staff+ engineer. | They run on-call alone — they design the system: ownership, rotations, runbooks, postmortems. |\n| Architecture homework scales with blast radius and reversibility. | Every decision deserves deep analysis — reversible decisions should not be over-analyzed. |\n| Good-enough architecture that can evolve beats perfect architecture. | Quality is negotiable — the bar is business-justified, not maximal. |\n\nConcretely: every staff+ engineer on my teams can state their scope and archetype, show how their current work maps to a business metric, point to a proposal they got accepted through trust rather than title, name the engineering process they improved this quarter, show the reliability posture of the systems they own, and defend their last hard-to-reverse decision in terms of blast radius and tradeoffs.\n\n## Anti-Patterns\n\n- **Senior-plus-plus.** Treating staff as \"more senior work, faster\" — more personal output, no change in business understanding, influence, or cross-team scope.\n- **The ivory-tower architect.** Precise at the expense of progress, theory without practical context, jargon that excludes, endless philosophical debate — and a walk-away advisor who never stays for implementation.\n- **Bulldozing through authority.** Using the title to force decisions instead of earning acceptance through problems, tradeoffs, and trust — influence spent is not influence earned.\n- **All talk, no action.** Strategy documents and design opinions detached from delivery; no focused coding bursts, no unblocking of struggling projects, no rolled-up sleeves.\n- **Scalability for hypothetical needs.** Building extensible, sharded, multi-region architecture the business roadmap does not justify, instead of good-enough architecture that can evolve.\n- **The invisible staff engineer.** High-leverage glue work that no one sees because there is no work log, no written updates, and no communication of business impact — invisibility at this level is a planning failure, not modesty.\n- **Metrics theater.** Watching infrastructure dashboards stay green while customers churn — owning system health without owning the business metrics that define health.\n\n## Related Records\n\n- [The Well-Rounded Senior Engineer](well-rounded-senior-engineer.html) — the senior bar this record builds beyond; staff+ starts where that record's expectations become table stakes.\n- [The Pragmatic Tech Lead](pragmatic-tech-lead.html) — project leadership of one team; the staff+ role spans teams and pairs with tech leads rather than replacing them.\n- [Engineering Career Paths](engineering-career-paths.html) — whether to pursue staff+ at all, and on which track; this record assumes the role and states its bar.\n- [Promotions](promotions.html) — how the evidence of staff-level work turns into a staff-level title; the work log and visibility habits here feed that case.\n- [Operational Excellence](operational-excellence.html) — the operational bar behind the reliability dimension; this record assigns the ownership, that one details the standard.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs the expectations I hold staff and principal engineers to and how I coach senior engineers toward the transition. I revisit it when our career ladder redefines staff+ scope or archetypes, when a staff+ engineer succeeds or fails in a way the five dimensions do not explain, or when AI-assisted development shifts how much hands-on connection is enough to keep decisions grounded.\n\n## Authoritative References\n\n- Gergely Orosz, *The Software Engineer's Guidebook* (Pragmatic Engineer, 2023) — the staff and principal engineer chapters this record distills, via the \"Role-Model Staff and Principal Engineers\" checklist.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "12 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record — the one I hand the engineer. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Understand the role and expectations\n\n- [ ] Clarify what \"staff,\" \"principal,\" or equivalent titles mean in this company\n- [ ] Identify the full career ladder above senior engineer\n- [ ] Understand the expected scope, blast radius, and influence for your level\n- [ ] Confirm whether your role is expected to operate at team, group, org, or company level\n- [ ] Understand how your role pairs with engineering managers and product managers\n- [ ] Treat staff+ work as a partnership with EMs, PMs, business stakeholders, and senior engineers\n- [ ] Balance your time across building software, strategy/alignment, collaboration, mentoring, and business understanding\n- [ ] Keep enough hands-on connection to the work to make practical decisions\n\n## 2. Understand the business\n\n### North Stars, KPIs, and OKRs\n\n- [ ] Know your product or team's North Star\n- [ ] Know the KPIs used to measure progress\n- [ ] Know which company or org OKRs your team supports\n- [ ] Understand how your team's work maps to revenue, growth, cost, reliability, retention, or customer satisfaction\n- [ ] Question whether the right things are being measured\n- [ ] Look for ways metrics can be gamed\n- [ ] Add countermetrics where a target could create unintended harm\n- [ ] Help translate business goals into engineering goals the team understands\n\n### Product and customers\n\n- [ ] Understand who the customers are and what problems your product solves for them\n- [ ] Use the product yourself where possible\n- [ ] Talk directly with customers, customer support, sales, or user research\n- [ ] Read reviews, support tickets, customer feedback, and competitor material\n- [ ] Understand why customers choose your product — and why they churn, complain, or stop using it\n- [ ] Know your competitors and how they compare: user flows, capabilities, strategy, and customer feedback\n- [ ] Understand whether your product is a profit center, cost center, platform, internal tool, or strategic enabler\n- [ ] Create or maintain a SWOT analysis for your product\n\n### Company and stakeholders\n\n- [ ] Understand how the company makes money — the business model and unit economics\n- [ ] Know how engineering work connects to revenue, cost, margin, risk, or growth\n- [ ] Have 1:1s with product people and business stakeholders\n- [ ] Talk with people outside engineering and product: support, sales, marketing, legal, finance, operations, PR, data, security, design\n- [ ] Pay attention to leadership communication and infer the real priorities\n- [ ] Ask your manager and skip-level leaders about unclear business areas\n- [ ] Read PRDs or equivalent planning documents\n- [ ] Join strategy discussions to listen and learn\n- [ ] Work on cross-functional projects to broaden your business context\n- [ ] Create opportunities for informal conversations with people outside your immediate team\n\n### Public companies, startups, and industry\n\n- [ ] For public companies, read quarterly reports, earnings calls, and analyst questions\n- [ ] Track revenue trends, profitability, investments, risks, and forward-looking commitments\n- [ ] For startups, understand runway, funding, investor priorities, growth areas, and business risks\n- [ ] Ask founders or executives about company priorities when appropriate\n- [ ] Understand your industry's key players, products, trends, and disruptions\n- [ ] Follow relevant industry news and trade publications\n- [ ] Track competitor launches and customer-impacting changes\n\n## 3. Collaborate and influence\n\n### Internal politics and trust\n\n- [ ] Avoid behavior that appears self-serving, credit-grabbing, inflexible, or manipulative\n- [ ] Be aware that perception matters, even when your intent is good\n- [ ] Avoid bulldozing decisions through authority\n- [ ] Avoid being \"all talk, no action\" or detached from delivery\n- [ ] Give feedback about problematic political behavior carefully and at the right level\n- [ ] Build trust capital through credibility, reliability, authenticity, and low self-interest\n- [ ] Earn influence by helping others succeed, not by controlling decisions\n\n### Influence others constructively\n\n- [ ] Use influence to get good proposals accepted\n- [ ] Push back on damaging initiatives when needed\n- [ ] Support teammates' good proposals and help important cross-team work move forward\n- [ ] Ask questions and actively listen before proposing solutions\n- [ ] Explain your point of view clearly\n- [ ] Start proposals with the problem, preferred solution, known unknowns, and tradeoffs\n- [ ] Take sides in design discussions when useful, but explain your reasoning\n- [ ] Choose the best solution, even when it is not your own\n- [ ] Roll up your sleeves and help execute\n\n### Make work visible\n\n- [ ] Share what you are doing with your manager, teammates, and stakeholders\n- [ ] Maintain a work log or regular written updates\n- [ ] Communicate the business impact, risks, challenges, and lessons learned\n- [ ] Give concise weekly or periodic updates when useful\n- [ ] Become a better writer, especially for distributed or large organizations\n- [ ] Use documents, RFCs, ADRs, runbooks, and design notes to scale communication\n\n### Managers and staff+ peers\n\n- [ ] Build a strong partnership with your own manager\n- [ ] Clarify responsibilities with EMs so you do not step on each other's toes\n- [ ] Support EMs in alignment, execution, and technical direction\n- [ ] Partner with managers without publicly undermining them\n- [ ] Get to know staff+ peers face-to-face or through regular discussions\n- [ ] Join or create a staff+ community\n- [ ] Understand your staff+ archetype: tech lead, architect, solver, right hand, or a mix\n- [ ] Learn from engineers with complementary strengths\n\n### Network and help others\n\n- [ ] Find mentors, advisors, and allies in the organization\n- [ ] Work on cross-team projects to build durable relationships\n- [ ] Attend internal trainings and company events; meet people outside your immediate team\n- [ ] Help colleagues without expecting immediate return\n- [ ] Mentor less experienced engineers\n- [ ] Sponsor engineers by creating visibility, lending support, bringing them into rooms, and advocating for them\n- [ ] Speak up for people who are being overlooked\n- [ ] Help others grow through feedback, pairing, reviews, and coaching\n\n## 4. Improve software engineering execution\n\n### Coding as a staff+ engineer\n\n- [ ] Keep coding, but accept that you will code less than before\n- [ ] Code in focused bursts when hands-on work matters most\n- [ ] Use coding work to mentor, coach, and lead by example; pair with engineers, especially when it helps them grow\n- [ ] Jump into struggling projects when your help can unblock delivery\n- [ ] Adapt your style to the team instead of reshaping everything around your preferences\n- [ ] Choose coding work with high impact\n- [ ] Build frameworks, tests, tooling, or infrastructure that others can reuse\n- [ ] Get involved early in projects where architecture and quality decisions matter\n- [ ] Protect time for deep technical work\n\n### Engineering processes\n\n- [ ] Help teams define \"done\" and make quality criteria explicit\n- [ ] Establish coding style guidelines where needed; automate enforcement through linters, CI, or review tooling\n- [ ] Improve code review quality and timeliness\n- [ ] Use post-commit reviews where they fit high-trust teams\n- [ ] Invest in automated testing and testing in production where appropriate\n- [ ] Create scaffolding for new services and components\n- [ ] Improve rollout and experiment hygiene; remove stale feature flags and stale experiments\n- [ ] Create system health dashboards for owned systems\n\n### CI/CD and delivery\n\n- [ ] Ensure CI gives fast feedback on pull requests\n- [ ] Reduce slow build and test cycles: modularize code, cache unchanged artifacts, split tests across machines, run smaller test suites first\n- [ ] Use CD where safe and appropriate\n- [ ] Prefer automated staged rollouts for risky backend systems\n- [ ] Prefer automated rollback based on health metrics where possible\n- [ ] Understand CI/CD setup, maintenance cost, and developer experience\n- [ ] Watch for CI/CD systems becoming slow as codebases grow\n\n### Trunk-based development and feature flags\n\n- [ ] Understand whether trunk-based development fits your context\n- [ ] Prefer a single source of truth where practical\n- [ ] Encourage frequent commits and integration; keep trunk healthy through continuous integration\n- [ ] Use feature flags to decouple deploy from release\n- [ ] Use feature flags for staged rollouts, native/mobile constraints, experiments, and incremental delivery\n- [ ] Track and remove obsolete feature flags; avoid feature-flag debt\n\n### Codebase structure\n\n- [ ] Understand the tradeoffs between monorepos and multiple repositories\n- [ ] Consider monorepos when clarity of dependencies, refactoring, and integration testing matter\n- [ ] Watch for monorepo scale problems: checkout time, tooling, build performance\n- [ ] Understand tradeoffs between monoliths and microservices\n- [ ] Avoid blindly splitting systems into services; avoid letting monoliths become too large to change safely\n- [ ] Look for modular structures that make pragmatic middle ground possible\n- [ ] Organize microservices into logical domains where service count grows\n\n### Developer productivity tools\n\n- [ ] Check whether your company has a service catalog\n- [ ] Make ownership, on-call rotation, onboarding, and service dependencies discoverable\n- [ ] Improve code search across the whole codebase: regular expressions, cross-references, definitions, and speed\n- [ ] Consider developer portals for catalogs, templates, docs, APIs, and plugins\n- [ ] Identify developer productivity bottlenecks before introducing new tools\n- [ ] Evaluate cloud development environments where local setup is slow or inconsistent; weigh benefits against setup cost, customization gaps, and vendor lock-in\n- [ ] Evaluate AI coding assistants and tools carefully\n- [ ] Consider AI use cases such as reviews, tests, refactoring, compliance checks, and stale flag removal\n- [ ] Think carefully about data ownership, retention, and source code exposure when using AI tools\n- [ ] Decide whether to build, buy, or adopt tools based on scale, capability, cost, and strategic importance\n\n### Compliance, privacy, and security\n\n- [ ] Know the regulations relevant to your product or domain: GDPR, PCI DSS, HIPAA, FERPA, FCRA, accessibility, or other relevant requirements\n- [ ] Protect PII and limit access to people who truly need it\n- [ ] Avoid logging PII; anonymize or redact sensitive data in logs\n- [ ] Provide guidance on where PII may and may not be stored\n- [ ] Audit logs, exports, screenshots, support tools, and tickets for sensitive data exposure\n- [ ] Prepare seriously for compliance audits\n- [ ] Partner with legal, privacy, compliance, and security teams\n- [ ] Follow secure coding practices and track dependency vulnerabilities\n- [ ] Understand common threat vectors in your domain\n- [ ] Participate in or learn from penetration testing\n- [ ] Involve security engineers early in planning and risky changes\n\n## 5. Build reliable software systems\n\n### Own reliability\n\n- [ ] Treat reliability as part of your responsibility\n- [ ] Define reliability objectives and measurable indicators\n- [ ] Use OKRs or KPIs to drive improvements in latency, throughput, cost, uptime, or reliability\n- [ ] Partner with engineering managers to prioritize reliability work\n- [ ] Bring data to reliability conversations\n- [ ] Advocate for engineering bandwidth when systems are unreliable\n\n### Logging\n\n- [ ] Define log levels and when to use them\n- [ ] Define log structure, timestamps, time zones, and required fields\n- [ ] Use automated logging where possible; use logging levels consistently across environments\n- [ ] Define log retention policies\n- [ ] Log useful events: auth decisions, data access, system changes, data changes, invalid input, resource limits, health events, startup/shutdowns, backups, failures\n- [ ] Ensure every event has a timestamp, system, user, action, status, priority, and reason where relevant\n- [ ] Build or adopt a logging framework that makes the right thing easy\n- [ ] Regularly review logged entries and remove any unsafe or unnecessary logs\n\n### Monitoring\n\n- [ ] Monitor uptime; CPU, memory, disk, and resource usage; and error rates\n- [ ] Monitor response times, including p50, p95, and p99\n- [ ] Monitor backend HTTP status codes and latency\n- [ ] Monitor web performance metrics such as page load time and Core Web Vitals\n- [ ] Monitor mobile startup time, crash rate, and bundle size\n- [ ] Monitor business metrics that indicate whether the system is actually healthy\n- [ ] Track customer onboarding, conversion, usage, revenue, support tickets, retention, and churn where relevant\n- [ ] Watch for situations where infrastructure metrics look healthy but business metrics show failure\n\n### Alerting\n\n- [ ] Define what \"healthy\" and \"unhealthy\" mean for each system\n- [ ] Alert on customer-visible or business-critical failures\n- [ ] Alert on regressions that have previously caused outages\n- [ ] Categorize alerts by urgency; separate urgent alerts from non-urgent alerts\n- [ ] Track alert noise; measure alert precision and recall\n- [ ] Review whether alerts fired for actual incidents, and review incidents where no alert fired\n- [ ] Use static thresholds where simple and predictable; use anomaly detection where patterns are complex\n- [ ] Tune anomaly detection to avoid excessive false positives; combine static thresholds and anomaly detection where useful\n\n### On-call\n\n- [ ] Ensure each production system has clear on-call ownership\n- [ ] Define primary, secondary, and escalation paths\n- [ ] Keep on-call rotations healthy in size and frequency; watch for on-call burnout\n- [ ] Reduce noisy, non-actionable alerts\n- [ ] Ensure on-call engineers are not overloaded with normal project work during heavy on-call weeks\n- [ ] Define whether on-call work replaces, reduces, or combines with regular work\n- [ ] Create and maintain alert runbooks with diagnostic steps, mitigation steps, relevant previous incidents, dashboards, and links\n- [ ] Keep runbooks updated after incidents\n\n### Incident management\n\n- [ ] Define how incidents are detected and how they are declared\n- [ ] Define severity levels and criteria\n- [ ] Assign incident roles clearly; identify an incident commander or equivalent role\n- [ ] Mitigate quickly before over-focusing on root cause; roll back or use known mitigations first when appropriate\n- [ ] Communicate with stakeholders during incidents; verify that mitigation worked\n- [ ] Hold incident reviews or postmortems, focused on learning, not blame\n- [ ] Track follow-up actions to completion\n- [ ] Improve systems, runbooks, alerts, and processes after incidents\n- [ ] Treat incident management as a learning system\n\n### Resilient systems\n\n- [ ] Define SLIs and uptime targets during planning\n- [ ] Plan for failure modes, expected load and peak load, redundancy and data replication, and what to monitor and alert on\n- [ ] Code defensively; pay attention to error states and error mapping\n- [ ] Manage state carefully; identify and handle unknown states\n- [ ] Test graceful degradation, retries, and circuit breakers\n- [ ] Test datacenter or region failover, disaster recovery, and backups\n- [ ] Keep checking system behavior after production launch\n\n## 6. Make strong architecture decisions\n\n### Simplicity and communication\n\n- [ ] Start with the simplest architecture that could work\n- [ ] Avoid complex jargon when simple language is enough; know the relevant technical, business, and internal jargon and use it only when it helps shared understanding\n- [ ] Explain the architecture in terms that less-experienced engineers can understand\n- [ ] Use sketches, boxes, arrows, documents, or ADRs to communicate decisions\n\n### Architecture debt\n\n- [ ] Identify architecture debt separately from code-level tech debt\n- [ ] Watch for standalone services created only to move faster\n- [ ] Watch for monoliths becoming too hard to change\n- [ ] Watch for non-functional degradation: performance, scalability, reliability\n- [ ] Watch for dated languages and frameworks becoming risky\n- [ ] Revisit older decisions when context changes\n- [ ] Avoid optimizing only for short-term shipping speed\n\n### One-way and two-way door decisions\n\n- [ ] Classify architecture decisions as reversible or hard to reverse\n- [ ] Treat feature flags, naming, test frameworks, linters, and similar changes as mostly reversible\n- [ ] Treat protocol choices, cloud/on-prem moves, database model choices, native app architecture, and major rewrites as harder to reverse\n- [ ] Recognize that two-way-door decisions can become one-way over time\n- [ ] Prototype risky one-way-door decisions\n- [ ] For reversible decisions, avoid over-analysis; for hard-to-reverse decisions, do deeper homework\n- [ ] Reflect after decisions to improve future judgment\n\n### Blast radius\n\n- [ ] Estimate how many teams, systems, and customers a decision affects\n- [ ] Identify whether the blast radius is team-local, org-wide, company-wide, or customer-facing\n- [ ] Expect more pushback for high-blast-radius decisions\n- [ ] Consider customer impact and churn risk\n- [ ] Shrink blast radius where possible: adapters, migrations, parallel paths, or gradual rollouts\n- [ ] Avoid high-blast-radius changes unless the business case is strong\n\n### Scalability\n\n- [ ] Clarify whether scalability means new business use cases, traffic growth, data growth, or operational scale\n- [ ] Design for future product extensions only when business plans justify it; understand the business roadmap before building extensibility\n- [ ] Consider horizontal and vertical scaling\n- [ ] Consider sharding, caching, messaging, replication, and CDNs where appropriate\n- [ ] Avoid building scalable architecture for hypothetical needs the business does not have\n- [ ] Build \"good enough\" architecture that can evolve\n\n### Architecture and business priorities\n\n- [ ] Align architecture work with business goals; tie architecture improvements to product delivery, reliability, cost, speed, or customer impact\n- [ ] Avoid architecture work that is disconnected from current business needs\n- [ ] Bundle architecture improvements with business-relevant projects where possible\n- [ ] Balance long-term architecture health with near-term product delivery\n- [ ] Accept that good-enough architecture is often better than perfect architecture\n- [ ] Keep architecture close to where implementation happens; stay involved in code, reviews, design discussions, and operational reality\n- [ ] Coach others to make better architectural decisions rather than becoming a bottleneck\n\n### Architect traits to watch for\n\n- [ ] Avoid becoming an ivory-tower architect\n- [ ] Avoid being painfully precise at the expense of progress\n- [ ] Avoid relying only on theory without practical context\n- [ ] Avoid endless philosophical debate\n- [ ] Avoid using language or jargon to exclude others\n- [ ] Avoid being a walk-away advisor who does not stay for implementation\n- [ ] Cultivate practical traits: coding machine, integrator, approachable mentor, detailed documenter\n- [ ] Balance new-and-shiny exploration with old-school pragmatism\n- [ ] Pair theoretical and practical engineers where possible\n- [ ] Reflect on which architect archetypes you and your peers resemble\n\n## 7. Personal operating model\n\n- [ ] Keep learning about your domain, industry, business, and engineering practices\n- [ ] Find problems worth solving, not just assigned tasks\n- [ ] Take initiative when you see important gaps\n- [ ] Unblock yourself and the teams around you\n- [ ] Improve practices across your group, not just your own work\n- [ ] Mentor senior and less experienced engineers\n- [ ] Build relationships before you need influence\n- [ ] Communicate clearly, especially in writing\n- [ ] Maintain visibility into business impact\n- [ ] Stay close enough to implementation to make grounded decisions\n- [ ] Help the organization execute better\n- [ ] Sponsor and support others\n- [ ] Avoid becoming detached from customers, code, operations, or business reality\n- [ ] Balance strategy, software delivery, collaboration, reliability, architecture, and people growth\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why staff and principal is a change of axis, not a bigger senior role — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. ARLO: an engineer newly stepping into management, buzz-cut hair, zip-up hoodie with rolled sleeves, sticker-covered laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Arlo stacks a tall tower of identical code blocks toward a shelf labeled staff.](assets/images/staff-and-principal-engineers/comic-01-more-of-the-same.jpeg)\n**Panel 1:** *The hook: the obvious route to staff — more senior work, done harder — is the wrong one.*\n\n![Comic panel: Arlo's block tower wobbles while pedestals labeled business, influence, and teams stand untouched and cobwebbed.](assets/images/staff-and-principal-engineers/comic-02-the-failed-transition.jpeg)\n**Panel 2:** *The problem: the volume of personal output grows, but business understanding, influence, and cross-team scope stay untouched.*\n\n![Comic panel: Arlo drops a giant architecture scroll from a tower to confused engineers below.](assets/images/staff-and-principal-engineers/comic-03-the-ivory-tower.jpeg)\n**Panel 3:** *The wrong way: the ivory-tower architect — painfully precise, detached from the work, gone before implementation.*\n\n![Comic panel: Vera draws a crossed-out vertical arrow and a five-pointed star of staff-plus dimensions around a hands-on core.](assets/images/staff-and-principal-engineers/comic-04-the-change-of-axis.jpeg)\n**Panel 4:** *The principle: beyond senior, the grade changes axis — five dimensions together, anchored by staying hands-on.*\n\n![Comic panel: Arlo and a product manager trace a line from a code icon to a coin icon under a North Star chart.](assets/images/staff-and-principal-engineers/comic-05-know-the-business.jpeg)\n**Panel 5:** *How it runs: know the North Star, the customers, and the money — so technical judgment picks problems worth solving.*\n\n![Comic panel: Arlo walks peers through a proposal with tradeoffs while a listener holds a trust token and a megaphone sits crossed out.](assets/images/staff-and-principal-engineers/comic-06-trust-not-title.jpeg)\n**Panel 6:** *The mechanic: proposals get accepted through trust capital — problem, options, tradeoffs — never bulldozed through a title.*\n\n![Comic panel: Arlo with a pager and a monitoring dashboard pauses at a one-way vault door, checklist in hand.](assets/images/staff-and-principal-engineers/comic-07-the-pager-and-the-vault-door.jpeg)\n**Panel 7:** *The cost: reliability owned end to end, and homework scaled to blast radius — two-way doors move fast, one-way doors do not.*\n\n![Comic panel: Arlo reviews code with a junior engineer, work log open, while Vera notes approvingly from the doorway.](assets/images/staff-and-principal-engineers/comic-08-grounded-at-the-table.jpeg)\n**Panel 8:** *The closer: stay hands-on enough that every decision is grounded in the actual work — the anchor that keeps all five dimensions honest.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
