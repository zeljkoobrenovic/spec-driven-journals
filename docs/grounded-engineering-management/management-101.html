I owe every report as their manager:\n\n- **Regular 1:1s that are discussions, not status updates.** The meeting exists for the things a status report cannot carry — and it treats the report as a person, not just a worker, building trust and human connection deliberately.\n- **Feedback, continuously and in the right register.** Praise delivered publicly when appropriate; criticism delivered privately and promptly. No saving important feedback for a formal review.\n- **Growth beyond day-to-day execution.** I help each report improve their work, navigate workplace challenges, and understand what promotion actually requires here — and I identify stretch opportunities that get them there.\n- **Connection and advocacy.** I connect each person's work to team and company goals, point them at training and career resources, and advocate for their growth and advancement in rooms they are not in.\n- **Focus.** I help every report concentrate on what matters most, which sometimes means taking things off their plate.\n\nWhat I ask every report to own:\n\n- **Know what you want, and say it.** Think about what you want from your career; ask directly about promotion and raise expectations; ask for the projects and stretch work you want.\n- **Drive your own 1:1s.** Bring topics and agendas; ask for help when stuck; ask for feedback — including the constructive kind — rather than waiting for it to arrive.\n- **Speak up and set boundaries.** Say when you are unhappy while it is still fixable; set your own work-life boundaries; take ownership of your growth and happiness at work. Your manager is a resource, not a mind reader.\n\n![Diagram of a single contract with a manager column and a report column, signed by both sides.](assets/images/management-101/two-signature-contract.jpeg)\n**Figure 1:** *One relationship, one contract, two signatures — the manager's obligations and the report's are halves of the same document.*\n\n## How to Read This\n\nThis journal is my engineering-management operating model, one record per source checklist. This record is grounded in the \"Management 101\" chapter of Camille Fournier's *The Manager's Path* (O'Reilly, 2017) — the chapter about what to expect from a manager and how to be managed, distilled here into **the contract I hold both sides of the relationship to**. I have sat on both sides of it and now also hold every manager in my organization to the manager's half. The runnable version — the expectations list, the report's responsibilities, and the self-assessment — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**The contract has to be explicit because most people have never seen it honored.** Fournier's starting observation is that many engineers have never had a manager they would call good, so they **calibrate their expectations to neglect**: 1:1s that are status meetings or don't happen, feedback that arrives once a year as a surprise, careers that drift. Writing the contract down resets that calibration. A report who knows they are owed prompt private criticism and promotion clarity will notice when they are not getting it — and a manager who has signed up for that list cannot quietly drop it.\n\n**1:1s are the load-bearing mechanism of the manager side.** Almost everything else I owe a report — feedback, growth discussion, human connection, focus — flows through a regular, protected 1:1 that is used for discussion rather than status. A manager who lets 1:1s decay into status readings, or skips them when busy, has effectively **suspended the whole contract** while appearing to keep the meeting. That is why \"has regular 1:1s\" and \"uses them for discussion, not status\" are the first two lines of the checklist, not incidental hygiene.\n\n![Diagram of a bridge between manager and report carrying feedback, growth, trust, and focus, with a cracked status-only bridge below.](assets/images/management-101/one-on-one-load-bearing-bridge.jpeg)\n**Figure 2:** *Everything the manager side owes flows across the 1:1 — let it decay into a status reading and the whole contract quietly collapses.*\n\n**The register of feedback matters as much as its existence.** Praise in public reinforces the behavior and the person; criticism in public humiliates and teaches the team to hide problems. **Criticism delayed is criticism wasted** — by the time it arrives in a review, the pattern has hardened and the trust needed to hear it has thinned. Public-praise, private-and-prompt-criticism is a small rule that carries most of the feedback half of the contract.\n\n![Two-by-two grid showing praise belongs in public and criticism belongs in private and prompt, with the inverted cells crossed out.](assets/images/management-101/feedback-register-matrix.jpeg)\n**Figure 3:** *A small rule carries the feedback half of the contract: praise public, criticism private and prompt — invert either register and it backfires.*\n\n**The report's half exists because a manager cannot supply motivation, only respond to it.** I can identify stretch opportunities, but I cannot know which ones someone wants unless they have thought about their career and said so. I can answer promotion questions, but only if they are asked. Fournier is blunt about this: **figuring out what you want is your job**, and using your manager well — bringing solutions rather than only problems, asking for advice rather than demanding fixes — is a skill worth deliberately practicing. Reports who treat their manager as a mind reader end up resentful; reports who treat their manager as a resource end up developed.\n\n**You control your side of the relationship, and only your side.** Managers are imperfect; I ask reports to give theirs some grace, and to diagnose honestly when things go wrong: **is the problem the manager, the situation, or me?** That diagnosis matters beyond the current job — Fournier's advice to choose managers carefully when evaluating roles follows directly from it. A good manager is a meaningful part of compensation; the contract in this record is what \"good\" means.\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| Every report gets regular 1:1s used for discussion. | The 1:1 is a status meeting — status has other channels. |\n| Praise is public when appropriate; criticism is private and prompt. | Feedback waits for the review cycle — that is where surprises come from. |\n| Managers actively work on each report's growth, promotion clarity, and advocacy. | Growth is fully the manager's job — **the report names the direction, the manager clears the path**. |\n| Reports bring agendas, asks, and honest state to the relationship. | A quiet report is a happy report — **silence is not consent**, and managers are not mind readers. |\n| Reports control their side of the relationship and give managers some grace. | Reports must tolerate a bad manager indefinitely — sometimes the honest diagnosis is the manager or the situation, and the right move is a change. |\n| A good manager is worth weighing when choosing a job. | Title and compensation are all that matter in an offer. |\n\nConcretely: everyone in my organization can name their 1:1 cadence, has heard specific praise and specific private criticism within recent memory, and **can state what their next promotion requires**. And everyone owns an answer to \"what do you want next?\" — because I ask, and \"I haven't thought about it\" is **an answer I expect to hear at most once**.\n\n## Anti-Patterns\n\n- **The vanishing 1:1.** Cancelled when busy, converted to status when held — the report technically has a manager and practically has none.\n- **Review-day surprises.** Saving important criticism for the formal review, where it arrives too late to act on and too loaded to hear.\n- **Public criticism, private praise.** Inverting the registers — humiliating people in front of peers while their wins go unmentioned where it counts.\n- **The mind-reader assumption.** A report who never states what they want, then resents not getting it; a manager who never asks, then is surprised by the resignation.\n- **Complaints without asks.** Bringing only problems and demanding fixes, rather than bringing solutions and asking for advice — the fastest way to teach a manager to dread your 1:1.\n- **Blaming across the boundary.** A report endlessly relitigating what the manager should do differently instead of working the one side of the relationship they control.\n- **Ignoring the manager when choosing a job.** Evaluating offers on title and compensation alone, as if the person you will report to were an implementation detail.\n\n## Related Records\n\n- [Managing People](managing-people.html) — the manager's half of this contract in full mechanics: onboarding a new report, 1:1 formats, continuous feedback, reviews, and underperformance.\n- [Mentoring](mentoring.html) — the first rung of the ladder where someone starts delivering the support side of this contract.\n- [What Is Management](what-is-management.html) — Julie Zhuo's answer to what the manager's job actually is; this record is the per-report contract inside that job.\n- [Own Your Career](own-your-career.html) — the engineer-side career-ownership playbook; the report's half of this contract is its day-to-day core.\n- [Career Conversations](../grounded-people-management-tools/career-conversations.html) (people journal) — the deliberate one-off conversation that gives a manager the motivational context this contract assumes.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs the baseline manager–report relationship everywhere I am the accountable executive: what any report can expect from any manager here, and what any manager can expect reports to own. I revisit it if skip-levels or engagement surveys show reports who cannot name their manager's side of the contract, if **formal reviews keep producing surprises** (the signal that continuous feedback has stopped), or if I catch myself letting my own 1:1s decay into status meetings.\n\n## Authoritative References\n\n- Camille Fournier, *The Manager's Path: A Guide for Tech Leaders Navigating Growth and Change* (O'Reilly, 2017) — Chapter 1, \"Management 101\", whose checklist this record distills.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "3 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record. The Article tab carries the rationale and anti-patterns.*\n\n## 1. What to expect from a good manager\n\n- [ ] Has regular 1:1s with me\n- [ ] Uses 1:1s for discussion, not just status updates\n- [ ] Treats me like a person, not just a worker\n- [ ] Builds trust and human connection\n- [ ] Gives feedback regularly\n- [ ] Gives praise publicly when appropriate\n- [ ] Gives criticism privately and promptly\n- [ ] Helps me improve my work beyond day-to-day execution\n- [ ] Helps me navigate workplace challenges\n- [ ] Helps me understand promotion expectations\n- [ ] Identifies stretch opportunities for growth\n- [ ] Connects my work to team and company goals\n- [ ] Helps me find training, learning, or career resources\n- [ ] Advocates for my growth and advancement\n- [ ] Helps me focus on what matters most\n\n## 2. What I am responsible for as a report\n\n- [ ] Think about what I want from my career\n- [ ] Bring topics and agendas to my 1:1s\n- [ ] Ask for help when I am stuck\n- [ ] Ask for feedback, including constructive feedback\n- [ ] Speak up when I am unhappy\n- [ ] Ask for projects, opportunities, or stretch work I want\n- [ ] Ask directly about promotion or raise expectations\n- [ ] Take ownership of my growth and happiness at work\n- [ ] Set my own work-life boundaries\n- [ ] Use my manager as a resource, not a mind reader\n\n## 3. How to work well with a manager\n\n- [ ] Bring solutions, not only problems\n- [ ] Ask for advice instead of only demanding fixes\n- [ ] Give my manager grace when they are imperfect\n     (function () {
        const data = JSON.parse(document.getElementById('data').textContent);

        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';

        });

            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
