<script id="data" type="application/json">{"meta": {"id": "EM-ENGINEERING-CAREER-PATHS", "status": "draft:gray", "title": "Engineering Career Paths", "date": "2026-07-28", "author": "Željko Obrenović", "permalink": "engineering-career-paths", "timetoread": "7 min", "excerpt": "Careers run on terrain: company type, ladder shape, compensation tier, and whether the team is a profit or cost center change what any career advice means. I expect engineers to know the terrain they are on, to take non-standard paths seriously, and to measure progress on more axes than title and pay — and I coach that map honestly, including the parts my company cannot offer.", "tags": "engineering management, career paths, career ladders, compensation, company types, career growth", "icon": "assets/icons/engineering-career-paths.png", "logo": "assets/images/engineering-career-paths/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering management", "career paths", "career ladders", "compensation", "company types", "career growth"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: Careers run on terrain, and most bad career advice comes from ignoring it. What \"senior\" means, how far an IC track goes, what a promotion is worth, and how safe a job is all depend on company type, ladder shape, compensation tier, and whether the team is a profit center or a cost center. I expect engineers to know the terrain they are actually on — and I coach the map honestly, including the ladders my company doesn't have, the tiers it doesn't pay, and the paths that lead away from it. A manager who only shows the parts of the map that favor retention isn't coaching; that's advertising.\n\n## Statement\n\nWhat I expect engineers to understand about the terrain, and what I commit to in coaching it:\n\n- **Know your company type — it sets the rules.** Big Tech, medium-to-large tech company, scaleup, startup, traditional company with a tech division, tech-heavy traditional company, small non-VC company, public sector, nonprofit, consultancy, academia: each has different ladders, pay, stability, and growth. I expect engineers to know which one they are at and which they are targeting — and to remember that team quality can matter as much as company category.\n- **Know the ladder as it actually is.** Whether the company runs a single track or a dual IC/manager track, what the highest realistic IC level is, and whether advancing past senior or staff quietly requires moving into management. Career plans built on a ladder that doesn't exist here waste years.\n- **Take non-standard paths seriously.** Lifelong engineer, specialist, generalist/specialist pendulum, niche-field engineer, contractor, tech lead, engineering manager, founder, a move into PM or DevRel or TPM, the engineer/manager pendulum, or a frankly non-linear path — there is no single \"good\" career, and I refuse to coach as if there were.\n- **Understand compensation in tiers, and in total.** Companies cluster into rough tiers; the comparison is total compensation — base, bonus, equity — with liquid and illiquid equity treated very differently. Each tier prices in a tradeoff: stability and balance at one end, extreme pay with extreme hiring difficulty and performance pressure at the other.\n- **Know whether you sit in a profit center or a cost center.** Whether the team's work visibly drives revenue changes promotions, bonuses, transfer options, attrition risk, and job security. I expect engineers to know their position — and to learn to succeed in both.\n- **Measure progress on more than title, company, and pay.** People, manager relationship, culture, mission, growth, health, flexibility, ability to disconnect, stress, and life outside work are all real axes — and the right balance shifts with life stage. I coach engineers to revisit their priorities before every move, not after.\n\n## How to Read This\n\nThis journal is my engineering-management operating model. This record is grounded in the Engineering Career Paths chapter of Gergely Orosz's *The Software Engineer's Guidebook* (Pragmatic Engineer, 2023), read from the manager's side of the table: the book gives engineers the map; this record states how I use that map in coaching — as **the shared, honest terrain** every career conversation on my teams runs across. The runnable version — the checklist I hand an engineer thinking about where their career is and where it could go — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**Context-free career advice is noise.** \"Aim for staff\" means nothing at a company whose IC ladder tops out at senior; \"optimize for equity\" is bad advice when the equity is illiquid paper at a company that may never exit; \"job security first\" reads differently in a profit center than in a cost center one reorg away from a cut. The source's core move is to make **advice conditional on terrain** — company type, ladder, tier, team position — and that conditionality is what I import into every career conversation I run.\n\n![A terrain map divided into regions labeled Big Tech, scaleup, startup, public sector, consultancy, and academia, with a dotted path crossing them.](assets/images/engineering-career-paths/career-terrain-map.jpeg)\n**Figure 1:** *Careers run on terrain: each company type is a different region with its own ladders, pay, and stability — advice that ignores the region is noise.*\n\n\n\n**Honest maps beat flattering maps, even for retention.** It costs me something to tell an engineer that our IC ladder realistically ends at a level below their ambition, or that a Tier-3 company would pay them double for double the pressure. I tell them anyway, because **engineers discover the terrain eventually** — and a manager caught curating the map loses the credibility that makes all other coaching work. Paradoxically, **honest terrain-coaching retains better**: people stay longer where their eyes were open when they chose.\n\n**The dual-track ladder is a fact to verify, not an assumption to inherit.** Many engineers assume every company runs a Big Tech-style dual track with parity to director level and beyond. Many companies don't: the track is single, or the IC ladder exists on paper but the highest realistic level is senior, or advancement past staff **quietly requires management**. I expect engineers to **verify the ladder where they are** — and I expect myself to answer truthfully what the highest realistic IC level here is, terminal levels included.\n\n![Three ladders: a dual IC and management track, a single track bending into management, and a ladder whose rungs above senior are only dashed outlines.](assets/images/engineering-career-paths/ladder-shapes-to-verify.jpeg)\n**Figure 2:** *Verify the ladder as it actually is: dual tracks are not universal, and some upper IC rungs exist only on paper.*\n\n\n\n**Non-standard paths are the norm stretched over a long career.** Over decades, **the \"standard\" junior-to-staff arc is the exception**: people pendulum between specialist and generalist, between engineering and management; they contract, found companies, move into product or developer relations, and come back. Treating these as detours to warn against — rather than **patterns to choose deliberately** — narrows my coaching to the one path that happens to keep people on my ladder. The source's instruction to review examples of non-linear careers is one I pass on verbatim.\n\n**Tier and team position quietly dominate outcomes engineers attribute to performance.** Two engineers of equal skill diverge enormously based on **choices that look secondary**: which compensation tier they entered, and whether they sat in a funded, executive-visible profit center or an invisible cost center. Promotions, bonuses, and even survival in a downturn track team position more than individuals like to believe. I make this explicit so engineers place themselves deliberately — and so those in cost centers know the game is **different, not unwinnable**.\n\n**Title, company, and pay are three axes of a dozen.** The source's final move is the one I care most about as a manager: **broaden the scoreboard**. The colleagues, the manager, the culture, the mission, health, flexibility, stress, life outside work — these determine whether a career is worth having, and their weights shift with life stage. An engineer optimizing the three visible axes while the other nine collapse is not succeeding, and it is part of my job to say so **before the collapse, not after**.\n\n![A radar chart of ten career axes with title, company, and pay maxed out while health, people, flexibility, and other axes collapse toward the center.](assets/images/engineering-career-paths/full-scoreboard-radar.jpeg)\n**Figure 3:** *Three axes of a dozen: maxing title, company, and pay while the other nine collapse is not succeeding — and the right weights shift with life stage.*\n\n\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| Know your company type and what it implies for pay, growth, and stability. | One type is best — each trades something for something; team quality can outweigh category. |\n| Verify the ladder: tracks, highest realistic IC level, terminal levels. | The published ladder is the real one — realism means **what actually gets promoted here**. |\n| Non-standard paths are legitimate and worth choosing deliberately. | Everyone should leave the standard path — many thrive on it; the point is choice, not churn. |\n| Compare total compensation across tiers, with equity liquidity in view. | Chase the highest tier — the top tier prices in hiring difficulty and performance pressure. |\n| Know whether your team is a profit center or a cost center. | Cost-center work is a dead end — it can be excellent work; the game is different and learnable. |\n| Measure progress on people, health, flexibility, and life — not just title and pay. | Ambition is suspect — the point is **a full scoreboard**, weighted for your life stage. |\n\nConcretely: every engineer I coach can tell me what type of company we are, what the highest realistic IC level here is, which tier we pay in, and whether their team is a profit or cost center — and our career conversations use that shared map, including the honest parts about **what this company cannot offer them**.\n\n## Anti-Patterns\n\n- **Coaching from a flattering map.** Showing engineers only the parts of the terrain that favor retention — the ladder we wish we had, the tier we claim to pay — and losing all coaching credibility when they discover the rest.\n- **Assuming every ladder is Big Tech's ladder.** Planning a staff-and-beyond IC career at a company whose real ladder ends at senior, and calling the resulting stall a performance problem.\n- **The one-true-path reflex.** Treating specialist pendulums, management stints, contracting, founding, or moves into PM as failures to warn against instead of patterns to choose.\n- **Reading equity at face value.** Comparing offers on paper equity without asking whether it is liquid — private-company equity may never become valuable, and the source says so bluntly.\n- **Ignoring team position.** Attributing promotion and layoff outcomes purely to individual performance while ignoring profit-center versus cost-center dynamics that dominated them.\n- **The three-axis scoreboard.** Evaluating a career only by title, company name, and compensation while manager quality, health, stress, and life outside work go unmeasured.\n- **Static priorities.** Carrying the optimization function of one life stage into the next unexamined — never revisiting what balance matters now, especially before changing jobs.\n\n## Related Records\n\n- [Own Your Career](own-your-career.html) — the ownership contract; this record is the map that contract gets executed on.\n- [Promotions](promotions.html) — the campaign for the next rung; this record tells you which ladder, at which kind of company, the rung is on.\n- [Changing Jobs](changing-jobs.html) — moving across the terrain: how a move between company types and tiers is actually made.\n- [Thriving in Different Environments](thriving-in-different-environments.html) — behavior inside an environment; this record is about choosing and evaluating environments.\n- [Career Conversations](../grounded-people-management-tools/career-conversations.html) (people journal) — the conversation format where this map meets an individual's history and motivations.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs the shared map I use in career coaching: company types, ladder realism, non-standard paths, compensation tiers, profit-versus-cost-center position, and the broadened scoreboard. I revisit it if our own ladder or compensation position changes materially — the honest answers about \"here\" must stay current — if **the market re-tiers** (compensation structures have shifted before and will again), or if I catch a career conversation **running on the flattering map** instead of the real one.\n\n## Authoritative References\n\n- Gergely Orosz, *The Software Engineer's Guidebook* (Pragmatic Engineer, 2023) — the Engineering Career Paths chapter this record distills, via its companion checklist.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "4 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record — the one I hand an engineer mapping their career terrain. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Understand your company type\n\n- [ ] I have identified what kind of company I work for or am targeting:\n  - Big Tech\n  - Medium-to-large tech company\n  - Scaleup\n  - Startup\n  - Traditional company with a tech division\n  - Technology-heavy traditional company\n  - Small non-venture-funded company\n  - Public sector\n  - Nonprofit\n  - Consultancy / outsourcing / agency\n  - Academia or research lab\n- [ ] I have compared the company type against my goals for compensation, stability, growth, impact, and work-life balance.\n- [ ] I have talked to people who work at similar companies to understand the real day-to-day experience.\n- [ ] I remember that team quality can matter as much as company category.\n\n## 2. Choose a realistic career path\n\n- [ ] I have decided whether I am more interested in a path as an individual contributor or in management.\n- [ ] I know whether my company has a single-track career ladder or a dual-track IC and manager ladder.\n- [ ] I have identified the highest realistic IC level at my current company.\n- [ ] I have checked whether advancement beyond senior/staff requires moving into management.\n- [ ] I have considered whether I might switch between IC and manager tracks over time.\n\n## 3. Think beyond the \"standard\" path\n\n- [ ] I have considered which career pattern fits me best:\n  - Lifelong software engineer\n  - Specialist\n  - Generalist/specialist pendulum\n  - Engineer in a niche field\n  - Contractor or freelancer\n  - Tech lead\n  - Engineering manager\n  - Founder or business owner\n  - Non-software role such as PM, DevRel, TPM, recruiting\n  - Engineer/manager pendulum\n  - Combination path\n  - Non-linear career path\n- [ ] I do not assume there is only one \"good\" career path.\n- [ ] I have reviewed examples of people with non-linear careers.\n\n## 4. Understand compensation tiers\n\n- [ ] I can identify whether a company is likely Tier 1, Tier 2, or Tier 3 for compensation.\n- [ ] I compare total compensation, not just salary: base salary, cash bonus, and equity.\n- [ ] I understand whether equity is liquid or illiquid.\n- [ ] I am cautious about private-company equity that may never become valuable.\n- [ ] I compare compensation expectations with job difficulty and performance expectations.\n\n## 5. Compare tradeoffs between tiers\n\n- [ ] For Tier 1 companies, I have checked whether I value stability, easier hiring access, or better work-life balance.\n- [ ] For Tier 2 companies, I have checked whether I want stronger pay with more demanding expectations.\n- [ ] For Tier 3 companies, I have checked whether I am prepared for very high hiring difficulty and demanding performance standards.\n- [ ] I have compared expected career growth: can ICs progress beyond senior? Beyond staff? Are manager paths clearer than IC paths?\n- [ ] I have considered whether the highest pay is worth the pressure.\n\n## 6. Evaluate profit center vs. cost center\n\n- [ ] I know whether my team directly generates revenue.\n- [ ] I know whether my team's impact is visible to executives.\n- [ ] I know whether my work supports a core product, internal tooling, compliance, infrastructure, or operations.\n- [ ] I watch which teams receive funding, headcount, and executive attention.\n- [ ] I have assessed how my team's position affects promotions, bonuses, internal transfers, attrition risk, and job security.\n- [ ] I am learning to succeed in both profit centers and cost centers.\n\n## 7. Broaden how you measure career progress\n\n- [ ] I do not evaluate my career only by title, company name, and compensation.\n- [ ] I also evaluate:\n  - The people I work with\n  - My manager relationship\n  - My position within the team and company\n  - Company culture\n  - Company mission\n  - Professional growth\n  - Mental and physical health\n  - Flexibility of time and place\n  - Ability to disconnect from work\n  - Stress level\n  - Life outside work\n  - Personal motivation\n- [ ] I have decided what balance matters most for my current life stage.\n- [ ] I revisit my priorities before changing jobs.\n\n## 8. Own your career development\n\n- [ ] I do not assume my manager will handle my career progression for me.\n- [ ] I know what promotion and performance expectations are at my company.\n- [ ] I have asked what additional activities are needed for recognition.\n- [ ] I make my impact visible.\n- [ ] I seek regular feedback.\n- [ ] I build relationships with peers, managers, and senior engineers.\n- [ ] I track accomplishments and outcomes.\n- [ ] I reassess my path regularly as my goals change.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why career advice is noise until you know the terrain it runs on — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. ARLO: an eager early-career engineer climbing the ladder — in some strips a new lead or manager, in others the engineer being coached — buzz-cut hair, zip-up hoodie with rolled sleeves, sticker-covered laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Arlo excitedly shows Vera a blog post with a big upward arrow while she looks up from her notebook.](assets/images/engineering-career-paths/comic-01-aim-for-staff.jpeg)\n**Panel 1:** *The hook: advice from the internet arrives without the terrain it was written for.*\n\n![Comic panel: Arlo climbs a ladder solid up to a senior plaque, reaching for dashed ghost rungs dissolving into fog above.](assets/images/engineering-career-paths/comic-02-ladder-into-fog.jpeg)\n**Panel 2:** *The problem: career plans built on a ladder that doesn't exist here waste years.*\n\n![Comic panel: a salesman-like manager shows Arlo a glossy golden map while hiding a torn realistic map behind his back.](assets/images/engineering-career-paths/comic-03-the-flattering-map.jpeg)\n**Panel 3:** *The wrong way: coaching from a flattering map — showing only the terrain that favors retention.*\n\n![Comic panel: Vera unrolls a terrain map with regions labeled Big Tech, scaleup, startup, and public sector as Arlo leans in.](assets/images/engineering-career-paths/comic-04-careers-run-on-terrain.jpeg)\n**Panel 4:** *The principle: careers run on terrain — and the map is coached honestly, including the parts this company cannot offer.*\n\n![Comic panel: Arlo inspects a ladder with a magnifying glass while Vera points at the fork where it splits into two tracks.](assets/images/engineering-career-paths/comic-05-verify-the-ladder.jpeg)\n**Panel 5:** *How it runs: verify the ladder as it actually is — tracks, terminal levels, and the highest realistic IC rung.*\n\n![Comic panel: two identical engineers at identical desks, one spotlighted near a coin stack and an approving executive, one in shadow near budget scissors.](assets/images/engineering-career-paths/comic-06-profit-vs-cost-center.jpeg)\n**Panel 6:** *The mechanic: promotions, bonuses, and downturn survival track team position — profit center or cost center — more than people believe.*\n\n![Comic panel: Vera points to a distant glowing region on the map while Arlo considers it thoughtfully by the window.](assets/images/engineering-career-paths/comic-07-honesty-costs.jpeg)\n**Panel 7:** *The cost: honest terrain-coaching sometimes points away from home — and that honesty is what makes the rest of the coaching credible.*\n\n![Comic panel: Arlo lights up many small tiles with life icons on a scoreboard below three big tiles for title, company, and pay.](assets/images/engineering-career-paths/comic-08-the-full-scoreboard.jpeg)\n**Panel 8:** *The closer: title, company, and pay are three axes of a dozen — the full scoreboard, reweighted per life stage, is the real measure.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
