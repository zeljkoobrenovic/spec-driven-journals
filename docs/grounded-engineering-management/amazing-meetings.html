<script id="data" type="application/json">{"meta": {"id": "EM-AMAZING-MEETINGS", "status": "draft:gray", "title": "Amazing Meetings", "date": "2026-07-28", "author": "Željko Obrenović", "permalink": "amazing-meetings", "timetoread": "6 min", "excerpt": "Every meeting I run has one primary purpose — deciding, informing, giving feedback, generating ideas, or building relationships — and the format, attendee list, and preparation all serve that purpose. In the room I manage airtime so quieter voices contribute, and I close with owners and timelines on every action. Before any of that, the gut-check: does this meeting truly need to happen, and do I personally need to be there?", "tags": "engineering management, meetings, facilitation, decision making, collaboration, time management", "icon": "assets/icons/amazing-meetings.png", "logo": "assets/images/amazing-meetings/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering management", "meetings", "facilitation", "decision making", "collaboration", "time management"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: A meeting earns its slot on other people's calendars by having one primary purpose — making a decision, sharing information, giving feedback, generating ideas, or building relationships — and by everything else serving that purpose: the format, the attendee list, the pre-reads, the facilitation. A meeting trying to do three of these does none of them; a meeting whose purpose I cannot state should not happen. And the last check is always the honest one: is this a good use of everyone's time, does it truly need to happen, and do I personally need to be there?\n\n## Statement\n\nMy operating model for meetings has six parts:\n\n- **One primary purpose, stated as an outcome.** Before I run a meeting, I know which of the five things it is mainly for — making a decision, sharing information, providing feedback, generating ideas, or strengthening relationships — and I can clearly state what success looks like by the end. One meeting does not get to do too many things.\n- **Format and attendees follow the purpose.** The structure fits the goal; off-topic discussion gets redirected and parked. Everyone necessary is invited, no one extraneous is, the people affected are represented, and the list supports useful discussion rather than passive observation.\n- **Preparation is the organizer's job.** The agenda goes out in advance, pre-reads and slides are shared when needed, participants have enough context to contribute thoughtfully, and I have planned how follow-ups will be captured before the meeting starts.\n- **Participation is made safe, and airtime is managed.** I explicitly encourage questions, dissent, and honest input; use formats that help quieter people contribute; watch for interruptions; make space for people who have not spoken; use directed questions; and limit overtalking politely but firmly.\n- **Every meeting closes with clarity.** Decisions, feedback, or ideas are summarized before the end; next steps are agreed; every action item has an owner and a timeline or next check-in.\n- **Every meeting passes the gut-check — or gets cancelled.** Is this a good use of people's time? Will attendees leave with new knowledge, clearer next steps, a sense of engagement? Does this meeting truly need to happen, and do I personally need to be there? A \"no\" is an instruction, not a mood.\n\n## How to Read This\n\nThis journal is my engineering-management operating model, each record grounded in one source. This record distills the meetings chapter of Julie Zhuo's *The Making of a Manager* (Portfolio/Penguin, 2019) — her taxonomy of five meeting purposes and her insistence that a great meeting is designed backward from the outcome its attendees should leave with. The runnable version — the general checklist plus the per-purpose checks for decision, information-sharing, feedback, idea-generation, and relationship-building meetings — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**A meeting without a stated purpose optimizes for nothing.** Zhuo's five purposes are not a filing system — they are a design constraint. A decision meeting needs a designated decision-maker, credible options presented objectively, and fair airtime for dissent; an idea-generation meeting needs quiet thinking time and a format that collects ideas from everyone; a relationship-building meeting needs openness, not an agenda packed with status. These requirements conflict, which is exactly why a meeting trying to decide, inform, and brainstorm at once does all three badly. Naming the primary purpose is what makes every other design choice decidable.\n\n![Diagram of five purpose chips with one selected, feeding an arrow that branches into format, attendees, and pre-reads.](assets/images/amazing-meetings/one-purpose-design-constraint.jpeg)\n**Figure 1:** *One primary purpose is the design constraint: once it is named, format, attendee list, and preparation all become decidable.*\n\n**The attendee list is a design decision, not a courtesy broadcast.** Every missing necessary person turns the meeting into a rehearsal for the real one; every extraneous attendee dilutes the discussion and normalizes passive observation. The tests are symmetric: everyone necessary, no one extraneous, the affected people represented. Inviting someone \"to keep them in the loop\" is what written summaries are for.\n\n**Unprepared attendees spend the meeting becoming prepared.** If the agenda, pre-reads, and context arrive with the meeting instead of before it, the first half of the slot is consumed reconstructing what a document could have delivered. Sending materials in advance is not politeness — it moves the ramp-up out of the room so the shared time is spent on what actually requires being together. Planning in advance how follow-ups will be captured serves the same end: the close of the meeting is designed before it opens.\n\n**The loudest voices are not a representative sample.** Left alone, a meeting's airtime distributes by confidence and interruption tolerance, not by who has the most useful thing to say. Managing this is the facilitator's job, and it is active work: explicitly inviting dissent, setting norms for respectful discussion, choosing formats that help quieter people contribute, watching for interruptions, directing questions at people who have not spoken, and limiting overtalking — politely, but firmly. A decision that only the talkers shaped will also be a decision only the talkers feel bound by.\n\n![Two meeting-table panels: two dominant speech bubbles crowding out four silent participants, versus equal-sized bubbles with a facilitator inviting a quiet voice.](assets/images/amazing-meetings/airtime-facilitation-before-after.jpeg)\n**Figure 2:** *Left alone, airtime distributes by confidence; facilitated, it distributes by who has something useful to say.*\n\n**A meeting that ends without owners ends without consequences.** The summary before the close — what we decided, what feedback was given, which ideas we are carrying forward — is what converts an hour of talk into a record. Next steps without an owner and a timeline are wishes. And the discipline runs one level higher too: the recurring meeting that no longer passes the gut-check — no longer a good use of time, no longer truly necessary, no longer needing me in the room — gets restructured, delegated, or cancelled rather than ritually attended.\n\n![Funnel diagram: recurring meeting cards entering a three-question filter, with one path to a checked calendar and another to cancelled or restructured icons.](assets/images/amazing-meetings/gut-check-filter.jpeg)\n**Figure 3:** *The gut-check runs as a standing filter: a recurring meeting that no longer passes gets cancelled or restructured, not ritually attended.*\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| Every meeting has one stated primary purpose and a definition of success. | A standing meeting justifies itself by being on the calendar. |\n| Format, attendees, and prep are chosen to serve that purpose. | One format — status-round-plus-discussion — fits every meeting. |\n| Everyone necessary is in the room; no one extraneous is. | Inviting broadly is a safe default — observers are free. |\n| Agendas and pre-reads go out in advance. | Context can be delivered live in the first twenty minutes. |\n| I actively manage airtime and invite dissent. | Whoever talks most has the most to say. |\n| Meetings close with summarized outcomes, owners, and timelines. | \"Great discussion\" is an acceptable ending. |\n| Meetings that fail the gut-check are cancelled or restructured. | Cancelling a recurring meeting is an insult to its organizer. |\n\nConcretely: anyone attending my meetings can state the meeting's purpose in one sentence, received the materials in advance, and leaves knowing the decisions made, who owns each next step, and when it is due. And my calendar shows the negative space too — meetings I declined because I was not needed, and recurring meetings I killed when the gut-check said no.\n\n## Anti-Patterns\n\n- **The everything meeting.** One slot trying to decide, inform, brainstorm, and bond at once — leaving every purpose half-served and every attendee unsure why they were there.\n- **The purposeless recurring meeting.** A standing invite that outlived its reason, attended out of ritual because no one asked the gut-check questions.\n- **The audience meeting.** An attendee list padded with observers \"for visibility,\" turning a working discussion into a performance.\n- **Live ramp-up.** No agenda, no pre-reads — the meeting spends its first half delivering context a document could have carried.\n- **Facilitation by gravity.** Letting airtime settle on the loudest voices, treating quiet as agreement and interruption as enthusiasm.\n- **The ownerless close.** Ending on \"great discussion\" with next steps that belong to no one and are due never.\n- **The fake decision meeting.** Convening people to \"decide\" something already decided — a special case of a meeting whose real purpose is not the stated one.\n\n## Related Records\n\n- [Getting Things Done](getting-things-done.html) — meetings are where much of a team's execution is coordinated; this record keeps that coordination from becoming its own tax.\n- [Leading a Small Team](leading-a-small-team.html) — the team rhythm these meetings serve; 1:1s are the relationship-building purpose run on a cadence.\n- [The Art of Feedback](feedback.html) — the feedback-meeting checks in this record apply the feedback discipline to work-in-progress reviews.\n- [Meetings](../grounded-engineering-executive/meetings.html) (executive journal) — the executive-calendar counterpart: which meetings an executive runs and attends; this record governs how any single meeting is designed and facilitated.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs every meeting I organize or run — its purpose, format, attendee list, preparation, facilitation, and close — and the standing gut-check applied to recurring meetings I attend. I revisit it if attendees cannot state a meeting's purpose when asked, if action items from my meetings recur without owners, or if a quarter passes without a single recurring meeting being restructured or cancelled — a sign the gut-check has stopped running.\n\n## Authoritative References\n\n- Julie Zhuo, *The Making of a Manager: What to Do When Everyone Looks to You* (Portfolio/Penguin, 2019) — the \"Amazing Meetings\" chapter this record distills.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "4 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Define the outcome\n\n- [ ] I know the primary purpose of this meeting\n- [ ] The meeting is mainly for one of these: making a decision, sharing information, providing feedback, generating ideas, or strengthening relationships\n- [ ] I can clearly state what success looks like by the end\n\n## 2. Match the format to the purpose\n\n- [ ] The structure of the meeting fits its goal\n- [ ] I am not trying to make one meeting do too many things\n- [ ] I will redirect off-topic discussion and park unrelated issues\n\n## 3. Invite the right people\n\n- [ ] Everyone necessary is invited\n- [ ] No one extraneous is invited\n- [ ] The people affected by the decision or discussion are represented\n- [ ] The attendee list supports useful discussion, not passive observation\n\n## 4. Help people come prepared\n\n- [ ] The agenda is sent in advance\n- [ ] Pre-reads or slides are shared in advance when needed\n- [ ] Participants have enough context to contribute thoughtfully\n- [ ] I have planned how follow-ups and next steps will be captured\n\n## 5. Make participation safe and easy\n\n- [ ] I will explicitly encourage questions, dissent, and honest input\n- [ ] I will set norms for respectful discussion\n- [ ] I will use a format that helps quieter people contribute\n- [ ] I will avoid letting only the loudest voices dominate\n\n## 6. Manage airtime\n\n- [ ] I will watch for interruptions\n- [ ] I will make space for people who have not spoken\n- [ ] I will use directed questions when helpful\n- [ ] I will limit overtalking politely but firmly\n\n## 7. Close with clarity\n\n- [ ] We will summarize decisions, feedback, or ideas before ending\n- [ ] We will agree on next steps\n- [ ] Each action item has an owner\n- [ ] Each action item has a timeline or next check-in\n\n## 8. Purpose-specific checks\n\n*Run the block that matches this meeting's primary purpose.*\n\n**Decision meeting**\n\n- [ ] A clear decision-maker is designated\n- [ ] Credible options are presented objectively\n- [ ] Relevant background information is included\n- [ ] The team recommendation is clear, if there is one\n- [ ] Dissenting views will get fair airtime\n- [ ] People affected by the decision will feel the process was fair\n\n**Information-sharing meeting**\n\n- [ ] The information is worth sharing live rather than by email/chat\n- [ ] The content is clear and memorable\n- [ ] The presentation is engaging\n- [ ] The audience should leave having learned something valuable\n\n**Feedback meeting**\n\n- [ ] The purpose is to improve work in progress, not to judge it\n- [ ] Success criteria are clear\n- [ ] Current status, concerns, and changes are presented honestly\n- [ ] Specific questions are framed to get useful feedback\n- [ ] Next steps and future milestones are clear\n\n**Idea-generation meeting**\n\n- [ ] People have quiet time to think before or during discussion\n- [ ] The format collects ideas from everyone, not just the loudest\n- [ ] The discussion helps ideas build on each other\n- [ ] The meeting ends with a path to action\n\n**Relationship-building meeting**\n\n- [ ] The meeting is designed to build trust and understanding\n- [ ] It encourages openness and authenticity\n- [ ] People should leave feeling cared for and more connected\n\n## 9. Final gut-check\n\n- [ ] This meeting is a good use of people's time\n- [ ] Attendees will likely leave with new knowledge, clearer next steps, a sense of engagement, and a feeling of being welcomed\n- [ ] This meeting truly needs to happen\n- [ ] I personally need to be there\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why a meeting earns its slot with one primary purpose — and dies by the gut-check when it stops passing — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. ARLO: an engineer newly stepping into management, buzz-cut hair, zip-up hoodie with rolled sleeves, sticker-covered laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Arlo pressed against a wall calendar tiled solid with meeting blocks while Vera watches.](assets/images/amazing-meetings/comic-01-the-calendar-wall.jpeg)\n**Panel 1:** *The hook: a calendar full of meetings that were never asked to justify themselves.*\n\n![Comic panel: a chaotic meeting mixing presentation, brainstorm, and decision at once while the clock runs out.](assets/images/amazing-meetings/comic-02-the-everything-meeting.jpeg)\n**Panel 2:** *The problem: the everything meeting — three purposes at once, none of them served.*\n\n![Comic panel: a huge invite list, then a packed room of passive observers watching two people talk.](assets/images/amazing-meetings/comic-03-the-audience-meeting.jpeg)\n**Panel 3:** *The wrong way: the audience meeting — observers are not free, and the loop has cheaper channels.*\n\n![Comic panel: Vera circles one of five purpose chips on a whiteboard while Arlo watches.](assets/images/amazing-meetings/comic-04-one-primary-purpose.jpeg)\n**Panel 4:** *The principle: one primary purpose, stateable as an outcome — the constraint that makes every other choice decidable.*\n\n![Comic panel: Arlo trims an attendee list while pre-read paper planes fly from his laptop to recipients.](assets/images/amazing-meetings/comic-05-designed-backward.jpeg)\n**Panel 5:** *How it runs: the meeting is designed before it opens — necessary people only, context sent ahead.*\n\n![Comic panel: Arlo pauses an overtalker with one hand and invites a quiet attendee with the other.](assets/images/amazing-meetings/comic-06-managing-the-airtime.jpeg)\n**Panel 6:** *The mechanic: facilitation is active work — the loudest voices are not a representative sample.*\n\n![Comic panel: Arlo hovers over the delete button of a cobwebbed recurring meeting entry while Vera nods.](assets/images/amazing-meetings/comic-07-killing-your-own-meeting.jpeg)\n**Panel 7:** *The cost: the gut-check spares no one — including the meeting you created.*\n\n![Comic panel: a closing summary board with names and dates on every action, next to a calendar with open white space.](assets/images/amazing-meetings/comic-08-owners-and-negative-space.jpeg)\n**Panel 8:** *The closer: outcomes summarized, every action owned — and a calendar that shows the meetings that no longer happen.*\n"}]}]}</script>

    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
