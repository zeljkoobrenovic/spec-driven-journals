own head first.** I acknowledge what I am feeling — guilt, anxiety, isolation, grief — separate facts from self-blame, drop the stories \"this is all happening to me\" and \"I should have been perfect,\" and focus on what is in my control right now, committing to one concrete next step.\n- **Read the team's emotional state as an operating risk.** I watch for fear signals (withdrawal, layoff fixation, silence in meetings), grief signals (low energy, mourning lost colleagues or plans), and guilt or stress signals (overwork, inability to disconnect) — and I treat morale problems as trust and purpose problems, not side issues.\n- **Communicate on a cadence, without fake certainty.** I tell people what I know, what I do not know, and when to expect updates; I give the \"why\" behind priority changes in plain language and do not let rumor gaps stay open.\n- **Prioritize in scarcity mode.** Fewer things, done better: one most important goal for the period, a definition of what success looks like, an explicit non-goals or stop-doing list, and paused work that does not ladder to the top goal — rechecked whenever conditions change.\n- **Handle layoffs and hard news with clarity and speed.** If layoffs may happen, I am clear on the reason, decide on future company needs rather than comfort or recency, move quickly once decided, equip managers with context and scripts, define support precisely, follow up personally with impacted people — and support those who remain just as intentionally. Each other kind of hard news — cut bonuses, hiring freezes, pay cuts, stalled promotions, shifting strategy, missed goals — gets its own honest script.\n- **Run a weekly rhythm and keep morale grounded in reality.** Every week: restate the top priority, review what was deprioritized, surface risks and rumors early, share new facts, invite questions, check for overload, recognize progress however small. Morale is not cheerleading — it is protected trust and protected purpose.\n\n![Three-stage sequence diagram: get your own head straight, read the team's emotional state, then run the operating machinery.](assets/images/managing-downturn/downturn-sequence-self-team-mechanics.jpeg)\n**Figure 1:** *The order is the model: own head first, the team's emotional state second, the disciplined machinery third.*\n\n## How to Read This\n\nThis journal is my engineering-management operating model, each record grounded in one source. This record sits in the *Making of a Manager* section but is honest about its provenance: the source is a supplementary checklist that extends the themes of Julie Zhuo's *The Making of a Manager* (Portfolio/Penguin, 2019) — her trust-first, human-first management approach applied to downturns — rather than a chapter of the book itself. The runnable version — the self-check, the emotional-signals watchlist, the hard-news scripts, the weekly rhythm — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**A manager who has not processed their own state transmits it.** Downturns hit managers with a specific cocktail — guilt about decisions, anxiety about the future, isolation from holding information the team does not have. Unprocessed, that leaks into every interaction as either false cheer or visible dread. The two stories to drop are precise: \"this is all happening to me\" surrenders agency, and \"I should have been perfect\" rewrites the past instead of navigating the present. The replacement — \"I can influence how we navigate this\" — is not positive thinking; it is a scoping exercise that points at what is actually in my control.\n\n**Emotional undercurrents are operating risks because they change how the team performs.** Fear produces withdrawal, reduced creativity, and silence in exactly the meetings where I need honest signals. Grief produces low energy that looks like a performance problem but is not one. Guilt produces overwork and burnout in the people I most need to last. Reading these signals is not soft-skills garnish — it is diagnostics on the machine that has to execute the recovery. And most morale problems underneath are trust and purpose problems, which is why cheerleading does not fix them.\n\n**\"What I know, what I don't, when you'll hear more\" beats both silence and spin.** In uncertainty, people fill information gaps with rumors, and rumors are always worse than reality — or worse, unevenly distributed. Fake optimism and false certainty burn credibility exactly when I need it most; silence reads as concealment. The steady cadence is the fix: a predictable rhythm of honest updates, including explicit \"I don't know yet\" and a date for the next update, keeps the rumor gap closed without pretending to certainty I do not have.\n\n![Two timelines contrasting sparse updates with rumor clouds growing in the gaps against a steady cadence of know / don't know / next-update messages.](assets/images/managing-downturn/cadence-closes-rumor-gap.jpeg)\n**Figure 2:** *Rumors grow in the gaps between updates; a steady cadence of \"know / don't know / when you'll hear more\" leaves them no room.*\n\n**Scarcity is a forcing function, and it only works if the stop-doing list is explicit.** A downturn means fewer people and less money chasing the same ambitions; pretending otherwise burns the team on work that no longer matters. One top goal with a concrete definition of success is half the discipline; the other half is the explicit non-goals list and the permission structure around it — people need my language for saying no to low-priority work, explicit quick decision paths, and escalation as a normal move rather than a failure. Speed in a downturn comes from clarity, not pressure.\n\n![Comparison of shaving effort evenly off every workstream versus one funded top goal with an explicit stopped list and paused work.](assets/images/managing-downturn/scarcity-mode-vs-peanut-butter.jpeg)\n**Figure 3:** *Scarcity mode is not less of everything — it is one top goal, an explicit stop-doing list, and paused work that stays paused.*\n\n**Each kind of hard news has its own honest shape, and delivering it fast beats delivering it perfectly.** Cut bonuses need acknowledged disappointment plus the business rationale, not spin. Pay cuts need transparency about why and what recovery looks like, plus reaffirming the person's value. Stalled promotions need honesty about timelines and growth reframed beyond titles. Layoffs need the most discipline of all: decisions based on future company needs rather than comfort or recency, speed once decided, equipped managers, precisely defined support — and just as much intention for the people who remain, because they are watching how the departed were treated to learn what this company is.\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| I process my own guilt and anxiety before addressing the team. | I share every private fear with the team — honesty is filtered by judgment about audience and detail. |\n| I tell people what I do not know and when updates will come. | I promise outcomes I cannot guarantee to make the room feel better. |\n| One top goal, an explicit stop-doing list, paused non-laddering work. | Everything gets a little less effort — peanut-buttering the cut across all work. |\n| Layoff decisions follow future company needs, executed quickly. | Layoffs by recency or comfort, or slow-rolled to soften the discomfort of deciding. |\n| Morale is protected trust and purpose, grounded in reality. | Morale is cheerleading — sugarcoating until the team stops believing anything I say. |\n| Trust deepens when I show up honestly in hard times. | Discomfort means I am failing — hard periods feel bad even when led well. |\n\nConcretely: in a downturn my team can name the single top priority and what was explicitly stopped, everyone knows when the next update comes, no rumor survives a week unaddressed, every piece of hard news arrived with its rationale attached, and the weekly rhythm — priority, deprioritized, risks, facts, questions, overload check, recognition, next steps — runs without fail.\n\n## Anti-Patterns\n\n- **Leaking the unprocessed state.** Walking into the team meeting with my own guilt and anxiety unexamined, so the team reads dread or false cheer instead of direction.\n- **Treating morale as a side issue.** Dismissing withdrawal, silence, and low energy as attitude problems instead of reading them as fear and grief — operating risks in the system that must execute the recovery.\n- **The rumor gap.** Going quiet between decisions, letting the team's imagination — always worse than reality — fill the space.\n- **Fake optimism.** \"It's all going to be fine\" delivered without evidence, spending credibility I will need for the next hard message.\n- **Peanut-butter prioritization.** Cutting 20% of effort from everything instead of stopping whole workstreams, so nothing ships and everyone burns out.\n- **The slow, comfortable layoff.** Deciding based on recency or personal comfort, then dragging execution out — maximizing anxiety for everyone while sparing only me.\n- **Forgetting the survivors.** Handling departures carefully and assuming those who remain are fine, when they are watching exactly how the departed were treated.\n\n## Related Records\n\n- [Managing Yourself](managing-yourself.html) — the get-your-own-head-straight discipline is that record applied under maximum pressure.\n- [Getting Things Done](getting-things-done.html) — the prioritization machinery this record shifts into scarcity mode.\n- [Nurturing Culture](nurturing-culture.html) — a downturn is the stress test of culture: what I repeat, model, and reward under pressure is what the team learns the values really are.\n- [The Art of Feedback](feedback.html) — hard news lands on the honesty and trust foundations that record builds in ordinary times.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs how I lead a team through cost cuts, layoffs, hiring freezes, and stalled growth — my own state, the communication cadence, scarcity-mode prioritization, hard-news delivery, and the weekly rhythm. I revisit it after each real downturn episode with a blameless retrospective, when the weekly rhythm has quietly lapsed for more than two weeks, or when I catch myself delivering hard news without its rationale attached.\n\n## Authoritative References\n\n- Julie Zhuo, *The Making of a Manager: What to Do When Everyone Looks to You* (Portfolio/Penguin, 2019) — the management approach this record extends; the source checklist is supplementary material applying the book's trust-first themes to downturns, not a chapter of the book.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "6 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Get your own head straight\n\n- [ ] Acknowledge what I am feeling: guilt, anxiety, isolation, confusion, frustration, grief, stress\n- [ ] Separate facts from self-blame\n- [ ] Stop telling myself \"this is all happening to me\"\n- [ ] Stop telling myself \"I should have been perfect\"\n- [ ] Replace both with: \"I can influence how we navigate this\"\n- [ ] Focus on progress, not perfection\n- [ ] Identify what is in my control right now\n- [ ] Commit to one concrete next step\n\n## 2. Read the emotional state of the team\n\n- [ ] Look for fear signals: withdrawal, fixation on layoffs, reduced creativity, silence in meetings\n- [ ] Look for grief signals: low energy, loss of enthusiasm, disappointment, mourning lost colleagues or plans\n- [ ] Look for guilt/stress signals: overwork, burnout, overcompensation, inability to disconnect\n- [ ] Recognize that morale problems are often trust and purpose problems\n- [ ] Treat emotional undercurrents as operating risks, not side issues\n\n## 3. Build trust intentionally\n\n- [ ] Explain how the team got here\n- [ ] Own my part honestly\n- [ ] Speak like a human, not a corporate script\n- [ ] Address the big unanswered questions directly\n- [ ] Invite questions and suggestions regularly\n- [ ] Validate people's feelings without getting defensive\n- [ ] Share honestly, but with judgment about audience and detail\n- [ ] Ask the team for help explicitly\n- [ ] Repeat key context often as conditions change\n\n## 4. Communicate during uncertainty\n\n- [ ] Tell people what I know\n- [ ] Tell people what I do not know\n- [ ] Tell people when they should expect updates\n- [ ] Avoid fake optimism and false certainty\n- [ ] Do not let rumor gaps stay open\n- [ ] Give the \"why\" behind changes in priorities\n- [ ] Use plain language for difficult topics\n- [ ] Keep a steady cadence of updates\n\n## 5. Prioritize ruthlessly\n\n- [ ] Adopt a scarcity mindset: do fewer things, but do them better\n- [ ] Define the single most important goal for the next period\n- [ ] Identify what success actually looks like\n- [ ] Use a prioritization framework: impact vs. effort, RICE, or OKRs\n- [ ] Create an explicit \"non-goals\" or \"stop doing\" list\n- [ ] Pause work that does not ladder to the top goal\n- [ ] Recheck priorities whenever conditions change\n\n## 6. Help the team move faster\n\n- [ ] Give people permission to say no to low-priority work\n- [ ] Provide language they can use to push back\n- [ ] Encourage escalation when teams are stuck in disagreement\n- [ ] Make quick decision paths explicit\n- [ ] Call out changes in priority in real time\n- [ ] Reinforce what matters most every week\n- [ ] Keep the team aligned on why the work matters now\n\n## 7. If layoffs may happen\n\n- [ ] Be clear on the reason: percentage-based cost cuts, or strategy/role reshaping\n- [ ] Decide based on future company needs, not comfort or recency\n- [ ] Identify critical projects, skills, and roles first\n- [ ] Move quickly once a decision is made\n- [ ] Equip managers with context, scripts, and FAQs\n- [ ] Define support clearly: severance, benefits, transition support\n- [ ] Write down all logistics and reference materials\n- [ ] Communicate timeline and process with maximum clarity\n- [ ] Follow up personally with impacted people\n- [ ] Support the people who remain just as intentionally\n\n## 8. Deliver hard news well\n\n**Bonuses reduced or removed**\n\n- [ ] Acknowledge disappointment directly\n- [ ] Explain the business rationale\n- [ ] Reinforce appreciation in non-monetary ways\n\n**Hiring freeze**\n\n- [ ] Reassess workload\n- [ ] Cut lower-priority work\n- [ ] Check team sustainability\n\n**Pay cuts**\n\n- [ ] Be transparent about why\n- [ ] Explain what recovery looks like\n- [ ] Reaffirm the person's value\n\n**Promotion/role growth stalls**\n\n- [ ] Reframe growth beyond title changes\n- [ ] Offer stretch work, mentorship, or cross-functional exposure\n- [ ] Be honest about timelines\n\n**Strategy keeps shifting**\n\n- [ ] Explain why priorities changed\n- [ ] Connect each shift to company goals\n- [ ] Ask for input\n- [ ] Create pockets of stability where possible\n\n**Missed goals**\n\n- [ ] Acknowledge disappointment\n- [ ] Highlight effort and learning\n- [ ] Run retrospectives without blame\n- [ ] Translate lessons into next-quarter actions\n\n## 9. Keep morale grounded in reality\n\n- [ ] Remember morale is not cheerleading\n- [ ] Protect trust\n- [ ] Protect purpose\n- [ ] Recognize contributions publicly\n- [ ] Show how today's work connects to survival or recovery\n- [ ] Avoid sugarcoating\n- [ ] Reinforce that people's work still matters\n\n## 10. Weekly operating rhythm\n\n- [ ] Re-state the top priority\n- [ ] Review what was deprioritized\n- [ ] Surface risks and rumors early\n- [ ] Share any new facts or decisions\n- [ ] Invite questions\n- [ ] Check for overload on key people\n- [ ] Recognize progress, however small\n- [ ] Confirm next steps and owners\n\n## 11. Personal leadership reminders\n\n- [ ] Be real\n- [ ] Be clear\n- [ ] Be fast when needed\n- [ ] Be compassionate\n- [ ] Be consistent\n- [ ] Do not confuse discomfort with failure\n- [ ] Remember: trust deepens when I show up honestly in hard times\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why leading a downturn starts inside your own head — and how honesty builds the asset it threatens — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. ARLO: an engineer newly stepping into management, buzz-cut hair, zip-up hoodie with rolled sleeves, sticker-covered laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Arlo stares at a cost-cuts memo at night with a storm cloud over his head.](assets/images/managing-downturn/comic-01-the-memo-lands.jpeg)\n**Panel 1:** *The hook: the downturn lands on the manager first — as guilt, anxiety, and isolation.*\n\n![Comic panel: Arlo's strained face transmits visible anxiety waves to his worried team.](assets/images/managing-downturn/comic-02-the-team-reads-his-face.jpeg)\n**Panel 2:** *The problem: a manager who has not processed his own state transmits it.*\n\n![Comic panel: Arlo delivers forced cheer while rumor scribbles grow on the wall behind unconvinced teammates.](assets/images/managing-downturn/comic-03-fake-optimism.jpeg)\n**Panel 3:** *The wrong way: fake optimism — spending credibility exactly when it is needed most, while the rumor gap fills itself.*\n\n![Comic panel: Vera shows Arlo a notebook with two crossed-out stories and one circled replacement.](assets/images/managing-downturn/comic-04-own-head-first.jpeg)\n**Panel 4:** *The principle: drop 'this is happening to me' and 'I should have been perfect' — keep 'I can influence how we navigate this.'*\n\n![Comic panel: Arlo briefs his team at a whiteboard with know, don't-know, and next-update columns.](assets/images/managing-downturn/comic-05-the-cadence-board.jpeg)\n**Panel 5:** *How it runs: what I know, what I don't, and when you'll hear more — on a cadence the team can trust.*\n\n![Comic panel: Arlo flags one top goal and crosses out other workstreams while Vera approves.](assets/images/managing-downturn/comic-06-one-goal-stop-the-rest.jpeg)\n**Panel 6:** *The mechanic: scarcity mode — one top goal, an explicit stop-doing list, and permission to say no.*\n\n![Comic panel: Arlo delivers hard news face to face, uncomfortable but honest, with the reason attached.](assets/images/managing-downturn/comic-07-hard-news-honestly.jpeg)\n**Panel 7:** *The cost: hard news delivered fast and honestly feels bad even when led well — discomfort is not failure.*\n\n![Comic panel: a steadier team around Arlo with a bridge on the whiteboard as Vera nods from the doorway.](assets/images/managing-downturn/comic-08-trust-deepens.jpeg)\n**Panel 8:** *The closer: trust deepens when you show up honestly in hard times — that is the asset a downturn can build.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
