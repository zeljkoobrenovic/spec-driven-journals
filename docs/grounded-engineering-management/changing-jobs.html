<script id="data" type="application/json">{"meta": {"id": "EM-CHANGING-JOBS", "status": "draft:gray", "title": "Changing Jobs", "date": "2026-07-28", "author": "Željko Obrenović", "permalink": "changing-jobs", "timetoread": "6 min", "excerpt": "I coach engineers through the whole job-change arc — exploring deliberately, weighing promotion against switching, preparing for interviews, handling down- and up-leveled offers, and onboarding seriously — because a job change is a 5–10 year career decision, not a compensation event. I would rather lose someone well than keep them badly, and an engineer who moves deliberately stays a colleague for decades.", "tags": "engineering management, changing jobs, interviews, leveling, onboarding, career growth", "icon": "assets/icons/changing-jobs.png", "logo": "assets/images/changing-jobs/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering management", "changing jobs", "interviews", "leveling", "onboarding", "career growth"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: A job change is a career decision with a 5–10 year horizon, not a compensation event — and I coach it that way, even when the honest advice points out the door. I expect engineers to explore deliberately rather than react to recruiter mail, to weigh internal promotion against switching with full awareness of what a switch resets — trust, context, influence — to treat interviewing as a learnable skill and leveling as negotiable, and to take onboarding as seriously as the interview. I would rather lose an engineer well than keep them badly: someone who leaves deliberately and lands well stays a colleague for decades.\n\n## Statement\n\nWhat I expect from engineers navigating a job change, and how I coach each stage:\n\n- **Know your stance before you engage.** I expect engineers to decide whether they are actively looking, passively open, or happy but curious — and to know what would actually make a move worth pursuing, so recruiter conversations inform rather than destabilize. Comparing opportunities means comparing compensation, role, growth, team, mission, flexibility, and long-term upside — not one number.\n- **Weigh promotion against switching honestly — with my help.** Someone already performing at the next level, inside a slow or backward-looking promotion process, should compare internal odds with external offers. I will make that comparison with them honestly, including the part that argues for staying: a switch resets trust, context, and influence, and for senior roles tenure and relationships are much of the value.\n- **Treat interviewing as a learnable skill.** Ask the recruiter what the process looks like; prepare specifically for coding, system design, behavioral, and domain rounds; expect deeper and additional rounds at staff+ levels. Interview performance is prepared, not innate, and I say so plainly.\n- **Handle leveling with clear eyes.** A down-leveled offer is judged on title *and* compensation together, against what the offered level means at that company — and it can be pushed back on or walked away from. An up-leveled offer needs clear expectations, an understanding of why they believe you're ready, and the support to deliver from day one.\n- **Onboard as seriously as you interviewed.** Celebrate the offer, then prepare: ask the future manager how to prepare, clarify goals for the first one, three, and six months, keep a work log from day one, learn how reviews and promotions work, and meet key people early.\n- **Leave well.** The move is part of a long career among the same people. No burned bridges, no coasting notice periods — the way someone leaves my team is the last thing everyone remembers.\n\n## How to Read This\n\nThis journal is my engineering-management operating model. This record is grounded in the Changing Jobs material of Gergely Orosz's *The Software Engineer's Guidebook* (Pragmatic Engineer, 2023), read from the manager's side of the table: the book tells engineers how to run the move; this record states how I coach engineers through it — including **honestly toward the door** when that is the right answer. The runnable version — the checklist I hand an engineer weighing or making a move — lives in the **Checklist** tab of this post.\n\n![A winding path with milestones for explore, decide, interview, offer, onboard, and leave well, continuing toward a horizon marked five to ten years.](assets/images/changing-jobs/job-change-arc.jpeg)\n**Figure 1:** *The move is one arc, not one event: it starts before the recruiter mail and keeps counting years after the offer is signed.*\n\n\n\n## Rationale\n\n**A manager who can't discuss leaving can't coach a career.** If the only career conversations I can hold are the ones where the answer is \"stay,\" **my coaching is advertising**. Engineers know when their promotion path is blocked or their growth has flattened, and pretending otherwise costs me credibility on everything else. Coaching the job-change arc openly means the engineers who stay are staying deliberately — and the ones who leave, **leave as allies** who recommend the team, refer candidates, and sometimes come back senior.\n\n**Optimizing for title or compensation alone is the classic mispriced trade.** The source is blunt about this: think about the **5–10 year career impact**, not the next offer letter. A move that pays 15% more but lands in a stagnant team, a weak manager, or work with no growth is expensive at that horizon. So I push engineers to compare opportunities on the full set — role, growth, team, mission, flexibility, long-term upside — and to treat the offer number as **one input, not the verdict**.\n\n**A switch resets more than most engineers price in.** Trust, context, and influence do not transfer; they are **rebuilt from zero** at the new company. For an engineer early in their career that reset is cheap. For a senior engineer whose effectiveness rests on years of relationships and system knowledge, it is a real cost that an external offer's shine hides — which is why I put \"**what does the switch reset?**\" next to \"what does the switch pay?\" in every such conversation.\n\n![A balance scale weighing an envelope labeled offer against blocks labeled trust, context, and influence, with gauges beside them reset to zero.](assets/images/changing-jobs/what-a-switch-resets.jpeg)\n**Figure 2:** *What the switch pays is printed on the offer; what it resets — trust, context, influence — is rebuilt from zero, and costs most at senior levels.*\n\n\n\n**Leveling at the offer stage sets the slope of the next several years.** A down-level is not automatically an insult — some companies genuinely hold higher bars, and pay can exceed the old title's — but it must be examined: what does the offered level mean, what does the next one require, can the committee reconsider? And it is **legitimate to walk away** if the level is badly misaligned with the career. An up-level is not automatically a win either: it is higher expectations from day one, and taking it without clear success criteria and support is how strong engineers get **set up to fail**.\n\n**Onboarding is where the move is actually won or lost.** The interview gets you the job; **the first months determine what the job becomes**. The engineers who land well do it deliberately — goals clarified for one, three, and six months; a work log and a weekly journal from the start; a cheat sheet for acronyms, systems, and people; a buddy; early meetings with key stakeholders. At senior and staff levels the bar rises: understand the business context, meet peer staff engineers, spend time with product and cross-functional partners. I hold my own new joiners to this, and I tell departing engineers to hold themselves to it wherever they land.\n\n![A rising timeline from day one through one, three, and six month checkpoints, fed by icons for a work log, cheat sheet, buddy, and stakeholder meetings.](assets/images/changing-jobs/deliberate-landing-timeline.jpeg)\n**Figure 3:** *The interview gets the job; the landing decides what it becomes — goals at one, three, and six months, with the work log and the map of people started on day one.*\n\n\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| I coach job-change decisions honestly, including toward the door. | I encourage attrition — most honest conversations end with **a better reason to stay**. |\n| Compare promotion odds with external offers when the path is slow. | Jump at the first stall — the switch's reset costs are real. |\n| Weigh offers across role, growth, team, mission, and upside. | Compensation doesn't matter — it is one axis among several, and market value is worth knowing. |\n| A down-leveled offer can be questioned, negotiated, or declined. | A down-level is always wrong — some companies' bars and pay make it a fair trade. |\n| An up-level is accepted with clear expectations and support. | An up-level is free — it is higher expectations from day one. |\n| Onboarding is prepared as seriously as the interview. | The move ends at the signed offer — **the first six months decide** what the move was worth. |\n\nConcretely: an engineer on my team weighing a move can bring it to me without fear; they leave that conversation with an honest read on their internal odds, a clear-eyed comparison of **what a switch buys and resets**, and — if they go — a proper handover, a warm goodbye, and the onboarding checklist for their first ninety days somewhere else.\n\n## Anti-Patterns\n\n- **The reactive jump.** Interviewing because a recruiter's number was flattering, without ever deciding what would make a move worth it — the stance drives the search, not the inbox.\n- **Optimizing for the offer letter.** Taking the highest title-and-compensation package while ignoring team, manager, growth, and the 5–10 year trajectory.\n- **Ignoring what the switch resets.** Pricing the new salary but not everything rebuilt from zero — especially expensive at senior levels, where tenure is much of the value.\n- **Winging the interviews.** Treating interview performance as a fixed trait instead of a prepared skill — not even asking the recruiter what the process looks like.\n- **Swallowing a down-level unexamined.** Accepting a lower title without asking what the level means, whether it can be reconsidered, or whether it is misaligned enough to decline.\n- **Taking an up-level without support.** Accepting the bigger title without clear expectations or the backing to meet them — arriving set up to fail.\n- **Celebrating instead of preparing.** Coasting from signed offer to day one, then improvising onboarding — no goals, no work log, no map of who matters.\n- **Leaving badly.** Burning bridges, coasting the notice period, or hoarding context on the way out — the last impression is the durable one.\n\n## Related Records\n\n- [Promotions](promotions.html) — the internal alternative: what a promotion campaign here requires, and the odds a job change is weighed against.\n- [Own Your Career](own-your-career.html) — the ownership contract that makes an engineer's move deliberate rather than reactive.\n- [Engineering Career Paths](engineering-career-paths.html) — the map of company types, ladders, and tiers a job change navigates across.\n- [Thriving in Different Environments](thriving-in-different-environments.html) — what awaits after the move: reading the new environment and adapting to it.\n- [Your First Three Months](first-three-months.html) — the same landing problem from the manager's side; the onboarding discipline is shared.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs how I coach engineers on my teams through exploring, deciding, interviewing, negotiating level, and onboarding — whether the move is internal or out the door. I revisit it if departures start surprising me — which means **the honest-conversation loop has failed** — if departing engineers' exit decisions repeatedly cite **the same fixable internal blocker**, or if the hiring market shifts enough that the leveling and preparation guidance no longer matches what engineers actually face.\n\n## Authoritative References\n\n- Gergely Orosz, *The Software Engineer's Guidebook* (Pragmatic Engineer, 2023) — the Changing Jobs material this record distills, via its companion checklist.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "4 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record — the one I hand an engineer weighing or making a move. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Exploring new opportunities\n\n- [ ] I have decided whether I am actively looking, passively open, or happy but curious.\n- [ ] I am clear on what would make a new opportunity worth pursuing.\n- [ ] I have updated my LinkedIn/profile if actively looking.\n- [ ] I respond selectively to inbound recruiter messages.\n- [ ] I use conversations to understand my market value.\n- [ ] I compare opportunities against compensation, role, growth, team, mission, flexibility, and long-term upside.\n\n## 2. Promotion vs switching jobs\n\n- [ ] I have assessed whether I am already performing at the next level.\n- [ ] I understand whether my company's promotion process is slow or backward-looking.\n- [ ] I have compared internal promotion odds with external offers.\n- [ ] I have considered that switching jobs may reset my trust, context, and influence.\n- [ ] For senior roles, I have weighed the value of tenure and internal relationships.\n- [ ] I am not optimizing only for title or compensation; I think about 5–10 year career impact.\n\n## 3. Preparing for tech interviews\n\n- [ ] I have asked the recruiter what the interview process looks like.\n- [ ] I have confirmed whether there will be coding, system design, behavioral, domain deep-dive, or bar-raiser interviews.\n- [ ] My resume clearly highlights relevant experience and measurable impact.\n- [ ] I practice coding and debugging interviews.\n- [ ] I prepare for system design or architecture interviews.\n- [ ] I have behavioral stories ready about motivation, conflict, hard situations, and values.\n- [ ] I ask clarifying questions during technical interviews.\n- [ ] For take-home tasks, I confirm time expectations and whether feedback will be provided.\n- [ ] For staff+ roles, I prepare for deeper domain, product, director-level, or second system-design rounds.\n\n## 4. Handling down-leveling\n\n- [ ] I compare both title and compensation, not just one.\n- [ ] I have asked what the offered level means and what the next level requires.\n- [ ] I understand whether this company has higher expectations than my current company.\n- [ ] I have asked whether the hiring committee can reconsider my level if I disagree.\n- [ ] I have decided whether the lower title is acceptable given pay, growth, company, and opportunity.\n- [ ] I am prepared to reject the offer if the level feels significantly misaligned with my career goals.\n\n## 5. Handling up-leveling\n\n- [ ] I have confirmed that the higher level comes with clear expectations.\n- [ ] I have asked what success looks like at that level.\n- [ ] I understand why the company believes I am ready.\n- [ ] I have made sure I have the support needed to succeed.\n- [ ] I use competing offers or strong references carefully if negotiating.\n- [ ] I am prepared to meet higher expectations from day one.\n\n## 6. Onboarding to a new job\n\n- [ ] I celebrate the offer, then prepare seriously for onboarding.\n- [ ] I have asked my future manager how to prepare before starting.\n- [ ] I have clarified goals for the first month, first 3 months, and first 6 months.\n- [ ] I keep a work log or brag document from the beginning.\n- [ ] I keep a weekly journal of what I learned and what is unclear.\n- [ ] I have learned how performance reviews and promotions work here.\n- [ ] I have found an onboarding buddy or trusted peer.\n- [ ] I keep a cheat sheet for acronyms, systems, commands, people, and resources.\n- [ ] I am learning the tech stack and team priorities.\n- [ ] I meet key teammates and stakeholders early.\n- [ ] For senior+ roles, I clarify current and future projects, priorities, and business context.\n- [ ] For staff+ roles, I meet peer staff engineers, understand expectations, and spend time with product and cross-functional partners.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why a job change is a 5–10 year career decision, not a compensation event — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. ARLO: an eager early-career engineer climbing the ladder — in some strips a new lead or manager, in others the engineer being coached — buzz-cut hair, zip-up hoodie with rolled sleeves, sticker-covered laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Arlo stares dazzled at a glowing recruiter email with a large salary figure on his laptop.](assets/images/changing-jobs/comic-01-the-shiny-number.jpeg)\n**Panel 1:** *The hook: a flattering number lands in the inbox — and starts driving the search.*\n\n![Comic panel: Arlo leaps between rooftops chasing an offer letter, not seeing the far rooftop crack, above a sign reading five to ten years.](assets/images/changing-jobs/comic-02-reactive-jump.jpeg)\n**Panel 2:** *The problem: a move judged on the next offer letter, not the 5–10 year career it lands in.*\n\n![Comic panel: Arlo enters a new office with one suitcase while crates labeled trust, context, and influence stay behind on the curb.](assets/images/changing-jobs/comic-03-what-the-switch-resets.jpeg)\n**Panel 3:** *The wrong way: pricing what the switch pays but not what it resets — trust, context, and influence stay behind.*\n\n![Comic panel: Vera taps a comparison sheet with boxes for pay, role, growth, team, mission, flexibility, and upside while Arlo listens.](assets/images/changing-jobs/comic-04-career-decision-not-comp-event.jpeg)\n**Panel 4:** *The principle: a job change is a 5–10 year career decision — compared on every axis, coached honestly, even toward the door.*\n\n![Comic panel: Arlo at a fork between a slow internal ladder and a glowing external door, with Vera presenting both evenly.](assets/images/changing-jobs/comic-05-promotion-vs-switch.jpeg)\n**Panel 5:** *How it runs: someone already at the next level weighs internal odds against external offers — with the manager's honest help.*\n\n![Comic panel: Arlo inspects two offer letters with a magnifying glass, one marked with a down arrow, one with an up arrow and a barbell.](assets/images/changing-jobs/comic-06-leveling-with-clear-eyes.jpeg)\n**Panel 6:** *The mechanic: a down-level is judged on title and pay together — and an up-level is higher expectations from day one.*\n\n![Comic panel: Arlo at a new desk with a work log, cheat sheet, and a planner flagged at one, three, and six months, greeted by a buddy.](assets/images/changing-jobs/comic-07-landing-is-the-work.jpeg)\n**Panel 7:** *The follow-through: the move is won in the first months — goals at one, three, and six months, work log from day one.*\n\n![Comic panel: Arlo hands Vera a handover folder at a warm farewell, an intact bridge visible through the window.](assets/images/changing-jobs/comic-08-leave-well.jpeg)\n**Panel 8:** *The closer: lose someone well rather than keep them badly — an engineer who leaves deliberately stays a colleague for decades.*\n"}]}]}</script>

                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
