<script id="data" type="application/json">{"meta": {"id": "EM-FIRST-THREE-MONTHS", "status": "draft:gray", "title": "Your First Three Months", "date": "2026-07-28", "author": "Željko Obrenović", "permalink": "first-three-months", "timetoread": "7 min", "excerpt": "A new manager's first three months are a ramp-up period, and I run them as one: name which of the four entry paths I'm on — Apprentice, Pioneer, New Boss, or Successor — because each fails differently, then listen and learn before changing anything, build trust through 1:1s and consistency, and follow a simple 30-60-90 arc from listening to targeted change. I hold every new manager who works for me to the same discipline.", "tags": "engineering management, new manager, transitions, onboarding, ramp-up, 30-60-90, trust", "icon": "assets/icons/first-three-months.png", "logo": "assets/images/first-three-months/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering management", "new manager", "transitions", "onboarding", "ramp-up", "30-60-90", "trust"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: The first three months of a new management role are a ramp-up period, not a proving period — and the fastest way to fail them is to act like they aren't. I start by naming which of the four entry paths I'm on — Apprentice, Pioneer, New Boss, or Successor — because each path has its own traps and its own advantages. Then I run the same core discipline regardless of path: ask lots of questions before trying to prove myself, learn how the team works before changing much, build trust through 1:1s and consistency, and move through a simple 30-60-90 arc — listen, then clarify and strengthen, then make targeted changes. Feeling fully comfortable may take much longer than three months, and I say so out loud.\n\n## Statement\n\nMy operating model for entering a management role:\n\n- **I name my starting path first.** Apprentice (managing part of my existing team), Pioneer (building a new team or function), New Boss (joining an established team as its leader), or Successor (taking over for a departing manager). The diagnosis comes before the plan, because the traps differ by path.\n- **I treat the first three months as a ramp-up, explicitly.** I ask lots of questions before trying to prove myself, learn how the team works before changing too much, am open about my learning curve, and resist the urge to act like I already know everything.\n- **Trust is built through 1:1s and consistency, deliberately.** I build a one-on-one relationship with each report and ask each of them directly: how do you like to be supported, what feedback is most helpful, how do you like to be recognized, what worked well with your previous manager, what would an excellent manager–report relationship look like to you?\n- **I define success for the first 3 and 6 months in writing** and align with my own manager on ownership and expectations — so the ramp has a scorecard, not just a vibe.\n- **I learn the system, not just the people.** How decisions get made, what \"good\" looks like in this team's context, the unwritten rules, current priorities and active projects, where the team is strong and weak, and who influences outcomes beyond the org chart — kept as a running list of observations, questions, and risks.\n- **I change things on evidence, not to leave a mark.** I review processes for friction, decide what to preserve versus change, and hold changes until the 61–90 day window unless something is actively burning.\n- **I run the 30-60-90 arc.** First 30 days: listen, learn, meet everyone, understand priorities and norms. Days 31–60: clarify expectations, strengthen relationships, start coaching more actively, identify a few key improvements. Days 61–90: make targeted changes, reinforce team standards, shift fully into manager mode, and review progress with my manager and team.\n\n## How to Read This\n\nThis journal is **my engineering-management operating model**. This record distills the new-manager transition chapter of Julie Zhuo's *The Making of a Manager* (Portfolio/Penguin, 2019): the four entry paths, the listen-first ramp-up, and the questions that build the manager–report relationship from day one. It is the first-line counterpart to [First 90 Days](../grounded-engineering-executive/first-90-days.html) in my executive journal — **same arc, different altitude**. The runnable version, including the path-specific checklists, lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**Naming the entry path matters because each path fails differently.** The Apprentice has context and ramps fast, but inherits awkwardness with former peers, people who share less with them than before, and IC work that quietly becomes unsustainable. The Pioneer has total freedom and no inheritance, but must write down how decisions get made, define what good work means, and design a team's values from scratch — while resisting the pull to keep doing all the IC work alone. The New Boss gets a \"new person\" window to ask basic questions and reset their identity, but knows nothing about what is normal here versus what is a real issue. The Successor inherits a working team and increased responsibility, and the trap is trying to be a copy of the previous manager instead of leading differently. A generic ramp-up plan misses **the trap that is actually pointed at me**.\n\n![Four doors labeled Apprentice, Pioneer, New Boss, and Successor, each path showing its own distinct trap on the way to the same team.](assets/images/first-three-months/four-entry-paths.jpeg)\n**Figure 1:** *Four entry paths, four different traps: the diagnosis comes before the plan, because a generic ramp misses the trap actually pointed at you.*\n\n**Questions build more credibility in month one than answers do.** The instinct in a new role is to prove myself quickly — to demonstrate that the promotion or hire was justified. But early strong opinions delivered without context read as arrogance, and early changes made without understanding break things the team silently depended on. Asking lots of questions, being open about my learning curve, and giving people the benefit of the doubt is not weakness; **it is calibration**. The window in which basic questions are free **closes fast** — I use it.\n\n**The relationship questions are the highest-leverage minutes of the whole quarter.** Asking each report how they like to be supported, what feedback helps them, how they want to be recognized, and what worked with their previous manager does two things at once: it gives me **an operating manual for each person**, and it signals that this manager relationship will be built around them, not around me. **Trust compounds from consistency** after that — showing up to the 1:1s, doing what I said, and being willing to have the direct, awkward conversation when it is needed.\n\n![Flow diagram from a 1:1 with question cards, to a per-person operating manual, to a staircase of consistent weeks building a trust bridge.](assets/images/first-three-months/relationship-questions-trust-loop.jpeg)\n**Figure 2:** *The relationship questions produce an operating manual for each person — and trust compounds from consistency afterward: showing up, doing what you said.*\n\n**Changing nothing is a decision too — the arc ends in targeted change.** **Listen-first is not change-never.** The point of the first sixty days of learning is to earn the right, and gather the evidence, to make a few targeted changes in days 61–90 — and to know which existing processes to explicitly preserve. **The failure modes are symmetric**: the new manager who reorganizes everything in week two to leave a mark, and the new manager still \"just listening\" in month five. The 30-60-90 arc exists to prevent both, and the review with my manager and team at day 90 is where I check which failure I drifted toward.\n\n![Three-stage 30-60-90 path from listening to clarifying to targeted change, flanked by two failure ditches: changing everything too fast and listening forever.](assets/images/first-three-months/thirty-sixty-ninety-arc.jpeg)\n**Figure 3:** *The arc — listen, then clarify and strengthen, then targeted change reviewed at day 90 — exists to prevent both symmetric failures: the week-two mark-leaver and the month-five listener.*\n\n**Comfort lags competence, and pretending otherwise corrodes trust.** Feeling fully comfortable in the role may take much longer than three months. Saying that openly — to my manager, and in honest form to my team — costs little and **buys the permission to keep asking questions**. The Successor variant is the sharpest: acknowledge the increased responsibility openly, warn the team there may be bumps, and be honest about the ramp while still showing ownership.\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| Name the entry path and use its specific checklist. | The paths need different values — the core discipline (listen, trust, learn) is **the same on all four**. |\n| Ask lots of questions before trying to prove myself. | Have no opinions — I keep a running list of observations, questions, and risks from day one. |\n| Learn how the team works before changing too much. | Change nothing — days 61–90 exist precisely to make targeted changes on evidence. |\n| Build trust through 1:1s and consistency. | Trust arrives with the title — for former peers and inherited teams it must be **deliberately re-earned**. |\n| Define success for the first 3 and 6 months with my manager. | The ramp is finished at day 90 — feeling fully comfortable may take much longer, and that is normal. |\n| Be open about my learning curve. | Perform uncertainty — the Successor stance is honesty about the ramp *with* visible ownership. |\n\nConcretely: within the first week I can **name my path and its top two traps**; within the first month I have met every report and key stakeholder, asked each report the five relationship questions, and written the 3- and 6-month success definition with my manager; by day 90 I have made a small number of evidence-based changes, **explicitly preserved what works**, and reviewed the ramp with my manager and my team.\n\n## Anti-Patterns\n\n- **Proving instead of learning.** Arriving with answers, offering strong opinions before context, and acting like I already know everything — burning the one window when questions are free.\n- **The mark-leaver.** Reorganizing processes in the first weeks to demonstrate impact, fixing things that were not broken, and breaking the things the team silently relied on.\n- **The generic ramp.** Running the same plan regardless of path — coaching former peers like strangers, or joining an established team like a founder.\n- **The Apprentice who never dropped the IC load.** Keeping the old individual workload next to the new management job until both are done badly; the plan to reduce IC work has to exist before it becomes unsustainable.\n- **The Successor as tribute act.** Trying to be a copy of the departed manager instead of leading differently and focusing on what the team needs now.\n- **Listening forever.** Still \"just observing\" in month five — the arc ends in targeted change and a progress review, not in permanent calibration.\n- **The undefined ramp.** No written success definition for months 3 and 6, no alignment with my manager on ownership — so nobody, including me, can say whether the transition worked.\n\n## Related Records\n\n- [First 90 Days](../grounded-engineering-executive/first-90-days.html) (executive journal) — the executive-level counterpart: the same listen-then-change arc run at organization scope rather than team scope.\n- [What Is Management](what-is-management.html) — the job definition this ramp is entering: outcomes through the group, judged by results, not activity.\n- [Management 101](management-101.html) — the per-report contract; the five relationship questions in this record are how that contract gets negotiated on day one.\n- [Leading a Small Team](leading-a-small-team.html) — what the day-to-day looks like once the ramp ends: trust, useful 1:1s, and performance clarity.\n- [Managing Yourself](managing-yourself.html) — the inner game of the transition; the discomfort this record says to expect is managed there.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs how I enter any new management role and how I coach every new manager reporting to me through their first three months. I revisit it if a new-manager transition I ran or supervised reaches day 90 **without a written success definition and review**, if I catch a new manager (or myself) making structural changes in the first month without evidence, or if a path shows up in practice that the four-path model fits badly.\n\n## Authoritative References\n\n- Julie Zhuo, *The Making of a Manager: What to Do When Everyone Looks to You* (Portfolio/Penguin, 2019) — the \"Your First Three Months\" chapter this record distills, including the Apprentice / Pioneer / New Boss / Successor framing.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "5 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record. The Article tab carries the rationale and anti-patterns.*\n\n## 1. First, identify my starting path\n\nClarify which situation best fits me:\n\n- [ ] Apprentice: managing part of my existing team\n- [ ] Pioneer: building a new team or function\n- [ ] New Boss: joining an established team as its leader\n- [ ] Successor: taking over for a departing manager\n\n## 2. Core checklist for any new manager\n\n- [ ] Accept that the first three months are a ramp-up period\n- [ ] Ask lots of questions before trying to prove myself\n- [ ] Learn how the team works before changing too much\n- [ ] Build trust through one-on-ones and consistency\n- [ ] Define what success looks like for my first 3 and 6 months\n- [ ] Notice what is working and what is not\n- [ ] Get clear on team goals, values, and norms\n- [ ] Be open about my learning curve\n- [ ] Resist the urge to act like I already know everything\n- [ ] Remember that feeling fully comfortable may take much longer than three months\n\n## 3. Relationships\n\n- [ ] Meet key partners and stakeholders early\n- [ ] Build one-on-one relationships with each direct report\n- [ ] Ask each report how they like to be supported\n- [ ] Ask what kind of feedback is most helpful to them\n- [ ] Ask how they like to be recognized for great work\n- [ ] Ask what worked well with their previous manager\n- [ ] Ask what an excellent manager–report relationship would look like to them\n- [ ] Invest deliberately in trust, especially if I am new to the team\n- [ ] Expect some awkwardness if I am now managing former peers\n- [ ] Practice having direct, honest conversations when needed\n\n## 4. Learning\n\n- [ ] Learn how decisions get made on the team\n- [ ] Learn what \"good\" looks like in this team's context\n- [ ] Learn the unwritten rules and normal operating patterns\n- [ ] Learn current priorities, deadlines, and active projects\n- [ ] Learn where the team is strong and where it needs improvement\n- [ ] Learn who influences outcomes beyond the org chart\n- [ ] Keep a running list of observations, questions, and risks\n\n## 5. Team and process\n\n- [ ] Review current team processes and identify friction points\n- [ ] Note anything that feels inefficient, unclear, or outdated\n- [ ] Decide what should be preserved versus changed\n- [ ] Avoid fixing things just to leave a mark\n- [ ] Create a short list of the biggest improvement opportunities\n- [ ] Align with my manager on ownership and expectations\n- [ ] Clarify responsibilities across the team\n\n## 6. Personal operating checklist\n\n- [ ] Set aside time each week for reflection\n- [ ] Get support from my own manager\n- [ ] Find peer managers I can learn from\n- [ ] Be careful not to over-index on individual contributor work\n- [ ] Shift my time toward coaching, clarity, and team outcomes\n- [ ] Accept that my job is now different from my old one\n- [ ] Measure myself by team success, not just personal output\n\n## 7. Path-specific: if I am the Apprentice\n\n- [ ] Work with my manager on a joint transition plan\n- [ ] Clarify how my scope may evolve over time\n- [ ] Understand the people I will be managing\n- [ ] Identify team goals and processes that need support\n- [ ] Use my context to ramp quickly\n- [ ] Watch for awkwardness with former peers\n- [ ] Prepare to coach people who used to be my equals\n- [ ] Practice difficult conversations early\n- [ ] Expect people to share less with me at first\n- [ ] Make a plan to reduce IC work before it becomes unsustainable\n\n## 8. Path-specific: if I am the Pioneer\n\n- [ ] Write down how I make decisions\n- [ ] Define what \"good work\" means in my function\n- [ ] List all responsibilities I used to carry alone\n- [ ] Identify what new processes are needed as the team grows\n- [ ] Be intentional about team values and culture\n- [ ] Decide what qualities I want in new team members\n- [ ] Identify which skills the team needs beyond my own\n- [ ] Think ahead about how the team should work a year from now\n- [ ] Build an external support network if internal support is limited\n- [ ] Avoid trying to keep doing all the IC work myself\n\n## 9. Path-specific: if I am the New Boss\n\n- [ ] Use my \"new person\" window to ask basic questions\n- [ ] Meet as many people as possible early on\n- [ ] Ask for context before offering strong opinions\n- [ ] Treat the fresh start as a chance to reset my identity\n- [ ] Give people the benefit of the doubt\n- [ ] Ask reports what support they want from me\n- [ ] Listen for what is normal versus what is a real issue\n- [ ] Focus the first months on listening, learning, and calibration\n- [ ] Invest heavily in building trust\n- [ ] Share enough of myself to make openness possible\n\n## 10. Path-specific: if I am the Successor\n\n- [ ] Acknowledge the increased responsibility openly\n- [ ] Ask for support from my new manager and peers\n- [ ] Tell the team there may be bumps during the transition\n- [ ] Avoid trying to be a copy of the previous manager\n- [ ] Give myself permission to lead differently\n- [ ] Focus on what the team needs now, not just preserving the past\n- [ ] Be honest about my ramp-up while still showing ownership\n\n## 11. Simple 30-60-90 focus\n\n**First 30 days**\n\n- [ ] Listen\n- [ ] Learn\n- [ ] Meet everyone\n- [ ] Understand priorities and norms\n\n**Days 31–60**\n\n- [ ] Clarify expectations\n- [ ] Strengthen relationships\n- [ ] Start coaching more actively\n- [ ] Identify a few key improvements\n\n**Days 61–90**\n\n- [ ] Make targeted changes\n- [ ] Reinforce team standards\n- [ ] Shift fully into manager mode\n- [ ] Review progress with my manager and team\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why the first three months of a new management role are a ramp-up, not a proving period — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. ARLO: an eager early-career engineer climbing the ladder — in some strips a new lead or manager, in others the engineer being coached — buzz-cut hair, zip-up hoodie with rolled sleeves, sticker-covered laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: a new manager marches in on day one with a binder of big plans while the team watches warily.](assets/images/first-three-months/comic-01-day-one.jpeg)\n**Panel 1:** *The hook: day one arrives with the urge to prove the promotion was justified.*\n\n![Comic panel: a new manager faces four labeled doors, each with its own warning sign, as a mentor points at them.](assets/images/first-three-months/comic-02-four-doors.jpeg)\n**Panel 2:** *The problem: there are four ways into the role — Apprentice, Pioneer, New Boss, Successor — and each path has its own traps.*\n\n![Comic panel: an eager new manager topples a process board while a working machine crashes behind him.](assets/images/first-three-months/comic-03-the-mark-leaver.jpeg)\n**Panel 3:** *The wrong way: the mark-leaver — reorganizing in week two to show impact, and breaking what the team silently depended on.*\n\n![Comic panel: a mentor turns a signpost from a podium labeled prove toward a rising ramp labeled learn.](assets/images/first-three-months/comic-04-ramp-not-proving.jpeg)\n**Panel 4:** *The principle: the first three months are a ramp-up, not a proving period — and acting otherwise is the fastest way to fail them.*\n\n![Comic panel: a new manager in a friendly 1:1 surrounded by five floating question cards with icons.](assets/images/first-three-months/comic-05-questions-are-free.jpeg)\n**Panel 5:** *How it runs: ask every report the five relationship questions — support, feedback, recognition, the previous manager, the ideal relationship — while questions are still free.*\n\n![Comic panel: a manager climbs three landings labeled 30, 60, and 90 with icons for listening, clarifying, and targeted change.](assets/images/first-three-months/comic-06-the-30-60-90-arc.jpeg)\n**Panel 6:** *The mechanic: the 30-60-90 arc — listen and learn, clarify and strengthen, then make a few targeted, evidence-based changes and review them.*\n\n![Comic panel: a manager past the 90-day mark admits he is not comfortable yet, and his mentor calls it normal.](assets/images/first-three-months/comic-07-comfort-lags.jpeg)\n**Panel 7:** *The cost: comfort lags competence — feeling at home may take far longer than three months, and pretending otherwise corrodes trust.*\n\n![Comic panel: a manager reviews a board of preserved and changed items with an engaged team at day 90.](assets/images/first-three-months/comic-08-day-90-review.jpeg)\n**Panel 8:** *The closer: at day 90 the ramp has a verdict — a written scorecard, a few targeted changes, the good things explicitly preserved, and a team that trusts you.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
