<script id="data" type="application/json">{"meta": {"id": "EM-MANAGING-PEOPLE", "status": "draft:gray", "title": "Managing People", "date": "2026-07-28", "author": "Željko Obrenović", "permalink": "managing-people", "timetoread": "7 min", "excerpt": "First-line people management is a set of learnable mechanics run on a cadence: a deliberate start with every new report, weekly 1:1s that get rescheduled rather than skipped, feedback given continuously so reviews contain no surprises, delegation of ownership rather than tasks, and underperformance addressed early and in writing. One rule ties it all together — no surprises: not in reviews, not in promotion outcomes, not in a performance plan, and not in a departure.", "tags": "engineering management, 1:1s, feedback, delegation, performance reviews, underperformance, onboarding", "icon": "assets/icons/managing-people.png", "logo": "assets/images/managing-people/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering management", "1:1s", "feedback", "delegation", "performance reviews", "underperformance", "onboarding"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: First-line people management is not a talent; it is a set of learnable mechanics run on a cadence — a deliberate start with every new report, weekly 1:1s that get rescheduled rather than skipped, feedback given continuously in small doses, development discussed before it is urgent, ownership delegated rather than tasks assigned, and underperformance addressed early and in writing. One rule ties every mechanic together: no surprises. Nobody should first learn in a formal review that their work is falling short, first learn at promotion time what the bar was, or first learn in a termination meeting that their job was at risk. I run these mechanics myself, and they are the bar I hold every first-line manager to.\n\n## Statement\n\nMy operating model for first-line people management has six parts:\n\n- **Every new report gets a deliberate start.** In the first conversations I learn how they like to be praised — publicly or privately — how they want to receive serious feedback, what excited them about joining, how to recognize when they are stressed, which manager behaviors they dislike, and what their career goals are. We build a 30/60/90-day plan together, I make expectations explicit — communication, meeting cadence, work style, escalation, autonomy — and I collect their feedback on onboarding while they can still see it with fresh eyes.\n- **1:1s are weekly by default, rescheduled rather than skipped, and kept even for strong performers.** They are used for more than status, leave room for the human being, produce shared notes, and their frequency changes based on need, not habit.\n- **1:1 style is adapted per person.** To-do list, catch-up, feedback, or progress-report — whichever this person needs now. The meeting serves the report, protects space for what they want to raise, and does not decay into a recurring complaint session.\n- **Feedback is continuous, so reviews contain no surprises.** I learn each person's strengths, weaknesses, goals, and level; observe closely enough to notice patterns; give praise promptly and specifically; deliver corrective feedback as soon as possible; and never save important feedback for a formal review. Development is deliberate: regular career conversations, promotion transparency, stretch work, and help building the promotion case when someone is ready.\n- **Delegation transfers ownership, not tasks.** I stay involved enough to support success without taking over, adjust involvement to project stage and risk, pull information from systems before asking people for updates, set standards for code and decisions, treat openly shared problems neutrally, and protect autonomy — because autonomy drives motivation.\n- **Reviews are written early from year-round notes; underperformance is handled early and in writing.** Reviews cover the whole year with concrete examples and peer feedback, give real weight to strengths, keep improvement areas focused, and reach the person before the meeting. Underperformance is named early and often, documented with timelines and deliverables, run with HR where required — and I do not put someone on a plan unless I am prepared for them to leave. When someone cannot grow to the next level on my team, I say so honestly and help them find a better fit, preserving goodwill and dignity.\n\n![Concept map of six people-management mechanics — deliberate start, weekly 1:1s, continuous feedback, development, delegation, reviews — connected to a central no-surprises rule.](assets/images/managing-people/no-surprises-hub.jpeg)\n**Figure 1:** *Six learnable mechanics, one unifying rule: every practice exists so that nothing important arrives as a surprise.*\n\n## How to Read This\n\nThis journal is my engineering-management operating model, one record per source checklist. This record is grounded in the \"Managing People\" chapter of Camille Fournier's *The Manager's Path* (O'Reilly, 2017) — the rung where an engineer first becomes **responsible for other people's performance**, growth, and experience of work. I have run these mechanics as a first-line manager and now hold every first-line manager in my organization to them. The runnable version — new-report start, 1:1 mechanics and styles, continuous feedback, development, delegation, reviews, underperformance, coaching out, and the self-check — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**The first weeks with a new report set the terms for years, so I script them.** The preference questions — how do you like to be praised, how do you want serious feedback, how do I recognize when you are stressed, which manager behaviors do you hate — take one conversation and prevent years of accidental friction. The 30/60/90-day plan and explicit expectations do for the relationship what an interface does for a system: they make **the implicit contract inspectable**. And a new hire's confusion is **an asset with an expiry date** — I collect their onboarding feedback in the first 90 days and route it into the docs, because in month four they will no longer be able to see what was missing.\n\n**The 1:1 is the mechanism everything else runs through, so its failure modes get named.** Weekly by default; rescheduled, not skipped — because a skipped 1:1 tells the report exactly where they rank against whatever displaced them. Kept even for strong performers, who are otherwise **quietly abandoned as \"fine\"** until the day they resign. And adapted per person: the to-do-list 1:1, the catch-up, the feedback session, the progress report are different meetings, and running the same format for everyone means running the wrong format for most. The test is direction: **the meeting serves the report**, not the manager's need for status.\n\n**Continuous feedback is what makes every formal moment boring — which is the goal.** Lightweight, regular feedback — praise prompt and specific, correction as soon as possible — keeps the gap between how someone is doing and how they think they are doing near zero. Then the review is **a summary of known information**, the promotion case is built from documented evidence, and the difficult conversation, if it comes, is the continuation of a thread, not an ambush. Every dreaded moment in people management is dreaded because feedback was deferred; the no-surprises rule is simply **the refusal to defer it**.\n\n![Two timelines compared: frequent small feedback along the year ends in a calm review; a silent year ends in one large spike at review time.](assets/images/managing-people/feedback-two-timelines.jpeg)\n**Figure 2:** *Continuous small doses keep the review boring; deferred feedback turns it into an ambush.*\n\n\n**Delegation is an ownership transfer, and micromanagement is usually an information problem.** Delegating tasks while retaining ownership produces a team that **executes but never thinks**. Fournier's mechanics make the handoff real: agree on what success looks like, make progress visible in systems, and then pull information from those systems instead of interrogating people — asking a person for a status you could read yourself is a small tax on trust, levied repeatedly. Involvement scales with stage and risk, not with the manager's anxiety, and openly shared problems get a neutral reception, because **punishing transparency buys silence** exactly where silence is most expensive.\n\n![Split panel contrasting ownership delegation, with an engineer steering while the manager reads dashboards, against task assignment, with the manager pulling marionette strings over a passive engineer.](assets/images/managing-people/delegation-ownership-transfer.jpeg)\n**Figure 3:** *Delegation transfers the wheel, not the task list — and progress is read from systems, not interrogated out of people.*\n\n\n**Underperformance handled early is coaching; handled late, it is a crisis with a personnel file.** The failure pattern is always the same: the manager waits, frustration compounds, and the eventual conversation is harsher and later than it should have been — a surprise, which means a failure under the rule. Naming the gap early and often, in writing, with concrete expectations and timelines, gives the person **a genuine chance to correct** — and if they cannot, the outcome arrives with dignity intact. Two honesty tests anchor the hard end of this record: I do not put someone on a plan unless I am **prepared for them to leave**, and when my team cannot offer someone the growth they need, I say so and help them find where it exists.\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| 1:1s are weekly by default and rescheduled, not skipped. | The cadence is sacred — frequency adjusts to need, but **by decision, not decay**. |\n| Feedback flows continuously, in small doses. | Formal reviews are pointless — they still synthesize the year; they just contain nothing new. |\n| Delegation transfers ownership, with involvement scaled to stage and risk. | The manager disappears after delegating — support without takeover is the job. |\n| Progress is pulled from systems before people are asked. | Managers never ask for updates — they just do not ask for what a dashboard already shows. |\n| Underperformance is documented early, with timelines in writing when needed. | Documentation is a trap being built — it is the fairness mechanism that keeps the process honest. |\n| Someone who cannot grow here is told so and helped to a better fit. | Coaching out is disguised firing — done honestly and early, it is **career advice with logistics**. |\n| Strong performers keep their 1:1s and development attention. | Attention is only for problems — neglecting your best people is how you lose them. |\n\nConcretely: every manager in my organization can show me shared 1:1 notes, a 30/60/90 plan for each recent hire, and year-round feedback notes that make review season **a writing exercise rather than an archaeology project**. No report of theirs is ever surprised by a review, a promotion outcome, or a performance conversation — and when I run skip-levels, that is one of the things I check.\n\n## Anti-Patterns\n\n- **The skipped 1:1.** Cancelled for \"real work\" and never rescheduled — teaching the report precisely how much they matter.\n- **The status-meeting 1:1.** Every session a project update the manager could have read in the tracker, with the human topics permanently crowded out.\n- **The neglected strong performer.** \"They're fine, they don't need me\" — until the resignation letter explains what they needed.\n- **Feedback hoarding.** Saving observations for the review, then delivering six months of accumulated criticism in one sitting to a blindsided report.\n- **Task delegation with retained ownership.** Handing out work items while keeping every decision, then wondering why nobody on the team shows judgment.\n- **Interrogation-driven status.** Asking people for information the systems already display, converting trust into reporting overhead.\n- **The sudden performance plan.** A PIP as the first clear signal that anything was wrong — a documented ambush that fails the no-surprises rule at the moment it matters most.\n- **The dishonest keep.** Knowing someone cannot reach the next level on this team and saying nothing, stealing years of their career to avoid one uncomfortable conversation.\n\n## Related Records\n\n- [Management 101](management-101.html) — the two-sided contract this machinery delivers; that record is the promise, this one is the implementation.\n- [Managing a Team](managing-a-team.html) — the next rung: from managing individuals to debugging and leading a team as a system.\n- [The Art of Feedback](feedback.html) — Julie Zhuo's treatment of feedback craft; this record sets the cadence, that one deepens the skill.\n- [Working the Performance Review Cycle](performance-review-cycle.html) — the engineer-side view of the review cycle; a report following that record and a manager following this one meet with no surprises.\n- [Career Conversations](../grounded-people-management-tools/career-conversations.html) (people journal) — the one-off deep career conversation whose output feeds this record's development mechanics.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs the first-line people-management mechanics I run and the bar I hold every first-line manager in my organization to: new-report starts, 1:1s, continuous feedback, development, delegation, reviews, and underperformance. I revisit it if reviews or performance plans **keep landing as surprises** (the core rule is failing), if skip-levels show 1:1s decaying into status meetings or silently disappearing, or if regretted attrition among strong performers suggests the machinery is **only serving the struggling**.\n\n## Authoritative References\n\n- Camille Fournier, *The Manager's Path: A Guide for Tech Leaders Navigating Growth and Change* (O'Reilly, 2017) — Chapter 4, \"Managing People\", whose checklist this record distills.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "5 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Starting with a new report\n\n- [ ] Learn the person's preferences for praise: public or private\n- [ ] Ask how they prefer to receive serious feedback\n- [ ] Ask what excited them to join and why they chose the company\n- [ ] Ask how to recognize when they are stressed, frustrated, or in a bad mood\n- [ ] Ask which manager behaviors they dislike\n- [ ] Ask about their career goals\n- [ ] Ask about any surprises, concerns, or unmet expectations since joining\n- [ ] Build trust and rapport early\n- [ ] Create a 30/60/90-day plan together\n- [ ] Make expectations clear: communication, meeting cadence, work style, escalation, and autonomy\n- [ ] Get feedback from the new hire during the first 90 days\n- [ ] Involve them in improving onboarding documentation\n\n## 2. Running 1:1s well\n\n- [ ] Set up regular 1:1s\n- [ ] Default to weekly 1:1s unless there is a good reason not to\n- [ ] Reschedule missed 1:1s rather than skipping them\n- [ ] Choose times that work for both schedules and minimize disruption\n- [ ] Adjust frequency based on need, not habit\n- [ ] Keep doing 1:1s even with strong performers\n- [ ] Use 1:1s for more than status updates\n- [ ] Leave room to get to know the person as a human being\n- [ ] Keep shared notes from each 1:1\n\n## 3. Adapting 1:1 style\n\n- [ ] Decide whether this person needs a to-do list style, catch-up style, feedback style, or progress-report style 1:1\n- [ ] Make sure the meeting serves the report, not just the manager\n- [ ] Avoid letting 1:1s turn into repeated complaint sessions\n- [ ] Give space for the important topics the report wants to raise\n- [ ] Mix formats when useful, but protect privacy for sensitive discussions\n\n## 4. Giving feedback continuously\n\n- [ ] Learn each person's strengths, weaknesses, goals, and current level\n- [ ] Observe people closely enough to notice patterns\n- [ ] Start with lightweight, regular feedback\n- [ ] Give praise promptly and specifically\n- [ ] Give corrective feedback as soon as possible\n- [ ] Do not save important feedback for a formal review\n- [ ] Pair feedback with coaching when appropriate\n- [ ] Focus on helping people grow, not just judging them\n- [ ] Make frequent feedback part of team culture\n\n## 5. Developing people\n\n- [ ] Help each person identify areas for learning and growth\n- [ ] Support growth through projects, mentoring, and external learning\n- [ ] Discuss career development regularly, not just during reviews\n- [ ] Look for promotion-ready opportunities and stretch work\n- [ ] Be transparent about how promotion works at the company\n- [ ] Help people build a case for promotion when they are ready\n\n## 6. Delegating without micromanaging\n\n- [ ] Delegate ownership, not just tasks\n- [ ] Stay involved enough to support success without taking over\n- [ ] Use team goals to decide which details matter\n- [ ] Ask teams to make progress and success measures visible\n- [ ] Pull information from systems first before asking people for updates\n- [ ] Avoid asking for information I could easily get myself\n- [ ] Adjust my level of involvement based on project stage and risk\n- [ ] Set standards for code, systems, and decision-making\n- [ ] Treat open sharing of problems neutrally and constructively\n- [ ] Protect autonomy because autonomy drives motivation\n\n## 7. Performance reviews\n\n- [ ] Start early and give myself enough uninterrupted time\n- [ ] Review the whole year, not just recent months\n- [ ] Keep notes throughout the year to support review writing\n- [ ] Use concrete examples\n- [ ] Incorporate peer feedback thoughtfully\n- [ ] Spend real time on accomplishments and strengths\n- [ ] Keep areas for improvement focused and clear\n- [ ] Avoid big surprises in formal reviews\n- [ ] Give the person time to read the review before discussing it\n- [ ] Discuss the review in enough depth to be useful\n\n## 8. Handling underperformance\n\n- [ ] Address problems early\n- [ ] Follow the rule of \"no surprises\"\n- [ ] Be clear about what good performance looks like\n- [ ] Tell the person early and often when they are not meeting expectations\n- [ ] Document negative feedback and improvement expectations\n- [ ] Put timelines and concrete deliverables in writing when needed\n- [ ] Work with HR processes where required\n- [ ] Do not wait until frustration boils over\n- [ ] Be fair, direct, and specific\n- [ ] Do not put someone on a plan unless I am prepared for them to leave\n\n## 9. Coaching someone out\n\n- [ ] Be honest when someone is not progressing to the next level on my team\n- [ ] Explain clearly what the next level requires\n- [ ] Say directly when the team may not be the right place for that growth\n- [ ] Help them explore a better-fit role internally or externally\n- [ ] Preserve goodwill and dignity\n\n## 10. Self-check\n\n- [ ] Do I hold regular 1:1s?\n- [ ] Have I discussed career development recently?\n- [ ] Have I given feedback in the last week?\n- [ ] Have I recognized good work publicly or privately?\n- [ ] Have I corrected issues promptly and appropriately?\n- [ ] Do I understand how promotions work here?\n- [ ] Am I delegating well instead of micromanaging?\n- [ ] Am I helping people grow, not just evaluating them?\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "How first-line people management becomes a set of learnable mechanics under one rule — no surprises — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. ARLO: an eager early-career engineer climbing the ladder — in some strips a new lead or manager, in others the engineer being coached — buzz-cut hair, zip-up hoodie with rolled sleeves, sticker-covered laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Arlo stares anxiously at an org chart with three reports while Vera calmly replies.](assets/images/managing-people/comic-01-not-a-natural.jpeg)\n**Panel 1:** *The hook: people management looks like a talent — it is actually a set of learnable mechanics.*\n\n![Comic panel: a shocked engineer holds a review document across the table from an uncomfortable Arlo.](assets/images/managing-people/comic-02-the-blindsided-review.jpeg)\n**Panel 2:** *The problem: when feedback waits for the formal moment, the formal moment becomes an ambush.*\n\n![Comic panel: Arlo deletes a 1:1 from his calendar while stuffing feedback notes into an overflowing drawer.](assets/images/managing-people/comic-03-hoarded-feedback.jpeg)\n**Panel 3:** *The wrong way: cancel the 1:1 for 'real work', hoard the observations, deliver them all at once later.*\n\n![Comic panel: Vera at a whiteboard with NO SURPRISES circled and spokes to small icons, Arlo taking notes.](assets/images/managing-people/comic-04-no-surprises.jpeg)\n**Panel 4:** *The principle: every mechanic — 1:1s, feedback, reviews, plans — exists so nothing important lands as a surprise.*\n\n![Comic panel: Arlo and a new hire share coffee over a 30/60/90 plan sheet.](assets/images/managing-people/comic-05-the-deliberate-start.jpeg)\n**Panel 5:** *How it runs: every new report gets a deliberate start — preference questions and a joint 30/60/90 plan.*\n\n![Comic panel: Arlo drags a 1:1 calendar block to a new day beneath a timeline of small feedback bubbles.](assets/images/managing-people/comic-06-moved-never-skipped.jpeg)\n**Panel 6:** *The mechanic: 1:1s are weekly by default and rescheduled rather than skipped; feedback flows continuously in small doses.*\n\n![Comic panel: Arlo holds a calm documented conversation with an engineer while Vera taps her notebook.](assets/images/managing-people/comic-07-say-it-early.jpeg)\n**Panel 7:** *The cost: the rule demands the uncomfortable conversation early and in writing — not deferred until it is a crisis.*\n\n![Comic panel: a relaxed engineer reads a review and nods while Arlo smiles and Vera approves from the doorway.](assets/images/managing-people/comic-08-the-boring-review.jpeg)\n**Panel 8:** *The closer: when the mechanics run all year, the review is boring — and boring is the win.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
