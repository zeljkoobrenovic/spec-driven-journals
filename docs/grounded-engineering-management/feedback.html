<script id="data" type="application/json">{"meta": {"id": "EM-FEEDBACK", "status": "draft:gray", "title": "The Art of Feedback", "date": "2026-07-28", "author": "Željko Obrenović", "permalink": "feedback", "timetoread": "6 min", "excerpt": "Feedback starts before the work does: I set expectations about what success looks like up front, then give frequent, specific, actionable feedback while the work is fresh — on tasks, on behavior patterns, and through other people's eyes when mine aren't enough. Feedback only counts when it lands, so I check that the person heard it, knows whether it was an expectation or a suggestion, and knows what to do next.", "tags": "engineering management, feedback, expectations, 1:1s, coaching, difficult conversations", "icon": "assets/icons/feedback.png", "logo": "assets/images/feedback/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering management", "feedback", "expectations", "1:1s", "coaching", "difficult conversations"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: Feedback is not something I deliver after work goes wrong — it is a system I set up before the work starts and run continuously while it happens. I state what success looks like up front, comment on work while it is fresh, describe exact behaviors with concrete examples, and say plainly whether I am setting an expectation or making a suggestion. The measure of my feedback is never how it felt to give: it is whether the person heard it, agrees on what it means, and knows what to do next.\n\n## Statement\n\nMy operating model for feedback has six parts:\n\n- **Feedback starts before the work does.** Before a piece of work begins, I explain what success looks like, what separates a strong result from a weak one, how to get started well, and which common pitfalls to avoid. Expectations set early are feedback; expectations raised only after problems appear are complaints.\n- **Frequent and fresh beats rare and polished.** I give feedback regularly, not just during reviews — commenting on recent work while it is still fresh, balancing praise with improvement feedback, and covering skills, growth, and career trajectory, not only the task at hand.\n- **Specific or it doesn't count.** I describe the exact behavior, action, or output, use concrete examples, and explain why it was effective or ineffective. \"This was confusing\" without details is not feedback; it is a mood.\n- **Behavioral feedback is part of the job, delivered with care.** I look for patterns across multiple situations, share observations about habits, tendencies, and working style, and always support them with examples — knowing this kind of feedback feels more personal and deserves more thought.\n- **My eyes are not the only ones.** I collect input from collaborators when useful — what should this person do more of, what should they change or stop — and use 360-style feedback for a fuller picture than my own vantage point allows.\n- **Feedback only counts when it lands.** I make the person feel safe enough to listen, show that my goal is to help rather than attack, ask for their perspective, confirm understanding by asking for their takeaways and next steps, and follow up in writing when clarity would help.\n\n![Timeline showing feedback distributed across a piece of work — expectations at the start, frequent comments in the middle, a landing check at the end — contrasted with a crossed-out timeline holding one late reaction.](assets/images/feedback/feedback-timeline-before-during-after.jpeg)\n**Figure 1:** *Feedback is a system across the whole timeline of the work — not one reaction composed after it ends.*\n\n## How to Read This\n\nThis journal is my engineering-management operating model, each record grounded in one source. This record distills the feedback chapter of Julie Zhuo's *The Making of a Manager* (Portfolio/Penguin, 2019) — her argument that great feedback is frequent, specific, actionable, and checked for landing, and her guidance on delivering critical feedback without softening it into fog. The runnable version — the full working checklist from setup through the final test — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**Expectations set up front are the cheapest feedback I will ever give.** Every correction I make after work goes sideways could have been a sentence before it started: here is what a strong result looks like, here is how people usually stumble. Zhuo's insight is that feedback begins before the work does — a manager who only reacts to finished work has forfeited the moment when guidance was cheapest and least personal. Setting expectations early also makes later critical feedback fair: I am comparing work against a bar the person knew about, not one I invented afterward.\n\n**Vague feedback transfers a feeling; specific feedback transfers information.** \"Great job\" and \"this was confusing\" produce the same result: the person knows how I felt and nothing about what to repeat or change. Naming the exact behavior, showing a concrete example, and explaining why it worked or didn't turns my reaction into something the person can act on. The same discipline applies doubly to behavioral feedback — observations about habits and working style land as judgments of character unless they are anchored to patterns I can actually point to across multiple situations.\n\n**I see a fraction of anyone's work, so I borrow other people's eyes.** My reports spend most of their week in rooms I am not in. Asking collaborators what someone should do more of and what they should change gives me a picture no amount of my own observation can, and it protects the person from feedback distorted by my narrow sample. 360-style input is not bureaucracy; it is how behavioral feedback gets the evidence base it needs.\n\n![Diagram of a team member at the center of a circle, with the manager's sightline covering one narrow segment and collaborators' sightlines covering the rest.](assets/images/feedback/borrowed-eyes-360.jpeg)\n**Figure 2:** *I see a fraction of anyone's work; collaborators' perspectives give behavioral feedback the evidence base my narrow sample cannot.*\n\n**Feedback that was said but not heard did not happen.** The transaction completes on the receiving end, not the sending end. That is why I ask for the person's perspective, ask them to tell me their takeaways and next steps rather than reciting mine, and put things in writing when clarity would help. It is also why I am explicit about register: an expectation the person treated as a suggestion — or a suggestion they treated as an order — is a failure of my delivery, not their listening.\n\n![Loop diagram between two figures: a blue arrow labeled said going one way, an amber arrow labeled heard returning with takeaway and next-step icons.](assets/images/feedback/landing-check-loop.jpeg)\n**Figure 3:** *The transaction completes on the receiving end: their takeaways and their next steps, not my recitation.*\n\n**Critical feedback delivered directly and calmly is a form of respect.** The common mistakes all share one root: protecting my own comfort at the person's expense. Waiting for review season, burying the message in a compliment sandwich, softening the conversation until the real issue is unclear, or staging a \"discussion\" about a decision already made — each spares me an awkward moment and costs the person weeks of not knowing. The respectful version is plainer: state the concern, explain what led me to it, keep the focus on the work or behavior rather than the person's character, never deliver it while upset, and work out the resolution together.\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| Expectations about success are set before the work starts. | Feedback is a reaction I compose after seeing the finished result. |\n| Feedback is frequent, and given while the work is fresh. | Feedback is saved up and batch-delivered at review time. |\n| Feedback names exact behaviors with concrete examples. | General impressions (\"be more strategic\") count as feedback. |\n| Behavioral feedback on habits and working style is in scope. | Task feedback alone is enough to grow a person. |\n| I gather collaborators' perspectives for a fuller picture. | My own observations are a sufficient evidence base. |\n| I check the feedback landed: their takeaways, their next steps. | Saying it clearly is the same as it being heard. |\n| Critical feedback is direct, calm, and about the work. | Directness licenses accusatory language or feedback delivered angry. |\n\nConcretely: when I hand someone a piece of work, they can repeat back what a strong result looks like. When I give feedback, I can point to the specific example behind it, and the person can tell me — in their words — what they took away and what they will do next. Serious issues never surprise anyone at review time, because they were raised the week I noticed them.\n\n## Anti-Patterns\n\n- **Review-time ambush.** Sitting on a serious issue for months and raising it first in a performance review — the person loses the entire period they could have used to improve.\n- **The compliment sandwich.** Hiding the real message between two layers of praise so thoroughly that the person walks away remembering only the bread.\n- **Softness that obscures.** Making the conversation so gentle that the person cannot tell a problem was raised at all — kindness in tone, cruelty in effect.\n- **Fake discussions.** Presenting a decision that is already made as if it were open for debate, spending the person's trust to buy myself an easier meeting.\n- **Task-only feedback.** Commenting endlessly on individual deliverables while never addressing the behavioral patterns or career trajectory that actually determine someone's growth.\n- **Vague verdicts.** \"This was confusing,\" \"this needs more polish\" — statements that assert a problem without giving the person a single concrete detail to act on.\n- **Feedback while upset.** Delivering criticism in the heat of frustration, when accusatory and emotionally loaded language is most likely and least useful.\n\n## Related Records\n\n- [Management 101](management-101.html) — the two-sided contract with every report; honest, timely feedback is one of the things I owe them under it.\n- [Leading a Small Team](leading-a-small-team.html) — the team context where most of this feedback is delivered, 1:1 by 1:1.\n- [Performance Reviews](performance-review-cycle.html) — the formal cycle works only when it summarizes feedback already given; this record is what makes reviews surprise-free.\n- [Performance Reviews](../grounded-people-management-tools/performance-reviews.html) (people journal) — the written-evaluation toolkit; this record covers the continuous feedback that feeds it.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs how I give feedback to the people I manage: the expectations I set before work starts, the cadence and specificity of ongoing feedback, the use of behavioral and 360-style input, and the delivery of critical feedback. I revisit it if a report is genuinely surprised by anything in a performance review, if I catch myself sitting on a serious issue for more than a week, or if someone acts on a \"suggestion\" I meant as an expectation — each is evidence the system, not the person, failed.\n\n## Authoritative References\n\n- Julie Zhuo, *The Making of a Manager: What to Do When Everyone Looks to You* (Portfolio/Penguin, 2019) — the feedback chapter (\"The Art of Feedback\") this record distills.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "3 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Before the work starts\n\n- [ ] Explain what success looks like\n- [ ] Define what a strong result looks like versus a weak one\n- [ ] Share advice for getting started well\n- [ ] Point out common pitfalls to avoid\n- [ ] Set expectations early, not only after problems appear\n\n## 2. Give feedback regularly\n\n- [ ] Give feedback frequently, not just during reviews\n- [ ] Comment on recent work while it is still fresh\n- [ ] Balance praise with improvement feedback\n- [ ] Include feedback on skills, growth, and career trajectory, not only tasks\n\n## 3. Make feedback specific\n\n- [ ] Describe the exact behavior, action, or output\n- [ ] Use concrete examples\n- [ ] Explain why it was effective or ineffective\n- [ ] Avoid vague statements like \"this was confusing\" without details\n\n## 4. Include behavioral feedback\n\n- [ ] Look for patterns across multiple situations\n- [ ] Share observations about habits, tendencies, and working style\n- [ ] Support behavioral feedback with examples\n- [ ] Deliver it thoughtfully — it feels more personal than task feedback\n\n## 5. Gather multiple perspectives\n\n- [ ] Collect input from others when useful\n- [ ] Use 360-style feedback for a fuller picture\n- [ ] Ask collaborators what the person should do more of\n- [ ] Ask collaborators what the person should change or stop doing\n\n## 6. Check whether the feedback is being heard\n\n- [ ] Make the other person feel safe enough to listen\n- [ ] Show that my goal is to help, not attack\n- [ ] Ask for their perspective\n- [ ] Confirm understanding by asking for their takeaways and next steps\n- [ ] Follow up in writing when clarity would help\n\n## 7. Make it actionable\n\n- [ ] Clarify what success looks and feels like\n- [ ] Suggest next steps when appropriate\n- [ ] Be clear whether I am setting an expectation or making a suggestion\n- [ ] Leave room for the other person to think through solutions too\n\n## 8. Deliver critical feedback well\n\n- [ ] Address the issue directly and calmly\n- [ ] Focus on the work or behavior, not the person's character\n- [ ] Avoid accusatory or emotionally loaded language\n- [ ] Do not give critical feedback while upset\n- [ ] State the concern plainly\n- [ ] Explain what led me to that concern\n- [ ] Invite the other person's perspective\n- [ ] Discuss how to resolve it together\n\n## 9. Avoid common mistakes\n\n- [ ] Don't wait until review time to raise serious issues\n- [ ] Don't assume task feedback alone is enough\n- [ ] Don't hide the message in a \"compliment sandwich\"\n- [ ] Don't make the conversation so soft that the real issue is unclear\n- [ ] Don't present decisions as a discussion if they are already made\n\n## 10. Final test\n\n- [ ] Is this feedback likely to improve things?\n- [ ] Is it clear, fair, timely, and respectful?\n- [ ] Does the person know what to do next?\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why feedback starts before the work does — and only counts when it lands — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. ARLO: an engineer newly stepping into management, buzz-cut hair, zip-up hoodie with rolled sleeves, sticker-covered laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: a shocked team member holds a review document across from an uneasy Arlo.](assets/images/feedback/comic-01-the-blindside.jpeg)\n**Panel 1:** *The hook: the review-time ambush — months of unsaid feedback, delivered all at once.*\n\n![Comic panel: Arlo returns a document with vague squiggles while the team member scratches their head, confused.](assets/images/feedback/comic-02-the-mood-not-the-message.jpeg)\n**Panel 2:** *The problem: 'this is confusing' is a mood, not feedback — nothing to repeat, nothing to change.*\n\n![Comic panel: Arlo offers a giant sandwich with thick praise bread and a tiny warning filling; the team member takes only the bread.](assets/images/feedback/comic-03-the-compliment-sandwich.jpeg)\n**Panel 3:** *The wrong way: the compliment sandwich — the person walks away remembering only the bread.*\n\n![Comic panel: Vera taps the starting flag of a timeline on a whiteboard while Arlo takes notes.](assets/images/feedback/comic-04-starts-before-the-work.jpeg)\n**Panel 4:** *The principle: feedback is a system set up before the work starts — not a reaction after it ends.*\n\n![Comic panel: Arlo points at a strong-result sketch next to a weak-result sketch while briefing a team member.](assets/images/feedback/comic-05-what-strong-looks-like.jpeg)\n**Panel 5:** *How it runs: strong versus weak named before the work begins — the cheapest feedback there is.*\n\n![Comic panel: the team member counts takeaways on their fingers while Arlo listens and asks for them.](assets/images/feedback/comic-06-the-landing-check.jpeg)\n**Panel 6:** *The mechanic: the landing check — their takeaways, their next steps, not your recitation.*\n\n![Comic panel: Arlo calmly points at a document during a direct, serious conversation with a team member.](assets/images/feedback/comic-07-direct-and-calm.jpeg)\n**Panel 7:** *The cost: directness takes a breath and a steady voice — comfort-seeking is what feedback fails from.*\n\n![Comic panel: a team member nods through their review unsurprised while Vera watches approvingly from the doorway.](assets/images/feedback/comic-08-no-surprises.jpeg)\n**Panel 8:** *The closer: the measure of the system — a review with nothing new in it.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,

        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
