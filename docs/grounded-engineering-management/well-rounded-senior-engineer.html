<script id="data" type="application/json">{"meta": {"id": "EM-WELL-ROUNDED-SENIOR-ENGINEER", "status": "draft:gray", "title": "The Well-Rounded Senior Engineer", "date": "2026-07-28", "author": "Željko Obrenović", "permalink": "well-rounded-senior-engineer", "timetoread": "7 min", "excerpt": "What I hold senior engineers to is a shift, not a bigger version of the same job: from developer to engineer. That means thinking beyond the code to the system's long life, making hidden complexity visible instead of absorbing it, doing much of the job on the collaboration surface — reviews, pairing, mentoring, feedback, cross-team relationships — treating tech debt and testing as economic choices, and shipping architecture through writing, prototypes, and business framing.", "tags": "engineering management, career ladder, senior engineers, collaboration, tech debt, testing, software architecture", "icon": "assets/icons/well-rounded-senior-engineer.png", "logo": "assets/images/well-rounded-senior-engineer/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering management", "career ladder", "senior engineers", "collaboration", "tech debt", "testing", "software architecture"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: Senior is not a bigger version of the same job — it is the shift from developer to engineer. I hold senior engineers to that shift: they think beyond the code they write to the system that must be extended, operated, debugged, and migrated for years; they make hidden complexity visible to me and to stakeholders instead of silently absorbing it; they do much of their job on the collaboration surface — code reviews, pairing, mentoring, feedback, cross-team relationships — because that is where a senior engineer's impact multiplies; and they treat tech debt, testing, and architecture as economic choices argued in business terms, not matters of taste. Impact, not raw effort, is what I measure this level by.\n\n## Statement\n\nThe expectations I hold senior engineers to:\n\n- **Think like an engineer, not only a developer.** Every piece of work considered for how it will be extended, operated, debugged, monitored, and migrated later; recurring bugs prevented, not just fixed once; short-term shortcuts weighed against their long-term cost; decisions documented for the engineers who come after.\n- **Operate independently at scope.** Medium-sized and complex projects handled without hand-holding: self-unblocking in most situations, initiative within scope, architecture designed with feedback sought before locking it in, and mentorship both given and received.\n- **Make complexity visible.** Progress communicated as what was done, why it mattered, and why it was difficult — not \"done / not done.\" Hidden complexity surfaced to manager, peers, and stakeholders; roadblocks raised early with options attached (reduce scope, temporary workaround, another team's help); under-promise, over-deliver, over-communicate.\n- **Work the collaboration surface deliberately.** Reviews that distinguish blocking issues from nitpicks and keep a professional tone; pairing that teaches rather than takes over; mentoring through reviews, pairing, and conversations; feedback — positive and corrective — given early, concretely, and empathetically; relationships with dependent teams built before urgent problems arrive.\n- **Treat tech debt as economics.** Debt recognized as a compounding cost; useful temporary debt distinguished from harmful long-term debt; small debt paid down in passing; larger debt quantified, tied to business impact, and paired with high-impact projects when seeking prioritization.\n- **Choose tests by system needs, not dogma.** The taxonomy known — unit, integration, UI/end-to-end, performance, load, smoke, snapshot, testing in production with flags and canaries — and applied by asking which tests catch the most valuable problems in this system, not by forcing one model everywhere.\n- **Ship architecture through writing and business framing.** Design docs and RFCs before non-trivial work; prototypes to resolve uncertainty; the business goal of an architecture change explainable; a decision-maker identified, rollout and rollback plans prepared, pre-mortems run for risky changes, and lessons shared after shipping.\n\n## How to Read This\n\nThis journal is my engineering-management operating model; this record is the second rung of the engineer career ladder seen from the manager's side. It is grounded in the Well-Rounded Senior Engineer chapters of Gergely Orosz's *The Software Engineer's Guidebook* (Pragmatic Engineer, 2023) — the engineering mindset, getting things done, collaboration, craft, testing, and software architecture. The article states what I hold senior engineers to and how I coach the developer-to-engineer shift; the checklist I hand the engineer — in their voice, closing with the book's senior takeaways — lives in the **Checklist** tab. The checklist is deliberately broader than the article: it keeps the source's full breadth — including managing one's own work, prioritizing requests, product and business awareness, documentation, and domain-driven design — where the article distills the themes I coach hardest.\n\n## Rationale\n\n**The developer-to-engineer shift is a shift in time horizon, and it is the first thing I probe.** A developer's job ends when the code works; an engineer's job includes everything that happens to that code afterwards — extension, operation, debugging, monitoring, migration. So when I assess whether someone is operating at senior, I do not start from output volume; I ask whether their shortcuts are priced, whether their recurring bugs get prevented or just re-fixed, and whether their decisions are written down for the engineers who inherit them. Raw effort is a junior metric; sustained impact on a long-lived system is the senior one.\n\n![Two timelines contrasting a developer horizon that ends when code works with an engineer horizon spanning extension, operation, debugging, monitoring, and migration.](assets/images/well-rounded-senior-engineer/developer-to-engineer-horizon.jpeg)\n**Figure 1:** *The shift is a time horizon: the developer's job ends where the code works; the engineer's job includes everything that happens to it afterwards.*\n\n**Hidden complexity is a senior engineer's to surface, not to absorb.** The failure mode I watch for at this level is the quiet hero: someone who swallows gnarly integration work, invisible migrations, and unplanned yak-shaving without telling anyone — and then looks slow from the outside. I coach the opposite behavior explicitly: say what you did, why it mattered, and why it was hard; raise roadblocks early with options rather than disappearing into them; under-promise and over-communicate. This is not self-promotion. My planning, my staffing, and my stakeholders' expectations are only as good as the visibility of the complexity underneath them.\n\n![Split diagram of hidden complexity absorbed below the waterline versus complexity lifted into view with three options attached.](assets/images/well-rounded-senior-engineer/surface-complexity-not-absorb.jpeg)\n**Figure 2:** *Hidden complexity is surfaced, not absorbed: raised early, above the waterline, with options attached — reduce scope, workaround, or another team's help.*\n\n**Seniority is measured on the collaboration surface, because that is where it multiplies.** A senior engineer's own commits are bounded; their effect on everyone else's commits is not. That is why reviews, pairing, mentoring, and feedback take up so much of this record: a review that teaches, a pairing session where the senior explains instead of silently taking over, feedback delivered early enough to be useful — each of these moves the whole team's baseline. I also expect the surface to extend beyond the team: knowing which teams we depend on and which depend on us, consulting owning teams before touching their systems, and building the cross-team relationships before the urgent problem arrives, not during it.\n\n![Hub-and-spokes diagram of a senior engineer whose reviews, pairing, mentoring, feedback, and cross-team ties raise every teammate's bar.](assets/images/well-rounded-senior-engineer/collaboration-surface-multiplier.jpeg)\n**Figure 3:** *The multiplier lives on the collaboration surface: one engineer's commits are bounded, but their effect on everyone else's is not.*\n\n**Tech debt and testing are business decisions made with engineering judgment.** I do not accept \"the code is bad\" as an argument, and I do not accept test dogma either. On debt, the expectation is discrimination: pay small debt down in passing, quantify large debt, tie it to business impact, and pair cleanup with high-impact work — while also knowing when premature polish is the wrong trade. On testing, the expectation is fit: know the pyramid and the trophy, then ignore both as doctrine and ask which tests actually catch the most valuable problems in this system — including testing in production, safely, with flags, canaries, and rollbacks, when that is the honest answer.\n\n**Architecture that ships needs sponsorship, not just correctness.** The Guidebook's architecture chapters are ultimately about persuasion infrastructure: design docs and RFCs that explain context, tradeoffs, and open questions; prototypes that move stuck debates forward; a named decision-maker so debates end; a business goal — revenue, cost, churn, developer productivity, reliability — that the change can be hung on. I hold senior engineers to that full arc, through rollout plans, rollback plans, and pre-mortems, to the closing reflection on how the architecture performed in reality. A technically superior design that never ships, or ships and cannot be rolled back, is not senior work.\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| Senior engineers think in system lifetimes: operations, migrations, the next engineer. | Gold-plate everything — the source is explicit about avoiding premature cleanup when speed matters more than polish. |\n| Complexity is surfaced early, with options attached. | Complaining is communicating — the expectation is roadblocks plus reduced-scope, workaround, or cross-team options. |\n| Much of the job happens in reviews, pairing, mentoring, and feedback. | Coding stops mattering — the craft bar (languages, debugging, readable code) stays, and rises. |\n| Tech debt is quantified and argued in business impact. | All debt is bad — useful temporary debt is a legitimate tool when it is distinguished and tracked. |\n| Tests are chosen by what catches the most valuable problems here. | One test model fits all systems — neither the pyramid nor the trophy is doctrine. |\n| Architecture ships via design docs, decision-makers, rollout and rollback plans. | The best design wins by being right — without sponsorship and safety nets it is just a document. |\n| Impact is the measure of senior work. | Hours and heroics are — raw effort without leverage is not seniority. |\n\nConcretely: when I calibrate whether someone is senior, I look for evidence on three surfaces — a system they made more sustainable, a complexity they made visible before it became a surprise, and a person or team that got better because of how they reviewed, paired, or mentored. All three, not one.\n\n## Anti-Patterns\n\n- **The bigger junior.** More output, same horizon: shipping fast while operations, migrations, and the next engineer's comprehension are someone else's problem.\n- **The quiet hero.** Absorbing hidden complexity silently, then being read as slow — visibility treated as vanity instead of as an obligation to the people planning around the work.\n- **The silent takeover.** Pairing or reviewing by grabbing the keyboard and rewriting, instead of explaining and teaching — help that leaves the other person no better.\n- **The nitpick reviewer.** Reviews that bury the one blocking issue under thirty style comments that a linter should own — and sour collaboration while missing the defect.\n- **The debt absolutist.** Either ignoring tech debt entirely or demanding a cleanup crusade with no business case — both refusals to do the economics.\n- **Test-model dogma.** Enforcing the pyramid (or the trophy) on every system regardless of what actually breaks and what the failures cost.\n- **Architecture by monologue.** Pushing a major change without a design doc, a decision-maker, stakeholder buy-in, or a rollback plan — then treating its death or its outage as politics.\n\n## Related Records\n\n- [The Competent Software Engineer](competent-software-engineer.html) — the baseline this record builds on; the delivery habits and craft are assumed, then extended.\n- [The Pragmatic Tech Lead](pragmatic-tech-lead.html) — the next expectation set: leading a project and a team's execution, not just one's own scope.\n- [Staff and Principal Engineers](staff-and-principal-engineers.html) — where the leverage described here becomes organization-wide.\n- [Mentoring](mentoring.html) — the manager's-side companion to the mentoring I expect senior engineers to give and seek.\n- [The Art of Feedback](feedback.html) — the manager's feedback discipline; senior engineers run the peer version of the same craft.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs the expectations I hold senior engineers to — the engineering mindset, visible communication, the collaboration surface, tech debt and testing judgment, and architecture practice — and how I calibrate and coach against them. I revisit it if promotion calibrations repeatedly disagree with it (a sign the bar drifted from practice), if the testing or architecture guidance stops matching how our systems are actually built and released, or if AI-assisted development materially changes where senior leverage sits.\n\n## Authoritative References\n\n- Gergely Orosz, *The Software Engineer's Guidebook* (Pragmatic Engineer, 2023) — the Well-Rounded Senior Engineer chapters (engineering mindset, getting things done, collaboration and teamwork, software engineering craft, testing, software architecture) this record distills.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "8 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record — the one I hand the senior engineer, in their voice. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Think like a software engineer, not only a developer\n\n**Long-term engineering mindset**\n\n- [ ] I think beyond writing code and consider the system's long-term maintainability\n- [ ] I consider how my work will be extended, operated, debugged, monitored, and migrated later\n- [ ] I choose solutions that help the codebase remain sustainable over time\n- [ ] I look for ways to prevent recurring bugs, not just fix them once\n- [ ] I document or explain decisions that future engineers will need to understand\n- [ ] I consider whether a short-term shortcut creates avoidable long-term cost\n\n**Senior-level expectations**\n\n- [ ] I can independently handle medium-sized or complex projects\n- [ ] I unblock myself in most situations\n- [ ] I take initiative for work within my scope\n- [ ] I follow team engineering practices and improve them when useful\n- [ ] I design project architecture and seek feedback before locking it in\n- [ ] I collaborate effectively with engineers and stakeholders\n- [ ] I mentor less experienced engineers while also seeking mentorship\n- [ ] I keep learning new domains, platforms, tools, and practices\n\n## 2. Getting things done\n\n**Communicating progress and complexity**\n\n- [ ] I communicate what I did, why it mattered, and why it was difficult\n- [ ] I make hidden complexity visible to my manager, peers, and stakeholders\n- [ ] I share meaningful progress updates, not just \"done\" or \"not done\"\n- [ ] I explain tradeoffs, risks, and decisions clearly\n- [ ] I communicate roadblocks early instead of disappearing into them\n- [ ] I offer options when blocked, such as reducing scope, using a temporary workaround, or asking another team for help\n- [ ] I under-promise, over-deliver, and over-communicate\n\n**Managing my own work**\n\n- [ ] I know my top priority at all times\n- [ ] I protect time for uninterrupted deep work, and say \"not right now\" when I am in the zone\n- [ ] I timebox help requests so I do not lose entire days to interruptions\n- [ ] I turn synchronous requests into asynchronous ones when appropriate\n- [ ] I redirect requests to someone who would benefit from handling them\n- [ ] I regularly purge stale or low-value tasks from my backlog\n- [ ] I know what is normal to feel overwhelmed by, and I escalate before overload becomes failure\n\n**Prioritizing requests**\n\n- [ ] I do urgent and important work immediately\n- [ ] I backlog important but non-urgent work, and keep a lightweight system for capturing it\n- [ ] I pass on, delegate, or say no to urgent but unimportant work\n- [ ] I say no to work that is neither urgent nor important\n- [ ] I review whether old \"important\" tasks are still important\n\n**Doing work properly**\n\n- [ ] I write or confirm a specification before building non-trivial features\n- [ ] I clarify edge cases and out-of-scope behavior before implementation\n- [ ] I create a test plan before or during development\n- [ ] I include testing, monitoring, and alerting in my estimates\n- [ ] I do not throw work \"over the fence\" to QA; I involve QA or testing expertise early when available\n- [ ] I ship in short iterations when possible, breaking large work into smaller, reviewable, shippable pieces\n- [ ] I recognize when longer stretches of work are justified, such as research, infrastructure, major refactors, or rewrites\n- [ ] I seek feedback before a long-running branch or project becomes too hard to change\n\n**Helping the team get things done**\n\n- [ ] I break down and clearly estimate projects\n- [ ] I write notes, diagrams, or documentation so others do not need repeated explanations\n- [ ] I notice when teammates are blocked, and pair with them rather than simply telling them the answer\n- [ ] I help resolve external blockers by contacting other teams or stakeholders\n- [ ] I build relationships that make future cross-team work easier\n- [ ] I look for creative, unconventional solutions when obvious approaches are stuck\n\n**Product and business awareness**\n\n- [ ] I understand how my company succeeds, and the product, customers, and business goals behind my work\n- [ ] I build a relationship with the product manager or business stakeholder\n- [ ] I bring product-informed suggestions to the table, and make product/engineering tradeoffs explicit\n- [ ] I seek frequent product feedback\n- [ ] I remember that I am paid to solve business problems, often by writing code, not merely to write code\n\n## 3. Collaboration and teamwork\n\n**Code reviews**\n\n- [ ] I review for correctness, test coverage, maintainability, and clarity\n- [ ] I check whether a change fits the broader system\n- [ ] I look for unnecessary complexity, duplication, poor abstractions, and hard-to-maintain code\n- [ ] I keep my review tone professional, moderate, and positive, and ask questions before assuming the author is wrong\n- [ ] I distinguish blocking issues from nitpicks, avoid excessive nitpicking, and push for automation or standards where possible\n- [ ] I explain review feedback clearly, especially to new joiners\n- [ ] I consider timezone and remote-work friction when reviewing, and move long review threads to a direct conversation when needed\n\n**Pairing**\n\n- [ ] I use pairing to unblock work, debug, onboard, design, and transfer knowledge\n- [ ] I clarify the problem before jumping into solutions, and understand the urgency before choosing how deeply to pair\n- [ ] When I know the answer, I explain rather than silently take over, and teach the other person how to solve similar problems next time\n- [ ] I avoid immediately giving answers when coaching would be more valuable, and give the other person enough space to think and type\n- [ ] I give compliments when someone works well\n- [ ] I am willing to ask for help with pairing without treating it as a weakness\n\n**Mentoring**\n\n- [ ] I look for opportunities to mentor informally through reviews, pairing, and conversations\n- [ ] I seek mentors for my own growth\n- [ ] I clarify expectations at the start of a mentorship relationship\n- [ ] I listen to what the mentee has to say before giving advice, avoid serving answers on a silver platter, and ask questions that help the mentee reason through the problem\n- [ ] I discuss specific situations, not only abstract advice\n- [ ] I connect mentees with people in my network when useful, and let mentees know I am on their side\n- [ ] I tailor mentoring for technical and non-technical topics\n- [ ] As a mentee, I bring topics, challenges, wins, reflections, and follow-ups\n- [ ] I treat mentorship as a long-term professional investment\n\n**Giving feedback**\n\n- [ ] I give positive feedback when people do good work, making praise concrete and specific, never insincere\n- [ ] I ask questions before giving critical feedback, and deliver corrective feedback empathetically\n- [ ] I use feedback to help people grow, not to show superiority\n- [ ] I give feedback early enough to be useful\n\n**Working with other engineering teams**\n\n- [ ] I understand which teams my team depends on, and which teams depend on my team\n- [ ] I map shared ownership, APIs, infrastructure, customer-facing surfaces, and overlapping features\n- [ ] I introduce myself to key people on related teams, and learn what they own, how they work, and what challenges they face\n- [ ] I build personal connections before urgent cross-team problems arise\n- [ ] I consult owning teams before changing their code or systems, and use code history to identify the right person to ask\n\n**Influence**\n\n- [ ] I ship work that balances quality and speed for my environment\n- [ ] I learn what \"great work\" means in my organization\n- [ ] I gather regular feedback from peers and managers\n- [ ] I get to know people outside engineering, and join calls with remote colleagues instead of staying fully asynchronous\n- [ ] I participate in RFCs, design docs, ADRs, or cross-team planning when I can help\n- [ ] I work on cross-team projects to build trust and understanding\n- [ ] I share progress and wins without boasting, and build a personal brand based on reliability, judgment, and useful impact\n\n## 4. Software engineering craft\n\n**Languages, platforms, and domains**\n\n- [ ] I am strong in at least one programming language, and continue learning additional languages, frameworks, and platforms\n- [ ] I understand imperative, declarative, and functional programming styles\n- [ ] I can work outside my primary platform when the project requires it\n- [ ] I understand enough about frontend, backend, mobile, infrastructure, and embedded contexts to debug cross-platform issues\n- [ ] I read code reviews and changes on other platforms to learn, volunteer for small tasks outside my core stack, and pair with engineers on stacks I want to learn\n- [ ] I use AI assistants to accelerate learning, but verify their output\n\n**Debugging**\n\n- [ ] I know my debugging tools well\n- [ ] I know where production dashboards, logs, metrics, and traces live, and how to query logs and interpret production signals\n- [ ] I understand the codebase structure well enough to find relevant code, and map ownership and dependencies in large codebases\n- [ ] I learn global code search and useful shortcuts\n- [ ] I understand enough infrastructure to debug deployment, secrets, certificates, and configuration issues\n- [ ] I learn from outages and past incident reports, and offer to help investigate real outages when appropriate\n\n**Tech debt**\n\n- [ ] I recognize tech debt as an incremental cost that compounds over time\n- [ ] I distinguish useful, temporary debt from harmful long-term debt\n- [ ] I pay down small tech debt when I encounter it, noting small debt items instead of asking permission for every tiny cleanup\n- [ ] I quantify larger tech debt before proposing major cleanup, and connect it to business impact when seeking prioritization\n- [ ] I pair tech debt cleanup with high-impact projects when possible\n- [ ] I write readable code that future engineers can understand, make code easy to delete, and design systems with extensibility in mind\n- [ ] I avoid premature cleanup when speed is more important than polish\n\n**Documentation**\n\n- [ ] I write design documents or RFCs before non-trivial projects, documenting tradeoffs, diagrams, and reasoning\n- [ ] I create test, rollout, and migration plans when appropriate\n- [ ] I maintain API, interface, SDK, or integration documentation\n- [ ] I write release notes when they help other teams or users, and update user manuals or guides when behavior changes\n- [ ] I maintain onboarding documentation for systems my team owns, and help create or improve a team handbook\n- [ ] I write on-call runbooks for alerts and incidents\n- [ ] I treat documentation as high-leverage engineering work\n\n**Scaling engineering practices**\n\n- [ ] I help the team adopt practices that improve quality and speed, without blindly copying \"best practices\" regardless of team context\n- [ ] I use written planning for non-trivial projects\n- [ ] I support automated testing where it improves confidence, and consider test-driven development when useful\n- [ ] I support code reviews before production changes, and consider post-commit reviews for very small or highly experienced teams\n- [ ] I use testing environments where they add confidence\n- [ ] I support staged rollouts for risky changes, and testing in production safely through flags, canaries, or monitoring\n- [ ] I start by asking what challenge the team is solving, not which practice is fashionable\n\n## 5. Testing\n\n**General testing mindset**\n\n- [ ] I verify that software works as expected before and after shipping\n- [ ] I use manual testing, automated testing, and production monitoring appropriately\n- [ ] I treat testing as part of engineering culture, not a separate afterthought\n- [ ] I choose tests based on system needs rather than dogma\n\n**Unit tests**\n\n- [ ] I write fast, reliable, deterministic unit tests, kept focused and atomic\n- [ ] I use unit tests to validate behavior, document code, and prevent regressions\n- [ ] I design code with testability in mind, including manageable dependencies\n- [ ] I recognize when lack of unit tests makes refactoring risky\n\n**Integration and UI tests**\n\n- [ ] I use integration tests to verify multiple units working together, and understand when they are more valuable than isolated unit tests\n- [ ] I use UI or end-to-end tests to simulate real user flows, recognizing they are often slower and more brittle\n- [ ] I clarify what the team means by unit, integration, UI, and end-to-end tests\n\n**Choosing a test model**\n\n- [ ] I understand the testing pyramid: many unit tests, fewer integration tests, few UI tests\n- [ ] I understand the testing trophy: strong emphasis on integration tests, especially in frontend/full-stack contexts\n- [ ] I do not force a single test model onto every system — I ask which tests actually catch the most valuable problems in mine\n- [ ] I ask engineers at similar companies or in similar domains what testing approaches work for them\n\n**Specialized tests**\n\n- [ ] I consider performance tests when latency or responsiveness matters, and load tests for expected traffic spikes or capacity validation\n- [ ] I understand chaos testing as a way to validate resilience\n- [ ] I use snapshot tests where visual or UI output comparison is useful, and monitor app or bundle size where it affects users\n- [ ] I maintain smoke tests for basic release confidence, and keep sanity/manual tests documented when automation is not practical\n- [ ] I consider accessibility, security, and compatibility testing where relevant\n\n**Testing in production**\n\n- [ ] I use feature flags for safe production exposure and canary deployments for limited rollout\n- [ ] I understand blue-green deployments and when they help, and support automated rollbacks when health signals degrade\n- [ ] I use multi-tenancy or isolated production contexts when useful\n- [ ] I balance production testing with privacy, compliance, and safety constraints\n- [ ] I value production testing for confidence, debugging, and fewer test environments\n\n**Automated testing tradeoffs**\n\n- [ ] I use automated tests to validate correctness and catch regressions before or during deployment\n- [ ] I use tests as living documentation and as a safety net for major changes\n- [ ] I account for the time required to write tests and the maintenance cost of changing complex ones\n- [ ] I manage slow tests so they do not damage development cadence, and identify and fix flaky tests\n- [ ] I treat automated testing as a baseline for long-lived, maintainable software\n\n## 6. Software architecture\n\n**Design documents, RFCs, and architecture docs**\n\n- [ ] I use design documents or RFCs to clarify thinking before major work and to gather feedback early\n- [ ] I choose the right RFC style: prototype first, wait for feedback, build with feedback, or document after decisions\n- [ ] I explain the context, the proposed approach, the trade-offs, and the open questions\n- [ ] I seek feedback asynchronously, synchronously, or in hybrid form depending on project complexity\n- [ ] I do not forget that the goal is to ship a good project, not to perform a perfect RFC ritual\n- [ ] I record architectural decisions in ADRs, C4 diagrams, or another lightweight format\n\n**Prototyping and proof of concept**\n\n- [ ] I use prototypes to explore unknowns, resolve uncertainty, align teams, and demonstrate feasibility\n- [ ] I build throwaway prototypes when concrete learning is more valuable than abstract debate\n- [ ] I clearly label prototypes as non-production, and avoid shipping prototype code as production code without proper engineering work\n- [ ] I choose prototyping when planning alone would be slow or speculative\n\n**Domain-driven design**\n\n- [ ] I build a shared vocabulary with business/domain experts\n- [ ] I identify bounded contexts in complex domains\n- [ ] I model entities, value objects, aggregates, and domain events where helpful\n- [ ] I use domain modeling to reduce misunderstandings between business and engineering\n- [ ] I design code that resembles the business domain, using DDD to improve readability, maintainability, and extensibility\n\n**Shipping architecture**\n\n- [ ] I can explain the business goal behind an architecture change, connecting it to revenue, cost, user churn, developer productivity, reliability, or another business metric\n- [ ] I seek buy-in from stakeholders before pushing major changes, and talk to key people before or during proposal writing\n- [ ] I write proposals that explain decisions clearly and reduce ambiguity\n- [ ] I consider whether feedback against my idea is valid business feedback\n- [ ] I break decision paralysis by specifying capability requirements, and identify a decision-maker before major architectural debates\n- [ ] I clarify who will own and maintain the solution\n- [ ] I use prototypes to move stuck discussions forward, and get product sponsorship for architecture work with business impact\n- [ ] I define what constitutes a successful rollout, create and follow a rollout plan, and define the right time to bake or validate the change in production\n- [ ] I prepare a rollback plan and run pre-mortems for risky architectural changes\n- [ ] I remember that few software decisions are truly final, and capture lessons from rollbacks or failed decisions\n- [ ] I reflect after shipping to learn how the architecture performs in reality, and share architectural learnings with others\n\n## 7. Final senior engineer takeaways\n\n- [ ] I understand that senior engineering impact is more important than raw effort\n- [ ] I know coding is only one part of senior-level engineering\n- [ ] I collaborate efficiently with others and help my team get work done\n- [ ] I mentor others and seek mentorship myself\n- [ ] I understand that \"senior\" means different things across companies\n- [ ] I take responsibility for unblocking complex projects\n- [ ] I ask for help when I'm stuck and bring options rather than only problems\n- [ ] I build systems, relationships, and practices that continue to pay off after my immediate task is done\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why senior is a shift from developer to engineer — not a bigger version of the same job — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. ARLO: an eager early-career engineer climbing the ladder — in some strips a new lead or manager, in others the engineer being coached — buzz-cut hair, zip-up hoodie with rolled sleeves, sticker-covered laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Arlo stands proudly atop a tower of commits while Vera looks on unimpressed.](assets/images/well-rounded-senior-engineer/comic-01-i-ship-the-most.jpeg)\n**Panel 1:** *The hook: more output, presented as seniority — raw effort is a junior metric.*\n\n![Comic panel: a pager wakes an on-call engineer while a long road of operations, bugs, and migrations stretches ahead.](assets/images/well-rounded-senior-engineer/comic-02-the-system-lives-on.jpeg)\n**Panel 2:** *The problem: the developer's job ends when the code works — but the system must be operated, debugged, and migrated for years.*\n\n![Comic panel: Arlo silently holds a huge iceberg of hidden complexity underwater while stakeholders call him slow.](assets/images/well-rounded-senior-engineer/comic-03-the-quiet-hero.jpeg)\n**Panel 3:** *The wrong way: the quiet hero — absorbing hidden complexity silently, then being read as slow.*\n\n![Comic panel: Vera contrasts a short arrow ending at 'works' with a long arrow spanning the system's life.](assets/images/well-rounded-senior-engineer/comic-04-senior-is-a-shift.jpeg)\n**Panel 4:** *The principle: senior is the developer-to-engineer shift — thinking in system lifetimes, not bigger piles of the same job.*\n\n![Comic panel: Arlo lifts the iceberg into view and offers stakeholders three options on a card.](assets/images/well-rounded-senior-engineer/comic-05-surface-it-with-options.jpeg)\n**Panel 5:** *How it runs: make complexity visible early — roadblocks arrive with options attached, not as silent heroics.*\n\n![Comic panel: Arlo reviews and pairs while teammates around him each gain a small upward arrow.](assets/images/well-rounded-senior-engineer/comic-06-the-collaboration-surface.jpeg)\n**Panel 6:** *The mechanic: the collaboration surface — reviews, pairing, mentoring, feedback — is where senior impact multiplies.*\n\n![Comic panel: Arlo presents a cost curve for tech debt to a stakeholder, a crumpled complaint discarded.](assets/images/well-rounded-senior-engineer/comic-07-argue-the-economics.jpeg)\n**Panel 7:** *The cost: 'the code is bad' is not an argument — debt and testing are economics, quantified and tied to business impact.*\n\n![Comic panel: Vera shows Arlo three framed surfaces of senior impact while the old commit tower sits forgotten.](assets/images/well-rounded-senior-engineer/comic-08-impact-not-effort.jpeg)\n**Panel 8:** *The closer: the measure is impact — a sustainable system, a surfaced complexity, and a person made better. All three.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
