<script id="data" type="application/json">{"meta": {"id": "EM-MANAGING-MANAGERS", "status": "draft:gray", "title": "Managing Managers", "date": "2026-07-28", "author": "Željko Obrenović", "permalink": "managing-managers", "timetoread": "7 min", "excerpt": "When my reports are themselves managers, every signal reaches me pre-filtered — so deliberate inspection replaces ambient awareness. I run skip-levels to hear the ground truth, follow up on small signals until I know whether they matter, and hold managers accountable for their teams' health without absorbing their responsibility. I watch for the manager failure patterns, inspect new managers closely in their first six months, hire managers with rigor, and debug dysfunctional teams the way I debug systems.", "tags": "engineering management, managing managers, skip-levels, accountability, manager hiring, team debugging, the manager's path", "icon": "assets/icons/managing-managers.png", "logo": "assets/images/managing-managers/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering management", "managing managers", "skip-levels", "accountability", "manager hiring", "team debugging", "the manager's path"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: When my direct reports are managers, everything I know about the teams arrives filtered through them — and a manager under pressure filters optimistically. So at this rung, deliberate inspection replaces ambient awareness: regular cadences with each manager, skip-levels run to learn rather than to undermine, and follow-up on small signals until I understand whether they matter. I hold each manager accountable for their team's health and output — I coach them, but I do not absorb the responsibility that belongs to them — and when a team is dysfunctional, I debug it like a systems problem: hypothesis, data, observation, and asking why until the real issue surfaces.\n\n## Statement\n\nWhen I manage managers — and for every manager-of-managers I hold accountable — the commitments are:\n\n- **I actively seek ground truth.** I keep a regular cadence with each manager on goals, risks, delivery, and people issues; I know the status of hiring, coaching, goal-setting, postmortems, and major incidents across teams; and I never rely on an open-door policy alone to surface problems. I follow up on small signals until I know whether they matter.\n- **I run skip-levels, to learn.** I meet skip-level reports regularly — 1:1 and occasionally in groups — and ask about team health, blockers, morale, what support they need, and whether there are concerns about the manager, the product direction, or coordination with other teams. Skip-levels exist to inform me, never to undermine the manager.\n- **I hold managers accountable without absorbing their job.** Each manager is accountable for their team's health and productivity; a messy environment does not excuse chronic issues. I expect problems brought to me early, with context and proposed next steps. I coach — I do not take the responsibility back.\n- **I watch for the manager failure patterns.** Overpromising and underdelivering; people-pleasing and avoiding hard conversations; shielding teams from reality instead of solving root problems; saying yes to everyone and creating confusion; micromanaging; skipping 1:1s and evading specifics. I address these directly and early.\n- **I inspect new managers closely and manage experienced ones deliberately.** First-time managers get extra coaching, explicit expectations, and corrective feedback within their first six months. Experienced managers get a culture-fit assessment — experience elsewhere is not effectiveness here — independence where earned, and coaching on strategy, scope, and organizational impact.\n- **I hire managers with rigor.** I test how candidates run 1:1s and handle difficult people situations, ask how they coach underperformers and grow strong performers, probe their management philosophy and delegation style, check that they can diagnose team problems rather than just talk well, verify technical credibility with the team they would lead, and run thorough reference checks — strengths, failures, and whether people would work with them again.\n- **Outside my expertise, I lean in harder.** For unfamiliar functions I spend more time learning, not less: I ask the manager and team to teach me how the work works, and I check in regularly until I can detect problems and ask informed questions.\n\n## How to Read This\n\nThis journal is my engineering-management operating model, each record grounded in one source. This record distills the \"Managing Managers\" chapter of Camille Fournier's *The Manager's Path* (O'Reilly, 2017) — the rung where the reports are themselves managers and the distance to the actual work doubles. I write it two-sided: what I commit to when I occupy this role, and what I hold every manager-of-managers in my organization accountable for. The runnable version — the skip-level question set, the failure-pattern watchlist, the team-debugging procedure, and the self-review — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**Filtered information is the defining hazard of this rung.** A manager reporting upward summarizes, smooths, and — under pressure — shades toward optimism. None of this requires bad faith; it is what summarization does. If I only know what my managers choose to tell me, I will learn about a failing team at the moment it fails, and about a departing engineer from their resignation letter. That is why the source insists on active information-seeking: regular cadences on goals, risks, delivery, and people; awareness of hiring, postmortems, and incidents across teams; and the discipline of following up on small signals — an offhand remark, a skipped meeting, an unusually vague update — until I understand whether they matter. An open-door policy surfaces nothing; the people with the worst news are the least likely to walk through it.\n\n![Diagram of a jagged ground-truth signal smoothed into a rosy line by a manager-layer funnel, with dotted skip-level and follow-up arrows bypassing the filter.](assets/images/managing-managers/filtered-information.jpeg)\n**Figure 1:** *Every signal arrives pre-filtered — and filters shade optimistic. Skip-levels and follow-up are the deliberate bypass channels.*\n\n\n**Skip-levels are the ground-truth channel, and their framing decides their value.** Run well, a skip-level tells me things no status report contains: whether people understand and believe the goals, what daily friction looks like, what support the team actually needs, and — asked carefully — whether there are concerns about the manager, the product direction, or coordination with other teams. Run badly, the same meeting becomes surveillance that undermines the manager and teaches everyone to perform. The difference is intent made explicit: I ask to learn, I ask what is going well as earnestly as what is not, and what I hear feeds coaching conversations with the manager — not end-runs around them.\n\n**Accountability that I absorb stops being accountability.** When a manager brings me a struggling team and I quietly take over the problem, I have taught them that team health is ultimately my job. The source's line is exact: coach managers, but do not absorb the responsibility that belongs to them. The standard I hold is that managers bring me problems early, with context and proposed next steps — and that a manager \"making my job easier\" is doing so the right way, by running a genuinely healthy team, not by hiding problems until they detonate. The failure patterns I watch for are mostly ways of faking health: overpromising, people-pleasing, shielding the team from reality instead of fixing root problems, saying yes to everyone, or going vague and skipping 1:1s. Each is addressed directly and early, because each one compounds.\n\n![Split panel contrasting a leader steadying a manager who carries their own team-problem box versus the leader buried under everyone's boxes while managers stand empty-handed.](assets/images/managing-managers/coach-dont-absorb.jpeg)\n**Figure 2:** *Coach the carrier; never take the box. Accountability that gets absorbed upward stops being accountability.*\n\n\n**New managers and experienced managers fail differently, so I inspect them differently.** A first-time manager is learning a new craft with live subjects; the kind move and the rigorous move are the same — close inspection of their 1:1s, feedback, delegation, and planning, explicit expectations, and corrective feedback within the first six months, while habits are still soft. An experienced manager arriving from elsewhere carries a formed philosophy that may or may not fit; the risk is not skill but mismatch, so I assess culture fit honestly — experience elsewhere is not effectiveness here — align on management philosophy and expectations, then give independence where it is earned and coach at the level of strategy, scope, and organizational impact. Hiring managers gets the same seriousness as hiring senior engineers, because a bad manager damages an entire team before the damage is visible: role-played 1:1s and difficult situations, coaching philosophy, diagnostic ability, technical credibility with the specific team, and references that cover failures, not just strengths.\n\n**A dysfunctional team is a systems problem, and I debug it like one.** When a team is unhappy or underdelivering, the tempting move is to accept the first story offered — the manager's, or the loudest engineer's. Instead I run the debugging loop: form a hypothesis; check the data — tickets, incidents, code reviews, calendars, communication patterns, delivery history; observe the team in meetings and working sessions; ask people whether they understand their goals and why those goals matter; assess dynamics, trust, and cross-functional relationships; and keep asking why until the real issue surfaces. I jump in to help when the manager is struggling — but as a debugger with curiosity, not as a replacement manager.\n\n![Circular loop of hypothesis, data, observation, and asking why orbiting a team with a hidden crack, examined through a magnifying glass.](assets/images/managing-managers/team-debugging-loop.jpeg)\n**Figure 3:** *A dysfunctional team is a systems problem: hypothesis, data, observation, and why — repeated until the real issue surfaces.*\n\n\n**The same grounding requirement applies here as everywhere on the ladder.** I stay technically relevant enough — systems, bottlenecks, technical bets, some code and postmortems — to filter requests with my own judgment and explain technical tradeoffs in business terms, instead of acting as a relay between leadership and teams.\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| I actively seek information across teams. | I distrust my managers — inspection is how I support them, not how I audit their honesty. |\n| I run regular skip-levels with a real question set. | Skip-levels are a back channel for overriding managers — what I learn feeds coaching, not end-runs. |\n| Managers are accountable for team health and output. | I abandon struggling managers — I coach closely, especially in the first six months. |\n| I address failure patterns directly and early. | One bad week is a pattern — I follow signals until I know whether they matter. |\n| I debug dysfunctional teams with hypothesis and data. | I take over dysfunctional teams — I help, then hand the running of the team back. |\n| Outside my expertise, I lean in and learn the function. | I must become an expert in every function — the bar is informed questions and problem detection, not mastery. |\n| I hire managers with role-play, diagnosis tests, and deep references. | A polished interview narrative is enough — talking well about management is not the same as diagnosing a real team. |\n\nConcretely: every manager reporting to me has a standing cadence covering goals, risks, delivery, and people; every skip-level report sees me at a predictable rhythm; every new manager has explicit written expectations and gets substantive feedback within six months; and for every team in my organization I can say whether it is running well, and why or why not.\n\n## Anti-Patterns\n\n- **The open-door manager-of-managers.** Waiting for problems to walk in, then being surprised by an attrition spike or a failed delivery that \"no one raised.\"\n- **Skip-levels as surveillance.** Using skip-level meetings to collect ammunition about a manager instead of context about a team — and destroying both channels at once.\n- **Absorbing the manager's job.** Taking over every struggling team personally, teaching managers that escalation means handoff and that team health is ultimately mine.\n- **Excusing chronic issues because the environment is messy.** Accepting perpetual dysfunction as the cost of a hard context instead of holding the manager accountable for improving it.\n- **Confusing polish with competence.** Hiring or promoting managers who talk beautifully about management but cannot diagnose a concrete team problem — the exact gap rigorous interviews and references exist to catch.\n- **Retreating to comfort zones.** Managing an unfamiliar function by avoiding it — engaging deeply only where I feel expert, and leaving the unfamiliar teams effectively unmanaged.\n- **Adopting the first story.** Debugging a dysfunctional team by accepting the most available narrative instead of checking tickets, calendars, delivery history, and the team's own understanding of its goals.\n- **The relay manager.** Passing requests downward and status upward without applying technical judgment in either direction — adding latency and subtracting nothing.\n\n## Related Records\n\n- [Managing Multiple Teams](managing-multiple-teams.html) — the previous rung: leading several teams directly; this record begins where the directs are themselves managers and information distance doubles.\n- [Senior Leadership](senior-leadership.html) — the next rung: the executive level, where these inspection habits become organizational systems.\n- [Management 101](management-101.html) — the two-sided contract every manager owes their reports; skip-levels are partly a check that my managers are honoring it.\n- [Managing a Team](managing-a-team.html) — what I hold each of my managers accountable for delivering on their own team.\n- [Hiring Well](hiring-well.html) — the general hiring craft; this record adds the manager-specific rigor of role-play, diagnosis tests, and deep references.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs how I operate whenever my direct reports are managers: information-seeking, skip-levels, accountability boundaries, manager development and hiring, and team debugging. I revisit it if a serious team problem reaches me through escalation or attrition before my own inspection surfaced it, if a new manager reaches six months without substantive corrective feedback, or if my self-review shows me sliding back into individual-contributor or project-manager habits instead of spending time on leverage.\n\n## Authoritative References\n\n- Camille Fournier, *The Manager's Path: A Guide for Tech Leaders Navigating Growth and Change* (O'Reilly, 2017) — the \"Managing Managers\" chapter this record distills; the checklist in the Checklist tab is adapted from its chapter checklist.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "5 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Stay close enough to know what is really happening\n\n- [ ] I have a regular cadence with each manager on goals, risks, delivery, and people issues\n- [ ] I follow up on small signals until I understand whether they matter\n- [ ] I know the status of hiring, coaching, goal-setting, postmortems, and major incidents across teams\n- [ ] I do not rely on an open-door policy alone to surface problems\n- [ ] I actively seek information instead of waiting for it to come to me\n\n## 2. Run skip-levels to hear the ground truth\n\n- [ ] I regularly meet with skip-level reports, not just my direct reports\n- [ ] I use skip-levels to learn, not to undermine the manager\n- [ ] I ask about team health, blockers, morale, and opportunities\n- [ ] I ask what is going well and what is not\n- [ ] I ask the team what support they need from management\n- [ ] I ask whether there are concerns about the manager, product direction, or coordination with other teams\n- [ ] I use both 1:1s and occasional group skip-level sessions where appropriate\n\n## 3. Hold managers accountable for team health and output\n\n- [ ] I am clear that each manager is accountable for their team's health and productivity\n- [ ] I do not excuse chronic issues just because the environment is messy\n- [ ] I expect managers to bring me problems early, with context and proposed next steps\n- [ ] I coach managers, but I do not absorb the responsibility that belongs to them\n- [ ] I evaluate whether a manager is making my job easier in the right way, not by hiding problems\n\n## 4. Watch for failure patterns in managers\n\n- [ ] I look for managers who overpromise and underdeliver\n- [ ] I watch for people-pleasing behavior and avoidance of hard conversations\n- [ ] I notice when managers shield teams from reality instead of solving root problems\n- [ ] I notice when managers say yes to everyone and create confusion\n- [ ] I watch for control-freak or micromanaging behavior\n- [ ] I watch for managers who skip 1:1s, avoid feedback, or evade specifics\n- [ ] I address unhealthy patterns directly and early\n\n## 5. Support and inspect new managers closely\n\n- [ ] I spend extra time coaching first-time managers\n- [ ] I check how their 1:1s, feedback, delegation, and planning are going\n- [ ] I make expectations explicit about delivery, team health, and accountability\n- [ ] I look for signs of overload, avoidance, or misuse of authority\n- [ ] I give corrective feedback in the first six months when needed\n- [ ] I provide access to training, mentoring, and practical support\n\n## 6. Manage experienced managers deliberately\n\n- [ ] I assess whether experienced managers fit our culture and way of working\n- [ ] I do not confuse experience elsewhere with effectiveness here\n- [ ] I align on management philosophy, expectations, and team culture\n- [ ] I let experienced managers operate independently where appropriate\n- [ ] I coach them more on strategy, scope, influence, and organizational impact\n\n## 7. Hire managers with rigor\n\n- [ ] I assess both management skill and cultural fit\n- [ ] I test how candidates run 1:1s and handle difficult people situations\n- [ ] I ask how they coach underperformers and grow strong performers\n- [ ] I ask about their management philosophy and delegation style\n- [ ] I check whether they can diagnose team problems, not just talk well\n- [ ] I evaluate whether the team they would manage sees them as having sufficient technical credibility\n- [ ] I do thorough reference checks, including strengths, failures, and whether others would work with them again\n\n## 8. If managing outside my expertise, lean in harder\n\n- [ ] I spend more time learning unfamiliar functions instead of fewer\n- [ ] I ask the manager and team to teach me how the work works\n- [ ] I build enough understanding to detect problems and ask informed questions\n- [ ] I do not retreat into only the areas where I feel comfortable\n- [ ] I regularly check in on unfamiliar areas until I develop judgment\n\n## 9. Debug dysfunctional teams like systems problems\n\n- [ ] I form a hypothesis about what might be wrong\n- [ ] I check the data: tickets, incidents, reviews, calendars, communication patterns, and delivery history\n- [ ] I observe the team in meetings and working sessions\n- [ ] I ask people whether they understand goals and why those goals matter\n- [ ] I assess team dynamics, collaboration, trust, and cross-functional relationships\n- [ ] I jump in to help when needed, especially if the manager is struggling\n- [ ] I stay curious and keep asking why until I understand the real issue\n\n## 10. Improve delivery and schedule communication\n\n- [ ] I make sure teams produce estimates and update them when reality changes\n- [ ] I communicate schedule risk early, especially on important work\n- [ ] I help teams learn from bad estimates instead of treating estimation as a one-time activity\n- [ ] I distinguish real delays from leadership discomfort with uncertainty\n- [ ] I help cut scope when needed to protect important deadlines\n- [ ] I ensure managers, tech leads, and partners share a common view of progress\n\n## 11. Handle roadmap uncertainty realistically\n\n- [ ] I avoid promising too much too early, because plans may change\n- [ ] I break big efforts into smaller deliverables that create value sooner\n- [ ] I avoid promising future technical work without a real commitment behind it\n- [ ] I reserve capacity for sustaining engineering, cleanup, bugs, and improvements\n- [ ] I ask teams to explain the size, value, and urgency of technical projects\n- [ ] I help teams make clean transitions when priorities or org structures change\n\n## 12. Stay technically relevant enough to lead well\n\n- [ ] I understand the major systems, bottlenecks, and technical bets across my org\n- [ ] I read some code, reviews, or technical docs often enough to stay grounded\n- [ ] I ask engineers to teach me areas I do not understand\n- [ ] I attend postmortems and learn from failures\n- [ ] I stay informed about engineering tools, processes, and industry trends\n- [ ] I use my technical judgment to filter requests instead of acting as a relay between leadership and teams\n- [ ] I can explain technical tradeoffs in business terms\n\n## 13. Review myself as a manager-of-managers\n\n- [ ] I know how often I engage skip-levels and whether it is enough\n- [ ] I can clearly describe what I expect from each manager's role\n- [ ] I know how I evaluate my managers\n- [ ] I have a current view of each manager's strengths, weaknesses, and development needs\n- [ ] I know which teams are running better than others and why\n- [ ] I can explain my process for hiring, coaching, and assessing managers\n- [ ] I am spending my time on leverage, not falling back into individual-contributor or project-manager habits\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "When your reports are managers, every signal arrives pre-filtered — eight panels on getting ground truth without taking over.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. ARLO: an eager early-career engineer climbing the ladder — in some strips a new lead or manager, in others the engineer being coached — buzz-cut hair, zip-up hoodie with rolled sleeves, sticker-covered laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: a smiling manager hands Arlo an all-green status report and Arlo gives a thumbs up.](assets/images/managing-managers/comic-01-all-green.jpeg)\n**Panel 1:** *The hook: every report on the desk is green — and every one of them has been summarized on the way up.*\n\n![Comic panel: Arlo shocked by a resignation letter while an unhappy team is visible through the window behind him.](assets/images/managing-managers/comic-02-the-resignation-surprise.jpeg)\n**Panel 2:** *The problem: rely on what filters up, and you learn about the failing team from the resignation letter.*\n\n![Comic panel: Arlo sits by a wide-open door facing an empty hallway with a drifting paper tumbleweed.](assets/images/managing-managers/comic-03-the-open-door.jpeg)\n**Panel 3:** *The wrong way: the open door — the people with the worst news are the least likely to walk through it.*\n\n![Comic panel: Vera taps a whiteboard funnel that smooths a jagged line into a rosy one while Arlo leans in.](assets/images/managing-managers/comic-04-signals-arrive-filtered.jpeg)\n**Panel 4:** *The principle: filtering is what summarization does — so deliberate inspection has to replace ambient awareness.*\n\n![Comic panel: Arlo listens over coffee to a junior engineer speaking freely, notebook open on the table.](assets/images/managing-managers/comic-05-the-skip-level.jpeg)\n**Panel 5:** *How it runs: regular skip-levels with real questions — the ground-truth channel, framed to learn, not to police.*\n\n![Comic panel: Arlo steadies but does not take a heavy TEAM PROBLEM box carried uphill by a manager.](assets/images/managing-managers/comic-06-coach-dont-absorb.jpeg)\n**Panel 6:** *The mechanic: coach the manager who carries the problem — absorb it, and team health quietly becomes your job.*\n\n![Comic panel: Arlo studies an evidence wall of tickets, calendars, and incidents with a magnifying glass while Vera advises.](assets/images/managing-managers/comic-07-debugging-the-team.jpeg)\n**Panel 7:** *The cost: ground truth is work — hypothesis, data, observation, and asking why until the real issue surfaces.*\n\n![Comic panel: Arlo presents an annotated wall of team cards with green and amber dots as his managers stand relaxed nearby.](assets/images/managing-managers/comic-08-i-know-why.jpeg)\n**Panel 8:** *The closer: the bar for the rung — for every team, being able to say whether it runs well, and why.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
