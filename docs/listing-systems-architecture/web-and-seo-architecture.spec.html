<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, acceptance criteria AC-1 to AC-3, the thesis and the role are copied unchanged from the web-and-seo-architecture entry in journal-spec.json; the supporting claims and audience are this spec's own. Units added by this conversion: introduction roadmap p04 (the sharpening pass of 2026-10-20 had replaced the roadmap with the builds-on paragraph p03), and a conclusion widened from one paragraph to two (p70 synthesis and callback, p71 hand-off).\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** How a listing site earns organic traffic: crawl budget, indexing, landing pages for category × location, and why listing pages are short-lived.\n- **Know:** Listing pages across the lifecycle (canonical URLs, status codes, redirects, sitemaps, unavailable_after), structured data, Core Web Vitals as an architecture budget.\n- **Know:** Server-side rendering with page-level ownership, backends-for-frontends, server-driven UI and deep links, localization across domains, and AI search and answer engines as a channel and a crawler.\n- **Believe:** Landing pages generated under rules, not listing pages, are the durable search asset.\n- **Believe:** Indexed URLs are an operational number; contacts from organic sessions are the measure of the layer.\n- **Be able to:** Write the generation rules for an indexable landing-page set and the gone-listing rules per vertical.\n- **Be able to:** Drive URLs, status codes and sitemaps from listing lifecycle events.\n- **Be able to:** Choose a rendering and ownership model for public pages and a backend per client.\n\n**Audience:** Chief architects, principal engineers and web, app and SEO leads at classifieds, real-estate, automotive and jobs marketplaces.\n\n**Already knows:**\n\n- What an API, a database, an event stream, a search engine and Kubernetes are; HTTP, CDNs and front-end frameworks.\n- From earlier chapters: the listing aggregate and its lifecycle, the publication pipeline, the category taxonomy and its change process, attribute schemas, entity resolution and canonical clusters, saved searches and digests, products and entitlements, advertising and header bidding, the listing event stream (event-driven-listings) and read models and copies (listing-data-management); contacts as any action by which a buyer reaches a seller (messaging-and-leads).\n- Veldmark (fictional), its brands Tradeyard, Motorvane and Hearthly, Yardstick, Safe Deal, Common Ground, the architecture advice forum, Ingrid Halvorsen and Daan Visser, the Rotterdam bike and the Lyon apartment, and the failure-pattern names (Ghost Inventory, The Category Straitjacket, Vanity Liquidity, Billing by Guesswork).\n\n**Does not yet know:**\n\n- The terms this chapter owns: SEO architecture, landing page, landing page generation, crawl budget, backend-for-frontend.\n- Search-engine vocabulary: crawl, render, index and rank; soft 404; noindex, unavailable_after and X-Robots-Tag; sitemaps and lastmod; IndexNow and the Indexing API; hreflang; scaled content and doorway abuse; product snippets and merchant listings; Google-Extended.\n- Rendering and composition models (CSR, SSR with hydration, streaming SSR, static generation, dynamic rendering, runtime fragments, microsites) and Core Web Vitals thresholds (LCP, INP, CLS).\n- How the group defines an organic contact, which data-platform governs.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given an SEO estate and a proposed rebuild, the reader names the rules and the metric the chapter applies. *Probe:* A classifieds site reports 40 million indexed URLs; about a sixth are sold or expired listings whose pages answer 200 with an 'unavailable' banner, most of the rest are facet combinations with few results, and new listings wait more than two days for their first crawl. A team proposes rebuilding search pages as a client-rendered single-page application. Using only this chapter: what rules do you apply, what do you build instead, and how do you know it worked? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** How should the customer-facing web and app layers be built for a business that depends on search engines and mobile apps?\n\n> **Claim:** A marketplace that depends on search engines and apps should treat crawlable landing pages, not listing pages, as its durable search inventory, generated from measured demand and live supply under explicit rules (at Veldmark at least five live results on most days over eight weeks and at most two attributes beyond category and location), with every other search URL given noindex, a 404 or no URL; should drive canonical URLs, status codes, redirects and sitemap entries from the same listing lifecycle events that drive search, so a sold listing leaves the index rather than answering 200; should render public pages on the server with one owning team per URL pattern and give each app its own backend-for-frontend; and should judge the layer by contacts per thousand organic sessions, not by indexed URLs.\n\n**Disputed by:** The common practice of reporting indexed URLs and organic sessions as SEO strength, letting every facet combination be indexed, keeping sold listing pages live with an 'unavailable' banner, and rebuilding search pages as client-rendered single-page applications for speed of development.\n\n**So what:** A Chief Architect who accepts this shares the URL, landing-page, redirect and sitemap services and the structured-data builders as group capabilities configured per brand while pages, design and SEO strategy stay with each brand; makes the rendering standard, the gone-listing rules per vertical and the per-agent crawler policy group decisions; blocks a taxonomy change that ships without its redirect-registry update; requires a URL migration plan and traffic baseline before any migration; and takes indexed URLs out of the board pack.\n\n**How and why:** Tradeyard had about 40 million indexed URLs and 46% of sessions from organic search, yet 6.3 million indexed pages were gone listings answering 200, only about 1.1 million of 19.8 million search URLs drew an organic visit in 90 days, 41% of Googlebot's fetches went to facet or dead URLs, and a new listing waited a median 2.6 days for its first crawl. Femke's sold bike stayed in Google's results nine days and drew 37 clicks. After the May 2027 decision record (server-rendered pages, two backends-for-frontends, four SEO services, event-driven lifecycle rules, performance budgets), indexed URLs fell to 15.9 million by February 2028 while organic sessions rose 4% and contacts from organic sessions rose 17%.\n\n**Supporting claims**\n\n- **S1** — Search engines are a client of the platform with their own protocol (URLs, status codes, sitemaps, structured data, response times), and on a large listing site crawl budget binds, so that contract is designed as part of the customer-facing architecture from the start rather than added as tags afterwards.\n- **S2** — Landing pages, not listing pages, are the durable search inventory: indexability is a computed state under explicit demand, supply, distinctness, depth and quality rules, bounded by Google's faceted-navigation guidance and spam policies, and every other search URL gets noindex, a 404 or no URL.\n- **S3** — Canonical URLs, status codes, redirects and sitemap entries are driven by the same listing and taxonomy events that drive search, through shared URL, landing-page, redirect and sitemap services, so a sold listing leaves the index and a category split is a pipeline rather than a project.\n- **S4** — Public pages are rendered on the server, one team owns each URL pattern end to end (rendering, performance budget, status codes, structured data) with build-time shared components, and structured data and Core Web Vitals budgets belong to the page owner.\n- **S5** — Apps get their own backend-for-frontend, insertion forms served from the attribute schema and deep links that resolve the same canonical and retired URLs as the web, because app releases reach users slowly.\n- **S6** — The layer is judged by contacts from organic sessions rather than indexed URLs; answer engines change the channel but not that measure, because fresh, contactable inventory is the asset an answer cannot copy.\n\n## Role in the part\n\nExtends the event contract and the copy register to the copy with external readers, and makes contacts from organic sessions the measure of the public web. Supports P7-3 of part `part-7`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in scene poses Tradeyard's 40 million URLs, Femke's bike and the two pending changes; the worked example answers them after the body has built the design; `grouping` in trade-offs, verticals, failure-modes, ca-view, questions: the book's standard judging sections)\n\nThe scene comes first because its numbers and pending changes are the problems the chapter solves. The concepts follow because every later section uses crawl budget, page types and the landing page; placed later, the stack would have layers the reader cannot name. The stack comes before the parts it contains, so each design section can name the edge, the page applications and the SEO services. Landing pages come before listing pages because they are the durable asset and their registry and redirect services are reused by the lifecycle rules; localization follows the landing pages directly because it extends the URL service and the landing page registry across countries, and placed after the apps both round-3 flow readers found its position unclear; structured data and performance follow because both are properties of the rendered page and its owner; apps come after the web because their BFFs and deep links reuse the URL services; answer engines extend the design to new crawlers. The worked example can replay the scene only once every rule exists, and the judging sections apply the whole design, so they come last. Structured data follows the lifecycle because its builder reads the same read model whose states the lifecycle defines; performance follows structured data because its budgets are owned by the same page teams and it closes the web-page sections by tying page speed back to crawl capacity; placed before the page designs, the budgets would have no owners. Answer engines need the crawler policy and the organic-contact measure, so they come after the design and before the worked example that uses them.\n\n## Introduction\n\n**Hook** (`direct_statement`): Every page has two audiences: a person on a phone who wants a used e-bike near home, and a crawler that decides whether that person will ever see the page in a search result.\n\n**Bridge:** Most marketplaces build the web front end for users, add SEO as tags afterwards, and have their first serious conversation about crawl budget after a redesign that cost a third of organic traffic. → SEO architecture, the components and rules that decide which URLs exist and what they return, designed as part of the customer-facing architecture from the start.\n\n**Thesis statement** (KEY POINTS callout (three bullets) and the Vanity Liquidity bullet of the failure-patterns callout; p02 defines the scope.): Landing pages generated under rules, not listing pages, are the durable search asset; URLs, status codes and sitemaps belong to the listing lifecycle; public pages are rendered on the server with page-level ownership and each client gets its own backend; and the layer is judged by contacts from organic sessions, not indexed URLs.\n\n**Roadmap** (Paragraph p04, which names the sections in order, with the IN THIS CHAPTER callout.):\n\n- Open with Tradeyard's 40 million indexed URLs and Femke's sold bike. *Kept in:* scene.\n- Define how a listing site earns organic traffic. *Kept in:* concepts.\n- Lay out the customer-facing stack. *Kept in:* architecture.\n- Design landing pages and their localization across country domains, listing pages across the lifecycle, structured data, performance budgets and the app backends. *Kept in:* landing, localization, lifecycle, structured-data, performance, apps.\n- Cover AI answer engines. *Kept in:* ai-search.\n- Rebuild Tradeyard's SEO inventory in the worked example. *Kept in:* worked.\n- Close with trade-offs, vertical differences, failure modes, the Chief Architect's view and questions. *Kept in:* trade-offs, verticals, failure-modes, ca-view, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | claim | Every page of a listing site has two audiences, a person on a phone and a crawler that decides whether that person will see the page, so for a business whose inventory changes by the minute how the site talks to crawlers is a design decision with a revenue line attached. | example: A person on a phone who wants a used e-bike near home; a crawler that reads HTML, follows links, respects status codes, reads sitemaps and measures server response time. |  |\n| p02 | definition | Most marketplaces treat SEO as tags added after the front end is built and learn about crawl budget only after a redesign costs traffic, so this chapter defines SEO architecture as the components and rules that decide which URLs exist, what each returns over its lifetime, how pages are rendered and how engines learn of changes, and treats it as part of the customer-facing architecture from the start. | reasoning: A redesign that cost a third of organic traffic before the first serious conversation about crawl budget. | `contrast`: The claim that crawler communication is a design decision. → How most marketplaces treat it instead, and the book's definition of SEO architecture. |\n| p03 | context | The chapter builds on the listing events of event-driven-listings and treats the search engine's index as the outermost read model of listing-data-management, leaves search indexing to search-architecture, and sets up the organic-contact metric that data-platform governs and the web-layer start of modernization-and-migration; a contact is any action by which a buyer reaches a seller about a listing. | reasoning: Links to event-driven-listings, listing-data-management, search-architecture, data-platform, messaging-and-leads and modernization-and-migration (Yardstick's strangler). | `place`: SEO architecture as part of the customer-facing architecture. → Where the chapter sits among the Part VII chapters before and after it, and what a contact is. |\n| p04 | transition | The chapter opens with Tradeyard's 40 million indexed URLs and Femke's sold bike, defines how a listing site earns organic traffic and lays out the customer-facing stack, designs landing pages and their localization across country domains, listing pages across the lifecycle, structured data, performance budgets and the app backends, covers AI answer engines, rebuilds Tradeyard's SEO inventory in the worked example, and closes with trade-offs, vertical differences, failure modes, the Chief Architect's view and questions, on evidence from Google's and web.dev's documentation, schema.org, dated marketplace engineering posts and the fictional Veldmark. | reasoning: The chapter's sections in order and the kinds of evidence used. | `sequence`: Where the chapter sits. → The order in which it proceeds and what it rests on. |\n\n## Sections\n\n### Setting the Scene at Veldmark: Forty Million URLs and a Sold Bike\n\n**Controlling idea** (`context`, id `scene`): Tradeyard's 40 million indexed URLs and 46% organic share hide a small set of landing pages that earn traffic, a sixth of the index in gone listings and a crawl wasted on facets, while two pending changes threaten the same layer.\n\n**Advances the thesis** (S1, S2, S3, S6): Poses the chapter's question with the numbers the worked example later changes.\n\n**Transition in:** `example`: The claim that the crawler is a client whose contract must be designed, and the roadmap. → A Veldmark estate where that contract was never designed.\n\n**Order of paragraphs** (`small_to_large`): From the two board-pack numbers to the audit behind them, to one bike, then to the changes ahead and the question they pose.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | context | In late March 2027 Ingrid reviews Tradeyard's web estate, whose 40 million indexed URLs and 46% of web sessions from organic search appear in every board pack as evidence of strength, and asks what is behind them. | scenario: About 40 million indexed URLs across four country domains; 46% of web sessions start from organic search; Ingrid Halvorsen, Daan Visser and the SEO lead. |  |\n| p06 | evidence | The February crawl audit breaks the 40 million indexed URLs into four page types with their live results and organic visits. | table: Live listing pages 11.4M (31% of organic sessions); sold, expired or removed pages 6.3M answering 200 (6% of organic sessions, 0.4% of organic contacts); search and landing pages 19.8M (7.1M with fewer than three live results; 58% of organic sessions from about 1.1M URLs); shops, profiles, help and guides 2.5M (5%). | `cause_effect`: Ingrid's question about the two numbers. → The audit that answers it. |\n| p07 | analysis | Three findings stand out: most organic value comes from about 1.1 million of 19.8 million search URLs, a sixth of the index is gone inventory answering 200, and 41% of about 14 million daily Googlebot fetches go to facet or dead URLs while a new listing waits a median 2.6 days for its first crawl, too late for most private goods. | statistic: About 1.1M of 19.8M search URLs with an organic visit in 90 days; 6.3M gone pages; ~14M fetches a day, 41% on facets or dead pages; median 2.6 days to first crawl of a new NL listing. | `elaboration`: The audit table. → What it shows. |\n| p08 | example | Femke's city bike, sold on 8 March 2027 and removed from search at 18:11, kept answering 200 with a banner, stayed in the sitemap with an unchanged lastmod and drew 37 clicks from Google over nine days, a problem this chapter owns. | scenario: Listed in Rotterdam for €240 on Sunday 7 March 2027; sold Monday 8 March for €225; marked sold 18:10, removed from search 18:11; still in Google's results nine days later with 37 clicks; the alert digest is owned by saved-searches-and-alerts. | `example`: A sixth of the index is gone inventory. → One gone listing followed through the search engine. |\n| p09 | context | Two pending changes touch the same layer, a client-rendered rebuild of Yardstick's slow search pages and the bikes split on 1 November 2027 that changes thousands of landing-page URLs, so Ingrid asks what architecture would make such changes routine instead of risky. | scenario: Yardstick, the 2006 PHP monolith, renders the search pages; a proposed client-rendered single-page application; the bikes split into city, e-bikes, cargo and kids' bikes on 1 November 2027. | `additional_support`: The audit's problems in the current estate. → Two planned changes that put the same layer at risk, and the chapter's question. |\n\n### Concepts: How a Listing Site Earns Organic Traffic\n\n**Controlling idea** (`definition`, id `concepts`): A search engine crawls, renders, indexes and ranks under a crawl budget that depends on value and server health, and of a listing site's page types the landing page is the durable asset.\n\n**Advances the thesis** (S1, S2): Defines the terms every later section uses.\n\n**Transition in:** `cause_effect`: Ingrid's question and the audit's three problems. → The concepts needed to explain them: crawl stages, crawl budget, page types and the landing page.\n\n**Order of paragraphs** (`prerequisite_order`): The engine's stages come first because crawl budget and every page type are judged by them; the landing page is defined after the page types it is one of, and the section ends on why it carries the weight.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | definition | A search engine crawls, renders, indexes and ranks, and each stage filters out pages the next will never see. | reasoning: A URL never crawled cannot be indexed; an empty shell may be indexed without content; a duplicate ranks for nothing. |  |\n| p11 | definition | Google says large or fast-changing sites must manage crawl budget, which every sizable classifieds site is, and that capacity falls with slow or error responses and soft 404s, so crawl budget depends on how valuable the URLs look and how healthy the server is. | quotation: Google Search Central, crawl budget (updated 2026): 'large sites (1 million+ unique pages) with content that changes moderately often (once a week)' or medium sites with 'very rapidly changing content (daily)'; slow, 5xx and 429 responses and soft-404 pages reduce or waste crawling. | `elaboration`: The crawl stage. → When it becomes a budget and what the budget depends on. |\n| p12 | description | Each page type of a listing site has its own lifetime and SEO role, from landing pages that last years to gone listing pages that should be short-lived. | table: Landing, listing detail, faceted result, seller or agency, editorial and tool, and gone listing pages, each with an example, typical lifetime, SEO role and rendering source. | `sequence`: How the engine treats URLs. → The kinds of URL a listing site offers it. |\n| p13 | definition | A landing page is a search result page the platform has deliberately made indexable under a rule, and landing page generation is the process that decides which combinations get such a URL, keeps the set current and retires pages. |  | `elaboration`: The landing page as one row of the table. → The book's definitions of landing page and landing page generation. |\n| p14 | explanation | Landing pages carry the weight because their stable URLs accumulate links and ranking history while short-lived listings pass through them, an inference from inventory lifetime rather than documented fact, with detail pages mattering more where items live longer. | reasoning: A specific bike lasts days; 'tweedehands e-bike Utrecht' lasts years; no classifieds operator published organic traffic by page type.; figure: Figure 1: a landing-page window that stands for years while bike listings pass through in days. | `cause_effect`: The definition of a landing page. → Why it is the durable asset. |\n\n### Architecture: The Customer-Facing Stack\n\n**Controlling idea** (`description`, id `architecture`): The customer-facing stack has five layers: an edge that routes, caches, filters bots and answers redirects; server-rendered page applications owned per URL pattern; backends-for-frontends per client; four SEO services that hold the URL rules; and the domain APIs.\n\n**Advances the thesis** (S1, S3, S4): Lays out the components every later section designs.\n\n**Transition in:** `sequence`: The concepts. → The stack built from them.\n\n**Order of paragraphs** (`large_to_small`): The stack as a whole first, then its layers from the outside in: the edge, rendering and composition of the page applications, and the SEO services the later sections use. The backends-for-frontends get a one-sentence definition where the stack first names them; the full case and the release-cadence evidence stay in the apps section, next to the argument that uses them (rounds 1 and 2 placed the whole definition in the concepts and here, and both flow readers reported it five sections away from its use; round 3 found it used before any definition).\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p16 | description | The crawl stages, budget and page types meet in one customer-facing stack of five layers: the edge, the page applications, the backends-for-frontends, the SEO services and the domain APIs; a backend-for-frontend is defined in one sentence at this first use, as the server-side layer one client family calls instead of the domain APIs, and the apps section makes the case for it. | figure: Figure 2: pages and apps reach domain data through their own BFFs; SEO services decide which URLs exist; the listing event stream keeps sitemaps and edge caches in step. |  |\n| p17 | description | The edge routes URL paths to their owning page applications, caches pages, separates verified crawlers from scrapers and answers redirects and simple statuses without the origin. | reasoning: Routing as the migration seam (Subito on Akamai); millions of retired URLs answering 301 or 410 cheaply. | `elaboration`: The five layers. → The first one, the edge, and its four jobs. |\n| p18 | process | Caching follows page type: landing pages served from cache with minutes of staleness, listing pages cached longer but purged by listing events through a surrogate key, and personal pages never cached at the edge. |  | `elaboration`: The edge's caching job. → The policy per page type. |\n| p19 | comparison | The rendering strategy is the most consequential web-layer decision, and five strategies differ in what the crawler and the phone receive. | table: CSR, SSR with hydration, streaming SSR, static or incremental generation, dynamic rendering: what happens, what the crawler sees, phone performance, fit; Google calls dynamic rendering 'a workaround and not a recommended solution'. | `sequence`: The edge, which serves rendered pages. → How those pages are rendered. |\n| p20 | recommendation | Public landing, search and listing pages should be server-rendered, as Google recommends instead of dynamic rendering, with client rendering kept for authenticated tools, so Tradeyard's proposed client-rendered rebuild would have handed its most valuable pages to deferred rendering. | quotation: Google recommends 'server-side rendering, static rendering, or hydration'.; scenario: The proposed client-rendered rebuild of Yardstick's slow search pages. | `conclusion_summary`: The five strategies. → Which one public pages need. |\n| p21 | explanation | Google indexes the mobile rendering, so content and structured data hidden behind on-demand tabs on mobile may be hidden from the index too. | quotation: Mobile-first indexing guidance: 'make sure that your mobile site contains the same content as your desktop site', with the same structured data. | `additional_support`: Server rendering for crawlers. → A second rendering constraint: the mobile version is the one indexed. |\n| p22 | evidence (list) | Once several teams serve a site, the marketplace record shows four composition approaches: Zalando's runtime fragments and their costs, AutoScout24's server-side stitching, Subito's microsites with page-level ownership and leboncoin's framework migration. | source: Zalando Engineering 2018 (Mosaic's inconsistency and contribution barrier, Interface Framework); AutoScout24 Tech Blog 2018 (nginx stitching, React behind a GraphQL BFF); Adevinta Tech Blog 2023 (Subito microsites, Akamai routing, build-time shared components); GitHub discussion 2021 (leboncoin, about 30 million monthly users, about 40 web developers; article not retrieved). | `sequence`: How pages are rendered. → Who owns and composes them when several teams serve one site. |\n| p23 | recommendation | The evidence points away from runtime fragments toward page-level ownership with build-time shared components, which fits listing sites because page types map to teams, so one team should own each URL pattern end to end and the design system should keep pages consistent. |  | `conclusion_summary`: The four documented approaches. → Their direction and the author's rule. |\n| p24 | description (list) | Four small SEO services hold the rules pages must not reimplement: the URL and canonical service, the landing page registry, the redirect registry and the sitemap and notification service. |  | `sequence`: Page applications owned per team. → The shared services that keep their URL rules consistent. |\n| p25 | explanation | Keeping category and location identifiers behind human-readable slugs makes the redirect registry tractable, because old and new URLs are both derived from category IDs. | example: The bikes split: the service knows which old landing URLs map to which new ones. | `elaboration`: The URL service and the redirect registry. → The design choice that makes them work. |\n\n### Landing Pages: Generating the Durable SEO Inventory\n\n**Controlling idea** (`process`, id `landing`): A landing page should exist only when demand, supply and distinctness justify it, under computed rules bounded by Google's faceted-navigation guidance and spam policies; it is a managed object with states, needs structural internal links and data-based copy, and a taxonomy change is a URL migration it must survive.\n\n**Advances the thesis** (S2, S3): Designs the landing-page generator and its lifecycle.\n\n**Transition in:** `elaboration`: The landing page registry named among the four SEO services. → The rules and lifecycle it manages.\n\n**Order of paragraphs** (`prerequisite_order`): The rules come first, then the boundaries that constrain them, then the states the rules produce, what makes those pages rank, and finally the taxonomy change that tests the whole set.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p26 | claim | A landing page should exist when people search for it, the marketplace has inventory for it and it differs from existing pages; each condition becomes a rule, and depth and quality rules complete the set. | table: Demand, supply, distinctness, depth and quality rules, each with its measure, an illustrative threshold (for example five results on most days; at most two or three dimensions beyond category and location) and the action when it fails. |  |\n| p27 | analysis | Thresholds are judgement calls per vertical, but indexability must be a computed state with explicit rules recalculated as inventory and demand change, not a side effect of a clickable filter. |  | `elaboration`: The rule table. → What matters about it more than the numbers. |\n| p28 | evidence | Google's faceted-navigation guidance sets the outer boundary, what the engine needs before it crawls and indexes facet URLs at all: block or fragment filter combinations that need not be indexed, and for those that must, use consistent canonical URL forms and return 404 for empty combinations. | source: Google Search Central, faceted navigation (updated 2025): robots.txt or URL fragments; standard & separators, consistent order, no duplicate filters; 404 for zero-result combinations. | `additional_support`: The rules as the marketplace's own choice. → The engine's documented outer limit. |\n| p29 | evidence | Google's spam policies set the inner boundary, which generated pages count as abuse even when technically sound: scaled content abuse and doorway abuse, and the supply rule is what keeps a city page with real local inventory on the right side of it. | quotation: Spam policies (updated 2026): scaled content abuse is when 'many pages are generated for the primary purpose of manipulating search rankings'; doorway abuse includes 'pages targeted at specific regions or cities that funnel users to one page'.; example: 'E-bikes in Utrecht' with real Utrecht listings versus 'e-bikes in Wijk bij Duurstede' with three Utrecht listings and generated text. | `contrast`: The outer boundary for facet URLs. → The inner boundary for generated pages. |\n| p30 | process | A landing page is a managed object whose states each map to a response, Indexable, Thin, Gone and Redirected, with hysteresis so seasonal swings do not flip pages in and out of the index. | figure: Figure 3: the landing page's states and transitions. | `cause_effect`: Rules that are recomputed as inventory changes. → The states a page moves between as a result. |\n| p31 | explanation | Landing pages rank partly through structural internal links and copy, and generated copy helps when it describes the actual inventory from data but becomes the scaled-content liability when it is filler. | source: Adevinta Tech Blog, 2023: internal links generated at scale from semantic similarity and search volume, keyword classification and related searches with newer AI models, AI-generated meta titles and descriptions. | `additional_support`: Which pages may be indexable. → What helps those pages rank. |\n| p32 | process | Every category change is a URL migration in which each old landing page maps to a successor, a parent or a gone status, recorded in the redirect registry, so a taxonomy service that emits a CategorySplit event makes it a pipeline while a taxonomy in templates makes it The Category Straitjacket. | scenario: Tradeyard's split of bikes into four subcategories: 301 to one successor, 301 to a broader parent, or 410.; reasoning: categories-and-taxonomies owns the change process; this chapter owns what it does to URLs. | `cause_effect`: Landing pages built from category and location identifiers. → What happens to them when the categories change. |\n\n### Localization and Multi-Country Domains\n\n**Controlling idea** (`recommendation`, id `localization`): Across country domains and languages, hreflang reciprocity is reliable only when every version's URL comes from the URL service keyed on shared identifiers, and the landing page registry is per country, sharing rules and code but not data.\n\n**Advances the thesis** (S3): Extends the URL service and registry across countries and languages.\n\n**Transition in:** `elaboration`: The URL service and the landing page registry, designed for one country domain. → The same services across country domains and languages.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p50 | recommendation | hreflang annotations are ignored unless every language version lists every other, which for bilingual pages such as Tradeyard Belgium's is reliable only when both URLs come from the URL service keyed on the same identifiers. | quotation: Google (updated 2026): 'if two pages don't both point to each other, the tags will be ignored'.; example: 'E-bikes in Brussels' in Dutch and in French on Tradeyard Belgium, one of four Tradeyard domains. |  |\n| p51 | recommendation | The landing page registry should be per country, sharing rules and code but not data, because names, location hierarchies and useful combinations differ by market. | reasoning: multi-country-platforms owns the tenancy model that makes this configuration rather than code. | `additional_support`: One URL service across languages. → Per-country registries. |\n\n### Listing Pages Across the Lifecycle\n\n**Controlling idea** (`process`, id `lifecycle`): Each listing state needs a defined response, page content and sitemap treatment, with grace periods for people rather than crawlers and removal latency measured; sitemaps and notifications are driven by listing events within Google's limits and per-engine push mechanisms.\n\n**Advances the thesis** (S3): Drives URL responses and sitemaps from the listing lifecycle.\n\n**Transition in:** `contrast`: Landing pages, the durable asset, in every country. → Listing pages, the short-lived one, and what each state returns.\n\n**Order of paragraphs** (`prerequisite_order`): What each state returns comes first, because sitemaps and notifications publish those changes; then sitemaps, their layout, and push channels beyond them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p33 | recommendation | The public page must answer for every publication state of the Common Ground lifecycle that a visitor can reach, and for the trust-and-safety enforcement overlay, and in the absence of documented operator practice the chapter infers a policy from Google's rules: 404 or 410 for removed pages, no soft 404s, unavailable_after for pages that should leave results by a date, and accurate lastmod. | table: Active, paused, sold or let with low and high residual demand, expired or withdrawn, blocked by trust and safety for policy or fraud, merged duplicates: response (for most sold goods 200 with noindex during a grace period, then 410), page content, sitemap treatment and rationale.; source: Google Search Central robots meta tag (updated 2026) and sitemaps (updated 2026). |  |\n| p34 | recommendation | The grace period after a sale is for people following shared links and alerts, not for crawlers, so the page can explain the sale and offer alternatives without staying indexable. |  | `elaboration`: The state table. → The first of two details that matter in practice: whom the grace period serves. |\n| p34a | recommendation | Removal latency, from ListingSold to the new status, sitemap exit and edge purge, should be measured like publication latency. |  | `additional_support`: The first detail: what a sold page shows during its grace period. → The second detail: how fast the change reaches every channel, as a measured latency. |\n| p35 | recommendation | Sitemaps should be built from the listing event stream, not a nightly scan, within Google's limits of 50,000 URLs or 50 MB per sitemap and its rule that lastmod is used only if consistently and verifiably accurate. | source: Google Search Central sitemaps (updated 2026) and sitemap index files (updated 2025): limits; priority and changefreq ignored.; figure: Figure 4: one ListingSold event purges the edge, drops the URL from its shard and schedules the gone status. | `sequence`: What each page returns after a state change. → How the search engine learns of the change. |\n| p36 | process | Sharding sitemaps by page type, country and creation date keeps changed shards small and lastmod meaningful, and per-sitemap reporting then shows indexing coverage by page type. |  | `elaboration`: Event-driven sitemaps. → A shard layout that makes them useful. |\n| p37 | evidence | Push notification beyond sitemaps varies by engine: IndexNow reaches participating engines but not Google, and Google's Indexing API is documented for job postings, whose expiry is a compliance rule for a jobs section like Tradeyard's. | source: IndexNow FAQ (n.d.): Bing, Naver, Seznam.cz, Yandex, Yep and Amazon; 'does not guarantee immediate indexing'.; quotation: Google job postings (updated 2026): Indexing API recommended over sitemaps; 'we don't allow expired job postings'. | `additional_support`: Sitemaps as the pull channel. → Push channels and their limits per engine. |\n\n### Structured Data: Saying What the Page Is\n\n**Controlling idea** (`recommendation`, id `structured-data`): Structured data serves rich results, machine-readable facts and a consistency check, but the types and features change, so it should be generated from the page's read model in one builder per page type and never carry data the page does not or must not show.\n\n**Advances the thesis** (S4): Makes structured data a builder owned with the page.\n\n**Transition in:** `additional_support`: What each page returns and how engines learn of changes. → What the page says about itself in machine-readable form.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p38 | definition | Structured data is machine-readable markup, usually JSON-LD with schema.org, with three uses for listing sites: rich results, consistent facts for other consumers and a check that page and data agree. |  |  |\n| p39 | evidence (list) | The available types and search features change, so the architecture should not depend on any one of them, as product snippets versus merchant listings, the retired vehicle listing feature, schema.org's still-new RealEstateListing and JobPosting's expiry rules show. | source: Google product structured data (updated 2025); Google documentation updates 2025 (vehicle listing markup added October 2023, 12 June 2025 phase-out notice, documentation removed 9 September 2025); schema.org RealEstateListing (n.d.); JobPosting.; reasoning: Whether a page with Tradeyard Safe Deal qualifies as a merchant listing is a question for the SEO team and counsel. | `cause_effect`: The uses of structured data. → Why it should not be tied to any one feature. |\n| p40 | recommendation | Structured data should be generated from the read model that renders the visible page, in one builder per page type, and must never contain data the page does not show or must not show, such as a private seller's home address. | reasoning: location-and-geo keeps the precise address of a private seller's home out of every public surface, including JSON-LD. | `conclusion_summary`: Features that change. → The design that survives the changes. |\n\n### Performance: Core Web Vitals as an Architecture Budget\n\n**Controlling idea** (`recommendation`, id `performance`): Core Web Vitals give measurable targets that listing pages miss in predictable ways, so performance budgets belong to page owners, ads get a budgeted share and images come from the media pipeline, and the same budget governs crawl capacity.\n\n**Advances the thesis** (S1, S4): Makes performance an owned budget that serves both clients.\n\n**Transition in:** `additional_support`: What the rendered page contains. → How fast it must render for users and crawlers.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p41 | definition | Core Web Vitals measure LCP, INP and CLS at the 75th percentile with published thresholds, and INP replaced First Input Delay in 2024. | source: web.dev (updated 2024): LCP ≤ 2.5 s, INP ≤ 200 ms, CLS ≤ 0.1, mobile and desktop separately. |  |\n| p42 | evidence | Listing pages are threatened by large images, third-party scripts, heavy filter state and late ad slots, and QuintoAndar is the best-documented marketplace case of fixing INP and linking it to conversions. | case: QuintoAndar (web.dev, 2025): mobile INP 1,006 ms → 216 ms during 2024; 'good' pages 42% → 78%; 36% year-over-year rise in scheduled visits linked 'strongly, but not solely'; yielding, removing pixels, dropping CSS-in-JS, alarms and canary rollbacks. | `sequence`: The targets. → What threatens them on listing pages and one documented fix. |\n| p43 | recommendation (list) | Three architectural consequences follow: performance budgets belong to page owners, advertising is a budgeted guest, and images come from the media pipeline at the right size. | reasoning: Header bidding delays ad decisions by design (advertising-platforms); responsive derivatives are a media-pipeline responsibility that shows up as LCP. | `cause_effect`: The threats and the QuintoAndar case. → What the architecture must do about them. |\n| p44 | synthesis | Performance and crawl capacity are the same budget seen from two sides, because a fast origin serves users faster and lets the crawler fetch more pages. | example: A landing page rendering in 400 ms at the origin versus one taking four seconds under load. | `conclusion_summary`: Performance budgets for users. → Their effect on the crawler. |\n\n### Apps: Backends-for-Frontends, Server-Driven UI and Deep Links\n\n**Controlling idea** (`recommendation`, id `apps`): Apps carry engaged users while the web carries acquisition, so each client family gets its own backend-for-frontend with domain rules kept below it, insertion forms are served from the attribute schema, and apps resolve the same canonical and retired URLs as the web.\n\n**Advances the thesis** (S5): Defines the backend-for-frontend and designs the app side of the customer-facing layer.\n\n**Transition in:** `contrast`: The web pages and their two clients. → The apps, the other client family.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p45 | context | Apps and the web do different jobs, 57% and 43% of Tradeyard's sessions in 2027, and the author reads the apps as carrying engaged users and the web as carrying acquisition, so the architecture must serve both without building everything twice. | statistic: Apps 57%, web 43% of Tradeyard sessions. |  |\n| p15 | definition | A backend-for-frontend is a server-side component owned by a client's team that shapes domain APIs for that client and absorbs differences in release cadence, which matters in classifieds because pages draw on many domains and apps cannot be updated on demand. | source: Sam Newman, 2015: the UI team should own its backend.; source: Vinted Engineering, 2019 (older evidence): mobile releases take about two weeks to reach users. | `elaboration`: Two client families to serve without building every capability twice. → The backend-for-frontend, already named as a stack layer, now with its owner, its purpose and the case for it. |\n| p46 | recommendation | Tradeyard's apps call Yardstick and about 40 services directly, so a mobile BFF owned by the app teams and a web BFF give each client one backend shaped for it, holding presentation and aggregation but not business rules. | reasoning: An entitlement rule in the BFF lives in two places, which is how Billing by Guesswork starts (products-and-entitlements). | `example`: The backend-for-frontend pattern. → Tradeyard's apps today and the two BFFs that replace direct calls. |\n| p47 | counterargument | Some duplication between BFFs is the accepted cost, because one general-purpose API grows into a lowest-common-denominator interface, so domain APIs are shared and stable while BFFs change fast and push domain rules down. |  | `contrast`: The BFF recommendation. → Its cost and why it is accepted. |\n| p48 | recommendation | Insertion forms should be rendered from the attribute schema served by the backend, a labeled inference, because a form compiled into the app makes every schema change, such as the bikes split, wait for app adoption. | example: A bike has frame size and gears, a car mileage and first registration, an apartment rooms and energy class (attribute-schemas). | `additional_support`: BFFs as the answer to slow app releases. → A second answer for forms. |\n| p49 | recommendation | Deep links through Android App Links and Apple universal links must resolve the same canonical and retired URLs as the web, so the redirect registry serves the apps too. | source: Android Developers (assetlinks.json) and Apple Developer (apple-app-site-association), n.d.; reasoning: An app that cannot resolve a URL redirected last month opens on an error screen. | `additional_support`: Forms that follow schema changes. → URLs that apps must follow too. |\n\n### AI Search and Answer Engines: A New Channel and a New Crawler\n\n**Controlling idea** (`analysis`, id `ai-search`): AI answer engines changed the results page without changing what a listing site must do: there is no special markup, opting out of AI training does not opt out of Search, clicks per crawl are falling, and fresh contactable inventory is an asset an answer cannot complete, so crawler access becomes explicit policy.\n\n**Advances the thesis** (S6): Shows the measure and the asset hold in the newest channel.\n\n**Transition in:** `time`: The established search channel that the web pages and apps were designed for. → The newest one, AI answer engines and their crawlers.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p52 | context | Between 2024 and 2026 the results page changed: Google introduced AI Overviews in May 2024 and counted AI Mode in Search Console from June 2025, and assistants answer shopping and housing questions with links. | source: Google Search Central documentation updates, 2024–2025. |  |\n| p53 | evidence (list) | Three points matter for a listing site: no special markup is needed for AI features, opting out with Google-Extended does not opt out of Search, and clicks per crawl are falling by a vendor's estimate. | quotation: Google AI features (updated 2025): 'there are no additional requirements to appear in AI Overviews or AI Mode, nor other special optimizations necessary'; Google-Extended applies to 'AI training and grounding in some of Google's other systems'.; source: Cloudflare, 1 July 2025: default blocking of AI crawlers; about ten times less traffic from Google for the same content than a decade earlier; vendor figures with a commercial interest. | `cause_effect`: The changed results page. → What it means for a listing site. |\n| p54 | analysis | Classifieds are less exposed than informational publishers because an answer engine cannot complete the job, so fresh, contactable inventory is the defensible asset, though classifieds evidence is thin. | example: Whoever wants the bike still has to contact Femke; whoever wants the apartment still has to book a viewing.; source: Adevinta, 2023: no drastic click loss after Bing's AI snippets, predating AI Overviews. | `contrast`: Falling clicks for publishers. → Why classifieds differ. |\n| p55 | recommendation | The architectural moves are to keep pages fast and crawlable, set crawler access per agent as policy, measure AI-assistant referrals as their own channel and leave licensed agent access to ai-in-listing-systems, at a scale shown by Tradeyard's 0.7% of web sessions from assistants against 11% of public HTML requests from AI crawlers. | statistic: Assistants refer about 0.7% of Tradeyard web sessions; self-declared AI crawlers make about 11% of public HTML requests. | `cause_effect`: Fresh, contactable inventory as the asset. → What the architecture does to protect it. |\n\n### Veldmark Worked Example: Rebuilding Tradeyard's SEO Inventory\n\n**Controlling idea** (`example`, id `worked`): Tradeyard rejects the client-rendered rebuild, adopts a five-part decision record, cuts its indexed URLs from 40 million to 15.9 million under the landing and lifecycle rules, raises contacts from organic sessions by 17%, and passes the bikes split as a pipeline.\n\n**Advances the thesis** (S2, S3, S4, S5, S6): Applies every rule to the scene and shows the measure changing.\n\n**Transition in:** `problem_solution`: The full design, section by section. → Its application to the scene's 40 million URLs, Femke's bike and the two pending changes.\n\n**Order of paragraphs** (`problem_solution`): The decision answers the scene's rebuild proposal; the landing set and gone-page pass apply it; the February 2028 results and the metric change show its effect on the scene's numbers; the bikes split, the scene's second pending change, closes the section as the first live test. Results come before the split because the metric change is what the trade-offs, the Chief Architect's view and the conclusion build on, and placing the split between the table and its reading would separate the numbers from their meaning.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p56 | example (list) | Ingrid rejects the client-rendered rebuild, and in May 2027 the forum adopts a five-part decision record for Tradeyard's web layer, scheduled ahead of the Yardstick search extraction because the strangler starts at the web layer. | scenario: Server-rendered page apps per URL pattern behind CloudFront; a web BFF and a mobile BFF; the four SEO services configured per country; lifecycle rules on the listing event contract v1 live 1 July 2027; mobile LCP p75 ≤ 2.5 s and INP p75 ≤ 200 ms budgets; Yardstick search extraction in Q4 2028. |  |\n| p57 | example | The landing page registry starts from 14 months of demand data and the supply and depth rules, which qualify about 2.4 million combinations as the indexable set (more than the 1.1 million URLs that drew organic visits, because demand is measured from searches rather than past visits) while the other 17.4 million indexed search URLs get noindex, a 404 or leave the sitemaps. | scenario: At least five live results on most days over eight weeks; at most two attributes beyond category and location; about 2.4 million combinations across four countries. | `elaboration`: Part 3 and part 4 of the decision. → How the landing set is built. |\n| p58 | example | The 6.3 million gone-listing pages move to 410 except about 180,000 still ranking, and under the new rules Femke's bike would have answered noindex from 18:11 on 8 March and 410 from 22 March; the before-and-after measures follow. | scenario: About 180,000 pages, mostly sold cars and cargo bikes, keep a 200 page with similar listings and unavailable_after.; table: February 2027 versus February 2028: indexed URLs 40.0M → 15.9M; gone pages indexed 6.3M → 0.4M; facet or dead crawl share 41% → 9%; first crawl 2.6 → 0.6 days; organic sessions 100 → 104; contacts from organic sessions 100 → 117; LCP 3.4 s → 2.2 s; INP 310 ms → 180 ms. | `sequence`: The landing set. → The gone-listing pages, and the results. |\n| p59 | analysis | Indexed URLs fell 60% while contacts from organic sessions rose 17% on 4% more sessions, so the forum removes indexed URLs from the board pack and makes organic contacts per thousand organic sessions the headline metric, the Vanity Liquidity correction applied to SEO. | figure: Figure 5: an overgrown hedge of 40.0M pages beside a pruned bush of 15.9M, contacts up 17%. | `cause_effect`: The before-and-after table. → What it means and the metric change it prompts. |\n| p60 | example | The bikes split on 1 November 2027 is the first test: the URL service derives a successor, a parent page or a gone status for each of about 18,400 old NL and BE bike landing URLs and about 1,100 are reviewed by hand, sessions dip about 8% for three weeks and recover by mid-December, where the old architecture needed template edits and a spreadsheet. | scenario: The taxonomy service emits the split with its mapping; 'bikes under €200 in Utrecht' redirects to the broader city page. | `time`: The first year's results. → The scene's second pending change, now run through the new architecture. |\n\n### Trade-offs\n\n**Controlling idea** (`comparison`, id `trade-offs`): Each of the chapter's choices has an alternative that is right under named conditions, and the gone-listing policy, the most argued, should be decided by evidence page group by page group.\n\n**Advances the thesis** (S2, S3, S4, S5): Shows when each recommendation does not hold.\n\n**Transition in:** `conclusion_summary`: The design and its application at Tradeyard. → The alternatives and when each is right.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p61 | comparison | The gone-listing policy draws most argument because a 200 sold page does capture traffic, but at Tradeyard sold pages drew 6% of organic sessions and 0.4% of organic contacts, so the evidence should decide page group by page group, with automotive and property able to justify a curated subset. | table: Eight choices with option A, option B and when to choose each: rendering, composition, landing breadth, gone pages, app backend, structured data, edge caching, AI crawlers.; statistic: 6% of organic sessions, 0.4% of organic contacts from sold and expired pages. |  |\n\n### Vertical Differences\n\n**Controlling idea** (`comparison`, id `verticals`): Landing dimensions, listing lifetimes, gone-listing rules, duplicates, structured data, location precision and performance pressure differ by vertical, and real estate needs a published, neutral rule for the canonical URL of a property listed by several agencies.\n\n**Advances the thesis** (S2, S3): Adapts the rules to each vertical.\n\n**Transition in:** `elaboration`: The general trade-offs. → How they differ by vertical.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p62 | comparison | Real estate needs one more rule: a property listed by several agencies gets one canonical URL chosen by a published, neutral rule, which at Hearthly picks the most complete listing with the best media, never paid status. | table: General classifieds, real estate, automotive and jobs compared on landing dimensions, lifetime, gone-listing rule, duplicates, structured data, location precision and performance pressure.; scenario: The Lyon apartment listed by three agencies in May 2027; Hearthly's rule is owned with the clustering rules in entity-resolution. |  |\n\n### Failure Modes\n\n**Controlling idea** (`analysis`, id `failure-modes`): The customer-facing layer fails in recognizable ways when gone pages answer 200, facets are unbounded, public pages move to client rendering, redirects live in templates, generation drifts into doorways, apps cannot follow and indexed URLs are reported as success.\n\n**Advances the thesis** (S1, S2, S3, S4, S5, S6): Shows the cost of ignoring each supporting claim.\n\n**Transition in:** `contrast`: What the right design looks like across verticals. → What goes wrong without it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p63 | analysis (list) | Without the design the layer fails in seven ways, from the soft-404 graveyard (Ghost Inventory in the search engine) to the vanity index count. |  |  |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `ca-view`): At group scale the SEO services, sitemap pipeline, redirect registry, structured-data builders and lifecycle rules are shared while pages and strategy stay with brands; three decisions are group policy; ownership is per URL pattern; migrations are SEO events; and the board watches organic contacts, not indexed URLs.\n\n**Advances the thesis** (S3, S4, S6): Turns the design into group decisions and governance.\n\n**Transition in:** `cause_effect`: The failure modes. → The group decisions that prevent them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p64 | recommendation | The SEO services, the event-driven sitemap pipeline, the redirect registry pattern, the structured-data builders and the lifecycle rules are group capabilities configured per brand and country, while pages, design and copy stay with Tradeyard, Motorvane and Hearthly under Common Ground's share-platforms-not-products principle. |  |  |\n| p65 | recommendation | Three decisions should be group policy in decision records, the rendering standard, the gone-listing rules per vertical and the per-agent crawler policy, and everything else belongs to each brand's SEO and product teams. |  | `sequence`: What is shared. → What is decided centrally. |\n| p66 | recommendation | Each URL pattern has one owning team, the SEO team owns rules, registry and measurement, the platform team owns the edge, URL service and sitemap pipeline, and the pipeline blocks a category change that ships without its redirect-registry update. |  | `sequence`: What is decided centrally. → Who owns what. |\n| p67 | recommendation | Brand migrations, consolidations and extractions change URLs at scale, so the Chief Architect requires a URL migration plan, a redirect registry and a traffic baseline before any of them starts, leaving the programs to platform-consolidation and modernization-and-migration in Part VIII. |  | `additional_support`: Ownership in steady state. → Large changes that cross owners. |\n| p68 | recommendation | The Chief Architect watches organic contacts per thousand organic sessions, crawl share on indexable URLs, time to first crawl, removal latency, Core Web Vitals and AI-assistant referrals, and keeps indexed URL count out of the board pack. |  | `conclusion_summary`: The decisions and owners. → The measures that show whether they work. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Ten questions let an architect test a marketplace's customer-facing layer against the chapter: ownership, indexability rules, lifecycle responses, sitemaps, crawl share, rendering, taxonomy redirects, performance budgets, app parity and AI crawler policy.\n\n**Advances the thesis** (S1, S2, S3, S4, S5, S6): Gives the reader a working audit drawn from every section.\n\n**Transition in:** `cause_effect`: The Chief Architect's decisions and measures. → Detailed questions that test whether they are in place.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p69 | recommendation (list) | Ten questions test whether a marketplace's URL ownership, indexability rules, lifecycle responses, sitemaps, crawl share, rendering, taxonomy redirects, performance budgets, app parity and AI crawler policy meet the chapter's design. |  |  |\n\n## Conclusion: From Pages to Data\n\n**Synthesis:** The two demanding clients, people on phones and the crawlers that send them, are served by one architecture: server-rendered pages owned by clear teams, URLs derived from domain identifiers, and lifecycle rules driven by the listing event stream; the decisive change at Tradeyard was a metric, not a framework.\n\n**So what:** With that architecture the client-rendered rebuild and the bikes split, the two changes Ingrid faced, become routine, and the board judges the layer by contacts from organic sessions, which is only as good as the definition of a contact behind it.\n\n**Callback:** Ingrid's question in the scene (what architecture makes such changes routine instead of risky) and Femke's sold bike collecting clicks in Google. The conclusion answers the question with the design and notes that Femke's bike would now leave the index the evening it sold.\n\n**Takeaway** (`course_of_action`): Replace indexed URLs with organic contacts per thousand organic sessions as the measure of the layer, and drive every URL's response from the listing lifecycle.\n\n**Hand-off** to [Data Platform for Marketplaces: Events, Lakehouse and Data Products](data-platform.html): `problem_solution`: The decisive change at Tradeyard was a metric, contacts from organic sessions, and defining such metrics the same way across brands is unsolved. → The data platform: the tracking plan, governed metrics with one definition of a contact, data products and purpose-bound sharing.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p70 | synthesis | Both clients are served by one architecture, server-rendered pages owned by clear teams, URLs derived from identifiers and lifecycle rules driven by events, which answers Ingrid's question: the rebuild and the bikes split become routine and Femke's bike would leave the index the evening it sold. | scenario: Ingrid's question; Femke's bike answering noindex from 18:11; the bikes split run as a pipeline. |  |\n| p71 | transition | The decisive change at Tradeyard was a metric, organic contacts instead of indexed URLs, and defining such metrics consistently across brands is the data platform's work, which data-platform takes up next. |  | `problem_solution`: The architecture that answers Ingrid's question. → The metric it depends on, which the next chapter defines. |\n\n## Non-goals\n\n- Search indexing, aliases and reindexing. See [Search Architecture for Listings: Indices, Freshness and Scale](search-architecture.html).\n- Ranking and paid blending. See [Ranking for Two Sides: Relevance, Freshness and Paid Visibility](ranking.html).\n- The listing event stream and outbox. See [Every Change Is an Event: Event-Driven Listing Architecture](event-driven-listings.html).\n- Taxonomy change process. See [Category Trees That Can Change: Designing Marketplace Taxonomies](categories-and-taxonomies.html).\n- Alert digests. See [Tell Me When It Appears: Saved Searches and Alerts](saved-searches-and-alerts.html).\n- Ad stack internals. See [Selling Attention: Display, Native and Retail-Media Advertising](advertising-platforms.html).\n- Bot management and capacity. See [Sunday Evening Peaks: Reliability, Performance and Cost](reliability-and-scale.html).\n- AI agents, licensing and agentic search. See [AI Across the Listing Lifecycle](ai-in-listing-systems.html).\n- URL migrations in brand consolidations. See [After the Deal: Consolidating Platforms After Acquisitions](platform-consolidation.html), [Changing the Engine in Flight: Modernizing a Live Marketplace](modernization-and-migration.html).\n- The governed definition of a contact and of an organic session. See [Data Platform for Marketplaces: Events, Lakehouse and Data Products](data-platform.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- No classifieds operator in the evidence documented its expired-listing SEO handling or organic traffic by page type; the lifecycle policy is a labeled inference. Replace or confirm when primary evidence appears.\n- Whether in-platform payment pages (Safe Deal) qualify as Google 'merchant listings' is left open deliberately.\n- AI-assistant referral share and crawler policy evolve quickly; revisit the AI section in 2027.\n\n## Decision log\n\n- **2026-10-19** — Centered the chapter on landing pages as generated, stateful inventory rather than on tag-level SEO, because the URL space is where architecture decides traffic.\n- **2026-10-19** — Recommended 410 after a grace period for most gone listings, with curated 200 pages only for proven demand. Rejected: Permanent 'sold' pages as a default, because they produce Ghost Inventory in the index.\n- **2026-10-19** — Presented page-level ownership with build-time shared components as the default, citing the Zalando and Subito record. Rejected: Runtime micro-frontends.\n- **2026-10-19** — Reported Google's 2025 retirement of vehicle listing rich results to argue for structured-data builders over template markup.\n- **2026-11-12** — Converted spec.md to spec.json. Success criteria rewritten: the inventory criteria (crawl stages, landing rules, lifecycle table, rendering comparison, BFF, AI features, worked-example numbers, three diagrams and tables) are replaced by the journal entry's outcome criteria AC-1 (an SEO estate and a proposed rebuild: which rules, what instead, which metric), AC-2 (the opening predicts the sections) and AC-3 (reverse outline); the diagram, table and source counts are dropped as inventories. No criteria added.\n- **2026-11-12** — Added a roadmap paragraph (p04) to the introduction so the opening predicts the sections (AC-2), and glossed 'contact' in p03 on first use with a pointer to messaging-and-leads, because the chapter judges the layer by contacts before data-platform governs the definition (journal-spec Part VII flow note).\n- **2026-11-12** — Widened the conclusion from one paragraph to two so that it calls back to Ingrid's question and Femke's bike before the hand-off to data-platform.\n- **2026-11-12** — Flow rubric (sound with notes): stated the depth and quality rules in p26's controlling idea and noindex during grace in p33's evidence (both already in the published tables), added dependency reasons for structured data, performance, localization and ans
