<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, acceptance criteria AC-1 to AC-3, the thesis and the role are copied unchanged from the professional-seller-tooling entry in journal-spec.json; the conclusion realises Part III's closing (synthesis, so-what, takeaway) from the same file, and the hand-off uses Part IV's transition_in. Units added by this conversion: the roadmap paragraph p04 and two conclusion paragraphs (p67, p68).\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The professional's jobs in the marketplace, the lead from the professional's side, and why professionals buy outcomes rather than exposure.\n- **Know:** The pro workspace over domain systems of record (inventory operations, performance and ROI, lead management, pricing insight, team permissions, the partner API) and the four neutrality controls: separate tenancy, API parity, data boundary and ranking blindness.\n- **Believe:** Statistics, lead exports and billing must come from one event stream, because professionals check them against their own CRM and sales.\n- **Believe:** Software a group sells to professionals is neutral only when the architecture enforces it and produces evidence.\n- **Be able to:** Reconcile a professional's portal lead count with their CRM and turn the gap into specific changes.\n- **Be able to:** Draw the neutrality boundary around a group-owned pro SaaS and decide which pro capabilities are shared engines and which are brand front ends.\n\n**Audience:** Architects and engineering leads who own dealer portals, agency workspaces, partner APIs or an acquired pro SaaS product, and group leaders who decide what to share and how to keep a SaaS business neutral.\n\n**Already knows:**\n\n- APIs, databases, event streams, search engines and Kubernetes (the book's baseline); BFFs and OAuth.\n- From earlier chapters: the listing aggregate and its events, seller accounts, organizations, branches and integration principals (sellers-and-accounts), feeds and feed errors (listing-ingestion), the publication pipeline and its removal path, and the vertical layer model (vertical-requirements).\n- Veldmark, its brands, cast and the Essen Golf and Lyon apartment, and the failure-pattern names.\n\n**Does not yet know:**\n\n- Pro tooling, lead management for pros and pro SaaS as this chapter defines them.\n- The lead ledger and performance read model as pro-tooling components, and the professional's lead lifecycle.\n- The P2B Regulation's Articles 7 and 9 and the four neutrality controls.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a lead-count dispute and a request for cross-portal data, the reader resolves both with the chapter's design. *Probe:* A dealer's portal shows 23 leads for a car while the dealer's CRM received 14, and the dealer threatens to downgrade. Separately, your group owns an agent CRM that publishes to competing portals, and your portal's CEO asks for its anonymized cross-portal performance data. Using only this chapter: what do you do in each case? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** What do professional sellers need from a marketplace, and how should that tooling be architected?\n\n> **Claim:** Professionals buy outcomes and judge them by reconciling the marketplace's numbers with their own CRM and sales, so pro statistics, lead exports and billing records must come from one event stream with shared identifiers; pro tooling is a workspace that composes inventory, leads, entitlements and accounts from their domain systems of record for one organization and exposes the same capabilities through a versioned partner API; and software the group sells to professionals, such as an agent CRM that publishes to competing portals, is kept neutral by four architectural controls (separate tenancy, API parity, a data boundary and ranking blindness), each producing audit evidence.\n\n**Disputed by:** The common practice of building the pro portal as its own product with a reporting database fed nightly from several lead systems, reporting views and raw contacts as value, treating the partner API as secondary to the portal's own tools, and keeping a group-owned SaaS neutral by policy statements and separate hosting rather than enforced controls.\n\n**So what:** A Chief Architect who accepts this shares the lead ledger, the performance read model, the pro API gateway and the developer portal as engines while brands keep their pro front ends, runs the pro API as a governed product, and watches the gap between portal-reported and CRM-received leads for a sample of professionals (a gap above a few percent is a defect), lead export coverage by channel and every access request that crosses the neutrality boundary.\n\n**How and why:** Dealer Hub reported 23 leads for the Essen Golf, counting some buyers twice; the dealer's CRM received 14 because calls and bookings were never exported; the deduplicated count was 19 unique buyers, and a VIN match tied the sale to one of them, which withdrew the downgrade. Keybridge publishes for 9,800 agencies to Hearthly and its competitors, so any Keybridge data in Hearthly's ranking or sales targeting, even an anonymized benchmark, breaks the March 2027 decision and the trust of every agency that multi-lists; the EU Platform-to-Business Regulation already requires portals to describe their data access and any differentiated treatment of their own services.\n\n**Supporting claims**\n\n- **S1** — Professionals judge the marketplace by reconciling its numbers with their own CRM and sales, so pro statistics, lead exports and billing records must come from one event stream with shared identifiers, counting deduplicated leads beside raw contacts and labeling estimates.\n- **S2** — Pro tooling is a workspace that composes inventory, leads, entitlements, insight and accounts from their domain systems of record for one organization and owns no business record of its own.\n- **S3** — Every pro capability is also offered through a versioned partner API run as a product, because many professionals work through partner software; the group shares the engines behind it while brands keep their front ends.\n- **S4** — Software the group sells to professionals is neutral only when four architectural controls (separate tenancy, API parity, a data boundary and ranking blindness) enforce it and produce evidence an independent reviewer can test.\n\n## Role in the part\n\nEnds the chain where professionals check its output against their own systems, and performs the part's closing: supply is complete and hands discovery a fresh, deduplicated, removable stock. Supports P3-5 of part `part-3`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in concepts, architecture, neutrality: each uses the terms the previous one established; `assertion_evidence_reasoning` in worked-example: the design applied to the scene's two arguments)\n\nThe scene states two arguments; the concepts define what professionals need; the architecture answers those needs with a workspace and one event stream; neutrality by design names the conflict of owned pro software and answers it; the worked example settles both arguments with that design. Trade-offs, vertical differences, failure modes, the Chief Architect's view and questions are judgements on a design the reader has seen. Putting the architecture before the concepts would design for needs not yet stated; putting neutrality before the architecture would demand API parity before the API is described; putting the worked example earlier would resolve the arguments with mechanisms not yet explained.\n\n## Introduction\n\n**Hook** (`intriguing_example`): A private seller visits a marketplace a few times a year. A dealer or an estate agent lives in it: sales staff open the lead inbox before their e-mail, managers read the weekly statistics before the board meeting, and the integration partner pushes inventory every few minutes.\n\n**Bridge:** The reader's own dealer portal or agency workspace, built as a reporting product next to the listings. → For professionals the marketplace is one of the systems their business runs on and is judged by whether its numbers reconcile, so the question is what they need and how to build it.\n\n**Thesis statement** (KEY POINTS callout (three bullets); p01 states the reconciliation test.): Professionals buy outcomes and check them with their own systems, so statistics, lead exports and invoices come from the same events; pro tooling is a workspace over domain systems of record exposed through APIs; and software sold to professionals must be neutral by architecture.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p04.):\n\n- Two arguments that reached Veldmark in one week. *Kept in:* scene.\n- What professionals need: their jobs, outcomes over exposure and the lead from their side. *Kept in:* concepts.\n- The workspace over systems of record and its capabilities. *Kept in:* architecture.\n- Neutrality by design: the conflict pro SaaS brings, what the law asks and four controls. *Kept in:* neutrality.\n- The worked example that settles both arguments. *Kept in:* worked-example.\n- Build, integrate or own; vertical differences; failure modes; the Chief Architect's view; review questions. *Kept in:* trade-offs, verticals, failure-modes, ca-view, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A dealer or an estate agent lives in the marketplace, which is one of the systems its business runs on, and judges it the way it judges its other systems: by whether its numbers reconcile. | example: Sales staff open the lead inbox before their e-mail, managers read the weekly statistics before the board meeting, and the integration partner pushes inventory every few minutes; a private seller visits a few times a year. |  |\n| p02 | context | The publication pipeline treated every seller the same way, but professionals supply most of a vertical marketplace's stock, and pro tooling is where they see what that stock produced, measured in qualified buyers and sales rather than in slots. | example: A Motorvane dealer pays for slots and prominence but wants to know how many qualified buyers each car produced and how many bought; a Hearthly agency wants to know whether the portal brought it sellers and tenants. | `contrast`: The earlier Part III chapters, which brought listings in and published them for every seller alike. → Professionals, who supply most of the stock and check what it produced. |\n| p03 | definition | The chapter owns three terms, pro tooling, lead management for pros and pro SaaS, and leaves the lead itself, packages, the organization model and feeds to the chapters that own them. |  | `sequence`: Pro tooling as the place professionals check the marketplace. → The chapter's three terms and its boundaries. |\n| p04 | transition | The chapter answers two Veldmark arguments in a stated order: the scene, what professionals need, the workspace architecture, neutrality by design, the worked example, then building, integrating or owning, vertical differences, failure modes, the Chief Architect's view and review questions, with evidence from public company sources, EU law and the fictional Veldmark. |  | `sequence`: The terms the chapter owns. → The order in which the chapter uses them and the kinds of evidence it relies on. |\n\n## Sections\n\n### Setting the Scene at Veldmark: Two Arguments in One Week\n\n**Controlling idea** (`context`, id `scene`): Two arguments in one week, a dealer's lead count against its CRM and a request to see a group-owned CRM's cross-portal data, pose the chapter's two questions at Veldmark.\n\n**Advances the thesis** (S1, S4): Sets the reconciliation dispute and the neutrality request that the design must answer.\n\n**Transition in:** `example`: The professional who judges the marketplace by reconciling its numbers, and the roadmap's two arguments. → The two Veldmark arguments themselves.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | context | In the second week of June 2027 two arguments about professional tooling reach Ingrid Halvorsen, Veldmark's Group Chief Architect, in the same week. |  |  |\n| p06 | example | Autohaus Ruhrblick's sales director finds 23 Golf leads in Dealer Hub against 14 in the dealer's CRM and proposes a downgrade, while Felix Brandt, Motorvane's CTO, wants funding to rebuild Dealer Hub. | scenario: Pro 150 package at €1,450 a month with 150 slots; 23 leads in Dealer Hub in the first ten days against 14 in the dealer's CRM; Dealer Hub runs on a reporting database fed nightly from three lead systems. | `sequence`: Two arguments in one week. → The first, from Essen. |\n| p07 | example | Emma Laurent of Keybridge, the group's agent CRM that publishes for 9,800 agencies to Hearthly and its competitors, wants a portal performance report, and Claire Fontaine, Hearthly's CEO, asks to see the aggregated comparison. | scenario: Keybridge acquired in 2024; 9,800 agency customers; Agence Rhône Habitat, a 14-branch network; Emma Laurent's report; Claire Fontaine's question. | `sequence`: The first argument, from Essen. → The second, from Lyon. |\n| p08 | claim | The March 2027 Keybridge decision states the principle but not the mechanism, so Ingrid must answer both arguments with one design. | scenario: March 2027 decision: no Keybridge agency data is used by Hearthly for ranking or sales targeting, with access controls and an annual independent review. | `cause_effect`: Claire's request for the comparison. → What the existing decision does and does not settle. |\n\n### Concepts: What Professionals Need\n\n**Controlling idea** (`definition`, id `concepts`): Professionals need outcomes they can verify and a lead that continues into their own systems.\n\n**Advances the thesis** (S1, S2): Defines the jobs, the outcome test and the professional's lead that the architecture answers.\n\n**Transition in:** `sequence`: Ingrid's task: what professionals need, how to build the tooling, how to keep owned software neutral. → The first of those questions, what professionals need.\n\n**Order of paragraphs** (`large_to_small`): From the professional's jobs, to the job that decides renewal (proving value), to the lead that carries it; each step narrows to what the next relies on. The software that records the lead's later states, and the conflict it brings, is left to the neutrality section, where the law and the controls answer it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | definition | The professional has three jobs, operating inventory, converting demand and proving value, plus a fourth in real estate, winning mandates before there is anything to list. | source: The productscape reference model's professional-merchant persona, its fears 'paying for exposure without measurable return' and a feed sync that 'has silently dropped half their stock', and the real-estate model's mandate job. |  |\n| p10 | evidence | Table 1 maps eight professional jobs to the capabilities that serve them and to documented products. | table: Table 1: mobile.de Seller API; Autotrader Co-Driver (28 to 5 minutes, 86% of retailers, May 2026); Rightmove RTDF v1.4.1 (Nov 2023); mobile.de Lead Manager (45% of replies, Jul 2026) and Preis-Planer; AVIV Ultimmo (2022); Rightmove performance calls and CarGurus ROI tracking (10-K, Feb 2026); mobile.de multi-locations. | `elaboration`: The professional's jobs. → The capabilities and public products for each. |\n| p11 | analysis (table) | Every row of Table 1 has a public example and reads from more than one domain. |  | `elaboration`: Table 1. → What its rows have in common. |\n| p12 | claim | Pro tooling is a composition problem, because no capability lives in one service. | example: A statistics page reads listings, events, leads and entitlements; a lead inbox reads conversations, call records, accounts and the listing. | `cause_effect`: Rows that read from several domains. → The conclusion that pro tooling composes services. |\n| p13 | evidence (list) | The professional's real question is causal, and public evidence shows how hard it is to answer: self-selection distorts package dashboards, while incumbents report outcomes rather than views. | statistic: OLX (Aug 2026): naive metrics made premium ads look worse; after propensity-score matching the most expensive package was associated with 97.4% more conversions, with matched estimates above experimental ones.; quotation: Rightmove FY2025: '7 out of 10 vendor instructions ... 8 out of 10 tenants'; Autotrader FY2026: Deal Builder reservations are 'the very best enquiries'. | `elaboration`: The 'prove value' job among the professional's jobs. → The causal question behind it and why it is hard. |\n| p14 | recommendation | The architecture therefore needs a performance funnel per listing, branch and organization with outcomes as the headline and views only as diagnostics. |  | `cause_effect`: Outcome evidence and the difficulty of attribution. → The funnel the architecture must provide, and Vanity Liquidity as its failure. |\n| p15 | definition | From the professional's side a lead has a lifecycle, from assignment to won or lost, most of which happens in the professional's CRM and returns to the marketplace only through an integration. | figure: Figure 1: the marketplace records Received, Merged, Assigned and Responded; later states happen in the CRM. | `elaboration`: Deduplicated leads and outcomes in the funnel. → The lead as the professional sees it. |\n| p16 | analysis | Response time, which the marketplace sees, and outcome, which the professional sees, are the two measurements in the lifecycle that matter most. | source: mobile.de's 2026 lead-performance report tracks response time, response rate and processing status. | `elaboration`: Figure 1's lifecycle. → Its two most important measurements. |\n\n### Architecture: A Workspace Over Systems of Record\n\n**Controlling idea** (`description`, id `architecture`): Pro tooling is a workspace that composes domain systems of record for one organization, computes statistics from the billing event stream, and offers every capability through the partners' API.\n\n**Advances the thesis** (S1, S2, S3): Specifies the workspace, one event stream for statistics, leads and billing, and the partner API.\n\n**Transition in:** `sequence`: What professionals need, ending with the lead's two measurements, response time and outcome. → The second of Ingrid's questions: how to build tooling that serves those needs.\n\n**Order of paragraphs** (`large_to_small`): The whole architecture and its pieces first, then each capability in the order of the professional's jobs (inventory, performance, leads, pricing, team), ending with the partner API, which exposes all of them. Putting the API first would describe an interface to capabilities not yet introduced.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p19 | claim | The recommended workspace has three properties: it owns no business records, offers every capability through the API partners use, and computes statistics from the same event stream as billing. | figure: Figure 2: the portal UI, the app and partner software reach the same capabilities through one gateway; statistics, the lead ledger and billing consume one event stream. |  |\n| p20 | description (list) | Each of the five pieces, the pro API gateway, the workspace backend, the lead ledger, the performance read model and insights, sits where it does for a stated reason. | source: Organization-scoped tokens; the productscape partner surface with 'certification and SLA controls'; a BFF that caches but does not own; the lead ledger proposed in monetization-models; a rebuildable read model; vertical price ratings and Valuo. | `elaboration`: Figure 2. → The pieces and why each sits where it does. |\n| p21 | claim | Because most professional inventory arrives by feed, the most valuable inventory tool mirrors the ingestion pipeline in terms a sales manager can read. | example: The productscape partner persona fears 'opaque moderation or validation failures'; mobile.de returns errors as stable keys; Autotrader documents a DVLA write-off rejection. | `sequence`: The architecture's pieces. → The first capability, inventory operations. |\n| p22 | recommendation | Bulk operations are batches of commands against the listing service with a job record the professional can inspect, not direct writes by the workspace. | example: A bulk price change of 200 cars. | `similarity`: The rule that the workspace shows what the pipeline did. → The same rule applied to bulk changes. |\n| p23 | claim | The professional, the sales team and billing see the same numbers only if statistics, leads and delivery records are derived from the same events with the same identifiers. | reasoning: Delivery records required by products-and-entitlements; a 'Top listing' bought on Monday showing the impressions it produced.; figure: Figure 3: one event stream feeds the dashboard, the sales team and billing; nightly copies disagree. | `sequence`: Inventory operations. → The second capability, performance and ROI. |\n| p24 | recommendation (list) | Three design rules follow: count leads after deduplication beside the raw contacts, separate observed facts from estimates, and do not compare packages naively. | case: The OLX self-selection case. | `cause_effect`: One event stream with shared identifiers. → The rules for what it reports. |\n| p25 | recommendation (list) | The same lead object serves professionals who work leads in the portal's inbox and those who work them in their own CRM, with an outcome channel back. | statistic: mobile.de's call-assistant pilot: 91% of answered calls outside opening hours, one in three a qualified lead (Jul 2026); its Lead API; Autotrader's Messages, Calls and Deals APIs.; reasoning: The VIN lets a DMS sale be matched to the listing and its leads. | `sequence`: Performance and ROI. → The third capability, lead management. |\n| p26 | explanation | Exported leads are personal data, so the marketplace must record which leads went to which integration under which terms, all the more as leads carry model outputs. | source: Autotrader's 'Buying Signals' intent model built on 'verified but anonymised sales transactions and consumer interactions'. | `cause_effect`: Leads exported to the professional's CRM. → The obligations that export creates. |\n| p27 | evidence | Price tools turn the marketplace's market data into pricing advice for each professional. | fact: CarGurus Next Best Deal Rating and PriceVantage (10-K, Feb 2026); Autotrader's 'price adjusted days to sell'; mobile.de's Preis-Planer. | `sequence`: Lead management. → The fourth capability, pricing and market insight. |\n| p28 | analysis | The author infers that price tools create a feedback loop and show each professional insight computed from everyone's data, so the insight service must know each output's population and access rule. |  | `cause_effect`: Published pricing tools. → Their two architectural consequences, labeled as inference. |\n| p29 | recommendation | Pro tooling enforces three rules on the account hierarchy: listings and leads belong to the organization, permissions are scoped to branch and capability, and integrations are principals with tokens that follow OAuth security practice. | example: The Lyon branch of Agence Rhône Habitat cannot reprice the Villeurbanne branch's listings.; source: RFC 9700 (Jan 2025): authorization code with PKCE, no password grant, sender-constrained or rotated refresh tokens. | `sequence`: Pricing insight. → The fifth capability, team, branches and permissions. |\n| p30 | evidence | For many professionals the marketplace's own UI is secondary, as the scale of leading portals' partner integrations shows. | statistic: Autotrader: over 220 technology partners, 155 million calls a month, up from 91 million; 30-day notice of breaking changes (May 2026); Rightmove network and branch identifiers and client certificates. | `elaboration`: Integrations as principals. → How much professionals work through them. |\n| p31 | recommendation | The pro API is a product whose customers are software vendors, and because dealers multi-home its quality helps decide which portal's workflow a professional chooses. | quotation: Bundeskartellamt, October 2026 (mobile.de/Carwow): dealers multi-home and 'many platforms offer dealers data export to other platforms'. | `cause_effect`: Partner integrations at scale. → The author's judgement that the API is a product. |\n\n### Neutrality by Design: When the Group Sells the CRM\n\n**Controlling idea** (`recommendation`, id `neutrality`): Owning software sold to professionals brings a conflict with the portal, and a group keeps that software neutral by four architectural controls that answer the questions EU law already asks, each producing evidence.\n\n**Advances the thesis** (S4): Names the conflict pro SaaS brings, grounds neutrality in P2B Articles 7 and 9, and specifies the four controls and their costs.\n\n**Transition in:** `sequence`: Ingrid's three questions, after the workspace and the public partner API that answer the second. → The third question: groups that also sell the software professionals use, and the conflict that brings.\n\n**Order of paragraphs** (`problem_solution`): The conflict owned software brings first, then the law's questions about it, then the controls that answer them and their cost; the controls cannot be judged before the conflict and the questions are known. The conflict opens this section rather than closing the concepts, so it is answered where it is raised; flow readers in all three draft-check rounds asked for this.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p17 | evidence | Many marketplace groups also sell software to professionals, including the CRM in which the lead's later states are recorded. | fact: Scout24 Transaction Enablement €106.6 million in 2025 (Feb 2026); Zillow's Follow Up Boss (10-K, Feb 2026); Cox Automotive's Autotrader.com with vAuto, Dealertrack and VinSolutions; Cars.com websites for about 7,700 dealers (10-K, Feb 2026). |  |\n| p18 | claim | Owning pro software brings an advantage at the origin of listings and a conflict, because the CRM knows what the professional publishes to every competitor. |  | `cause_effect`: Groups that sell software to professionals. → What that ownership brings, the advantage and the conflict. |\n| p32 | evidence | The EU Platform-to-Business Regulation's Articles 7 and 9 already require portals to describe any differentiated treatment of their own services and their access to data, and its repeal is so far only a proposal. | quotation: Art. 7: 'any differentiated treatment which they give, or might give' to the provider's own or controlled business users, including 'technical interfaces'; Art. 9: access to data 'including in aggregated form'; Commission repeal proposal of November 2025, still a proposal as of October 2026. | `cause_effect`: The conflict owned pro software brings: the CRM knows what professionals publish to every competitor. → The EU law that already names that conflict. |\n| p33 | claim | Whatever happens to the regulation, a neutral design must answer its three questions with evidence, not with policy. |  | `contrast`: A regulation that may be repealed. → Questions that remain whatever happens to it. |\n| p34 | claim | Neutrality is enforceable when it rests on four architectural controls, each producing evidence. | table: Table 2: separate tenancy, API parity, data boundary and ranking blindness, with what each means and the evidence it produces. | `problem_solution`: Three questions that need evidence. → The four controls that produce it. |\n| p35 | analysis (table) | The four controls turn a neutrality promise into architecture an independent reviewer can test. |  | `elaboration`: Table 2. → What its controls achieve together. |\n| p36 | analysis | The controls cost slower integration and duplicate infrastructure, which is the price of selling software to customers who also buy from the portal's competitors. |  | `contrast`: Controls that make neutrality checkable. → What they cost. |\n\n### Veldmark Worked Example: The Golf's 23 Leads and Keybridge's Report\n\n**Controlling idea** (`example`, id `worked-example`): The design settles both arguments: one lead ledger reconciles the Golf's counts and withdraws the downgrade, and the neutrality boundary refuses Hearthly the Keybridge comparison with evidence.\n\n**Advances the thesis** (S1, S4): Applies the one-stream design and the four controls to the scene's two arguments.\n\n**Transition in:** `example`: The design: one event stream, the lead ledger and the four controls. → Its application to the two arguments from the scene.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The two arguments in the order the scene raised them, each from evidence (the reconstructed counts, the boundary) to the changes and the answer. The Golf comes first because its lead ledger is also what Keybridge's public APIs expose.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p37 | example | Felix's team reconstructs the Golf's ten days from the three lead systems, channel by channel. | table: Table 3: e-mail 14/14/14; calls 7/4/0; test-drive bookings 2/1/0; total 23 raw, 19 deduplicated, 14 in the CRM. |  |\n| p38 | analysis (table) | Neither Dealer Hub's raw count nor the CRM's e-mail count was the number the dealer needed. |  | `elaboration`: Table 3. → What its three counts show. |\n| p39 | analysis | Both sides were wrong in opposite directions: the honest number was 19 unique buyers, and a VIN match ties the sale to one of them. | scenario: The 29 April sale recorded in the DMS and exported next morning; the buyer's e-mail matches one of the 19.; figure: Figure 4: 23 and 14 feed one ledger of 19 unique buyers, one matched to the sale. | `cause_effect`: The counts in Table 3. → Who was wrong and what the right number was. |\n| p40 | recommendation (list) | Felix's rebuild becomes four specific changes rather than a new portal. | scenario: Lead view on the lead ledger; Lead API and webhooks for all channels; opt-in sale matching by VIN; statistics from the event stream. | `cause_effect`: The diagnosis of the gap. → The changes it calls for. |\n| p41 | example | With numbers that agree, the renewal conversation changes and the downgrade is withdrawn. | scenario: Over the quarter the 150 slots produced 1,610 deduplicated leads and, among dealers who opt in, about one confirmed sale for every twelve leads (labeled illustrative). | `cause_effect`: The four changes. → Their effect on the renewal. |\n| p42 | claim | Emma's report is legitimate; the question is what data it uses and who sees the result, which the boundary in Figure 5 answers. | figure: Figure 5: Keybridge publishes through the public API, receives leads and statistics through public APIs, and computes the report inside Keybridge per agency. | `sequence`: The first argument settled. → The second, Keybridge's report. |\n| p43 | claim | The answer to Claire is no, because the comparison is computed from data agencies entrusted to Keybridge, and even an anonymized benchmark would break the March decision. |  | `problem_solution`: Claire's question and the boundary. → The answer and why the alternative is rejected. |\n| p44 | recommendation (list) | Three implementation details make the boundary auditable: Keybridge is treated as one of about 160 vendors with monthly contract tests, origin tags are barred from ranking and sales tools, and a standard evidence pack goes to the annual review. | scenario: About 160 software vendors; contract tests run monthly with Keybridge's and a test vendor's credentials; evidence pack owned by Lucía Ortega. | `elaboration`: The refusal. → How it is made checkable. |\n| p45 | analysis | The separate clouds help but are not the control, so the controls are written as policies and tests that would survive a move to one cloud. | scenario: Keybridge on Azure, Hearthly on Google Cloud; a possible later move of both to AWS. | `contrast`: Controls implemented as tests and evidence. → The hosting separation that only looks like a control. |\n\n### Trade-offs: Build, Integrate or Own\n\n**Controlling idea** (`comparison`, id `trade-offs`): Per capability, a group builds what only the portal knows, exposes everything through the API, and owns pro SaaS only if it can run it as a neutral, separable business.\n\n**Advances the thesis** (S3, S4): Weighs building, integrating and owning, and argues for the API and for neutral, separable SaaS.\n\n**Transition in:** `elaboration`: One owned SaaS product kept neutral at Veldmark. → The general choice, per capability, between building, integrating and owning.\n\n**Order of paragraphs** (`comparison`): The options side by side, then the rule drawn from them, then the consequence of owning for a group's structure. Stating the rule before the table would ask the reader to accept it before seeing the options it weighs.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p46 | comparison | A group decides, per capability, whether to build pro tools in the portal, integrate through APIs or own a pro SaaS product. | table: Table 4: the three options with meaning, strengths, weaknesses and when each is right. |  |\n| p47 | analysis (table) | Most groups need building for portal-specific capabilities and integration for the rest, while owning SaaS is a separate business with its own rules. |  | `elaboration`: Table 4. → What its rows add up to. |\n| p48 | recommendation | The author's rule is to build what only the portal knows, expose everything through the API and own SaaS only as if a competitor owned the portal, and the API is the option most often under-funded. |  | `cause_effect`: The comparison of the three options. → The rule the author draws from it. |\n| p49 | analysis | Owning SaaS built with separate tenancy also keeps it separable when a group sells or keeps its businesses. | case: platform-consolidation and Adevinta's 2024-2026 decentralization (case-adevinta). | `additional_support`: Owning SaaS as a separate business. → Its effect on a group exit. |\n\n### Vertical Differences\n\n**Controlling idea** (`comparison`, id `verticals`): The professional and the system they already run decide what the portal must provide, so pro tooling differs by vertical more than most capabilities.\n\n**Advances the thesis** (S2, S3): Shows which workspace capabilities and integrations each vertical needs most.\n\n**Transition in:** `elaboration`: The choice to build, integrate or own. → How the answer differs by vertical.\n\n**Order of paragraphs** (`large_to_small`): The comparison across five verticals first, then the two verticals where pro tooling changes character; reversed, the two special cases would read as the general rule.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p50 | comparison | Pro tooling varies more across verticals than almost any other capability, because professionals' businesses differ. | table: Table 5: automotive, real estate, general classifieds, jobs and recommerce by professional, existing system, needs and tension, including Autotrader's Deal Builder pause and Vinted Pro. |  |\n| p51 | analysis (table) | The professional and their existing system decide what the portal must provide, and in automotive and real estate the integration surface matters as much as the portal's own tools. |  | `elaboration`: Table 5. → What it shows. |\n| p52 | example | In real estate and recommerce pro tooling does more than save time: it helps agencies win supply and draws a compliance boundary around traders. | quotation: Rightmove's Opportunity Manager predicts 'potential vendors from their usage of the Rightmove platform' (FY2025); Vinted: 'businesses have legal obligations that private sellers don't' (Sep 2026). | `example`: Verticals in which the professional's system dominates. → Two verticals where pro tooling changes purpose. |\n\n### Failure Modes\n\n**Controlling idea** (`counterargument`, id `failure-modes`): Pro tooling fails when it becomes a second system of record, flatters, stops leads at its edge, gates features ad hoc, neglects its API, relies on promised neutrality or imposes platform states.\n\n**Advances the thesis** (S1, S2, S3, S4): Each failure mode is the absence of one element of the design.\n\n**Transition in:** `contrast`: What the design should be, per vertical. → How it goes wrong in practice.\n\n**Order of paragraphs** (`grouping`): Failures grouped by the claim they violate: records and numbers first (S1, S2), then the API (S3), neutrality (S4) and professionals' consent, which Table 5's automotive tension (platform-controlled states) set up. Placed before the design sections, each failure would criticise a design the reader has not seen.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p53 | cause_effect | The second system of record grows when the pro portal fills its own tables nightly, and its numbers soon disagree with billing, the listing service and the professional's CRM. | example: Dealer Hub's nightly reporting database. |  |\n| p54 | cause_effect | Statistics that flatter report raw contacts as leads and views as the headline until the professional's CRM disagrees. | example: Vanity Liquidity, sold to the customer who pays. | `additional_support`: The previous failure mode. → Another way pro tooling fails. |\n| p55 | cause_effect | Leads that stop at the portal's edge make the professional undercount the portal's value and downgrade. | example: Autohaus Ruhrblick's near-downgrade. | `additional_support`: The previous failure mode. → Another way pro tooling fails. |\n| p56 | cause_effect | Feature gating by package-name checks in the workspace code breaks features on a package redesign and hides what each customer received. | example: 'Premium statistics' and 'AI replies' switched on by scattered checks. | `additional_support`: The previous failure mode. → Another way pro tooling fails. |\n| p57 | cause_effect | An API treated as a side project passes its pain to partners and then to professionals, who blame the portal. | example: The productscape partner persona's fear of 'breaking changes disrupting merchant inventory'. | `additional_support`: The previous failure mode. → Another way pro tooling fails. |\n| p58 | cause_effect | Neutrality by promise erodes through small exceptions that together end it and, in the EU, amount to differentiated treatment that should have been described. | example: An early-access endpoint, a one-off read access, a correlated ranking feature. | `additional_support`: The previous failure mode. → Another way pro tooling fails. |\n| p59 | cause_effect | Rolling out platform-controlled states without consent changes how professionals run their business, so per-organization configuration and reversibility belong in the design. | example: Autotrader's pause of Deal Builder's auto-rollout and 'request a reservation' (FY2026 results). | `additional_support`: The previous failure mode. → Another way pro tooling fails. |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `ca-view`): At group level the Chief Architect decides which pro capabilities are shared engines, runs the pro API as a governed product, sets the neutrality regime, and watches reconciliation gaps, export coverage and boundary crossings.\n\n**Advances the thesis** (S1, S3, S4): Turns the design into group decisions, owners and measures.\n\n**Transition in:** `cause_effect`: Failure modes that brand teams cannot prevent alone. → The group-level decisions and measures that prevent them.\n\n**Order of paragraphs** (`grouping`): What to decide, who decides, what to watch, then the change that raises the stakes; the measures make sense only after the decisions they monitor.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p60 | claim | At group level pro tooling raises three decisions that brand teams cannot make alone. |  |  |\n| p61 | recommendation (list) | The three decisions are which pro capabilities are shared engines and which are brand front ends, the pro API as a governed product, and the neutrality regime for any owned pro SaaS. | reasoning: In vertical-requirements' layers, the lead ledger, performance read model, pro API gateway and developer portal are layer-2 engines; Dealer Hub and Hearthly's agency workspace are layer-4 products. | `elaboration`: Three decisions. → What each one is. |\n| p62 | recommendation | Brand teams decide their workspaces, the group platform owns the engines and the API product, the architecture advice forum rules on bypasses and boundary crossings, and group legal with the data-protection officer own the P2B descriptions. |  | `sequence`: What to decide. → Who decides it. |\n| p63 | recommendation (list) | Five measures show whether pro tooling works, from reconciliation gaps, where a gap above a few percent is a defect, to neutrality incidents. |  | `sequence`: Who decides. → What to watch. |\n| p64 | analysis | As AI agents acting for professionals begin to call the pro API, scoped authorization, explainable outputs and audit trails matter more. | fact: As of 2026 Autotrader and OLX have shipped apps inside ChatGPT, Rightmove has submitted one, and mobile.de's call assistant answers buyers for dealers. | `time`: Today's decisions and measures. → How agents change the stakes from 2025-2026 on. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Ten questions take the chapter's design into a review of one's own pro tooling.\n\n**Advances the thesis** (S1, S2, S3, S4): Each question tests one claim against the reader's own systems.\n\n**Transition in:** `sequence`: The Chief Architect's decisions and measures. → Questions that apply them in a review.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p65 | recommendation (list) | Ten questions, from whether lead counts match the professional's CRM by channel to whether professionals can switch off platform-controlled states, take the design into a review. |  |  |\n\n## Conclusion: From Supply to Discovery\n\n**Synthesis:** The supply chain is complete: listings come in through forms and feeds under contracts, are normalized and enriched with provenance, are recognized when they describe the same thing, are published and removed within a freshness target, and are checked by the professionals who supply most of the value, whose renewal depends on the chain's numbers agreeing with their own.\n\n**So what:** Discovery can treat its indices and alerts as read models of a supply stream that is contracted, deduplicated and removable with evidence; where a link is missing, Part IV inherits the ghost, the duplicate or the disputed count.\n\n**Callback:** The chapter's hook (a professional who judges the marketplace like its own systems, by whether its numbers reconcile), the scene's two arguments, and the part opening's claim that supply is one chain, not five features. The closing names the links in order and ends at the professional who checks them; Ruhrblick's withdrawn downgrade and the Keybridge boundary show that check passing.\n\n**Takeaway** (`broader_implications`): Search, alerts and recommendations are only as fresh, deduplicated and trustworthy as the supply this part delivers; Part IV begins with search-architecture, which asks how to index millions of short-lived listings without letting the index become the system of record.\n\n**Hand-off** to [Part IV — DISCOVERY: Matching Intent to Inventory](part-4.html): `sequence`: Part III's published, deduplicated and removable listings, its 90-second freshness budget with removal from search in 10 seconds, and professional-seller-tooling's closing claim that discovery inherits whatever ghost, duplicate or disputed count supply leaves behind. → The buyer's side: search, query understanding, ranking, recommendations, map search and alerts as surfaces that read that supply and turn it into contacts.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p66 | synthesis | Part III's supply chain is complete, one chain rather than five features from forms and feeds to the professional, and it ends where this chapter began, with professionals who renew only when the chain's numbers agree with their own, which one event stream secured for Ruhrblick and four controls with evidence secured for Keybridge's agencies. |  |  |\n| p67 | cause_effect | Because the chain delivers supply that is contracted, deduplicated and removable with evidence, discovery can treat its indices and alerts as read models of it, and where a link is missing Part IV inherits the ghost, the duplicate or the disputed count. | reasoning: The 90-second budget and 10-second removal from search set in publication-pipeline. | `cause_effect`: A chain whose numbers professionals can check. → What it gives the buyer's side of the book. |\n| p68 | transition | Part IV turns next to the buyer's side, six surfaces from search to alerts that read this supply and turn it into contacts, starting with search architecture. |  | `sequence`: Supply that discovery reads as read models. → Part IV and its first chapter. |\n\n## Non-goals\n\n- Lead, conversation and lead routing design on the marketplace side. See [From Interest to Contact: Messaging and Lead Management](messaging-and-leads.html).\n- Package, entitlement and billing systems; revenue models. See [Packages, Bumps and Quotas: Products, Pricing and Entitlements](products-and-entitlements.html), [How Listing Marketplaces Make Money](monetization-models.html).\n- Organization hierarchy and trader status. See [Private Sellers, Dealers and Agencies: Modeling Who Lists](sellers-and-accounts.html).\n- Feed contracts and ingestion. See [Many Doors In: Forms, APIs and Bulk Feeds](listing-ingestion.html).\n- AI agents acting for professionals. See [AI Across the Listing Lifecycle](ai-in-listing-systems.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- The legislative status of the proposed P2B repeal should be re-checked before print. (Carried over from spec.md.)\n- Whether a dealer's DMS sale export by VIN is personal data under GDPR (it links to a buyer) needs counsel; the chapter treats sale matching as opt-in per dealer. (Carried over from spec.md.)\n- Immowelt's historical broker software was only WIDELY REPORTED in the brief and is deliberately not cited. (Carried over from spec.md.)\n\n## Decision log\n\n- **2026-10-19** — Framed the chapter around the professional's jobs and the reconciliation test rather than a feature catalog, because renewal depends on numbers that match the professional's systems.\n- **2026-10-19** — Kept the marketplace-side lead model in messaging-and-leads and modeled only the professional's lifecycle here, to avoid two definitions of a lead.\n- **2026-10-19** — Verified P2B Articles 7 and 9 directly (legislation.gov.uk EU text) to ground neutrality in law, rather than relying on the brief's Article 5 coverage.\n- **2026-10-19** — Introduced Motorvane Dealer Hub and Autohaus Ruhrblick's package as local facts (now the canonical Pro 150 package, €1,450/month, 150 slots, per the editor's ledger line), recorded in the scenario ledger with the Keybridge parity and evidence-pack rules.\n- **2026-11-12** — Converted spec.md to spec.json. Success criteria: the jobs-to-capabilities, lifecycle-diagram, reference-architecture-diagram, trade-off and vertical tables and dated-sources criteria were inventories of contents and are dropped (the style guide still governs format and sourcing); the Golf reconciliation and the Keybridge answer are kept as reader outcomes through the journal spec's AC-1; AC-2 and AC-3 replace the rest. No acceptance criteria were added. Rejected: Carrying the success criteria over as written (inventories).\n- **2026-11-12** — Supporting claims S1 to S4 written here (the journal spec gives none for this post) from the thesis's three parts, with the partner API split from the workspace because two sections argue it separately. For the author to confirm.\n- **2026-11-12** — Table captions ('**Table N:**') are separate units in the draft; each is specified as its own paragraph with form 'table' whose controlling idea i API and July 2026 platform update; CarGurus and Cars.com 10-Ks (Feb 2026); Cox Automotive — Automotive pro capabilities, API scale and outcome claims.\n  - Rightmove RTDF v1.4.1 (Nov 2023) and FY2025 results (Feb 2026); Zillow 10-K FY2025; Scout24 FY2025 preliminary results; AVIV Ultimmo (2022) — Real-estate pro tooling and pro SaaS examples.\n  - OLX causal-inference post (Aug 2026); Vinted commercial-selling Q&A (Sep 2026); Bundeskartellamt mobile.de/Carwow clearance (Oct 2026) — Self-selection, trader routing and multi-homing evidence.\n  - Regulation (EU) 2019/1150 Articles 7 and 9; European Commission P2B page (updated Jul 2026); RFC 9700 (Jan 2025) — Legal grounding for neutrality and the token baseline.\n\n## Changelog\n\n- **2026-11-12** — Escalation resolved under the author's delegation: 'Pro SaaS and the neutrality problem' moved to open Neutrality by Design; Failure Modes opener; glosses for layer-2/layer-4 and the 90-second/10-second targets; minor fixes ('both clouds', AI-agents tie, Buying Signals, Valuo); max_words 7,123 to 7,250 (draft 7,173). Round 4 draft check follows.\n- **2026-11-12** — Draft check rounds 1-3 (REVISE, REVISE, ESCALATE). Prose revised between rounds: roadmap names the two arguments; KEY POINTS lists ranking blindness among the four controls; section bridges into Verticals, Failure Modes, the Chief Architect's View and Questions; glosses for Deal Builder, platform-controlled states and productscape; the pro SaaS paragraph links to the CRM; the Ruhrblick quarter sentence clarified. After round 3: three cheap fixes, so the check report is stale. Draft 7,120 words (limit 7,123).\n- **2026-11-12** — Flow rubric notes taken: scene paragraphs name Felix Brandt, Emma Laurent and Claire Fontaine; section rationales for trade-offs, verticals and failure modes say what reordering would break; conclusion p66 restates the chapter's own design (one event stream, four controls) before the part synthesis.\n- **2026-11-12** — Converted spec.md t <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
