<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, the five journal acceptance criteria, the thesis and the role are copied unchanged from the case-automotive entry in journal-spec.json. Added: a roadmap paragraph (p04), a one-sentence lead-in to the vertical-differences table (p49), and a conclusion section that performs Part IX's closing (p64 to p66; the published closing paragraph is split across p64, p65 and p66, its sentences kept).\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Why automotive behaves differently: a car carries a machine-readable identity, most cars are listed by dealers through software, and the dealer who supplies the stock is also the paying customer.\n- **Know:** mobile.de's architecture as written in its APIs (transfer service providers as integration principals, idempotent creates, one write at a time per ad, taxonomy keyed to a vehicle derivative, the price rating as a resource, a change feed with a 24-hour catch-up window); Autotrader UK's disclosed levers, data APIs and Deal Builder; AutoScout24's platform story; CarGurus' price transparency and the CarOffer wind-down; OLX Autos as the contrast.\n- **Know:** Price evaluation as a control loop across the cases (five-band ratings, no-rating paths, dealer tools that show how a price change moves the band or the search position) and where the evidence stops (mobile.de internals, AutoScout24's product platform, all valuation methods).\n- **Believe:** In automotive the published dealer contract is the architecture document.\n- **Believe:** A price rating that feeds ranking or dealer tools needs the governance of a ranking model, and platform-controlled states on a dealer's stock are commercial-model changes that must be opt-in and reversible.\n- **Be able to:** Write the commitments of a professional supply contract (accountable integrators, idempotent creates, one writer per listing, stable error keys, a change feed with replay, a notice period).\n- **Be able to:** Decide how far up the transaction ladder a marketplace should go and what evidence would justify each step.\n\n**Audience:** Chief and enterprise architects, principal engineers and engineering leaders of vertical or multi-vertical marketplace groups, especially those running dealer-fed automotive brands or deciding how far a marketplace should reach into the transaction.\n\n**Already knows:**\n\n- What an API, a database, an event stream, a search engine and Kubernetes are, and ML serving.\n- Part IX's evidence rules, from part-9, and the five earlier cases.\n- Feed contracts (listing-ingestion), change feeds (event-driven-listings), enrichment (normalization-and-enrichment), model governance by decision (ml-platform), ranking (ranking), entitlements (products-and-entitlements) and the automotive requirement profile (vertical-requirements).\n- Veldmark and its automotive brand Motorvane, from meet-veldmark and the chapters.\n\n**Does not yet know:**\n\n- The automotive companies' corporate histories and products (mobile.de, Autotrader UK, AutoScout24, CarGurus, OLX Autos).\n- Automotive integration terms: transfer service provider (TSP), dealer management system (DMS), Germany's type-approval codes (HSN/TSN).\n- The metrics ARPR (average revenue per retailer) and IMV (Instant Market Value).\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a motors marketplace planning a dealer price tool and online reservations, the reader uses the dated automotive record to say what each requires. *Probe:* A motors marketplace that rates every car's price in five bands plans a dealer tool showing how a price cut would move the band and the car's search position, and wants to switch on online reservations for all dealers' stock. Using only this chapter: what does the public record show, and what should the marketplace put in place for each? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's questions, its evidence and where it ends. *Probe:* After reading only the callouts and the paragraphs before the first heading: what questions will this chapter ask, what kind of evidence will it use, and how will it end? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-4 | Every statement about mobile.de, Autotrader, AutoScout24 or CarGurus's internal systems that no cited source documents sits in a callout or figure caption labeled as inference, and every company fact outside those labels carries its source and publication year. *Probe:* Is there any sentence outside an `INFERENCE, NOT DOCUMENTED` callout or a labeled figure caption that describes how mobile.de, Autotrader, AutoScout24 or CarGurus builds or runs a system without a dated source, or a company fact with no source and year? | `custom` | rubric | major |\n| AC-5 | The chapter's final section performs Part IX's closing: it says what the six cases show together that no single case shows, why it matters, and returns to the part introduction's test of which patterns the record supports, which it only fails to contradict, and where it is silent, before handing off to the toolkit. | `conclusion_synthesizes_and_answers_so_what` | rubric | major |\n\n## Thesis\n\n**Question:** What do the automotive leaders' published dealer contracts, investor reports and engineering posts reveal about a dealer-fed listing system, and where does the marketplace's responsibility end?\n\n> **Claim:** Because a car has a machine-readable identity, arrives through dealer software and is supplied by the customer who pays, the automotive leaders' public record is their architecture: mobile.de's and Autotrader's published dealer contracts (accountable integrators, idempotent creates, serialized writes, a change feed with replay) are the documented answer to unmanaged feeds; their five-band price ratings, once shown to dealers alongside search position or used in ranking, shape the prices they learn from and need ranking-model governance; and the marketplace's responsibility ends where platform-controlled state on a dealer's stock stops being opt-in and reversible, as Deal Builder's friction and the CarOffer and OLX Autos retreats show.\n\n**Disputed by:** The view that a dealer feed is an import job each marketplace tunes privately, that a price rating is a neutral label rather than a model with consequences, and that a marketplace should move into reservations, guarantees and owning cars to capture more of each sale.\n\n**So what:** A Chief Architect publishes the professional supply contract before building the importer and treats vendor certification as a release gate; publishes change with a stated delay and replay window, 24 hours by default; registers any price rating that labels or orders results as a ranking model with an owner, band-boundary monitoring and a no-rating path; derives billing counts from the same inventory state search shows; makes every platform-set transactional state opt-in, configurable per dealer and reversible; and runs data APIs as a business line with their own service levels.\n\n**How and why:** Nine-tenths of automotive supply arrives through dealer feeds. mobile.de's Seller API and Ad Stream document transfer service providers as integration principals, idempotent creates, one write at a time per ad, a taxonomy keyed to a vehicle derivative and a change feed with a 24-hour catch-up window, and its price planner links price to search position. mobile.de, CarGurus and Autotrader all publish five-band price ratings or flags. Autotrader UK discloses its levers, serves about 155 million data-API calls a month, and by March 2026 had more than 6,700 retailers on Deal Builder with 137,000 full reservations in the year, while forecourts fell in the second half and dealers cut paid stock. CarGurus' 2025 annual report records the wind-down of CarOffer, and Prosus exited OLX Autos from 2023. mobile.de's internals, AutoScout24's product platform and every valuation method remain unpublished.\n\n**Supporting claims**\n\n- **A1** — A car's machine-readable identity, supply written by dealer software and a supplier who is also the paying customer make the automotive leaders' public contracts and investor disclosures a description of their listing systems.\n- **A2** — mobile.de's and Autotrader's published dealer contracts (accountable integrators, idempotent creates, serialized writes, stable error keys, a change feed with replay, a notice period for breaking changes) are the documented answer to unmanaged dealer feeds.\n- **A3** — Five-band price ratings, once they feed ordering or dealer tools that show a price change moving the band or the search position, become a control loop that shapes the prices the model learns from, and need the governance of a ranking model.\n- **A4** — When the supplier pays, inventory state is billing state and a platform-controlled state on a dealer's stock is a commercial-model change; the marketplace's responsibility ends where such states stop being opt-in and reversible, as Deal Builder's friction and the CarOffer and OLX Autos retreats show.\n- **A5** — The evidence is uneven and stops at internals (mobile.de's services, AutoScout24's product platform, every valuation method), so each fact is dated, each inference labeled, and the book's patterns and Veldmark's Motorvane are tested only as far ow do not outrun them. The author's rules, the comparison and the questions apply what the record has shown, and the conclusion closes the case and Part IX together because this is Part IX's last case.\n\n## Introduction\n\n**Hook** (`direct_statement`): This last case of Part IX tests the book's patterns in the vertical whose marketplaces are the clearest about their architecture, because they have to be.\n\n**Bridge:** A Chief Architect who has read the property portals: a listing business on valuable data and a professional supply base it does not control. → The same questions where the item has a machine-readable identity, supply is written by dealer software and the supplier is the customer who pays, so the leaders publish their integration contracts and report their revenue levers.\n\n**Thesis statement** (KEY POINTS callout (the three bullets) and the bold sentence of paragraph p01.): In automotive the public API is the architecture document; a price rating is a control loop, not a label; and when the supplier is the paying customer, platform-controlled state on its stock is a commercial-model change.\n\n**Roadmap** (Paragraph p04, after the three questions.):\n\n- Set the reading rules, give the dated timeline and say why automotive behaves differently. *Kept in:* how-to-read, timeline, why-different.\n- Read mobile.de and AutoScout24, then Autotrader UK, CarGurus and OLX Autos in order of how far each reaches into the transaction. *Kept in:* mobile-de, autoscout24, autotrader, cargurus, olx-autos.\n- Look across the cases: price evaluation as a control loop, the trade-offs, the other verticals, the failure modes and where the public evidence stops. *Kept in:* across-cases, trade-offs, verticals, failure-modes, evidence-stops.\n- End with my decision rules, a comparison with the book's patterns and Veldmark's Motorvane, questions to ask, and what the six cases of Part IX show together. *Kept in:* chief-architect, comparison, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Like the property portals, automotive marketplaces sit on a professional supply base they do not control, but a car's machine-readable identity, dealer-software supply and a supplier who also pays make their leaders publish integration contracts and revenue levers that describe a listing system, so this last case tests feed contracts, change feeds and model governance against public documents. | fact: Three properties: machine-readable identity, professional listing through software, the supplier is the paying customer; contracts published for vendors, levers reported to investors. |  |\n| p02 | description | The chapter reads four companies, each for the layer it documents (mobile.de its dealer write path, price rating and change feed; AutoScout24 its engineering platform; Autotrader UK its unit economics, data platform and reservation friction; CarGurus its price transparency and CarOffer wind-down), with OLX Autos as the brief contrast. |  | `elaboration`: A record that describes a listing system. → The four companies whose record it is and what each documents. |\n| p03 | claim | Each company is asked three questions: what the public contract reveals, what the reported numbers say about the systems behind them, and where the marketplace's responsibility ends. |  | `sequence`: The four companies. → The questions asked of each. |\n| p04 | transition | The chapter sets the reading rules, the timeline and the vertical's properties, reads the two European listing platforms (mobile.de for its contracts, AutoScout24 for its platform) and then the companies in order of how far they reach into the transaction, looks across them, and ends with the author's rules, tests against the book and Motorvane, questions, and what Part IX's six cases show together. |  | `sequence`: The three questions. → The route through the chapter, ending with the close of Part IX. |\n\n## Sections\n\n### How to Read This Case\n\n**Controlling idea** (`definition`, id `how-to-read`): The case keeps documented fact, the author's reading and labeled inference apart, and each company documents a different layer, so the evidence is uneven and dated as read.\n\n**Advances the thesis** (A5): Sets the evidence rules and states the unevenness before any fact is used.\n\n**Transition in:** `elaboration`: The introduction's promise of reading rules. → The rules themselves.\n\n**Order of paragraphs** (`large_to_small`): From the rules every Part IX case follows, to how far each company's evidence reaches, to the dating caveat on undated manuals, to the one fictional element and where it appears.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | definition | Part IX cases separate three kinds of statement: a documented fact carries its source and publication year, the author's interpretation is marked 'my reading' or sits in the Chief Architect's view, and a reference-architecture inference appears only in a labeled callout. |  |  |\n| p06 | evidence | The evidence is uneven because each company documents a different layer, and each has a weakest point. | table: Five companies with their strongest and weakest public evidence: mobile.de's manuals and newsroom against no engineering blog; Autotrader's FY26 results, portal and blog against its post-2019 topology and valuation method; AutoScout24's engineering blog and careers page against its dealer APIs and product architecture; CarGurus' 10-K and help center against engineering detail and model thresholds; OLX Autos' trade press and Prosus results against its systems. | `elaboration`: The rule that every fact carries its source. → How much each company's sources cover. |\n| p07 | context | The API manuals carry no publication dates, so they describe the contract as read on 19 October 2026, and ownership facts are stated as of a date. |  | `additional_support`: The unevenness of the evidence. → Its dating problem. |\n| p08 | context | Veldmark appears only in the final comparison, and Motorvane is a composite of industry patterns, not a disguised description of any company in the chapter. |  | `contrast`: The real companies' evidence and its limits. → The one fictional element and where it appears. |\n\n### Timeline: Automotive Marketplaces in Dated Events\n\n**Controlling idea** (`evidence`, id `timeline`): The companies' record from 1996 to October 2026 is a dated sequence of foundings, ownership changes, platform migrations, product launches and retreats, and it places each company on one line: how far the marketplace reaches into the transaction.\n\n**Advances the thesis** (A4, A5): Gives every later section its dated anchor and introduces the transaction ladder.\n\n**Transition in:** `sequence`: The rule that every fact carries its source and year. → The dated events themselves.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | evidence | The chronology draws on the cited releases, filings and reports, with ownership as of October 2026. | table: Seventeen dated events from mobile.de's founding (1996) through eBay's 2004 purchase, Auto Trader's last print edition (2013), Project Tatsu (2014), Auto Trader's 2015 listing, the c. 2019 GKE platform, OLX Autos (2019), AutoScout24's 2020 sale, CarOffer (2021), Adevinta's 2021 purchase of eBay Classifieds Group, Null-Leasing (2022), the 2023 OLX Autos exit announcement, Adevinta's 2024 take-private, Co-Driver (2025), CarOffer's wind-down decision (2025), the Trader migration (2025), the reported mobile.de dual track (2025), the November 2025 stock cuts, the July 2026 platform update and the 8 October 2026 Bundeskartellamt clearance. |  |\n| p10 | analysis | The four marketplaces and the contrast case sit at different points on one line, how far the marketplace reaches into the transaction (from listing and contact, through leads and reservations, to owning the car), and the documented retreats are all from its last step. | figure: Figure 1: where each case sits on the transaction ladder as of 2026. | `conclusion_summary`: The dated events. → The single line on which they place each company. |\n\n### Why Automotive Behaves Differently\n\n**Controlling idea** (`explanation`, id `why-different`): Four properties of the automotive profile (strong item identity, software-mediated professional supply, a supplier who pays, a high-ticket item of uncertain value) shape the architecture the case reads, and price evaluation is the vertical's signature data product.\n\n**Advances the thesis** (A1): Explains why the record is architectural and introduces the price-rating thread.\n\n**Transition in:** `sequence`: The dated events and the transaction ladder. → The properties of the vertical every case is read against.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p11 | explanation | Four properties of the automotive profile, developed in vertical-requirements, matter for reading this case. | table: Strong item identity (VIN, UK plate, HSN/TSN; attributes decoded, not typed), professional software-mediated supply (DMS uploads; the write path is an API for vendors), the supplier pays (inventory state is billing state), high ticket and uncertain value (price guidance, history and finance as data products), each with where the case shows it. |  |\n| p12 | definition | Price evaluation, rating an asking price against a model of market value, is the vertical's signature data product and gets its own cross-case section. |  | `emphasis`: The fourth property, buyers' need for price guidance. → The data product that answers it and its own section. |\n\n### mobile.de: An Architecture Written in Its APIs\n\n**Controlling idea** (`evidence`, id `mobile-de`): mobile.de publishes no engineering blog, but its Seller API, Search API and Ad Stream manuals and its 2026 releases document an accountable dealer write path, a price rating as a contract, a change feed with a 24-hour replay window, and a price tool that links price to search position.\n\n**Advances the thesis** (A2, A3, A5): Gives the fullest documented dealer contract, change feed and price rating, and the record's clearest sign that price feeds ranking.\n\n**Transition in:** `example`: The four properties and the price-rating thread. → The company whose API manuals show them most completely.\n\n**Order of paragraphs** (`large_to_small`): From the business and its market (ownership, non-exclusive inventory) to why the documents are the evidence, then the write path, the price rating, the read path and change feed, and finally ranking and the 2026 product layer, where the price-rating thread meets ranking.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p13 | context | mobile.de's history, segment revenue and scale are public, but its ownership as of October 2026 is not fully clear. | fact: Founded 1996, bought by eBay 2004, part of Adevinta from 25 June 2021; 2023 segment revenue €432 million (€408 million classifieds, €24 million advertising); more than 1.6 million listed vehicles and 140 million visits a month as 2025 averages; reported IPO-or-sale process (October 2025); 'Adevinta subsidiary' (August 2026); Bundeskartellamt names Oak Germany Buyer GmbH as parent (8 October 2026). |  |\n| p14 | claim | In a dealer-fed vertical inventory is not exclusive, so a marketplace differentiates through audience, data products and workflow rather than supply lock-in. | quotation: The Bundeskartellamt's clearance: mobile.de's 'starke Marktposition', AutoScout24 a 'starker Wettbewerber', consumers and dealers 'häufig mehrere Plattformen parallel', platforms offering 'Datenexport zu anderen Plattformen'. | `additional_support`: The Bundeskartellamt clearance decision. → What it records about the market. |\n| p15 | context | No mobile.de engineering blog was found, so the architectural evidence is its integration documentation, which is unusually complete. |  | `cause_effect`: Differentiation through data products and workflow. → Where the evidence for those systems has to come from. |\n| p16 | evidence (list) | The Seller API manual defines who may write and how: integrators are accountable principals, creates are idempotent and writes to one ad serialized, freshness is a separate field, vehicle identity is carried as codes, bulk XML upload exists beside the REST API, and the resource list is a product map. | quotation: 'Seller API Access can be granted to Transfer Service Providers and Self-Uploading Dealers registered with mobile.de'; the X-Mobile-Insertion-Request-Id header and HTTP 303 on retry; 'Do not send multiple requests for the same ad at the same time'; renewalDate; hsn, tsn and schwackeCode; seller-inventory-key and customerNumber in the XML upload. | `elaboration`: The integration documentation as evidence. → Its write path. |\n| p17 | analysis | Taken together, mobile.de treats the integration vendor as an accountable party, makes retries safe and puts ordering responsibility on the client in writing, and each choice removes a class of Feed Roulette incident. |  | `conclusion_summary`: The six contract terms. → What they add up to against Feed Roulette. |\n| p18 | evidence | The price rating is part of the same contract: five labels, a preview endpoint returning each band's euro range before an ad exists, a reason when no rating is available, and recalculation when images arrive. | quotation: VERY_GOOD_PRICE to HIGH_PRICE; a vehicle 'that has not been created yet'; 'a reason will be provided'; 'If images are uploaded later (at any time), the price rating will be recalculated including the image data.' | `additional_support`: The Seller API contract. → The price rating inside it. |\n| p19 | analysis | Three design choices are visible in the rating: a band with published boundaries rather than a point estimate, an explicit no-rating state with a reason, and recomputation when any input changes. | figure: Figure 2: a price rating designed as a contract (band, no-rating slot, recalculation on new photos). | `elaboration`: The rating's documented behavior. → The design choices it reveals. |\n| p20 | description | The Search API lets dealers embed their mobile.de listings on their own sites and carries the consumption, emissions and CO2-cost data German labeling rules require. |  | `contrast`: The write path and the rating. → The interfaces that let others read the inventory. |\n| p21 | evidence | Ad Stream is a WebSocket change feed with two event types, a contract-dependent delay, one connection per user and a catch-up mode that replays 24 hours of missed events. | quotation: AD_CREATE_OR_UPDATE and AD_DELETE; 'one connection per user'; catchup=true; 'the historical events are kept for 24 hours'; a test endpoint with 'only 10% of all events' and 60 seconds of extra delay. | `additional_support`: The Search API as one read interface. → The second, a change feed. |\n| p22 | analysis | The 24-hour replay window is a public benchmark for how long a consumer may be disconnected before it needs a full resynchronization, and the external contracts imply an internal design that is shown only as a labeled inference. | reasoning: INFERENCE, NOT DOCUMENTED: a log of listing state changes feeding Ad Stream, a price-rating service called synchronously and asynchronously, per-ad serialization of writes.; figure: Figure 3: a plausible reference flow consistent with the public API documentation, not a description of mobile.de's systems. | `elaboration`: The 24-hour catch-up. → What that number tells consumers and what the contracts imply inside. |\n| p23 | evidence | mobile.de's ranking is documented only by a 2024 conference abstract (learning to rank with XGBoost under a 30 ms latency target), which does not name the model's features. | quotation: 'millions of searches daily' and a 'strict latency SLA <30ms'. | `contrast`: Fully documented integration contracts. → The thinly documented ranking. |\n| p24 | evidence | The July 2026 platform update says more about the dealer-side product layer: AI lead tools now handle dealers' leads, two releases add data to the listing, and a Preis-Planer simulates how price steps affect days on market, the price rating and search position. | fact: AI reply suggestions produce 45% of written replies; Lead API into CRM systems; 91% of answered calls outside opening hours; Preis-Planer in 2% steps; Stellantis leasing offers (June) and CARFAX checks (September). | `additional_support`: What ranking documents leave out. → A 2026 release that says more. |\n| p25 | analysis | My reading is that the Preis-Planer is the most revealing sentence in the public record: it confirms that price relative to the market model affects ranking at mobile.de, which makes the price-rating model part of the ranking function. |  | `emphasis`: The Preis-Planer. → Why it matters more than the other products. |\n\n### AutoScout24: The Platform Story\n\n**Controlling idea** (`evidence`, id `autoscout24`): AutoScout24's public record is almost entirely about its engineering platform, the best-dated platform history of the four, and shows an acquirer's platform absorbing another marketplace at the account and identity layer.\n\n**Advances the thesis** (A5): Shows the platform layer documented and the product platform not.\n\n**Transition in:** `contrast`: mobile.de's integration contracts, the other European listing platform's record. → A European rival whose public record is almost all engineering platform.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p38 | evidence (list) | Unlike mobile.de, AutoScout24 documents its platform rather than its contracts, and its platform history runs from a 2014–2018 re-architecture onto AWS, through a 2025 consolidation of 110 AWS accounts from Trader, to a 2026 platform of nearly 1,000 services. | fact: 'the largest pan-European online car market'; Hellman & Friedman purchase in 2020 (reported €2.84 billion); Project Tatsu from November 2014, 'AWS first' and 'shared nothing' (InfoQ, 2016); bounded-context microservices, 'some' using Kafka (2018); '110 AWS accounts' with 'zero downtime' (August 2025); 994 services, 107 APIs, 2,700 requests per second, 30 TB, more than 270 engineers (careers page, read October 2026); EKS, Argo CD, Backstage and a read-only AI debugging agent (July 2026). |  |\n| p39 | analysis | The record says little about AutoScout24's listing, ranking or pricing systems, but in my reading it does show AutoScout24's platform absorbing another marketplace at the account and identity layer, as an acquirer's would (the post names no acquisition), without any public sign that the product platforms were merged. |  | `contrast`: What the platform history documents. → What it leaves out and what it still shows. |\n\n### Autotrader UK: The Economics Disclosed\n\n**Controlling idea** (`evidence`, id `autotrader`): Autotrader's results disclose the levers of its revenue, its data business and the cost of Deal Builder, showing that paid-stock counts are revenue, that partner data APIs are a governed B2B product, and that a platform-set state on dealer stock is a commercial-model change.\n\n**Advances the thesis** (A2, A4): Gives the documented economics of a dealer-paid marketplace and the friction of platform-set state.\n\n**Transition in:** `contrast`: Two listing platforms documented through contracts and platform posts, without financial detail. → A listed company that discloses the economics behind its systems and takes the first step up the transaction ladder.\n\n**Order of paragraphs** (`large_to_small`): From the company's disclosed totals to the three revenue levers and the stock lever, then the data APIs and how their contract is run, then Deal Builder, which uses the stock lever to show what platform-set state cost, and last the platform evidence, which is the thinnest and dated (moved after Deal Builder on 2026-11-12, after both round-2 flow readers found it breaking the thread from the stock lever to Deal Builder).\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p26 | context | Autotrader, listed since March 2015, reports for the year to 31 March 2026 a 70% operating margin, nearly 14,000 retailer forecourts and an audience that arrives mostly directly and almost not at all from AI assistants. | fact: Group revenue £624.3 million; Autotrader operating margin 70%; 13,942 average forecourts; over nine million monthly unique visitors; more than 80% direct, 13% organic, 4% paid; 'currently less than 1% of audience comes from generative AI chat assistants'. |  |\n| p27 | evidence | The results decompose growth in average revenue per retailer into price, stock and product levers, and each lever depends on a system getting something right. | table: ARPR levers for FY2026 and FY2025: price +£117/+£78, stock −£48/−£22, product +£72/+£77, ARPR £2,995/£2,854 (+£141, +5%), with Autotrader's explanation and what a system has to get right for each. | `elaboration`: The company's disclosed totals. → How it explains revenue per retailer. |\n| p28 | evidence | The lever figures come from Autotrader's full-year results to 31 March 2026, published 21 May 2026. | source: Autotrader full-year results to 31 March 2026, published 21 May 2026. | `additional_support`: The lever table. → Its source and date. |\n| p29 | analysis | The arithmetic closes to reported retailer revenue, and the stock lever is the architecturally interesting one: a dealer can cut spending by advertising fewer cars, so revenue depends on the accuracy of the count of paid cars. | fact: £2,995 × 13,942 × 12 ≈ £501 million against reported retailer revenue of £501.1 million.; figure: Figure 4: the stock lever, with one inventory line feeding search and a paid-stock gauge. | `emphasis`: The three levers. → The one that matters to architecture. |\n| p30 | evidence | Autotrader's data is a large partner business, with 220 technology partners, 155 million calls a month and an API set that runs from taxonomy and stock management to valuations and the objects behind its online deal product. | fact: 'integrated with over 220 technology partners'; 155 million calls a month (91 million the year before); APIs for lookup, taxonomy to derivative level, stock, images, search, valuations, vehicle metrics including a 'Retail Rating', and deal objects. | `additional_support`: Revenue from retailers. → The data services behind it. |\n| p31 | evidence (list) | Three details show how the contract is run: policy is encoded as validation, breaking changes have at least 30 days' notice, and stock changes are pushed by webhooks kept at parity with the Stock API. | quotation: 'not meeting minimum price of 75'; the DVLA category A/B rejection; the 30-day breaking-change policy and what counts as breaking; 'to gain parity between the Stock API and the Stock Notifications'. | `elaboration`: The API set. → How its contract is run. |\n| p32 | analysis | My reading is that at 155 million calls a month from 220 partners Autotrader's data is a B2B platform, and its change policy is the contract attribute-schemas recommends for any schema partners depend on. |  | `conclusion_summary`: The scale and the contract terms. → What they make the data business. |\n| p35 | evidence | Deal Builder lets a buyer start a deal online, and by March 2026 it reached more than 6,700 retailers and 137,000 fully reserved deals in the year, which Autotrader calls its best enquiries. | fact: 6,700 retailers (2,000 a year earlier); 175,000 vehicles live; 137,000 deals with a full reservation; 'the very best enquiries in terms of conversion to sale'. | `sequence`: Autotrader's data products and the stock lever. → The product that placed platform state on dealer stock. |\n| p36 | evidence | The same results describe what the rollout cost (softer retailer numbers, fewer forecourts in the second half, cut advertised stock), report lower employee engagement over the same year (read as context, not as a measured cost), and a response that paused auto-rollout and introduced 'request a reservation', which trade press says spares the buyer the £99 fee of a full reservation. | quotation: 'concerns with the speed and nature of our Deal Builder product roll-out'; 236 (1.7%) fewer forecourts in H2; stock cut from November 2025; engagement 91% to 72%; 'pausing auto-rollout ... introducing \"request a reservation\"'; the £99 fee (trade press, December 2025). | `contrast`: Deal Builder's reach. → What the rollout cost. |\n| p37 | analysis | My reading is that Deal Builder put a platform-controlled 'reserved' state on inventory the dealer owns, changing who takes a car off the market, and the documented response amounts to making that state opt-in and dealer-controlled: who may trigger a transition is part of the business model. | figure: Figure 5: a reference state model for reservations on dealer stock, not Autotrader's design. | `cause_effect`: The friction and the response. → Why the friction arose and the rule it implies. |\n| p33 | evidence | The engineering evidence spans seven years and grows thinner toward the present, from a c. 2019 Kubernetes and Istio case study to 2026 statements and one streaming-personalization post. | fact: GKE with Istio, about 400 microservices and 200–250 deployments a day (c. 2019); 'transitioned fully to a modern cloud-based delivery and data platform' and 'an AI platform' (2026 results); Snowplow, Spark Structured Streaming and Kafka (August 2026 post). | `contrast`: Well-documented products and their economics. → A thinly documented platform beneath them. |\n| p34 | evidence | The results claim more than 50 proprietary AI and ML models defensible against general-purpose language models, an incumbent's claim rather than a neutral finding, and name concrete products built on them. | quotation: 'more than 50 proprietary AI and machine learning models'; 'publicly available vehicle listings represent only a small part of the required data'; Co-Driver ('anecdotally' 28 to 5 minutes); 'specification adjusted valuations underpinning our price flags'; Buying Signals leads that 'convert at twice the average rate'; a ChatGPT app via the Model Context Protocol. | `additional_support`: The 2026 statement of an AI platform. → The models and products the results claim for it. |\n\n### CarGurus: Price Transparency as the Product\n\n**Controlling idea** (`evidence`, id `cargurus`): CarGurus makes a market-value model the center of its product and its dealer tools, and records the wind-down of CarOffer, the business that facilitated transactions on volatile prices.\n\n**Advances the thesis** (A3, A4): Shows the dealer side of the price loop and a documented retreat from the transaction.\n\n**Transition in:** `sequence`: Autotrader's reservations, the reservation step of the ladder. → A company built on price transparency that also tried the wholesale step and wound it down.\n\n**Order of paragraphs** (`large_to_small`): The proposition first (IMV and deal ratings), then the dealer tools and monetization that close the loop, then the retreat that bounds it, then the reading that joins the two.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p40 | evidence | CarGurus' 2025 10-K makes price evaluation the center of the proposition: five deal ratings based on Instant Market Value, updated daily and, per the help center, ordering deals by the algorithm rather than by payment. | quotation: 'our proprietary algorithm that assesses the market value of a used vehicle in a local market'; 'tens of millions of data points'; updated 'daily'; 'based on our algorithm, not how much a dealer pays us.' |  |\n| p41 | evidence | The 10-K documents the dealer side of the loop (tools showing the smallest cut that reaches the next band and the increases that keep it) and monetization that follows the dealer's inventory, a dealer-paid model at the scale its 2025 figures show. | fact: Next Best Deal Rating; Maximize Margin; PriceVantage; subscriptions priced by 'a dealer's inventory size and region'; Restricted Listings with 'capped anonymous leads and connections'; 2025 revenue $907.0 million; 34,409 paying dealers; QARSD $7,938 (US, Q4). | `elaboration`: The consumer-facing ratings. → Their dealer-facing side. |\n| p42 | evidence | CarGurus also records the retreat that bounds the case: it wound down CarOffer, its digital wholesale business, in 2025 to focus on analytics rather than facilitating transactions. | quotation: 51% of CarOffer acquired January 2021; wind-down decided 6 August 2025, 'proven less effective in today's more volatile and unpredictable pricing environment'; focus on 'technology and analytics ... rather than facilitating the transactions themselves'; completed by 31 December 2025. | `contrast`: Price data as an information product. → Price data used to facilitate transactions, and its end. |\n| p43 | analysis | My reading is that CarGurus shows both ends of price data: a market-value model is a strong information product, while facilitating transactions on volatile prices proved a different business. |  | `conclusion_summary`: The ratings and the wind-down. → What the two together show. |\n\n### OLX Autos: The Contrast\n\n**Controlling idea** (`comparison`, id `olx-autos`): OLX Group went furthest toward owning cars and then exited, which shows that a car-owning business is a retailer whose platform does not carry over to a marketplace.\n\n**Advances the thesis** (A4): Bounds the transaction ladder with its furthest documented step and the exit from it.\n\n**Transition in:** `similarity`: CarGurus' retreat from facilitating transactions. → A group that went further, to owning cars, and also retreated.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p44 | evidence | OLX Group built OLX Autos into a buy, recondition, sell business that reached half its classifieds revenue, then announced in 2023 that it would exit, and by March 2025 had disposed of or closed all of it. | fact: Control of Frontier Car Group in 2019; FY2022 revenue $1.6 billion, up 158%, 'just over half' of classifieds revenue, about 175,000 cars; exit announced 2 March 2023 citing 'higher cost of capital, high inflation and a reversal of pandemic trends' after first-half losses of $206 million; all operations 'disposed of, classified as held for sale or closed' by 31 March 2025. |  |\n| p45 | analysis | A business that owns cars is a retailer with an e-commerce front end, needing inspection, reconditioning, logistics, pricing authority and a finance book, so the platform built for one does not carry the other. |  | `cause_effect`: OLX Autos' exit. → Why owning cars is a different business from a marketplace. |\n\n### Across the Cases: Price Evaluation as a Control Loop\n\n**Controlling idea** (`comparison`, id `across-cases`): Compared side by side, the price products of mobile.de, CarGurus and Autotrader form a control loop once a rating feeds ordering and dealer tools, and the loop needs bands, a no-rating state, boundary monitoring and a declared list of consumers.\n\n**Advances the thesis** (A3): Draws the control loop from three companies' documents.\n\n**Transition in:** `conclusion_summary`: The price products met in three company sections. → Their direct comparison.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p46 | comparison | Three of the four companies publish enough to compare their price products directly, and together they imply a loop in which the model measures a market it helps to set; the valuation method itself is shown only as labeled inference. | table: mobile.de, CarGurus and Autotrader compared on consumer output, no-rating path, recalculation, dealer tool, link to ordering, and source and date.; figure: Figure 6: the loop the public record implies.; reasoning: INFERENCE, NOT DOCUMENTED: a plausible gradient-boosted or hedonic model per market, served as a band on the listing, with boundaries from a prediction interval. |  |\n| p47 | recommendation | My reading is that the loop needs four things: bands rather than point estimates, an explicit no-rating state, monitoring for clustering at band boundaries, and a declared list of every consumer of the rating. |  | `problem_solution`: A model that shapes the market it measures. → What keeps that loop in check. |\n\n### Trade-offs the Case Illustrates\n\n**Controlling idea** (`comparison`, id `trade-offs`): Seven options from the record each have conditions under which they are right and fail, and the leaders moved deeper into data and workflow and stepped back from price risk.\n\n**Advances the thesis** (A2, A3, A4): Puts the contract, loop and ladder choices side by side.\n\n**Transition in:** `elaboration`: The price-rating options compared across the cases. → All seven options the record shows, and the direction the leaders took.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p48 | analysis | The seven options the record shows are not stages of maturity: the leading automotive marketplaces moved deeper into data and workflow and stepped back from price risk. | table: Seven options (publish integration contracts, a change feed with replay, rating as label, rating as ranking feature and dealer tool, subscription scaled by stock, platform-controlled transaction states, holding inventory) with what the record shows, when right and when each fails. |  |\n\n### Failure Modes the Record Exposes\n\n**Controlling idea** (`analysis`, id `failure-modes`): The record exposes six risks, from feed truncation to new AI intermediaries, each tied to documented evidence.\n\n**Advances the thesis** (A2, A3, A4): Turns the record into risks a group can check for.\n\n**Transition in:** `cause_effect`: Options and where each fails. → The risks the record exposes.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p50 | analysis (list) | The table's failure conditions and two it does not show add up to six risks: feed truncation and duplicate creates (the truncation half left open by the record), systems counting stock differently, an undeclared consumer of the rating, rollout as architecture, model error as balance-sheet risk, and new AI intermediaries (from the risk register in Autotrader's FY26 results). |  |  |\n\n### Vertical Differences in the Record\n\n**Controlling idea** (`comparison`, id `verticals`): The automotive lessons transfer to real estate, general classifieds and jobs unevenly, depending on how strong identity, vendor-mediated supply and stock-tied billing are there.\n\n**Advances the thesis** (A1): Shows which properties make the lessons hold elsewhere.\n\n**Transition in:** `contrast`: Risks inside automotive. → How far the lessons travel to other verticals.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p49 | comparison | The lessons above hold in other verticals only as far as those verticals share automotive's identity, supply and billing. | table: Five lessons (decoded identity, vendor-mediated writes, price rating as control loop, billing tied to stock, platform state on supplier stock) across real estate, general classifieds and jobs. |  |\n\n### Where the Public Evidence Stops\n\n**Controlling idea** (`evidence`, id `evidence-stops`): Nine questions that matter to an architect, from mobile.de's internals to taxonomy licensing, are answered by no public source, and the chapter does not fill them with inference.\n\n**Advances ne writer per listing, stable error keys and a notice period, and treat vendor certification as a release gate. |  | `sequence`: Six rules. → The first. |\n| p54 | recommendation | Publish change, not only state: a change feed with a stated delay and replay window, 24 hours by default. |  | `sequence`: The write contract. → The read contract. |\n| p55 | recommendation | Govern the price rating as ranking: once it labels or positions a result it decides exposure and needs an owner, band and boundary evaluation, a no-rating path, ranking review and dealer explanations in the label's terms. |  | `sequence`: Contracts for supply and change. → The rule for the price model. |\n| p56 | recommendation | Make inventory state the single source for search and billing, so that a dealer who pays per car is billed from the same state, with the same timestamps, that search shows. |  | `sequence`: The rating's rule. → The billing rule. |\n| p57 | recommendation | Move up the transaction ladder only with the dealer's consent: reservations need opt-in, configuration and reversal, and owning cars or guaranteeing prices is a different business. |  | `sequence`: Inventory state as billing state. → Platform state on that inventory. |\n| p58 | recommendation | Treat data APIs as a business line with their own service levels, versioning and owner. |  | `sequence`: The transaction rule. → The last rule. |\n\n### Comparing the Case to the Book's Patterns and to Veldmark\n\n**Controlling idea** (`comparison`, id `comparison`): The automotive record supports the book's supply-contract, enrichment, change-feed, exposure-model, billing and endpoint patterns, and applied to Motorvane it endorses its fixes while warning about the price-rating loop.\n\n**Advances the thesis** (A2, A3, A4, A5): Tests the rules against the book's claims and the running example.\n\n**Transition in:** `elaboration`: The author's rules. → Their test against the book's patterns and Veldmark's choices.\n\n**Order of paragraphs** (`large_to_small`): The book's patterns first, then Veldmark's seven parallel choices, then one worked price-rating sequence, then a caution about comparing figures; each step narrows from the book to one listing.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p59 | comparison | The author's rules rest on the book's patterns, and the automotive record supports all six patterns tested, two of them strongly. | table: Six book patterns (listing-ingestion, normalization-and-enrichment, event-driven-listings, ranking and ml-platform, products-and-entitlements, marketplace-taxonomy) with what the record shows and a verdict. | `elaboration`: The author's rules. → The book's patterns they rest on, as the record tests them. |\n| p60 | comparison | Veldmark's Motorvane has the same supply physics as mobile.de, and the case confirms most of its 2027 choices and sharpens the rest. | table: Seven Veldmark choices or events (the truncated-snapshot incident, the late Essen Golf sale, the market-value model as ranking feature, Pro 150 overbilling, opt-in reservations, the lead ledger, Elasticsearch until 2029) with the automotive parallel and what the case suggests. | `sequence`: The book's patterns. → Veldmark's choices. |\n| p61 | example | One worked price-rating sequence on the Essen Golf shows how a planner of price steps and search position would let the model learn from prices it induced, and who in Veldmark should register and monitor it. | scenario: Wednesday 14 April 2027: the Golf listed at €21,900, rated 'good price' against €22,800; Thursday 22 April: cut to €21,400, rescored, up a band, higher in ranking, alerts to 1,180 watchers; Priya Raman's registry (9 November 2027 decision) and Felix Brandt, Motorvane's CTO. | `example`: The market-value model as a ranking feature. → One listing's sequence of events. |\n| p62 | context | Motorvane's and Autotrader's revenue per dealer use different denominators, currencies and package scopes and should not be ranked against each other. |  | `contrast`: Comparisons that hold. → One that does not. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Nine questions let a reader test their own group's supply contract, change feed, price model, billing, platform-set states and place on the transaction ladder.\n\n**Advances the thesis** (A2, A3, A4): Turns the rules into questions for the reader's group.\n\n**Transition in:** `elaboration`: The rules as tested against Veldmark. → The questions they pose to the reader's own group.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p63 | recommendation (list) | Nine questions turn the case's lessons into checks on integrator accountability, idempotency, change feeds, model consumers, boundary clustering, billing counts, platform-set states, breaking-change notice and where the group stops on the transaction ladder. |  |  |\n\n## Conclusion: What the Cases Show Together\n\n**Synthesis:** The automotive record shows the limit as well as the pattern (the leaders went deeper into data and workflow and stepped back from price risk), and read together the six verdict tables of Part IX sort the book's patterns into three groups: supported by dated evidence (share the uniform layers, contracts at the supply boundary, the search index as a rebuildable read model, models governed by the decision they drive, separability under a change of owner), not contradicted (product convergence last and with its own case, since no public convergence completed), and silent (how any group runs search, ranking or listing services across brands after 2024).\n\n**So what:** A Chief Architect can cite the public record for the layers to share, the separability to design in and the contracts and model governance to publish, and should treat a product-platform convergence as a bet the record has not shown paying off.\n\n**Callback brand product internals after 2024, so a group should cite it for the first and treat convergence as an unproven bet; the paragraph states the part introduction's three-way test and ties the supported patterns to where this chapter touched them (AutoScout24's account consolidation, the published APIs, the price rating). |  | `conclusion_summary`: The automotive case's own lesson. → What all six cases show together. |\n| p66 | transition | The toolkit turns the book's recurring decisions, including the feed contract, the listing event specification and the entitlement matrix that this chapter's Veldmark comparison calls for (the truncated snapshot, the late sale and the Pro 150 overbilling), into templates a team can fill in, and every external fact cited in them should carry its date. |  | `conclusion_summary`: Lessons the record supports. → The templates that put them into a group's decisions. |\n\n## Non-goals\n\n- A company profile, market-share analysis or investment view.\n- Re-teaching feed contracts, enrichment and provenance, model governance, ranking design, entitlements or the automotive requirement profile. See [Many Doors In: Forms, APIs and Bulk Feeds](listing-ingestion.html), [From Raw Supply to Usable Listings: Normalization and Enrichment](normalization-and-enrichment.html), [Models in Production: ML Platforms and Use Cases](ml-platform.html), [Ranking for Two Sides: Relevance, Freshness and Paid Visibility](ranking.html), [Packages, Bumps and Quotas: Products, Pricing and Entitlements](products-and-entitlements.html), [Same Platform, Different Physics: How Listing Verticals Differ](vertical-requirements.html).\n- OLX Group beyond OLX Autos, and mobile.de's place in Adevinta. See [OLX Group: Regional Platforms, Verticalization and Retreat](case-olx.html), [Adevinta: From Schibsted's Copy-Paste Model to a Portfolio Platform](case-adevinta.html).\n- US dealer-software conglomerates (Cox Automotive, Cars.com) beyond what the comparison needs; they are omitted.\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- mobile.de's ownership as of October 2026: the Bundeskartellamt names Oak Germany Buyer GmbH as parent; whether the reported 2025 dual track ended in a sale or listing is not confirmed.\n- Full-versus-delta semantics of mobile.de's XML upload (documented on a page not read).\n- Whether price ratings feed ranking at Autotrader and AutoScout24.\n- The corporate relationship between AutoScout24 and Trader (Canada) is not stated in the migration post; common ownership is widely understood but not verified here.\n- mobile.de newsroom pages returned HTTP 403 on re-verification; their facts rest on the automotive brief's verified reads of the same day.\n- For the author: 'Nine-tenths of automotive supply arrives through dealer feeds' (failure-patterns callout) is a stated fact, not an interpretation, and has no source or year; it is kept as published (the nearest canonical figures are Motorvane's: 91% of listings from dealers, 88% of those via DMS feeds). Add a source and year, or reword.\n- For the author: failure mode 6, 'Autotrader's register of risks names \"AI being used to disintermediate marketplaces\"', names no document or year. It is kept as published; _research/brief-automotive.md (line 91) records the quote as verified in Autotrader's full-year results to 31 March 2026 (FY26 results, 2026), which are already in Sources, so adding '(FY26 results, 2026)' would close it.\n\n## Decision log\n\n- **2026-10-19** — Organized by company, then a cross-case section, because each company's public evidence is of a different kind (API contracts, investor levers, platform posts, a 10-K); a phase structure like the Adevinta case did not fit.\n- **2026-10-19** — Made the price rating the case's central technical thread, since it is the one product all four document and the one where the book's Set-and-Forget AI pattern is visible in public (mobile.de's Preis-Planer linking price to search position).\n- **2026-1         const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
