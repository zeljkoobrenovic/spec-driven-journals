<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, the three acceptance criteria, the thesis and the role are copied unchanged from the query-understanding entry in journal-spec.json. Three units are added to the published text: a roadmap paragraph in the introduction (p04, for AC-2), a lead-in for the trade-offs table (p67) and a synthesis paragraph before the hand-off (p79).\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The query-understanding pipeline from raw string to structured query (analysis per language, spelling and synonyms, query categorization, attribute extraction) and its ownership split: one vocabulary, many policies.\n- **Know:** The confidence-to-action policy (filter, boost, suggest) with removable chips and the rule that adding an interpretation never increases results, the null-result recovery ladder, autocomplete, hybrid retrieval with its fusion methods, and the LLM query compiler with its validation step.\n- **Believe:** Meaning belongs in the attribute dictionary and the taxonomy, versioned with them, not in scattered synonym files.\n- **Believe:** Embeddings and language models are layers over the structured core, not replacements for it, and need per-market evaluation and owners.\n- **Be able to:** Add a query-understanding checklist (aliases, categorizer labels, evaluation sets) to a taxonomy release and test analyzers for token parity across engines.\n- **Be able to:** Set confidence thresholds and a relaxation order for a category, and decide where dense retrieval or an LLM compiler would add recall without replacing filters.\n\n**Audience:** Search and ML leads, principal engineers and chief architects of classifieds, real-estate and automotive marketplaces deciding how far to invest in query understanding, dense retrieval and LLM search, and how to govern it across brands and languages.\n\n**Already knows:**\n\n- APIs, databases, event streams, search engines and Kubernetes.\n- From earlier chapters: the taxonomy and attribute service, the bikes split on 1 November 2027, the search contract, analyzers, the search index as a read model, and Veldmark's cast and brands.\n\n**Does not yet know:**\n\n- Query categorization, query tagging, interpretation and calibrated confidence.\n- Dense retrieval, approximate nearest neighbor indices (HNSW, IVF) and fusion methods (RRF, score normalization).\n- LLM query compilers and the Model Context Protocol.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a category split and a query that comes in many spellings and languages, the reader designs how queries will land in the new category. *Probe:* Next month your marketplace splits generic bike categories into e-bikes, city bikes and cargo bikes. Buyers write e-bike intent in eleven forms across two languages, and one similar term ('speed pedelec') legally means a moped. Using only this chapter: what do you build so that these buyers land in the e-bikes category, and how do you keep a wrong guess from hiding inventory? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** How do you turn short, ambiguous queries into the right structured search?\n\n> **Claim:** In listing search, understanding a query mostly means compiling it into the marketplace's own categories and attribute filters: the vocabulary (aliases per language, exclusions such as 'speed pedelec') lives once in the taxonomy and attribute service, each marketplace applies interpretations by calibrated confidence (a filter shown as a removable chip at 0.85 or above at Tradeyard, a boost and suggestion below), thin results are recovered in a defined relaxation order, and dense retrieval and LLM query compilers are layers that emit the same validated filter form under the same per-market evaluation and ownership as any order-tier model.\n\n**Disputed by:** The view that query relevance is a text-matching and synonym-file problem tuned per site, and the newer view that embeddings or a language model should replace keyword and filter search with semantic retrieval.\n\n**So what:** A Chief Architect who accepts this puts query aliases, categorizer labels and evaluation sets into every taxonomy release, registers every model in the query path as an order-tier model, routes natural-language features through the AI gateway with dictionary validation and the search contract, and watches null-result and chip-removal rates per market as the earliest sign that queries and catalog have drifted apart.\n\n**How and why:** Buyers type the marketplace's vocabulary in their own words: at Tradeyard NL about a quarter of 1.9 million weekly bike searches meant e-bike, in at least eleven forms that the old analyzer turned into four result sets sharing less than half their top 50. One vocabulary entry, analyzer fixes and a confidence policy sent 10 of the 11 variants to the new e-bikes category at the 1 November 2027 split, cut the null or under-five-result rate from 6.1% to 2.4% and raised e-bike search-to-contact by 11% relative, a gain from vocabulary and policy rather than from a model; the documented LLM search features at coches.net and leboncoin likewise compile natural language into the existing filter schema.\n\n**Supporting claims**\n\n- **Q1** — Listing queries are requests for filters in the marketplace's own vocabulary, so treating them as text to match splits one intent into inconsistent result sets.\n- **Q2** — The vocabulary that queries compile to (categories, attribute values, aliases per language, exclusions) belongs once in the taxonomy and attribute service, versioned with it, while analyzers, spellers and synonyms handle only text.\n- **Q3** — Each marketplace applies interpretations by calibrated confidence, visibly and reversibly, and recovers thin results in a defined order, so a wrong guess costs a tap rather than hidden inventory.\n- **Q4** — Dense retrieval and LLM query compilers are layers over the structured core that fill recall gaps and compile language into the same validated filter form, not replacements for filters.\n- **Q5** — Every model in the query path needs per-market evaluation, an owner and a place in the taxonomy release, under the same governance as any order-tier model, because query understanding fails quietly.\n\n## Role in the part\n\nMakes the part's 'structure beats cleverness' claim a design: words compile into the shared vocabulary under a confidence policy, with models layered on top. Supports P4-2 of part `part-4`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `large_to_small` in concepts and architecture: the whole compiler and its owners before any single step; `chronological` in analysis to autocomplete: the steps in the order a query meets them, then the two layers above them; `grouping` in trade-offs to questions: the book's reference sections)\n\nThe scene poses the problem: one intent, eleven forms, inconsistent results before a category split. Concepts name the steps and the architecture assigns their owners, so every later section can say whose rule it is. The steps then follow the order a query meets them, because each uses the output of the one before: analysis produces tokens, spelling and synonyms correct and equate them, categorization and tagging map them to structure, the confidence policy applies that structure, recovery handles what it filters out, and autocomplete reuses interpretations before the query is submitted. Hybrid retrieval and LLM search come after the structured core because they are layers that must respect it. Evaluation follows all the steps it measures, and the worked example applies them in order to the opening scene. Trade-offs, vertical differences, failure modes, the Chief Architect's view and the questions test and govern the design. Putting the layers before the core would present embeddings and LLMs as the answer the chapter argues they are not.\n\n## Introduction\n\n**Hook** (`intriguing_example`): \"ebike gazelle\" means category e-bikes, brand Gazelle; \"golf 8 automatik\" means Volkswagen Golf, generation 8, automatic gearbox; \"T3 balcon Lyon 7\" means three main rooms, a balcony, Lyon's 7th arrondissement. None of these buyers is asking for text relevance.\n\n**Bridge:** A search layer that is fast, fresh and rebuildable behind its contract, as the previous chapter built it, still treats a query as text to match. → Query understanding compiles the query into the marketplace's own categories and attribute filters, with the taxonomy and attribute service supplying the vocabulary.\n\n**Thesis statement** (KEY POINTS callout (all three bullets); introduction paragraphs p01 and p02 state the compilation claim.): In listing search, understanding a query mostly means compiling it into the marketplace's own categories and attribute filters, from one vocabulary versioned with the taxonomy, applied by stated confidence with a way back, and with embeddings and LLMs as layers over that structured core.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p04, which names the sections in order.):\n\n- Tradeyard's e-bike queries before the November 2027 bikes split. *Kept in:* scene.\n- The steps from query string to structured query and who owns each. *Kept in:* concepts, architecture.\n- Each step in the order a query meets it: language analysis, spelling and synonyms, categorization and tagging with the confidence policy, recovery from thin results. *Kept in:* analysis, spelling-synonyms, categorization, recovery.\n- Autocomplete last among the steps, because it reuses all of them before the query is submitted. *Kept in:* autocomplete.\n- The two layers above: hybrid retrieval with embeddings and natural-language search with LLMs. *Kept in:* hybrid, llm.\n- Evaluation, and the e-bike queries through the split. *Kept in:* evaluation, in-practice.\n- Trade-offs, vertical differences, failure modes, the Chief Architect's view and questions for a design review. *Kept in:* trade-offs, verticals, failure-modes, chief-architect, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A listing query is short, often misspelled and multilingual, and is usually a request for a filter in disguise: the buyer asks the marketplace to recognize its own vocabulary in their words, not for text relevance. | example: \"ebike gazelle\" (category e-bikes, brand Gazelle); \"golf 8 automatik\" (Volkswagen Golf, generation 8, automatic); \"T3 balcon Lyon 7\" (three main rooms, balcony, Lyon 7th arrondissement). |  |\n| p02 | definition | Query understanding is the set of steps that turns the raw query string into a structured query; it is where Part IV's claim that structure beats cleverness becomes a design, compiling to the taxonomy and attribute service's vocabulary, between the search contract and the engine, within about 25 ms at Veldmark, and handing its output to ranking. |  | `elaboration`: Queries as requests for filters in the marketplace's vocabulary. → The name of the steps that recognize that vocabulary, where they sit between the search layer of the previous chapter and ranking, and what they compile to. |\n| p03 | definition | The chapter owns three terms, query understanding, query categorization and hybrid retrieval, and treats autocomplete as part of query understanding because a good suggestion is a query the system already understands. |  | `elaboration`: Query understanding as a defined layer. → The terms the chapter owns and why autocomplete belongs to it. |\n| p04 | transition | The chapter starts with Tradeyard's e-bike queries before the November 2027 bikes split, defines the steps and their owners, follows them in the order a query meets them (language analysis, spelling and synonyms, categorization and tagging with the policy that turns guesses into filters, recovery from thin results), then autocomplete, which reuses all of them before the query is submitted, then the two layers above them (hybrid retrieval and LLM search), evaluation and the e-bike queries through the split, and closes with trade-offs, vertical differences, failure modes, the Chief Architect's view and review questions. | reasoning: The chapter's sections in order. | `sequence`: The terms the chapter owns. → The order in which the chapter covers them. |\n\n## Sections\n\n### Setting the Scene at Veldmark: Eleven Ways to Say E-Bike\n\n**Controlling idea** (`context`, id `scene`): A month before the bikes split, Tradeyard's query logs show one e-bike intent written in at least eleven forms that the old analyzer turned into different result sets, so the new category would be missed by queries that did not resolve to it.\n\n**Advances the thesis** (Q1): Poses the chapter's question with Veldmark's numbers: text matching splits one intent into inconsistent result sets.\n\n**Transition in:** `example`: Queries as requests for filters, and the roadmap. → A dated Veldmark case in which one intent arrives in eleven forms.\n\n**Order of paragraphs** (`problem_solution`): The decision date first, then what the logs showed, then why the existing analyzer failed, then why the split makes it urgent; the urgency only lands once the failure is shown.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | context | On Monday 1 November 2027 Tradeyard's bike categories would be replaced by canonical leaves, the first change through the group taxonomy and attribute service, and Priya Raman and Tomasz Wiśniewski set out to answer whether buyers looking for e-bikes would land in the new e-bikes category. | scenario: Six country bike leaves in the Netherlands, mostly generic, replaced by canonical leaves for city bikes, e-bikes, cargo bikes, kids' bikes and more; a month of Tradeyard NL query logs. |  |\n| p06 | evidence | The logs showed that about a quarter of 1.9 million weekly bike searches meant e-bike, in at least eleven forms, one of which, 'speed pedelec', is legally a moped in the Netherlands. | statistic: About 380,000 live bike listings, about 214,000 landing in the new city-bike leaf and about 38,000 e-bikes; about 1.9 million weekly bike searches, a quarter with e-bike intent, in at least eleven listed forms. | `elaboration`: The question the two set out to answer. → What the query logs showed. |\n| p07 | evidence | The old Solr analyzer treated the variants so differently that one intent produced four result sets sharing less than half their top 50, with contact rates differing threefold. | scenario: 'e-bike' split into 'e' and 'bike' and returned about 31,000 results, mostly ordinary bikes; 'ebike' about 2,100; 'elektrische fiets' about 18,400; 'elektrischefiets' 140. | `cause_effect`: The eleven forms of one intent. → What the existing analyzer did with them. |\n| p08 | analysis | Other countries added their own languages and unowned synonym files, and the split would make the problem visible because a query that did not resolve to the e-bikes category would miss every e-bike. |  | `additional_support`: The Dutch result sets. → The same problem in Belgium, Poland and Portugal, and why the split raises the stakes. |\n\n### Concepts: From Query String to Structured Query\n\n**Controlling idea** (`definition`, id `concepts`): Query understanding is a sequence of named steps from text to structure, plus recovery and two layers on top, and the chapter uses each name in this sense.\n\n**Advances the thesis** (Q1): Gives the vocabulary for the pipeline that compiles queries into structure.\n\n**Transition in:** `problem_solution`: Eleven forms of one intent that the analyzer handled inconsistently. → The named steps that turn a query string into a structured query.\n\n**Order of paragraphs** (`chronological`): Terms in the order a query passes through them: text steps, then structure, then the combined interpretation, recovery and the two layers; each later term uses an earlier one.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | definition | Query normalization and analysis (normalization, lowercasing, accent folding, tokenization, stemming and decompounding per language) must agree between the query side and the index side, or matching fails silently. |  |  |\n| p10 | definition | Spelling correction maps a misspelled token to an intended one, automatically or as a suggestion, against the marketplace's own vocabulary. |  | `sequence`: Analysis of the query text. → Correcting tokens the analysis leaves misspelled. |\n| p11 | definition | Synonyms are equivalences and one-way expansions maintained per language and market. |  | `sequence`: Correcting a token. → Equating tokens. |\n| p12 | definition | Query categorization predicts the category, or a ranked list of categories with probabilities, a query is about, as a classification problem whose label set is the taxonomy. |  | `sequence`: Text-level steps. → The first step that maps to structure: the category. |\n| p13 | definition | Query tagging recognizes spans that name attribute values or places, as named-entity recognition against the attribute dictionary and the location model. |  | `sequence`: The category. → Attribute values and places inside the query. |\n| p14 | definition | An interpretation is the structured result of these steps, each element with a confidence, and one query may have several. |  | `conclusion_summary`: The individual steps. → Their combined output. |\n| p15 | definition | Null and low-result recovery is what the system does when an interpretation returns nothing or too little. |  | `sequence`: The interpretation. → What happens when it finds too little. |\n| p16 | definition | Hybrid retrieval runs lexical, structured and dense retrieval for one request and fuses the results. |  | `sequence`: The structured core. → The first layer over it. |\n| p17 | definition | An LLM query compiler turns a natural-language request into the marketplace's existing structured query, which the classic engine executes. |  | `sequence`: Embedding-based retrieval. → The second layer: language models. |\n\n### Architecture: Shared Vocabulary, Local Policy\n\n**Controlling idea** (`explanation`, id `architecture`): Query understanding runs as a compiler inside the search API whose components have different owners, and the ownership split encodes the principle that the vocabulary is shared and the policy is local.\n\n**Advances the thesis** (Q2): States the one-vocabulary, many-policies split that the rest of the chapter applies.\n\n**Transition in:** `sequence`: The named steps. → How they are assembled into one layer and who owns each.\n\n**Order of paragraphs** (`large_to_small`): The whole compiler at runtime first, then the owner of each step, then the principle the ownership split encodes; the principle cannot be stated before the owners are shown.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | description | Query understanding runs inside the search API before retrieval, with model steps called through a cache so the models do their real work on the tail. | figure: Figure 1: query understanding as a compiler; each step adds structure with a confidence, the taxonomy and attribute dictionary supply the vocabulary, and chips let wrong guesses be undone. |  |\n| p19 | description | Each step has its own owner and its own reason to change. | table: Component, owner and change trigger for analyzers, spelling vocabulary, synonyms, categorizer, tagger, interpretation policy and evaluation harness. | `elaboration`: The steps of the compiler. → Who owns each and when it changes. |\n| p20 | claim | The table encodes a principle: the vocabulary is shared through the taxonomy and attribute service, while how aggressively each marketplace turns meanings into filters is a product decision it owns and tests. |  | `conclusion_summary`: The ownership table. → The principle it encodes. |\n\n### Language Analysis per Country\n\n**Controlling idea** (`explanation`, id `analysis`): Most silent failures start in per-language analysis, so each mechanism needs a deliberate rule and every change needs a token-parity test.\n\n**Advances the thesis** (Q2): Shows that analyzers handle text and must stay in parity, while meaning comes from the dictionary.\n\n**Transition in:** `sequence`: The compiler and its owners. → The first step a query meets: analysis per language.\n\n**Order of paragraphs** (`grouping`): The claim first, then the four mechanisms, then the multilingual case that combines them, then the migration rule that protects them all.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p21 | claim | Analysis is the source of most silent failures in query understanding, and four mechanisms matter for European listing marketplaces. |  |  |\n| p22 | recommendation | Tokenizers must handle hyphens, digits and units by indexing and querying several forms of a token and explicit patterns for units and model codes. | example: 'e-bike' split to 'e' and 'bike' versus left unequal to 'ebike'; '28 inch', '28\"', '28 duim' for one wheel size. | `sequence`: Four mechanisms matter. → The first: tokenization. |\n| p23 | evidence | Accent and character folding should be asymmetric: Vinted indexes accented and folded forms so that an unaccented query matches both while an accented query matches only the accented form. | fact: Vinted's 2026 autocomplete indexes accented and ASCII-folded forms across 24 languages; 'z' matches 'Zara' and 'Žalgiris', 'Ž' only the accented form. | `sequence`: Tokenization. → Folding. |\n| p24 | recommendation | Stemming helps recall and occasionally hurts precision, so brand and model names should be protected with a keyword list. |  | `sequence`: Folding. → Stemming. |\n| p25 | recommendation | Decompounding must let buyers and sellers who split or join compounds differently meet, and its word list should come from the category vocabulary and attribute values. | source: Elastic's hyphenation decompounder 'was built for Germanic languages' and keeps only sub-words in a supplied list ('Kaffeetasse' to 'Kaffee' and 'tasse'). | `sequence`: Stemming. → Decompounding. |\n| p26 | recommendation | In bilingual markets the system detects the query language, analyzes accordingly against language fields, and tags against one dictionary in both languages, which is a reason to localize the dictionary rather than the index. |  | `elaboration`: Mechanisms within one language. → Markets with two languages and one inventory. |\n| p27 | recommendation | Analyzer parity is a migration risk, so every engine or analyzer change should run a per-language test set of real queries and compare tokens before and after. | fact: Vinted contributed Lucene analyzers to Vespa when it moved from Elasticsearch so language analysis carried over.; scenario: Veldmark's test set is 5,000 queries per market across head, torso and tail. | `cause_effect`: Analysis choices that differ per language. → Why changing any of them is a risk to test. |\n\n### Spelling and Synonyms\n\n**Controlling idea** (`recommendation`, id `spelling-synonyms`): Spelling correction and synonyms work best on the marketplace's own vocabulary, and synonyms should hold only text equivalence, with meaning left to the dictionary.\n\n**Advances the thesis** (Q2): Confines text configuration to text and moves meaning into the dictionary.\n\n**Transition in:** `sequence`: Analysis of tokens. → Correcting and equating tokens.\n\n**Order of paragraphs** (`grouping`): Two text-level tools grouped: generic fuzziness, then the marketplace speller that beats it, then synonyms and their rules. Vinted's exact-prefix evidence sits in the autocomplete section, where the system it comes from is described; here it was a forward reference (draft-check round 2).\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p28 | evidence | Engine fuzziness is a cheap fallback but is blind to the marketplace's vocabulary. | source: Elasticsearch AUTO fuzziness: no edits up to two characters, one for three to five, two for longer; it matches 'golf' to 'gold'. |  |\n| p29 | recommendation | A marketplace speller built daily from listings, successful queries and the attribute dictionary works better, auto-correcting only when the original returns few results and protecting brands and model codes. |  | `contrast`: Engine fuzziness blind to the vocabulary. → A speller whose vocabulary is the marketplace's own. |\n| p31 | recommendation (list) | Three rules keep synonyms from rotting: apply them at search time, mine candidates from behavior and approve them by hand, and prefer structure to synonyms where structure exists. | source: Elastic's synonym_graph filter is designed for search analyzers, handles multi-word synonyms and can be updateable.; example: 'speed pedelec = e-bike' would send moped buyers into bicycles.; example: 'e-bike' and 'elektrische fiets' tagged to the category rather than made textual synonyms. | `sequence`: Spelling correction. → Synonyms, the other place text configuration rots. |\n\n### Query Categorization and Attribute Extraction\n\n**Controlling idea** (`explanation`, id `categorization`): Categories and attribute values are predicted against the taxonomy and dictionary, and a confidence policy decides whether each becomes a filter, a boost or a suggestion, always visibly.\n\n**Advances the thesis** (Q2, Q3): Shows the structural core of compilation and the policy that applies it.\n\n**Transition in:** `sequence`: Text-level steps. → The structural steps: category, attributes, and the policy that applies them.\n\n**Order of paragraphs** (`chronological`): Category, then attributes and places, then why both depend on the dictionary, then the policy that acts on their output and its invariants; the policy cannot be stated before the categorizer and tagger produce the confidences it acts on.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p32 | explanation | Query categorization is a text classifier trained on behavioral query-category pairs that outputs a distribution over categories, not a single answer. | example: 'golf' on Tradeyard is ambiguous between golf equipment and Volkswagen Golfs; 'golf tas' is not. |  |\n| p33 | claim (list) | Three properties separate a production categorizer from a demo: it is versioned with the taxonomy (with mapping events as the bridge for new labels), calibrated, and monitored as an order-tier model. | reasoning: Without the mapping-event bridge a taxonomy change is a relevance regression: The Category Straitjacket reaching search.; scenario: Veldmark classes search models as 'order' models that decide what buyers see (ml-platform). | `elaboration`: What a categorizer is. → What makes one fit for production. |\n| p34 | explanation | Attribute tagging matches spans to dictionary values and aliases, with a sequence model for ambiguity, while location tagging relies on the gazetteer from the location model. | example: 'Lyon 7' an arrondissement; 'Den Bosch' for 's-Hertogenbosch; 'Essen' a city in Germany and a municipality in Belgium. | `sequence`: Predicting the category. → Tagging attributes and places, the second structural output. |\n| p35 | claim | The dictionary is the hard dependency: a tagger can map only to an attribute that exists once with its aliases, so The Attribute Junkyard defeats query understanding before any model runs. | example: One bike.wheel_size with aliases '28 inch', '28 duim', '28\"' versus four free-text keys. | `cause_effect`: The tagger's matching against dictionary values. → What happens when the dictionary is missing. |\n| p36 | claim | Verticals and markets change what a tag means, so these meanings belong in the dictionary per market, not in tagger code. | example: Hearthly France 'T3' is three main rooms, not three bedrooms; Hearthly Spain '3 habitaciones' is three bedrooms; Motorvane 'golf 8' is the eighth generation. | `elaboration`: The dictionary as the dependency. → Per-market meanings it must hold. |\n| p37 | recommendation | The recommended policy maps each interpretation's confidence to an action, filter, boost or suggest, and shows every applied interpretation to the buyer as a removable chip. | table: High (for example 0.85 or more, calibrated): filter with a removable chip; medium: boost and suggestion chip; low: suggest only; conflicting: both as options; with the risk if wrong for each. | `sequence`: The structured interpretations the categorizer and tagger produce. → How they become part of the query. |\n| p38 | recommendation | Two invariants keep the policy honest: adding an interpretation must never increase the result count, and a chip the buyer removes is a training label. | source: Vinted in 2025 reported that approximate retrieval could make results inconsistent with filters and set the goal that adding a filter should not increase results. | `elaboration`: The confidence-to-action policy. → The two rules that keep it honest. |\n\n### Null and Low-Result Recovery\n\n**Controlling idea** (`process`, id `recovery`): Thin results should be recovered with an explicit ladder ordered from least to most change to what the buyer asked, never silently removing the buyer's own filters.\n\n**Advances the thesis** (Q3): Defines the relaxation order that makes interpretations safe.\n\n**Transition in:** `problem_solution`: Interpretations that may filter too much. → What happens when they return too little.\n\n**Order of paragraphs** (`large_to_small`): The whole ladder, then the rule that bounds every step, then the one step with value beyond the search; the bound only makes sense once the steps are known.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p39 | process | A null result is a failed match between demand and supply, often an artifact, so the recovery ladder should be explicit and ordered from least to most change. | table: Seven steps: correct spelling, drop the least-confident machine interpretation, all-terms to most-terms, widen the radius, broaden to the parent category, fill with dense retrieval, offer a saved search. |  |\n| p40 | recommendation | The ladder never removes a filter the buyer chose without saying so, and a thin result is a chance to show labeled close alternatives. | source: Airbnb has published work on augmenting narrow searches with recommendations. | `elaboration`: The ladder's steps. → The rule that bounds it and the lesson from public work. |\n| p41 | analysis | The last step matters for liquidity because a saved search after a null result is standing demand alerts can serve. |  | `emphasis`: The ladder as a whole. → Why its last step matters. |\n\n### Autocomplete and Query Suggestions\n\n**Controlling idea** (`explanation`, id `autocomplete`): Autocomplete reuses every earlier step to steer queries, before they are submitted, toward ones the system already understands, and for listings it should suggest only what returns inventory, attach interpretations and filter its candidates for safety.\n\n**Advances the thesis** (Q3): Applies interpretations before the query is typed in full.\n\n**Transition in:** `elaboration`: The steps from analysis to recovery, now all defined. → Autocomplete, which reuses all of them at the earliest point, before the query is submitted.\n\n**Order of paragraphs** (`small_to_large`): The documented case, what its fuzzy cascade shows about correction, then the general rules drawn from it; the rules would be unsupported assertions without the case before them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p42 | evidence (list) | Vinted's April 2026 account is the most complete public description of a marketplace autocomplete: candidates, ranking, matching, serving and results. | statistic: About 125 million suggestions over more than 50 country-language combinations, query-log candidates about 2% of the pool and about half of clicks; LightGBM LambdaRank over 63 features; edge n-grams cutting matching p99 from about 220 ms to 25 ms; about 4,700 queries per second at 31 ms p99; debounce cut from 350 ms to 100 ms; suggestion use from under 8% to over 17% of sessions. |  |\n| p30 | evidence | The same Vinted account shows that fuzzy correction is usually not needed, since its cascade stops early and most requests resolve at exact prefix. | statistic: Fuzzy cascade from exact prefix to edit distance 1 to 2, stopping at ten suggestions; about 62% of requests resolved at exact prefix.; figure: Figure 2: autocomplete as an offline pipeline that builds and scores candidates and an online path that matches and re-ranks per user. | `additional_support`: Vinted's autocomplete system and its matching step. → What its fuzzy cascade shows about how often correction is needed. |\n| p43 | recommendation (list) | Three design rules follow for listing marketplaces: suggest only what returns inventory, attach interpretations to suggestions, and filter the candidate pool for safety. |  | `cause_effect`: Vinted's system and what its cascade shows. → The rules a listing marketplace draws from it. |\n\n### Semantic and Hybrid Retrieval\n\n**Controlling idea** (`evidence`, id `hybrid`): Dense retrieval is a capped layer that fills recall gaps under every buyer filter, fused with lexical results and handed to ranking, not a replacement for structured retrieval.\n\n**Advances the thesis** (Q4): Places embeddings as a layer over the structured core.\n\n**Transition in:** `sequence`: The structured core, from analysis to autocomplete. → The first layer above it: embeddings.\n\n**Order of paragraphs** (`small_to_large`): The cases, what their difference shows, how results are fused, then the recommendation and its costs; the recommendation rests on the cases and would read as opinion before them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p44 | evidence (list) | Dense retrieval addresses vocabulary mismatch and image-led categories, and the 2023 to 2026 record shows how marketplaces use it. | case: Vinted, November 2025: two-tower model with frozen multilingual CLIP query tower, HNSW in Vespa split by market blocs, RRF fusion in global ranking with a cap on dense-only matches, low-recall sessions filled first, about 50 A/B tests, about a month and 1 TB for image embeddings.; case: Airbnb, January 2026: IVF over HNSW because HNSW memory grew under real-time updates and made filters hard; cluster IDs as a Lucene filter; listing tower in daily batch.; case: leboncoin, 2023 press report: CamemBERT retriever with ANN in Elasticsearch and a neural re-ranker; primary post unverified and about three years old. |  |\n| p45 | analysis | The two detailed cases reached different answers to the same problem for documented reasons, so the choice depends on filter selectivity, update rate and the engine in use. |  | `contrast`: Vinted's and Airbnb's designs. → Why neither is generally right. |\n| p46 | comparison | Hybrid retrieval needs a way to merge lists whose scores are not comparable, and the Lucene world offers reciprocal rank fusion as the default and score normalization when weights are tuned per market. | table: RRF (Elasticsearch RRF retriever, rank_constant default 60; OpenSearch score ranker from 2.19; Vespa at Vinted) against score normalization (OpenSearch normalization processor from 2.10, min_max and arithmetic_mean by default). | `sequence`: Dense and lexical retrieval run together. → How their results are merged. |\n| p47 | explanation | Fusion produces candidates and does not replace ranking, which takes the fused set. |  | `contrast`: Fusion methods. → What fusion does not do. |\n| p48 | recommendation | The recommendation is to use dense retrieval to fill recall gaps, not to replace structured retrieval, capping dense-only results and respecting every buyer filter. |  | `conclusion_summary`: The cases and fusion options. → Where dense retrieval belongs. |\n| p49 | analysis | Dense retrieval has real costs and new failure modes, which is why it stays a capped layer. | example: Embeddings per listing, ANN memory, an embedding call per query; Vinted's tokenizer quirk flooding a brand-filtered 'zx750' query with about 7,000 extra dense matches.; figure: Figure 3: a structured core with a capped dense ring and an LLM translator compiling into validated filters. | `contrast`: The recommendation to use dense retrieval. → Its costs. |\n\n### Natural-Language and Conversational Search with LLMs\n\n**Controlling idea** (`evidence`, id `llm`): In every documented case the LLM compiles language into the existing structured query, validated against the dictionary, and that pattern bounds its cost and risk.\n\n**Advances the thesis** (Q4): Shows language models as the second layer, emitting the same validated filter form.\n\n**Transition in:** `sequence`: Dense retrieval as the first layer. → Language models as the second.\n\n**Order of paragraphs** (`small_to_large`): The cases, how to read them, the pattern they share, its properties and limits, then external assistants as the same pattern outside the marketplace.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p50 | evidence | Since 2023 several listing marketplaces have published natural-language search features, and none of the documented cases replaces retrieval with generation: the LLM compiles into the existing structured query or orchestrates existing search tools. | table: coches.net 2024 (moderation call, Claude Haiku on Bedrock converting to filters, about 6,000/500 tokens, about 20,000 calls and about €19 a day, adoption 'still limited'); leboncoin 2024 assistant (GPT-3.5 Turbo to JSON for the search API, Assistants API rejected over storage); leboncoin cars 2024 (users 'are not aware of the benefits'); OLX Magic 2024 (agent with tools, about 5-10 s latency); Zillow 2023/2024 (no architecture published); Rightmove 2026 'Ask Rightmove' (about 40% time-on-site uplift, roughly double lead propensity, H1 2026). |  |\n| p51 | explanation | Model names, prices and feature availability in the table are dated evidence, not current product facts. |  | `emphasis`: The table of cases. → How to read its figures. |\n| p52 | process | In the shared pattern, the LLM receives the query, the market and a compact filter schema from the dictionary, returns a structured query that a validator checks against the dictionary, and the classic engine runs it with the filters shown as chips. | figure: Figure 4: the LLM compiles, the engine retrieves, validation against the attribute dictionary keeps hallucinated values out, chips keep the interpretation editable. | `conclusion_summary`: The cases. → The pattern they share. |\n| p53 | analysis | The pattern has five properties to defend in a design review: explainable results, no hallucinated listings, cacheable output, bounded cost for keyword queries, and saveable structured queries. |  | `elaboration`: The compiler pattern. → What it gives an architecture. |\n| p54 | analysis | Its limits are latency and data protection, so the compiler should run only for queries that need it and query text falls under retention rules and provider terms. | case: leboncoin rejected a hosted assistant API because messages would be stored on the provider's servers. | `contrast`: The pattern's properties. → Its limits. |\n| p55 | analysis | External AI assistants have become a new client of marketplace search, which turns the search contract into an external product and the marketplace's validator into the line of defense. | source: ImmoScout24's MCP server (launched November 2025) and app inside ChatGPT, described in two 2026 posts; Rightmove's FY2025 results report an app submitted to the ChatGPT ecosystem. | `elaboration`: The LLM compiler inside the marketplace. → The same compiling done by an external model. |\n\n### Evaluating Query Understanding\n\n**Controlling idea** (`recommendation`, id `evaluation`): Because query understanding fails quietly, evaluation must be a shared group asset with market-specific data, refreshed after every taxonomy release.\n\n**Advances the thesis** (Q5): Gives every step an offline and online measure and an owner.\n\n**Transition in:** `sequence`: The steps and layers of query understanding. → How to measure them.\n\n**Order of paragraphs** (`large_to_small`): The shared harness and its measures per layer, then two lessons on how to measure, then the refresh rule that ties evaluation to the taxonomy; the refresh rule needs the query sets the first paragraph introduces.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p56 | recommendation | Query understanding fails quietly, which makes evaluation the part teams skip, so the harness should be a shared group asset with market-specific data. | table: Offline and online measures for analysis, spelling, categorization, tagging, recovery, dense retrieval and the LLM compiler. |  |\n| p57 | evidence | Two lessons from the public record apply: replaying production traffic tracks A/B results better than logged-data recall, and a simple structured diff of expected and generated queries catches compiler regressions. | source: Airbnb found offline recall on logged data tracked online results poorly and replayed traffic tracked A/B results better.; source: leboncoin's deliberately simple structured-diff evaluation. | `additional_support`: The measures per layer. → What the public record teaches about measuring them. |\n| p58 | recommendation | Query sets must be refreshed on a schedule and after every taxonomy release, because the right answer changes the day a category appears. |  | `cause_effect`: Evaluation sets. → Why they age with the taxonomy. |\n\n### In Practice: Tradeyard's E-Bike Queries Through the Bikes Split\n\n**Controlling idea** (`example`, id `in-practice`): Applied to the bikes split, one vocabulary, analyzer fixes, a prepared categorizer and a confidence policy sent 10 of 11 variants to the e-bikes category, a gain from vocabulary and policy rather than a model.\n\n**Advances the thesis** (Q1, Q2, Q3, Q5): Shows the whole design working on the opening scene's problem.\n\n**Transition in:** `problem_solution`: The design and its evaluation. → The opening scene's question answered.\n\n**Order of paragraphs** (`chronological`): The plan's four parts in the order the sections taught them, then the outcome, what it shows, and the next projects that add the layers.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p59 | transition | Priya's and Tomasz's plan for 1 November had four parts, each applying a section of the chapter. |  |  |\n| p60 | example | One vocabulary entry with aliases per language and an explicit exclusion routing 'speed pedelec' to mopeds was read by both the tagger and the categorizer. | scenario: Aliases 'ebike', 'e-bike', 'e bike', 'e-fiets', 'elektrische fiets', 'fiets met trapondersteuning', 'vélo électrique', 'rower elektryczny', 'bicicleta elétrica'; speed pedelec to mopeds.; figure: Figure 5: one vocabulary entry sent 10 of the 11 variants to e-bikes and routed speed pedelec to mopeds. | `sequence`: The four-part plan. → The first part: vocabulary. |\n| p61 | example | The Dutch analyzer was changed to index and query joined and split forms with a compound list from category labels and attribute values, and checked against the same 5,000-query test set on Solr and OpenSearch. | scenario: 'elektrischefiets' and 'damesfiets' decompose; 5,000-query Dutch test set. | `sequence`: Vocabulary. → Analysis fixes. |\n| p62 | example | Old bike listings were relabeled from mapping events and backfilled e-bike attributes, giving the categorizer labels before any buyer used the category, and the model was registered as an owned, monitored order-tier model. | scenario: Motor position and battery capacity from the backfill; prediction-distribution monitor; Priya's team as owner; group registry decided on 9 November later made this mandatory. | `sequence`: Analysis fixes. → The categorizer. |\n| p63 | example | An e-bike interpretation at calibrated confidence of at least 0.85 becomes a filter with a chip, between 0.5 and 0.85 a boost and suggestion, and fewer than 20 results within the radius triggers the ladder, widening the radius before broadening to all bikes. | scenario: Thresholds 0.85 and 0.5; fewer than 20 results. | `sequence`: The categorizer. → Policy and recovery. |\n| p64 | evidence | The outcome was measured over four weeks after the split against four weeks before, on Tradeyard NL bike searches with e-bike intent. | table: Variants landing in e-bike inventory 4 of 11 to 10 of 11; top-50 overlap under 50% to about 90%; null or under-five rate 6.1% to 2.4%; chip-removal 3.8%; search-to-contact +11% relative. | `cause_effect`: The four parts of the plan. → What they produced. |\n| p65 | analysis | These are Veldmark illustrations whose shape generalizes: the biggest gain came from vocabulary and policy, not a model, and the chip removals became a training signal. | scenario: Most removals came from 'e-bike accu' (battery) searches by buyers wanting parts, leading to an e-bike parts interpretation. | `elaboration`: The measured outcome. → What it shows and how it fed back. |\n| p66 | example | Two further projects show where Veldmark is going: Hearthly France tests an LLM compiler on long queries only, and Motorvane extends its tagger with generation codes. | scenario: About 6% of Hearthly search traffic; 'T3 balcon Lyon 7 moins de 400k' compiles to rooms 3, balcony, Lyon 7e and a €400,000 ceiling and returns the Lyon apartment at €389,000; 'golf 8' as the Essen Volkswagen Golf's generation. | `sequence`: The bikes outcome. → The next projects, which add the layers. |\n\n### Trade-offs\n\n**Controlling idea** (`comparison`, id `trade-offs`): Each choice in the chapter, where meaning lives, how aggressive the policy is, how spelling is corrected, how retrieval runs and how natural language is handled, has conditions under which each option is right.\n\n**Advances the thesis** (Q2, Q3, Q4): Tests the design against its alternatives.\n\n**Transition in:** `contrast`: Veldmark's choices. → The alternatives and when they are right.\n\n**Order of paragraphs** (`comparison`): One lead-in and one table; it follows the worked example so the reader judges the alternatives against a design already seen working.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p67 | comparison | Each design choice has an option that is right under some conditions and wrong under others, and the table pairs them. | table: Where meaning lives, interpretation policy, spelling, retrieval and natural language, each with two options and when each is right or wrong. |  |\n\n### Vertical Differences\n\n**Controlling idea** (`comparison`, id `verticals`): Real estate and automotive have the richest structured vocabularies, which favors tagging and LLM compiling, while general classifieds have the broadest, which favors categorization and autocomplete.\n\n**Advances the thesis** (Q2): Shows how the vocabulary shapes which lever matters per vertical.\n\n**Transition in:** `elaboration`: Trade-offs in general. → How they differ by vertical.\n\n**Order of paragraphs** (`comparison`): One table and its reading; it follows the general trade-offs because it shows how the same choices shift by vertical.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p68 | analysis | Real estate and automotive have the richest structured vocabularies, making tagging and LLM compiling most effective there, while general classifieds have the broadest vocabulary, making categorization and autocomplete the main levers. | table: Typical query, hardest problem, what tagging maps to, spelling vocabulary, natural-language value and dense-retrieval value across general classifieds, real estate, automotive and jobs. |  |\n\n### Failure Modes\n\n**Controlling idea** (`cause_effect`, id `failure-modes`): Each failure breaks one of the chapter's rules, and its fix is the rule it breaks.\n\n**Advances the thesis** (Q2, Q3, Q4, Q5): Shows what breaks when each rule is skipped.\n\n**Transition in:** `contrast`: What the design does right. → What goes wrong without it.\n\n**Order of paragraphs** (`chronological`): In the order the chapter taught the rules each failure breaks: analysis, synonyms, categorization, the confidence policy, autocomplete, dense retrieval and the LLM compiler.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p69 | cause_effect | Analyzer drift from an engine upgrade or analyzer change quietly changes results; keep token-parity tests in continuous integration. |  |  |\n| p70 | cause_effect | Synonyms as the dumping ground: every complaint becomes a synonym until nobody can explain the file; move meaning into the dictionary. |  | `additional_support`: One failure. → The next. |\n| p71 | cause_effect | Taxonomy changes without a categorizer plan leave the categorizer predicting old categories; version models with the taxonomy. |  | `additional_support`: One failure. → The next. |\n| p72 | cause_effect | Invisible filters: applied interpretations without chips leave buyers unable to recover and the team unable to learn. |  | `additional_support`: One failure. → The next. |\n| p73 | cause_effect | Autocomplete without live counts leads buyers to empty results or offensive strings; join inventory counts and filter candidates. |  | `additional_support`: One failure. → The next. |\n| p74 | cause_effect | Dense results that ignore filters return listings outside the buyer's filters; enforce filters on every path and test the invariant. |  | `additional_support`: One failure. → The next. |\n| p75 | cause_effect | Unvalidated LLM output returns categories or values that do not exist; validate every output against the dictionary. |  | `additional_support`: One failure. → The next. |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `chief-architect`): Query understanding is a group concern held by five decisions, one vocabulary with many policies, order-tier governance for every model, a query checklist in every taxonomy release, LLMs that compile while engines retrieve, and shared evaluation, watched through a few rates.\n\n**Advances the thesis** (Q2, Q3, Q4, Q5): Turns the chapter into group decisions and signals.\n\n**Transition in:** `sequence`: Failures to avoid. → Decisions to hold at group scale.\n\n**Order of paragraphs** (`large_to_small`): The decisions first, then the signals that show whether they hold; a signal means nothing until the decision it monitors is stated.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p76 | recommendation (list) | Query understanding is a group concern because it is where search meets the shared vocabulary, and five decisions hold the line at Veldmark. | scenario: One vocabulary, many policies; every model in the query path an order-tier model; a query-understanding checklist in every taxonomy release; LLMs compile, engines retrieve, through the AI gateway with Lucía Ortega's data-protection review; evaluation as a shared asset. |  |\n| p77 | recommendation | What to watch is null and low-result rates, chip-removal rates, the traffic share each layer touches, LLM cost per thousand queries and evaluation-set age, with a rising chip-removal rate after a taxonomy release as the earliest sign of drift. |  | `sequence`: The decisions. → The signals that show whether they hold. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Ten questions let a reader test their own marketplace's query understanding in a design review.\n\n**Advances the thesis** (Q5): Hands the reader a review instrument.\n\n**Transition in:** `sequence`: The Chief Architect's decisions. → Questions to put to one's own system.\n\n**Order of paragraphs** (`chronological`): One list of questions, roughly in the order the chapter taught the steps.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p78 | recommendation (list) | Ten questions cover query mix, where meaning lives, which interpretations are filters, null results, new categories, token parity, autocomplete, dense filters, LLM validation and cost, and model owners. |  |  |\n\n## Conclusion: From Retrieval to Order\n\n**Synthesis:** Every part of the chapter compiles the buyer's words into one form, a category and filters from one shared vocabulary applied with a stated confidence and a way back, which is why the e-bike gain came from vocabulary and policy rather than from a model, and why the layers above emit the same form.\n\n**So what:** A taxonomy release without query aliases, categorizer labels and evaluation sets is a relevance regression, so the architect puts them into every release and watches chip-removal and null-result rates.\n\n**Callback:** The opening queries 'ebike gazelle', 'golf 8 automatik' and 'T3 balcon Lyon 7' as requests for filters in disguise. The conclusion returns to those buyers and says that each section compiled their words into the marketplace's filters.\n\n**Takeaway** (`course_of_action`): Put query aliases, categorizer labels and evaluation sets into every taxonomy release, and watch chip-removal and null-result rates per market.\n\n**Hand-off** to [Ranking for Two Sides: Relevance, Freshness and Paid Visibility](ranking.html): `sequence`: The structured query and the candidates it retrieves, which say what the engine finds but not the order in which buyers see it. → Ordering those candidates as a negotiation between relevance, freshness, seller fairness and paid visibility.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p79 | synthesis | The buyers in the opening were asking for filters, and every part of the chapter compiles their words into one form, a category and filters from one shared vocabulary applied with a stated confidence and a way back; that is why the e-bike gain came from vocabulary and policy, and why a taxonomy release without query aliases, categorizer labels and evaluation sets is a relevance regression. |  |  |\n| p80 | transition | Query understanding decides what the engine retrieves but not the order in which buyers see it, which is a negotiation between relevance, freshness, seller fairness and paid visibility and the subject of the next chapter, ranking. |  | `sequence`: What the engine retrieves. → The order of results, in the next chapter. |\n\n## Non-goals\n\n- Engine, document and index design. See [Search Architecture for Listings: Indices, Freshness and Scale](search-architecture.html).\n- Ordering of results, learning to rank and paid blending. See [Ranking for Two Sides: Relevance, Freshness and Paid Visibility](ranking.html).\n- Category tree design and migrations; attribute dictionary design. See [Category Trees That Can Change: Designing Marketplace Taxonomies](categories-and-taxonomies.html), [Attributes Without Chaos: Schemas, Dictionaries and Validation](attribute-schemas.html).\n- Geo semantics and map queries. See [Where Is It? Location, Geocoding and Privacy](location-and-geo.html), [Searching by Place: Map, Polygon and Commute Search](map-search.html).\n- Recommendation candidate generation; ML platform governance. See [Recommendations for Inventory That Disappears](recommendations.html), [Models in Production: ML Platforms and Use Cases](ml-platform.html).\n- Broader AI strategy. See [AI Across the Listing Lifecycle](ai-in-listing-systems.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- No primary source documents query categorization or spelling systems at OLX, Marktplaats, Kleinanzeigen or leboncoin; the chapter relies on reference-architecture reasoning there. (Carried over from spec.md.)\n- The leboncoin retriever details rest on a press report; the primary Medium post was not verifiable. (Carried over from spec.md.)\n- Outcome metrics for LLM search are thin (Rightmove's H1 2026 figures are the only quantitative claim); revisit when more are published. (Carried over from spec.md.)\n\n## Decision log\n\n- **2026-11-12** — Resolved the five corroborated round-3 draft faults under the author's delegation: p38 now names the path that adds listings back (a second retrieval path such as embedding search run without the filter n  - _journals/listing-systems-architecture/journal-spec.json — Intent outcome, acceptance criteria, thesis, role, the incoming transition and the hand-off relationship.\n  - posts/19-query-understanding/spec.md (accepted 2026-10-21) — Audience, non-goals, open questions, decision log, sources and changelog.\n  - search-architecture — Latency budget, analyzers, search contract.\n  - attribute-schemas, categories-and-taxonomies, ml-platform — Dictionary, bikes split, order-tier governance.\n  - _research/scenario-ledger.md — Veldmark's bikes-split query figures, thresholds and outcomes.\n- **External**\n  - Vinted Engineering (2024, 2025, 2026) — Analyzer parity, dense retrieval, autocomplete.\n  - Adevinta Tech Blog (2024) — coches.net and leboncoin LLM search.\n  - Abdool et al., Airbnb (2026) — IVF versus HNSW, replay evaluation.\n  - Rightmove plc results (2026); Scout24 Engineering (2026); HousingWire (2024); OLX Magic talk (2024) — LLM search features and external assistants.\n  - Elastic and OpenSearch documentation (n.d.) — Synonyms, decompounding, fuzziness, RRF, normalization.\n\n## Changelog\n\n- **2026-11-12** — Orchestrator review: restored the published link to the running example ('the generation of the Essen Volkswagen Golf'); a 2021 Golf is the eighth generation, so the published sentence was consistent with the ledger's 2021 model year. Check report stale.\n- **2026-11-12** — Draft check round 3: escalate (14 passed, 13 failed, all flow_is_followable). At close, Figure 2 moved after p30 and 'the Lyon apartment' changed to 'Veldmark's Lyon apartment'; remaining failures listed in open_questions. Check report stale after these edits.\n- **2026-11-12** — After draft-check round 2: p30 moved to the autocomplete section (spec fault, see decision log); prose revised at the failed units (roadmap wording, run-in lead-ins folded into the first definition and failure, inline glosses for two-tower, CLIP, HNSW, IVF, RRF and MCP, the registry sentence and the 'golf 8' sentence rewritten).\n- **2026-11-12** — After draft-check round 1: roadmap promise, p04 and the autocomplete section's transition changed (spec fault, see decision log); prose revised at the failed units (lead-ins for Concepts, Vertical Differences, Failure Modes and Questions; table explanation in evaluation; forward references and garbled sentences fixed).\n- **2026-11-12** — Converted spec.md to spec.json (outcome spec), reconstructed from the published index.md; spec.md removed. Status draft.\n- **2026-10-21** — Renamed failure patterns to match where-listing-systems-go-wrong. (AI-mediated session)\n- **2026-10-20** — Replaced 3 mermaid diagrams with generated illustrations (figure numbers and captions unchanged; sources archived in _research/mermaid-figures.json); Figure 1 kept attempt 3 with an extra arrow from the taxonomy and attribute dictionary to synonyms and expansions. (AI-mediated session)\n- **2026-10-20** — Consistency fix: 'filter compiler' to the glossary's 'query compiler'; architecture section renamed 'Architecture: Shared Vocabulary, Local Policy'. (AI-mediated session)\n- **2026-10-20** — Sharpening pass: 5,980 to 5,969 words; lead ties the chapter to Part IV's 'structure beats cleverness' argument; two paragraphs split. (AI-mediated session)\n- **2026-10-20** — Cross-chapter consistency sweep: 4 headings aligned with the book's shared section names; no body text changed. (AI-mediated session)\n- **2026-10-19** — Added 2 inline illustrations (article-illustrator); figures renumbered. (AI-mediated session)\n- **2026-10-19** — Editorial review pass: NL bike figures aligned with the editor line (380k bikes, 214k city bikes), Rightmove and Vinted claims tightened to source wording, Scout24 sources made specific, old evidence flagged, HNSW/CLIP expanded, AI-gateway links added. (AI-mediated session)\n- **2026-10-19** — Initial spec and article. (AI-mediated session)\n- **2026-11-12** — Resolved the round-3 escalation under the author's delegation: five draft fixes, two minor fixes, max_words 6,921 to 7,000, open questions reduced to the three sourcing notes.\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);

            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
