<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, acceptance criteria AC-1 to AC-3, the thesis and the role are copied unchanged from the transactions-and-payments entry in journal-spec.json; the hand-off uses monetization-models' transition_in. Units added, split or moved by this conversion: introduction roadmap p04, the concepts paragraph split into p11 and p12, a lead-in to the payment-model comparison table (p23), lead-ins to the Trade-offs (p47) and Vertical Differences (p50) tables, and two conclusion paragraphs (p67, p68).\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The transactional pivot, marketplace payments and buyer protection; hold and release, payout, dispute versus chargeback and PUDO.\n- **Know:** The four conditions under which taking part in the transaction pays, with the documented record of leboncoin, Kleinanzeigen, Marktplaats, OLX, Vinted and eBay, and the payment models (provider marketplace product, specialist payment institution, own licence, off-platform).\n- **Know:** The six contexts a pivot adds beside the listing core, the order state machine, and the regulatory switches it turns on (DAC7, payment licensing through partners).\n- **Believe:** The transactional pivot is a category decision, not a brand decision, and should be held as configuration that can be switched off.\n- **Believe:** Buyer protection is a liability with a product attached: the ledger, release rules and dispute desk ship with the checkout.\n- **Be able to:** Judge a 'let's go transactional' proposal against the four conditions and approve, narrow or decline it.\n- **Be able to:** Design the order state machine, its money boundaries and the ledger that receives order and money events.\n- **Be able to:** Name the owners a protected-payment category needs for disputes, reconciliation and DAC7.\n\n**Audience:** Chief architects, payments and marketplace engineering leads, and product and general managers of classifieds marketplaces considering or running in-platform payment, shipping and buyer protection.\n\n**Already knows:**\n\n- APIs, databases, event streams, search engines and Kubernetes (the book's baseline).\n- From earlier chapters: marketplace models and the marketplace profile register, liquidity, bounded contexts, the listing aggregate and its event stream, saved searches and alerts, trust-and-safety case management, fraud prevention, identity levels and payee verification, DSA statements of reasons and DAC7 from marketplace-regulation, and the conversation, lead and message safety gate from messaging-and-leads.\n- Veldmark, its brands and cast (Ingrid Halvorsen, Daan Visser, Felix Brandt, Julien Marchand), Yardstick, Safe Deal, Femke's bike and the phishing link, the Essen Golf, the Barcelona fake rentals, and the failure-pattern names.\n\n**Does not yet know:**\n\n- The transactional pivot, marketplace payments and buyer protection as terms.\n- Payment vocabulary: PSP and marketplace product, payee verification, hold and release, payout, merchant of record, dispute versus chargeback, PUDO; the PSD2 commercial-agent exclusion.\n- The documented record of the European horizontals' transactional launches and their economics.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given three transaction proposals and an unmatched clearing balance, the reader decides each and names what must come first. *Probe:* Your protected-payment service for second-hand goods earns a 7.4% take rate, but about €2.3 million of items in its clearing account match no order at month-end. Three proposals arrive: launch it in one more country of the same goods marketplace, add a secure payment for €20,000 private car sales, and hold rental deposits for a property portal. Using only this chapter: what do you decide for each, and what comes first? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** When and how should a classifieds marketplace move into transactions, and what does it take architecturally?\n\n> **Claim:** A classifieds marketplace should take part in the transaction per category, not per brand, and only where the item ships, the price is moderate (tens to a few hundred euros), the buyer's main fear is non-delivery and the sale is otherwise between strangers, gated as configuration per country and category so it can be switched off; a licensed provider's marketplace product should hold the money and verify payees, while the marketplace owns six contexts beside the listing core (order with availability and timers, payment edge, fees, shipping, buyer protection and disputes, and the transaction ledger with tax reporting), and the ledger, release rules and dispute desk ship with the checkout rather than after it.\n\n**Disputed by:** Two opposite views: that a classifieds marketplace should stay out of payments entirely to remain cheap to run and free of payment regulation, or that it should make every brand and category transactional to capture a take rate, launching the checkout as a product feature and adding the ledger and dispute handling once volume justifies them.\n\n**So what:** A Chief Architect who accepts this records the pivot per country and category in the marketplace profile register, gives no category protected payment without a named owner for disputes, reconciliation and DAC7, funds the transaction platform before any new country launches on it, keeps the order, the ledger and the seller's verification outcome in the marketplace's own systems with provider identifiers as references, and judges the pivot by protected share of eligible sales, dispute rate, buyer-protection losses as a share of GMV and month-end reconciliation breaks.\n\n**How and why:** Safe Deal processed 11.6 million orders worth about €1.02 billion in 2026 for €75 million of revenue, a 7.4% take rate with buyer-protection losses of about €4.1 million, yet at the December 2026 month-end about €2.3 million sat unmatched in a clearing account: refunds after payouts, label charges netted from settlements and partial refunds agreed in chat had no ledger to land in. The four conditions sorted the September 2027 proposals: Portugal approved on the rebuilt platform; Motorvane narrowed to a design study, since a 5% fee on the €21,900 Golf would be about €1,095; Hearthly's rental deposits declined as a Forced Fit. leboncoin, Kleinanzeigen and Marktplaats added payments for goods, not cars or homes, and OLX scaled its pay-and-ship flow back.\n\n**Supporting claims**\n\n- **T1** — Taking part in the transaction pays only where four conditions hold together (the item ships, the price is moderate, the buyer's main fear is non-delivery or misdescription, the sale is otherwise between strangers), so the pivot is decided per country and category and held as configuration that can be switched off, as the European horizontals' record shows.\n- **T2** — A licensed provider's marketplace product should hold the money and verify payees: an own licence pays only for payment-first marketplaces at very large volume, staying out gives up the trust and observability gains, and collecting for both parties does not fit the PSD2 commercial-agent exclusion.\n- **T3** — Even with a provider holding the money, the marketplace owns six contexts beside the listing core (order with availability and timers, payment edge, fees and pricing, shipping, buyer protection and disputes, transaction ledger and reporting), and the order, not the listing, becomes the system of record for the sale.\n- **T4** — Buyer protection is a liability with a product attached: evidence-based release rules, a dispute case desk, a loss provision and a ledger that explains every amount must ship with the checkout, or the pivot produces unreconciled money, as Safe Deal's €2.3 million clearing balance shows.\n- **T5** — Moving money on-platform turns on DAC7 reporting, trader-traceability and consumer-law duties and the provider's payment regulation, and makes the protected-payment brand a phishing target, so the launch decision is also a tax-reporting and safety decision.\n- **T6** — At group scale the transaction platform is shared only among the profiles that use it, with country parts as adapters, the provider treated as a strategic dependency whose identifiers are references, named owners for disputes, reconciliation and DAC7, and the pivot judged on trust and money metrics together.\n\n## Role in the part\n\nFollows the contact into the deal: decides where the marketplace takes part in the transaction and what it must then own, and adds the transactional revenue line the next chapter compares with the others. Supports P6-2, P6-6 of part `part-6`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in scene to forum: the forum's three proposals and clearing account are posed first and decided only after the framework is built; `grouping` in trade-offs, verticals, failure-modes, ca-view, questions: the book's standard judging sections)\n\nEach section supplies what the next one needs. The scene poses the decisions; the concepts give the terms every later section uses; the four conditions decide whether to take part before the payment models decide who holds the money, since a category that fails the conditions needs no model; the architecture then specifies what the marketplace owns once a provider holds the money; the two orders exercise that architecture, and only then can the forum's decisions be read as applications of conditions and platform together. Putting the architecture before the conditions would design a platform before the reader knows where it should run; putting the forum's decisions straight after the scene would give verdicts with no framework behind them. The judging sections follow the decisions they generalize.\n\n## Introduction\n\n**Hook** (`direct_statement`): For twenty years, the classifieds bargain was simple: the platform finds the buyer, and the buyer and seller sort out the money themselves. That bargain kept classifieds cheap to run and free of payment regulation, and it left the moment money changes hands entirely outside the platform's control.\n\n**Bridge:** The classifieds model the reader knows from Parts I to V and from messaging-and-leads: the marketplace's job ends at the contact, and advance-payment scams and fake payment links land in the gap it leaves. → Since about 2017 the large European horizontals have moved into that moment for some categories, so an offer accepted in chat now leaves a choice: step aside, or carry the deal through payment, shipping and buyer protection; the question is when, and what the platform must then own.\n\n**Thesis statement** (KEY POINTS callout (three bullets); paragraph p03 states the question the claim answers.): The transactional pivot is a category decision, not a brand decision, gated in configuration; a licensed partner holds the money while the marketplace owns everything around it; and buyer protection is a liability whose ledger, release rules and dispute desk ship with the checkout.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p04, which names the sections in order.):\n\n- Open with Veldmark's three transaction proposals and the unmatched clearing account. *Kept in:* scene.\n- Define the terms a transactional pivot brings. *Kept in:* concepts.\n- Set out the four conditions under which taking part pays. *Kept in:* when.\n- Compare who can hold the money. *Kept in:* payment-models.\n- Design the transaction platform: six contexts, the order state machine, shipping, disputes, the ledger and the regulatory switches. *Kept in:* architecture.\n- Test the design on two Safe Deal orders and the forum's decisions. *Kept in:* in-practice, forum.\n- Close with trade-offs, vertical differences, failure modes, the Chief Architect's view and questions to ask. *Kept in:* trade-offs, verticals, failure-modes, ca-view, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | The classifieds bargain, in which the platform finds the buyer and the parties settle the money themselves, kept classifieds cheap and unregulated but left the moment money changes hands outside the platform's control, which is where the industry's characteristic fraud lands. | reasoning: Advance-payment scams and fake payment links, owned by fraud-prevention. |  |\n| p02 | definition | From about 2017 the large European horizontals moved into that moment for some categories with in-platform payment, shipping labels and buyer protection, and the chapter names that move with three terms it owns: transactional pivot, marketplace payments and buyer protection. | example: A buyer in Utrecht paying a seller in Groningen for a phone without either trusting the other. | `contrast`: The bargain that left payment outside the platform. → The horizontals' move into payment, and the three terms for it. |\n| p03 | claim | The chapter starts where messaging-and-leads ends, with an offer accepted in chat, and asks when a listing marketplace should take part in the transaction and which systems it must then own, linking to RECONCILED for payments depth instead of re-teaching it. |  | `sequence`: The move into payment and the terms. → The previous chapter's endpoint, the chapter's question, its hand-off to monetization-models and the RECONCILED chapters it relies on. |\n| p04 | transition | The chapter runs from Veldmark's three proposals and clearing account through the terms, the four conditions, who holds the money and the transaction platform's design, to two Safe Deal orders and the forum's decisions, then trade-offs, vertical differences, failure modes, the Chief Architect's view and questions to ask. |  | `sequence`: The question and the scope. → The order of the sections. |\n\n## Sections\n\n### Setting the Scene at Veldmark: Three Proposals and a Clearing Account\n\n**Controlling idea** (`example`, id `scene`): In September 2027 Veldmark's forum had three proposals to extend protected payment, while the existing Safe Deal could not explain €2.3 million in its clearing account, so the group had to decide where to take part in transactions and what that requires first.\n\n**Advances the thesis** (T1, T4): Poses the chapter's question as three proposals to judge and a ledger gap that must be closed first.\n\n**Transition in:** `example`: The chapter's question and roadmap. → Veldmark's forum agenda as the case.\n\n**Order of paragraphs** (`chronological`): The forum and its chair first, then what Safe Deal already is, then the three proposals that want more of it, then the item nobody proposed, the clearing account, because it qualifies every proposal before it; the 2026 numbers table follows it so the reader sees the whole year, profitable and unexplained at once, next to the headline figures it details, before the closing sentence points to the framework. Placed among the 2027 orders (round 1), the table read as backstory in the middle of the worked examples.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | context | On 22 September 2027 Veldmark's architecture advice forum heard three transaction proposals together at Ingrid Halvorsen's request. | scenario: Wednesday 22 September 2027; Ingrid Halvorsen, Group Chief Architect; Veldmark introduced as the fictional group the book follows. |  |\n| p06 | example | Tradeyard Safe Deal, live in three countries on Adyen for Platforms, is a profitable third revenue line whose 2026 figures show the pivot already working for goods. | scenario: Launched NL 2024, BE 2025, PL 2026; parcel or pay at pickup; Adyen is the licensed party; 2026: 11.6 million orders, about €1.02 billion GMV, €75 million revenue (about €59 million buyer fees at 5% + €0.70, about €16 million label margin); third revenue line behind visibility products and professional subscriptions. | `elaboration`: The three proposals. → The product they all build on. |\n| p07 | example (list) | The three proposals ask to extend protected payment to Portuguese goods, German private car sales and Spanish rental deposits. | scenario: Tradeyard Portugal (Daan Visser), the one Tradeyard country without Safe Deal; Motorvane secure payment for private car sales (Felix Brandt); Hearthly Spain protected rental deposit (Julien Marchand) after the Barcelona ring of 26 accounts, 180 fake listings and about €71,000 from 63 people. | `sequence`: Safe Deal. → The three proposals that want more of it. |\n| p08 | example | Ingrid added the €2.3 million of unmatched Safe Deal items in clearing at the December 2026 month-end, arguing that Safe Deal had shipped its checkout before its ledger and that every proposal would make that worse. | scenario: About €2.3 million unmatched: refunds after payouts, label charges netted from settlements, partial refunds agreed in chat; a week of spreadsheet work to explain it. | `contrast`: Three proposals to grow Safe Deal. → A problem in Safe Deal as it stands. |\n| p08a | evidence | Safe Deal's 2026 numbers show a good business, a 7.4% take rate with losses an order of magnitude below revenue, that was still run as a feature on top of Yardstick until 2027. | table: Safe Deal 2026: 11.6 million orders; about €1.02 billion GMV, average about €88; €75 million revenue; about 78% shipped; about 1.3 million sellers paid, about 21,000 above the DAC7 test; disputes about 1.3%, about 70% resolved by agreement or return; losses about €4.1 million, 0.4% of GMV; chargebacks under 0.1%; about €2.3 million unmatched. | `contrast`: The unexplained clearing balance. → The year's numbers: a profitable line that was still run as a feature. |\n| p09 | transition | The rest of the chapter is the framework the forum used to decide. |  | `sequence`: The agenda and Safe Deal's numbers. → The framework that follows. |\n\n### Concepts: What Changes When the Platform Takes Part in the Sale\n\n**Controlling idea** (`definition`, id `concepts`): Taking part in the sale moves a category from a job that ends at the contact to one that ends at payment and delivery, and brings terms (order, marketplace payments, PSP, payee verification, hold and release, payout, merchant of record, buyer protection, dispute versus chargeback, PUDO) and two separations the rest of the chapter relies on.\n\n**Advances the thesis** (T2, T3): Defines the vocabulary and the two separations (money from risk, order from listing) on which the payment models and the contexts rest.\n\n**Transition in:** `sequence`: The forum's agenda and the need for a framework. → The terms the framework uses.\n\n**Order of paragraphs** (`large_to_small`): The change in the marketplace's job first, then the terms it brings, then the two separations that only make sense once order, PSP and buyer protection are defined.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | definition (list) | The transactional pivot moves a category from a job that ends at the contact to one that ends when payment and delivery are complete, and brings ten terms the classifieds side has rarely needed. | fact: Order, marketplace payments, PSP and marketplace product, payee verification (KYC, KYB), hold and release, payout, merchant of record, buyer protection, dispute versus chargeback, PUDO, each defined in one clause with links to payments-fundamentals and identity-and-verification. |  |\n| p11 | explanation | Holding the money and taking the risk are separate: the PSP holds the funds, but the marketplace pays a buyer-protection refund the seller cannot cover. |  | `elaboration`: The definitions of PSP and buyer protection. → The first consequence of putting them together. |\n| p12 | explanation | The order is a separate aggregate from the listing: a listing can have many conversations and orders, an order has one buyer, one seller and one price, and money belongs to the order. | source: listing-aggregate keeps availability on the listing and leaves everything about money to the order. | `additional_support`: One separation (money and risk). → A second (order and listing). |\n\n### When to Take Part in the Transaction\n\n**Controlling idea** (`claim`, id `when`): The pivot pays where four conditions hold together, and the dated record of the European horizontals (category-gated launches, margin-diluting economics and the trust case) supports deciding it per category.\n\n**Advances the thesis** (T1): States the four conditions and the public evidence for gating the pivot per category.\n\n**Transition in:** `sequence`: The terms. → The first decision they serve: whether to take part at all.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The conditions are asserted first so the evidence has something to support; the evidence runs from what companies did (category gating) through what it cost (economics) to why it is still worth it (trust); the rule of thumb and figure close the section once the reader has the reasons.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p13 | claim | The documented record suggests the pivot pays where four conditions hold together: the item ships, the price is moderate, the buyer's main fear is non-delivery or misdescription, and the sale is otherwise between strangers. | table: Four conditions, each with why it matters, strong fit and weak fit (phones and clothes versus sofas, cars and homes; tens to a few hundred euros versus tens of thousands; private distance purchases versus professional sellers; C2C goods versus dealer and agency sales). |  |\n| p14 | evidence | Category gating is what the European horizontals did: leboncoin, Marktplaats and Kleinanzeigen launched payments for selected goods categories, and mobile.de earned essentially no transactional revenue. | source: Adevinta Annual Report 2019 (leboncoin, 2019); Marktplaats 2017, 2019; eBay Kleinanzeigen Sicher bezahlen, October 2020, initially toys, phones, PCs and notebooks (onlinemarketing.de, 2020); mobile.de 2023 (Adevinta Annual Report 2023). | `additional_support`: The four conditions. → Dated evidence that companies applied them by category. |\n| p15 | evidence | The economics are documented too: transactional revenue grows but dilutes margin and adds direct costs, and OLX scaled its pay-and-ship flow back. | statistic: Adevinta transactional revenue €103 million in 2023, about 6% of group revenue; France EBITDA margin down two points; direct costs from payment and shipping providers; OLX Pay&Ship (OLX Tech, 2023) and Prosus' de-prioritisation of pay-and-ship in Europe (FY25, 2025). | `additional_support`: Evidence of how the pivot was gated. → Evidence of what it costs. |\n| p16 | evidence | The trust case is the strongest argument: in-platform payment turns an unrecoverable push-payment fraud into a dispute the platform can resolve. | source: Which? (December 2024): eBay, Vinted, Depop, Shpock, Preloved and Amazon Marketplace offered some buyer protection; Facebook Marketplace, Gumtree and Nextdoor did not, and a quarter of their buyers believed theirs did. | `contrast`: The costs. → The benefit that justifies them. |\n| p17 | recommendation | The author's rule of thumb is to take part where the platform's presence removes a fear that stops sales, and stay out where professionals already carry that fear. | figure: Figure 1: a four-layer sieve that passes small shippable goods to protected payment and diverts cars and homes to contact only. | `conclusion_summary`: The conditions and the evidence. → The rule the author draws from them. |\n\n### Payment Models: Who Holds the Money\n\n**Controlling idea** (`comparison`, id `payment-models`): A marketplace in the EU can use a licensed provider's marketplace product, hold a licence itself or stay out of the flow of funds, and for a classifieds group the provider's product is the normal answer.\n\n**Advances the thesis** (T2): Compares the payment models with documented provider behavior and concludes for the provider's marketplace product.\n\n**Transition in:** `sequence`: Where to take part. → The next decision once a category qualifies: who holds the money.\n\n**Order of paragraphs** (`comparison`): The three options are introduced, then each is described in the order classifieds groups use them (provider product, specialist institutions, own licence, staying out), with the legal reason against the improvised fourth option; the comparison table follows once each row has been explained, and Veldmark's choice ends the section.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | claim | A marketplace that wants to collect from buyers and pay sellers in the EU has three basic options (a licensed provider's marketplace product, its own licence, or staying out of the flow of funds); the comparison counts five models because it splits the first by merchant of record and gives specialist institutions their own row; classifieds groups have used the first. |  |  |\n| p19 | description | A licensed provider's marketplace product onboards and verifies sellers, collects, holds, splits and pays out, and its charge type decides who carries refunds and chargebacks first. | quotation: Adyen documentation: onboard users, process payments, pay out; verify users; split payments, deduct costs, hold funds until payout. Stripe Connect: direct charges, destination charges, separate charges and transfers; for the latter two 'refunds and chargebacks reduce your platform's balance'. | `elaboration`: The first option. → How a provider's marketplace product works. |\n| p20 | evidence | Specialist marketplace payment institutions serve the same need, and the classifieds record shows providers changing over time. | source: Online Payment Platform carried Marktplaats' flow in 2017 and eBay Kleinanzeigen's in 2020 (Worldline, 2022; t3n, 2023); Kleinanzeigen's help page named Adyen in October 2026, change date not public; leboncoin trusted third party since 2018 with Adyen (Wikipedia, 2026). | `similarity`: General providers' marketplace products. → Specialist institutions doing the same job. |\n| p21 | explanation | Holding a licence yourself brings safeguarding, capital, supervision and a ledger of your own, and it pays only when payments are the core of the product at large volume. | source: Vinted Pay: e-money licence from the Bank of Lithuania (2023), members moved onto its wallet from January 2026, 'expected to reduce payment-related costs and dependencies' (Vinted, 2026). | `contrast`: Using someone else's licence. → Holding one yourself. |\n| p22 | explanation | Staying out of the flow of funds avoids payment regulation and DAC7 but gives up the trust and observability gains, and collecting for both sides without a licence does not fit PSD2's commercial-agent exclusion. | quotation: Directive (EU) 2015/2366 Art. 3(b): payments 'through a commercial agent authorised via an agreement' to act for only the payer or only the payee; a question for counsel, not a design default (callout). | `contrast`: The licence route. → The opposite end: no part in the money. |\n| p23 | comparison | The comparison table counts five models, because the provider option appears twice (platform or seller as merchant of record) and the specialist institutions get their own row, and they differ in who holds funds, who verifies payees and who loses first. | table: Five rows (provider product with the platform as merchant; provider product with the seller as merchant; specialist institution; own licence; off-platform) by who holds funds, verifies payees, carries chargebacks first, what the marketplace owns and where each fits. | `conclusion_summary`: The three options described one by one. → All of them side by side. |\n| p24 | example | Veldmark chose the first row, so Safe Deal conforms to Adyen's model and translates only where an order meets a listing. | scenario: bounded-contexts records the Safe Deal context conforming to Adyen's accounts, balances and payouts. | `example`: The comparison. → Veldmark's row and its consequence. |\n\n### Architecture: The Transaction Platform\n\n**Controlling idea** (`description`, id `architecture`): A transactional pivot adds six bounded contexts beside the listing core, and their design rules (order-owned availability, timed states, release as a decision, reconciled money states, shipping events as evidence, a dispute case desk, a ledger with per-seller aggregates and the regulatory switches) decide whether the pivot can be operated.\n\n**Advances the thesis** (T3, T4, T5): Specifies what the marketplace owns even with a provider holding the money, and the rules that make protection operable and reportable.\n\n**Transition in:** `cause_effect`: The provider holds the money. → What the marketplace must still own and build.\n\n**Order of paragraphs** (`large_to_small`): The six contexts are shown whole first, then each is opened in the order its inputs become available: the order's availability and states, the shipping events that release depends on, the disputes that hold release, the ledger that records every amount, and the regulatory duties computed from the ledger. Describing the ledger before the order and shipping events would leave nothing for it to record.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p25a | evidence | A provider holding the money does not take the transaction off the marketplace's hands: the public flows of Kleinanzeigen and Marktplaats show the marketplace owning the offer and acceptance, fee pricing, labels and tracking, the release timer and disputes. | source: The INFERENCE, NOT DOCUMENTED callout on Kleinanzeigen's and Marktplaats' public flows as a plausible reference architecture. |  |\n| p25 | description | Built out, those responsibilities become six bounded contexts beside the listing core, none of which belongs inside the listing service. | table: Order, payment edge, fees and pricing, shipping, buyer protection and disputes, transaction ledger and reporting, each with what it owns, key events and what it must not own.; figure: Figure 2: the transaction platform beside the listing core; the ledger receives both order and money events. | `cause_effect`: The responsibilities the marketplace keeps in the public flows. → The six bounded contexts they become. |\n| p26 | explanation | The order must own availability: it reserves the listing atomically when payment is committed, and the reservation must time out. | scenario: At Tradeyard a Safe Deal order emits ListingReserved; search shows a badge and alerts stop; an unpaid or uncollected order must release the listing or it becomes Ghost Inventory in reverse. | `elaboration`: The order context in the table. → Its first rule, against the most common integration bug. |\n| p27 | explanation | When the order completes, the sale must reach every copy of the listing; one copy that misses it keeps selling an item that is gone, and In Practice follows Femke's bike to the copy that missed it. | reasoning: Search, saved-search alerts, digests, recommendations and sitemaps as copies of the listing; a forward pointer to the bike order in In Practice. | `time`: The reservation while the order is open. → What happens when the order completes. |\n| p28 | explanation (list) | Figure 3 draws the order's whole life (four waiting states with deadlines, exits that return money and release the listing, and chargebacks that reopen a completed order), and four design rules govern that life: every waiting state has a timer and an owner, release is a decision, money states are reconciled with order states, and states after completion are first-class. | figure: Figure 3: a protected-payment order for goods, with deadlines on waiting states and chargebacks after completion.; quotation: Kleinanzeigen: automatic payment to the seller after 14 days without confirmation; Marktplaats' 2022 successor paid on day 8 without complaints (AVROTROS Radar, 2022); release holds need a DSA statement of reasons; provider webhooks arrive at least once and out of order. | `sequence`: Availability, the order's first rule. → The order's whole life as Figure 3 draws it, and the rules that govern it. |\n| p29 | evidence | Shipping turns a marketplace into a logistics integrator at a scale now visible in carrier choices, PUDO networks and sustainability reporting. | source: Kleinanzeigen: DHL in four sizes and Hermes in four; Vinted: more than 500,000 PUDO points and Vinted Go in five countries (2026); Adevinta's 2025 report on shipment-driven emissions for five marketplaces. | `sequence`: The order's rules. → The shipping context that feeds its release decision. |\n| p30 | explanation | The shipping context needs carrier adapters, a normalized tracking-event model, label pricing, address validation and a lost-parcel policy, and its events are the evidence protection rests on. |  | `cause_effect`: Logistics at scale. → What the shipping context must therefore contain, and why event timeliness is a reliability requirement. |\n| p31 | cause_effect | Shipping also changes discovery: distance becomes a cost input, and a fee that varies per item must be computed on the search and listing read path. | quotation: Vinted UK price list (October 2026): the buyer fee varies with 'item characteristics, order value, order type'; location-and-geo. | `additional_support`: Shipping inside the transaction. → Its effect on search and listing pages. |\n| p32 | explanation | A dispute desk is a case-management system with money attached, best built as a shared capability with an anti-corruption layer per marketplace and a canonical case model. | source: Kleinanzeigen's five covered cases (2026); Adevinta's reusable dispute back office ingesting per-marketplace events through Kafka, SQS or REST, 'We couldn't hardcode anything… or make any assumptions' (2023). | `sequence`: Shipping events as evidence. → The desk that uses them when a buyer disputes. |\n| p33 | evidence | A protection promise is a liability that must be provisioned, measured per category and priced into the fee. | quotation: eBay Form 10-K for 2025: transaction losses consist 'primarily of losses resulting from our buyer protection programs, chargebacks'. | `elaboration`: The desk that decides cases. → The money those decisions cost. |\n| p34 | explanation | Every amount in an order must be explainable later, which needs RECONCILED's normalization and three-way match plus per-seller balances and per-seller, per-period aggregates. | source: payments-to-ledger and designing-financial-ledgers; provider settlement reports are net, batched and late. | `sequence`: Protection losses. → The ledger that records them with every other amount. |\n| p35 | explanation (list) | Moving money on-platform turns on DAC7 seller reporting, consumer and trader-traceability duties, and payment regulation through the provider. | fact: DAC7: report seller identity, account identifiers and consideration per quarter; excluded below 30 sales and €2,000 (Belastingdienst); the launch is also a tax-reporting decision; DSA trader traceability; provider onboarding and limits as product constraints. | `cause_effect`: Per-seller aggregates in the ledger. → The obligations that require them. |\n\n### In Practice: Two Safe Deal Orders\n\n**Controlling idea** (`example`, id `in-practice`): Two Safe Deal orders, a pay-at-pickup bike and a shipped lens with a dispute, show every context producing events and every amount needing a ledger line.\n\n**Advances the thesis** (T3, T4, T5): Walks the design through two orders with ledger figures and shows the phishing risk and the cost of a missing ledger.\n\n**Transition in:** `example`: The transaction platform's design. → Two orders that exercise it.\n\n**Order of paragraphs** (`small_to_large`): Femke's story is told in time order: the fake buyer on Sunday evening first, so the reader meets the risk the brand attracts before the real order; then the Monday pay-at-pickup order, what its steps record, and the digest that missed its sale (the example the Architecture section pointed to); then a shipped order with a dispute that touches every context and ends on the ledger lines the clearing account lacked. The simpler order comes first so the reader knows the contexts' steps before a dispute complicates them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p38 | example | Femke's bike listing drew a fake buyer within half an hour, showing that a protected-payment brand is the scammer's favorite disguise, so the countermeasure belongs in the message safety gate, not the payment platform. | scenario: At 20:11 on Sunday a fake Safe Deal link on a domain registered that day reached Femke; about 41,000 payment-link phishing reports in NL and BE in 2026; messaging-and-leads' gate; Fast Mail for Fraudsters. |  |\n| p36 | example | Femke's €225 bike order shows pay at pickup: the buyer pays in the app before the meeting, the money is held, and the seller receives it at the handover. | table: Mon 8 March 2027: 14:01 offer accepted, fee €11.95; 14:02 €236.95 paid by iDEAL, listing reserved; other conversations told; 18:08 handover code releases €225; 18:10 sold; Tuesday 07:00 the digest assembled at 17:30 Monday still features the bike to 214 users; Tuesday payout. | `time`: The fake buyer on Sunday evening. → The real sale on Monday. |\n| p37 | analysis | The bike order shows what each part records: the handover code is the release event that limits coverage, Adyen's prior verification makes Femke payable, and the buyer-paid fee keeps her DAC7 consideration at €225. | scenario: payee.verified claim in Veldmark ID; four Safe Deal sales in 2027 totaling €610, so Femke is an excluded seller. | `elaboration`: The bike order's timeline. → What its steps mean for release, verification and tax. |\n| p37a | example | The Tuesday digest row is the Architecture section's propagation rule broken: the bike sold at 18:10 and left search a minute later, but a digest assembled at 17:30 from an older replica snapshot and not re-checked still featured it to 214 users. | scenario: Sold 18:10 Monday 8 March 2027, removed from search 18:11; the 07:00 Tuesday digest assembled at 17:30 Monday from a MySQL replica snapshot, not re-checked, went to 214 users. | `elaboration`: The bike order's timeline and what its steps record. → The table's Tuesday digest row as the propagation rule broken. |\n| p39 | example | A shipped €60 lens order with a dispute exercises every context, from label and PUDO through the dispute window to a partial refund and payout. | table: 13 to 20 April 2027, Antwerp buyer, Ghent seller: €70.65 paid (€60 + €3.70 fee + €6.95 label); hand-in within three days; two-day dispute window; dispute over a scratch; €15 partial refund; €45 payout; fee not refunded; label €6.95 charged against about €5.20 carrier cost. | `contrast`: A local order released at the handover and the digest that missed its sale. → A shipped order with a dispute. |\n| p40 | analysis | Every step of the lens order produced an event and every amount has a ledger line, the link the December 2026 clearing balance lacked because partial refunds before 2027 were agreed in chat and executed manually. | figure: Figure 4: unmatched items in a clearing bin versus a ledger where each line links to an order event. | `cause_effect`: The lens order's steps. → The ledger lines they produce and why clearing filled up before 2027. |\n\n### The Architecture Advice Forum's Decisions\n\n**Controlling idea** (`example`, id `forum`): Applying the four conditions and the architecture, the forum approved Portugal on the target platform, narrowed Motorvane to a design study, declined Hearthly's deposits as The Forced Fit, and funded the transaction platform first.\n\n**Advances the thesis** (T1, T4, T6): Shows the framework producing approve, narrow and decline outcomes and the ledger funded before growth.\n\n**Transition in:** `problem_solution`: The forum's three proposals and the clearing account from the scene, and the framework since built. → The forum's decisions.\n\n**Order of paragraphs** (`problem_solution`): Each problem the scene posed is resolved in the order the scene listed it, from the clearest fit to the clearest misfit, and the fourth item, the clearing account, is resolved last because the Portugal approval depends on it; deciding the platform first would announce a funding decision before the reader sees which proposal needs it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p42 | transition | On 22 September 2027 the forum applied the four conditions and the architecture to each proposal. |  |  |\n| p43 | example | Safe Deal Portugal was approved for Q3 2028 on the target platform, not on the 2024 design that serves Safe Deal's first three countries, because all four conditions hold, and it waits for the platform work. | scenario: Local payment methods and two national carrier and PUDO networks through new adapters; same Tradeyard B.V. contract with Adyen; DAC7 through the existing Dutch filing. | `sequence`: The method. → The first proposal. |\n| p44 | example | Motorvane's private car payment fails on price and professional sellers, so the forum approved only a narrow design study for a secure handover. | scenario: A 5% fee on the Essen Golf's €21,900 would be about €1,095; most listings from dealers; funds held at most 72 hours, flat buyer fee, handover code, proof-of-person payee verification; decision Q2 2028; fraud-prevention controls meanwhile. | `contrast`: A proposal where all conditions hold. → One where two fail. |\n| p45 | example | Hearthly's protected deposits were declined as The Forced Fit, because a rental deposit is part of a lease, and the Barcelona ring is better answered upstream. | scenario: Proof of person with name match for private landlords in Spain from Q4 2027 (identity-and-verification); messaging warnings when a deposit is requested before a viewing. | `contrast`: A narrowed proposal. → A declined one. |\n| p46 | recommendation | The transaction platform was funded first, with end-2028 targets for traceability, unmatched clearing and DAC7. | scenario: Order service owning availability and timers, shipping with normalized tracking, dispute cases on shared trust-and-safety case management, ledger feeding group finance; every amount traceable order to bank; unmatched clearing under €100,000 at any month-end; DAC7 aggregates from the ledger. | `cause_effect`: Three proposal decisions, one of which waits for the platform. → The platform decision they depend on. |\n\n### Trade-offs\n\n**Controlling idea** (`comparison`, id `trade-offs`): The transaction platform's main decisions each have an option that is right under stated conditions, with buyer-paid fees and sharing across countries the two that need most judgement.\n\n**Advances the thesis** (T2, T6): Places the recommended choices among their alternatives and says when each alternative is right.\n\n**Transition in:** `contrast`: The forum's decisions for Veldmark. → The general alternatives behind them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p47 | comparison | The forum's decisions fit Veldmark and another marketplace could decide otherwise: eight decisions shape any transaction platform, each with two options right under different conditions, the first two restating the payment models as choices. | table: Who holds funds; merchant of record; release rule; fee payer; fee shape; shipping; scope of a shared platform; pivot depth, each with when to prefer A or B. |  |\n| p48 | evidence | Buyer-paid fees keep selling free and put the price at the moment of highest intent, as Vinted's and Marktplaats' fees show. | quotation: Vinted UK price list (October 2026): 'the Vinted fee', paid at checkout, 'usually 3% to 8% + £0.3 to £0.8'; Marktplaats 2017 2% + €0.40 (RetailTrends), 2022 successor 5% (AVROTROS Radar). | `elaboration`: The fee-payer row. → Why buyer-paid fees are usually chosen. |\n| p49 | analysis | Sharing the transaction platform across countries is attractive but most exposed to local differences, as Adevinta's move from shared to local ownership shows. | source: Adevinta 2023 plan to stop duplicating 'the full transactional journey'; 2025 decentralization. | `contrast`: A row with a clear default. → A row that needs judgement. |\n\n### Vertical Differences\n\n**Controlling idea** (`comparison`, id `verticals`): The pivot is common for general goods and recommerce and rare elsewhere, and automotive shows that transactional state on a professional's inventory must be opt-in, configurable and reversible.\n\n**Advances the thesis** (T1): Applies the four conditions across verticals and shows the professional pushback.\n\n**Transition in:** `sequence`: Decision-by-decision trade-offs. → Differences by vertical.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p50 | comparison | The verticals differ in whether the pivot happens at all, what is paid on the platform, who holds funds and which fear protection answers. | table: General goods, real estate, automotive, recommerce and jobs by whether the pivot is common, what is paid, who holds funds, the fear protection answers and the typical failure. |  |\n| p51 | example | Autotrader's Deal Builder shows professionals pushing back when transactional state is placed on their inventory, so such state must be opt-in, configurable and reversible. | source: Autotrader FY26 results (2026): fall in retailer forecourts partly attributed to 'concerns with the speed and nature of our Deal Builder product roll-out'; auto-rollout paused; 'request a reservation' without buyer payment (Car Dealer Magazine, December 2025). | `example`: The vertical table. → Automotive as the case. |\n\n### Failure Modes\n\n**Controlling idea** (`cause_effect`, id `failure-modes`): Nine failure modes, from a checkout shipped before its ledger to the goods checkout forced onto other verticals, are the design rules of the chapter broken one at a time.\n\n**Advances the thesis** (T1, T3, T4, T5, T6): Shows what happens when each rule of the chapter is skipped.\n\n**Transition in:** `contrast`: How the design and its alternatives should be chosen. → What goes wrong when they are not.\n\n**Order of paragraphs** (`order_of_importance`): The ledger failure Veldmark actually suffered comes first; then the failures of the order's life (release, double sale, propagation, disputes), then those that come from outside the order (phishing, tax, provider), and the vertical misfit last because it returns to the per-category decision. Each item names the symptom of a rule set out earlier; out of this order the reader would meet external failures before the order's own life that they depend on.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p52 | cause_effect | The design rules and choices work only when made on purpose; the first of nine failures, the one Veldmark met, is the checkout shipping before the ledger, so the first month-end finds refunds, label charges and chargebacks unmatched and the ledger belongs in the launch criteria. |  |  |\n| p53 | cause_effect | Release by timer only pays scammers who never ship, so release should depend on delivery and the dispute window with a fraud hold. |  | `additional_support`: The previous failure mode. → Another failure mode. |\n| p54 | cause_effect | The double sale happens when the listing stays available during an order, so the order must reserve atomically with an expiry. |  | `additional_support`: The previous failure mode. → Another failure mode. |\n| p55 | cause_effect | A sale that does not reach every copy of the listing creates Ghost Inventory, as the bike in the Tuesday digest shows. |  | `additional_support`: The previous failure mode. → Another failure mode. |\n| p56 | cause_effect | Disputes handled by e-mail are inconsistent and leave no data to price protection, so a desk needs cases, evidence, decision codes and service levels. |  | `additional_support`: The previous failure mode. → Another failure mode. |\n| p57 | cause_effect | Phishing that imitates the protected-payment flow follows every launch, so messaging must treat brand-imitating links as high risk. |  | `additional_support`: The previous failure mode. → Another failure mode. |\n| p58 | cause_effect | Discovering DAC7 late forces retroactive tax-identifier collection with payout holds, so data collection belongs in onboarding thresholds. |  | `additional_support`: The previous failure mode. → Another failure mode. |\n| p59 | cause_effect | Verification data, tokens and payout accounts held only at one provider make a change of provider a migration of every seller, so the marketplace keeps its own references. |  | `additional_support`: The previous failure mode. → Another failure mode. |\n| p60 | cause_effect | Extending the goods checkout to cars, homes or rentals because it exists is The Forced Fit in its transactional form. |  | `additional_support`: The previous failure mode. → Another failure mode. |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `ca-view`): At group scale, transactions raise four standing decisions: decide the pivot per profile with named owners, share the platform only among the profiles that use it, treat the provider as a strategic dependency, and measure trust and money together.\n\n**Advances the thesis** (T1, T6): Turns the chapter into governance a group Chief Architect can apply.\n\n**Transition in:** `cause_effect`: The failure modes. → The standing decisions that prevent them at group scale.\n\n**Order of paragraphs** (`order_of_importance`): Whether to pivot comes before what to share, which comes before how to manage the provider beneath it, and measurement comes last because it judges the other three.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p61 | transition | At group scale, transactions raise four standing decisions that prevent the failure modes. |  |  |\n| p62 | recommendation | Decide the pivot per profile and record it in the marketplace profile register as configuration, with no category given protected payment without named owners for disputes, reconciliation and DAC7. |  | `sequence`: Four decisions. → The first: whether and where. |\n| p63 | recommendation | Share the transaction platform only among the profiles that use it, with country parts as adapters and the order model, ledger and case model shared. | scenario: Safe Deal serves goods in Tradeyard's countries; Motorvane and Hearthly use only the shared layers beneath it. | `sequence`: Where to pivot. → What to share among those that do. |\n| p64 | recommendation | Treat the provider as a strategic dependency: keep the order, the ledger and the verification outcome in your own systems with provider identifiers as references, and plan for separability. |  | `sequence`: The shared platform. → The provider beneath it. |\n| p65 | recommendation | Measure trust and money together, so a rising protected share with falling phishing shows the pivot working and a rising take rate with rising unmatched items shows it borrowing from the future. |  | `sequence`: The provider dependency. → How to judge the whole pivot. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Ten questions test a transaction design against the chapter, from the four conditions and who holds the money to release, reservation, traceability, disputes, DAC7, provider exit, brand phishing and switching off.\n\n**Advances the thesis** (T1, T2, T3, T4, T5, T6): Gives the reader a design-review audit drawn from every section.\n\n**Transition in:** `cause_effect`: The Chief Architect's decisions. → Questions that test whether they are met.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p66 | recommendation (list) | Ten questions, introduced by a one-line lead-in, test whether a transaction design meets the chapter's conditions, ownership rules and obligations. |  |  |\n\n## Conclusion: From Transactions to Monetization\n\n**Synthesis:** The four conditions and the six contexts are one decision seen from two sides: the conditions say where the platform's presence removes a fear that stops sales, and the contexts are what it costs to carry that fear once the platform has taken it on; each forum decision needed both, and Safe Deal's clearing balance is what taking on the fear without the second half produced.\n\n**So what:** A 'let's go transactional' proposal is answered with two questions, not one: do all four conditions hold for this country and category, and can the platform that will carry it explain every amount from order to bank.\n\n**Callback:** The twenty-year classifieds bargain in the opening paragraph (the platform finds the buyer and the parties settle the money). The reader now sees the bargain as right for some categories and wrong for others, and knows what breaking it obliges the platform to own.\n\n**Takeaway** (`course_of_action`): Break the classifieds bargain only per category and only with the ledger and dispute desk in place; then weigh the transactional line against the other revenue models in monetization-models.\n\n**Hand-off** to [How Listing Marketplaces Make Money](monetization-models.html): `contrast`: Protected payment adds a revenue line, but only one of several and usually not the largest. → The other ways a listing marketplace earns, which charge for access to attention rather than a share of the sale, each with its own system of record and liquidity cost.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p67 | synthesis | The classifieds bargain the chapter opened with is right for some categories and wrong for others: the four conditions say where the platform removes a fear, the six contexts are the cost of carrying it, and the forum's decisions and the clearing balance show that both halves are needed. | reasoning: Portugal passed the conditions but waited for the ledger; the car payment and the deposits failed conditions no platform can change; Safe Deal took on the fear without the ledger and produced €2.3 million unmatched. |  |\n| p68 | synthesis | A proposal to go transactional is therefore answered with two questions, whether all four conditions hold and whether the platform can explain every amount, and only a yes to both turns buyer protection from a liability into a product. |  | `cause_effect`: The two halves of the decision. → The two questions a reader puts to any proposal. |\n| p69 | transition | Protected payment adds a revenue line, but only one of several and usually not the largest, so monetization-models compares it with the models that charge for attention. |  | `contrast`: The transactional line judged on its own. → The other revenue models it competes with. |\n\n## Non-goals\n\n- The payment lifecycle, provider products in depth and ledger and reconciliation design. See [Payments for Finance Architects: Eleven Reasons the Numbers Disagree](../finance-systems-architecture/payments-fundamentals.html), [Adyen: One Platform from Checkout to Settlement](../finance-systems-architecture/adyen.html), [Stripe: Every Movement Is a Balance Transaction](../finance-systems-architecture/stripe.html), [Payments-to-Ledger: Draining the Suspense Swamp](../finance-systems-architecture/payments-to-ledger.html), [Never Update, Only Append: Designing Custom Ledgers](../finance-systems-architecture/designing-financial-ledgers.html).\n- Marketplace models and the endpoint ladder. See [Classifieds, Leads, Transactions and Managed Models: A Marketplace Taxonomy](marketplace-taxonomy.html).\n- Revenue models and KPIs. See [How Listing Marketplaces Make Money](monetization-models.html).\n- Contact-stage fraud and the message safety gate. See [Scams, Fakes and Account Takeovers: Fraud Prevention for Listings](fraud-prevention.html), [From Interest to Contact: Messaging and Lead Management](messaging-and-leads.html).\n- DAC7 and DSA obligations in detail. See [Rules of the Marketplace: DSA, DAC7 and Vertical Regulation](marketplace-regulation.html).\n- Identity levels and payee verification. See [Who Is on the Other Side? Identity and Verification](identity-and-verification.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Kleinanzeigen's provider: 2020–2023 sources name Online Payment Platform; its help page names Adyen in October 2026. When and why it changed is not public. (Carried over from spec.md.)\n- Marktplaats' current Kopersbescherming terms and provider after 2022 are not verified; the chapter cites the 2022 description only. (Carried over from spec.md.)\n- The exact reach of the PSD2 commercial-agent exclusion for marketplaces depends on contracts and jurisdiction; stated as a question for counsel. (Carried over from spec.md.)\n- Several chapters written earlier (e.g. marketplace-regulation) cite the superseded 2026 Safe Deal volume of 4.1M orders and €310M GMV; the editor's ledger correction (11.6M orders, about €1.02B GMV) is used here. (Carried over from spec.md.)\n\n## Decision log\n\n- **2026-10-19** — Framed the pivot as a per-category decision with four conditions, rather than as a brand strategy, so it aligns with the marketplace profile register in marketplace-taxonomy.\n- **2026-10-19** — Organized the architecture as six bounded contexts beside the listing core, with the order owning availability and timers and the ledger receiving both order and money events.\n- **2026-10-19** — Used three competing proposals (Portugal, Motorvane, Hearthly Spain) at one forum to show approve, narrow and decline outcomes; added Safe Deal 2026 operating metrics and the December 2026 clearing balance to the ledger.\n- **2026-10-19** — Linked to RECONCILED for payments depth instead of re-teaching settlement and reconciliation.\n- **2026-11-12** — Converted spec.md to spec.json. Success criteria: all six were inventories of contents (terms defined, evidence named, tables and sections present) and are replaced by the journal spec's AC-1 to AC-3, which state reader outcomes (decide three proposals and name what comes first; predict the sections from the opening; a reverse outline matches the spec). No post-level criteria were added. Rejected: Keeping the inventory criteria as minor custom criteria.\n- **2026-11-12** — Length limit set to the published draft's length plus 5% (7,308 words by check_draft's count, which includes callouts and the March 2027 timeline past tense (p37); the vertical table names Autotrader's reservation backlash with a pointer below (p50). length.max_words 7750 -> 8100 (within 10%) for the added glosses and the moved paragraph. (fixed under the author's delegation (fix-only pass))\n\n## Sources\n\n- **Internal**\n  - _journals/listing-systems-architecture/journal-spec.json — Intent outcome, acceptance criteria, thesis, role, and monetization-models' transition_in for the hand-off.\n  - meet-veldmark, marketplace-taxonomy, listing-aggregate, event-driven-listings, messaging-and-leads, fraud-prevention, identity-and-verification, marketplace-regulation, bounded-contexts — Veldmark, the profile register, the order-listing separation, reservation events, the phishing incident and gate, payee verification and DAC7.\n  - RECONCILED: payments-fundamentals, adyen, stripe, payments-to-ledger, designing-financial-ledgers — Payments depth linked instead of re-taught.\n  - _research/scenario-ledger.md, _research/consistency-issues.md; research briefs adevinta, olx, ebay-classifieds, monetization-economics, trust-safety-regulation, automotive — Safe Deal figures (editor's 11.6M / €1.02B correction), the bike and lens orders, the forum decisions; public company evidence.\n- **External**\n  - Adevinta annual reports 2019 and 2023, strategic report 2025, tech blog (2023); Kleinanzeigen Sicher bezahlen page; onlinemarketing.de (2020); t3n (2023); RetailTrends (2017); AVROTROS Radar (2022); Worldline (2022) — Category-gated launches, economics, providers, release rules and fees.\n  - OLX Tech (2023); Prosus FY25; Vinted results, Vinted Pay and price list (2026); eBay 10-K (2026); Autotrader FY26; Car Dealer Magazine (2025); Which? (2024) — Pay-and-ship retreat, own-licence route, buyer fees, protection losses, professional pushback, the trust case.\n  - Adyen and Stripe Connect documentation; Directive (EU) 2015/2366 Art. 3; Belastingdienst DAC7 guidance — Provider behavior, the commercial-agent exclusion and the DAC7 excluded-seller test.\n\n## Changelog\n\n- **2026-11-13** — Fix-only pass under the author's delegation: 11 blocking round-4 findings fixed (callout moved to Architecture as p25a; bike outcome moved to new p37a; phishing p38 moved first in In Practice; p28 lead-in; p18, p37, p47, p50, p52 wording); max_words 7,750 -> 8,100. Check report stale. (AI-mediated session)\n- **2026-11-12** — Escalation resolved under the author's delegation: four corroborated flow faults fixed (p18, p24, p27/p36, p43), p47 lead-in, p40 reverted to the published 'has a ledger line', max_words 7,673 → 7,750. (AI-mediated session)\n- **2026-11-12** — Draft check round 3: ESCALATE (14 pass, 9 fail, 4 corroborated flow findings, all draft faults; see open_questions). Close: p55 'Tuesday digest' changed to 'next morning's digest', p68 'therefore' cut to stay within max_words. Check report is stale by these two edits.\n- **2026-11-12** — After draft-check round 2 (escalate on one spec fault; four corroborated flow findings): p23 now says how three options become five table rows; p28 names the waiting states in the text; p27 points forward to the bike walkthrough; p44 says 'Essen Volkswagen Golf'. Roadmap p04 and synthesis p67 trimmed by a few words to stay within max_words.\n- **2026-11-12** — Round-1 spec faults fixed: numbers subsection moved into the scene (p08a); p40, p61 and p66 ideas reworded; flow rationales for scene and in-practice rewritten. Flow rubric rerun.\n- **2026-11-12** — Converted spec.md to spec.json (outcome-spec pipeline); spec.md removed. Status draft.\n- **2026-10-21** — Renamed failure patterns to match where-listing-systems-go-wrong: Seeing Double, Search as System of Record, Multiplier Creep, Fast Mail for Fraudsters, The Copy-Paste Country, Deal-Shaped Architecture, The Forced Fit, Billing by Guesswork, Set-and-Forget AI. (AI-mediated session)\n- **2026-10-20** — Replaced 2 mermaid diagram(s) with generated illustrations (figure numbers and captions unchanged; sources archived in _research/mermaid-figures.json); known differences from the source: Figure 2: kept attempt 1: 'availability check' (Listing context → Order context) and 'delivered or returned' (Shipping → Order context) drawn as lines without arrowheads; Figure 3: kept attempt 3: words START and END printed; extra arrow 'Chargeback' → end dot; 'Completed' → end dot missing. (AI-mediated session)\n- **2026-10-20** — Sharpening pass: 6,630 → 6,616 prose words; lead now places the chapter between messaging-and-leads and monetization-models; six teaser openers cut so paragraphs lead with their point; Trade-offs comment split into two paragraphs; no headings changed; spec unchanged. (AI-mediated session)\n- **2026-10-20** — Cross-chapter consistency sweep: 1 heading(s) aligned with the book's shared section names, glossary terms and source-group structure; no body text changed. (AI-mediated session)\n- **2026-10-19** — Added 2 inline illustrations (article-illustrator); figures renumbered. (AI-mediated session)\n- **2026-10-19** — Editorial review pass: Rotterdam bike order retimed to the canonical 14:02 reservation (offer 14:01), Kleinanzeigen carrier options and Vinted fee naming corrected from the live pages, PSD2 Art. 3(b) verified against the Official Journal. (AI-mediated session)\n- **2026-10-19** — Initial spec and article. (AI-mediated session)\n"}]}]}</script>

            function inline(s) {
