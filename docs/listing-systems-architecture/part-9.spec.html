<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published page (posts/part-9-intro/index.md) and its former spec.md (accepted 2026-10-21), which it replaces; one spec paragraph per unit of the page, in the page's order. Intent outcome, AC-1 to AC-3 and role are copied unchanged from the post's entry in journal-spec.json; the introduction realises Part IX's opening (hook, bridge, roadmap) from the same file. The journal spec gives this post no thesis, so the thesis and its four supporting claims are written here from the part's thesis, flow and opening. The five callouts (IN THIS PART, WHY THE BUSINESS CARES, WHY ARCHITECTS SHOULD CARE, KEY POINTS, FAILURE PATTERNS) stand before the first paragraph and are kept as the house format; the KEY POINTS callout carries the part's three lessons and the IN THIS PART callout names the six cases in reading order. Units added to the published page to meet the contract, in the shape the Part II to VII introductions now share: the bridge sentence in p01, a roadmap paragraph (p02), a lead-in to the chapter table giving the reading order and its reason (p06), a lead-in to the side-by-side table (p07), and a closing paragraph under 'Where to begin' (p10) with synthesis, callback and hand-off, grown from the published last line of the Veldmark section. Every company name, date and dated statement is the published text; none was added.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Part IX's argument: the public record supports sharing the uniform layers and treats product convergence as a separate, riskier bet; every shared dependency must survive a change of owner; contracts and models carry the vertical lessons.\n- **Know:** The evidence rules of the cases (documented fact with source and year, the author's reading, labeled inference) and why the depth of each section follows the evidence, not the importance of the company.\n- **Know:** The six cases in reading order, the question each answers and when to read it, and the four Veldmark choices the cases test.\n- **Be able to:** Tell, for any statement in a case, which of the three kinds it is.\n- **Be able to:** Pick the case that speaks to the decision in front of them.\n\n**Audience:** Chief and enterprise architects, principal engineers and engineering leaders (the journal's readers) who have finished Part VIII and want evidence, not only argument, before adopting the book's platform, consolidation and model-governance recommendations, or who arrive with a decision in hand and want the case that speaks to it.\n\n**Already knows:**\n\n- What an API, a database, an event stream, a search engine (Elasticsearch, OpenSearch) and Kubernetes are; how to make and defend an architecture decision.\n- The book's argument as long-term-evolution restates it, and the chapters the cases test: multi-country-platforms (tenant separability, sharing beneath the product), platform-consolidation (acquired stacks, transitional services, separation costs), ml-platform (decision tiers, commit tier, Valuo), listing-ingestion (supply contracts, vendor and dealer feeds), vertical-requirements (licensed property supply, MLSs).\n- The fifteen named failure patterns, among them Deal-Shaped Architecture, The Forced Fit and Set-and-Forget AI (where-listing-systems-go-wrong).\n- Veldmark in outline: a fictional group of four brands (Tradeyard, Motorvane, Hearthly, Keybridge), Ingrid Halvorsen its Group Chief Architect, the Common Ground program (meet-veldmark).\n\n**Does not yet know:**\n\n- The companies' dated histories beyond what the earlier chapters cited (owned by the six cases; the page gives each only as a dated line in the KEY POINTS and the side-by-side table).\n- The evidence rules of Part IX (owned by this page: documented fact with source and year, the author's reading, labeled inference).\n- Five-band price ratings (owned by case-automotive; the page names them as a published fact and their governance as a ranking-model question).\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader of this page alone can name the six cases in reading order and the question each answers. *Probe:* After reading only this page: which six cases follow, in what order, and what question does each answer? | `intro_predicts_content` | cold_reader | major |\n| AC-2 | Given three sentences of the kinds the cases use, the reader classifies each as documented fact, the author's reading or labeled inference, and picks the case to open for a stated decision. *Probe:* Using only this page: how would you recognize a documented fact, the author's interpretation and a reference-architecture inference in the cases? And which case do you open if most of your supply arrives through vendor feeds, or if a brand may be sold? | `custom` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-4 | The reader can say why the fictional Veldmark is kept out of the case narratives and what the cases do with its 2027 choices. *Probe:* Using only this page: where does Veldmark appear in the cases, why only there, and what do the cases do with Veldmark's 2027 choices? | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** What does this part argue, and in what order should its chapters be read?\n\n> **Claim:** Part IX argues that the dated public record of six marketplace cases supports the book's sharing pattern only up to the product layer: sharing the uniform layers held up while product convergence is a separate, riskier bet; every shared dependency must survive a change of owner; and the vertical lessons sit in contracts and models. Because those lessons are only as strong as their evidence, the cases are read under rules that keep dated fact, the author's reading and labeled inference apart, with fictional Veldmark only in each case's final comparison, and in an order that runs from whole groups to single verticals, starting with Adevinta.\n\n**Disputed by:** The view that real groups' histories teach little about architecture, because each turn was a capital or market decision, so the cases are company profiles a reader may skim in any order and cite at whatever strength suits the argument.\n\n**So what:** A reader who accepts it reads each case statement as fact, reading or inference and cites it at that strength, opens the case that speaks to the decision in front of them, and ends Part IX able to say which of the book's patterns the record supports, which it only fails to contradict, and where it is silent.\n\n**How and why:** The six cases bought, merged, shared, sold and retreated in public. Adevinta's 2023 plan to turn two generalist platforms into one was reversed by 2025, and AVIV's 2021 goal of 'a European real estate marketplace' gave way to local autonomy; eBay's 2020–2021 sale and Adevinta's 2025 break-up turned shared platforms into transitional-service terms and separation costs; Zillow Offers wound down in November 2021. The evidence is uneven: Adevinta published a great deal, eBay Classifieds almost nothing as a group, and AVIV no engineering material at all.\n\n**Supporting claims**\n\n- **P9I-1** — Part IX's cases are read under stricter evidence rules than Parts I–VIII: every statement is a dated fact, the author's reading or a labeled inference, the depth of each case follows its evidence, and Veldmark appears only in each case's final comparison.\n- **P9I-2** — The six cases are read from whole groups to single verticals, starting with Adevinta, and each is the one to open for a recognizable decision.\n- **P9I-3** — Read side by side, the six records give the part's three lessons: share the uniform layers and treat product convergence as a separate bet, design every shared dependency to survive a change of owner, and carry the vertical lessons in contracts and models.\n- **P9I-4** — The cases test the chapters the book's argument rests on and Veldmark's 2027 choices, without extending the scenario, and the toolkit turns the book's decisions into templates.\n\n## Role in the part\n\nPerforms the part's opening: states the three lessons the record gives, sets the evidence rules the cases follow, gives the reading order of the six cases and names the Veldmark choices they test.\n\n## Flow\n\n**Pattern:** `large_to_small` (also `grouping` in p06 and the chapter table: three multi-country groups (Adevinta, OLX, eBay Classifieds), then real estate (AVIV, the property portals), then automotive)\n\nThe page opens on the argument the book closed and the question Part IX puts to it, then sets the evidence rules before any case is named, because every row that follows is a dated fact and the reader must know how to weigh it. It narrows to the six cases in reading order with the decision that sends a reader to each, then sets them side by side so the three lessons of the KEY POINTS can be read across the rows. It then shows, in one place, where the fictional Veldmark appears and the 2027 choices the cases hold against the record, widens once to the chapters the cases test and the toolkit, and ends with a short synthesis, the part's three-way test and the hand-off to Adevinta. Put the comparison before the chapter table and its rows arrive before the reader knows the cases; put the evidence rules after the tables and their dated facts are read before the reader knows what a date means; split Veldmark's place from its choices and the reader meets the fiction twice, far apart (both round-3 flow readers); put Veldmark before the cases and the fiction is met before the real record it is tested against.\n\n## Introduction\n\n**Hook** (`direct_statement`): Long-term-evolution closed the argument of this book. Part IX asks whether it survives contact with what real groups did.\n\n**Bridge:** Veldmark, the fictional group whose decisions showed how the argument plays out but not that it is right. → Groups that bought, merged, shared, sold and retreated in public, each case asking what was shared, at which layer and what it cost when the strategy changed.\n\n**Thesis statement** (KEY POINTS callout; paragraph p01 (bold phrase)): Whether the argument survives contact with what real groups did; the three lessons the record gives.\n\n**Roadmap** (IN THIS PART callout; paragraph p02; the section headings):\n\n- The evidence rules first. *Kept in:* read.\n- The six cases in reading order. *Kept in:* chapters.\n- The six side by side. *Kept in:* side.\n- The Veldmark choices the cases test. *Kept in:* veldmark.\n- Links to the rest of the book. *Kept in:* connects.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Long-term-evolution closed the book's argument and Veldmark showed how it plays out, not that it is right, so Part IX asks whether the argument survives contact with what real groups did, each case asking what was shared, at which layer and what it cost when the strategy changed. |  |  |\n| p02 | transition | The page sets the evidence rules first, then gives the six cases in reading order and side by side, the Veldmark choices they test and their links to the rest of the book, and ends with where to begin. |  | `sequence`: The question Part IX asks and the three questions each case asks. → The order in which the page answers it. |\n\n## Sections\n\n### How to read the cases\n\n**Controlling idea** (`definition`, id `read`): The cases follow stricter evidence rules than Parts I–VIII: three kinds of statement, and depth that follows the evidence.\n\n**Advances the thesis** (P9I-1): Sets the three kinds of statement and says the evidence is uneven, so the depth of each case follows its evidence.\n\n**Transition in:** `elaboration`: The roadmap's first promise, the evidence rules. → The three kinds of statement.\n\n**Order of paragraphs** (`large_to_small`): The rule for every statement first, then how much evidence each case has.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p03 | definition | Every statement in Part IX is one of three kinds: a documented fact with its source and year, the author's interpretation, or a reference-architecture inference in a labeled callout. | table: Three rows: documented fact (source and publication year in the sentence or timeline; 'true at the date of its source, and no later'); the author's interpretation ('my reading', or the Chief Architect's view, glossed as a section near the end of each case); reference-architecture inference (only in a callout labeled INFERENCE, NOT DOCUMENTED; how a group could be built, never how it is). |  |\n| p04 | explanation | The evidence is uneven and each case says where it stops, so the depth of each section follows the evidence, not the importance of the company. | case: Adevinta published a great deal, eBay Classifieds almost nothing as a group, and AVIV no engineering material at all. | `elaboration`: The kinds of statement a case may make. → How much documented fact each case has. |\n\n### Chapters in this part\n\n**Controlling idea** (`description`, id `chapters`): The six cases run from whole groups to single verticals, starting with Adevinta, and each is the one to open for a recognizable decision.\n\n**Advances the thesis** (P9I-2): Gives the reading order with its reason and one row per case with its question and when to read it.\n\n**Transition in:** `sequence`: The evidence rules every case follows. → The six cases in reading order.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | description | Under the evidence rules, the cases run from whole groups to single verticals (the groups Adevinta, OLX and eBay Classifieds, then real estate with the fourth group, AVIV, and the property portals, then automotive), and Adevinta comes first because its case is the first to ask the opening's three questions, which every later case asks again. | table: Six rows in reading order: case-adevinta (deciding what a group platform should share), case-olx (weighing an inventory or transactional bet, glossed as owning the stock or taking part in the sale), case-ebay-classifieds (a brand may be sold, or a parent may leave), case-aviv (integrating acquired national portals), case-property-portals (models start to price, not describe), case-automotive (most supply arrives through vendor feeds), each with the question it answers. |  |\n\n### The cases side by side\n\n**Controlling idea** (`comparison`, id `side`): Read across, the six records give the part's three lessons.\n\n**Advances the thesis** (P9I-3): One row per case with its platform strategy, what the public record shows and the lesson, and a figure of the common lesson.\n\n**Transition in:** `elaboration`: The six cases, one at a time. → The six read across one another.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | comparison | Read across, the six rows give three lessons: share the uniform layers before the product, design every shared dependency to survive a change of owner, and carry the vertical lessons in contracts and models. | table: Company \\| platform strategy \\| what the public record shows \\| lesson, for Adevinta (selective centralization 2019, product convergence 2023, decentralization 2025; no public source shows the 2023 convergence completed), OLX Group (45 markets in 2018 to seven in the FY to March 2026; OLX Autos exited from 2023), eBay Classifieds (thin shared layer; sale completed June 2021 with transitional services),         function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];

            const bullet = /^(\s*)([-*])\s+(.*)$/;

                // Posts are trusted content, so raw HTML passes through unescaped

                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');

                // Bold/italic, including nested combinations: ***x***,

                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');

                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
