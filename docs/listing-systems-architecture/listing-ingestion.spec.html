<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, acceptance criteria AC-1 to AC-3, the thesis and the role are copied unchanged from the listing-ingestion entry in journal-spec.json. Units added by this conversion: a roadmap paragraph in the introduction (p04), a split of the two key-design rules into p24 and p25, lead-in paragraphs for the trade-off table (p46) and the vertical table (p48), and a synthesis paragraph (p70) before the hand-off. After the flow rubric, the one-sentence 'Four lessons recur' paragraph was merged into p15 (no p16) and the insertion-flow metric (p36) moved before the architectural list (p35).\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The four channel types (insertion flow, partner API, bulk feed, replication from an external system of record) and where the truth about a listing lives in each.\n- **Know:** Full-snapshot versus delta semantics, why neither suffices alone, and the clauses of a feed contract beyond schema: identity, semantics, field ownership, timeliness, media, errors, limits, reconciliation and change management.\n- **Believe:** Most ingestion incidents are a contract question nobody asked, and drift between partner state and platform state is a normal operating condition.\n- **Be able to:** Draw the 'many doors, one write path' architecture and separate external key, request idempotency key and record sequence.\n- **Be able to:** Design a mass-change guard and a reconciliation schedule, and decide what a group shares across brands (contract, error catalog, validator, guards) and keeps local (adapters).\n\n**Audience:** Chief and enterprise architects, principal engineers and engineering leads responsible for supply, partner integrations and pro-seller platforms in classifieds, real-estate and automotive marketplaces.\n\n**Already knows:**\n\n- APIs, HTTP status codes, queues, batch processing, idempotency in general, OAuth and TLS.\n- From earlier pages: the listing as an aggregate with commands, versions and an external key (listing-aggregate); compiled category schemas (attribute-schemas); integration principals and sellers (sellers-and-accounts); Veldmark, its brands, cast, the advice forum and the Common Ground program (meet-veldmark); the failure-pattern names (where-listing-systems-go-wrong); Part III as one supply chain (part-3).\n\n**Does not yet know:**\n\n- Ingestion channel, feed contract, full snapshot and delta feed (defined here).\n- Dealer management system (DMS), transfer service provider, multiple-listing service (MLS), IDX, OpenImmo, RESO and Rightmove's Real Time Datafeed.\n- Mass-change guard, scheduled reconciliation, ingestion record, field ownership and seller locks (defined here).\n- PKCE, DVLA write-off categories, NAR's delayed-marketing listings and DSA Article 30 trader traceability.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a truncated snapshot and a vendor that never sends deletes, the reader states what the platform does tonight and what the contract must say. *Probe:* A real-estate software vendor sends nightly full files for 300 agencies; tonight's files are 70% shorter than yesterday's. The same vendor's delta channel never sends deletes. Using only this chapter: what happens tonight, and what must the feed contract say? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-4 | Given a re-sent car after a feed outage and a sold car that stayed listed for a day, the reader explains both from the keys and the contract. *Probe:* A dealer's car vanished during a feed outage and was re-sent two days later; another dealer's sold car stayed listed for 26 hours although nothing malfunctioned. Using only this chapter: what decides whether the re-sent car gets its old listing back, which three kinds of key are involved and what each is for, and why did the sold car stay listed? | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** How should a marketplace accept supply from private sellers, professionals and partners at scale?\n\n> **Claim:** Ingestion is a boundary capability governed by contracts, not a set of importers: the insertion flow, partner APIs, bulk feeds and replication should each end in the same idempotent command on the listing service, validated against the same compiled schema and keyed by the partner's own reference, under a feed contract that states what absence means, who owns each field, how fast removals must arrive, how errors are reported and how both sides reconcile; snapshot channels run behind a mass-change guard, delta channels reconcile on a schedule, and a group shares the contract, error catalog and validator while keeping adapters local to each partner ecosystem.\n\n**Disputed by:** The common practice of building an importer per channel or per partner, owned by the team that serves that customer, treating a feed as a schema to parse and each incident as a bug in that importer; and, at group level, the alternative of one shared group importer for every brand.\n\n**So what:** A Chief Architect who accepts this contracts a removal latency per channel and measures it per vendor, publishes feed health to partners and sellers as a commercial metric, certifies vendors against a sandbox before issuing credentials, and versions the contract like an API program. Veldmark adopts Supply Contract v1 in September 2027: one ingestion-record envelope, one error catalog in RFC 9457 format, mandatory mass-change guards and brand-local adapters.\n\n**How and why:** On 8 March 2027 an importer that treated every vehicle missing from a truncated file as sold unpublished 38,400 Motorvane listings for 286 dealers, and a fifth came back with new IDs because the key mapping had been purged; one guard would have turned that into 286 held runs and one call to the vendor. The Essen Golf stayed listed 26 hours after its sale because a daily snapshot is a 24-hour removal SLA nobody chose. Some of Hearthly's 160 vendors never send deletes, and Tradeyard's CSV importer validates differently from its web form, so the same listing passes one door and fails the other.\n\n**Supporting claims**\n\n- **S1** — Channels differ in where the truth about a listing lives: only the insertion flow keeps it inside the marketplace, and for partner APIs, bulk feeds and replication the central problem is keeping a copy aligned with a source the marketplace does not control.\n- **S2** — A feed contract is much more than a schema: it states absence semantics (snapshot or delta, neither sufficient alone), identity, tenancy, field ownership, removal timeliness, errors, limits, reconciliation and change management, and real marketplaces' published contracts encode these clauses.\n- **S3** — Every door should end in one write path: adapters emit a channel-neutral ingestion record that one validator, reconciler and command gateway handle with idempotent commands keyed by the partner's reference, with the external-key mapping kept as listing data, and the insertion flow uses the same validator.\n- **S4** — Drift between partner state and platform state is a normal operating condition, so snapshot channels run behind a mass-change guard, delta channels reconcile on a schedule, removal latency is a contracted number, and errors return to partners as stable, per-record reports.\n- **S5** — A group shares the contract, error catalog, validator and guards while keeping adapters local to each partner ecosystem, applies the same contract to group-owned vendors, and governs ingestion like an API program with partner health published as a commercial metric.\n\n## Role in the part\n\nSets the first link of the supply chain: the boundary where outside systems write into the listing model, and the contract and write path every later link relies on. Supports P3-1 of part `part-3`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in scene, concepts and public contracts: the problem, then the vocabulary, then evidence, before the design that uses all three; `assertion_evidence_reasoning` in in-practice: the design is run on Motorvane's volumes and the Essen Golf, then on Hearthly's vendors)\n\nThe scene poses the problem as three incidents and Ingrid's three-part question. The concepts give the words the answer needs (channels, where the truth lives, snapshot and delta, the contract), and the public contracts show that operators already wrote those clauses down, so the architecture can be presented as the design that enforces them. In practice tests the design on real volumes and shows a removal deadline nobody chose; trade-offs, vertical differences, failure modes, the Chief Architect's view and review questions are judgements about a design the reader has already seen. Moving the architecture before the concepts would use snapshot, delta and the contract before they are defined; moving the public contracts after the architecture would present evidence for decisions already taken; moving the Golf before the architecture would show components the reader cannot yet name.\n\n## Introduction\n\n**Hook** (`intriguing_example`): A private seller photographs a city bike in the app; a dealer's management system pushes 200 cars every evening; an agency's CRM sends a flat to fifteen portals at once; a developer uploads a spreadsheet of new-build units; a partner API creates listings for a fleet of rental vans; each door tends to grow its own idea of what a listing is.\n\n**Bridge:** The integrations and importers every marketplace team builds, one per customer and per era. → Ingestion as the first link of Part III's supply chain: the boundary where outside systems write into the listing model and every later link relies on what it accepts.\n\n**Thesis statement** (KEY POINTS callout (all three bullets); restated in the architecture section's p21.): Many doors, one write path: every channel should end in the same idempotent command, validated by the same compiled schema and keyed by the partner's reference, under a feed contract that says what absence means, who owns each field, how fast removals arrive and how both sides reconcile, because partner and platform state will drift.\n\n**Roadmap** (Paragraph p04, after the neighbors paragraph, naming the sections in order.):\n\n- Start with the 8 March 2027 incident and the question it raised. *Kept in:* scene.\n- Define the channels, snapshot and delta semantics and the feed contract. *Kept in:* concepts.\n- Read the partner contracts real marketplaces publish. *Kept in:* public-contracts.\n- Answer with many doors and one write path. *Kept in:* architecture.\n- Test the design on the Essen Golf and Hearthly's vendors. *Kept in:* in-practice.\n- End with trade-offs, vertical differences, failure modes, the Chief Architect's view and review questions. *Kept in:* trade-offs, verticals, failure-modes, ca-view, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Supply arrives through more doors than a product team counts, each built at a different time for a different customer, and each tends to grow its own idea of what a listing is. | scenario: A private seller's city bike in the app; a dealer system pushing 200 cars each evening; an agency CRM sending a flat to fifteen portals; a developer's spreadsheet of new-build units; a partner API creating rental vans. |  |\n| p02 | definition | Ingestion, the first link of Part III's supply chain, is the boundary where outside systems write into the listing model, described by three terms this chapter owns (ingestion channel, feed contract and delta feed against full snapshot). |  | `elaboration`: The doors and the many ideas of a listing. → Ingestion as the boundary that turns outside supply into listing commands, and the three terms the chapter owns. |\n| p03 | context | Five neighboring chapters own what ingestion does not, and Veldmark, the book's fictional group, supplies the worked examples. |  | `contrast`: What this chapter owns. → What the neighbors own: the aggregate, schemas, normalization, publication and pro tooling. |\n| p04 | transition | The chapter starts with the 8 March 2027 incident, defines the channels, snapshot and delta semantics and the feed contract, reads the partner contracts real marketplaces publish, answers with many doors and one write path, tests the design on the Essen Golf and Hearthly's vendors, and ends with trade-offs, vertical differences, failure modes, the Chief Architect's view and review questions. | reasoning: The chapter's sections named in order, with the incident and the worked examples. | `sequence`: The boundary, its terms and its neighbors. → The order in which the chapter answers how the boundary should work. |\n\n## Sections\n\n### Setting the Scene at Veldmark: The Morning 38,400 Cars Disappeared\n\n**Controlling idea** (`context`, id `scene`): Three Veldmark brands meet the same root problem from three sides (a truncated snapshot removing stock, deletes that never arrive, and two doors that validate differently), and none can say for each door what the contract is, who owns the truth and how it would know its copy were wrong.\n\n**Advances the thesis** (S2, S4): Poses the problems the contract, the guard and reconciliation answer.\n\n**Transition in:** `example`: The roadmap's first item: the 8 March 2027 incident. → The incident itself and the forum it reached.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | example | On 8 March 2027 Motorvane's importer, doing what it was built to do, treated every vehicle missing from a vendor's truncated nightly files as sold and unpublished 38,400 listings for 286 dealers, a fifth of which came back with new IDs because the key mapping had been purged. | scenario: 02:40 CET files for 286 dealers cut short; 38,400 listings unpublished by 02:55; about 1,900 paid top placements lapsed; more than 600 support calls; complete files resent at 09:40; about a fifth returned with new listing IDs. |  |\n| p06 | example | At the advice forum the other brands showed the same root from different sides: Hearthly's feeds from about 160 vendors include some that never send deletes and leave ghosts, and Tradeyard's CSV importer validates differently from its web form. | scenario: Hearthly: 84% of 2.6 million live listings via feeds from about 160 vendors; a few percent of live listings estimated to be ghosts. Tradeyard: a 2014-era CSV importer that validates differently from the web form. | `similarity`: Motorvane's incident brought to the forum. → Hearthly's opposite problem and Tradeyard's two doors, from the same root. |\n| p07 | claim | Ingrid's question was not which technology to use but, for each door, what the contract is, who owns the truth and how the platform would know its copy were wrong; no brand could answer for all its channels. |  | `conclusion_summary`: Three brands' problems. → The one question they share, which the rest of the chapter answers. |\n\n### Concepts: Doors, Contracts and the Truth Outside\n\n**Controlling idea** (`definition`, id `concepts`): Where the truth about a listing lives decides each channel's design; when it lives outside, absence semantics (snapshot or delta) and a feed contract much wider than a schema decide whether the platform's copy stays aligned.\n\n**Advances the thesis** (S1, S2): Defines the channels, the semantics and the contract the thesis relies on.\n\n**Transition in:** `problem_solution`: Ingrid's three-part question. → The vocabulary needed to answer it: channels, where the truth lives, snapshots, deltas and the contract.\n\n**Order of paragraphs** (`prerequisite_order`): Channels and where the truth lives come first because snapshot and delta semantics only matter when the truth is outside; the contract follows because it is where those semantics are written down, and its commercial weight comes last because it needs the contract defined.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | claim | Of the four channels (insertion flow, partner API, bulk feed and replication from an external system of record), where the truth lives decides the design: when the marketplace holds it, ingestion is a user-experience and validation problem; when a dealer's DMS, an agency's CRM or an MLS holds it, the central problem is keeping a copy aligned with a source the marketplace does not control. | table: Four kinds of ingestion channel: insertion flow, partner API, bulk feed and replication, with who uses each, how data moves, rhythm and where the truth lives. |  |\n| p09 | context | Scraping is not a fifth channel, because a group that wants partner supply should offer a contract, and syndication is ingestion's mirror image, covered elsewhere. |  | `contrast`: The four channels. → What is deliberately not a channel here. |\n| p10 | definition | A full snapshot means absence is removal: it heals any earlier mistake with the next complete file, but a truncated file looks exactly like a dealer who sold everything. |  | `elaboration`: Channels whose truth lives outside. → The first of the two ways a partner can send that truth: the full snapshot. |\n| p11 | definition | A delta feed sends only creates, updates and explicit deletes; it is fast but not self-healing, so lost deletes and misdirected deletes make the two sides drift. |  | `contrast`: The snapshot's self-healing and its danger. → The delta's speed and its drift. |\n| p12 | claim | Neither suffices alone, so the dependable pattern, visible in public contracts, is incremental changes for speed plus periodic full reconciliation for correctness. | source: Rightmove's RTDF is incremental but offers GetBranchPropertyList as a snapshot to check that nothing is still live that should have been removed (v1.4.1, 2023).; source: RESO Web API replication: full dataset first, then recent changes (n.d.).; figure: Figure 1: truncated snapshot, lost delete, and deltas plus reconciliation. | `conclusion_summary`: The snapshot's and the delta's weaknesses. → The combined pattern and public evidence for it. |\n| p13 | definition | A feed contract is everything both sides must agree on for a channel to be operable, and schema validity is perhaps a third of it. | table: Eleven clauses (scope and tenancy, identity, semantics, field ownership, schema and version, timeliness, media, errors and feedback, limits, reconciliation, change management), each with its question and what goes wrong without it. | `elaboration`: Snapshot or delta as a semantic choice. → The contract where that choice and the other agreements are written down. |\n| p14 | analysis | The contract is a product artifact too: partners judge a marketplace by its feed's predictability, and because dealers multi-home, the feed is where an automotive marketplace competes for the dealer's attention. | source: Productscape model measures: partner integration reliability, certification lead time, validation error recurrence.; source: Bundeskartellamt, October 2026: dealers multi-home and many platforms offer data export to other platforms. | `emphasis`: The contract's clauses. → Why the contract matters commercially, not only technically. |\n\n### The Public Contracts: What Real Marketplaces Publish\n\n**Controlling idea** (`evidence`, id `public-contracts`): The partner contracts real marketplaces publish encode four lessons: the partner's key is the listing's identity at the boundary, creates must be safe to retry, tenancy is part of the contract, and validation rules carry policy.\n\n**Advances the thesis** (S2, S3): Grounds the contract and the write path in what operators have published.\n\n**Transition in:** `additional_support`: The feed contract as concept and product. → Evidence from the contracts real marketplaces publish.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p15 | evidence | Few marketplaces publish their pipelines, but several publish detailed partner contracts, which are good evidence of what operators learned, and four lessons recur across them. | table: Six public contracts (Rightmove RTDF, mobile.de Seller-API and XML upload, Autotrader UK, OpenImmo, RESO, eBay Sell Feed and Inventory APIs) with vertical, transport, identity and notable rules, each dated or marked n.d. |  |\n| p17 | evidence | The partner's key is the listing's identity at the boundary: scoped to the integration and seller, it is what makes a re-sent record an update rather than a duplicate. | quotation: Rightmove uses Agent_Ref to decide whether a property is new; an update must 'provide the same Agent_Ref'. mobile.de's bulk format carries the dealer's seller-inventory-key and the dealer's customer number on every ad. | `sequence`: The table of contracts and the four lessons it announces. → The first: identity. |\n| p18 | evidence | Creates must be safe to retry, and one listing's requests must not run in parallel. | fact: mobile.de's X-Mobile-Insertion-Request-Id returns HTTP 303 to the ad already created on a retry; GET, PUT and DELETE are idempotent, POST is not; clients must not send parallel requests for the same ad. | `sequence`: Identity. → The second lesson: retries and concurrency. |\n| p19 | evidence | Tenancy is part of the contract: both Rightmove and mobile.de separate the integration principal (the vendor) from the seller it acts for. | fact: Rightmove's network and branch IDs with sales and lettings channels, rejecting a channel the branch lacks; mobile.de access only for transfer service providers and self-uploading dealers, each seeing only linked sellers. | `sequence`: Retries. → The third lesson: who may write for whom. |\n| p20 | evidence | Validation rules are where policy lives, so the feed contract is a compliance surface: a field the law requires must be required in the feed. | fact: Autotrader errors reject a price below a minimum of 75 and DVLA category A or B write-offs; Rightmove 1.4.0 (April 2022) added ground rent, service charge and council-tax band, 1.4.1 (November 2023) utilities, parking, flood risk and accessibility. | `sequence`: Tenancy. → The fourth lesson: policy in validation. |\n\n### Architecture: Many Doors, One Write Path\n\n**Controlling idea** (`recommendation`, id `architecture`): Every channel ends in the same idempotent, validated command keyed by the partner's reference, with keys, ordering, field ownership, a mass-change guard, scheduled reconciliation, error reports and back-pressure built into one write path that the insertion flow shares.\n\n**Advances the thesis** (S3, S4): Gives the design the thesis prescribes and the controls for drift.\n\n**Transition in:** `problem_solution`: The contract clauses and the lessons of the public contracts. → The design that enforces them: one write path behind many doors.\n\n**Order of paragraphs** (`large_to_small`): The overall shape and its record come first, then identity, because ordering, ownership and reconciliation all key on it; the guard and reconciliation follow the reconciler that hosts them; errors, load and media are what surrounds a run. The insertion flow comes last, its funnel view and metric before its architecture, so the partner path runs unbroken and the section ends on the claim that the human door uses the same path, which needs the path described; its opening sentence names it as the first door of the channel table.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p21 | claim | The channel determines the transport and the rhythm, never the meaning: every channel ends in the same small set of listing commands, validated by the same compiled schema, reporting through the same error catalog. | figure: Figure 2: adapters turn each transport into one ingestion record, glossed in the caption as one channel-neutral envelope per partner listing; change detection, validation, reconciliation and the guard sit before the listing service; errors return through one report format.; table: Components and responsibilities: channel adapters, ingestion record log, change detection, validator, reconciler, mass-change guard, command gateway, run reports, feed operations console, each with what it must not do. The adapters row names the two authentication options (mutual TLS or OAuth 2.0) that the trade-off table weighs. |  |\n| p22 | explanation | The ingestion record is the key internal abstraction: channel-neutral, so one reconciler, validator and report format serve every partner, which is what Veldmark's parse-then-write importers lacked. | example: The record's fields; a Rightmove-style JSON call, an OpenImmo ZIP and a Tradeyard CSV row look identical after the adapter. | `elaboration`: The components. → The record that flows between them. |\n| p23 | definition | Ingestion has three kinds of key (external key, request idempotency key and record sequence), and confusing them causes most duplicate and overwrite bugs. | table: Key, scope, purpose and example for each; the request-key example names mobile.de's insertion request ID and a Stripe idempotency key. | `elaboration`: The ingestion record, which carries an external key. → The three keys and why they must not be confused. |\n| p24 | recommendation | The mapping from external key to listing ID is listing data, not importer state: kept on the listing and kept through removals, it returns a reappearing car's old ID, URL, favorites and price history. | case: Motorvane's March incident became a duplicate problem because the importer purged the mapping when it unpublished the cars. | `cause_effect`: The external key. → The first of three design rules that follow from it. |\n| p25 | recommendation | There is no standard HTTP idempotency header, so the platform must define one in its own contract. | fact: The IETF Idempotency-Key draft reached version 07 in October 2025 and expired without becoming an RFC.; fact: Stripe's documented idempotency semantics: keys up to 255 characters, results stored once execution begins, keys pruned after at least 24 hours, a mismatch error if parameters differ. | `sequence`: The first rule, on the external key. → The second rule, on the request key. |\n| p25a | recommendation | One seller arriving through two doors is still one listing: ingestion matches the same seller's strong key (VIN, agency reference) across integrations and merges at the boundary, leaving cross-seller duplicates to entity resolution. | example: A dealer switching DMS vendors whose old and new vendors both send stock for a week; a car sent through a vendor and through the pro tool. | `sequence`: The first two rules, on the external key and the request key. → The third rule: the same seller's listing across channels. |\n| p26 | process (list) | Out-of-order updates are kept in order by three rules: serialize per listing, apply only newer partner versions, and use expected versions on commands. | fact: mobile.de's no-parallel-requests rule; Rightmove's Update_Date. | `elaboration`: The record sequence key. → How ordering is enforced. |\n| p27 | recommendation | Feed-driven listings have three writers (the feed, the seller in the pro tool and the platform), so the contract must say who owns each field or the evening snapshot reverts the dealer's noon price cut. | table: Field groups with default owner and whether the feed may overwrite: identity facts, price and media (unless the seller locks), visibility products via product calls only, moderation state never, enriched values never directly, lifecycle clock indirectly.; figure: Figure 3: field lanes owned by the feed, the seller's lock or the platform. | `additional_support`: Ordering between writes of one channel. → Conflicts between different writers of one listing. |\n| p28 | process | The reconciler turns a run into changes: it applies a delta run's operations and, for a snapshot run, computes per seller the difference that becomes removals, which is where the guard sits. | figure: Figure 4: the life of a snapshot run, with a run beyond thresholds held and reported. | `sequence`: Who may change which field. → How a run becomes changes at all. |\n| p29 | recommendation | A mass-change guard holds a seller's snapshot run whose effect exceeds thresholds set by seller size, and it would have turned Motorvane's 38,400 removals into 286 held runs and one call to the vendor. | example: A small dealer selling three of eight cars on a Saturday is normal; an agency losing 60% overnight is not. Held runs are confirmed by the partner or an operator, or superseded by a complete resend. | `elaboration`: Where the guard sits. → What it holds and how a held run is released. |\n| p30 | recommendation | Delta channels need the reverse control, scheduled reconciliation: at least weekly, daily for high-value verticals, the platform compares the partner's live keys with its own and routes the differences through the same guard and pipeline. |  | `contrast`: The guard on snapshot channels. → The control delta channels need instead. |\n| p31 | recommendation (list) | Partners experience a marketplace through its error reports, so a report is per run and per record, with stable codes from one validator, warnings as a third outcome, asynchronous results for files, and malformed input answered as the sender's error. | quotation: Rightmove's warning tier: 'the call has been successful, but one of the business rules has failed'.; source: RFC 9457 problem details (July 2023) with an errors array of JSON Pointers; mobile.de's 400 with an errors array.; source: eBay Sell Feed API: each upload a task with an ID, status and result file.; case: Adevinta's InfoJobs media service returned 500 for files that were two PDFs joined together. | `sequence`: Changes computed, held or applied. → How partners learn the outcome. |\n| p32 | recommendation (list) | Feed traffic is spiky, so per-partner queues, honest rate limits, quotas checked against entitlements and priority by effect keep one partner from starving the rest and removals from waiting behind creates. | fact: Autotrader's 'dynamic reputation scoring' of inbound connections.; case: Motorvane's importer skipped over-quota cars while its billing export counted every feed row, so dealers were billed for cars never published (2027), told in its own sentence after the rule. | `additional_support`: Errors flowing back to partners. → Load flowing in from them. |\n| p33 | explanation | Media dominates feed bytes, but ingestion only references media; its decision is whether a listing may go live before its images are processed. | fact: Rightmove pulls media by URL, up to 999 items and 20 MB per image, and does not re-retrieve images with the same Media_Update_Date; mobile.de pre-uploads images and references them by ID. | `additional_support`: Load from records. → The heaviest part of that load: media. |\n| p34 | context | The insertion flow is a conversion funnel in which every step that asks a casual seller for something they lack loses supply. | source: Productscape seller-journey pains: forced account creation, mobile uploads over weak connections, a rejection 'with an unclear reason'. | `contrast`: The partner records and the machinery around them. → The first door in the channel table, the human one, on the same path. |\n| p36 | recommendation | The funnel metric that matters is published-and-contacted, not form completion, because asking for less can move the problem downstream. | example: Tradeyard measures start-to-publish rate and first contact within 48 hours side by side. | `elaboration`: The insertion flow as a funnel. → The funnel metric that matters. |\n| p35 | recommendation (list) | Architecturally the insertion flow is a channel like the others: drafts are listing state, the category selects the schema, the form uses the same validator and command gateway, and assistance only suggests values whose provenance is recorded. | case: OLX (2026): several tabs resuming the same upload duplicated objects; solved with the Web Locks API.; source: eBay's photo-based listing tool (September 2023); Kleinanzeigen photo suggestions excluding vehicles and intangibles (trade press, November 2025). | `contrast`: The funnel view and its metric. → The same flow seen as a channel. |\n\n### In Practice: The Essen Golf Comes In Through a Feed\n\n**Controlling idea** (`example`, id `in-practice`): Motorvane's feed volumes and the Essen Golf's life through a daily snapshot show that most records are unchanged and that a contract's rhythm silently sets its removal deadline, while Hearthly's 160 vendors show why the contract must be explicit and measured per vendor.\n\n**Advances the thesis** (S3, S4): Tests the write path on real volumes and shows the removal deadline as a contract term and vendor compliance as something to measure.\n\n**Transition in:** `example`: The write path as designed. → The write path under Motorvane's and Hearthly's real supply.\n\n**Order of paragraphs** (`chronological`): Volumes first so the Golf's run makes sense; then the Golf's create, price change and sale in date order, because the 26-hour lag only reads as a contract fault after the earlier steps worked; Hearthly last, because its problem is breadth rather than one listing.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p37 | evidence | Motorvane is the clearest case because most of its supply arrives by machine, and nightly snapshots carry well over a million records although only about 30,000 dealer listings a day are new. | statistic: 1.45 million live listings; 91% from 21,400 dealers; 88% of dealer listings via DMS feeds (about 1.16 million); about 210,000 new dealer listings a week. |  |\n| p38 | analysis | Most feed records are unchanged, so content-hash change detection drops about 91% of snapshot records before validation and leaves about 100,000 changed records a day for the rest of the pipeline. |  | `cause_effect`: Re-sending every car every night. → The first design fact it yields. |\n| p39 | example | The Golf enters through Autohaus Ruhrblick's 17:00 snapshot on 14 April 2027 and is searchable at 17:05 after change detection, validation, reconciliation, the listing service, enrichment and publication. | table: Time-stamped steps from snapshot arrival (148 vehicles within a 150-slot package) to publication, with 145 records skipped, 2 price changes, 1 create, 31 attributes from VIN decoding and a €22,800 market-value estimate. | `example`: Volumes and change detection. → One car through one run. |\n| p40 | evidence | Over the next ten days the Golf draws 23 raw leads, 19 after removing repeat contacts. | statistic: 23 raw leads (14 e-mails, 7 calls, 2 test-drive bookings); 19 deduplicated. | `time`: The Golf live. → What a live listing earns. |\n| p41 | example | A price cut entered at 11:20 reaches Motorvane in the 17:00 snapshot, nearly six hours later, which is acceptable for a price cut. | statistic: Price cut to €21,400; price-drop alerts to 1,180 watchers shortly after 17:00. | `time`: The Golf's first ten days. → The first change after creation. |\n| p42 | analysis | Sold at 15:10 on 29 April and recorded the next morning, the Golf left search 26 hours after the sale although no component misbehaved, because a daily snapshot is a 24-hour removal SLA nobody chose. | scenario: Removed at 17:10 on 30 April; meanwhile searchable, in a morning alert digest, three more enquiries. | `contrast`: Six hours acceptable for a price cut. → The same rhythm unacceptable for a sale. |\n| p43 | recommendation | Motorvane's fix is a hybrid contract: snapshots for completeness, status changes as Seller API deltas within 15 minutes, vendors that cannot comply labeled, and the forecourt-to-DMS gap left to a one-tap sold action in the dealer app. |  | `problem_solution`: The 26-hour ghost. → The contract change that removes it. |\n| p44 | evidence | Hearthly's problem is breadth: about 160 vendors for 36,500 agencies fall into about 40 reliable, 90 with recurring warnings and 30 that cause most incidents, including those that never send deletes. | statistic: 160 vendors, 36,500 agencies in France and Spain; 40 / 90 / 30 vendor classes; Casavista's importer since 2025.; case: Two real-estate software vendors and Keybridge supplied the Lyon apartment's three listings in May 2027. | `contrast`: Motorvane's depth of volume through few vendors. → Hearthly's breadth of vendors. |\n\n### Trade-offs\n\n**Controlling idea** (`comparison`, id `trade-offs`): Each major ingestion choice (transport, semantics, acceptance, media, authentication, standards and group ownership) has conditions under which each option is right, and standards belong behind adapters because they change slowly.\n\n**Advances the thesis** (S3, S5): Shows when the recommended options hold and why standards stay adapters.\n\n**Transition in:** `conclusion_summary`: The design and its worked examples. → The choices behind it and when the alternatives win.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p46 | comparison | Seven decisions shape an ingestion design, and each option in them is right under stated conditions. | table: Seven decisions with two options each and when each is right, including RFC 9700's OAuth best practice (no password grant, PKCE for public clients) and shared contract with local adapters at Veldmark. |  |\n| p47 | analysis | Standards change slowly, so a receiver must run adapters for two generations of a standard for years, which is why the standard should be an adapter into the platform's own contract. | fact: OpenImmo XML dates from 2001 and its incompatible REST and JSON successor was expected to reach final release at the end of 2026; Rightmove dropped XML in 2019. | `elaboration`: The standards row of the table. → Why it favors adapters. |\n\n### Vertical Differences\n\n**Controlling idea** (`comparison`, id `verticals`): Verticals differ in dominant channel, where the truth lives, identity anchor and removal pressure, and each adds content the contract must carry: embargo flags in US real estate, closure in jobs and trader traceability in the EU.\n\n**Advances the thesis** (S1, S2): Shows where the truth lives per vertical and which clauses each vertical adds.\n\n**Transition in:** `contrast`: Choices that hold across verticals. → How the verticals differ.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p48 | comparison | General classifieds, real estate, automotive and jobs differ in which door dominates, where the truth lives, what anchors identity and how hard removal presses. | table: Seven dimensions across four verticals, with Tradeyard 78%, Hearthly 84% and Motorvane 88% as dominant-channel figures. |  |\n| p49 | evidence | US real estate adds visibility: embargo and visibility flags must travel as data on each record and be honored as a compliance control. | fact: NAR's multiple-listing-options policy, effective 25 March 2025, allows delayed-marketing exempt listings whose IDX and syndication marketing is postponed. | `elaboration`: The table's real-estate column. → One clause real estate adds. |\n| p50 | evidence | Jobs add expiry as a hard requirement, so a jobs feed that cannot express closure is a search-engine risk. | quotation: Google: failure to remove expired job postings 'may result in a manual action'. | `additional_support`: Real estate's clause. → Jobs' clause. |\n| p51 | evidence | In the EU, trader traceability adds a rule to every feed channel: no vendor may create listings for a trader whose traceability data is incomplete. | fact: DSA Article 30, applicable since 17 February 2024: collect and make best efforts to verify trader information before use. | `additional_support`: Jobs' clause. → A rule that applies to every vertical in the EU. |\n\n### Failure Modes\n\n**Controlling idea** (`counterargument`, id `failure-modes`): Nine common mistakes undo the design, each the reverse of a rule the chapter states in its contract clauses, architecture or Chief Architect's view.\n\n**Advances the thesis** (S2, S3, S4, S5): Shows what happens when each rule is skipped.\n\n**Transition in:** `contrast`: The design, its options and its vertical variants. → How it fails in practice.\n\n**Order of paragraphs** (`grouping`): Guard and reconciliation failures come first because they are the scene's incidents; identity and validation follow, then feedback and load, then change and compliance, following the order of the contract's clauses: absence and drift (semantics, reconciliation), identity, validation, feedback and load, then change and compliance.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p51a | transition | The design fails in practice when one of its rules is skipped, and each failure below is one such rule. |  |  |\n| p52 | counterargument | Absence treated as truth without a guard lets a truncated snapshot remove a seller's stock, so every snapshot channel needs a guard whose thresholds have an owner. | example: The Motorvane incident in one sentence. | `sequence`: The announcement that each failure is a skipped rule. → The first failure: absence treated as truth. |\n| p53 | counterargument | Deltas without reconciliation accumulate ghosts invisibly, so the reconciliation report is the primary health signal for delta partners. |  | `additional_support`: The previous failure mode. → Another way the design is undone. |\n| p54 | counterargument | An external-key mapping held by the importer and cleaned up on removal turns a re-sent listing into a new one, so the mapping stays on the listing until it is purged. |  | `additional_support`: The previous failure mode. → Another way the design is undone. |\n| p55 | counterargument | Two channels for one seller without recognition create duplicates, so ingestion merges the same seller's strong keys at the boundary and leaves cross-seller duplicates to entity resolution. |  | `additional_support`: The previous failure mode. → Another way the design is undone. |\n| p56 | counterargument | Different validation behind different doors teaches sellers to pick the lenient door, which one validator compiled from one schema ends. | example: Tradeyard's CSV importer and web form. | `additional_support`: The previous failure mode. → Another way the design is undone. |\n| p57 | counterargument | Errors that surface only in support tickets make every fix a conversation, while machine-readable run reports for vendor and seller cost less. |  | `additional_support`: The previous failure mode. → Another way the design is undone. |\n| p58 | counterargument | Partner bugs counted against the platform (5xx for bad input, retry storms, one backlog delaying everyone) are avoided by classifying errors at the boundary and isolating partners. |  | `additional_support`: The previous failure mode. → Another way the design is undone. |\n| p59 | counterargument | Breaking changes by surprise break every vendor at once, so new requirements are published as recommended first with an effective date and a fixed notice period. | example: eBay's expectedRequiredByDate; Autotrader's 30-day minimum. | `additional_support`: The previous failure mode. → Another way the design is undone. |\n| p60 | counterargument | Regulatory fields left optional in the feed publish non-compliant ads at feed speed, so legally required fields block in the validator, versioned by effective date. |  | `additional_support`: The previous failure mode. → Another way the design is undone. |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `ca-view`): At group scale ingestion is a set of contracts and the discipline to operate them: share the contract and keep adapters local, contract removal latency, publish partner health, own each door, govern change, hold the group's own vendor to the same contract and keep the evidence.\n\n**Advances the thesis** (S5, S4): States the group-level decisions the thesis's so-what names.\n\n**Transition in:** `problem_solution`: The failure modes. → The decisions a Chief Architect takes so they do not recur.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p61 | claim | At group scale ingestion is a set of contracts and the discipline to operate them, and Veldmark's decisions generalize. |  |  |\n| p62 | recommendation | Share the contract, not necessarily the importer: Veldmark's Supply Contract v1 (September 2027) shares one envelope, one RFC 9457 error catalog, field-ownership defaults, mandatory guards and weekly reconciliation, and a validator library, while adapters stay local. | case: Motorvane's German, Dutch, Polish and Austrian DMS vendors, Hearthly's French and Spanish agency-software vendors and Tradeyard's own pro sellers share almost nothing. | `sequence`: The decisions generalize. → The first: what to share. |\n| p63 | recommendation | Make removal latency a contracted number per channel, measured from the partner's own timestamp to the listing leaving search. |  | `sequence`: What to share. → The second decision: removal latency. |\n| p64 | recommendation | Treat partner health as a commercial metric and give the same numbers to partner and seller, because dealers blame the marketplace for empty lead inboxes. |  | `sequence`: Removal latency. → The third decision: partner health. |\n| p65 | recommendation | Decide who owns each door, with a contract owner and a partner-operations function that certifies vendors against a sandbox before issuing credentials. | fact: mobile.de requires transfer service providers with more than ten customers to supply contacts, software details, VAT ID and customer numbers before access. | `sequence`: Partner health. → The fourth decision: ownership. |\n| p66 | recommendation | Govern contract changes like an API program, because a breaking change is paid for by 160 vendors and 36,500 agencies. |  | `sequence`: Ownership. → The fifth decision: change. |\n| p45 | recommendation | Hold the group's own vendor to the same contract: Keybridge, which also publishes to Hearthly's competitors, integrates with Hearthly through the same public contract, credentials, limits and error catalog as every other vendor. |  | `sequence`: Change governance, including who learns of schema changes first. → The sixth decision: neutrality for the group's own vendor. |\n| p67 | recommendation | Keep the ingestion record log as evidence for dealer, billing and regulatory disputes, retained for their windows with personal data minimized. |  | `sequence`: Neutrality for the group's own vendor. → The seventh decision: evidence. |\n| p68 | recommendation | What to watch: listings past their freshness SLA, held runs, reconciliation drift, the partners with most warnings and sold-to-gone latency, because duplicates or ghosts upstream of search usually start as a feed change. |  | `conclusion_summary`: The seven decisions. → The measures that show whether they hold. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Ten review questions turn the chapter's rules into checks a design review can apply to any ingestion setup.\n\n**Advances the thesis** (S1, S2, S3, S4, S5): Puts each rule in a form a reviewer can test.\n\n**Transition in:** `conclusion_summary`: The Chief Architect's decisions. → Questions that test whether a design meets them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p69 | recommendation (list) | Ten questions cover where the truth lives, absence, the key mapping, one validator, field ownership, removal latency, partner feedback, isolation under load, legal fields and equal terms for group-owned integrations. |  |  |\n\n## Conclusion: From Accepted to Usable\n\n**Synthesis:** None of Veldmark's incidents was an importer bug: the 38,400 removals, the Golf's 26 hours, Hearthly's ghosts and Tradeyard's two validators were each a contract clause nobody wrote, and the guard, the reconciliation schedule, the key mapping and the shared validator are those clauses in running form.\n\n**So what:** An architect's lever on ingestion is the contract per door rather than the importer technology, so Ingrid's three-part question can be answered for every door before the next incident.\n\n**Callback:** The opening's doors, each growing its own idea of what a listing is (p01), and Ingrid's question in the scene (p07). The doors now share one write path and one contract each, and the question has an answer per door.\n\n**Takeaway** (`course_of_action`): For each door, write down the contract, who owns the truth and how the platform would know its copy were wrong.\n\n**Hand-off** to [From Raw Supply to Usable Listings: Normalization and Enrichment](normalization-and-enrichment.html): `contrast`: The records ingestion accepted, and the Essen Golf that arrived through its dealer's feed on 14 April 2027. → The gap between accepted and usable (wrong-locale prices, makes spelled five ways, addresses without coordinates, a car described only by its VIN) and the question of which values the seller said and which the platform derived.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p70 | synthesis | None of Veldmark's incidents was an importer bug but a contract clause nobody wrote, and the guard, reconciliation, key mapping and shared validator are those clauses in running form, so the opening's doors can share one write path and Ingrid's question can be answered per door. |  |  |\n| p71 | transition | Accepted records are not yet usable (wrong-locale prices, makes spelled five ways, addresses without coordinates, a car described only by its VIN), and the next chapter follows the same Golf to a consistent, enriched listing that records which values the dealer said. |  | `contrast`: The records the boundary accepts. → What they still lack, and the next chapter. |\n\n## Non-goals\n\n- The listing aggregate's identity, invariants and lifecycle. See [The Listing Aggregate: Identity, Lifecycle and Invariants](listing-aggregate.html).\n- Attribute dictionaries and compiled category schemas. See [Attributes Without Chaos: Schemas, Dictionaries and Validation](attribute-schemas.html).\n- Value normalization, enrichment and attribute provenance. See [From Raw Supply to Usable Listings: Normalization and Enrichment](normalization-and-enrichment.html).\n- Cross-seller duplicates and canonical entities (only same-seller, cross-channel merges are covered here). See [One Property, Three Listings: Duplicates and Entity Resolution](entity-resolution.html).\n- Freshness SLAs end to end and unpublish propagation. See [From Submitted to Searchable: The Publication Pipeline](publication-pipeline.html).\n- Dealer and agent products built on the channels; media processing; outbound syndication. See [Serving the Pros: Dealer, Agent and Merchant Tooling](professional-seller-tooling.html), [Photos Sell: Media Pipelines for Listings](media-pipeline.html), [Every Change Is an Event: Event-Driven Listing Architecture](event-driven-listings.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- mobile.de's full-versus-delta semantics for its XML upload are documented on a page the research did not fetch; the chapter does not state them. (Carried over from spec.md.)\n- The French agency-software export landscape (passerelles) is described only as industry practice; no current vendor or format facts were verified. (Carried over from spec.md.)\n- The DSA Article 30 wording was read at summary level; check the article text on EUR-Lex before print. (Carried over from spec.md.)\n- Kleinanzeigen's photo-to-listing evidence is trade press, not a company engineering source. (Carried over from spec.md.)\n- The four checklist, summary, dialog and comics modalities listed (unchecked) in spec.md do not exist; modalities is empty. (Carried over from spec.md.)\n\n## Decision log\n\n- **2026-10-19** — Organized the chapter around where the truth lives per channel rather than around transports, because the system-of-record question separates a UX problem (insertion flow) from a reconciliation problem (feeds). Rejected: Sections per transport (API, file, replication).\n- **2026-10-19** — Used publicly documented partner contracts (Rightmove RTDF, mobile.de Seller-API, Autotrader, OpenImmo, RESO, eBay Feed API) as the evidence base, since marketplaces rarely publish internal pipelines; inferences about internals were avoided.\n- **2026-10-19** — Opened with a fictional truncated-snapshot incident (Motorvane, 8 March 2027) and explained the ledger's 26-hour Golf removal as a contract consequence (daily snapshot equals a 24-hour removal SLA), resolved by a hybrid snapshot-plus-status-delta contract.\n- **2026-10-19** — Recommended a shared group contract (Supply Contract v1) with local adapters instead of a single group ingestion platform, consistent with 'share platforms, not products'; treated Keybridge neutrality as an ingestion-contract requirement. Rejected: One group ingestion platform for all brands.\n- **2026-11-12** — Converted spec.md to spec.json. Success criteria: 5 (three keys, mapping survives removals) and 6 (guard, reconciliation, 8 March incident and the Golf's 26-hour lag) rewritten as AC-4 (minor, added for this post, not in the journal spec); 1 (channel table), 2 (snapshot versus delta with RTDF and RESO), 3 (contract clauses) and 4 (draw the architecture) dropped as inventories covered by AC-1 and AC-2; 7 (trade-off table) dropped as an inventory; 8 (dated sources) dropped as a criterion because it is the house evidence rule, not a reader outcome.\n- **2026-11-12** — After draft-check round 1, moved the insertion flow (p34, p36, p35) to follow the ingestion record (p22): both flow readers found it out of place at the end of the architecture section, after media. Order, transitions and the section flow reason changed; intent, thesis and role unchanged. Rejected: Keep the insertion flow last in the architecture section.; Give the insertion flow its own section before In Practice.\n- **2026-11-12** — After draft-check round 2, restored the insertion flow to the end of the architecture section: round-1 readers (both) wanted it earlier, round-2 readers (both) wanted it back at the end. The original order is kept and p34 opens by naming the insertion flow as the first door of the channel table on the same path, which answers round 1's complaint that it arrived as a change of topic. Rejected: Keep the round-1 position after the ingestion record.; A separate section for the insertion flow (would add a section and words over the limit).\n- **2026-11-12** — Word limit: spec.md ng cut); the Motorvane billing incident has its own sentence in the quota bullet (ledger: importer skipped over-quota cars while the billing export counted feed rows); the adapters row names mutual TLS and OAuth 2.0 before the trade-off row; Figure 2's caption glosses 'ingestion record' at first use. Also glossed 'share platforms, not products' in p62 from the ledger's Common Ground line (single-reader minor). Resolved under the author's delegation, 2026-11-12.\n- **2026-11-12** — Raised length.max_words from 8,460 to 8,700 (2.8%, within the 10% allowance) to pay for p25a, p51a, the moved Stripe sentence and the glosses (draft at 8,591 by check_draft.py).\n- **2026-11-12** — Thesis-rubric notes (claim length, missing general reason in how_why) and the remaining flow-rubric notes not taken (change detection paragraph, gloss of reconciler and error catalog, cutting the 23 leads, the breaking-change rule in architecture, citing public contracts in the key paragraphs, merging p34 and p36, so-what in the synthesis, the five neighbor pointers, 'Common Ground review'): accepted as is under the author's delegation, 2026-11-12; the thesis stays as copied from the journal spec.\n\n## Sources\n\n- **Internal**\n  - _journals/listing-systems-architecture/journal-spec.json — Intent outcome, acceptance criteria AC-1 to AC-3, thesis, role and the hand-off relationship of normalization-and-enrichment.\n  - _journals/listing-systems-architecture/_research/scenario-ledger.md — Veldmark figures: supply mix, the 8 March 2027 incident, the Essen Golf timeline, change detection, Hearthly's vendor classes and Supply Contract v1.\n  - _research/brief-listing-data-ingestion.md, brief-real-estate-portals.md, brief-automotive.md, productscape-digest.md — Feed specifications, idempotency, error formats, public partner contracts, dealer-feed inference and integration-partner measures (carried over from spec.md).\n  - listing-aggregate, attribute-schemas, entity-resolution, part-3 — Terminology,
