<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published page (posts/part-1-intro/index.md) and its former spec.md (accepted 2026-10-21), which it replaces; one spec paragraph per unit of the page, in the page's order. Intent outcome, AC-1 to AC-3 and role are copied unchanged from the post's entry in journal-spec.json; the introduction realises Part I's opening (hook, bridge, roadmap) from the same file. The journal spec gives this post no thesis, so the thesis and its two supporting claims are written here from the part's thesis and flow. The five callouts (IN THIS PART, WHY THE BUSINESS CARES, WHY ARCHITECTS SHOULD CARE, KEY POINTS, FAILURE PATTERNS) stand before the first paragraph and are kept as the house format; the KEY POINTS callout carries the part's claim in three bullets. Three units were added to the published page to meet the contract: the roadmap paragraph (p03), the lead-in to the chapter table (p04) and the closing paragraph (p07, which grew from the one-line pointer 'Begin with [Classifieds, Leads, Transactions and Managed Models: A Marketplace Taxonomy](marketplace-taxonomy.html)').\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Part I answers six questions in order: what kind of marketplace this is, what it sells, how the industry formed, what the marketplace does, where the boundaries go and how verticals differ.\n- **Know:** The vocabulary the part supplies: marketplace profile, liquidity cell, capability, bounded context and vertical requirement profile.\n- **Be able to:** Pick the Part I chapter that answers the decision in front of them.\n\n**Audience:** Architects and engineering leaders of listing marketplaces (the journal's readers) who have read the preface and are about to start Part I, or who arrive with one decision in hand and want the chapter that answers it.\n\n**Already knows:**\n\n- What an API, a database, an event stream, a search engine and Kubernetes are; how to make and defend an architecture decision.\n- The preface's claim that a listing marketplace is a liquidity machine (introduction).\n- The fifteen named failure patterns, among them Vanity Liquidity, The Forced Fit and Deal-Shaped Architecture (where-listing-systems-go-wrong).\n- Veldmark in outline: a fictional group of four brands (Tradeyard, Motorvane, Hearthly, Keybridge) with four of almost everything, its Common Ground program and Ingrid Halvorsen, its Group Chief Architect (meet-veldmark).\n\n**Does not yet know:**\n\n- Liquidity as the marketplace's product (glossed in p02; owned by liquidity-and-network-effects).\n- Marketplace profile, liquidity cell, capability, bounded context, vertical requirement profile and the share test as defined terms (each owned by its chapter; the page names them and points to the chapter).\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader of this page alone can name the six chapters' subjects in reading order. *Probe:* After reading only this page: what will each of the next six chapters tell you, in order? | `intro_predicts_content` | cold_reader | major |\n| AC-2 | Given a situation the chapter table lists, the reader names the chapter to open. *Probe:* Every change to your listing table needs a cross-team meeting, and a program separately proposes one platform for goods, cars, homes and jobs. Using only this page, which chapter do you open for each? | `custom` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-4 | The reader can say what a later latency or freshness target must point back to, and where that rule comes from. *Probe:* Using only this page: a later chapter proposes a new latency or freshness target for search. What must the target name, and which part of the book supplies it? | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** What does this part argue, and in what order should its chapters be read?\n\n> **Claim:** Part I argues that in a listing marketplace the business decides the architecture before any technology choice, and its six chapters are read in a fixed order because each answer is the vocabulary the next question needs: the marketplace model, then liquidity, then the industry's history, then capabilities, bounded contexts and vertical profiles, which together are the business facts every later boundary, target and shared platform must name.\n\n**Disputed by:** The view that a marketplace group's platform decisions start from its systems inventory and the strongest brand's stack, so the business chapters are background a reader may skip or read in any order.\n\n**So what:** A reader who accepts it reads Part I before the platform chapters, or opens the one chapter that answers the decision in front of them, and expects every later freshness, latency and sharing decision to point back to this part's liquidity metrics and share test.\n\n**How and why:** The model decides what liquidity is measured on; liquidity's local network effects explain why groups are portfolios of local leaders; that history shows why a systems inventory cannot be the unit for comparing brands, so capabilities are; the capability map is the input to the bounded contexts; and the vertical profiles ask where the sameness of those maps stops.\n\n**Supporting claims**\n\n- **PI-1** — The six chapters answer six questions in an order where each answer supplies the next question's vocabulary, and each is the chapter to open first for a recognizable situation.\n- **PI-2** — The part's vocabulary (marketplace profile, liquidity cell, capability, bounded context, vertical requirement profile) is what the rest of the book justifies its boundaries, targets and shared platforms with.\n\n## Role in the part\n\nPerforms the part's opening: states that the business decides the architecture, the reading order of the six chapters and what Veldmark decides in them.\n\n## Flow\n\n**Pattern:** `large_to_small` (also `prerequisite_order` in p03 and the chapter table in p04: the six chapters in the part's reading order)\n\nThe page opens on the part's claim (the business model decides the architecture), narrows to the three pieces of business knowledge a sharing decision needs, then to the six questions that supply them in order (two, one and three chapters per piece), then to one row per chapter with the situation in which to open it. It then widens once to place the part's vocabulary in the book, and ends on Veldmark, where the same vocabulary becomes dated decisions, followed by a short synthesis that hands off to the first chapter. The roadmap stands before the table because the table's rows only make sense as answers to questions the reader already has; the connection section follows the table because it names the vocabulary the chapters define; Veldmark comes last in the body of the conclusion because its decisions use that vocabulary; the synthesis follows it so the page's last words are the first chapter's question. Put Veldmark first and its profiles, cells and contexts arrive before the reader knows they are the part's terms; put the connection first and it names a vocabulary no chapter has yet been shown to supply. The six questions follow the three pieces of knowledge because they are those pieces divided into chapters; put the questions first and the reader holds six items with no grouping.\n\n## Introduction\n\n**Hook** (`direct_statement`): This book starts with the business, not the systems, because in a listing marketplace the business model decides the architecture: a classifieds site whose job ends at the contact, a portal that sells qualified leads and a marketplace that holds buyers' money need different identity, trust, payment and data systems, even when their search pages look alike.\n\n**Bridge:** The preface's group with four of almost everything, which must decide what to share. → The three pieces of business knowledge any sharing decision needs: what kind of marketplace you run and what it sells, how the industry got here, and a description of the marketplace that outlives systems and reorganizations.\n\n**Thesis statement** (KEY POINTS callout; paragraph p01 (bold phrase) and p03): In a listing marketplace the business model decides the architecture, and the part supplies the business knowledge a sharing decision needs in a fixed order, each answer giving the next question its vocabulary.\n\n**Roadmap** (paragraph p03):\n\n- Six chapters ask six questions in order (the model, liquidity, history, capabilities, boundaries, verticals); a table says when to open each. *Kept in:* chapters.\n- Then come the part's place in the book and Veldmark's decisions. *Kept in:* connects.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | claim | The book starts with the business, not the systems, because in a listing marketplace the business model decides the architecture: marketplaces whose jobs end at the contact, at a qualified lead or at holding the buyer's money need different identity, trust, payment and data systems even when their search pages look alike. | example: A classifieds site whose job ends at the contact, a portal that sells qualified leads and a marketplace that holds buyers' money. |  |\n| p02 | explanation | Deciding what a group like Veldmark should share takes three pieces of business knowledge, supplied in order: what kind of marketplace it is and what it sells, which is liquidity (glossed); how the industry got here, since buyers go where sellers already are, so each country and category ended up with one leader, groups bought such leaders and each brand still runs the systems of the industry wave it was built in; and what the marketplace does, where its boundaries go and how its verticals differ, described in terms that outlive systems and reorganizations. | figure: Figure 1: systems modules standing on six business blocks (model, liquidity, history, capabilities, boundaries, verticals). | `elaboration`: The claim that the business model decides the architecture, and the preface's group with four of almost everything. → The three pieces of business knowledge a sharing decision needs, and liquidity as what a marketplace sells. |\n| p03 | transition | Six chapters ask those three pieces as six questions, each answer giving the next its vocabulary, and the prose names each piece rather than counting: two on what kind of marketplace you run (the model, then liquidity), one on history and three on what it does (capabilities, boundaries, verticals); the page goes on to say when to open each, then the part's place in the book and Veldmark's decisions. |  | `sequence`: The three pieces of business knowledge, in order. → The six questions, one per chapter, in the order of the three pieces, the reason for their order, and what the rest of the page does. |\n\n## Sections\n\n### Chapters in this part\n\n**Controlling idea** (`description`, id `chapters`): Each of the six chapters answers one question and is the one to open first for a recognizable situation.\n\n**Advances the thesis** (PI-1): Lists the chapters in the part's reading order with the question each answers and the situation that sends a reader to it.\n\n**Transition in:** `elaboration`: The six questions in order. → One row per chapter: its question and when to open it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p04 | description | Each row of the table gives a chapter's question and the situation in which to open that chapter first. | table: Six rows in reading order: marketplace-taxonomy (adding payments, leads or guarantees), liquidity-and-network-effects (dashboards count listings and visits, or no one can say why a latency target exists), industry-evolution (five waves; inheriting local stacks or a possible brand sale), business-capabilities (finding what the group pays for several times), bounded-contexts (every listing-table change needs a cross-team meeting), vertical-requirements (one platform proposed for goods, cars, homes and jobs). |  |\n\n### How this part connects\n\n**Controlling idea** (`context`, id `connects`): The part supplies the vocabulary the rest of the book justifies its decisions with: it builds on the preface's patterns and running example, Part II designs inside its boundaries, and later parts point back to its liquidity metrics and share test.\n\n**Advances the thesis** (PI-2): Names the vocabulary and says which later decisions depend on it.\n\n**Transition in:** `cause_effect`: The six chapters and what each answers. → The vocabulary they leave behind, and where the rest of the book uses it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | context | This part supplies the vocabulary the rest of the book uses (marketplace profile, liquidity cell, capability, bounded context, vertical requirement profile, defined in that order by every chapter but the history one): it builds on the preface, Part II designs the listing domain model inside its boundaries, and later parts justify freshness, latency and sharing decisions by its liquidity metrics and share test. |  |  |\n\n## Conclusion: The Veldmark thread\n\n**Synthesis:** Read together, the six chapters say what every later design must respect before it chooses a technology; Veldmark's first months show that vocabulary turning into dated, reviewable decisions.\n\n**So what:** With the part's vocabulary a group replaces 'four of everything' with decisions it can review: a profile register, a liquidity rule for every latency and freshness objective, a separability rule, a capability map and a context map.\n\n**Callback:** The opening claim (p01) that the business model decides the architecture. The closing paragraph restates it as the reason the book starts with the business and sends the reader to the chapter that asks where the marketplace's job ends.\n\n**Takeaway** (`course_of_action`): Begin with marketplace-taxonomy and read the chapters in order, or open the chapter the table names for the decision in front of you.\n\n**Hand-off** to [Classifieds, Leads, Transactions and Managed Models: A Marketplace Taxonomy](marketplace-taxonomy.html): `elaboration`: The part opening's claim that where a marketplace's job ends decides its architecture. → The first chapter's question: where the marketplace's job ends.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | example (list) | In Ingrid Halvorsen's first months at Veldmark (fictional), her team uses the part's vocabulary, one chapter per bullet in the part's order (said to be chapter order, not date order, and the last bullet says its April date came a month before the May context map), to turn the €140 million Common Ground program into dated decisions. | scenario: Common Ground approved January 2027 (€140 million); Ingrid Group Chief Architect since February 2027. 20 marketplace profiles and the Poland overlap (Tradeyard's cars section and Motorvane compete for the same dealers); liquid cells (at least 25 active listings, 50 searches a week, median time to first contact under 24 h) 38% (Tradeyard NL) vs 11% (PT) and the rule that every new latency or freshness objective names the liquidity metric it protects; history as sediment (Tradeyard 2004, Motorvane 2008, Polish purchase 2012, three acquisitions 2023–2025) and the March 2027 record that any brand may be sold within five years, so every shared platform needs an exit path; capability map of 31 March 2027 with five overlaps where brands build the same capability; separately, two cases outside the five: the Poland overlap (a portfolio question) and one duplicate kept on purpose (Keybridge's software that sends agencies' listings to many portals stays separate from Hearthly's intake of listings, so Keybridge stays neutral towards Hearthly's competitors); 19 bounded contexts approved by the architecture advice forum (which Ingrid chairs) May 2027; the share test applied per vertical in a shared-versus-specific table ratified April 2027, stated as a month before the context map. |  |\n| p07 | synthesis | Read together, the six chapters say what every later design must respect before it chooses a technology, which is why the book starts with the business; the reader begins with marketplace-taxonomy, which asks where the marketplace's job ends. |  | `conclusion_summary`: Veldmark's decisions, one per chapter. → What the six chapters amount to together, and where to begin. |\n\n## Non-goals\n\n- Teaching any chapter's content; each chapter owns its terms, and the page names them and points to it. See [Classifieds, Leads, Transactions and Managed Models: A Marketplace Taxonomy](marketplace-taxonomy.html), [Liquidity Is the Product: Network Effects, Local Markets and Marketplace Metrics](liquidity-and-network-effects.html), [From Newspaper Columns to Portfolios: How the Classifieds Industry Evolved](industry-evolution.html), [Map What the Marketplace Does Before What Runs It](business-capabilities.html), [Bounded Contexts for Marketplaces: Where One Listing Becomes Many Models](bounded-contexts.html), [Same Platform, Different Physics: How Listing Verticals Differ](vertical-requirements.html).\n- Company facts; the page cites none and needs no sources.\n- The listing domain model. See [Part II — LISTING: Modeling the Thing Being Sold](part-2.html).\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-10-19** — Structure follows the sibling part-2 intro (callouts, chapter table, connections, Veldmark thread) for consistency across part intros; no learning-path diagram, to stay within 800 words.\n- **2026-10-19** — Failure patterns chosen: Vanity Liquidity, The Forced Fit, Deal-Shaped Architecture, the three most often named by the part's chapters.\n- **2026-11-12** — Converted spec.md to spec.json. Success criteria: the callout-format, chapter-table, connection, Veldmark-facts and word-count criteria were inventories of contents or format and are dropped (format stays governed by the style guide; Veldmark facts by the ledger; the hand-off is now conclusion.hand_off; the lead's three steps are p02). They are replaced by the journal spec's AC-1 to AC-3 and one added minor criterion, AC-4 (what a later latency or freshness target must point back to), which tests the connection section. Rejected: Carrying the success criteria over as written (inventories).\n- **2026-11-12** — Thesis and supporting claims PI-1 and PI-2 written here, since the journal spec's entry for this post has none: the question is the entry's question; the claim condenses the part thesis to what this page argues (the business decides the architecture, and the reading order). For the author to confirm. Rejected: Copying the part thesis whole, which this page summarizes but does not argue.\n- **2026-11-12** — Three units added to the published page so that it carries the part opening: a roadmap paragraph (p03) naming the six questions in order, as the journal spec's opening roadmap asks; a one-sentence lead-in to the chapter table (p04), so the section has a unit and the table is its evidence; and a closing paragraph (p07) with synthesis, callback and hand-off, grown from 'Begin with [Classifieds, Leads, Transactions and Managed Models: A Marketplace Taxonomy](marketplace-taxonomy.html)'. p02 now opens from the preface's group ('a group like Veldmark, with four of almost everything'), as the opening's bridge asks. 'The Veldmark thread' is the conclusion's heading, so the page keeps its published headings. Rejected: A new closing heading, which would change the part-intro shape shared with the other part intros.; Leaving the roadmap to the table alone: AC-1 asks the reader to name the six subjects in order, and the table gives questions, not the reason for the order.\n- **2026-11-12** — Word limit set at 1,100 by check_draft's count, which includes the callouts. The old spec's 500–800 is read as the page body without the house-format callouts: after round 2 the body (prose, list and table) is 733 words and the callouts 336, so 800 + 336 rounds to about 1,100. (First set at 1,000 by scaling the 800 cap by the ratio between the counter and the 2026-10-20 prose count; raised after round 2, when glosses both flow readers asked for no longer fitted.) For the author to confirm. Rejected: max_words 800 by this counter, which the published page already exceeded and which would mean cutting the author's callouts.; Keeping 1,000 by cutting the glosses two readers asked for.\n- **2026-11-12** — Flow rubric (sound with notes): p03 now maps the three pieces of knowledge onto the six chapters (two, one, three); the flow rationale now says why the six questions follow the three pieces and describes the conclusion accurately (Veldmark, then synthesis and hand-off). Transitions unchanged except p03's 'introduces'. Rejected: Merging p02 into p03: the mapping sentence gives the same gain without merging two units.; Tying each vocabulary term to its chapter in the table or p05: no room within the word limit; recorded as an open question.\n- **2026-11-12** — Thesis rubric: pass on all four questions. Its minor note (so_what lets a reader open one chapter while the claim says the chapters are read in a fixed order) is left as is: PI-1 holds both readings.\n- **2026-11-12** — Draft-check round 1 (revise: 34 pass, 23 fail, 16 blocking, all at fault in the draft). Revised in the units named and in the callouts: liquidity glossed in WHY THE BUSI l ESCALATE topics'). Bullet order vs dates (spec fault, both readers): the Veldmark bullets keep chapter order, which round-1 readers asked for and which the part argues; the list lead-in now says the bullets go chapter by chapter, not date order, and the derived clause 'a month before the context map' is dropped. Both dates (April 2027, May 2027) are kept as ledger facts. Rejected: Swapping the last two bullets into date order, which breaks one-bullet-per-chapter order.; Dropping either date, which would cut a Veldmark detail.\n- **2026-11-12** — Draft faults fixed within max_words 1,100 (kept at 1,100 by the orchestrator's instruction, although other part intros use 1,000): KEY POINTS bullet 3 now glosses the vertical requirement profile ('what differs, in numbers') and describes the share test's four layers as a range ('from built once for all brands to built by each') instead of naming them unglossed; p02's history step now says why local liquidity yields one leader per country and category and calls the waves 'industry waves'; p03 names the three pieces instead of counting them; the capability-map bullet names the duplicate kept on purpose from the ledger (Keybridge distribution vs Hearthly ingestion, kept for neutrality); the advice forum is introduced as the one Ingrid chairs (ledger, meet-veldmark). Room made by small cuts: the IN THIS PART list, the last sentence of WHY THE BUSINESS CARES, 'From then on', and a few words in p02, p05 and the liquidity bullet.\n- **2026-11-12** — Post-round-3 fixes (KEY POINTS bullet 1 grammar, the year on Ingrid's start, the Poland overlap as a portfolio question, the liquid-cell threshold from the ledger, 'matches' glossed as contacts and sales) accepted under the author's delegation, 2026-11-12.\n- **2026-11-12** — Minor round-3 points: 'region × leaf category' and 'lead' in KEY POINTS kept as published (one reader each); the share-test bullet keeps its published form without an added result, for the word limit; the repeat ark bullet reworded. (AI-mediated session)\n- **2026-10-19** — Added 1 inline illustration (article-illustrator). (AI-mediated session)\n- **2026-10-19** — Editorial review pass: ch. 03 table row and Veldmark bullet rewritten from the written chapter (five waves, sediment, March 2027 separability decision). (AI-mediated session)\n- **2026-10-19** — Initial spec and article. (AI-mediated session)\n- **2026-11-13** — Fix-only pass: capability-map bullet split and Keybridge duplicate glossed; share-test bullet dated relative to the context map; 'industry wave' glossed; p06 controlling idea and evidence updated. (AI-mediated session)\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
