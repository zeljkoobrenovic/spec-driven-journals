<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published page (posts/part-2-intro/index.md) and its former spec.md (accepted 2026-10-20), which it replaces; one spec paragraph per unit of the page, in the page's order. Intent outcome, AC-1 to AC-3 and role are copied unchanged from the post's entry in journal-spec.json; the introduction realises Part II's opening (hook, bridge, roadmap) from the same file. The journal spec gives this post no thesis, so the thesis and its two supporting claims are written here from the part's thesis and flow. The five callouts (IN THIS PART, WHY THE BUSINESS CARES, WHY ARCHITECTS SHOULD CARE, KEY POINTS, FAILURE PATTERNS) stand before the first paragraph and are kept as the house format; the KEY POINTS callout carries the part's claim in three bullets. Units added to the published page to meet the contract: the roadmap paragraph (p03), the lead-in to the chapter table (p04) and a synthesis and hand-off in the closing paragraph (p08, grown from 'By the end of Part II… Begin with [The Listing Aggregate: Identity, Lifecycle and Invariants](listing-aggregate.html)').\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Part II's argument: a listing is an offer about a thing, a small aggregate that references five governed subdomains by ID.\n- **Know:** The six chapters in reading order and the question each answers, and the Veldmark decisions that give the listing model its contracts in 2027.\n- **Be able to:** Pick the Part II chapter that answers the problem in front of them.\n\n**Audience:** Chief and enterprise architects, principal engineers and listing-platform leads (the journal's readers) who have read Part I and are about to start Part II, or who arrive with a listing-model problem in hand and want the chapter that answers it.\n\n**Already knows:**\n\n- What an API, a database, an event stream, a search engine and Kubernetes are; how to make and defend an architecture decision.\n- What a DDD aggregate is, that 'listing' means different things in Supply, Search, Trust and Monetization, and that one context owns the listing's truth (bounded-contexts).\n- That cars and apartments have identities and external systems of record outside the listing (vertical-requirements).\n- The fifteen named failure patterns, among them The Category Straitjacket, The Attribute Junkyard and Ghost Inventory (where-listing-systems-go-wrong).\n- Veldmark in outline: a fictional group of four brands (Tradeyard, Motorvane, Hearthly, Keybridge), Ingrid Halvorsen its Group Chief Architect, and the recurring examples (Femke's Rotterdam city bike, the Lyon apartment, Agence Rhône Habitat's 14 branches); a perceptual hash as an image fingerprint (meet-veldmark).\n\n**Does not yet know:**\n\n- Enforcement overlay (glossed in the KEY POINTS callout as trust and safety's holds and blocks, kept apart from the one state for seller and platform changes; owned by listing-aggregate).\n- Gazetteer (glossed in the KEY POINTS callout as a register of named places; owned by location-and-geo).\n- Precision policy, trader status, taxonomy release, attribute dictionary and content-addressed asset as defined terms (each owned by its chapter; the page names them and points to the chapter, glossing trader status in the KEY POINTS callout).\n- Entitlements (glossed in p05 as what a seller has paid for; owned by products-and-entitlements).\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader of this page alone can name the six chapters' subjects in reading order. *Probe:* After reading only this page: what will each of the next six chapters tell you, in order? | `intro_predicts_content` | cold_reader | major |\n| AC-2 | Given a situation the chapter table lists, the reader names the chapter to open. *Probe:* Most bike listings have an empty frame-size filter, and separately an agency network complains that its franchise branches do not fit your user table. Using only this page, which chapter do you open for each? | `custom` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-4 | The reader can say which later parts of the book read Part II's models and what each reads. *Probe:* Using only this page: which later parts of the book depend on the models designed in this part, and what does each take from them? | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** What does this part argue, and in what order should its chapters be read?\n\n> **Claim:** Part II argues that a listing is an offer about a thing, not the thing: a small, strict aggregate that references categories, attributes, media, location, and sellers and accounts by ID, each a governed subdomain with its own owner and rate of change; its six chapters are read in an order where each needs the one before, starting with the aggregate because it decides what sits inside the listing and what is only a reference, and ending with sellers and accounts because they build on all the others: an agency's location precision and its branches' media and attribute duties use the earlier models, while those models need only a seller's ID.\n\n**Disputed by:** The common practice of modeling the listing as one wide `ads` table that every team extends, so the listing chapters are a catalog of columns a reader may consult in any order.\n\n**So what:** A reader who accepts it reads the aggregate chapter first, or opens the one chapter that answers the problem in front of them, and expects every later stage (ingestion, search, trust, monetization) to read these models as contracts rather than copy a table.\n\n**How and why:** The aggregate makes the slots the other chapters fill; the category selects the contract for attributes, fees and facets; an attribute schema is bound to a category; media and location apply the same governed-data discipline to photos and places, and media strips the GPS coordinates location's privacy rule would otherwise leave exposed; sellers and accounts come last because an agency's location precision and its branches' media and attribute duties build on the earlier models, while those models need only a seller's ID.\n\n**Supporting claims**\n\n- **PII-1** — The six chapters answer six questions in an order where each needs the one before, and each is the chapter to open first for a recognizable symptom.\n- **PII-2** — The models this part designs are the contracts later parts read: Part III loads them through forms and feeds, search indexes the attribute schemas, trust and safety writes the enforcement overlay and entitlements attach to accounts.\n\n## Role in the part\n\nPerforms the part's opening: states that a listing is a small aggregate around five governed subdomains, the reading order of the six chapters and what Veldmark decides in them.\n\n## Flow\n\n**Pattern:** `large_to_small` (also `prerequisite_order` in p03 and the chapter table in p04: the six chapters in the part's reading order)\n\nThe page opens on the problem (a listing modeled once and widened for fifteen years), states the part's claim (a small aggregate with five governed subdomains around it), then narrows to the six chapters in the order each needs the one before, and to one row per chapter with the symptom that sends a reader there. It then widens once to place the models in the book, shows them as Veldmark's dated decisions in chapter order, and ends with a short synthesis that hands off to the first chapter. The roadmap stands before the table because the rows only make sense once the reader knows why the chapters come in this order; the connection section follows the table because it names which later parts read the models the chapters define; the Veldmark section follows the connection because its decisions are read as contracts, the framing the connection section introduces, and each is tagged with its chapter; placed straight after the table, the decisions would arrive before the reader knows that later parts read them as contracts; the three recurring examples follow the decisions because they are what the chapters test the decisions on, and the reader knows them from meet-veldmark; the conclusion comes last and holds no new material. Put Veldmark first and its lifecycle, gazetteer and registry arrive before the reader knows which chapter owns each; put the connection first and it names contracts no chapter has yet been shown to design.\n\n## Introduction\n\n**Hook** (`intriguing_example`): Most marketplaces modeled the listing once, at launch, and have extended it ever since: fifteen years later the `ads` table has two hundred columns, category IDs live in the code, and nobody can say which copy of a listing is the true one.\n\n**Bridge:** Part I's domain boundaries and its decision about who owns the listing's truth. → The design of the thing being sold inside those boundaries.\n\n**Thesis statement** (KEY POINTS callout; paragraph p02 (bold phrase) and p03): A listing is an offer about a thing, not the thing itself: a small, strict aggregate with five subdomains around it, each with its own owner and rate of change, read in an order where each chapter needs the one before.\n\n**Roadmap** (paragraph p03):\n\n- Six chapters in order: the listing aggregate first, then categories, attributes, media, location and sellers and accounts, each with the reason it follows the one before; a table says when to open each. *Kept in:* chapters.\n- The page ends with how the part connects to the rest of the book and what Veldmark decides in it. *Kept in:* connects, veldmark.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Part II designs the thing being sold inside Part I's boundaries (bounded-contexts), because most marketplaces modeled the listing once at launch and kept widening it until, fifteen years later, the `ads` table has two hundred columns, category IDs live in the code and nobody can say which copy of a listing is true. | example: The two-hundred-column `ads` table, category IDs in the code and no true copy of a listing. |  |\n| p02 | claim | The part's claim is that a listing is an offer about a thing, not the thing itself; because an offer only needs to point at what describes the thing, the aggregate stays small and strict, surrounded by five subdomains (categories, attributes, media, location, and sellers and accounts), each with its own owner and rate of change, so that with a contract for each, ingestion, search, trust and billing read the same meaning. | figure: Figure 1: a small central listing card linked by dashed ID references to five owned islands (categories, attributes, media, location, and sellers and accounts). | `problem_solution`: The widened `ads` table and its disagreeing copies. → The part's answer: a small aggregate and five governed subdomains. |\n| p03 | transition | The six chapters come in an order where each needs the one before: the aggregate first, because it decides what is inside the listing and what is only a reference; then categories, which select the rules for attributes, fees and facets; attributes, which are bound to a category; media, which applies the attribute chapter's move (one contract for every consumer) to photos, and comes before location because it strips the GPS coordinates that location's privacy rule relies on to hide a private seller's precise point; location, which governs its register of places the way categories govern their tree; and sellers and accounts last, because they build on all the others (an agency's location precision and its branches' media and attribute duties use the earlier models), while the earlier chapters need only a seller's ID. The page then says when to open each, how the part connects to the book and what Veldmark decides. |  | `sequence`: The aggregate and its five subdomains. → The six chapters in reading order, the reason for that order, and what the rest of the page does. |\n\n## Sections\n\n### Chapters in this part\n\n**Controlling idea** (`description`, id `chapters`): Each of the six chapters answers one question and is the one to open first for a recognizable symptom.\n\n**Advances the thesis** (PII-1): Lists the chapters in reading order with the question each answers and the symptom that sends a reader to it.\n\n**Transition in:** `elaboration`: The six chapters in order. → One row per chapter: its question and when to open it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p04 | description | Each row of the table gives a chapter's question and the symptom that should send a reader to that chapter first. | table: Six rows in reading order: listing-aggregate (a status field with twenty values, or sold listings still get contacts), categories-and-taxonomies (adding or splitting a category takes weeks and a cross-team release), attribute-schemas (empty filters, or one fact under many keys), media-pipeline (the media bill outgrows live listings, or stolen photos go unnoticed), location-and-geo (distances leak addresses, or map and results disagree), sellers-and-accounts (agencies, dealer groups or franchises do not fit the user table). |  |\n\n### How this part connects\n\n**Controlling idea** (`context`, id `connects`): The rest of the book builds on the part's models: Part III puts them to work and later parts read them as contracts.\n\n**Advances the thesis** (PII-2): Says which later parts read which model.\n\n**Transition in:** `cause_effect`: The six chapters and the models they design. → Because those models are what the rest of the book builds on: which later parts read them, and what each reads.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | context | The rest of the book builds on these six models: Part III puts the model to work through forms and feeds, enrichment, duplicates and publication, and later parts read the models as contracts: search indexes the attribute schemas, trust and safety writes the enforcement overlay and entitlements (glossed as what a seller has paid for) attach to accounts. |  |  |\n\n### The Veldmark thread\n\n**Controlling idea** (`example`, id `veldmark`): Veldmark's 2027 decisions show each of the part's models becoming a contract with an owner and a date, tested on three recurring examples.\n\n**Advances the thesis** (PII-2): Shows the models as contracts with dates, one per chapter.\n\n**Transition in:** `example`: The part's models and the later parts that read them as contracts. → Veldmark's 2027 decisions in this part, one per chapter.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | example (list) | Veldmark (fictional) shows the part's models becoming contracts: it starts 2027 with four Tradeyard country category trees and 3,900 attribute keys, 41% of them used on fewer than 0.1% of listings, and Ingrid Halvorsen's team turns each chapter's model into a dated decision, each listed under the chapter that owns it, in chapter order; the lead-in says the dates do not follow that order, and the May 2027 item is marked as the earliest date. | scenario: Four Tradeyard country category trees; 3,900 attribute keys, 41% on fewer than 0.1% of listings. Decisions, in chapter order: common listing lifecycle with an enforcement overlay owned by trust and safety in Listing event contract v1, 1 July 2027 (listing-aggregate); group taxonomy and attribute service live for Tradeyard in October 2027 and the bikes split on Monday 1 November 2027 (categories-and-taxonomies, attribute-schemas); group media decision, November 2027: one media API and asset model, originals stored without metadata, and a shared perceptual-hash index from Q1 2028 (media-pipeline); Veldmark Place, gazetteer and precision-policy service, May 2027 (location-and-geo); group business party registry for verified legal-entity facts, August 2027 (sellers-and-accounts). |  |\n| p07 | example | The chapters test these decisions on three recurring examples: Femke's €240 Rotterdam city bike, the Lyon apartment and Agence Rhône Habitat's fourteen branches. | scenario: Femke's €240 Rotterdam city bike (Tradeyard NL), the Lyon apartment (Hearthly FR) and Agence Rhône Habitat's 14 branches. | `additional_support`: The five decisions. → The three recurring examples, already met in meet-veldmark, that the chapters test them on. |\n\n## Conclusion: Where to begin\n\n**Synthesis:** Read together, the six chapters replace the widened `ads` table with a small aggregate and five contracts, each with an owner, a version and a known set of copies.\n\n**So what:** Every system that copies a listing (search, alerts, trust, billing) then copies the same meaning instead of guessing it.\n\n**Callback:** The opening example (p01): the two-hundred-column `ads` table, category IDs in the code and no true copy of a listing. The closing paragraph names what replaces the table and restates the part's test: say who owns each part of a listing, how it is versioned and which systems copy it.\n\n**Takeaway** (`course_of_action`): Begin with listing-aggregate and read the chapters in order, or open the chapter the table names for the problem in front of you.\n\n**Hand-off** to [The Listing Aggregate: Identity, Lifecycle and Invariants](listing-aggregate.html): `elaboration`: The part opening's claim that a listing is an offer about a thing, a small aggregate that references governed subdomains. → What is inside the aggregate and what is only referenced, its identity, <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
