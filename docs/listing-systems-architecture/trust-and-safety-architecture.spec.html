<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, acceptance criteria AC-1 to AC-3, the thesis and the role are copied unchanged from the trust-and-safety-architecture entry in journal-spec.json. Added units not in the published text: the roadmap paragraph p03 and the synthesis paragraph p59.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The five functions of trust and safety (policy, detection, decision, enforcement, review and redress) plus measurement, the speed at which each changes and how each fails; policies as versioned reference data.\n- **Know:** The moderation pipeline: synchronous gate and asynchronous path, risk-tiered moderation modes, human review queues and the random sample, LLMs for the grey zone; the enforcement ladder and its propagation to every consumer; notice and action, case management, appeals and statements of reasons as a by-product.\n- **Know:** The trust-and-safety metrics (prevalence, time to action, precision, recall, overturn rate, report rate, reviewer agreement) and how each misleads.\n- **Believe:** A removal is not finished when the listing's status changes; it is finished when the last consumer has acknowledged it.\n- **Believe:** Trust and safety pays to share across brands from the first year, but only the machinery, evidence and lawful signals; policy judgement stays local.\n- **Be able to:** Draw the trust-and-safety components and their interfaces, with one decision service as the only writer of decision records.\n- **Be able to:** Defend a risk-tiered moderation design instead of a choice between pre- and post-moderation, and say what must happen in every system when a listing or account is restricted.\n- **Be able to:** Decide which trust-and-safety components a group shares and which each brand keeps.\n\n**Audience:** Chief architects of marketplace groups, heads of trust and safety and their engineering leads, and principal engineers who own insertion, search, messaging, alerts or ranking and need to know where those systems meet moderation.\n\n**Already knows:**\n\n- What an API, a database, an event stream, a rules engine, an ML classifier and an LLM are.\n- From earlier chapters: Veldmark (fictional) and its brands Tradeyard, Motorvane, Hearthly and Keybridge, the cast (Ingrid Halvorsen, Aisha Rahman, Lucía Ortega), the Common Ground program and the architecture advice forum, Yardstick, Tradeyard Safe Deal, the Rotterdam city bike, bounded contexts, the listing lifecycle with its enforcement overlay, the publication pipeline, the event backbone, Part IV's search, recommendations and alerts, and the failure patterns Ghost Inventory, Moderation as an Afterthought and Set-and-Forget AI.\n- From the part introduction: trust as a platform capability and Veldmark's four trust-and-safety stacks.\n\n**Does not yet know:**\n\n- Trust-and-safety vocabulary: policy (as a versioned record), moderation pipeline, enforcement action, case, pre- and post-moderation, prevalence, overturn rate, trusted flagger.\n- The DSA articles on notice and action (16), statements of reasons (17), internal complaints (20), out-of-court settlement (21), trusted flaggers (22) and the Transparency Database (24(5)).\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given an incomplete removal and an undeclared demotion practice, the reader names what is missing and what the design does. *Probe:* A fraudulent listing removed at 09:00 still appears in a 10:00 alert digest and in a similar-items carousel, its seller's open payout goes out, and the ranking team has been quietly demoting suspected scams for months. Using only this chapter: what is missing, and what does the design do? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-4 | Given a proposal to choose between pre- and post-moderation for the whole marketplace, the reader replaces it with risk tiers and names the two public cases that show why. *Probe:* Your product director wants one rule for the whole marketplace: either every listing is checked before it goes live, or everything goes live at once and is checked afterwards. Using only this chapter: what do you propose instead, and which public cases support it? | `custom` | cold_reader | minor |\n| AC-5 | Given a proposal to centralize moderators under one group policy and report removals to the board, the reader says what the group shares, what stays with each brand, who decides on cross-brand signals and what to report instead. *Probe:* A group of four marketplace brands proposes to merge all moderators into one central team with one policy, and to report the number of listings removed to the board each month. Using only this chapter: what would you share, what would you keep per brand, who decides which signals cross brands, and what would you report instead? | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** How should trust and safety be architected across listings, users, messages and transactions?\n\n> **Claim:** Trust and safety should be built as five separately owned functions (policy, detection, decision, enforcement, review and redress) plus measurement, joined by one decision record that a single decision service writes: policies are versioned reference data that every rule, model, reviewer guideline and notice cites; the moderation mode is set per risk tier of category, seller and listing rather than chosen once; an enforcement action, demotion included, is done only when every consumer (search, alerts, recommendations, messaging, SEO pages, ads, payments, partner feeds) has acknowledged its EnforcementApplied event; the platform is judged on sampled prevalence, time to action, precision and appeal overturn rate rather than removal counts; and a group shares this machinery and lawful hashed block lists while each brand keeps its policy overlays, thresholds, reviewers and vertical detectors.\n\n**Disputed by:** The common view that trust and safety is an operations function: a review queue attached to insertion, staffed per brand or outsourced, measured by items reviewed and listings removed, with a removal finished once the listing's status changes, and with sharing across a group meaning centralized moderators and one policy.\n\n**So what:** A Chief Architect who accepts this makes the decision record schema and the single-writer rule a group decision, sets propagation targets per consumer and watches p95 and worst case, lets the Data Protection Officer decide which signals cross brands, leaves risk tiers and thresholds to marketplace general managers within group guardrails, and puts sampled prevalence of fraudulent listings by brand, next to time to action on fraud reports, in front of the board.\n\n**How and why:** On 7 March 2027 Tradeyard NL suspended a phishing account seven minutes after Femke's report, yet its phone number also had a Motorvane account no one could see, Tradeyard Belgium received the new rule on Wednesday, Poland and Portugal never did, and the sellers it had already contacted got no warning: four stacks with 210 moderators, three appeal processes and five ways of producing statements of reasons could not share a signal. A blind sample of 4,000 Tradeyard NL listings a week found about 0.6% violating policy against the 0.2% removal counts suggested. The shared platform, live for Tradeyard NL and BE in November 2027, targets 96% automation from 94%, a median time to action on fraud reports under 30 minutes from 3 hours 10 minutes, and an alert when the overturn rate of a policy exceeds 10%.\n\n**Supporting claims**\n\n- **S1** — Trust and safety is five functions (policy, detection, decision, enforcement, review and redress) plus measurement, built as separate components joined by one decision record that only the decision service writes, with policies as versioned reference data that every rule, model, guideline and notice cites.\n- **S2** — The moderation mode is set per risk tier of category, seller and listing, using a synchronous gate and an asynchronous path, human queues designed for the grey zone, labels and legal duties, and LLMs only in the grey zone, rather than chosen once between pre- and post-moderation.\n- **S3** — An enforcement action, demotion included, is a rung on a ladder chosen by the decision service and is done only when every consumer holding a copy has applied and acknowledged its EnforcementApplied event.\n- **S4** — Notices, cases, appeals and statements of reasons are entities linked to decision records, so redress and regulatory output are views of the record rather than separate projects.\n- **S5** — The platform is judged on sampled prevalence, time to action to the last acknowledgement, precision and appeal overturn rate, computed from decision records and samples per policy and detector, not on removal counts or queue sizes.\n- **S6** — A group shares the machinery, the evidence and the hashed signals its Data Protection Officer approves, while each brand keeps its policy overlays, thresholds, reviewers and vertical detectors.\n\n## Role in the part\n\nBuilds the platform the rest of the part plugs into, the decision service, decision record, enforcement propagation, appeals and metrics, and sets out which of it a group shares. Supports P5-1, P5-2 of part `part-5`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in scene poses the problem (four stacks that cannot share a signal and Ingrid's question which parts are one platform); sharing answers it after the body has built the parts; `chronological` in architecture, enforcement, intake and measuring follow one decision through its life: detected and decided, enforced everywhere, contested and reported, then counted)\n\nThe scene ends on Ingrid's question, which parts of trust and safety are one platform and which stay four, and the body supplies, in order, what that answer needs. The five functions and policies as data come first because every later component is named by the function it serves and cites a policy version. The pipeline then shows how detection and decision work, with the public evidence (Sigma, Stripe Radar, OLX, Adevinta's shared OCR service) right after the component table, because it anchors the reference design the section labels as an inference; enforcement follows because it acts on what the decision service decided; intake, cases and appeals come next because an appeal reverses an enforced decision and a statement of reasons describes one; measurement comes after them because its figures are computed from decision records, samples and overturns. The sharing decision comes after measurement because it can only be argued once every shared component has been introduced; vertical differences follow it directly because they justify its local side (thresholds, policy overlays, vertical detectors). Trade-offs, failure modes, the Chief Architect's view and questions apply the whole design, so they come last.\n\n## Introduction\n\n**Hook** (`thought_provoking_question`): A keyword filter after the first spam wave, a review queue after the first press story, a report button after the first regulator letter: ten years later a group has four moderation stacks that cannot share a signal, and nobody can answer what did we remove last month, why, and did it actually disappear?\n\n**Bridge:** Architects who built Part IV's search, recommendations and alerts to put a listing in front of buyers within seconds. → Each of those surfaces must also obey a removal, so trust and safety has to be architected as a platform that reaches all of them, not a queue beside insertion.\n\n**Thesis statement** (KEY POINTS callout (all three bullets) and paragraph p02; the scene's last paragraph (p09) poses the question the body answers.): Treat trust and safety as a platform capability: five functions built as separate components joined by one decision record, enforcement done only when every system holding a copy has applied it, metrics of harm rather than activity, and shared machinery with local policy.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p03, which lists the sections in order and names the kinds of evidence.):\n\n- Veldmark's phishing incident and its four trust-and-safety stacks. *Kept in:* scene.\n- The five functions and policies as versioned data. *Kept in:* concepts.\n- The moderation pipeline: its components and the public evidence behind them, gate and asynchronous path, moderation modes, human review and LLMs. *Kept in:* architecture.\n- Enforcement and its propagation to every consumer. *Kept in:* enforcement.\n- Intake, cases, appeals and statements of reasons. *Kept in:* intake.\n- Measurement of harm, with Veldmark's numbers. *Kept in:* measuring.\n- What a group shares, what stays local, and how verticals differ. *Kept in:* sharing, verticals.\n- Trade-offs, failure modes, the Chief Architect's view and review questions. *Kept in:* trade-offs, failure-modes, ca-view, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Most marketplaces build trust and safety in the order problems appear and attach each piece to the nearest system, so a decade later a group has four moderation stacks that cannot share a signal and cannot say what it removed, why, and whether the removal took effect. | example: A keyword filter after the first spam wave, a review queue after the first press story, a report button after the first regulator letter. |  |\n| p02 | claim | Because every Part IV surface that shows a listing must also obey its removal, this chapter treats trust and safety as a platform capability: five functions built as separate components and joined by one decision record, enforcement that is done only when every system holding a copy has applied it, metrics of harm rather than activity, and a split that shares the machinery across brands and keeps policy local. |  | `problem_solution`: Four stacks that cannot answer what was removed and whether it disappeared. → The chapter's answer: trust and safety as a platform capability. |\n| p03 | transition | The chapter starts from Veldmark's phishing incident and its four stacks, defines the five functions and policies as data, lays out the moderation pipeline with its public evidence, follows enforcement to every consumer, then covers intake, cases and appeals, measurement and what a group shares, and ends with trade-offs, vertical differences, failure modes, the Chief Architect's view and review questions, drawing on the DSA, public engineering sources, two dated public cases and the fictional Veldmark. |  | `elaboration`: The platform the chapter argues for. → The order in which the chapter builds it and the evidence it uses. |\n| p04 | transition | Fraud, identity and the legal detail of regulation have their own chapters; this one builds the platform they plug into, with Veldmark, the fictional group the book follows, as the running example. | reasoning: fraud-prevention owns risk scoring, fraud signals and step-up friction; identity-and-verification owns identity levels; marketplace-regulation owns the DSA's legal detail; meet-veldmark introduces the running example. | `contrast`: What the chapter covers. → What it leaves to the neighbouring chapters, and the running example. |\n\n## Sections\n\n### Setting the Scene at Veldmark: Four Stacks and One Phishing Link\n\n**Controlling idea** (`example`, id `scene`): A fast suspension inside one brand hid a group that could not share a signal, a rule or a process, which raises the question of which parts of trust and safety are one platform.\n\n**Advances the thesis** (S1, S6): Shows the cost of separate stacks and poses the sharing question.\n\n**Transition in:** `example`: Veldmark as the running example. → The 7 March 2027 phishing incident.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | example | On 7 March 2027 Tradeyard NL suspended a phishing account seven minutes after Femke reported its fake Safe Deal payment link, which is fast by the standards of most classifieds platforms. | case: Fake Safe Deal link at 20:11 for Femke's €240 bike, delivered because no rule checked domain age; reported 20:19; suspended 20:26; a new rule withheld 37 similar messages. |  |\n| p06 | evidence (list) | Seen from the group, the same incident showed four stacks that could not share a signal: the phone number had a Motorvane account no one could see, Belgium got the rule only on Wednesday, Poland and Portugal never got it, and Hearthly ran its own tools. | case: Ingrid's 16 March question to Aisha; Motorvane account three weeks earlier; Yardstick deploys twice a week; PL/PT outsourced keyword lists; Hearthly's in-house rules and Casavista's review tool. | `contrast`: The seven-minute suspension inside Tradeyard NL. → What happened outside Tradeyard NL. |\n| p07 | evidence | Aisha's one-slide inventory shows each brand with its own detection, human review, policies, appeals and way of producing the DSA statement of reasons, the notice owed to a user whose content is restricted. | table: Brand-by-brand table of detection, review, policies, appeals and DSA statements of reasons. | `additional_support`: The gaps the incident exposed. → The full inventory of the group's stacks. |\n| p08 | evidence | Added up, the group ran 210 moderators, four definitions of a prohibited item, three appeal processes and five ways of producing a statement of reasons, while Tradeyard alone sent about 138,000 listings a week to human review. | statistic: 210 moderators; 94% of Tradeyard's new-listing decisions automated; about 138,000 a week, 6% of 2.3 million, to review. | `conclusion_summary`: The inventory table. → Its totals, and the definition of a statement of reasons. |\n| p09 | claim | Ingrid's question was not whether to centralize moderators but which parts of trust and safety are one platform and which must stay four; the rest of the chapter is the answer the advice forum adopted in mid-2027. | fact: Shared T&S platform live for Tradeyard NL and BE in November 2027. | `cause_effect`: Four of everything. → The question the chapter answers. |\n\n### Concepts: The Five Functions of Trust and Safety\n\n**Controlling idea** (`definition`, id `concepts`): Trust and safety splits into five functions plus measurement, defined by what each decides, how fast it changes and how it fails, and policies are the versioned reference data every function cites.\n\n**Advances the thesis** (S1): Defines the functions and the policy record the architecture is built from.\n\n**Transition in:** `problem_solution`: Ingrid's question which parts are one platform. → Splitting trust and safety into functions, the prerequisite for answering it.\n\n**Order of paragraphs** (`large_to_small`): The functions are named first, then the working terms, then the first function's record in detail; the policy record names detectors and actions only by the function they serve, which is all the reader has at this point, and sections 3 and 4 develop them. Placed after the pipeline, the policy record would arrive after components that already cite it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | definition | Trust and safety is easier to architect once it is split into five functions (policy, detection, decision, enforcement, review and redress) that change at different speeds and fail in different ways. | table: Function table: question, speed of change, typical failure.; figure: Figure 1: five gears joined by one record ribbon. |  |\n| p11 | definition | Measurement and transparency is a sixth concern that runs across all five functions. |  | `additional_support`: The five functions. → The concern that spans them. |\n| p12 | definition (list) | Five working terms are used throughout the chapter: policy, moderation pipeline, enforcement action, case and T&S metrics, three of which the chapter owns. | example: 'No live animals in Tradeyard PT except through registered breeders' is a policy, a keyword list is not; a ring of 26 accounts is one case, not 180 tickets. | `elaboration`: The functions. → The terms the rest of the chapter uses for their parts. |\n| p13 | explanation | The functions decide on actors as well as listings, and the decision record links the two views; Trust is its own bounded context in which a listing is a subject under evaluation. | example: A weapon or a discriminatory rental ad violates on its own; a fraud ring or a takeover account is a problem even when every listing looks clean. | `elaboration`: Decisions about items. → Decisions about actors. |\n| p14 | example | The most underrated design decision is to treat policies as data: a registry of versioned policy records that rules, models, reviewer guidelines, notices and reports all point to. | table: Veldmark's POL-FRAUD-PAYLINK v3 record: scope, statement, ground, DSA category, detectors, allowed actions, guideline, user-facing reason, owner. | `sequence`: The five functions and their terms. → The first function, policy, built as data. |\n| p15 | cause_effect | Policies as data let a decision cite policy ID and version, let countries add overlays without forking the platform, and move legal review into the registry. |  | `cause_effect`: The policy record. → Three consequences of keeping policies as data. |\n| p16 | explanation | As with category trees, a decision must stay explainable under the policy version in force when it was taken. | reasoning: categories-and-taxonomies treats category trees as versioned reference data. | `similarity`: Versioned policy records. → The parallel with category trees and the duty it adds. |\n\n### Architecture: The Moderation Pipeline and Its Components\n\n**Controlling idea** (`description`, id `architecture`): The moderation pipeline is a set of components around one decision service, run at two speeds whose split, together with the moderation mode, human queues and LLM use, is set by risk, and anchored in what the public record documents.\n\n**Advances the thesis** (S1, S2): Gives the components and sets the moderation mode by risk tier.\n\n**Transition in:** `sequence`: The five functions. → The components that implement them.\n\n**Order of paragraphs** (`large_to_small`): The whole component set first, with the public evidence that anchors it as a reference design directly after the component table, then the two speeds a listing meets, the risk decision that splits them and the range of modes it produces, then human review, sampling and LLMs, which act on what the automated path leaves uncertain. Placed before the components, the modes would describe paths the reader cannot locate. The public evidence sits under its own subheading next to the reference-design statement it supports; at the end of the section, after the LLM rules, both flow readers of round 3 read it as an appendix.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p17 | description | The reference architecture, assembled from public building blocks and labeled as an inference, makes one decision service the only writer of decision records, with every other component feeding it or deriving from its records. | source: Meta's Sigma (2015), Stripe Radar's rule operations, OLX's chat moderation, the DSA, the Ofcom-commissioned report (July 2026).; figure: Figure 2: detection and review feed one decision service.; table: Component table: responsibility and key interface of eleven components. |  |\n| p47 | evidence (list) | Classifieds companies publish little about trust and safety, but what they publish shows shared moderation in a portfolio, shared models, real-time chat moderation, rules deployed in minutes and rule operations, enough to anchor the design but not to describe any company. | source: Adevinta Annual Report 2023 (April 2024): chat and moderation among the first consolidated capabilities.; source: Adevinta Tech Blog (March 2023): central Text in Image OCR service, 100 million to 330 million requests a month.; source: OLX Group (January 2026): real-time chat moderation and image blocking.; source: Engineering at Meta (2015): Sigma, rules hot-swapped at over a million requests a second.; source: Stripe Radar documentation (n.d.): backtesting, shadow mode, rollout, audit.; reasoning: INFERENCE, NOT DOCUMENTED callout on Adevinta-group job postings (2025–2026). | `additional_support`: The reference design, labeled as an inference, and its component table. → The public record that anchors it, and its limits. |\n| p18 | description | The synchronous gate sits inside the user's action with a budget of a few hundred milliseconds, so it can afford only rules, block-list lookups and a cheap model, and answers allow, hold or reject. |  | `sequence`: The components and the public evidence behind them. → The first component a listing meets, the gate. |\n| p19 | description | The asynchronous path runs slower detectors on events after the action and can still demote, hold or remove a listing that is already live. |  | `contrast`: The gate's fast, cheap checks. → The slower checks after the action. |\n| p20 | claim | Which checks run in which path is a risk decision, not a technical one: a cheap book can go live on the gate, while a rental in a fake-rental city should wait for image and duplicate checks. | example: A €15 children's book versus a rental flat in a city with a fake-rental problem.; figure: Figure 3: two lanes, the book goes live, the rental waits. | `cause_effect`: Two paths with different speeds. → What decides which check runs where. |\n| p21 | comparison | Pre-moderation and post-moderation are the ends of a spectrum, and large platforms run several points on it at once. | table: Four modes compared on time to live, exposure, cost and fit. | `elaboration`: The risk decision about paths. → The full range of moderation modes. |\n| p22 | recommendation | The design that works is risk-tiered: the mode depends on the category's risk, the seller's trust level and the listing's risk score. | example: A verified dealer's car from a DMS feed goes live on the gate; a new account's first rental waits for the full check. | `conclusion_summary`: The spectrum of modes. → Choosing the mode per risk tier. |\n| p23 | evidence (list) | Two public cases show why the mode matters: edits must be re-moderated as new submissions, and the terms must describe the mode the platform actually runs. | case: Which? December 2024 test: edited scam ads passed review in minutes; one Facebook ad live almost 48 hours.; case: December 2015 Paris ruling against leboncoin for claiming all ads were validated; hosting status confirmed. | `example`: Risk-tiered modes. → Public cases that show the cost of getting the mode wrong. |\n| p24 | explanation (list) | Human review exists for three reasons, the grey zone, labels and the law, and each calls for a different queue design. | example: A suspected fake rental with ten contacts in its first hour outranks a possibly miscategorized sofa. | `sequence`: Automated modes. → Where human judgement sits in the pipeline. |\n| p25 | recommendation | A review queue that almost always ends in the same outcome should become an automated rule, and a rule reviewers would often overturn should go back to the queue. | source: Stripe Radar documentation (n.d.). | `elaboration`: Queue designs. → When work moves between queues and rules. |\n| p26 | evidence | The random sample gives the only trust-and-safety number that does not depend on what the detectors already catch. | source: Integrity Institute for Ofcom (July 2026): review randomly sampled ad impressions and most-viewed ads to estimate prevalence. | `contrast`: Queues fed by detectors. → A queue fed by random sampling. |\n| p27 | evidence | LLMs entered production moderation between 2024 and 2026, and the thin public classifieds evidence shows real-time chat image checks and policy taxonomies supplied as prompts. | source: OLX Group January 2026 post on generative-AI image blocking in chats.; source: Llama Guard, Inan et al., December 2023. | `sequence`: Human review and sampling. → The newest detector type. |\n| p28 | recommendation (list) | My rule for LLMs in a moderation pipeline has four parts: grey zone only, policy agility as the main value, deterministic floors stay, and drafts rather than decisions where the law needs a human. | reasoning: Tradeyard's 2.3 million new listings a week; DSA complaints must not be decided solely by automated means. | `cause_effect`: What LLMs can do. → Where the author would place them. |\n\n### Enforcement Actions and Their Propagation\n\n**Controlling idea** (`claim`, id `enforcement`): An enforcement action is a rung on a ladder that includes demotion, and it is done only when every consumer that holds a copy has applied and acknowledged it.\n\n**Advances the thesis** (S3): Argues the propagation half of the thesis.\n\n**Transition in:** `sequence`: The pipeline, in which the decision service decides. → The actions it takes and how they reach every system.\n\n**Order of paragraphs** (`large_to_small`): First the range of actions, including demotion, then where any action must take effect, the event that makes it happen, and the failure when it does not, ending on the Veldmark incident.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p29 | description | Removal is one rung of a ladder of actions the decision service chooses from, and often not the right one. | source: Integrity Institute for Ofcom (2026): graduated ladder from nudge to suspension; payment freezes need a higher evidentiary threshold.; table: Eight-rung ladder: action, target, trigger, whether a statement of reasons is needed. |  |\n| p30 | claim | Because Article 17 of the DSA covers demotion, a ranking system that quietly pushes suspected scams down is taking a moderation decision, so trust-based down-ranking belongs behind the decision service. | fact: Transparency Database value DECISION_VISIBILITY_CONTENT_DEMOTED. | `emphasis`: The statement-of-reasons column of the ladder. → Its surprise for ranking teams: demotion counts. |\n| p31 | claim | A removal is not finished when the listing's status changes, because search, alerts, recommendations, messaging, SEO pages, ads, payments, partner feeds and analytics each hold their own copy. | table: Consumer table: what each holds and what enforcement must do there. | `sequence`: Which action is chosen. → Where the chosen action must take effect. |\n| p32 | process | Enforcement should be an EnforcementApplied event that every consumer applies idempotently and acknowledges, with a propagation monitor and an EnforcementLifted event that restores ranking state on reversal; payment holds are designed in Part VI. | reasoning: event-driven-listings' pattern for listing state changes; transactions-and-payments for Safe Deal holds and payout freezes. | `problem_solution`: Many copies that must each obey. → The event pattern that makes them obey and proves it. |\n| p33 | example | Without propagation, enforcement causes Ghost Inventory, and a fraudulent listing in a digest after removal sends buyers to a scammer under the platform's brand, so enforcement should ride the unpublish mechanism with higher priority. | case: Femke's bike, sold 18:10 and out of search 18:11 on 8 March, still in the next morning's digest.; figure: Figure 4: one decision fans out to every consumer, each acknowledges. | `contrast`: The event pattern. → What happens without it. |\n| p34 | example | Figure 4's counterparty warning is the target design: on 7 March 2027 the sellers the account had already contacted were not warned. | case: Two sellers learned the next day from Femke's warning in a neighborhood chat group. | `contrast`: The target design in Figure 4. → What actually happened in March 2027. |\n\n### Intake, Cases and Appeals\n\n**Controlling idea** (`explanation`, id `intake`): Notices, cases, appeals and statements of reasons are entities linked to decision records, so redress and regulatory output follow from the record instead of being built as separate projects.\n\n**Advances the thesis** (S4): Argues that review and redress hang off the decision record.\n\n**Transition in:** `contrast`: Decisions driven by detection. → The other ways violations arrive.\n\n**Order of paragraphs** (`chronological`): Follows a complaint from arrival as a notice, to a case, to a decision that can be appealed, to the statement of reasons that reports it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p35 | description | Detection is only one way violations arrive: users, rights holders, authorities, banks and trusted flaggers send notices too. |  |  |\n| p36 | cause_effect | Because Article 16 of the DSA sets what a notice must contain and what the platform must do with it, a notice is an entity with a lifecycle, not an e-mail in a support inbox. | source: DSA Art. 16 (notice contents, confirmation, timely decision, outcome, disclosure of automation) and Art. 22 (trusted flaggers).; table: Notice fields and why the architecture needs each. | `elaboration`: The intake channels. → What the law requires of a notice. |\n| p37 | description | Case management wins or loses reviewers' productivity through ordinary features: grouping, evidence views, cross-brand history where lawful, reason templates, timers and quality sampling. | figure: Figure 5: case lifecycle with Decided and Enforced as separate states and appeals as new decisions. | `sequence`: Notices arriving. → The case they become. |\n| p38 | evidence | Article 20 of the DSA requires a free electronic complaint system for at least six months after a decision, decided under qualified staff and not solely by automated means. | source: DSA Arts. 20 and 21. | `sequence`: Decided cases. → How users contest them. |\n| p39 | recommendation (list) | Three rules follow: an appeal creates a new decision linked to the original, evidence must outlive the complaint window, and reversals are the best labels the platform gets. |  | `cause_effect`: The legal duties of Article 20. → The architectural rules they imply. |\n| p40 | evidence | Every restriction needs a statement of reasons to the user and a copy without personal data in the DSA Transparency Database, which shows the scale involved. | statistic: About 4.4 billion statements from 375 platforms in the 180 days to 19 October 2026; 41% fully automated. | `sequence`: Appeals against decisions. → The notice every restricting decision produces. |\n| p41 | analysis | At Tradeyard NL's volume statements of reasons can only be generated from a decision record, so the record is the upstream design and the regulatory output is a view of it. | statistic: About 1.9% of about 1.05 million new Dutch listings a week removed: about 20,000 statements a week from listing removals alone; Veldmark had five exporters. | `example`: The EU-wide volume. → Tradeyard NL's own volume. |\n\n### Measuring Trust and Safety\n\n**Controlling idea** (`claim`, id `measuring`): The platform is judged on harm, speed and accuracy measured from samples and decision records, not on activity, and Veldmark's sample shows how far activity numbers can mislead.\n\n**Advances the thesis** (S5): Argues the measurement claim with definitions and Veldmark's numbers.\n\n**Transition in:** `elaboration`: The decision record as the source of regulatory output. → Metrics as its other output, and how they are usually built wrong.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The claim and the metric definitions come first, then the practices that make them trustworthy, then Veldmark's numbers as evidence and the reasoning behind its targets. With Veldmark's 0.6% first, the reader would meet prevalence before it is defined.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p42 | claim | Activity numbers say how busy the team is, not whether the marketplace is safe, so the platform needs metrics of harm, speed and accuracy, each with its own way of misleading. | reasoning: A model that misses a new scam reduces removals and queue sizes at once.; table: Prevalence, exposure-weighted prevalence, time to action, precision, recall, overturn rate, report rate, reviewer agreement: definition, what it tells, how it misleads. |  |\n| p43 | recommendation | The numbers are trustworthy only when computed from decision records and samples rather than operational logs, and reported per policy and per detector. | example: 'Precision 96%' hiding a phishing rule at 99.5% and a counterfeit rule at 70%. | `cause_effect`: Metrics that can mislead. → Two practices that make them trustworthy. |\n| p44 | example | Veldmark's first blind sample found about three times the prevalence that removal counts suggested, mostly in harms the detectors could not see. | statistic: April 2027: 4,000 Tradeyard NL listings a week, 20 strata; about 0.6% violating against 0.2% assumed; phone-repair services and contact details in images.; figure: Figure 6: dashboard 0.2% against sample 0.6%. | `example`: Metrics defined in general. → Veldmark's first measurement. |\n| p45 | evidence | Tradeyard's weekly queue numbers set the shared platform's design targets for end of 2028. | table: 2.3M to about 2.4M listings; 94% to 96% automated; about 138,000 to about 96,000 reviews; 158 moderators, all on review queues, to about 135 (about 120 on review queues, 96,000 at about 800 each, and about 15 on sampling and appeals); median time to action on fraud reports 3 h 10 min to under 30 min; overturn rate measured per policy with an alert above 10%. | `sequence`: The baseline measurement. → The targets set from it. |\n| p46 | analysis | The design moved moderators to sampling and appeals rather than removing them, and expected the automation gain from three sources. | statistic: About 15 moderators moved; sources: queues turned into rules, an OCR detector for contact details in images, actor-level decisions on rings. | `elaboration`: The targets table. → What the targets meant for people and where the gain comes from. |\n\n### One Platform for Four Brands: What to Share\n\n**Controlling idea** (`recommendation`, id `sharing`): A group shares the trust-and-safety machinery and evidence, shares signals only where its Data Protection Officer approves them, and keeps policy content, thresholds, reviewers and vertical detectors with each brand.\n\n**Advances the thesis** (S6): Answers Ingrid's question.\n\n**Transition in:** `problem_solution`: The parts of the platform and their numbers, built since Ingrid's question. → The answer to her question: what the group shares and what stays with each brand.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p48 | recommendation | Veldmark's rule of sharing platforms, not products, splits trust and safety into machinery the group shares and policy judgement each brand keeps as a tenant of the shared platform. | table: Twelve components with share, share where lawful, share the registry, or local, and the reasoning. |  |\n| p49 | claim | Sharing signals across brands is a data protection question before it is an engineering one, and Veldmark's architecture enforces the line its Data Protection Officer drew. | case: Lucía Ortega approved a shared list of hashed phones, e-mails, IBANs and device identifiers of accounts terminated for fraud, with purpose, two-year retention and an impact assessment; not raw content or behavior. | `contrast`: The share table. → The constraint the table hides. |\n| p50 | example | Keybridge is deliberately not a tenant, because a neutral SaaS business inside the group needs an explicit data boundary, which Figure 7's tenancy split shows. | fact: Veldmark's March 2027 commitment not to use Keybridge agency data for Hearthly's advantage.; figure: Figure 7: tenancy split, machinery shared, overlays and detectors per tenant, Keybridge not a tenant. | `elaboration`: The tenancy split and the line on what may cross brands. → The one Veldmark business kept outside the split altogether. |\n\n### Vertical Differences\n\n**Controlling idea** (`comparison`, id `verticals`): Harms, control points and detectors differ by vertical, so a group platform must accept vertical detectors and policies as tenant content.\n\n**Advances the thesis** (S6): Shows why some parts stay local.\n\n**Transition in:** `elaboration`: The local side of Figure 7's tenancy split: policy overlays, vertical detectors and thresholds. → How brands differ where their verticals differ.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p53 | comparison | The vertical table explains why vertical detectors and policies must be first-class tenant content: Hearthly's key detector is stolen-photo matching and Motorvane's key control is dealer verification. | table: General, real estate, automotive and jobs: harms, supply mix, control point, pre-moderation tolerance, vertical policy, typical detector. |  |\n\n### Trade-offs\n\n**Controlling idea** (`comparison`, id `trade-offs`): Each choice of where to build trust and safety and where to put human judgement has a cost, and the group keeps its records and sets time budgets per risk tier.\n\n**Advances the thesis** (S2, S6): Compares the alternatives to the chosen design.\n\n**Transition in:** `contrast`: Veldmark's chosen split, shared machinery with local policy and vertical content. → The alternatives it was chosen over, and where human judgement goes.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p51 | comparison | A vendor can supply review capacity but not the records the platform learns from, so the decision record, policy registry and labels stay in-house. | table: Per-brand stacks, shared platform with local policy, fully central, vendor platform: strengths, weaknesses, right when. |  |\n| p52 | recommendation | Moderation costs liquidity, so the answer is risk tiers with explicit time budgets per tier, reviewed with the general managers who carry the liquidity targets. | table: More pre-moderation, more automation, LLMs in the grey zone, more sampling: benefit and cost.; reasoning: liquidity-and-network-effects: a listing's first hours matter most. | `sequence`: Where to build trust and safety. → Where to put human judgement. |\n\n### Failure Modes\n\n**Controlling idea** (`description`, id `failure-modes`): Ten recurring failure modes show how trust and safety goes wrong when the chapter's separations are missing.\n\n**Advances the thesis** (S1, S2, S3, S4, S5, S6): Turns each claim into a failure to watch for.\n\n**Transition in:** `contrast`: How to choose well among the alternatives. → How trust and safety goes wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p54 | description (list) | Ten failure modes, from moderation only at creation to badges that outlive an account's integrity, each break one part of the design. |  |  |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `ca-view`): Sharing pays from the first year but centralizing judgement destroys value, so the Chief Architect assigns each decision an owner, watches long-term trends and reports harm to the board.\n\n**Advances the thesis** (S3, S5, S6): Turns the design into decisions, owners and a board metric.\n\n**Transition in:** `sequence`: The design and its failures. → Who decides what at group level.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p55 | recommendation | Trust and safety is one of the few capabilities where sharing pays from the first year and centralizing too much destroys value, so each decision needs a named owner and an indicator. | table: Seven decisions with who decides and what to watch. |  |\n| p56 | recommendation (list) | Three long-term trends belong on the roadmap: trust and safety consumes every event, regulation adds outputs, and adversaries learn the platform. | fact: Veldmark's event backbone (July 2027) came before the shared T&S platform (November 2027). | `sequence`: The decisions to make now. → The trends to plan for. |\n| p57 | recommendation | The board metric is sampled prevalence of fraudulent listings by brand with its trend, next to time to action on fraud reports. |  | `conclusion_summary`: Decisions and trends. → The one pair of numbers for the board. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Ten review questions test a trust-and-safety design against the chapter's claims.\n\n**Advances the thesis** (S1, S2, S3, S4, S5, S6): Turns each claim into a question for a design review.\n\n**Transition in:** `sequence`: The decisions and indicators. → Questions that check them in a review.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p58 | recommendation (list) | Ten questions check a trust-and-safety design, from which component writes decisions to whether labels survive a change of review vendor. |  |  |\n\n## Conclusion: From Platform to Adversary\n\n**Synthesis:** The question the chapter opened with, what did we remove, why, and did it disappear, is answered by one record: the decision record says what and why under which policy version, the acknowledgements say where it took effect, the sample says how much harm remains, and sharing that record and its machinery is what lets a signal from one brand protect another while policy stays local.\n\n**So what:** A group that builds the record and the propagation path can answer a regulator, a wrongly blocked seller and its own board from the same data; a group of queues answers each with a new project.\n\n**Callback:** The opening question (what did we remove last month, why, and did it actually disappear) and the 7 March phishing account with its unseen Motorvane twin. Under the shared platform the suspension is one decision record citing a policy version, its rule reaches every Tradeyard country through one runtime, the counterparties are warned, and the terminated account's hashed phone number reaches Motorvane through the shared block list.\n\n**Takeaway** (`course_of_action`): Make the decision record and the single-writer rule a group decision, emit enforcement as acknowledged events, measure sampled prevalence, and share machinery while keeping policy local.\n\n**Hand-off** to [Scams, Fakes and Account Takeovers: Fraud Prevention for Listings](fraud-prevention.html): `problem_solution`: Trust-and-safety-architecture's platform, which deliberately left detection as a slot that detectors plug into, and its closing point that the most demanding detectors face people who study the platform and adapt within days. → That adversary and the detector built for it: the classifieds threat model, fraud signals, the risk scoring service with actor-level scoring, step-up friction and the Barcelona fake-rental ring.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p59 | synthesis | The opening question has one answer: a decision record written by one service, acknowledged by every consumer and measured by sampling, shared across brands as machinery while policy stays local, which would have turned the 7 March incident into one decision that reached every country and brand. | reasoning: The 7 March account, its Motorvane registration, the Wednesday rule in Belgium and the unwarned counterparties, replayed under the shared design. |  |\n| p60 | transition | The platform deliberately left detection as a slot, and the most demanding detectors face people who study the platform and adapt within days, which is the adversary the next chapter takes up. |  | `problem_solution`: The platform with detection as a slot. → The adversary and the detector built for it. |\n\n## Non-goals\n\n- Fraud typology, risk scoring, fraud signals and step-up friction. See [Scams, Fakes and Account Takeovers: Fraud Prevention for Listings](fraud-prevention.html).\n- Identity levels, KYB and verified badges. See [Who Is on the Other Side? Identity and Verification](identity-and-verification.html).\n- Legal detail of the DSA, DAC7, the UK Online Safety Act and vertical regulation, and Veldmark's statement-of-reasons pipeline. See [Rules of the Marketplace: DSA, DAC7 and Vertical Regulation](marketplace-regulation.html).\n- Message storage and conversation design. See [From Interest to Contact: Messaging and Lead Management](messaging-and-leads.html).\n- The end-to-end publication path and freshness targets. See [From Submitted to Searchable: The Publication Pipeline](publication-pipeline.html).\n- Ranking mechanics. See [Ranking for Two Sides: Relevance, Freshness and Paid Visibility](ranking.html).\n- Safe Deal payment holds, payout freezes and the transaction platform that applies them. See [Beyond the Contact: Payments, Shipping and Buyer Protection](transactions-and-payments.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- No classifieds company has published a T&S architecture; revisit the 'In practice' section if Adevinta, OLX or Vinted publish one. (Carried over from spec.md.)\n- Whether the shared hashed block list across brands survives a full DPIA in every Veldmark country is asserted in the story, not analyzed; identity-and-verification or marketplace-regulation may need to pick this up. (Carried over from spec.md.)\n- Known differences between generated figures and their mermaid sources (Figure 2: case management drawn inside the Detection panel; Figure 7: three arrows end at the wrong box) are recorded in the 2026-10-20 changelog entry and not fixed. (Carried over from spec.md.)\n\n## Decision log\n\n- **2026-11-12** — Round-3 escalation resolved under the author's delegation ('auto resolve all ESCALATE topics'): moved the '### In practice: what is publicly documented' subsection (p47) from the end of the architecture section to directly after the component table (p17), where both round-3 flow readers independently wanted it; rewrote p47's opening sentence and transition, p18's transition, the enforcement section's transition and the roadmap (p03 and its promises). Rejected: Keeping it as the closing subsection after the LLM rules, which both readers read as an appendix.; Dropping the subsection, which would cut published citations.\n- **2026-11-12** — Moved Vertical Differences to follow the sharing section directly, as both round-3 flow readers asked, and gave it an opening sentence that picks up the local side of Figure 7's tenancy split; Trade-offs now follows Vertical Differences edress as one; the claim bundles six sub-claims): accepted under the author's delegation, 2026-11-12; the thesis is copied from the journal spec and stays unchanged.\n- **2026-11-12** — Flow rubric notes of 2026-11-12 (merge p20 into p22, trim p46, merge p34 into p33, keep public evidence in one place, introduce Keybridge in the scene, argue the closing sections' order): accepted under the author's delegation, 2026-11-12, as notes only; the order changes the readers converged on were made, the rest keep the published text.\n- **2026-11-12** — DSA quotation check: closed; the 2026-10-19 review verified Arts. 16, 17, 20 and 24(5) against the Official Journal, as the Sources entry records. Accepted under the author's delegation, 2026-11-12.\n- **2026-11-12** — After draft check round 2 (both flow readers: as its own section between pipeline and enforcement, In Practice still broke the decision-to-enforcement line; judged a spec fault), folded the In Practice section into the architecture section as its closing subsection (### In practice: what is publicly documented), paragraph p47 unchanged; moved Figure 7 after the Keybridge paragraph it illustrates. The book's chapter shape names 'In practice' as its own section; the author may prefer to restore it. Rejected: Keeping In Practice as a separate section in any position.; Splitting its bullets across the architecture subsections where each source is first cited, which would move published text further.\n- **2026-11-12** — After draft check round 1 (both flow readers could not place 'In Practice' between measurement and sharing; judged a spec fault), moved the In Practice section to follow the architecture section, whose reference design it anchors; rewrote the transitions into practice, enforcement and sharing and the roadmap (p03 and its promises). Rejected: Folding the public evidence into the sharing section, which would drop the house 'In practice' heading and leave the Sigma, Radar and OLX evidence far from the des elationship of fraud-prevention; the Part V flow note asking for a forward pointer to Part VI payments.\n  - _research/brief-trust-safety-regulation.md — Moderation modes, pipeline anatomy, DSA obligations, Transparency Database schema, enforcement ladder.\n  - _research/brief-adevinta.md — Chat and moderation as early global components; the OCR service.\n  - _research/scenario-ledger.md — Veldmark volumes, moderation numbers, city bike timeline, Common Ground decisions.\n  - publication-pipeline, event-driven-listings, ranking, marketplace-regulation, transactions-and-payments — Neighbouring owners linked from the chapter.\n- **External**\n  - Which?, Scam ads slipping through the net too easily (2024) — Edits passing review.\n  - Clubic, leboncoin ruling (2015) — Moderation claims and hosting status.\n  - Integrity Institute for Ofcom, Fraudulent advertising and account integrity (2026) — Enforcement ladder, prevalence sampling.\n  - Stripe Radar documentation (n.d.) and Meta's Sigma post (2015) — Rule lifecycle and rules as code.\n  - OLX Group (2026) and Adevinta (2023, 2024) — Public classifieds moderation evidence.\n  - DSA Articles 16, 17, 20, 21, 22 and 24, and the Transparency Database documentation — Legal duties and schema values.\n\n## Changelog\n\n- **2026-11-12** — Escalation resolved under the author's delegation: In practice moved to follow the component table; Vertical Differences moved next to the sharing section; moderator target stated as about 135 (120 on review, 15 on sampling and appeals); Figure 4 counterparty paragraph, Article 20 pointer and minor round-3 findings fixed; max_words 8,237 to 8,400. (AI-mediated session)\n- **2026-11-12** — After draft check round 3 (escalate): cheap fixes without another round: Keybridge glossed, 'tenant' and 'enforcement ladder' pointed, the 37-messages sentence dropped from p34, a sentence introducing the metrics table; p50's transition updated for Figure 7's new place. The check report is stale against the <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
