<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, acceptance criteria AC-1 to AC-3, the thesis and the role are copied unchanged from the media-pipeline entry in journal-spec.json. Units added by this conversion: a roadmap paragraph in the introduction (p04), lead-in paragraphs for the trade-off table (p53) and the vertical table (p55), and a synthesis paragraph (p65) before the hand-off.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The asset model (content-derived identity, sanitized master, moderation state, retention class), the upload-to-edge pipeline and what blocks publication.\n- **Know:** Where media costs come from (copies, stored renditions, never-deleted originals) and how exact and perceptual hashes differ in use.\n- **Believe:** Hashes are trust infrastructure, and a match that cannot hold a listing or carries no seller context lets fraud run.\n- **Be able to:** Explain a media bill and plan the changes that cut it: content addressing, on-demand derivatives, lifecycle by listing state.\n- **Be able to:** Decide which media checks must complete before a listing is contactable.\n\n**Audience:** Chief and principal architects, platform and infrastructure leads, trust-and-safety engineering leads and engineering directors of marketplaces that store and serve large image archives.\n\n**Already knows:**\n\n- Object storage, CDNs, HTTP caching and conditional requests, and event-driven processing.\n- Cryptographic hashes such as SHA-256.\n- From earlier chapters: the listing as a small aggregate that references subdomains by ID (listing-aggregate), the attribute dictionary (attribute-schemas), Veldmark and its brands, cast and the Common Ground program (meet-veldmark), the advice forum, and the failure-pattern names (where-listing-systems-go-wrong).\n\n**Does not yet know:**\n\n- Media asset, original, master, derivative, image service, content addressing, perceptual hash, PDQ and Hamming distance.\n- EXIF metadata and what GPS tags record; AVIF and WebP as image formats.\n- Storage-class minimum durations; retention classes.\n- The publication budget (owned by publication-pipeline) and the trust decision (owned by trust-and-safety-architecture), which are named here and defined in their chapters.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a duplicate-photo detector that fired but did not stop a fraud, the reader names what was missing. *Probe:* A rental portal's hash index matched stolen photos within minutes of upload, yet the fake listings went live and buyers paid deposits. Using only this chapter: what was missing, and what should the pipeline do? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-4 | Given a media bill that grows faster than live inventory, the reader names the likely causes and the changes that cut storage and delivery cost. *Probe:* A property portal's stored images grew 19% in a year while its live listings grew 4%. Using only this chapter: where is the growth likely to come from, and which changes would cut the storage and delivery cost? | `custom` | cold_reader | minor |\n| AC-5 | Given a site that strips photo metadata only from what buyers see, the reader explains why that is not enough and what the pipeline must do. *Probe:* A private seller's phone photos carry the GPS coordinates of her home. The marketplace strips metadata from the images it shows buyers. Using only this chapter: is that enough, and what should the media pipeline do? | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** How do you ingest, process, store, moderate and serve billions of listing images and other media?\n\n> **Claim:** Media is a subdomain with its own identity and lifecycle, not a storage-and-CDN concern: a listing references content-addressed asset IDs; every upload path converges on one step that sanitizes files, strips location metadata and hashes them; derivatives are generated on demand at the edge rather than stored; sanitized masters move to colder tiers and are deleted by retention class as listings end; and a perceptual-hash match to an unrelated seller is a trust decision, shared across brands, that can hold a listing before buyers can contact it.\n\n**Disputed by:** The view that media is a storage and CDN concern: keep every upload and every rendition indefinitely because storage is cheap, and treat duplicate and stolen-photo detection as a moderation-queue add-on that runs after publication.\n\n**So what:** A group that accepts this shares the media contract (asset model, media API, derivative URL scheme, `MediaReady` event) first and the infrastructure later, sets retention classes with the data protection and trust-and-safety owners, and watches stored bytes per live listing and the share of unrelated-seller matches decided before a listing is contactable; Hearthly plans to cut its media run cost from €6.2 million to €3.6 million by the end of 2028.\n\n**How and why:** Hearthly stores 1.8 billion images: about 38% of originals are byte-for-byte copies created by feeds that re-send every photo URL, nine JPEG renditions are kept per image, and about 96% belong to listings no longer live, so storage grew 19% in 2026 while live listings grew 4%. In July 2027 its hash index matched the Barcelona ring's stolen photos within minutes, but the match only queued a 'possible duplicate' with no seller context while the listings went live, and 63 people lost about €71,000.\n\n**Supporting claims**\n\n- **S1** — A listing stores media IDs and an order, never URLs; each asset of any type (photo, document, video, tour or floor plan) has a content-derived identity, a sanitized master, a moderation state and a retention class, and a `MediaReady` event tells downstream consumers when to recompute, so CDN, format and deletion changes are media-service operations, not listing migrations.\n- **S2** — Every way in (direct upload, partner feeds, back office and generated media) converges on one pipeline that gates, sanitizes and hashes a file before anything else sees it, and each check is placed by whether it must finish with the upload, before the listing is searchable, or after publication.\n- **S3** — Listing photos carry personal data (location metadata, faces, plates, occupied interiors, generated or edited content), so metadata is stripped before the master is written, the raw upload is not kept by default (the sanitized master is what is stored and later tiered), provenance is recorded per asset, and deletion purges the CDN.\n- **S4** — Media cost comes from copies, stored renditions and originals that are never deleted, and is cut by content addressing with change-aware fetching, on-demand derivatives behind a CDN with bounded, signed and immutable URLs, and storage tiers and retention classes that follow the listing's state.\n- **S5** — Hashes are trust infrastructure: layered exact, perceptual and embedding matching with an allowlist, in an index shared across brands, where a match to an unrelated seller carries the seller relationship and can hold a listing before buyers can contact it, while the same match supports a legitimate merge elsewhere.\n\n## Role in the part\n\nDesigns the largest referenced subdomain as one pipeline with one contract, and supplies the photo-metadata stripping that the location chapter's privacy rule depends on. Supports P2-4 of part `part-2`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `grouping` in derivatives and lifecycle (the bill's half) and hashing (the ring's half), each half opening with a reference to its document; image understanding follows as the use of images beyond fraud; `assertion_evidence_reasoning` in in-practice: the design is tested against public records and then priced in Veldmark's plan)\n\nThe scene states two problems, Julien's two documents: Hearthly's bill and the Barcelona ring. The concepts give the words; the pipeline section gives the frame (doors, stages, and which checks block publication), and privacy follows because sanitizing is what happens first to every file. The middle then takes the two documents in turn: the bill's half (derivatives and the CDN, then storage tiers and lifecycle) and the ring's half (perceptual hashing), then image understanding as the use of images beyond fraud, before other media types extend the same model. Public examples and Hearthly's plan then show the design solving both problems in numbers, and the trade-offs, vertical differences, failure modes, Chief Architect's view and review questions are judgements about a design the reader has already seen. Moving the hashing section before the pipeline would discuss matches before the reader knows where hashing runs and what can block publication; mixing the cost and trust sections would break the link each section makes back to one of the two documents; moving the plan before the cost and hashing sections would give numbers for changes not yet explained. The order of the two halves (cost first) follows the journal spec's roadmap (AC-2 expected answer).\n\n## Introduction\n\n**Hook** (`intriguing_example`): Listing marketplaces are, measured in bytes, image businesses: a text listing is a few kilobytes, its photos several megabytes, multiplied by every derivative size, every format and every year the platform keeps them.\n\n**Bridge:** The attribute dictionary of the previous chapter, which governs what a listing says in words and numbers, and the reader's own media stack: an upload endpoint, a resizing job and a CDN, with classifiers and duplicate checks added later. → Media is the largest and least governed body of listing data, and pipelines grown in stages store too much and check for stolen photos too late, so the question is what one pipeline with one contract looks like.\n\n**Thesis statement** (KEY POINTS callout (all three bullets) and paragraph p03 (one system with one contract).): Media is a subdomain with its own identity and lifecycle: listings reference media IDs; every file is sanitized and hashed on the way in; derivatives are generated on demand at the edge; originals are tiered and deleted by policy; and hash matches are trust infrastructure that can hold a listing, shared across brands.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p04.):\n\n- Hearthly's media bill and the Barcelona fake-rental ring at Veldmark. *Kept in:* scene.\n- Define assets, masters, derivatives and hashes. *Kept in:* concepts.\n- The pipeline from upload to edge, its stages and which checks block publication. *Kept in:* pipeline.\n- What photos reveal. *Kept in:* privacy.\n- Derivatives and the CDN. *Kept in:* derivatives.\n- Storage tiers and the media lifecycle. *Kept in:* lifecycle.\n- Perceptual hashing. *Kept in:* hashing.\n- Image understanding beyond fraud. *Kept in:* understanding.\n- Video, tours and floor plans. *Kept in:* rich-media.\n- Public examples and Hearthly's plan in numbers. *Kept in:* in-practice.\n- Trade-offs, vertical differences, failure modes, the Chief Architect's view and questions for a design review. *Kept in:* trade-offs, verticals, failure-modes, ca-view, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Measured in bytes, listing marketplaces are image businesses, and media is the largest and usually least governed body of listing data. | reasoning: A text listing is a few kilobytes; its photos are several megabytes, multiplied by every derivative size, format and year kept; buyers scroll galleries before descriptions and professional sellers judge a portal by how it presents their photography. |  |\n| p02 | cause_effect | Media pipelines usually grew in reasonable stages that together store far more than needed, serve old formats and check for stolen photos too late. |  | `elaboration`: Media as the least governed body of listing data. → What the media pipeline is and how it usually came to be. |\n| p03 | claim | Because Part II's listing references governed subdomains by ID and media is the largest of them, this chapter designs media as one pipeline with one contract (media IDs, sanitized masters and a `MediaReady` event published once an asset can be served) and leaves moderation policy and duplicate clustering to their own chapters. |  | `problem_solution`: A pipeline grown in stages. → One system with one contract, placed in Part II's argument. |\n| p04 | transition | The chapter starts with Veldmark's two documents, Hearthly's media bill and a fake-rental ring caught too late; after the terms, the pipeline with its publication checks and what photos reveal, it takes the bill's half (derivatives and the CDN, storage and lifecycle), then the ring's half (perceptual hashing), then image understanding beyond fraud and other media, and ends with public examples and Hearthly's plan, trade-offs, vertical differences, failure modes, the Chief Architect's view and review questions. |  | `sequence`: The one-contract design. → The order in which the chapter builds it; Veldmark named as fictional. |\n\n## Sections\n\n### Setting the Scene at Veldmark: 1.8 Billion Images and a Fake-Rental Ring\n\n**Controlling idea** (`context`, id `scene`): Hearthly's media bill and the Barcelona fake-rental ring show the cost and the trust failure of treating media as files behind a CDN, and pose the chapter's question.\n\n**Advances the thesis** (S4, S5): Gives the two problems in numbers, which the plan later resolves.\n\n**Transition in:** `example`: The claim that staged pipelines store too much and check too late. → Two Veldmark documents that show both.\n\n**Order of paragraphs** (`problem_solution`): The meeting, the bill and its causes, the fraud review, then the question that both raise. The question before the documents would be abstract; the documents without it would be two unrelated complaints.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | context | In September 2027 Hearthly's CTO, Julien Marchand, brings two documents to the Group Chief Architect, Ingrid Halvorsen, who separately already has a finding from Tradeyard, returned to under privacy: the stored originals of Femke's bike photos keep her home's GPS coordinates. | scenario: September 2027; Julien Marchand (Hearthly CTO) and Ingrid Halvorsen (Group Chief Architect). Femke's six photos carried home GPS in EXIF; Tradeyard's stored originals were not stripped. |  |\n| p06 | evidence | The first of Julien's two documents is Hearthly's media bill: 1.8 billion stored images and a 2026 run cost of about €6.2 million, with storage growing much faster than live listings. | scenario: Veldmark stores about 6.4 billion images and adds about 9.5 million a day; Hearthly, with 2.6 million live listings, stores 1.8 billion on Google Cloud Storage behind Cloud CDN; 2026 media run cost about €6.2 million (storage €2.6 million, CDN €2.8 million, processing and feed fetching €0.8 million); storage grew 19% in 2026 while live listings grew 4%. | `elaboration`: Julien's two documents, apart from the Tradeyard finding. → The first: the bill. |\n| p07 | cause_effect | Three causes explain the bill: feed re-downloads stored as new objects, nine stored JPEG renditions per image, and no deletion. | scenario: About 84% of Hearthly's listings arrive through feeds from about 160 software vendors that re-send every photo URL; about 38% of stored originals are byte-for-byte copies; nine JPEG renditions per image on the French platform; about 96% of stored images belong to listings no longer live.; figure: Figure 1: an iceberg whose small tip is live listing photos. | `cause_effect`: The bill's growth. → Its three causes. |\n| p08 | example | The second document, the review of the Barcelona fake-rental ring, shows that detection worked but the match could not hold a listing, carried no seller context and covered only one brand's images. | scenario: July 2027: 26 accounts, 180 fake rentals in Eixample with stolen photos, about 35% below market, deposits by bank transfer; perceptual-hash matches plus price anomalies exposed it after 63 people lost about €71,000; the match created a 'possible duplicate' queue item while the listing went live; the hash service returned only a distance; the index held only Hearthly.es images. | `sequence`: The first document, about cost. → The second, about trust. |\n| p09 | claim | Ingrid asks the advice forum what one media pipeline for the group looks like that stores less, serves faster, protects sellers' privacy and catches stolen photos before buyers see them. |  | `conclusion_summary`: Both documents. → The single question they pose. |\n\n### Concepts: Assets, Masters, Derivatives and Hashes\n\n**Controlling idea** (`definition`, id `concepts`): Costly media mistakes come from treating different things as one, so the asset, its original, master and derivatives, the image service, content addressing and perceptual hashes are defined apart, and the listing holds only media IDs.\n\n**Advances the thesis** (S1): Defines the asset model and states the IDs-not-URLs rule the rest depends on.\n\n**Transition in:** `cause_effect`: Ingrid's question. → The terms needed to answer it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | definition (list) | Seven terms name different things that media systems often treat as one: media asset, original and master, derivative, image service, content addressing, perceptual hash and media pipeline. | source: imgproxy (built on libvips, signed URLs) and thumbor as image services; Meta's PDQ, open-sourced in 2019, as the most widely used public perceptual hash, compared by Hamming distance. |  |\n| p11 | claim | The most important design rule is that a listing stores media IDs and an order, never URLs, so CDN, domain, format and deletion changes stay media-service operations. | source: mobile.de's Seller-API has clients pre-upload images, receive references and use those in the ad. | `emphasis`: The media asset's identity, independent of any URL. → The rule that follows for the listing. |\n\n### Architecture: The Upload-to-Edge Pipeline\n\n**Controlling idea** (`process`, id `pipeline`): Media arrives through three doors but passes one pipeline of nine stages, and which checks finish before upload returns, before the listing is searchable or after publication is a product decision.\n\n**Advances the thesis** (S2): Shows the single path every file takes and where publication waits for it.\n\n**Transition in:** `sequence`: The defined terms and the IDs-not-URLs rule. → The pipeline that produces assets and masters.\n\n**Order of paragraphs** (`chronological`): The doors, with the duty behind the third door's provenance record, then the stages a file passes, then a public lesson for the gate and the rule for the document path, which refine two of those stages, then the timing of checks, then where Barcelona fell. The provenance duty sits with the door generated media enters by, because it is about how an image was made, not about personal data. Timing before the stages would split checks the reader has not met; the lessons after the timing would reopen stages the reader has already left.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p12 | claim | Media arrives through three doors, and the pipeline behind them should be one. |  |  |\n| p13 | description | Mobile and web uploads go directly to object storage through short-lived pre-signed URLs, and server-side content addressing makes a duplicate upload cost bandwidth, not storage. | case: OLX (2026): users with several browser tabs each resumed the same large upload, duplicating objects; it used the Web Locks API so only one tab proceeds. | `sequence`: Three doors. → The first: direct uploads. |\n| p14 | description | Partner feeds either bundle media or have the portal pull it by URL, and a media change marker is what separates fetching changed images from fetching everything every time. | source: OpenImmo ships images zipped with the XML over FTP; Rightmove's Real Time Datafeed v1.4.1 (2023) accepts up to 999 media items and 20 MB per image, deletes an image when its URL is removed, and will not re-retrieve images with the same media update date. | `sequence`: Direct uploads. → The second door: partner feeds. |\n| p15 | description | Back-office and generated media, such as moderator edits, virtual staging and AI-generated videos, enter through the same API with their provenance recorded. |  | `sequence`: Feeds. → The third door. |\n| p16 | process | Behind the three doors every file passes the same nine stages, from quarantine to deletion, and each stage either blocks publication or does not. | figure: Figure 2: one pipeline behind three doors; quarantine, gate, re-encode and hash before anything else sees the file; buyers see only derivatives from a sanitized master.; table: Nine stages (quarantine, gate, sanitize, malware scan, hash, classify, decide, deliver, delete) with what happens, whether each blocks publication, and evidence (imgproxy's checks against image bombs; ClamAV as 'not a traditional anti-virus'; decision owned by trust-and-safety-architecture). | `elaboration`: The three doors, the third recording provenance. → The one pipeline behind them, stage by stage. |\n| p17 | evidence | A public lesson shapes the gate: a malformed file is a client error with an actionable message, with repair offered where the source is a third party. | case: Adevinta's InfoJobs team (2025): YAMS returned HTTP 500 for PDFs from a public employment service that were two PDFs joined together, classified as internal faults. | `elaboration`: The gate stage. → What a public case teaches about it. |\n| p17b | explanation | The document path needs rules of its own, because CVs and certificates are media assets that carry personal data: the malware scan of stage 4 and the short Documents retention class. | source: CVs, energy certificates and battery-health certificates, which mobile.de accepts as PDF, JPEG or PNG up to 10 MB. | `additional_support`: The gate's lesson: the failing files were PDFs. → The document path and its personal data. |\n| p23 | explanation | Generated media, the third door, has rules of its own too: generated and edited images bring marking and disclosure duties, so provenance is a media attribute the pipeline records and the listing can display. | source: EU AI Act Article 50, applying from 2 August 2026 under the regulation as adopted in 2024: providers mark synthetic images machine-readably; deployers disclose deep fakes of existing places or objects. | `additional_support`: The document path's rules of its own. → The third door's rules: provenance and the marking and disclosure duties of generated and edited images. |\n| p18 | recommendation (list) | Which checks block publication is a product decision, and the split the author uses puts cheap decisive checks with the upload, the full trust decision for high-risk segments before the listing is searchable, and quality and similarity work after publication. | scenario: Veldmark's publication target for Tradeyard: 90 seconds at p95, owned by publication-pipeline. | `elaboration`: The table's 'Blocks publication?' column, after the rules for the gate, documents and generated media. → When each check runs relative to publication. |\n| p19 | analysis | In Barcelona the lookup matched within minutes, but its result became a queue item instead of an input to the trust decision before the listing became searchable, so nothing held the listing. |  | `example`: The three timings. → Where the Barcelona failure falls among them. |\n\n### Privacy: What Photos Reveal\n\n**Controlling idea** (`explanation`, id `privacy`): Listing photos carry more personal data than sellers realize, so the pipeline strips metadata before the master is written, does not keep raw originals by default, purges the CDN on deletion and governs faces and plates by policy.\n\n**Advances the thesis** (S3): Shows why sanitization belongs at the single entry step and why deletion must reach the edge.\n\n**Transition in:** `cause_effect`: The sanitize stage. → Why it exists: the personal data in photos, with Tradeyard's case announced.\n\n**Order of paragraphs** (`grouping`): Two kinds of exposure in the order a file meets them: metadata at upload, then content in the image. Content before metadata would hide the cheapest, decisive fix behind a policy question. The provenance of generated images sits with the third pipeline door, since it is a disclosure duty rather than personal data; deletion and its CDN purge are explained in the lifecycle section, after immutable URLs, with a pointer from the metadata paragraph.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p20 | claim | The sanitize stage exists because a listing photo carries more personal data than its seller realizes and the platform is accountable for publishing it; Femke's bike listing, the Tradeyard finding announced in the scene, is the case. |  |  |\n| p21 | example | EXIF GPS metadata can publish a seller's home, so stripping must happen before the master is written, the raw original should not be kept without a documented purpose, and deleting the listing must purge its derivatives from the CDN too. | source: ExifTool's GPS tags: latitude, longitude, altitude, timestamp and camera direction.; scenario: Femke's €240 city bike on Tradeyard NL, Sunday 7 March 2027: six photos with her Rotterdam home's coordinates; derivatives stripped, but the image service kept the unmodified originals for the lifetime of the account.; figure: Figure 3: a sanitizer removes the hidden map pin before the clean master is stored. | `example`: Personal data in photos. → The first kind: metadata. |\n| p22 | description | Photo content shows faces, number plates, documents and occupied homes, so detection is a classifier but the blurring and consent policy belongs to the data protection lead. |  | `additional_support`: Metadata. → What the image itself shows. |\n\n### Derivatives, Formats and the CDN\n\n**Controlling idea** (`comparison`, id `derivatives`): Generating derivatives on demand behind a CDN, under three rules, costs less and serves modern formats better than storing pre-generated renditions.\n\n**Advances the thesis** (S4): Removes the stored-renditions cause of the bill.\n\n**Transition in:** `sequence`: The pipeline and what each file carries; Julien's two documents. → The bill's half, starting with stored renditions.\n\n**Order of paragraphs** (`comparison`): The decision, the stored option, the on-demand option with its public evidence, the formats that tip the balance, the rules that make the winner safe, and the floors outbound channels set. The rules before the comparison would govern an option not yet chosen. Formats follow the on-demand option because they are a reason to prefer it, which needs the option stated first; the outbound floors come last because they constrain the bounded variant set the rules define.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p25 | claim | Hearthly's bill comes next, and whether to store renditions or generate them decides a large part of it. |  |  |\n| p26 | description | Pre-generated renditions are simple to serve, but their cost grows with every image ever stored and they lock in the formats of the day. |  | `sequence`: Two options. → The first: stored renditions. |\n| p27 | evidence | On-demand derivatives are generated by an image service at first request and cached by the CDN, and OLX's 2020 Dali is the public reference for this design. | case: OLX (2020): CDN served 'around 80%' of traffic from cache; the rest, 'millions of requests a day' and about 30,000 per second at peak, reached an on-demand processor; a thumbor-based processor needing '~6000 pods' was replaced by Dali, in Rust on OpenCV then libvips, at about twice thumbor's load per instance; current system not public. | `contrast`: Stored renditions. → Generation on request. |\n| p28 | cause_effect | Modern formats make on-demand generation more valuable, because an image service can pick AVIF, WebP or JPEG per request while a pre-generated archive keeps serving its old JPEGs. | statistic: As of October 2026, AVIF supported by about 96% and WebP by about 97% of browsers in use (caniuse, accessed 2026-10-19).; figure: Figure 4: shelves of nine stored renditions versus one master feeding an image service and cache. | `additional_support`: On-demand generation. → Formats as a further reason for it. |\n| p29 | recommendation (list) | Three rules keep on-demand generation affordable and safe: bound the variant space, sign transformation URLs and make derivative URLs immutable. |  | `elaboration`: On-demand generation as the better option. → The conditions that keep it affordable and safe. |\n| p30 | explanation | Outbound channels set floors on derivatives, so whether a listing has an image that meets each floor is a derived media attribute. | source: Google Merchant Center will enforce a minimum of 500 × 500 pixels for product images from 31 January 2027. | `additional_support`: The bounded set of derivatives the platform serves. → Floors set by channels outside the platform. |\n\n### Storage Tiers and the Media Lifecycle\n\n**Controlling idea** (`recommendation`, id `lifecycle`): Because cloud storage classes have minimum durations, the master's lifecycle must follow the listing's state through explicit retention classes ending in deletion with a CDN purge, with hash retention decided separately.\n\n**Advances the thesis** (S4, S3): Removes the never-deleted cause of the bill and makes deletion, including the CDN purge, defensible.\n\n**Transition in:** `sequence`: Derivatives, which can always be regenerated. → The masters themselves: where they live and when they go.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The access pattern and the price lists, the consequence of minimum durations, the retention classes that answer it, deletion at the end of every class, and the hash column that needs its own reasoning. The classes before the price lists would set retention periods without the minimum durations that constrain them; deletion before the classes would have no class to end; the hash column contrasts with deletion and depends on the classes table.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p31 | evidence | Derivatives can be regenerated but masters cannot, and most masters are never viewed again after their listing ends, which cloud object stores price with colder classes that carry minimum durations and retrieval fees. | source: Google Cloud Storage: Standard, Nearline, Coldline, Archive with minimums of none, 30, 90 and 365 days and Autoclass; Amazon S3: Standard-IA 30 days, Glacier Instant Retrieval 90 days, Intelligent-Tiering moves objects after 30 and 90 days without access. |  |\n| p32 | analysis | Minimum durations mean the lifecycle policy must follow the listing's lifecycle, which only the platform knows, rather than access patterns alone. | reasoning: An image deleted from Archive after two months is billed for twelve.; figure: Figure 5: a media asset's lifecycle follows its listing (dormant in warm storage, archived to cold, deletion with CDN purge, hashes under their own retention). | `cause_effect`: Minimum durations. → Why the listing's state must drive the policy. |\n| p33 | recommendation | Retention classes make the lifecycle explicit and defensible, each with its own master and hash retention and rationale. | table: Five classes: standard listing media, removed for fraud, erasure requested, documents, professional archives, with master retention, hash retention and rationale. | `problem_solution`: A policy that must follow the listing. → Retention classes as the form it takes. |\n| p24 | explanation | Every retention class ends in deletion, which must purge CDN caches as well as the master, or immutable derivative URLs keep serving, which is Ghost Inventory and, after an erasure request, a privacy failure. |  | `elaboration`: The retention classes. → What deletion at the end of each class must include. |\n| p34 | analysis | Hash retention is where privacy and fraud prevention meet: a removed scam's hashes are valuable for years, but keeping them needs a documented purpose and legal basis. |  | `contrast`: Deletion of masters and derivatives. → Hashes, which may be kept after the media is deleted. |\n\n### Perceptual Hashing: Finding the Same Photo Twice\n\n**Controlling idea** (`explanation`, id `hashing`): Layered hashing with an allowlist, in an index shared across brands that reports matches and leaves the decision to the consumer, serves both duplicate and stolen-photo problems.\n\n**Advances the thesis** (S5): Shows how matches are found and why the same match means different things.\n\n**Transition in:** `contrast`: The bill's half: derivatives, storage and retention, ending with hashes kept on block lists. → The ring's half: the Barcelona review turned on a hash match.\n\n**Order of paragraphs** (`problem_solution`): The two problems with opposite policies, the layered design that serves both, the allowlist without which it is switched off, and the case for sharing the index. Sharing before the layers would ask the reader to share something not yet described. The allowlist before the layers would exempt images from a detector the reader has not yet seen.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p35 | comparison (list) | The Barcelona review turned on a hash match, and duplicate and stolen photos are two problems with opposite policies: the same seller reusing photos is at worst spam, while different sellers using the same photos is a fraud signal in rentals and a normal event in multi-agency sales. |  |  |\n| p36 | process (list) | Public evidence supports four layers of matching, behind an allowlist of images that may legitimately repeat: exact SHA-256, perceptual hashes such as PDQ, embedding similarity for heavily edited copies, and human review for the gray zone. | source: PDQ documentation: discard hashes with quality 49 or less; start with Hamming distance 31 or less; extra hashes for rotations and flips, but 'does not guarantee exact rotational invariance'.; source: OLX posts on duplicate detection with perceptual hashes on Elasticsearch and a triplet-loss network against augmented images, known through search summaries only.; figure: Figure 6: layered duplicate detection; the same match leads to different actions by seller and segment. | `problem_solution`: Two problems with opposite policies. → One layered design that serves both. |\n| p37 | claim | The allowlist is not optional, because manufacturer, developer and catalog images legitimately appear on thousands of listings and would flood moderators until the detector is switched off. |  | `elaboration`: The allowlist named in the lead-in to the layers and shown in Figure 6. → Why it is required. |\n| p38 | claim | The hash index is the clearest case for sharing across brands, because a photo copied between brands is invisible to a per-brand index and a PDQ hash is only a few dozen bytes. | scenario: A photo moved from Hearthly France to Hearthly.es, or from Motorvane to Tradeyard Poland, is invisible to a per-brand index; a PDQ hash is a few dozen bytes; decisions stay with each brand's trust rules. | `additional_support`: Layers and allowlist within one index. → The scope of that index and who decides on a match. |\n| p38b | example | The Lyon apartment shows that the same match that blocks a scam supports a legitimate merge, so the hashing service reports matches and leaves the decision to the consumer. | scenario: The Lyon apartment (May 2027): three agencies, two using the same photographer's images; hash matches were among the strongest signals entity-resolution used to cluster them into one property. | `contrast`: A shared index that catches copied photos. → A case where a match is legitimate. |\n\n### Understanding Images: Quality, Order, Text and Content\n\n**Controlling idea** (`explanation`, id `understanding`): Beyond fraud, image models read each photo to score quality, order galleries, read text and fill attributes, so a `MediaReady` event must reach every model that depends on images.\n\n**Advances the thesis** (S1): Shows the downstream consumers the media contract must serve.\n\n**Transition in:** `contrast`: Hashing, which compares photos with each other to catch fraud. → Models that read each photo for quality, order, text and attributes.\n\n**Order of paragraphs** (`grouping`): Four uses from what the buyer sees (quality, cover and order) to what systems read (text, attributes and valuation), ending with the event that keeps them current. Putting the content and valuation paragraph earlier would state the need for a MediaReady event before the reader has seen how many consumers depend on images.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p39 | claim | Hashing compares photos with each other, while image models read each photo; beyond fraud, they score quality, order galleries, read text in photos and fill attributes, and each changes how a listing performs. |  |  |\n| p40 | evidence | Quality scores predict whether a photo is sharp, well exposed and appealing, and feed ranking, seller nudges and cover selection. | source: Google's NIMA (2017) predicts a distribution of human ratings; OLX (2020) gave sellers recommendations on photo count, blur and darkness. | `sequence`: Four uses. → The first: quality. |\n| p41 | evidence | Ordering and cover selection decide what a buyer sees first, as a suggestion to professional sellers and a default for private ones. | statistic: Autotrader UK FY2026 results: Co-Driver made 700,000 'smart image re-orders' and generated 1.9 million descriptions. | `sequence`: Quality. → Ordering. |\n| p42 | evidence | Text in images is both a moderation signal and a search signal, and phone numbers written on photos are a classic first step to routing buyers off-platform. | statistic: Adevinta (2023): OCR service detecting insults, URLs, e-mails and phone numbers; from more than 100 million to 330 million requests a month; benchmark accuracy 0.4 to 0.8 after PaddleOCR; about twelve times cheaper than an external API. | `sequence`: Ordering. → Text in images. |\n| p43 | cause_effect | Classifiers detect prohibited items, predict categories and feed valuations, so a `MediaReady` event must reach the models that depend on images and trigger recomputation. | source: Adevinta (2023): shared GPU serving for a text detector, car classifier, background remover and image classifier; mobile.de recalculates its price rating 'including the image data' when images arrive after the ad. | `sequence`: Text in images. → Content and attribute signals. |\n\n### Video, 3D Tours and Floor Plans\n\n**Controlling idea** (`explanation`, id `rich-media`): Video, 3D tours and floor plans behave differently from photos but fit one media model with several processing profiles.\n\n**Advances the thesis** (S1): Extends the one asset model to richer media instead of separate systems.\n\n**Transition in:** `contrast`: Models that read photos. → Media types that are not photos.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p44 | description (list) | Richer media, mostly in real estate and automotive, behaves differently from photos: video needs transcoding and more storage, tours are external embeds, and floor plans carry data. | source: Meta catalog accepts up to 20 videos per item; CoStar's FY2025 10-K records the Matterport acquisition completed 28 February 2025; Zillow's FY2025 10-K describes Showcase with floor plans and 3D touring; mobile.de lists 'Auto Panorama' images; Zillow's ZInD (presented 2021) holds 67,448 panoramas and 2,737 floor plans of 1,575 homes for research. An OLX news item (February 2026) describes AI-powered listing videos; only its subject is known. |  |\n| p45 | recommendation | The architectural rule for all three is one media model with several processing profiles, because a separate system per type multiplies deletion, moderation and privacy work. |  | `conclusion_summary`: Three media types with different needs. → The single rule that covers them. |\n\n### In Practice: Public Examples and Veldmark's Plan\n\n**Controlling idea** (`evidence`, id `in-practice`): Public engineering records describe the same architecture, and Veldmark's plan shows it cutting Hearthly's media run cost from €6.2 million to €3.6 million while closing the Barcelona gap and Tradeyard's privacy finding.\n\n**Advances the thesis** (S1, S4, S5, S3): Tests the design against real records and prices it in the worked example.\n\n**Transition in:** `example`: The design built across the previous sections. → Whether the public record confirms it and what it does for Hearthly.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The public record first, labeled where it is inference; then Veldmark's decision, its contract, Hearthly's four changes, their cost effect, the honest trade in the table, and the privacy finding the plan also closes. Numbers come after the changes that produce them. The public record comes before Veldmark's plan so the plan reads as one application of a documented pattern, not as the only evidence for it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p46 | evidence | Public evidence on listing media pipelines is uneven but consistent: Adevinta, OLX, Rightmove and mobile.de together describe IDs not URLs, sanitized masters, on-demand derivatives, change-aware feed fetching and models downstream of a media-ready event. | quotation: Adevinta (2024): YAMS, a service 'all of the marketplaces in Adevinta rely on', delivering 'more than 800 million images, documents and videos daily'; storage above 3 petabytes known only through a search summary; whether YAMS still serves the former marketplaces after the 2025 break-up is not public.; source: OLX 2020 (CDN plus on-demand processor), Rightmove (pull by URL with change detection), mobile.de (pre-uploaded references, images as valuation inputs); followed by an INFERENCE, NOT DOCUMENTED callout that no company has published its tiering or retention policy. |  |\n| p47 | context | Veldmark's forum approved a group media decision in November 2027, with Hearthly as its first large adopter; all figures are fictional. |  | `contrast`: What public companies document. → Veldmark's own plan, labeled fictional. |\n| p48 | recommendation | Veldmark shares one media contract at once and moves infrastructure in stages, with the group perceptual-hash index first because brands send hashes, not images. | scenario: One media API, asset model with retention classes, derivative URL scheme and `MediaReady` event; platform on AWS; Hearthly runs the same code on Google Cloud Storage through 2028; group hash index live for all brands in Q1 2028. | `elaboration`: The November 2027 decision. → What it shares first and what it stages. |\n| p49 | example (list) | Hearthly makes four changes: content addressing with change-aware fetching, no stored renditions, lifecycle by listing state, and a hash check before rentals become searchable, with seller context. | scenario: About 680 million byte-identical objects collapsed; media change date required from the 2028 feed contract; image service with AVIF or WebP and JPEG fallback in six widths (−38% bytes per gallery view in a September 2027 test on Hearthly France); Coldline after 90 days ended, Archive after 24 months; rentals on Hearthly.es and Hearthly France with a PDQ match to a different seller or block-listed hash held for the trust decision; each match carries the seller relationship. | `elaboration`: The shared contract. → What Hearthly changes under it. |\n| p50 | evidence | Together the changes are planned to cut Hearthly's media run cost from €6.2 million to €3.6 million by the end of 2028. | table: Stored data about 5.4 PB to about 2.3 PB; storage €2.6M to €1.1M; CDN €2.8M to €1.9M; processing €0.8M to €0.6M; total €6.2M to €3.6M, about €2.6M a year toward Common Ground's €38M run-cost target. | `cause_effect`: The four changes. → Their cost effect. |\n| p51 | analysis | The processing line falls least because on-demand generation costs compute, which is the honest trade for no longer storing nine renditions forever. |  | `elaboration`: The table's processing line. → Why it falls least. |\n| p52 | description | The plan also closes the Tradeyard privacy gap that Femke's photos exposed: from November 2027 no brand stores raw originals with metadata, and Tradeyard's originals are being rewritten as sanitized masters into 2028. | scenario: A backfill over about 2.9 billion Tradeyard images that runs into 2028. | `additional_support`: Cost and trust effects at Hearthly. → The privacy effect at Tradeyard. |\n\n### Trade-offs\n\n**Controlling idea** (`comparison`, id `trade-offs`): Each media decision has an option that is right under stated conditions, and at Veldmark the hash-index scope is qualified by the Keybridge neutrality decision.\n\n**Advances the thesis** (S4, S5): Shows the recommended choices as decisions with conditions, including the case against sharing.\n\n**Transition in:** `contrast`: Veldmark's choices. → The alternatives and when they are right.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p53 | comparison | Each choice in this chapter has an alternative that is right under other conditions, and seven of them are set side by side. | table: Derivatives, original files, feed media, perceptual check timing, hash index scope, media service ownership and rich media, each with two options and when to choose each. |  |\n| p54 | explanation | At Veldmark the hash-index scope row needs one qualification: hashes of Keybridge-handled media stay out of the group index because of the March 2027 neutrality decision. | scenario: Keybridge publishes agency listings to Hearthly's competitors; the March 2027 decision bars Keybridge agency data from Hearthly's ranking or sales targeting; listings Keybridge sends to Hearthly are hashed by Hearthly on arrival. | `elaboration`: The hash-index scope row. → How it applies at Veldmark. |\n\n### Vertical Differences\n\n**Controlling idea** (`comparison`, id `verticals`): The pipeline is the same across verticals, but media sources, fraud uses, privacy risks, models and legitimate duplicates differ, and jobs adds documents.\n\n**Advances the thesis** (S5, S1): Shows that one media model must cover every vertical's media, including documents.\n\n**Transition in:** `contrast`: Choices made once for the group. → What differs by vertical.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p55 | comparison | The pipeline is the same in every vertical, but where media comes from, how it is misused and which duplicates are legitimate differ. | table: General classifieds, real estate, automotive, jobs and recommerce compared on media per listing, main source, main fraud use, privacy risk, image models and legitimate duplicates. |  |\n| p56 | analysis | The jobs column is the reminder that a shared media service must handle documents, not only images. |  | `example`: The vertical table. → The column with the widest consequence. |\n\n### Failure Modes\n\n**Controlling idea** (`counterargument`, id `failure-modes`): Nine common mistakes undo the design, each the reverse of one of its rules.\n\n**Advances the thesis** (S1, S3, S4, S5): Shows what happens when each rule is skipped.\n\n**Transition in:** `contrast`: The design and its conditions. → How it fails in practice.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p57 | counterargument (list) | Nine failure modes, each the reverse of one of the chapter's rules: URLs in listings, storing everything forever, raw originals with metadata, matches that decide nothing, no allowlist, deletion without purge, unbounded transformations, malformed files as server errors, and models that never hear about images. |  |  |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `ca-view`): Media is easy to share and expensive to leave unshared, so the forum shares the contract first, sets retention as owned policy, watches five numbers, plans for generated media and keeps neutrality boundaries in the media layer.\n\n**Advances the thesis** (S1, S3, S5): Turns the design into group decisions with owners and measures.\n\n**Transition in:** `cause_effect`: The failure modes. → The decisions that prevent them.\n\n**Order of paragraphs** (`prerequisite_order`): The principle, then the decision that makes all later ones cheaper (the contract), then policy and owners, then the measures that watch both, then the two forward-looking boundaries. Measures before the policies would watch rules not yet set.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p58 | claim | Several of the failures trace to decisions nobody took at group level, and media is one of the easiest capabilities to share in a marketplace group and one of the most expensive to leave unshared. |  |  |\n| p59 | recommendation | Share the contract first and the infrastructure second, with the hash index and classifiers shared from day one because they need no storage. |  | `elaboration`: Media as easy to share. → What to share first. |\n| p60 | recommendation | Retention classes are policy with named owners, signed off by the data protection lead and by trust and safety, implemented as lifecycle rules and audited. | scenario: Lucía Ortega (data protection) and Aisha Rahman (trust and safety) at Veldmark. | `sequence`: The shared contract. → The policy that governs what it stores. |\n| p61 | recommendation | Five numbers show whether the design holds, ending with the share of unrelated-seller matches decided before a listing is contactable, which is what the Barcelona review was about. |  | `sequence`: Policies and owners. → The measures that watch them. |\n| p62 | recommendation | The pipeline must plan for generated media by recording provenance per asset, carrying it to listing pages and feeds, and keeping the original photograph where a buyer needs it. |  | `sequence`: Today's measures. → Media that is already arriving. |\n| p63 | recommendation | Where a group has committed to separation, as Veldmark has for Keybridge, the neutrality boundary must be enforced in the hash index and classifiers, not only in ranking. |  | `sequence`: What to share. → Where sharing must stop. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Ten questions turn the chapter into a design review of a platform's media pipeline.\n\n**Advances the thesis** (S1, S2, S3, S4, S5): Gives the reader the design as questions for their own platform.\n\n**Transition in:** `cause_effect`: The Chief Architect's decisions. → Questions a reader can take into a review.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p64 | recommendation (list) | Ten review questions test IDs versus URLs, metadata stripping, stored bytes per live listing, derivative formats, feed change detection, hash-check timing and scope, retention classes, CDN reach after removal, image-dependent models and provenance. |  |  |\n\n## Conclusion: From Pictures to Place\n\n**Synthesis:** Hearthly's bill and the Barcelona ring describe one failure: media handled as files behind a CDN, with copies nobody recognizes, renditions nobody needs and matches nobody has to act on. One contract answers both: on the way in, SHA-256 keys remove the copies and PDQ hashes fill the index that catches stolen photos; after it, on-demand derivatives and a lifecycle that follows the listing remove the stored renditions and the masters nobody deletes.\n\n**So what:** A group can share the contract and the hash index first, at little cost, and get both the lower bill and the earlier fraud stop without waiting for a storage migration.\n\n**Callback:** Julien's two documents and Ingrid's question in the scene: one pipeline that stores less, serves faster, protects privacy and catches stolen photos before buyers see them. The reader can now see that the two documents describe one design failure, and that the answer to the question is one contract rather than four projects.\n\n**Takeaway** (`course_of_action`): Share the media contract and the hash index first, and let storage follow cloud decisions at its own pace.\n\n**Hand-off** to [Where Is It? Location, Geocoding and Privacy](location-and-geo.html): `similarity`: The media pipeline's stripping of GPS coordinates from photos, one way a listing can reveal where a seller lives. → The listing's own location, where the same privacy risk sits beside search, maps and licensing: a subsystem of addresses, geocoders, places and a precision policy.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p65 | synthesis | Julien's two documents describe one failure, media handled as files behind a CDN, and one contract answers both: on the way in SHA-256 keys remove the copies and PDQ hashes fill the index that catches stolen photos, after it on-demand derivatives and listing-state lifecycle remove stored renditions and undeleted masters, so sharing the contract and the index first is cheap, cuts the bill and stops fraud earlier without waiting for storage to move. |  |  |\n| p66 | transition | Stripping GPS from photos closes one way a listing reveals where a seller lives; the listing's own location is the other, where the same privacy risk sits beside search, maps and licensing, and the next chapter takes it up. |  | `similarity`: GPS stripped from photos. → The listing's own location. |\n\n## Non-goals\n\n- Moderation policy, queues and enforcement. See [Trust and Safety as a Platform](trust-and-safety-architecture.html).\n- Fraud typology and the decision side of the Barcelona ring. See [Scams, Fakes and Account Takeovers: Fraud Prevention for Listings](fraud-prevention.html).\n- Duplicate clustering and canonical entities. See [One Property, Three Listings: Duplicates and Entity Resolution](entity-resolution.html).\n- Location precision and address privacy beyond photo metadata. See [Where Is It? Location, Geocoding and Privacy](location-and-geo.html).\n- Publication timing budgets. See [From Submitted to Searchable: The Publication Pipeline](publication-pipeline.html).\n- Model serving. See [Models in Production: ML Platforms and Use Cases](ml-platform.html).\n- Generative listing creation. See [AI Across the Listing Lifecycle](ai-in-listing-systems.html).\n- Platform-wide retention machinery. See [System of Record and Read Models: Listing Data Management](listing-data-management.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- OLX's duplicate-detection and triplet-loss posts and Adevinta's image-format post (reported YAMS storage above 3 PB) could not be fetched; verify in a browser before quoting specifics. (Carried over from spec.md.)\n- Whether virtual staging falls under the AI Act Article 50(4) deployer disclosure duty needs legal confirmation; the chapter states only the provenance requirement. (Carried over from spec.md.)\n- Whether YAMS still serves Adevinta's former marketplaces after the 2025-2026 break-up is not public. (Carried over from spec.md.)\n- Round-5 finding on the second 38% (gallery bytes vs duplicate originals): both are ledger figures; the prose now calls the match a coincidence. If readers still stop, the author decides whether to waive or change the ledger. (2026-11-13)\n\n## Decision log\n\n- **2026-10-19** — Built the chapter around one pipeline with three entry doors, rather than separate chapters' worth of upload, feed and moderation detail, so the media contract (IDs, masters, events) is the through-line.\n- **2026-10-19** — Recommended sanitized masters over keeping raw originals by default, with an explicit exception path; chose Femke's EXIF case to make the privacy point concrete.\n- **2026-10-19** — Paired the cost story (Hearthly's bill) with the trust story (Barcelona) in one scene, because the same design changes (content addressing, shared hash index, check timing) address both.\n- **2026-10-19** — Kept the group hash index as the first ** — Draft check round 1 (escalate, spec faults) led to spec changes made under the pipeline brief, each re-validated: (1) the hashing and understanding sections' position was unclear to both flow readers; the order is kept because the journal spec's AC-2 expected answer fixes it, and the declared principle is now the two documents (frame and privacy, then the bill's half, then the ring's half), with derivatives and hashing each opening on their document; (2) deletion with CDN purge (p24) moved from Privacy to the lifecycle section, after immutable URLs are explained, since both readers found the deletion argument split and forward-referenced; (3) p17 split into p17 (gate lesson) and p17b (document path), since the old idea held two lessons; (4) the privacy section now announces Tradeyard's case, so Femke is not an unannounced third incident; (5) the conclusion's synthesis now says SHA-256 removes the copies and PDQ fills the index, instead of implying that content addressing produces the perceptual hashes. Rejected: Reordering sections into stage order (privacy, hashing, understanding, derivatives, lifecycle), which both flow readers suggested: it would contradict the journal spec's AC-2 expected order, which this pass may not change.\n- **2026-11-12** — Draft check round 2 (escalate on one spec fault): p38 held two ideas in the spec (share the index across brands; the consumer decides because the same match also supports a merge), so it is split into p38 (sharing) and p38b (the Lyon case and who decides); the prose paragraph is split at 'The Lyon apartment shows the other side'. Draft fixes in the same pass: lifecycle opening now moves from derivatives to masters; Questions lead-in states the cause; p19 reworded ('fell between the first two timings'); Tradeyard's 90-second target framed as an example of the budget; Femke's case announced in p20; the allowlist named in the lead-in of the layers list; the 2.9 billion Tradeyard archive framed in p52; 'masters' glossed in p03; Hearthly's French platform named in p07.\n- **2026-11-12** — Escalation after round 3 resolved under the author's delegation ('auto resolve all ESCALATE topics'): (a) Understanding Images keeps its position (the journal spec's AC-2 order is unchanged) but is no longer announced as part of the ring's half; the roadmap (p04), the section's opener (p39), its transition and the flow grouping now present it as the use of images beyond fraud. (b) The EU AI Act provenance paragraph (p23) moved from Privacy to the pipeline section, after the third door (p15) whose provenance record it explains; transitions of p23 and p16 and both sections' flow rationales updated; the published wording is kept, with a new opening clause. (c) Femke's case is seeded in the scene (p05) as a third finding from Tradeyard (ledger: Femke's photos carried home GPS; Tradeyard's stored originals were not stripped), and p20 refers back to it. (d) Tradeyard's 90 seconds is now stated as its target, as the ledger has it (target 90 s p95 by end of 2028), and the second 38% is labelled 'a separate measure from the 38% of duplicate originals'; both figures kept. (e) The OLX February 2026 news item is kept and now says what it shows within what is known (its subject): video reaching general classifieds as generated media. (f) The synthesis (conclusion and p65) now credits SHA-256 and PDQ for the copies and the index, and on-demand derivatives and lifecycle for the renditions and undeleted masters. (g) AC-5: p21 now says that deleting the listing must also purge its derivatives from the CDN, pointing to the lifecycle section. p17b's opening now ties the document path to the failing PDFs; p19 now names the pre-searchable trust decision. length.max_words raised from 7,394 to 7,600 (+2.8%) for these additions.\n- **2026-11-12** — Earlier open items accepted under the author's delegation, 2026-11-12: modalities left empty (no modality file exists); the thesis-rubric fix folding S6 into S1 and rewording chapter's boundary: 'before the listing is searchable, and so contactable by buyers' (round-5 flow finding, both readers). fixed under the author's delegation (fix-only pass).\n- **2026-11-13** — Minor findings also fixed: EXIF glossed in the stage table; YAMS glossed on first use with a pointer to In Practice. fixed under the author's delegation (fix-only pass).\n- **2026-11-13** — length.max_words raised from 7600 to 7800 (under 10%) for the added glosses and pointers. fixed under the author's delegation (fix-only pass).\n\n## Sources\n\n- **Internal**\n  - _journals/listing-systems-architecture/journal-spec.json — Intent outcome, acceptance criteria AC-1 to AC-3, thesis, role and the hand-off relationship of location-and-geo.\n  - attribute-schemas, entity-resolution, trust-and-safety-architecture, publication-pipeline, location-and-geo — Neighbouring chapters and the hand-off.\n  - _research/brief-listing-data-ingestion.md (Part 9), brief-platform-data-ml.md (3.2, 10.3), brief-trust-safety-regulation.md (3.4, 5.10), brief-olx.md (4.7), brief-real-estate-portals.md (B.2, B.3), brief-automotive.md (A.2, A.3), scenario-ledger.md — Public evidence and the Veldmark figures.\n- **External**\n  - OLX Engineering, Dali (2020) and Web Locks (2026) — On-demand image processing; upload duplication.\n  - Adevinta Tech Blog (2023-2025) — YAMS, OCR service, shared GPU serving, malformed-PDF lesson.\n  - Rightmove RTDF v1.4.1 (2023); mobile.de Seller-API (n.d.) — Feed media contracts and images as valuation input.\n  - Meta PDQ documentation and 2019 release; imgproxy; thumbor; ClamAV; ExifTool — Hashing thresholds, image-service safeguards, scanning scope, metadata contents.\n  - Google Cloud Storage and Amazon S3 storage-class documentation; caniuse AVIF/WebP; Google Merchant image minimum — Storage classes and minimum durations; format support; channel floors.\n  - EU AI Act Article 50 (2024); Autotrader FY26 results; CoStar and Zillow FY2025 10-Ks; Zillow ZInD; Google NIMA
