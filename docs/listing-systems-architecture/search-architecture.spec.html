<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, acceptance criteria AC-1 to AC-3, the thesis and the role are copied unchanged from the search-architecture entry in journal-spec.json. Units added by this conversion: a roadmap paragraph in the introduction (p04), a paragraph introducing the Trade-offs table, and a synthesis paragraph before the hand-off.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Why listing search behaves like a high-write operational store: short-lived documents, mostly text-free browse queries, and writes dominated by price, status, bump and counter changes.\n- **Know:** The listing search document and its promotion rule for typed versus flattened attributes, the three questions that decide index topology, the write path (external versioning, update-storm lanes, separate removal latency), the read path (facets on their own path, caching, latency budgets), alias reindexing and capacity planning for evening peaks.\n- **Believe:** An index that cannot be rebuilt from the event stream and system of record has quietly become the database.\n- **Believe:** A stable search contract in front of the engine matters more than the choice of engine.\n- **Be able to:** Design a listing search document and an indexing path with a listing-owned version, a removal lane and an index share of the publication budget.\n- **Be able to:** Plan a zero-downtime reindex with a live stream and a rebuild drill, and judge an engine choice by workload fit and migration cost rather than benchmarks.\n\n**Audience:** Chief and principal architects, search platform leads and engineering directors of classifieds, real-estate and automotive marketplaces, including those running several engines after acquisitions.\n\n**Already knows:**\n\n- What an API, a database, an event stream, a search engine and Kubernetes are; Elasticsearch, Solr and Kafka in general; percentiles such as p95 and p99.\n- From earlier chapters: the listing aggregate and its events (listing-aggregate); categories and the attribute dictionary (categories-and-taxonomies, attribute-schemas); normalization and entity resolution; the publication pipeline, its 90-second target and removal propagation (publication-pipeline); Veldmark, its brands, cast and Common Ground (meet-veldmark); the failure-pattern names (where-listing-systems-go-wrong); Femke's bike; the Part IV claim that every discovery surface is a read model (part-4).\n\n**Does not yet know:**\n\n- Search document, index alias, browse query, facet, insertion and removal latency, update storm, reindexing, search contract, rebuild drill, promotion rule.\n- Refresh and soft-commit semantics, searcher cache warming, external versioning, mapping limits, nested and flattened fields, Vespa attribute fields.\n- Read models and CQRS in general (listing-data-management) and the event contract (event-driven-listings), which are named here and defined in their chapters.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a peak-hour brown-out and a proposal to pick a new engine by benchmark, the reader names the causes and what to decide before the engine. *Probe:* Your search p99 jumps from 400 ms to 7 seconds for 48 minutes on a Sunday evening while a weekly full reindex runs into the live collection and a TV campaign lifts traffic. Afterwards, the team proposes choosing a new engine by benchmark. Using only this chapter: why did it happen, and what do you decide first? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-4 | Given a marketplace's attribute keys, the reader decides which become typed index fields, who decides, and why the rest are not mapped one by one. *Probe:* Your marketplace has 3,900 attribute keys, most used on a tiny share of listings, and a team wants each mapped as its own typed field. Using only this chapter: what do you do instead, who decides which keys get typed fields, and why? | `custom` | cold_reader | minor |\n| AC-5 | Given a sold listing that reappears in results, the reader names the write-path causes and the controls that prevent it. *Probe:* A listing marked sold reappears in search results minutes later, and a related sold listing waited behind a dealer's bulk price run before disappearing. Using only this chapter: what went wrong in the indexing path, and what do you change? | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** How do you build search for millions of short-lived listings with rich filters?\n\n> **Claim:** Listing search should be built as a read model that can be thrown away: every document comes from the listing event stream and the system of record under a listing-owned version, a quarterly drill proves the index can be rebuilt, only attributes the schema marks as filter, facet or sort keys become typed fields, removals take a priority lane with their own objective (10 seconds p95 at Veldmark against 15 seconds for insertion), counters stay off the document, facets run on their own path, reindexing goes through aliases away from the peak, and product applications call a platform-owned search contract, so the engine behind it becomes a replaceable adapter.\n\n**Disputed by:** The common view that engine choice is the main search decision, settled by benchmarks, and that the index may hold whatever fields teams find convenient, be reindexed in place when the office is quiet and be called directly by product applications, with removal treated as one more update.\n\n**So what:** A Chief Architect who accepts this lets the platform team own engine, clusters, indexer framework, contract and capacity while marketplaces own schemas, analyzers and ranking; runs two engines during a migration behind one API; and watches freshness percentiles per operation, index fields without a source, cache hit ratios at peak and cost per thousand searches, revisiting the engine on a fixed cycle with shadow traffic.\n\n**How and why:** Listing search is a high-write store whose queries are mostly filters. Tradeyard NL's brown-out on 17 January 2027 (p99 from about 400 ms to about 7 seconds for 48 minutes, about 9% of searches failed) came from a Sunday-evening reindex committing into the live collection and clearing the caches browse traffic needed, at 30% above the usual peak; 6.4 million of about 9 million daily document writes were view counters that passed through no event stream; and only about 610 of Tradeyard's 3,900 attribute keys could become typed fields without exploding the mapping. Veldmark's 14 September 2027 decision therefore moves every application to Listing Search API v1 before any engine changes, so Motorvane's 2029 engine review becomes an adapter change.\n\n**Supporting claims**\n\n- **S1** — Listing search is a high-write operational store whose queries are mostly filters: documents live for days, most queries carry no text, most writes change price, status, bump time or counters, and it is judged on how fast a new listing appears and a sold one disappears, so it must be designed for browse traffic, facets and update storms rather than for text relevance alone.\n- **S2** — The index is a read model that can be thrown away: every document is built only from the listing event stream, the system of record and reference read models under a listing-owned version, and a quarterly rebuild drill proves the index can be rebuilt, because an index field with no source turns the index into the database.\n- **S3** — Only attributes the schema marks as filter, facet or sort keys become typed index fields; the long tail goes into one flattened field, and the attribute dictionary, not an engineer, decides the promotion.\n- **S4** — The write path separates writes by kind: removals take a priority lane with their own objective (10 seconds p95 at Veldmark against 15 seconds for insertion), high-churn counters stay off the document, updates are coalesced and bulk feeds are rate-limited, and freshness is measured per operation.\n- **S5** — The read path and operations protect the evening peak: facets run on their own path, every cache has a known invalidation, one latency budget is divided between the steps, topology and shards are sized per partition, reindexing goes through aliases away from the peak, and capacity is planned with the marketing calendar.\n- **S6** — Product applications call a platform-owned search contract in marketplace terms, so the engine behind it becomes a replaceable adapter judged by workload fit, team and cloud rather than by benchmarks, and two engines can run side by side during a migration.\n\n## Role in the part\n\nDefines the busiest discovery read model, its document, indexing path, removal lane and contract, on which every later Part IV surface runs. Supports P4-1 of part `part-4`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `large_to_small` in architecture to capacity: the whole layer, then its document, topology, write path, read path, reindexing and capacity; `grouping` in trade-offs, vertical differences, failure modes, the Chief Architect's view and questions: closing judgements on a design already shown)\n\nThe scene poses Ingrid's three questions; the concepts supply the vocabulary; the architecture fixes the principle (a rebuildable read model behind a contract) that every later section applies. The document comes before topology because indices hold documents; the write path follows because versions and lanes act on documents; the read path follows because caches and facets depend on refresh behaviour; reindexing needs versioned writes and aliases; capacity needs the request multiplier the read path explains. Engine choice comes last among the design sections because its criteria (partial updates, facet maturity, schema change) refer to all of them, and Veldmark's decision then applies the criteria. Putting the engine first would invite the benchmark comparison the thesis rejects before the reader knows what the engine must support.\n\n## Introduction\n\n**Hook** (`direct_statement`): A listing search engine looks like web search and behaves like a high-write operational store: most of its queries contain no text, and it is judged on how fast a new listing appears and how fast a sold one disappears.\n\n**Bridge:** Part III ended with a listing the publication pipeline declares searchable within a freshness target, and the Part IV introduction claimed that every discovery surface is a read model of the listing stream. → The search index is the first and busiest of those read models, so how it is built decides whether the rest of Part IV can work.\n\n**Thesis statement** (KEY POINTS callout (all three bullets) and p03.): The search index is a read model that can be thrown away and rebuilt: build every document from the event stream and system of record under a listing-owned version, design for browse, facets and update storms, measure removal separately, and put a stable contract in front of whatever engine you run.\n\n**Roadmap** (IN THIS CHAPTER callout and p04.):\n\n- Veldmark's three engines and the Sunday-evening brown-out. *K hing is true, and every later design choice follows from it. |  | `cause_effect`: A high-write store with short-lived documents that is judged on freshness. → The principle that governs how such a store is built. |\n| p04 | transition | The chapter starts with Veldmark's three engines and a Sunday-evening brown-out, defines the terms and lays out the index as a rebuildable read model, then covers its structure (the search document, topology, the write path, the read path with facets and caching, reindexing and capacity), puts engine choice last, and ends with Veldmark's September 2027 decision, trade-offs, vertical differences, failure modes, the Chief Architect's view and review questions, with public engineering accounts (Vinted's above all), engine documentation and the fictional Veldmark as evidence. |  | `sequence`: The principle. → The order in which the chapter applies it. |\n\n## Sections\n\n### Setting the Scene at Veldmark: Three Engines and a Sunday Evening\n\n**Controlling idea** (`context`, id `scene`): Veldmark's three engines, the 17 January 2027 brown-out and Tradeyard's six-minute insertion latency pose the chapter's question as Ingrid frames it: what must be true of any index, what is shared across brands, and what may stay different.\n\n**Advances the thesis** (S1, S5, S6): Shows a brown-out caused by how the index was run at the peak and a freshness gap, neither of which an engine choice answers.\n\n**Transition in:** `example`: The roadmap's first item. → Veldmark, named as fictional, and its search estate in 2027.\n\n**Order of paragraphs** (`chronological`): The estate first, then the January brown-out, then the slower freshness problem the same review listed, shown on a March listing, then Ingrid's arrival and her three questions, which only make sense once both problems are on the table.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | description | Veldmark entered 2027 with three search engines across its brands, serving 17.25 million live listings at about 9,000 queries per second on average and 31,000 at the Sunday-evening peak, about 70% of it Tradeyard's. | scenario: Tradeyard: Solr 8 self-hosted next to Yardstick for NL, BE and PT, Elasticsearch 7 for PL; Motorvane: Elasticsearch 8 on Elastic Cloud; Hearthly: self-managed OpenSearch on GKE; 17.25M listings; 9,000 and 31,000 queries/s; Tradeyard ~70%. |  |\n| p06 | example | On Sunday 17 January 2027 Tradeyard NL's search browned out for 48 minutes because three causes that were harmless alone coincided: campaign traffic 30% above the usual peak, a weekly reindex committing into the live collection, and commits that cleared the caches browse traffic depended on. | scenario: 20:35 CET; p99 from ~400 ms to ~7 s for 48 minutes; ~9% of searches failed; post-incident review by Tomasz Wiśniewski with Daan Visser's Yardstick team.; quotation: Solr: caches 'are cleared after a commit and usually need to be re-populated before their benefit can be seen again'.; figure: Figure 1: three harmless causes merging at the Sunday peak. | `time`: The estate. → The incident that made the case for change. |\n| p07 | example | The same review found a slower problem: a new Tradeyard listing took six minutes p95 to become searchable, partly because Yardstick's indexer committed on a timer, and Common Ground set a 90-second target for 2028. | scenario: Femke's Rotterdam bike, €240, listed Sunday 7 March 2027 19:42, searchable 19:48; moderation queue owned by publication-pipeline; Common Ground €140M; 90 s p95 by end of 2028. | `additional_support`: The brown-out. → A second, slower problem from the same review. |\n| p08 | transition | Ingrid Halvorsen arrived in February 2027 facing not 'which engine is best?' but three questions every multi-brand group meets: what must be true of any index, what should be shared across brands and what may stay different, which the 14 September 2027 decision answered. |  | `problem_solution`: Two problems in one search estate. → The questions they pose and the decision that answers them, the thread of the chapter. |\n\n### Concepts: What a Listing Search Layer Is\n\n**Controlling idea** (`definition`, id `concepts`): Nine terms define a listing search layer, from the search document to the search contract, and each carries a design consequence the later sections use.\n\n**Advances the thesis** (S1, S2, S4, S6): Defines the vocabulary the thesis is stated in: browse queries, filters, facets, two freshness latencies, update storms, aliases, reindexing and the contract.\n\n**Transition in:** `elaboration`: The three questions and the brown-out. → The vocabulary needed to answer them.\n\n**Order of paragraphs** (`prerequisite_order`): The document and index come first because every other term refers to them; the alias follows because reindexing needs it; browse, filtering and facets explain the read workload; freshness and update storms explain the write workload; reindexing and the contract close the list because they rely on the alias and on the read and write paths.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | definition | A search document is one listing denormalized and shaped for queries, and an index is a named set of documents with one mapping and one layout of shards and replicas. |  |  |\n| p10 | definition | An index alias is a stable name in front of physical indices, so clients never see the index being replaced, and in Elasticsearch an alias swap is atomic. | quotation: The alias 'never points to both' targets during the swap. | `elaboration`: The physical index. → The name that lets it be replaced. |\n| p11 | definition | Listing search is dominated by browse queries, filters with no free text, which behave differently enough from text queries that Vinted gave them their own index in 2021. | case: Vinted split 'browsing queries (filters without search text)' onto a dedicated index with no analyzed text fields. | `sequence`: Documents and indices. → The two kinds of query run against them. |\n| p12 | definition | A filter decides whether a document matches and can be cached as a bit set, while scoring orders the matches, so mostly-filter listing queries stay cheap until a per-user element enters them. |  | `elaboration`: Browse queries. → Why filters make them cheap. |\n| p13 | definition | Facets are the counts per value shown beside results, computed over the whole match set, which often makes them the most expensive part of a results request. |  | `contrast`: Cheap, cacheable filters. → The expensive part of the same request. |\n| p14 | definition | Freshness is two latencies, insertion and removal, and this chapter owns the index's share of the end-to-end SLA that publication-pipeline owns. |  | `sequence`: The read workload. → The two write-side numbers search is judged on. |\n| p15 | definition | An update storm is a burst of document updates caused by something other than seller edits of content, such as bulk price changes, seller-level fan-out, bump campaigns or counters. |  | `elaboration`: Insertion and removal latency. → What competes with them for the write path. |\n| p16 | definition | Reindexing rebuilds an index's documents into a new physical index and switches readers to it, and even a capacity change can force one because shard counts are fixed at creation. | quotation: In Elasticsearch, `number_of_shards` 'can only be set at index creation time'. | `sequence`: Writes to a live index. → Rebuilding an index as a whole. |\n| p17 | definition | The search contract is the API product applications call in marketplace terms, translated by engine adapters, which Vinted credits with letting it change engines without changing product applications. | case: Vinted's 2024 account of its Vespa migration credits a 'search contract' in a Go gateway. | `sequence`: The index and how it is rebuilt. → The interface in front of it. |\n\n### Architecture: The Index as a Rebuildable Read Model\n\n**Controlling idea** (`description`, id `architecture`): The search layer is a write path and a read path meeting at the engine, and three boundary rules (no field without a source, a read-path recheck of what is expensive to get wrong, a contract in marketplace terms) matter more than its components.\n\n**Advances the thesis** (S2, S6): Draws the reference architecture in which the index is rebuildable and the engine sits behind a contract.\n\n**Transition in:** `sequence`: The terms. → How the components they name fit together.\n\n**Order of paragraphs** (`large_to_small`): The two paths and the diagram first, then the ownership table, then the three rules that decide where each component's responsibility ends; the rules mean nothing before the components are known, because each rule says where a component's responsibility ends.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | description | A listing search layer has a write path that turns listing changes into documents and a read path that turns requests into engine queries, meeting at the engine, and the reference architecture shown is the author's design, not any company's system. | figure: Figure 2: documents built only from the event stream and reference data, the contract hiding the engine, facets on a separate path. |  |\n| p19 | description | Each component owns some things and must not own others, and the 'must not own' column is where indices turn into databases; hydration, the step that loads display data for returned listings, is one of them. | table: Seven components (system of record, event stream, indexer, denormalization read models, engine, search API, hydration) with what each owns and must not own. | `elaboration`: The two paths. → The components on them and what each must not own. |\n| p20 | claim | Of three boundary rules that matter more than the components, the first is that nothing enters the index that cannot be rebuilt from the stream and reference data, which turns a rebuild into a normal consumer workload, as Vinted's 2023 pipeline showed. | case: After moving to CDC into Kafka and Flink with Redis denormalization reads, 'reindexing' became publishing messages to a Kafka topic. | `emphasis`: The component table. → The boundary rules that matter more than the components, starting with the first. |\n| p21 | recommendation | Second, the read path rechecks status on the 20 to 50 listings of a results page, closing the lag no indexer can close for a listing taken down a second ago, which is the author's recommendation rather than a documented practice. |  | `sequence`: The rebuildability rule. → The second rule, on the read side. |\n| p22 | claim | Third, the contract speaks marketplace terms and adapters translate them into engine syntax, which lets a group run two engines during a migration and keeps engine syntax out of hundreds of call sites. | example: Category `bikes/e-bikes`, `frame_size` in [M, L], within 15 km, profile `tradeyard-default`, translated to Solr, Elasticsearch, OpenSearch or Vespa. | `sequence`: The second rule. → The third rule, on the product side. |\n\n### Designing the Listing Search Document\n\n**Controlling idea** (`process`, id `document`): The listing search document is one denormalized document per listing whose fields are grouped by source and change rate, and whose attributes are promoted to typed fields only when the schema marks them as filter, facet or sort keys.\n\n**Advances the thesis** (S3, S1): Designs the document for filters and facets and ties typed fields to the attribute dictionary.\n\n**Transition in:** `elaboration`: The indexer that builds documents. → What one document holds.\n\n**Order of paragraphs** (`large_to_small`): The whole document first, then its field groups, then the hardest group, attributes: the problem, the three designs, the promotion rule and the upstream normalization it needs. The promotion rule placed before the three designs would read as an arbitrary policy rather than a choice between known costs.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p23 | claim | The standard pattern is one document per listing, denormalized at write time, because nested and parent-child relations are much slower to query. | quotation: 'nested can make queries several times slower'. |  |\n| p24 | analysis | The design decision is how to group fields by source and change rate, because the change rate decides how each group is treated in the index. | table: Eleven field groups (identity, lifecycle, taxonomy, filterable and long-tail attributes, price, location, text, ranking features, monetization flags, embeddings) with examples, source, change rate and index treatment. | `elaboration`: One document per listing. → How its fields are grouped. |\n| p25 | claim | Attributes are the hardest part, because mapping each of Tradeyard's 3,900 keys as a typed field would break the engine's mapping limits and cost memory, merge time and cluster state. | scenario: 3,900 keys across four country taxonomies, 41% used on fewer than 0.1% of listings.; quotation: Elasticsearch caps mapped fields at 1,000 by default 'to prevent mappings and searches from becoming too large'. | `emphasis`: The field groups. → The group that is hardest to map. |\n| p26 | comparison (list) | There are three designs for attributes, typed fields, nested key-value objects and a flattened field, each with a known cost. | quotation: Nested queries are 'typically expensive'; a listing with 30 attributes becomes 31 Lucene documents. | `elaboration`: The mapping problem. → The three ways to solve it. |\n| p27 | recommendation | The workable design is a promotion rule: an attribute becomes a typed field only when the category schema marks it as a filter, facet or sort key, so promotion is a reviewed schema change, and about 610 of Tradeyard's 3,900 keys were promoted. | scenario: Veldmark's group attribute service, live October 2027, publishes the flag; about 610 keys promoted in the first schema version.; figure: Figure 3: a dictionary-driven gate sorting a small flagged share into typed fields and the long tail into one flattened field. | `problem_solution`: Three designs with known costs. → The rule that combines two of them. |\n| p28 | recommendation | The index must see only dictionary values, because free-string attributes split one brand into several facet values, and normalization belongs upstream. | statistic: Vinted cut brand cardinality from about 2,000,000 values to 40,000 and facet p99 by about 15 ms. | `additional_support`: The promotion rule. → The condition it depends on: normalized values. |\n\n### Index Topology: How to Partition\n\n**Controlling idea** (`process`, id `topology`): Index topology is settled by three questions (does a query cross the boundary, do analyzers differ, does one partition dominate load), which for a multi-country group usually gives one index per brand and country with language fields, and shard counts sized per partition.\n\n**Advances the thesis** (S5): Sizes and isolates partitions for the load they carry.\n\n**Transition in:** `sequence`: One document per listing. → How documents are grouped into indices.\n\n**Order of paragraphs** (`large_to_small`): The options with documented examples first, then the three questions that choose among them, then Belgium as the case that tests the language question, then shard sizing inside the chosen indices; shards cannot be sized before the partitions they split are fixed.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p29 | description | Index topology decides how many indices exist, what each contains and how they are laid out, and the public record shows most options in use, several of them at Vinted. | table: Six partitioning keys (country or brand, language, workload, time, vertical, one global cluster) with dated Vinted examples, strengths and costs. |  |\n| p30 | recommendation | Three questions settle most topology choices, and for a multi-country group the answer is typically one index per brand and country, with per-language fields where a country is multilingual, on shared clusters. |  | `problem_solution`: Six options with costs. → The questions that choose among them. |\n| p31 | example | Belgium shows why a multilingual country needs language fields, not language indices: one index with per-language title fields and a language detector at ingest keeps one inventory and correct analysis. | scenario: Tradeyard Belgium serves Dutch and French speakers with one inventory; `title_nl` and `title_fr` fields with their own analyzers. | `example`: The language question. → A country where it decides the design. |\n| p32 | recommendation | Shard sizing is a capacity decision made from document counts, update rates and query rates per partition, not a default. | case: Vinted's 2017 hot nodes from uneven placement.; scenario: Tradeyard PT 1.1M listings against NL 6.1M. | `sequence`: Which indices exist. → How each is split into shards. |\n\n### The Write Path: Near-Real-Time Indexing and Update Storms\n\n**Controlling idea** (`process`, id `write-path`): The write path makes documents visible through refreshes that trade freshness against query cost, keeps them in order with a listing-owned version, tames update storms with lanes that put removals first, and measures freshness on every write.\n\n**Advances the thesis** (S4, S2): Builds the indexing path with a listing-owned version, a removal lane and per-operation freshness.\n\n**Transition in:** `sequence`: The document and its indices. → How changes reach them.\n\n**Order of paragraphs** (`prerequisite_order`): Visibility mechanics first, because ordering, storms and measurement all depend on what a refresh costs; ordering before storms, because the lanes rely on versioned writes; measurement last, because it checks the whole path.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p33 | explanation | In Lucene-based engines a document becomes searchable at a refresh or soft commit, and the engines' own defaults and guidance show that the interval is a choice. | source: Elasticsearch refreshes every second, only for indices searched in the last 30 seconds; Solr advises 'as long an interval as your application can tolerate', often 15–60 seconds. |  |\n| p34 | analysis | Every refresh costs merges and, in Solr, cold caches, so high-traffic sites lengthen the interval and must buy freshness elsewhere, with in-place updates or a read-path recheck. | case: Vinted ran Elasticsearch with a 300-second refresh interval before moving to Vespa. | `cause_effect`: Refresh as the visibility mechanism. → What each refresh costs, and the consequence. |\n| p35 | claim | Updates for one listing must apply in order and replays must be harmless, which external versioning with a sequence owned by the listing aggregate guarantees, whereas Kafka offsets broke when Vinted changed the partition count. | case: Vinted used Kafka offsets as external versions in 2021; a partition-count change broke per-listing ordering. | `sequence`: When writes become visible. → The order in which they must be applied. |\n| p36 | cause_effect | A delete needs a version too, because an unversioned late update after a 'sold' event brings the listing back, a common and hard-to-test cause of Ghost Inventory. |  | `elaboration`: Versioned writes. → Deletes as writes. |\n| p37 | explanation | Listing documents change mostly for reasons unrelated to text, and in Lucene engines each partial update re-indexes the whole document, while Vespa, an engine outside the Lucene family met again under engine choice, updates fields it keeps in memory in place. | example: 4,000 dealer price cuts at 09:00; a seller with 900 listings suspended; a bump campaign; a rating change.; source: Elastic's update API gets, changes and re-indexes the document; Vespa names 'real-time inventory and price changes' and counters as uses of partial updates. | `sequence`: Ordering of individual writes. → Bursts of writes. |\n| p38 | recommendation (list) | Five mitigations recur whatever the engine, offered as the author's recommendations: keep counters off the document, coalesce per listing, treat seller-level changes as fan-out jobs, give bulk feeds their own lane, and put removals first. |  | `problem_solution`: The cost of update storms. → The mitigations. |\n| p39 | example | Tradeyard's 2027 indexer broke most of these rules: about 6.4 million of its 9 million daily document writes were view counters that passed through no event stream, and removing them was the cheapest performance fix of the year. | scenario: About 9M daily document writes, about 6.4M view-counter updates; ranking used a daily aggregate anyway.; figure: Figure 4: lanes with removals first, bulk feeds rate-limited and counters diverted. | `example`: The five mitigations. → A system that violated them. |\n| p40 | recommendation | Freshness drifts unless the indexer measures it per operation on every write and a synthetic probe publishes, finds, removes and searches for a test listing every minute per market. | statistic: Vinted's 4.64 seconds p99 from Flink to Vespa. | `sequence`: Lanes and mitigations. → How to know the path still meets its targets. |\n\n### The Read Path: Facets, Caching and Latency Budgets\n\n**Controlling idea** (`process`, id `read-path`): On the read path facets run on their own path, each of four caches has its own invalidation, and one latency budget divided between the steps settles what a request can afford.\n\n**Advances the thesis** (S5, S1): Designs the read side for browse and facet traffic at the peak.\n\n**Transition in:** `contrast`: The write path. → The read path, where the cost is facets and caches.\n\n**Order of paragraphs** (`grouping`): Facets, caches and the budget are three controls on one request; facets come first because they are the most expensive part of a request and the filter caching they rely on was defined among the concepts; the cache table follows and generalizes it to all four caches; the budget comes last because it allocates time to the steps already described, and before them it would divide time among steps the reader has not met.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p41 | evidence | Facets cost in proportion to result counts, and Vinted's 2023 account shows that putting them on their own path made item search faster at a modest CPU cost. | statistic: One request per multi-select facet; separation cost ~20% more CPU and made item search ~71 ms faster; ~50% facet cache hit ratio; collection capped at 100,000 per shard with '500+' displayed; facet p99 ~120 ms. |  |\n| p42 | recommendation | Five facet lessons carry over to any engine: approximate counts are a product decision, cap cardinality, cache on normalized filter keys, pre-bucket ranges and serve facets on a separate request. |  | `cause_effect`: Vinted's figures. → The lessons that follow from them. |\n| p43 | description | A listing search stack usually has four caches, each with its own invalidation story. | table: Engine filter caches, engine request caches, application facet and result cache, CDN or page cache: what each holds, what invalidates it and its risk. | `sequence`: Facets. → The caches that serve them and the results. |\n| p44 | analysis | Application caches are where freshness and cost collide, and the status recheck makes a 60-second cache on popular browse pages acceptable. |  | `emphasis`: Four caches. → The one where freshness is traded against cost. |\n| p45 | description | Every step of a results request spends part of one latency budget, illustrated by Veldmark's p99 targets for the shared search API, which are not an industry standard. | table: Parsing 10 ms, query understanding 25 ms, items query 150 ms, re-ranking 40 ms, hydration and recheck 25 ms, facets 200 ms in parallel; result list 250 ms p99. | `sequence`: Caches. → The time budget the whole request must fit. |\n| p46 | analysis | The budget settles arguments, because a proposed 80 ms step such as a cross-encoder re-ranker forces the question of what it displaces. |  | `elaboration`: The budget table. → What the budget is for. |\n\n### Zero-Downtime Reindexing\n\n**Controlling idea** (`process`, id `reindexing`): Reindexing is routine, an alias swap with a live stream made safe by versioned writes, throttled backfills away from the peak, validation, rollback and automation, and the same capability is the quarterly drill that proves the index is not a system of record.\n\n**Advances the thesis** (S2, S5): Turns the alias swap into a safe routine and the rebuild drill into the proof of rebuildability.\n\n**Transition in:** `sequence`: The read and write paths of a running index. → Replacing the index under them.\n\n**Order of paragraphs** (`problem_solution`): Why reindexing is routine first, then the practices that make it safe, then the drill that reuses it as a test; the drill needs the practices to be safe to run every quarter.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p47 | description | Mapping, analyzer, shard and engine changes each need a reindex, and the baseline procedure is an alias swap whose correctness risk lies in the live update stream. | figure: Figure 5: backfill and live updates both write with the listing's sequence as version; the swap follows only after counts, samples and shadow queries agree. |  |\n| p48 | recommendation (list) | Five practices separate a boring reindex from an incident: version every write, throttle the backfill and never run it at peak, validate before the swap, keep the old index for rollback and automate it. | scenario: Tradeyard's January brown-out was a reindex into the live collection at the weekly peak.; quotation: Vinted's alias-based index management became 'predictable, automated, and boring'. | `problem_solution`: Where the risk lies. → The practices that remove it. |\n| p49 | recommendation | The ability to reindex from the stream is also the test for Search as System of Record, which Veldmark runs as a quarterly rebuild drill comparing a fresh index with the live one. | scenario: Quarterly rebuild drill per market, adopted with the 2027 decision; unexplained differences reveal fields that exist only in the index. | `cause_effect`: A safe, routine reindex. → Its second use as a test. |\n\n### Capacity Planning for Evening Peaks\n\n**Controlling idea** (`process`, id `capacity`): Listing traffic peaks predictably in the evening and with campaigns, engine load is a multiple of user queries, and capacity is planned for the peak with headroom, replayed load tests, a maintenance ban, prepared degradation modes and cost per thousand searches.\n\n**Advances the thesis** (S5): Plans capacity for the evening peak the brown-out exposed.\n\n**Transition in:** `elaboration`: Keeping reindexing away from the peak. → Planning for the peak itself.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The predictable peak first, then the multiplier that makes user queries understate load, then the practices those two facts imply; the headroom and load-test practices would be unmotivated without the multiplier before them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p50 | evidence | Listing traffic peaks predictably with evening browsing and campaigns, so capacity planning belongs on the marketing calendar; Rightmove's busiest minute was a TV ad break, and Veldmark's Sunday peak is a property of the fictional group. | quotation: Rightmove's busiest minute was '8:48 pm on Wednesday during the final ad break on prime-time TV' (2021; more than three years old). |  |\n| p51 | analysis | Planning from user queries understates engine load, because each results page generates several engine requests: 2.6 at Tradeyard, about 56,000 engine requests per second at peak. | scenario: 2.6 engine requests per Tradeyard results page; 31,000 group queries/s × ~70% ≈ 21,700 Tradeyard queries/s and so ~56,000 engine requests/s. | `elaboration`: When the peak comes. → How large it is at the engine. |\n| p52 | recommendation (list) | Five practices follow: size for the peak plus campaign headroom, replay real traffic with the indexer writing, ban maintenance at peak, define degradation modes in advance and track cost per thousand searches. | scenario: Tradeyard sized at 1.5 times the trailing peak because the January campaign added 30%. | `cause_effect`: A predictable peak and a request multiplier. → The practices they imply. |\n\n### Choosing an Engine: What the Public Record Shows\n\n**Controlling idea** (`comparison`, id `engine`): The public record shows most listing marketplaces on Lucene-based engines and Vinted's move to Vespa as the best-documented exception, and engine choice should be judged by workload fit, team and cloud rather than by benchmarks.\n\n**Advances the thesis** (S6): Puts engine choice after the structure and judges it by fit.\n\n**Transition in:** `sequence`: The structure the engine must support. → The engine itself, last.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): What is documented first, then licensing as a difference that no longer decides, then Vinted's series and what it does and does not prove, then the criteria that follow; the criteria rely on the evidence before them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p53 | evidence | Most listing marketplaces that have published their engines run Lucene-based engines, and the table records what is documented with dates, a missing company meaning no primary source was found. | table: Vinted (Elasticsearch, Vespa from Nov 2023), leboncoin (~90-node Elasticsearch, 2023), Rightmove (Elasticsearch since 2014, 2025), Homegate (Elasticsearch, 2024), Airbnb (Lucene-based retrieval with an IVF filter, 2026). |  |\n| p54 | analysis | Licensing no longer separates Elasticsearch from OpenSearch, so the practical differences are managed services, roadmaps and skills. | source: Elastic left open-source licensing in 2021 and added AGPL in August 2024; AWS moved OpenSearch to the OpenSearch Software Foundation under the Linux Foundation in September 2024. | `contrast`: The documented engines. → A difference between two of them that no longer decides. |\n| p55 | evidence (list) | Vinted's 'Search Scaling' series is the most useful public record of a listing search estate evolving over a decade; it gathers in order the steps earlier sections used one at a time and adds only what they left out, from re-sharding in 2017 to one Vespa deployment and a billion items. | case: 2017 46 indices, re-sharding to ~2.5-3M documents per shard cut weekly slow queries from ~7M to under 200,000; 2021 Kafka Connect and browse-index cache hit ratios above 90%; 2023 delta jobs every seven minutes and week-long backfills replaced, items visible 'within a minute'; 2024 six clusters of 20 nodes to one Vespa deployment of 60 nodes, 5 s visibility, ~10,300 operations/s, ~20,000 requests/s under 150 ms p99, 200,000 ranking candidates; 2025 one billion items. Facts already given earlier (ten countries and hot nodes, offset versioning, the browse index's partitioning, CDC with Kafka and Flink, the 300-second refresh, 4.64 s) appear there only, with a pointer from the timeline. | `example`: The engines in general. → The one estate documented in detail. |\n| p56 | counterargument | Vinted's before-and-after figures cannot be credited to the engine alone, because they combine engine, hardware and topology changes, and Vespa's benchmark is a vendor's. |  | `contrast`: Vinted's figures. → What they cannot prove. |\n| p57 | analysis | What the series does show is the order in which the hard problems arrived, with facets the last workload Vinted moved. |  | `contrast`: What the figures cannot prove. → What they do show. |\n| p58 | comparison | A group should ask which engine fits its workload, team and cloud, not which is fastest, judged on six criteria from partial updates to zero-downtime schema change. | table: Partial updates, multi-phase ranking, facet maturity, managed services, talent, zero-downtime schema change: Lucene-based against Vespa. | `cause_effect`: The lessons of the public record. → The criteria a group should use. |\n| p59 | analysis | No criterion is decisive alone: deep ranking with in-place feature updates favours Vespa, while small teams, a managed Lucene service and browse-heavy load favour staying in the Lucene family. |  | `elaboration`: Six criteria. → How they combine into a choice. |\n\n### In Practice: Veldmark's September 2027 Search Platform Decision\n\n**Controlling idea** (`example`, id `in-practice`): Veldmark's 14 September 2027 decision chose OpenSearch for Tradeyard and Hearthly with Motorvane staying on Elasticsearch, but the conditions mattered more than the engine: the contract first, documents only from the event contract, removal and insertion objectives, and a migration ordered by risk.\n\n**Advances the thesis** (S6, S2, S4): Shows the thesis applied: contract before engine, sourced documents, a removal lane and an engine left replaceable.\n\n**Transition in:** `example`: The criteria for an engine choice. → Veldmark applying them, with the conditions that matter more.\n\n**Order of paragraphs** (`problem_solution`): The options pose the choice and the decision with its conditions answers it; the consequences follow: the insertion share on Femke's bike, then the tighter removal target, then the migration order. The bike's seconds and the removal target mean nothing before the decision that sets them, and the migration order depends on the contract the decision requires.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p60 | comparison | Tomasz Wiśniewski's group search platform team put four options to the architecture advice forum, from keeping three engines to Vespa for every brand. | table: A. keep three engines; B. Elasticsearch on Elastic Cloud; C. OpenSearch on Amazon OpenSearch Service with Motorvane on Elasticsearch; D. Vespa for all, each with for and against. |  |\n| p61 | claim | The decision on 14 September 2027 was option C with three conditions that matter more than the engine: every application moves to Listing Search API v1 first, documents come only from the listing event contract and reference services, and Vespa is deferred with a trigger for the 2029 review. | scenario: Listing event contract v1 on Confluent Cloud, live 1 July 2027; Motorvane adopts the contract on Elasticsearch so the 2029 review becomes an adapter change.; figure: Figure 6: two engines behind one contract, one indexer framework fed by one event contract. | `problem_solution`: Four options. → The decision and its conditions. |\n| p62 | example | The new write path gives the index 15 seconds p95 of the 90-second publication budget, shown on Femke's bike: about 2 seconds for the event, 3 for the document build and 5 for the refresh, against the four minutes it spent in Yardstick's batch indexer; the rest of the budget belongs to validation and moderation. | scenario: Moderation passed 19:44, searchable 19:48 in March 2027; target: ~2 s event, ~3 s build, 5 s refresh; 15 s p95 index share. | `example`: The decision. → What it buys on one listing. |\n| p63 | example | Removal gets a tighter target, 10 seconds p95 on a priority lane, and the bike shows why removal must be measured across every copy: its removal from search took a minute, but a stale copy reached buyers through the alert digest. | scenario: Sold 8 March, removal 18:10 to 18:11; the stale copy lived in the alert digest owned by saved-searches-and-alerts. | `contrast`: The insertion target. → The tighter removal target. |\n| p64 | process | The migration order follows risk, Tradeyard Portugal first behind the contract with four weeks of shadow traffic and Hearthly last, and analyzer parity, checked with real-query test sets, is the explicit migration risk. | scenario: PT Q2 2028; PL; BE and NL with Yardstick's search extraction Q4 2028; Hearthly last; fifteen years of Dutch and French Solr synonyms and stopwords.; case: Vinted brought its Lucene analyzers into Vespa. | `sequence`: The targets. → The order in which markets move. |\n\n### Trade-offs\n\n**Controlling idea** (`comparison`, id `trade-offs`): Each of the chapter's choices (engine family, topology, volatile fields, refresh interval, facets) is right under some conditions and wrong under others.\n\n**Advances the thesis** (S5, S6): States the recommended choices as options with conditions.\n\n**Transition in:** `conclusion_summary`: The design and Veldmark's decision. → The choices they rest on, as options with conditions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p65 | analysis | No choice in this chapter is right everywhere, which is why the contract and the rebuild drill matter: they let a group change a row later, market by market, without a rewrite. | table: Engine (Lucene family, Vespa), topology, volatile fields, refresh interval, longer interval plus recheck, facets: when each is right and when it is wrong. |  |\n\n### Vertical Differences\n\n**Controlling idea** (`comparison`, id `verticals`): Verticals differ in volume, dominant query, attributes, update storms, duplicates, freshness emphasis and geo, so one engine can serve several verticals while each marketplace owns its document schema.\n\n**Advances the thesis** (S6, S3): Splits what the platform shares from what each marketplace owns.\n\n**Transition in:** `contrast`: Choices with conditions, and Veldmark's decision to put three verticals on one platform. → How the workload differs by vertical, and what that means for the shared engine and the per-marketplace schema.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p66 | analysis | Because Veldmark's decision puts three verticals on one platform, the vertical table explains why one engine can serve them while one document schema cannot: Hearthly, Motorvane and Tradeyard documents each carry different fields, and the platform shares the engine, indexer, contract and operations. | table: General classifieds, real estate, automotive, jobs across volume, dominant query, attributes, update storms, duplicates, freshness and geo; Zillow cited 200+ attributes per property in 2020.; scenario: Hearthly's property-cluster ID collapsing the Lyon apartment's three agency listings; Motorvane's decoded vehicle attributes; Tradeyard's promoted and flattened fields. |  |\n\n### Failure Modes\n\n**Controlling idea** (`description`, id `failure-modes`): Four failures, each touched on in an earlier section, recur often enough to be named here with their symptom and check: the index as the only copy, per-user elements in shared filters, analyzer drift during a migration, and deep pagination by bots.\n\n**Advances the thesis** (S2, S5): Names the failures the rebuild drill, cache discipline and migration tests prevent.\n\n**Transition in:** `additional_support`: Choices and their conditions. → The failures that follow when they are made badly.\n\n**Order of paragraphs** (`grouping`): A one-line announcement that says honestly the four failures were touched on earlier, then the four, each breaking one earlier rule and pointing back to it: how rebuildability is usually lost, cacheable filters, migration parity and read-path cost. The section is the book's standard Failure Modes section (style guide, item 7; named in the journal spec's AC-2), so it stays, as a named catalogue that adds a symptom, an example or a check to each failure rather than claiming them as new.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p67 | transition | Each of the chapter's choices can fail in a recognizable way; four failures, all touched on earlier, recur often enough to deserve a name, a symptom and a check. |  |  |\n| p68 | cause_effect | Search as System of Record usually begins with a batch job that writes a field into the index and nowhere else, which cannot be rebuilt when a mapping change requires a reindex; the rebuild drill finds such fields while they are few. |  | `sequence`: Four failures announced. → The first. |\n| p69 | cause_effect | A per-user element added to every query, the facet lesson broken, destroys filter and facet cache hit ratios, which is why Vinted kept a per-user filter out of facet queries. | case: Vinted accepted slightly inaccurate facet counts to keep a per-user filter out of facet queries. | `sequence`: The first failure. → The second. |\n| p70 | cause_effect | A new engine that tokenizes differently changes results for a share of queries, the migration risk Veldmark's plan already names, so analyzers are ported with test sets of real queries. |  | `sequence`: The second failure. → The third. |\n| p71 | cause_effect | Bots paging thousands of results deep, the reason for the pagination cap among the degradation modes, make each page costlier than the last, so pagination depth is capped for anonymous traffic and partners are served through feeds. |  | `sequence`: The third failure. → The fourth. |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `ca-view`): At group level search is a platform decision with a product boundary through it: the platform owns engine, clusters, indexer, contract and capacity, marketplaces own schemas, analyzers and ranking, five decisions are insisted on, and a few numbers are watched over time.\n\n**Advances the thesis** (S2, S4, S6): Turns the thesis into governance: the ownership split, the decisions and what to watch.\n\n**Transition in:** `conclusion_summary`: The design, its trade-offs and failures. → The decisions a Chief Architect takes from them.\n\n**Order of paragraphs** (`order_of_importance`): The ownership split first, because every later dispute is settled by it; then the decisions in order of importance; then who decides; then what to watch, which checks the decisions over time.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p72 | recommendation | The platform owns the engine, clusters, indexer framework, contract, capacity, freshness monitoring and cost, each marketplace owns its schema, analyzers, synonyms, ranking and experiments, and the split must be written down because later disputes are settled by it. |  |  |\n| p73 | recommendation (list) | Five decisions come in order of importance: a rebuildable index proved quarterly, a contract in front of the engine, removal latency as a named SLO, the attribute dictionary deciding index fields, and maintenance away from the peak. |  | `elaboration`: The ownership split. → The decisions the author would insist on. |\n| p74 | recommendation | The group search platform team decides engine, topology and operations with the architecture advice forum reviewing engine and contract changes, marketplaces decide schemas, analyzers and ranking within the contract, and the CTO arbitrates cost by cost per thousand searches. |  | `elaboration`: The decisions. → Who takes each. |\n| p75 | recommendation | Over time the Chief Architect watches freshness percentiles, bot load, cost per thousand searches, index fields without a source, cache hit ratios at peak and analyzer age, and revisits the engine on a fixed cycle with shadow traffic behind the contract. |  | `time`: Decisions and owners now. → What to watch later. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Ten questions take the design into a review of the reader's own search layer.\n\n**Advances the thesis** (S1, S2, S3, S4, S5, S6): Gives the reader the design as review questions.\n\n**Transition in:** `conclusion_summary`: The Chief Architect's decisions. → The questions a reviewer asks to test them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p76 | recommendation (list) | Ten review questions cover rebuild time, fields with no source, insertion and removal latency, counters in the document, engine requests per page, document versions, direct engine calls, maintenance at peak, attribute promotion and what would reopen the engine decision. |  |  |\n\n## Conclusion: From Engine to Intent\n\n**Synthesis:** Ingrid's three questions are answered without naming an engine: what must be true of any index is a listing-owned version, documents only from sourced data, a removal lane with its own objective and a quarterly drill; what is shared is the engine operations, indexer framework, contract and capacity; what may differ is schemas, analyzers and ranking.\n\n**So what:** Because none of those answers depends on the engine, the brown-out is prevented by how the index is run, and the 2029 engine review becomes an adapter change rather than a rewrite.\n\n**Callback:** The Sunday-evening brown-out and Ingrid's three questions in the scene. The reader can now see that the brown-out came from how the index was run at the peak, and that each of Ingrid's questions has a structural answer.\n\n**Takeaway** (`course_of_action`): Put product applications behind the search contract, build documents only from the event stream with a listing-owned version, prove the rebuild every quarter and give removal its own lane before deciding any engine change.\n\n**Hand-off** to [What Did They Mean? Query Understanding and Autocomplete](query-understanding.html): `problem_solution`: A search layer that is fast, fresh and rebuildable behind its contract, but that cannot tell that 'ebike' and 'elektrische fiets' mean the same category. → Query understanding: compiling short, multilingual, misspelled queries into categories and attribute filters with stated confidence, and the place of embeddings and LLMs on top of that.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p77 | synthesis | Ingrid's three questions have answers that name no engine: any index carries a listing-owned version, is built only from sourced data, removes on its own lane and is proved by a quarterly drill; the platform shares engine operations, indexer, contract and capacity; marketplaces keep schemas, analyzers and ranking; so the brown-out is prevented by how the index is run and the 2029 review becomes an adapter change. | reasoning: The brown-out's causes were a reindex into the live collection, commits clearing caches and campaign traffic, all operating choices. |  |\n| p78 | transition | A search layer that is fast, fresh and rebuildable still cannot tell that 'ebike' and 'elektrische fiets' mean the same category, and translating words into structured queries is the next chapter's subject. |  | `problem_solution`: A fast, fresh, rebuildable search layer. → What it still cannot do: understand words. |\n\n## Non-goals\n\n- Text analysis, synonyms, autocomplete and hybrid retrieval. See [What Did They Mean? Query Understanding and Autocomplete](query-understanding.html).\n- Learning to rank and paid-organic blending. See [Ranking for Two Sides: Relevance, Freshness and Paid Visibility](ranking.html).\n- Geo queries and map clustering. See [Searching by Place: Map, Polygon and Commute Search](map-search.html).\n- Percolation and alert fan-out. See [Tell Me When It Appears: Saved Searches and Alerts](saved-searches-and-alerts.html).\n- End-to-end publication SLA and moderation gate. See [From Submitted to Searchable: The Publication Pipeline](publication-pipeline.html).\n- Event contract design and outbox. See [Every Change Is an Event: Event-Driven Listing Architecture](event-driven-listings.html).\n- CQRS in general. See [System of Record and Read Models: Listing Data Management](listing-data-management.html).\n- Degradation design and SLOs per journey. See [Sunday Evening Peaks: Reliability, Performance and Cost](reliability-and-scale.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- No primary source was found for the search engines of OLX, Marktplaats, Kleinanzeigen, Idealista or AutoScout24; the engine table may grow when sources appear. (Carried over from spec.md.)\n- Vinted's before-and-after figures mix engine, hardware and topology changes; a neutral engine comparison for listing workloads is not public. (Carried over from spec.md.)\n- Whether the read-path status recheck should be part of the search contract or of each marketplace's hydration layer. (Carried over from spec.md.)\n- Thesis rubric (2026-11-12, fail) not acted on, because the thesis is copied from the journal spec and is the author's to change: the claim strings together the contents of S2-S6 and reads as a summary holding two theses (a throwaway read model; the engine as a replaceable adapter); the rubric suggests a one-sentence claim leaving the mechanisms to the supporting claims. how_why's first sentence repeats S1; S5 lists six items.\n\n## Decision log\n\n- **2026-10-19** — Organized the chapter around the 'index is a read model' principle rather than an engine survey, because engine choice is the decision readers over-weight. Rejected: An engine survey as the chapter's spine.\n- **2026-10-19** — Used Vinted's dated series as the main public case and kept leboncoin, Rightmove and Homegate to one line each, because only Vinted documents the evolution in detail.\n- **2026-10-19** — Used the Rightmove Wednesday TV-break peak as the documented peak example; the Sunday-evening peak stays a Veldmark property.\n- **2026-10-19** — Added local Veldmark details (2.6 engine requests per results page, 6.4M daily counter writes, 610 promoted attribute keys, 15 s index budget, 10 s removal target) to make the worked example concrete.\n- **2026-11-12** — Converted spec.md to spec.json. Success criteria rewritten: the engine-choice, rebuild-drill and alias-reindex criteria are covered by the journal spec's AC-1; the document-design criterion became AC-4 and the versioning and removal criteria became AC-5 (both added here, severity minor). Dropped as inventories: the topology three-questions and Vinted-facet-figures criteria; dropped as an editorial check rather than a reader outcome: 'every company claim carries a dated source; Veldmark figures match the ledger'. Rejected: Carrying the eight success criteria over unchanged.\n- **2026-11-12** — Draft check round 1 found a fault in the spec: the Failure Modes section opened by relisting four failures already described, and its first failure restated Search as System of Record (both flow readers). Changed the section's opening paragraph to a one-line announcement of failures not covered earlier and recast the first failure as how Search as System of Record usually begins; re-validated and continued to round 2. Rejected: Moving Failure Modes before engine choice or folding its items into earlier sections (larger change to the author's structure).\n- **2026-11-12** — Draft check round 2 found the Failure Modes announcement 'not covered above' untrue for two of its four failures (both flow readers; fault spec). Changed the announcement to say two failures are new and two were met earlier in another form, and stated in the section's flow why it follows the decision; re-validated and continued to round 3. Rejected: Folding the four failures into the sections they relate to (larger change to the author's structure).\n- **2026-11-12** — Word ening and first failure changed in spec and prose (spec fault); roadmap names the evidence; Vinted introduced at first mention with pointers to its timeline; 15 s index share explained as room for the tail; the digest copy and the Lyon apartment introduced where they appear; lead sentences for the Concepts list and the review questions. (AI-mediated session)\n- **2026-11-12** — Flow rubric notes taken: merged the architecture section's one-line announcement of the three boundary rules into the first rule; failure mode on analyzer drift now points back to Veldmark's migration plan; read-path and in-practice flow reasons and patterns corrected; reasons for document, topology and capacity order say what would break. (AI-mediated session)\n- **2026-11-12** — Converted spec.md to spec.json (outcome-spec pipeline); spec.md removed. (AI-mediated session)\n- **2026-10-21** — Renamed failure patterns to match where-listing-systems-go-wrong. (AI-mediated session)\n- **2026-10-20** — Replaced 3 mermaid diagrams with generated illustrations (figure numbers and captions unchanged). (AI-mediated session)\n- **2026-10-20** — Consistency fix: 'projection' to 'read model' in the excerpt, KEY POINTS, lead, Architecture heading and Figure 2 caption. (AI-mediated session)\n- **2026-10-20** — Sharpening pass: 6,943 to 6,905 prose words; lead rewritten; Architecture heading renamed; 'Choosing an Engine' moved after capacity planning. (AI-mediated session)\n- **2026-10-20** — Cross-chapter consistency sweep: 4 headings aligned with the book's shared section names. (AI-mediated session)\n- **2026-10-19** — Added 3 inline illustrations (article-illustrator). (AI-mediated session)\n- **2026-10-19** — Editorial review pass: timetoread corrected, license acronyms expanded, Vinted facet-count wording and Rightmove/Zillow evidence dated or hedged, American spelling. (AI-mediated session)\n- **2026-10-19** — Initial spec and article. (AI-mediated session)\n"}]}]}</script>

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
