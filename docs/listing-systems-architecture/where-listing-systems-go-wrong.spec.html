<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (unit for unit, in its own order except where the decision log records a move) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, acceptance criterion AC-1, thesis and role are copied unchanged from the post's entry in journal-spec.json. Each pattern subsection's seven units (quote with figure, what it looks like, why it happens, what it costs, an illustration, the remedy direction, where this book helps) are paragraphs of the one section 'Fifteen Patterns to Recognize'; tables, figures and the matrix are evidence.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The fifteen pattern names, with the warning signs and mechanism of each.\n- **Know:** That the patterns form chains, and which patterns start most chains.\n- **Believe:** Each pattern is the residue of locally reasonable decisions, and its cost shows up as lost liquidity rather than in a project budget.\n- **Be able to:** Name the pattern behind a described failure and look upstream for the missing contract, owner or metric definition that started its chain.\n- **Be able to:** Find the chapters that address a given pattern.\n\n**Audience:** Experienced architects and engineering leaders working on listing marketplaces: chief and enterprise architects of marketplace groups, principal and staff engineers, search, data and ML leads, platform-engineering leads, product and engineering directors of classifieds, real-estate, automotive, jobs and recommerce marketplaces, and technology leaders integrating acquired marketplaces.\n\n**Already knows:**\n\n- What an API, a database, an event stream, a search engine and Kubernetes are.\n- How to make and defend an architecture decision.\n- From the introduction: the liquidity-machine claim, liquidity as the chance that a listing and a buyer find each other quickly, Veldmark in one paragraph, and a short list of pattern names.\n\n**Does not yet know:**\n\n- Marketplace economics: liquidity, network effects, multi-homing.\n- Search and ML vocabulary: learning to rank, percolation, hybrid retrieval.\n- Regulatory detail: DSA statements of reasons, DAC7, P2B.\n- Vertical specifics: VINs, property and vehicle feed standards.\n- What the pattern names mean (Ghost Inventory, Feed Roulette and the rest).\n- Platform vocabulary not yet defined in reading order: contract, read model, entitlement, system of record as used here.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a failure the page does not describe, a reader names the pattern and the upstream cause to fix first. *Probe:* A dealer's nightly feed arrives with half its cars missing, and the next morning those cars are gone from search and from saved-search alerts. Using only this page: which patterns are these, and where would you fix it first? | `custom` | cold_reader | major |\n| AC-2 | Given a symptom the page describes only in passing, the reader names the pattern, its upstream patterns and the chapters to read. *Probe:* Paid listings fill more and more of the first page while contacts per search fall. Using only this page: which pattern is this, which patterns upstream feed it, and which chapters would you read? | `custom` | cold_reader | minor |\n| AC-3 | A reader of the opening alone (callouts and paragraphs before the first heading) can predict the page's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this page discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | minor |\n\n## Thesis\n\n**Question:** In which recurring ways do listing systems lose liquidity, and what do the failures have in common?\n\n> **Claim:** Listing systems lose liquidity in fifteen recurring patterns, and what they have in common is that each began as a locally reasonable decision under one team's target and that they travel in chains that start at a missing contract, a vanity metric or a hand-off nobody owns.\n\n**Disputed by:** The view that each marketplace failure is a separate defect or a single bad decision in the system that showed the symptom, to be fixed there.\n\n**So what:** Faced with a symptom, the reader names the pattern and breaks the chain at its origin, usually with a contract, an owner or a metric definition, instead of funding a downstream fix that will have to be made again.\n\n**How and why:** A team that hard-codes the first category tree, accepts a dealer's feed as it is or adds one more ranking boost makes a sensible choice under its own target; the cost is paid later in contacts that never happen, alerts for sold items and scams in the inbox, where no project budget records it. A feed with no contract for absence produces Ghost Inventory downstream, and a vanity metric licenses Multiplier Creep.\n\n**Supporting claims**\n\n- **W1** — Listing systems lose liquidity through fifteen recurring patterns, each recognizable by observable warning signs, so a team can name the one in front of it.\n- **W2** — Each pattern begins as a locally reasonable decision under one team's target, so it is explained by its mechanism (incentives, ownership gaps, missing contracts, the wrong metric), not by blame.\n- **W3** — Each pattern's cost lands as lost liquidity, trust, speed and money, far from the project that caused it, and the public record documents that cost where anyone has published it.\n- **W4** — The patterns travel in chains that start at a missing contract, a vanity metric or a hand-off nobody owns, so a downstream fix returns unless the chain is broken at its origin.\n- **W5** — Each pattern has a remedy direction, a first indicator to measure and chapters that address it, so a reader can go from a named pattern to the place in the book that fixes it.\n\n## Role in the part\n\nGives the book its shared names for failure, so every chapter can open by naming the patterns it works on. Supports PF-2 of part `preface`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `grouping` in Fifteen Patterns to Recognize: four families in pipeline order, data (the way in and the copies), marketplace (where buyers meet listings), portfolio and measurement (beneath every stage).; `problem_solution` in Each pattern's seven units: quote, signs, mechanism, cost, illustration, then remedy and chapters.)\n\nEach section uses what the one before supplied. The chains need every pattern's name and mechanism; the indicators are read 'with the mechanism in mind' and serve the chains' advice to look upstream; the matrix uses the column codes of names the reader now knows and sits beside the indicators as the second per-pattern reference; the closing habits ask the reader to pair each pattern with its indicator and to look upstream, so they need both. The indicators come before the matrix because they confirm which pattern is active, and the matrix then says where to read about it. With the chains first, the reader would meet fifteen names linked by arrows before knowing any of them; with the matrix before the patterns, its codes would be unreadable.\n\n## Introduction\n\n**Hook** (`intriguing_example`): Sold bikes stay in alert e-mails. One flat appears three times. A dealer's stock vanishes overnight. A ranking boost added in 2021 is still there, and nobody can say what it costs.\n\n**Bridge:** The introduction's liquidity machine, which turns fresh, trustworthy supply into matches, and the symptoms readers see in their own marketplaces. → Those symptoms are losses of coherence that recur as fifteen named patterns.\n\n**Thesis statement** (KEY POINTS callout (all three bullets) and paragraph p005.): Most patterns are the residue of locally reasonable decisions by teams accountable for one stage, and they accumulate into chains that start at a missing contract, a vanity metric or a hand-off nobody owns.\n\n**Roadmap** (Paragraph p006, after Figure 1.):\n\n- Describe the fifteen patterns in four families, each with signs, mechanism, cost, illustration, remedy and chapters. *Kept in:* patterns.\n- Show the chains between the patterns. *Kept in:* chains.\n- Give the first indicator to ask for each pattern. *Kept in:* indicators.\n- Map the chapters that address each pattern. *Kept in:* matrix.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p001 | context | The introduction's liquidity machine turns fresh, trustworthy supply into matches, and this page names the ways that machine loses liquidity so the rest of the book can point back to them. |  |  |\n| p002 | example | Such a machine rarely fails dramatically; what fails is coherence, seen in sold bikes in alert e-mails, one flat listed three times, a dealer's stock vanishing overnight and a 2021 ranking boost nobody can price. | example: Sold bikes stay in alert e-mails; one flat appears three times; a dealer's stock vanishes overnight; a ranking boost added in 2021 is still there and nobody can say what it costs. | `contrast`: The machine and its liquidity. → How it fails: slowly, by losing coherence, not dramatically. |\n| p003 | claim | The page names the fifteen failure patterns seen most often, as shorthand that lets a review move straight to mechanism and remedy and that every chapter's opening callout links back to. |  | `problem_solution`: The symptoms of lost coherence. → Names for them, used across the book. |\n| p004 | description | Each pattern is described the same way: a role's quote, the warning signs, the mechanism, the cost with a public example where one exists, a fictional Veldmark illustration, the remedy direction and the chapters. |  | `elaboration`: The fifteen names. → The fixed anatomy of each description, and what is invented. |\n| p005 | claim | None of the patterns implies incompetence: most are the residue of reasonable decisions by teams accountable for one stage, and they accumulate into chains that start at a missing contract, a vanity metric or a hand-off nobody owns; no team accountable for one stage sees a whole chain, which is why they need a name and an owner. | figure: Figure 1: three engineers each make a small sensible change; together the changes jam the listing conveyor. | `elaboration`: The mechanism named in each description. → What the mechanisms have in common: locally reasonable decisions, accumulating in chains. |\n| p006 | transition | The page first describes the fifteen patterns in four families, then shows the chains between them, gives the first indicator to ask for each, maps the chapters that address each, and ends with how to use the names. |  | `sequence`: The thesis. → The order of the page. |\n\n## Sections\n\n### Fifteen Patterns to Recognize\n\n**Controlling idea** (`description`, id `patterns`): Each of the fifteen patterns has warning signs, a mechanism rooted in one team's reasonable choice, a cost in liquidity, trust, speed and money, a remedy direction and chapters that address it.\n\n**Advances the thesis** (W1, W2, W3, W5): Establishes each pattern's signs, mechanism, cost and remedy.\n\n**Transition in:** `elaboration`: The names and the roadmap. → The families, then each pattern in turn.\n\n**Order of paragraphs** (`grouping`): Families in pipeline order let the reader place each pattern in the machine before its details; within a pattern the fixed anatomy moves from symptom to cause to cost to remedy, so every description can be compared with the others. Within the data family the order follows the pipeline: the tree that frames every listing, then Feed Roulette, the way most professional supply enters, before the three patterns it feeds (The Attribute Junkyard, Ghost Inventory, Seeing Double), then the index built from all of them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p007 | description | The fifteen patterns fall into four families, data, marketplace, portfolio, and measurement and control, and each has a one-line warning sign. | table: Table of the fifteen patterns with one warning sign each. |  |\n| p008 | description | The families strike at different points of the pipeline: the data family on the way in and in published copies, the marketplace family where buyers meet listings, and the portfolio and measurement families underneath every stage. | figure: Figure 2: where each pattern strikes along the liquidity pipeline. | `elaboration`: The four families. → Where along the pipeline each family strikes. |\n| p009 | definition | Costs are described along four dimensions: liquidity, trust, speed and cost (money spent or refunded). |  | `sequence`: The families and where they strike. → How their costs will be measured. |\n| p010 | example | A category product manager's promise of a new category 'in about six weeks, once search, SEO and the app team have each done their part' shows a delay accepted as normal. | quotation: \"We can have the new category live in about six weeks...\" (a category product manager), with Figure 3: the category tree wired into six consumers while an E-bikes leaf waits six weeks. | `sequence`: The four cost dimensions. → The next pattern, The Category Straitjacket, opened by a role's quote and its figure. |\n| p011 | description | In a straitjacketed marketplace category identifiers are hard-coded in every consumer and the tree is not versioned, so a new leaf takes weeks, catch-all leaves grow and country trees drift. |  | `elaboration`: The quote. → What The Category Straitjacket looks like and its observable signs. |\n| p012 | cause_effect | Hard-coding the first tree was cheap when it rarely changed, but every consumer copied its identifiers and a category is really a schema key, so with no owner of the taxonomy as versioned reference data no one designs change as a migration. |  | `cause_effect`: The signs. → The incentives and ownership gaps that produce them. |\n| p013 | evidence | The Straitjacket costs liquidity, trust, speed and money, and even a well-run marketplace pays heavily for one large re-categorization. | source: Mercari (2024) re-assigned more than 3 billion items and estimated that LLM labeling of all of them would cost about US$1 million and take about 1.9 years, so it labeled a sample and propagated labels with a nearest-neighbor model. | `cause_effect`: The mechanism. → What it costs, with dated public evidence. |\n| p014 | example | Tradeyard's four country trees and six-week lead time make the November 2027 bikes split a large migration, after which a new leaf takes two days. | scenario: Four trees of 1,420, 1,380, 980 and 760 leaves; six weeks per category; bikes in 19 leaves with about 640,000 listings; the 1 November 2027 split re-classifies about 410,000 listings, rewrites about 1.3 million saved searches, needs about 2,300 redirects and 2,900 landing pages; Fatbikes added in two days a month later. The taxonomy service is introduced as part of the shared platform Veldmark's consolidation program builds (told under Deal-Shaped Architecture). | `example`: The cost. → A fictional Veldmark illustration with ledger figures. |\n| p015 | recommendation | The remedy is to treat the taxonomy as versioned reference data with one owner, referenced by stable identifier, changed through published mappings and a tested migration runbook. |  | `problem_solution`: The illustrated failure. → The direction of the fix. |\n| p016 | description | Five chapters address the Straitjacket: the versioned tree and runbook, attributes tied to categories, query classifiers, the redirect registry and vertical trees. |  | `elaboration`: The remedy direction. → The chapters that carry it out. |\n| p038 | example | An on-call engineer's 'The dealer's file looked fine last night. We'll find out what happened when support opens' shows that nobody checks a feed before it changes live stock. | quotation: \"The dealer's file looked fine last night...\" (an ingestion on-call engineer), with Figure 4: a truncated file unpublishing 38,400 Motorvane listings at 02:40. | `sequence`: The chapters that address The Category Straitjacket. → The next pattern, Feed Roulette, the way most professional supply comes in, opened by a role's quote and its figure. |\n| p039 | description | Feed Roulette is ingesting professional and partner feeds without a feed contract, so records skip validation, writes are not idempotent, partners get no error report and nothing guards a truncated file. |  | `elaboration`: The quote. → What Feed Roulette looks like and its observable signs. |\n| p040 | cause_effect | Feeds are integrated one partner at a time as code adapters, rejecting a paying customer's data feels risky, full snapshots are easy and dangerous, error reporting has no owner and vendors do the minimum. |  | `cause_effect`: The signs. → The incentives and ownership gaps that produce them. |\n| p041 | evidence | Feed Roulette loses the professional stock that is most of the supply in automotive and real estate, and because dealers multi-home, lost confidence moves stock to competitors; public partner APIs show the remedy. | quotation: Bundeskartellamt (2026): \"many platforms offer dealers data export to other platforms\"; dealer multi-homing treated as a competitive constraint.; source: mobile.de's Seller API makes creation idempotent through an insertion request ID, answers a retry with 303 to the existing ad, and returns stable error keys; RFC 9457 standardizes problem details. | `cause_effect`: The mechanism. → What it costs, with dated public evidence. |\n| p042 | example | Truncated files for 286 Motorvane dealers unpublish 38,400 listings overnight, a fifth return with new identifiers, and a few Hearthly vendors cause most incidents. | scenario: Monday 8 March 2027, 02:40 CET: files for 286 dealers; 38,400 listings unpublished by 02:55, about 1,900 with paid top placements; complete files at 09:40; a fifth back with new identifiers; more than 600 support calls; about 30 of 160 Hearthly vendors cause most incidents. | `example`: The cost. → A fictional Veldmark illustration with ledger figures. |\n| p043 | recommendation | The remedy is a contract for every channel: an envelope, schema versions, stable error codes, per-run reports, stable keys, a mass-change guard and reconciliation. |  | `problem_solution`: The illustrated failure. → The direction of the fix. |\n| p044 | description | Five chapters address Feed Roulette: feed contracts and guards, shared validation, integration partners, partner error views and automotive dealer APIs. |  | `elaboration`: The remedy direction. → The chapters that carry it out. |\n| p017 | example | A feed-integration engineer's 'put it in the extra-fields column for now; we'll clean the data up after launch' shows the shortcut that fills the Junkyard. | quotation: \"Just put it in the extra-fields column for now...\" (a feed-integration engineer), with Figure 5: fuel under four spellings, so a petrol filter finds one car. | `sequence`: The chapters that address Feed Roulette. → The next pattern, The Attribute Junkyard, opened by a role's quote and its figure. |\n| p018 | description | In the Junkyard attributes are free-form keys with no attribute dictionary, so one fact arrives under several keys and filters, facets and feeds disagree. |  | `elaboration`: The quote. → What The Attribute Junkyard looks like and its observable signs. |\n| p019 | cause_effect | Flexible storage makes a new key free, every team and feed adds its own, a straitjacketed tree pushes new facts into free keys, the channels validate differently, nobody owns the dictionary, and generative assistants now add keys faster than sellers. |  | `cause_effect`: The signs. → The incentives and ownership gaps that produce them. |\n| p020 | evidence | The Junkyard hides listings from filters and blocks attribute-based rules, and while no marketplace has measured its own junkyard, eBay's public taxonomy API shows what the remedy looks like. | source: eBay's Taxonomy API publishes per leaf category each aspect's data type, requiredness, controlled or free values, cardinality and an expectedRequiredByDate for new mandatory aspects. | `cause_effect`: The mechanism. → What it costs, with dated public evidence. |\n| p021 | example | Tradeyard's 3,900 attribute keys, most of them rarely used, mean a frame-size filter hid three quarters of Dutch bikes. | scenario: 3,900 keys in 2026, 41% used on fewer than 0.1% of listings; about 610 worth promoting to typed index fields in 2027; frame size present on 23% of Dutch bike listings before the extraction pilot. The search platform is named as the group's new shared one (pointer to The Forced Fit). | `example`: The cost. → A fictional Veldmark illustration with ledger figures. |\n| p022 | recommendation | The remedy is one attribute dictionary per vertical, the same validation on every channel, provenance on every value, and deliberate promotion and retirement of keys. |  | `problem_solution`: The illustrated failure. → The direction of the fix. |\n| p023 | description | Five chapters address the Junkyard: the dictionary, normalization with provenance, category-scoped schemas, typed index fields and constrained AI assistants. |  | `elaboration`: The remedy direction. → The chapters that carry it out. |\n| p024 | example | A listing-service engineer's 'It's marked sold in the database. Whatever the alert e-mail said this morning isn't our service' shows that each team owns only its own copy. | quotation: \"It's marked sold in the database...\" (a listing-service engineer), with Figure 6: Femke's bike leaves search a minute after it sells but goes to 214 users in the next morning's digest. | `sequence`: The chapters that address The Attribute Junkyard. → The next pattern, Ghost Inventory, opened by a role's quote and its figure. |\n| p025 | description | Ghost Inventory is sold, expired or removed listings that stay visible in search, carousels, alert digests, caches, SEO pages, partner feeds and contact buttons, and nobody can state removal latency beyond the search index. |  | `elaboration`: The quote. → What Ghost Inventory looks like and its observable signs. |\n| p026 | cause_effect | Removal is the change teams design least: publication gets a pipeline and a target, unpublication gets a flag, each consumer copies state on its own schedule, feeds omit deletes and offline sellers never mark items sold. |  | `cause_effect`: The signs. → The incentives and ownership gaps that produce them. |\n| p027 | evidence | Ghosts waste contacts and alerts, look like scams and charge professionals for dead leads, and although no marketplace publishes a ghost rate, downstream channels already punish staleness. | quotation: Google's job-posting guidance: \"Failure to take timely action on expired jobs may result in a manual action\".; fact: Google Merchant Center expires product data 30 days after its last refresh. | `cause_effect`: The mechanism. → What it costs, with dated public evidence. |\n| p028 | example | Femke's bike, listed on a Sunday evening and sold the next day, is removed from search within a minute yet still reaches 214 users the next morning, and an audit finds about 41,000 Dutch ghosts a week. | scenario: Listed on the evening of Sunday 7 March 2027; sold on Monday 8 March 2027 at 18:10, removed from search at 18:11; the evening digest, already built on Monday at 17:30 before the sale from a replica snapshot, goes to 214 users at 07:00 on Tuesday; about 41,000 Dutch listings a week still in a downstream copy 24 hours after ending; at Motorvane the Essen Golf's removal arrives 26 hours late and three enquiries arrive in between. | `example`: The cost. → A fictional Veldmark illustration with ledger figures. |\n| p029 | recommendation | The remedy is to make removal a lifecycle event with a latency objective per registered consumer, re-check availability at send time, reconcile feeds and serve correct status codes for gone pages. |  | `problem_solution`: The illustrated failure. → The direction of the fix. |\n| p030 | description | Seven chapters address Ghost Inventory, from removal objectives and ordered events to staleness budgets on read models (copies of listing data shaped for one consumer), alert re-checks, feed reconciliation, gone pages and serving-time filters. |  | `elaboration`: The remedy direction. → The chapters that carry it out. |\n| p031 | example | A real-estate product owner's 'Three agencies hold the mandate, so three listings is correct. Isn't it?' shows a duplicate defended as correct. | quotation: \"Three agencies hold the mandate...\" (a real-estate portal product owner), with Figure 7: one Lyon flat at €389,000 arriving three times and stacking three pins on one building. | `sequence`: The chapters that address Ghost Inventory. → The next pattern, Seeing Double, opened by a role's quote and its figure. |\n| p032 | description | Seeing Double is the same item or property appearing many times, from reposts, two channels, several agencies holding a mandate, or stolen photos. |  | `elaboration`: The quote. → What Seeing Double looks like and its observable signs. |\n| p033 | cause_effect | Duplicates are rewarded, feeds lack stable keys, and nobody owns showing a thing once because deduplication looks cosmetic rather than like entity resolution, with abusive and legitimate duplicates mixed up. |  | `cause_effect`: The signs. → The incentives and ownership gaps that produce them. |\n| p034 | evidence | Duplicates split demand, inflate supply, hide fakes and multiply processing, and property portals productize the presentation problem. | source: In 2021 Idealista launched a duplicate-control tool that groups listings of one property, including those on other portals, and notifies users of price changes, removals and new duplicates (trade-press report). | `cause_effect`: The mechanism. → What it costs, with dated public evidence. |\n| p035 | example | Hearthly France has 1.7 listings per property, one Lyon flat arrives three times, and photo-match alerts on stolen photos are closed as legitimate duplicates. | scenario: 1.9 million listings for about 1.12 million properties in 2026; a 68 m² Lyon flat at €389,000 from three agencies through two vendors and Keybridge in May 2027; 11 photo-match alerts in the Barcelona ring closed as legitimate duplicates. | `example`: The cost. → A fictional Veldmark illustration with ledger figures. |\n| p036 | recommendation | The remedy is to separate abusive duplicates, which go to enforcement, from legitimate ones, which are clustered and shown once, with cluster identity kept outside the index and the representative chosen by quality. |  | `problem_solution`: The illustrated failure. → The direction of the fix. |\n| p037 | description | Six chapters address Seeing Double: matching and clustering, perceptual hashes, precise location, repeated partner records, map clustering and stolen photos as fraud. |  | `elaboration`: The remedy direction. → The chapters that carry it out. |\n| p045 | example | A search engineer's 'Don't touch the Solr collection. Some of those fields only exist there' shows an index that has become the only copy. | quotation: \"Don't touch the Solr collection...\" (a search engineer), with Figure 8: teams writing counters and fixes into Solr, and a Sunday reindex pushing p99 latency to about 7 seconds. | `sequence`: The chapters that address Seeing Double. → The next pattern, Search as System of Record, opened by a role's quote and its figure. |\n| p046 | description | A system of record is the one authoritative copy from which other copies are rebuilt; when search becomes it, the index holds data that exists nowhere else, 'published' means 'in the index', other services query it, and a rebuild is an event or impossible. |  | `elaboration`: The quote. → What Search as System of Record looks like and its observable signs. |\n| p047 | cause_effect | The index is the fastest complete view, so teams write counters, enrichment, flags and fixes into it directly, skipping the system of record, and no event stream carries enough to rebuild it. |  | `cause_effect`: The signs. → The incentives and ownership gaps that produce them. |\n| p048 | evidence | An index that cannot be rebuilt degrades search at peaks, cannot explain missing listings and blocks schema and engine change, while rebuilding from an event stream is a documented alternative. | source: eBay Kleinanzeigen (2019) rebuilt its Elasticsearch cluster, then more than 34 million live ads, from a compacted Kafka topic in under 30 minutes, for recovery and schema changes. | `cause_effect`: The mechanism. → What it costs, with dated public evidence. |\n| p049 | example | A Sunday-evening reindex into Tradeyard's live Solr pushes p99 latency to about 7 seconds, and the review finds Yardstick writing millions of updates a day straight into Solr. | scenario: Sunday 17 January 2027, 20:35 CET: p99 from about 400 ms to about 7 seconds for 48 minutes, about 9% of searches failing; about 9 million Solr updates a day, about 6.4 million of them view counters; 'published' defined as 'present in Solr'. | `example`: The cost. → A fictional Veldmark illustration with ledger figures. |\n| p050 | recommendation | The remedy is to treat the index as a read model rebuilt from the system of record and its events, keep unique data out of it, drill rebuilds and put a contract in front of the engine. |  | `problem_solution`: The illustrated failure. → The direction of the fix. |\n| p051 | description | Six chapters address Search as System of Record: the rebuildable index, the record-versus-read-model split, the replayable stream, 'published' defined outside the index, rebuilds off peak and the owner of listing truth. |  | `elaboration`: The remedy direction. → The chapters that carry it out. |\n| p052 | example | A monetization product manager's 'It's only a small multiplier' shows how each boost looks harmless on its own. | quotation: \"It's only a small multiplier...\" (a monetization product manager), with Figure 9: five paid layers since 2016 leave paid listings with 38% of Tradeyard Netherlands' first-page positions. | `sequence`: The chapters that address Search as System of Record. → The next pattern, Multiplier Creep, opened by a role's quote and its figure. |\n| p053 | description | Multiplier Creep is visibility products implemented as uncapped multipliers, re-dated timestamps and reserved slots, until the default sort turns into a price list. |  | `elaboration`: The quote. → What Multiplier Creep looks like and its observable signs. |\n| p054 | cause_effect | Monetization sells visibility against a revenue target while another team owns relevance, neither owns the trade-off, boosts are never reviewed together and buyer-randomized tests miss the cost to sellers. |  | `cause_effect`: The signs. → The incentives and ownership gaps that produce them. |\n| p055 | evidence | Creep degrades relevance and organic exposure and carries legal risk in the EU, while two public designs rank paid listings under relevance instead of multiplying scores. | quotation: Omnibus Directive (EU) 2019/2161, Annex I point 11a, since 28 May 2022: undisclosed paid ranking is always unfair; P2B Regulation (EU) 2019/1150, since 12 July 2020, requires disclosure of main ranking parameters (repeal proposed November 2025).; source: eBay (2020) ranks promoted listings with organic results so the top can show no ads; OLX (2025) uses a separate 'VAS LTR' objective balancing relevance and paid visibility. | `cause_effect`: The mechanism. → What it costs, with dated public evidence. |\n| p056 | example | Tradeyard's five paid layers took paid listings to 38% of the first page while contacts fell, and a capped ranking policy with a relevance floor reversed most of it at a small revenue cost. | scenario: Layers in 2016, 2019, 2021 (×1.8), 2023 and 2025 (×1.3); paid share 12% in 2021 to 38% in 2026; sessions with a contact 10.6% to 9.4%; new private listings without contact in 48 hours 24% to 33%; policy v1 (relevance floor, at most four paid in the top 20) tested cluster-randomized before launch: in the test paid share 17%, sessions with a contact 9.9%, visibility revenue per search down 2.5%; live on 1 December 2027 (told in that order). | `example`: The cost. → A fictional Veldmark illustration with ledger figures. |\n| p057 | recommendation | The remedy is to carry paid effects as bounded fields, place paid listings under a relevance floor with caps, test with two-sided guardrails and label paid placement everywhere. |  | `problem_solution`: The illustrated failure. → The direction of the fix. |\n| p058 | description | Six chapters address Multiplier Creep: paid-organic blending, the liquidity-revenue tension, explicit paid effects, sponsored units, two-sided experiments and disclosure duties. |  | `elaboration`: The remedy direction. → The chapters that carry it out. |\n| p059 | example | A growth lead's 'Launch the category first. Trust and safety can add a queue once we see what comes in' shows safety deferred behind launch. | quotation: \"Launch the category first...\" (a growth lead), with Figure 10: alerts fan new listings out before any risk check, and the review queue sits behind publication. | `sequence`: The chapters that address Multiplier Creep. → The next pattern, Moderation as an Afterthought, opened by a role's quote and its figure. |\n| p060 | description | Moderation as an Afterthought is trust and safety added after launch as a queue: checks only at creation, image checks after going live, alerts before any risk check, and DSA statements of reasons produced after the fact. |  | `elaboration`: The quote. → What Moderation as an Afterthought looks like and its observable signs. |\n| p061 | cause_effect | Trust and safety is treated as a cost center while launches belong to growth teams, serial checks slow publication, policies are unversioned and regulation is treated as reporting. |  | `cause_effect`: The signs. → The incentives and ownership gaps that produce them. |\n| p062 | evidence | Afterthought moderation delivers fraud fast and slows honest listings, and its gaps are visible from outside, as a French court and a UK consumer test showed. | case: December 2015: a Paris court found leboncoin's claim that all ads passed validation misleading, while confirming its hosting-provider status.; case: December 2024: Which? found Gumtree blocked a first scam ad but edited versions passed review 'in minutes'. | `cause_effect`: The mechanism. → What it costs, with dated public evidence. |\n| p063 | example | Tradeyard's sampled prevalence of violating listings is three times the assumed rate, a phishing rule takes days to reach one country and never reaches two, and a fake-rental ring triggers tens of thousands of alerts. | scenario: 94% of decisions automated, 6% (about 138,000 a week) to human review, about 210 moderators; sampled prevalence about 0.6% against an assumed 0.2%; median time to action 3 hours 10 minutes; the phishing link that reaches Femke in chat on the evening of Sunday 7 March, told here first in one sentence (Fast Mail for Fraudsters, next, tells how it got through), then the rule written that evening, in Belgium on Wednesday with the next Yardstick deploy, never in Poland or Portugal; 180 Barcelona listings produce about 41,000 alert notifications. | `example`: The cost. → A fictional Veldmark illustration with ledger figures. |\n| p064 | recommendation | The remedy is trust and safety as a platform inside the flow: risk-tiered parallel checks, re-scoring on edit, a gate before alerts, enforcement as events, recorded statements of reasons and sampled prevalence. |  | `problem_solution`: The illustrated failure. → The direction of the fix. |\n| p065 | description | Seven chapters address the pattern: the moderation pipeline, risk tiers, the alert gate, DSA records, verification, image screening and AI-assisted flows. |  | `elaboration`: The remedy direction. → The chapters that carry it out. |\n| p066 | example | A messaging-team lead's 'Messaging is a delivery problem. Fraud is for trust and safety, once users report it' shows delivery and safety owned apart. | quotation: \"Messaging is a delivery problem...\" (a messaging-team lead), with Figure 11: a fake payment link from a domain registered that day reaches Femke at 20:11 and only her report stops it. | `sequence`: The chapters that address Moderation as an Afterthought. → The next pattern, Fast Mail for Fraudsters, opened by a role's quote and its figure. |\n| p067 | description | Fast Mail for Fraudsters is chat built for speed alone: instant links, no domain-age check, anyone may message anyone, payment off the platform and user reports as the only control. |  | `elaboration`: The quote. → What Fast Mail for Fraudsters looks like and its observable signs. |\n| p068 | cause_effect | In contact-ending models money moves off the platform and fraud closes in the conversation, messaging teams are measured on delivery, privacy concerns stop scanning, and identity is checked at sign-up rather than first contact. |  | `cause_effect`: The signs. → The incentives and ownership gaps that produce them. |\n| p069 | evidence | Inbox fraud makes sellers and buyers wary and pushes platforms toward reimbursement, as UK bank data shows, while platforms that fight back act before delivery. | statistic: UK Finance (2026): 175,809 purchase-scam cases and £118.1 million of losses in 2025, 71% of authorised push payment scam cases; a call to legislate seller verification (a lobbying position as of October 2026).; source: OLX (2026): fraudulent images are about 30% of fraud cases in Poland, and suspicious chat images are blocked before reaching users. | `cause_effect`: The mechanism. → What it costs, with dated public evidence. |\n| p070 | example | On the evening she lists her bike, a fake Safe Deal link reaches Femke because its domain was registered that day, only her report stops it, and Tradeyard receives about 41,000 such reports a year. | scenario: Sunday 7 March 2027: 14 conversations in 24 hours; fake link at 20:11, delivered because nothing checks domain age; report at 20:19; suspension at 20:26; a new rule then withholds 37 similar messages; about 41,000 payment-link phishing reports in the Netherlands and Belgium in 2026. | `example`: The cost. → A fictional Veldmark illustration with ledger figures. |\n| p071 | recommendation | The remedy is safety in the delivery path: tokenized links, domain-age checks, contextual warnings, held first contacts, step-up verification and protected payment where the model allows. |  | `problem_solution`: The illustrated failure. → The direction of the fix. |\n| p072 | description | Five chapters address the pattern: safety scanning, risk scoring, first-contact identity, protected payment and why contact-ending models concentrate fraud. |  | `elaboration`: The remedy direction. → The chapters that carry it out. |\n| p073 | example | A group product director's 'Poland has its own release train' shows a fix that stops at a country border. | quotation: \"Poland has its own release train...\" (a group product director), with Figure 12: the March 2027 anti-phishing rule reaches the Netherlands on Sunday, Belgium on Wednesday, and Poland and Portugal never. | `sequence`: The chapters that address Fast Mail for Fraudsters. → The next pattern, The Copy-Paste Country, opened by a role's quote and its figure. |\n| p074 | description | The Copy-Paste Country is each market running its own copy of the code or reference data, so improvements are built several times or not at all and versions drift. |  | `elaboration`: The quote. → What The Copy-Paste Country looks like and its observable signs. |\n| p075 | cause_effect | Copying a working site was the fastest market entry, local autonomy is a real strength, and nobody was funded to build the configuration design sharing needs. |  | `cause_effect`: The signs. → The incentives and ownership gaps that produce them. |\n| p076 | evidence | Copies cost speed, money, safety and the features small markets cannot afford, and the public record of two groups shows the pattern and its price. | quotation: Adevinta Annual Report 2019: local autonomy as \"one of our historic success formulas\"; Adevinta Tech Blog (2024): in 2021 its 22 marketplaces used ten A/B testing tools.; source: OLX (2025): learning-to-rank projects across teams caused \"duplicated efforts\" and were centralized with brand-level configuration. | `cause_effect`: The mechanism. → What it costs, with dated public evidence. |\n| p077 | example | Tradeyard's four countries share a brand but run four trees, two search engines and their own address handling, and one phishing rule shows the cost in a week. | scenario: Trees of 1,420, 1,380, 980 and 760 leaves; Solr in the Netherlands, Belgium and Portugal, Elasticsearch in Poland; the March 2027 rule in the Netherlands on Sunday, Belgium on Wednesday, never Poland or Portugal. | `example`: The cost. → A fictional Veldmark illustration with ledger figures. |\n| p078 | recommendation | The remedy is one codebase per capability with country differences as configuration, local policy kept local, and good local inventions harvested into the platform. |  | `problem_solution`: The illustrated failure. → The direction of the fix. |\n| p079 | description | Six chapters address the pattern: tenancy and configuration, harmonized trees, one place model, country rules as configuration, where copying came from and two groups working out of it. |  | `elaboration`: The remedy direction. → The chapters that carry it out. |\n| p080 | example | A corporate-development lead's 'Let's not touch their stack for now' shows integration deferred without an end date. | quotation: \"They're profitable and the deal closed last month...\" (a corporate-development lead), with Figure 13: four identity systems, four trust-and-safety stacks and three warehouses, so a phisher banned on one brand stays active on another. | `sequence`: The chapters that address The Copy-Paste Country. → The next pattern, Deal-Shaped Architecture, opened by a role's quote and its figure. |\n| p081 | description | Deal-Shaped Architecture is acquired marketplaces keeping their whole stacks indefinitely, so the group pays for every capability several times and cannot answer group-level questions. |  | `elaboration`: The quote. → What Deal-Shaped Architecture looks like and its observable signs. |\n| p082 | cause_effect | Deal teams protect revenue, acquired leaders are rewarded for their own growth, synergy cases do not fund a sequence, and competition remedies can forbid integration. |  | `cause_effect`: The signs. → The incentives and ownership gaps that produce them. |\n| p083 | evidence | Kept stacks cost money, cross-brand fraud defense, speed and cross-brand features, and the size of the prize is public. | statistic: Adevinta's June 2021 completion of the eBay Classifieds Group acquisition targeted run-rate cost synergies of €130–165 million after three years; its later consolidation of ten experimentation tools shows the work involved. | `cause_effect`: The mechanism. → What it costs, with dated public evidence. |\n| p084 | example | Veldmark enters 2027 with four of everything, dealers paying twice and a phisher no system connects, and Common Ground is funded to reduce the run cost. | scenario: Four identity systems, four trust-and-safety stacks, three search engines, three clouds, four product catalogs, three warehouses; about 2,900 Polish dealers on both brands, about 40% paying both; Common Ground approved January 2027 with €140 million for 2027–2030, targeting €38 million a year. | `example`: The cost. → A fictional Veldmark illustration with ledger figures. |\n| p085 | recommendation | The remedy is a dated, owned decision per capability to keep, share or replatform, generic capabilities first and product surfaces last, with shared services kept separable. |  | `problem_solution`: The illustrated failure. → The direction of the fix. |\n| p086 | description | Seven chapters address the pattern: the consolidation sequence, the capability map, one identity, one catalog model, shared definitions, separability over a decade and the public record of one large integration. |  | `elaboration`: The remedy direction. → The chapters that carry it out. |\n| p087 | example | A central platform director's 'The group platform is the standard from the first quarter' shows adoption by decree. | quotation: \"The group platform is the standard from the first quarter...\" (a central platform director), with Figure 14: a list-shaped search platform would have missed Hearthly, where 61% of French search sessions open the map. | `sequence`: The chapters that address Deal-Shaped Architecture. → The next pattern, The Forced Fit, opened by a role's quote and its figure. |\n| p088 | description | The Forced Fit is a central platform imposed on markets it was not designed for, adopted on paper and routed around in practice. |  | `elaboration`: The quote. → What The Forced Fit looks like and its observable signs. |\n| p089 | cause_effect | Synergy pressure makes a mandate look fastest, the platform is shaped by its first tenant, sharing infrastructure is confused with sharing product, and the platform team is rewarded for migrations. |  | `cause_effect`: The signs. → The incentives and ownership gaps that produce them. |\n| p090 | evidence | Forced platforms stall roadmaps, degrade vertical features and double the bill, and the public record shows mandates that reversed alongside one platform adopted voluntarily. | source: eBay's Product-Based Shopping Experience required catalog association from 2018; eBay's documentation says the mandate was rolled back, without a date.; quotation: Adevinta's 2023 annual report planned \"a unified global platform\"; its 2025 strategic report describes \"a decentralised, standalone operating model\"; completion is not publicly documented and the change followed a new owner.; source: A 2020 talk described Adevinta's platform-as-a-service reaching about 1,500 engineers through voluntary adoption. | `cause_effect`: The mechanism. → What it costs, with dated public evidence. |\n| p091 | example | Hearthly's map-heavy search shows what a list-shaped shared platform would miss, so the geo query compiler becomes part of the shared platform and the ML decision follows the same reasoning. | scenario: September 2027 decision; 61% of French sessions open the map; about 2,700 of 4,200 peak requests per second are map requests; drawn areas median 146 vertices; November 2027 ML decision: one registry, Hearthly keeps Vertex AI and Keybridge Azure Machine Learning until the golden path is better. | `example`: The cost. → A fictional Veldmark illustration with ledger figures. |\n| p092 | recommendation | The remedy is platforms run as products with earned adoption, mandates only for narrow contracts, sharing platforms not products, and vertical differences as configuration. |  | `problem_solution`: The illustrated failure. → The direction of the fix. |\n| p093 | description | Eight chapters address the pattern: shared cores, platform teams, adoption sequence, what verticals share, two platforms built to be adopted, the long-term split, and two cases that test the pendulum. |  | `elaboration`: The remedy direction. → The chapters that carry it out. |\n| p094 | example | A general manager's 'Live listings are up eight percent and sessions are at a record' shows activity read as health. | quotation: \"Live listings are up eight percent...\" (a marketplace general manager), with Figure 15: live listings rise while Tradeyard's contact index falls from 100 to 37. | `sequence`: The chapters that address The Forced Fit. → The next pattern, Vanity Liquidity, opened by a role's quote and its figure. |\n| p095 | description | Vanity Liquidity is reporting activity such as listings, visits and messages sent instead of outcomes such as qualified contacts per listing and time to first contact. |  | `elaboration`: The quote. → What Vanity Liquidity looks like and its observable signs. |\n| p096 | cause_effect | Activity metrics are easy to count and sit in one team's system, while outcome metrics need joins and agreed definitions, and the classifieds transaction is often invisible. |  | `cause_effect`: The signs. → The incentives and ownership gaps that produce them. |\n| p097 | evidence | Measuring activity approves noise over matches and sells exposure that does not convert, and two OLX posts show both the alternative and the trap. | source: OLX (2022) trained ranking on seller contacts and checked that unique contacted sellers rose; OLX (2026) found naive comparisons understated boost packages that matched estimates, validated by an A/B test, put at 17.6% to 97.4% uplift. | `cause_effect`: The mechanism. → What it costs, with dated public evidence. |\n| p098 | example | Veldmark's brands count contacts three ways, a common definition cuts Tradeyard's index to 37, and a bump price approved on a one-sided test lost contacts per bump, for a reason never established. | scenario: Three definitions in March 2027; qualified contact v1.0 replay: Tradeyard's contact index (weekly contacts, 100 under the old definition) 100 to 37, Motorvane 86, Hearthly 106; Femke's 52 'contacts' (every message in her 14 conversations plus phone reveals) and 13 qualified; bumps up 48% in a seller-randomized test, control sellers' contacts per bump fell unwatched and the cause was never established, contacts per bump down 31% after rollout. A closing sentence states the lesson: the decision followed a number that did not measure matches, and a test that watched only the treated sellers missed the contacts the bumps were meant to bring. | `example`: The cost. → A fictional Veldmark illustration with ledger figures. |\n| p099 | recommendation | The remedy is governed liquidity metrics with owners, every objective naming the liquidity metric it protects, and experiments, models and products judged on qualified contacts and sales with two-sided guardrails. |  | `problem_solution`: The illustrated failure. → The direction of the fix. |\n| p100 | description | Eight chapters address the pattern: the liquidity metrics, the contact definition, outcome-based experiments, contact labels in ranking, revenue plans on contacts, qualified leads, model-specific outcomes and fitness functions. |  | `elaboration`: The remedy direction. → The chapters that carry it out. |\n| p101 | example | A dealer-support agent's 'Is this dealer allowed 150 cars or 163? It depends which service you ask' shows entitlements with no single answer. | quotation: \"Is this dealer allowed 150 cars or 163?...\" (a dealer-support agent), with Figure 16: 163 cars in the feed, 150 published, €117 overage billed for 13 never live. | `sequence`: The chapters that address Vanity Liquidity. → The next pattern, Billing by Guesswork, opened by a role's quote and its figure. |\n| p102 | description | Billing by Guesswork is entitlements checked ad hoc in many services with their own logic and paid flags stored on listings, so nobody can show sold versus delivered. |  | `elaboration`: The quote. → What Billing by Guesswork looks like and its observable signs. |\n| p103 | cause_effect | The first visibility product was a cheap listing flag, each later product added conditions where needed, and catalog, entitlements and billing belong to different teams and acquired brands. |  | `cause_effect`: The signs. → The incentives and ownership gaps that produce them. |\n| p104 | evidence | Guesswork overbills professionals, slows launches and lets paid effects leak into ranking, and although no failure is published, two portals' results show how precisely entitlements must be counted. | quotation: Rightmove (2026): \"more than 50% of independent agents purchased incremental product above their package commitment\" in 2025.; source: Autotrader (2026) explains revenue per retailer partly through a 'stock' lever, the number of paid vehicles advertised. | `cause_effect`: The mechanism. → What it costs, with dated public evidence. |\n| p105 | example | Motorvane bills a dealer overage for cars the importer never published, and an audit finds 1,140 dealers overbilled by about €212,000. | scenario: Pro 150: 150 slots and 20 boosts for €1,450 a month, €9 per car overage; Autohaus Ruhrblick's August 2027 feed of 163 cars; 150 published; €117 for 13 never published; October 2027 audit over 14 months: 1,140 dealers, about €212,000, all credited. | `example`: The cost. → A fictional Veldmark illustration with ledger figures. |\n| p106 | recommendation | The remedy is one service for products, entitlements and effects with an append-only ledger that every enforcement point reads, paid effects as events and billing from delivery. |  | `problem_solution`: The illustrated failure. → The direction of the fix. |\n| p107 | description | Six chapters address the pattern: the entitlement ledger, revenue-model requirements, which account holds a right, seller views of usage, sponsored placements in the same ledger and paid state kept off the listing. |  | `elaboration`: The remedy direction. → The chapters that carry it out. |\n| p108 | example | A data-science manager's 'The model has been running since 2021, and nobody has complained' shows silence taken as evidence of health. | quotation: \"The model has been running since 2021...\" (a data-science manager), with Figure 17: 146 production models, 23 without an owner and 41 without monitoring. | `sequence`: The chapters that address Billing by Guesswork. → The next pattern, Set-and-Forget AI, opened by a role's quote and its figure. |\n| p109 | description | Set-and-Forget AI is models making consequential decisions without evaluation sets, drift monitoring, prediction logs, owners or rollback, with uses that expand without new validation. |  | `elaboration`: The quote. → What Set-and-Forget AI looks like and its observable signs. |\n| p110 | cause_effect | Models ship as projects that end, governance platforms arrive after the models, uses expand quietly and adversaries make fraud labels stale. |  | `cause_effect`: The signs. → The incentives and ownership gaps that produce them. |\n| p111 | evidence | Unwatched models turn errors into losses and unexplainable decisions, and Zillow Offers shows what happens when a model built to inform is used to commit capital. | case: 2 November 2021: Zillow's board wound down Zillow Offers, citing 'home pricing unpredictability'; a $304.4 million write-down; about 25% workforce reduction; shareholder letter: 'We have been unable to accurately forecast future home prices'. | `cause_effect`: The mechanism. → What it costs, with dated public evidence. |\n| p112 | example | Veldmark's first model inventory finds unowned, unmonitored and irreproducible models, and a proposal to commit money on a valuation model built to inform is declined. | scenario: September 2027: 146 models on four stacks, 23 without an owner, 41 without monitoring, 12 not reproducible; 'Hearthly Direct' offers at 94% of Valuo's estimate declined. | `example`: The cost. → A fictional Veldmark illustration with ledger figures. |\n| p113 | recommendation | The remedy is one registry with owner, evaluation set, monitoring and rollback for every model, uses classified by decision tier, and re-validation when the use moves up a tier. |  | `problem_solution`: The illustrated failure. → The direction of the fix. |\n| p114 | description | Eight chapters address the pattern: the registry and tiers, ranking evaluation, adversarial drift, gated extraction, matcher evaluation, generative features, Zillow in context and automotive price ratings. |  | `elaboration`: The remedy direction. → The chapters that carry it out. |\n\n### How the Patterns Reinforce Each Other\n\n**Controlling idea** (`cause_effect`, id `chains`): The patterns travel in four common chains, which start at a missing contract, a vanity metric or a hand-off nobody owns, so breaking a chain at its origin holds where a downstream fix does not.\n\n**Advances the thesis** (W4): Argues the chain claim of the thesis.\n\n**Transition in:** `elaboration`: The fifteen patterns, each described alone. → How they feed each other.\n\n**Order of paragraphs** (`grouping`): The claim, then four chains from the way supply enters (supply) through what is sold (monetization) and what reaches the inbox (trust) to how the group is built (portfolio), then the roots they share. The roots paragraph comes last because it generalizes over the four chains; placed first, it would name origins before the reader has seen any chain.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p115 | claim | The patterns feed each other in chains, so a downstream fix brings the symptom back: the supply and monetization chains start at a missing contract or a vanity metric, the trust and portfolio chains where no one owns a hand-off, and every chain persists until someone owns it, so the lasting fix is a contract, an owner or a metric definition. | figure: Figure 18: the patterns form chains that trace back to a missing contract, a missing owner or the wrong metric. |  |\n| p116 | cause_effect | In the supply chain, Feed Roulette produces The Attribute Junkyard, Ghost Inventory and Seeing Double, so the chain is broken at the feed contract, not at the index. | scenario: At Veldmark the truncated-snapshot incident of 8 March 2027 (told under Feed Roulette) shows how fast the gap spreads: one cut-short delivery unpublished 38,400 cars in fifteen minutes and about a fifth came back under new listing identifiers.; figure: Figure 19: three teams mop three puddles while a contract gate at the inlet keeps the floor dry. | `example`: The claim that patterns form chains. → The first chain: supply. |\n| p117 | cause_effect | In the monetization chain, Vanity Liquidity and Billing by Guesswork license Multiplier Creep, so the remedy is a measurement change and an entitlement change, not a ranking rewrite alone. |  | `additional_support`: The supply chain. → The monetization chain. |\n| p118 | cause_effect | In the trust chain, Moderation as an Afterthought and Seeing Double deliver fakes into Fast Mail for Fraudsters, so controls earlier in the flow help more cheaply than inbox scanning. |  | `additional_support`: The monetization chain. → The trust chain. |\n| p119 | cause_effect | In the portfolio pendulum, The Copy-Paste Country and Deal-Shaped Architecture provoke The Forced Fit, whose shadow stacks recreate the duplication, and the way off is to share platforms, not products. |  | `additional_support`: The trust chain. → The portfolio pendulum. |\n| p120 | synthesis | Three patterns sit at the roots of the supply and monetization chains: Vanity Liquidity, a measurement failure, and Feed Roulette and Billing by Guesswork, contract failures (no contract for what enters the platform or for what a paid product grants); The Category Straitjacket is a root of its own outside the four chains, pushing new facts into free attribute keys; the trust and portfolio chains start instead at a hand-off nobody owns; this is why the book defines liquidity metrics and contracts before search, ranking or AI. |  | `conclusion_summary`: The four chains. → What starts the chains. |\n\n### First Indicators for Each Pattern\n\n**Controlling idea** (`description`, id `indicators`): Each pattern has one first number to ask for and an owner of that number, to be read with the mechanism in mind rather than as a target.\n\n**Advances the thesis** (W5): Gives the measure that lets a reader confirm a pattern before funding a fix.\n\n**Transition in:** `problem_solution`: The advice to break chains at their origin. → A number per pattern that shows which pattern is active.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p121 | description | Each pattern has a first indicator to ask for and a typical owner of that number. | table: Table of the fifteen patterns with the first indicator to ask for and the typical owner of the number. |  |\n| p122 | explanation | The indicators are not targets, because a number can improve for the wrong reason, so each is read with the pattern's mechanism in mind. | example: Duplicate rates can fall because clustering hides legitimate listings; moderation backlogs can shrink because thresholds were loosened. | `contrast`: The indicators. → Why they are not targets. |\n\n### The Patterns Across the Book\n\n**Controlling idea** (`description`, id `matrix`): Every chapter of the book is mapped to the patterns it addresses, so the reader can find all the help for one pattern, and the densest columns need a group-level owner.\n\n**Advances the thesis** (W5, W4): Connects each pattern to the chapters that remedy it.\n\n**Transition in:** `similarity`: A per-pattern reference: the indicator and its owner. → A second per-pattern reference: the chapters.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p123 | description | A matrix maps each of the 51 chapters to the patterns it addresses, with ● for a main concern named in the chapter's opening callout and ○ for a pattern treated in passing. | table: Chapter-by-pattern matrix with column codes for the fifteen patterns. |  |\n| p124 | analysis | Counted from the matrix, Ghost Inventory (19 chapters), Deal-Shaped Architecture and Vanity Liquidity (17 each) are the densest columns, main concerns in seven or eight of the nine parts, which shows they need an owner at group level, not only in one team. |  | `elaboration`: How to read the matrix. → What its densest columns show. |\n\n## Conclusion: Using the Patterns\n\n**Synthesis:** The fifteen patterns are one failure seen fifteen times: variation that accumulated under separate targets instead of being decided, owned and measured; the remedy is the same in each case, a contract, an owner or a metric definition placed at the origin of the chain.\n\n**So what:** A reader facing a symptom can name the pattern, ask for its indicator and fund the upstream fix instead of a downstream one that will have to be made again.\n\n**Callback:** The opening symptoms: sold bikes in alert e-mails, one flat three times, a dealer's stock vanishing overnight, a 2021 boost nobody can price. The last paragraph names them as Ghost Inventory, Seeing Double, Feed Roulette and Multiplier Creep, each with an upstream cause.\n\n**Takeaway** (`course_of_action`): Use the names in design reviews, steering committees and portfolio reviews: name the mechanism, pair it with a measure and look upstream first.\n\n**Hand-off** to [Meet Veldmark: Four Brands, One Platform to Build](meet-veldmark.html): `example`: The fifteen pattern names, and the Veldmark illustrations used one at a time. → The whole group whose marketplaces show every pattern in 2027, and the program that sets out to fix them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p125 | recommendation | The names are meant for rooms where decisions are made: design reviews, steering committees and portfolio reviews. |  |  |\n| p126 | recommendation | Three habits keep the names useful: name the mechanism, not the person; pair every pattern with its indicator; and look upstream before funding a downstream fix, because the cheapest fix is usually a contract, an owner or a metric definition. |  | `elaboration`: Where to use the names. → How to use them without blame. |\n| p127 | synthesis | Variation is legitimate when it was decided, owned and measured, and each of the fifteen patterns is a variation that accumulated instead. | example: Three agencies listing one flat shown once; a legally required country rule as configuration; paid placement that is labeled, bounded and measured. | `contrast`: The habits. → When duplication, divergence and paid visibility are not patterns at all. |\n| p128 | transition | The symptoms the page opened with are now named patterns with upstream causes, and the next page shows the group whose marketplaces show all fifteen at once. |  | `conclusion_summary`: The test of decided, owned and measured. → The callback to the opening symptoms and the hand-off to Veldmark. |\n\n## Non-goals\n\n- Detailed remedies, such as feed contracts, paid-organic blending, the entitlement ledger and model governance. See [Many Doors In: Forms, APIs and Bulk Feeds](listing-ingestion.html), [Ranking for Two Sides: Relevance, Freshness and Paid Visibility](ranking.html), [Packages, Bumps and Quotas: Products, Pricing and Entitlements](products-and-entitlements.html), [Models in Production: ML Platforms and Use Cases](ml-platform.html).\n- Prevalence statistics for patterns where none is published (for example ghost-listing rates).\n- An introduction to Veldmark. See [Meet Veldmark: Four Brands, One Platform to Build](meet-veldmark.html).\n- A reading guide. See [Introduction: Architecture for Liquidity](introduction.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- The matrix was drawn from the plan before chapters 3, 29, 39 and Parts VIII and IX (other than Adevinta) had callouts; those chapters now exist, and the matrix has not yet been re-checked against their opening callouts. (Carried over from spec.md.)\n- Minor round-5 findings left by the fix-only pass: 41,000 used for three unrelated quantities (ledg
