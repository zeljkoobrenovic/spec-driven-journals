<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, acceptance criteria AC-1 to AC-3, the thesis and the role are copied unchanged from the products-and-entitlements entry in journal-spec.json. Units added to the published text: the roadmap paragraph p04, the trade-offs paragraph p43 and the synthesis paragraph p59.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Product catalog, pricing engine, entitlement, quota and effect, and why catalog, price, entitlement and bill stay separate.\n- **Know:** The entitlement ledger's entry types with idempotency keys, effect projection onto the listing document as explicit paid fields, enforcement points with fail-open and fail-closed behavior, and quotas meeting feeds.\n- **Know:** Metering, billing, revenue recognition over the display period, credit notes, and the sold-versus-delivered reconciliation.\n- **Believe:** An entitlement is a ledger, not a counter, and a price event should be a data release, not a code release.\n- **Believe:** Every invoice line must trace to delivery evidence, which serves revenue assurance, dispute answers and paid-ranking disclosure from one pipeline.\n- **Be able to:** Replace scattered package checks with four separated concerns joined by events.\n- **Be able to:** Specify an entitlement matrix: product, enforcement point, effect, delivery evidence and owner.\n- **Be able to:** Plan a migration onto a shared entitlement service with shadow billing months and a reconciliation rule for cutover.\n\n**Audience:** Principal engineers and architects who own monetization, search or billing integration at a marketplace or a marketplace group, and engineering leaders deciding whether to build or buy billing and entitlements.\n\n**Already knows:**\n\n- APIs, databases, event streams, search engines and Kubernetes (the book's baseline); idempotency and append-only event logs.\n- From earlier chapters: the ten monetization models, VAS (value-added services), packages, the package staircase and Autotrader's annual price event (monetization-models); the listing event contract and the event backbone; ranking's paid boosts and its relevance floor; the feed contract and Motorvane's DMS feeds (listing-ingestion); seller accounts and Agence Rhône Habitat's branches (sellers-and-accounts); Omnibus, P2B and the DSA (marketplace-regulation).\n- Veldmark (fictional), its brands Tradeyard, Motorvane, Hearthly and Keybridge, Common Ground, the architecture advice forum, Yardstick, the cast (Ingrid Halvorsen, Olivier Petit, Felix Brandt, Yara Mendes), Autohaus Ruhrblick and the Essen Golf, and the failure-pattern names (Billing by Guesswork, Multiplier Creep, Deal-Shaped Architecture, Ghost Inventory, Search as System of Record).\n\n**Does not yet know:**\n\n- The terms this chapter owns: product catalog, pricing engine, entitlement, quota, effect, delivery evidence, effect projector and enforcement point.\n- Billing and finance terms: overage, proration, dunning, credit notes, revenue recognition over the display period, variable consideration, CPQ (configure-price-quote).\n- How packages, quotas, feeds and price events interact in practice.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given an overbilling dispute and a slow price event, the reader names the shared cause and the design that removes it. *Probe:* A dealer on a 150-slot package is billed overage for 13 cars that were never published: the feed importer enforced the quota and skipped them, while a monthly billing export counted the feed file. Separately, a group price change across four brands is estimated in engineering weeks. Using only this chapter: what is the common cause, and what do you build? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-4 | Given a proposal that ranking ask the entitlement service per candidate, the reader says why not, where paid effects live instead and what must remove them. *Probe:* Your search team proposes that the ranking stage call the entitlement service for every candidate to check whether it holds a paid top position, so the answer is always current. Using only this chapter: why should you refuse, where should paid state live instead, and what must happen when a listing with a paid top position is sold? | `custom` | cold_reader | minor |\n| AC-5 | Given an outage of the entitlement service and a dealer feed above its package, the reader states what each enforcement point does and where that policy is recorded. *Probe:* The entitlement service is down for an hour on a weekday. During it, a private seller tries to buy a paid publication, a dealer's feed arrives with 163 cars for a 150-slot package, and buyers keep searching. Using only this chapter: what should insertion, feed import and ranking each do, and where is the rule for the dealer's 13 extra cars written down? | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** How do you architect what a seller can buy, what they are entitled to, and how they are billed?\n\n> **Claim:** The commercial core behind paid products should keep four concerns apart, a versioned product catalog, a pricing engine, an entitlement ledger and billing, so that a price event is a reviewed data release rather than a code release; entitlements should be an append-only ledger of grants, consumptions, releases, expiries and refunds with idempotency keys rather than counters in each service; enforcement points should read effects projected through events as explicit paid fields on the listing read model, never asking the ledger live and never letting an effect outlive the listing's sale or removal; and insertion, ranking, rendering and lead routing should emit delivery events that a daily reconciliation compares with grants and invoice lines, so that every invoice line traces to delivery.\n\n**Disputed by:** The common practice of writing package checks as conditions in the insertion service, the search query and the card template, with a monthly billing export counting by its own definition; or a counter service per quota; or a billing vendor's feature switches taken as the entitlement system.\n\n**So what:** A Chief Architect who accepts this makes the catalog model, the entitlement ledger, the effect schema and the delivery-evidence events group standards while leaving products, prices and contract terms to brands, writes an entitlement matrix naming each product's enforcement point, effect, evidence and owner, buys invoicing, tax and collection but builds the catalog, ledger and effect projector, moves each brand only after a shadow billing month reconciles with no unexplained difference, and watches the daily unexplained difference in euros.\n\n**How and why:** Motorvane counted a dealer's cars twice: the feed importer published 150 of Autohaus Ruhrblick's 163 cars and skipped 13, while the billing export counted the feed file and charged €117 overage for cars never live; an audit found 1,140 dealers overbilled by about €212,000 over 14 months. The same missing record made the 1 January 2028 price event an estimate in engineering weeks per brand. At Veldmark's Sunday peak of 31,000 queries a second, a ranking stage asking the ledger live for 400 candidates per query (an illustrative figure) would need on the order of 12 million answers a second, so effects must ride on the listing document. Under Tally, Ruhrblick's month records 150 consumptions and 13 refused publications, and the invoice carries no overage line.\n\n**Supporting claims**\n\n- **S1** — Billing by Guesswork is structural: when the commercial fact of what a seller holds is counted separately by enforcement and billing and products live in each brand's code, the marketplace overbills sellers and turns every price event into engineering work, both for lack of one record of what was sold, held and delivered.\n- **S2** — Catalog, pricing engine, entitlement ledger and billing stay apart, with products as versioned catalog data that grant explicit effects and prices as effective-dated price lists whose quotes record every input version, so that a price event is a reviewed data release.\n- **S3** — Entitlements are an append-only ledger shared by the consumer and professional selling paths, with grants, consumptions, releases, expiries, suspensions and refunds as entries carrying idempotency keys from the business event, which makes every balance explainable and every invoice reconcilable.\n- **S4** — Enforcement points read effects projected by events as explicit paid fields on the listing read model, never the ledger live; effects never outlive the listing's sale or removal, failure behavior is decided per enforcement point, and quota policy for feeds is a contract term recorded in the ledger.\n- **S5** — Billing consumes the ledger and metering rather than recounting, and a daily reconciliation of grants, delivery evidence and invoice lines makes every invoice line traceable, which serves revenue assurance, seller reports, dispute answers and paid-ranking disclosure from one pipeline.\n- **S6** — A group makes the catalog model, the ledger, the effect schema and the delivery-evidence events shared standards while brands keep products, prices and terms, buys invoicing, tax and collection but builds the catalog, ledger and projector, and migrates each brand only after a shadow billing month reconciles.\n\n## Role in the part\n\nDesigns the commercial core that implements every monetization model and supplies the part's proof that what was sold was delivered, with paid effects that ranking and advertising consume. Supports P6-4, P6-6 of part `part-6`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in the scene poses the Ruhrblick invoice and the price-event estimate as one problem; the worked example replays both under Tally after the body has built the design; `chronological` in the architecture section follows a paid product's life: sold through one of two paths, recorded in the ledger, projected as effects, read at enforcement points (including feed import), metered and billed, and reconciled against delivery)\n\nThe scene comes first because the chapter's design is the answer to its two problems. The concepts come next because every later section uses catalog, price, entitlement, quota, effect and delivery evidence. The architecture follows a paid product from sale to reconciliation; effects cannot be explained before the ledger they are projected from, and reconciliation needs the delivery evidence that the concepts define as emitted by the systems that deliver value, which the reconciliation paragraph names (insertion, ranking, rendering, lead routing). The public record comes after the design, so the reader can see what each documented behavior requires of it, and before the worked example, whose build-or-buy decisions rest on it. The worked example can replay the invoice and the price event only once the whole core exists. Trade-offs, vertical differences, failure modes, the Chief Architect's view and the questions apply the whole design, so they come last; placed earlier, they would weigh options the reader has not yet seen.\n\n## Introduction\n\n**Hook** (`direct_statement`): A seller who paid for a \"Top listing\" and never appeared on top, or a dealer billed for cars the platform refused to publish, is a customer the marketplace has wronged.\n\n**Bridge:** Architects who read in monetization-models that every revenue model needs a commercial core, and who have seen package checks spread across insertion, search and billing code. → The wrongs come from architecture, the same commercial fact counted in several places, so the question is how to design the core that counts it once.\n\n**Thesis statement** (KEY POINTS callout (all three bullets) and paragraphs p01 and p02.): Keep catalog, price, entitlement and bill apart; make entitlements an append-only ledger whose effects are projected onto the hot paths; and prove that what was sold was delivered with delivery events reconciled daily against grants and invoice lines.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p04, which names the sections in order.):\n\n- One dealer's disputed invoice at Veldmark. *Kept in:* scene.\n- The four concerns that must stay apart. *Kept in:* concepts.\n- The commercial core: selling paths, ledger, effects, enforcement points, quotas and feeds, metering and billing, sold versus delivered. *Kept in:* architecture.\n- What the public record shows. *Kept in:* practice.\n- Veldmark's design, with the invoice and a price event replayed. *Kept in:* worked.\n- Trade-offs, vertical differences, failure modes, the Chief Architect's view and review questions. *Kept in:* trade-offs, verticals, failure-modes, ca-view, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Every revenue model needs the same commercial core, and this chapter designs it around Part VI's test that what was sold was delivered, because at scale sellers are wronged less by bad intent than by the same commercial fact counted in several places; the effects it produces are what ranking and advertising consume. | example: A seller who paid for a Top listing and never appeared on top; a dealer billed for cars the platform refused to publish. |  |\n| p02 | definition | The chapter owns four terms, product catalog, pricing engine, entitlement and quota, and states what an effect is (what an entitlement does at an enforcement point, a step such as insertion, ranking or rendering that checks it), so every later section can use both words. | example: 'may publish up to 150 vehicles'; 'appears in a top slot until Sunday 23:59'. | `elaboration`: The commercial core: something that defines, prices, records and bills. → The four terms that name its parts. |\n| p03 | context | No marketplace has published its catalog, pricing or entitlement architecture, so the design is a reference-architecture inference anchored to published product behavior and billing-vendor documentation, not a description of any company. | source: Rightmove's commitments plus extras, Autotrader's annual price event and stock lever, OLX's boosts per package, CarGurus' capped free tier, Vinted's fee on every card. | `contrast`: The four terms the chapter will build on. → That no company has documented such a design, and what the chapter rests on instead. |\n| p04 | transition | The chapter moves from one disputed Veldmark invoice and a price event estimated in engineering weeks through the four concerns and the commercial core to the public record, Veldmark's design replayed, and the trade-offs, vertical differences, failure modes, decisions and questions that apply it. | reasoning: The section sequence: scene, concepts, architecture (selling paths, ledger, effects, enforcement points, feeds, billing, sold versus delivered), public record, worked example, trade-offs, verticals, failure modes, Chief Architect's view, questions. | `sequence`: What the chapter rests on: published behavior and inference. → The order in which it builds the design. |\n\n## Sections\n\n### Setting the Scene at Veldmark: Thirteen Cars and €117\n\n**Controlling idea** (`example`, id `scene`): A €117 overage for thirteen unpublished cars and a price event estimated in engineering weeks are one problem: Veldmark has no single place that says what can be sold, what a seller holds and what was delivered.\n\n**Advances the thesis** (S1): Shows Billing by Guesswork as a structural defect with a cost in credits and in delivery speed.\n\n**Transition in:** `example`: The wrong of billing a dealer for cars the platform refused to publish. → Autohaus Ruhrblick's August invoice.\n\n**Order of paragraphs** (`problem_solution`): The disputed invoice comes first because it is concrete; its structural cause follows, then the second agenda item, so that Ingrid's framing can join them. Putting the price event first would make the invoice look like a separate bug.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | example | In late September 2027 Autohaus Ruhrblick disputes €117 of overage on its August Motorvane invoice for 13 cars that were never published. | scenario: Pro 150: 150 slots for €1,450 a month, €9 per car per month overage; the DMS feed delivered 163 cars; 150 were live; 13 billed at €117. |  |\n| p06 | cause_effect | The overbilling is structural: the feed importer skipped cars above the quota while the billing export counted the feed file, so two correct counters billed 1,140 dealers about €212,000 over 14 months. | scenario: Felix Brandt's trace; the audit of 14 months: 1,140 dealers, about €212,000, all credited in October 2027.; figure: Figure 1: a feed of 163 cars, a quota gate that publishes 150 and skips 13, and a separate counter that bills all 163. | `cause_effect`: The disputed €117. → Its cause: two counters for one fact. |\n| p07 | example | Olivier's group-wide price-and-product event on 1 January 2028 is estimated in engineering weeks because each brand's products and packages are hard-coded in its own stack. | scenario: Tradeyard VAS hard-coded in Yardstick (PHP); Motorvane packages in a Kotlin service and the sales CRM; Hearthly tiers in a Go contract service; Keybridge billing on its own .NET stack. | `additional_support`: The Ruhrblick case at the architecture advice forum. → A second agenda item: the price event. |\n| p08 | claim | Ingrid frames both items as one problem, the lack of a single place that says what can be sold, what a seller holds and what was delivered, which Common Ground's catalog and entitlement goal for Q2 2028 must answer. | scenario: Common Ground's goal of one product catalog and entitlement service by Q2 2028. | `conclusion_summary`: The invoice and the price-event estimate. → Their common cause and the goal that must answer both. |\n\n### Concepts: Four Things That Must Stay Apart\n\n**Controlling idea** (`definition`, id `concepts`): The single place Veldmark lacks is four concerns kept apart, catalog, pricing engine, entitlement ledger and billing, joined by delivery evidence, with effects as what enforcement points read.\n\n**Advances the thesis** (S2, S3, S4): Defines the separation and the vocabulary the architecture uses.\n\n**Transition in:** `problem_solution`: Ingrid's 'no single place'. → The four concerns that, kept apart, form that place.\n\n**Order of paragraphs** (`large_to_small`): The four concerns and delivery evidence come first as the whole; each of the first three concerns is then defined in turn, catalog before price because a price is the price of a catalog item, and entitlement last because it is bought at a price and grants a catalog effect. Defining entitlements before the catalog would leave 'effect' undefined.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | claim | The chapter's core decision is to keep four concerns apart, each answering one question, changing for its own reasons, with its own owner and things it must not contain. | table: Product catalog, pricing engine, entitlement ledger, billing: question answered, when it changes, owner, must not contain. |  |\n| p10 | definition | Delivery evidence, the record of what the platform actually did, is an input the four concerns share but none owns: delivery systems emit it, and the ledger, billing and reporting consume it. | example: Listings published under a slot, impressions in a paid position, boosts executed, leads routed. | `additional_support`: The four concerns. → The one input the four share but none owns. |\n| p11 | transition | The subsections define the first three concerns; billing is a finance system the chapter connects to rather than designs, and its interface comes under Architecture. |  | `sequence`: The four concerns and delivery evidence. → Which concerns the following subsections define and where billing is handled. |\n| p12 | definition (list) | A catalog has five object types, product, package, add-on, effect (what an item does at an enforcement point) and product version, and the effect is the one most catalogs forget. | example: Bump, Top listing (7 days), Highlight; Pro 150 = 150 slots + 20 boosts + statistics + Co-Driver-style tooling.; quotation: Rightmove: 'more than 50% of independent agents purchased incremental product above their package commitment'.; reasoning: Without versions, changing a product silently changes what past buyers bought. | `elaboration`: The catalog named as the first concern. → Its five object types. |\n| p13 | claim | The catalog is reference data shipped as releases: versioned, reviewed, effective-dated and published as events that downstream services cache. | reasoning: The same treatment as the category taxonomy in categories-and-taxonomies. | `cause_effect`: Product versions and effects. → How the catalog is released. |\n| p14 | definition | A price is a function, not a field: a marketplace price depends on at least ten dimensions, from country and category to contract, date and experiment arm. | table: Ten pricing dimensions with an example and why each matters. | `sequence`: The catalog: what can be sold. → The pricing engine: what it costs. |\n| p15 | evidence | Vinted's public price list shows formula pricing in practice, with the buyer fee and the bump fee varying by order and item characteristics. | quotation: Buyer fee varies by 'item characteristics, order value, order type'; bump fee by duration, item price and 'territorial scope (local or international)'. | `example`: Formula pricing as a dimension. → A documented example. |\n| p16 | recommendation | Two design rules follow: prices are effective-dated, reversible price-list versions, and every price quote records the version of every input that produced it. | quotation: Autotrader's 'annual 1 April 2025 pricing and product event'.; reasoning: A quote with catalog, price-list, contract, promotion and experiment versions can be reproduced exactly in a dispute six months later. | `cause_effect`: Prices as functions of many dated inputs. → The two rules that follow. |\n| p17 | definition | An entitlement has a holder, a product version, a validity window, an optional quantity and a source; a quota is an entitlement that consumption reduces, and at run time an effect is the projection of active entitlements an enforcement point needs. | example: 'account 88412 may hold 150 active vehicle listings and currently holds 150'; 'listing 5531 is top-eligible in category city bikes, Rotterdam, until 14 March 23:59'. | `sequence`: The pricing engine. → The third concern: entitlements, quotas and effects. |\n| p18 | claim | Separating entitlement from effect keeps the hot paths fast, because enforcement points need only the effect and only the entitlement service reads entitlements. | reasoning: Ranking needs a boolean, a category, a window and a cap, not whether a top position came from a promotion or a contract. | `cause_effect`: Effects defined as projections of entitlements. → Why the separation matters on hot paths. |\n\n### Architecture: The Commercial Core\n\n**Controlling idea** (`process`, id `architecture`): The commercial core follows a paid product from two selling paths through an append-only ledger and projected effects to enforcement points, metering and billing, and a daily reconciliation of sold against delivered.\n\n**Advances the thesis** (S3, S4, S5): Builds the ledger, the projection and the reconciliation the thesis claims.\n\n**Transition in:** `elaboration`: The four concerns and delivery evidence, defined. → How they connect as one core, starting where money comes in.\n\n**Order of paragraphs** (`chronological`): The section follows a paid product's life: how it is sold, where the sale is recorded, how the record reaches the hot paths, how those paths enforce it and how feeds meet quotas, how it is billed, and how delivery is checked against the bill. Effects before the ledger would project from nothing; reconciliation before enforcement would compare evidence from points the reader has not met. The billing rule (p33) sits next to the billing definition (p31) so the finance requirements do not split mechanism and rule.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p19 | comparison (list) | The commercial core starts with two selling paths that share almost nothing operationally: prepaid consumer purchases and postpaid professional contracts. | figure: Figure 2: the commercial core as five stages, define, sell, hold, deliver, settle, with delivery evidence flowing back; the prose maps the four concerns onto the stages.; example: A €3.99 bump bought on a phone; Pro 150 for 24 months at a 6% discount with overage.; fact: Vinted: a bump bought while a listing is in review is not processed or charged.; quotation: CarGurus packages on 'monthly, quarterly, semiannual, or annual' terms that 'generally auto-renew on a monthly basis and are cancellable by dealers with 30 days'' notice. |  |\n| p20 | claim | The two paths should share the catalog, the pricing engine and the entitlement ledger and nothing else, so a bump bought by a private seller and one in a dealer package are the same product version in the same ledger. | reasoning: Payment and order-to-cash paths differ in regulation, tooling and failure modes; one billing system forced on both usually serves neither. | `contrast`: Two paths that differ. → What they must have in common. |\n| p21 | description | The ledger is append-only: every change is an entry with a type, a creator and an idempotency key, never an update of a counter. | table: Grant, Consume, Release, Expire, Suspend/Resume, Revoke/Refund, Adjust: created by, example, idempotency key.; figure: Figure 3: the ledger as a ticket book with a journal. | `elaboration`: The shared entitlement ledger. → Its entry types. |\n| p22 | explanation (list) | Because the balance is the sum of entries, the ledger gains three properties: idempotency, explainability and reconciliation. | quotation: Stripe: an idempotency key lets a client 'safely repeat the request without risk of creating a second object or performing the update twice'.; scenario: The Ruhrblick invoice would have been computed from Consume and PublishRefused entries.; figure: Figure 4: the lifecycle of an entitlement, every transition a ledger entry. | `cause_effect`: Append-only entries. → The three properties that follow. |\n| p23 | claim | Enforcement points need answers in milliseconds, so effects are projected onto the read models the hot paths already use: at Veldmark's Sunday peak, live lookups would mean more than 12 million entitlement answers a second. | scenario: 31,000 queries per second at the Sunday peak; 400 candidates per query is an illustrative figure; more than 12 million answers per second. | `contrast`: The ledger as the truth. → Why hot paths cannot read it directly. |\n| p24 | process | The effect projector consumes ledger events, publishes effect-change events on the backbone, and writes per-listing effects as explicit paid fields on the listing document. | scenario: ListingPaidEffectChanged and AccountQuotaChanged on the group event backbone.; table: paid.top_eligible_until, paid.top_scope, paid.bump_time, paid.highlight, paid.label, paid.product_version: example and user. | `elaboration`: Projection onto read models. → The projector and the fields it writes. |\n| p25 | explanation | Ranking owns how the paid fields are used, under its standard that relevance models never read them; this chapter owns producing them correctly and removing them promptly. | reasoning: Ranking's group standard: no paid fields as features, a relevance floor for reserved slots, every paid impression logged. | `contrast`: The paid fields. → Who uses them and who produces them. |\n| p26 | claim | A paid effect that outlives its listing is Ghost Inventory with a price tag, so the projector must consume listing lifecycle events and sold, removed or blocked listings carry no paid fields. | example: A sold bike keeps its top slot because ListingSold reached search but not the projector. | `elaboration`: Removing the fields promptly. → What happens when removal fails, and the rule that prevents it. |\n| p27 | claim | Two consistency rules apply to every effect: effects tolerate bounded staleness while the ledger does not, and the index is never the record. | example: A top-listing effect 20 seconds after payment is acceptable; a slot granted twice is not; after an index rebuild effects are re-projected from the ledger. | `additional_support`: The removal rule. → Two more rules for every effect. |\n| p28 | recommendation | Each enforcement point reads effects within its own latency budget, and its behavior when the ledger is unavailable is a commercial decision: fail open on what a paying professional holds, fail closed only on new consumer charges, documented per point. | table: Seven enforcement points (insertion, feed import, ranking, rendering, lead routing, pro tools, scheduler): question, reads, latency budget, behavior on ledger unavailability.; reasoning: Failing closed protects revenue and damages supply; failing open protects supply and costs revenue that reconciliation can recover. | `sequence`: The effects and their consistency rules. → The enforcement points that read them. |\n| p29 | comparison | Feeds break naive quota designs, because a DMS export contains the dealer's whole stock; with 88% of Motorvane's dealer listings arriving by feed, the quota rule is the publication rule, and there are four possible policies. | scenario: 88% of Motorvane's dealer listings arrive by feed.; table: Reject excess, dealer priority, publish all and bill overage, publish and prompt to upgrade: behavior, good for, risk. | `example`: Feed import as one enforcement point. → Why feeds are the hardest case. |\n| p30 | recommendation | Whichever policy is chosen, three rules are not optional: the policy is a contract term stored with the entitlement, every refused car produces a PublishRefused entry and a feed report, and billing counts published listings from the ledger. | reasoning: The feed report back to the dealer that listing-ingestion's feed contract requires. | `contrast`: Four policies, any of which can be right. → Three rules that apply to all of them. |\n| p31 | definition | Metering turns delivery evidence into billable quantities, and billing combines contract, metered, one-off, credit and tax lines into invoices for the finance ledger. | scenario: The €1,450 package fee as a contract line, overage as a metered line; Veldmark's finance ledger is group finance's SAP S/4HANA. | `sequence`: Enforcement and quotas. → Metering and billing. |\n| p33 | claim | Billing consumes the entitlement ledger and metering and never recomputes entitlements on its own; the Ruhrblick defect was exactly such a recomputation. | reasoning: RECONCILED's designing-financial-ledgers covers the accounting design. | `elaboration`: Billing defined as combining lines into invoices. → The rule that billing reads the ledger rather than recounting. |\n| p32 | explanation (list) | Three finance requirements shape the design and must be agreed before launch: recognition over the delivery period, variable consideration for outcome-based fees, and credit notes rather than edits. | fact: Adevinta's 2023 accounts recognize listing fees over the period in which the listings are displayed.; scenario: A seven-day top listing bought on 28 December is partly next year's revenue; the Ruhrblick correction was 1,140 credit notes. | `sequence`: Billing that consumes the ledger. → What finance requires of it. |\n| p34 | process | A daily delivery reconciliation closes the loop by comparing what was granted, what insertion, ranking, rendering and lead routing report as delivered, and what was billed, for each paid product and holder. | figure: Figure 5: a top listing from quote to make-good, with the remedy as a ledger entry. | `sequence`: Billing that reads the ledger, and the finance requirements on it. → The check that compares ledger, delivery and invoice. |\n| p35 | claim (list) | Only this loop can keep a promise such as Tradeyard's guaranteed prominence, and it also produces the seller-facing delivery report and the evidence for paid-ranking disclosure. | scenario: Tradeyard's top listing repositioned in June 2027 as seven days of guaranteed prominence with automatic extension on shortfall (ranking).; example: 'Your top listing appeared 1,840 times in top slots for stadsfiets Rotterdam'.; source: Directive (EU) 2019/2161 Annex I point 11a; Regulation (EU) 2019/1150 Article 5; the DSA's advertising transparency. | `cause_effect`: The reconciliation. → What it makes possible. |\n\n### In Practice: What the Public Record Shows\n\n**Controlling idea** (`evidence`, id `practice`): No portal publishes its entitlement architecture, but published product behavior requires each part of the core, and billing vendors cover feature switches but not quotas, per-listing effects or delivery evidence.\n\n**Advances the thesis** (S2, S3, S4, S6): Anchors the inferred design in documented behavior and sets up build or buy.\n\n**Transition in:** `contrast`: The designed core. → What is actually documented.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The marketplaces' published behaviors come first, then the vendor documentation that covers part of them, then the build-or-buy judgement the gap between the two supports; the judgement before the gap would be unsupported.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p36 | evidence | No portal publishes its entitlement architecture, but the behaviors in the public record each require a part of the core. | table: Eight published behaviors from Rightmove, Autotrader, OLX, CarGurus and Vinted (2025–2026), each with the requirement it places on the core. |  |\n| p37 | analysis | Stripe's Entitlements documentation confirms two parts of the design, entitlements derived from purchases and local projections on hot paths, and shows the gap a marketplace must fill itself. | quotation: Stripe recommends that integrators 'persist these entitlements internally for faster resolution'; the entitlements.active_entitlement_summary.updated webhook.; reasoning: A SaaS entitlement is a feature switch per customer; a marketplace also needs counted quotas, per-listing time-boxed effects, scopes and delivery evidence. | `additional_support`: Marketplace behaviors. → What billing vendors document. |\n| p38 | recommendation | That gap decides build or buy: buy invoicing, tax, dunning and collection, build the catalog model, ledger and effect projector, and accept CPQ tools only if they write into the shared ledger. | reasoning: The catalog, ledger and projector encode the marketplace's own products and sit on its hottest paths. | `cause_effect`: The gap between vendor entitlements and marketplace needs. → The build-or-buy decision it shapes. |\n\n### Veldmark Worked Example: One Catalog for Four Brands\n\n**Controlling idea** (`example`, id `worked`): Veldmark's forum answers both problems with Tally, a shared catalog model and entitlement ledger: the Ruhrblick month bills no overage, the price event becomes a data release once brands migrate, and each brand cuts over after a shadow month.\n\n**Advances the thesis** (S1, S3, S5, S6): Replays the scene's two problems under the design and shows the migration rule.\n\n**Transition in:** `example`: The build-or-buy judgement and the general design. → Veldmark's decisions after the Ruhrblick audit.\n\n**Order of paragraphs** (`problem_solution`): The design comes first, then the invoice and the price event replayed under it, then the migration order that the price event's catch makes necessary. Replays before the design would show results without the mechanism.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p39 | description (list) | In October 2027 the forum agrees Tally, the group entitlement service, on five decisions: shared model with local content, one brand-partitioned ledger, effects on the listing event contract, billing that consumes Tally, and Keybridge outside until 2029. | scenario: Five decisions; Kafka for Tradeyard and Motorvane, a bridge to Google Pub/Sub for Hearthly; OpenSearch and Motorvane's Elasticsearch index paid.* fields; SAP S/4HANA; Keybridge's neutrality decision of March 2027.; table: Sizing: 38 million Tradeyard VAS purchases a year (about 104,000 grants a day), 2.3 million new listings a week, 21,400 Motorvane dealers, 36,500 Hearthly agencies, 31,000 queries/s, about 58,000 professional invoices a month, each with its design consequence. |  |\n| p40 | example | Under Tally, Ruhrblick's August invoice carries no overage line: the ledger records 150 consumptions and 13 refused publications, and billing reads 150 published cars. | scenario: Contract policy dealer priority, then newest first, no overage without consent; 150 Consume and 13 PublishRefused entries; €1,450 billed; with consent, 163 consumptions and €117 reconcilable car by car. | `problem_solution`: Tally's design. → The Ruhrblick month replayed under it. |\n| p41 | example | The 1 January 2028 price event becomes a reviewed, reversible catalog and price-list release for every brand whose products have migrated, but Tradeyard's still runs through Yardstick one last time. | scenario: Tradeyard price lists in four countries effective 00:00 local time; Motorvane pro-150@v5 with migration at each dealer's renewal; a Hearthly tier; dry-run against last month's orders; Tradeyard VAS moves into Tally only in Q2 2028. | `similarity`: The invoice replayed. → The second agenda item replayed. |\n| p42 | recommendation | The forum orders the migration by pain, Motorvane, then Tradeyard, then Hearthly, and lets no brand cut over until a shadow month reconciles with no unexplained difference. | scenario: Motorvane Q1 2028, Tradeyard Q2 2028, Hearthly second half of 2028; one full shadow billing cycle each; a difference is acceptable only if explained and the legacy system is wrong.; figure: Figure 6: legacy billing and Tally side by side for a month. | `cause_effect`: Products move into Tally brand by brand. → The order and the rule for each move. |\n\n### Trade-offs\n\n**Controlling idea** (`comparison`, id `trade-offs`): Each of the chapter's choices is right only under conditions, and the simpler options suit a single brand with few products and no disputes.\n\n**Advances the thesis** (S3, S4, S6): States when the recommendations do not apply.\n\n**Transition in:** `contrast`: Veldmark's choices. → When other choices are right.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p43 | analysis | The simpler options in the trade-offs table are right for one brand with a few products and no disputes; the ledger, the projection and the shared model pay for themselves once several brands, negotiated contracts, quotas, audits and regulators arrive. | table: Six decisions (where entitlements live, how hot paths read paid state, catalog scope, pricing, billing, quota enforcement under failure) with options and when each is right. |  |\n\n### Vertical Differences\n\n**Controlling idea** (`comparison`, id `verticals`): Products, entitlement holders, selling paths and the hardest problem differ by vertical, and in real estate the hardest is hierarchy.\n\n**Advances the thesis** (S3): Shows how the ledger must hold grants across organization hierarchies.\n\n**Transition in:** `elaboration`: General trade-offs. → Differences by vertical.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p44 | claim | Real estate's hardest problem is hierarchy: a network contract with a pooled quota means the ledger must hold a grant at network level, consume it at branch level and survive a branch leaving without rewriting history. | table: General classifieds, real estate, automotive, jobs: typical products, entitlement holder, dominant selling path, hardest problem, delivery evidence.; scenario: Agence Rhône Habitat's 14 branches. |  |\n\n### Failure Modes\n\n**Controlling idea** (`analysis`, id `failure-modes`): Nine recurring failures each break one of the chapter's rules, from two counters for one fact to a global fail-closed default.\n\n**Advances the thesis** (S1, S2, S3, S4, S5): Names what goes wrong when each claim is ignored.\n\n**Transition in:** `sequence`: Variation by vertical. → What goes wrong.\n\n**Order of paragraphs** (`grouping`): The failures are grouped by what breaks: counting (two counters), effects (outliving the listing, product codes in ranking), prices, ledger entries (boosts twice or never, moderation), product definitions (windows, promotions), and failure behavior. The Ruhrblick defect comes first because the reader already knows it; the order inside the group carries no argument, so no reordering would break it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p45 | analysis | Two counters for one fact, the Ruhrblick defect, is prevented only when every metered invoice line comes from the ledger's consumption entries. | scenario: The Ruhrblick defect. |  |\n| p46 | analysis | Paid fields that outlive the listing are visible to buyers and regulators and are a refund liability. |  | `additional_support`: The previous failure mode: Counters → Another failure mode and its fix. |\n| p47 | analysis | Product codes in ranking code make every new product a search release and the paid effects impossible to list, so ranking reads paid.* fields only. | example: if package == 'GOLD' and country == 'PT' in a search query. | `additional_support`: The previous failure mode: Paid fields that outlive the listing → Another failure mode and its fix. |\n| p48 | analysis | Price lists edited in place cannot be reproduced for a dispute or rolled back. |  | `additional_support`: The previous failure mode: Product codes in ranking → Another failure mode and its fix. |\n| p49 | analysis | Boosts executed twice or never are ledger states that reconciliation should flag within a day. |  | `additional_support`: The previous failure mode: Price lists edited in place → Another failure mode and its fix. |\n| p50 | analysis | When moderation and monetization disagree a removed listing keeps its effect or is refunded twice, so moderation outcomes write Suspend or Revoke entries and refunds are idempotent per case. | example: A fake listing that bought a boost with a stolen card (fraud-prevention). | `additional_support`: The previous failure mode: Boosts executed twice or never → Another failure mode and its fix. |\n| p51 | analysis | Inconsistent time windows are avoided by defining windows in the product version, storing instants and rendering in the seller's time zone. | example: 'Seven days' as 168 hours from purchase in one brand and until 23:59 on day seven in another. | `additional_support`: The previous failure mode: Moderation and monetization → Another failure mode and its fix. |\n| p52 | analysis | Promotions without bounds are prevented by making every promotion a catalog object with a cap, a window and a cost center. |  | `additional_support`: The previous failure mode: Time windows → Another failure mode and its fix. |\n| p53 | analysis | A global fail-closed default turns an entitlement outage into a supply incident, so failure behavior is documented and tested per enforcement point. |  | `additional_support`: The previous failure mode: Promotions without bounds → Another failure mode and its fix. |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `ca-view`): At group scale, decide the catalog model, ledger, effect schema and delivery events centrally, leave products and prices local, write down ownership in an entitlement matrix, watch the unexplained difference, and use the core to price acquisitions.\n\n**Advances the thesis** (S6): Turns the design into the group's agenda.\n\n**Transition in:** `problem_solution`: The failure modes. → The decisions that prevent them at group scale.\n\n**Order of paragraphs** (`order_of_importance`): What to decide centrally comes first because ownership, metrics and the long-term view all assume it; the long-term consideration comes last because it extends the design to acquisitions. Ownership before the central decisions would assign owners to standards not yet chosen.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p54 | recommendation | Decide the catalog model, ledger, effect schema and delivery-evidence events centrally, and leave products, packages, prices, contract terms and the choice of model to brands. | reasoning: The Polish car market and the French property market do not share a price level. |  |\n| p55 | recommendation | Ownership must be written down, and an entitlement matrix of product, enforcement point, effect, delivery evidence and owner is the most useful hour a launch team can spend. | table: Five Veldmark products (Tradeyard Top listing 7d and Bump, Motorvane Pro 150 and lead allowance pilot, Hearthly network tier) with enforcement points, effect, delivery evidence and behavior on listing removal.; reasoning: Monetization platform, brand monetization teams, ranking, finance and trust and safety each own a named piece. | `sequence`: The central and local decisions. → Who owns each piece. |\n| p56 | recommendation | Watch the daily unexplained difference in euros by brand, the time from catalog change to production, the share of revenue computed from the ledger, projection lag at the peak and credits for under-delivery. | reasoning: Credits should rise briefly after launch, when the system finds what was always there, and then fall. | `sequence`: Ownership. → What to watch. |\n| p57 | recommendation | Over the long term the core lets a group price the integration of an acquired marketplace's monetization as a content migration plus a shadow month; without it each acquisition starts again, which is how Deal-Shaped Architecture forms. | reasoning: Every acquisition brings a catalog, an entitlement scheme and a billing integration (platform-consolidation). | `sequence`: What to watch now. → The long-term consideration. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Ten review questions test a commercial core against the chapter's claims.\n\n**Advances the thesis** (S1, S2, S3, S4, S5, S6): Turns each claim into a question for a design review.\n\n**Transition in:** `sequence`: The Chief Architect's decisions. → Questions that check them in a review.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p58 | recommendation (list) | Ten questions check a commercial core, from where the single source of truth lives to what moderation writes when it removes a paid listing. |  |  |\n\n## Conclusion: From Products to Attention\n\n**Synthesis:** Ruhrblick's €117 and the price-event estimate had one cause, and one record answers both: the ledger that shows 150 consumptions and 13 refused publications is the ledger a price-list release writes to, the source of the paid fields ranking reads, and the evidence finance signs and a disclosure rests on.\n\n**So what:** A group that builds this record once can change prices as data, sell across brands and prove every invoice line; one that leaves package checks scattered pays for each brand's counting and learns of its errors from its dealers.\n\n**Callback:** The scene: Ruhrblick's €117 overage and the price event estimated in engineering weeks, and the opening's wronged seller. The reader now sees both as the same missing record, closed by the ledger, the projection and the reconciliation.\n\n**Takeaway** (`course_of_action`): Build one ledger of what was sold, held and delivered before the next price event, and bill only from it.\n\n**Hand-off** to [Selling Attention: Display, Native and Retail-Media Advertising](advertising-platforms.html): `contrast`: The commercial core turns monetization models into things that can be sold, held, enforced, delivered and billed, but one family of paid products still needs its own machinery. → Advertising, which sells the audience rather than the listing, to brands and agencies rather than sellers, through ad servers, header bidding and consent signals.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p59 | synthesis | Ruhrblick's €117 and the price-event estimate had one cause and are answered by one record, the ledger that feeds billing, the paid fields and the delivery evidence, so a group that builds it once changes prices as data and proves every invoice line. | scenario: 150 consumptions and 13 refused publications; the 1 January 2028 price event. |  |\n| p60 | transition | The commercial core turns monetization models into things that can be sold, held, enforced, delivered and billed, but advertising, which sells the audience to brands and agencies through ad servers, header bidding and consent signals, needs its own machinery. |  | `contrast`: A core that proves what was sold was delivered. → The one paid product family it does not cover: advertising. |\n\n## Non-goals\n\n- Choosing monetization models and their liquidity costs. See [How Listing Marketplaces Make Money](monetization-models.html).\n- How paid effects are blended into the result order. See [Ranking for Two Sides: Relevance, Freshness and Paid Visibility](ranking.html).\n- The ad stack and sponsored-listing auctions in the ad server. See [Selling Attention: Display, Native and Retail-Media Advertising](advertising-platforms.html).\n- Payment processing, payouts and buyer protection; accounting design. See [Beyond the Contact: Payments, Shipping and Buyer Protection](transactions-and-payments.html), [Never Update, Only Append: Designing Custom Ledgers](../finance-systems-architecture/designing-financial-ledgers.html).\n- Feed contracts in general; organization hierarchies. See [Many Doors In: Forms, APIs and Bulk Feeds](listing-ingestion.html), [Private Sellers, Dealers and Agencies: Modeling Who Lists](sellers-and-accounts.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Round-4 minor (one reader, fault unclear): in the worked example, 'The numbers that sized it' follows the five decisions it sized (p39 evidence order). Left as specified; decide whether to move the sizing table before the decisions.\n\n## Decision log\n\n- **2026-11-12** — The three units added in conversion (roadmap p04, trade-offs paragraph p43, synthesis p59) and the round-1 spec change to p02 and p17 (effect and enforcement point defined before use): accepted under the author's delegation, 2026-11-12. Rejected: Reverting to the unit set of spec.md.\n- **2026-11-12** — Thesis-rubric notes (S6 supports so_what; S5 does not name the emitters of delivery events): thesis copied from the journal spec left unchanged; p34 already names the emitters. accepted under the author's delegation, 2026-11-12. Rejected: Rewording the journal-spec thesis.\n- **2026-11-12** — Flow-rubric and reader reorderings not taken (merge p18 into p23, merge p11 into p09, move p49 next to p45, move In Practice, move the entitlement matrix): the round-3 flow readers did not converge on any move (A: In Practice after Concepts or into Architecture, matrix into the worked example or next to enforcement points; B: no major reordering), so the published order stands. Decided under the author's delegation, 2026-11-12. Rejected: Making a move only one reader asked for.\n- **2026-11-12** — Minor draft fixes under the author's delegation, 2026-11-12: the vocabulary count (p02 'two related words recur'; p10 'one input that none of them owns' replaces 'a fifth element'); the Tradeyard/Yardstick exception split into its own sentences (p41); Figure 2's five stages mapped to the four concerns at the start of p19; the stock-lever row glossed as the number of paid cars retailers advertise (the book's gloss in liquidity-and-network-effects, no new claim); VAS expanded at first use (p07), which both round-3 flow readers asked for. Rejected: Leaving the minor findings for a later pass.\n- **2026-11-12** — Feed import during an entitlement outage: the enforcement table now says the importer queues and applies the contract's overflow policy once the quota effect is current, which states what 'queue and retry' already implied. Decided under the author's delegation, 2026-11-12. Rejected: Applying the overflow policy to the last projected quota effect during the outage (a sec
