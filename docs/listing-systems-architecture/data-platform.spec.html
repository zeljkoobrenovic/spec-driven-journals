<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, acceptance criteria AC-1 to AC-3, the thesis and the role are copied unchanged from the data-platform entry in journal-spec.json; supporting claims S1 to S6 are written here. Units added by this conversion: roadmap p04, one lead-in paragraph each for Trade-offs (p54) and Vertical Differences (p55), and a synthesis paragraph p62 before the published hand-off (p63).\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** What a marketplace data platform is for; the tracking plan, its common envelope (listing ID, ranking and experiment context, consent state) and server-side facts.\n- **Know:** One substrate with many owners: a tenant-partitioned lakehouse, contracts and quality gates at the source, domain-owned data products, a separate store for personal data.\n- **Know:** Governed metrics (a qualified contact with one steward, definition, computation and version), data for professionals, legal and commercial limits on sharing across brands, quality, freshness and cost.\n- **Believe:** The tracking plan is the real schema of a marketplace, and liquidity metrics must be governed metrics.\n- **Believe:** Cross-brand sharing is a decision about purpose that belongs in auditable access policy, not in whoever holds warehouse credentials.\n- **Be able to:** Write a definition card for a governed liquidity metric and decide which metrics to govern.\n- **Be able to:** Design a tracking plan whose events can be joined to ranking, experiments and consent.\n- **Be able to:** Decide what the group centralizes (substrate, rules, metrics) and what domains own (data products).\n\n**Audience:** Chief architects, heads of data and ML, analytics engineering leads and engineering directors of multi-brand listing marketplaces.\n\n**Already knows:**\n\n- APIs, databases, event streams, search engines and Kubernetes (the book's baseline), including CDC, Kafka and warehouses such as Snowflake and BigQuery.\n- From earlier chapters: liquidity metrics (liquidity-and-network-effects), contacts and leads (messaging-and-leads), the listing event stream, its outbox and envelope, and 'tenant' as one brand in one country (event-driven-listings), systems of record and erasure (listing-data-management), contacts from organic sessions (web-and-seo-architecture), the billable lead (monetization-models).\n- Veldmark (fictional), its brands Tradeyard, Motorvane, Hearthly, Keybridge and Valuo, Yardstick, Common Ground, Safe Deal, Veldmark ID, Motorvane Dealer Hub, the architecture advice forum, the cast (Henrik de Boer, Priya Raman, Ingrid Halvorsen, Emma Laurent, Lucía Ortega, Felix Brandt, Sven Lindqvist), Femke's bike, the Essen Golf, and the failure patterns Vanity Liquidity and Deal-Shaped Architecture.\n\n**Does not yet know:**\n\n- The terms this chapter owns: data platform, tracking plan, common envelope, data contract, data product, governed metric, metrics layer, qualified contact, pro data product.\n- Lakehouse, open table formats (Iceberg, Delta Lake), the medallion layout, data mesh, quarantine tables.\n- ePrivacy Art. 5(3) and GDPR purpose limitation as they bear on analytics; controller boundaries.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given conflicting brand numbers and a data-sharing request, the reader names the contract that resolves each. *Probe:* The board wants one 'contacts per live listing' number for three brands by Wednesday. One brand counts every buyer message, one counts e-mails, calls and bookings per channel, one deduplicates per user, listing and day. One listing received 14 conversations and the first brand reports 52 contacts for it, one of them from a phisher. Separately, an agency-software subsidiary's data is requested to improve a sister portal's ranking. Using only this chapter: what do you build, and how do you answer the request? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** How should a marketplace group collect, govern and use its data?\n\n> **Claim:** A marketplace group should collect, govern and use its data through three contracts: one tracking plan from which client SDKs are generated, whose events carry the listing ID, ranking and experiment context and consent state, with governed facts recorded on the server; a short catalog of governed liquidity metrics, each with one steward, written definition, computation and version, starting with a qualified contact counted once per buyer and listing with fraud excluded; and purpose-bound access policy for any use across brands; with domains owning data products on one shared, tenant-partitioned lakehouse whose sources enter through contracts and quality gates.\n\n**Disputed by:** The view that each brand keeps its own warehouse and definitions, that client analytics events are the record of behavior, and that the group compares brands by reconciling their dashboards; or the opposite, a central data team that owns every pipeline and table.\n\n**So what:** A Chief Architect who accepts this takes to the architecture forum, in order, who owns which governed metrics, the tracking plan with server-side facts, a durable copy in open formats partitioned by tenant, a purpose taxonomy co-owned with the data protection officer, and cost attribution; delivers the tracking plan and the contact definition on the existing warehouses before migrating storage; switches professional reports and the board pack to the new definition at the same time; and watches how often two dashboards disagree about the same number.\n\n**How and why:** In March 2027 Veldmark's CEO asked for contacts per live listing by brand and got three definitions from three warehouses: Femke's bike had 14 conversations in 24 hours and 52 contacts on Tradeyard's dashboard, one sender being the phisher; the Essen Golf's 23 leads came from 19 people. Under qualified contacts v1.0 the bike counts 13. The September 2027 decision put group data products as Iceberg tables on S3 partitioned by tenant, generated SDKs from tracking plan v1's 64 core events in place of about 1,140 event names in Tradeyard's apps and web, admitted every source through a contract, served twelve governed metrics from one catalog, and enforced Keybridge's isolation as audited access policy.\n\n**Supporting claims**\n\n- **S1** — One governed tracking plan, from which client SDKs are generated, is the real schema of a marketplace: its events carry the listing ID, ranking and experiment context and consent state on a common envelope so they join to domain events, and the facts the group counts are recorded on the server.\n- **S2** — The platform is one shared substrate: every source enters through a versioned data contract and quality gate, personal data is split into its own store at the gate, and the durable copy lives in open table formats partitioned by tenant, so the group can absorb or sell a brand.\n- **S3** — Domains own data products on that substrate (the team that owns a fact owns its source product; the team that owns a decision owns the consumer product), while the substrate, contracts, catalog and governance rules stay central.\n- **S4** — Metrics that compare brands or decide money are a short catalog of governed metrics, each with one steward, written definition, computation and version, monitored, starting with a qualified contact counted once per buyer and listing at server-side delivery with fraud excluded through a 72-hour restatement, and the same governed metric serves the board, experiments, billing and professional reports.\n- **S5** — Using data across brands is a decision about purpose under law and contract, so it is enforced as purpose-tagged, closed-by-default access policy with an audit trail, and a neutrality commitment such as Keybridge's is a policy an external reviewer can read.\n- **S6** — Quality, freshness and cost are owned, not defaulted: producers own quality at the source, freshness follows the consumer, every dataset and workload has a cost owner, and the contracts are delivered on the existing warehouses before storage is migrated.\n\n## Role in the part\n\nTurns the liquidity measures the earlier chapters rely on into governed data contracts the group can compare and the experiment and ML platforms can read. Supports P7-4 of part `part-7`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in scene poses the three contact definitions; metrics answers with the card and replay; practice gives Veldmark's whole design; `grouping` in trade-offs, verticals, failure-modes, ca-view, questions: the book's standard judging sections)\n\nThe scene comes first because its question is the one the chapter answers. Purpose comes next because the platform's consumers and the join of domain and behavioral events justify every later contract. The tracking plan precedes the architecture because the contract gate and the source products receive its events. The architecture precedes data products because ownership is assigned on a substrate the reader has seen; the architecture glosses data product in one clause where three of its layers hold them, and the next section defines the term. Adevinta Spain's personal-data split sits in the architecture beside the contract gate it belongs to, not in the tracking plan, where it would use data contracts before they are defined. Governed metrics come after data products because the contact definition lives in the contacts data product and counts server-side delivery events defined in the tracking plan; placed earlier, the card would name an owner and a fact the reader has not met. The quality controls sit in the architecture beside the contract gate where they start, because producers own quality at the source. Professional data and sharing extend the governed metric and access rules to external and cross-brand use, and freshness and cost keep the whole running. Veldmark's design can only be presented once all its parts exist, and the judging sections apply the whole design, so they come last.\n\n## Introduction\n\n**Hook** (`direct_statement`): Most marketplace data platforms are built backwards: warehouse first, tracking second, ML third, professional statistics last, until the platform holds a great deal of data and very few facts.\n\n**Bridge:** Part VI priced, billed and tested against contact counts, and web-and-seo-architecture steered Tradeyard on contacts from organic sessions without saying what a contact is in each brand. → The data platform, which applies Part VII's rule (a shared platform earns trust through contracts) to data and makes 'contact' mean the same thing in every brand.\n\n**Thesis statement** (KEY POINTS callout (three bullets), with p02 naming the four contracts and putting technology after them.): The tracking plan is the real schema of a marketplace; liquidity metrics must be governed metrics with one owner, definition, computation and version; ownership federates to domains on one shared substrate, and cross-brand sharing belongs in auditable, purpose-bound access policy.\n\n**Roadmap** (Paragraph p04, which names the sections in order and the kinds of evidence, with the IN THIS CHAPTER callout.):\n\n- Start at Veldmark, where one board question meets three warehouses and three definitions of a contact. *Kept in:* scene.\n- Say what a marketplace data platform is for and which kinds of data reach it. *Kept in:* purpose.\n- Specify the tracking plan, its envelope and consent. *Kept in:* tracking.\n- Lay out the architecture of one substrate with many owners, with its quality controls, and data products. *Kept in:* architecture, data-products.\n- Define governed metrics, starting with the contact definition card. *Kept in:* metrics.\n- Cover data for professionals, the limits on sharing across brands, and freshness and cost. *Kept in:* pro, sharing, quality.\n- Apply the design in Veldmark's Common Ground data platform. *Kept in:* practice.\n- Close with trade-offs, vertical differences, failure modes, the Chief Architect's view and questions. *Kept in:* trade-offs, verticals, failure-modes, ca-view, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Most marketplace data platforms are built backwards, warehouse first, then tracking, then ML, then professional statistics, so they end up holding a great deal of data and very few facts. | reasoning: Finance's warehouse arrives first; a vendor tracking snippet names events by sprint; ML finds impressions never logged with positions; dealer statistics disagree with the dealer's inbox. |  |\n| p02 | claim | This chapter takes the opposite route, applying Part VII's rule that a shared platform earns trust through contracts: starting from what a marketplace needs to know, it makes 'contact' mean the same thing in every brand and works back to four contracts (tracking plan, data contracts, governed metrics, purpose-bound access policy), with technology choices after them. |  | `problem_solution`: Platforms built backwards, and web-and-seo-architecture's organic contacts, which no brand defines the same way. → The opposite route: contracts first. |\n| p03 | context | Two neighbors own adjacent ground (event-driven-listings the listing stream, listing-data-management the system of record and erasure propagation), and experimentation and ml-platform build on the exposure, metric and training data designed here. |  | `contrast`: The four contracts this chapter owns. → What neighboring chapters own. |\n| p04 | transition | The chapter runs from Veldmark's board question through the platform's purpose, the tracking plan, the architecture with its quality controls, data products, governed metrics, data for professionals, sharing across brands and freshness and cost, to Veldmark's design and the judging sections, on evidence from classifieds engineering and investor sources, the data-mesh and lakehouse literature, EU law and the fictional Veldmark. |  | `sequence`: The chapter's scope and neighbors. → The order of the sections and the evidence they use. |\n\n## Sections\n\n### Setting the Scene at Veldmark: Three Warehouses, Three Contacts\n\n**Controlling idea** (`example`, id `scene`): Veldmark's CEO asks for comparable contacts per live listing and gets three definitions from three warehouses, which poses the chapter's question of who owns the word 'contact'.\n\n**Advances the thesis** (S4, S2): Shows the cost of ungoverned metrics and of keeping each acquired brand's warehouse.\n\n**Transition in:** `example`: The four contracts and the problem of platforms built backwards. → Veldmark as the running example.\n\n**Order of paragraphs** (`problem_solution`): The request comes first, then why it fails, then concrete listings, then the diagnosis that the rest of the chapter answers.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | example | On Monday 15 March 2027 Henrik de Boer, Veldmark's Group CEO, asks for last week's contacts per live listing for every brand by Wednesday, because the board pack will for the first time compare Tradeyard, Motorvane and Hearthly. | scenario: Henrik de Boer's e-mail of Monday 15 March 2027; the investor's operating partners want one comparable liquidity number. |  |\n| p06 | example | Priya Raman knows the three listing brands sit in different warehouses and each counts a contact correctly by its own, different definition, while Keybridge, on Azure Synapse, has no buyers and no contacts to count. | table: Tradeyard: every buyer message plus phone reveals; Motorvane: leads per channel (e-mail form, call of any length, test-drive booking); Hearthly: form or phone reveal deduplicated per user, listing and day, excluding new-build campaign pages. Tradeyard and Motorvane on separate Snowflake accounts, Hearthly on BigQuery, Keybridge on Azure Synapse. | `cause_effect`: The CEO's request. → Why it cannot be answered as asked. |\n| p07 | example | Ingrid Halvorsen shows Femke's bike, which had 14 conversations in 24 hours but 52 Tradeyard 'contacts', one of them from a phisher suspended within minutes. | scenario: Femke's €240 Rotterdam bike, 7 March, 14 conversations in 24 hours, 52 contacts counted, a phisher who sent a fake Safe Deal link at 20:11 and was suspended at 20:26. | `example`: Three definitions. → A listing that shows what one definition does. |\n| p08 | claim | Ingrid's diagnosis is that the group has no data problem but three definitions of its most important event, three event vocabularies and nobody who owns the word, and the chapter is the design that followed. |  | `conclusion_summary`: The two examples. → The diagnosis and the design that follows. |\n\n### What a Marketplace Data Platform Is For\n\n**Controlling idea** (`definition`, id `purpose`): A data platform is where the bounded contexts' facts meet; six kinds of consumers make it architecture, and liquidity can only be computed from the join of domain and behavioral events.\n\n**Advances the thesis** (S1, S2): Defines the platform and shows why its events must share identifiers.\n\n**Transition in:** `cause_effect`: Ingrid's diagnosis. → What the platform is for, before designing it.\n\n**Order of paragraphs** (`large_to_small`): Definition, then consumers, then the conclusion they force, then the kinds of data, the join that matters and the kind to retire.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | definition | A data platform is the shared pipelines, storage, compute, metadata and access controls through which data is used for anything other than serving the live product; it is not a system of record but the place where those records' facts meet. |  |  |\n| p10 | description | A listing marketplace needs six kinds of output from its data platform, each imposing its own requirement. | table: Steering, product analytics and experiments, machine learning, professional-seller data products, regulatory reporting, group data and partner products, with what each needs and the requirement it imposes. | `elaboration`: The definition. → The consumers the platform serves. |\n| p11 | analysis | The table is the argument for treating the platform as architecture rather than tooling, because a platform that must train ranking, guard experiments, serve 21,400 dealers and prove what happened to a listing cannot run on a weekly batch and a loose vocabulary. | statistic: Motorvane's 21,400 dealers. | `cause_effect`: Six consumers. → What their combined requirements imply. |\n| p12 | definition | Data reaches the platform in three forms, domain events, CDC snapshots and behavioral events, each with its own producer, meaning and contract owner, and confusing them causes most data quality problems. | table: Domain events, CDC snapshots, behavioral events: example, producer, what each can tell you, contract owner. | `elaboration`: Platform as architecture. → The kinds of data it receives. |\n| p13 | claim | Liquidity lives in the join of domain and behavioral events, so behavioral events must carry the same listing identifier, category version and experiment context as domain events, or the platform can only count. | figure: Figure 1: domain events and behavioral events joined on a shared listing ID. | `cause_effect`: Three kinds of data. → Why the domain and behavioral kinds must join. |\n| p14 | recommendation | CDC should be temporary in the data platform as well: it gets legacy history into the platform, but every CDC-fed table needs a planned replacement fed by domain events, because the monolith's schema was never designed for analysts. |  | `contrast`: Domain and behavioral events as the lasting sources. → The third kind, CDC, as a temporary one. |\n\n### The Tracking Plan: The Schema Nobody Can Recall\n\n**Controlling idea** (`claim`, id `tracking`): The tracking plan is the governed catalog of behavioral events and the most important schema in a marketplace, because client events cannot be recalled; it must record two-sided mechanics with a common envelope that carries consent.\n\n**Advances the thesis** (S1): Argues the tracking-plan contract.\n\n**Transition in:** `elaboration`: Behavioral events that must join to domain events. → The contract that governs them.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): Definition and claim first, then evidence from companies, then the contents of the plan, then consent and its consequence for counting.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p15 | definition | A tracking plan is the versioned catalog of behavioral events, and it is the most neglected schema in a marketplace because client events ship inside app binaries that cannot be recalled. |  |  |\n| p16 | evidence | Vinted (2019) and Zalando (2021) both found tracking schemas a precondition for trustworthy data: Vinted generated mobile tracking code from schemas and repaired web events in flight, and Zalando credited a team that unified the schema. | source: Vinted Engineering 2019 (two-week mobile rollout, Kotlin and Swift generated from schemas); Zalando Engineering 2021 ('unified the schema'). | `additional_support`: Client events cannot be recalled. → What two companies did about it. |\n| p17 | evidence | At group scale Adevinta's 2022 platform carried nearly a billion UBCT-classified events a day on Kafka in mixed Avro and JSON, the only cross-marketplace classification found, and the mixed formats show how hard one standard is to impose. | source: Adevinta Tech Blog, 2022: nearly a billion events a day, UBCT classification, Kafka as backbone, Avro and JSON topics (older evidence). | `additional_support`: Single-company evidence. → Evidence from a classifieds group. |\n| p18 | recommendation | A marketplace tracking plan must record two-sided mechanics, what supply was shown to whom, in what order and why, and what contact followed, in core events brands may extend but not redefine. | table: Eight core events (search_performed, results_impression, listing_viewed, contact_initiated, contact_delivered, saved_search_created/alert_opened, listing_submitted, experiment_exposure) with producer, required properties and why each is core. | `elaboration`: The case for a governed plan. → What a marketplace plan must contain. |\n| p19 | recommendation (list) | Every event carries a common envelope (IDs, times, the brand-and-country tenant, identifiers, build, consent state and experiment assignments), and two rules follow: facts are server-side and intentions client-side, and impressions are compacted, not dropped. | reasoning: Clients lose events to ad blockers, crashes and missing consent; impressions are needed for position-bias correction, ranking training and showing paid exposure. | `elaboration`: The core events. → What every event carries and the rules that follow. |\n| p20 | explanation | The consent state must travel with the event because EU law limits both collection (ePrivacy Art. 5(3)) and use (GDPR purpose limitation). | source: ePrivacy Directive Art. 5(3); GDPR Art. 5(1)(b). | `cause_effect`: Consent state on the envelope. → The law that requires it. |\n| p22 | recommendation | Consent biases client-side counts differently by country and device, so governed liquidity metrics should be built from server-side facts, with client events used for behavior and attribution and their coverage reported. | example: If 30% of web sessions decline analytics consent, client funnels are biased samples. | `cause_effect`: Consent on the event. → Its effect on what can be counted. |\n\n### Architecture: One Substrate, Many Owners\n\n**Controlling idea** (`description`, id `architecture`): A reference platform has five layers and one rule, every arrow in passes a contract, quality is controlled at the source at each layer, and its durable copy belongs in open formats partitioned by tenant because marketplace groups change shape.\n\n**Advances the thesis** (S2): Lays out the shared substrate, the contract gate, quality at the source and the storage decision.\n\n**Transition in:** `sequence`: The tracking plan as the contract for behavioral data. → The platform that receives all sources.\n\n**Order of paragraphs** (`large_to_small`): The whole architecture first, then its gate in detail and the quality controls that start there, then the storage choice and the reason it matters most for groups.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p23 | description | The reference architecture has five layers (collection, contract gate, source-aligned products, domain entities and metrics, consumer-aligned products) and one rule: every arrow into the platform passes through a contract; the paragraph glosses in one clause each the terms its table uses (data product, data contract, metrics layer) and says the owners follow the next section's rule. | figure: Figure 2: reference data platform with contract gates, a separate personal store, and metrics computed once.; table: Layer, responsibility, owner and interface for each of the five layers. |  |\n| p24 | evidence | The layering mirrors the medallion layout, and Adevinta Spain's 2024 account maps bronze, silver and gold onto data products with verticals as domains, while warning that wide domain tables bring privacy and governance challenges. | quotation: Adevinta Tech Blog, 2024: bronze 'a space for source-aligned data products'; silver 'one big tables'; warning on 'additional privacy and governance challenges as the table grows'. | `similarity`: The five layers. → A documented marketplace layout like them. |\n| p25 | definition | A data contract is a versioned, machine-readable agreement between producer and platform, and Adevinta Spain's immutable contracts, generated pipelines and quarantine tables cut Time to Effective Data from about five days to about 30 minutes. | case: Adevinta Spain 2024: JSON contracts in GitHub with schema URL, validity, personal fields, service levels; Airflow and Spark generated per contract; quarantine with raw event, error and version. | `elaboration`: The contract gate layer. → What a data contract is and one working example. |\n| p26 | recommendation | Three properties of that design are worth copying: immutable contracts, quarantine as feedback to producers, and personal data separated at the gate. |  | `cause_effect`: Adevinta Spain's contract gate. → What to copy from it. |\n| p21 | example | Adevinta Spain applies the third property in production: fields without analytical value are never ingested, and analytical personal data goes to a separate per-site personal table, which its 2024 post says makes right-to-be-forgotten requests easier. | source: Adevinta Tech Blog, 2024 (source-aligned data products). | `example`: Personal data separated at the gate. → How Adevinta Spain does it. |\n| p48 | recommendation | Validation at the gate is the first of several quality controls: quality is cheapest at the source, so the platform makes producers' obligations explicit with a control at each layer, each catching a different failure at the earliest point that can see it. | table: Schema validation and quarantine, volume and freshness checks per tenant, referential checks, metric anomaly detection, reconciliation: where each runs, what it catches. | `elaboration`: Validation and the personal-data split at the contract gate. → The quality controls at every other layer. |\n| p27 | comparison | For a group the storage decision is where the durable copy lives and in what format; of four options, open storage with a warehouse as main compute fits most marketplace groups in 2027. | source: Armbrust et al., CIDR 2021: lakehouse 'based on open direct-access data formats'.; table: One managed warehouse, lakehouse on open table formats, open storage plus a warehouse as main compute, one warehouse per brand: strengths, weaknesses, when right. | `sequence`: Contracts and quality controls at the gate and after it. → Where the data lives after the gate. |\n| p28 | claim | Portability weighs more in marketplaces because groups change shape, as Adevinta's 2025 move to a decentralized model shows, so a durable copy in open formats partitioned by tenant can be split when a brand is sold and can absorb an acquisition. | quotation: Strategic Report 2025, Aurelia UK Feederco Ltd (published 2026): 'a decentralised, standalone operating model', 'parallel running of central and local services'. | `cause_effect`: The recommended storage option. → Why portability decides it for marketplaces. |\n\n### Data Products: Federate Ownership, Not Substrate\n\n**Controlling idea** (`claim`, id `data-products`): Domains should own data products on one shared platform, as every documented classifieds case does, with ownership following the fact and the decision.\n\n**Advances the thesis** (S3): Argues federated ownership on a central substrate.\n\n**Transition in:** `elaboration`: One shared substrate. → Who owns what on it.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): Definition, cases, the reading of the cases, then the ownership rule it supports.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p29 | definition | A data product is a dataset a named team owns and publishes with a contract, service levels, access policy and support, a term from Dehghani's 2019 data mesh essay, which also called for a self-serve platform and global governance. | quotation: Dehghani, 2019: domains 'host and serve' datasets; 'data infrastructure components in a self-service manner'; standards 'should belong to a global governance'. |  |\n| p30 | evidence (list) | Classifieds cases show a consistent shape though not a uniform outcome: Adevinta moved from a centralized domain to a data products platform, Zalando kept central governance, and AutoScout24 cut dashboards and gave each an owner and definitions. | case: Adevinta Annual Report 2019 ('built once; used many times'); Adevinta Tech Blog 2023 and 2024 (data products platform, governance as code); SiliconANGLE 2021 on Zalando; AutoScout24 2025 (500+ dashboards to about 150). | `example`: The data-product definition. → How marketplaces applied it. |\n| p31 | analysis | Ownership federates but the substrate and the rules do not: every documented case keeps one platform, catalog and governance, which matters where 'data mesh' can become a polite name for three warehouses. | figure: Figure 3: anatomy of a data product; the contacts product read by board, dealer report and experiment. | `conclusion_summary`: The cases. → What they have in common. |\n| p32 | recommendation | The team that owns a fact in production owns its source and domain data products, and the team that owns a decision owns the consumer product, which gives a marketplace ownership matrix. | table: Listing history, search sessions and impressions, qualified contacts, moderation actions, orders and fees, market prices: owner, consumers, note. | `cause_effect`: Federated ownership. → The rule that assigns it. |\n\n### Governed Metrics: One Definition of a Contact\n\n**Controlling idea** (`claim`, id `metrics`): Liquidity metrics are two-sided and channel-dependent, so a governed contact definition with one owner, written rules and versioned restatement makes brands comparable, and a short monitored catalog is enough.\n\n**Advances the thesis** (S4): Argues and demonstrates the governed-metric contract.\n\n**Transition in:** `elaboration`: The contacts data product and its owner. → The governed definition that product publishes.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): Definition, the card, its reasoning and consequence for billing, the replay and its meaning, then scope of the catalog and its monitoring.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p33 | definition | A governed metric has a named owner, written definition, single computation, version and restatement rules, served by a metrics layer, and it is urgent in marketplaces because two-sided, channel-dependent metrics move by large factors with small choices. |  |  |\n| p34 | example | The contact definition card approved by Veldmark's forum in May 2027 fixes the name, owner, definition, channels, buyer identity, exclusions, timing, restatement and denominator of a qualified contact. | table: Qualified contact v1.0: first contact per distinct buyer and listing in a rolling 30 days; channels; exclusions including fraud or spam within 72 hours; counted at delivery; final after 72 hours; versions side by side for a quarter. | `example`: The governed-metric definition. → Veldmark's card for a contact. |\n| p35 | analysis | Each row closes an argument the brands had implicitly, and the 72-hour fraud restatement, which removes Femke's phishing buyer, ties liquidity to trust and safety and prevents Vanity Liquidity by definition. |  | `elaboration`: The card. → What each choice settles. |\n| p36 | recommendation | Billing and steering must derive from the same contacts data product even when billing is stricter, or the dealer's invoice and the board pack disagree. | example: Motorvane's proposed billable lead with its 14-day window (monetization-models). | `cause_effect`: One definition for steering. → Its consequence for billing. |\n| p37 | evidence | Before the forum approved the card, Priya's team tested it in April by replaying 8–14 March 2027, the week that began the day after Femke listed her bike, with the bike's first 24 hours, and added the Essen Golf in late April once its first 10 days were in (23 leads from 14 e-mails, 7 calls and 2 test drives, from 19 people, none excluded); the figures moved for each brand for a stated reason. | table: Bike 52 to 13; Essen Golf 23 to 19; Tradeyard index 100 to 37; Motorvane 100 to 86; Hearthly 100 to 106, with why each moved. | `time`: The definition on the card. → The April replay that tested it before approval. |\n| p38 | analysis | The headline was not Tradeyard's fall but that the brands' figures moved by different amounts and in different directions, so the old comparisons had been distorted and for the first time the brands could be compared on one definition; the country figures behind the Tradeyard row showed Tradeyard Portugal far below the Netherlands. | figure: Figure 4: one ruler replaces each brand's own, bike from 52 to 13.; figure: Figure 5: how a qualified contact is computed from the server-side delivery event with 72-hour restatement. | `cause_effect`: The replayed figures. → What they revealed. |\n| p39 | recommendation | Govern only metrics that compare marketplaces or decide money; Veldmark's first catalog has twelve. | fact: Twelve governed metrics, from live listings to removals per thousand new listings. | `sequence`: The first governed metric. → Which others to govern. |\n| p40 | evidence | Governed metrics need monitoring, as Adevinta Benelux's Artemis showed by catching a drop of about 100,000 leads a day on iOS, because an instrumentation failure looks like a liquidity collapse. | statistic: Adevinta Tech Blog, 2024: more than 140 metrics, a drop of about 100,000 leads a day worth about €41,000 a day, fixed in under a day. | `additional_support`: The catalog. → What keeps it trustworthy. |\n\n### Data for Professionals: Insights as a Product\n\n**Controlling idea** (`explanation`, id `pro`): Professional data products are served, tenant-isolated, causal where they claim value and aggregated with minimum cell sizes, and they must read the same governed contact metric as the board.\n\n**Advances the thesis** (S4, S3, S5): Extends governed metrics and access policy to external consumers.\n\n**Transition in:** `elaboration`: Governed metrics for internal consumers. → The same metrics served to professional sellers.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p41 | definition | A pro data product is any dataset served to professional sellers, and real-estate portals go further and sell valuation data, as Meilleurs Agents and Scout24 report and Valuo does for Veldmark. | statistic: Meilleurs Agents: 6% median estimate error for 2021 (self-reported, older); Scout24 Transaction Enablement €106.6 million for 2025. |  |\n| p42 | explanation (list) | Pro data products differ from internal analytics in four ways that change the architecture: they are served, customer-isolated, causal where they claim value, and aggregated with minimum cell sizes. | case: OLX Tech Blog, 2026: propensity-score matching estimated +17.6% to +97.4% uplift between packages, validated by a randomized test. | `contrast`: What pro data products are. → How they differ from internal analytics. |\n| p43 | recommendation | Pro data products must read the same governed contact metric as the board, or the marketplace loses an argument with its dealers it cannot afford to lose. |  | `cause_effect`: Four differences. → The one thing that must stay the same. |\n\n### Sharing Data Across Brands: The Legal and Commercial Limits\n\n**Controlling idea** (`claim`, id `sharing`): Cross-brand data flows are limited by purpose, consent, controller boundaries and contracts, so the architecture must make the difference between legitimate and forbidden flows enforceable as access policy.\n\n**Advances the thesis** (S5): Argues purpose-bound access policy.\n\n**Transition in:** `contrast`: Data served within a brand's own customers. → Data used across brands.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The claim, the legal frame, then two Veldmark cases from hard isolation to a borderline decision.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p44 | claim | Pro data products stay inside one brand, but the synergy case assumes data flows freely between brands, while some flows are legitimate, some need a new basis and some are forbidden, so the architecture must make the difference enforceable. |  | `contrast`: Data served within a brand's own customers. → Data used across brands. |\n| p45 | explanation | Four regimes limit sharing, and each becomes a control the platform enforces (purpose tags, consent filters, legal-entity attributes or hard isolation) rather than a rule people must remember. | table: Purpose limitation, consent and ePrivacy, controller boundaries, contracts and competition: what each constrains and its architectural consequence. | `elaboration`: Flows must be told apart. → The limits that tell them apart. |\n| p46 | example | Keybridge's neutrality is enforced as architecture: its Synapse environment is not federated, only contract-named aggregate fields leave it, and the policy and audit log are readable by the independent reviewer. | scenario: March 2027 Keybridge decision; Emma Laurent's request accepted by Ingrid. | `example`: The contracts-and-competition row. → Veldmark's most sensitive case. |\n| p47 | example | In Poland the line falls between aggregated market data, a group analytics question, and dealer-level data used across brands, a commercial decision for the forum and legal. | scenario: Tradeyard's cars section and Motorvane compete for the same Polish dealers; aggregated price levels and demand by region versus one brand's dealer-level performance data used for the other's sales calls. | `contrast`: A case of hard isolation. → A case decided by aggregation level. |\n\n### Freshness and Cost\n\n**Controlling idea** (`recommendation`, id `quality`): Once access policy settles what may be used, freshness should follow the consumer and cost needs an owner or it grows with traffic.\n\n**Advances the thesis** (S6): Argues owned freshness and cost.\n\n**Transition in:** `sequence`: The access contracts on what data may be used. → Keeping the platform useful and affordable: freshness and cost.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p49 | recommendation | Freshness targets should follow the consumer: board metrics at D+3, experiment guardrails in hours, fraud features in seconds outside the analytical platform. |  | `sequence`: The access contracts on what data may be used. → Keeping the platform useful and affordable: freshness and cost. |\n| p50 | recommendation (list) | Behavioral data grows with traffic, not revenue, so cost needs owners, retention tiers, compact envelopes and removal of unused datasets. | statistic: Adevinta Tech Blog, 2024: logging cost cut 35%, more than €30,000 a year; Adevinta multi-cloud governance on ownership metadata; AutoScout24 500+ to about 150 dashboards. | `sequence`: Freshness. → Cost. |\n\n### In Practice: Veldmark's Common Ground Data Platform\n\n**Controlling idea** (`example`, id `practice`): Against a €21 million data estate built on three warehouses, Veldmark's September 2027 design applies the chapter in five decision records and delivers the contracts before the storage migration.\n\n**Advances the thesis** (S1, S2, S4, S5, S6): Applies every supporting claim to the scene's problem.\n\n**Transition in:** `problem_solution`: The scene's three warehouses and three contacts, and the design rules built since. → The design Veldmark adopted.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p51 | evidence | Veldmark spent about €21 million on its data estate in 2026 for about 2.6 billion behavioral events a day, most of it on three separate warehouses, and Common Ground, the group's 2027–2030 shared-platform program, targets €13 million a year by 2030. | statistic: €21M: Snowflake €11.5M, BigQuery €4.2M, Synapse €1.1M, tracking and BI €4.2M; 2.6B events a day, 1.9B Tradeyard; €13M target toward the €38M run-cost reduction. |  |\n| p52 | example (list) | The design taken to the forum in September 2027 had five parts: open storage with one main engine, one tracking plan with generated SDKs, contracts at the gate, twelve governed metrics, and purpose-bound access. | scenario: Iceberg on S3 partitioned by tenant and time; Snowflake as main compute; Hearthly on BigQuery through 2028; 64 core events replacing about 1,140 names; Yardstick CDC under contract; qualified contacts v1.0 with legacy metrics labeled for a quarter; purpose tags owned by Lucía Ortega. | `problem_solution`: The cost of three warehouses and three contacts. → The five-part design that answered them. |\n| p53 | recommendation | The forum had approved the contact definition in May; in September it decided to deliver that definition's rollout and the tracking plan first, on the existing warehouses, leaving storage migration for 2028; listing history was built on the event backbone rather than CDC, and Felix Brandt accepted the shared definition on condition that dealer reports switch with the board pack. | scenario: Storage migration left for 2028; event backbone live since 1 July 2027 (Listing event contract v1). | `time`: The five parts. → The order they were delivered in. |\n\n### Trade-offs\n\n**Controlling idea** (`comparison`, id `trade-offs`): Each of the platform's main choices has two defensible options, and the chapter's rule picks by what the data is used for: central and server-side for what compares brands or decides money, local for the rest.\n\n**Advances the thesis** (S2, S3, S4, S5): Shows the conditions under which each contract applies.\n\n**Transition in:** `conclusion_summary`: The design and its application. → The choices behind it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p54 | comparison | Veldmark's design settled seven recurring choices, each with two options, and the chapter's answer depends on whether the data compares brands, decides money or crosses a brand boundary. | table: Where metrics are defined, behavioral collection, facts for liquidity, durable storage, ownership, personal data, cross-brand data: option A, option B, how to choose. |  |\n\n### Vertical Differences\n\n**Controlling idea** (`comparison`, id `verticals`): Contact channels, outcome data, pro products and sensitive data differ by vertical, and real estate and general classifieds differ most in where outcome data comes from.\n\n**Advances the thesis** (S4, S2): Shows the governed metrics and contracts varying by vertical.\n\n**Transition in:** `contrast`: Choices that hold across marketplaces. → How they differ by vertical.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p55 | comparison | The vertical changes what a contact is, where outcomes come from and which data is sensitive. | table: General classifieds, real estate, automotive, jobs: dominant contact channel, hardest metric, outcome data, pro data product, sensitive data, volume driver. |  |\n| p56 | example | Real estate needs external outcome data under its own contracts and licensing, while general classifieds stop at the contact unless on-platform payments such as Safe Deal supply an outcome. | example: Public transaction records (France's DVF) and agencies' reported sales in real estate; Tradeyard Safe Deal as the on-platform outcome in general classifieds. | `elaboration`: The vertical table. → The two verticals that differ most on outcomes. |\n\n### Failure Modes\n\n**Controlling idea** (`analysis`, id `failure-modes`): The platform fails in recognizable ways when one of its contracts is missing.\n\n**Advances the thesis** (S1, S2, S3, S4, S5): Shows the cost of ignoring each supporting claim.\n\n**Transition in:** `contrast`: What the right design looks like. → What goes wrong without it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p57 | analysis (list) | Eight failure modes, from counting messages as contacts to unaudited cross-brand access, each have a cause and a fix from the chapter. |  |  |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `ca-view`): The data platform is a set of contracts the Chief Architect must make someone own: five decisions in order, named deciders and signals to watch.\n\n**Advances the thesis** (S4, S1, S2, S5, S6): Turns the design into group-level decisions.\n\n**Transition in:** `cause_effect`: The failure modes. → The decisions that prevent them.\n\n**Order of paragraphs** (`order_of_importance`): Decisions first, then their owners, then the signals that show whether they hold.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p58 | recommendation (list) | Five decisions go to the architecture forum in order: governed metrics and their owners, the tracking plan with server-side facts, where the durable copy lives, the purpose taxonomy and access model, and cost attribution. |  |  |\n| p59 | recommendation | Each decision has an owner: the Chief Architect for shape and contract mechanisms, the Head of Data & ML for substrate and stewardship, domains for data products, the CPO for steering metrics, the DPO for purposes. |  | `sequence`: What to decide. → Who decides. |\n| p60 | recommendation | What to watch includes server-side share of governed metrics, contract coverage, quarantine rates, consent coverage, cost per thousand live listings and, most telling, how often two dashboards disagree. |  | `sequence`: Who decides. → What to watch. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Ten questions test a marketplace's data platform against the chapter's contracts.\n\n**Advances the thesis** (S1, S2, S3, S4, S5, S6): Gives an audit drawn from every section.\n\n**Transition in:** `cause_effect`: The Chief Architect's decisions. → Questions that test whether they are made.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p61 | recommendation (list) | Ten questions test the contact definition, server-side facts, impressions, contracts, personal data, separability, cross-brand flows, report consistency, cost ownership and instrumentation monitoring. |  |  |\n\n## Conclusion: From Measurement to Causation\n\n**Synthesis:** The contracts, not the engines, answered Henrik's question: a tracking plan with server-side facts, one governed contact definition and purpose-bound access let every report that reads the contacts product give the same number.\n\n**So what:** Measurement the group can compare is what lets it ask whether a change caused an effect; without it, experiments and models argue over definitions.\n\n**Callback:** Henrik de Boer's request for comparable contacts per live listing, and the opening's platforms built backwards with much data and few facts. The reader now sees the question answered with one number per brand, and Femke's bike counting 13 wherever it is read.\n\n**Takeaway** (`course_of_action`): Deliver the tracking plan and the contact definition first, on the warehouses you have, and switch the board pack and professional reports together.\n\n**Hand-off** to [Testing a Two-Sided Market: Experimentation Platforms](experimentation.html): `sequence`: One definition of a contact, exposure logged with its ranking context and shared data products give trustworthy measurement. → The next question after measurement, causation: whether a change caused an effect when buyers and sellers affect each other.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p62 | synthesis | The contracts, not the choice of engine, answered Henrik's question, so the group now has facts rather than data, and the first step for any group is to deliver the tracking plan and the contact definition on the warehouses it has. |  |  |\n| p63 | transition | With one definition of a contact, exposure logged with its ranking context and shared data products, Veldmark can ask whether a change caused an effect, which in a two-sided market is harder than an A/B tool suggests and which experimentation takes up. |  | `cause_effect`: Trustworthy measurement. → The question it makes possible: causation. |\n\n## Non-goals\n\n- The listing event stream, outbox and schema evolution. See [Every Change Is an Event: Event-Driven Listing Architecture](event-driven-listings.html).\n- Systems of record, read models and erasure mechanics across operational copies. See [System of Record and Read Models: Listing Data Management](listing-data-management.html).\n- Experiment design and statistics. See [Testing a Two-Sided Market: Experimentation Platforms](experimentation.html).\n- Feature stores and model governance. See [Models in Production: ML Platforms and Use Cases](ml-platform.html).\n- Advertising consent mechanics and audiences. See [Selling Attention: Display, Native and Retail-Media Advertising](advertising-platforms.html).\n- Regulatory detail of DSA and DAC7. See [Rules of the Marketplace: DSA, DAC7 and Vertical Regulation](marketplace-regulation.html).\n- Pro tooling product design. See [Serving the Pros: Dealer, Agent and Merchant Tooling](professional-seller-tooling.html).\n- The tenancy model in full. See [One Platform, Many Marketplaces: Multi-Country and Multi-Brand Architecture](multi-country-platforms.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Thesis rubric (pass), notes not taken because the claim is copied from the journal spec: the claim says 'three contracts' but also names a fourth element (domain data products on one lakehouse); S6 (owned quality, freshness and cost; contracts before migration) supports the so_what more than the claim; S2 adds the personal-data store and separability, which the claim does not name. S4's fraud wording was aligned with the claim.\n\n## Decision log\n\n- **2026-10-19** — Built the chapter around one board question ('how many contacts last week?') rather than a technology survey, because the governed contact metric is where the platform's value and politics are both visible.\n- **2026-10-19** — Recommended open table formats plus a warehouse as main compute, rejecting 'one warehouse' (blocks acquisitions on other clouds) and 'warehouse per brand' (Deal-Shaped Architecture), citing Adevinta's 2025 decentralization as the portability argument.\n- **2026-10-19** — Made 'server-side for facts, client-side for context' a core rule, because consent and client loss bias client-side counts differently by country.\n- **2026-10-19** — Treated Keybridge neutrality as the canonical cross-brand sharing case, expressed as access policy with external audit.\n- **2026-11-12** — spec.md's seven success criteria were inventories or covered by the journal entry's outcome (know, believe, can_do) and AC-1 to AC-3; none is carried over. 'Every company claim carries a dated source' and the diagram and table counts are house-style rules kept in the style guide. Rejected: Carrying the criteria over as they were.\n- **2026-11-12** — Added a roadmap paragraph (p04) naming the sections and kinds of evidence so a reader of the opening can predict the chapter (AC-2). Rejected: Relying on the IN THIS CHAPTER callout, which names topics but not sections.\n- **2026-11-12** — Gave Trade-offs and Vertical Differences one lead-in sentence each (p54, p55) so each table belongs to a unit. Rejected: Leaving the tables unattached, which hides them from the draft readers.\n- **2026-11-12** — Added a synthesis paragraph (p62) before the published hand-off so the conclusion has a synthesis, so-what, callback and takeaway; the published hand-off paragraph is kept as p63. Rejected: Rewriting the published hand-off paragraph to carry all five.\n- **2026-11-12** — Glossed 'tenant' on first use (the journal spec's Part VII flow note): a professional customer in the consumer table, and one brand in one country at the envelope, with a pointer to multi-country-platforms.\n- **2026-11-12** — Draft check round 1 (escalate on two spec faults, both corroborated by the two flow readers): the architecture table used data product, data contract and metrics layer before they were defined, so p23 now glosses all three (data products defined in the next section, the other two later) rather than moving Data Products ahead of the architecture; Veldmark's 2026 data-estate cost and the Common Ground target (p51) moved from Quality, Freshness and Cost to the start of In Practice, where it sets the baseline the design answers. Draft revised at the failing units: Part VII's rule now points to the part introduction; Keybridge's absence from the contact table explained at its first mention; the Essen Golf presented as a second example the team added after the March meeting (Ingrid shows only the bike), removing a March meeting that showed April data; 'lakehouse' glossed with a pointer;
