<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, acceptance criteria AC-1 to AC-3, the thesis and the role are copied unchanged from the normalization-and-enrichment entry in journal-spec.json. Three units were added to the published text: a roadmap paragraph in the introduction (p04), a lead-in to the trade-offs table (p42) and two closing paragraphs before the hand-off (p60, p61).\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The difference between normalization (a stated value in canonical form, meaning unchanged) and enrichment (facts nobody stated, from registries, models and platform computations), and the ten deterministic normalization steps.\n- **Know:** The provenance record and its seven source classes, and the real cost drivers of enrichment at classifieds volume: re-processing, evaluation and human review.\n- **Believe:** A derived value must never silently overwrite an asserted one, and who wins between seller, feed, registry and model is a product and legal decision per attribute, not an engineering default.\n- **Be able to:** Specify a provenance record and a per-attribute precedence policy, and design an enrichment pipeline whose steps are idempotent, versioned and replayable.\n- **Be able to:** Decide which enrichers a group shares across brands and which stay in the verticals, and plan a quarter's re-processing budget.\n\n**Audience:** Chief and principal architects, data and ML leads, and listing-data owners in classifieds, real-estate and automotive marketplaces.\n\n**Already knows:**\n\n- APIs, databases, event streams, search engines and Kubernetes (the book's baseline), data pipelines and the basics of machine learning.\n- Part II's listing model: the listing aggregate, the canonical category tree, the attribute dictionary and compiled category schemas, the media pipeline and the location model.\n- Part III so far: the ingestion channels, feed contracts, the partner's run report and the one write path into the listing service.\n- Veldmark, its brands (Tradeyard, Motorvane, Hearthly, Keybridge), its cast and the fifteen failure-pattern names.\n\n**Does not yet know:**\n\n- Normalization, enrichment and attribute provenance as this chapter defines them.\n- VIN decoding, German type-approval codes (HSN/TSN) and licensed vehicle-specification data.\n- French reference data: DVF transaction data, the DPE energy certificate and the Base Adresse Nationale.\n- OCR (optical character recognition) as a moderation and enrichment service.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a corrected decoder release, the reader re-runs enrichment without overwriting values dealers fixed by hand, and says what made that possible. *Probe:* Your VIN-decoder supplier ships corrected data for a popular engine family. Some dealers had fixed the decoded power value by hand on their listings. Using only this chapter: how do you apply the correction, and what must already be in place? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-4 | Given a model's value that contradicts a legally required disclosure, the reader says what the platform does with each value and why. *Probe:* An agency lists a flat in France with energy class D. Your image-and-text model predicts class C, and the agency supplied the energy certificate's number. Using only this chapter: what does the platform show, what does it do with the model's value and the certificate, and why? | `custom` | cold_reader | minor |\n| AC-5 | Given a quarter with several schema changes and model releases, the reader names the cost drivers in order of size and the ways to contain them. *Probe:* This quarter your group plans a category split, a schema change and a new extraction-model version, each touching about 13 million live listings. Using only this chapter: which costs should the plan include, which is likely the largest, and how do you keep them down? | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** How do you turn heterogeneous input into consistent, enriched listings?\n\n> **Claim:** Normalization and enrichment are different operations that one pipeline must keep apart in the record: every value is stored in its dictionary's canonical form next to the original as received, with provenance saying who stated or derived it, by which process and version, with what confidence; precedence between seller, feed, registry and model is a per-attribute policy in the attribute dictionary that never lets a derived value silently overwrite an asserted one; and enrichment runs as a versioned, replayable pipeline of idempotent steps that writes back to the listing's system of record, budgeted for re-processing and human review, which cost more than the model calls.\n\n**Disputed by:** The common practice of cleaning values in place on import, writing derived values into the same attribute columns as seller statements (or only into the search index), letting the most recent writer win, and budgeting machine-learning enrichment by the price per model call.\n\n**So what:** A Chief Architect who accepts this makes provenance a group standard before the pipelines multiply (Veldmark adopts one vocabulary in October 2027), shares generic enrichers (geocoding, translation, image classification, a model gateway) while keeping VIN decoding and energy-certificate checks in the verticals, puts every enricher including rule tables under model governance, and plans each quarter's backfills with their compute and reviewer cost.\n\n**How and why:** Yardstick had no place to store a value the seller had not typed, so extracting the missing frame sizes (23% coverage on bike listings) would have made model output look like seller statements. Motorvane found cars rated against the wrong engine variant because a decoder value had replaced a dealer value, and could not re-run corrected decoding without overwriting dealers' fixes because nothing recorded which value came from where. In the Veldmark cost model, one backfill of Tradeyard's 13.2 million live listings costs roughly €5,000 in model calls, while reviewing uncertain values takes about 270 reviewer-hours a week.\n\n**Supporting claims**\n\n- **N1** — Normalization (a stated value put in canonical form, meaning unchanged) and enrichment (a fact nobody stated) are different operations with different owners, tests and rules for being overwritten.\n- **N2** — Every attribute value is stored in canonical form next to the original as received, with a provenance record of who stated or derived it, by which process and version, with what confidence and when.\n- **N3** — Precedence between seller, feed, registry and model is a per-attribute policy in the attribute dictionary that keeps every source's value and never lets a derived value silently overwrite an asserted one; legally required disclosures are verified, never derived.\n- **N4** — Enrichment runs as a pipeline of versioned, idempotent steps that writes back to the listing's system of record, releases new versions behind evaluation gates and can be replayed or rolled back value by value.\n- **N5** — At classifieds volume, re-processing, evaluation and human review cost more than the model calls, so they are planned and budgeted like migrations.\n\n## Role in the part\n\nTurns accepted records into comparable, trustworthy values with recorded origins, which entity resolution matches on and search filters on. Supports P3-2 of part `part-3`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in scene to architecture: the two Veldmark failures first, then the vocabulary, operations and pipeline that resolve them; `small_to_large` in in-practice to questions: worked cases, then cost, then the decisions a group faces)\n\nThe chapter follows the book's chapter shape and each section supplies what the next needs. The scene comes first so the reader holds the two failures (a model value with nowhere to live, a decoder value that overwrote a dealer's) that every later rule answers. The concepts section defines normalization, enrichment, canonical and original values and provenance before the normalization steps and enrichers use those words. Normalization comes before enrichment because enrichers read normalized values. The architecture follows both, because its rules (write-back, idempotency keys, precedence, release gates) govern the steps just described. The worked cases then apply the rules to the Golf, the bikes, the Lyon flat and Tradeyard Belgium, and the cost section prices the pipeline only once the reader has seen what re-processing and review are. Trade-offs, vertical differences, failure modes, the Chief Architect's view and the questions draw on all of it. Moving the architecture before the concepts would use provenance and precedence before they are defined; moving the cost before the cases would quote backfill and review figures for a pipeline the reader has not yet seen run.\n\n## Introduction\n\n**Hook** (`intriguing_example`): A dealer management system writes \"48.000 km\" with a German four cases, prices the work and ends with trade-offs, vertical differences, failure modes, the Chief Architect's view and questions to ask, drawing on public engineering sources, standards, registries and the fictional Veldmark. | reasoning: The sections in order: the scene; the concepts; the ten normalization steps; registry and model-based enrichment; the replayable pipeline with versioned enrichers, quality scores and human correction; the Golf, the bikes, the Lyon flat and Tradeyard Belgium; the cost; trade-offs, vertical differences, failure modes, the Chief Architect's view and questions. | `sequence`: The chapter's scope. → The order in which it covers that scope, and Veldmark as the source of the worked examples. |\n\n## Sections\n\n### Setting the Scene at Veldmark: Which of These Values Did Anybody Say?\n\n**Controlling idea** (`context`, id `scene`): In April 2027 two Veldmark problems, missing bike attributes with nowhere to store a derived value and decoder values that overwrote dealers' values untraceably, reduced to one question: for each value, who said it, what was done to it and may it be changed?\n\n**Advances the thesis** (N2, N3): Shows the two failures that provenance and per-attribute precedence prevent.\n\n**Transition in:** `example`: The roadmap's first item: two Veldmark problems in April 2027. → The bike filters, the Essen Golf and Ingrid's question.\n\n**Order of paragraphs** (`chronological`): The product review, then the same week's Motorvane example, then the slide that joins them. The question only makes sense after both examples.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | example | Tradeyard Netherlands wanted to extract missing bike attributes with a language model, but Yardstick had no place to store a value the seller had not typed. | scenario: About 23% of live bike listings carried a frame size and fewer than half said whether the bike had electric assist; Priya Raman proposed model extraction; Daan Visser pointed out that anything written into Yardstick's attribute columns would look like a seller statement. |  |\n| p06 | example | At Motorvane, the Essen Golf showed decoding filling 31 attributes, and older listings showed decoder values that had silently replaced dealer values, so a supplier's correction could not be applied without overwriting dealers' fixes because nothing recorded where values came from. | scenario: The 2021 Volkswagen Golf 1.5 TSI from Autohaus Ruhrblick, arrived 14 April 2027; VIN decoding filled 31 attributes; rated 'good price' against €22,800 for its €21,900 asking price; older listings rated against the wrong engine variant. | `similarity`: A derived value with no recorded origin, at Tradeyard. → The same gap at Motorvane, where it had already done harm. |\n| p07 | claim | Ingrid Halvorsen reduced both examples to one question, whether the group knows for each value who said it, what was done to it and whether it may be changed, and the chapter is the design that answers yes. |  | `conclusion_summary`: The Tradeyard and Motorvane examples. → The single question they share, which the rest of the chapter answers. |\n\n### Concepts: Canonical Values, Derived Facts and Their Origins\n\n**Controlling idea** (`definition`, id `concepts`): Normalization and enrichment are different operations, each value is kept in canonical and original form, and a provenance record with a closed set of source classes says where each value came from.\n\n**Advances the thesis** (N1, N2): Defines the distinction and the record the thesis depends on.\n\n**Transition in:** `problem_solution`: Ingrid's question about who said each value. → The vocabulary needed to answer it.\n\n**Order of paragraphs** (`prerequisite_order`): The distinction first, then the two stored forms of a value, then the provenance record, then its source classes, then where the record lives. Each step uses the term defined before it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | comparison | Normalization and enrichment have different owners, tests and rules for being overwritten, because a normalized value is still the seller's statement and an enriched one is the platform's assertion. | table: Normalization versus enrichment: what it does, example ('48.000 km' to 48,000 km; VIN to body type HATCHBACK), whether meaning changes, determinism, provenance, failure mode.; figure: Figure 1: a seller's value translated into a canonical tag beside a registry lookup that adds tags nobody typed. |  |\n| p09 | definition | Each attribute value is stored twice, as a canonical value for every system that compares or computes and as the original value with unit and locale for display, audit and re-normalization. | source: Schema.org QuantitativeValue with UN/CEFACT unit codes KMT and SMI; Google Merchant Center prices as a number plus an ISO 4217 code. | `elaboration`: A normalized value that is still the seller's statement. → The two forms in which every value is kept. |\n| p10 | definition | Provenance is a small record attached to every attribute value, giving source, asserting party, process and version, confidence, alternatives, status and time; the Golf's power, where the decoder returned two candidates and the dealer's value matched one, shows why it needs more than a source. | example: The Golf's power explained before the record: the VIN decoder returned two candidates, 96 and 110 kW (two derivatives of the model), and the dealer's 96 kW matches one, so the conflict is resolved; then the record of vehicle.power_kw: canonical 96, original '96 kW' (de-DE), partner_feed via TSP-031, normalizer units@2027.03, registry alternatives 96 and 110 from licensed-vin@2027.04, with forward pointers to the registry section and the Golf case. | `elaboration`: The canonical and original values. → The record that says where each came from. |\n| p11 | definition | Provenance uses seven source classes that should be a closed vocabulary across the group, each with its own default trust. | table: seller, partner_feed, registry, catalog, model, moderator, platform, with meaning, typical examples and default trust. | `elaboration`: The source field of the record. → The closed set of values it may take. |\n| p12 | context | The listing aggregate holds the values with provenance and the attribute dictionary says per attribute which sources are allowed and how conflicts resolve, while this chapter's pipeline produces the records. |  | `place`: The provenance record and its source classes. → Where the record lives and who sets the precedence rules. |\n\n### Normalization: Ten Deterministic Steps\n\n**Controlling idea** (`process`, id `normalization`): A multi-country listing platform needs ten small, deterministic normalization steps, each versioned, flagging rather than guessing, with owned mapping tables.\n\n**Advances the thesis** (N1, N2): Shows normalization as meaning-preserving, deterministic and replayable, with the original kept.\n\n**Transition in:** `sequence`: Normalization as defined in the concepts. → The concrete steps it consists of.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p13 | process | In my judgement any listing platform operating in several European countries needs the same ten normalization steps, each with a failure it prevents and a rule. | table: Encoding, text, numbers and locale, units, enumerations, named entities, dates and times, prices and currency, addresses, phone numbers and contact data, with what goes wrong and the rule.; fact: Vinted: about 2,000,000 unique brand values restricted to about 40,000 verified brands, cutting P99 facet latency by about 15 ms.; fact: mobile.de: ISO 8601 date-times in the Europe/Berlin offset and yyyyMM first registration; libpostal 99.45% full-parse accuracy, 60+ languages, about 1.8 GB model; Base Adresse Nationale under Etalab 2.0. |  |\n| p14 | recommendation | Three design rules apply to every step: normalizers are versioned code with test suites, failure to normalize is a flag rather than a guess, and mapping tables are data with owners. |  | `conclusion_summary`: The ten steps. → The rules that apply across all of them. |\n\n### Enrichment: Facts Nobody Typed\n\n**Controlling idea** (`description`, id `enrichment`): Enrichment adds facts nobody typed, from registries where they exist and from models otherwise, and the public evidence says models should propose values against a schema passed in, be validated and be released behind measured gates.\n\n**Advances the thesis** (N1, N4): Shows enrichment as meaning-adding and versioned, and gathers the evidence for gated, schema-driven model enrichment.\n\n**Transition in:** `contrast`: Normalization, which never changes meaning. → Enrichment, which adds facts.\n\n**Order of paragraphs** (`large_to_small`): The four jobs and the list of enrichers first, then registries (vehicles, then what they teach, then real estate), then models. Registries come before models because where the truth exists elsewhere, decoding beats extraction.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p15 | description | Enrichment adds facts sellers cannot know, fills attributes sellers did not provide, adds platform-computed signals and prepares the listing for other languages and systems. | table: Ten enrichments grouped by the four jobs in a Job column (facts sellers cannot know: registry decoding, geocoding, property and regulatory data; attributes sellers did not provide: category prediction, text and image extraction; platform-computed signals: market value, quality scores; other languages and systems: translation, embeddings), with inputs, outputs, source class and owner. |  |\n| p16 | evidence | Where a registry exists, decoding beats extraction from text, and vehicle marketplaces decode VINs and type-approval codes against public or licensed specification data. | source: NHTSA vPIC: batches of up to 50 VINs, partial VINs with '*', downloadable databases; mobile.de Seller-API: hsn, tsn and schwackeCode from Eurotax/Schwacke; Autotrader UK: taxonomy to derivative, valuations keyed on derivative ID, first registration and mileage. | `elaboration`: Registry decoding, the first enrichment in the table. → Vehicle registries and decoders. |\n| p17 | analysis | Decoders return families of candidates as well as exact answers and change with the supplier's releases, so each decoded value must record its decoder and data version. |  | `cause_effect`: Decoding against licensed data. → The two lessons decoders teach the pipeline. |\n| p18 | evidence | Real estate has registries too, but authoritative does not mean clean, so provenance must say which register and extract a value came from. | source: DVF transaction register, last five years, updated in April and October; ADEME DPE dataset of existing dwellings since July 2021, updated weekly, about 15.8 million records as of October 2026, raw diagnostician input ADEME does not correct. | `similarity`: Vehicle registries. → Property registries and their limits. |\n| p19 | evidence (list) | The public evidence on model-based enrichment points one way: propose values against a schema passed in, validate the output, gate releases on measured precision, and keep the big model offline and the small model online; two further cases add that enrichers depend on each other and that large receivers classify for themselves. | case: Mercari title suggestions (2023), dynamic attributes with a fine-tuned 2B model (2024) and re-categorization estimated at USD 1 million and 1.9 years (2024); Etsy's reported 31% to 91% coverage via a third-party summary (2025); Adevinta OCR at 330 million requests a month (2023); mobile.de price rating recalculated when images arrive (n.d.); Google Merchant Center's automatic categories (n.d.). | `contrast`: Registries, where the truth exists elsewhere. → Models, used where it does not. |\n\n### Architecture: A Replayable Pipeline That Writes Back\n\n**Controlling idea** (`process`, id `architecture`): Enrichment runs as a loop around the listing service whose rules (write-back, idempotency keys, declared dependencies, no silent overwrites, a small blocking set) make it replayable, with versioned releases, quality scores and human correction loops around it.\n\n**Advances the thesis** (N3, N4): Specifies the pipeline the thesis calls for and the precedence rule it enforces.\n\n**Transition in:** `problem_solution`: Many enrichers, registry and model, each with its own version. → The pipeline that runs them safely.\n\n**Order of paragraphs** (`prerequisite_order`): The five rules first, because releases, quality scores and correction loops all assume write-back and per-value provenance. Releases follow the rules they extend to re-processing; quality scores summarize what the pipeline produces; correction loops close the loop with human labels.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p20 | recommendation | Enrichers write back to the listing's system of record through an ApplyEnrichment command checked against the listing version, and never only into the search index. | figure: Figure 2: the enrichment pipeline as a loop around the listing service, read models rebuilt from the listing, suggestions to sellers becoming labels. |  |\n| p21 | recommendation | Each enrichment step is a pure function with an idempotency key built from listing ID, input fingerprint, enricher ID and version and reference-data version, so it re-runs only when its inputs change. |  | `sequence`: Rule 1. → Rule 2. |\n| p22 | recommendation | Enrichers declare dependencies, and the orchestrator re-runs the affected subgraph when an input changes. |  | `sequence`: Steps that re-run when their inputs change. → The order between steps. |\n| p23 | recommendation | Derived values never silently overwrite asserted ones: the dictionary's precedence policy decides what is used, the listing keeps every source's value, and a retired suggestion remains as a training label. |  | `sequence`: Rules about running steps. → The rule about whose value wins. |\n| p24 | comparison | Some steps block publication but most do not, and each has a degraded mode. | table: Normalization of required attributes, category, vehicle decode, geocoding (blocking or usually blocking); extraction, translation, embeddings, quality score, price rating (not blocking), with why and degraded mode. | `sequence`: Rules about how steps run and write. → When they must finish. |\n| p25 | analysis | The blocking set must fit the publication budget, so a synchronous language-model call on the insertion path is costly. | scenario: Tradeyard's publication target of 90 seconds at p95, owned by the publication-pipeline chapter. | `cause_effect`: The blocking steps. → The time budget they must fit. |\n| p26 | claim | An enricher changes when its code, its reference data or the schema it fills changes, and each change raises the question of which existing listings to re-process, in what order and with what protection. | figure: Figure 3: releasing an enricher like a schema migration: shadow test against labels, prioritized backfill through the same write path, churn monitoring, value-level rollback. | `time`: A running pipeline. → What happens when one of its enrichers changes. |\n| p27 | explanation | The release gate works when value churn is measured against the evaluation's prediction and rollback is a data operation made possible by per-value versions. | source: Etsy's reported practice of halting production runs when precision or recall drifts from a baseline.; example: A new version changing 4% of values where evaluation predicted 1%. | `elaboration`: The release process in Figure 3. → The two details that make its gate work. |\n| p28 | definition | In my judgement a listing quality score should be built from four measurable dimensions defined per category schema: completeness, validity, consistency and confidence. | table: The four dimensions with definition and example signal (23 of 26 recommended used-car attributes; stated power matching the decoded derivative; seller-confirmed versus model-only values). | `sequence`: Enrichers that change values across the stock. → A measure of how usable the result is. |\n| p29 | explanation | The quality score feeds seller nudges, moderation sampling and ranking, and it must not reward listings for values a model guessed. |  | `elaboration`: The four dimensions. → What the score is used for and its one trap. |\n| p30 | process (list) | Every human decision about a value is a label, and the pipeline should collect them deliberately from sellers, moderators, buyers and professionals. | source: Kleinanzeigen's photo-based assistant lets sellers accept suggestions fully, partially or not at all. | `contrast`: Values a model guessed. → Values people confirm or correct. |\n| p31 | analysis | Label quality is the hidden risk, and a small, regularly refreshed gold sample labeled by trained reviewers calibrates the rest. |  | `contrast`: The label sources. → Why they are noisy and what calibrates them. |\n\n### In Practice: The Essen Golf and Three Other Cases\n\n**Controlling idea** (`example`, id `in-practice`): Four Veldmark cases show the rules at work: provenance resolves the Golf's power conflict, model provenance lets the bike extraction fill values safely, legally required disclosures are verified rather than derived, and translation is enrichment like any other.\n\n**Advances the thesis** (N2, N3, N4): Applies provenance, precedence and the pipeline to four concrete listings.\n\n**Transition in:** `example`: The pipeline's rules. → An announcement of four cases, then the Golf from the scene followed value by value.\n\n**Order of paragraphs** (`grouping`): The Golf first because the scene opened with it (p06) and it exercises normalization, decoding and precedence; then the bikes (model extraction, the scene's other problem), the Lyon flat (disclosures, with the general rule in its own paragraph) and Belgium (translation), each adding one rule the Golf does not show.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p32 | example | Following the Golf's values from the DMS feed to the listing shows which were normalized from the dealer's statement and which were added by decoding and valuation. | table: Make, model, engine and trim, power, first registration, mileage, price, color, equipment, 26 further decoded values (31 in all), location and market value (€22,800, 'good price', re-run on 22 April at €21,400), with raw value, canonical value, source class and action. |  |\n| p33 | analysis | Enrichment raised the Golf from 9 to 23 of 26 recommended attributes and put it into the body-type, transmission and fuel filters most buyers use. | scenario: 14 of 14 required and 9 of 26 recommended attributes before; 23 of 26 after. | `cause_effect`: The values decoding added. → What they changed for buyers. |\n| p34 | analysis | The power value shows the failure provenance prevents: with both decoder candidates stored and a policy that the consistent dealer value wins, the rating reads the right derivative and a later decode updates only cars without a dealer value. | figure: Figure 4: the Golf with source tags; the dealer's 96 kW resolves the conflict between candidates 96 and 110 kW, with the other kept. | `emphasis`: The Golf's table, where power had two decoder candidates. → The failure that row prevents. |\n| p35 | example (list) | Tradeyard's bike-extraction pilot followed the public pattern: a self-hosted small model given the schema keys at request time, validation against the schema, suggestions for new listings and model provenance for live ones, gated on a gold sample. | scenario: June to September 2027 on Tradeyard Netherlands; first three photos classified for bike type and electric assist; gold sample of 2,000 listings; 93% precision on frame size and 97% on electric assist. | `additional_support`: Registry enrichment on the Golf. → Model enrichment on Tradeyard's bikes, the scene's first problem. |\n| p36 | evidence | The pilot raised frame-size coverage from 23% to 71% and made the November bikes split possible. | scenario: Coverage 23% to 71%; sellers accepted 64% of suggestions and edited another 11%; e-bike flag and bike type fed the re-categorization job. | `cause_effect`: The pilot's design. → Its results. |\n| p37 | example | Enrichment normalized the Lyon flat's three addresses and assigned its area, but verified rather than derived its energy class, because the class is a disclosure the advertiser must state. | scenario: 68 m² three-room flat in Lyon 7e at €389,000, energy class D, listed in May 2027 by three agencies via two software vendors and Keybridge; addresses normalized against the Base Adresse Nationale; Valuo estimate €372,000–€401,000, trained on DVF prices. | `contrast`: Values the platform may fill. → A value it must not fill. |\n| p38 | claim | Enrichment may fill attributes that serve discovery but must not invent values the law requires the advertiser to state; those are verified, flagged and reported back. |  | `conclusion_summary`: The Lyon energy class. → The general rule for mandated disclosures. |\n| p39 | example | At Tradeyard Belgium machine translation is stored, labeled and regenerated like any enrichment, while attribute values need no translation because they are dictionary IDs. | scenario: Dutch- and French-speaking buyers on one marketplace; translation stored with model provenance and version, indexed for cross-language search, labeled 'automatically translated' with a link to the original. | `additional_support`: Model and registry enrichment in the earlier cases. → Translation as one more enrichment. |\n\n### The Cost of Enrichment at Scale\n\n**Controlling idea** (`analysis`, id `cost`): At classifieds volume, model calls are the smallest cost of enrichment; re-processing multiplies cost and people (evaluation and review) are the main cost.\n\n**Advances the thesis** (N5): Prices the pipeline and shows where the cost lies.\n\n**Transition in:** `cause_effect`: The four cases, scaled up to the whole stock. → What it costs.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p40 | evidence | A rough Veldmark cost model, with illustrative prices, shows that calls times price per call is usually the smallest number on the enrichment bill. | table: Text extraction on 2.3M new listings and about 0.9M edits a week (about €1,300 a week); one backfill of 13.2M listings (about €5,000 per pass); evaluation per release (about 33 reviewer-hours for 2,000 listings); human review of 1% of 3.2M weekly runs (about 270 reviewer-hours a week); image enrichment within about €3.1M a year. |  |\n| p41 | analysis | Three conclusions follow: per-call model cost is rarely the constraint, re-processing is the multiplier, and people are the main cost. | source: Mercari's USD 1 million estimate for brute-forcing a large API model over more than 3 billion items, answered with a cheaper architecture. | `conclusion_summary`: The cost table. → What it means for planning. |\n\n### Trade-offs\n\n**Controlling idea** (`comparison`, id `trade-offs`): Seven design choices remain open in any enrichment pipeline, and for each the chapter's cases say when each option is right.\n\n**Advances the thesis** (N3, N4): Sets the thesis's choices (system of record, precedence, suggestion versus auto-apply, shared versus vertical) against their alternatives.\n\n**Transition in:** `conclusion_summary`: The rules, the cases and the cost. → The choices left to each marketplace.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p42 | comparison | The rules still leave seven choices to each marketplace, and each has a case where the other option is right. | table: Where enrichment runs, where derived values live, model type, application, timing, ownership across the group, conflict policy, each with two options and when each is right. |  |\n\n### Vertical Differences\n\n**Controlling idea** (`comparison`, id `verticals`): Verticals differ in their main normalization problem, strongest enrichment, authoritative data and protected disclosures, and seller presence decides whether suggestions can work.\n\n**Advances the thesis** (N3): Shows how precedence and suggestion-versus-apply change with the vertical.\n\n**Transition in:** `contrast`: Choices that hold within any marketplace. → How they differ by vertical.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p42a | comparison | The trade-offs are choices any marketplace makes, but how they come out differs by vertical, in the main normalization problem, strongest enrichment, authoritative data, protected disclosures, model risk and seller presence. | table: General classifieds, real estate, automotive and jobs compared on main normalization problem, strongest enrichment, authoritative data, values that must not be derived, biggest model risk and seller presence. |  |\n| p43 | analysis | Seller presence decides whether suggestions work: where the seller is in the insertion flow they confirm suggestions, and in feed-driven verticals the value is applied as derived or reported back to the partner. |  | `elaboration`: The table's dimensions, of which seller presence is the last. → Why seller presence changes the pipeline's behavior. |\n\n### Failure Modes\n\n**Controlling idea** (`analysis`, id `failure-modes`): Eight failure modes follow from breaking the chapter's rules, each with the rule that prevents it.\n\n**Advances the thesis** (N2, N3, N4, N5): Shows what happens when each part of the thesis is missing.\n\n**Transition in:** `contrast`: The design and its choices. → What goes wrong without them.\n\n**Order of paragraphs** (`grouping`): A lead paragraph names the eight failures as what happens when the rules are broken. Then provenance failures first (mixed values, re-runs over corrections, index-only values), then normalization failures (misparses), then model, mapping and disclosure failures, then cost. Each is one paragraph led by its bold name.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p43a | transition | The design works only while its rules are kept; without them enrichment fails in eight recurring ways, each with the rule that prevents it. |  |  |\n| p44 | analysis | Once derived values are indistinguishable from asserted ones they cannot be separated, and every later decision is made blind. |  | `sequence`: The eight failures announced. → The first, mixed derived and asserted values. |\n| p45 | analysis | A new decoder or model version that writes every value it computes overwrites the corrections of sellers and moderators unless precedence and per-value provenance stop it. |  | `cause_effect`: Mixed values. → What a re-run does to them. |\n| p46 | analysis | Enrichment written only into the index vanishes at the next reindex and cannot be shown or audited. |  | `additional_support`: Values lost to a re-run. → Values lost to a reindex. |\n| p47 | analysis | Silent misparses, such as 48,000 km read as 48 km, need a plausibility check from the dictionary on every numeric normalizer. |  | `additional_support`: Provenance failures. → A normalization failure. |\n| p48 | analysis | An extraction model released without a labeled sample, threshold and churn monitoring writes its error rate into millions of listings. |  | `additional_support`: A rule-based failure. → A model failure. |\n| p49 | analysis | Alias tables that force unknown values into the nearest known one turn a mapping gap into wrong data. |  | `additional_support`: Ungated models. → Ungoverned mapping tables. |\n| p50 | analysis | A platform that corrects or fills a legally required disclosure publishes a statement the advertiser did not make. |  | `additional_support`: Wrong data from mappings. → Wrong data in a legal disclosure. |\n| p51 | analysis | Several full backfills in one quarter can exhaust its inference and review budget unless backfills are planned like migrations. |  | `additional_support`: Failures of data. → A failure of budget. |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `ca-view`): A Chief Architect makes provenance a group standard, shares generic enrichers while keeping domain ones local, governs every enricher, puts precedence in the dictionary, budgets re-processing and measures enrichment by liquidity.\n\n**Advances the thesis** (N2, N3, N4, N5): Turns each supporting claim into a group decision.\n\n**Transition in:** `problem_solution`: The failure modes. → The decisions that prevent them at group level.\n\n**Order of paragraphs** (`order_of_importance`): A lead paragraph says the failures are prevented by group decisions. Then provenance first because every other decision depends on it; then the share line, governance and precedence; then budget and measurement; then what to watch.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p51a | transition | The failures are prevented more reliably by decisions taken once for the whole group than by each team's care, and six such decisions follow. |  |  |\n| p52 | recommendation | Make provenance a group standard before the pipelines multiply, as Veldmark did in October 2027. | scenario: One provenance vocabulary (seven source classes plus process, version, confidence and time) adopted in October 2027 with the taxonomy and attribute service. | `sequence`: The six decisions announced. → The first, provenance as a group standard. |\n| p53 | recommendation | Share generic enrichers and keep domain enrichers in the verticals, the same line as for ingestion. |  | `sequence`: A group standard. → Which enrichers the group shares. |\n| p54 | recommendation | Put every enricher, rule tables included, under model governance with an owner, version, evaluation set, gate and dashboard. |  | `sequence`: Who owns which enricher. → How each is governed. |\n| p55 | recommendation | Decide precedence per attribute in the attribute dictionary, as a product and legal decision the pipeline enforces. |  | `sequence`: Governed enrichers. → The policy over their outputs. |\n| p56 | recommendation | Budget re-processing explicitly each quarter, because an unplanned backfill waits for capacity. | scenario: The bikes split was planned with its backfill; the Motorvane decoder correction was not and waited three months. | `sequence`: Policy. → Budget. |\n| p57 | recommendation | Treat enrichment as a supply-side liquidity lever and measure it by filtered-search coverage and contact rates. |  | `sequence`: Cost. → Value. |\n| p58 | recommendation | The numbers to watch are coverage, model-only share, gold-sample precision, value churn, suggestion rejection, disputes and the unknown-value queues. |  | `conclusion_summary`: The six decisions. → The measures that show whether they hold. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Ten review questions test whether a marketplace's pipeline records provenance, keeps originals, writes back, enforces precedence, fits the publication budget, re-processes safely, protects disclosures, collects labels, budgets backfills and draws the share line by meaning.\n\n**Advances the thesis** (N2, N3, N4, N5): Turns the thesis into checks a reader can run.\n\n**Transition in:** `sequence`: The Chief Architect's decisions. → Questions that test them in a review.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p59 | recommendation (list) | Ten questions test a pipeline against the chapter's rules, from provenance for any value to how the share line between brands is drawn. |  |  |\n\n## Conclusion: From Clean Records to Duplicates\n\n**Synthesis:** Keeping the original, recording provenance and deciding precedence per attribute only work together: the original makes normalization replayable, provenance makes precedence enforceable, and precedence makes re-running enrichment safe. Remove any one and the Golf's decoder correction cannot be applied without trampling dealers' fixes.\n\n**So what:** The order of work for a group is the vocabulary and the policy first, before the enrichers multiply, then re-processing and review planned as a recurring budget line rather than a one-off project.\n\n**Callback:** Ingrid Halvorsen's question in the scene: for each value, do we know who said it, what we did to it and whether we may change it? The Golf, the bikes and the Lyon flat now answer yes, value by value.\n\n**Takeaway** (`course_of_action`): Fix the provenance vocabulary and the precedence policy before adding enrichers, and plan each quarter's backfills with their review cost.\n\n**Hand-off** to [One Property, Three Listings: Duplicates and Entity Resolution](entity-resolution.html): `cause_effect`: The canonical addresses, decoded VINs and image hashes that normalization and enrichment produce. → The problem those comparable values expose, that several listings describe the same flat or car, and the capability that decides when listings are one thing and what each audience sees.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p60 | synthesis | Ingrid's question now has the answer yes: every value on the Golf, the bikes and the Lyon flat says who stated or derived it, by which process and version, and whether it may change. |  |  |\n| p61 | synthesis | The original value, provenance and per-attribute precedence work only together, so a group fixes the vocabulary and the policy before its enrichers multiply and budgets re-processing and review as a recurring cost. |  | `elaboration`: The answer to Ingrid's question. → Why it takes all three parts, and what a group does first. |\n| p62 | transition | A normalized, enriched listing can be compared with others, which exposes the next problem, several listings describing the same flat or car, and entity resolution takes the canonical addresses and decoded VINs produced here, with the media pipeline's image hashes, to decide when listings are one thing. |  | `cause_effect`: Comparable canonical values. → The duplicates they expose. |\n\n## Non-goals\n\n- Channels, feed contracts and reconciliation. See [Many Doors In: Forms, APIs and Bulk Feeds](listing-ingestion.html).\n- The attribute dictionary, category schemas and their compatibility rules. See [Attributes Without Chaos: Schemas, Dictionaries and Validation](attribute-schemas.html).\n- Category migrations. See [Category Trees That Can Change: Designing Marketplace Taxonomies](categories-and-taxonomies.html).\n- Geocoding providers, geo indexes and location precision. See [Where Is It? Location, Geocoding and Privacy](location-and-geo.html).\n- Image processing and perceptual hashing. See [Photos Sell: Media Pipelines for Listings](media-pipeline.html).\n- Duplicate detection and canonical entities. See [One Property, Three Listings: Duplicates and Entity Resolution](entity-resolution.html).\n- Model training, serving, the AVM and model governance in depth. See [Models in Production: ML Platforms and Use Cases](ml-platform.html).\n- The AI listing assistant as a product. See [AI Across the Listing Lifecycle](ai-in-listing-systems.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Etsy's primary post blocked automated access; the 31% to 91% coverage figure rests on a third-party summary and should be checked in a browser before print. (Carried over from spec.md.)\n- No European marketplace has published its VIN-decoding supplier relationships or license terms; the chapter names none for Veldmark and none for real companies. (Carried over from spec.md.)\n- Whether the ADEME DPE dataset can be matched reliably to listings by certificate number was not verified; the chapter presents the check as a Veldmark design, not as the documented practice of any real portal. (Carried over from spec.md.)\n- Cost figures are illustrative and must not be read as provider prices. (Carried over from spec.md.)\n\n## Decision log\n\n- **2026-10-19** — Separated normalization (meaning-preserving) from enrichment (meaning-adding) as the chapter's first concept, because the two need different provenance, tests and overwrite rules.\n- **2026-10-19** — Reused the Essen Golf and its power-variant conflict from attribute-schemas as the main worked example, and showed it value by value, to make provenance concrete without contradicting the ledger (31 decoded attributes, €22,800 estimate, 'good price').\n- **2026-10-19** — Added a Tradeyard NL bike-extraction pilot (June to September 2027) to connect enrichment to the ledger's 1 November 2027 bikes split, and a Lyon example to state the rule that legal disclosures are verified, not derived.\n- **2026-10-19** — Framed cost around re-processing, evaluation and human review rather than per-call price, following the Mercari evidence; all prices labeled illustrative.\n- **2026-11-12** — Converted spec.md to spec.json. Success criteria: the provenance-and-precedence, write-back loop and release-process criteria are tested by the journal spec's AC-1; the disclosure rule is rewritten as reader outcome AC-4 and the cost criterion as AC-5, both added here at severity minor; the normalization-vs-enrichment criterion is covered by the journal outcome and AC-1; the ten-steps list, the Golf trace and the dated-sources criteria (inventories of contents or house entences that closed Vertical Differences and the last failure mode are removed from those paragraphs; each next section now opens with a one-sentence-pair lead paragraph (p43a for Failure Modes, p51a for the Chief Architect's View), and both section transitions move from end_of_previous to start_of_this. p44 and p52 get word transitions from their lead. Rejected: Dropping the bridges (leaves both sections without the declared contrast and problem-solution transitions).; A lead sentence before the first bold label inside p44 and p52 (flagged in round 2).\n- **2026-11-12** — Enrichment table (p15): the ten rows are regrouped by the four jobs p15 names, with a Job column; the jobs are listed in table order (facts sellers cannot know first, so registry decoding stays the first row and p16's transition holds). No row, cell or source was cut.\n- **2026-11-12** — Provenance record (p10): the 96/110 kW conflict and 'consistent with derivative' are now explained before the record (the decoder returned two candidates for the 1.5 TSI's two power outputs; the dealer's value matches one), with forward pointers to the registry section and the Golf case. The record stays in Concepts because Concepts must define the record before the source classes; the explanation, not the example, moved ahead.\n- **2026-11-12** — Vertical Differences gets a lead paragraph (p42a) that states the contrast with the trade-offs and carries the table; p43 (seller presence) follows it as before. The Adevinta OCR bullet now ends with what its figures show (a specialized model online beating a general external API on accuracy, speed and cost), within what the cited post reports; the model-evidence lead announces the mobile.de and Google cases as two further lessons.\n- **2026-11-12** — length.max_words raised from 7,385 to 7,700 (+4.3%, within the 10% allowed) for the lead paragraphs, the provenance explanation, the table's Job column and the Adevinta sentence; no published fact, citation or Veldmark detail was cut.\n- **2026-11-12** — Minor round-3 findings, kept as published under the author's delegation, 2026-11-12: the Golf case keeps no ### subheading (adding one would split p32); the 22 April valuation re-run keeps no outcome, because the ledger records the price cut but no rating after it; Quality scores stay under Architecture, as the spec places them. The flow rubric's notes (2026-11-12, sound with notes) are accepted under the author's delegation, 2026-11-12: Taken: the scene's Motorvane paragraph (p06) now names the Essen Golf in its controlling idea (the prose already did); p04's idea lists every closing section (the prose already did); the hand-off now credits image hashes to media-pipeline. Not taken: merging the Lyon paragraph with its general rule (tried, then reverted after draft-check round 1 found two ideas in one paragraph); merging p24 (blocking-steps table) with p25 (publication budget), because a paragraph cannot follow a table inside one unit; trimming the Chief Architect's points 4 and 5 (p55, p56), which restate p23 and the cost section, because they are the author's recommendations and the house chapter shape repeats them as decisions.\n\n## Sources\n\n- **Internal**\n  - _journals/listing-systems-architecture/journal-spec.json — Intent outcome, acceptance criteria AC-1 to AC-3, thesis, role and entity-resolution's transition_in.\n  - _research/brief-listing-data-ingestion.md Parts 3, 7, 8 and 11 — Units, addresses, ML and LLM extraction evidence, quality dimensions.\n  - _research/brief-automotive.md Part A.7 — VIN decoding, vehicle taxonomies, price rating.\n  - _research/brief-platform-data-ml.md Parts 10 and 11 — Adevinta OCR, category prediction, GenAI listing creation.\n  - _research/scenario-ledger.md, _research/consistency-issues.md — Golf, Lyon apartment, bikes split and pilot, provenance vocabulary, ML-platform figures (Valuo trains on DVF; image inference cost); rulings on bike coverage (23%).\n  - listing-aggregate, attribute-schemas, listing-ingestion — Provenance inside the aggregate; dictionary precedence; record arrival.\n- **External**\n  - Mercari Engineering (2023, 2024) — LLM extraction, dynamic attributes, re-categorization cost.\n  - Adevinta Tech Blog (2023) — OCR service at scale.\n  - NHTSA vPIC; DGFiP DVF; ADEME DPE open data; Base Adresse Nationale — Registries and reference data.\n\n## Changelog\n\n- **2026-11-12** — Resolved the round-3 escalation under the author's delegation: bridges moved into lead paragraphs of Failure Modes and the Chief Architect's View, enrichment table grouped by job, provenance conflict explained before the record, Vertical Differences lead, Adevinta figures explained; max_words 7,700. (AI-mediated session)\n- **2026-11-12** — Converted spec.md to spec.json (outcome-spec pipeline); added a roadmap paragraph, a trade-offs lead-in and a closing synthesis to the article; renamed the in-practice heading; draft-check revisions to transitions and to figures readers could not trace. (AI-mediated session) Three draft-check rounds (ESCALATE, REVISE, ESCALATE); remaining points in open_questions.\n- **2026-10-21** — Renamed failure patterns to match where-listing-systems-go-wrong. (AI-mediated session)\n- **2026-10-20** — Replaced 2 mermaid diagrams with generated illustrations (figure numbers and captions unchanged). (AI-mediated session)\n- **2026-10-20** — Sharpening pass: 5,458 to 5,477 prose words; 1 heading renamed; opening ties the chapter to Part III's supply chain; model-evidence pattern moved ahead of its examples. (AI-mediated session)\n- **2026-10-20** — Cross-chapter consistency sweep: 1 heading aligned with the book's shared section names. (AI-mediated session)\n- **2026-10-19** — Added 2 inline illustrations (article-illustrator); figures renumbered. (AI-mediated session)\n- **2026-10-19** — Editorial review pass: expanded DMS, VIN and OCR on first use, clarified the 31-attribute count, American spelling. (AI-mediated session)\n- **2026-10-19** — Initial spec and article. (AI-mediated session)\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
