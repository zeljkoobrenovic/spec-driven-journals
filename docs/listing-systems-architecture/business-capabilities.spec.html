<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted, revised 2026-10-21), which it replaces. Intent outcome, acceptance criteria AC-1 to AC-3, the thesis and the role are copied unchanged from the chapter's entry in journal-spec.json; supporting claims C1 to C6 are written here. The conclusion's synthesis paragraph (p62) and the roadmap in p02 are new, required by the outcome spec.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The difference between capability, value stream, product and system.\n- **Know:** A three-level marketplace capability map with ten level-1 areas, its four value streams, and heat-mapping on differentiation, maturity and duplication.\n- **Believe:** Duplication alone proves nothing; the decision to share is made per capability, often at level 3, between shared machinery and local content.\n- **Be able to:** Answer 'what do we pay for several times?' with a verdict per capability: consolidate, split, decide commercially or keep as a deliberate duplicate.\n\n**Audience:** Chief and enterprise architects of marketplace groups, platform and product leaders preparing a consolidation or platform program, and integration leads after an acquisition.\n\n**Already knows:**\n\n- What an API, a database, an event stream, a search engine and Kubernetes are.\n- From earlier chapters: liquidity and its per-cell metrics, the business-model ladder, the industry's waves and reading a group's systems as sediment.\n- From the preface: Veldmark, its four brands, its cast and the Common Ground program; the fifteen failure-pattern names.\n\n**Does not yet know:**\n\n- Business-architecture vocabulary: capability, value stream, capability map levels, heat map.\n- The TOGAF and OMG business-architecture sources, and core domain charts.\n- Domain-driven design's bounded contexts (named here, taught in the next chapter).\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a duplicated capability that differentiates one brand, the reader decides with the heat map rather than by duplication. *Probe:* Three brands each run their own search, and search scores high on differentiation in one of them. Using only this chapter: should the group merge them, and how do you decide? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-4 | Given two brands that sell to the same professional customers in one country, the reader says why a shared platform does not resolve the overlap and who decides it. *Probe:* Two of a group's brands sell packages to the same car dealers in one country, with two sales teams, two price lists and two feeds. Using only this chapter: can a shared platform resolve this overlap, and who should decide it? | `custom` | cold_reader | minor |\n| AC-5 | Given four marketplace names, the reader classifies each as a capability, a value stream, a product or a system and says why. *Probe:* Using only this chapter, classify each of these as a business capability, a value stream, a product or a system, and say why: (a) 'the Solr cluster', (b) 'Saved searches and alerts', (c) 'the Motorvane Premium dealer package', (d) 'search-to-contact'. | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** How do we describe a marketplace's capabilities independently of the systems that implement them, and use that description to decide what a group shares?\n\n> **Claim:** A multi-brand group should decide what to share on a three-level map of what its marketplaces do, independent of systems and teams, cross-mapped to the value streams that produce liquidity and scored separately for differentiation, maturity and duplication; duplication alone proves nothing, because a duplicated capability that differentiates a vertical should stay local, and most answers come from splitting a capability at level 3 into shared machinery and local content.\n\n**Disputed by:** The view that consolidation starts from a systems inventory and that every capability the group runs more than once should be merged onto one implementation for synergy.\n\n**So what:** A Chief Architect who accepts this answers a board's 'what do we pay for four times?' with a verdict per capability and reorders the program by the bottlenecks of value streams; Veldmark moved shared trust and safety ahead of media this way.\n\n**How and why:** Systems differ by brand while capabilities mostly do not: the Rotterdam bike passed through different systems in each brand but needed nearly the same capabilities. Veldmark's inventory of 412 applications could not say whether dealer packages and agency subscriptions were one capability; the heat map found five overlaps, of which identity and analytics were consolidations while trust and safety, search and the product catalog split at level 3, and one commercial overlap in Poland that no platform resolves.\n\n**Supporting claims**\n\n- **C1** — Systems differ by brand while capabilities mostly do not, so a business capability, defined apart from value streams, products, systems and processes, is the unit on which brands can be compared.\n- **C2** — One three-level map with ten level-1 areas serves every vertical, and level 3 is where a capability splits into generic machinery and vertical content.\n- **C3** — Capabilities matter through the value streams that produce liquidity: cross-mapping locates each problem in a capability and shows the shared bottlenecks where investment should go.\n- **C4** — Differentiation, maturity and duplication must be scored separately and with evidence, because duplication alone proves nothing: a duplicated capability that differentiates stays local, and some duplicates are kept on purpose.\n- **C5** — Applied at Veldmark, the method confirmed the five known overlaps but turned three of them into level-3 splits, found a commercial overlap and a deliberate duplicate that no platform program would find, and reordered Common Ground.\n- **C6** — The map pays only as a governed practice: built from a reference model tested by value streams, decomposed only where verdicts differ, owned and versioned, scored with dated evidence, tied to money and used at every acquisition.\n\n## Role in the part\n\nGives the group a system-independent description of what it does and a method to decide, capability by capability, what to share. Supports P1-4 of part `part-1`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `assertion_evidence_reasoning` in public record and Veldmark worked example: the method is stated, then tested against documented cases and the fictional group; `grouping` in vertical differences, trade-offs, failure modes, Chief Architect's view and questions: the book's standard closing sections)\n\nEach section uses what the one before supplied. The scene poses the question and the argument in one listing; the definitions supply the unit (capability) the argument needs; the map is built from that unit; value streams need the map's capabilities to cross-map; the heat map scores the map's capabilities, and its verdicts are read against the stream bottlenecks in the worked example; the public record and Veldmark's worked example then test those verdicts, the record first because it shows the reasoning but no map, and Veldmark second because it shows a full map. Vertical differences come directly after the worked example because they explain two of its verdicts and return to the map's one-skeleton claim with the scores now known. The trade-offs, failure modes and governance look back on a method the reader has now seen applied; placed earlier, the stopping rule and the verdict-based failures would refer to verdicts not yet defined.\n\n## Introduction\n\n**Hook** (`thought_provoking_question`): What do we pay for several times, and what makes us money? (the CFO's and investor's question in WHY THE BUSINESS CARES, which Veldmark's Group CEO puts to Ingrid as 'what exactly do we pay for four times?')\n\n**Bridge:** The previous chapter showed how a group comes to run several brands on stacks from different waves; a group about to decide what to share has systems inventories and program lists, not a description of what its marketplaces do. → That description is a capability map, the one page on which a general manager, a CFO, a platform lead and an acquirer's integration team mean the same thing by the same box.\n\n**Thesis statement** (KEY POINTS callout (all three bullets); restated in the scene's last paragraph (p07) and in the heat-map verdicts (p33).): Decide what to share on a three-level map of what the marketplaces do, cross-mapped to value streams and scored separately for differentiation, maturity and duplication; duplication alone proves nothing, and most answers split a capability at level 3 into shared machinery and local content.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p02, which lists the sections in order and names what later chapters own.):\n\n- Pose Veldmark's question: what does the group pay for four times? *Kept in:* scene.\n- Define capability, value stream, product and system. *Kept in:* terms.\n- Build a three-level map with ten level-1 areas. *Kept in:* map.\n- Cross-map it to four value streams. *Kept in:* value-streams.\n- Heat-map it on differentiation, maturity and duplication, without the reflex that every duplicate should be merged. *Kept in:* heat-map.\n- Check the method against the public record. *Kept in:* public-record.\n- Follow Veldmark to five overlaps, one commercial clash and one deliberate duplicate. *Kept in:* worked-example.\n- Show where verticals differ on the one map. *Kept in:* verticals.\n- Close with ways to build a map, failure modes, the Chief Architect's view and questions to ask. *Kept in:* trade-offs, failure-modes, chief-architect, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | claim | A group that runs several brands on stacks from different waves needs, before it can decide what to share, a description of what its marketplaces do that survives the next reorganization and replatforming; that description is a capability map, and a well-made one is the only page on which a general manager, a CFO, a platform lead and an integration team mean the same thing by the same box. | reasoning: The previous chapter's finding that groups run several brands on stacks from different waves. |  |\n| p02 | transition | The chapter opens with a board asking what the group pays for four times, defines four confused terms, builds a three-level map, cross-maps it to four value streams, heat-maps it on three scores, checks the method against the public record, follows Veldmark's mapping, shows where verticals differ on the map, and closes with ways to build a map, failure modes, the Chief Architect's view and questions to ask; it leaves decomposition, the vertical analysis and consolidation to later chapters. | reasoning: The sections in order, and the later chapters that own bounded contexts, vertical requirements and platform consolidation. | `sequence`: The need for a capability map. → The steps the chapter takes to build and use one. |\n| p03 | context | The running example is Veldmark, the book's fictional group, whose new Group Chief Architect is asked in March 2027 what the group pays for four times and uses a capability map to answer and to test the €140 million program approved before she arrived. |  | `example`: The method the chapter will build. → The fictional group and the question it will be tested on. |\n\n## Sections\n\n### Setting the Scene at Veldmark: What Do We Pay for Four Times?\n\n**Controlling idea** (`context`, id `scene`): Veldmark's program list and systems inventory cannot say what the group pays for four times, while one Rotterdam listing shows that brands differ in systems but share capabilities.\n\n**Advances the thesis** (C1): Poses the board's question and shows, with one listing, why it must be answered at the level of capabilities.\n\n**Transition in:** `problem_solution`: The need for a description independent of systems. → The concrete situation that needs one: Veldmark's board question.\n\n**Order of paragraphs** (`small_to_large`): From the program Ingrid inherits, to the question it cannot answer, to one listing that shows why, to the general argument. The argument stated before the bike would be an assertion; the bike stated before the question would have nothing to test.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p04 | context | On 9 March 2027, five weeks into the job, Ingrid inherits Common Ground: a €140 million program to 2030 that lists platforms to share and promises €38 million a year in lower run costs. | scenario: Common Ground: €140 million over 2027–2030, retire Yardstick by end of 2029, cut run costs by €38 million a year by 2030; the list of nine platforms to share. |  |\n| p05 | claim | The Group CEO's question, what the group pays for four times and which of those make money, is answered neither by the program list, which names platforms, nor by the 412-application inventory, which cannot say whether two brands' paid packages are the same capability. | scenario: Henrik de Boer's question from the private-equity owner; Mateus Carvalho's inventory of 412 applications; 'Motorvane dealer packages' versus 'Hearthly agency subscriptions'. | `contrast`: The program's list of platforms. → The question that list cannot answer, and the inventory that cannot answer it either. |\n| p06 | example | In her first workshop Ingrid asks which systems the Rotterdam city bike passed through, which differs for every brand, and which capabilities it needed, which is nearly identical for all four. | case: The €240 Rotterdam city bike: published six minutes after submission, 312 saved searches matched, first contact, a phishing message posing as a Safe Deal payment link, all within half an hour. | `example`: The question neither list answers. → A single listing used to test the two ways of describing the group. |\n| p07 | claim | Systems differ by brand while capabilities mostly do not, so comparing brands and deciding what to share has to happen at the capability level. | figure: Figure 1: four differently shaped system landscapes connected to one shared row of identical capability tiles. | `conclusion_summary`: The workshop's two answers. → The chapter's argument drawn from them. |\n\n### Capability, Value Stream, Product, System\n\n**Controlling idea** (`definition`, id `terms`): Capability, value stream, product, system and process answer different questions, live for different times and have different owners, and only a map of capabilities that is stable, implementation-free and comparable can answer the board's question.\n\n**Advances the thesis** (C1): Defines the unit of comparison the thesis relies on and separates it from the terms it is confused with.\n\n**Transition in:** `elaboration`: The argument that brands are compared on capabilities. → Precise definitions of capability and the terms it is confused with.\n\n**Order of paragraphs** (`grouping`): The four terms are defined one after another, capability first because the rest are defined against it; the comparison table follows the last definition; the properties follow because they are the test of a good capability, and the answer to Ingrid's question comes last because it needs all of them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | transition | Four terms do most of the work, and confusing them produces most bad maps; a fifth, process, matters mainly as what a capability map should not turn into. |  |  |\n| p09 | definition | A business capability is what the business does, independent of how, where and by whom, as TOGAF defines it; content moderation is a capability, the Solr cluster is not. | source: The Open Group, TOGAF Series Guide: Business Capabilities, Version 2 (2022), paraphrased: a particular ability that a business may possess or exchange to achieve a specific purpose.; example: Content moderation, Saved searches and alerts, Entitlements and quotas versus the Solr cluster, the Trust team, Yardstick's ad-insertion module. | `sequence`: The four terms. → The first, and the one the chapter is about. |\n| p10 | definition | A value stream is the end-to-end sequence of stages that delivers an outcome, commonly cross-mapped to the capabilities each stage needs; in a marketplace the main ones are the journeys that create liquidity. | quotation: OMG Business Architecture Working Group (2012), as quoted by Wikipedia: 'the Value Stream view defines the end-to-end set of activities that deliver value to external and internal stakeholders'. | `sequence`: Capability. → Value stream. |\n| p11 | definition | A product is a packaged offer that a customer uses or buys, composing many capabilities, while a capability serves many products. | example: 'Tradeyard for iOS', 'Motorvane Dealer Hub', the 'Top listing' bump. | `sequence`: Value stream. → Product. |\n| p12 | definition | A system is software that implements part of one or more capabilities and is replaced long before the capability it serves, which outlives every other term. | example: Yardstick, the Motorvane listing service, Hearthly's OpenSearch cluster.; table: Table: term, question it answers, lifetime (capability decades, system 3–15 years, process months), marketplace example, owner. | `sequence`: Product. → System, and the five terms compared. |\n| p13 | explanation (list) | Three properties make a capability map useful, and each is easy to break: it is stable, implementation-free and comparable across brands. | example: Duplicate and entity resolution existed when Hearthly removed duplicates by hand and will exist when a model does it; 'Salesforce CRM' versus 'Professional account management'. | `cause_effect`: The definitions. → What a map of capabilities must preserve to be useful. |\n| p14 | analysis | A capability map is the business-side half of a bargain software architects already know: Lewis and Fowler align services to business capabilities, and Conway shows teams shape designs, so the capabilities must be named before teams and services align to them, which is also why only the map, not the 412-application inventory, can answer Ingrid's question. | quotation: Lewis and Fowler (2014): microservices 'organized around business capability'; Conway (1968): organizations are 'constrained to produce designs which are copies of the communication structures of these organizations'. | `cause_effect`: The three properties. → Why only a map with them answers the board's question. |\n\n### A Three-Level Capability Map for Listing Marketplaces\n\n**Controlling idea** (`description`, id `map`): A reusable marketplace map has ten level-1 areas and 54 level-2 capabilities, and its level 3 is where a capability splits into generic machinery and vertical content, which is why one skeleton serves every vertical.\n\n**Advances the thesis** (C2): Gives the map itself and shows, at level 3 and across two reference models, that machinery is shared and content is specific.\n\n**Transition in:** `sequence`: The definitions and the three properties. → A map built to them.\n\n**Order of paragraphs** (`large_to_small`): From level 1 to level 2 to the placements in it, then to level 3, its examples and its pattern; the cross-vertical evidence comes last because it relies on the machinery-and-content pattern to explain why one skeleton suffices.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p15 | description | The map's ten level-1 areas follow the flow of a listing marketplace from supply to transaction, with trust, monetization, professional services, data and platform cutting across it. | figure: Figure 2: the ten level-1 areas, five on the liquidity flow and five across it. |  |\n| p16 | description | Level 2 breaks each area into capabilities a business owner recognizes and that can be compared across brands; Veldmark's map has 54. | table: Table: ten level-1 areas, their level-2 capabilities, and what each area is for. | `elaboration`: The ten areas. → The capabilities inside each. |\n| p17 | explanation (list) | Four placement choices will be challenged, so the map records the reason for each: taxonomy under Listing Management, identity split between Trust and Platform, Professional Services as its own area, and Transactions kept even where small. | reasoning: The reasons for each placement and the chapters that own the detail. | `elaboration`: The level-2 table. → The placements in it that readers will dispute. |\n| p18 | explanation | Level 3 is where a capability splits into parts that behave differently, and it is written only where a decision is pending; Veldmark has 212 level-3 capabilities. |  | `sequence`: Levels 1 and 2. → Level 3, and when to write it. |\n| p19 | example | Two level-2 capabilities, search and filtering and entitlements and quotas, show that level 3 separates generic engine parts from vertical or commercial parts. | table: Table: level-3 capabilities of Search and filtering and of Entitlements and quotas, with why the split matters. | `example`: Level 3 in general. → Two concrete splits. |\n| p20 | analysis | The pattern recurs across the map: the machinery is generic and the content is specific, so a level-2 capability that several brands run and that also sets one of them apart gives no clear answer about sharing until level 3 splits it into a shared part and a local part. | example: Search engine versus relevance; entitlement ledger versus package design; moderation pipeline versus policy; taxonomy service versus category trees.; figure: Figure 3: one shared machine with brand cartridges for relevance, packages, policy and category trees. | `cause_effect`: The two splits. → The general pattern and what it does to heat-map verdicts. |\n| p21 | evidence | Two generic reference models, one for general listings and one for real estate, share the same 88 capabilities, of which only nine are genuinely different in the same slot. | statistic: Author's Productscape reference models: identical 88 capabilities in five root groups; about two-thirds identical in meaning, roughly a dozen renamed, nine different (protected payment versus mortgage financing, and others). | `additional_support`: Machinery shared, content specific. → Evidence that one map serves different verticals. |\n| p22 | analysis | A marketplace capability map generalizes across verticals by renaming and re-weighting, not by new top-level structure, which is why Veldmark keeps one map for four brands and vertical differences show up in level-3 capabilities, scores and descriptions. |  | `conclusion_summary`: The reference models' overlap. → The lesson for a multi-vertical group. |\n\n### Value Streams: Where Capabilities Meet Outcomes\n\n**Controlling idea** (`explanation`, id `value-streams`): Cross-mapping the four marketplace value streams to capabilities turns a vague complaint into a located one and shows the shared bottlenecks where investment pays most.\n\n**Advances the thesis** (C3): Ties capabilities to the liquidity outcomes that justify investing in them.\n\n**Transition in:** `cause_effect`: A map that names what the business does. → Why that matters: the outcomes those capabilities produce.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The claim that capabilities matter through streams, then the four streams, then one stream drawn and its problems located, then the second use across streams, then the cautions that keep both uses honest.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p23 | claim | A capability map becomes useful only when cross-mapped to the value streams that produce liquidity, and four streams cover most of a group's value: list-to-sell, search-to-contact, lead-to-deal and pro onboarding. | table: Table: the four streams with stages, outcome metrics and main customer. |  |\n| p24 | example | The cross-map names the capabilities each stage needs, as list-to-sell for the Rotterdam city bike shows. | figure: Figure 4: list-to-sell for the €240 Rotterdam bike, cross-mapped to level-2 capabilities, with the six-minute delay in moderation and indexing and the Ghost Inventory hand-off. | `example`: The four streams. → One of them drawn for the bike. |\n| p25 | analysis (list) | Each of the bike's three problems sits in a specific capability: the six-minute delay in moderation and indexing, the phishing message in fraud scoring applied to messaging, and the sold bike in the alert digest in the hand-off between lifecycle and alerts. | case: Six minutes to searchable; phishing message delivered at 20:11 from a domain registered that day; sold at 18:10 Monday, removed from search at 18:11, still in the next morning's digest. | `cause_effect`: The bike's stream on the map. → Where each of its problems is located. |\n| p26 | analysis | The second use of the cross-map is to find shared bottlenecks: at Veldmark, fraud and risk scoring sits in the critical stage of three streams, a stronger case for a shared trust-and-safety platform than 'we have four stacks'. | table: Table: seven level-2 capabilities against the four streams, with the binding constraints in bold (fraud and risk scoring bold in list-to-sell, search-to-contact and pro onboarding). | `additional_support`: The first use: locating one stream's problems. → The second use: capabilities that bind several streams. |\n| p27 | explanation | The bold cells are where Veldmark's 2027 evidence placed each stream's binding constraint, and the table is a working tool redrawn when a constraint moves. |  | `elaboration`: The bottleneck table. → How to read it and how long it stays true. |\n| p28 | recommendation (list) | Two cautions keep value streams honest: measure stream outcomes rather than capability activity, and map jobs to streams before streams to capabilities. | example: 'Listings ingested per day' versus 'share of dealer listings searchable within ten minutes of a feed update'; one of the author's two reference models, in parts tool-generated, that mapped jobs straight to capabilities, so every capability served every customer. | `contrast`: The cross-map's two uses. → The two ways it is commonly misused. |\n\n### Heat-Mapping: Differentiation, Maturity, Duplication\n\n**Controlling idea** (`explanation`, id `heat-map`): A heat map scores differentiation, maturity and duplication separately and with evidence, and the three scores together yield verdicts in which duplication alone decides nothing and some duplicates are kept on purpose.\n\n**Advances the thesis** (C4): Gives the method that turns the map into verdicts and makes the thesis's central claim operational.\n\n**Transition in:** `sequence`: The map and its value streams. → The scores that turn them into decisions.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The need for three scores, then each score, then the verdicts they produce, then the verdict maps forget, then the rules that keep the scores honest. The rules come last because they apply to all three scores and the verdicts built on them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p29 | definition | A heat map colors the map by scores, and a multi-brand group needs three dimensions scored separately. |  |  |\n| p30 | definition | Differentiation asks how much a capability makes customers choose us in this vertical, and product and commercial leaders, not engineers, score it. | quotation: DDD Crew, Core Domain Charts: business differentiation is 'provided by product managers or business stakeholders', while engineers judge model complexity. | `sequence`: Three dimensions. → The first. |\n| p31 | definition | Maturity asks how well the capability works today against what the business needs, scored with evidence on a five-point scale per implementation. | table: Table: scores 1 (absent or manual) to 5 (leading), with the evidence that justifies each. | `sequence`: Differentiation. → Maturity. |\n| p32 | definition | Duplication counts separate implementations; it is the easiest score to collect, which is why it dominates badly made heat maps. |  | `sequence`: Maturity. → Duplication, and its danger. |\n| p33 | analysis | The three scores combine into a small number of verdicts, from consolidate to split at level 3 to keep separate on purpose. | table: Verdict table: differentiation × maturity × duplication → consolidate, promote the strongest, buy or keep, split at level 3, invest locally, protect, keep separate on purpose. | `cause_effect`: The three scores. → What they decide together. |\n| p34 | example | Some duplication is a design decision: Veldmark keeps Keybridge's listing distribution and Hearthly's feed ingestion apart on purpose, because merging them would destroy the neutrality Keybridge's business depends on. | case: Keybridge, the acquired agent CRM that publishes to Hearthly's competitors; March 2027 decision that it stays a neutral SaaS and Hearthly may not use its agency data for ranking or sales targeting. | `emphasis`: The verdict table's last row. → Why maps forget it, with Veldmark's case. |\n| p35 | recommendation (list) | A heat map is only as good as its evidence, so scores carry named evidence and a date, are made per implementation before aggregating, and come from separate scorers. | example: 'Maturity 2: 138,000 listings a week go to human review, queue p95 four minutes' versus 'the team feels it is weak'; an average that hides a strong Tradeyard NL and an absent Keybridge implementation. | `contrast`: The verdicts. → What makes them trustworthy. |\n\n### In Practice: What the Public Record Shows\n\n**Controlling idea** (`evidence`, id `public-record`): No group has published its capability map, but dated public sources show the reasoning such maps support and its limits: consolidating generic capabilities, the gap between overlapping needs and a shared product, monetization as a differentiator and describing the business before deciding what runs it.\n\n**Advances the thesis** (C4): Tests the method's verdicts against what real marketplace groups have documented.\n\n**Transition in:** `example`: The heat-map method and its verdicts. → Documented public cases where similar reasoning was applied.\n\n**Order of paragraphs** (`grouping`): Grouped by the lesson each source carries: consolidating generic capabilities, the limit of overlap scores, differentiating monetization content, and the order of description before decomposition, which hands over to the worked example's order of work.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p36 | context | No marketplace group has published its capability map, but the public record shows the reasoning maps are used for and its limits. |  |  |\n| p37 | evidence | Adevinta consolidated about ten duplicated experimentation tools towards one platform, and its 2023 report names cloud, data, chat and moderation as consolidated enabling capabilities, the kind a heat map scores as generic. | quotation: Adevinta Tech Blog (2024), 'From ten to one': 'Every team had its own tool for A/B testing...'; 22 marketplaces in 2021; scoring matrix with a three-to-five-year horizon.; quotation: Adevinta Annual Report 2023 (2024): 'consolidating enabling capabilities such as cloud and data, and overarching elements such as chat and moderation'. | `example`: The record's reasoning. → A first documented case. |\n| p38 | evidence | Adevinta's 2023 plan for a unified generalist platform, citing overlapping customer needs, was followed after the 2024 take-private by a decentralised operating model, which shows that an overlap score measures similarity of needs, not the cost of sharing. | quotation: Adevinta Annual Report 2023 (2024): 'a pronounced overlap in customer needs'; 'into a unified global platform'. Aurelia UK Feederco Ltd, Strategic Report 2025 (2026): 'a decentralised, standalone operating model'. | `contrast`: Consolidation of generic capabilities. → A bolder overlap-driven step and its reversal. |\n| p39 | evidence | Rightmove's and Autotrader's results show product and pricing as revenue levers, from which I infer that package design and pricing is a differentiating level-3 capability while the entitlement ledger is generic. | statistic: Rightmove 2025 results (2026): 62% of agency ARPA growth from product; Auto Trader FY26 results (2026): the 1 April 2025 pricing and product event. | `additional_support`: Adevinta's lessons on generic capabilities and overlap. → A case where the differentiating content is commercial. |\n| p40 | evidence | Vinted identified almost 300 domains over at least two years before decomposing its monolith, showing the order the chapter argues for: describe what the business does before deciding what runs it. | quotation: Vinted Engineering (2026): 'Our first step wasn't to break the monolith apart. It was to understand it.'; 'identified almost 300' domains; 'guided how we restructured teams'. | `additional_support`: Evidence on what to share. → Evidence on the order of the work. |\n\n### Veldmark Worked Example: Five Overlaps, One Commercial Clash, One Deliberate Duplicate\n\n**Controlling idea** (`example`, id `worked-example`): In three weeks Veldmark's map confirmed the five overlaps the board knew, turned three of them into level-3 splits, added a commercial overlap and a deliberate duplicate, and moved shared trust and safety ahead of media.\n\n**Advances the thesis** (C5): Shows the whole method applied, with the verdicts the thesis predicts.\n\n**Transition in:** `contrast`: The public record, which shows the reasoning but no map. → A full map, scored and read, in the fictional group.\n\n**Order of paragraphs** (`chronological`): The three weeks in order, then their output table, then its reading, then the change to the program, then the one-page deliverable. Each step uses the previous one's output.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p41 | process (list) | Ingrid runs the mapping in three weeks of March 2027: draft the map without the inventory, map 412 applications to capabilities, then score with separate scorers. | scenario: Seven labels changed in week 1; 371 of 412 applications mapped cleanly, Yardstick alone to 23 capabilities; Noor Hassan's product leads, engineering leads and architecture as scorers; Olivier Petit's revenue attribution.; figure: Figure 5: value streams explain why capabilities matter; systems and teams map to capabilities. |  |\n| p42 | evidence | The heat map's decisive rows list implementations, differentiation, dated maturity per implementation and the verdict for each capability. | table: Heat-map table: identity, trust and safety, search, catalog and entitlements, analytics, media, taxonomy, ranking, ML, Poland professional sales, feed ingestion and distribution, each with scores and verdict. | `sequence`: The three weeks. → Their output. |\n| p43 | analysis (list) | The five overlaps matched the board's 'four of everything', but the map changed three answers to splits and added a commercial overlap and a deliberate duplicate that no platform program would have found. | case: Identity and analytics consolidate (Veldmark ID approved June 2027; govern the three definitions of a contact first); trust and safety, search and catalog split (shared OpenSearch for Tradeyard and Hearthly from September 2027, Motorvane on Elasticsearch until a 2029 review; 'share the model, not the packages'); Poland dealer clash as a portfolio decision for Henrik de Boer and Katarzyna Nowak; Keybridge kept with a reason and review date. | `cause_effect`: The heat-map rows. → What reading them changed. |\n| p44 | analysis | The map also changed Common Ground's sequence: media, expensive but not broken, moved behind trust and safety, which was immature in three places and a bottleneck of three streams. | case: Shared trust-and-safety platform live for Tradeyard NL and BE in November 2027; media after the five overlaps. | `additional_support`: The verdicts per capability. → Their effect on the program's order. |\n| p45 | context | The output on 31 March 2027 was one page without a target architecture, and that page is what made the later design arguable. |  | `conclusion_summary`: The findings and the new sequence. → The deliverable and what it was not. |\n\n### Vertical Differences\n\n**Controlling idea** (`comparison`, id `verticals`): Two of Veldmark's verdicts turned on the vertical, and such verdicts can be predicted before scoring, because each vertical weights the shared skeleton differently and adds a few level-3 capabilities.\n\n**Advances the thesis** (C2, C4): Shows where verticals differ on one map and how that changes scores.\n\n**Transition in:** `elaboration`: Veldmark's verdicts, two of which turned on the vertical, and the map section's claim that one skeleton serves every vertical. → Where verticals differ on that one skeleton, and the two Veldmark outcomes it explains.\n\n**Order of paragraphs** (`large_to_small`): The general vertical profile first, then the two Veldmark verdicts it explains; the Veldmark paragraph needs the table's weighting to make sense.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p49 | comparison | Results that turn on the vertical, a verdict and a score at Veldmark, can be predicted, because each vertical weights the shared skeleton differently and adds a few level-3 capabilities of its own. | table: Table: most differentiating areas, vertical-only level-3 capabilities, supply shape, transactions and where money is mapped, for general classifieds, real estate, automotive and jobs and recommerce. |  |\n| p50 | example | At Veldmark this explains why the two valuation models stay local on a shared ML platform and why Hearthly's feed ingestion scores higher on differentiation than Tradeyard's. | statistic: Valuo and Motorvane's market-value model in one level-2 capability; 84% of Hearthly listings via feeds from about 160 software vendors. | `example`: The vertical table. → The verdict and the score it explains. |\n\n### Trade-offs: Ways to Build a Capability Map\n\n**Controlling idea** (`comparison`, id `trade-offs`): Of four ways to start a map, a reference model tested and weighted by value streams works best for a group, and a capability is decomposed one level further only when its parts would get different verdicts.\n\n**Advances the thesis** (C6): Gives the reader the choices behind building the map and the stopping rule for its depth.\n\n**Transition in:** `sequence`: The finished Veldmark map and its vertical weightings. → The choices behind building any map.\n\n**Order of paragraphs** (`comparison`): The four starting points compared, then the combination chosen, then the second trade-off on depth, which needs the levels and verdicts already shown.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p46 | comparison | There are four common starting points, reference model, systems inventory, value stream and org chart, and the choice shapes what the map can answer. | table: Trade-off table: how each approach works, strengths, weaknesses, when it is right. |  |\n| p47 | example | Veldmark combined the reference model and the value streams and used the systems inventory only as a mapping step. | case: Veldmark's combination of the first and third approaches. | `example`: The four approaches. → The one Veldmark chose. |\n| p48 | recommendation | Granularity is the second trade-off: each level serves a different audience, and a capability is decomposed one level further only when its parts would get different verdicts. | example: Search splits at level 3 because engine and relevance get different verdicts; Notifications does not. | `sequence`: The first trade-off: where to start. → The second: how deep to go. |\n\n### Failure Modes\n\n**Controlling idea** (`analysis`, id `failure-modes`): Capability maps fail in eight recurring ways, each of which turns the map back into an inventory, an org chart or a one-off document.\n\n**Advances the thesis** (C6, C4): Names what breaks the method so the reader can avoid it.\n\n**Transition in:** `contrast`: How to build and weight the map. → How maps commonly go wrong.\n\n**Order of paragraphs** (`grouping`): In the order the method introduced its parts: naming (inventory, org chart), then depth (levels came before scores), then scoring, then the relationships drawn between capabilities and the evidence behind scores, then failures of use and record keeping, which only matter once a map exists.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p51 | analysis | Capability names that are system names make the map a copy of the inventory; the test is whether the capability would survive the replacement of every system that implements it. |  |  |\n| p52 | analysis | A map with a box per department changes at every reorganization, so ownership belongs in a separate table. |  | `similarity`: A map disguised as the inventory. → A map disguised as the org chart. |\n| p53 | analysis | Mapping everything to level 4 takes months and is out of date on delivery. |  | `sequence`: Naming failures. → A depth failure. |\n| p54 | analysis | A heat map scored only on duplication merges differentiating capabilities and starts The Forced Fit. |  | `sequence`: A depth failure. → A scoring failure. |\n| p55 | analysis | Generated or uniform dependencies between capabilities hide the real ones, so keep only relationships that shape ownership, data, reliability, releases or incidents. |  | `sequence`: Failures of the map's boxes and scores. → A failure of the lines drawn between the boxes. |\n| p56 | analysis | Scores with decimals and no evidence, the failure the heat map's first evidence rule guards against, look measured and invite false confidence. |  | `sequence`: False dependencies. → False precision. |\n| p57 | analysis | A map made once for a kick-off goes stale; it pays only with an owner, a version and a review cycle. |  | `sequence`: Failures of the map's content. → A failure of its use. |\n| p58 | analysis | If the reason for a deliberate duplicate such as Keybridge is not written on the map, the next efficiency program will try to merge it. |  | `sequence`: A map not maintained. → A decision not recorded. |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `chief-architect`): At group scale the capability map is a governance instrument: the Chief Architect owns its vocabulary, separates the scorers, defaults to splitting, ties it to money and uses it at every acquisition.\n\n**Advances the thesis** (C6): Turns the method into the decisions a Chief Architect owns.\n\n**Transition in:** `problem_solution`: The ways maps fail. → The governance that prevents them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p59 | recommendation (list) | Five decisions follow from treating the map as a governance instrument: own the vocabulary, separate the scorers, default to 'share the machinery, keep the content', tie the map to money and use it at every acquisition. | example: Veldmark's €38 million run-cost target became credible only when allocated to capabilities; Tool 1 in the toolkit. |  |\n| p60 | recommendation | Over time, watch the number of deliberate duplicates, the share of capabilities with an owner and dated evidence, and whether teams and contexts align to the map. |  | `sequence`: The five decisions. → What to watch after making them. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Nine questions let a reader test a group's capability map in a design review.\n\n**Advances the thesis** (C6): Gives the reader the method as questions to take into a review.\n\n**Transition in:** `conclusion_summary`: The Chief Architect's decisions. → The same points as questions for a review.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p61 | recommendation (list) | Nine questions test a group's map: names that survive system replacement, shared meaning across brands, binding constraints, traceable scores, level-3 splits, deliberate duplicates, commercial overlaps, cost and revenue, and readiness for the next acquisition. |  |  |\n\n## Conclusion: From Capabilities to Contexts\n\n**Synthesis:** The answer to 'what do we pay for four times?' is not a count of systems but a verdict per capability, and the verdict needs all three instruments together: the map makes brands comparable, the value streams say where a duplicate hurts liquidity, and the separate scores say whether to merge, split or keep it.\n\n**So what:** A Chief Architect who answers the board this way can defend the program's order with evidence, and can say which duplicates to keep, which to split and which overlaps are not platform questions at all.\n\n**Callback:** Henrik de Boer's question 'what exactly do we pay for four times?' and the Rotterdam city bike in the opening scene. The conclusion answers the question with Veldmark's verdicts and recalls that the bike needed the same capabilities in every brand.\n\n**Takeaway** (`course_of_action`): Answer the board's question with a verdict per capability, then take the map to the next step: bounded contexts.\n\n**Hand-off** to [Bounded Contexts for Marketplaces: Where One Listing Becomes Many Models](bounded-contexts.html): `sequence`: The capability map, which says what the group does and where it does it several times but is not a design. → The next step from map to design: bounded contexts, their owners and the relationships between them, using the capabilities as candidate contexts.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p62 | synthesis | The Group CEO's (Henrik de Boer's) question is answered not by a count of systems but by a verdict per capability, which needs the map, the value streams and the three scores together, as Veldmark's two consolidations, three splits, commercial clash and kept duplicate show. |  |  |\n| p63 | transition | The map says what the group does and where it does it several times, but not where one model of a listing ends, who owns it or how parts talk; that is a decomposition question for bounded contexts. |  | `contrast`: What the map answers. → What it does not, and the next chapter that does. |\n\n## Non-goals\n\n- Software decomposition, context maps and aggregates. See [Bounded Contexts for Marketplaces: Where One Listing Becomes Many Models](bounded-contexts.html).\n- The business-model taxonomy (classifieds, lead generation, transactional). See [Classifieds, Leads, Transactions and Managed Models: A Marketplace Taxonomy](marketplace-taxonomy.html).\n- Liquidity metric definitions. See [Liquidity Is the Product: Network Effects, Local Markets and Marketplace Metrics](liquidity-and-network-effects.html).\n- The full shared-versus-specific vertical analysis. See [Same Platform, Different Physics: How Listing Verticals Differ](vertical-requirements.html).\n- Consolidation sequencing after acquisitions. See [After the Deal: Consolidating Platforms After Acquisitions](platform-consolidation.html).\n- Team design. See [Who Owns What: Organizing Marketplace Engineering](organizing-marketplace-engineering.html).\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-10-19** — Made level 3 the place where verdicts are decided ('share the machinery, keep the content') rather than treating level-2 heat-map colors as final, because duplicated-and-differentiating cells otherwise lead nowhere.\n- **2026-10-19** — Defined the five Veldmark overlaps as the ledger's 'four of everything' (identity, trust and safety, search, product catalog, data) so the chapter confirms, then refines, what the board already knew; added the Poland dealer clash as a commercial overlap and Keybridge as a deliberate duplicate to show what platform-only maps miss.\n- **2026-10-19** — Used the Productscape reference models' shared 88-capability skeleton as evidence that one map serves all verticals, labeled as the author's generic models, not company fact.\n- **2026-10-19** — Rejected an org-first or systems-inventory-first mapping method as the recommended approach; both are presented in the trade-off table. Rejected: Org-first mapping; Systems-inventory-first mapping\n- **2026-11-12** — Converted spec.md to spec.json. Success criteria: the five-term table, the three-level map, the value-stream cross-map, the heat-map scales and verdict table, the dated public examples, and
