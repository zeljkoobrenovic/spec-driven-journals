<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, acceptance criteria AC-1 to AC-3, the thesis and the role are copied unchanged from the bounded-contexts entry in journal-spec.json. One unit was added by this conversion: a synthesis paragraph (p76) before the old hand-off paragraph in the closing section.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Core, supporting and generic subdomains; bounded context, context map, core domain and published language.\n- **Know:** The meanings of 'listing' in supply, catalog, trust, search, monetization, contact and analytics, and the context-map relationships (anti-corruption layer, conformist, customer–supplier, open host, separate ways).\n- **Believe:** One context owns the listing's truth; every other context owns only its own view.\n- **Be able to:** Draw a context map from a capability map, name one owner for each piece of listing data and one team for each context.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a proposal for one context to write listing state directly, the reader says who decides and how the change propagates. *Probe:* A dealer's feed says a car is sold, and the search team proposes deleting it from the index straight from the feed. Using only this chapter: who decides the car is gone, and how does search learn it? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-4 | Given one subdomain that two brands of a group value differently, the reader says how to classify it and what a shared platform for it must do. *Probe:* A group runs a general classifieds brand with mostly private sellers and a car brand whose supply comes almost entirely from verified dealers. Using only this chapter: is trust and safety core or supporting, and what does that mean for a group trust-and-safety platform? | `custom` | cold_reader | minor |\n| AC-5 | Given a paid placement that touches the listing and the seller's entitlement, the reader explains how it stays correct without one transaction across contexts. *Probe:* A seller buys a seven-day 'Top listing'. Using only this chapter: why should one database transaction not decrement the seller's balance, flag the listing and reindex it, and what happens instead if the listing was removed in the meantime? | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** How should a marketplace be decomposed into domains, and where do the boundaries go?\n\n> **Claim:** A listing marketplace's boundaries belong where the meaning of 'listing' changes (a feed record in supply, an aggregate in the catalog, a case subject in trust, a document in search, an entitlement holder in monetization, a fact row in analytics); the catalog owns the listing's state, every other context builds its own view from a published listing event and never writes listing state back, and each relationship on the context map is recorded as an organizational decision about who adapts to whom.\n\n**Disputed by:** The view that a marketplace should keep one canonical listing model, in one table or one service, shared by every team, so that all teams see the same listing and data is never duplicated.\n\n**So what:** A late dealer removal becomes one context's freshness contract instead of a bug in six places: a group that accepts this names one owner for every piece of listing data, moves paid-visibility and moderation state out of the shared table, treats the search index as a read model and gives each context exactly one owning team.\n\n**How and why:** Teams sharing one model negotiate every change with every other team: Yardstick's ads table has 214 columns read by 38 modules. Trust decisions must survive the listing's deletion, search does not want the seller's phone number, and real estate cares about the property behind three listings, so no single structure holds every meaning with its invariants. Veldmark's 54 capabilities became 19 contexts and 31 ownership decisions.\n\n**Supporting claims**\n\n- **S1** — 'Listing' means different things in different contexts (a feed record, an aggregate, a case subject, a search document, an entitlement holder, a fact row), and a boundary belongs wherever the meaning changes.\n- **S3** — One context, the listing catalog, owns the listing's state; every other context builds its own view from the published listing event, never writes listing state back, and keeps its transactions inside its own aggregates.\n- **S4** — Each relationship on the context map (anti-corruption layer, conformist, customer-supplier, open host with published language, partnership, separate ways, contained big ball of mud) is an organizational and sometimes commercial decision about who adapts to whom, and is recorded as one.\n- **S5** — The boundaries are found by a repeatable method that starts from the capability map: classify each subdomain per brand as core, supporting or generic, which decides which contexts a brand keeps, which the group shares and which it buys; then candidate contexts, language breaks, one owner per piece of data, named translation points and one team per context; public engineering records show the same order, domains before services and events between them.\n\n## Role in the part\n\nTurns the capability map into boundaries of models and teams, and fixes who owns the listing's truth for the rest of the book. Supports P1-5 of part `part-1`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `assertion_evidence_reasoning` in worked-example and public-record: Veldmark's own process behind the map, then the map's claims tested against real records)\n\nEach section supplies what the next one needs. The forum scene poses the question; the concepts give the words to answer it; subdomains say which contexts matter to which brand; one listing in ten contexts shows where meaning changes; the context map assigns owners and relationships using all of that. Veldmark's worked example then shows how the map was drawn and the public record tests it against real marketplaces, and the trade-offs, vertical differences, failure modes, governance and review questions come after it because each is a judgement about a map the reader has already seen. Moving the context map before the meanings would present owners and relationships for distinctions not yet drawn.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): Ask six teams what a listing is and you get six correct answers that cannot all be true of one data structure: the seller's draft, the moderator's case subject, the search document, the paid placement, the lead's source and the analyst's fact row.\n\n**Bridge:** The capability map of the previous chapter: 54 level-2 capabilities in ten areas, which say what the group does but not how it should be built. → How many models of a listing there should be, who owns each and how they talk are decomposition questions, answered with bounded contexts.\n\n**Thesis statement** (KEY POINTS callout (all three bullets); p02 states the overloaded noun the claim starts from.): Boundaries belong where the meaning of 'listing' changes; one context owns the listing's truth and every other owns only its view, built from a published event; and each relationship on the context map is a decision about who adapts to whom.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p03.):\n\n- Six Veldmark answers to 'what is a listing?' *Kept in:* scene.\n- The terms: subdomains, bounded contexts, context maps and their relationships. *Kept in:* concepts.\n- Classify subdomains as core, supporting or generic. *Kept in:* subdomains.\n- Find where 'listing' changes meaning, following one listing through ten contexts. *Kept in:* one-listing.\n- Draw the context map with its relationships. *Kept in:* context-map.\n- Aggregates as transactional boundaries. *Kept in:* aggregates.\n- The listing event as the shared language. *Kept in:* listing-event.\n- How Veldmark draws the Common Ground map. *Kept in:* worked-example.\n- What public engineering records show. *Kept in:* public-record.\n- Trade-offs, vertical differences, failure modes, the Chief Architect's view and questions for a review. *Kept in:* trade-offs, verticals, failure-modes, ca-view, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | The capability map of the previous chapter says what a marketplace does but not how many models of a listing there should be, who owns them or how they talk, and the tool for those questions is domain-driven design's bounded context. | fact: 54 level-2 capabilities in ten areas, mapped to the value streams that produce liquidity. |  |\n| p02 | claim | Listing marketplaces are a clear case for bounded contexts because their central noun is overloaded: six teams give six correct answers to 'what is a listing?' that cannot all be true of one data structure. | example: The seller's draft, the moderator's case subject, the search document, the paid placement, the lead's source and the analyst's fact row, all called 'the listing'. | `cause_effect`: The bounded context as the tool for decomposition. → Why marketplaces in particular need it: the overloaded word 'listing'. |\n| p03 | transition | Later chapters build inside the boundaries drawn here, and this chapter goes from six Veldmark answers to 'what is a listing?' through the terms, the subdomains, one listing in ten contexts and the context map with its aggregates and published language, to Veldmark's worked map, the public record, and the trade-offs, vertical differences, failure modes, Chief Architect's view and review questions. |  | `sequence`: The overloaded noun and the bounded context as the tool for it. → What the rest of the book builds on these boundaries, and the order of this chapter; Veldmark named as fictional. |\n\n## Sections\n\n### Setting the Scene at Veldmark: Six Answers to \"What Is a Listing?\"\n\n**Controlling idea** (`context`, id `scene`): At Veldmark's architecture forum six people give six correct answers to 'what is a listing?', so the design question becomes which context owns which meaning and who owns the truth.\n\n**Advances the thesis** (S1): Shows the overloaded noun in one room, with the people who own each meaning.\n\n**Transition in:** `example`: The claim that six teams give six correct answers. → The forum meeting where they give them.\n\n**Order of paragraphs** (`small_to_large`): The question, then the six answers, then the conclusion the forum draws from them. The conclusion before the answers would be an assertion; the answers without it would be a list of complaints.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p04 | context | In April 2027 Sven needs to know what a listing is before he can define Listing event contract v1, so Ingrid puts 'what is a listing, and who decides?' on the advice forum's agenda. | scenario: Listing event contract v1, due live on 1 July 2027; Sven Lindqvist and Ingrid Halvorsen at the newly set-up weekly architecture advice forum. |  |\n| p05 | example (list) | Six Veldmark people each describe a different, correct listing: a 214-column row, a dealer feed record, a trust subject, a search document, a holder of paid products and one of three listings of one property. | scenario: Daan: the `ads` row (214 columns, 38 modules); Felix: the DMS feed record (88% of dealer listings; the Essen Golf removal 26 hours late); Aisha: a subject whose decision outlives the listing; Tomasz: a flattened document without the phone number; Olivier: something that holds a bump or a slot; Julien: the Lyon flat, one property with three listings. | `example`: The forum's question. → The six answers, one per person. |\n| p06 | claim | The forum concludes that 'listing' is six concepts sharing a name and an identifier, so the question is which context owns which meaning, which owns the truth and how the others learn of changes. | figure: Figure 1: six people see one listing card through six lenses. | `conclusion_summary`: The six answers. → What they add up to, and the design question it leaves. |\n\n### Concepts: Subdomains, Contexts and Context Maps\n\n**Controlling idea** (`definition`, id `concepts`): Domain-driven design's strategic terms (domain, subdomain and its three kinds, bounded context, ubiquitous language, context map with its named relationships, aggregate and domain event) give the vocabulary for the decomposition, and each is distinct from the previous chapter's capability, service and team.\n\n**Advances the thesis** (S1, S4): Defines the bounded context the thesis draws, and names the relationship patterns the thesis says must be recorded.\n\n**Transition in:** `elaboration`: The forum's question of which context owns which meaning. → The vocabulary needed to answer it.\n\n**Order of paragraphs** (`prerequisite_order`): Each term needs the one before: subdomain needs domain, its kinds need subdomain, a bounded context is distinguished from a subdomain, its language belongs to it, a map relates contexts, aggregates sit inside them. The comparison table and the ownership rule come last because they use every term; placed first, they would compare units the reader cannot yet tell apart.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | context | Domain-driven design, introduced by Eric Evans in 2003, has a strategic part for large models and many teams, and its terms carry this chapter. | source: Evans, Domain-Driven Design: Tackling Complexity in the Heart of Software (2003). |  |\n| p08 | definition | A domain is the business the software serves and a subdomain is a part of it with its own concerns, found in the business, and the capability map's areas are a first draft of them. |  | `sequence`: Domain-driven design's strategic part. → Its first two terms. |\n| p09 | definition | Subdomains differ in strategic value: core where the business competes, generic where nobody wins, and supporting in between, and the classification is a business judgement that maps onto the heat map's differentiation score. | source: Evans (2003) for core and generic; Vernon, Implementing Domain-Driven Design (2013), for supporting. | `elaboration`: Subdomains. → The three kinds and their link to the previous chapter's heat map. |\n| p10 | definition | A bounded context is the boundary within which one model and its vocabulary apply consistently, drawn mainly by human language, and 'listing' is the marketplace's version of Fowler's 'meter'. | quotation: Fowler (2014): 'a central pattern in Domain-Driven Design'; DDD 'deals with large models by dividing them into different Bounded Contexts'; the utility where 'meter' meant three things. | `sequence`: Subdomains, which are found in the business. → The bounded context, which is drawn in the model. |\n| p11 | definition | The ubiquitous language is the vocabulary used consistently inside one context, ubiquitous within it rather than across the company. |  | `elaboration`: The bounded context's vocabulary. → Its name and its scope. |\n| p12 | definition | A context map shows the contexts and who is upstream, who adapts to whom and where translation happens, and its relationship patterns have standard names with typical marketplace uses. | table: Nine relationships (partnership, shared kernel, customer-supplier, conformist, anti-corruption layer, open host service, published language, separate ways, big ball of mud), each with a meaning and a marketplace use. | `sequence`: Single contexts and their languages. → How contexts relate to one another. |\n| p13 | definition | From tactical design come the aggregate, a cluster treated as one unit that transactions do not cross, and the domain event, a record that something meaningful happened, published so other contexts can react. | quotation: Fowler (2013): 'a cluster of domain objects that can be treated as a single unit'; 'transactions should not cross aggregate boundaries'. | `additional_support`: The strategic terms. → Two tactical terms the chapter needs for transactions and integration. |\n| p14 | comparison | Capability, subdomain, bounded context, service and team are different units decided by different people, and a table keeps them apart. | table: Concept, unit of, decided by, example: from 'saved searches and alerts' as a capability to the Tradeyard Alerts team. | `contrast`: The new terms. → How they differ from the previous chapter's capability and from services and teams. |\n| p15 | recommendation | The healthy shape is one team owning one or more contexts, each context owned by exactly one team and containing one or more services, because context and team boundaries must agree. | source: Conway, 'How Do Committees Invent?' (1968): systems copy the communication structures of the organizations that build them. | `cause_effect`: Contexts, services and teams as separate units. → The rule that relates them. |\n\n### Subdomains: Where a Marketplace Competes\n\n**Controlling idea** (`analysis`, id `subdomains`): Subdomains must be classified per brand before contexts are drawn, because the classification decides where to invest, what to buy and what to share, and it differs by vertical.\n\n**Advances the thesis** (S5): Shows that core, supporting and generic differ by brand, which decides which contexts stay with a brand.\n\n**Transition in:** `sequence`: The definitions of core, supporting and generic subdomains. → Applying them to Veldmark's three brands.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The classification table first (p16 carries it as evidence), then what it implies for core and for generic subdomains, then the hard case where brands disagree. The hard case placed first would be a conflict between categories the reader has not yet seen applied; it needs both consequences, because the answer (shared machinery, configurable policy) combines them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p16 | analysis | The subdomain classification differs by brand and vertical, so it is done per brand even when the map is shared. | table: Ten subdomains classified for Tradeyard, Motorvane and Hearthly, with why each differs (for example lead management supporting at Tradeyard and core at Motorvane and Hearthly). |  |\n| p18 | recommendation | The classification has two practical consequences, and the first is that core subdomains are where brand-specific contexts belong even on a shared platform: the group may provide the engine, but the brand owns the context that holds its relevance or valuation model. | example: Motorvane's ranking and Hearthly's valuation model. | `cause_effect`: The per-brand classification. → Its first practical consequence, for core subdomains, announced as the first of two. |\n| p19 | recommendation | Generic subdomains are candidates for buying or for one group context. | scenario: Veldmark ID, approved in June 2027, built once as an open host service with brand-specific profiles. | `sequence`: The first consequence. → The second, for generic subdomains. |\n| p20 | analysis | Classification turns political when one group platform serves brands that classify the same subdomain differently, so the platform shares the machinery and makes the policy configurable. | scenario: Trust and safety is core at Tradeyard and supporting at Motorvane, whose supply is 91% from about 21,400 dealers verified at contract signature. | `contrast`: The two clean consequences. → The case where brands disagree. |\n\n### One Listing, Many Models\n\n**Controlling idea** (`evidence`, id `one-listing`): Following one listing through ten contexts shows that each context gives 'listing' its own meaning, identity and owned data, so the boundaries fall where the meaning changes.\n\n**Advances the thesis** (S1, S3): Demonstrates the meaning changes the thesis names, and that each context owns data no other should write.\n\n**Transition in:** `sequence`: Which subdomains matter to which brand. → The contexts in which the listing appears and what each needs it to be.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The ten-context table is the evidence; the two analyses read it (ownership, then interpretation of one change); the reference models confirm it from outside, first by their structure and then by their counts and one ownership mistake. The confirmation before the evidence would ask the reader to trust a model they have not seen.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p21 | evidence | The Lyon flat, listed by three agencies at €389,000, €389,000 and €395,000, means something different in each of ten contexts. The two equal prices and one higher price come from French asking prices including the agency's fee. | scenario: A 68 m² T3 flat in Lyon 7e listed in May 2027 by three agencies; Agence Rhône Habitat, a 14-branch network, publishes through Keybridge.; table: Ten contexts with what 'listing' means, its identity, what the context owns and the Lyon flat in that context (three feed records, three listings, one canonical property, one collapsed search result, one alert, three package slots, one valuation observation). |  |\n| p22 | analysis | Each context owns something no other context should write, and when two contexts write the same field one of them is wrong about its boundary. |  | `elaboration`: The table's 'Owns' column. → The ownership rule it shows. |\n| p23 | example | The same real-world change means different things in different contexts, so one published event serves all of them while each interprets it in its own model. | scenario: A price cut to €379,000 at Rhône Habitat: a changed feed field, a PriceChanged transition, a document update, a price-drop alert, a new observation, a fact row. | `additional_support`: Each context's own data. → Each context's own reading of one change. |\n| p24 | evidence | Two generic domain models the book draws on, introduced here as the author's working models that describe no company, reach the same structure, with one owner of the listing and a property separate from it, because the listing is a publication about the thing, not the thing. | quotation: The real-estate reference model's property reference 'connects multiple classifieds, valuations, and location signals to the same underlying property without treating every listing as a separate property'. | `similarity`: The structure Veldmark's contexts show. → The same structure in independent reference models. |\n| p46 | evidence | The reference models' numbers make the one-owner pattern concrete: in the general model one capability owns the listing, eleven read it and two more query it through search. | fact: In the general model the listing is owned by one capability, read by eleven and queried through search by two more. | `elaboration`: The reference models' one owner and many readers. → Their counts. |\n\n### Architecture: The Marketplace Context Map\n\n**Controlling idea** (`explanation`, id `context-map`): Veldmark's Common Ground map gives the catalog ownership of listing truth, publishes it as one language, and records each relationship as a reasoned decision.\n\n**Advances the thesis** (S3, S4): Shows one owner of listing truth with read models around it, and every relationship decided with a reason.\n\n**Transition in:** `cause_effect`: The many meanings and the owner of each. → The map that connects them and decides who adapts to whom.\n\n**Order of paragraphs** (`prerequisite_order`): The whole map first, so each relationship is read as one edge of a picture the reader has seen; without it, nine relationship paragraphs would arrive with nothing to place them in. Then the relationships in the order the listing flows: from supply into the catalog, out to consumers and partners, then the edges and the legacy monolith. Starting at the monolith would explain a translator before the language it translates into.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p25 | description | Veldmark's Common Ground context map, approved in May 2027, is the 2028 target with Yardstick behind a translator. | figure: Figure 2: the Common Ground context map (target 2028). |  |\n| p27 | explanation | Each relationship on the map is a decision with a reason, and the first, feed ingestion, is a one-way anti-corruption layer, so no vendor's model leaks into the catalog. | scenario: Hearthly receives 84% of its listings from about 160 real-estate software vendors; Motorvane most of its dealer stock from DMS exports. | `elaboration`: The map as a whole. → The claim that each relationship is a reasoned decision, and the first one: supply's translation into catalog commands. |\n| p28 | explanation | The catalog is upstream of almost everything and publishes a language rather than exposing its model, which makes it an open host service with a published language on the group event backbone, which Hearthly's events also reach through a bridge. | fact: Listing event contract v1: twelve event types with public state, version and cause. | `sequence`: What enters the catalog. → What leaves it. |\n| p29 | explanation | Search conforms to the published language and never writes listing state back, which keeps the index a read model and prevents Search as System of Record. | source: Vinted (2024) put a 'search contract' in a Go gateway in front of Vespa so product applications did not change. | `sequence`: The language the catalog publishes. → Its largest consumer. |\n| p30 | explanation | Monetization is a customer-supplier partner of the catalog and owns entitlements, so the listing carries only references to active placements. | reasoning: Entitlements (sold, granted, consumed, delivered) live in monetization; ranking reads the visibility effects it publishes. | `sequence`: A consumer that only reads. → A partner that needs the catalog to accept something. |\n| p31 | explanation | Trust and safety changes listings only by command and keeps its own decision record, working in partnership with the catalog during the 2027 pipeline redesign. | fact: The publication pipeline's 90-second target. | `sequence`: Monetization's commands. → Trust and safety's commands. |\n| p32 | explanation | The transaction context deliberately conforms to its regulated payment provider and translates only where an order meets a listing. | scenario: Safe Deal runs on Adyen for Platforms, the licensed party. | `contrast`: Contexts that keep their own models. → A context that adopts an upstream model on purpose. |\n| p33 | explanation | Identity and taxonomy are open host services that serve every context with a stable protocol and know nothing about listings. |  | `sequence`: Relationships around the listing. → Two services every context uses. |\n| p34 | explanation | Keybridge goes separate ways, reaching Hearthly only through the public feed contract with no subscription to its events, because the map must enforce a commercial promise. | scenario: In March 2027 Veldmark committed that Hearthly would not use Keybridge agency data for ranking or sales targeting. | `contrast`: Relationships that integrate. → A relationship that deliberately does not. |\n| p35 | explanation | Yardstick is contained as a big ball of mud behind Yardstick Relay, so CDC is only ever a source and consumers see one language from every brand. | scenario: The 214-column `ads` table until the insertion flow moves out in Q2 2028; Relay reads it through change data capture and emits contract events. | `sequence`: The new contexts' relationships. → The legacy monolith's. |\n\n### Aggregates and Transactional Boundaries\n\n**Controlling idea** (`explanation`, id `aggregates`): Aggregates keep transactions inside one context, so a change that touches two contexts is split into steps that are each atomic, made safe by idempotency and repaired by the owner of the data.\n\n**Advances the thesis** (S3): Shows that no context writes another's state even inside one business operation.\n\n**Transition in:** `elaboration`: Boundaries between contexts. → Boundaries of transactions inside them.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The rule and the table, then the bump that applies it, then the general trade. The bump before the rule would read as an implementation detail; the trade before the bump would be an abstraction without a case.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p36 | claim | Aggregates set transactional boundaries inside contexts, and most damage in listing systems comes from transactions that span what should be two aggregates. | table: Six aggregates (listing, entitlement account, case, conversation, canonical property, saved search) with their context, consistency rule and what each must not include. |  |\n| p37 | example (list) | A bump is split into steps that are each atomic in one aggregate, made safe by an idempotency key and repaired by the context that owns the entitlement. | scenario: A seven-day 'Top listing': the naive one-transaction version across three tables and two contexts, then four steps (grant keyed by order ID, ApplyPlacement and VisibilityChanged, new listing version, retry or refund with the visibility change reversed).; figure: Figure 3: the bump across two aggregates in two contexts. | `example`: The rule that transactions stay inside aggregates. → A bump done the naive way and the split way. |\n| p38 | analysis | The trade is deliberate: atomic consistency within an aggregate, explicit eventual consistency between aggregates, and idempotency everywhere. |  | `conclusion_summary`: The bump's steps. → The general rule they follow. |\n\n### The Listing Event as Published Language\n\n**Controlling idea** (`explanation`, id `listing-event`): The listing event contract is the language between contexts, its design rules follow from the map, and Ghost Inventory shows what happens when a context does not share it.\n\n**Advances the thesis** (S3): Shows how other contexts build their views from the catalog's published event.\n\n**Transition in:** `sequence`: Transactions inside contexts. → The language between them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p39 | explanation (list) | The listing event contract is the map's most important artifact, and its design rules follow from the map: owned by the catalog but designed with consumers, public state only, business transitions, versioned and keyed per listing, with group identifiers as the shared kernel. | example: The listing ID format `vm:tradeyard:nl:84711032`; ListingSold versus 'Row 84711032 updated'. |  |\n| p40 | example | Ghost Inventory is a boundary failure before it is a latency failure: one context learned of a sale and another did not because they did not share a language. | scenario: Femke's €240 Rotterdam bike, sold at 18:10 on 8 March 2027 and removed from search at 18:11, yet featured in the next morning's alert digest built from its own copy.; figure: Figure 4: Ghost Inventory as a boundary failure. | `example`: The contract's design rules. → The case that shows why they matter for boundaries. |\n\n### Veldmark Worked Example: Drawing Common Ground's Boundaries\n\n**Controlling idea** (`process`, id `worked-example`): Veldmark draws its boundaries in five steps from the capability map, and the result turns the Essen Golf's late removal into one problem in one context.\n\n**Advances the thesis** (S5, S3): Shows the method end to end with ledger numbers and its effect on one case.\n\n**Transition in:** `elaboration`: The finished map, its aggregates and its published language. → The work behind the map: how Veldmark drew it, step by step.\n\n**Order of paragraphs** (`chronological`): The five steps in the order the team ran them; each uses the previous step's output (candidates, then their language, then their data, then their relations, then their teams). The Essen Golf comes last because it needs the finished map.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p47 | context | The sections so far showed the finished map; Veldmark's sessions show the work behind it: five steps over four working sessions in April and May 2027, from the March capability map. |  |  |\n| p48 | process | The 54 level-2 capabilities collapse into 19 candidate contexts, more than the ten a listing passes through because the map also holds contexts such as identity and taxonomy; some are merged because they share a model and some split because the heat map gave them different verdicts. | scenario: Saved searches and alerts merged with the alert parts of Notifications; search split into a group platform context and brand relevance contexts. | `sequence`: The sessions. → Step 1. |\n| p49 | process | Writing down what 'listing', 'seller' and 'price' mean in each candidate finds the boundaries, including the surprise that price means different things at Motorvane and Hearthly France. | scenario: Hearthly France prices include agency fees (the Lyon flat's €389,000, €389,000 and €395,000); the catalog keeps advertised price and fee basis apart and valuation owns the net-price translation. | `sequence`: Candidate contexts. → Step 2, testing them by language. |\n| p50 | process | One context is named owner of every piece of data, 31 decisions in all, and five took more than one session. | table: Listing state, paid visibility, moderation decision, canonical property and off-platform sold price: candidates, decision and why. | `sequence`: The boundaries. → Step 3, assigning truth within them. |\n| p51 | process | The relationships are drawn and four anti-corruption layers are named and owned. | scenario: Feed ingestion per brand (shared library), Yardstick Relay, the Hearthly bridge from Google Pub/Sub to Confluent Cloud, the transaction edge towards Adyen. | `sequence`: Owners of data. → Step 4, relationships between owners. |\n| p52 | process | Each context gets exactly one owning team, which fixes four split contexts and two orphans. | scenario: 13 of 19 already single-owned; four split inside Yardstick; removal propagation went to the Alerts team and taxonomy to the new group taxonomy team (service live October 2027). | `sequence`: Relationships. → Step 5, teams. |\n| p53 | example | With the map in place the Essen Golf's 26-hour removal delay becomes one problem in one context, ingestion's freshness contract with the dealer, instead of six problems. | scenario: Sold 29 April 2027; removal 26 hours later; ingestion sends Withdraw, the catalog emits ListingRemoved with cause 'feed removal', consumers react within declared deadlines. | `example`: The five steps. → Their effect on one case. |\n\n### In Practice: What the Public Record Shows\n\n**Controlling idea** (`evidence`, id `public-record`): Public engineering records show the same decisions at real marketplaces: domain work before services, services aligned to contexts, the cost of a database as contract, and anti-corruption layers as products.\n\n**Advances the thesis** (S5, S4): Shows real marketplaces drawing domains before services and integrating through events and translation layers.\n\n**Transition in:** `contrast`: Veldmark's fictional map and how it was drawn. → What real marketplaces have published about the same decisions.\n\n**Order of paragraphs** (`grouping`): Real companies grouped by the decision each shows: domains before services (Vinted, the fullest account, so it frames the rest), services aligned to contexts (AutoScout24), the database as contract (Kleinanzeigen) and translation as a product (Adevinta). Starting with the narrow cases would leave the reader without the order (domains, then services, then events) that the others are read against.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p41 | transition | Veldmark's map is fictional and few real marketplaces publish theirs, but several have published enough to show the shape of the same decisions. |  |  |\n| p42 | evidence | Vinted understood its domains before splitting its monolith and integrated them with business events, not shared tables. | quotation: 'Our first step wasn't to break the monolith apart. It was to understand it.'; 'at least two years ... almost 300 of them'; DDD 'guided how we restructured teams'. | `example`: Published records. → The first and most recent. |\n| p43 | evidence | AutoScout24 is an early documented case of a listing marketplace using bounded contexts as the unit of service ownership. | source: AutoScout24 Tech Blog (2018): services each focused on a bounded context; InfoQ (2016): Project Tatsu from November 2014, teams added every two to three months, 'shared nothing'. | `additional_support`: Vinted's domains before services. → An older case of services aligned to contexts. |\n| p44 | evidence | Kleinanzeigen's CDC pipeline gets data out of a database with configuration, but, by inference, makes the source schema a de facto contract, which is why Veldmark puts a translator between CDC and the published language. | source: Adevinta Tech Blog (Kleinanzeigen, January 2025): Debezium CDC into Kafka, joined and enriched, published to a compacted topic; problems 'often occur at the infrastructure level rather than in the application code'. | `contrast`: Cases that integrate through contexts. → A case where the database is the source. |\n| p45 | evidence | Adevinta built a dispute back office that consumes each marketplace's events through its own translation, an anti-corruption layer offered as a product. | quotation: Adevinta Tech Blog (February 2023): 'that can be plugged into any marketplace'; 'We couldn't hardcode anything… or make any assumptions'. | `additional_support`: Translation in front of a database. → Translation in front of several marketplaces. |\n\n### Trade-offs\n\n**Controlling idea** (`comparison`, id `trade-offs`): Three decomposition decisions (granularity, integration style, and one model or many) have no universal answer, and each option is right under stated conditions.\n\n**Advances the thesis** (S4): Shows that the relationship and model choices are decisions with costs, made under conditions.\n\n**Transition in:** `contrast`: Veldmark's choices and the public cases. → The alternatives it did not take and when they are right.\n\n**Order of paragraphs** (`large_to_small`): How many contexts, then how they talk, then whether they share a model: each decision assumes the previous one is made. Asking about integration style before the number of contexts is settled would compare styles for boundaries not yet drawn.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p54 | transition | Veldmark's map and the public cases turn on three decisions that recur in every decomposition, and none has a universal answer. |  |  |\n| p55 | comparison (table) | Context size should follow the maturity of the domain work and the event platform: few large contexts early, contexts per level-2 capability at group scale, and many fine-grained domains only after the domain work is done. | table: Few large contexts, contexts per level-2 capability (Veldmark's choice), many fine-grained domains (as Vinted's 300 suggest): strengths, weaknesses, when right. | `sequence`: Three recurring decisions. → The first: granularity. |\n| p56 | comparison (table) | Published events are the default integration between contexts, with synchronous APIs for answers needed now and CDC only as a transitional source behind a translator, and a shared database never across contexts. | table: Shared database, synchronous APIs, published events, CDC from tables: strengths, weaknesses, when right. | `sequence`: Granularity. → The second: integration style. |\n| p57 | comparison (table) | Per-context models with a published language are the default for a marketplace group, with an enterprise canonical model kept to the small shared kernel and per-brand models only for businesses that may be sold. | table: Enterprise canonical model, per-context models plus a published language, per-brand models: strengths, weaknesses, when right. | `sequence`: Integration style. → The third: one model or many. |\n\n### Vertical Differences\n\n**Controlling idea** (`comparison`, id `verticals`): The context map's skeleton is shared across verticals, but which contexts exist, which are core and where the entity sits differ.\n\n**Advances the thesis** (S5): Shows the per-vertical differences that make classification and contexts brand-specific.\n\n**Transition in:** `contrast`: Decisions that apply to every marketplace. → What differs by vertical.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p58 | comparison | The skeleton is shared while entities, extra contexts, supply languages, the hardest boundary and the place of transactions differ by vertical. | table: General classifieds, real estate, automotive, jobs and recommerce on five dimensions. |  |\n| p59 | analysis | The real-estate column explains why Hearthly has entity resolution and mandates contexts that Tradeyard lacks, and product-safety rules can force the same separation for goods. | reasoning: When product-safety rules make the marketplace responsible for recalled items, a product identity separate from the listing lets one notice suspend every affected listing. | `example`: The vertical table. → One column read closely, and the same need in goods. |\n\n### Failure Modes\n\n**Controlling idea** (`analysis`, id `failure-modes`): Nine recurring decomposition failures each break either the single owner of listing truth or a deliberate relationship, and each has a named cure.\n\n**Advances the thesis** (S3, S4): Shows what happens when one owner or a recorded relationship is missing.\n\n**Transition in:** `contrast`: How boundaries should be drawn. → How they commonly go wrong.\n\n**Order of paragraphs** (`grouping`): Shared models first (one table, one database, one group model, wrong-dimension boundaries), then missing owners (listing state, entitlements), then undecided relationships and ownership, then the opposite error of too many contexts. Each group fails a different part of the thesis; mixing them would hide which rule each failure breaks, and the last item reads as a warning against overcorrecting only after the others.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p59a | transition | Boundaries go wrong in recurring ways, most of them a missing owner or an undecided relationship, and nine recur often enough to name. |  |  |\n| p60 | analysis | The god listing table, where every module reads and writes one table, is escaped by naming column owners and putting a translator in front, not by splitting the table first. | scenario: Yardstick's 214-column `ads` table. | `example`: Recurring ways boundaries go wrong. → The first: the god listing table. |\n| p61 | analysis | A database shared between contexts means the boundary on the diagram does not exist, and the symptom is a migration that needs three teams to deploy together. |  | `additional_support`: The god table inside one system. → The same coupling between two contexts. |\n| p62 | analysis | A group canonical model for everything becomes the god table at group scale, so the shared kernel should hold only identifiers, tenant codes and the published event. |  | `additional_support`: Sharing a schema between two contexts. → Sharing one model across the group. |\n| p63 | analysis | Contexts drawn by technical layer guarantee that every business change crosses every boundary. |  | `additional_support`: Models shared too widely. → Boundaries drawn in the wrong dimension. |\n| p64 | analysis | When a consumer such as search becomes the place where listing state is corrected, the index becomes the only complete copy, which is Search as System of Record, cured by a named owner and a tested rebuild path. |  | `additional_support`: Wrong boundaries. → A missing owner of listing truth. |\n| p65 | analysis | When insertion, ranking, rendering and messaging each check package flags, nobody can say what was sold versus delivered, and the cure is a monetization context that owns entitlements. |  | `similarity`: A missing owner of listing state. → A missing owner of entitlements. |\n| p66 | analysis | A context that adopts a vendor's model without deciding to is conformist by accident, so conformity should be a recorded decision and an anti-corruption layer the default elsewhere. | scenario: Veldmark recorded conformity to the payment provider. | `additional_support`: Missing owners. → Relationships nobody decided. |\n| p67 | analysis | Split ownership, one context with two teams, leaves the edge cases unowned, and its mirror image is a responsibility with no team, as with Veldmark's two orphans. | scenario: Removal propagation to digests and taxonomy. | `additional_support`: Undecided relationships. → Undecided ownership. |\n| p68 | analysis | Fine-grained contexts drawn before the domain is understood produce distributed monoliths. | source: Vinted's two years of domain work came before the services. | `contrast`: Too little ownership. → Too many boundaries too early. |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `ca-view`): At group scale the context map is the architecture's constitution: a few decisions belong to the group by decision record, the rest to brands, with a forum to review changes and five signals to watch.\n\n**Advances the thesis** (S4, S3): Turns ownership of truth and recorded relationships into group governance.\n\n**Transition in:** `cause_effect`: The failures that come from missing owners and undecided relationships. → Who decides what, so those failures are prevented.\n\n**Order of paragraphs** (`large_to_small`): The principle, then who decides what, then how, then what to watch, then where the book goes on. Signals come after the rules they monitor.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p69 | claim | The context map is the architecture's constitution at group scale, and the author, speaking in the author's own voice rather than as Veldmark's Ingrid, keeps some decisions at group level and leaves others to brands. |  |  |\n| p70 | recommendation (list) | Five decisions belong at group level by decision record: the owner of listing truth per brand, the published language, the shared kernel, relationships carrying commercial or legal promises, and the rule for anti-corruption layers. |  | `elaboration`: Group versus brand decisions. → The group's list. |\n| p71 | recommendation | Brands decide the internal models of their core contexts, the services inside each context and the decomposition of their own legacy systems, within those rules. |  | `contrast`: Group decisions. → Brand decisions. |\n| p72 | recommendation | The architecture advice forum reviews changes to the map, the shared kernel and the published language, and a change needs a decision record only when it alters what another team must do. |  | `sequence`: What each level decides. → Who reviews and when a record is needed. |\n| p73 | recommendation (list) | Five signals show the map decaying: contexts with two owners or none (with ownership of each piece of data reviewed as carefully as boundaries), writes by non-owners, consumers reading legacy tables directly, translation layers making business decisions, and contexts that cannot be separated if a business is sold. | quotation: Adevinta (2025): 'parallel running of central and local services during a transitional period' as it decentralized.; fact: The general-listings reference model's data catalog assigns credentials, sessions and the audit log to the cookie-consent capability. | `sequence`: How decisions are made. → What to monitor afterwards. |\n| p74 | transition | Two later chapters apply the map to tenancy and to team design. |  | `sequence`: Governance of the map. → Where the book uses it next. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Ten questions turn the chapter into a design review of a group's boundaries.\n\n**Advances the thesis** (S5, S3, S4): Gives the reader the method as questions they can ask of their own map.\n\n**Transition in:** `cause_effect`: The Chief Architect's decisions and signals. → Questions a reader can take into a review.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p75 | recommendation (list) | Ten review questions test the owner of listing truth, the language breaks, per-brand core subdomains, the published language, deliberate relationships, entitlements, writes, team ownership, commercial promises and separability. |  |  |\n\n## Conclusion: From One Map to Four Verticals\n\n**Synthesis:** The six answers at the forum were all right because each described a different context: the group keeps six models, lets one context decide the listing's state, joins the rest by an identifier and a published event, and records who adapts to whom. Ownership of truth and recorded relationships together are what make a change local.\n\n**So what:** A late removal such as the Essen Golf's becomes one context's freshness contract instead of a bug in six places, and a brand can change its ranking or packages without a cross-team project.\n\n**Callback:** The forum's question 'what is a listing, and who decides?' and its six answers. The reader can now answer both halves: six meanings, six models; the catalog decides state, and the map decides who adapts to whom.\n\n**Takeaway** (`course_of_action`): Name one owner for every piece of listing data and one team for every context, and record each relationship on the map as a decision.\n\n**Hand-off** to [Same Platform, Different Physics: How Listing Verticals Differ](vertical-requirements.html): `contrast`: The context map, which treats the four brands alike because most of it is shared. → The opposite question: what genuinely differs between verticals, and which contexts must never be forced into one shape.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p76 | synthesis | The forum's question now has an answer in two halves, six meanings in six models and one owner of state with every relationship recorded, and that is what turns a late removal into one context's problem and lets a brand change without a cross-team project; the working rule is one owner for every piece of listing data, one team for every context and each relationship recorded as a decision. |  |  |\n| p77 | transition | The map deliberately treats the four brands alike, so the next chapter goes beyond this chapter's short table of vertical differences and asks the opposite question: what genuinely differs between verticals and which contexts must never be forced into one shape. |  | `contrast`: A map that treats the brands alike. → What differs between verticals. |\n\n## Non-goals\n\n- The listing aggregate's internal design and lifecycle. See [The Listing Aggregate: Identity, Lifecycle and Invariants](listing-aggregate.html).\n- The event envelope, catalog, schema evolution and replay. See [Every Change Is an Event: Event-Driven Listing Architecture](event-driven-listings.html).\n- Matching and canonical entities. See [One Property, Three Listings: Duplicates and Entity Resolution](entity-resolution.html).\n- System of record versus read models, and erasure. See [System of Record and Read Models: Listing Data Management](listing-data-management.html).\n- Team topology and governance. See [Who Owns What: Organizing Marketplace Engineering](organizing-marketplace-engineering.html).\n- Tenancy. See [One Platform, Many Marketplaces: Multi-Country and Multi-Brand Architecture](multi-country-platforms.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Evans's and Vernon's books were not re-read in this session; the core/supporting/generic attribution follows standard practice and should be checked against the texts before print. (Carried over from spec.md.)\n\n## Decision log\n\n- **2026-10-19** — Organized the chapter around where the meaning of 'listing' changes rather than around a generic DDD tutorial, because the overloaded noun is what makes marketplaces a clear case.\n- **2026-10-19** — Classified subdomains per brand rather than once for the group, to show that trust is core at Tradeyard and supporting at Motorvane.\n- **2026-10-19** — Modeled Keybridge as 'separate ways' with a public feed contract, so that the March 2027 neutral
