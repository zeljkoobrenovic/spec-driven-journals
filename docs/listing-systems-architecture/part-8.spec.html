<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published page (posts/part-8-intro/index.md) and its former spec.md (accepted 2026-10-21), which it replaces; one spec paragraph per unit of the page, in the page's order. Intent outcome, AC-1 to AC-3 and role are copied unchanged from the post's entry in journal-spec.json; the introduction realises Part VIII's opening (hook, bridge, roadmap) from the same file. The journal spec gives this post no thesis, so the thesis and its three supporting claims are written here from the part's thesis and flow. The five callouts (IN THIS PART, WHY THE BUSINESS CARES, WHY ARCHITECTS SHOULD CARE, KEY POINTS, FAILURE PATTERNS) stand before the first paragraph and are kept as the house format; the KEY POINTS callout carries the part's claim in three bullets and the IN THIS PART callout names the five chapter subjects in reading order. Units added to the published page to meet the contract, in the shape the Part II to VII introductions now share: a roadmap paragraph (p03) giving the reading order and the reason for it, a lead-in to the chapter table (p04), and a closing paragraph under 'Where to begin' (p07) with synthesis, callback and hand-off, grown from the published last paragraph of the Veldmark section.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Part VIII's argument: the hard problems of a marketplace group are problems of change, not of design, so change is sequenced by risk to liquidity, every capability gets one owning team, AI proposes while the structured systems decide, and the platform is steered by fitness functions.\n- **Know:** The five chapters in reading order, the question each answers and when to read it, and the Veldmark decisions of 2027 they follow.\n- **Be able to:** Pick the Part VIII chapter that answers the leadership problem in front of them.\n\n**Audience:** Chief and group architects, CTOs, principal engineers and engineering leaders who must sequence platform change across acquired marketplaces, assign ownership and keep the result coherent over years (the journal's readers), who have read Part VII and are about to start Part VIII, or who arrive with a leadership problem in hand and want the chapter that answers it.\n\n**Already knows:**\n\n- What an API, a database, an event stream, a search engine and Kubernetes are; how to make and defend an architecture decision; what a monolith, a rewrite and a cut-over are.\n- Part VII's platform: the listing event contract, the ML platform and model registry, the tenancy model with its release rings, and journey reliability (event-driven-listings, ml-platform, multi-country-platforms, reliability-and-scale); Part IV's search platform (search-architecture); Part I's context map (bounded-contexts); Part II's taxonomy and attribute schemas; Part VI's paid bumps; liquidity as buyers finding listings and sellers getting contacts.\n- The fifteen named failure patterns, among them Deal-Shaped Architecture, The Forced Fit and Set-and-Forget AI (where-listing-systems-go-wrong).\n- Veldmark in outline: a fictional group of four brands (Tradeyard, Motorvane, Hearthly, Keybridge), Casavista as Hearthly's Spanish acquisition, the Common Ground program, Ingrid Halvorsen its Group Chief Architect, Yardstick, Tradeyard's PHP monolith, the architecture advice forum, and the people table, among them Yara Mendes (Platform Engineering) (meet-veldmark and earlier chapters).\n\n**Does not yet know:**\n\n- Integration option, consolidation sequence, synergy ledger and dis-synergies (owned by platform-consolidation; the page names the synergy ledger only as a Veldmark decision 'in place of spreadsheets', and glosses Keybridge's option 'federated under group controls' as 'sharing finance and security only').\n- Stream-aligned and platform teams, decision rights and the advice process (owned by organizing-marketplace-engineering; the KEY POINTS callout says 'platform teams earn their tenants by being worth adopting' and 'an open, recorded advice process rather than a review board that owns nothing').\n- Strangling a monolith behind seams, stage gates and relevance parity (owned by modernization-and-migration; the KEY POINTS callout says 'slice by slice behind a seam' and 'gate every step on measured outcomes with a rollback answer').\n- The AI control layer and the AI use register (owned by ai-in-listing-systems; the KEY POINTS callout says 'let AI propose while the structured systems decide').\n- Stressor analysis and marketplace fitness functions (owned by long-term-evolution; the KEY POINTS callout glosses stressors as 'new owners, laws, channels'; fitness functions are named as what the chapter builds).\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader of this page alone can name the five chapters' subjects in reading order. *Probe:* After reading only this page: what will each of the next five chapters tell you, in order? | `intro_predicts_content` | cold_reader | major |\n| AC-2 | Given situations the chapter table lists, the reader names the chapter to open. *Probe:* A fix reaches one country and not the next; external AI assistants start querying your search; and the transformation program reports milestones instead of matches. Using only this page, which chapter do you open for each? | `custom` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-4 | The reader can say which earlier designs the part's chapters build on and which later part tests its argument. *Probe:* Using only this page: which designs from earlier parts do the chapters of this part build on, and for what; and what does the following part do with this part's argument? | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** What does this part argue, and in what order should its chapters be read?\n\n> **Claim:** Part VIII argues that the hard problems of a marketplace group are problems of change, not of design: change is sequenced by risk to liquidity and each step gated on measured outcomes with a rollback answer, every journey, bounded context and shared capability gets exactly one owning team with cross-brand decisions made through a recorded advice process, AI proposes while the structured systems decide, and the platform is steered by fitness functions rather than program milestones; its five chapters are read in the order each acts on what the one before decided: consolidation chooses what to share, organization assigns owners, migration uses those owners to retire the monolith, AI builds on the changed platform, and long-term evolution tests every decision over a decade.\n\n**Disputed by:** The program view of transformation, in which the target architecture is the hard part and the rest is execution on the deal's timetable, so the leadership chapters are independent management topics a reader may consult in any order.\n\n**So what:** A reader who accepts it reads the consolidation chapter first, or opens the one chapter that answers the leadership problem in front of them, and judges any change plan by what it changes first, who owns it, how it will be known to work and what must stay true.\n\n**How and why:** Each chapter's input is the previous chapter's output: organizing-marketplace-engineering assigns owners to the capabilities consolidation chose to share, every migration slice needs an owning team from the target organization, the AI control layer uses the centrally owned gateway, the model registry and the services migration moved out of the monolith, and long-term evolution sorts all of these decisions into what lasts and what is replaced. Veldmark's 2027 problems were problems of change: by October 2027 the Casavista deal had delivered €9.6 million of €18 million in promised synergies, and Common Ground (€140 million over 2027–2030) must retire Yardstick by the end of 2029.\n\n**Supporting claims**\n\n- **PVIII-1** — The five chapters are read in the order each acts on what the one before decided, and each is the chapter to open first for a recognizable symptom.\n- **PVIII-2** — Each chapter builds on a design from an earlier part, and Part IX tests the part's argument against publicly documented marketplace groups.\n- **PVIII-3** — Veldmark's 2027 decisions, shaped by Ingrid Halvorsen and taken by the CTO, the board and the advice forum, move Common Ground from plan to practice, and each is the material of one or two chapters.\n\n## Role in the part\n\nPerforms the part's opening: states that the hard problems of a group are problems of change, gives the reading order of the five chapters, and frames them with Veldmark's 2027 decisions.\n\n## Flow\n\n**Pattern:** `large_to_small` (also `prerequisite_order` in p03 and the chapter table in p04: the five chapters in the order each acts on what the one before decided)\n\nThe page opens on the step after Part VII (a designed platform that a group assembled by acquisition has only on paper), states the part's claim (change, not design, is the hard problem), then gives the reading order with the reason for it and narrows to one row per chapter with the symptom that sends a reader there. It widens once to say which earlier designs the chapters build on and where Part IX takes the argument, shows Veldmark's 2027 decisions, and ends with a short synthesis, the part's test and the hand-off to the first chapter. The order is given before the table because the rows read as a sequence only once the reader knows each chapter acts on what the one before decided; the connection section follows the table because it names what each listed chapter builds on; the Veldmark section follows because its decisions are what the chapters design; the conclusion comes last and holds no new material. Put Veldmark first and its decisions arrive before the reader knows which chapter treats each; put the connection first and it names consolidation, migration and owning teams before the reader has met the chapters that treat them.\n\n## Introduction\n\n**Hook** (`direct_statement`): Part VII built the distributed system underneath the marketplaces; Part VIII turns to the work that decides whether that system ever exists outside a diagram.\n\n**Bridge:** Part VII's platform, designed but, in a group assembled by acquisition, real only on paper. → The hard problems of change: in what order the decisions are carried out, who owns them, how a live business moves onto them and how a group knows years later that they still serve their purpose, while the group's platforms come in several copies, its teams follow old org charts, its monolith still bills sellers for bumps and its future owners and regulators are unknown.\n\n**Thesis statement** (KEY POINTS callout (in three bullets); paragraph p02 (bold phrase)): The hard problems of a marketplace group are problems of change, not of design.\n\n**Roadmap** (IN THIS PART callout; paragraph p03; the section headings):\n\n- Five chapters in the order each acts on the one before: consolidation chooses what to share, organization assigns owners, migration uses them to retire the monolith, AI builds on the result, and long-term evolution tests it all over a decade; a table says when to open each. *Kept in:* chapters.\n- After the table, the earlier designs the chapters build on and Veldmark's 2027 decisions (p03's closing sentence: 'A table of the chapters follows, then the earlier designs they build on and Veldmark's decisions.'). *Kept in:* connects, veldmark.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Part VII built the distributed system underneath the marketplaces, and Part VIII turns to the Chief Architect's agenda, the work that decides whether that system ever exists outside a diagram: in what order the earlier decisions are carried out, who owns them, how a live business moves onto them and how a group knows years later that they still serve their purpose. |  |  |\n| p02 | claim | The part's claim is that the hard problems of a marketplace group are problems of change, not of design: a group assembled by acquisition has platforms in several copies, teams that follow old org charts, a monolith that still bills sellers for bumps and unknown future owners and regulators, and the architect changes all of this while buyers keep finding things and sellers keep getting contacts. | figure: Figure 1: a market street that stays open while crews replace its foundation section by section, moving from duplicated old machines and a monolith to one shared platform. | `problem_solution`: The questions of order, ownership, migration and lasting purpose that decide whether the platform exists outside a diagram. → The part's answer: these are problems of change, not of design, and why a group assembled by acquisition has them. |\n| p03 | transition | The five chapters are read in the order each acts on the one before: consolidation chooses what to share, organization assigns owners, migration uses them to retire the monolith, AI builds on the result, and long-term evolution tests it all over a decade; a table of the chapters follows, then the earlier designs they build on and Veldmark's decisions. |  | `elaboration`: The changes the part's claim names (several copies, old org charts, the monolith, unknown future owners). → The order in which the chapters treat them, and why. |\n\n## Sections\n\n### Chapters in this part\n\n**Controlling idea** (`description`, id `chapters`): Each of the five chapters answers one question and is the one to open first for a recognizable symptom.\n\n**Advances the thesis** (PVIII-1): Lists the chapters in reading order with the question each answers and the symptom that sends a reader to it.\n\n**Transition in:** `elaboration`: The five chapters in reading order. → One row per chapter: its question and when to open it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p04 | description | Each row of the table, in reading order, gives a chapter's question and when to open it. | table: Five rows in reading order: platform-consolidation (the board asks where the synergies are, or a rebrand is planned alongside a replatform), organizing-marketplace-engineering (a fix reaches one country and not the next, or a shared platform has no team that owns it), modernization-and-migration (the monolith deploys twice a week, or a rewrite is being proposed), ai-in-listing-systems (several AI proposals arrive at once, or external assistants start querying your search), long-term-evolution (an investor asks what a sale would cost, or the program reports milestones instead of buyer–seller matches). |  |\n\n### How this part connects\n\n**Controlling idea** (`context`, id `connects`): Each chapter builds on a design from an earlier part, and Part IX tests the part's argument against public cases.\n\n**Advances the thesis** (PVIII-2): Says, chapter by chapter, which earlier design each builds on, and what Part IX does with the argument.\n\n**Transition in:** `place`: The five chapters of the part. → Where the part sits in the book: the earlier designs it builds on and the part that tests it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | context | Each chapter builds on a design from an earlier part, in the order of the chapters: the tenancy model and release rings make consolidation possible, the context map becomes the list of owning teams, the listing event contract and the search platform are the seams a m <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
