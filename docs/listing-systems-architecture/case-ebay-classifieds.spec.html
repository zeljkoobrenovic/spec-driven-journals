<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, the four acceptance criteria, the thesis and the role are copied unchanged from the case-ebay-classifieds entry in journal-spec.json. Added: one opening clause carrying over from case-olx (p01), a roadmap paragraph (p04) and a conclusion under its own heading (p62 new; p63 is the published closing paragraph moved there).\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** eCG's portfolio built two ways from 2004 (bought national leaders such as Marktplaats, mobile.de, Gumtree, dba.dk and 2dehands, and greenfield launches, several later closed or sold) and sold to Adevinta for about US$9.2 billion (agreed July 2020, completed June 2021).\n- **Know:** The shared layers by interface type: a search-engine choice made together and migrated brand by brand after eBay's Voyager was abandoned, a group PaaS, the MoVe motors supply platform with a published Listing API, sandbox and typed webhooks, one external payment institution, and a regional Benelux platform; and inside one brand, Kleinanzeigen's event backbone and per-user migration out of its monolith.\n- **Know:** What the sale exposed: transitional services for Gumtree UK written into the UK regulator's 2021 remedy, support for the Australian businesses 'during the transition', and years of domain, design-system and platform work to remove the eBay name.\n- **Believe:** The type of interface behind a shared capability predicts what it costs to separate.\n- **Believe:** A group should share the professional supply side of verticals before consumer products.\n- **Be able to:** Keep a dependency register per brand listing everything it uses but does not own, with an owner and a replacement path.\n- **Be able to:** Classify a group's shared capabilities by interface type and say which would need transitional services in a sale.\n\n**Audience:** Chief and enterprise architects of marketplace groups, platform and search leads, and engineering directors who integrate acquired marketplaces or prepare one for sale.\n\n**Already knows:**\n\n- What an API, a database, an event stream, a search engine and Kubernetes are.\n- How to make and defend an architecture decision.\n- Part IX's evidence rules, from part-9, and Adevinta's record, from case-adevinta.\n- Global components, tenancy and consolidation sequencing, from multi-country-platforms and platform-consolidation; Veldmark and its Common Ground program, from meet-veldmark.\n\n**Does not yet know:**\n\n- eCG's brands, history and sale.\n- eCG-specific names: Voyager, PanteraS, MoVe, Online Payment Platform, Gelijk Oversteken.\n- Transitional services agreements (TSAs) and undertakings in lieu.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a list of a brand's shared dependencies, the reader uses eCG's record to say which would separate cleanly in a sale, which would need transitional services, and what to keep before any sale is in sight. *Probe:* A group may sell one country's marketplace in two years. That marketplace uses a search engine chosen jointly with its sister brands, a payment provider contracted by the group, a dealer-listing API the group publishes, and an internal fraud service owned by the parent with no written interface. Using only this chapter: which of these does eCG's record suggest would separate cleanly, which would not, and what should the group keep now? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's questions, its evidence and where it ends. *Probe:* After reading only the callouts and the paragraphs before the first heading: what questions will this chapter ask, what kind of evidence will it use, and how will it end? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-4 | Every statement about eBay Classifieds Group's internal systems that no cited source documents sits in a callout or figure caption labeled as inference, and every company fact outside those labels carries its source and publication year. *Probe:* Is there any sentence outside an `INFERENCE, NOT DOCUMENTED` callout or a labeled figure caption that describes how eBay Classifieds Group builds or runs a system without a dated source, or a company fact with no source and year? | `custom` | rubric | major |\n\n## Thesis\n\n**Question:** How thin a shared layer did eBay Classifieds Group run beneath its national brands, through which kinds of interface, and what did the 2020–2021 sale expose about that coupling?\n\n> **Claim:** eCG left each national leader owning its own platform and product and coordinated them through a thin, selective shared layer (a search-engine choice made together but migrated brand by brand, a group PaaS, a motors supply platform with published partner contracts, one external payment institution), and its sale showed that the type of interface predicted the cost of separation: no remedy in the public record touches the agreements, the external provider or the published contracts, while dependence on the parent had to be written into a competition remedy as transitional services for Gumtree UK, and removing the eBay name from the brands Adevinta kept took years of domain, design-system and platform work.\n\n**Disputed by:** The view that what a divestment costs is set by the deal structure and the regulators, not by the kind of interface between a parent and its brands; and with it, the view that a federation which never consolidated its consumer products wasted its scale and should have integrated its brands onto one product platform.\n\n**So what:** A Chief Architect requires a written interface for every shared capability even when no third party is in sight; keeps a dependency register per brand with an owner and a replacement path for every system, data flow and contract it uses but does not own; shares the professional supply side of verticals, such as dealer stock entered once and shown in several marketplaces, before consumer products; makes group decisions on shared choices and funds local teams to migrate; and treats a parent's technology as a supplier with an end date.\n\n**How and why:** eBay entered classifieds in 2004 by buying national leaders and agreed in July 2020 to sell the whole group to Adevinta for about US$9.2 billion; the sale completed in June 2021. When eBay stopped investing in Voyager, the search engine it had given its subsidiaries, eCG companies chose a replacement together and each migrated alone (Marktplaats in three months with two or three developers). MoVe dispatched dealer listings to Kijiji.ca and kijijiautos.ca through a published API and webhooks; Kleinanzeigen rebuilt 34 million documents from a compacted event topic in under 30 minutes in 2019 and in 2025 migrated users one at a time out of its monolith. The UK regulator's 2021 decision required eBay to offer transitional services to Gumtree UK's buyer, Adevinta promised to support the Australian businesses 'during the transition', and several brands were sold again within 18 months. The group published almost nothing about itself, and that silence is evidence of how federated it was.\n\n**Supporting claims**\n\n- **E1** — eCG's durable value sat in national leaders that eBay bought and left running on their own platforms; most greenfield launches under group brands were closed, renamed or sold, so the group had little reason to replace the platforms that won their markets.\n- **E2** — The shared layer was thin and selective, and each documented layer sat behind a different kind of interface: a search-engine choice made by agreement and migrated brand by brand, group-built PaaS tooling, the MoVe motors supply platform behind published contracts, the parent's inventory programs, one external payment institution and one regional Benelux platform.\n- **E3** — The deepest engineering in the record happened inside brands on their own paths: Kleinanzeigen's event backbone made its search index rebuildable, its 2025 whole-platform migration moved users one at a time, and mobile.de put dealers' exposure guarantees into ranking.\n- **E4** — The sale turned shared dependencies into contract terms, and the interface type predicted the cost: eBay offered transitional services for Gumtree UK in the UK regulator's remedy, Adevinta promised the Australian businesses support during the transition, and the brands Adevinta kept spent years removing the eBay name from domains, apps and platforms.\n- **E5** — eCG published almost nothing as a group, so its architecture is assembled from dated brand blogs, repositories, talks, job postings and a regulator's decision; every fact is dated, every inference labeled and the questions the record cannot answer are listed, not filled.\n- **E6** — The record yields decision rules a Chief Architect can apply before any sale: prefer interfaces that can be handed over, keep a dependency register per brand, share the professional supply side of verticals first, coordinate choices and fund local migrations, and treat a parent's technology as a supplier with an end date; tested against the book's patterns and Veldmark, they hold.\n\n## Role in the part\n\nTests how thin a shared layer can be and shows a sale converting shared dependencies into contract terms, with the interface type predicting the cost. Supports P9-2, P9-1, P9-4 of part `part-9`.\n\n## Flow\n\n**Pattern:** `chronological` (also `grouping` in trade-offs to evidence-stops: cross-phase views (by option, by vertical, by failure, by gap); `problem_solution` in chief-architect to questions: rules from the record, their test against the book and Veldmark, and questions for the reader's group)\n\nReading rules and the timeline come first because every later sentence is a dated fact, a reading or an inference. The phases run in time order, because the sale can only expose dependencies the reader has already seen being built: the portfolio (Phase 1), the shared layers by interface type with Kleinanzeigen's own 2009–2019 backbone beside them (Phase 2), the sale (Phase 3) and its aftermath. The Berlin brands' 2024–2025 work follows the aftermath, whose last piece of evidence, the 2025 migration, hands over to it, so time never runs backwards. The cross-phase views come next because each uses facts from every phase; inside that group they run from what the record shows to what it cannot: the options set side by side by interface type (the central finding), then the same options by vertical, then what went wrong, then the gaps, which close the group so the rules that follow do not outrun them. The author's rules, the comparison and the questions come last because they apply what the record has shown.\n\n## Introduction\n\n**Hook** (`intriguing_example`): eBay entered classifieds in 2004 by buying national leaders and over sixteen years built one of the largest classifieds portfolios in the world, from Marktplaats and mobile.de to Gumtree, Kijiji and Vivanuncios; in July 2020 it agreed to sell the whole group to Adevinta, and the sale completed in June 2021.\n\n**Bridge:** A Chief Architect of a marketplace group deciding what to share across brands that the owner may one day keep, merge or sell. → eCG ran national brands with a thin shared layer and was then sold whole, so its record can be asked what was shared, through what kind of interface, and what the sale exposed about each.\n\n**Thesis statement** (KEY POINTS callout (all three bullets) and paragraph p02.): eCG left each national leader on its own platform and shared a thin, selective layer through different kinds of interface; the sale showed that the interface type predicted the cost of separation.\n\n**Roadmap** (Paragraph p04, after the questions in p03.):\n\n- Set the reading rules and give a dated timeline. *Kept in:* how-to-read, timeline.\n- Follow three phases: building the portfolio, the federation's shared layers with one brand's own platform beside them, and the sale with its aftermath, followed by what the two Berlin brands published afterwards. *Kept in:* phase-1, phase-2, phase-3, aftermath, berlin-platforms.\n- Look across the phases: trade-offs, verticals, failure modes and where the evidence stops. *Kept in:* trade-offs, verticals, failure-modes, evidence-stops.\n- End with the author's decision rules, a test against the book's patterns and Veldmark, and questions to ask. *Kept in:* chief-architect, comparison, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Where OLX reached for breadth and then concentrated, eBay entered classifieds in 2004 by buying national leaders, built one of the world's largest classifieds portfolios over sixteen years, agreed in July 2020 to sell it whole to Adevinta and completed the sale in June 2021. | fact: eBay's portfolio: Marktplaats, mobile.de and eBay Kleinanzeigen, Gumtree in three countries, Kijiji, dba.dk and Bilbasen, 2dehands and 2ememain, Vivanuncios and car sites; sale agreed July 2020, completed June 2021. |  |\n| p02 | claim | eCG, the mirror image of Adevinta, published almost nothing as a group, and its scattered public record, with that silence as evidence, shows a federation of strong national businesses with a thin, selective shared layer whose dependencies the sale wrote into contracts. | source: Brand blogs in Amsterdam and Berlin, a GitHub organization, conference talks, archived job postings and a regulator's decision. | `contrast`: eCG sold whole to Adevinta in 2021. → Adevinta published much about its central platforms; eCG published almost nothing as a group. |\n| p03 | context | Among Part IX's cases, eCG tests how thin a shared layer can be and what a sale exposes, the stressor (a parent selling its group) that multi-country-platforms and platform-consolidation leave open, by asking what was shared, at which layer and through what interface, what stayed local and what the sale revealed; it leaves Adevinta's strategy after 2021 to case-adevinta. |  | `elaboration`: A federation with a thin shared layer, tested by a sale. → The questions the chapter asks, its scope and the Veldmark test it feeds. |\n| p04 | transition | The chapter sets reading rules and a timeline, follows three phases (building the portfolio, the federation's shared layers with one brand's own platform beside them, the sale and its aftermath), then what the two Berlin brands published afterwards, looks across all of it at trade-offs, verticals, failure modes and where the evidence stops, and ends with the author's rules, a test against the book's patterns and Veldmark, and questions to ask. |  | `sequence`: The chapter's questions. → The route through the chapter that answers them. |\n\n## Sections\n\n### How to Read This Case\n\n**Controlling idea** (`definition`, id `how-to-read`): The case keeps documented fact, the author's reading and labeled inference apart, and three limits of eCG's record shape what it can say.\n\n**Advances the thesis** (E5): Sets the evidence rules and the record's limits before any fact is used.\n\n**Transition in:** `elaboration`: The introduction's promise of reading rules and a scattered record. → The rules for reading that record.\n\n**Order of paragraphs** (`large_to_small`): From the rules every Part IX case follows, to this case's three limits, to the one fictional element and where it appears. The rules come first because the limits are stated in their terms.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | definition | Part IX cases separate three kinds of statement: a documented fact carries its source and publication year, the author's interpretation is marked 'my reading' or sits in the Chief Architect's view, and an inference appears only in a callout labeled INFERENCE, NOT DOCUMENTED. |  |  |\n| p06 | explanation (list) | Three limits shape this case: no group engineering voice, evidence old enough to describe replaced systems, and internal platform names that no public source confirms and the chapter does not print. | fact: No eCG group blog found; most group-era sources date from 2009–2020; names circulating for internal platforms unconfirmed. | `sequence`: The three kinds of statement. → The three limits of this particular record. |\n| p07 | context | Veldmark, the book's fictional group, appears only in the final comparison and is a composite of industry patterns, not a disguised eCG. |  | `contrast`: eCG's real, dated record and its limits. → The fictional group and where it enters. |\n\n### Timeline: eBay Classifieds in Dated Events\n\n**Controlling idea** (`evidence`, id `timeline`): eCG's history from the first acquisitions in 2004 to the 2025 platform migration can be laid out as dated, sourced events.\n\n**Advances the thesis** (E5, E1): Gives every later section a dated, sourced reference and shows the two growth routes and the sale.\n\n**Transition in:** `sequence`: The rule that every fact carries its source and year. → The dated events themselves.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | evidence | The timeline's sources set what can be compared: dates are those of the cited documents, ownership facts are as of October 2026, and the group's self-reported scale figures use different definitions and are not compared across brands. | table: Timeline table, 2004 to June 2025: acquisitions, launches, the Voyager replacement, the MoVe repositories, the July 2020 agreement (about US$9.2 billion), the CMA decision of 2 March 2021, completion on 25 June 2021, the 2021–2022 divestments, the May 2023 rebrand and the 2025 migration, each with its source type.; figure: Figure 1: eCG grew by buying leaders and launching group brands, both ending as a federation with a thin shared layer that the sale split. |  |\n\n### Phase 1: Building a Portfolio Two Ways (2004–2015)\n\n**Controlling idea** (`evidence`, id `phase-1`): eBay built the portfolio by buying national leaders and by launching group brands, and the bought leaders, which kept their own platforms, are where the value lasted.\n\n**Advances the thesis** (E1): Shows where the durable value sat and why the group had little reason to replace the leaders' platforms.\n\n**Transition in:** `elaboration`: The timeline's acquisitions and launches. → The two routes they represent and their different outcomes.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The claim of two routes with different outcomes comes first, then each route with its evidence and the table's sources, then the author's reading of why. The reading needs both routes in view before it can explain the difference, so it closes the section.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | claim | eBay assembled the portfolio by two routes, and their outcomes differ sharply. |  |  |\n| p10 | evidence | The first route was buying the national leader and keeping its brand, management and, as far as the record shows, its own platform. | quotation: eBay's November 2004 filing: Marktplaats would be run 'as a separate business'; mobile.de, Gumtree, dba.dk with Bilbasen, 2dehands/2ememain and Vivanuncios followed. | `sequence`: Two routes. → The first: buy the leader and keep its brand. |\n| p11 | evidence | The second route was launching new sites under a group brand where there was no leader to buy, and most of those launches were closed, renamed or sold. | fact: Kijiji from 2005 in Canada, Italy and Taiwan (reported by Wikipedia, unverified, as incubated under Marktplaats BV), later US, China and India; eBay Kleinanzeigen absorbed Kijiji's German listings in 2009; iBazar in Mexico in 2013.; table: Routes table: bought leaders still trading under their own names at their last documented sale or report; greenfield brands renamed, spun off, closed or retired, with Kijiji Canada and Kleinanzeigen the exceptions. | `sequence`: The first route. → The second: launch a group brand. |\n| p12 | evidence | The routes table rests on eBay releases from 2004, 2008 and 2015, archived eCG brand pages and, for Kijiji's non-Canadian history, Wikipedia. | source: eBay Inc. releases 2004, 2008 and 2015; eCG brand pages 2009–2020 (archived); Wikipedia. | `elaboration`: The routes table. → Its sources. |\n| p13 | analysis | In the author's reading the two routes differ by liquidity: a bought leader brought local supply and demand already in balance and a platform good enough to win its market, so the group had little reason to replace it and every reason not to risk its liquidity; of the two greenfield successes, one had a clear head start and the record does not explain the other. | figure: Figure 2: a transplanted mature tree beside wilting seedlings. | `cause_effect`: The two routes' outcomes in the table. → Liquidity as the explanation, and its architectural consequence. |\n\n### Phase 2: A Federation with Group Functions (2009–2020)\n\n**Controlling idea** (`evidence`, id `phase-2`): Beside brand-run platforms eCG had group functions and shared five documented layers, each behind a different kind of interface, plus one regional platform, while the best-documented platform, Kleinanzeigen's, grew on its own engineering path.\n\n**Advances the thesis** (E2, E3): Documents what was shared, layer by layer, and the interface type of each, and beside it what one brand built on its own.\n\n**Transition in:** `contrast`: Brands that grew on their own platforms. → The group functions that existed beside them, seen only from outside.\n\n**Order of paragraphs** (`grouping`): First the organization as seen from outside (who decided), then the shared layers one by one from the most local interface (a choice made by agreement) to the most external (a payment provider), then the regional exception with the layer map that sums them up, and last the local side: what one brand, Kleinanzeigen, built on its own between 2009 and 2019. The map comes after every layer because it summarizes them; Kleinanzeigen's backbone follows the map because it is the local counterpart of the shared layers and belongs to the same years, so the chapter does not have to jump back to 2009 after the sale. The interface type of each layer must be clear before the sale tests it in Phase 3.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p15 | evidence (list) | Four kinds of indirect source show group functions beside brand-run platforms, because eCG never described its operating model in public. | quotation: Job postings 2009–2011 ('Kijiji Platform', 'sister Classifieds platform', reuse 'by other Classifieds platforms', 'eBay Classifieds Global' as hiring entity); the Berlin Tech Blog shared by Kleinanzeigen and mobile.de; Rick Rackow's HashiConf 2018 talk on the 'Global Motors vertical'; Marktplaats's 2017 Journey Teams and a 2018 Berlin post on team-level decisions. |  |\n| p16 | analysis | In the author's reading eCG ran several platforms with reuse encouraged and not mandated, and the strongest brands made their own architecture and organization decisions. |  | `elaboration`: The four kinds of indirect source. → What they add up to. |\n| p17 | claim | Five group-wide shared layers are documented, plus a sixth regional one, each behind a different kind of interface, and the interface type is the most useful thing the case teaches. |  | `elaboration`: Group functions existed beside autonomous brands. → What those functions actually shared, and the interface of each. |\n| p18 | evidence | Search was a coordinated choice migrated brand by brand: after eBay abandoned its Voyager engine, eCG companies chose Elasticsearch together, and Marktplaats migrated itself. | quotation: Frank Laan (Marktplaats, December 2015): Voyager 'developed internally by eBay in the USA', 'Ebay itself has moved on', 'almost become a black box'; 'other eBay Classifieds Group (eCG) companies facing similar problems' evaluated together; Elastic{ON} 2015.; table: Marktplaats's migration: same interfaces, Voyager behavior first, hundreds of reused tests, replay of recorded queries, 1% to 100% rollout, two or three developers in about three months with zero downtime. | `sequence`: Five shared layers. → The first: search. |\n| p19 | analysis | Replaying recorded queries against frozen copies made every difference explainable, which shadowing live traffic cannot. |  | `elaboration`: The comparison step of Marktplaats's migration. → Why that method works. |\n| p20 | evidence | Infrastructure was shared as group-built tooling: the PanteraS platform-as-a-service and, for the Global Motors vertical, a HashiCorp stack on an OpenStack private cloud. | fact: PanteraS (November 2014, 'Platform as a Service in a box': Mesos, Marathon, Consul, Fabio) and related tooling on GitHub; Rackow 2018: Terraform on OpenStack, a tenant per developer, stateless apps on PanteraS, databases and Kafka on Nomad 'after having poor results with stateful applications on PanteraS'. | `sequence`: Search, the first layer. → The second: infrastructure. |\n| p21 | analysis | In the author's reading PanteraS was a familiar first-generation group platform, good for stateless services, weaker for stateful ones and built on a private cloud the brands later left. | fact: By 2026 mobile.de ran ML serving on Kubernetes on AWS and Kleinanzeigen's home feed on Vespa Cloud on AWS; PanteraS's last push was in 2021. | `elaboration`: The PaaS and its trouble with stateful workloads. → What kind of platform it was and what happened to it. |\n| p22 | evidence | MoVe, the eCG Motors Vertical platform, is documented from outside by two 2020 repositories as a supply platform behind published contracts that dispatched dealer listings to several marketplaces in a tenant. | quotation: Listing API at api.ecgmove.com (no longer resolves), sandbox credentials, partnerId, whitelisted IPs; events for listings, dealers, promotions, enriched listings and listing-url; a synchronous reply with the receiver's listing ID and a VIP URL per language; 'In the Canadian tenant, this can include Kijiji.ca, kijijiautos.ca and others.'; figure: Figure 3: the documented shape of MoVe.; reasoning: INFERENCE, NOT DOCUMENTED callout: MoVe reads as a shared supply hub per country tenant; other tenants and mobile.de's use are not public. | `sequence`: Infrastructure, the second layer. → The third: a motors-vertical platform. |\n| p23 | analysis | MoVe is the one shared product platform in the record, and it sits where sharing pays most clearly: structured dealer supply behind a contract, not a shared database. |  | `elaboration`: MoVe's documented contracts. → Why that vertical and that interface suit sharing. |\n| p24 | evidence | The parent's marketplace was a supply source: eBay inventory and motors seller tools were placed on eCG sites, and in the author's reading this was the most parent-dependent layer and the first a sale would expose. | quotation: Alessandro Coppo, December 2016: eBay inventory on Gumtree Australia, Gumtree UK and eBay Kleinanzeigen; Cargigi motors tools 'being used by Kijiji in Canada and Gumtree in South Africa'; 'integrating and cooperating at our technology infrastructure level'. | `sequence`: The motors platform, the third layer. → The fourth: the parent's own marketplace. |\n| p25 | evidence | Payment holding was bought from one external payment institution for two brands, not built, and both flows have since changed. | fact: Marktplaats person-to-person payments through Online Betaalplatform (June 2017) and Gelijk Oversteken (November 2017, 2% plus €0.40, seven-day release); eBay Kleinanzeigen 'Sicher bezahlen' (October 2020, 14 days, 'Online Payment Plattform'); t3n names Online Payment Platform as provider in July 2023; Worldline's 2022 release names both brands as clients; Marktplaats withdrew Gelijk Oversteken in April 2022; Kleinanzeigen's help page (read October 2026) names Adyen. | `sequence`: The parent's marketplace, the fourth layer. → The fifth: payments. |\n| p26 | evidence | The sixth, regional layer is a Benelux multi-tenant platform for Marktplaats, 2dehands and 2ememain, known only from an undated job posting, and the layer map gives each layer's interface and evidence, with the two layers that stayed local. | quotation: Adevinta job posting: Marktplaats, 2dehands and 2ememain 'are hosted on a multi-tenant platform, operated from our Amsterdam location'.; table: Layer map: each layer, whether shared, its interface and its evidence and date.; reasoning: INFERENCE, NOT DOCUMENTED callout: the evidence is consistent with a shared generalist platform for smaller horizontals; no source confirms it. | `additional_support`: Five group-wide layers. → One regional layer and the map of all six. |\n| p27 | claim | The shared layers sat beside platforms the brands built for themselves, and the best-documented eCG platform belongs to a brand, showing what a national platform did on its own engineering path in the same years. |  | `contrast`: The shared layers and the layer map. → The platforms the brands built for themselves, and the best-documented one. |\n| p14 | evidence | Kleinanzeigen absorbed a hundredfold growth in daily inserts on its own engineering path, not through a group platform. | statistic: eBay Kleinanzeigen built in 2009 'to process 10K new ads per day', launched with about 700,000 live ads; by 2019 more than 34 million live ads and up to a million new ads a day. | `example`: A national platform on its own engineering path. → The scale it absorbed between 2009 and 2019. |\n| p28 | evidence | Kleinanzeigen's event backbone began with one job its database could not do, real-time saved-search alerts, and earned trust by solving it. | quotation: Andre Charton, October 2019: 2009 'plain old database backend' with Solr and a Java monolith; Kafka introduced in 2015 'to break out from the monolith'; saved searches with push notifications not possible 'in real time with MySQL'; 45 million saved searches and up to a million new ads a day by 2019; 'we won big trust'. | `cause_effect`: Growth from 10,000 to a million new ads a day. → The event backbone that began with one job the database could not do. |\n| p29 | evidence | Two later uses followed from that trust: Kafka became storage from which the search index could be rebuilt, and a stream feeding the home feed. | quotation: 'We are able to fully index 34 million documents in our search cluster in less than 30 minutes' from a compacted topic; a personalized home feed 'consumed like a stream'. | `cause_effect`: The trust won with alerts. → The two uses that followed. |\n| p30 | analysis | In the author's reading this is the case's most transferable engineering lesson and owes nothing to the group: an index rebuildable from a durable log cannot quietly become the system of record. |  | `elaboration`: Alerts, then storage, then a stream. → Why the sequence matters and which failure pattern it prevents. |\n\n### Phase 3: The Sale (2020–2021)\n\n**Controlling idea** (`evidence`, id `phase-3`): The sale's public terms say almost nothing about technology, but the UK regulator's remedy records eBay offering transitional services for Gumtree UK, and the divested brands, not the self-sufficient ones, needed help to separate.\n\n**Advances the thesis** (E4): Shows the sale converting a shared dependency into a contract term.\n\n**Transition in:** `time`: The federation and its shared layers up to 2020. → The July 2020 agreement to sell eCG to Adevinta.\n\n**Order of paragraphs** (`chronological`): From the July 2020 terms and their silence on technology, to what the regulator wrote in 2021, to the divestments of 2021–2022, to the author's reading of which brands needed help. The reading needs the regulator's sentence and the divestments in view first.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p36 | evidence | eBay's July 2020 release valued eCG at about US$9.2 billion and estimated synergies that Adevinta restated as €130–165 million of run-rate cost synergies at completion in June 2021. | statistic: About US$9.2 billion: US$2.5 billion in cash plus about 540 million Adevinta shares (about 44% of equity, 33.3% of votes); Schibsted to buy the Danish business; US$150–185 million a year of synergies within three years; €130–165 million guided on 25 June 2021. |  |\n| p37 | evidence | On technology the release says only that the two companies 'will continue to partner in key areas post-closing to ensure a seamless transition', and nothing public describes which eBay systems eCG depended on. | quotation: eCG innovates 'across its product portfolio and advertising technology platform'; 'will continue to partner in key areas post-closing to ensure a seamless transition'. | `contrast`: The deal's detailed financial terms. → Its near-silence on technology. |\n| p38 | evidence | The UK competition regulator's remedy required the sale of Gumtree UK with its platforms and recorded that eBay offered transitional services for it. | quotation: CMA: Gumtree and Shpock competed closely; Gumtree 'has significant potential to compete with eBay Marketplace in the UK'; undertakings in lieu accepted 2 June 2021; Gumtree UK sold with its 'platforms, related tangible and intangible assets, employees, leaseholds, contracts and goodwill'; 'Adevinta and eBay have offered to provide transitional services in relation to Shpock and Gumtree UK respectively as part of the Proposed Undertakings.' | `contrast`: The release's silence on technology. → What the regulator did write down. |\n| p39 | analysis | The offer came from eBay, the seller, and in the author's reading it means a business sold with 'its platforms' still needed something from eBay that was not in the package because it was shared. | reasoning: A transitional services agreement (TSA) is a contract under which the seller keeps running some systems or functions for the divested business for a limited period; the CMA text does not say what the services covered. | `elaboration`: The CMA's sentence on transitional services. → Who offered them and what that implies. |\n| p40 | evidence | Gumtree UK, Shpock and then the Australian, South African and Mexican businesses were sold within about fifteen months, with Adevinta promising the Australian business support during the transition. | fact: Shpock to Russmedia Equity Partners on the day the undertakings were accepted; Gumtree UK and Motors.co.uk (about 7% of eCG's 2020 revenue) to O3 Industries and Novum Capital on 1 December 2021; Australian businesses to The Market Herald for US$60 million in August 2022 ('will continue to support the Australian business and its employees during the transition'); Mexico to Navent in September 2022; Gumtree South Africa to Impresa Capital in July 2022.; figure: Figure 4: a plausible reference view of a carve-out, labeled as not describing any specific separation. | `time`: The remedy accepted on 2 June 2021. → The sales that followed, 2021–2022. |\n| p41 | analysis | In the author's reading separation cost appeared where sharing had been: Gumtree UK and the Australian businesses needed transitional help, while the self-sufficient platforms in Amsterdam and Berlin became the combined group's core. |  | `conclusion_summary`: The remedy and the divestments. → The one pattern the record supports. |\n\n### Aftermath: Removing a Parent from a Platform\n\n**Controlling idea** (`evidence`, id `aftermath`): The brands Adevinta kept had to stop being eBay, which took years of domain, app and platform work beneath the logo.\n\n**Advances the thesis** (E4): Shows the separation cost on the kept brands, not only on the sold ones.\n\n**Transition in:** `contrast`: Sold brands that needed transitional services. → The brands Adevinta kept, which had to stop being eBay.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The three pieces of evidence first, then one brand outside the core, then the reading of what they add up to. The reading generalizes from the evidence; placed first it would be an unsupported claim about separation budgets.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p42 | evidence (list) | Three pieces of evidence show what stopping being eBay took: the name and domain, the apps and the platform. | quotation: 16 May 2023 rebrand with the old domain kept 'several more years'; €15 million rebrand cost and no use of the brand beyond 2024 (Adevinta 2023 annual report, via case-adevinta); mobile.de's Android rebrand 'took only two weeks to implement once the base refactoring was done', removing 'technical debt from 8 years ago' (2025); Kleinanzeigen's 2025 migration, not documented as a consequence of the sale. |  |\n| p43 | evidence | Away from the core, Adevinta impaired Kijiji Canada by €147 million in its 2023 results, citing competition and a new 2023 mobile app; Kijiji is still listed among Adevinta's brands. | statistic: €147 million impairment citing competition and a new 2023 mobile app; still listed as of October 2026. | `contrast`: The core brands' rebrand work. → A kept brand away from the core. |\n| p44 | analysis | In the author's reading, which goes beyond the three examples, separating from a parent takes work at several layers below the logo (domains, identity and design systems), and the logo, the cheapest part, is the one most often budgeted. |  | `elaboration`: The name, app and platform evidence from the kept brands. → A general list of the layers a separation budget must cover, which goes beyond those examples. |\n\n### Inside the Berlin Platforms: Kleinanzeigen and mobile.de, 2024–2025\n\n**Controlling idea** (`example`, id `berlin-platforms`): After the sale the two Berlin brands kept engineering on their own paths: Kleinanzeigen migrated its whole platform user by user in 2025, and mobile.de put dealer commitments into ranking in 2024.\n\n**Advances the thesis** (E3): Shows the local side of the federation after 2021: what national platforms did without the group.\n\n**Transition in:** `elaboration`: The Aftermath's third piece of evidence: Kleinanzeigen's 2025 whole-platform migration, which the Aftermath says the next section describes. → The migration in detail, from Kleinanzeigen's own engineers, and the other Berlin brand.\n\n**Order of paragraphs** (`grouping`): Kleinanzeigen's 2025 migration comes first because the Aftermath's third piece of evidence hands it over; its six design choices and the author's reading of its ownership follow. mobile.de, the other Berlin brand, comes last as a second, narrower example of a brand on its own path, about models rather than platform.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p31 | evidence | Kleinanzeigen's own engineers documented the whole-platform migration the Aftermath named: in 2025 it ran both systems and switched users one at a time, and the post gives no basis for linking the new system to Adevinta's convergence plan. | quotation: MD Sayem Ahmed, June 2025: 'KA recently migrated the whole platform to a new system'; ran it 'parallel to our legacy system', 'incrementally switched users' with the option to 'revert the users to the old system'; neither platform named. | `elaboration`: The Aftermath's third piece of evidence, the 2025 whole-platform migration. → The migration as its engineers described it. |\n| p32 | evidence (list) | The post documents six design choices that made the migration reversible per user. | fact: Order by data dependency; route by user through a reverse proxy; no dual writes, up to a minute of sync delay; Debezium change data capture with row-format replicas; back-sync for rollback; a per-user state machine with loops broken by the JPA @Version field.; figure: Figure 5: the per-user migration states. | `elaboration`: A per-user migration with rollback. → The six design choices behind it. |\n| p33 | analysis | In the author's reading the migration's ownership mattered as much as its algorithm: a migration between two systems owned by different teams needs its own owner and anti-corruption layer. |  | `elaboration`: The six design choices. → Who owned the migration and why that matters. |\n| p34 | evidence | mobile.de, the other Berlin brand, published more about models, and its ranking post shows dealers' exposure guarantees shaping a ranking service moved out of Elasticsearch. | quotation: Manish Saraswat, February 2024: top 100 'within a few milliseconds' over more than a million listings while honoring 'exposure guarantees made to our premium dealers'; LTR moved from an Elasticsearch plugin to a Python service; pairwise XGBoost beat pointwise in an A/B test. | `contrast`: Kleinanzeigen's platform migration. → The other Berlin brand, which published about models. |\n| p35 | analysis | In the author's reading the ranking post is the clearest public statement that a dealer package's promise of exposure becomes a ranking constraint, so the ranking service must know about entitlements. |  | `elaboration`: Exposure guarantees in mobile.de's ranking. → What they mean for the ranking/entitlement boundary. |\n\n### Trade-offs the Case Illustrates\n\n**Controlling idea** (`comparison`, id `trade-offs`): Set side by side, eCG's options differ mainly in the kind of interface they create, and that kind decides how easily each unwinds.\n\n**Advances the thesis** (E4, E2): States the case's central finding across all phases: interface type predicts separation cost.\n\n**Transition in:** `conclusion_summary`: The record across all phases, from the portfolio to the Berlin brands' own paths. → The options it shows, set side by side.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p45 | synthesis | The options differ mainly in the kind of interface they create: agreements and external providers are easy to unwind, published contracts can be handed over or re-pointed, and undocumented dependence on a parent is the hardest and the one the regulator wrote into the remedy. | table: Seven options (buy the leader, launch greenfield, coordinate a choice, build a PaaS, share a vertical supply platform behind contracts, buy from one external provider, depend on the parent), each with what eCG's record shows and when it is right or fails.; figure: Figure 6: four joints, from a handshake to a knotted tangle. |  |\n\n### Vertical Differences in the Record\n\n**Controlling idea** (`comparison`, id `verticals`): eCG treated its generalist and automotive verticals differently, and the automotive pattern of sharing the supply side generalizes.\n\n**Advances the thesis** (E6, E2): Grounds the rule to share professional supply first.\n\n**Transition in:** `elaboration`: The options set side by side. → How the same options played out by vertical.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The vertical table first, then the reading that generalizes from it. The generalization needs the table's automotive row, which draws on MoVe and mobile.de's ranking shown earlier; placed before them it would be an unsupported claim.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p46 | comparison | eCG's portfolio was mostly generalist and automotive, and the record shows the two verticals treated differently. | table: Generalist: local products, a Benelux platform, a shared payment provider, parent inventory; automotive: a Global Motors vertical, a central SRE team, MoVe, mobile.de ranking with exposure guarantees; real estate and jobs: no documented vertical platform. |  |\n| p47 | analysis | In the author's reading the automotive pattern generalizes: where supply is professional, structured and arrives through integrators, a group can share the supply side and leave consumer marketplaces separate. |  | `elaboration`: Automotive treated differently from generalist. → Why that pattern generalizes. |\n\n### Failure Modes the Record Exposes\n\n**Controlling idea** (`analysis`, id `failure-modes`): The record exposes four failure modes of shared technology in a group: a parent's abandoned technology, dependencies that appear only at the sale, a first-generation platform outlived by its tenants, and hidden behavior in legacy systems.\n\n**Advances the thesis** (E4, E6): Names the risks the decision rules must guard against.\n\n**Transition in:** `contrast`: What worked: sharing the supply side behind contracts. → What the record shows going wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p48 | analysis (list) | The record also shows what went wrong: four failure modes recur in it, each traced to a dated example. | example: Voyager abandoned by eBay; 'partnering in key areas' and the remedy naming no shared system; PanteraS on a private cloud outlived by public-cloud tenants; Marktplaats's 'hidden functionality' and Kleinanzeigen's replication settings. |  |\n\n### Where the Public Evidence Stops\n\n**Controlling idea** (`context`, id `evidence-stops`): The public record cannot answer nine questions about eCG, from its generalist platform to the synergy outcome, and the chapter does not fill them beyond its two labeled callouts.\n\n**Advances the thesis** (E5): Lists the gaps so the rules that follow do not outrun the record.\n\n**Transition in:** `contrast`: What the record exposes. → What it cannot show.\n\n**Order of paragraphs** (`large_to_small`): The nine open questions first, then the one caveat that applies to facts already given (ownership after 2024). The caveat refers to the portfolio facts, so it follows the list of what is unknown rather than interrupting it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p49 | context | The record exposes those failures but leaves much unanswered: no public source found for this book answers nine questions about eCG, and the chapter fills none of them beyond the two labeled callouts. | table: Nine questions, each with what is public and what is not: a shared generalist platform, engineering organization, MoVe's tenants, dependencies on eBay at signing, the Gumtree UK TSA, the separations of Australia, Mexico and South Africa, Kleinanzeigen's 2025 system, Marktplaats after 2017, the synergy outcome. |  |\n| p50 | context | Ownership of Gumtree UK, Gumtree Australia and Kijiji Canada after 2024 is volatile, and readers should check it before relying on the portfolio facts. |  | `additional_support`: The listed gaps. → One more limit: facts that may change. |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `chief-architect`): The author draws five decision rules from eCG for a group that buys marketplaces and may one day sell them.\n\n**Advances the thesis** (E6): Turns the record into rules.\n\n**Transition in:** `cause_effect`: The record and its limits. → The rules the author takes from it.\n\n**Order of paragraphs** (`order_of_importance`): The rule the whole case supports (interfaces you can hand over) comes first, then the register that applies that rule brand by brand and so needs it stated first, then the narrower rules on verticals, migrations and the parent's technology. Each rule names evidence the reader has already seen.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p51 | transition | What the author takes from eCG is a set of decision rules for a group that buys marketplaces and may one day sell them. |  |  |\n| p52 | recommendation | Prefer interfaces you can hand over: require every shared capability to have a written interface a third party could operate against. | reasoning: Agreements, an external provider and published contracts left the cleanest record; undocumented dependence on a parent needed a regulator's attention. | `sequence`: Decision rules. → The first: interfaces you can hand over. |\n| p53 | recommendation | Keep a dependency register per brand listing every system, data flow and contract it uses but does not own, with an owner and a replacement path. | figure: Figure 7: a brand's register beside a rushed discovery under a clock. | `sequence`: Written interfaces. → The list that records them per brand. |\n| p54 | recommendation | Share the supply side of professional verticals first, because dealer stock entered once and shown in several marketplaces is the clearest case for a shared product platform in the record. |  | `sequence`: The register. → Which layer to share first. |\n| p55 | recommendation | Coordinate choices and fund local migrations: the Chief Architect owns the decision record, the shared expertise and the migration method, not the migration itself. |  | `sequence`: What to share first. → How to run a shared choice. |\n| p56 | recommendation | Treat the parent's technology as a supplier with an end date, and plan the exit before the supplier moves on. |  | `sequence`: Shared choices and local migrations. → The last rule, from Voyager. |\n\n### Comparing the Case to the Book's Patterns and to Veldmark\n\n**Controlling idea** (`comparison`, id `comparison`): eCG's record supports the book's patterns and adds 'the parent sells' as a stressor, and applied to Veldmark it says to make each shared capability hand-over-able rather than to share less.\n\n**Advances the thesis** (E6): Tests the rules against the book and the fictional group.\n\n**Transition in:** `sequence`: The author's rules. → Their test against the book's patterns and Veldmark.\n\n**Order of paragraphs** (`large_to_small`): From the book's patterns, to Veldmark's 2027 choices, to one worked sale question, to the answer. The worked question uses the last row of the Veldmark table, so it must follow it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p57 | comparison | The author's rules rest on the same record that tests the book's patterns, and eCG's record supports or is consistent with every pattern it touches and adds one stressor: the parent sells. | table: Seven book patterns with eCG's record and a verdict for each. |  |\n| p58 | comparison | Veldmark's Common Ground program follows 'share platforms, not products', close to what eCG did but with a much thicker shared layer, and each of its 2027 choices for Tradeyard and Motorvane has an eCG parallel and a suggestion. | scenario: Common Ground approved January 2027, €140 million over 2027–2030; six Veldmark choices (Motorvane syndication to Tradeyard Poland, OpenSearch, Yardstick strangler with Debezium CDC, Kafka on Confluent Cloud and alerts for 46 million saved searches, Safe Deal on Adyen for Platforms, private-equity ownership since 2025), each with an eCG parallel. | `sequence`: The book's patterns. → Veldmark, the fictional group. |\n| p59 | example | If Veldmark's owner sold Tradeyard Portugal in 2029, each shared capability it would then use would become a line in a transitional services agreement, as for Gumtree UK. | scenario: Tradeyard Portugal: 1.1 million live listings, about 210,000 new listings a week, no Safe Deal; by 2029 on the group taxonomy service, the Confluent backbone and Listing event contract v1, Veldmark ID, the shared OpenSearch platform and Tally, and still on Yardstick until end of 2029. | `elaboration`: The last row: private-equity ownership. → A worked sale question. |\n| p60 | recommendation | The architectural answer is not to share less but to make each shared capability hand-over-able, with a per-brand dependency register that makes the tenancy model's exit paths checkable. | scenario: Country-scoped taxonomy exports, brand- and country-filtered topics, per-brand identity profiles, per-country indices, extractable entitlement accounts; the June 2027 tenancy model; Ingrid Halvorsen and the architecture advice forum; separability tabletops. | `problem_solution`: Every shared capability becomes a TSA line. → How to make each one hand-over-able. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Eight questions let a reader test their own group against eCG's lessons.\n\n**Advances the thesis** (E6): Puts the rules to the reader's own group.\n\n**Transition in:** `similarity`: The tests applied to Veldmark. → The same tests for the reader's own group.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p61 | recommendation (list) | The same tests apply to any group: eight questions turn the case into checks on the reader's own group, from dependencies per brand to the cost of removing a brand name. |  |  |\n\n## Conclusion: From eBay Classifieds to AVIV\n\n**Synthesis:** The three questions give one answer: what the group shared was thin and chosen layer by layer, what stayed local was the national platforms that kept their value and could move to a new owner, and what the sale revealed depended on the interface each layer used. Choosing interfaces a third party could operate is what keeps a group free to keep, merge or sell each brand.\n\n**So what:** A Chief Architect does not need to know whether a sale is coming to act on this: a dependency register per brand and a written interface for every shared capability cost little now and set the price of separation later.\n\n**Callback:** The hook: eBay entered classifieds in 2004 by buying national leaders and sold the group whole in 2021; and the group's public silence. The reader can now see that the leaders eBay bought and left on their own platforms were the ones that moved cleanly to a new owner, and that the group's silence matched how little it held in common.\n\n**Takeaway** (`course_of_action`): Start a dependency register per brand and require a written interface for every shared capability; read case-aviv next for a group that took the opposite route in one vertical.\n\n**Hand-off** to [AVIV Group: Building a European Real-Estate Platform from Acquisitions](case-aviv.html): `place`: eBay Classifieds' closing: a federation whose value lay in strong national platforms and whose shared layer was tested by a sale. → One vertical, real estate, and a group that took the opposite route: it assembled national portals by acquisition and set out to make them work as one, with almost no engineering evidence to read.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p62 | synthesis | Asked of the whole record, the chapter's questions give one rule: the national platforms that stayed local kept their value, and the interface each shared layer used set what the sale cost, so interfaces a third party could operate keep a group free to keep, merge or sell each brand. |  |  |\n| p63 | transition | eCG shows a federation whose value lay in strong national platforms and whose shared layer was tested by a sale, and case-aviv follows a group that took the opposite route in one vertical, assembling a European real-estate platform from acquired portals. |  | `place`: One federation's whole record. → The next case: one vertical and the opposite route. |\n\n## Non-goals\n\n- A company profile, a valuation or a judgement on eBay's portfolio strategy.\n- Adevinta's integration, convergence and decentralization after 2021. See [Adevinta: From Schibsted's Copy-Paste Model to a Portfolio Platform](case-adevinta.html).\n- Re-teaching tenancy models, consolidation sequencing, migration patterns or payment design. See [One Platform, Many Marketplaces: Multi-Country and Multi-Brand Architecture](multi-country-platforms.html), [After the Deal: Consolidating Platforms After Acquisitions](platform-consolidation.html), [Changing the Engine in Flight: Modernizing a Live Marketplace](modernization-and-migration.html), [Beyond the Contact: Payments, Shipping and Buyer Protection](transactions-and-payments.html).\n- Gumtree, Kijiji or Vivanuncios engineering, for which no first-hand public source was found.\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Which brands, other than Canada's receivers, used MoVe, and did mobile.de?\n- Did eCG run a shared generalist platform for its smaller horizontals? Names circulating for it remain unverified.\n- Scope and duration of the Gumtree UK transitional services.\n- Identity of Kleinanzeigen's 2025 'new system' and its relation to any Adevinta platform.\n- When Kleinanzeigen's buyer-protection provider changed from Online Payment Platform to Adyen.\n- Ownership of Gumtree UK, Gumtree Australia and Kijiji Canada after 2024 (volatile).\n\n## Decision log\n\n- **2026-11-12** — Resolved the round-3 escalation under the author's delegation. Kleinanzeigen section split, because both flow readers objected to every position: the 2009–2019 growth and event backbone (p27, p14, p28–p30) moved into Phase 2 as its last subsection, 'What one brand built on its own: Kleinanzeigen, 2009–2019', after the layer map; the 2025 migration (p31–p33) and mobile.de's ranking (p34–p35) became a new section after the Aftermath, retitled 'Inside the Berlin Platforms: Kleinanzeigen and mobile.de, 2024–2025' so that mobile.de fits under it. p27 rewritten as a contrast with the shared layers; its sentence pointing to case-adevinta moved, unchanged in substance, into p31, whose opening now picks up the Aftermath's hand-over. Transitions of p27, p31, p34, the new section and trade-offs rewritten; roadmap p04 and its promise updated; post and Phase 2 flow rationales rewritten, including the reason for the internal order of the cross-phase views. Rejected: Keeping the section whole before or after the sale (both positions drew corroborated objections in rounds 2 and 3).; Giving mobile.de its own section (a heading change is enough).\n- **2026-11-12** — AC-4 callouts, made to agree with the page's own sources: 'Each brand kept its own core platform' now reads 'As far as the record shows, each brand kept its own core platform; the one documented exception is a multi-tenant platform the Benelux sites share, known from an undated job posting' (the body's p10 hedge and p26 Benelux evidence); 'much of that value sat in a few national brands' is now labeled 'On my reading', and the price is attributed (eBay, 2020) as in the timeline; 'eBay's strongest European market' is labeled 'on my reading' (the page gives no source). No new statement about any company.\n- **2026-11-12** — Published inconsistencies (rule 3, page's own sources): 'The two greenfield sites that succeeded both had a head start' now reads 'Of the two greenfield sites that succeeded, one had a clear head start', matching the next sentences, which say the record does not explain Kijiji Canada; 'three layers below the logo' now reads 'several layers below the logo', since the evidence list above names name/domain, apps and platform while the reading names domains, identity and design systems; the Deal-Shaped Architecture bullet's 'coordinated them only by agreement' now reads 'mostly by agreement', since the body documents a group PaaS and MoVe's published contracts. CMA dates: the 2 March 2021 decision (timeline and text), its April 2021 publication and the 2 June 2021 acceptance are three different events and do not contradict each other; kept as published, timeline unchanged (rule 8).\n- **2026-11-12** — Glosses before use (known_before_new, corroborated in round 3): 'transitional services' glossed in the WHY THE BUSINESS CARES callout as 'systems and functions the seller keeps running for a sold business while it separates'; 'statement-based binary logs' glossed in the Aftermath as 'a MySQL replication setting that logs SQL statements rather than changed rows'. The failure-modes lead now opens 'The record also shows what went wrong', signalling the turn from the options to the failures.\n- **2026-11-12** — Raised length.max_words from 8166 to 8300 (rule 2, within 10%) for the glosses, the qualified callouts and the transitions of the split; no published fact cut.\n- **2026-11-12** — Kept the orchestrator's removal of the interpretive Kijiji-impairment sentence; p43's controlling idea now states only the documented impairment and listing, and the paragraph stays in the Aftermath as placed by the author (rule 8).\n- **2026-11-12** — Remaining open items closed by keeping the published text (rule 8), accepted under the author's delegation, 2026-11-12: the flow-rubric suggestions not taken (merging the cross-phase sections, moving the Phase 1 sources line, the ownership-volatility note, moving the Kijiji impairment); the layer counts (five group-wide plus one regional in the text, eight rows in the map with two local, explained in one sentence); p24's labeled reading that the parent-inventory layer was 'the first to be exposed by a sale'. Agent-written glosses, transitions, roadmap and renamed headings of earlier passes accepted under the author's delegation, 2026-11-12.\n- **2026-11-12** — Draft check round 2 (escalate; both flow readers reported the backward jump from 2025 to ce-labeling and evidence-stops criteria are covered by AC-4 and the evidence-stops section; agreement of the sale figures with case-adevinta and 'ledger facts only' in the comparison are editorial checks, not reader outcomes. No criteria added beyond the journal spec's four.\n- **2026-11-12** — Added a conclusion under its own heading ('From eBay Classifieds to AVIV'), as case-adevinta did: a new synthesis paragraph and the published closing paragraph moved out of 'Questions to Ask'. Added a roadmap paragraph so the opening announces every section, and one clause in p01 carrying over from case-olx. Rejected: Leaving the hand-off inside 'Questions to Ask', which gives the chapter no synthesis or callback.\n- **2026-10-19** — Organized the case around shared layers and their interface types (agreement, external provider, published contract, undocumented parent dependency) rather than by brand, because the interface type is what predicted separation cost at the sale.\n- **2026-10-19** — Upgraded MoVe from brief-level inference to documented fact for the Canadian tenant after re-reading the webhook-receiver README, which names Kijiji.ca and kijijiautos.ca as receivers; kept other tenants as inference.\n- **2026-10-19** — Used Kleinanzeigen's 2019 and 2025 posts as the deepest engineering evidence but refused to link the 2025 migration to Adevinta's convergence plan, which the post does not mention.\n- **2026-10-19** — For the Veldmark comparison, used a hypothetical 2029 Tradeyard Portugal sale built only from ledger dates (Adevinta's case used Hearthly), so the two cases test different shared capabilities; no ledger facts added.\n\n## Sources\n\n- **Internal**\n  - case-adevinta — Post-2021 story and payment flows, kept consistent.\n  - multi-country-platforms, platform-consolidation, listing-ingestion, search-architecture, event-driven-listings, modernization-and-migration, ranking, long-term-evolution — Patterns tested.\n  - _research/brief-ebay-classifieds.md (primary), brief-adevinta.md, brief-search-discovery.md, brief-platform-data-ml.md; _research/scenario-ledger.md — Evidence base and Veldmark facts.\n- **External**\n  - eBay SEC filings 2004 and 2020; eBay Inc. releases 2008, 2015, 2016 (re-verified 19 October 2026) — Acquisitions, operating intent, sale terms, parent inventory programs.\n  - UK CMA decision ME/6897/20, 2021 (re-verified) — Transitional services offered by eBay for Gumtree UK.\n  - Adevinta releases 2021–2023 (Gumtree UK and Australia sales re-verified) — Completion, divestments, rebrand.\n  - Marktplaats Technology 2015/2017; Berlin Tech Blog 2018–2026 (2019 Kafka and 2025 migration posts re-verified); eBayClassifiedsGroup GitHub (MoVe READMEs re-verified); HashiConf 2018 (re-verified) — Engineering record.\n\n## Changelog\n\n- **2026-11-12** — Resolved the round-3 escalation under the author's delegation: Kleinanzeigen section split between Phase 2 and a new Berlin section after the Aftermath; AC-4 callouts qualified or labeled; four published inconsistencies aligned with the page's sources; two glosses; max_words raised. (AI-mediated session)\n- **2026-11-12** — Orchestrator review: removed one added interpretive sentence about eBay's Kijiji. Check report stale.\n- **2026-11-12** — Converted spec.md to spec.json (outcome-spec pass): sections and paragraphs reconstructed from the published text; opening clause from case-olx, roadmap paragraph and a two-paragraph conclusion added; spec.md removed. Flow rubric (sound with notes): mobile.de ranking subsection moved to Vertical Differences. Draft check round 1: p14 moved to the Kleinanzeigen section; section-opening sentences added for Phase 3, the regulator, Verticals, Failure Modes, Evidence Stops, Comparison and Questions; inference labels and two source dates added. Round 2: Kleinanzeigen section moved after Aftermath; mobile.de subsection returned to it. Round 3 (escalate). Closing fixes without another round: Figures 4 and 5 renumbered to match their new order, the layer-count sentence split and the two local layers named, 'To answer them' added to the roadmap, 'Not every shared layer worked' cut from the Failure Modes lead.\n- **2026-10-21** — Renamed failure patterns to match where-listing-systems-go-wrong: Seeing Double, Search as System of Record, Multiplier Creep, Fast Mail for Fraudsters, The Copy-Paste Country, Deal-Shaped Architecture, The Forced Fit, Billing by Guesswork, Set-and-Forget AI. (AI-mediated session)\n- **2026-10-20** — Replaced 4 mermaid diagrams with generated illustrations (figure numbers and captions unchanged; sources archived in _research/mermaid-figures.json). (AI-mediated session)\n- **2026-10-20** — Trade-offs heading capitalized as in the 45 chapters. (AI-mediated session)\n- **2026-10-20** — Sharpening pass: 6,695 → 6,702 words (fact-dense case, structure only); opening states the chapter's Part IX question and its feed into the Veldmark comparison; Phase 1's two subsection headings removed; six paragraphs re-led with their point; worked question split in two. (AI-mediated session)\n- **2026-10-19** — Added 3 inline illustrations (article-illustrator); figures renumbered. (AI-mediated session)\n- **2026-10-19** — Editorial review pass: re-verified 10 load-bearing claims (SEC 2004/2020, CMA decision, Worldline, MoVe, Australia sale, rebrand); dated OPP at Kleinanzeigen to July 2023 (t3n) and the Adyen switch as after that; added Shpock buyer and acceptance date; tied the worked question to the tenancy model exit paths; American spelling. (AI-mediated session)\n- **2026-10-19** — Initial spec and article. (AI-mediated session)\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);

            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
