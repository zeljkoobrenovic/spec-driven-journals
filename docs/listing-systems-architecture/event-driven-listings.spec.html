<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, acceptance criteria AC-1 to AC-3, the thesis and the role are copied unchanged from the event-driven-listings entry in journal-spec.json. Four units are additions to the published text: the lead-ins to the trade-off table (p54) and the vertical table (p57), and the conclusion's synthesis (p68); p03 gains a roadmap sentence and p21 a gloss of 'tenant'. See decision_log.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The difference between domain events, change events and commands; notification, event-carried state transfer and event sourcing; ordering, delivery guarantees and idempotency.\n- **Know:** The listing event stream: components, the transactional outbox, change data capture behind a translator during migration, the event envelope (listing key, aggregate version, cause, public state), the event catalog, topics and retention.\n- **Know:** Schema evolution under compatibility modes and the rules Veldmark publishes; replay, backfills and dead letters that cannot resurrect a sold listing; removal objectives separate from publication objectives.\n- **Believe:** The listing event is a published contract with one owner, not an integration detail, and change data capture is a source, not a contract.\n- **Believe:** Reliable publication and safe consumption are two halves, and neither alone gives correct downstream state.\n- **Be able to:** Review a listing event design and say what goes wrong at the weekly peak, during a backfill or after a schema change.\n- **Be able to:** Design an envelope, a version-gated consumer and a replay path that keeps sold listings removed.\n- **Be able to:** Decide which parts of the event contract a group sets centrally and which each brand keeps.\n\n**Audience:** Chief and principal architects, event-platform and search leads in multi-brand marketplace groups who know Kafka and microservices but have not designed a cross-brand listing event contract.\n\n**Already knows:**\n\n- APIs, databases, event streams (Kafka topics, partitions, consumer groups), search engines and Kubernetes (the book's baseline).\n- From earlier chapters: the listing aggregate, its lifecycle and invariants (listing-aggregate); published language and anti-corruption layers (bounded-contexts); the publication pipeline's stages (publication-pipeline); feed ingestion and content hashing (listing-ingestion); entity resolution; saved-search alerts and digests; Ghost Inventory and the other failure-pattern names.\n- Veldmark, its brands (Tradeyard, Motorvane, Hearthly, Keybridge), Common Ground, the architecture advice forum, Yardstick, Safe Deal, the cast (Ingrid Halvorsen, Sven Lindqvist, Daan Visser, Lucía Ortega), the Rotterdam bike, the Essen Golf and the Lyon apartment.\n\n**Does not yet know:**\n\n- The difference between domain events, change events and commands, and between event notification, event-carried state transfer and event sourcing.\n- The dual-write problem and the transactional outbox; change data capture behind a translator.\n- Version-gated apply, log compaction and tombstones, dead-letter queues.\n- Schema registry compatibility modes (BACKWARD, FORWARD, FULL, transitive).\n- Tenant as the platform term for one brand in one country, defined later by multi-country-platforms.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a stale downstream copy and a replay plan, the reader names the mechanism that fixes each. *Probe:* A listing sells at 18:10 and leaves search at 18:11, but the next morning's alert digest, built the afternoon before from a database replica, still features it. Separately, a team plans to rebuild the search index by replaying six months of listing events and fears that old events will bring sold listings back. Using only this chapter: what design fixes the digest, and what makes the replay safe? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-4 | Given a proposal to publish after commit or to let consumers read raw change data capture, the reader names what breaks and the two designs that fix it, with their costs. *Probe:* A listing service commits a sale to its database and then sends a Kafka message from application code. Separately, the search and alert teams, tired of waiting, want to read Debezium change events from the monolith's listing table directly. Using only this chapter: what can go wrong in each case, and what should be built instead, at what cost? | `custom` | cold_reader | minor |\n| AC-5 | Given two schema changes, the reader says which the registry catches, which it cannot, and how each is made. *Probe:* On a listing event topic with many consumers, one brand wants to rename a field, and another wants to start sending a surface-area field as habitable surface instead of total surface. Using only this chapter: how should each change be made, and which of them would a schema registry stop? | `custom` | cold_reader | minor |\n| AC-6 | No real company's internal listing event design is presented as fact; company evidence is dated and inferences are labeled. *Probe:* Does the chapter describe any real company's listing event names, topics or consumer logic as documented fact beyond what its cited, dated sources say? Is every inference about a real company labeled as the author's? | `custom` | rubric | minor |\n\n## Thesis\n\n**Question:** How should listing changes flow to search, trust, alerts, analytics and partners?\n\n> **Claim:** Listing changes should reach search, alerts, trust and safety, SEO, analytics and partners through one owned, versioned stream of listing events that only the listing's system of record emits: published in the same transaction as the change (a transactional outbox, or change data capture behind a translator while a monolith remains), keyed by listing ID with a strictly increasing per-listing version that consumers use to apply each change once and in order, carrying the listing's current public state so a consumer recovers from a lost message with the next one, evolved under full transitive schema compatibility with semantic changes reviewed by people, replayable from a compacted state topic, and held to a removal objective tighter than the publication objective (at Veldmark p99 under five seconds to topic and under thirty seconds to search deletion).\n\n**Disputed by:** The common practice of letting each downstream system poll the listing database or a replica, receive nightly dumps or messages the application sends after commit, or read change-data-capture rows as its contract, with each producing team choosing its own event names and payloads.\n\n**So what:** A Chief Architect who accepts this decides centrally the envelope, the cross-brand listing identity, the event catalog, the compatibility rules, the removal service levels and per-topic access, and leaves each brand its internal events and its choice of outbox or CDC during migration; makes consumers register before they get access; and watches publication and end-to-end removal latency per tenant, consumer lag at the Sunday-evening peak and the count of consumers still reading producer tables.\n\n**How and why:** Femke's bike sold at 18:10 and left Solr at 18:11, but the next morning's digest, assembled from a MySQL replica the afternoon before, still featured it, and three people messaged her. Tradeyard NL alone had eleven readers of listing changes on five mechanisms, and nobody had the list. Replayed on Listing event contract v1, the ListingSold event at version 9 reaches the digest, which also re-checks state at send time. The contract went live on 1 July 2027 with 23 consumer groups and by the end of 2027 carried about 4.2 million events a day; content-hash suppression keeps about a million no-op updates a day off the stream. The Essen Golf's removal, reported by the dealer's feed 26 hours late, shows the limit: the stream makes copies as fresh as the source, not fresher.\n\n**Supporting claims**\n\n- **S1** — Listing changes are a fan-out problem: one write has ten or twenty readers, and private integrations (polling, replica reads, nightly dumps, best-effort messages) leave nobody with the list of readers, so removals arrive late; the fix is a listing event defined as a domain event in the listing's published language, owned by its context, which change data capture can feed but never replace.\n- **S2** — Reliable publication means only the listing's system of record emits listing events, in the same transaction as the change: a transactional outbox as the target, change data capture behind a translator while a monolith remains, the two being stages of one migration rather than alternatives.\n- **S3** — Safe consumption needs a per-listing key and a strictly increasing per-listing version that consumers use to apply each change once and in order, and events that carry the listing's current public state plus the delta (no personal data), so a lost, duplicated or failed message is repaired by the next one.\n- **S4** — A contract that lives for years needs full transitive schema compatibility with human review of changes in meaning, breaking changes by parallel run, replay from a compacted state topic and a separate backfill topic gated by version so no replay resurrects a sold listing, and a removal objective tighter than the publication objective (at Veldmark, p99 under five seconds to topic and under thirty seconds to search deletion, against p95 under two seconds for publication).\n- **S5** — Veldmark's Listing event contract v1 shows the design working and its limit: replayed on v1, the bike's ListingSold at version 9 reaches the digest, which also re-checks state at send time, while the Essen Golf's 26-hour-late removal shows the stream makes copies only as fresh as their source.\n- **S6** — Because the contract outlives the systems around it, a Chief Architect sets centrally the envelope, cross-brand identity, event catalog, compatibility rules, removal service levels and per-topic access, leaves brands their internal events and their outbox-or-CDC choice during migration, makes consumers register before access, and watches publication and removal latency, peak lag and consumers still reading producer tables.\n\n## Role in the part\n\nPublishes the first platform contract, the listing event stream, that every later chapter of the part reads from. Supports P7-1 of part `part-7`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in architecture, replay: the dual-write problem before the outbox, the backfill and dead-letter hazards before their controls; `grouping` in trade-offs, verticals, failure-modes, ca-view, questions: the book's standard judging sections)\n\nThe scene poses the question with a sold bike that a digest never heard about; concepts give the vocabulary (domain event, state transfer, key, version) the architecture needs; the architecture builds publication, envelope, catalog and topics from it; the in-practice section can then test the design on public evidence and on the bike and the Golf; schema evolution and replay come after the contract exists, because they govern how it changes and how its events are re-delivered; the judging sections generalize. Putting replay before the envelope would ask the reader to version-gate events before knowing they carry a version; putting the bike replay before the architecture would show a fix before its parts.\n\n## Introduction\n\n**Hook** (`intriguing_example`): A listing is written by one party and read by many. The seller or a dealer's feed changes the price once; search must re-index it, saved-search alerts must decide whether to notify watchers, the market-value model must re-score it, the trust-and-safety system must check whether the change is suspicious, the sitemap must update lastmod, the warehouse must record it, and a partner syndication feed may need to carry it.\n\n**Bridge:** Architects whose marketplaces already move listing changes by polling, replica reads, nightly dumps and messages sent after commit, and who have just finished Parts IV to VI, which assumed those changes arrive. → Moving listing changes as one owned, published stream, the first platform contract of Part VII.\n\n**Thesis statement** (KEY POINTS callout (three bullets) and the closing sentence of p02.): The listing event is a published contract with one owner; reliable publication (outbox, or change data capture behind a translator) and safe consumption (key, version, state) are two halves, and neither alone gives correct downstream state; carrying state and keeping history replayable turns rebuilds into routine operations.\n\n**Roadmap** (IN THIS CHAPTER callout and the closing sentence of p03, which names the sections in order.):\n\n- Start with an alert digest at Veldmark that did not know a bike was sold. *Kept in:* scene.\n- Define what a listing event is and the properties consumers rely on. *Kept in:* concepts.\n- Build the stream: outbox, change data capture, envelope, catalog, topics and removal objectives. *Kept in:* architecture.\n- Set it against public evidence and Veldmark's Listing event contract v1. *Kept in:* in-practice.\n- Evolve the schema, and replay, backfill and handle dead letters safely. *Kept in:* schema, replay.\n- Close with trade-offs, vertical differences, failure modes, the Chief Architect's view and questions for a design review. *Kept in:* trade-offs, verticals, failure-modes, ca-view, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A listing is written by one party and read by many systems, so the architecture question is not how to store the listing but how to move its changes, because that movement decides freshness, removal latency and consistency. | example: One price change by a seller or a dealer's feed must reach search, saved-search alerts, the market-value model, trust and safety, the sitemap's lastmod, the warehouse and a partner feed. |  |\n| p02 | claim | The cheap ways of moving changes (polling, replica reads, nightly dumps, messages sent after commit) work until the readers multiply, so an event-driven architecture replaces many private integrations with one published stream owned by the system of record and designed like an external API. | reasoning: Late removals, weekend-long reindexes and no agreement on which copy of a listing is right as readers grow. | `problem_solution`: The fan-out of one listing change to many readers. → The cheap integrations most marketplaces start with, where they break, and the one published stream that replaces them. |\n| p03 | transition | The chapter opens Part VII by publishing the first of the platform's contracts, which turns the listing aggregate's lifecycle and the publication pipeline's stages into the stream search, alerts and trust already assumed; it owns the listing event, the outbox and schema evolution, leaves copies to listing-data-management and tracking events to data-platform, and lays out its sections in order. | reasoning: part-7's argument that a shared platform earns trust through contracts, not mandates; listing-aggregate and publication-pipeline as inputs; listing-data-management and data-platform as owners of neighbouring topics; the order of the sections. | `elaboration`: One published stream owned by the system of record, and the part introduction's first key point that the platform is a set of published contracts starting with that stream. → Where the chapter sits in Part VII, what it owns, what it leaves to neighbours, and the order of its sections. |\n\n## Sections\n\n### Setting the Scene at Veldmark: The Digest That Did Not Know the Bike Was Sold\n\n**Controlling idea** (`example`, id `scene`): In March 2027 an alert digest at Tradeyard NL features a bike that sold the evening before, because eleven readers of listing changes use five private mechanisms and nobody has the list.\n\n**Advances the thesis** (S1): Poses the chapter's question as a concrete Ghost Inventory incident caused by private integrations.\n\n**Transition in:** `example`: The roadmap's first promise and the claim that private integrations break as readers grow. → The bike incident at Tradeyard NL.\n\n**Order of paragraphs** (`chronological`): The incident note, then Sven's trace of its cause, then his inventory that generalizes it, then the question it raises and the program's answer; the inventory only makes sense after the trace shows one reader that was never told.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p04 | example | On 9 March 2027 Ingrid reads that Femke's €240 bike, sold on Monday for €225 through Safe Deal and removed from search a minute after it was marked sold, still appeared in Tuesday morning's alert digest, and three buyers messaged her. | scenario: Listed Sunday, sold Monday for €225 via Safe Deal, marked sold 18:10, out of Solr 18:11, still in the next morning's digest; three messages to Femke. |  |\n| p05 | cause_effect | Sven traces the cause: the digest assembled its candidates from a MySQL replica at 17:30 on Monday and sent them at 07:00, while the sale reached only the search indexer through a RabbitMQ message the digest never subscribed to, and nobody had a list of subscribers. | scenario: Digest job reading a replica of Yardstick's MySQL; RabbitMQ message after the sold flag commits; the digest not subscribed. | `cause_effect`: The digest that featured a sold bike. → Why: a snapshot from a replica and a message the digest never received. |\n| p06 | evidence | Sven's inventory finds eleven readers of listing changes at Tradeyard NL alone on five mechanisms, and across the group each brand uses a different messaging technology with its own event names. | scenario: Four RabbitMQ consumers, three replica pollers (1–15 min), two nightly CSV exports, one daily dump for Snowflake, one best-effort Kafka feed for trust and safety; Motorvane on MSK, Hearthly on Pub/Sub, Keybridge on Azure Service Bus.; figure: Figure 1: a listing database wired to eleven readers by mismatched mechanisms, with the digest never told. | `elaboration`: One reader that was never told about the sale. → The full count of readers and mechanisms, at Tradeyard and across the group. |\n| p07 | claim | Ingrid's question to the advice forum is the chapter's question, how listing changes should flow so that every reader sees every change once, in order and in time, and Common Ground's answer is a Kafka backbone on Confluent Cloud and Listing event contract v1, live on 1 July 2027. | scenario: Group event backbone on Kafka (Confluent Cloud on AWS) and Listing event contract v1, live 1 July 2027. | `cause_effect`: Eleven readers, five mechanisms, four brands. → The question this raises and the program's answer. |\n\n### Concepts: What a Listing Event Is\n\n**Controlling idea** (`definition`, id `concepts`): A listing event is a domain event owned by the listing context, carrying state, keyed and versioned per listing, and it differs from change events, commands and thin notifications in who controls its shape.\n\n**Advances the thesis** (S1, S3): Defines the listing event as a contract and the ordering, delivery and idempotency properties consumers rely on.\n\n**Transition in:** `elaboration`: The forum's question and the contract that answers it. → The terms the contract is built from, starting with what counts as an event.\n\n**Order of paragraphs** (`prerequisite_order`): What kind of event (ownership) comes first because it decides who may change the shape; what the event carries (state) next because the envelope depends on it; how it is delivered (order, duplicates, versions) last because version-gated apply assumes events carry a version and the key.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | definition | Three things are called events (domain events, change events and commands), and the difference matters because it decides who controls their shape. | table: Domain event, change event (CDC) and command or message, with definition, who decides the shape, and an example of each. |  |\n| p09 | definition | A listing event is a domain event about one listing, emitted by the owning context whenever the aggregate passes an invariant-preserving transition, and it serves as the aggregate's published language. | reasoning: Transitions submitted, published, updated, price changed, paused, reserved, sold, expired, removed; published language as defined in bounded-contexts. | `elaboration`: The three kinds of event. → The book's definition of a listing event as a domain event. |\n| p10 | claim | Change data capture is a mechanism for getting events out of a legacy system, not a contract, because raw table changes make the producer's internal schema everybody's business. | example: Renaming a column in Yardstick should concern Daan Visser's team only; if eleven consumers parse the binlog of the ads table, it concerns everybody. | `contrast`: The listing event as a domain event owned by the listing context. → Change data capture, which looks similar but is a mechanism, not a contract. |\n| p11 | comparison (list) | Fowler separates event notification, event-carried state transfer and event sourcing, which trade payload size and privacy against callbacks, copies and the system of record. | source: Martin Fowler, 'What do you mean by \"Event-Driven\"?' (2017): notification makes consumers call back and hides the logical flow; state transfer means 'lots of data schlepped around and lots of copies'; event sourcing makes events the system of record, rarely worth it for listings. | `sequence`: What kind of event a listing event is. → What it should carry: Fowler's three patterns. |\n| p12 | recommendation | Listing events should carry state, because one popular change fans out to many readers at once and callbacks at the Sunday-evening peak would overload the listing service; which state is the envelope's question. | reasoning: A price cut reaches search, alerts, valuation and analytics within seconds; a callback storm at peak. | `cause_effect`: Fowler's three patterns and their costs. → The choice for listings and why. |\n| p13 | definition (list) | Consumers end up correct only through three properties: per-listing order from keying by listing ID, at-least-once delivery, and idempotency by version-gated apply. | source: Kafka order within a partition; Debezium's outbox router keys by aggregate ID, 'which preserves per-aggregate order'.; reasoning: No end-to-end exactly-once across database, broker and search index; a consumer applies an event only if its version is newer than the one stored. | `sequence`: What a listing event carries. → How it is delivered and how consumers stay correct. |\n\n### Architecture: The Listing Event Stream\n\n**Controlling idea** (`description`, id `architecture`): The stream has five components with one owner each; the outbox or a CDC translator guarantees publication, a shared envelope with key, version, cause and public state makes consumption safe, a short catalog limits the contract, two topics let consumers catch up or bootstrap, and removals get a tighter objective than publications.\n\n**Advances the thesis** (S2, S3, S4): Specifies how publication is guaranteed, what the envelope, catalog and topics give consumers, and how fast removals must arrive.\n\n**Transition in:** `sequence`: The concepts: domain events, state transfer, order, duplicates and versions. → The architecture that puts them to work.\n\n**Order of paragraphs** (`large_to_small`): Components first so each later part has an owner; publication (outbox, then CDC as the legacy path) before the envelope, because the envelope's fields are written by the publication mechanism; the envelope before the catalog because every event type shares it; topics next because retention and compaction depend on the state block and the event types; the removal objective last, because it measures how fast the closures the topics carry must arrive.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | description (list) | The architecture has five parts, each with one owner, and only the listing context produces listing events, so trust and safety emits a decision the listing context applies rather than a listing event of its own. | figure: Figure 2: one producer, one contract, many consumers; outbox, domain-event topic and compacted state topic.; reasoning: Listing context, publication mechanism, event backbone, schema registry, consumers. |  |\n| p15 | explanation | Publishing after a commit, or before it, creates the dual-write problem: a crash between the two steps leaves the database and every other copy disagreeing. | reasoning: Commit then publish: listing sold in the database, active everywhere else, the bike's outcome from a different cause; publish then commit: consumers believe a change that never happened. | `elaboration`: The publication mechanism, the second component. → The problem it must solve: the dual write. |\n| p16 | process | The transactional outbox writes the event into an outbox table in the same transaction as the change, and a relay publishes the rows, so a committed change cannot lose its event. | source: Debezium outbox event router: id for de-duplication, aggregatetype for the topic, aggregateid as key, type and payload; purpose to avoid inconsistencies between 'a service's internal state' and the events consumed. | `problem_solution`: The dual-write problem. → The outbox that solves it. |\n| p17 | explanation (list) | For listings the outbox gives three properties: the producer chooses the event shape, publication is at least once, and order follows commit order per listing. | example: ListingSold with a sale channel and price instead of status=4; the relay can publish a row twice; order holds when the relay keeps table order and keys by listing ID. | `elaboration`: How the outbox works. → What it gives a listing producer. |\n| p18 | transition | The outbox costs a write-path change in every producer and a table to clean up, which is why legacy systems usually start elsewhere. |  | `contrast`: The outbox's properties. → Its cost, and the reason legacy systems need another path. |\n| p19 | explanation | A monolith whose write paths are scattered cannot get an outbox quickly, so table-level change data capture, which turns every row change into an event without touching application code, is the strangler's first tool. | source: Kleinanzeigen's search team used Debezium on existing Kafka Connect clusters to stream MySQL changes into a denormalized per-user object on a compacted topic, up to 50,000 messages per second on full re-consumption, and found it harder to troubleshoot because issues 'often arise at the infrastructure level rather than in the application code'. | `cause_effect`: Legacy systems cannot take the outbox's write-path change quickly. → Change data capture as the way to get events out of Yardstick. |\n| p20 | claim | A translator (an anti-corruption layer) is the only reader of the monolith's raw change events and emits the contract events, so that when the write path moves to a new service with its own outbox consumers do not notice, which makes CDC and outbox stages of one migration rather than alternatives. | table: Five mechanisms (publish after commit, polling, raw CDC, CDC plus translator, outbox) with what each guarantees, costs and when it is right.; reasoning: When the write path leaves the monolith, the new service publishes the same contract through its own outbox and consumers do not notice; modernization-and-migration uses this sequence. | `contrast`: CDC gets events out of a monolith without code changes. → Why raw CDC still must not reach consumers, and the translator that stops it. |\n| p21 | description | Every listing event shares one envelope whose fields are chosen for what consumers need to be correct: identity and key, version, timing, tenant, cause, correlation, schema, public state and the change. | table: Eleven fields: event_id, event_type, listing_id, listing_version, occurred_at/published_at, tenant, cause, correlation_id, schema_version, state, change, each with meaning and why consumers need it.; reasoning: Tenant glossed as one brand in one country, with a pointer to multi-country-platforms. | `sequence`: How events are published, by outbox or translator. → What every published event contains. |\n| p23 | claim | The first of two envelope choices that need justification is that events carry both the delta and the full public state, so the alert matcher gets the price change it needs and a consumer that missed one event is repaired by the next: self-healing beats perfect delivery. | scenario: PriceChanged with old and new price in change and the listing in state; about 4 KB on average at Veldmark without media; a missed ListingUpdated version 7 repaired by PriceChanged version 8. | `elaboration`: The envelope's fields. → The first of the two choices that need arguing: delta plus state. |\n| p24 | claim | The second envelope choice is that the state block holds only public fields and what search and trust need, never seller contact data, which keeps personal data off the stream and shrinks the erasure problem. | quotation: The generic real-estate domain model: 'public fields can be published; draft, owner, and performance data remain internal and role-controlled'.; reasoning: Consumers that need contact data fetch it through an access-controlled API at the moment of use; erasure belongs to listing-data-management. | `sequence`: The first choice: state plus delta. → The second: which state. |\n| p25 | description | Contract v1 defines twelve event types (pausing and resuming are one type) and keeps the list short on purpose, because every new type is a cost for every consumer. | table: Twelve rows (pause and resume share one) from ListingSubmitted to ListingErased, with when each is emitted and its main consumers. | `sequence`: The envelope every event shares. → The event types that use it. |\n| p26 | explanation | Two exclusions are deliberate: a bump is a visibility change, not a lifecycle transition, and views, clicks and contacts are behavioral tracking events that belong to the data platform. | source: mobile.de's Seller-API separates renewalDate from creationDate.; reasoning: Tracking events would put billions of events on the stream removals depend on. | `contrast`: What the catalog contains. → What it leaves out, and why. |\n| p45 | analysis | Tracking events would also bring a harder schema problem, because client analytics events ship in app binaries that cannot be recalled, one more reason to keep them off the listing stream. | source: Vinted generated tracking code from schemas and repaired malformed web events on the server. | `additional_support`: The exclusion of behavioral tracking events from the catalog. → A second reason for it: client events are harder to evolve. |\n| p27 | description (list) | Veldmark runs two topics keyed by listing ID: an events topic retained 14 days for catching up, and a compacted state topic that lets a new consumer bootstrap from the latest state of every listing. | source: Log compaction keeps at least the last record per key, never reorders, a null value is a tombstone, tombstones removed after delete.retention.ms, 24 hours by default.; scenario: listing.events.v1 (14 days) and listing.state.v1 (compacted). | `sequence`: The event types. → Where they are stored and for how long. |\n| p28 | explanation | Closed listings stay on the state topic for 30 days so consumers learn of the closure and erased ones are tombstoned at once, but a consumer offline longer than tombstone retention can miss a deletion, so the state topic does not replace reconciliation. | scenario: Sold, expired, removed listings kept 30 days then tombstoned; erased listings tombstoned immediately. | `elaboration`: The compacted state topic. → How closed and erased listings leave it, and the gap that remains. |\n| p53 | claim | Removal events get a tighter service level than publication events because a late removal costs more than a late publication, and Veldmark measures it end to end with a synthetic listing in each tenant. | scenario: Publication p95 under two seconds to topic; removals (ListingSold, ListingRemoved, ListingErased) p99 under five seconds to topic and under thirty seconds to search deletion, alarmed per consumer; synthetic listing created and removed every minute in each tenant.; example: A new listing searchable in two minutes instead of ninety seconds, against a scam listing still searchable half an hour after its account is suspended. | `emphasis`: How closed and erased listings leave the stream. → How fast removals must arrive, which matters more than how fast publications do. |\n\n### In Practice: Public Evidence and Contract v1\n\n**Controlling idea** (`evidence`, id `in-practice`): Classifieds companies have documented the plumbing around listing events but not the events themselves, and Veldmark's contract v1 shows the design working on the bike and its limit on the Golf.\n\n**Advances the thesis** (S5, S2): Tests the design against public evidence and against Veldmark's two recurring examples.\n\n**Transition in:** `example`: The architecture, described in general. → What real marketplaces have documented and how Veldmark built it.\n\n**Order of paragraphs** (`grouping`): Three groups: public evidence first, so the reader sees what others documented before the Veldmark design; then the four design decisions and the go-live numbers they produced; then the two acceptance tests, bike before Golf, because the Golf shows the limit of what the bike shows working. Testing before the decisions would replay the bike on a contract the reader has not seen.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p29 | evidence (list) | Public evidence on listing event models is thin, since no classifieds company published its event names or topic layout, but Adevinta, Kleinanzeigen, Vinted, Adevinta Spain and AutoScout24 documented the plumbing around them. | source: Adevinta (2022, older): Kafka as 'the backbone of the data platform', nearly a billion events a day, mixed Avro and JSON, format inferred from the first byte.; source: Vinted (2023): CDC and Flink read models, batch reindex events merged with organic changes, visibility latency from up to seven minutes to about one.; source: Vinted (2026): business events replacing synchronous calls between almost 300 domains, sagas, events that 'arrive late or in a different order than expected'.; source: Adevinta Spain (2024): immutable JSON data contracts, quarantine table, five days to about thirty minutes.; source: AutoScout24 (2018, older): mostly synchronous services, 'some' Kafka. |  |\n| p30 | context | Sven's team designs the contract from March to June 2027 with representatives of each brand and the first four consumers, and four decisions shape it. | scenario: Search, alerts, trust and safety and the warehouse as first consumers. | `contrast`: Public evidence that stops at the plumbing. → Veldmark's own contract design. |\n| p31 | description | The first decision accepts one contract with three publication paths (CDC into a translator for Tradeyard, an outbox for Motorvane, an outbox and a Pub/Sub bridge for Hearthly), because each brand reaches v1 differently in 2027, while Keybridge stays off the stream. | table: Tradeyard via Debezium CDC into Yardstick Relay (outbox in Q2 2028); Motorvane via outbox; Hearthly via Pub/Sub outbox and a bridge preserving the key; Keybridge neither publishes to nor consumes the stream. | `sequence`: Four decisions announced. → The first: publication paths. |\n| p32 | explanation | Keybridge gets no subscription to Hearthly's listing stream, because it sends listings to Hearthly's competitors and a subscription would break the March 2027 neutrality commitment. | scenario: Per-topic access control on the backbone; the decision record says so explicitly. | `elaboration`: The Keybridge row of the table. → Why Keybridge is kept off the stream. |\n| p33 | evidence | The second decision suppresses feed noise at the source: Motorvane's content hash stops about a million unchanged dealer listings a day from becoming no-op events. | statistic: About 88% of Motorvane's dealer listings via DMS feeds; about 1.16 million re-sent daily, about 91% unchanged, about 100,000 real changes a day. | `sequence`: Publication paths. → The second decision: feed noise. |\n| p34 | evidence | The third decision makes a strictly increasing listing version mandatory, which for Yardstick Relay means reading a sequence column added in April 2027 because MySQL timestamps were too coarse. | scenario: updated_seq added to the listing table in April 2027; one-second timestamps; edits within a second common in bulk tools. | `sequence`: Feed noise. → The third decision: versions. |\n| p35 | description | The fourth decision uses Avro schemas in Confluent Schema Registry under FULL_TRANSITIVE compatibility on the events topic, with a one-clause reason (independent upgrades and replays), set against the other modes in the schema section. | scenario: Avro, Confluent Schema Registry, FULL_TRANSITIVE on listing.events.v1. | `sequence`: Versions. → The fourth decision: schema format and compatibility. |\n| p36 | evidence | At go-live on 1 July 2027 the contract has 23 consumer groups, and by the end of 2027 it carries about 4.2 million events a day with a Sunday-evening peak near 1,100 per second under a p95 publication objective of two seconds. | statistic: 23 consumer groups; about 4.2 million events a day; peak about 1,100 per second; p95 under two seconds commit to topic; Tradeyard about 62% of events. | `time`: The four decisions made between March and June 2027. → The contract at and after go-live. |\n| p37 | example | Sven's team uses the March bike as v1's acceptance test, and replayed on the contract the sale reaches the digest as ListingSold at version 9, which removes the bike, while the digest also re-checks state at send time. | figure: Figure 3: the bike's sale as one event with three consumers; the digest fixed twice over.; table: Event log from ListingSubmitted (v1, Sun 19:42) to ListingSold (v9, Mon 18:10, €225, Safe Deal) and a tombstone 30 days later, with what each consumer does. | `time`: The contract live from July 2027. → The March incident replayed on it as the acceptance test. |\n| p38 | analysis | Versions 4 to 7 are Femke's edits, and the log also shows what the stream does not do: it does not detect the phishing message or decide the sold page's SEO treatment; it makes every such system hear the same facts in the same order. | reasoning: Phishing handled by messaging-and-leads and fraud-prevention; sold-page treatment by web-and-seo-architecture. | `elaboration`: The event log of the bike. → What the gaps in it show and what the stream does not do. |\n| p39 | example | The Essen Golf shows the limit: the price cut reaches 1,180 watchers and the valuation model through one event, but the sale arrives from the dealer's feed 26 hours late, because the stream makes copies only as fresh as their source. | scenario: Price cut from €21,900 to €21,400 on Thursday 22 April 2027; 1,180 watchers alerted; sold 29 April; removal reported 26 hours later. | `contrast`: The bike, where the contract fixes the stale digest. → The Golf, where it cannot, because the source is late. |\n\n### Schema Evolution\n\n**Controlling idea** (`explanation`, id `schema`): A listing schema with unknown consumers must evolve under full transitive compatibility, with changes in meaning reviewed by people and breaking changes made by parallel run.\n\n**Advances the thesis** (S4): Says how the contract changes for years without breaking consumers.\n\n**Transition in:** `elaboration`: The fourth design decision, FULL_TRANSITIVE compatibility, promised for this section. → Why the contract needs it and how the schema changes over years.\n\n**Order of paragraphs** (`prerequisite_order`): The modes before the choice of mode, since FULL_TRANSITIVE means nothing without them; the rules after the mode they implement; the change the rules cannot catch next; breaking changes last, after the rules that forbid them in place, since a parallel run is only needed for what the rules refuse.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p40 | claim | A listing event schema lives for years with consumers its producers have never met, which makes changing it safely the chapter's hardest operational discipline. |  |  |\n| p41 | definition | Confluent Schema Registry offers backward, forward and full compatibility, each optionally transitive, which differ in whether new consumers read old data, old consumers read new data, or both, against the last version or all of them. | source: BACKWARD is the default and checked only against the latest version; transitive variants check all previous versions; FORWARD lets old consumers read new data; FULL means both; BACKWARD_TRANSITIVE recommended for Protobuf, a format the contract does not use. | `elaboration`: Changing a long-lived schema safely. → The compatibility modes a registry enforces. |\n| p42 | claim | A multi-brand listing stream needs full transitive compatibility because producers and consumers upgrade independently and replay old events, and in Avro that allows little beyond adding or removing optional fields with defaults, which is the point. | reasoning: Any consumer, on any schema version, can read any event on the topic. | `cause_effect`: The compatibility modes. → The one a multi-brand stream needs, and its consequence. |\n| p43 | claim | A change of meaning is the dangerous one because a registry checks syntax, not semantics, so Veldmark routes every contract change through the advice forum's one-week event-catalog review. | table: Veldmark's rules: optional field yes; new event type with four weeks' notice; enum value only with a default branch (strings, not Avro enums); rename no; change of meaning never in place; remove a required field or change a type means a new major version.; example: Hearthly sending surface_m2 as habitable instead of total surface passes every check and makes every valuation wrong. | `elaboration`: Full transitive compatibility. → Veldmark's published rules and the one change they cannot enforce by machine. |\n| p44 | process | A breaking change means a new topic published in parallel until the consumer registry shows no v1 consumers, a deliberately high cost that keeps v2 rare; Veldmark expects v1 to last at least until Yardstick goes at the end of 2029. | scenario: listing.events.v2 with double publication; v1 retired when no active v1 consumer groups remain; v1 expected to last until Yardstick's decommissioning at the end of 2029. | `sequence`: Changes the rules allow or forbid in place. → How a breaking change is made. |\n\n### Replay, Backfills and Dead Letters\n\n**Controlling idea** (`explanation`, id `replay`): Replay, backfills and dead letters are designed so that no redelivered, backfilled or reprocessed event can bring a sold listing back.\n\n**Advances the thesis** (S4, S3): Shows how version gating and state-carrying events keep the stream safe on bad days and why removals are measured separately.\n\n**Transition in:** `sequence`: Schema evolution: changing the contract safely. → Replaying its events safely.\n\n**Order of paragraphs** (`problem_solution`): Why replay matters, its sources, the backfill hazard and the version gate that solves it, Veldmark's backfill topic; then dead letters, a second hazard that reuses the version gate and the state-carrying event, so it must come after them. Dead letters first would explain the trap before the version gate that defuses it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p46 | claim | A listing stream earns most of its value on bad days, when an index must be rebuilt, a new service bootstrapped or 300,000 wrong listings corrected, and each of these is a replay. | example: A search mapping change, a new recommendation service, an enrichment bug on 300,000 listings. |  |\n| p47 | comparison | Three replay sources serve different purposes: the events topic for recent reprocessing, the compacted state topic for bootstrapping and rebuilds, and a backfill from the system of record for corrections. | table: Source, use and limit for each: 14-day retention; latest state only; load on the producer. | `elaboration`: The replays a stream must support. → The sources they read from. |\n| p48 | claim | Backfills are where designs fail, because a backfilled event can overwrite a newer live one and resurrect a sold listing, and version-gated apply prevents it. | example: A backfilled ListingUpdated, read before the sale, processed after a live ListingSold; it carries the version at which it was read, not newer than the one applied, so it is ignored. | `emphasis`: The three sources. → The one where designs fail. |\n| p49 | analysis | Vinted's merged reindex topic is documented without saying how stale batch events are kept from overwriting newer state, so the author infers that any such design needs a version or timestamp check in the consumer. | source: Vinted merged batch reindex events with organic changes on one topic.; figure: Figure 4: a version gate in front of a consumer holding v9 Sold, bouncing a duplicate v9 and a backfilled v7. | `example`: The backfill hazard and the version gate. → A documented design where the safeguard is not stated, with the author's labelled inference. |\n| p50 | recommendation | Veldmark publishes backfills to a separate topic that consumers read at lower priority and gate by version, so the alert matcher can ignore old changes and a rebuild can be throttled without slowing live publication. | scenario: listing.backfill.v1, same schema, cause backfill. | `problem_solution`: Backfills mixed with live changes on one topic. → Veldmark's separate backfill topic. |\n| p51 | explanation | A dead-letter queue holds events a consumer could not process, and for listings it hides a trap: reprocessing an old version from it without a version check overwrites newer state. | example: Version 5 in the dead-letter queue, version 6 processed, version 5 reprocessed later. | `similarity`: Backfills that overwrite newer state. → Dead letters, which can do the same. |\n| p52 | recommendation | Two rules defuse it: because events carry full state, skipping a failed one is usually safe, and consumers that need every delta park the failing listing while others continue. | example: Version 6 contains everything version 5 did; the price-drop alert matcher parks per key so one broken listing does not stop the partition. | `problem_solution`: The dead-letter trap. → The two rules that handle it. |\n\n### Trade-offs: Choosing the Shape of the Stream\n\n**Controlling idea** (`comparison`, id `trade-offs`): Each shaping decision has conditions under which the other option is right, but for listings the state-carrying, typed, per-aggregate stream on one group backbone is usually the answer.\n\n**Advances the thesis** (S3, S2, S6): Says when the recommended design is right and when an alternative is.\n\n**Transition in:** `conclusion_summary`: The design as recommended, section by section. → The alternatives to each of its choices.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p54 | comparison | Seven decisions shape the stream; the table says when each option is right and marks the one recommended for listings, while the broker choice depends on the group. | table: Event content, granularity, publication, topic layout, backfills, schema format and broker, each with two options and when each is right. |  |\n| p55 | analysis | Typed events win over one generic changed event when consumers need to know why a listing changed, which alerts, trust, regulatory reporting and analytics do, so a generic event is a first step and typed events the destination. | reasoning: Search does not need the reason; alerts, trust and safety, reporting and analytics do; a generic event with cause and changed keys as a first step. | `elaboration`: The seven decisions in the table. → The first of two that need a note. |\n| p56 | analysis | One broker versus bridged brokers is a portfolio decision: Veldmark chose one backbone because Common Ground shares platforms beneath the brands, with Hearthly's bridge as a dated exception, and a group expecting to sell a brand should hesitate to entangle its events. | scenario: Hearthly's Pub/Sub bridge with a review date when its cloud choice is revisited after 2028; platform-consolidation discusses selling a brand. | `sequence`: Typed versus generic events. → The second note: one broker or several. |\n\n### Vertical Differences\n\n**Controlling idea** (`comparison`, id `verticals`): The source of events, their volume and the event that matters most differ by vertical, which changes which events carry the most risk.\n\n**Advances the thesis** (S4, S1): Shows how the same contract is weighted differently in each vertical.\n\n**Transition in:** `contrast`: Trade-offs that hold across the group. → Differences between verticals.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p57 | comparison | The contract is the same in every vertical, but the verticals differ in where events come from, how many each listing produces and which event matters most. | table: General classifieds, real estate, automotive and jobs compared on dominant source, volume per listing, the event that matters most, extra event types and main consumers beyond search. |  |\n| p58 | evidence | For a jobs board the latency from ListingExpired to the page change is an SEO risk, because Google may take manual action against sites that leave expired jobs up. | quotation: Expired jobs must be removed by setting validThrough in the past, returning 404 or 410, or removing the markup; 'failure to take timely action on expired jobs may result in a manual action'. | `example`: The jobs column of the table. → Why expiry latency matters there. |\n| p59 | example | In real estate the entity-resolution cluster is itself a stream, because consumers need both the listing events and the event saying three listings describe one property. | scenario: The Lyon apartment listed by three agencies. | `sequence`: Jobs. → Real estate. |\n\n### Failure Modes\n\n**Controlling idea** (`explanation`, id `failure-modes`): Event-driven listing systems fail in recurring ways, each breaking one part of the design, and each failure has a named control.\n\n**Advances the thesis** (S2, S3, S4): Names the breakdowns the design prevents and the control for each.\n\n**Transition in:** `contrast`: The design and its variations by vertical. → What goes wrong when part of it is missing.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p60 | explanation (list) | Nine failures recur: the forgotten publisher, consumers on producer tables, ordering broken by re-keying, the unversioned upsert, semantic drift, snapshot consumers, missed tombstones, personal data on the stream and the stream as a dumping ground, each with its control. | example: The bike digest as a snapshot consumer; Hearthly's bridge contract test for re-keying; Ghost Inventory produced by the unversioned upsert. |  |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `ca-view`): The listing event contract outlives the systems around it, so the decisions about it are governance decisions: what the group sets, what brands keep, who decides, what to watch, and what the stream's success creates.\n\n**Advances the thesis** (S6): Turns the design into the decisions a Chief Architect owns.\n\n**Transition in:** `problem_solution`: The failures that come from missing parts of the design. → Who must decide and watch what so they do not happen.\n\n**Order of paragraphs** (`grouping`): Why it is governance first, then the book's standard questions in order (decide centrally, leave local, who decides, what to watch), and the long-term consequence last because it leads to the next chapter.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p61 | claim | The listing event contract is one of the few artifacts that outlive systems, so the decisions around it are governance decisions, not implementation details. | scenario: Yardstick gone by the end of 2029, Solr replaced by OpenSearch, the alert matcher rewritten; the contract survives. |  |\n| p62 | recommendation | The group decides centrally the envelope, cross-brand identity, catalog, compatibility rules, removal service levels, per-topic access and the single-emitter rule, because they are cheap to decide once and expensive four times. |  | `cause_effect`: The contract as a governance matter. → What the group should decide. |\n| p63 | recommendation | Brands keep their internal events, their choice of outbox or CDC during migration, their read models and brand-specific event types, so the group contract stays the narrow waist. | scenario: Motorvane's financing-partner events and Hearthly's mandate events stay local. | `contrast`: What the group decides. → What it leaves to brands. |\n| p64 | description | At Veldmark the event platform team owns the backbone and catalog, each brand's listing context owns its events' content, the forum reviews contract changes, the data protection officer signs off personal-data fields, and consumers register before access. | scenario: Sven Lindqvist's event platform team; Lucía Ortega as group data protection officer; registration gives the list of readers the bike incident showed nobody had. | `sequence`: What is decided where. → Who decides it. |\n| p65 | recommendation | The signals to watch are publication and end-to-end removal latency per tenant, consumer lag at the Sunday peak, consumers still reading producer tables, dead-letter rates, no-op updates and schema changes per quarter. | reasoning: A rising share of ListingUpdated events that change nothing signals broken hash suppression; schema changes should be small and boring. | `sequence`: Who decides. → What they watch. |\n| p66 | cause_effect | The stream makes copies cheap and cheap copies multiply, each a place where stale or personal data can linger, which is why listing data management becomes a separate discipline. |  | `cause_effect`: A stream that works and is watched. → The consequence of its success: many copies. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Ten questions turn the chapter into a design review of any listing event stream.\n\n**Advances the thesis** (S6, S2, S3, S4): Gives the reader a review drawn from every section.\n\n**Transition in:** `cause_effect`: The Chief Architect's decisions and signals. → Questions that test a design against them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p67 | recommendation (list) | Ten questions test who emits each transition, how a commit becomes an event, keying, version-gated apply, consumers on producer tables, compatibility and semantic review, rebuilds, end-to-end removal latency, personal data on the stream, and artifacts delivered later than computed. |  |  |\n\n## Conclusion: From Events to Copies\n\n**Synthesis:** Reliable publication and safe consumption are two halves of one contract: the producer's half (one emitter, outbox or translator, key and version) makes every committed change one event in order, and the consumer's half (version-gated apply, state that heals, a separate backfill topic, a removal objective) makes sure no redelivery, replay or late batch undoes it; most listing incidents sit where one half is missing.\n\n**So what:** A design with both halves catches the Sunday-peak, backfill and schema-change failures before buyers do, and lets a new consumer start without asking the producer.\n\n**Callback:** The hook: one listing written once and read by ten or twenty systems, and the scene's bike that a digest featured after it sold. The bike needed both halves: an event the digest heard, and a digest that re-checked state when it sent.\n\n**Takeaway** (`course_of_action`): Review the next listing event design by asking which half it is missing.\n\n**Hand-off** to [System of Record and Read Models: Listing Data Management](listing-data-management.html): `cause_effect`: The stream moves changes and makes copies cheap, but it does not decide where the copies live, how stale each may be, or how an erasure reaches them. → Listing data management: the system of record and the registered copies, shown on the same bike held in seven places.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p68 | synthesis | Reliable publication and safe consumption are two halves that only work together, as the bike shows, so a design with both catches failures before buyers do and a review should begin by asking which half a design lacks. | scenario: The bike: ListingSold reaching the digest, and the digest re-checking state at send time. |  |\n| p69 | transition | The stream moves changes but does not decide where the copies live, how stale each may be or how an erasure reaches them, which listing-data-management takes up with the same bike held in seven places. |  | `contrast`: What the two halves of the stream achieve. → What the stream does not decide, and the chapter that answers it. |\n\n## Non-goals\n\n- Where copies live, consistency models, multi-region and GDPR erasure across copies. See [System of Record and Read Models: Listing Data Management](listing-data-management.html).\n- Behavioral tracking events, warehouse and data products. See [Data Platform for Marketplaces: Events, Lakehouse and Data Products](data-platform.html).\n- The lifecycle state machine and invariants themselves. See [The Listing Aggregate: Identity, Lifecycle and Invariants](listing-aggregate.html).\n- Publication stages and freshness SLAs; feed reconciliation. See [From Submitted to Searchable: The Publication Pipeline](publication-pipeline.html), [Many Doors In: Forms, APIs and Bulk Feeds](listing-ingestion.html).\n- Search index design and reindexing mechanics; alert fan-out. See [Search Architecture for Listings: Indices, Freshness and Scale](search-architecture.html), [Tell Me When It Appears: Saved Searches and Alerts](saved-searches-and-alerts.html).\n- The Yardstick strangler plan in full. See [Changing the Engine in Flight: Modernizing a Live Marketplace](modernization-and-migration.html).\n- The tenancy model itself (tenant as brand × country, configuration, release rings). See [One Platform, Many Marketplaces: Multi-Country and Multi-Brand Architecture](multi-country-platforms.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- No classifieds company has published its listing event names or topic layout; revisit if one does.\n- Whether the Veldmark envelope should adopt CloudEvents attribute names for partner-facing webhooks (not decided; v1 is internal only).\n- Hearthly's Pub/Sub bridge is a stated exception; its review date depends on the post-2028 cloud decision.\n\n## Decision log\n\n- **2026-10-19** — Recommended state-plus-delta events over thin notifications, because peak fan-out and self-healing dominate in listings; notification kept as the right choice only for sensitive or low-fan-out cases.\n- **2026-10-19** — Presented CDC and outbox as stages (CDC behind a translator during migration, outbox as target) rather than alternatives, following the platform brief.\n- **2026-10-19** — Kept behavioral tracking events off the listing stream and out of scope, to protect removal latency and keep data-platform's ownership clean.\n- **2026-10-19** — Used the March 2027 bike digest incident as the motivating story and replayed it as v1's acceptance test, rather than inventing a new incident.\n- **2026-11-12** — Converted spec.md's success criteria: the dual-write and CDC-as-source criteria became AC-4 (cold reader, minor); the schema-compatibility criterion became AC-5 (cold reader, minor); the evidence criterion became AC-6 (rubric, minor); the envelope and replay criteria are covered by the journal spec's AC-1; the ledger-match criterion was dropped (facts are governed by the scenario ledger, not by a reader outcome); the inventory criterion (tables, failure modes, view, questions) was dropped.\n- **2026-11-12** — Added three units to the published text: lead-ins to the trade-off table (p54) and vertical table (p57) so each table is introduced and explained, and a synthesis paragraph (p68); merged the one-sentence signpost 'Two choices in the envelope deserve justification.' into p23 (flow rubric note) so the conclusion synthesizes and calls back to the opening rather than only handing off. Added a roadmap sentence to p03 (the journal spec's AC-2 asks the opening to predict the sections) and a one-clause gloss of 'tenant' to p21, since multi-country-platforms defines it later.\n- **2026-11-12** — Thesis rubric (fresh agent, thesis object only): pass; its note that no supporting claim carried the Veldmark removal targets was taken (S4 now states them). Flow rubric (fresh agent, --flow output only): sound with notes. Taken: the one-sentence signpost merged into p23; p20 refocused on the translator and migration staging so it no longer repeats p10; p31 now names the three publication paths including Hearthly's bridge, which the broker trade-off later refers to; the in-practice section's pattern relabelled as grouping; the schema and replay sections' reasons now say what would break. Order unchanged. Notes not taken are in open_questions.\n- **2026-11-12** — Draft check round 1 escalated on spec faults (both flow readers): the removal service level (p53) was filed under replay and the client-analytics paragraph (p45) read as a digression at the end of schema evolution. Moved p53 to the end of the architecture section after the topics, and p45 into the event catalog after the exclusion of tracking events, with their transitions and the section ideas, flows and roadmap rewritten. FULL_TRANSITIVE before its explanation (also a spec fault) is handled in the draft with a one-clause gloss at p35 rather than a reorder. Intent, thesis, role and criteria unchanged.\n- **2026-11-12** — Draft check round 2 escalated on a spec fault (both flow readers): p48's evidence said a backfilled event carries the listing's current version, which contradicts Figure 4's backfilled v7 and makes correction backfills look useless. p48's evidence now says the event carries the version at which it was read, and the draft sentence was changed to match ('the listing's version *when it was read*'); the author should confirm this wording. Also reworded the failure-modes idea (each failure breaks one part of the design, not one half; a single-reader note) and the trade-off and vertical lead-ins and the conclusion so-what to match the revised draft. Round-2 draft fixes: the openings of Concepts, Architecture, In Practice and Replay now carry over the previous section; the Vinted 2026 quotes are explained; the Figure 2 caption points to the topics subsection; the 20:26 scam example is tied to the suspended account; the bike table's skipped versions are announced; the Chief Architect's opening no longer repeats its closing. Own additions trimmed to stay within the 7,778-word limit.\n- **2026-11-12** — Word limit: spec.md set none, so max_words is the published length by check_draft's count (7,408) plus 5%: 7,778.\n- **2026-11-12** — Resolved under the author's delegation (\"auto resolve all ESCALATE topics\"): the backfill sentence now says the backfilled event carries the listing's version *when it was read*, because the published 'current version' contradicted Figure 4's alt text (a backfilled v7 bouncing off a consumer at v9, distinct from a duplicate v9) and p48's evidence; corrected under the internal-arithmetic rule.\n- **2026-11-12** — Event-type count: the text now says twelve types, one per table row, with pausing and resuming one type with two names, matching the ledger's '12 domain event types', the twelve-row table and listing-aggregate; this supersedes the 2026-10-20 'thirteen' consistency fix. bounded-contexts still says thirteen; reported to the orchestrator as a ledger ruling.\n- **2026-11-12** — The removal-objective example no longer reuses the phishing account's 20:26 suspension time for a hypothetical scam listing; it uses no clock time ('half an hour after its account is suspended'). The digest assembly time is now the ledger's 17:30 Monday (was 'Monday afternoon'), and Figure 3's caption says 'thirteen and a half hours' (17:30 to 07:00), matching saved-searches-and-alerts.\n- **2026-11-12** — Corroborated flow points fixed in the draft without reordering, accepted under the author's delegation, 2026-11-12: FULL_TRANSITIVE at p35 now carries its one-clause reason; the versions 4-7 reason moved into the note before Figure 3; the Protobuf sentence marks Protobuf as a format the contract does not use; the Debezium outbox router and 'compacted topic' in Concepts and the CDC paragraph carry forward pointers; 'the bike problem in miniature' became 'the bike's outcome, from a different cause' (p15 evidence changed to match); 'Two exclusions' became 'Two boundaries'; the roadmap names the source kinds AC-2 expects (Adevinta, Kleinanzeigen, Vinted, AutoScout24, mobile.de, Confluent and Debezium documentation).\n- **2026-11-12** — Word limit raised by 10% under the delegation's rule 2, from 7,778 to 8,555, to make room for these fixes; no published text was cut.\n- **2026-11-12** — Flow-rubric notes not taken (removal objective placement, Keybridge paragraph, client-tracking paragraph, two-row prose of the trade-off and vertical tables, two-halves frame planted in KEY POINTS) are accepted under the author's delegation, 2026-11-12 as recorded; the order is unchanged.\n- **2026-11-12** — Modalities: none exists in the folder; left empty, accepted under the author's delegation, 2026-11-12; writing them stays a separate request.\n\n## Sources\n\n- **Internal**\n  - listing-aggregate — Lifecycle and invariants the events publish.\n  - publication-pipeline — Publication stages and freshness objectives.\n  - bounded-contexts — Published language and anti-corruption layers.\n  - listing-data-management — The next chapter, which inherits the copies this one creates.\n  - _research/brief-platform-data-ml.md Part 2; _research/brief-listing-data-ingestion.md Parts 5–6 — Platform and ingestion research behind the design.\n  - _research/scenario-ledger.md — The bike and Golf timings, the 1 July 2027 go-live, Kafka on Confluent Cloud, contract v1's topics, volumes and objectives, Motorvane's feed figures.\n- **External**\n  - Debezium, Outbox Event Router (n.d.) — Outbox columns and keying.\n  - Confluent, Schema Evolution and Compatibility; Log compaction (n.d.) — Compatibility modes, tombstones.\n  - Martin Fowler, What do you mean by \"Event-Driven\"? (2017) — Notification versus state transfer.\n  - Adevinta Tech Blog (2022, 2024, 2025), Vinted Engineering (2019, 2023, 2026), AutoScout24 Tech Blog (2018), mobile.de Seller-API (n.d.), Google Search Central (2026) — Documented Kafka, CDC, read models and contracts; bump versus creation; expired job postings.\n\n## Changelog\n\n- **2026-11-12** — Orchestrator review: reverted the backfill-version wording to the published text; the suspected contradiction with Figure 4 is in open_questions for the author. Check report stale.\n- **2026-10-19** — Initial spec and article. (AI-mediated session)\n- **2026-10-19** — Editorial review pass: corrected the Kleinanzeigen Debezium quote, fixed a table-row reference, flagged 2022 Adevinta evidence as older, expanded SLO, American spelling. (AI-mediated session)\n- **2026-10-19** — Added 2 inline illustrations (article-illustrator); figures renumbered. (AI-mediated session)\n- **2026-10-20** — Cross-chapter consistency sweep: 2 headings aligned with the book's shared section names, glossary terms and source-group structure; no body text changed. (AI-mediated session)\n- **2026-10-20** — Sharpening pass: 6,291 → 6,324 prose words; lead places the chapter as Part VII's first contract; 1 heading renamed; 7 paragraph openings brought to their point; 2 paragraphs split. (AI-mediated session)\n- **2026-10-20** — Consistency fix: event catalog count corrected to thirteen types (pause and resume share a table row). (AI-mediated session)\n- **2026-10-20** — Replaced 2 mermaid diagrams with generated illustrations (figure numbers and captions unchanged; sources archived in _research/mermaid-figures.json). (AI-mediated session)\n- **2026-10-21** — Renamed failure patterns to match where-listing-systems-go-wrong. (AI-mediated session)\n- **2026-11-12** — Converted spec.md to spec.json (outcome-spec pipeline): paragraph-level reconstruction, intent, thesis and role copied from journal-spec.json, success criteria rewritten as AC-4 to AC-6, three units added (two table lead-ins, a synthesis); after draft check round 1, p53 and p45 moved; three draft-check rounds run, escalated at round 3. (AI-mediated session)\n- **2026-11-12** — Escalations resolved under the author's delegation: backfill version wording, event count (twelve), 20:26 example, digest timing, corroborated flow points, AC-2 source kinds; max_words 8,555. (AI-mediated session)\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
