<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21, revised 2026-10-21), which it replaces. Intent outcome, acceptance criteria AC-1 to AC-3, the thesis and the role are copied unchanged from the listing-data-management entry in journal-spec.json. Added units: the roadmap paragraph p04, lead-ins p40 (trade-off table) and p42 (vertical table), lead sentences to the failure-mode list (p44) and the questions (p51), and the synthesis paragraph p52; see decision_log.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** System of record, read models and copies; staleness budgets per read path and the consistency each reader needs (read-your-writes for sellers, bounded staleness for buyers, tighter limits for removals).\n- **Know:** Partitioning by country, regions and tenancy; retention and archives across the life of a listing record, per data class.\n- **Know:** Erasure as a workflow with receipts under GDPR Articles 12, 17 and 19; corrections, backfills and the consumer registry as a data contract.\n- **Believe:** A copy that cannot be rebuilt or cleaned is a liability, not an asset.\n- **Believe:** Retention and erasure are decided per data class, not per database.\n- **Be able to:** List every copy of a listing with its owner, source, staleness budget, rebuild path and retention rule.\n- **Be able to:** Design an erasure workflow that closes only when every copy has answered deleted, anonymized, retained with a legal basis, or not held.\n- **Be able to:** Decide which data-management rules are group decisions and which each brand keeps.\n\n**Audience:** Chief and principal architects, data and platform leads, and privacy engineers in multi-brand marketplace groups.\n\n**Already knows:**\n\n- APIs, databases, event streams, search engines and Kubernetes (the book's baseline), including CQRS and Kafka log compaction.\n- From earlier chapters: the listing aggregate and its lifecycle, the publication pipeline and its consumer registry, the listing event stream with its outbox, envelope, version gate, compacted state topic, backfill topic and ListingErased event (event-driven-listings), Safe Deal, VIN decoding, trust-and-safety cases and statements of reasons.\n- Veldmark, its brands (Tradeyard, Motorvane, Hearthly), Yardstick, Valuo, the cast (Ingrid Halvorsen, Lucía Ortega, Daan Visser, Sven Lindqvist, Aisha Rahman, Tomasz Wiśniewski), the Rotterdam bike and the failure-pattern names.\n\n**Does not yet know:**\n\n- System of record as defined here (one authoritative owner per fact) and the seven kinds of copy.\n- Staleness budget; read-your-writes, monotonic reads, bounded staleness and removal priority as user-facing promises.\n- Erasure case, erasure ledger and crypto-shredding.\n- The GDPR, DSA and Dutch retention rules as they bear on listing data.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given an erasure request and a stale read path, the reader names the registry entry and workflow step that handle each. *Probe:* A seller who sold an item through the platform's payment service six months ago asks for her personal data to be erased. Her listing still exists in the listing database, a public sold page, the media store, the warehouse, a fraud case in which she reported a scammer, the payment records and an e-mail provider's logs, and finding these took two days. Separately, sellers complain that an edit they just saved is missing from their own listing page. Using only this chapter: how should the request be handled, and what fixes the sellers' complaint? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-4 | Given a set of stores that hold listing data, the reader says which can be rebuilt from the system of record and what governs each one that cannot. *Probe:* A marketplace holds listing data in a MySQL read replica, a search index, a Redis cache, an archive of sold listings kept for disputes, a store of fraud-case evidence, a data warehouse and an e-mail provider's delivery logs. Using only this chapter: which of these can be dropped and rebuilt from the listing system of record, and what has to be written down for each one that cannot? | `custom` | cold_reader | minor |\n| AC-5 | Given a multi-country group with all countries in one database, the reader chooses a partitioning scheme and a region strategy and says when the alternative is right. *Probe:* A classifieds group runs four countries' listings in one database cluster; the largest country's weekly peak sets capacity and maintenance windows for the others. An engineer proposes hash-sharding all listings by listing ID across countries, and another proposes writing listings in several regions at once. Using only this chapter: what would you choose instead, and when would each proposal be right? | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** Where does listing data live, who owns it, and how do the copies stay consistent?\n\n> **Claim:** Each listing fact should have one system of record where a change becomes true, and every other store that holds listing data (search index, page cache, media, warehouse, trust-and-safety evidence, payment records, partner and e-mail copies) should be a copy registered before it gets access, with an owner, a source, a staleness budget per read path, a rebuild path and a retention rule per data class; consistency is then a written promise per read path (read-your-writes for sellers, bounded staleness for buyers, tighter limits for removals), and erasure is a workflow in which every registered copy returns a receipt (deleted, anonymized, retained with a named legal basis, or not held) to an erasure ledger before the case closes.\n\n**Disputed by:** The view that consistency is a property of the database and its replication settings, that each copy is the business of the team that made it, and that erasure is a delete statement against the main database, with code search used to find the rest.\n\n**So what:** A Chief Architect who accepts this makes one system of record per fact, the consumer registry with registration before access, the consistency promise per read-path class, the retention schedule by data class, the erasure workflow and ledger, and a restore procedure that replays erasures into group decisions; has the architecture advice forum review every new kind of store; refuses a migration plan that lacks the registry and the ledger; and watches staleness per read path, unregistered consumer groups (target zero), erasure cases closed within deadline and the rebuild time of each read model, tested twice a year.\n\n**How and why:** When Femke asked on 6 September 2027 for her data to be erased, two engineers needed two days to list seven places that still held her bike six months after the sale: two public copies still showed personal data (her name and neighborhood on the sold page, home GPS in the original photos' EXIF), two could not be deleted by law (the fraud case, kept until March 2029, and the Safe Deal records, kept seven years), and one sat with the e-mail provider. Under the workflow each copy returned a receipt and the response went out on 15 September, nine days after the request. Tradeyard receives about 1,900 erasure requests a month, so the second request must take no investigation.\n\n**Supporting claims**\n\n- **S1** — Each listing fact has one system of record where a change becomes true, written in one place per listing even across countries and regions, and every other store is a copy derived from it.\n- **S2** — Every copy is registered before it gets access, with an owner, a source, a staleness budget, a rebuild path and a retention rule; a copy that cannot be rebuilt must be governed, and corrections are made at the system of record, not in the copy.\n- **S3** — Consistency is a written promise per read path (read-your-writes for sellers, monotonic and bounded staleness for buyers, tighter limits for removals), implemented with a known mechanism and measured.\n- **S4** — Retention is set per data class, not per database, because one closed listing holds classes with different lawful lifetimes.\n- **S5** — Erasure is a workflow in which every registered copy returns a receipt (deleted, anonymized, retained with a named legal basis, or not held) to an erasure ledger before the case closes.\n\n## Role in the part\n\nRegisters every copy the stream makes possible, with the staleness, rebuild, retention and erasure promises that keep copies consistent and lawful. Supports P7-2 of part `part-7`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `grouping` in trade-offs, verticals, failure-modes, ca-view, questions: the book's standard judging sections)\n\nThe scene poses the question with seven copies; concepts supply the system of record, copy kinds and staleness budgets that every later section uses; architecture places the stores and the mechanisms and closes with the registry entry, whose fields it has just introduced and on which erasure relies; partitioning then places the system of record; retention sets the periods that erasure then applies; erasure needs both the registry and the retention schedule; corrections come last among the design sections because they reuse the registry and the backfill path. The public evidence follows the design sections it supports and precedes the judging sections, so it reads as support for decisions already explained rather than as an interruption (both flow readers in all three draft-check rounds found it unclear between architecture and partitioning). Putting erasure before retention would ask the reader to judge 'retained with legal basis' before knowing the periods; the retention section says the schedule was adopted after Femke's case and made its periods policy, so the dates run forward. The Vitess evidence sits in partitioning, where it is used.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): The event stream made it easy for any system to keep its own copy of a listing. The price of that independence is copies, and copies raise three questions events alone do not answer: which copy is right, how wrong may the others be, and how does a deletion reach all of them?\n\n**Bridge:** Architects who have just built one owned listing event stream that search, alerts, trust and safety, SEO, analytics and partners consume. → The copies that stream creates, and who owns, bounds and cleans each one.\n\n**Thesis statement** (KEY POINTS callout (three bullets), with WHY ARCHITECTS SHOULD CARE stating the problem.): One system of record per listing and every other store a registered copy with an owner, source, staleness budget and rebuild path; consistency as a per-read-path promise; retention and erasure designed per data class, with a receipt from every copy owner.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p04, which names the sections in order and the kinds of evidence.):\n\n- Follow one sold bike Veldmark found in seven places. *Kept in:* scene.\n- Define the system of record, read models and consistency promises. *Kept in:* concepts.\n- Show the architecture that keeps them, including the consumer registry. *Kept in:* architecture.\n- Partition listing data by country and region. *Kept in:* partitioning.\n- Retain and archive closed listings per data class. *Kept in:* retention.\n- Propagate erasure to every copy. *Kept in:* erasure.\n- Correct errors at the source. *Kept in:* corrections.\n- Give the public evidence from Vinted and Adevinta behind the design. *Kept in:* in-practice.\n- Close with trade-offs, vertical differences, failure modes, the Chief Architect's view and review questions. *Kept in:* trade-offs, verticals, failure-modes, ca-view, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | The previous chapter's event stream lets every system keep its own copy of a listing, and those copies raise three questions events alone do not answer: which copy is right, how wrong may the others be, and how does a deletion reach all of them. | reasoning: Search, alerts, trust and safety, SEO, analytics and partners each need listing data in a different shape and build it from the stream instead of calling the listing service at the Sunday-evening peak. |  |\n| p02 | claim | The answers to those three questions decide concrete outcomes: whether buyers see a price that changed ten minutes ago, whether a sold car appears in tomorrow's alert, whether the search index can be rebuilt after a bad mapping change, and whether an erasure request can be completed and proven within the month the law allows. | example: Four outcomes: a changed price, a sold car in an alert, a rebuild after a bad mapping change, an erasure within a month. | `cause_effect`: The three questions. → What depends on their answers. |\n| p03 | context | The chapter owns the listing system of record, read models and erasure propagation, builds on the lifecycle and the event contract, leaves four neighbouring topics (the search index, analytical copies, legal obligations and failover) to their chapters, and sets rules that web-and-seo-architecture and modernization-and-migration depend on, in short sentences that gloss the consumer registry, erasure ledger and Yardstick. | reasoning: listing-aggregate and event-driven-listings are assumed; search-architecture, data-platform, marketplace-regulation and reliability-and-scale own neighboring topics; web-and-seo-architecture keeps a sold page's URL without the seller's data and modernization-and-migration carries the copy register and erasure ledger through Yardstick's retirement. | `elaboration`: Listing data management as the discipline that answers the questions. → What this chapter owns and what it leaves to others. |\n| p04 | transition | The chapter follows one sold bike that Veldmark found in seven places through the concepts, the architecture, partitioning, retention, erasure and corrections, then the public evidence behind them, and closes with trade-offs, vertical differences, failure modes, the Chief Architect's view and review questions, using GDPR, the Digital Services Act, Dutch record-keeping rules, Vinted and Adevinta sources and the fictional Veldmark as evidence. | reasoning: The sections in order and the kinds of evidence the chapter uses. | `sequence`: The chapter's scope. → The order in which it is covered. |\n\n## Sections\n\n### Setting the Scene at Veldmark: Seven Copies of One Bike\n\n**Controlling idea** (`example`, id `scene`): In September 2027 one erasure request shows that nobody at Veldmark knew where a sold listing lived, and that its seven copies need different answers.\n\n**Advances the thesis** (S2, S5): Poses the chapter's question as one concrete request that exposes every copy at once.\n\n**Transition in:** `example`: The roadmap's first promise: one sold bike in seven places. → Femke's erasure request.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | example | On Monday 6 September 2027 Femke asks Tradeyard to erase her personal data, and Lucía Ortega asks Ingrid Halvorsen to find every place her sold bike listing exists before anyone answers. | scenario: Femke, the Rotterdam seller whose €240 bike sold for €225 in March, closes her account and invokes GDPR Article 17; Lucía Ortega, group data protection officer, forwards it to Ingrid Halvorsen with a one-line note. |  |\n| p06 | evidence | Two days later Daan Visser and Sven Lindqvist list seven places that still hold the listing six months after the sale, each with a different store and owner. | table: Seven copies: Yardstick SoR, sold-listing page, media, Snowflake warehouse, T&S case, Safe Deal records, alert digest archive and e-mail provider logs, with store, contents and owner. | `time`: Ingrid's question. → The answer her team produces two days later. |\n| p07 | analysis | Four observations make the list a design problem rather than a ticket: nobody had it, two public copies still show personal data, two copies must not simply be deleted, and one is held by a third party, which yields the chapter's question. | figure: Figure 1: the sold bike with seven echo copies around it. | `cause_effect`: The seven-row table. → What the table reveals and the question it poses. |\n\n### Concepts: System of Record, Read Models and Copies\n\n**Controlling idea** (`definition`, id `concepts`): One system of record per listing fact, copies of seven kinds that are either rebuildable or governed, and consistency expressed as staleness budgets per read path.\n\n**Advances the thesis** (S1, S2, S3): Defines the vocabulary every later section uses.\n\n**Transition in:** `problem_solution`: The question the seven copies pose. → The terms that answer it: system of record, copy kinds, staleness.\n\n**Order of paragraphs** (`prerequisite_order`): The system of record comes first because copies are defined against it; the kinds of copy and the rebuildable-or-governed rule follow; consistency comes last because staleness is measured between the system of record and a copy.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | definition (list) | The listing system of record is the one store where a change becomes true, and it alone accepts writes, is complete for the listing's own data, and need not be one database as long as no listing is authoritative in two places. | reasoning: Three properties as a list: only writer; complete (a field that exists only in a read model makes it unrebuildable); one owner per fact, with Tradeyard in Yardstick and Motorvane in its listing service during migration. |  |\n| p09 | explanation | The listing system of record is authoritative for the listing only; the facts it references (seller account, paid products, canonical property, moderation decisions) have their own systems of record and are outside this chapter. | reasoning: Links to sellers-and-accounts, products-and-entitlements, entity-resolution and trust-and-safety-architecture. | `contrast`: The system of record's authority. → Its limit: referenced facts with their own owners. |\n| p10 | definition | A read model is a rebuildable copy shaped for one way of reading, and in listing marketplaces CQRS is the only way one record can serve search, maps, alerts, detail pages and a warehouse, at the price Fowler names: many copies. | quotation: Martin Fowler (2017): event-carried state transfer means \"lots of data schlepped around and lots of copies\". | `sequence`: The system of record. → The copies derived from it. |\n| p11 | comparison | Not every copy is a read model: seven kinds of copy differ in whether they can be rebuilt from the system of record and so in the rule that governs each. | table: Replica, read model, cache, archive, evidence store, analytical copy and external copy, with definition, rebuildability, Tradeyard example and governing rule. | `contrast`: Read models as rebuildable copies. → Copies that are not rebuildable. |\n| p12 | recommendation | The author's rule is that every copy must be either rebuildable, so its only problem is freshness, or governed, with an owner, purpose, retention and deletion path written down before it exists in the consumer registry, whose extended entry the architecture section shows. | reasoning: A rebuildable copy can be dropped and recreated; an archive, evidence store or external copy cannot. | `conclusion_summary`: The seven kinds of copy. → The one rule that covers them. |\n| p13 | definition (list) | Users experience staleness rather than database consistency, and four promises cover nearly every listing read path: read-your-writes, monotonic reads, bounded staleness and removal priority. | reasoning: Each promise as a list item with the read path it serves and what breaking it produces (support tickets, distrust, a known maximum lag, showing what should be gone). | `sequence`: Copies and their freshness problem. → How freshness looks to users. |\n| p14 | definition | A staleness budget is the written maximum lag for one read path with the measurement that proves it, and it connects the event architecture to the user experience. |  | `elaboration`: The four promises. → The budget that makes each one measurable. |\n\n### Architecture: One System of Record, Registered Read Models\n\n**Controlling idea** (`description`, id `architecture`): Around one relational system of record sit stores with distinct roles, staleness budgets and removal paths, each consistency promise has a standard implementation, the search index must stay a rebuildable read model, and the consumer registry records every copy before it gets access.\n\n**Advances the thesis** (S1, S2, S3): Shows the concepts as stores, budgets and mechanisms the reader can build.\n\n**Transition in:** `sequence`: The concepts and the staleness budget. → Where the stores sit and how each promise is kept; the section opens by saying the concepts now need stores.\n\n**Order of paragraphs** (`large_to_small`): The whole store landscape first, then the mechanism for each promise in the order the concepts named them, then the one store most likely to break the rules, and last the registry entry that holds every store to them, so the erasure and correction sections can use the registry as known.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p15 | description | Listing marketplaces are polyglot by necessity: the author's generic domain model, stated in its own sentence as describing no Veldmark system, puts one relational system of record with a search projection and a change event at the core (Yardstick uses MySQL and Solr for the same shape), surrounded by store types each with a role, a removal path and the staleness budget Veldmark sets for it across its brands (a year marking a target not yet met); the GDPR Art. 19 notice is glossed with a pointer to the erasure section. | table: Ten store types with what they hold, role, typical staleness budget at Veldmark (search additions 90 s p95, removals 30 s p99; cache 5 s; CDN 60 s; warehouse hourly) and how removal or erasure reaches them.; figure: Figure 2: one listing, many copies, each with a promise. |  |\n| p17 | process | Read-your-writes for sellers is cheapest from the system of record or a synchronous replica, and where a read model is needed a returned listing version with fallback to the system of record keeps the promise exact. | scenario: A dealer's inventory screen backed by search because it filters 3,000 cars. | `sequence`: The stores and their budgets. → How each promise is kept, starting with read-your-writes; the paragraph opens by saying each promise has a standard implementation. |\n| p18 | process | Monotonic reads for buyers come from session affinity or, better, version-aware caches that never replace a newer version with an older one. | reasoning: Version-aware caches also protect against backfills delivering old state late, described in event-driven-listings. | `sequence`: Read-your-writes for sellers. → Monotonic reads for buyers. |\n| p19 | process | Bounded staleness is measured, not assumed, with a synthetic listing per tenant created, repriced and removed every minute. | scenario: Veldmark's search team alarms when observed lag exceeds the budget; the same probe measures the CDN purge. | `sequence`: Monotonic reads. → Bounded staleness. |\n| p20 | process | Removal priority puts removal events on the fast path everywhere, and a sold page kept for SEO is a different, policy-chosen page rather than the old page left in cache. | example: Copy 2 in Femke's case, the public sold page. | `sequence`: Bounded staleness. → Removal priority, the last promise. |\n| p21 | claim | The search index is the copy most likely to stop being a read model, and the test is whether it can be deleted and rebuilt from the system of record and the stream without loss. | source: Vinted's 2024 move from Elasticsearch to Vespa behind a search contract in a Go gateway. | `emphasis`: Read models in general. → The read model most at risk: the search index (Search as System of Record). |\n| p38 | definition | Every copy needs a registry entry: the consumer registry entry from publication-pipeline, which names a consumer, its events, its removal objective and its owner, gains five fields for every store holding listing data (source, staleness budget, rebuild path, retention and erasure handler); the chapter uses the one name 'consumer registry' throughout. | table: Tradeyard search index NL entry: owner Tomasz Wiśniewski's group search platform; source listing.events.v1; budget 90 s p95 additions, 30 s p99 removals; rebuild 5 h 40 min; erasure handler delete on ListingErased. | `cause_effect`: The index, and every copy, must stay rebuildable or governed. → The registry entry that records how; it opens by saying every copy needs one. |\n| p39 | analysis | The registry is the data-contract idea applied to read models, and making registration a precondition for topic access keeps it true, with 64 copies registered by December 2027. | source: Adevinta Spain (2024): immutable, versioned contracts with schema, personal-data fields, owner, service levels and retention.; scenario: 64 registered copies of listing data across the group by December 2027; no entry, no credentials. | `similarity`: The registry entry. → Data contracts elsewhere and how Veldmark enforces its own. |\n\n### Partitioning, Regions and Tenancy\n\n**Controlling idea** (`recommendation`, id `partitioning`): Country is the natural tenancy boundary for listing data and each brand writes its system of record in one region, so isolation, residency and erasure duties follow the source.\n\n**Advances the thesis** (S1): Places the one system of record per listing: one country partition and one write region, with replicas inheriting its obligations.\n\n**Transition in:** `sequence`: The architecture's stores, now in place. → How to divide the system of record across countries and regions, named in the opening as the first placement decision.\n\n**Order of paragraphs** (`comparison`): The options table first, then the Veldmark case and the counter-case side by side, then regions, which builds on the partitioning choice.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p24 | comparison | Classifieds are country businesses, so country is the natural tenancy boundary and listing ID the partition key within it, and a database or schema per country fits most multi-country classifieds. | table: Four partitioning choices (one database, per country, global hash, country then hash) with benefits, costs and when each is right. |  |\n| p25 | example | Tradeyard shows the cost of one database for all countries and its new listing service will use one schema per country so a country can later move without a data migration; Vinted met the same capacity pressure at larger scale and answered it the other way, sharding inside one cross-border catalog, which the stated answer leads before the Vitess numbers. | scenario: Yardstick holds four countries in one MySQL cluster; the Netherlands' 6.1 million live listings and Sunday-evening peak set capacity for Portugal's 1.1 million; the new service in Q2 2028 uses one schema per country.; source: Vinted Vitess series (2023): 42 hand-managed servers, 23 vertical shards, a 3 TB table. | `example`: The table's first row. → Tradeyard as a case of it. |\n| p26 | counterargument | Vinted kept one catalog because its members widely buy across borders, which makes it the counter-case to country partitioning, with a single write primary and replicated projections, so the choice follows the business. | source: Vinted's 2026 posts. | `contrast`: Vinted's choice to shard inside one cross-border catalog. → The reason for that choice (cross-border buying), stated first, and Vinted as the counter-case. |\n| p27 | recommendation | Each Veldmark brand writes its system of record in one EU location without multi-writer replication, following Vinted's documented reasoning, and every replica and backup in a recovery region inherits the source's retention and erasure obligations. | scenario: Yardstick in Amsterdam until moved to AWS eu-west-1, Motorvane on AWS eu-central-1, Hearthly on Google Cloud europe-west1.; quotation: Vinted (2026): a single write site \"avoided the complexity and operational cost of a fully sharded, multi-writer system\", \"hard to justify unless the business absolutely demands it\". | `sequence`: Partitioning within a region. → Where the regions are and what replicas inherit. |\n\n### Retention, Archives and the Life of a Listing Record\n\n**Controlling idea** (`claim`, id `retention`): A listing record holds data classes with different lawful lifetimes, so retention is a schedule per data class with its own lifecycle events, not one rule per database.\n\n**Advances the thesis** (S4): Establishes retention per data class and the events copies act on.\n\n**Transition in:** `cause_effect`: Replicas and backups inherit retention obligations. → What those obligations are, per data class; the opening sentence picks up the inherited obligations.\n\n**Order of paragraphs** (`problem_solution`): The legal pull in two directions first, then the schedule that resolves it, then the judgement rows, then the lifecycle that makes the schedule executable; the lifecycle cannot be read before the per-class periods exist.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p28 | evidence | Storage limitation and accountability under GDPR, the DSA's complaint window and trader-data rule, and Dutch seven-year record keeping pull in different directions, so retention is set per data class and one listing touches several classes. | source: GDPR Art. 5(1)(e) and 5(2).; source: DSA Art. 20 (at least six months to complain) and Art. 30(5) (trader data six months after the relationship, then deleted).; source: Ondernemersplein: seven years for business administration. |  |\n| p29 | example | Veldmark's retention schedule sets a period and an end state for each data class of a closed listing; the paragraph states the chronology once and forward (Femke's September 2027 request was answered with these periods, and the schedule adopted in October made them group policy), which also explains the scene's six-month-old originals against the 90-day row. | table: Seven classes: public content 13 months then anonymized; seller personal data until the sold page is retired, at most 13 months; original photos 90 days; listing history 13 months with seller ID; T&S evidence 24 months after case closure; transaction records 7 years; behavioral data per the tracking plan. | `example`: The rule that retention is per data class. → Veldmark's schedule as an instance. |\n| p30 | analysis | Two rows trade business value against privacy: anonymized price history survives because valuation models need it, and sold pages expire within 13 months even when they rank. | figure: Figure 3: four ribbons for photos, content, evidence and payments with 90 days, 13 months, 24 months and 7 years. | `elaboration`: The schedule. → The two rows that are judgement calls. |\n| p31 | process | The record's data lifecycle runs after the business lifecycle ends, through closing, archiving, erasure or anonymization and evidence holds, and each transition, including ListingErased, is an event copies follow without a separate integration. | figure: Figure 4: closing starts retention clocks; archiving reduces fields; erasure and anonymization remove identity; a hold pauses the clocks. | `sequence`: Retention periods per class. → How a record moves through them as events. |\n\n### Erasure Propagation\n\n**Controlling idea** (`process`, id `erasure`): GDPR's erasure articles describe a workflow in which every copy returns a receipt to an erasure ledger, which answered Femke in nine days and must answer the next request without investigation; backups, logs and immutable stores need their own mechanisms.\n\n**Advances the thesis** (S5): Turns erasure into a workflow with receipts and applies it to the seven copies.\n\n**Transition in:** `cause_effect`: The registry shown at the end of the architecture section, retention per data class and the ListingErased event. → An erasure request, which tests both the registry and the schedule.\n\n**Order of paragraphs** (`large_to_small`): Law, then the workflow it implies, then the workflow run on Femke's case in order of days; the stores the workflow cannot reach directly come last as a residual group, because they make sense only once the normal path is known.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p32 | evidence | GDPR sets deadlines, exceptions and notification duties for erasure: without undue delay, a response within one month extendable by two, exceptions for legal obligations and legal claims, and duties to inform other controllers and recipients. | source: GDPR Art. 17(1), 12(3), 17(3), 17(2), 19. |  |\n| p33 | process (list) | Read as architecture, those articles describe a six-step workflow (intake, scope resolution, fan-out, execution per copy, external copies, proof) that closes only when every registered copy has answered. | figure: Figure 5: systems of record act first and emit events; every copy reports to the erasure ledger; the case closes when the ledger is complete. | `cause_effect`: The articles. → The workflow they imply. |\n| p34 | example | Applied to Femke's seven copies in September 2027, the workflow gives the outcomes sent to her, each with its basis; the placeholder (tombstone) seller ID is distinguished from the Kafka tombstone. | table: Anonymized SoR; sold page deleted with 410, CDN purge and removal request; media deleted; warehouse anonymized; T&S case retained to March 2029 under Art. 17(3)(e); Safe Deal records retained 7 years under Art. 17(3)(b); digest and e-mail logs deleted, provider confirmed day 9. | `example`: The workflow. → The workflow applied to the seven copies. |\n| p35 | analysis | The first answer cost nine days, two of them spent finding the copies, a cost the outcome table does not show; with about 1,900 requests a month the next one must take no investigation, because the registry already lists the copies. | scenario: Response on Wednesday 15 September 2027; two days of investigation the first time; about 1,900 erasure requests a month. | `time`: The outcomes per copy. → When Femke was answered and what the second case must cost. |\n| p36 | process (list) | Backups, event logs and long-lived immutable stores resist erasure by design and are handled by expiry with ledger replay on restore, public-state-only events with tombstones, and crypto-shredding only where immutability is required. | scenario: Backups expire after 35 days at Veldmark; events topic 14 days; tombstone on the compacted state topic on ListingErased. | `contrast`: Copies that a handler can clean. → Stores that resist erasure. |\n\n### Corrections and Backfills\n\n**Controlling idea** (`recommendation`, id `corrections`): Corrections are made at the system of record and flow to the copies through the backfill topic, never patched in a read model.\n\n**Advances the thesis** (S2): Keeps copies rebuildable by fixing errors only at the source.\n\n**Transition in:** `similarity`: Erasure as a change that must reach every copy, and the rule from 'The index is a read model' that a copy patched in place is no longer rebuildable. → Corrections, which must reach every copy the same way and keep read models rebuildable ('Like erasures, corrections must reach every copy, and they test the rule from \"The index is a read model\"').\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p37 | example | Bulk errors are corrected at the system of record and flowed through the backfill topic, not patched in the read model that shows them. | scenario: August 2027 Motorvane VIN-decoder release mapped fuel type wrongly on about 41,000 listings; fixed with cause = correction and the backfill topic; patching Motorvane's Elasticsearch index would have been a day faster and undone by the next feed update. |  |\n\n### In Practice: What Marketplaces Have Documented\n\n**Controlling idea** (`evidence`, id `in-practice`): The sparse public evidence from Vinted and Adevinta supports the design just described (single writers, external read models, compacted topics, personal-data splits), but no marketplace documents a full copy inventory, retention schedule or erasure workflow.\n\n**Advances the thesis** (S1, S3, S5): Grounds the design sections in dated public sources and marks which parts are judgement.\n\n**Transition in:** `additional_support`: The design sections, from the system of record to corrections. → What real marketplaces have published in support of it; the opening says two of these sources were already quoted where the design used them (Vinted's single-writer reasoning under regions, Adevinta Spain's data contracts under the registry) and that this section gathers all the evidence in one place, adding what the same sources say about read models and personal data.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p22 | evidence (list) | Gathered in one place, with pointers back to where two of them were quoted, the public first-hand evidence is sparse: Vinted and Adevinta document a single writer with replicated projections, read models in external stores, compacted topics as views and a personal-data split in the analytical copy. | quotation: Vinted (2026): \"all writes happen in the primary site and read-only projections are replicated around the world\"; eventual consistency built in.; source: Vinted (2023): Redis read models built by Flink from CDC; large Flink state avoided.; source: Kleinanzeigen via Adevinta (2025): compacted topic as a re-consumable view.; source: Adevinta Spain (2024): personal fields removed or split into a partitioned table to ease the right to be forgotten. |  |\n| p23 | transition | No source documents a full copy inventory, retention schedule or erasure workflow, so those parts of the design are reference-architecture judgement tested against Veldmark. |  | `contrast`: What the sources document. → What they leave out, and which parts of the design are therefore judgement. |\n\n### Trade-offs\n\n**Controlling idea** (`comparison`, id `trade-offs`): Eight recurring decisions each have a default and a condition under which the alternative is right, and the most contested is whether sold pages stay public.\n\n**Advances the thesis** (S1, S2, S3, S4, S5): Turns the chapter's rules into choices with stated conditions.\n\n**Transition in:** `conclusion_summary`: The rules of the design sections, with the evidence behind them. → The decisions a group applying the chapter's rules still faces and when each option is right.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p40 | comparison | Eight decisions recur when a group applies the chapter's rules, and for each the table says when each option is right, with the bold option as the author's default for a multi-country classifieds group. | table: Seller-facing reads, detail pages, partitioning, regions, closed listings, erasure in backups and long-lived stores, analytical personal data and sold pages, each with two options and conditions. |  |\n| p41 | analysis | The sold-page row is the most contested: SEO value argues for keeping pages, and the data-management position is that the page's content follows the retention schedule even when its URL lives on. |  | `emphasis`: The eight rows. → The one most disputed in practice. |\n\n### Vertical Differences\n\n**Controlling idea** (`comparison`, id `verticals`): Verticals differ in how much personal data a listing carries and what outlives it, and real estate shows that removing names does not anonymize price history.\n\n**Advances the thesis** (S4, S5): Shows where retention and erasure rules bend by vertical.\n\n**Transition in:** `contrast`: The general trade-offs. → How they differ by vertical.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p42 | comparison | The verticals differ in the share of personal data in listings, what outlives the listing, the hardest erasure problem, the read model that matters most and the value of the archive. | table: General classifieds, real estate, automotive and jobs compared on five aspects. |  |\n| p43 | analysis | In real estate an address, surface and price history can identify an owner without a name, so anonymization must be tested against re-identification, with aggregation or a documented legitimate interest as the options. | scenario: Hearthly keeps anonymized price history for Valuo's estimates. | `example`: The vertical table's real-estate column. → The hardest case in detail. |\n\n### Failure Modes\n\n**Controlling idea** (`analysis`, id `failure-modes`): The common failures are the chapter's rules broken one at a time, each with its control.\n\n**Advances the thesis** (S2, S3, S4, S5): Shows what happens when each rule is missing.\n\n**Transition in:** `cause_effect`: The decisions and their conditions. → What goes wrong when they are not made.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p44 | analysis (list) | Ten failures recur, from the unregistered copy and Search as System of Record to anonymization that is not, and each breaks one rule of the chapter. | example: The unregistered copy, Search as System of Record, broken read-your-writes, replica flapping, caches without removal paths, retention by database, restore without replay, forgotten external copies, patching the read model, false anonymization. |  |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `ca-view`): Data-management decisions are few but group-wide: what to decide centrally, what to leave local, who resolves conflicts, what to watch, and that copies outlive the systems that made them.\n\n**Advances the thesis** (S1, S2, S3, S4, S5): Converts the rules into group governance.\n\n**Transition in:** `problem_solution`: The failures. → The few group decisions that prevent them; the opening says so.\n\n**Order of paragraphs** (`grouping`): The book's standard order for this section: what to decide centrally, what to leave local, who decides on conflicts, what to watch, the long term.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p45 | claim | Preventing these failures takes few decisions, but they are group decisions, because every brand has the same obligations and the same copies. |  |  |\n| p46 | recommendation | The group decides centrally one system of record per fact, the registry with registration before access, consistency promises per read-path class, the retention schedule, the erasure workflow and ledger, and the restore procedure, with named owners and forum review of every new kind of store. | scenario: Event platform team runs the register; Lucía Ortega owns the retention schedule and erasure ledger; each copy owner owns its handler; the architecture advice forum reviews new kinds of store. | `elaboration`: Group decisions. → Which ones. |\n| p47 | recommendation | Each brand keeps its system-of-record technology during migration, its read-model designs and its partitioning within the group's tenancy rule. |  | `contrast`: What is central. → What stays local. |\n| p48 | recommendation | When SEO, model accuracy or fraud prevention argue against privacy, a named owner decides with the data protection officer's sign-off, and the architecture makes that decision executable per data class. |  | `sequence`: Central and local decisions. → Who resolves conflicts between them. |\n| p49 | recommendation | The Chief Architect watches staleness against budget, registry coverage with zero unregistered consumer groups, erasure cases closed within deadline, the oldest closed listing per store, read-model rebuild times tested twice a year, and fields that live only in a read model. |  | `sequence`: The decisions. → The measures that show they hold. |\n| p50 | recommendation | Copies outlive the systems that created them, so Yardstick's retirement by the end of 2029 must carry its archives, evidence and erasure history without their retention problems, and a migration plan without the registry and the ledger is not finished. |  | `sequence`: What to watch now. → The long-term consideration. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Ten design-review questions test every rule of the chapter on a real system.\n\n**Advances the thesis** (S1, S2, S3, S4, S5): Gives the reader a review drawn from every section.\n\n**Transition in:** `cause_effect`: The Chief Architect's decisions. → Questions that test them in a review.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p51 | recommendation (list) | Ten questions test field ownership, rebuildability, staleness budgets, read-your-writes, removal reach, registry coverage, retention per class, erasure listing within an hour, restore replay and re-identification. |  |  |\n\n## Conclusion: From Internal Copies to Search Engines\n\n**Synthesis:** The three questions the stream left open have one answer: a list kept before it is needed. With one system of record per fact, a registry entry per copy that states its staleness budget and retention, and a receipt from every copy for every erasure, the question that took two engineers two days takes none.\n\n**So what:** About 1,900 erasure requests a month cannot each be an investigation; a group without the register will either miss its deadlines or keep data it cannot account for.\n\n**Callback:** The opening's three questions (which copy is right, how wrong may the others be, how does a deletion reach all of them) and Femke's seven copies found from memory and code search. The reader now sees that the registry, the staleness budget and the erasure ledger answer the three questions in turn, and that the seven copies were hard to find only because no list existed.\n\n**Takeaway** (`course_of_action`): Register every copy, with its budget, rebuild path and retention, before the next store gets access.\n\n**Hand-off** to [Found by Google: Web, App and SEO Architecture for Listings](web-and-seo-architecture.html): `place`: The most valuable read model is the one search engines and answer engines build from Tradeyard's 40 million indexed URLs, whose consistency promises Google partly sets. → The customer-facing web and the pages that represent listings to the outside world.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p52 | synthesis | The three questions the stream left open have one answer, a register kept before it is needed, which turns Femke's two-day investigation into none and is the only way to handle about 1,900 requests a month. | scenario: Two engineers, two days, seven copies; about 1,900 erasure requests a month. |  |\n| p53 | transition | Not every copy is read by Veldmark's own systems: the most valuable read model is the one search engines build from 40 million indexed URLs, which web-and-seo-architecture takes up. |  | `place`: Internal copies governed by the registry. → The copy held outside the group by search engines. |\n\n## Non-goals\n\n- The event contract, outbox and replay mechanics. See [Every Change Is an Event: Event-Driven Listing Architecture](event-driven-listings.html).\n- Search index internals and reindexing. See [Search Architecture for Listings: Indices, Freshness and Scale](search-architecture.html).\n- The legal analysis of DSA, DAC7 and GDPR obligations. See [Rules of the Marketplace: DSA, DAC7 and Vertical Regulation](marketplace-regulation.html).\n- Tracking plans and data products. See [Data Platform for Marketplaces: Events, Lakehouse and Data Products](data-platform.html).\n- Model-side anonymization. See [Models in Production: ML Platforms and Use Cases](ml-platform.html).\n- Disaster recovery and multi-region failover. See [Sunday Evening Peaks: Reliability, Performance and Cost](reliability-and-scale.html).\n- SEO handling of sold pages. See [Found by Google: Web, App and SEO Architecture for Listings](web-and-seo-architecture.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- No marketplace has published a full copy inventory or erasure workflow; revisit if one does.\n- The Veldmark retention periods (13 months for listing content, 24 months for T&S evidence) are illustrative; marketplace-regulation and trust-and-safety-architecture may refine them.\n- Re-identification risk of anonymized property price history needs a firmer treatment in ml-platform or case-property-portals.\n- The old spec.md listed four unchecked modalities (checklist, summary, dialog, comics); none exists in the folder, so modalities is empty here. Whether to write them is the author's call.\n- Round-5 flow findings on the placement of Corrections and In Practice were answered with transitions, not moves, because AC-2 fixes the order; if a later check still reports them, the author decides whether to change AC-2 in the journal spec.\n\n## Decision log\n\n- **2026-11-12** — Resolved under the author's delegation ('auto resolve all ESCALATE topics'), 2026-11-12. In Practice placement (both flow readers in all three rounds called it unclear; they converged on moving it after the design sections, before the judging sections): moved after Corrections and Backfills, before Trade-offs. Spec order, the in-practice, partitioning and trade-offs transitions, p04, p22, p23, the roadmap promise order and the flow rationale updated; the prose opener now says the design rests partly on this evidence and p23 says which parts are judgement. AC-2's expected order (copied from journal-spec.json, which this pass may not edit) still lists documented practice after architecture; the replacement text, which puts documented practice after corrections and backfills and the consumer registry in architecture, is handed to the orchestrator as a journal-spec edit, and AC-2 here follows once it is applied. Rejected: Folding the In Practice bullets into the sections they support, which would merge units and drop a section the journal spec names.; Keeping the placement, which three rounds of readers found unclear.\n- **2026-11-12** — Schedule dates (accepted under the author's delegation, 2026-11-12): ledger dates unchanged (response 15 September 2027, schedule October 2027). The order is now explicit in both place
