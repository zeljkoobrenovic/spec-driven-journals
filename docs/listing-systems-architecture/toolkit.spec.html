<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (unit for unit, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, the three acceptance criteria and the role are copied unchanged from the toolkit's entry in journal-spec.json; the journal entry has no thesis object, so the thesis below is written here from the entry's question, the Reference part's supporting claim R-1 and the published page. The introduction realises the Reference part's opening (hook, bridge, roadmap). Tables and fenced template blocks are not units; each is recorded as the evidence of the unit before it.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The twelve templates (capability map row and heat map, vertical requirement profile, listing lifecycle state table, attribute dictionary entry, feed contract, publication-pipeline SLA card, search index design card, trust-and-safety policy-to-enforcement card, entitlement matrix, listing event specification, consolidation decision card, architecture decision record), the chapter behind each, and the three conventions they share (maintained data, references by identifier, a Veldmark example).\n- **Be able to:** Find the template for a design or decision from the question it answers, copy it and fill only the fields that change the decision, writing 'unknown' rather than guessing.\n- **Be able to:** Say which fields carry ownership, removal behavior and dates, and avoid the three common mistakes listed for each template.\n\n**Audience:** Chief and enterprise architects of marketplace groups, principal engineers, search, data, trust-and-safety and monetization leads and platform-engineering leads who need a working form for a decision; product and commercial leaders use Tools 1, 2, 9 and 11 as discussion documents.\n\n**Already knows:**\n\n- What an API, a database, an event stream, a search engine and Kubernetes are.\n- The book's chapters, or how to open the owning chapter linked from each tool.\n- Veldmark and its brands (Tradeyard, Motorvane, Hearthly, Keybridge), as introduced in meet-veldmark, and the failure-pattern names of where-listing-systems-go-wrong.\n\n**Does not yet know:**\n\n- Which of the book's records fits the decision on their desk.\n- Which fields of each record are dropped first.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given three decisions, the reader finds the template for each from the page's lookup table and names the owning chapter and one field that must not be dropped. *Probe:* Using only this page: which template do you use to (a) agree a bulk feed with a new dealer-software vendor, (b) decide whether to move an acquired brand's search onto the group platform, and (c) define what a paid package does to a listing and how it is billed? For each, name the chapter behind it and one field you must not leave out. | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can say what the page contains, how to use it and which fields matter most. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this page give you, how should you use it, and which fields does it say get dropped first? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the page, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** Which template turns the decision on the reader's desk into a working record, and which of its fields must not be dropped?\n\n> **Claim:** A decision's template is found from the question it answers, filled only where the decision changes and kept as maintained data cited by identifier, and the fields that must not be dropped are those for ownership, removal behavior and dates: seven of the twelve templates record what happens when a listing ends, and the incidents the Veldmark examples replay (38,400 cars unpublished by truncated files, a sold bike in 214 digests, a fraud rule nobody was assigned to carry to Motorvane) each came from one of those fields left blank.\n\n**Disputed by:** The view that templates are sample forms to fill in completely, or to copy once into a slide deck, with every field equally worth keeping.\n\n**So what:** A Chief Architect copies the one template for this week's decision, keeps it where the system it describes lives, writes 'unknown' rather than guessing, and fills the owner, removal and date fields before any other.\n\n**How and why:** Each tool gives a purpose, when to use it, the fields to copy, one Veldmark example and three common mistakes, and links its owning chapter; the examples replay the book's incidents and show the field that now prevents each, and the records cite each other by identifier (`POL-FRAUD-PAYLINK` v3, `listing.events.v1`, `pro-150@v5`) so a stale listing can be followed back to the contract that allowed it.\n\n**Supporting claims**\n\n- **T1** — A reader finds the template from the question on their desk, through a lookup table that names one tool and its owning chapter per question, and a diagram shows how the records point to each other.\n- **T2** — Each template is the smallest form that makes one recurring decision explicit and gives it an owner: a purpose, when to use it, fields to copy, one Veldmark example and three common mistakes, with the owning chapter for the reasoning; a reader fills only the fields that change the decision and writes 'unknown' rather than guessing.\n- **T3** — The fields that must not be dropped carry ownership, removal behavior and dates: seven of the twelve templates record what happens when a listing ends, and each incident the Veldmark examples replay came from one of those fields left blank and is now prevented by it.\n- **T4** — The templates stay true only as maintained data that cite each other by identifier, kept in a register where records are superseded rather than edited.\n\n## Role in the part\n\nTurns the book's recurring decisions into twelve copyable records and performs the reference part's opening. Supports R-1 of part `reference`.\n\n## Flow\n\n**Pattern:** `large_to_small` (also `prerequisite_order` in tool-1 to tool-12: the order of the parts that teach them (understand, model, supply, discover, trust, money, platform, lead), with the decision record last because every other tool feeds it)\n\nA reader arrives with one decision, so the page first gives the whole set as a lookup (the table) and as a chain (the diagram), then each template, then how to keep them true. The tools follow the order of the parts that teach them, so a reader can move between a tool and its chapter in reading order, and citations run mostly backward (the index card cites the dictionary's purposes, the decision record every other tool). A few point forward (the SLA card and the index card rest on the consumer registry, the event contract and the effect projector of Tools 9 and 10); the lookup table and the tool anchors make those reachable, and part order is kept because moving Tool 10 earlier would separate it from the platform chapters that teach it. Put the tools before the lookup and the reader would have to read twelve templates to find one; put the decision record anywhere but last and its citations would point forward to most of the records it cites.\n\n## Introduction\n\n**Hook** (`direct_statement`): These are working templates for a group of listing marketplaces: the records that Parts I to VIII ask a Chief Architect to keep.\n\n**Bridge:** The decisions argued in Parts I to VIII, from the capability map to the decision record, which a reader has met as chapters. → The records a team keeps for those decisions, each tested against Veldmark and kept as maintained data, not documents.\n\n**Thesis statement** (KEY POINTS callout (all three bullets) and paragraph p01's last two sentences.): Find the record that changes the decision on your desk, fill only the fields that change it, and keep the fields that carry ownership, removal behavior and dates: they are dropped first, seven of the twelve templates record what happens when a listing ends, and the records cite each other by identifier.\n\n**Roadmap** (Paragraph p03, after the three conventions.):\n\n- A table that finds the template for the question on the reader's desk. *Kept in:* lookup.\n- A diagram of how the records cite each other. *Kept in:* connect.\n- The twelve tools in the order of the parts that teach them, each with purpose, when to use it, template, Veldmark example, common mistakes and owning chapter. *Kept in:* tool-1, tool-2, tool-3, tool-4, tool-5, tool-6, tool-7, tool-8, tool-9, tool-10, tool-11, tool-12.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | claim | These are working templates for a group of listing marketplaces, the records Parts I to VIII ask a Chief Architect to keep, and the reader should adapt their wording but keep the fields for ownership, removal behavior and dates, which are dropped first and whose absence the next incident finds. | reasoning: From the capability map of business-capabilities to the decision record of organizing-marketplace-engineering, each tested against Veldmark; not a certification scheme or a vendor method; the smallest form that makes a decision explicit, assigns an owner and leaves evidence someone else can check. |  |\n| p02 | explanation (list) | Three conventions run through all twelve templates: they are maintained data rather than documents, they reference each other by identifier, and each has a short Veldmark example consistent with the chapter that teaches it. | example: Where each record lives (architecture repository, taxonomy and attribute service, beside the registered schema, policy registry, catalog, one Git register); a template copied into a slide deck stops being true within a quarter; examples of records citing each other; all Veldmark names, figures and dates fictional and illustrative. | `elaboration`: The records the page offers and the fields to keep. → The three conventions every record follows. |\n| p03 | transition | The page starts with a table that finds the template for the question on the reader's desk and a diagram of how the records cite each other, then gives the twelve tools in the order of the parts that teach them, each with its purpose, when to use it, the template, a Veldmark example, three common mistakes and its owning chapter, and ends with how to keep the templates true over time and where the glossary and bibliography take over. | reasoning: The page's sections in order and the two reference pages that follow it. | `sequence`: The conventions the records share. → The map of the page that holds them. |\n\n## Sections\n\n### Find the Template for the Question on Your Desk\n\n**Controlling idea** (`description`, id `lookup`): A reader finds the template for a decision from the question it answers, not by reading the twelve in order.\n\n**Advances the thesis** (T1): Gives the lookup that turns a question into one template and its chapter.\n\n**Transition in:** `sequence`: The page map's first item. → The lookup table.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p04 | description | Start from the question in the middle column of the lookup table; each row names one tool, links to it and names the chapter that owns it. | table: Twelve rows: Tool \\| Use it when \\| Chapter, from the capability map (business-capabilities) to the architecture decision record (organizing-marketplace-engineering). |  |\n| p05 | context | Three records owned by other chapters (the tenant register and configuration hierarchy, the qualified-contact definition and the journey SLOs) are linked from the tools that depend on them, not repeated here; Tool 11, named as the consolidation decision card later on the page, links data-platform directly. |  | `contrast`: The twelve templates the table lists. → The records it deliberately leaves to other chapters. |\n\n### How the Records Connect\n\n**Controlling idea** (`description`, id `connect`): Most changes in a marketplace group pass through several tools, and each record points to the next by identifier.\n\n**Advances the thesis** (T1, T4): Shows that the records form one chain a reader can follow, which is why they cite each other by identifier.\n\n**Transition in:** `elaboration`: The tools listed one per row. → How the same tools refer to each other.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | description | Most changes in a marketplace group pass through several of the tools in one direction: understanding records feed decisions, decisions produce the listing's model and its contracts, and the operational records rest on the event specification and the SLA card. | figure: Figure 1: understanding records feed decisions; decisions produce the listing's model and its contracts; nearly every operational record rests on the event specification and the SLA card. |  |\n\n### <a id=\"tool-1\"><\/a>Tool 1: Capability Map Row and Heat Map\n\n**Controlling idea** (`description`, id `tool-1`): The capability map row and heat map score each capability's differentiation, maturity and duplication so that sharing, investment and ownership are argued from the same evidence.\n\n**Advances the thesis** (T2): Gives the frame every later record cites.\n\n**Transition in:** `elaboration`: The diagram, whose understanding records feed every decision. → The first of them, the capability map.\n\n**Order of paragraphs** (`prerequisite_order`): Every tool uses the same order so a reader who has used one can scan the next: what the record is, then when to reach for it, then the fields to copy, then the fields filled once for Veldmark, then the mistakes that make it useless, then the chapter that holds the reasoning. The mistakes name fields, so they need the template before them; the example fills the template, so it cannot come first.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | definition | A capability map describes what the marketplace must be able to do independent of system, team or brand, and its heat map scores each level-2 capability on differentiation, maturity and duplication, so it is the stable frame every later record cites. |  |  |\n| p08 | context | Use the map for sharing decisions, consolidation cases, portfolio discussions and any capability with no named owner, and refresh it before annual planning and after every acquisition. |  | `sequence`: What the record is. → The occasions that call for it. |\n| p09 | description | The template is one row per level-2 capability, with level 3 only where a decision needs it. | table: Twelve fields from ID and level-1 area to Reading, including Owner, Maturity per implementation with dated evidence, Duplication verdict and Linked decision. | `elaboration`: When to use the record. → The record itself, field by field, to copy. |\n| p10 | example | Veldmark's map v1 of 31 March 2027 fills the row for 3.1 Search and filtering. | scenario: Three engines; maturity Tradeyard 2, Motorvane 4, Hearthly 3; verdict split at level 3; annual run cost about €11.8M; linked to the 14 September 2027 search decision. | `example`: The empty template. → The same template filled in once for Veldmark. |\n| p11 | analysis | The verdict follows from the scores: the engine differentiates little and is run three times, while relevance differentiates each brand, so the machinery is shared and the ranking is not. |  | `cause_effect`: The filled row. → Why its verdict follows from its scores. |\n| p12 | counterargument (list) | Three mistakes make the map useless: one maturity score per capability, one group scoring everything, and forgetting the deliberate duplicate. | scenario: Keybridge's listing distribution and Hearthly's feed ingestion duplicated on purpose under the March 2027 neutrality decision. | `contrast`: The filled row and its verdict. → The three ways the record most often goes wrong. |\n| p13 | recommendation | The owning chapter is business-capabilities. |  | `additional_support`: The template, its example and its mistakes. → The owning chapter, which works the full reasoning. |\n\n### <a id=\"tool-2\"><\/a>Tool 2: Vertical Requirement Profile and Share-Layer Row\n\n**Controlling idea** (`description`, id `tool-2`): The vertical requirement profile describes a vertical by the forces acting on its systems, and its share-layer row records which layer each part of a capability sits in and the gate a vertical must pass to move onto it.\n\n**Advances the thesis** (T2): Gives the evidence a sharing decision needs per vertical.\n\n**Transition in:** `elaboration`: The capability rows, scored across the group. → One vertical's forces, which decide where a shared capability may serve it.\n\n**Order of paragraphs** (`prerequisite_order`): Every tool uses the same order so a reader who has used one can scan the next: what the record is, then when to reach for it, then the fields to copy, then the fields filled once for Veldmark, then the mistakes that make it useless, then the chapter that holds the reasoning. The mistakes name fields, so they need the template before them; the example fills the template, so it cannot come first.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | definition | A vertical requirement profile describes a vertical by fourteen dimensions of the forces on its systems, and the share-layer row records which of four layers each part of a capability sits in and on what condition a vertical moves onto it. |  |  |\n| p15 | context | Use the profile when a vertical is asked to move onto a shared engine, a new vertical or country section is proposed, or a vertical's business model changes; it goes into the decision record as evidence. |  | `sequence`: What the record is. → The occasions that call for it. |\n| p16 | description | The template is one page per vertical, numbers first, with the share-layer row beside it. | table: Fourteen dimensions in five groups (Supply, Item, Demand, Money, Rules) and the share-layer row block with layer, owner, reason, stage gate, extension points and review trigger. | `elaboration`: When to use the record. → The record itself, field by field, to copy. |\n| p17 | example | Veldmark's Motorvane DE profile, ratified April 2027, fills the dimensions with numbers. | scenario: 91% of listings from 21,400 dealers; 88% of dealer listings by DMS feed; the Golf sold in 15 days with the feed delete 26 hours later; Pro 150 at €1,450 a month. | `example`: The empty template. → The same template filled in once for Veldmark. |\n| p18 | example | The share-layer row places vehicle identity, specification and price rating at layer 3, owned by Motorvane and consumed by Tradeyard Poland's cars section, and gates Motorvane's move onto the shared ingestion engine on feed success rate and delete latency. | scenario: Tradeyard Poland's cars section: about 410,000 live listings, about 40% from dealers; stage gate: feed success rate and delete latency no worse than Motorvane reports today. | `additional_support`: The Motorvane profile. → The share-layer row built from it. |\n| p19 | counterargument (list) | Three mistakes make the profile useless: profiling features instead of forces, classifying a whole capability into one layer, and omitting the stage gate. |  | `contrast`: The profile and its share-layer row. → The three ways the record most often goes wrong. |\n| p20 | recommendation | The owning chapter is vertical-requirements. |  | `additional_support`: The template, its example and its mistakes. → The owning chapter, which works the full reasoning. |\n\n### <a id=\"tool-3\"><\/a>Tool 3: Listing Lifecycle State Table\n\n**Controlling idea** (`description`, id `tool-3`): The listing lifecycle state table makes every state, transition, trigger and derived behavior explicit, separating the listing's publication state from trust and safety's enforcement overlay.\n\n**Advances the thesis** (T2, T3): Its derived-behavior and outcome fields carry what happens when a listing ends.\n\n**Transition in:** `sequence`: The understanding records of Part I. → The listing's own model, from Part II, starting with its states.\n\n**Order of paragraphs** (`prerequisite_order`): Every tool uses the same order so a reader who has used one can scan the next: what the record is, then when to reach for it, then the fields to copy, then the fields filled once for Veldmark, then the mistakes that make it useless, then the chapter that holds the reasoning. The mistakes name fields, so they need the template before them; the example fills the template, so it cannot come first.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p21 | definition | A listing lifecycle is the set of states, transitions, triggers and per-state behavior, and the state table separates the publication state owned by the listing from the enforcement overlay owned by trust and safety, deriving visibility from both. |  |  |\n| p22 | context | Use the table when designing a listing service, adding a state, integrating a vertical with other words, or investigating why a listing is live in one system and gone in another. |  | `sequence`: What the record is. → The occasions that call for it. |\n| p23 | description | The template is two tables and a list. |  | `elaboration`: When to use the record. → The record itself, field by field, to copy. |\n| p24 | description | The first table records transitions: from, to, trigger, command, event emitted and whether an outcome code is required. | table: Transitions table with an outcome code required for every terminal transition. | `sequence`: The three parts of the template. → The first: transitions. |\n| p25 | description | The second table records the behavior derived for each publication state and overlay. | table: Derived behavior per state: searchable, detail page, contactable, alertable and recommendable, URL behavior (200 / 404 / 410), retention clock. | `sequence`: The transitions table. → The second table: behavior per state. |\n| p26 | description (list) | The list records the rules: who may set which states, the three timestamps, the outcome vocabulary for terminal transitions, and the vertical mappings. |  | `sequence`: The two tables. → The rules to record beside them. |\n| p27 | example | Veldmark's Common Ground lifecycle for Tradeyard goods fills the derived-behavior table, with the Hearthly and Motorvane vertical mappings in its lead-in. | scenario: Active, restricted, held or blocked, Reserved, Sold, Withdrawn and Archived, with searchable, contactable, alertable and URL behavior for each. Lead-in: Hearthly's \"under offer\" and \"let agreed\" map onto Reserved and Sold; Motorvane allows platform-set reservations only for dealers who opt in. | `example`: The empty template. → The same template filled in once for Veldmark. |\n| p28 | example | The Rotterdam bike exercises the table: reserved at 14:02 and sold at 18:10 on 8 March 2027 with outcome sold on platform for €225, removed from search at 18:11, and still in a digest assembled at 17:30 that broke the table's 'Alertable: No' for Sold. | scenario: Active at 19:48 on Sunday 7 March 2027; `ListingReserved` at 14:02 on Monday 8 March; `ListingSold` at 18:10; €225 in the outcome, not the price. | `example`: The filled derived-behavior table. → One listing walked through it. |\n| p29 | counterargument (list) | Three mistakes make the table useless: one status column for three owners, treating a bump or renewal as a new listing, and ending listings without an outcome. |  | `contrast`: The bike walked through the table. → The three ways the record most often goes wrong. |\n| p30 | recommendation | The owning chapter is listing-aggregate. |  | `additional_support`: The template, its example and its mistakes. → The owning chapter, which works the full reasoning. |\n\n### <a id=\"tool-4\"><\/a>Tool 4: Attribute Dictionary Entry\n\n**Controlling idea** (`description`, id `tool-4`): The attribute dictionary entry is a small contract for one attribute that keeps facets, filters, feeds and trust rules agreeing about what a listing is.\n\n**Advances the thesis** (T2): Records the owner, purposes and dated requiredness of each attribute.\n\n**Transition in:** `similarity`: The lifecycle table, which models the listing's states. → The dictionary, which models the listing's attributes.\n\n**Order of paragraphs** (`prerequisite_order`): Every tool uses the same order so a reader who has used one can scan the next: what the record is, then when to reach for it, then the fields to copy, then the fields filled once for Veldmark, then the mistakes that make it useless, then the chapter that holds the reasoning. The mistakes name fields, so they need the template before them; the example fills the template, so it cannot come first.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p31 | definition | An attribute dictionary entry is a small contract for one attribute (key, meaning, type, unit, values, scope, purposes, provenance precedence, owner) that the schema compiler turns into forms, validators, index mappings and feed mappings. |  |  |\n| p32 | context | Use an entry when an attribute is proposed, about to become required, has its value list changed, or turns out to share a meaning with another key or carry two meanings. |  | `sequence`: What the record is. → The occasions that call for it. |\n| p33 | description | The template builds on the public models of eBay's Taxonomy API and Amazon's product type definitions. | table: Fifteen fields from Key to Owner and status, including Requiredness by category with an expected-required date and Purposes. | `elaboration`: When to use the record. → The record itself, field by field, to copy. |\n| p34 | example | Veldmark's `bike.battery_capacity_wh` entry, from schema release 2027.11, fills the template. | scenario: Recommended from 1 November 2027, required on create and revise from 1 March 2028, a four-month runway for dealer feeds; seller, then partner_feed, then model precedence. | `example`: The empty template. → The same template filled in once for Veldmark. |\n| p35 | process | The rollout followed the producer-breaking rule: publish the field and a readiness report per feed, validate with warnings during the runway, and only then return a stable error code. |  | `elaboration`: The entry's dated runway. → How the rollout used it. |\n| p36 | counterargument (list) | Three mistakes make an entry useless: changing meaning, unit or type in place, converting what cannot be converted, and leaving purposes blank. | scenario: Tradeyard's cleanup found 31 of 990 retired keys still read by something. | `contrast`: The entry and its rollout. → The three ways the record most often goes wrong. |\n| p37 | recommendation | The owning chapter is attribute-schemas. |  | `additional_support`: The template, its example and its mistakes. → The owning chapter, which works the full reasoning. |\n\n### <a id=\"tool-5\"><\/a>Tool 5: Feed Contract\n\n**Controlling idea** (`description`, id `tool-5`): The feed contract is everything both sides must agree on for a supply channel to be operable, of which schema validity is perhaps a third.\n\n**Advances the thesis** (T2, T3): Its semantics and reconciliation clauses state what absence means and hold a truncated file.\n\n**Transition in:** `sequence`: The listing's model from Part II. → Supply from Part III, which writes into that model.\n\n**Order of paragraphs** (`prerequisite_order`): Every tool uses the same order so a reader who has used one can scan the next: what the record is, then when to reach for it, then the fields to copy, then the fields filled once for Veldmark, then the mistakes that make it useless, then the chapter that holds the reasoning. The mistakes name fields, so they need the template before them; the example fills the template, so it cannot come first.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p38 | definition | A feed contract covers scope, identity, semantics, field ownership, schema, timeliness, media, errors, limits, reconciliation and change management, and it is a product artifact because partners judge a marketplace by how predictable its feed is. |  |  |\n| p39 | context | Every channel that writes listings gets one, including the insertion flow, and especially any channel whose removal behavior is unknown. |  | `sequence`: What the record is. → The occasions that call for it. |\n| p40 | description | The template is a contract block to copy. | table: A YAML block from feed_contract to change_management, with absence_means, field_ownership, status-change timeliness and a mass-change guard. | `elaboration`: When to use the record. → The record itself, field by field, to copy. |\n| p41 | example | Veldmark's Motorvane DMS channel under Supply Contract v1 fills the contract. | scenario: Hybrid mode: daily snapshot at 17:00 and status deltas within 15 minutes; content hash with about 91% unchanged; one RFC 9457 error catalog; mass-change guard on the snapshot. | `example`: The empty template. → The same template filled in once for Veldmark. |\n| p42 | cause_effect | The contract replaces two incidents with two controls: the truncated files that unpublished 38,400 cars for 286 dealers become 286 held runs, and the Golf's 26-hour-late removal becomes a 15-minute status delta. | scenario: Truncated files of Monday 8 March 2027, 38,400 cars for 286 dealers by 02:55; the Golf removed 26 hours late. | `cause_effect`: The filled contract. → The incidents its clauses prevent. |\n| p43 | counterargument (list) | Three mistakes make a contract useless: leaving 'absence means removal' implicit, purging the external-key mapping on removal, and giving one partner a private door. |  | `contrast`: The contract and the incidents it prevents. → The three ways the record most often goes wrong. |\n| p44 | recommendation | The owning chapter is listing-ingestion. |  | `additional_support`: The template, its example and its mistakes. → The owning chapter, which works the full reasoning. |\n\n### <a id=\"tool-6\"><\/a>Tool 6: Publication-Pipeline SLA Card\n\n**Controlling idea** (`description`, id `tool-6`): The SLA card turns 'listings should go live fast' into a contract of coverage, clock and removal with a budget per stage, and treats removal as a separate, stricter promise.\n\n**Advances the thesis** (T2, T3): Its removal row names an objective for every registered consumer.\n\n**Transition in:** `time`: Records arriving through a feed contract. → The pipeline that makes them searchable, and later removes them.\n\n**Order of paragraphs** (`prerequisite_order`): Every tool uses the same order so a reader who has used one can scan the next: what the record is, then when to reach for it, then the fields to copy, then the fields filled once for Veldmark, then the mistakes that make it useless, then the chapter that holds the reasoning. The mistakes name fields, so they need the template before them; the example fills the template, so it cannot come first.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p45 | definition | The SLA card states a time-to-searchable target with coverage, clock and removal and a per-stage budget that adds up to it, so the fast path cannot be met by holding more listings, and removal is a stricter promise of its own. |  |  |\n| p46 | context | Use the card when setting a time-to-searchable target, accepting a new channel or vertical, adding a stage, or registering a new consumer of listing data. |  | `sequence`: What the record is. → The occasions that call for it. |\n| p47 | description | The template is a card to copy. | table: SLA CARD block: coverage, clock, target, per-stage budget, removal objectives per consumer and partner feeds, evidence. | `elaboration`: When to use the record. → The record itself, field by field, to copy. |\n| p48 | example | Veldmark's Tradeyard SLA card of 2027 fills the card. | scenario: 94% of new listings covered; p95 90 seconds by end of 2028 from a 6-minute baseline; removal: search p95 10 s, every registered consumer p95 2 min, partner feeds within 15 min. | `example`: The empty template. → The same template filled in once for Veldmark. |\n| p49 | cause_effect | The removal row is the one the Rotterdam bike tested: removed from search a minute after the sale, it still reached 214 digests because the digest service was in no registry and re-checked nothing at send time. | scenario: 214 digests the next morning. | `emphasis`: The filled card. → The row the bike tested. |\n| p50 | counterargument (list) | Three mistakes make the card useless: a single p95 that hides the held share, budgets that do not add up, and removal objectives for the index only. |  | `contrast`: The card and the bike's test of it. → The three ways the record most often goes wrong. |\n| p51 | recommendation | The owning chapter is publication-pipeline. |  | `additional_support`: The template, its example and its mistakes. → The owning chapter, which works the full reasoning. |\n\n### <a id=\"tool-7\"><\/a>Tool 7: Search Index Design Card\n\n**Controlling idea** (`description`, id `tool-7`): The search index design card records how one market's index is built and operated, under the rule that no field exists in the index without a source outside it.\n\n**Advances the thesis** (T2, T3): Its freshness budget gives removals their own lane, and the rebuild drill keeps the index a read model.\n\n**Transition in:** `elaboration`: The SLA card's indexing stage and removal objective. → The index card that budgets them for one market.\n\n**Order of paragraphs** (`prerequisite_order`): Every tool uses the same order so a reader who has used one can scan the next: what the record is, then when to reach for it, then the fields to copy, then the fields filled once for Veldmark, then the mistakes that make it useless, then the chapter that holds the reasoning. The mistakes name fields, so they need the template before them; the example fills the template, so it cannot come first.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p52 | definition | The index design card records sources, typed fields, partitioning, write and removal visibility, read-path budget, rebuild and owners for one market's index, and its central rule that no field exists without a source outside the index is the test against Search as System of Record. |  |  |\n| p53 | context | Use the card when designing a market index, changing mappings or analyzers, migrating to another engine or cluster, or planning capacity for a peak. |  | `sequence`: What the record is. → The occasions that call for it. |\n| p54 | description | The template is a card of thirteen sections to copy. | table: Scope to Owner, including Promotion rule, Freshness budget with a removal lane, Reindex and Rebuild drill. | `elaboration`: When to use the record. → The record itself, field by field, to copy. |\n| p55 | example | Veldmark's Tradeyard Belgium index, the target design after the 14 September 2027 decision, fills the card. | scenario: About 2.4 million live listings; documents built only from Listing event contract v1 and the attribute service; about 610 of 3,900 original keys promoted; index share 15 s p95, removals 10 s p95; quarterly rebuild drill. | `example`: The empty template. → The same template filled in once for Veldmark. |\n| p56 | analysis | Every row names a source outside the index: documents come only from the event contract and the attribute service, paid fields from the effect projector, and the quarterly drill proves the index can be rebuilt from the stream. |  | `cause_effect`: The filled card. → How it meets the card's central rule. |\n| p57 | counterargument (list) | Three mistakes make the card useless: writing into the live index at peak, letting free-string attributes into the mappings, and rebuilding effects by copying the old index. | scenario: The 17 January 2027 brown-out: an in-place reindex, cache eviction on every commit and a TV campaign at the Sunday-evening peak. | `contrast`: The card and how it meets its rule. → The three ways the record most often goes wrong. |\n| p58 | recommendation | The owning chapter is search-architecture. |  | `additional_support`: The template, its example and its mistakes. → The owning chapter, which works the full reasoning. |\n\n### <a id=\"tool-8\"><\/a>Tool 8: Trust-and-Safety Policy-to-Enforcement Card\n\n**Controlling idea** (`description`, id `tool-8`): The policy-to-enforcement card traces one versioned policy from its text to every place it acts, so a decision stays explainable under the version in force when it was taken.\n\n**Advances the thesis** (T2, T3): Its propagation and rollout rows say which consumers must apply a decision and who tells each tenant.\n\n**Transition in:** `contrast`: Making listings searchable fast. → Stopping harmful listings and messages, from Part V.\n\n**Order of paragraphs** (`prerequisite_order`): Every tool uses the same order so a reader who has used one can scan the next: what the record is, then when to reach for it, then the fields to copy, then the fields filled once for Veldmark, then the mistakes that make it useless, then the chapter that holds the reasoning. The mistakes name fields, so they need the template before them; the example fills the template, so it cannot come first.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p59 | definition | The card traces one policy to its detectors, allowed enforcement rungs, consumers, notice and statement of reasons, appeal path and metrics, treating the policy as versioned reference data. |  |  |\n| p60 | context | Use the card when a policy is written or changed, a detector or action is proposed, or a tenant joins the shared platform, so legal and engineering each review their part without reading the other's code. |  | `sequence`: What the record is. → The occasions that call for it. |\n| p61 | description | The template is a card to copy. | table: POLICY block: version and supersedes, detectors, allowed rungs, propagation with time to last acknowledgement, rollout change class and tenant gaps, sharing, notice, metrics. | `elaboration`: When to use the record. → The record itself, field by field, to copy. |\n| p62 | example | Veldmark's `POL-FRAUD-PAYLINK` v3, effective 18 March 2027, fills the card. | scenario: Message safety gate at 150 ms p99; `EnforcementApplied` to search, messaging, alerts and payments; rule reached BE only on 10 March and never PL or PT; time-to-action target under 30 minutes by end of 2028 from 3 h 10 min. | `example`: The empty template. → The same template filled in once for Veldmark. |\n| p63 | cause_effect | The card replays Femke's Sunday evening, when a fake buyer sent her a payment link, and its rollout row exists because the suspended scammer's phone number had also registered a Motorvane private-seller account and no field in the March 2027 rollout process said who should tell Motorvane. | scenario: Report at 20:19, suspension at 20:26, 37 similar messages withheld; the phone number had registered a Motorvane private-seller account. | `emphasis`: The filled card. → The row it exists for. |\n| p64 | counterargument (list) | Three mistakes make the card useless: demoting silently, treating a decision as finished when the status changes, and rolling fraud rules out on the product release train. |  | `contrast`: The card and the evening it replays. → The three ways the record most often goes wrong. |\n| p65 | recommendation | The owning chapter is trust-and-safety-architecture. |  | `additional_support`: The template, its example and its mistakes. → The owning chapter, which works the full reasoning. |\n\n### <a id=\"tool-9\"><\/a>Tool 9: Entitlement Matrix\n\n**Controlling idea** (`description`, id `tool-9`): The entitlement matrix puts every product's holder, quota, effects, enforcement points, failure behavior, ledger entries, delivery evidence and billing basis on one page, so seller, finance and engineering agree on what was sold and delivered.\n\n**Advances the thesis** (T2, T3): Its failure and billing columns tie what is billed to what was delivered.\n\n**Transition in:** `similarity`: Enforcement points that read a trust-and-safety decision. → Enforcement points that read a paid effect, from Part VI.\n\n**Order of paragraphs** (`prerequisite_order`): Every tool uses the same order so a reader who has used one can scan the next: what the record is, then when to reach for it, then the fields to copy, then the fields filled once for Veldmark, then the mistakes that make it useless, then the chapter that holds the reasoning. The mistakes name fields, so they need the template before them; the example fills the template, so it cannot come first.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p66 | definition | The entitlement matrix lists, for every product and package, its holder, quota, effects, enforcement points, behavior when the entitlement service is unavailable, ledger entries, delivery evidence and billing basis. |  |  |\n| p67 | context | Use the matrix when a product is launched, repriced or retired, a brand moves onto the shared catalog, a dispute or overbilling finding arrives, or a ranking or rendering change touches paid effects. |  | `sequence`: What the record is. → The occasions that call for it. |\n| p68 | description | The template is one row per product version, and its failure column is a commercial decision written as engineering. | table: Nine columns from Product version to Billing basis, with ledger entries Grant to PublishRefused. | `elaboration`: When to use the record. → The record itself, field by field, to copy. |\n| p69 | description | Beside the matrix, record the price-list version and contract behind each quote, every producer's idempotency key, and the daily granted-delivered-billed reconciliation and its owner. |  | `additional_support`: The matrix rows. → What is recorded beside them. |\n| p70 | example | Veldmark's Tally design of October 2027 fills three rows. | scenario: Motorvane `pro-150@v5` (150 slots, 20 boosts, €1,450 a month, €9 overage only with consent), Tradeyard `top-listing-7d@v4`, Tradeyard bump. | `example`: The empty template. → The same template filled in once for Veldmark. |\n| p71 | cause_effect | The first row turns the late-September 2027 overbilling finding into a rule: billing counted feed rows, so it now reads 150 `Consume` entries and bills €1,450. | scenario: Ruhrblick's August feed: 163 cars, 150 live, €117 overage for 13 never published; the 14-month audit found 1,140 dealers overbilled by about €212,000, credited in October 2027. | `cause_effect`: The filled matrix. → The finding its first row turns into a rule. |\n| p72 | counterargument (list) | Three mistakes make the matrix useless: paid state as a column in the listing payload, a paid effect that outlives its listing, and billing that recomputes entitlements on its own. |  | `contrast`: The matrix and the finding behind it. → The three ways the record most often goes wrong. |\n| p73 | recommendation | The owning chapter is products-and-entitlements. |  | `additional_support`: The template, its example and its mistakes. → The owning chapter, which works the full reasoning. |\n\n### <a id=\"tool-10\"><\/a>Tool 10: Listing Event Specification\n\n**Controlling idea** (`description`, id `tool-10`): The listing event specification defines one event in the listing event contract, in a shape every consuming context can rely on for years.\n\n**Advances the thesis** (T2, T3, T4): Its consumers and objectives fields give removal events their own objective, and its identifiers are what other records cite.\n\n**Transition in:** `cause_effect`: Decisions and paid effects that must reach every copy of a listing. → The event that carries a listing fact to every consumer, from Part VII.\n\n**Order of paragraphs** (`prerequisite_order`): Every tool uses the same order so a reader who has used one can scan the next: what the record is, then when to reach for it, then the fields to copy, then the fields filled once for Veldmark, then the mistakes that make it useless, then the chapter that holds the reasoning. The mistakes name fields, so they need the template before them; the example fills the template, so it cannot come first.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p74 | definition | A listing event specification states one listing fact in the group's published language and says what it means, when it is emitted, what makes it unique and ordered, what it carries, who consumes it, how fast it must arrive and how it may change. |  |  |\n| p75 | context | Use a specification when a new event type is proposed, a field's meaning is in doubt, a consumer registers, or a breaking change is considered, and the default answer to a new type is no. |  | `sequence`: What the record is. → The occasions that call for it. |\n| p76 | description | The template is a specification of twelve sections to copy. | table: Identity to Change, including Key and order, Excluded data, Topics and retention with the tombstone rule, Objectives with a stricter removal objective, and registered Consumers. | `elaboration`: When to use the record. → The record itself, field by field, to copy. |\n| p77 | example | Veldmark's `ListingSold` in `listing.events.v1`, live 1 July 2027, fills the specification. | scenario: The bike's sale at version 9; €225 via Safe Deal; removal events p99 under 5 s to topic and under 30 s to search deletion; 23 consumer groups at go-live. | `example`: The empty template. → The same template filled in once for Veldmark. |\n| p78 | cause_effect | Under the specification, the digest that featured the sold bike subscribes to `ListingSold`, purges the bike and re-checks state before sending, instead of reading a MySQL replica snapshot. |  | `cause_effect`: The filled specification. → What it changes for the digest that sent the sold bike. |\n| p79 | counterargument (list) | Three mistakes make a specification useless: putting bumps or views on the listing stream, changing a field's meaning within a version, and emitting no-op updates. |  | `contrast`: The specification and the digest it fixes. → The three ways the record most often goes wrong. |\n| p80 | recommendation | The owning chapter is event-driven-listings. |  | `additional_support`: The template, its example and its mistakes. → The owning chapter, which works the full reasoning. |\n\n### <a id=\"tool-11\"><\/a>Tool 11: Consolidation Decision Card\n\n**Controlling idea** (`description`, id `tool-11`): The consolidation decision card replaces one yes-or-no on replatforming an acquired business with a staged, gated plan beside a synergy ledger, its constraints and an exit path.\n\n**Advances the thesis** (T2, T4): Records owners, dated evidence and the exit path that keeps a business separable.\n\n**Transition in:** `sequence`: The operational records of Parts I to VII. → The leadership decisions of Part VIII, starting with an acquired business.\n\n**Order of paragraphs** (`prerequisite_order`): Every tool uses the same order so a reader who has used one can scan the next: what the record is, then when to reach for it, then the fields to copy, then the fields filled once for Veldmark, then the mistakes that make it useless, then the chapter that holds the reasoning. The mistakes name fields, so they need the template before them; the example fills the template, so it cannot come first.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p81 | definition | The consolidation card records an acquired business's integration option, which capabilities move in which stage behind which gate, and which are left alone, beside a synergy ledger, brand and URL risk, binding constraints and an exit path. |  |  |\n| p82 | context | Use the card when a deal closes or is priced, a synergy target is announced, a brand or domain migration is proposed, or a cost program proposes merging something kept separate on purpose, because public cases show the constraints row binds. | source: The UK CMA accepted undertakings on 2 June 2021 requiring Gumtree UK and Shpock to be sold as part of Adevinta's acquisition of eBay Classifieds Group.; source: eBay Kleinanzeigen became Kleinanzeigen on 16 May 2023, with the previous domain to 'remain accessible for several more years'. | `sequence`: What the record is. → The occasions that call for it. |\n| p83 | description | The template is a card to copy. | table: CONSOLIDATION CARD block: integration option and reversibility, constraints, five-stage sequence and kept-separate list, synergy ledger, brand and URLs, people, exit path, review. | `elaboration`: When to use the record. → The record itself, field by field, to copy. |\n| p84 | example | Veldmark's card for Hearthly.es, with Keybridge as the deliberate counter-case, as recorded in the board review of 9 November 2027, fills both columns from decisions recorded in other chapters. | scenario: Hearthly.es: share services beneath, stages 0–3; synergy ledger €18M deal case against €9.6M October 2027 evidence; 3% traffic rule; hosting off at the end of 2029. Keybridge: federate under group controls; €7M cross-selling withdrawn. | `example`: The empty template. → The same template filled in once for Veldmark. |\n| p85 | analysis | The two columns are the point of the card: the same group in the same year shared almost every layer beneath one portal and almost none beneath another, each for a reason in the constraints row. |  | `emphasis`: The filled two-column card. → What the two columns show together. |\n| p86 | counterargument (list) | Three mistakes make the card useless: consolidating the visible layer first, a synergy case with one number, and forgetting separability. |  | `contrast`: The card and what its columns show. → The three ways the record most often goes wrong. |\n| p87 | recommendation | The owning chapter is platform-consolidation. |  | `additional_support`: The template, its example and its mistakes. → The owning chapter, which works the full reasoning. |\n\n### <a id=\"tool-12\"><\/a>Tool 12: Architecture Decision Record\n\n**Controlling idea** (`description`, id `tool-12`): The architecture decision record captures one decision, its rejected options and consequences, with five fields a marketplace group needs, and it is the record every other tool cites.\n\n**Advances the thesis** (T2, T4): Its review trigger and supersession rule keep decisions maintained rather than edited.\n\n**Transition in:** `sequence`: The consolidation card, whose decisions are each recorded. → The decision record, last because every other tool feeds it.\n\n**Order of paragraphs** (`prerequisite_order`): Every tool uses the same order so a reader who has used one can scan the next: what the record is, then when to reach for it, then the fields to copy, then the fields filled once for Veldmark, then the mistakes that make it useless, then the chapter that holds the reasoning. The mistakes name fields, so they need the template before them; the example fills the template, so it cannot come first.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p88 | definition | An architecture decision record captures one decision in about a page, and a marketplace group adds five fields (tenants and brands, principles, liquidity metric, advice received, separability) and indexes records in the advice forum's decision log. |  |  |\n| p89 | context | Use a record when a decision crosses a team, brand or tenant boundary, changes a contract or system of record, moves money, people or personal data between brands, or makes an exception; team-local decisions may use a lighter record. |  | `sequence`: What the record is. → The occasions that call for it. |\n| p90 | description | The template builds on Nygard's 2011 record and Harmel-Law's advice process. | table: DR-YYYY-NNN block: status, proposer and decider, tenants, context, drivers, options, decision, conditions, principles, consequences, data and regulation, advice received, confirmation, review. | `elaboration`: When to use the record. → The record itself, field by field, to copy. |\n| p91 | example | Veldmark's search platform decision, accepted 14 September 2027, fills the record. | scenario: Option C: OpenSearch for Tradeyard and Hearthly, Motorvane stays on Elasticsearch; Tradeyard PT first in Q2 2028; Motorvane's advice followed; engine review in 2029 with Vespa reopened on missed budgets. | `example`: The empty template. → The same template filled in once for Veldmark. |\n| p92 | evidence | The forum logged 74 cross-brand records by 31 December 2027, with a median of nine working days from draft to decision. | statistic: Six went to the CTO because they moved funding or people, two to the data protection officer because they moved personal data across brands. | `additional_support`: One filled record. → The register of records it belongs to. |\n| p93 | counterargument (list) | Three mistakes make a record useless: a record with one option, no review trigger, and editing an accepted record instead of superseding it. |  | `contrast`: The record and its register. → The three ways the record most often goes wrong. |\n| p94 | recommendation | The owning chapter is organizing-marketplace-engineering. |  | `additional_support`: The template, its example and its mistakes. → The owning chapter, which works the full reasoning. |\n\n## Conclusion: Using the Toolkit Over Time\n\n**Synthesis:** Each template leaves evidence someone else can check only while it stays true, and the same incidents the Veldmark examples replay show how: fields for ownership, removal and dates were added after an incident found them missing, so keeping a template true means reviewing it on a calendar, adding a field when an incident finds a gap, and removing fields nobody reads.\n\n**So what:** A team that keeps the templates as maintained data, reviewed and extended this way, finds the next missing field in a review rather than in an incident.\n\n**Callback:** The opening's claim that each template leaves evidence someone else can check, and that the fields dropped first are the ones whose absence the next incident finds. The reader now sees the incidents of the twelve examples as the source of those fields, and the three habits as what keeps that evidence true.\n\n**Takeaway** (`course_of_action`): Review each template on a calendar, let each post-incident review add the missing field, and remove fields filled by habit and read by nobody.\n\n**Hand-off** to [Glossary: The Language of Listing Systems](glossary.html): `elaboration`: The toolkit's closing pointer: the glossary defines the terms the templates use. → One definition per term, set beside the terms it is confused with, each linked to its owning chapter.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p95 | synthesis (list) | Each template leaves evidence someone else can check only while it stays true, above all in its fields for ownership, removal behavior and dates, and three habits keep it true: review on a calendar, let incidents add fields, and keep the set small. | scenario: The mass-change guard from 38,400 vanished cars, the send-time re-check from one sold bike in 214 digests, the `PublishRefused` entry from €212,000 of credits, the group-urgent change class from a rule that took three days to cross a border. |  |\n| p96 | transition | Fitness functions keep the records honest over a decade, the glossary defines the terms the templates use, and the bibliography lists the sources behind them. |  | `sequence`: Keeping the templates true. → Where the reader goes for the terms and the sources. |\n\n## Non-goals\n\n- Re-teaching the reasoning behind each template; each tool summarizes and links to its chapter. See [Map What the Marketplace Does Before What Runs It](business-capabilities.html), [Same Platform, Different Physics: How Listing Verticals Differ](vertical-requirements.html), [The Listing Aggregate: Identity, Lifecycle and Invariants](listing-aggregate.html), [Attributes Without Chaos: Schemas, Dictionaries and Validation](attribute-schemas.html), [Many Doors In: Forms, APIs and Bulk Feeds](listing-ingestion.html), [From Submitted to Searchable: The Publication Pipeline](publication-pipeline.html), [Search Architecture for Listings: Indices, Freshness and Scale](search-architecture.html), [Trust and Safety as a Platform](trust-and-safety-architecture.html), [Packages, Bumps and Quotas: Products, Pricing and Entitlements](products-and-entitlements.html), [Every Change Is an Event: Event-Driven Listing Architecture](event-driven-listings.html), [After the Deal: Consolidating Platforms After Acquisitions](platform-consolidation.html), [Who Owns What: Organizing Marketplace Engineering](organizing-marketplace-engineering.html).\n- The tenant register and configuration hierarchy, the qualified-contact definition and metrics catalog, and journey SLOs, which are linked, not reproduced. See [One Platform, Many Marketplaces: Multi-Country and Multi-Brand Architecture](multi-country-platforms.html), [Data Platform for Marketplaces: Events, Lakehouse and Data Products](data-platform.html), [Sunday Evening Peaks: Reliability, Performance and Cost](reliability-and-scale.html).\n- Definitions of terms and the source list by topic. See [Glossary: The Language of Listing Systems](glossary.html), [Bibliography: Sources and Evidence](bibliography.html).\n- Downloadable file formats (spreadsheets, document templates).\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-10-19** — Chose the twelve templates in the PLAN contract and no others: a grep of the chapters for 'toolkit' found only one explicit promise (the SLA card in publication-pipeline), already in the list.\n- **2026-10-19** — Ordered tools by the book's parts (understand, model, supply, discover, trust, money, platform, lead) rather than by stage, so a reader can move between a tool and its chapter in reading order; the ADR is last because every other tool feeds it. Rejected: Order by pipeline stage.\n- **2026-10-19** — Wrote templates as tables where fields need guidance and as fenced blocks where the record is a literal artifact (share-layer row, feed contract, SLA card, policy card, consolidation card, ADR), so they can be copied as they are.\n- **2026-10-19** — Used `bike.battery_capacity_wh` rather than the chapter's frame-size entry for Tool 4, because it shows the recommended-then-required runway; frame size appears in the common mistakes.\n- **2026-11-12** — Spec.md success criteria not carried over as criteria: they were inventories (callouts present, twelve s der the author's delegation (fix-only pass): round-6 flow (KEY POINTS bullet 1): each of the six identifiers now carries a one-word gloss (listing key, attribute, policy, event stream, dealer package, tenant) and a pointer that each is defined in the tool that owns it. All identifiers kept.\n- **2026-11-13** — Fixed under the author's delegation (fix-only pass): length.max_words raised from 8574 to 8660 (+1%) to hold the four fixes' glosses and pointers; draft is 8583 words.\n\n## Sources\n\n- **Internal**\n  - _journals/listing-systems-architecture/journal-spec.json — Intent outcome, acceptance criteria, role, the question, R-1, and the Reference part's opening this page carries.\n  - business-capabilities, vertical-requirements — Heat map, verdicts, profiles, share layers, stage gates.\n  - listing-aggregate, attribute-schemas — Lifecycle states, overlay, derived visibility, dictionary entry, requiredness.\n  - listing-ingestion, publication-pipeline, search-architecture — Feed contract, SLA card, index design and search decision.\n  - trust-and-safety-architecture, products-and-entitlements, event-driven-listings — Policy record and ladder, Tally ledger and effects, Listing event contract v1.\n  - organizing-marketplace-engineering, multi-country-platforms, identity-and-verification, case-aviv, platform-consolidation — Governance, tenancy model, Hearthly.es decisions, the consolidation card.\n  - _research/scenario-ledger.md, _research/consistency-issues.md, _research/style-guide.md — Veldmark figures, the bike rulings, pattern names and house style.\n  - The RECONCILED toolkit (finance-systems-architecture) — Page format and tool structure.\n- **External**\n  - Michael Nygard, Documenting Architecture Decisions (2011); Andrew Harmel-Law, Scaling the Practice of Architecture, Conversationally (2021) — The record anatomy and the advice process behind Tool 12.\n  - eBay Taxonomy API; Amazon SP-API product type definitions; RFC 9457 (2023); Confluent schema compatib
