<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "# Spec: Field Kit: Templates for the Marketplace Architect\n\n## Intent\n\nGive the reader a set of practical, copyable templates for the records a Chief Architect of a marketplace group uses to keep many listing marketplaces coherent, fast and changeable. Each template is derived from the chapter that teaches it, keeps that chapter's terminology and fields, and is filled in once with a short Veldmark example that agrees with the chapter and the scenario ledger. The page should let a reader start from the design or decision on their desk, copy one record, and know which fields carry ownership, removal behavior and dates, and which mistakes make the record useless. It also delivers the publication-pipeline SLA card that [From Submitted to Searchable: The Publication Pipeline](publication-pipeline.html) promises \"in the toolkit\".\n\n## Audience\n\nChief and enterprise architects of marketplace groups, principal engineers, search, data, trust-and-safety and monetization leads, and platform-engineering leads who need working forms for capability, vertical, modeling, supply, discovery, trust, monetization, event, consolidation and governance decisions. Product and commercial leaders use Tools 1, 2, 9 and 11 as discussion documents.\n\n## Success criteria\n\n- [x] Opens with IN THIS SECTION, YOU WILL; three KEY POINTS; three failure patterns with exact names; `<br>`; an intro on how to use the templates; a table of contents (Tool | Use it when | Chapter).\n- [x] Contains the twelve templates in the PLAN contract, each as a `## Tool N` section with purpose, a one-paragraph \"use it when\", a copyable table or fill-in block, a short Veldmark example, three common mistakes and a closing Learn more `[[link]]` to the owning chapter.\n- [x] Every template's fields trace to the owning chapter: heat-map dimensions and verdicts ([Map What the Marketplace Does Before What Runs It](business-capabilities.html)); fourteen dimensions and four layers ([Same Platform, Different Physics: How Listing Verticals Differ](vertical-requirements.html)); publication state plus enforcement overlay ([The Listing Aggregate: Identity, Lifecycle and Invariants](listing-aggregate.html)); dictionary entry fields and requiredness rules ([Attributes Without Chaos: Schemas, Dictionaries and Validation](attribute-schemas.html)); eleven contract clauses, field ownership and mass-change guard ([Many Doors In: Forms, APIs and Bulk Feeds](listing-ingestion.html)); coverage, clock, removal and stage budget ([From Submitted to Searchable: The Publication Pipeline](publication-pipeline.html)); field groups, promotion rule, budgets and rebuild drill ([Search Architecture for Listings: Indices, Freshness and Scale](search-architecture.html)); policy record, ladder and propagation ([Trust and Safety as a Platform](trust-and-safety-architecture.html)); ledger entries, effects and enforcement points ([Packages, Bumps and Quotas: Products, Pricing and Entitlements](products-and-entitlements.html)); envelope, catalog, topics and compatibility rules ([Every Change Is an Event: Event-Driven Listing Architecture](event-driven-listings.html)); decision-rights and advice process ([Who Owns What: Organizing Marketplace Engineering](organizing-marketplace-engineering.html)).\n- [x] Veldmark examples use ledger figures and dates (search run cost €11.8M; Motorvane profile; bike reserved 14:02 and sold 18:10; `bike.battery_capacity_wh` required from 1 March 2028; Supply Contract v1 hybrid; Tradeyard SLA card; Tradeyard BE index; `POL-FRAUD-PAYLINK` v3; Pro 150 and the €212,000 credits; `ListingSold` version 9; Hearthly.es and Keybridge; 14 September 2027 search decision).\n- [x] One mermaid diagram shows how the records reference each other; cross-links use only valid permalinks.\n- [x] Short Sources and Evidence section with dated sources and the closing fictional-Veldmark sentence.\n\n## Non-goals\n\n- Re-teaching the reasoning behind each template; each tool summarizes and links to its chapter.\n- The tenant register and configuration hierarchy ([One Platform, Many Marketplaces: Multi-Country and Multi-Brand Architecture](multi-country-platforms.html)), the qualified-contact definition and metrics catalog ([Data Platform for Marketplaces: Events, Lakehouse and Data Products](data-platform.html)) and journey SLOs ([Sunday Evening Peaks: Reliability, Performance and Cost](reliability-and-scale.html)), which are linked, not reproduced.\n- Definitions of terms ([Glossary: The Language of Listing Systems](glossary.html)) and the source list by topic ([Bibliography: Sources and Evidence](bibliography.html)).\n- Downloadable file formats (spreadsheets, document templates).\n\n## Modalities\n\n- [ ] `checklist.md` — operational checklist\n- [ ] `summary.md` — management summary\n- [ ] `dialog.md` — two-host dialog\n- [ ] `comics.md` — explainer comic\n\n## Open questions\n\n- [After the Deal: Consolidating Platforms After Acquisitions](platform-consolidation.html) was not yet written when this page was drafted. Tool 11's fields come from its PLAN contract (integration options, sequence, synergy case, brand migration, regulatory conditions, people) and its Veldmark example uses only decisions already recorded in other chapters and the ledger. Reconcile the card with the chapter once it exists, including any synergy figures it introduces.\n- Chapters disagree on two bike details: [The Listing Aggregate: Identity, Lifecycle and Invariants](listing-aggregate.html) has the Safe Deal reservation at 16:32 and the sale at version 5, while the ledger's editor line has 14:02 and [Every Change Is an Event: Event-Driven Listing Architecture](event-driven-listings.html) has version 9. The toolkit follows the editor line and the owning chapter for events; the editor should align [The Listing Aggregate: Identity, Lifecycle and Invariants](listing-aggregate.html).\n- Should a tenant register entry ([One Platform, Many Marketplaces: Multi-Country and Multi-Brand Architecture](multi-country-platforms.html)) or a consumer registry row ([System of Record and Read Models: Listing Data Management](listing-data-management.html)) become a thirteenth tool?\n\n## Decision log\n\n- **2026-10-19** — Chose the twelve templates in the PLAN contract and no others: a grep of the chapters for \"toolkit\" found only one explicit promise (the SLA card in [From Submitted to Searchable: The Publication Pipeline](publication-pipeline.html)), already in the list.\n- **2026-10-19** — Ordered tools by the book's parts (understand, model, supply, discover, trust, money, platform, lead) rather than by stage, so a reader can move between a tool and its chapter in reading order; the ADR is last because every other tool feeds it.\n- **2026-10-19** — Wrote templates as tables where fields need guidance and as fenced blocks where the record is a literal artifact (share-layer row, feed contract, SLA card, policy card, consolidation card, ADR), so they can be copied as they are.\n- **2026-10-19** — Used `bike.battery_capacity_wh` rather than the chapter's frame-size entry for Tool 4, because it shows the recommended-then-required runway; frame size appears in the common mistakes.\n\n## Sources\n\n- **Internal**\n  - [Map What the Marketplace Does Before What Runs It](business-capabilities.html), [Same Platform, Different Physics: How Listing Verticals Differ](vertical-requirements.html) — heat map, verdicts, profiles, share layers, stage gates.\n  - [The Listing Aggregate: Identity, Lifecycle and Invariants](listing-aggregate.html), [Attributes Without Chaos: Schemas, Dictionaries and Validation](attribute-schemas.html) — lifecycle states, overlay, derived visibility, dictionary entry, requiredness.\n  - [Many Doors In: Forms, APIs and Bulk Feeds](listing-ingestion.html), [From Submitted to Searchable: The Publication Pipeline](publication-pipeline.html), [Search Architecture for Listings: Indices, Freshness and Scale](search-architecture.html) — feed contract, SLA card, index design and search decision.\n  - [Trust and Safety as a Platform](trust-and-safety-architecture.html), [Packages, Bumps and Quotas: Products, Pricing and Entitlements](products-and-entitlements.html), [Every Change Is an Event: Event-Driven Listing Architecture](event-driven-listings.html) — policy record and ladder, Tally ledger and effects, Listing event contract v1.\n  - [Who Owns What: Organizing Marketplace Engineering](organizing-marketplace-engineering.html), [One Platform, Many Marketplaces: Multi-Country and Multi-Brand Architecture](multi-country-platforms.html), [Who Is on the Other Side? Identity and Verification](identity-and-verification.html), [AVIV Group: Building a European Real-Estate Platform from Acquisitions](case-aviv.html) — governance, tenancy model, Hearthly.es decisions.\n- **External**\n  - Michael Nygard, *Documenting Architecture Decisions* (2011); Andrew Harmel-Law, *Scaling the Practice of Architecture, Conversationally* (2021).\n  - eBay Taxonomy API and Amazon SP-API product type definitions; RFC 9457; Confluent schema compatibility documentation.\n  - UK CMA Adevinta/eBay Classifieds decision (2021); Adevinta Kleinanzeigen rebrand release (2023); Regulation (EU) 2022/2065.\n  - The RECONCILED toolkit — page format and tool structure.\n\n## Changelog\n\n- **2026-10-19** — Initial spec and article. *(AI-mediated session)*\n- **2026-10-19** — Editorial review pass: Tool 11 rebuilt against the written platform-consolidation chapter (six integration options, staged and gated sequence, synergy ledger with dated evidence, 3% traffic rule, Keybridge federated under group controls); bike version 9 and 14:02 reservation confirmed. *(AI-mediated session)*\n- **2026-10-20** — Tool 10 purpose now says a listing event specification defines one event in the listing event contract, linking event-driven-listings. *(AI-mediated session)*\n- **2026-10-20** — Sharpening pass: 4,852 → 4,864 words; lead now names the toolkit as the records Parts I–VIII ask for, linking the first and last owning chapters; teaser opener cut from How the Records Connect; Tool 11 purpose sentence split; no headings changed. *(AI-mediated session)*\n- **2026-10-20** — Replaced 1 mermaid diagram(s) with generated illustrations (figure numbers and captions unchanged; sources archived in `_research/mermaid-figures.json`). *(AI-mediated session)*\n"}]}]}</script>

    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
