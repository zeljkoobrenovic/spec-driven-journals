<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published page (posts/glossary/index.md) and its former spec.md (accepted 2026-10-21), which it replaces; one spec paragraph per prose unit of the page, in the page's order. Intent outcome, AC-1 to AC-3 and role are copied unchanged from the post's entry in journal-spec.json. The journal spec gives this post no thesis, so the thesis and its four supporting claims are written here from the entry's question, the Reference part's claim R-2 and the published callouts. The page is a reference page: its content is about 405 definition rows in eleven tables and an alphabetical index, which are not prose units; the spec's units are the prose paragraphs, each section's lead paragraph with its table as evidence, and the index list with its lead-in. The three callouts (IN THIS SECTION, KEY POINTS, FAILURE PATTERNS) stand before the first paragraph as the house format. Changes to the published page made to meet the contract: a new opening paragraph (p01) before the published 'How to Use This Glossary' heading carries the bridge from the toolkit, the hook, the thesis and the announcement of that section; each part section's lead sentence was reworded to state how it follows the previous section; a lead-in sentence was added before the alphabetical index; and a synthesis paragraph (p15) was added after the index, before the published closing pointer. No definition, owning-chapter link, figure or name was changed; the GMV row was moved from Part I to Part VI, whose chapter owns it.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Where each term is defined: the evidence labels and fifteen failure patterns, one section per part from I to VIII, the Veldmark names, and the alphabetical index of every term, abbreviation and alias.\n- **Be able to:** Look up a term and read the neighboring rows that carry the contrasts behind real design errors (listing versus underlying entity, publication state versus enforcement overlay, full snapshot versus delta feed, contact versus conversation versus lead, entitlement versus effect, system of record versus read model).\n- **Be able to:** Follow a term to its owning chapter, and check a regulatory or company term against its current source before using it in a contract or policy.\n\n**Audience:** Chief architects, principal engineers, search, data and ML leads, and product and engineering directors of listing marketplaces, reading the book out of order; most arrive with one term to look up, and readers from one vertical (real estate, automotive, general classifieds) also use the page to decode another vertical's terms.\n\n**Already knows:**\n\n- APIs, databases, event streams, search engines and Kubernetes.\n- The toolkit's templates, which use the terms defined here.\n- That Veldmark is the book's fictional marketplace group.\n\n**Does not yet know:**\n\n- Which of several near-synonyms (contact, conversation, lead; entitlement, quota, effect) the book means in a given place.\n- Which chapter owns a term.\n- The other verticals' terms.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a pair of terms that are often confused, the reader finds both on the page, states the difference in their own words and names the owning chapter. *Probe:* Using only this page: what is the difference between a contact, a conversation and a lead, and between the publication state and the enforcement overlay of a listing? Which chapter owns each pair? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone can say how the page is organized and how to use it. *Probe:* After reading only the callouts and the paragraphs before the first heading: how is this page organized, and how should you use it? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the page, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-4 | Given an abbreviation, the reader uses the alphabetical index to reach its row and names what it stands for, the section that defines it and the chapter that owns it. *Probe:* Using only this page: you meet the abbreviation 'ATO' in a design review. How do you find it on this page, what does it stand for, in which section is it defined, and which chapter or chapters own it? | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** What does each of the book's terms mean, which terms is it most often confused with, and which chapter owns it?\n\n> **Claim:** Each of the book's terms has exactly one meaning, the one its owning chapter teaches, and the terms most often confused (listing and underlying entity, publication state and enforcement overlay, full snapshot and delta feed, contact, conversation and lead, entitlement and effect, system of record and read model) differ in what they count and who owns them, so a reader should look a term up beside its neighbors, follow it to its owning chapter and treat any disagreement between a chapter and this page as a defect to fix.\n\n**Disputed by:** The view that a glossary is an alphabetical word list for occasional reference, in which near-synonyms such as contact and lead can be used loosely and each team may keep its own meaning of a term as long as it documents it locally.\n\n**So what:** A reader uses one meaning per term across metrics, contracts, templates and teams, settles a disputed term by its owning chapter's worked example, and checks a regulatory or company term against its current source before it goes into a contract, a policy or a design decision.\n\n**How and why:** When 'contact' means a message in one warehouse, a lead in another and a phone reveal in a third, the group steers on numbers that cannot be compared (Vanity Liquidity); one concept under several names, or one name for several concepts, leaves filters, feeds, models and teams disagreeing about what a listing is (The Attribute Junkyard). Grouping the terms by part puts the confusable ones in one row or adjacent rows, the owning-chapter link sends the reader to the chapter whose worked example settles the meaning, and dating regulatory and company terms as of 2026 tells the reader when to look again.\n\n**Supporting claims**\n\n- **G1** — The terms most often confused differ in what they count and who owns them: one dealer message is a contact, opens a conversation and may create a lead, each counted by its own rule, and a listing's publication state and its enforcement overlay are held by different owners.\n- **G2** — Each term has one plain definition and one owning chapter whose worked example settles its meaning, so a disagreement between a chapter and this page is a defect to correct in one of them, not a second meaning.\n- **G3** — The page is built to be looked up beside a term's neighbors: sections follow the book's parts, each part's terms sit in one table with their confusable neighbors in one row or adjacent rows, every row links to its owning chapter, fictional Veldmark names stand apart in their own section, and an alphabetical index reaches every term, abbreviation and alias.\n\n## Role in the part\n\nGives the book one vocabulary with an owning chapter per term, so the templates and chapters can be read and checked against the same definitions. Supports R-2 of part `reference`.\n\n## Flow\n\n**Pattern:** `grouping` (also `chronological` in The part sections, which follow the book's part order and with it the listing's path: business, listing model, supply, discovery, trust, money, platform, leadership.)\n\nA short section on how to use the page comes first, so a reader knows the layout before the first table. The page is a lookup, so its sections group terms by the part that owns them and follow the book's order: a reader who knows which part a term belongs to finds its section without the index. The reading vocabulary (evidence labels, failure patterns) comes first because every chapter, and many rows below, use it; the Veldmark names come last so the fictional terms stay apart from the real ones; the alphabetical index closes the page because it points back into all the sections above. The parts keep the book's order because later definitions lean on earlier ones: a read model is defined from the listing system of record and a delta feed from the listing, both terms of earlier parts; with Platform before Listing, a reader looking up a read model would meet its terms before their own rows. Ordered alphabetically instead, the confusable terms of one part (contact, conversation, lead) would be split across the page and their contrast lost; with Veldmark mixed in, fictional figures would sit among real definitions.\n\n## Introduction\n\n**Hook** (`intriguing_example`): A buyer's first chat message to a dealer is a contact, opens a conversation and may create a lead, and a report that adds the three together counts nothing useful.\n\n**Bridge:** A reader arriving to look a term up, and the chapters and the toolkit's templates on the page before, which all use the book's vocabulary. → That vocabulary needs one definition and one owning chapter per term, which this page gives.\n\n**Thesis statement** (KEY POINTS bullets 1 and 2 and paragraph p01.): Every term gets a single plain definition, is placed next to the terms it is easily mixed up with, and links to the chapter that owns it; when a chapter and this page disagree, one of them needs correcting (KEY POINTS).\n\n**Roadmap** (The last sentence of p01, with the IN THIS SECTION callout; the How to Use section's first paragraph (p02) then gives the map in full.):\n\n- A section explaining how the page is laid out and how to read a row. *Kept in:* s-how.\n- A first section for the evidence labels and the fifteen failure patterns. *Kept in:* s-reading.\n- One section for each of Parts I to VIII, from the marketplace business to the Chief Architect's leadership agenda. *Kept in:* s-part-1, s-part-2, s-part-3, s-part-4, s-part-5, s-part-6, s-part-7, s-part-8.\n- A last section for the recurring Veldmark names. *Kept in:* s-veldmark.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | claim | This page is the book's dictionary for lookup, and because terms that sound alike count different things (one dealer message is a contact, a conversation and perhaps a lead), it gives each term a single plain definition beside the terms it is mixed up with and a link to its owning chapter; the next section explains the layout. | example: A buyer's first chat message to a dealer: a contact that opens a conversation and may create a lead. |  |\n\n## Sections\n\n### How to Use This Glossary\n\n**Controlling idea** (`description`, id `s-how`): The page is laid out by the book's parts, and each section's table gives short plain-language teaching definitions with their owning chapters, slash rows defining confusable terms together and Veldmark rows marked as fiction.\n\n**Advances the thesis** (G3): Gives the reader the map of the page and the way to read a row before the first table.\n\n**Transition in:** `elaboration`: The page's purpose and the layout announced at the end of p01. → The layout in full: the order of the sections and how each section and row is built.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p02 | description | The sections follow the book's structure: evidence labels and failure patterns first, then one section for each of Parts I to VIII (Part IX's case studies add few new terms), then the Veldmark names, with an alphabetical index at the end. |  |  |\n| p03 | explanation | Each section names the chapters that own its terms and then gives a Term, Definition and Chapter table of short plain-language teaching definitions, not legal text, in which slash rows define confusable terms together and Veldmark rows are fiction. |  | `elaboration`: The sections just listed. → What is inside each section: the owning chapters, the table and how to read a row. |\n\n### <a id=\"g-reading\"><\/a>Reading the Book: Evidence Labels and Failure Patterns\n\n**Controlling idea** (`definition`, id `s-reading`): The first section defines the vocabulary for reading the book itself: the five kinds of statement every chapter marks and the fifteen named failure patterns.\n\n**Advances the thesis** (G3): Puts the terms every chapter uses first, so the evidence labels and the pattern names are defined before the part sections that rely on them.\n\n**Transition in:** `sequence`: The layout just described: the first section of definitions collects the evidence labels and failure patterns. → That first section: the vocabulary for reading the book itself.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p04 | definition | The book marks every statement as one of five kinds and names fifteen recurring failure patterns; introduction explains the labels and where-listing-systems-go-wrong tells each pattern in full, and the table's last column names the guide and the chapter that does most of the repair work. | table: The Reading the Book table: 21 rows of Term, Definition and Chapter. |  |\n\n### <a id=\"g-marketplace\"><\/a>Part I — Marketplace\n\n**Controlling idea** (`definition`, id `s-part-1`): Part I's terms are the business vocabulary of a listing marketplace: its type, how it is measured and how it is decomposed, each owned by one Part I chapter.\n\n**Advances the thesis** (G2, G3): Collects one part's terms in the book's order, names the chapters that own them and keeps the terms that part's readers confuse in one table.\n\n**Transition in:** `sequence`: The book's own vocabulary for reading it: evidence labels and failure patterns. → The subject itself, starting with the business: what kind of marketplace this is, what it sells, how it is measured and how it is decomposed.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | definition | Part I's business terms (marketplace types, liquidity and its metrics, the industry's history, capabilities and bounded contexts, vertical differences) are defined in one table, each linked to the Part I chapter that owns it. | table: The Part I — Marketplace table: 39 rows of Term, Definition and Chapter. |  |\n\n### <a id=\"g-listing\"><\/a>Part II — Listing\n\n**Controlling idea** (`definition`, id `s-part-2`): Part II's terms are the domain model of the thing being sold: the listing, its identity and lifecycle, its classification and facts, its media and place, and who lists it.\n\n**Advances the thesis** (G1, G2, G3): Collects one part's terms in the book's order, names the chapters that own them and keeps the terms that part's readers confuse in one table.\n\n**Transition in:** `elaboration`: The business vocabulary of Part I. → The thing that business sells: the domain model of the listing.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | definition | Part II's listing-model terms are defined in one table, each linked to the Part II chapter that owns it, with the listing beside its underlying entity and the publication state beside the enforcement overlay. | table: The Part II — Listing table: 54 rows of Term, Definition and Chapter. |  |\n\n### <a id=\"g-supply\"><\/a>Part III — Supply\n\n**Controlling idea** (`definition`, id `s-part-3`): Part III's terms describe how inventory gets in and becomes searchable: channels and feed contracts, canonical values, duplicates, freshness and removal, and professional tooling.\n\n**Advances the thesis** (G1, G2, G3): Collects one part's terms in the book's order, names the chapters that own them and keeps the terms that part's readers confuse in one table.\n\n**Transition in:** `sequence`: The listing as modeled in Part II. → How listings arrive and become searchable.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | definition | Part III's supply terms are defined in one table, each linked to the Part III chapter that owns it, with full snapshot beside delta feed, normalization beside enrichment and duplicate detection beside entity resolution. The lead ledger and lead management are pointed to the lead that Part VI defines. | table: The Part III — Supply table: 40 rows of Term, Definition and Chapter. |  |\n\n### <a id=\"g-discovery\"><\/a>Part IV — Discovery\n\n**Controlling idea** (`definition`, id `s-part-4`): Part IV's terms describe matching buyers' intent to inventory: the index, query understanding, ranking, recommendations, map search and standing demand.\n\n**Advances the thesis** (G2, G3): Collects one part's terms in the book's order, names the chapters that own them and keeps the terms that part's readers confuse in one table.\n\n**Transition in:** `sequence`: Searchable inventory, the end point of Part III. → Matching buyers' intent to that inventory.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | definition | Part IV's discovery terms are defined in one table, each linked to the Part IV chapter that owns it. | table: The Part IV — Discovery table: 49 rows of Term, Definition and Chapter. |  |\n\n### <a id=\"g-trust\"><\/a>Part V — Trust\n\n**Controlling idea** (`definition`, id `s-part-5`): Part V's terms describe keeping the marketplace safe and lawful, and the regulatory ones are given as of 2026, with the regulation's own text taking precedence.\n\n**Advances the thesis** (G2, G3): Collects one part's terms in the book's order, names the chapters that own them and keeps the terms that part's readers confuse in one table. States that regulatory terms are dated as of 2026 and that the regulation's own text wins.\n\n**Transition in:** `cause_effect`: Matching buyers to sellers, from Part IV. → The fraud and legal duties that open matching brings, and the vocabulary for keeping the marketplace safe and lawful.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | definition | Part V's trust and regulatory terms are defined in one table, each linked to the Part V chapter that owns it, with regulatory names and status dated as of 2026 and the regulation's own text taking precedence. | table: The Part V — Trust table: 48 rows of Term, Definition and Chapter. |  |\n\n### <a id=\"g-money\"><\/a>Part VI — Money\n\n**Controlling idea** (`definition`, id `s-part-6`): Part VI's terms describe conversion and revenue: contacts, conversations and leads, the move into payments, revenue models, what is sold and delivered, and the ad stack.\n\n**Advances the thesis** (G1, G2, G3): Collects one part's terms in the book's order, names the chapters that own them and keeps the terms that part's readers confuse in one table.\n\n**Transition in:** `sequence`: A safe contact between buyer and seller, the outcome Part V protects. → Where the money starts: conversion and revenue.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | definition | Part VI's money terms are defined in one table, each linked to the Part VI chapter that owns it, with contact, conversation and lead side by side, entitlement, quota and effect side by side, gross merchandise value beside take rate, and payment-industry depth pointed to the sibling book. | table: The Part VI — Money table: 46 rows of Term, Definition and Chapter. |  |\n\n### <a id=\"g-platform\"><\/a>Part VII — Platform\n\n**Controlling idea** (`definition`, id `s-part-7`): Part VII's terms describe the distributed system underneath every earlier part: events, the system of record and read models, the customer-facing stack, data, experiments, models, tenancy and reliability.\n\n**Advances the thesis** (G1, G2, G3): Collects one part's terms in the book's order, names the chapters that own them and keeps the terms that part's readers confuse in one table.\n\n**Transition in:** `place`: Parts I to VI, which each describe one stage of the marketplace. → The one distributed system all of those stages run on.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p11 | definition | Part VII's platform terms are defined in one table, each linked to the Part VII chapter that owns it, with the system of record beside the read model and the domain event beside the change event. | table: The Part VII — Platform table: 67 rows of Term, Definition and Chapter. |  |\n\n### <a id=\"g-leadership\"><\/a>Part VIII — Leadership\n\n**Controlling idea** (`definition`, id `s-part-8`): Part VIII's terms are the Chief Architect's agenda: consolidation after acquisitions, team design and governance, migration of a live marketplace, AI across the lifecycle and decade-scale thinking.\n\n**Advances the thesis** (G2, G3): Collects one part's terms in the book's order, names the chapters that own them and keeps the terms that part's readers confuse in one table.\n\n**Transition in:** `sequence`: The platform underneath, from Part VII. → The last part's vocabulary: the Chief Architect's agenda above the platform.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p12 | definition | Part VIII's leadership terms are defined in one table, each linked to the Part VIII chapter that owns it. | table: The Part VIII — Leadership table: 30 rows of Term, Definition and Chapter. |  |\n\n### <a id=\"g-veldmark\"><\/a>Veldmark Names\n\n**Controlling idea** (`definition`, id `s-veldmark`): The recurring Veldmark names are fictional and are collected in their own last section so they stay visibly apart from the real vocabulary.\n\n**Advances the thesis** (G3): Keeps the fictional names out of the part sections and marks them as fiction, so no reader takes a Veldmark figure as a fact about a real company.\n\n**Transition in:** `contrast`: The part sections, whose terms describe real marketplace practice. → Names that are fictional: Veldmark's brands, programs, systems and decisions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p13 | definition | Everything in this section is fictional; the Veldmark names recur across chapters, so they are collected here, and meet-veldmark introduces the group, its brands, cast and systems. | table: The Veldmark Names table: 11 rows (the group, its four brands, Veldmark Ads, Tradeyard Safe Deal, Valuo, Common Ground, Yardstick and Yardstick Relay, Veldmark ID, Listing event contract v1, Ranking policy v1, the architecture advice forum), each with the chapter that uses it. |  |\n\n## Conclusion: <a id=\"g-index\"><\/a>Alphabetical Index\n\n**Synthesis:** Taken together, the part sections and the index give every term in the book one meaning and one owning chapter, so the buyer's first message to the dealer is counted as a contact, a conversation or a lead on purpose; no single section can do that alone.\n\n**So what:** A reader can settle a term before it goes into a metric definition, a contract, a policy or a template, and can trust that the chapters and the toolkit use it in the same sense.\n\n**Callback:** The hook: the dealer's first chat message that is a contact, a conversation and perhaps a lead. The reader now knows the three are separately defined terms with one owning chapter, so the message can be counted as each on purpose, never by accident.\n\n**Takeaway** (`course_of_action`): Before a term goes into a metric, a contract or a policy, look it up here, read the rows around it, follow it to its owning chapter, and check a regulatory or company term against its current source.\n\n**Hand-off** to [Bibliography: Sources and Evidence](bibliography.html): `additional_support`: The glossary's closing pointer: the sources behind the definitions, with their evidence type and publication date, are listed by topic and chapter in the bibliography. → The register of the public sources the pages cite, with the rules for weighing each by its kind and age.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | synthesis (list) | Every row term, abbreviation and common alias defined above is listed alphabetically, each linked to the section that defines it, for a reader who does not know a term's part. |  |  |\n| p15 | synthesis | Read together, the sections and the index give every term one meaning and one owning chapter, so the buyer's first message to the dealer is counted as a contact, a conversation or a lead on purpose, and a reader should settle a term here before it goes into a metric, a contract or a policy. |  | `conclusion_summary`: The index and the sections it points into. → What the page as a whole gives the reader and what to do with it. |\n| p16 | transition | The templates that use these terms are in the toolkit, and the sources behind the definitions, with their evidence type and publication date, are in the bibliography by topic and chapter. |  | `additional_support`: Settling a term before it is used. → The two other reference pages: the templates that use the terms and the dated sources behind them. |\n\n## Non-goals\n\n- Teaching any concept in depth; the linked chapter does that, with sources and the Veldmark worked example. See the owning chapter of each row.\n- Authoritative legal, standards or vendor definitions; the regulation, standard or vendor documentation wins.\n- Veldmark's cast, volumes and systems in detail; Veldmark appears only in rows that need a concrete anchor and in the short Veldmark-names section. See [Meet Veldmark: Four Brands, One Platform to Build](meet-veldmark.html).\n- Templates. See [Field Kit: Templates for the Marketplace Architect](toolkit.html).\n- Sources. See [Bibliography: Sources and Evidence](bibliography.html).\n- Every term the book mentions: narrow one-chapter devices, single vendor features and one-off Veldmark artifacts stay in their chapters to keep the page usable.\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Who re-checks the page when chapters are revised? Working assumption: a pass during each review cycle.\n- The alphabetical index was generated from the tables by a script; the lead-in sentence added before it on 2026-11-12, the GMV links to Part VI and the disambiguated index labels (Risk gate, Separability) must be kept if the index is regenerated.\n\n## Decision log\n\n- **2026-11-12** — Escalation resolved under the author's delegation: moved the Gross merchandise value (GMV) row from the Part I table to the Part VI table, before Take rate (its owning-chapter link to monetization-models unchanged), pointed both index entries for it to the Part VI section and removed the exception sentence added to the Part I lead in round 2. Rejected: Keeping the row in Part I with a stated exception (both round-3 flow readers found it broke the grouped-by-part rule).\n- **2026-11-12** — Escalation resolved under the author's delegation: KEY POINTS bullet 1 split into two sentences; the first names two pairs (listing versus underlying entity; contact versus conversation versus lead), the second the other four. No pair dropped; the clause added in round 2 ('each pair defined in one row or adjacent rows in the sections below') is replaced by 'defined side by side below'. Rejected: Moving four pairs into p01, which would move the list of unmet terms into the prose.\n- **2026-11-12** — Restored the published 'How to Use This ediated session)\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
