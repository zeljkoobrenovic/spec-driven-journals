<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, the four acceptance criteria, the thesis and the role are copied unchanged from the case-olx entry in journal-spec.json. A roadmap paragraph (p04), an interpreting paragraph under the vertical table (p43) and a conclusion section (p57, p58; p58 is the published closing paragraph moved under its own heading) were added.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** OLX's four dated phases: roll-up and rebrand (2006–2018), regional reshaping through mergers and joint ventures (2018–2021), the vertical integration bet with OLX Autos (2019–2025), and the retreat to a European core of seven markets (2022–2026: US$992 million revenue, a 48% adjusted EBITDA margin, 71% from motors, real estate and jobs).\n- **Know:** The engineering record by era: search in five stages on one engine (sort, formula, learning to rank in Solr, a separate paid-visibility objective, hybrid retrieval), the hybrid-search proof sequence, one repository with per-brand configuration, and what the record leaves out (which brands share code, La Centrale's integration, the event backbone).\n- **Believe:** A shared platform is worth the markets it serves for as long as the group keeps them.\n- **Believe:** Adjacent inventory and transactional businesses should be built to be retired cheaply, and a live search stack is improved in place with a proof sequence.\n- **Be able to:** Ask, before funding a shared capability, which markets will still be in the group in five years.\n- **Be able to:** Lay out a proof sequence for adding a new retrieval method to a live search stack, with a revenue guardrail.\n\n**Audience:** Chief and enterprise architects of marketplace groups, search and ranking leads, and engineering directors deciding which markets and adjacent businesses a shared platform should serve, and how to change a live search stack.\n\n**Already knows:**\n\n- What an API, a database, an event stream, a search engine and Kubernetes are, and the basics of machine learning.\n- Part IX's evidence rules (documented fact, the author's reading, labeled inference), from part-9 and case-adevinta.\n- Learning to rank, paid visibility in ranking and hybrid retrieval, from ranking and query-understanding; tenancy and consolidation, from multi-country-platforms and platform-consolidation.\n- Veldmark, its brands and its 2027-2028 decisions, from meet-veldmark and the chapters.\n\n**Does not yet know:**\n\n- OLX Group's corporate history, brands and owners (Naspers, Prosus).\n- Prosus's profit measures aEBIT and aEBITDA and its fiscal year ending 31 March.\n- OLX-internal names: VAS LTR, Vanilla LTR, the extension chain, Pay&Ship, Otodim, AutoIQ.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a proposed inventory business and a planned search-engine replacement, the reader uses OLX's dated record to say how each should be built or changed. *Probe:* A classifieds group wants to buy and resell used cars beside its listings, and its search team proposes replacing its Solr cluster to add vector search. Using only this chapter: what does OLX's record show for each, and how would you build or change them? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's questions, its evidence and where it ends. *Probe:* After reading only the callouts and the paragraphs before the first heading: what questions will this chapter ask, what kind of evidence will it use, and how will it end? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-4 | Every statement about OLX's internal systems that no cited source documents sits in a callout or figure caption labeled as inference, and every company fact outside those labels carries its source and publication year. *Probe:* Is there any sentence outside an `INFERENCE, NOT DOCUMENTED` callout or a labeled figure caption that describes how OLX builds or runs a system without a dated source, or a company fact with no source and year? | `custom` | rubric | major |\n\n## Thesis\n\n**Question:** What happened to OLX Group's listing platform as its portfolio shrank from 45 markets to seven and its adjacent businesses were exited, and what did its engineers change in the listing stack meanwhile?\n\n> **Claim:** OLX's record shows that the portfolio, not the platform strategy, set what its shared platform was worth: every market it left between 2018 (45 markets) and its year to March 2026 (seven) took its stack with it, and its inventory and transactional bets, led by OLX Autos, were exited or de-prioritized; meanwhile the listing stack improved by evolution in place, with Solr and BM25 kept, ranking moved into the engine, paid visibility given its own objective and vector retrieval added as a fixed quota proved first in a smaller market's fallback path; so a group should fund shared capabilities for the markets it will keep, build adjacent businesses to be switched off, and change search through a proof sequence rather than a replacement.\n\n**Disputed by:** The view that breadth across many markets is what makes a group's shared platform pay; that a classifieds group should move into owning inventory and handling transactions to capture more of each sale; and that adding vector search or modern ranking requires replacing the incumbent search engine.\n\n**So what:** A Chief Architect asks which markets will still be in the group in five years before funding a shared capability, and designs it so the others can leave; keeps an adjacent business's money with a licensed provider, its inventory systems outside the listing core and its entry points behind per-category flags; adopts OLX's hybrid-search proof sequence as a standard; makes paid visibility a named objective with an owner and puts a revenue guardrail next to the relevance metric of every ranking or retrieval change; and starts consolidation with identity and service-estate hygiene, measured in services migrated.\n\n**How and why:** OLX rolled up and rebranded local sites across four continents, merged regional businesses into joint ventures, sold Avito in 2022 and left markets through sales, mergers and joint ventures. OLX Autos reached US$1.6 billion of revenue in the year to March 2022, just over half of the classifieds business, while losing money, and Prosus exited it from 2023; pay-and-ship was de-prioritized in Europe and the credit broker and services marketplace were sold. By the year to March 2026 OLX was seven markets with US$992 million of revenue, a 48% adjusted EBITDA margin and 71% of revenue from motors, real estate and jobs. Through all of it the engineering blog documents search moving from sort to formula to learning to rank in Solr, a separate 'VAS LTR' objective for paid visibility, and hybrid retrieval rolled out in a fixed sequence after it was found to penalize paid listings; multi-brand work moved to one front-end repository for three brands and one learning-to-rank repository with per-brand configuration.\n\n**Supporting claims**\n\n- **O1** — The portfolio, not the platform strategy, set what OLX's shared platform was worth: between 2018 (45 markets) and its year to March 2026 (seven) every market that left through a sale, merger or joint venture took its stack with it, and the margin rose as the portfolio narrowed to motors, real estate and jobs.\n- **O2** — OLX's inventory and transactional bets, led by OLX Autos (about half of classifieds revenue in the year to March 2022 while losing money), were exited or de-prioritized within about six years, so adjacent businesses should be built to be switched off.\n- **O3** — Meanwhile the listing stack improved by evolution in place: Solr and BM25 kept, ranking moved into the engine as learning to rank, paid visibility given its own objective and measured causally, vector retrieval added as a fixed quota proved first in a smaller market's fallback path, and multi-brand work moved to one repository with per-brand configuration.\n- **O4** — The record is dated and uneven: eight years of engineering posts describe three different organizations, documented fact, the author's reading and labeled inference stay apart, and the evidence stops at which brands share code, La Centrale's integration and the event backbone.\n\n## Role in the part\n\nShows the portfolio, not the platform strategy, changing what a shared platform is worth, adjacent bets retired, and a listing stack evolved in place while the group around it shrank. Supports P9-3, P9-1 of part `part-9`.\n\n## Flow\n\n**Pattern:** `chronological` (also `grouping` in trade-offs, verticals, failure-modes and evidence-stops: the record read across the phases; `large_to_small` in chief-architect to questions: from the author's rules to the book's patterns, Veldmark and the reader's own group)\n\nThe rules and the timeline come first because every later fact is read in their terms. The four phases follow in time order, because each phase changed what the platform had to carry and the reader needs the portfolio before the stack. The engineering record follows the phases because it describes the business that remains after them. The cross-cutting sections draw on both and must follow them; where the evidence stops comes before the author's rules so they are not read as documented; the comparison with the book and Veldmark and the questions to ask come last because they apply the rules. The phases overlap, and the timeline lead says so. Phase 2 (mergers, from 2018) comes before Phase 3 (the inventory bet, from 2019) although their dates overlap, because the mergers shrank the footprint first and the bet's story runs on to 2025, into the retreat. Trade-offs come before vertical differences and failure modes because they name the options the other two qualify; the comparison with the book and Veldmark precedes the questions because the questions turn its verdicts into checks on the reader's own group.\n\n## Introduction\n\n**Hook** (`intriguing_example`): OLX Group has made almost every portfolio move a classifieds group can make: it rolled up local sites across four continents and rebranded many to one name, merged regional businesses into joint ventures where it kept a minority stake, built an inventory-owning car business that briefly doubled its revenue and then sold or closed it, left Russia after 2022, and by 2026 was a compact European business of seven markets with margins near 50%.\n\n**Bridge:** An architect of a marketplace group plans a shared platform for the markets the group owns today. → OLX's record asks what happens to that platform when the portfolio, not the platform strategy, changes.\n\n**Thesis statement** (KEY POINTS callout (three bullets) and paragraph p02 (the three arguments).): The portfolio, not the platform strategy, set what OLX's shared platform was worth; adjacent inventory and transactional bets were exited; and the listing stack improved by evolution in place, so a group should fund shared capabilities for the markets it keeps, build adjacent businesses to be switched off and change search through a proof sequence.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p04.):\n\n- Set the reading rules and give a dated timeline. *Kept in:* how-to-read, timeline.\n- Follow the four phases in order. *Kept in:* phase-1, phase-2, phase-3, phase-4.\n- Read the engineering record of the business that remains. *Kept in:* engineering.\n- Draw the trade-offs, vertical differences and failure modes, and mark where the evidence stops. *Kept in:* trade-offs, verticals, failure-modes, evidence-stops.\n- End with decision rules, a comparison with the book's patterns and Veldmark, and questions to ask. *Kept in:* chief-architect, comparison, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | OLX Group has made almost every portfolio move a classifieds group can make, and by 2026 it was a compact European business of seven markets reported with margins near 50%. | example: Roll-up and rebrand across four continents; regional joint ventures with minority stakes; an inventory-owning car business that briefly doubled revenue and was then sold or closed; the exit from Russia after 2022; seven markets in 2026. |  |\n| p02 | claim | OLX answers the question case-adevinta leaves open, what happens to a platform when the portfolio rather than the platform strategy changes, by asking of each phase which markets and businesses the platform carried, what the group bet on beyond listings, and what the engineers published about the stack meanwhile. | reasoning: Three questions: which markets and businesses the platform carried, what the group bet on beyond listings, what the engineers published about the stack meanwhile; three arguments: liquidity and platform value are local, adjacent bets must be built to be retired, a listing stack is improved in place. | `elaboration`: The portfolio moves just listed, and case-adevinta's question about what happens when ownership changes. → The question this case answers and the three questions asked of each phase. |\n| p03 | context | OLX's engineering blog from 2018 to 2026 describes three different organizations, so every statement about what OLX runs is true only at its date and for the market it names. | fact: The global OLX of India, Indonesia, Pakistan, South Africa and Latin America; OLX Autos; today's OLX Europe. | `elaboration`: The third question: what the engineers published. → Why that evidence must be read by era. |\n| p04 | transition | The chapter sets the reading rules and a timeline, follows the four phases in order, reads the engineering record, draws trade-offs, vertical differences and failure modes, marks where the evidence stops, and ends with decision rules, a comparison with the book's patterns and Veldmark, and questions to ask. | reasoning: The chapter's sections in order. | `sequence`: The questions and the era-bound evidence. → The route the chapter takes through them. |\n\n## Sections\n\n### How to Read This Case\n\n**Controlling idea** (`definition`, id `how-to-read`): The case keeps documented fact, the author's reading and labeled inference apart, and its evidence is good on finance and on search, ranking and trust, and thin on platform consolidation and the years before 2019.\n\n**Advances the thesis** (O4): Sets the evidence rules and the limits of the record before any fact is used.\n\n**Transition in:** `elaboration`: The roadmap's first item. → The rules for reading the record and its known limits.\n\n**Order of paragraphs** (`large_to_small`): From the rules every Part IX case follows, to how far this case's evidence reaches, to the one fictional element and where it appears. The limits are stated in the terms the rules define, so the rules come first.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | definition | Part IX cases separate three kinds of statement: a documented fact carries its source and publication year, the author's interpretation is marked 'my reading' or sits in the Chief Architect's view, and an inference appears only in a callout labeled INFERENCE, NOT DOCUMENTED. |  |  |\n| p06 | context | Three limits shape the case: the financial evidence is unusually good, the engineering evidence is strong on search, ranking, experimentation and trust and almost silent on platform consolidation, and the history before 2019 rests on secondary sources. |  | `elaboration`: The three kinds of statement. → How much of each the record supplies. |\n| p07 | context | Veldmark, the book's fictional group, appears only in the final comparison and is a composite, not a disguised OLX. |  | `contrast`: The real-company evidence. → The one fictional element and where it is used. |\n\n### Timeline: OLX in Dated Events\n\n**Controlling idea** (`evidence`, id `timeline`): OLX's history from 2006 to June 2026 is a dated sequence of roll-ups, mergers, an inventory bet, exits and one acquisition, which the four phases follow.\n\n**Advances the thesis** (O1, O2, O4): Dates every portfolio move the phases interpret, with its source type.\n\n**Transition in:** `sequence`: The reading rules. → The dated record they apply to.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | evidence | The chronology, dated by the cited releases with ownership as of October 2026 and Prosus's fiscal year ending 31 March, falls into the four phases the next sections take in turn, which overlap because the car bet began during the mergers. | table: Timeline from 2006 (founding) to June 2026 (FY26 results: seven markets, US$992 million revenue), each row with its source type.; figure: Figure 1: each phase changed what the listing platform had to carry. |  |\n\n### Phase 1: Roll-Up and Rebrand (2006–2018)\n\n**Controlling idea** (`evidence`, id `phase-1`): The 2014 rebranding consolidated brands, not platforms, while posts published from 2018 to 2020, looking back at the engineering of these global markets, show capabilities built once, run across regional markets and fitted into the existing search engine, with very different effects per market.\n\n**Advances the thesis** (O1, O3): Shows the starting point: many markets under one name, shared capabilities whose value differed by market, and the habit of evolving the existing engine.\n\n**Transition in:** `sequence`: The timeline's first rows. → The first phase in detail.\n\n**Order of paragraphs** (`chronological`): The ownership facts come first because the reading of the rebranding depends on them; the engineering examples follow, with the autosuggest table and its source note before the analysis that uses them; the data platform closes the era because it is the part most likely replaced. The December 2020 autosuggest post is a look back at capabilities built in this era for the markets it served. The posts are a look back: they were published from 2018 to 2020, and the prose says so. A subheading, 'Brand consolidation, and the global era's engineering (posts of 2018–2020)', marks where the portfolio facts end and the look back at the era's engineering begins (round 2: both flow readers stopped at the 2019-2020 dates under a 2006-2018 heading).\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | evidence | Secondary sources agree that Naspers bought into OLX in 2010, raised its stake to about 95% in 2014 and that year rebranded acquired local leaders to OLX while vertical brands kept their names. | fact: Naspers in 2010, about 95% in 2014; April 2014 rebranding in Romania, Bulgaria, Kazakhstan, Belarus, Hungary and Poland; Otomoto, Otodom, Storia, Autovit, Standvirtual and Imovirtual kept their names. |  |\n| p10 | analysis (list) | In my reading the rebranding was brand consolidation, not platform consolidation, while posts published from 2018 to 2020, looking back at these global markets, show capabilities built once, run across regional markets and fitted into the search engine already running, including an autosuggest service measured in four markets. | example: Logistic-regression coefficients plugged into the existing engine's ranking function (May 2019; about 10% improvement; search 'about 80% of total conversions'); query2vec synonyms for OLX South Africa (2018; null searches down 27%); autosuggest through Solr's suggest component (December 2020).; table: Autosuggest results per market in 2020: null searches -5.1% to -20%, search conversion +1.2% to +4.1%. | `cause_effect`: The rebranding facts. → What they did and did not change, and what the engineering record shows instead. |\n| p11 | context | The autosuggest results come from a December 2020 post, and all four markets except South Africa have since been sold, merged or reduced to a minority stake. |  | `elaboration`: The autosuggest table. → Its source and which of its markets remain. |\n| p12 | analysis | The tenfold spread in null-search reduction is, in my reading, the strongest early evidence that a shared capability must be evaluated per market, because the code was shared and the liquidity and language were not. | statistic: Null-search reductions from -2% to -20% across four markets. | `cause_effect`: The per-market results. → The lesson the book draws from them. |\n| p13 | description | Beneath these search capabilities, the era's data platform was AWS-based and has likely been replaced. | source: A 2018 GOTO Berlin talk by OLX's chief technology officer (a data lake of billions of events per day); a 2019 post on SageMaker and Step Functions pipelines; a 2023 post showing Airflow and MLflow. | `additional_support`: The era's search capabilities. → The data platform beneath them. |\n\n### Phase 2: Regional Reshaping Through Mergers and Joint Ventures (2018–2021)\n\n**Controlling idea** (`cause_effect`, id `phase-2`): From 2018 OLX concentrated through exits and three 2020 mergers that swapped operating control for minority stakes, and each market contributed to a merger took its platform with it.\n\n**Advances the thesis** (O1): Shows markets leaving with their stacks, so a shared capability was worth only the markets that stayed.\n\n**Transition in:** `time`: The roll-up of many markets. → The concentration that followed it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | evidence (list) | From 2018 the group concentrated, leaving several African and Asian markets and making three structural moves in 2020 in the United States, the Middle East and South Asia, and Brazil. | fact: OfferUp and letgo combined in March 2020 with OLX owning 40%; dubizzle and Middle East and South Asia businesses contributed to Emerging Markets Property Group for 39% in June 2020; OLX Brazil, 50/50 with Adevinta, bought Grupo ZAP for about R$2.9 billion. |  |\n| p15 | analysis | In my reading these deals swapped operating control for equity, and the record shows by omission that a market contributed to a merger takes its platform with it, the lesson case-adevinta draws from 2025 reached five years earlier. | reasoning: No source describes OLX technology shared with OfferUp, Dubizzle Group or OLX Brazil after the deals.; figure: Figure 2: from 45 markets to seven, every departing market took its stack. | `cause_effect`: The three deals. → Their architectural consequence. |\n\n### Phase 3: The Vertical Integration Bet (2019–2025)\n\n**Controlling idea** (`evidence`, id `phase-3`): OLX's bets beyond listings, led by OLX Autos, grew revenue while losing money and were exited or de-prioritized, which argues for building adjacent businesses so that they can be switched off.\n\n**Advances the thesis** (O2): Documents the inventory and transactional bets and their exits.\n\n**Transition in:** `contrast`: The regional mergers that shrank the footprint. → A bet in the other direction, stated in the section's first sentence: owning inventory beside the listings.\n\n**Order of paragraphs** (`chronological`): OLX Autos is told from entry to exit first because it is the largest bet and the one with numbers; the smaller bets follow in one table, and the only engineering view of the transactional layer closes the section.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p16 | description | In 2019 OLX bought control of Frontier Car Group, renamed it OLX Autos to buy, recondition and resell cars, and in March 2021 closed its Berlin entity and focused it on Latin America and Asia. | fact: About US$400 million invested; core product development moved to India. |  |\n| p17 | evidence (list) | OLX Autos' revenue grew while its losses widened, until Prosus announced its exit. | statistic: About US$1.6 billion revenue in the year to March 2022, up 158%, 'just over half of the classifieds business's revenue', about 175,000 cars; first-half revenue about US$1 billion and trading losses of US$206 million; exit citing 'higher cost of capital, high inflation and a reversal of pandemic trends'. | `time`: OLX Autos' set-up. → Its growth and losses. |\n| p18 | evidence | The exit ran from 2023 role cuts and sales to all OLX Autos operations disposed of, held for sale or closed by 31 March 2025, and a labeled inference explains why an inventory business needs capabilities a listing platform lacks. | fact: About 800 roles cut and car buying stopped in Argentina, Mexico and Colombia (June 2023); OLX India and the Indonesian business sold (August 2023); discontinued-operations loss of US$128 million; South Africa's AutoTrader never part of OLX Autos (marked my reading: no source in the chapter).; reasoning: INFERENCE, NOT DOCUMENTED callout: inspection, a pricing authority that commits capital, reconditioning, logistics, stock accounting, a finance book and a retail front end. | `time`: The announced exit. → How and when it was carried out. |\n| p19 | evidence | Beside OLX Autos, OLX entered several smaller adjacent businesses and has left most of them. | table: Kiwi Finance, Pay&Ship, Fixly, Inmokey and Obido, with entry, fate and source. | `additional_support`: The largest adjacent bet. → The smaller ones. |\n| p20 | analysis | The only engineering view of the transactional layer is a 2023 Pay&Ship delivery-time post, and the product's de-prioritization two years later is, in my reading, what a cheap retreat looks like from outside. | source: May 2023 post on quantile-regression delivery-time ranges; de-prioritization of pay-and-ship in Europe in the second half of FY25.; figure: Figure 3: adjacent bets on their own switches beside the listing core. | `example`: The table's Pay&Ship row. → What the record shows of one such retreat. |\n\n### Phase 4: Retreat to a European Core (2022–2026)\n\n**Controlling idea** (`evidence`, id `phase-4`): From 2022 OLX left Russia and Central Asia, bought La Centrale, and became seven markets whose margin rose and whose revenue came mostly from motors, real estate and jobs.\n\n**Advances the thesis** (O1): Shows the margin rising as the portfolio narrowed, and the verticals carrying the money.\n\n**Transition in:** `additional_support`: The exits from OLX Autos and the other adjacent bets. → Exits from whole markets beyond cars, Russia first.\n\n**Order of paragraphs** (`chronological`): The exits and the one acquisition come first because the economics that follow describe the portfolio they left; each table is followed by its note so the reading in p28 and p29 rests on figures already qualified.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p21 | evidence | Beyond cars, the retreat to a European core started with Russia: on 14 October 2022 Naspers announced the sale of Avito for RUB 151 billion in cash. | fact: Prosus held an effective 99%; about US$2.46 billion according to Euronews/Reuters, against earlier estimates of about US$6 billion. |  |\n| p22 | evidence | Central Asia followed in 2025 with agreed sales of OLX Uzbekistan and OLX Kazakhstan, whose completion the chapter treats as not confirmed. | quotation: 'sharpen our focus on core product categories and geographies' (Christian Gisy); Kazakhstan to Beeline Kazakhstan for US$75 million. | `sequence`: Russia. → The next exits. |\n| p23 | evidence | The one large acquisition of the period, La Centrale for about €1.1 billion, closed on 17 November 2025 and took OLX into France, entered through a vertical. | statistic: 13% traffic growth, 30% more leads, integration 'ahead of plan'. | `contrast`: The exits. → The one market added. |\n| p24 | evidence | Prosus reports OLX separately, so the retreat shows directly in its margins, on two profit measures defined below the table. | table: FY24 about US$660m at 25% aEBIT margin; FY25 US$777m at 35% aEBIT margin; FY26 US$992m with aEBITDA US$481m at 48%. | `cause_effect`: The portfolio after the exits and the acquisition. → What it did to the economics. |\n| p25 | definition | The profit measure changed from aEBIT to aEBITDA between FY25 and FY26, so the 35% and 48% are not the same metric, and Prosus's eight-point expansion implies about 40% in FY25. |  | `elaboration`: The margin table. → How to read its two metrics. |\n| p26 | evidence | From FY26 Prosus also reports OLX by vertical. | table: Motors US$429m at 59%; real estate US$185m at 46%; jobs US$87m at 43%; remainder about US$291m by subtraction. | `additional_support`: The group margin. → Its split by vertical. |\n| p27 | context | The vertical figures come from the Prosus release of 29 June 2026, and the remainder row is the author's arithmetic, not a reported figure. |  | `elaboration`: The vertical table. → Its source and which row is derived. |\n| p28 | analysis | Motors is the largest and most profitable line, and the three verticals bring 71% of revenue although, in the author's reading, the horizontal sites carry most of the audience; Prosus ties the growth to vertical products. | quotation: FY25 booklet: 'dealer tools', vehicle-history transparency and dealer ratings in motors; 'the rollout of a unified platform, fully reimagined app and tools optimised for agents' in real estate. | `cause_effect`: The vertical figures. → What they say about where the money is. |\n| p29 | analysis | In my reading the horizontal brand works as a funnel and the verticals monetize it, and Otodim shows a vertical launched first as a new lens on horizontal inventory. | case: Otodim, beta in Ukraine in May 2026, 'draws on OLX Ukraine's extensive listings inventory', with independent listing and messaging 'in development'. | `cause_effect`: Verticals earn most of the money from an audience the horizontal sites gather. → The reading that follows and its plainest example. |\n\n### The Engineering Record: How the Listing Stack Evolved\n\n**Controlling idea** (`evidence`, id `engineering`): OLX Europe's posts of 2022 to 2026 show one listing stack improved in place: search in five stages on Solr, a hybrid-search proof sequence, paid visibility measured causally, multi-brand work by configuration, and other capabilities summarized for their owning chapters.\n\n**Advances the thesis** (O3): Documents the in-place evolution of the stack that stayed.\n\n**Transition in:** `contrast`: The portfolio changing around the business that remains. → What the engineers of that business published about the stack meanwhile.\n\n**Order of paragraphs** (`large_to_small`): Search comes first because it is the best-documented evolution and the one the decision rules build on; the hybrid post follows the stage table because it is that table's last row in detail; paid-visibility measurement, multi-brand work, the summary table and language models then follow in falling order of relevance to the thesis.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p30 | context | The posts of 2022 to 2026 describe OLX Europe, the business that remains, and concentrate on search, ranking, recommendations, experimentation, trust and safety and language models on the supply side. |  |  |\n| p31 | evidence | OLX's search evolved through five stages on one engine, Apache Solr, the best-documented search evolution in the book's research. | table: Sort only; hand-tuned formula; LambdaMART in Solr's learning-to-rank plugin (+12% conversions on page one, +5% purchases, +4% unique buyers); 'Vanilla LTR' and 'VAS LTR'; hybrid retrieval with BM25 plus a fixed number of vectors. | `elaboration`: The topics the record covers. → The first and best-documented one. |\n| p32 | definition | Learning to rank trains a model to order results from labeled outcomes, and NDCG is the standard offline ranking metric; both are defined in the ranking chapter. |  | `elaboration`: The terms in the stage table. → Their one-line glosses. |\n| p33 | analysis | Two choices in OLX's ranker match the book's patterns: a contact as the success label, with a check that unique contacted sellers rose, and paid visibility as an explicit separate objective, the opposite of Multiplier Creep. | reasoning: A classifieds platform rarely observes the sale; a ranker can concentrate demand on a few sellers; whoever changes the ranker must see the paid objective. | `cause_effect`: The ranking stages. → What their design choices show. |\n| p34 | process (list) | The September 2025 hybrid-search post describes the order of proof as well as the design: a quota of vectors beside BM25, a ranker retrained to judge them, a modest ranker to collect data, and a first test in a smaller market's fallback path. | quotation: 'We began with 35 results from semantic search', later 'from 35 to 70'; the LTR model 'consistently assigned lower relevance scores to vector search results', a problem for VAS ads; 'a linear re-ranking model to temporarily replace LTR'; seller-contact events more than doubled in the fallback; about 3% on apps and about 5% on mobile web in the main flow.; figure: Figure 4: the hybrid design as OLX described it in 2025. | `elaboration`: The last row of the stage table. → How that step was proved. |\n| p35 | evidence | Similarity is not relevance in local classifieds: a companion 2025 post shows a similar-items test losing until location and price were brought back through re-ranking. | source: October 2025 post on offline evaluation: model chosen by memory, latency and language; offline dataset weighting favorites and chat replies above clicks. | `additional_support`: The hybrid-search rollout. → A second limit on vector retrieval. |\n| p36 | evidence | Beyond ranking paid listings, OLX treats its paid products (boost packages and VAS) as claims to be measured, using propensity matching against self-selection and group sequential testing against peeking. | statistic: Premium motors packages 'appeared to perform worse' because 'professional sellers self select'; matched uplifts of 17.6% to 97.4% (August 2026); with daily peeking 'despite a significance level of 5%, 27.9% of the simulations yielded a significant result' (August 2025). | `sequence`: Paid listings ranked by the ranker's separate paid objective. → How the value of the paid products to sellers is measured. |\n| p37 | evidence (list) | The record has three explicit, recent statements about multi-brand engineering: one front-end repository for three brands, one learning-to-rank repository with brand configuration, and identity and service-estate clean-up across 71 services. | quotation: 'One-product, three brands' (February 2026); 'all LTR projects within a single repository' with Hydra configuration (June 2025); 'standardized user identification across 71 services, with 73% now using modern UUIDs' and 'too much of everything, not enough of anything' (March 2026). | `sequence`: Search and ranking. → How the same stack serves several brands. |\n| p38 | evidence | An August 2026 post mentions a change across three codebases, two Go services and a PHP service, and a labeled inference reads the fragments as one code base per vertical serving several country brands by configuration. | fact: 'three codebases': two Go services and a PHP service.; figure: Figure 5: a reference reading of OLX Europe's multi-brand shape; all but the brand names, the ranking repository and La Centrale is inference.; reasoning: INFERENCE, NOT DOCUMENTED callout: a plausible reference architecture; which brands share which code base is not published. | `additional_support`: The three multi-brand statements. → A fourth fragment that fits them, and what the fragments together suggest. |\n| p39 | description | The rest of the record (moderation, duplicates and fraud rings, chat fraud, media and recommendations) belongs to the chapters that own each topic, and a table summarizes it with dates and links. | table: Five areas with what OLX published, date and era, and the owning chapter. | `sequence`: The multi-brand evidence. → The remaining topics of the record. |\n| p40 | evidence | OLX's 2025-2026 releases describe generative AI mostly on the supply side and in new channels, with company-reported outcomes. | statistic: Posting time cut 35-55% (2025); Auto Description 98% style and relevance, 89% faithfulness (2026); job-role extraction at 'approximately 15K per month' for about 4,000 calls a day (2024); AutoIQ; CompassGPT and AutoGPT as apps inside ChatGPT (2026). | `sequence`: The other capabilities. → The newest part of the record. |\n| p41 | analysis | In my reading the ChatGPT apps are the architecturally significant item, because serving inventory to an assistant OLX does not control turns structured attributes, availability and API-grade access into the product. |  | `emphasis`: The list of language-model uses. → The one with the largest architectural consequence. |\n\n### Trade-offs the Case Illustrates\n\n**Controlling idea** (`comparison`, id `trade-offs`): The record illustrates five options, from global breadth to evolving search in place, and shows that the portfolio decision comes before the platform decision.\n\n**Advances the thesis** (O1, O2, O3): Turns the phases and the engineering record into options with conditions.\n\n**Transition in:** `conclusion_summary`: The four phases and the engineering record. → The options they illustrate, in a table read by the paragraph that follows it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p42 | analysis | The trade-off rows draw on the phases and the engineering record and are not a maturity ladder; what OLX's record adds is that the portfolio decision comes first, since every exit went through a deal that took the market's platform with it. | table: Global breadth; exit by merger or joint venture; owning inventory; one code base per vertical with brand configuration; evolving the search stack in place, each with what OLX shows and when it is right or fails. |  |\n\n### Vertical Differences in the Record\n\n**Controlling idea** (`comparison`, id `verticals`): The options play out differently by vertical: the money is in the verticals, the audience in the general sites, and each vertical's lesson differs.\n\n**Advances the thesis** (O1): Shows why the remaining portfolio is organized by vertical.\n\n**Transition in:** `elaboration`: The options across the whole group. → How they play out by vertical, stated in the paragraph that reads the table.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p43 | analysis | The trade-off options play out differently by vertical: motors earns the highest margin from dealer products, real estate credits an undisclosed shared platform, jobs depends on normalizing free-text roles, and the general sites carry the funnel's work. | table: General classifieds, motors, real estate and jobs: examples, what the record shows, implication. |  |\n\n### Failure Modes the Record Exposes\n\n**Controlling idea** (`cause_effect`, id `failure-modes`): The record exposes five failure modes, from revenue that hides a different business to adjacent bets without an exit design.\n\n**Advances the thesis** (O2, O3): Names what went wrong or nearly went wrong so the decision rules can address it.\n\n**Transition in:** `contrast`: What the options and verticals show when they work. → What the record shows going wrong, in a lead sentence before the list.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p44 | evidence (list) | Where the options failed or nearly failed, the record shows five failure modes: revenue that hides a different business, shared capabilities assumed to have one effect, a retrieval change that silently changes revenue, identity fragmentation after a roll-up, and adjacent bets without an exit design. | example: OLX Autos' principal revenue; autosuggest from -2% to -20%; the keyword-trained ranker under-scoring vector candidates; 71 services needing standard identifiers a decade after the rebranding; four adjacent bets entered and left within about six years. |  |\n\n### Where the Public Evidence Stops\n\n**Controlling idea** (`context`, id `evidence-stops`): No public source answers how OLX Europe's brands share code, what La Centrale's integration means, what the event backbone is, how far the PHP-to-Go migration has gone, what runs chat in Europe or what the exits cost technically, and three facts are volatile.\n\n**Advances the thesis** (O4): Marks the limits of the record so the decision rules are not read as documented.\n\n**Transition in:** `contrast`: What the record shows. → What it does not.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p45 | description | Six questions that matter to an architect are not answered by any public source, and the chapter does not fill them beyond its labeled callouts. | table: Each question with what is public and what is not. |  |\n| p46 | context | Three facts are volatile as of October 2026: the completion of the Uzbekistan, Kazakhstan and Fixly sales, the status of the OLX Brasil joint venture, and the 'OLX Magic' assistant. |  | `additional_support`: The unanswered questions. → The answered facts that may change. |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `chief-architect`): The record yields five decision rules, each conditioned on the evidence: let the portfolio decide what the platform is worth, price adjacent bets as closable, change search with a proof sequence, make paid visibility a named objective, and start consolidation with identity and service-estate hygiene.\n\n**Advances the thesis** (O1, O2, O3): Turns the thesis into the author's labeled decision rules.\n\n**Transition in:** `cause_effect`: The record and its limits. → The author's decision rules drawn from it.\n\n**Order of paragraphs** (`order_of_importance`): The portfolio rule comes first because the others assume a known set of markets; the adjacent-bet rule follows because it decides what the platform carries; the three engineering rules close, from the search sequence the record documents best to the hygiene work that precedes consolidation.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p47 | transition | What I take from OLX is a set of decision rules, each conditioned on the evidence. |  |  |\n| p48 | recommendation | Let the portfolio decide what the platform is worth: before funding a shared capability, ask which markets will still be in the group in five years and design it so the others can leave. |  | `sequence`: The announcement of the rules. → The first rule. |\n| p49 | recommendation | Price adjacent bets as businesses that may be closed, keeping money with a licensed provider, inventory outside the listing core, a separate data boundary and events, and entry points flagged per category. |  | `sequence`: The portfolio rule. → The rule for adjacent businesses. |\n| p50 | recommendation | Change the search stack by evolution with OLX's hybrid-search proof sequence adopted as a standard. | figure: Figure 6: a six-step staircase from keeping keyword search to the main flow. | `sequence`: The rule for adjacent businesses. → The rule for changing search. |\n| p51 | recommendation | Make paid visibility a named objective with an owner, and put a revenue guardrail next to the relevance metric of every ranking or retrieval change. |  | `sequence`: The search proof sequence. → The guardrail it needs for paid listings. |\n| p52 | recommendation | Treat identity and service-estate hygiene as the start of consolidation, scheduled first and measured in services migrated. |  | `sequence`: The ranking rule. → The last rule, on consolidation. |\n\n### Comparing the Case to the Book's Patterns and to Veldmark\n\n**Controlling idea** (`comparison`, id `comparison`): OLX's record supports the book's patterns, strongly for local liquidity and hybrid retrieval, and sharpens five of Veldmark's choices, while the Polish overlap remains a rule the case can point toward but not validate.\n\n**Advances the thesis** (O1, O2, O3, O4): Tests the book's patterns and the fictional group's decisions against the record, at the strength the evidence has.\n\n**Transition in:** `similarity`: The author's decision rules. → The book's patterns the rules rest on, and Veldmark's choices, set beside the record.\n\n**Order of paragraphs** (`large_to_small`): The book's patterns first, then Veldmark's decisions, then the one Veldmark rule the record cannot test, so the narrowest and least supported comparison comes last.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p53 | comparison | The decision rules rest on the book's patterns, and OLX's record supports them: strongly for local liquidity and hybrid retrieval, and for brand configuration only where documented. | table: Eight book patterns with OLX's record and a verdict. |  |\n| p54 | comparison | Veldmark's Tradeyard resembles the horizontal-plus-vertical shape OLX runs in Poland and Portugal; with its brands and its scenario ledger glossed, the comparison sharpens five of Veldmark's 2027-2028 choices. | table: Safe Deal; Hearthly Direct; Ranking policy v1; the shared OpenSearch platform; the February 2028 external assistant channel, each with its OLX parallel and what the case suggests. | `sequence`: The book's patterns. → The fictional group's decisions. |\n| p55 | analysis | The Polish overlap rule is one the case can point toward but not validate, because OLX has not published how OLX.pl and Otomoto divide dealers, so Ingrid Halvorsen should make the commercial owner per listing and Motorvane's feed first-class parts of the Listing event contract. | scenario: Ledger: private car listings stay on Tradeyard with insertion fees; dealers above a small listing count are offered Motorvane packages, with stock syndicated to Tradeyard; the listing core records the brand that owns the commercial relationship.; case: OLX's money is in the verticals; Otodim builds a vertical on horizontal inventory. | `contrast`: The five choices the record sharpens. → The one it cannot test. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Eight questions turn the case into checks a group can run on its own markets, adjacent businesses, revenue, rollouts, ranking, search roadmap, identity and assistant readiness.\n\n**Advances the thesis** (O1, O2, O3): Makes the decision rules testable in the reader's group.\n\n**Transition in:** `cause_effect`: The rules and comparisons. → The questions a reader can put to their own group.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p56 | recommendation (list) | The rules become eight questions a group can put to itself, from which markets it expects to own in five years to whether its listing data is fit for an external assistant. |  |  |\n\n## Conclusion: From OLX to eBay Classifieds\n\n**Synthesis:** Asked of every phase, the three questions give one answer: which markets the platform carried was decided by deals, not by the platform; what the group bet on beyond listings was exited or scaled back; and what the engineers published shows the stack that stayed improving in place one proved step at a time. In my reading these are one rule: a shared platform is worth the markets the group keeps, so adjacent businesses should be easy to switch off and search should change in steps that can be stopped.\n\n**So what:** A Chief Architect cannot choose the portfolio but can choose a platform that follows it: funded for the markets that stay, with adjacent businesses that can be switched off and a search stack changed in stoppable steps.\n\n**Callback:** The hook (almost every portfolio move a classifieds group can make) and the three questions asked of each phase. The conclusion answers the three questions in order and joins the answers into one rule.\n\n**Takeaway** (`course_of_action`): Fund shared capabilities for the markets the group will keep, build adjacent businesses to be switched off, and change search through a proof sequence; read case-ebay-classifieds next for the integration question from the seller's side.\n\n**Hand-off** to [eBay Classifieds Group: Shared Platforms, Local Brands and a Sale](case-ebay-classifieds.html): `contrast`: OLX's closing: a group that reached for global breadth and adjacent businesses, then concentrated on a few markets and verticals while its engineers kept improving one listing stack. → The mirror image of Adevinta: a federation of national leaders with a thin shared layer, sold whole to Adevinta in 2021, the integration question seen from the seller's side of the deal.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p57 | synthesis | Asked of every phase, the three questions give one answer, which in my reading is one rule: a shared platform is worth the markets the group keeps, so adjacent businesses should be easy to switch off and search should change in steps that can be stopped. |  |  |\n| p58 | transition | OLX shows a group that reached for breadth and adjacent businesses, then concentrated while its engineers kept improving one stack, and case-ebay-classifieds follows the mirror image of Adevinta, a federation of national leaders with a thin shared layer sold whole to Adevinta in 2021, the integration question seen from the seller's side of the deal. |  | `contrast`: OLX's route: breadth, adjacent bets, concentration. → A group sold whole, seen from the seller's side. |\n\n## Non-goals\n\n- A company profile or an investment view of OLX Group or Prosus.\n- Re-teaching ranking design, hybrid retrieval, tenancy models, consolidation sequencing or transactional design; the case summarizes and links. See [Ranking for Two Sides: Relevance, Freshness and Paid Visibility](ranking.html), [What Did They Mean? Query Understanding and Autocomplete](query-understanding.html), [One Platform, Many Marketplaces: Multi-Country and Multi-Brand Architecture](multi-country-platforms.html), [After the Deal: Consolidating Platforms After Acquisitions](platform-consolidation.html), [Beyond the Contact: Payments, Shipping and Buyer Protection](transactions-and-payments.html).\n- Adevinta's side of the OLX Brasil joint venture, and automotive groups in general. See [Adevinta: From Schibsted's Copy-Paste Model to a Portfolio Platform](case-adevinta.html), [mobile.de, Auto Trader and AutoScout24: Lessons from Automotive Marketplaces](case-automotive.html).\n- OLX's moderation, media and recommendation systems in depth; a summary table links to the owning chapters. See [Trust and Safety as a Platform](trust-and-safety-architecture.html), [Photos Sell: Media Pipelines for Listings](media-pipeline.html), [Recommendations for Inventory That Disappears](recommendations.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Which OLX Europe brands share a code base, and when the real-estate 'unified platform' rolled out. Revisit if OLX publishes on it. (Carried over from spec.md.)\n- Whether La Centrale's 'integration ahead of plan' includes moving onto a shared motors platform. (Carried over from spec.md.)\n- Completion of the Uzbekistan, Kazakhstan and Fixly sales (only signing dates confirmed in the FY26 release); status of the OLX Brasil joint venture. (Carried over from spec.md.)\n- How OLX.pl and Otomoto divide dealers and listings in Poland, the evidence that would test Veldmark's Polish overlap rule. (Carried over from spec.md.)\n\n## Decision log\n\n- **2026-10-19** — Organized the case as four dated phases plus an engineering-record section, because the teaching value lies in the contrast between portfolio upheaval and steady in-place evolution of the listing stack.\n- **2026-10-19** — Treated the early history (2006-2018) as widely reported and kept it short; leaned on Prosus filings for economics, flagging the aEBIT-to-aEBITDA metric change rather than comparing margins as like for like.\n- **2026-10-19** — Showed the multi-brand shape only as a labeled inference figure built from documented fragments; refused to name which brands share code.\n- **2026-10-19** — Used the Veldmark comparison for Safe Deal, Hearthly Direct, Ranking policy v1, the OpenSearch move and the external assistant channel, plus the Polish overlap as a worked question; no new canonical facts added to the ledger.\n- **2026-11-12** — Converted spec.md to spec.json. Success criteria: the timeline, phase-figure, search-evolution, inference-callout, evidence-stops, table-and-diagram, comparison and questions-and-sources criteria were inventories of contents and are dropped; their substance is carried by the journal spec's AC-1 (decide an inventory bet and a search change from the record), AC-2 (predict the chapter from its opening), AC-3 (reverse outline) and AC-4 (inference labeled, facts sourced and dated). spec.md set no word limit, so length.max_words is the published prose length by <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
