<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, the five acceptance criteria, the thesis and the role are copied unchanged from the introduction's entry in journal-spec.json; the introduction realises the Preface's opening (hook, bridge, roadmap) from the same file.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The book's claim, and that liquidity is local (measured per place and category) and compounds.\n- **Know:** That the book is written from the position of the Chief Architect of a multi-country, multi-vertical marketplace group, and for whom.\n- **Know:** How the book is laid out: three preface pages, nine parts that follow the machine from business model to practice, and three reference pages.\n- **Know:** The five kinds of statement and why company-specific claims carry their publication year.\n- **Know:** Veldmark in one paragraph, and that fifteen named failure patterns exist.\n- **Believe:** The general manager's question of why a smaller competitor turns listings into more contacts is an architecture question.\n- **Believe:** Each architectural choice should be judged by the liquidity it protects or spends.\n- **Be able to:** Go from the decision in front of them to the chapter to start with.\n- **Be able to:** Tell a documented fact from industry practice, an inference, a recommendation and an illustration when a chapter states one.\n\n**Audience:** Experienced architects and engineering leaders working on listing marketplaces: chief and enterprise architects of marketplace groups, principal and staff engineers, search, data and ML leads, platform-engineering leads, product and engineering directors of classifieds, real-estate, automotive, jobs and recommerce marketplaces, and technology leaders integrating acquired marketplaces.\n\n**Already knows:**\n\n- What an API, a database, an event stream, a search engine and Kubernetes are.\n- How to make and defend an architecture decision.\n\n**Does not yet know:**\n\n- Marketplace economics: liquidity, network effects, multi-homing.\n- Search and ML vocabulary: learning to rank, percolation, hybrid retrieval.\n- Regulatory detail: DSA statements of reasons, DAC7, P2B.\n- Vertical specifics: VINs, property and vehicle feed standards.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader of this page alone can state the book's argument and list the subjects of its parts in order. *Probe:* After reading only this page: what does this book argue, and what will its parts cover, in order? | `custom` | cold_reader | major |\n| AC-2 | Given a decision the routing table lists, the reader names the chapter to start with and the reason the table gives. *Probe:* A brand wants to add payments, shipping and buyer protection. Using only this page: which chapter do you open first, and why not the payments chapter? | `custom` | cold_reader | major |\n| AC-3 | Given three sentences in the book's style, the reader labels each with the kind of statement it is. *Probe:* Using only this page, say what kind of statement each is and how much weight it deserves: (a) 'On Tradeyard a new listing takes six minutes to become searchable.' (b) 'I would not let the search index become the system of record.' (c) 'Adevinta's 2023 annual report, published in 2024, describes a unified global platform.' | `custom` | cold_reader | major |\n| AC-4 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the page's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this page discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the page, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** What does this book argue, who is it for, and how should it be read?\n\n> **Claim:** This book argues that a listing marketplace is a liquidity machine whose architecture should be judged by how reliably it turns fresh, trustworthy supply into matches with demand, so that a question about why a competitor gets more contacts per listing is answered at the boundaries between stages and brands; it is written from a group Chief Architect's position for architects and engineering leaders, who should read it in order along the machine or enter it from the decision on their desk, weighing each statement as documented fact, industry practice, inference, recommendation or fictional illustration.\n\n**Disputed by:** The view that listings, search, trust and monetization are separate products each judged by its own team's report, so that the competitor's lead is a product or marketing question, and that an architecture book on marketplaces is a reference on engines and vendors to consult by technology.\n\n**So what:** A reader who accepts this judges each design by the liquidity metric it protects or spends, looks for failures at the hand-offs no team owns, and treats engine and vendor choices as decisions that follow from those guarantees.\n\n**How and why:** In the general manager's scene every team's report is green while a listing takes six minutes to become searchable, a sold bike stays in alert e-mails, one flat appears three times and paid placements fill the first page. Each of those sits between two systems, and at group scale acquisitions and country launches have multiplied such boundaries across brands that nobody is accountable for as a whole.\n\n**Supporting claims**\n\n- **I1** — The general manager's question is an architecture question: matches leak at the hand-offs between systems while every team's own report is green, and the leaks recur as named patterns.\n- **I2** — A listing marketplace is a liquidity machine, so every architectural choice is judged by the liquidity it protects or spends.\n- **I3** — The book is written from a group Chief Architect's position for the people accountable for how a marketplace's systems fit together, because the boundaries cost most at group scale.\n- **I4** — Every statement is marked as documented fact, industry practice, inference, recommendation or fictional illustration and drawn only from public sources, so the reader can weigh it.\n- **I5** — The book can be read in order along the machine or entered from the decision on the reader's desk.\n\n## Role in the part\n\nPerforms the journal's and the part's opening: states the claim, the evidence discipline and the reading routes, and names the failure patterns and the group in outline so the next two pages have something to unpack. Supports PF-1 of part `preface`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `large_to_small` in organization to decision: the whole book in parts, then a single decision and the chapter that answers it)\n\nThe page answers a newcomer's questions in the order each answer is needed. Who the book is for comes first so the reader knows whether to go on. The argument comes before the reasons the book exists, because the gap it fills is a gap in judging systems by liquidity; stated first, the gap would have nothing to be a gap in. How statements are labeled and what they draw on come before the layout, because the part paragraphs and the routing table already contain facts, recommendations and Veldmark examples the reader must weigh. The routing table needs the parts it routes into, so it follows the organization. The failure patterns and Veldmark come next because they are the subjects of the next two pages. How the book is kept and made comes last: placed between the sourcing sections and the layout it read as a detour from the subject (round-1 readers), and at the end it does not interrupt the path from the book's argument to its map.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): At the end of a quarterly business review the general manager of a country's largest classifieds site shows contacts per live listing against a younger competitor with a third of the listings and more contacts per listing, and asks why; search availability was 99.95%, the moderation queue met its service level, feed imports were green every night and paid 'top listing' sales were up a fifth.\n\n**Bridge:** Every team at the quarterly business review has a green report for its own system: search availability, the moderation queue, nightly feed imports, paid placement sales. → Following one listing from the seller's first tap to the buyer's message shows that the reasons sit at the hand-offs between systems, so the general manager's question is an architecture question.\n\n**Thesis statement** (KEY POINTS callout (all three bullets); the argument section's p11 restates the claim after liquidity is defined.): A listing marketplace is a liquidity machine whose architecture should be judged by how reliably it turns fresh, trustworthy supply into matches with demand; the book is written from a group Chief Architect's position, can be read in order or from the decision on the reader's desk, and marks what kind of statement each claim is.\n\n**Roadmap** (IN THIS BOOK callout and paragraph p04, which lists this page's sections in order and then names the two other preface pages.):\n\n- Say who the book is for and what it assumes the reader knows. *Kept in:* who.\n- State the argument: a listing marketplace is a liquidity machine. *Kept in:* argument.\n- Say why the book exists and from whose position it is written. *Kept in:* why-exists.\n- Explain how statements are labeled and what material they come from. *Kept in:* how-written.\n- Show how the parts are organized and how to find the chapter for the decision in front of you. *Kept in:* organized, decision.\n- Introduce the failure patterns and the fictional group the examples come from, and the toolkit. *Kept in:* failure-patterns, veldmark.\n- Say how the book is kept current and how it was made. *Kept in:* living-journal.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | At the end of a quarterly business review, the general manager of a country's largest classifieds site shows that a younger competitor with a third of the listings gets more contacts per live listing, and asks why. | scenario: The general manager's chart of contacts per live listing against a younger competitor's estimate; the competitor has a third of the listings. |  |\n| p02 | description | Every team has a green report for its own system, so nobody owns the question, because it is not about any one system. | scenario: Search availability 99.95% for the quarter; moderation queue within its service level; feed imports green every night; paid 'top listing' sales up a fifth. | `contrast`: The general manager's question. → Each team's good answer for its own part, and why none of them answers it. |\n| p03 | claim | Following one listing from the seller's first tap to the buyer's message shows the losses sit at the hand-offs between systems, so the general manager's question is an architecture question. | scenario: Six minutes from submission to searchable because moderation and indexing run in batches; a bike sold on Monday still in Tuesday's alert e-mails; one flat listed three times by three agencies; a first page half paid placements.; figure: Figure 1: green team dashboards above a pipeline that leaks at every joint. | `problem_solution`: Nobody owns the question. → What a Chief Architect does with it: follow one listing, and find the reasons at the hand-offs. |\n| p04 | transition | The opening scene is invented, and its examples return later as cases from Veldmark, the book's fictional group; this page covers, in order, who the book is for, the argument and why the book exists, how statements are labeled and sourced, the parts and the routing table, the failure patterns, Veldmark and the toolkit, and how the book is kept current, and the next two preface pages unpack the patterns and the group. | reasoning: The page's sections in order; the next two pages, where-listing-systems-go-wrong and meet-veldmark; Part I. | `conclusion_summary`: The general manager's question as an architecture question. → The book's claim stated plainly, and the map of this page and the preface. |\n\n## Sections\n\n### Who This Book Is For\n\n**Controlling idea** (`description`, id `who`): The book is for the people accountable for how a listing marketplace's systems fit together, written from a group Chief Architect's position, and it assumes architecture literacy but no marketplace vocabulary.\n\n**Advances the thesis** (I3): Names the readers and the vantage point the thesis says the book is written from.\n\n**Transition in:** `sequence`: The map of the page. → The first item on it: the readers.\n\n**Order of paragraphs** (`large_to_small`): Readers first, then the one position the book writes from, then what it takes for granted and what it explains, so the reader can place themselves before learning what they must bring.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | description (list) | The book is written for six kinds of readers who are accountable for how a listing marketplace's systems fit together. | example: Chief and enterprise architects of groups; principal and staff engineers; search, data and ML leads; platform-engineering leads; product and engineering directors; technology leaders integrating acquisitions. |  |\n| p06 | explanation | The book takes the perspective of a Chief Architect of a multi-country, multi-vertical marketplace group, and its reasoning also applies to a single marketplace. |  | `elaboration`: The readers. → The single vantage point the book takes, and why group scale. |\n| p07 | context | The book assumes architecture literacy and does not explain APIs, databases, event streams, search engines or Kubernetes. |  | `sequence`: The vantage point. → What the reader brings. |\n| p08 | context | The book does not assume marketplace, search, regulatory or vertical vocabulary, and defines each such term where it first matters. |  | `contrast`: What the book assumes. → What it does not, with examples of terms the owning chapters define. |\n\n### The Argument: A Liquidity Machine\n\n**Controlling idea** (`claim`, id `argument`): A listing marketplace sells matches, the probability of a match is liquidity, and so the marketplace is a liquidity machine whose every architectural choice protects or spends liquidity.\n\n**Advances the thesis** (I2): States and explains the book's central claim.\n\n**Transition in:** `sequence`: Who the book is for. → What it argues.\n\n**Order of paragraphs** (`small_to_large`): From what a single seller and buyer want, to the property that names it (liquidity), to the claim about the whole machine, to what the claim means for each design choice, to where the book draws it together. Each step needs the one before it; the claim stated before liquidity is defined would be a slogan.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | claim | A listing marketplace sells matches: it usually does not own the goods or set the price, and what it provides is the probability that the two sides find each other. | example: A private seller wants a buyer for a city bike before Saturday; a dealer wants leads; an agency wants mandates; a buyer wants the item before someone else. |  |\n| p10 | definition | That probability is liquidity, which is local, measured per region and category, and compounds over years into network effects. | example: A group can be liquid in Amsterdam bikes and illiquid in rural Portuguese furniture at the same time. | `elaboration`: The probability that the two sides find each other. → Its name, liquidity, and its two properties that matter for architecture. |\n| p11 | claim | The book's central claim is that a listing marketplace is a liquidity machine, whose stages of one pipeline should be judged by how reliably they turn fresh, trustworthy supply into matches with demand. | figure: Figure 2: supply becomes listings that are published, found, trusted, contacted and paid for; outcomes and paid effects flow back. | `cause_effect`: Liquidity as what the marketplace provides. → The claim that follows from it. |\n| p12 | analysis | Read that way, every architectural choice is judged by the liquidity it protects or spends. | example: A freshness target justified by time to first contact; a removal that reaches search but not the alert digest; a paid placement as a sale of liquidity; a shared platform that is good only if every brand runs faster on it. | `cause_effect`: The claim. → What it changes about judging a design. |\n| p13 | context | Chapters work on one stage at a time, and a chapter near the end of the book, long-term-evolution, draws the argument together into fitness functions a group can measure. |  | `sequence`: The lens applied to single choices. → Where in the book the lens is applied to the whole machine. |\n\n### Why This Book Exists\n\n**Controlling idea** (`context`, id `why-exists`): Material exists on engines, on marketplace economics and on single companies, but not on the boundaries between them, and that gap costs most at group scale, which is the position the book is written from.\n\n**Advances the thesis** (I1, I3): Shows why the failures sit at boundaries no one owns, and why the Chief Architect is placed to see them.\n\n**Transition in:** `cause_effect`: The argument that a marketplace is one machine judged by liquidity. → Why existing material does not serve that argument.\n\n**Order of paragraphs** (`problem_solution`): What exists, what is missing between it, then where the gap costs most and who can see it. The book's position answers the gap, so it comes last; stated before the gap, the Chief Architect's position would read as a credential rather than as the reason the book exists.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | context | Good material exists on each side of the subject: engine documentation, marketplace economics and company engineering posts. |  |  |\n| p15 | claim | What is missing is the material between them: none says which guarantee or target protects liquidity, or what happened after a company's solution. | example: Engine documentation does not say the index must never become the system of record, or what to do when a dealer's truncated file unpublishes tens of thousands of cars at three in the morning. | `contrast`: The three kinds of material that exist. → What each leaves out. |\n| p16 | cause_effect | The gap costs most at group scale, where twenty years of portfolio building left several copies of each system and failures at boundaries no team owns, which only a Chief Architect is placed to see. | reasoning: Country launches from shared templates, acquired vertical portals, mergers and demergers left several copies of identity, search, moderation and data beneath unrelated-looking brands. | `emphasis`: The missing material between the sides. → Where its absence costs most and who can see it. |\n\n### How This Book Is Written\n\n**Controlling idea** (`explanation`, id `how-written`): The book is organized around architectural questions rather than companies or products, keeps five kinds of statement apart so each can be weighed for what it is, and rests every statement on public or generic material only.\n\n**Advances the thesis** (I4): Gives the reader the labels by which to weigh every statement, and states the material behind them, so the reader knows what no statement rests on.\n\n**Transition in:** `sequence`: The position the book is written from. → How it is written: its stance on companies and its kinds of statement.\n\n**Order of paragraphs** (`large_to_small`): The stance on companies first, because the kinds of statement exist to keep company facts apart from inference and recommendation. The three easy confusions need all five kinds named first; the date rule and the check date apply only to documented fact, so they follow it. Swapping the table and the date rule would explain a rule about one kind before the reader knows there are kinds. The material every statement rests on comes last: it applies to all five kinds at once, and the exclusion of internal material closes the section by pointing to Veldmark.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p17 | explanation | The book draws on named companies' public record but organizes its argument around architectural questions, and recommends no product in general. |  |  |\n| p18 | definition | Every chapter keeps five kinds of statement apart: documented fact, industry practice, reference-architecture inference, recommendation and illustration. | table: The five kinds with what each is and how to recognize it in the text.; figure: Figure 3: a sorting desk routes cards into five labeled trays. | `elaboration`: Real companies as precedents. → The rule that separates what the companies' record says from what the book adds. |\n| p19 | explanation | Three of the distinctions are easy to lose: a figure from Veldmark, the book's fictional group, is not a benchmark, an inference is not evidence, and a recommendation that sounds like a fact is still a recommendation. | example: Six minutes from submission to searchable at Veldmark; 'the search index is not the system of record'. | `emphasis`: The five kinds. → The three confusions to watch for. |\n| p22 | description (list) | The book draws on three kinds of material: two generic domain models, the public record of named companies and standards, regulation and research. | source: Two Productscape domain models (general listings, residential real estate) in the author's sibling repository; company blogs, reports and filings with publication years; EU regulation, feed standards and research. | `elaboration`: The five kinds of statement and the three confusions between them. → The three kinds of material every statement, except a Veldmark illustration, rests on. |\n| p23 | claim | Nothing comes from internal material, and where the public record cannot supply a realistic situation the book uses Veldmark. |  | `contrast`: The three kinds of material used. → What is excluded, and what fills the gap. |\n| p20 | explanation | Company claims carry their publication year because marketplace groups change faster than books. | quotation: Adevinta's 2023 annual report (published 2024) describes 'a unified global platform'; its 2025 strategic report (published 2026), after a 2024 take-private, describes 'a decentralised, standalone operating model'. | `elaboration`: The public record of the named companies, one of the three kinds of material. → Why each claim taken from it carries its publication date: it ages fastest. |\n| p21 | recommendation | Facts were checked against public sources in October 2026, so date-sensitive statements are pointers to sources to check before relying on them. |  | `sequence`: Dated claims. → The date the book's facts were checked. |\n\n### How the Book Is Organized\n\n**Controlling idea** (`description`, id `organized`): After three preface pages, eight parts follow the liquidity machine from the business to the Chief Architect's agenda, Part IX tests the patterns against public cases, and reference pages close the book.\n\n**Advances the thesis** (I5): Gives the order for reading along the machine.\n\n**Transition in:** `sequence`: How the book's statements are labeled, sourced and dated: the rules for weighing them. → How its chapters are laid out.\n\n**Order of paragraphs** (`chronological`): The overview table and figure first, so each part paragraph can be placed in the whole; then one paragraph per part in book order, which is the order a listing moves through the machine, so the reader meets the parts as they will read them; the shape every chapter shares comes last because it applies to all parts at once.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p24 | description | The book has three preface pages, eight parts that form a learning path along the machine, a Part IX of public cases and reference pages. | table: One row per section: the question it answers and its chapters, Preface to Reference.; figure: Figure 4: Parts II to VI follow a listing; Part I sets the business terms; Part VII is the platform; Part VIII keeps it coherent; Part IX tests against evidence. |  |\n| p25 | explanation | Part I starts with the business because the business model decides the architecture. | example: A site whose job ends at the contact, a lead-selling portal and a marketplace holding buyers' money need different identity, trust, payment and data systems. | `sequence`: The layout. → The first part. |\n| p26 | explanation | Part II models the listing as an offer about a thing, not the thing itself. |  | `sequence`: The business. → The thing being sold. |\n| p27 | explanation | Part III treats supply as one chain from ingestion to publication with contracts and a freshness target, in which removal must be faster than publication. |  | `sequence`: The listing model. → The model under load from feeds and forms. |\n| p28 | explanation | Part IV treats listing search as a high-write operational system and search, ranking, recommendations, map search and alerts as one pipeline. |  | `sequence`: Supply. → The buyer's side. |\n| p29 | explanation | Part V treats trust and safety as a platform capability with shared services and local policy. |  | `sequence`: Discovery. → Contact between strangers. |\n| p30 | explanation | Part VI argues that conversion and monetization are one pipeline with a conflict built in. |  | `sequence`: Trust. → The path from message to invoice. |\n| p31 | explanation | Part VII builds the platform underneath and claims a shared platform earns trust through contracts, not mandates. |  | `sequence`: The stages. → The system beneath them. |\n| p32 | explanation | Part VIII is the Chief Architect's agenda and claims the hard problems of a group are problems of change, not of design. |  | `sequence`: The platform. → Keeping it coherent over a decade. |\n| p33 | explanation | Part IX steps outside the fiction and tests the book's patterns against six publicly documented cases. |  | `contrast`: The fictional group's agenda. → Real groups, with documented fact kept apart from interpretation. |\n| p34 | description | Every part opens with a short introduction and every chapter follows the same shape. |  | `sequence`: The nine parts. → What a reader meets inside each part and chapter. |\n\n### Start With the Decision in Front of You\n\n**Controlling idea** (`recommendation`, id `decision`): A reader with a decision waiting finds the matching row and starts with the chapter the table names, which is sometimes not the obvious one.\n\n**Advances the thesis** (I5): Gives the second route into the book: from the decision on the reader's desk.\n\n**Transition in:** `contrast`: The parts as a learning sequence. → The route for a reader who already has a decision waiting.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p35 | recommendation | A reader with a decision waiting finds the matching row, reads the Start with chapter and follows the Then column if needed. | table: Fifteen rows from an immediate need to a starting chapter and follow-up chapters. |  |\n| p36 | analysis | Two rows start somewhere unexpected on purpose: payments start with the marketplace model because it decides who holds the money and the risk, and a shared platform starts with what differs between verticals because a platform built for one is often imposed on the others. | example: The payments row starts at the marketplace taxonomy because moving from contact to transaction changes who holds the money and the risk; the single-platform row starts with vertical requirements because platforms built for one vertical are imposed on others. | `emphasis`: The routing table. → The two rows that start somewhere unexpected, and why. |\n\n### The Failure Patterns\n\n**Controlling idea** (`context`, id `failure-patterns`): Marketplaces lose liquidity through recurring patterns that each looked reasonable when chosen, and the next page names fifteen of them so a design review can name one and go to the remedy.\n\n**Advances the thesis** (I1): Shows that the losses at hand-offs recur in named forms.\n\n**Transition in:** `sequence`: The two ways into the chapters. → What every chapter of Parts I to VIII opens with, whichever way the reader enters: named failure patterns and a Veldmark scene, each the subject of the next preface page; the patterns first.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p37 | context | Listing marketplaces lose liquidity through recurring patterns that each looked reasonable when chosen, which the next page names and every chapter refers to. | example: The Category Straitjacket, Feed Roulette, Ghost Inventory, Multiplier Creep, Deal-Shaped Architecture, Set-and-Forget AI. |  |\n\n### Veldmark and the Toolkit\n\n**Controlling idea** (`description`, id `veldmark`): The examples come from one fictional group, Veldmark, to be used as a rehearsal space, and the toolkit and glossary hold the  | Transition in |\n| --- | --- | --- | --- | --- |\n| p40 | context | The book is a living journal, and each chapter's spec, linked from its byline, shows what it was written against and where its limits are. |  |  |\n| p41 | context | The book was developed by AI-mediated authoring in which the author set the concept and arguments and is responsible for the content. |  | `elaboration`: The specs behind each chapter. → How they were used to make the book, and who answers for it. |\n\n## Conclusion: Where to Go Next\n\n**Synthesis:** Liquidity is lost at the boundaries between stages and brands, and the parts, the routing table, the failure patterns and the fictional group all lead to one question about a design: which liquidity it protects or spends, and at which boundary.\n\n**So what:** The general manager's question, which no team's green report answers, becomes one the reader can trace to a hand-off and an owner; each chapter answers it for one stage or boundary.\n\n**Callback:** The general manager's question in the opening scene. The reader now sees it as the question every chapter answers for one stage or boundary of the machine.\n\n**Takeaway** (`course_of_action`): Read on in order with where-listing-systems-go-wrong, then meet-veldmark, or use the routing table and return to the preface later, keeping the general manager's question in mind.\n\n**Hand-off** to [Unlisted: Fifteen Ways Listing Systems Go Wrong](where-listing-systems-go-wrong.html): `elaboration`: The liquidity-machine claim and the short list of pattern names from this page. → Each of the fifteen patterns unpacked, as ways the machine loses liquidity.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p42 | recommendation | A reader going in order turns next to where-listing-systems-go-wrong, which unpacks the patterns named here, then meet-veldmark; a reader with a decision uses the routing table. |  |  |\n| p43 | synthesis | Either way, the general manager's question becomes one the reader can trace to a hand-off, because the parts, the routing table, the patterns and Veldmark all ask of a design which liquidity it protects or spends and at which boundary. |  | `conclusion_summary`: The two routes. → What both have in common: the general manager's question. |\n\n## Non-goals\n\n- The fifteen failure patterns themselves. See [Unlisted: Fifteen Ways Listing Systems Go Wrong](where-listing-systems-go-wrong.html).\n- Veldmark's full description, cast, systems and worked examples. See [Meet Veldmark: Four Brands, One Platform to Build](meet-veldmark.html).\n- The part-by-part synthesis, the four cross-cutting ideas, stressor analysis and fitness functions. See [Built to Be Replaced: Evolving a Marketplace Platform Over a Decade](long-term-evolution.html).\n- Part-level reading guidance. See [Part I — MARKETPLACE: The Business Behind the Listings](part-1.html), [Part II — LISTING: Modeling the Thing Being Sold](part-2.html), [Part III — SUPPLY: Getting Inventory In](part-3.html), [Part IV — DISCOVERY: Matching Intent to Inventory](part-4.html), [Part V — TRUST: Keeping the Marketplace Safe](part-5.html), [Part VI — MONEY: Conversion and Monetization](part-6.html), [Part VII — PLATFORM: The Distributed System Underneath](part-7.html), [Part VIII — LEADERSHIP: The Chief Architect's Agenda](part-8.html), [Part IX — PRACTICE: How Others Built It](part-9.html).\n- Definitions of marketplace terms in depth, and the industry timeline. See [Glossary: The Language of Listing Systems](glossary.html), [From Newspaper Columns to Portfolios: How the Classifieds Industry Evolved](industry-evolution.html).\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-10-19** — Modeled on RECONCILED's introduction (scene, audience, why it exists, evidence table, structure table, routing table, fictional-company paragraph, living-journal note), with its reconciliation framing replaced by the liquidity-machine argument. <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
