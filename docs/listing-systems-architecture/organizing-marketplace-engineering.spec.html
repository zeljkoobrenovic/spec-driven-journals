<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, acceptance criteria AC-1 to AC-3, the thesis and the role are copied unchanged from the organizing-marketplace-engineering entry in journal-spec.json; the supporting claims, audience and AC-4/AC-5 are this spec's own. Units added by this conversion: introduction roadmap p04, lead-ins p56 (Trade-offs), p57 (Vertical Differences), the lead sentences of p59 and p65, and a conclusion widened to two paragraphs (p66 synthesis and callback, p67 hand-off).\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Conway's law as a design tool; the four team types and three interaction modes, and the marketplace team topology that assigns them to journeys, bounded contexts and shared capabilities.\n- **Know:** Platform teams as internal products (team API, contract, roadmap, migration help), decision rights across group, platform and brand, the advice process and its forum, funding models by phase, and the roles of architects.\n- **Believe:** Ownership is the unit of design: a capability exists as many times as there are teams that believe they own it.\n- **Believe:** A platform team earns its tenants; adoption by mandate without a contract produces shadow copies.\n- **Be able to:** Draw a group's team topology on the same map as its capabilities and contexts, and find orphaned and split ownership.\n- **Be able to:** Write a decision-rights matrix and set up an advice process with recorded decisions.\n- **Be able to:** Choose a funding model for each shared platform by the reason it is shared.\n\n**Audience:** Chief and enterprise architects, CTOs, heads of platform engineering and engineering directors of marketplace groups, especially after acquisitions.\n\n**Already knows:**\n\n- What an API, a database, an event stream, a search engine and Kubernetes are; Team Topologies and architecture decision records by name.\n- From earlier chapters: the capability map (business-capabilities), the context map and one owning team per bounded context (bounded-contexts), the tenancy model and the March 2027 phishing rule (multi-country-platforms, trust-and-safety-architecture), the search platform and Listing Search API v1 (search-architecture), ranking (ranking), Tally (products-and-entitlements), the ML platform (ml-platform), the bikes split (categories-and-taxonomies), and platform-consolidation's consolidation sequence.\n- Veldmark (fictional): Tradeyard, Motorvane, Hearthly and Keybridge with its March 2027 neutrality commitment, Yardstick, Safe Deal, Valuo, Veldmark ID, the Common Ground program (€140 million), the architecture advice forum, and the cast (Ingrid Halvorsen, Mateus Carvalho, Yara Mendes, Daan Visser, Sven Lindqvist, Tomasz Wiśniewski, Priya Raman, Aisha Rahman, Olivier Petit, Femke).\n- The failure-pattern names (The Forced Fit, The Copy-Paste Country, Deal-Shaped Architecture, Set-and-Forget AI).\n\n**Does not yet know:**\n\n- The terms this chapter owns: marketplace team topology and architecture governance.\n- The inverse Conway maneuver; the four team types and three interaction modes in detail; cognitive load as a design limit; the team API; the decision-rights matrix; the advice process; showback, chargeback, fixed allocation and internal market as funding models.\n- Common Ground organization v1 and the engineering baseline (158 teams).\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given an incident that crosses brands, the reader traces it to an ownership defect and names the organizational design that fixes it. *Probe:* A group's largest brand writes a fraud rule in its home country within minutes of an incident. The rule reaches a second country three days later, with a monolith deploy, and never reaches two others, where moderation is run by outsourced vendors; a sister brand never learns that the fraudster's phone number also registered there. Using only this chapter: what is the defect, and what do you change? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-4 | Given a group with one product in several countries and a policy-driven platform, the reader chooses the axis for stream-aligned teams, says when a country team is justified, and picks a funding model for the policy-driven platform with the reason. *Probe:* A brand runs the same classifieds product in four countries with a full-stack team per country, and the group is about to charge its brands per moderation decision for a shared trust-and-safety platform. Using only this chapter: how should the brand's teams be cut, when would a country team still be justified, and how should the trust-and-safety platform be funded? | `custom` | cold_reader | minor |\n| AC-5 | Every statement about a real company carries its date and source, and the reading of Adevinta's reorganizations as Conway's law in reverse is labeled as inference. *Probe:* Does any claim about a real company lack a date or source, or present inferred internals as fact? | `custom` | rubric | minor |\n\n## Thesis\n\n**Question:** Which organizational design makes a multi-marketplace architecture work?\n\n> **Claim:** A group of marketplaces builds each shared capability once and gets a fix, such as a fraud rule, into every brand and country within hours rather than days only when every buyer and seller journey, bounded context and shared capability has exactly one owning team within its cognitive load: stream-aligned brand teams cut by journey rather than by country, platform teams that offer shared capabilities as internal products with a published contract, a roadmap and migration help, and specialist teams only for rare subsystems such as ranking and valuation; and when cross-brand decisions are made through an open, recorded advice process under an explicit matrix of what the group, the platforms and each brand decide, rather than by an architecture review board that owns nothing.\n\n**Disputed by:** Federated guilds in which brand teams build platforms 'on behalf of the group' and nobody owns them; or a central product-and-technology organization that owns every product and platform, adopted by mandate and deadline and governed by an architecture review board that approves designs.\n\n**So what:** A Chief Architect who accepts this reviews the capability map, the context map and the team topology together twice a year and treats any orphaned or split ownership as a defect with a fix and a date; measures each platform team by tenants in production, onboarding cost and remaining shadow copies; funds platform build centrally, then by showback, then by allocation, fixed for policy-driven platforms such as trust and safety; and keeps escalations from the advice forum to about one decision in ten.\n\n**How and why:** On 7 March 2027 a phishing rule written by Tradeyard Netherlands reached Belgium on 10 March, with a Yardstick deploy, and never reached Poland or Portugal, whose moderation two outsourced vendors ran; Motorvane never learned that the fraudster's phone number had registered there. Veldmark had about 1,150 engineers in 158 teams, and none of the nine Common Ground capabilities had exactly one owning team. After Common Ground organization v1 (decided 22 June 2027), by December 8 of 9 did, country-cut teams fell from 17 to 4, and cognitive-load flags from 23 to 9; the forum logged 74 cross-brand decisions at a median of nine working days, six escalated to the CTO. Replayed on the shared platform, the rule reached every subscribing tenant within an hour: the rule engine had not changed, the ownership had.\n\n**Supporting claims**\n\n- **S1** — Ownership is the unit of design: every journey, bounded context and shared capability needs exactly one owning team within its cognitive load, and an incident that reaches markets unevenly is an ownership defect.\n- **S2** — Stream-aligned teams are cut by journey within a brand, with countries carried by product roles and configuration; a country team is justified by a different product, not a different language; specialist teams exist only for rare subsystems and own their runtime.\n- **S3** — Platform teams earn tenants as internal products with a product owner and tenant-facing roadmap, a contract, self-service onboarding, migration help and cost transparency, funded so that using the platform is a brand's cheapest option: central build, then showback, then usage allocation for cost-driven platforms and fixed allocation for policy-driven ones; mandates without these produce shadow copies.\n- **S5** — Cross-brand decisions are made through an open, recorded advice process under an explicit decision-rights matrix, with executive escalation only for money, people and personal data, not by a review board.\n\n## Role in the part\n\nAssigns an owning team to every journey, context and shared capability that consolidation moves, and sets the decision rights and forum through which cross-brand decisions are made. Supports P8-2 of part `part-8`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in scene poses the phishing rule and Mateus's question; worked-example answers them after the body has built the design; `grouping` in trade-offs, verticals, failure-modes, ca-view, questions: the book's standard judging sections)\n\nThe scene comes first because its incident and team lists are the problem the chapter solves. Concepts follow because the architecture uses team types, the axis, ownership and governance; placed later, the topology would be described in words the reader cannot yet separate. The architecture comes before the public record so the record has a design to test, and the record comes before Veldmark's worked example so that Veldmark's options can be read against what real groups did; placed before the architecture, the worked example would cite team APIs, matrices and funding models not yet explained. The judging sections apply the whole design, so they come last.\n\n## Introduction\n\n**Hook** (`direct_statement`): Marketplace groups are usually assembled, not designed, and each capability exists as many times as there are teams that believe they own it.\n\n**Bridge:** Architects of groups built by acquisition know the picture of four identity systems and four trust-and-safety stacks. → The book's shared platforms need owning teams, interaction modes, funding and a way to decide across brands.\n\n**Thesis statement** (KEY POINTS callout (three bullets), with the WHY callouts and the failure-patterns callout; p01 states the ownership principle and p03 the two terms.): Assign one owning team to every journey, context and shared capability; run platforms as internal products that earn tenants; govern with recorded decisions and open advice under explicit decision rights rather than an approval board.\n\n**Roadmap** (Paragraph p04, with the IN THIS CHAPTER callout.):\n\n- Open with the March 2027 phishing rule and the team lists behind it. *Kept in:* scene.\n- Define the team types and the parts of governance. *Kept in:* concepts.\n- Design a topology with platform teams, decision rights, an advice process, funding and the architects who run it. *Kept in:* architecture.\n- Test it against what classifieds groups have published. *Kept in:* record.\n- Follow Veldmark's Common Ground organization through its first year. *Kept in:* worked-example.\n- Close with trade-offs, vertical differences, failure modes, the Chief Architect's view and questions to ask. *Kept in:* trade-offs, verticals, failure-modes, ca-view, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | claim | Marketplace groups are assembled rather than designed, so each capability exists as many times as there are teams that believe they own it. | reasoning: A founding marketplace's engineering organization, the organizations acquisitions bring, a group function; four identity systems and four trust-and-safety stacks. |  |\n| p02 | context | The book's shared platforms do not survive an organization with no team to own them, so after platform-consolidation set the order of moves, this chapter covers who owns which journey, capability and decision, how teams interact, how they are paid for and how cross-brand decisions are made; modernization-and-migration then moves the code. |  | `contrast`: Groups whose capabilities are duplicated because several teams own them. → The shared platforms the technical chapters argue for, and the organization they need. |\n| p03 | definition | The chapter owns two terms: a marketplace team topology assigns team types and interaction modes to journeys, bounded contexts and shared capabilities, and architecture governance is the set of decision rights, forums, records, principles and standards through which decisions are made and revisited. | reasoning: Definitions of marketplace team topology and architecture governance; pointers to bounded-contexts and multi-country-platforms. | `elaboration`: Who owns which journey, capability and decision. → The two terms that name the answer. |\n| p04 | context | The chapter moves from the March 2027 phishing rule and the team lists behind it to the concepts, a designed topology with decision rights, advice process, funding and the architects who run it, the public record, Veldmark's Common Ground organization in its first year, and the closing trade-offs, vertical differences, failure modes, Chief Architect's view and questions. |  | `sequence`: The two terms. → The order in which the chapter develops them. |\n\n## Sections\n\n### Setting the Scene at Veldmark: The Rule That Reached Belgium Three Days Late\n\n**Controlling idea** (`context`, id `scene`): A phishing rule that protected Tradeyard Netherlands within minutes reached Belgium three days late and Poland, Portugal and Motorvane never, because several teams each owned a piece of trust and safety and no team owned the whole.\n\n**Advances the thesis** (S1): Poses the chapter's problem as an ownership defect.\n\n**Transition in:** `example`: Ownership as the unit of design and the roadmap's first promise, the March 2027 rule. → The incident itself.\n\n**Order of paragraphs** (`problem_solution`): The incident comes first, then its cause in the team lists, then the question the cause raises; the question would make no sense before the reader has seen the split ownership.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | example | On Sunday 7 March 2027 Tradeyard NL's trust-and-safety team handled a fake Safe Deal payment link well: reported at 20:19, account suspended at 20:26, and a new rule withheld 37 similar messages that evening. | scenario: Femke's city bike on Tradeyard NL; fake Safe Deal link at 20:11, report 20:19, suspension 20:26, 37 messages withheld. |  |\n| p06 | example | The same rule reached Tradeyard Belgium only on Wednesday 10 March with a Yardstick deploy, never reached Poland or Portugal, whose moderation two outsourced vendors ran, and Motorvane never learned the fraudster's phone number had registered there. | scenario: Belgium on 10 March via the twice-weekly Yardstick deploy; Poland and Portugal never; the Motorvane private-seller account. | `contrast`: The rule worked in the Netherlands. → Its uneven reach everywhere else. |\n| p07 | evidence | Ingrid reads the incident as an organization chart and collects four team lists in four formats, totalling about 1,150 engineers in 158 teams cut in different ways. | table: Engineers, teams, how teams are cut and architecture function per brand: Tradeyard about 430 (61 teams, about 140 engineers shipping only with Yardstick), Motorvane about 290 (38), Hearthly about 250 (33), Keybridge about 70 (10), group functions about 110 (16); total about 1,150 and 158. | `contrast`: The uneven reach of the rule. → Ingrid's reading of it as an organizational, not a trust-and-safety, failure, and the team lists. |\n| p08 | analysis | The team list explains the incident: trust and safety for Tradeyard was split between an in-house team and two vendors, and the capability map found the same shape in identity, search, catalog and analytics, where several teams each owned a piece and no team owned the whole. | figure: Figure 1: one rule reaching four countries by different paths.; fact: Capability map presented 31 March 2027 (business-capabilities). | `cause_effect`: The team list. → What it explains: split ownership as the cause. |\n| p09 | context | Mateus Carvalho asks the chapter's question: with €140 million and four years for Common Ground, who will own the shared platforms, who will use them, and who decides when the two disagree? |  | `cause_effect`: No team owned the whole of any shared capability. → The CTO's question about owners, users and decisions. |\n\n### Concepts: Teams as Part of the Architecture\n\n**Controlling idea** (`definition`, id `concepts`): Teams are part of the architecture: Conway's law, cognitive load, Team Topologies' four team types and three interaction modes, the axis that cuts stream-aligned teams, ownership of journeys, contexts and capabilities, and the five parts of governance give the vocabulary the design needs.\n\n**Advances the thesis** (S1, S2, S5): Defines the terms the design uses.\n\n**Transition in:** `problem_solution`: Mateus's question about owners, users and decisions. → The observation about teams and systems that starts the answer.\n\n**Order of paragraphs** (`prerequisite_order`): Conway and cognitive load justify thinking in teams; the team types are then needed to choose an axis; ownership needs the types; governance comes last because it is how owners decide together. Reversed, the axis would be chosen before the reader knows what a stream-aligned team is.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | claim | Conway's law, read in reverse as the inverse Conway maneuver, is a design tool: to get a shared search platform, create a team whose job is the search platform and give brands a reason to depend on it. | source: Conway (1968): designs copy communication structures; four brands with four organizations have four identity systems. |  |\n| p11 | explanation | The maneuver has two limits: changing teams does not change code, and a team can handle only so much complexity before breaking down. | quotation: Team Topologies: \"Teams can only handle so much complexity before breaking down\"; a team owning insertion in four countries, the pro-seller API and the image pipeline. | `contrast`: The inverse Conway maneuver as a design tool. → Its two limits. |\n| p12 | definition | Team Topologies' four team types and three interaction modes map onto a listing marketplace with concrete examples. | table: Stream-aligned, platform, complicated subsystem and enabling teams with marketplace and Veldmark examples.; table: Collaboration, X-as-a-Service and facilitation with when each fits. | `elaboration`: Skelton and Pais's principle on complexity. → Their team types and interaction modes. |\n| p13 | analysis | An interaction mode belongs to a pair of teams at a point in time: collaboration that never ends means the platform has no contract, and X-as-a-Service from day one means it was designed without its tenants. |  | `elaboration`: The three interaction modes. → How modes change over time and what a stuck mode signals. |\n| p14 | comparison | Every marketplace organization must choose the axis that cuts its stream-aligned teams, country, journey or capability layer, and each has a characteristic weakness. | table: Country, journey and capability-layer teams with strength and weakness. | `elaboration`: The stream-aligned team type. → The axis along which those teams are cut. |\n| p15 | recommendation | For one product in several countries, stream-aligned teams should be cut by journey within a brand, with the country carried by product roles and configuration; a country team is justified by a different product, not by a different language. | scenario: Tradeyard Poland's vehicles and property sections with insertion fees. | `cause_effect`: The weaknesses of country and layer teams. → The recommended axis and its exception. |\n| p16 | explanation | Across brands the same journey stays separate, because dealer supply and agency supply are different products, and what they share is a platform, not a shared team. | example: Motorvane dealer supply and Hearthly agency supply; shared supply contract, validator library and taxonomy. | `contrast`: One journey team per journey within a brand. → Why journeys are not merged across brands. |\n| p17 | definition (list) | Ownership is the unit of design: the rule of one owning team per bounded context extends to journeys, contexts and shared capabilities. |  | `elaboration`: The shared part as a platform with an owner. → Ownership as the unit of design, over three kinds of thing. |\n| p18 | definition | An owner is the team woken up when the thing breaks, that decides its roadmap and answers for its cost; a consulted team or a committee is never an owner. |  | `elaboration`: The three kinds of thing to own. → What owning one means. |\n| p19 | definition | Architecture governance has five parts, decision rights, decision records, principles, a forum, and standards and golden paths, and review is the least important. | table: The five parts, what each is and the failure when it is missing. | `sequence`: Owners of journeys, contexts and capabilities. → The chapter's second term: how owners make decisions together. |\n| p20 | definition | Nygard's 2011 architecture decision record is still the common shape of a decision record. | source: Title, context, decision, status, consequences. | `elaboration`: Decision records as one of the five parts. → Their standard format. |\n| p21 | definition | Harmel-Law's advice process replaces approval with one rule: anyone may make an architectural decision after seeking advice from those affected and from experts and recording it, supported by records, an open weekly forum, principles and a radar. | source: \"anyone can make an architectural decision\"; weekly open architecture advisory forum. | `additional_support`: Decision records. → The advice process that rests on them. |\n\n### Architecture: A Topology for a Group of Marketplaces\n\n**Controlling idea** (`description`, id `architecture`): A group of marketplaces should stack journey-aligned brand teams on platform teams run as internal products, with specialists and enablers beside them, governed by an explicit decision-rights matrix and an advice process, funded by the reason each platform is shared, and served by few architects placed where decisions are made.\n\n**Advances the thesis** (S1, S2, S3, S5): Specifies the design.\n\n**Transition in:** `elaboration`: The four team types and the five parts of governance. → How they combine into one topology for a group.\n\n**Order of paragraphs** (`large_to_small`): The whole topology first, then platform teams inside it, then the decision rights, advice process and funding that govern those teams, then the architects who run governance. Funding before decision rights would price platforms nobody has yet been given the right to define.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p22 | description | Applied to a group of marketplaces, the team types stack: stream-aligned teams per brand and journey on top, platform teams per shared capability beneath, complicated-subsystem teams beside them and enabling teams moving between them. Veldmark's adopted topology is shown as a preview of the decision the worked example tells. | figure: Figure 2: Veldmark's Common Ground team topology (target 2028), introduced as a preview of the June 2027 decision; Keybridge outside the platform organization because of its March 2027 neutrality commitment (it publishes agencies' listings to Hearthly's competitors). |  |\n| p23 | explanation (list) | Three properties of the topology matter more than its boxes: dependencies point down through published contracts, specialists serve brands through platforms while brands keep the objective, and enabling teams are temporary by design. | example: Tradeyard's listing events via a contract; ranking models served through the search platform; the Yardstick Exit team ending by 2029. | `elaboration`: The topology in Figure 2. → The three properties that make it work. |\n| p24 | claim | A platform team differs from a shared-services department in five things: a product owner with a tenant-facing roadmap, a contract, self-service onboarding, migration help, and run responsibility with cost transparency. | table: Each of the five, why it matters and the evidence that it is missing. | `elaboration`: Platforms beneath the brands. → What makes a platform team a product. |\n| p25 | evidence | Adevinta's internal platform is the best-documented classifieds example that voluntary adoption with migration help works, so a mandate belongs only after the platform is clearly cheaper. | source: Common Platform for about 1,500 engineers in about 20 marketplace companies, voluntary adoption, about ten minutes onboarding, embedded platform engineers (2019 talk, written up January 2020); SCHIP serving more than 4,000 developers by 2023.; figure: Figure 3: a platform that earns tenants versus a fenced, mandated one. | `example`: The five things a platform team needs. → The public example of a platform that had them. |\n| p26 | description | Governance starts with a decision-rights matrix saying what the group, platform teams, brand engineering and brand product each decide, advise on or are told; Veldmark's matrix serves as the example, introduced with a one-sentence preview of the advice forum (open, weekly, set up in April 2027) that adopted it, which the worked example describes. | table: Veldmark's matrix adopted April 2027, revised September: sharing, contract, engine, brand features, brand architecture, exceptions, personal data, funding. | `sequence`: The teams of the topology. → Who decides what among them. |\n| p27 | analysis | The matrix lets brands decide exceptions themselves if they record them, and keeps the decision to share a capability with the CTO after the forum has heard the brands, because it moves money and people. |  | `elaboration`: The matrix. → Its two deliberate features. |\n| p28 | process | Under the advice process most cross-brand decisions stay with the team that proposes them, and only those moving funding, people or personal data go to an accountable executive. | figure: Figure 4: the advice process applied to cross-brand decisions. | `elaboration`: Exceptions decided by brands and sharing decided by the CTO. → The path a cross-brand decision takes. |\n| p29 | analysis | The advice process gives up approval but keeps public advice, recorded decisions and a review date or trigger on every record. | figure: Figure 5: review board queue versus open advice forum. | `elaboration`: The advice path. → What it keeps in place of approval. |\n| p30 | comparison | Funding shapes platform behavior more than any principle, and each of five common models produces different behavior. | table: Central program budget, fixed allocation, showback, chargeback by usage, internal market, with behavior and fit. | `contrast`: Governance through advice and principles. → Funding, which shapes behavior more. |\n| p31 | recommendation | Funding should be chosen per platform by why it is shared: policy-driven platforms such as trust and safety and identity should not be charged per use, while cost-driven ones such as search and media should. | reasoning: Charging per decision would tempt a brand to skip checks. | `elaboration`: The five models. → Picking one per platform rather than one for all. |\n| p32 | evidence | Cost attribution needs an ownership catalog before it needs a pricing model. | source: Adevinta cloud governance, December 2024: \"You build it, you run it (and you pay for it)\", ownership catalog of more than a thousand cloud accounts and projects. | `elaboration`: Usage pricing that makes cost visible. → What it requires first. |\n| p33 | description | A marketplace group needs fewer architects than it thinks, placed where decisions are made, each role owning some things and not others. | table: Group Chief Architect, brand lead architect, platform architect, principal engineers: owns and does not own. | `sequence`: Ownership mapped to teams and costs. → The roles architects play in this design. |\n| p34 | evidence | An architect should never make a decision the team can make on its own, as a 2018 Berlin Tech Blog post put it, a description of the role that has aged well. | quotation: \"A Software Architect should never make a decision that the team can effectively make on their own\" (eBay Kleinanzeigen and mobile.de, 2018), marked as old evidence. | `additional_support`: The architect roles. → Public support for the rule behind them. |\n\n### In Practice: What the Public Record Shows\n\n**Controlling idea** (`evidence`, id `record`): The public record of classifieds groups supports the design only in fragments: journey-aligned teams, domain maps before reorganizations, platforms that grew by adoption and specialists owning their runtime, and no group has published a complete topology.\n\n**Advances the thesis** (S1, S2, S3): Tests the design against dated public evidence.\n\n**Transition in:** `contrast`: The design as the author's recommendation. → What real classifieds groups have published, and how little that is.\n\n**Order of paragraphs** (`grouping`): One company per paragraph, from the journey axis (Marktplaats) and ownership before reorganization (Vinted, AutoScout24) to cross-cutting governance and specialists (OLX) and whole-group swings (Adevinta, eCG), then the common thread; the companies go from the narrowest claim (one axis at one company) to the widest (whole-group swings), so each fragment adds a level, and the summary must come last because it draws on all fragments.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p35 | context | Few marketplace groups publish their organization designs, so each dated fragment is evidence about one organization at one time. |  |  |\n| p36 | evidence | Marktplaats's 2017 move from business-unit teams to journey teams is the clearest classifieds account of cutting teams by journey, with the architecture following the teams. | source: November 2017: Journey Teams, OKRs (at most three objectives, four key results), self-reported \"10x faster\"; nine years old. | `example`: Dated fragments. → The first: Marktplaats. |\n| p37 | evidence | Vinted mapped almost 300 domains over at least two years before restructuring teams, so the domain map came before the team change and both before the services. | quotation: \"It took us at least two years to understand the domains, as we identified almost 300 of them\" (January 2026). | `additional_support`: Journey teams at Marktplaats. → Vinted's order: domains, then teams. |\n| p38 | evidence | AutoScout24 staffed its migration by growing a new organization from one team to eight rather than reassigning the old one in one move. | source: Project Tatsu, began November 2014, one to eight teams, a team every two to three months (2016 report). | `additional_support`: Domains before teams. → Growing the new organization gradually. |\n| p39 | evidence | OLX shows that journey squads alone do not deliver cross-cutting hygiene and that a lightweight, outcome-tracked structure for cross-team initiatives is a governance tool. | source: OLX Autos squads and chapters (2021, business since closed); OLX Motors Work Organization Framework (March 2026): 29 initiatives, user identification across 71 services, one deployment-notification center across more than 60 services. | `additional_support`: Growing teams one at a time. → OLX's squads and its later cross-team framework. |\n| p40 | evidence | OLX's 2025 move of recommendations serving to the data team shows a complicated subsystem taking ownership of its own runtime. | source: July 2025: serving moved out of a shared backend service \"to gain greater autonomy and flexibility\". | `additional_support`: Two OLX fragments. → A third, on specialist ownership. |\n| p41 | evidence | Adevinta's record covers the whole pendulum in three fragments, local inventions promoted to group level, a 2023 reorganization by verticals and a 2025 decentralization, and, after it, a small local infrastructure team serving many feature teams through self-service; the reading that its organization moved before its platforms is the author's inference. | source: FIAAS from FINN.no, Fisher from Marktplaats (2017-2023); Annual Report 2023 operating model by verticals; Strategic Report 2025 decentralized model; leboncoin September 2026 feed summary: about ten infrastructure engineers for about 70 feature teams.; reasoning: INFERENCE, NOT DOCUMENTED callout: organization moved first, platforms followed.; reasoning: About ten infrastructure engineers for about 70 feature teams is about seven teams per engineer, reached through the self-service bot the post is about. | `additional_support`: Single fragments from OLX. → Adevinta's full swing. |\n| p42 | evidence | eBay Classifieds Group was a federation with group functions that coordinated choices while each brand migrated itself. | source: Job postings 2009-2011, 2018 talk, Global Motors vertical with a shared partner API, joint evaluation of Voyager replacements in 2015. | `contrast`: Adevinta's swings between central and local. → A federation that coordinated without centralizing. |\n| p43 | synthesis | The common thread is modest, journey-aligned teams, domain maps before reorganizations, platforms grown by adoption and specialists owning their runtime, and no classifieds group has published a complete topology. |  | `conclusion_summary`: The dated fragments. → What they share and where they stop. |\n\n### Veldmark Worked Example: The Common Ground Organization Design\n\n**Controlling idea** (`example`, id `worked-example`): Veldmark answers Mateus's question with Common Ground organization v1, a central product-run platform organization with journey-aligned brand teams, team APIs, phased funding and an open advice forum, and in its first year owned capabilities rose to 8 of 9 and the March rule could reach every subscribing tenant within an hour.\n\n**Advances the thesis** (S1, S2, S3, S5): Applies the whole design and measures it.\n\n**Transition in:** `example`: The design and the public fragments. → Veldmark applying the design to Mateus's question: the options put to its advice forum.\n\n**Order of paragraphs** (`problem_solution`): The decision comes first (options in May, Common Ground organization v1 in June with its year-end measures after its five parts), then the parts that make it work in the order a tenant meets them (team API and collaboration limit, funding and its exception), then the forum that advised on all of them, with its month-by-month log, year-end totals and principles, then the November replay as the test of the scene's problem. The forum is previewed in one sentence in the Architecture section, so the options can be put to it before its own subsection; placed first, its log listed the June decision before the May options (round 3, both flow readers). The replay must come last because it relies on the owner, the forum and the block-list decision.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p44 | comparison | Veldmark answered Mateus's question through its architecture advice forum: in May 2027 Ingrid and Yara Mendes put three options to the forum, whose twelve principles include 'share platforms, not products': federated guilds, a central product-run platform organization, and central product and technology. | table: Options A, B, C with for and against. |  |\n| p45 | example (list) | On the forum's advice Mateus decided option B on 22 June 2027, effective 1 September, as Common Ground organization v1 in five parts; a callout after the parts names the nine capabilities the board's January 2027 program set out and reports that by December 2027 eight had one owner, while country-cut, overloaded and Yardstick-bound teams had fallen. | scenario: Five parts: one owning team per capability under Yara Mendes (Data & ML with Priya Raman); brands keep journey teams, Tradeyard PL/PT country teams become journey teams, one PL market team; policy local, mechanism central (Aisha Rahman); people move with work, about 150 transferred and 80 hired, about 230 engineers in 24 teams; Keybridge outside.; reasoning: BY DECEMBER 2027 callout before the table: the nine program capabilities named (Veldmark ID, trust and safety, media, search, messaging, catalog and entitlements, event backbone, data platform, taxonomy and attributes; part 1 adds the listing and developer platforms), eight single-owned.; table: March versus December 2027: engineers 1,150 to 1,200, teams 158 to 152, owned capabilities 0 to 8 of 9, Yardstick-bound teams 19 to 14, country-cut 17 to 4, cognitive-load flags 23 to 9. | `cause_effect`: The three options. → The forum's advice and the decision. |\n| p46 | example | Each platform team publishes a one-page team API, and the search platform's page shows honestly that in its first year it has no steady-state tenant. | scenario: Search platform, second half of 2027: collaboration with Tradeyard Portugal, facilitation with Motorvane (Listing Search API v1 on Elasticsearch), X-as-a-Service with nobody yet. | `elaboration`: One owning team per capability. → How each owner presents itself to tenants. |\n| p47 | example | Collaboration is time-boxed to two quarters per tenant, after which the forum asks what is missing from the contract. | scenario: Two quarters per tenant; the forum's question when the box runs out. | `elaboration`: Collaboration modes on the team API. → The limit on collaboration. |\n| p48 | example (list) | The decision record funds platforms by phase: Common Ground pays for the build in 2027 and 2028, showback per tenant from Q1 2028, and from 2029 usage allocation for cost-driven platforms and fixed allocation for policy-driven ones. | scenario: Units per thousand searches, per million events, per thousand stored images, per moderation decision. | `sequence`: The decision record's ownership and collaboration rules. → Its funding rules. |\n| p49 | example | Tally, the catalog and entitlement service, is funded centrally through 2029, because its first tenants migrating revenue-critical billing should not also negotiate its price. | scenario: Olivier Petit's condition; Motorvane Q1 2028, Tradeyard Q2 2028. | `contrast`: Usage and fixed allocation from 2029. → One exception. |\n| p50 | example | The forum that advised on these decisions was set up in April 2027 as a weekly, open, one-hour meeting with mandatory decision records for cross-brand decisions, and its first year can be read from its log. | table: Decision records by month, April to November 2027, linked to the chapters that tell them (May: qualified contact definition; September: data platform decisions). | `elaboration`: The decisions of Common Ground organization v1, from the options in May to Tally's funding, all taken on the forum's advice. → The forum itself and its first-year log. |\n| p51 | evidence | By 31 December 2027 the log held 74 cross-brand records at a median of nine working days, with six escalated to the CTO, two to the data protection officer and three superseded, which Ingrid counts as health. | statistic: 74 records; median 9 working days; 6 to CTO; 2 to DPO; 3 superseded. | `time`: The forum's 2027 log, month by month. → The log's totals at 31 December 2027. |\n| p52 | example | Four of Veldmark's twelve principles do most of the work, each with a test and a decision it shaped. | table: Share platforms not products; one owner per context and capability; contracts before migrations; separable by tenant. | `elaboration`: The decisions in the log. → The principles they were judged against. |\n| p53 | explanation | The separability principle comes from Veldmark's private-equity ownership, since a brand may be sold and unwinding a shared platform is costly. |  | `elaboration`: The four principles. → Why the fourth exists. |\n| p54 | example | When the shared trust-and-safety platform went live for Tradeyard NL and BE in November 2027, the replayed March rule became a configuration change effective for every subscribing tenant within an hour, the shared block list let Motorvane see the match, and the Poland and Portugal gap was listed rather than hidden. | scenario: Rule from trust operations in Lisbon; hashed block list approved by the DPO with two-year retention; PL and PT on the roadmap. | `time`: The forum's year. → Its acceptance test in November. |\n| p55 | analysis | The rule engine did not change; the ownership did: one team now owns 'a rule reaches every tenant', with a written service level. |  | `conclusion_summary`: The replayed rule. → What changed to make it work. |\n\n### Trade-offs\n\n**Controlling idea** (`comparison`, id `trade-offs`): Each choice in the design is right under some conditions and wrong under others.\n\n**Advances the thesis** (S2, S3, S5): Bounds the recommendations.\n\n**Transition in:** `contrast`: The choices Veldmark made. → The conditions under which each would be wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p56 | comparison | Each organizational choice, the stream-aligned axis, shared-capability ownership, specialists, governance and funding, has conditions under which it is wrong. | table: Nine rows: axis by journey or country, central platform or lead brand, central specialists, advice process or review board, central budget or usage chargeback. |  |\n\n### Vertical Differences\n\n**Controlling idea** (`comparison`, id `verticals`): Verticals change the organization mostly on the supply side: real estate and automotive need supply teams tied to sales, and a SaaS serving competitors needs a visible organization boundary.\n\n**Advances the thesis** (S2): Shows where the axis and platform fit vary.\n\n**Transition in:** `elaboration`: The conditions under which choices fail. → How those conditions differ by vertical.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p57 | comparison | Stream-aligned teams, specialists, sales, local pressure and fit with group platforms differ across general classifieds, real estate, automotive and professional SaaS. | table: Five topics across four verticals. |  |\n| p58 | analysis | Two consequences follow: supply teams in real estate and automotive need close links to sales, and a SaaS serving competitors like Keybridge needs an organization boundary customers can see. |  | `cause_effect`: The vertical table. → Its two consequences for organization design. |\n\n### Failure Modes\n\n**Controlling idea** (`analysis`, id `failure-modes`): Nine failures recur when the design is missing or half-applied.\n\n**Advances the thesis** (S1, S2, S3, S5): Names what the design prevents.\n\n**Transition in:** `contrast`: The design and its fit by vertical. → What goes wrong without it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p59 | analysis (list) | Nine failures recur when the design is missing or half-applied, from the platform without a product owner to the forgotten acquired organization, each with its fix. | example: Platform without product owner; mandate before platform (Forced Fit); reorganizing on a date; country teams for language; review board; governance without records; specialists with no runtime (Set-and-Forget AI); enabling teams that never end; forgotten acquired organization. |  |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `ca-view`): The Chief Architect designs ownership on the same map as the architecture, measures platforms by adoption and tenant cost, keeps the forum open and escalations few, expects the pendulum, and watches named signals.\n\n**Advances the thesis** (S1, S3, S5): Turns the design into the Chief Architect's decisions.\n\n**Transition in:** `cause_effect`: The failure modes. → The decisions that prevent them.\n\n**Order of paragraphs** (`order_of_importance`): Ownership first because every other decision assumes owners; measuring the platform owners next, because they are the new teams; then governance among them, then the long view that outlasts any one structure; who-decides-and-what-to-watch closes because it summarizes the others. Measurement placed before ownership would measure teams nobody has yet named.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p60 | recommendation | Design ownership first and draw it on the same map as the capabilities and contexts, reviewing the three twice a year and treating any orphan or split ownership as a defect with a fix and date. |  |  |\n| p61 | recommendation | Measure platforms by adoption and tenant cost, not output: tenants in production, onboarding cost, shadow copies and the share of roadmap from tenants. |  | `sequence`: Ownership drawn and reviewed. → How to measure the platform owners. |\n| p62 | recommendation | Keep the forum open and executive decisions few; if more than about one decision in ten escalates, the decision rights are wrong. |  | `sequence`: Measuring platforms. → Keeping governance light. |\n| p63 | recommendation | Expect the pendulum between centralization and decentralization, so separability and platform contracts, not team structures, are the durable assets. |  | `sequence`: The forum and escalation. → The longer-term swing. |\n| p64 | recommendation | The CTO decides topology and funding on the forum's advice, the Chief Architect owns principles, matrix and maps, platform heads own contracts and brand leaders own journeys, and six signals show whether it works. |  | `conclusion_summary`: The four recommendations. → Who decides and what to watch. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Ten questions test whether the design is in place.\n\n**Advances the thesis** (S1, S2, S3, S5): Gives the reader a review tool.\n\n**Transition in:** `cause_effect`: The Chief Architect's decisions and signals. → Questions that test whether they are in place.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p65 | recommendation (list) | Ten questions test ownership, the stream-aligned axis, adoption cost, funding fit, specialists, exceptions, decision speed, review dates and separability. |  |  |\n\n## Conclusion: From Organization to Migration\n\n**Synthesis:** Mateus's question has a three-part answer that works only as a whole: platform teams own shared capabilities and earn brands as tenants, journey teams use them, and disagreements are decided by the proposing team after public advice under a matrix that escalates only money, people and personal data; without owners the forum has nobody to advise, and without the forum and funding the owners have no tenants.\n\n**So what:** With this organization a capability exists once because one team owns it, and a fix such as a fraud rule reaches every subscribing tenant within an hour instead of days.\n\n**Callback:** The scene's March 2027 phishing rule and Mateus's question (who will own, who will use, who decides). The reader sees the same rule engine reaching every subscribing tenant once one team owns the outcome, and the question answered part by part.\n\n**Takeaway** (`course_of_action`): Draw the team topology on the capability and context maps, give every orphaned or split capability one owner, write the decision-rights matrix and start an open forum with recorded decisions.\n\n**Hand-off** to [Changing the Engine in Flight: Modernizing a Live Marketplace](modernization-and-migration.html): `contrast`: The organization assigns owners but does not move code; Tradeyard's teams still deploy through Yardstick, and the new platform teams own capabilities the monolith still implements. → Moving a live marketplace from the old system to the new one without losing traffic, sellers or revenue.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p66 | synthesis | Mateus's question now has a three-part answer that works only as a whole, owners, users and a decision path, so the replayed March rule reached every subscribing tenant within an hour on the same rule engine, and a group that wants this starts with the ownership catalog and the decision-rights matrix. | scenario: The March 2027 rule; the November 2027 replay. |  |\n| p67 | transition | The organization assigns owners but does not move code, which modernization-and-migration takes up. |  | `contrast`: What the organization decides. → What it leaves open: moving the code. |\n\n## Non-goals\n\n- Drawing bounded contexts. See [Bounded Contexts for Marketplaces: Where One Listing Becomes Many Models](bounded-contexts.html).\n- Which capabilities to share across countries and the tenancy model. See [One Platform, Many Marketplaces: Multi-Country and Multi-Brand Architecture](multi-country-platforms.html).\n- The consolidation sequence after acquisitions and synergy cases. See [After the Deal: Consolidating Platforms After Acquisitions](platform-consolidation.html).\n- Moving code out of the monolith. See [Changing the Engine in Flight: Modernizing a Live Marketplace](modernization-and-migration.html).\n- ML model governance details. See [Models in Production: ML Platforms and Use Cases](ml-platform.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- No classifieds group has published a complete team topology; revisit if one does (Adevinta's current post-2025 structure, Kleinanzeigen after its 2025 replatforming).\n- Whether Veldmark's data platform should move fully into the platform organization once the 2028 storage migration finishes.\n- Whether usage allocation from 2029 should include Tally once its migrations end.\n\n## Decision log\n\n- **2026-10-19** — Opened with the March 2027 phishing rule (from the ledger) to show an organizational defect rather than invent a new incident.\n- **2026-10-19** — Recommended journey-aligned stream teams within brands and 'a country team is justified by a different product, not a different language'.\n- **2026-10-19** — Chose the advice process over a review board as the governance core, keeping executive decisions for money, people and personal data.\n- **2026-10-19** — Split funding by platform type: usage allocation for cost-driven platforms, fixed allocation for policy-driven ones.\n- **2026-11-12** — Converted spec.md to spec.json. Success criteria rewritten: the team-types, axis, platform-product, decision-rights and funding inventories are covered by AC-1 (journal spec) and the new minor AC-4 (axis and funding of a policy-driven platform, cold reader); the dated-examples criterion became the minor rubric AC-5; the Veldmark-ledger criterion was checked against the ledger during conversion and dropped as a reader criterion; the inventory of tables and sections was dropped. Rejected: Separate cold-reader criteria for each old success criterion (one reader each per round).\n- **2026-11-12** — Flow rubric (sound with notes): roadmap p04 now names the architects' roles; the worked example's flow relabelled from chronological to problem_solution (its units are not in date order) with a reason; record and ca-view rationales now say why their order holds; p66 gains a so-what (start with the ownership catalog and the decision-rights matrix). No unit moved.\n- **2026-11-12** — Draft check round 2 escalated again on the forum's position (spec fault, corroborated by both flow readers: its set-up was told after the decisions it advised on). p50 (the forum's set-up and first-year log table) now opens the worked example; p44's transition is now time (from the April forum to the May options), p51's is time (from the year's decisions to the year-end totals), and p50 has no transition as the section's first unit. Draft faults fixed in p26 (the matrix marked as Veldmark's example), p45 (the measures table explained, and 'nine capabilities the program named in January' distinguished from the platforms in part 1) and the section opening. Rejected: Moving the whole forum subsection, with the 74-record totals and the principles, before the options: it would report the year-end log before the June decision.\n- **2026-11-12** — Draft check round 1 escalated on two spec-fault flow findings, both corroborated by the two flow readers: Veldmark's forum and its principle 'share platforms, not products' were used (decision-rights matrix, options table) before the forum's April set-up and the principles were described. The order is kept; p44 now says the forum was set up in April with twelve principles including 'share platforms, not products', and p50's transition changed from sequence to elaboration (the forum that advised on these decisions) so the subsection no longer jumps back in time. p41's controlling idea now names the leboncoin fragment as the third; p45's names 'the program's nine capabilities'. To stay within max_words, the conversion's own added sentences (roadmap, trade-offs and record lead-ins, conclusion) were shortened; no published fact was cut. Rejected: Moving the forum subsection before the three options: it would put the year-end log before the June decision it records.\n- **2026-11-12** — length.max_words set to 7,402: spec.md set no limit, so the published prose length by check_draft's count (7,050) plus 5%.\n- **2026-11-12** — Added units the published text lacked: roadmap p04, Trade-offs and Vertical Differences lead-ins (so each table has a paragraph that explains it), lead sentences before the Failure Modes and Questions lists, and a synthesis paragraph p66 before the hand-off so the conclusion calls back to the scene and Mateus's question.\n- **2026-11-12** — Thesis rubric on S4 resolved under the author's delegation: S4 (funding) folded into S3 as 'funded so that using the platform is a brand's cheapest option' (part claim P8-2), and the tenant-facing roadmap added to S3; every S4 reference now points to S3. The copied thesis claim is unchanged.\n- **2026-11-12** — Round 3 failure (p45 announcing December results before the five parts) fixed: the opening now ends 'which has five parts:', and the results move to a BY DECEMBER 2027 callout between the list and the table. Accepted under the author's delegation, 2026-11-12.\n- **2026-11-12** — Round 3 failure ('nine capabilities' vs part 1's ten platforms) fixed from the ledger's Common Ground program line: the callout names the nine (Veldmark ID, trust and safety, media, search, messaging, catalog and entitlements, event backbone, data platform, taxonomy and attributes) and says part 1 adds the listing and developer platforms. Count unchanged (8 of 9).\n- **2026-11-12** — Round 3 Lisbon finding: the close-out fix placing the in-house NL/BE trust-and-safety team in Lisbon (ledger moderator split: 46 in-house in Lisbon for NL/BE) accepted under the author's delegation, 2026-11-12; p54 now says 'in-house trust operations team in Lisbon'.\n- **2026-11-12** — Round 3 spec fault (Architecture shows Veldmark's adopted design before the worked example): both flow readers offered flagging it as a preview; p22 now says Figure 2 previews the June 2027 decision the worked example tells, p26 introduces the advice forum in one sentence (open, weekly, set up April 2027) before the matrix it adopted, Figure 4 is 'as Veldmark's forum runs it', and the Figure 2 caption explains Keybridge's neutrality from the ledger. No published fact cut. Rejected: Replacing Figure 2 and the matrix with generic versions in Architecture: they are published figures and tables.\n- **2026-11-12** — Round 3 spec fault (worked example opened with the forum's year-long log, listing the June decision before the May options): both readers proposed joining the forum's introduction with 'The architecture advice forum, one year in'. p50 moved after p49; order is now p44-p49, p50, p51-p55. p44 has no transition (section opening) and opens with 'Veldmark answered Mateus's question ... through its architecture advice forum'; p50's transition is elaboration (the forum that advised on these decisions); p51's carries over the month-by-month log. This supersedes the round 1 and 2 rejections of moving the forum, which assumed the totals would precede the June decision; here the log follows it.\n- **2026-11-12** — Forum log table corrected to the ledger (rule 3): the May row's 'data platform design' becomes 'qualified contact definition ([Data Platform for Marketplaces: Events, Lakehouse and Data Products](data-platform.html))' (ledger: Qualified contact v1.0 approved at the advice forum, May 2027), and the September row gains 'data platform decisions ([Data Platform for Marketplaces: Events, Lakehouse and Data Products](data-platform.html))' (ledger: Sep 2027 data platform decisions). Not a ledger ambiguity: the ledger dates both.\n- **2026-11-12** — OLX Autos closure kept undated as published (rule 8). The orchestrator's removal of the leboncoin interpretive sentence kept; p41's evidence is now explained only within the source: 'about seven feature teams per infrastructure engineer, reached through a self-service bot' (arithmetic on the post's figures and the post's subject).\n- **2026-11-12** — Minor round 3 findings fixed cheaply: 'the full pendulum' in p41 now 'the full swing between central and local' (the pendulum image is explained only in the Chief Architect's View); Yardstick Exit marked as Veldmark's team.\n- **2026-11-12** — length.max_words raised from 7,402 to 7,550 (2%, within the 10% allowed) for the nine-capability list, the Architecture previews and the leboncoin explanation; draft at 7,473 words.\n- **2026-11-12** — Flow rubric notes listed in open_questions (2026-11-12, two runs) closed under the author's delegation, 2026-11-12: the forum and December-measures notes are covered by the moves above; the Nygard/p34 merges and the Adevinta cross-reference are not taken (published units kept).\n\n## Sources\n\n- **Internal**\n  - _journals/listing-systems-architecture/journal-spec.json — Intent outcome, acceptance criteria AC-1 to AC-3, thesis, role, and modernization-and-migration's transition_in for the hand-off.\n  - bounded-contexts, business-capabilities, case-adevinta, case-ebay-classifieds, multi-country-platforms, platform-consolidation, modernization-and-migration, long-term-evolution — Neighbouring contracts and the terms the chapter may assume.\n  - _research/brief-adevinta.md Parts 4-5, 7; _research/brief-olx.md Parts 4.1, 5; _research/brief-ebay-classifieds.md Parts 4, 5.1, 5.4; _research/brief-platform-data-ml.md Parts 1, 5.3 — Public evidence on classifieds organizations.\n  - _research/scenario-ledger.md — Veldmark facts: the phishing rule, the engineering baseline, Common Ground organization v1, funding, the forum's first year.\n- **External**\n  - Skelton and Pais, Team Topologies key concepts, n.d. — Team types, interaction modes, cognitive load.\n  - Harmel-Law, Scaling the Practice of Architecture, Conversationally, 2021 — The advice process.\n  - Nygard, Documenting Architecture Decisions, 2011; Conway, How Do Committees Invent?, 1968 — Decision record format; Conway's law.\n  - Marktplaats (2017), Vinted (2026), AutoScout24/InfoQ (2016), OLX (2021, 2025, 2026), Berlin Tech Blog (2018), Adevinta (2020-2026), leboncoin (2026) — Dated public fragments of classifieds organization designs.\n\n## Changelog\n\n- **2026-11-12** — Escalation resolved under the author's delegation: S4 folded into S3; worked example reordered (forum and log after the decision); Architecture marks Veldmark material as a preview; December results moved after the five parts with the nine capabilities named; forum log dates corrected to the ledger; leboncoin figure explained within the source; max_words 7,550. (AI-mediated session)\n- **2026-11-12** — Orchestrator review: removed an added interpretive sentence about leboncoin. Check report stale.\n- **2026-11-12** — Draft check round 3: escalate (39 pass, 6 fail). Close-out fix without another round: the scene's in-house NL/BE trust-and-safety team is now placed in Lisbon (ledger), and the gloss in the replay was removed. Remaining failures recorded in open_questions. (AI-mediated session)\n- **2026-11-12** — Round 2 draft-check fixes: worked-example order changed (p50 first) with p44, p50, p51 transitions rewritten; p26, p44, p45, p50 ideas revised; prose fixes in p26, p44, p45, p50. (AI-mediated session)\n- **2026-11-12** — Round 1 draft-check fixes: p41, p44, p45, p50 ideas and p50 transition revised (spec fault: forum used before its set-up); prose fixes in p22, p41, p44, p45, p50, p52, p54. (AI-mediated session)\n- **2026-11-12** — Converted spec.md to spec.json (outcome spec, paragraph level); status draft. (AI-mediated session)\n- **2026-10-21** — Renamed failure patterns to match where-listing-systems-go-wrong. (AI-mediated session)\n- **2026-10-20** — Replaced 2 mermaid diagrams with generated illustrations (figure numbers and captions unchanged; sources archived in _research/mermaid-figures.json); Figure 2 kept attempt 2 with the dashed 'group security standards only' arrow ending on 'Trust and safety pipeline'. (AI-mediated session)\n- **2026-10-20** — Sharpening pass: 5,646 to 5,642 words; lead names platform-consolidation and modernization-and-migration; six first sentences state their point; three paragraphs split. (AI-mediated session)\n- **2026-10-20** — Cross-chapter consistency sweep: 3 headings aligned with the book's shared section names. (AI-mediated session)\n- **2026-10-19** — Added 3 inline illustrations (article-illustrator); figures renumbered. (AI-mediated session)\n- **2026-10-19** — Editorial review pass: restored long-term-evolution link; dated and qualified the leboncoin feed-summary citation; American spelling. (AI-mediated session)\n- **2026-10-19** — Initial spec and article. (AI-mediated session)\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
