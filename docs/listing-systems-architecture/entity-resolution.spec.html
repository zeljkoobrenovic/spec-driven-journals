only this chapter: what is wrong, and what would you change? | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** How do you recognize that several listings describe the same thing, and what do you do about it?\n\n> **Claim:** 'Duplicate' names two problems with opposite answers: reposts, freshness gaming and stolen listings are abuse to enforce against, while several agencies or channels listing one flat or car is legitimate supply to cluster for presentation; candidates found by blocking are scored pairwise, with automatic links above a threshold and a gray zone sent to human review, and the clustered listings resolve to an entity that outlives them, a property or a vehicle (goods mostly have none, so none should be invented), recorded with a stable identifier and merge-and-split lineage by a named owner, and the representative listing is chosen by a published rule governed like ranking, which payment does not silently decide, using only what each listing carries as published.\n\n**Disputed by:** The common practice of treating every duplicate as noise for one nightly deduplication job to hide, with the matcher's output used directly as the grouping and the first or highest-paying listing shown; and, in a group, the temptation to match on whatever data the group holds, including its own SaaS customers' records.\n\n**So what:** A Chief Architect who accepts this shares the matching machinery across brands while each vertical owns its entity model, names an owner for each entity type (canonical property, abuse clusters, cross-feed merges), writes the legal boundary of linking into the matcher's input contract, and tracks listings per entity, precision and recall on a labeled sample, gray-zone volume, cluster churn and dispute rates.\n\n**How and why:** Hearthly France's 1.9 million live listings describe about 1.12 million properties, so buyers saw three cards and received three alerts for the Lyon flat and Valuo's price history counted three properties for one sale, while agencies complained of favoritism. Resolved, the flat is one card with all three agencies reachable; in Veldmark's illustrative first quarter, Lyon pages show 31% fewer cards and Lyon sales alerts fall 24% with no fall in click-through, at 98.6% precision and 91% recall on 4,000 labeled pairs. Using Keybridge's richer data would raise the match rate and lose the trust of every agency that uses Keybridge to publish to competitors.\n\n**Supporting claims**\n\n- **S1** — 'Duplicate' names two problems: reposts, freshness gaming and stolen listings are abuse to enforce against under moderation rules, while several agencies or channels listing one flat or car is legitimate supply to cluster for presentation; one detector can serve both, but actions, owners and appeals stay separate.\n- **S2** — Resolution reaches as far as the vertical's real-world entity: a property or a vehicle outlives its listings and can be modeled as its own record, while goods mostly have no such entity, so none should be invented.\n- **S3** — Matching is blocking for recall, calibrated pairwise scoring with automatic links above a threshold and a gray zone for human review, and clustering guarded against chaining, run cheaply online at publication and globally in batch.\n- **S4** — The cluster identifier is a product contract, not a model output: an entity registry outside the search index keeps it stable with merge-and-split lineage, stores human decisions as constraints, ties cluster state to the members' lifecycle, and has a named owner per entity type.\n- **S5** — What each audience sees is a merge policy chosen per audience, and the representative listing is chosen by a published rule governed like ranking, which payment does not silently decide.\n- **S6** — The matcher reads only what each listing carries as published, the legal boundary of linking is written into its input contract, and the capability is governed by a few watched numbers: listings per entity, precision er way round, the reader would try to resolve reposts and stolen copies to a property. The abuse cases sit in the practice section, not beside the kinds, because they show the same detectors and registry already described, which the kinds section could only name. The judgement sections run from options (trade-offs) to what goes wrong (failure modes), to the decisions that prevent it (Chief Architect's view) and the questions that test them; the decisions answer the failure modes, so they must follow them.\n\n## Introduction\n\n**Hook** (`intriguing_example`): A private seller reposts a bike every two days, a dealer's car arrives through two feeds, three agencies each publish one flat, and a fraudster copies a real rental 35% cheaper; on a result page all four look the same: one thing appears more than once.\n\n**Bridge:** Normalization and enrichment left every listing with a canonical address, a decoded VIN where one exists and image hashes, so listings can now be compared. → The comparison shows that many listings describe the same thing, and the reader must decide what a duplicate is before deciding how to find it.\n\n**Thesis statement** (KEY POINTS callout (all three bullets); paragraph p02 states the two-problems claim in the body.): 'Duplicate' names two problems with opposite answers, enforcement for abuse and clustering for legitimate copies; listings resolve to an entity that outlives them where the vertical has one; and the cluster identifier is a governed product contract with a published representative rule, not a model output.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p05, which lists the sections in order.):\n\n- The Lyon apartment that three agencies listed on Hearthly, and Ingrid's four questions. *Kept in:* scene.\n- Five kinds of duplicate and which call for enforcement or clustering. *Kept in:* kinds.\n- What real-world thing a listing resolves to in each vertical, and how duplicates differ by vertical. *Kept in:* identity, verticals. hing and the fraud response, and this chapter owns the matching, the clusters, the canonical entity and the policies for what each side of the market sees. |  | `contrast`: What this chapter owns. → What neighbouring chapters own instead. |\n| p05 | transition | The chapter starts from the Lyon flat and states its four questions, then maps each to the sections that answer it (what is duplicated: kinds, real-world entity and vertical differences; who decides and who can dispute: the pipeline and its registry; what each audience sees: merge policies with Idealista), then the Lyon flat resolved and abuse, then the judgement sections, and names its evidence: public sources, standards, research and the fictional Veldmark. | reasoning: The four questions mapped to the sections in order; the Lyon apartment as the running example; the kinds of evidence, with Veldmark named as fictional. | `sequence`: The scope of the chapter. → The order in which it is covered and the running example. |\n\n## Sections\n\n### Setting the Scene at Veldmark: The Lyon Apartment, Three Times\n\n**Controlling idea** (`context`, id `scene`): One Lyon flat listed by three agencies shows the cost of unresolved duplicates for buyers, alerts, market numbers, valuation and agencies, and Hearthly's existing nightly job leaves four questions unanswered.\n\n**Advances the thesis** (S1, S5): Shows legitimate duplicates harming every audience at once and frames what the capability must decide.\n\n**Transition in:** `example`: The kinds of duplicate and the chapter's map. → The running example: one flat, three listings.\n\n**Order of paragraphs** (`chronological`): The three listings arrive, then what buyers and agencies saw before 2027, then the scale of the problem and the CEO's demand, then the existing job and Ingrid's questions that organize the chapter.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | description | In May 2027 Hearthly France receives three listings for one 68 m² T3 flat in Lyon 7e from three agencies through three channels, at two prices because French sale prices include different agency fees. | scenario: T3, 68 m², DPE D, Lyon 7e; Agence Rhône Habitat (14 branches) via Keybridge at €389,000; two other agencies via two software vendors at €389,000 and €395,000. |  |\n| p07 | cause_effect | Before 2027 the flat appeared as three cards, three alerts, three listings in the market report and three properties in Valuo's price history, and agencies complained of favoritism both ways. | scenario: Three cards with three photo sets; three alerts per saved search; three properties in Valuo's history for one sale; complaints about rank order and about a lower-fee copy. | `cause_effect`: Three listings of one flat. → What each audience saw as a result. |\n| p08 | evidence | The flat is typical: 1.9 million live listings at Hearthly France describe about 1.12 million properties, and Claire Fontaine, Hearthly's CEO, asks for buyers to see real supply without agencies seeing favoritism. | statistic: 1.9 million live listings, about 1.12 million properties, 1.7 listings per property.; quotation: Claire Fontaine: 'Buyers think we have more flats than we do, and agencies think we pick favorites. Fix the first without making the second worse.' | `additional_support`: One flat's effects. → The scale across Hearthly France and the CEO's demand. |\n| p09 | transition | Hearthly's nightly job already groups some listings by exact address, and Ingrid answers it with four questions, in the order the chapter answers them: what is duplicated, who decides and how often wrongly, who can dispute a grouping, and what each audience sees. | scenario: Julien Marchand's nightly exact-address grouping job; Ingrid's four questions. | `problem_solution`: The CEO's demand. → The existing partial answer and the questions that judge it. |\n\n### Five Kinds of Duplicate\n\n**Controlling idea** (`claim`, id `kinds`): Five kinds of duplicate differ in who creates them and why, so detection can be shared but actions, owners and legal regimes cannot.\n\n**Advances the thesis** (S1): Establishes the split between enforcement and clustering.\n\n**Transition in:** `sequence`: Ingrid's first question: what is being duplicated. → That the answer takes three sections, and its first part: which kind of duplicate.\n\n**Order of paragraphs** (`large_to_small`): The five kinds first, then the near-misses that are not duplicates, then the rule that follows (shared detection, separate decisions), then the legal reason the decisions must stay separate.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | comparison | The word 'duplicate' covers five situations that differ in who creates them, why, and what the marketplace should do. | table: Same-seller repost, freshness relisting, cross-feed duplicate, multi-agency listing, stolen or cloned listing: example, creator and motive, signals, right action, owning context. |  |\n| p11 | explanation | Two further cases look like duplicates but are not: a new offer on the same entity, which needs the link but must not be hidden, and similar but distinct entities, which cause most wrong merges. | example: One flat for sale and for rent, or a car resold two years later; two identical flats on different floors, two white 2021 Golfs at one dealer. | `contrast`: The five kinds of duplicate. → Cases that resemble duplicates and are not. |\n| p12 | claim | Detection can be shared but decisions cannot, because the same machinery finds reposts, multi-agency clusters and stolen copies and only the relationship between the sellers separates them. | quotation: Veldmark's design note: same seller, same photos is spam or ranking abuse; different seller, same photos is a fraud signal or a legitimate multi-agency listing.; source: OLX's 2019 duplicate pipeline generated candidates with those keys.; figure: Figure 1: one detector feeds a junction on seller keys; abuse to enforcement, legitimate listings to one property card. | `conclusion_summary`: The five kinds and the near-misses. → The rule that follows from them. |\n| p13 | cause_effect | The two families of action sit under different legal regimes, so one 'dedup' flag cannot meet either: removing or demoting an abusive duplicate owes a DSA statement of reasons, while choosing the card for a cluster is a ranking parameter with transparency duties. | fact: DSA Art. 17: statement of reasons for restrictions, including demotion. | `additional_support`: Decisions cannot be shared. → The legal reason they must stay apart. |\n\n### What Is the Thing? Real-World Identity by Vertical\n\n**Controlling idea** (`comparison`, id `identity`): How far resolution can go depends on the vertical's real-world entity: a property or vehicle outlives its listings, goods mostly have no entity, and none should be invented.\n\n**Advances the thesis** (S2): Defines the entity each vertical resolves to.\n\n**Transition in:** `sequence`: Which kind of duplicate. → The second part of the answer to 'what is duplicated': same what?\n\n**Order of paragraphs** (`order_of_importance`): The comparison table first, then the verticals in falling order of what resolution can achieve: real estate with public references and Zillow as the documented example, vehicles with the VIN, and goods with no entity.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | comparison | Entity resolution must first answer 'same what?', and the answer per vertical decides how far resolution can go. | table: Real estate, automotive, general goods, catalog goods and jobs: entity, identifiers, reliability, what ER can achieve. |  |\n| p15 | explanation | Real estate is where the entity matters most because the property outlives every listing, and national address and building registries narrow candidates to a building but never identify the unit inside it. | source: OS Open UPRN (about 40 million addressable locations in Great Britain); France's Base Adresse Nationale and the RNB's ID-RNB; US county parcel numbers. | `elaboration`: The table's verdict for real estate. → Why the property matters and what public references can and cannot do. |\n| p16 | evidence | Zillow is the documented example of a property-first model at scale, though its matching method is not public. | fact: Zillow's 10-K for fiscal 2025 (filed 2026-02-11): a 'living database' of about 173 million US homes with user updates to more than 46 million property records. | `example`: The property as a durable entity. → A public company built on one. |\n| p17 | explanation | Vehicles are easier when the VIN is present, and the work lies in listings without one and in protecting the VIN where it is personal data. | reasoning: Same VIN at the same time is a cross-feed or multi-site duplicate; same VIN two years later is a new seller of the same car. | `contrast`: Real estate, where identity must be inferred below the building. → Vehicles, where an identifier exists. |\n| p18 | recommendation | General goods have no entity to resolve to, so none should be invented and duplicate detection there only protects the result page from abuse. | case: eBay mandated catalog association for listings in 2018-2019 and later relaxed it. | `contrast`: Verticals with an entity. → The vertical without one. |\n\n### Vertical Differences\n\n**Controlling idea** (`comparison`, id `verticals`): Next to the identity comparison, the dominant duplicate kind, signals, main action and risk differ by vertical, and each vertical has its own trap.\n\n**Advances the thesis** (S2, S1): Shows the dominant kind and the action differ per vertical, completing the answer to what is duplicated.\n\n**Transition in:** `sequence`: The first two parts of the answer to 'what is duplicated', and the identity table just above, which compared what each vertical resolves to. → The third part: how duplicates behave in each vertical.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p49 | comparison | The third part of the answer to the first question: next to the identity table, this table compares how duplicates behave per vertical; enforcement dominates general classifieds, clustering real estate, silent merges automotive. | table: Seven dimensions across four verticals. |  |\n| p50 | example | In general classifieds, a perceptual-hash detector without an allowlist of stock images floods moderators with false matches. | example: Stock and manufacturer photos are common in categories such as new phones or furniture. | `example`: The vertical comparison. → The general-classifieds trap. |\n| p51 | example | In automotive the VIN tempts teams to skip human review of uncertain matches, and the cost appears when a dealer group lists one car at two prices and the merge shows the wrong one first. | example: A dealer group lists one car at two sites with different prices. | `similarity`: A vertical-specific trap. → The automotive trap. |\n\n### The Matching Pipeline\n\n**Controlling idea** (`process`, id `pipeline`): Blocking, pairwise scoring and clustering propose links, online at publication and in nightly batch, and an entity registry turns them into stable identifiers with lineage that remember human decisions, follow the listing lifecycle and hold the canonical entity.\n\n**Advances the thesis** (S3, S4): Describes how links are proposed and how the registry turns them into stable, owned identifiers.\n\n**Transition in:** `sequence`: What the thing is: the kind of duplicate, the vertical's entity and how duplicates behave per vertical. → Ingrid's second question: who decides that two listings are the same, and how often wrongly.\n\n**Order of paragraphs** (`chronological`): The stages in the order a listing passes through them: candidate generation, scoring, the thresholds that route scores, clustering; then the two speeds at which those stages run, because nightly reruns are what make stable identifiers necessary; then the registry: stable IDs and lineage, the human decisions it keeps (which answer Ingrid's third question straight after the IDs they constrain), membership following the lifecycle, and last the canonical record it holds.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p19 | context | The pipeline that answers who decides is a reference architecture inferred from public algorithms and the few public marketplace designs, shown whole in Figure 2, ending in a policy engine, a set of rules rather than a model, that routes each cluster by duplicate kind to enforcement or presentation. | figure: Figure 2: blocking, scoring and clustering propose links; the registry owns identifiers; a policy engine maps clusters to actions; human decisions feed back. |  |\n| p20 | process (list) | Blocking makes comparison feasible by generating candidate pairs from several cheap, high-recall keys, any one of which makes a pair a candidate. | statistic: 1.9 million live listings at Hearthly France is about 1.8 trillion pairs.; example: Keys: category and place (H3 cell, price band), normalized address and building ID, hard identifiers, MinHash and SimHash text fingerprints, PDQ image-hash bands, account keys. | `sequence`: The pipeline as a whole. → Its first stage. |\n| p21 | analysis | Blocking is a recall decision, because a pair that shares no key is never compared and a seemingly safe key can silently split true matches. | example: Exact-address blocking misses 'rue de Marseille' without a number; H3 blocking misses listings near a cell boundary unless neighbors are included. | `elaboration`: The blocking keys. → What choosing them decides. |\n| p22 | explanation | Each candidate pair is scored from field-level comparisons, and two families of scorer are in common use. |  | `sequence`: Candidate pairs. → The next stage: scoring them. |\n| p23 | explanation | Probabilistic record linkage in the Fellegi-Sunter tradition estimates field weights without labels and is a good first scorer because a reviewer can understand its weights. | quotation: Splink documentation: 'no training data is required'; a million records on a laptop in about a minute; Spark for 100 million or more. | `elaboration`: Two families of scorer. → The first family. |\n| p24 | evidence | Supervised pairwise classifiers learn from labeled pairs, and OLX's 2019 design is still the best public classifieds example of one. | case: Grigorev, PyCon DE 2019: candidates by category, city, seller, IP, device and image hashes; a classifier on price, location, title and image similarity; MD5, dHash and MobileNet embeddings with LSH in Elasticsearch; about 10 million listings a day; crops and flips break hashes. | `contrast`: Scoring without labels. → Scoring with labeled pairs. |\n| p25 | explanation | Calibrated scores map to three bands, automatic link, no link and human review, whose error is measured as precision and recall on a labeled sample, and the gray zone's width is a budget decision. |  | `cause_effect`: Two ways to produce a score. → What the score must be for thresholds to mean something. |\n| p26 | analysis | Pairs are not clusters: connected components chains weak links into giant clusters, so clusters must be internally consistent and size-limited. | reasoning: A chain of plausible links can merge a whole building; a property rarely has more than four or five agencies at once. | `sequence`: Linked pairs. → Grouping them into clusters. |\n| p31 | comparison | Blocking, scoring and clustering run online at publication for cheap, local checks inside the publication budget and in nightly batch for global clustering and repair. | example: Online: exact and perceptual image hashes against recent listings, same-seller text near-duplicates, VIN and partner-reference lookups. Batch: global blocking and clustering, cross-seller and cross-feed clusters. | `sequence`: Blocking, scoring and clustering, the stages that propose links. → When those stages run: online at publication and in nightly batch. |\n| p27 | claim | The entity registry keeps cluster identifiers stable across runs and records merges and splits as lineage events that consumers subscribe to. | reasoning: Saved properties, price-history charts and valuation series need IDs that do not jump nightly; merges keep the older ID, splits keep it on the larger part. | `problem_solution`: Batch clustering that produces new groups every night. → The registry that keeps their identity stable. |\n| p29 | recommendation | The registry also keeps human decisions, which answers Ingrid's third question by showing the dispute path: reviewers decide gray-zone pairs in the review queue, an agency or seller that finds its listing grouped with a different property disputes the link, the entity's owner answers and a reviewer checks the pair, and a human 'not the same' decision is stored as a constraint, not only as a training label, or the nightly job reunites the pair. | figure: Figure 3: a listing's cluster membership lifecycle; rejected or disputed pairs are suppressed; unpublished listings detach. | `additional_support`: What the registry keeps: stable identifiers and lineage. → Human decisions as part of what it keeps, which answers Ingrid's third question. |\n| p30 | cause_effect | Cluster membership follows the listing lifecycle, so a cluster whose last live listing is gone is no longer on the market, or it becomes Ghost Inventory. |  | `additional_support`: Human decisions as durable registry state. → The listing lifecycle as the other input that changes membership. |\n| p28 | explanation | The registry also holds the canonical entity, built by survivorship rules from its members, which never overwrites the seller's listing. | example: Surface from the energy diagnostic, else the most common professional value; address from the most precise geocode; valuation and analytics read the canonical record, the listing page shows the seller's statement. | `additional_support`: What the registry keeps: stable identifiers, human decisions and lifecycle-bound membership. → The canonical record it also holds. |\n\n### Merge Policies: What Each Audience Sees\n\n**Controlling idea** (`recommendation`, id `merge`): A cluster changes something different for each audience, so the policy is chosen per audience, and the representative listing is a published ranking parameter that payment does not silently decide.\n\n**Advances the thesis** (S5): States the per-audience policies and the representative rule.\n\n**Transition in:** `sequence`: Stable clusters with owners and a canonical entity. → Ingrid's last question: what each audience sees.\n\n**Order of paragraphs** (`large_to_small`): All audiences first, then the two decisions inside search presentation: how collapsing counts, then which listing represents the cluster, then a public product that made those choices.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p32 | recommendation | Choosing what a cluster changes is product policy per audience, and the common mistake is to hide the others everywhere. | table: Search results, listing page, saved-search and price-drop alerts, agency view, valuation, market metrics, lead routing: options and recommended default. |  |\n| p33 | analysis | Collapsing in the search engine shows one card per cluster but leaves totals and facets counting listings, so counts must come from a property-level document or the page disagrees with itself. | source: Elastic's collapse documentation: total hits count all matching documents, aggregations are not collapsed, inner_hits adds a query per hit, no scroll. | `elaboration`: The search-results policy. → How it is implemented and what it costs. |\n| p34 | comparison | When a cluster collapses, the choice of representative listing rewards different agency behaviors depending on the rule. | reasoning: Lowest price rewards the lowest fee; earliest rewards publishing first; quality score rewards good photos and complete attributes; paid turns deduplication into an auction. | `elaboration`: One card per cluster. → Which listing that card shows. |\n| p35 | recommendation | Because each option rewards a behavior, the representative rule should be a published ranking parameter decided by product and legal, disclosed when payment affects it, as P2B and the DSA require ranking parameters to be described. | fact: The EU Platform-to-Business Regulation and the DSA require the main ranking parameters to be described to business users and consumers. | `cause_effect`: Each rule rewards a behavior. → Who must decide it and under which obligations. |\n| p36 | example | Idealista's 2021 duplicate-control tool shows a cluster presented as buyer information, with agents limited to their own properties and a daily cadence. | case: Idealista, April 2021: groups ads for one property by several agencies or individuals, including on other portals; shows duplicates, price changes, removals; push notifications; agents see only their own properties after publication; updated daily. | `example`: The per-audience policies and the representative rule. → A documented product that applied such choices. |\n\n### In Practice: Resolving the Lyon Apartment\n\n**Controlling idea** (`example`, id `practice`): The Lyon flat run through the pipeline becomes one governed property card with every agency reachable, matched only on published data, and the same detectors serve enforcement on Tradeyard and against the Barcelona ring.\n\n**Advances the thesis** (S3, S4, S5, S6, S1): Tests the whole model on Veldmark with numbers.\n\n**Transition in:** `example`: The pipeline, the registry and merge policies. → The Lyon flat run through them.\n\n**Order of paragraphs** (`chronological`): The flat in the order of the pipeline: the listings, then the input constraint on the matcher, placed before blocking because it limits what every later stage may read (a higher match rate that would cost agencies' trust), then blocking, scoring, clustering and review, presentation and the first-quarter results; then the same detectors under the enforcement policy, on reposts and on the stolen-photo ring.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p37 | context | The section follows the Lyon flat through the pipeline Hearthly built in 2027 and then the same detectors against abuse, with Veldmark's design and illustrative numbers. |  |  |\n| p38 | description | The three listings arrive over four days with matching facts but different channels, addresses, prices and photo sets. | table: Listings A, B, C: agency, channel, price fees included (€389,000, €389,000, €395,000), surface and rooms, address quality, DPE D, photos (6 of C's match A at PDQ distance below 20). | `sequence`: The walk-through announced. → Its input. |\n| p43 | claim | Before matching starts, the matcher may use only what each listing carries as published, because the March 2027 Keybridge decision bars Hearthly from Keybridge agency data for ranking, which matching feeds, and Keybridge publishes agencies' listings to Hearthly's competitors; the rule is enforced in the data path. | fact: Veldmark's March 2027 decision: no Keybridge agency data used by Hearthly for ranking or sales targeting; access controls and an annual independent review. | `contrast`: The three listings, one of them sent through Keybridge. → Data that would raise the match rate and that the matcher may not read. |\n| p39 | example | Blocking puts all three in candidate pairs through shared building, cell, type, price band and photo-hash bands, along with 41 pairs from neighbouring flats. | scenario: A and C share an address and building ID; B lacks a street number but shares the H3 cell, type, price band and five photo-hash bands; 41 other pairs. | `sequence`: The three listings as published, the only data the matcher may read. → The first stage applied. |\n| p40 | example | Scoring separates the three true pairs from the 41 others and places two pairs in the gray zone. | scenario: A-C 0.97, A-B 0.88, B-C 0.84, others below 0.3; automatic link at 0.92, gray zone 0.70-0.92. | `sequence`: Candidate pairs. → Their scores and the thresholds. |\n| p41 | example | A reviewer confirms the gray-zone pairs and the registry creates one cluster and one canonical property with reconciled attributes. | scenario: A-C links automatically; reviewer confirms A-B and B-C within the hour; address from A, surface from the DPE data, building ID from the address link. | `sequence`: Two pairs in the gray zone. → Review and the resulting cluster. |\n| p42 | example | Search shows one card chosen by the published representative rule with every agency one click away; a lower price at one agency is an update on the known property, and alerts, valuation and price history count one property. | scenario: Representative by completeness and media quality (listing A); 'also listed by 2 other agencies, from €389,000'; leads to the agency contacted; C's drop reported as 'now €389,000 at a third agency'; Valuo €372,000-€401,000 once; three asking-price series on one property.; figure: Figure 4: before, three cards, three alerts, triple count; after, one card, one alert, one count. | `sequence`: One cluster. → What each audience now sees. |\n| p44 | evidence | After the first quarter, Ingrid's four illustrative numbers show fewer cards and alerts with no loss of click-through, high precision and recall, and disputes that become the best labels. | statistic: 31% fewer cards on Lyon pages; 24% fewer Lyon sales alerts with no fall in click-through; precision 98.6%, recall 91% on 4,000 labeled pairs; about 60 agency disputes a month, two thirds same-building wrong merges. | `cause_effect`: The resolved flat as each audience sees it. → The results. |\n| p45 | example | On Tradeyard the same detectors serve enforcement, blocking same-seller reposts and keeping the original creation date, because a marketplace that sells bumps and tolerates free reposts competes with itself. | scenario: Repost blocked at publication with a paid-bump offer; delete-and-recreate keeps the original creation timestamp. | `contrast`: The machinery used for presentation at Hearthly. → The same machinery used for enforcement at Tradeyard. |\n| p46 | evidence | The registry must record why listings were linked, because a stolen copy must never be shown as 'also listed by', as the Barcelona ring showed. | case: July 2027: 26 accounts, 180 fake rentals in Eixample with stolen photos, about 35% below market; hash matches fired from day one but went to a separate queue from price flags, and 11 photo-match items were closed as legitimate multi-agency duplicates before an analyst linked the cluster. | `additional_support`: Enforcement on reposts. → Stolen copies as the other abuse case, and the requirement they add: the registry records why listings were linked. |\n\n### Trade-offs\n\n**Controlling idea** (`comparison`, id `trade-offs`): Where duplicates are resolved, which scorer, how to cluster, how to present and who owns the entity are each a trade-off, and storing the cluster ID outside the search index is the one that decides most of the others.\n\n**Advances the thesis** (S3, S4): Weighs the design options and fixes the system of record for clusters.\n\n**Transition in:** `conclusion_summary`: The model, tested on Veldmark. → The choices behind it, with their alternatives.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p47 | comparison | Five choices shape an entity-resolution capability, and each option is right under some conditions and costs something. | table: Where resolved, scorer, clustering, presentation, entity ownership: options, when right, cost. |  |\n| p48 | recommendation | The decision behind the table's first and last rows decides most of the others: where the cluster ID is stored; the registry is the system of record and search holds a copy, or the index becomes Search as System of Record. |  | `emphasis`: Five choices. → The decision behind the table's rows that decides most of the others. |\n\n### Failure Modes\n\n**Controlling idea** (`analysis`, id `failure-modes`): Entity resolution fails in ten recurring ways, each with a concrete remedy.\n\n**Advances the thesis** (S1, S3, S4, S5, S6): Shows what breaks when each claim is ignored.\n\n**Transition in:** `contrast`: How the design should work. → How it commonly fails.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p52 | analysis (list) | The design commonly fails in ten ways: one flag for everything, giant clusters, unstable IDs, forgotten human decisions, counts that disagree with the page, a hidden auction in the representative rule, clusters that outlive their listings, an unmeasured matcher, forbidden data, and hashes kept forever. |  |  |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `ca-view`): At group scale the Chief Architect shares the machinery, names an owner per entity, sets the legal boundary of linking, governs the representative rule as ranking and watches a few numbers.\n\n**Advances the thesis** (S4, S5, S6): Turns the model into group decisions with owners.\n\n**Transition in:** `problem_solution`: The failure modes. → The decisions at group scale that prevent them.\n\n**Order of paragraphs** (`large_to_small`): From what the group builds once (machinery) to who owns each entity, what inputs it may read, how the most sensitive policy is governed, and what to watch.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p53 | transition | Most failure modes are prevented by decisions taken once at group scale, and entity resolution raises five of them. |  |  |\n| p54 | recommendation | Common Ground should build the matching machinery once, while each vertical owns its entity model and policies. |  | `sequence`: Five decisions. → The first: what to share. |\n| p55 | recommendation | Each entity type has a named owner who sets thresholds, answers disputes and signs off model changes, because a matcher without one is Set-and-Forget AI. | example: Canonical property: Hearthly's listing data domain; abuse clusters: the trust-and-safety platform under Aisha Rahman; cross-feed merges: ingestion. | `sequence`: Shared machinery, vertical entities. → Who owns each entity. |\n| p56 | recommendation | Which sources may be linked is a data-protection and competition decision, made by the Group DPO with brand owners and written into the matcher's input contract. | example: Linking a Tradeyard Portugal flat with a Hearthly listing, or using Keybridge data at Hearthly; Lucía Ortega decides. | `sequence`: Owners. → The legal boundary of what they may link. |\n| p57 | recommendation | The representative rule is governed as ranking: decided by product, legal and search together, published, and changed through the ranking experiment process. |  | `sequence`: The input boundary. → The policy governance. |\n| p58 | recommendation | A small set of numbers, placed next to the feed-health dashboard, shows when the capability drifts. | statistic: Listings per entity (1.7 at Hearthly France); precision and recall; gray-zone volume and cost; cluster churn; dispute and overturn rates; share of listings resolved. | `sequence`: Governance of the rule. → What to watch. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Ten review questions test a design against the chapter's claims.\n\n**Advances the thesis** (S1, S2, S3, S4, S5, S6): Turns each claim into a question for a design review.\n\n**Transition in:** `conclusion_summary`: The decisions and numbers. → Questions that check them in a review.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p59 | recommendation (list) | Ten questions check those decisions in a design review, from the action per duplicate kind to the sources the matcher may read. |  |  |\n\n## Conclusion: From Clean Supply to Live Supply\n\n**Synthesis:** Ingrid's four questions turn out to be one: decide what a duplicate is before deciding how to find it. The kind of duplicate sets the action, the vertical's entity sets the target, the registry makes the matcher's decisions stable and disputable, and the published policies decide what each audience sees; a nightly job that groups by address answers none of these.\n\n**So what:** Because search, alerts, valuation and pro reporting all count by the cluster identifier, governing it once is what lets them agree, and it is how Hearthly fixes Claire's first problem without worsening the second.\n\n**Callback:** Claire Fontaine's two sentences: buyers think there are more flats than there are, agencies think Hearthly picks favorites. The resolved Lyon flat answers both: one card for buyers, every agency one click away under a rule none can buy.\n\n**Takeaway** (`course_of_action`): Separate enforcement from clustering, resolve to the vertical's entity, keep cluster IDs in an owned registry, and publish the representative rule.\n\n**Hand-off** to [From Submitted to Searchable: The Publication Pipeline](publication-pipeline.html): `sequence`: Ingestion, normalization and entity resolution, which bring a record in, clean it and match it, and entity resolution's online checks, which must run before visibility. → The last link of the chain: the path from submission to visibility on every surface and back again, with its stages, latency budget and removal propagation.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p60 | synthesis | Ingrid's four questions reduce to deciding what a duplicate is before deciding how to find it, and the answer resolves Claire's demand: one card for buyers, every agency reachable under a rule none can buy. |  |  |\n| p61 | transition | Ingestion brought the listing in, normalization cleaned it and entity resolution matched it, and because the matcher's online checks must run before a listing goes live, the last link is the path from submission to visibility and back, the subject of the publication pipeline. |  | `sequence`: The resolved supply. → The publication pipeline as the last link. |\n\n## Non-goals\n\n- Feed mechanics and partner reconciliation. See [Many Doors In: Forms, APIs and Bulk Feeds](listing-ingestion.html).\n- Address, VIN and attribute normalization. See [From Raw Supply to Usable Listings: Normalization and Enrichment](normalization-and-enrichment.html).\n- Perceptual hashing as a media capability. See [Photos Sell: Media Pipelines for Listings](media-pipeline.html).\n- Fraud investigation and enforcement after a stolen-listing match. See [Scams, Fakes and Account Takeovers: Fraud Prevention for Listings](fraud-prevention.html).\n- Index design for collapsed results and ranking algorithms. See [Search Architecture for Listings: Indices, Freshness and Scale](search-architecture.html), [Ranking for Two Sides: Relevance, Freshness and Paid Visibility](ranking.html).\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-10-19** — Organized the chapter around five duplicate kinds and two action families (enforce vs cluster) rather than around algorithms, because the policy split is where real systems go wrong.\n- **2026-10-19** — Made the entity registry, not the search index, the system of record for cluster IDs; rejected a query-time-only collapse design as the recommended approach.\n- **2026-10-19** — Used the Keybridge neutrality decision as a constraint on matcher inputs, to show that ER inputs are a governance question.\n- **2026-10-19** — Kept the Lyon numbers (thresholds, precision 98.6%, recall 91%, dispute volumes) local and illustrative rather than adding them to the ledger.\n- **2026-11-12** — Success criteria of spec.md not carried over as such: the journal entry's AC-1 to AC-3 replace them. 'Name the five kinds with action and owner' and the representative-rule criterion are covered by AC-1; 'explain blocking, scoring, clustering, registry, chaining, stable IDs' and 'field-collapsing count inconsistency' become the minor post-level AC-4; the property-versus-listing criterion is covered by the reverse outline of the identity section; the inventory criteria (Lyon numbers, tables, diagrams, Chief Architect's view, questions, dated sources) were dropped as contents rather than reader outcomes.\n- **2026-11-12** — Draft check round 2 ESCALATE on spec-fault flow findings corroborated by both readers: the roadmap mapped sections to questions not yet stated, and the questions were answered in the order 1, 2, 4, 3; the pipeline promised an error rate it never gave. Changed paragraph ideas only: p09 asks the four questions in the order answered (dispute third, audiences last); p05 states the questions before mapping them; p25 says how error is measured; p19 describes the policy engine; p29 and the merge section's transition renumbered; p49 says what the vertical table adds. No reorder, no new units.\n- **2026-11-12** — Draft check round 1 ESCALATE on two spec-fault flow findings, corroborated by both flow readers: Ingrid's fourth question (who can dispute) had no signposted home, and the abuse cases sat under the Lyon heading unannounced. Under the brief's rule for spec faults, changed paragraph ideas only (no reorder, no new units): p05 maps each question to its sections and names the evidence; p29 states that it answers the fourth question; p37 announces the abuse cases; p19 explains Figure 2 and the policy engine; p53 ties the decisions to the failure modes; p46 opens on stolen copies as the second abuse case. Intent, thesis, role and journal criteria unchanged.\n- **2026-11-12** — Flow rubric verdict 'sound with notes'. Acted on: named Claire in p08 so the conclusion's callback has an antecedent; the post rationale now says why kinds precede entities, why the abuse cases sit in the practice section and why the judgement sections run in their order; the practice section's rationale explains the place of the Keybridge constraint. Notes not taken are in open_questions.\n- **2026-11-12** — Added minor, post-level units not in the journal spec: a roadmap paragraph (p05) so the opening announces every section; one-sentence leads for Trade-offs (p47) and Vertical Differences (p49) so their tables belong to a unit; a synthesis paragraph (p60) with a callback to Claire's two sentences. Figure 3 moved from after p28 to after p29, the paragraph that cites it.\n- **2026-11-12** — Resolved under the author's delegation, 2026-11-12 (round-3 spec-fault finding, corroborated by both flow readers): moved Vertical Differences (p49-p51) to follow 'What Is the Thing?', so the two vertical comparisons are read together. Dropped its 'Resolvable entity' row, which repeated the identity table (no fact lost); p49 now leads from the identity table; p51 no longer uses 'gray zone' and 'representative' before they are defined. Updated the pipeline section's transition_in, the roadmap (p05 and promises) and the flow rationale. AC-2's expected text, copied from the journal spec, still lists vertical differences among the closing sections; replacement text reported to the orchestrator as a journal-spec edit.\n- **2026-11-12** — Resolved under the author's delegation, 2026-11-12: p29 now shows the dispute path from what the chapter already says (reviewers decide gray-zone pairs; an agency or seller disputes a wrong link, the entity's owner answers, a reviewer checks the pair, the registry keeps the outcome as a constraint).\n- **2026-11-12** — Resolved under the author's delegation, 2026-11-12: Multiplier Creep (p35) and Search as System of Record (p48) are now named as the book's failure patterns and glossed with the glossary definitions.\n- **2026-11-12** — Restored under the author's delegation, 2026-11-12 (brief rule 7): the IN THIS CHAPTER callout, trimmed in the first pass to fit the limit, is back to its published wording; length.max_words raised from 6,994 to 7,200 (+2.9%, within the 10% allowed by rule 2) to make room for it and the fixes above.\n- **2026-11-12** — Kept under the author's delegation, 2026-11-12 (rule 8): the published-data-only rule (p43) stays in the Lyon practice section rather than moving into the pipeline section. The pipeline section is a company-neutral reference architecture, p43 is a Veldmark decision tied to Keybridge and the Lyon flat, and its round-3 finding was already fixed by the rewritten opener.\n- **2026-11-12** — Minor round-3 findings fixed cheaply, 2026-11-12: 'cluster' glossed in p01; roadmap p05 split into shorter sentences; p42 corrected to the arithmetic (listing C's drop to EUR 389,000 does not lower the property's lowest asking price, so it is an update, not a price-drop alert). Not changed: p31's forward link to the publication budget (the next chapter owns it), p06's channel sentence (the table in p38 clears it), the first-person 'rule I recommend' in p35 (house style allows it).\n- **2026-11-12** — Flow rubric notes not taken, kept as published under the author's delegation, 2026-11-12 (rule 8): folding p46's 'records why listings were linked' into p27; cutting p13's pointer to the representative rule; merging Zillow (p16) into p15; adding body paragraphs for failure mode 10 and the jobs column.\n- **2026-11-12** — Carried-over questions from spec.md closed under the author's delegation, 2026-11-12 (rule 8, keep the published text): the OLX 2019 design stays the cited example, with its age stated in p24; the Hearthly property registry stays unnamed (the ledger is not edited from a post); the VIN-as-personal-data note in p17 stays as hedged.\n- **2026-11-12** — AC-4 (minor, post-level, cold reader on the nightly renumbering job and collapsed counts) accepted under the author's delegation, 2026-11-12.\n- **2026-11-13** — Kinds, identity and verticals transitions: the first question is answered in three parts, matching the roadmap (spec fault, round 5). fixed under the author's delegation (fix-only pass).\n- **2026-11-13** — Pipeline order changed to p26, p31, p27, p29, p30, p28: online and batch before the registry, disputes straight after stable IDs, canonical entity last; transitions of p31, p27, p29, p28 rewritten (spec fault, round 5). fixed under the author's delegation (fix-only pass).\n- **2026-11-13** — Lyon walk-through: the Keybridge constraint (p43) moved before blocking; transitions of p43, p39, p44 rewritten; Keybridge glossed on first use as publishing agencies' listings to Hearthly's competitors (ledger line 18, issue 7) (round 5). fixed under the author's delegation (fix-only pass).\n- **2026-11-13** — Draft fixes (round 5): intro bridge defines cluster before use; vertical-differences opening split into plain sentences; p29 and p31 openings carry their declared relationships; first-person 'I recommend' removed in p35; p42 price-drop sentence split; 'Its cost' referent named; p48 tied to the trade-off table's rows; Common Ground glossed; failure mode 10 tied to blocking keys and the Barcelona ring. fixed under the author's delegation (fix-only pass).\n- **2026-11-13** — Minor findings fixed cheaply: fee sentence names the third agency's higher fee; thresholds stated before scores in p40; exact-address job picked up in p21; step from ranking to matching stated in p43. fixed under the author's delegation (fix-only pass).\n- **2026-11-13** — length.max_words 7,200 to 7,300 (+1.4%) for the added glosses and pointers. fixed under the author's delegation (fix-only pass).\n- **2026-11-13** — Orchestrator restored the published 'Because <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
