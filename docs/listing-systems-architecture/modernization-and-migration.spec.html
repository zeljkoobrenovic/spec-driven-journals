<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, acceptance criteria AC-1 to AC-3, the thesis and the role are copied unchanged from the modernization-and-migration entry in journal-spec.json; the supporting claims, audience and AC-4 and AC-5 are this spec's own. Units added by this conversion: introduction roadmap p04, a Trade-offs lead-in p56, a lead-in p55 for the end-2028 progress table, and a conclusion widened from one paragraph to two (p66 synthesis and callback, p67 hand-off); after the flow rubric the one-sentence paragraph 'Four principles follow from it' was merged into p18 (old p19 removed).\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Re-architect, re-platform and rewrite; seams and transitional architecture (edge routes, backends-for-frontends, event interception, branch by abstraction); parallel run, shadow traffic and canary; the migration stage gate.\n- **Know:** Data migration of listings and accounts with one writer per record, search migration with relevance parity, URL migration, the behavior catalog, kill switches, rollback and points of no return, and how to measure progress.\n- **Believe:** A live marketplace is migrated by slices behind seams, never by a rewrite and a single cut-over.\n- **Believe:** Parity means equal outcomes for buyers and sellers, not equal features or identical results.\n- **Be able to:** Order a monolith's capabilities into migration waves and name the seam for each.\n- **Be able to:** Write stage gates with numerical exit criteria and a rollback answer for a slice, including relevance parity for a search move.\n- **Be able to:** Decide in advance where a migration's points of no return are.\n\n**Audience:** Chief and principal architects, engineering directors and platform leads who own or inherit a legacy listing platform and must plan its replacement under traffic, SEO and revenue constraints.\n\n**Already knows:**\n\n- What an API, a database, an event stream, change data capture, a search engine and Kubernetes are; the strangler fig by name; feature flags, canaries and A/B tests.\n- From earlier chapters: liquidity and contacts as the success signal (liquidity-and-network-effects, ranking), VAS and bumps (monetization-models), Tally (products-and-entitlements), Safe Deal (transactions-and-payments), Listing event contract v1, Yardstick Relay, the backfill topic and the consumer registry (event-driven-listings, listing-data-management), Listing Search API v1 (search-architecture), the URL and redirect services (web-and-seo-architecture), Veldmark ID (identity-and-verification), Supply Contract v1 (listing-ingestion), DMS vendors (professional-seller-tooling).\n- Veldmark (fictional), its brands Tradeyard, Motorvane, Hearthly and Keybridge, Yardstick, Common Ground, the architecture advice forum, Ingrid Halvorsen and Daan Visser, and the failure-pattern names.\n\n**Does not yet know:**\n\n- The terms this chapter owns: migration stage gate, relevance parity, URL migration.\n- Seams, branch by abstraction, Legacy Mimic, transitional architecture, the feature-parity trap, the behavior catalog; shadow, parallel run and canary as distinct modes; rank-biased overlap and non-inferiority; points of no return.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a migration proposal that relies on a rewrite and identical results, the reader names the plan, gates and parity measure that replace it. *Probe:* A classifieds site's twenty-year-old monolith holds the listing table, renders most pages, runs undocumented scheduled jobs and serves old app versions directly. The proposal is to build the new platform to feature parity and switch over on one weekend, and to accept the new search engine when its top-ten results match the old engine's for 95% of head queries. Using only this chapter: what do you propose instead? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-4 | Given a legacy platform with a hosting deadline, the reader chooses between rewrite, re-platform and incremental re-architecture and justifies the choice. *Probe:* A marketplace's monolith runs in a data center whose contract ends in two years, and its data model blocks every team that wants to change listings. Using only this chapter: rewrite, re-platform or re-architect incrementally, and why? | `custom` | cold_reader | minor |\n| AC-5 | Given a plan to change URLs during a platform migration, the reader says what to do instead and how to protect search traffic. *Probe:* A team moving its listing pages to a new platform plans to switch to a new URL pattern on the day the new system takes over. Using only this chapter: what do you advise? | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** How do you move a live marketplace from legacy systems to a new architecture without losing traffic, sellers or revenue?\n\n> **Claim:** A live marketplace should be moved off its monolith slice by slice behind seams that can route traffic back in minutes (edge routes, backends-for-frontends, the event stream): read paths first, then the write path that unblocks the most teams, then search, with the system of record's archive last. Each slice should be owned by a team of the target organization, should carry a catalog of legacy behaviors deliberately kept, changed or retired, and should pass stage gates (contract, shadow, canary, ramp, retire) whose numerical exit criteria are liquidity outcomes agreed before the slice starts, such as relevance parity measured as non-inferior contacts per search session rather than identical results; URLs should stay stable unless a change is decided, and every point of no return should be recorded as a decision before it is reached.\n\n**Disputed by:** The rewrite: build the new platform beside the monolith to feature parity and switch over in one cut-over, judge the new search engine by how closely its results match the old one's, and treat rollback as an emergency procedure rather than a designed path.\n\n**So what:** A Chief Architect who accepts this spends early on seams that deliver little visible value alone, has the advice forum review each slice's gate criteria before it starts, puts liquidity metrics (contacts, publication outcomes, billing, organic traffic) into every gate, reports the double-running cost and its end date, requires rollback rehearsals with real cohorts, and takes each point of no return as a recorded forum decision.\n\n**How and why:** Yardstick, Tradeyard's PHP monolith, implemented 23 capabilities, had a 214-column listing table read by 38 modules, 47 scheduled jobs (9 without a known owner), 312 admin actions and 118 app endpoints, and its colocation contract ends on 31 December 2029. The Yardstick Exit plan moves it in waves 0 to 6. In the insertion shadow 6.8% of submissions first differed, and nine behaviors surfaced that the 146-item catalog had missed, among them a job that turned a price of €0 into 'price on request'. On Tradeyard Portugal, fewer than three-quarters of the new engine's top ten results matched the old engine's (median overlap 0.71), yet 8.8% of search sessions led to a contact against 8.7% on Solr, and the relevance parity gate passed. No listing URL changed in 2028, and capabilities implemented only in Yardstick fell from 23 to 6 by December 2028.\n\n**Supporting claims**\n\n- **S1** — A live marketplace is moved off its monolith slice by slice behind seams that can route traffic back in minutes (edge routes, backends-for-frontends, the event stream, branch by abstraction), never by a rewrite and a single cut-over; the transitional components this needs are owned systems with end dates.\n- **S2** — Slices are ordered read paths first, then the write path that unblocks the most teams, then search, with the system of record's archive last, and while two systems run each record has exactly one writer and the old system is kept current so that rollback stays cheap.\n- **S3** — Each slice is owned by a team of the target organization and carries a behavior catalog that decides for every legacy behavior whether to carry, change or retire it, instead of chasing feature parity.\n- **S4** — Each slice passes stage gates (contract, shadow, canary, ramp, retire) whose numerical exit criteria are liquidity outcomes agreed before the slice starts; for search this is relevance parity, non-inferior contacts per search session on an index rebuilt from the event stream, not identical results.\n- **S5** — Public URLs and their status codes stay stable through a platform migration unless a change is decided and made as a separate, measured step.\n- **S6** — Rollback is rehearsed with real data, every point of no return is recorded as a decision before it is reached, and progress and the double-running cost are measured as outcomes with end dates.\n\n## Role in the part\n\nSupplies the techniques for moving a live marketplace onto the platforms and owners the previous chapters chose, slice by slice and gate by gate. Supports P8-3 of part `part-8`.\n\n## Flow\n\n**Pattern:** `prerequisite_order`  the vocabulary of displacement. *Kept in:* concepts.\n- Design the architecture for running two systems on one marketplace. *Kept in:* architecture.\n- Follow Veldmark's Yardstick Exit plan through its insertion and search waves. *Kept in:* in-practice.\n- Close with trade-offs, vertical differences, failure modes, the Chief Architect's view and questions to ask. *Kept in:* trade-offs, verticals, failure-modes, ca-view, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | claim | Part VIII turns here from decisions to code: Tradeyard's teams still ship through Yardstick, which holds the listing table, renders the indexed pages, runs the alert and billing jobs and slows every team and fraud rule, so modernization is not optional and the only choice is how much liquidity it puts at risk. | scenario: Yardstick since 2006; a fraud rule takes three days to reach another country; 140 engineers wait for the same deploy. |  |\n| p02 | context | The strangler fig settles the first-order question in favour of gradual replacement, so the hard questions are the second-order ones: which slice first, how to run two systems on one dataset, how to judge a new search engine, how to keep 40 million URLs working and when going back stops being possible. | quotation: Fowler: gradual replacement 'begins with small additions, often new features'; 'the reduced risk and earlier value from the gradual approach outweigh its costs'.; figure: Figure 1: strangler-fig vines with new modules grow around the monolith while the market stays open. | `contrast`: Modernization is unavoidable for Yardstick. → The settled answer (strangle gradually) and the open second-order questions. |\n| p03 | definition | The chapter owns three terms, migration stage gate, relevance parity and URL migration, and leaves event mechanisms, the search platform and the URL services to the chapters that own them. | reasoning: Definitions of migration stage gate, relevance parity (not identical results) and URL migration; links to event-driven-listings, search-architecture, web-and-seo-architecture, saved-searches-and-alerts and long-term-evolution. | `elaboration`: The second-order questions about gates, search and URLs. → Precise terms for the answers. |\n| p04 | transition | The chapter sets the scene with Yardstick's 2027 inventory, defines the vocabulary of displacement, designs the architecture for running two systems on one marketplace, follows Veldmark's Yardstick Exit plan through its insertion and search waves, and closes with trade-offs, vertical differences, failure modes, the Chief Architect's view and questions, on evidence from the legacy-displacement literature, dated classifieds migrations and Google's guidance. | source: Fowler and Cartwright, Horn and Lewis; Marktplaats, Kleinanzeigen, Vinted, Scout24 and Subito accounts; Google Search Central; Veldmark. | `sequence`: The three terms the chapter owns. → The order in which the chapter uses them. |\n\n## Sections\n\n### Setting the Scene at Veldmark: Yardstick in 2027\n\n**Controlling idea** (`context`, id `scene`): Yardstick's inventory and its fixed dates pose the chapter's question: what moves in which order, how do we know each move worked, and how do we go back.\n\n**Advances the thesis** (S1, S2): Gives the coupling and the deadline the plan must handle.\n\n**Transition in:** `example`: The roadmap's promise to start with Yardstick. → Veldmark's monolith in 2027.\n\n**Order of paragraphs** (`large_to_small`): From what Yardstick is, to its measured inventory, to the question the dates pose, to the seams already built; the question needs the inventory first, and the existing seams come last because they are the first partial answer to it and show that no write has moved yet.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | description | Yardstick, Tradeyard's PHP monolith since 2006 on MySQL in an Amsterdam colocation, still owns the listing table, insertion, most page rendering, alerts, pro tools, the back office and Safe Deal integration for 13.2 million live listings in four countries, although about 40 microservices have grown around it since 2019. | scenario: 13.2 million live listings, about 2.3 million new listings a week, 31 million monthly users; about 40 microservices on AWS since 2019. |  |\n| p06 | evidence | In July 2027 Daan Visser and Ingrid Halvorsen set up the Yardstick Exit enabling team, whose September 2027 inventory, headed by 23 capabilities to move or retire, is the starting point for the plan. | table: 23 level-2 capabilities; 214 columns in `ads` read by 38 modules; 47 cron jobs, 9 ownerless; 312 admin actions; 118 app endpoints; 14 systems reading tables directly (26 in March); 16 teams tied to Yardstick deploys (19 in March); colocation contract ends 31 December 2029. | `cause_effect`: What Yardstick still owns. → The inventory that measures it. |\n| p07 | claim | The board's three Common Ground milestones (insertion out in Q2 2028, search out in Q4 2028, decommissioning at the end of 2029) turn the inventory into the chapter's question: what moves in which order, how do we know each move worked, and how do we go back if it did not. | scenario: Milestones fixed in January 2027. | `cause_effect`: The inventory. → The question the dates pose about it. |\n| p08 | description | Two seams already exist in 2027, Yardstick Relay publishing Listing event contract v1 by change data capture and CloudFront route rules in front of the page applications, but neither moves a single write. | scenario: Relay since 1 July 2027; the web-layer route rules since May 2027. | `contrast`: The question of what moves and how. → The groundwork already in place and its limit. |\n\n### Concepts: The Vocabulary of Displacement\n\n**Controlling idea** (`definition`, id `concepts`): Migration strategies, seams, transitional components, run modes, the behavior catalog and stage gates are distinct tools that the rest of the chapter combines.\n\n**Advances the thesis** (S1, S3, S4): Defines the seams, the parity trap and the gates the thesis uses.\n\n**Transition in:** `cause_effect`: Yardstick's question and its two seams. → The vocabulary needed to answer it.\n\n**Order of paragraphs** (`prerequisite_order`): Strategy first, because it decides whether seams are needed; seams and their components next; run modes after; the behavior catalog after the run modes, because shadow comparisons feed it; gates last, because their exit criteria use the catalog and the run modes. With the catalog after the gates, G0 would name a term the reader has not met.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | comparison | Rewrite, re-platform and incremental re-architecture are three different strategies that change different things at different risk. | table: Strategy table: rewrite (no documented classifieds success found), re-platform (ImmobilienScout24 to AWS from 2018, 'Erst umziehen, dann optimieren'), re-architect incrementally (AutoScout24 from November 2014, 'very time-intensive'). |  |\n| p10 | recommendation | Scout24 ran both strategies a decade apart, and the author's reading is to re-architect when the runtime or data model blocks the target and to re-platform first when the code fits and a deadline dominates, which is why Yardstick's plan strangles the core to decommissioning by the end of 2029 and keeps a lift of whatever is left only as an undecided contingency. | reasoning: Yardstick has both problems: a colocation end date and a 214-column table. | `cause_effect`: The three strategies and the Scout24 examples. → The rule for choosing between them and its application to Yardstick. |\n| p11 | definition | A seam is a place where traffic or data can be diverted from the old system to the new one, and a listing marketplace has four natural seams: edge routing, backends-for-frontends, event interception and branch by abstraction. | table: Seam table with Subito's 2023 CDN routing on Akamai and Fowler's 2014 branch by abstraction. | `elaboration`: The incremental strategy chosen for Yardstick's core. → The seams it runs behind. |\n| p12 | evidence | Cartwright, Horn and Lewis name the displacement patterns this chapter uses, Event Interception, Legacy Mimic and Transitional Architecture, and present Feature Parity as a common cause of failure. | quotation: 'even defining and agreeing current \"as is\" functionality was a huge effort' | `additional_support`: The four seams. → The published pattern names for the components around them. |\n| p13 | claim | Transitional components such as Yardstick Relay and every reverse-synchronization job exist to be switched off, so they need owners, budgets and end dates like any other system. |  | `example`: Transitional Architecture as a pattern. → Yardstick Relay as an instance and the rule it implies. |\n| p14 | comparison | Shadow, parallel run and canary differ in what the new system is allowed to do with real requests. | table: Mode table: shadow output discarded; parallel run with one authoritative output; canary serves a small share. | `sequence`: The components that let two systems coexist. → The ways of running them side by side. |\n| p15 | evidence | Because listing data changes under live shadow traffic, the first comparisons should replay recorded queries on frozen data, as Marktplaats chose in 2015: reproducibility beats realism, and live shadow traffic comes after. | case: Marktplaats replayed recorded user queries against indices built from a production copy, in small random batches every five minutes. | `contrast`: Shadow traffic as a mode. → Its weakness on changing listing data. |\n| p36 | definition | Feature parity is a trap, and the alternative is a behavior catalog per slice that gives every observable legacy behavior a decision (carry, change or retire) and an  comes first because the search index is rebuilt from the data stream and URLs depend on stable listing identifiers; rollback and measures come last because they depend on all earlier parts.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | description | Figure 4 shows Tradeyard's transitional architecture in mid-2028, after insertion has moved and before search, with three seams deciding which system serves what; four principles follow from it. | figure: Figure 4: edge routes, BFF routing and the event stream; the new listing service as system of record for its listings; the Legacy Mimic writer. |  |\n| p20 | claim | Read paths move before write paths, because pages and read APIs can be fed from event-stream read models while the monolith stays the only writer, delivering visible value at low data risk. | reasoning: The platform research's reference-architecture inference: read-heavy, SEO-critical page types first; insertion, payments and messaging last. | `sequence`: The transitional architecture and its four principles. → The first: order of slices. |\n| p21 | claim | Each listing has exactly one writer at any moment, decided per listing at creation by seller cohort, because dual writes from application code corrupt two systems at once. |  | `sequence`: Read paths first. → The rule for the write path when it moves. |\n| p22 | explanation | The old system is kept current but not authoritative: the Legacy Mimic writer copies the new service's listings into the `ads` table, flagged as externally owned, which keeps modules in Yardstick working and rollback cheap until G4. |  | `sequence`: One writer per listing. → How the other system still sees listings it does not write. |\n| p23 | process | Loops between Relay and the Mimic writer are broken by `listing_version` and owner, not by time. |  | `cause_effect`: Changes flowing both ways. → The echo problem and its fix. |\n| p24 | claim | Listings and accounts are migrated differently because listings are short-lived and accounts are not. |  | `sequence`: How the two systems stay consistent while both run. → Moving the data itself. |\n| p25 | explanation | Most listings need no migration because they end within days or weeks; only long-lived listings and the archive are backfilled, through Relay's snapshot mode and the backfill topic so downstream copies are corrected rather than duplicated. |  | `elaboration`: The difference between listings and accounts, stated once. → The listing side. |\n| p26 | evidence | Accounts need a per-user migration, and Kleinanzeigen's 2025 account is the best public example: a reverse proxy routing by migration state, CDC instead of dual writes with up to a minute's delay accepted as a business decision, a per-user state machine and version-based loop breaking. | case: Kleinanzeigen 2025: outbox rejected for polling load and missed write paths; states identified to transitioned; statement-based binlogs without GTIDs needed row-format replicas for CDC; the post names neither platform. | `contrast`: Listings, which mostly need no migration. → Accounts, which do. |\n| p28 | explanation (list) | Three facts shape a search migration: results will differ, the index must be rebuildable from a source other than itself (otherwise the group has Search as System of Record), and analyzers carry years of tuning. | case: eBay Kleinanzeigen (now Kleinanzeigen) rebuilt its Elasticsearch cluster from a compacted Kafka topic in under 30 minutes (2019). | `sequence`: Data migration of listings and accounts. → The search slice, which buyers notice first. |\n| p29 | process | Relevance parity is therefore measured in four layers, analyzer parity, offline replay, shadow traffic and an online experiment, each catching different faults. | table: Layer table with method, what it catches and typical gate, ending in non-inferiority on the primary outcome. | `cause_effect`: The three facts. → How parity is measured given them. |\n| p30 | claim | The online experiment is the definition that matters: the question is whether buyers find and contact sellers at least as well, and user-level randomization is usually adequate for an engine swap. |  | `emphasis`: The four layers. → The one layer that decides. |\n| p31 | example | Marktplaats's 2015 replacement of Voyager by Elasticsearch shows the sequence: same interfaces, reused tests, the recorded-query replay met under shadow traffic, a 1%, 50%, 100% ramp with Voyager kept warm, and failures from hidden functionality. | case: Two to three developers, about three months, zero downtime; 'hidden functionality in other parts of the system'. | `example`: The definition of relevance parity. → A documented migration that followed the sequence. |\n| p32 | example | Vinted modernized its indexing path before its engine, the order Veldmark follows, and then moved to Vespa with shadow traffic and A/B tests. | case: Visibility latency from up to seven minutes to about one (2023); six Elasticsearch clusters to one Vespa deployment May 2023 to April 2024; latency 2.5 times better; change-to-visible 300 s to 5 s. | `additional_support`: Marktplaats's sequence. → A second migration and its ordering. |\n| p33 | claim | A marketplace's URL space is its search-engine inventory, so every URL a migration changes is a signal search engines must relearn. | scenario: About 40 million indexed Tradeyard URLs at the start of 2027; 46% of web sessions from organic search. | `sequence`: Search, the inventory buyers see. → URLs, the inventory search engines see. |\n| p34 | evidence | Google's site-move guidance prescribes mappings, direct permanent redirects kept at least a year, new sitemaps and an expected ranking fluctuation, and Kleinanzeigen kept its old domain accessible for years after its 2023 rebrand. | quotation: 'generally at least 1 year'; 'expect temporary fluctuation in site ranking during the move'.; fact: The previous domain was to 'remain accessible for several more years' (May 2023). | `additional_support`: URLs as inventory. → What the authority on search says a change costs. |\n| p35 | recommendation (list) | The author's rule is not to change URLs because the platform changed: keep listing identifiers stable, route by pattern at the edge, put unavoidable changes in a redirect registry with monitoring, and treat status codes as part of parity. |  | `cause_effect`: The cost of a URL change. → The rule that avoids it. |\n| p38 | description | Each seam needs a kill switch an on-call engineer can flip in minutes without a deploy. | table: Switch table: edge route weight, BFF routing flag, consumer switch, search engine selection, with scope and rollback effect. | `sequence`: Stable URLs, the last thing a move must not change. → The switches that move traffic back. |\n| p39 | recommendation | A switch is only as good as the data behind it, so rollback must be rehearsed with real data at G2 and before every ramp step. |  | `contrast`: The switches. → The data they depend on. |\n| p40 | comparison | Progress is measured by outcomes of the migration, not lines of code moved. | table: Measures: capabilities left in the legacy system (23 at Yardstick in 2027), traffic share, direct readers, tied teams, transitional components with end dates, business guardrails, double-running cost. | `sequence`: Rehearsed rollback. → How to know the migration is moving forward. |\n| p41 | evidence | Double running costs real money, as Adevinta's 2025 report shows, so every plan should carry the double-running cost as a line item. | fact: Adevinta attributed a more-than-doubling of cloud-provider emissions to 'parallel running of central and local services during a transitional period'. | `emphasis`: The last row of the measures table. → Its evidence. |\n\n### In Practice: Veldmark's Yardstick Exit Plan\n\n**Controlling idea** (`example`, id `in-practice`): Veldmark's plan applies the method to Yardstick: waves in order, insertion cepts that loss in May 2028 for that feature only. | `sequence`: G3. → G4 and the point of no return. |\n| p50 | description | The search slice follows the September 2027 search platform decision, and its new index is built from the compacted listing state topic, not from Yardstick's Solr, so Search as System of Record does not arise. |  | `sequence`: Wave 2. → Wave 3, search. |\n| p51 | evidence | The parity gates for Tradeyard Portugal were set before the migration began. | table: Analyzer set of 2,400 queries (31 differences, 6 synonyms restored); zero-result 3.1% to 2.9%; median RBO@10 0.71, reported not gated; p95 180 ms against 250 ms; sessions with a contact 8.8% against 8.7% (not significant). | `elaboration`: The search slice. → Its gates and results. |\n| p52 | analysis | The overlap line shows why identical results are the wrong target: fewer than three-quarters of the top ten agreed, yet buyers contacted sellers at the same rate, so the gate passed and the other countries followed on the same gates. | figure: Figure 5: differently ordered results, equal contacts. | `cause_effect`: The gate results. → What they mean for the parity definition. |\n| p53 | example | No listing URL changed in 2028, because the new service's identifiers continue Yardstick's numeric sequence and older search URLs are permanent redirects kept without an end date. | scenario: Group listing identifiers `vm:tradeyard:<country>:<id>` whose local part continues Yardstick's numeric sequence from a reserved block; legacy search URLs redirected through the registry without an end date. | `sequence`: Search moved. → URLs kept. |\n| p54 | evidence | During each wave the SEO team watches indexed pages, crawl errors, organic sessions and organic contacts per page type and country, and in the insertion ramp none moved outside normal variation. | scenario: Indexed pages, crawl errors, organic sessions and organic contacts per page type and country; none outside normal weekly variation in the insertion ramp. | `cause_effect`: The decision not to change URLs. → The measurement that checks it. |\n| p55 | evidence | By December 2028 the progress measures show most of Yardstick gone: capabilities only in Yardstick fell from 23 to 6, and every new listing was created outside it. | table: Sep 2027 vs Dec 2028: 23 to 6 capabilities; 31% to 88% page views; 0% to 100% new listings; 14 to 3 direct readers; 16 to 5 tied teams; 2 to 1 deploys a week; transitional components 2 to 3, all with 2029 end dates. | `sequence`: The waves of 2028. → Where they left Yardstick at year end. |\n\n### Trade-offs\n\n**Controlling idea** (`comparison`, id `trade-offs`): Each choice in the method has conditions under which it is wrong.\n\n**Advances the thesis** (S1, S2, S4, S5): States the limits of the claims.\n\n**Transition in:** `cause_effect`: Veldmark's choices. → The alternatives and their limits.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p56 | comparison | Each choice in the plan is right under some conditions and wrong under others, as the table shows. | table: Trade-off table: strategy, slice order, synchronization, parity, shadow method, URLs, with when right and when wrong. |  |\n\n### Vertical Differences\n\n**Controlling idea** (`comparison`, id `verticals`): Verticals differ in their migration risk, cohort and the parity that matters.\n\n**Advances the thesis** (S2, S4): Adapts slice order and parity to each vertical.\n\n**Transition in:** `elaboration`: The trade-offs. → How they fall in each vertical.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p57 | comparison | Professional verticals have natural migration cohorts but depend on external parties changing their integrations, a dependency that a stable external contract such as Veldmark's Supply Contract v1 removes. | table: Vertical table: main risk, who must change integrations (up to 160 vendors ble. |\n| p61 | recommendation | Decide the points of no return in advance as forum decisions with a recorded rationale. |  | `contrast`: Reversibility. → The moments where it ends. |\n| p62 | recommendation | Fund double running explicitly and shorten it, without skipping gates to do so. |  | `sequence`: Points of no return. → The cost of the period before them. |\n| p63 | recommendation | Protect liquidity by putting contacts, publication, billing and organic traffic into every gate, because a migration that passes every technical check and loses contacts has failed. |  | `emphasis`: Cost and speed. → What the business actually judges. |\n| p64 | recommendation | The owning team proposes gate criteria, the advice forum reviews them and the G3-to-G4 decisions, the CTO decides sequence changes that move funding or dates, and finance signs off billing parallel runs, while the progress measures are watched. |  | `conclusion_summary`: The five recommendations. → Who decides each and what to watch. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Ten questions test whether a migration plan has the method's elements.\n\n**Advances the thesis** (S1, S2, S3, S4, S5, S6): One question per element.\n\n**Transition in:** `cause_effect`: The Chief Architect's decisions. → Questions that test them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p65 | recommendation (list) | Ten questions test a migration plan in a design review, from slice ownership to consumers that still read the legacy database. |  |  |\n\n## Conclusion: From Migration to AI\n\n**Synthesis:** Seams, gates, the behavior catalog and outcome parity together keep every step reversible until a recorded decision ends it, which is what bounds the liquidity a live migration puts at risk.\n\n**So what:** A Chief Architect can then retire a monolith on a contract date without losing traffic, sellers or revenue, and can show the business each step's risk in liquidity terms.\n\n**Callback:** The opening claim that the only choice is how much liquidity the migration puts at risk. The conclusion shows the risk bounded in Yardstick's numbers: six capabilities left, no URL changed, contacts per search session held.\n\n**Takeaway** (`course_of_action`): Build the seams first, write each slice's gates in liquidity numbers before it starts, and record each point of no return as a decision.\n\n**Hand-off** to [AI Across the Listing Lifecycle](ai-in-listing-systems.html): `cause_effect`: The platform that replaces Yardstick is delivered capability by capability, and its structured services are what the next technology shift will run on. → Generative AI and agents across the listing lifecycle and the control layer around them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p66 | synthesis | The seams, gates, catalog and parity measures add up to one property, that every step stays reversible until a recorded decision ends it, so the liquidity Yardstick's retirement puts at risk is bounded by design: by December 2028 six capabilities remain, no listing URL changed and contacts per search session held. | scenario: 23 to 6 capabilities; no listing URL changed in 2028; 8.8% vs 8.7% sessions with a contact. |  |\n| p67 | transition | Yardstick's replacement is delivered capability by capability, and its structured services (the taxonomy and attribute service, Listing Search API v1, the shared trust-and-safety platform) are what the next technology shift will run on, which ai-in-listing-systems takes up. |  | `cause_effect`: The bounded, reversible migration. → The new platform as the base for AI. |\n\n## Non-goals\n\n- Event contract design, outbox and CDC mechanics. See [Every Change Is an Event: Event-Driven Listing Architecture](event-driven-listings.html).\n- Search engine choice and index design. See [Search Architecture for Listings: Indices, Freshness and Scale](search-architecture.html).\n- URL service, redirect registry and landing pages. See [Found by Google: Web, App and SEO Architecture for Listings](web-and-seo-architecture.html).\n- Account and identity migration design. See [Who Is on the Other Side? Identity and Verification](identity-and-verification.html).\n- Post-acquisition consolidation sequence. See [After the Deal: Consolidating Platforms After Acquisitions](platform-consolidation.html).\n- Team design. See [Who Owns What: Organizing Marketplace Engineering](organizing-marketplace-engineering.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Thesis rubric (2026-11-12, fresh agent): FAIL on how_why only. The journal spec's how_why lists Yardstick evidence (inventory, shadow diffs, Portugal parity figures) but does not state the reasoning (why seams that route back in minutes cap the loss, why read paths go first, why liquidity outcomes are the right exit criteria). The journal spec is not edited from this pass; the author decides whether to rewrite how_why there. The rubric also noted mild wandering: S2's one writer, S6's rehearsal and double-running cost and S1's end dates go beyond the claim's wording.\n- Minor flow finding (round 5, one reader): the wave order puts search, a read path, after the insertion write path without saying why; the ledger gives no reason, so none was added. The author may supply one.\n\n## Decision log\n\n- **2026-10-19** — Defined relevance parity as non-inferiority on contacts per search session, with overlap reported but not gated.\n- **2026-10-19** — Kept accounts out of Yardstick Exit and inside the Veldmark ID slice, to avoid migrating accounts twice.\n- **2026-10-19** — Added the Amsterdam colocation end date (31 December 2029) as the reason the decommissioning date is hard.\n- **2026-10-19** — Ordered waves read paths first, insertion second, search third, messaging and Safe Deal last, because the last depend on accounts.\n- **2026-11-12** — Word limit set to 7,164 by check_draft's count: spec.md set none, so the published prose (6,823) plus 5%. Rejected: The style guide's 7,500-word chapter range, which is not a limit the old spec set.\n- **2026-11-12** — Success criteria from spec.md: strategy choice with the Scout24 contrast rewritten as AC-4 and the URL rule as AC-5 (both minor, cold reader); seams and transitional components, stage gates with rollback, and relevance parity are covered by AC-1; dated-evidence, ledger-consistency and 'includes tables' criteria dropped as inventories (ledger agreement was checked during conversion).\n- **2026-11-12** — Flow rubric (sound with notes) acted on: merged the one-sentence 'Four principles follow from it' (old p19) into p18; p28 now names Search as System of Record before in-practice p50 uses it; p31 points back to the replay in p15; p06 gives the inventory headline (23 capabilities); in-practice redeclared as chronological per slice; ca-view redeclared as prerequisite_order to match its reason. Rejected: Merging p27 (accounts move with Veldmark ID) into p43: they make different points (whose slice accounts are; why messaging waits) and merging would move published text across sections.\n- **2026-11-12** — Draft check round 2 (escalate): both flow readers again met the behavior catalog in the G0 gate before its definition, a fault of the declared order. Moved p36 and p37 (Feature parity and the behavior catalog, with Figure 4) from the architecture section into Concepts, after the run modes and before the gates; rewrote the transition_in of p36, p16 and p38; removed the round-1 forward gloss in G0. Also added opening sentences that express the declared transitions into Concepts, Architecture and the Chief Architect's View, a sentence in p27 naming the lessons of the Kleinanzeigen case that Veldmark keeps, and a link for the March capability map. Rejected: Keeping the order with a longer gloss: the round-1 gloss did not resolve it for either reader.\n- ns unchanged; sources archived in _research/mermaid-figures.json); known differences from the source: Figure 2: kept attempt 1: prints the words 'START' and 'END' beside the start and end dots (otherwise correct); Figure 3: kept attempt 4: 'CDC' arrow dashed instead of solid; 'Yardstick PHP monolith'–'Yardstick MySQL' line has an arrowhead; MySQL box icon is a dolphin resembling the MySQL logo. (AI-mediated session)\n- **2026-10-20** — Term alignment with the glossary: 'projection' → 'read model', 'copy register' → 'consumer registry', 'filter compiler' → 'query compiler', where they occur on this page. (AI-mediated session)\n- **2026-10-20** — Consistency fix: Excerpt lists all five stage gates, starting with contract, to match the body and glossary. (AI-mediated session)\n- **2026-10-20** — Sharpening pass: 5,419 → 5,467 prose words; lead now ties the chapter to Part VIII (after consolidation and organization) and names what depends on it; Vinted and URL paragraphs reordered point-first; no headings renamed; spec unchanged. (AI-mediated session)\n- **2026-10-20** — Cross-chapter consistency sweep: 2 heading(s) aligned with the book's shared section names, glossary terms and source-group structure; no body text changed. (AI-mediated session)\n- **2026-10-19** — Added 3 inline illustrations (article-illustrator); figures renumbered. (AI-mediated session)\n- **2026-10-19** — Editorial review pass: American spelling; figure caption spacing; Vinted Vespa figures re-verified. (AI-mediated session)\n- **2026-10-19** — Initial spec and article. (AI-mediated session)\n- **2026-11-12** — Escalation auto-resolved under the author's delegation: timeline corrected toward the ledger (no scheduled lift, waves 0 to 6, two to three weeks, Portugal's April ramp, rehearsal count), Kleinanzeigen case reframed, minor fixes, max_words 7,300; round 4 run. (AI-mediated session)\n- **2026-11-13** — Fix-only pass under the author's delegation: p27 moved to In Practice, four draft-fault findings and two minor findings fixed; no new check round. (AI-mediated session)\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
