<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, the four acceptance criteria, the thesis and the role are copied unchanged from the case-property-portals entry in journal-spec.json; the supporting claims and audience are this spec's own. Added by this conversion: a route sentence in p02 so the roadmap announces every section, and a conclusion section (p59 new synthesis; p60 the published closing paragraph moved under its own heading, with the hand-off's dealer-software clause).\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Zillow Offers in Zillow's own words: the Zestimate made an initial cash offer in 23 markets in February 2021, and the November 2021 wind-down after it was 'unable to accurately forecast future home prices at different times in both directions'.\n- **Know:** Four economic engines: Rightmove per advertiser (£1,621 a month on average in 2025), REA per listing through vendor-paid depth, Zillow per lead through share of voice or a fee at closing; and why values across these rows cannot be compared.\n- **Know:** Supply licensed from MLSs and agents (Zillow's data licenses that may restrict 'the training of models', its 2025 listing policy, lawsuit and March 2026 change), Rightmove's published feed contract, Idealista's duplicate clustering, and how little is public about REA's and Idealista's engineering.\n- **Believe:** A model's governance follows the decision it drives, and moving it from informing to committing money is a governance event.\n- **Believe:** License terms, embargoes and agent relations belong in the architecture as data and controls.\n- **Be able to:** Name the questions a commit-tier use of a valuation model must answer that a present-value back-test does not.\n- **Be able to:** Choose the monetization core (contracts and quotas, per-listing orders, lead routing with attribution) for a portal's unit of charge.\n\n**Audience:** Chief and enterprise architects, ML and data leads, and engineering directors of real-estate portals and of groups that own them, deciding how valuation models, licensed supply and monetization should shape a portal's systems.\n\n**Already knows:**\n\n- What an API, a database, an event stream, a search engine and Kubernetes are; what an automated valuation model (AVM) and a listing feed are in general.\n- Part IX's evidence rules (documented fact, the author's reading, labeled inference), from part-9, and the previous case, case-aviv.\n- From earlier chapters: the decision tiers inform, order, gate and commit (ml-platform); the property and listing model and duplicate clustering (entity-resolution); feed contracts with idempotency keys and snapshot reconciliation (listing-ingestion); monetization models and the unit of charge (monetization-models, products-and-entitlements); percolator-based alerts (saved-searches-and-alerts).\n- Veldmark (fictional), Hearthly, Valuo, Keybridge, Ingrid Halvorsen and the Lyon apartment, from meet-veldmark and earlier chapters.\n\n**Does not yet know:**\n\n- The four portals' histories, products and published figures; the Zestimate; iBuying and Zillow Offers.\n- US listing institutions: the multiple listing service (MLS), Internet Data Exchange (IDX), NAR's listing options and the 2024 settlement.\n- Company-specific terms: share of voice, pay-at-close (Zillow Preferred), REA's Buy yield and Premiere+, Rightmove's ARPA and RTDF, Homes.com's listing-agent lead model.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a proposal to turn a portal's valuation estimate into cash offers, the reader uses Zillow's dated record to say what changes and which questions must be answered before launch. *Probe:* A property portal's estimate has a low median error on homes currently listed. Its product team proposes offering homeowners cash at 94% of the estimate and reselling the homes. Using only this chapter: what does Zillow's record show, what changes about the model, and what must be answered before launch? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's questions, its evidence and where it ends. *Probe:* After reading only the callouts and the paragraphs before the first heading: what questions will this chapter ask, what kind of evidence will it use, and how will it end? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-4 | Every statement about Zillow, Rightmove, REA or Idealista's internal systems that no cited source documents sits in a callout or figure caption labeled as inference, and every company fact outside those labels carries its source and publication year. *Probe:* Is there any sentence outside an `INFERENCE, NOT DOCUMENTED` callout or a labeled figure caption that describes how Zillow, Rightmove, REA or Idealista builds or runs a system without a dated source, or a company fact with no source and year? | `custom` | rubric | major |\n\n## Thesis\n\n**Question:** What do licensed supply, durable properties, valuation models and the unit of charge demand of a property portal's architecture, as Zillow, Rightmove, REA and Idealista document them, and where does their evidence stop?\n\n> **Claim:** The property portals' record shows that what a portal's models may decide, where its supply comes from, what its durable entity is and what it charges for shape its architecture more than its technology choices do: Zillow moved the Zestimate from informing to committing capital in February 2021 and wound Zillow Offers down that November with no visible validation for the new use, so models must be governed by the decision they drive; supply is licensed from MLSs and agents who also feed rivals, so license, embargo and training terms must travel with every listing as data; a home is listed, sold, let and valued many times, so the property, not the listing, must be the durable entity that valuations, price history and duplicate clusters hang off; and Rightmove's per-advertiser, REA's per-listing and Zillow's per-lead charging each need a different monetization core. The evidence stops at REA's engineering and almost everything technical about Idealista.\n\n**Disputed by:** The technology-first view that a portal's architecture is mainly its search, data and cloud stack; with it, the views that a valuation model good enough to show homeowners is good enough to price purchases, that data licenses and agent relations are contract matters for the legal and sales teams rather than architecture, that the listing is the natural unit of a portal's data, and that one monetization platform fits any portal whatever it charges for.\n\n**So what:** A Chief Architect registers models by the decision they drive and blocks a launch that changes a model's tier without a decision record signed outside the model team; carries each listing's license, embargo, attribution and training-eligibility terms from ingestion to search, syndication, AI-assistant feeds and training pipelines; designs the catalog and entitlement core so that listing-level orders and lead-level attribution are possible; makes the property, not the listing, the durable entity; and measures AI assistants as a lead channel by experiment on leads.\n\n**How and why:** Zillow made the Zestimate an initial cash offer in 23 markets in February 2021 and in November 2021 was winding Zillow Offers down, writing that it had been 'unable to accurately forecast future home prices at different times in both directions'; the model had not got worse, it had been moved from describing present values to pricing purchases resold months later. Zillow's 10-K warns that MLS and data licenses may restrict 'the training of models', and its 2025 listing policy started a lawsuit before it changed the policy in March 2026. Rightmove charged £1,621 per advertiser a month on average in 2025 and publishes a feed contract with an idempotency key and snapshot reconciliation for lost deletes; REA sells vendor-paid depth per listing; Zillow charges per lead, with attribution over up to two years; Zillow's living database, REA's 5.2 million owner-tracked properties and Idealista's 2021 duplicate-control tool, which clusters listings of one home rather than deleting them, are all property-first assets. REA's engineering and nearly everything technical about Idealista are not public.\n\n**Supporting claims**\n\n- **S1** — Zillow moved the Zestimate from informing homeowners to opening a purchase of their homes in February 2021 and was winding Zillow Offers down by November 2021, in its own words unable to forecast future home prices, with no validation for the new use visible in the public record; so a model is governed by the decision it drives, and a change of tier is a governance event.\n- **S2** — A property portal's supply is licensed from MLSs and agents who also feed rival portals (Zillow's MLS dependence and training-use risk factor, its 2025 listing-access dispute, NAR's visibility options, Rightmove's published feed contract), so license, embargo, attribution and training terms must travel with every listing as data and controls.\n- **S3** — A home is listed, sold, let and valued many times, so the property, not the listing, is the durable entity that valuations, price history, owner tracking and duplicate clusters hang off, as Zillow's living database, REA's owner-tracked properties and Idealista's duplicate clusters show.\n- **S4** — What a portal charges for (Rightmove per advertiser, REA per listing through vendor-paid depth, Zillow per lead, Homes.com's listing-agent leads) decides the core of its monetization architecture (contracts and quotas, per-listing orders, or lead routing with attribution), and new channels such as AI assistants are measured as lead channels within that core.\n- **S5** — The public evidence is uneven, detailed for Zillow and Rightmove, financial only for REA and almost absent for Idealista, so every company fact is dated and sourced, every inference about internals is labeled, and the case states where the record stops instead of filling the gap.\n\n## Role in the part\n\nShows the vertical lessons of real estate in the public record: model governance by decision tier, licensed supply carried as data, and the unit of charge shaping the monetization core. Supports P9-4, P9-5 of part `part-9`.\n\n## Flow\n\n**Pattern:** `grouping` (also `order_of_importance` in zillow to idealista: the four portals in descending depth of public evidence, then costar as a counterpoint; `problem_solution` in chief-architect to verticals: rules from the record, their test against the book and Veldmark, questions for the reader's portal, then the same concerns in other verticals, which leads into the automotive hand-off)\n\nThe reading rules and the timeline come first because every later sentence is a dated fact, a reading or an inference. The economic engines come before the company sections because the unit of charge is the lens each company section uses, and the engines section ends on Zillow buying the house, which the Zillow section opens. The companies are grouped one per section in descending depth of evidence (Zillow, Rightmove, REA, Idealista), so the reader meets the fullest record first and watches the evidence thin to nothing, which is the limit the case reports; CoStar follows as a counterpoint because its lead model contrasts with Zillow's, already explained. The cross-case views (a labeled reference architecture, trade-offs, failure modes) come only after all companies because each uses facts from several, and the evidence limits close that group so the rules that follow do not outrun them. The author's rules, the comparison and the questions come next because they apply what the record has shown. The vertical comparison comes last, after the questions about one vertical, because it looks outward and its commit-tier row and pointer lead into the hand-off to case-automotive; between trade-offs and failure modes it interrupted the synthesis (both draft-check readers, rounds 1 and 2). A company section after the cross-case views would supply evidence after the synthesis that uses it.\n\n## Introduction\n\n**Hook** (`direct_statement`): Property portals look like simple listing businesses: agents pay to advertise homes, buyers and renters search for free, and the leader in each country takes most of the profit. Underneath, they carry three traits: the listing usually comes from an external system of record, the property outlives every listing of it, and the portal's data tempts it up the value chain, in Zillow's case into buying homes.\n\n**Bridge:** AVIV's case asked, from the outside, how much of a property portal a group can share across countries. → The question underneath it is what licensed supply, durable properties and valuation models demand of one portal, read through the portals that publish the most about their economics and engineering.\n\n**Thesis statement** (KEY POINTS callout (all three bullets), the excerpt, and paragraphs p01-p02.): What a portal's models may decide, where its supply comes from, what its durable entity is and what it charges for shape its architecture more than its technology stack does; the evidence stops at REA's engineering and almost everything technical about Idealista.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p02, which names the four questions asked of each portal, the unevenness of the evidence and the route through the chapter.):\n\n- Set the reading rules for fact, reading and inference, and give the dated timeline. *Kept in:* how-to-read, timeline.\n- Compare what each portal charges for. *Kept in:* engines.\n- Read Zillow, Rightmove, REA and Idealista in turn, with depth following the evidence, and CoStar as a counterpoint. *Kept in:* zillow, rightmove, rea, idealista, costar.\n- Look across the cases: a labeled reference architecture, trade-offs, failure modes and where the evidence stops. *Kept in:* reference-architecture, trade-offs, failure-modes, evidence-stops.\n- End with the author's decision rules, a comparison with the book's patterns and with Veldmark's Hearthly, questions to ask, and real estate set against other verticals. *Kept in:* chief-architect, comparison, questions, verticals.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | claim | Property portals carry three traits the rest of the book treats as hard cases (supply from an external system of record, the property as a durable entity, and data good enough to tempt the portal up the value chain), so this case asks, beneath AVIV's question, what they demand of one portal and tests the decision tiers, the property model and the feed contracts against the record. | reasoning: The MLS in the US and agency CRMs elsewhere as systems of record; a property listed, sold, let and valued many times; valuation, mortgages, agent software and, at Zillow, buying homes. |  |\n| p02 | transition | The case reads four portals by what each charges for, where its supply comes from, what its models may decide and what it has published about its systems, and because the evidence is uneven (Zillow and Rightmove detailed, REA financial only, Idealista very little), the depth of each section follows the evidence, along a route that names every section: the reading rules and a dated timeline, what each portal charges for, Zillow, Rightmove, REA and Idealista in that order with CoStar as a counterpoint, the cross-case views (reference architecture, trade-offs, failure modes, evidence limits), and the author's rules, the Veldmark comparison, questions to ask and the comparison with other verticals. |  | `elaboration`: The three properties and the question beneath AVIV's. → The four questions asked of each portal, the unevenness of the evidence and the route. |\n\n## Sections\n\n### How to Read This Case\n\n**Controlling idea** (`context`, id `how-to-read`): Every statement in the case is a dated fact, the author's reading or a labeled inference, and the reader must know which, how old the engineering evidence is, and that Veldmark appears only in the final comparison.\n\n**Advances the thesis** (S5): Sets the labeling rules and the age and volatility of the evidence before any fact is used.\n\n**Transition in:** `sequence`: The four questions and the uneven evidence. → The rules for reading that evidence.\n\n**Order of paragraphs** (`large_to_small`): The three labels first because every later sentence carries one; then the two cautions about the evidence they label; then the one place fiction enters, so the reader knows the fictional comparison is set apart. The cautions before the labels would qualify evidence the reader has no rules for yet.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p03 | definition | Part IX cases follow stricter rules than earlier chapters: a documented fact carries its source and publication year in the sentence, the author's interpretation is marked 'my reading' or sits in the Chief Architect's view, and a reference-architecture inference sits in a callout labeled INFERENCE, NOT DOCUMENTED. |  |  |\n| p04 | context | Two cautions apply throughout: the engineering material is old or vendor-written and may describe replaced systems, and several facts (litigation on`, id `engines`): The four portals charge for different units (Rightmove per advertiser, REA per listing, Zillow per lead, Homes.com for listing-agent leads), each unit needs a different monetization core, and in the author's reading the unit also explains each portal's appetite for valuation.\n\n**Advances the thesis** (S4): Establishes the unit of charge as the lens the company sections use.\n\n**Transition in:** `elaboration`: The dated events. → What each portal charges for, the first of the four questions.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The comparison table first so the reader sees the denominators side by side; then the published words behind each engine; then the author's reading that connects the engines to valuation, which needs both. The reading before the evidence would be an unsupported claim.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | comparison | The portals (plus CoStar's Homes.com, named as a counterpoint until its own section) report different unit KPIs, and the choice of denominator reveals the business model, though the figures cannot be compared across rows because currencies, periods and definitions differ. | table: Rightmove ARPA £1,621 a month (2025); REA Buy yield +13% on flat listings (year to June 2026); Zillow residential revenue per visit $0.178 (2025); Idealista not disclosed; Homes.com with no KPI, listing-agent advertising on a 'your-listing your lead basis'; with what the architecture must hold for each. |  |\n| p08 | evidence | In their own published words, Rightmove's engine is a subscription with a commitment plus overage, REA's is per-listing depth paid largely by vendors, and Zillow's is lead generation by share of voice or a fee at closing within about two years. | quotation: Rightmove: 'more than 50% of independent agents purchased incremental product above their package commitment', 62% of agency ARPA growth from product. REA: Buy yield rose on 'a 7% average Premiere+ price rise, growth in add-on products, higher subscription revenues and increased depth penetration'; Campaign Agent provides 'vendor paid advertising finance solutions'. Zillow: connections 'in proportion to their share of voice'; Zillow Preferred agents pay 'when a real estate transaction is closed with one of the leads, generally within two years', accounted for as variable consideration.; figure: Figure 2: the unit a portal charges for determines the core of its monetization architecture. | `elaboration`: The denominators in the table. → The published words behind each engine. |\n| p09 | analysis | In the author's reading, the engines also explain each portal's appetite for valuation: Rightmove and REA sell seller leads and report them growing, valuation in property is a supply-acquisition product that reaches the homeowner when a listing is born, and Zillow took the insight one step further and bought the house. | statistic: Rightmove's AI-enabled Online Agent Valuation supported 'c.50% total increase in unique valuation leads to estate agents' in H1 2026; REA reported a 22% increase in seller leads for fiscal 2026. | `cause_effect`: Three engines and their published mechanics. → What the engines imply for valuation, leading into Zillow. |\n\n### Zillow: When the Estimate Started to Commit\n\n**Controlling idea** (`evidence`, id `zillow`): Zillow's record documents an information-tier model promoted to commit capital and wound down within nine months, the lead business and licensed supply that remained, and how little of its current engineering is public.\n\n**Advances the thesis** (S1, S2, S3, S4, S5): The best-documented case: model governance, licensed supply, the property-first entity, the per-lead engine and the limits of engineering evidence.\n\n**Transition in:** `example`: The engines, ending with Zillow buying the house. → Zillow's record in full, starting from the estimate it bought with.\n\n**Order of paragraphs** (`chronological`): The Zestimate as information product (p10-p13) comes before its use as an offer (p14-p15), the wind-down (p16-p17) and the lessons (p18), because each lesson compares the two uses; the post-Offers business (p19) follows in time. Supply terms (p21-p23) and engineering evidence (p24-p25) are grouped after the story because they describe the current business, and the engineering limits come last so the section ends where the record stops. The lessons before the wind-down quotes would rest on nothing.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | evidence | Zillow's Zestimate is a long-running information product whose published accuracy is a 6.9% median off-market error at the 2021 neural launch and, in the 2025 annual report, 1.8% for homes listed for sale and 7.2% for off-market homes, over a living database of about 173 million homes. | statistic: Launched 2006 as a free AVM estimate; June 2021 neural version, 6.9% median error on more than 104 million off-market homes (Online Marketplaces, 2021), replacing roughly 1,000 market-specific algorithms (The Batch, 2021); 2025 10-K: 'our patented proprietary automated valuation model', 1.8% on-market, 7.2% off-market, 'our living database of approximately 173 million U.S. homes'. |  |\n| p11 | analysis | In the author's reading (marked 'my reading'), the on-market figure measures an easier test, because a model that sees the asking price is mostly predicting the gap between asking and selling price, so the off-market figure is closer to the AVM's real performance. |  | `elaboration`: The two published error figures. → Why they measure different things. |\n| p12 | explanation | The rise from 6.9% (2021) to 7.2% (2025) in off-market error should not be read as regression, because the public sources do not say whether methodology, market volatility or the measured population changed. |  | `contrast`: The off-market figure as the better measure. → A caution against reading the two off-market figures as a trend. |\n| p13 | analysis | The living database shows a property-first data model, in which the home is the durable entity and listings are events on it. | fact: User-generated updates to tens of millions of property records in the living database. | `additional_support`: The 10-K's living database of about 173 million homes, named two paragraphs earlier and re-anchored by name and size. → What the database itself shows about the data model. |\n| p14 | evidence | On 25 February 2021 the Zestimate became an initial cash offer for eligible homes in 23 Zillow Offers markets, with an inspection and adjusted final offer after acceptance and an accuracy claim measured on homeowners who declined. | quotation: CNN: the Zestimate 'will now represent an initial cash offer from the company to buy the property', 'in 23 markets to start'; 'a Zillow employee inspects the home, provides a list of needed repairs and an adjusted final offer'; COO: the gap for declining homeowners was 'typically less than 1%'. Zillow Offers had launched in 2018. | `time`: The Zestimate as an information product. → Its February 2021 use as an opening offer. |\n| p15 | analysis | That announcement is the documented moment an inform-tier model became the opening price of a commit-tier decision, so the same model drove both the consumer estimate and the offer, and the accuracy figure that accompanied it said nothing about the homes Zillow bought. | figure: Figure 3: the same estimate on a sign and on a purchase contract. | `cause_effect`: The launch and its accuracy claim. → What the launch changed, in the terms of ml-platform's decision tiers. |\n| p16 | evidence | On 2 November 2021 Zillow's board decided to wind down Zillow Offers, citing pricing unpredictability and capacity, with a $304.4 million third-quarter write-down, further expected charges and a workforce reduction of about 25%. | quotation: 'the Board of Directors of Zillow Group made the determination to wind down Zillow Offers operations', citing 'home pricing unpredictability, capacity constraints and other operational challenges'; '$304.4 million' write-down; 'approximately $240 million to $265 million' expected in Q4 plus $175-230 million of other charges; about 25% workforce reduction; inventory sales through 2022. | `time`: The February 2021 offer. → The November 2021 wind-down. |\n| p17 | evidence (list) | The shareholder letter published the same day is unusually direct about the causes and about what Zillow kept: forecasting future prices, risk and volatility, capacity planning, low conversion of sellers and the size of the inventory, with the Zestimate kept as foundational to the top of the funnel. | quotation: 'We have been unable to accurately forecast future home prices at different times in both directions'; unit economics 'swinging approximately 1,200 basis points from Q2'; 'too risky, too volatile...'; 'significant capacity and demand planning challenges'; 'convert only about 10% of the serious sellers'; '9,790 homes in inventory and 8,172 homes under contract'; the Zestimate as foundational to the top-of-funnel strategy. | `elaboration`: The 8-K's decision and charges. → The letter's explanation of the causes. |\n| p18 | analysis (list) | In the author's reading the record supports five lessons: the binding problem was the forward forecast, error turns asymmetric under selection, operational capacity couples to model error, accuracy was reported on the wrong population, and exposure grew faster than evidence; a reference validation regime, labeled as inference, follows from them. | reasoning: Five numbered lessons tied to the letter's words ('future home prices', the 10% conversion, 'capacity and demand planning challenges', 'typically less than 1%' on declined offers, almost 18,000 homes in inventory or under contract).; figure: Figure 4: why a commit-tier use needs its own validation.; reasoning: INFERENCE, NOT DOCUMENTED callout: a five-part validation regime (resale back-tests, error on the accepted population, capital limits, capacity as a pricing input, an owner outside the model team), with credit risk as the closer analogy. | `cause_effect`: Zillow's own statements of cause. → The lessons the author draws from them. |\n| p19 | evidence | After Offers Zillow kept the Zestimate and the top of the seller funnel and rebuilt around agent leads, Enhanced Markets and owned agent tools, and a pay-at-close model implies an attribution pipeline that, in a labeled inference, owning the agent's CRM shortens. | fact: Residential revenue 66% of total; Premier Agent pricing models; Zillow Preferred as 'the next chapter for our Flex program'; Enhanced Markets; Follow Up Boss, dotloop, ShowingTime and Zillow Showcase.; reasoning: INFERENCE, NOT DOCUMENTED callout: stable lead identity, deduplication, assignment, CRM synchronization, matching to transactions for up to two years, and revenue estimates trued up on outcomes. | `time`: The wind-down and its lessons. → What Zillow kept and rebuilt afterwards. |\n| p21 | evidence | Zillow's supply is licensed through brokerages, aggregators and MLSs whose rules it must follow, and its risk factors warn that licenses may restrict 'the training of models', so a listing license now governs machine learning, not only display. | quotation: Listings through 'relationships with real estate brokerages, real estate listing aggregators, MLSs'; data uses that could be limited 'including the training of models, generation of predictive or derivative outputs'. | `contrast`: Zillow's lead flow and its agent tools. → The supply those leads depend on, which Zillow does not own. |\n| p22 | evidence | The 2025-2026 listing-access dispute shows the same dependence from the other side: Zillow's Listing Access Standards drew a Compass lawsuit, a denied preliminary injunction, a March 2026 policy change and Compass's dismissal, while government and competitor complaints remain listed. | fact: Standards excluding homes 'marketed publicly for more than 24 hours' before MLS submission; Compass sued June 2025; injunction denied 6 February 2026 (procedural, not on the merits); 19 March 2026 change and dismissal without prejudice the next day; 10-K names the FTC, state attorneys general, Compass and CoStar. | `similarity`: Zillow's dependence on licensed supply. → The same dependence seen in a dispute over access. |\n| p23 | analysis | Industry rules add terms of their own: one listing record can carry an MLS embargo, a brokerage's marketing plan and a portal's access rule at once, which ingestion must carry as data, and NAR's 2024 settlement adds a buyer-side term, a written agreement before touring, to any portal's tour-request flow. | fact: NAR's 'Multiple Listing Options for Sellers', effective 25 March 2025: 'office exclusive' and 'delayed marketing' listings with IDX and syndication held back.; fact: Since the 2024 NAR settlement, buyers must sign a written agreement before touring with an agent, an agreement step in any portal's tour-request flow.; figure: Figure 5: a listing card carrying tags for display, delay, training and marketing plan. | `additional_support`: Zillow's own access rule. → Industry rules that add further terms, on the listing side (visibility) and the buyer side (the tour agreement). |\n| p24 | evidence | The Zillow engineering posts the author could read date from 2020-2021 and document guided search, Kafka adoption and floor-plan ML serving, each tied to an earlier chapter's pattern, but may describe replaced systems. | table: Guided Search (September 2020, nearly 50 filters, 200+ attributes, 33% lift); How to Pitch Kafka (August 2020, Terraform-provisioned topics with ownership, schema and privacy metadata); floor-plan ML serving (November 2020, Step Functions and SageMaker batch jobs). | `contrast`: Zillow's documented supply and visibility terms. → What Zillow has published about its engineering. |\n| p25 | evidence | Zillow's search engine, its natural-language search architecture and the neural Zestimate's serving design are not public in any source the author could retrieve. | source: Natural-language search launched 2023 and extended in September 2024 to commute, affordability and schools. | `contrast`: The three documented posts. → What remains unpublished. |\n\n### Rightmove: A Subscription Machine with a Published Feed Contract\n\n**Controlling idea** (`evidence`, id `rightmove`): Rightmove documents a per-advertiser subscription engine, the most detailed public feed contract of any portal, a five-year cloud migration and an AI product turn, with vendor material for search and a collective claim whose theory is not public.\n\n**Advances the thesis** (S2, S4, S5): Documents the subscription engine, the published supply contract and the limits of the engineering evidence.\n\n**Transition in:** `contrast`: Zillow's per-lead engine and the limits of its engineering record. → A per-advertiser engine that publishes its feed contract.\n\n**Order of paragraphs** (`grouping`): Economics first, because the subscription engine is what the section's title names and what the feed's paid products serve; then supply (the feed contract and the author's reading of it), then the systems that serve listings (search, geography, the cloud platform), then the AI products built on that platform, and last the legal risk, which is volatile and outside the architecture. The feed reading before the economics would explain an entitlement the reader cannot place.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p26 | evidence | Rightmove is the best-documented portal economically, a subscription business with a 70% underlying margin, over 90% agency retention and mostly direct traffic, and in the author's reading direct traffic is the margin. | statistic: 2025: revenue £425.1 million, 70% underlying operating margin, ARPA £1,621 a month across 19,272 advertisers, retention above 90%, Optimiser Edge 35% penetration among independents. H1 2026: '90% Comscore; 75% SimilarWeb/Sensor Tower' share of time, 'over 85% of traffic direct and organic', revenue £225.8 million (+7%), ARPA £1,726. |  |\n| p27 | evidence | Rightmove's Real Time Datafeed specification is the most detailed public ingestion contract in the book's research, and it also carries paid products through the feed. | source: RTDF v1.4.1 (last updated November 2023): network and branch IDs with sales and lettings channels, client certificates, the agent's Agent_Ref as key, media by URL with change detection, GetBranchPropertyList snapshot for properties 'still live on Rightmove which should have been removed', regulatory fields added in 2022 and 2023, AddPremiumListing and AddFeaturedProperty. | `sequence`: Rightmove's economics. → The contract its agents' software writes listings through. |\n| p28 | analysis | In the author's reading, when upsells travel through the same feed as listings an agent's software can buy visibility without anyone opening the portal, so the ingestion path, not a checkout, must apply the entitlement. | figure: Figure 6: listings and premium tokens in one feed, with an unused checkout. | `cause_effect`: Paid products in the feed. → What that means for where entitlements are applied. |\n| p29 | evidence | A 2025 Elastic vendor story documents Rightmove's 2014 move to Elasticsearch, with map-centric results and percolator-based instant alerts, which is the building block saved-searches-and-alerts generalizes. | quotation: 'rich, map-centric results' and 'instant property alerts, made possible by Elasticsearch's percolators'; vector search for suggestions; plans to derive attributes from photos. | `sequence`: The feed that brings listings in. → The search and alerts that serve them. |\n| p30 | example | A TravelTime vendor case study shows the routing vendor's pricing model, a fixed annual license with unlimited requests, becoming a design constraint for Rightmove's travel-time feature. | fact: 'My Places' travel-time feature on TravelTime's API, chosen partly for a fixed annual license with unlimited requests. | `additional_support`: Search and alerts on Elasticsearch. → A geographic feature built on a vendor's API. |\n| p31 | evidence | Rightmove's move to Google Cloud ran from the December 2021 announcement to '100% of applications are in the cloud' on 31 July 2026, ending with more than 5 PB on a unified data platform. | quotation: Dec 2021: 'a number of its systems' from multi-data-center to Google Cloud, starting with GKE; 180 million visits a month; busiest minute '8:48 pm on Wednesday'. Feb 2026: '4 petabytes', 'c.200 proprietary models', more than 6,000 releases in 2025. 31 Jul 2026: '100% of applications are in the cloud ... >5 petabytes ... 99.99% uptime'; headcount +37 to 935. | `sequence`: Search and geographic features. → The platform underneath them and its migration. |\n| p32 | analysis | In the author's reading the migration took about five years from announcement to completion and finished with the data platform, not with compute, while its sequence, data-center closure and cost are not public. |  | `cause_effect`: The migration's dated milestones. → What they do and do not show. |\n| p33 | evidence | Rightmove's 2026 disclosures put AI at the center of its product story, but engagement figures from self-selected early users are not causal estimates. | quotation: 'Ask Rightmove'; AI Search Assistant 'c.40% uplift in average time on site, and roughly double the propensity to send leads'; 46 strategic AI initiatives (31 in December 2025); 'fully AI-enabled' platform; a planned app in ChatGPT; 2026 margin guided to 67% 'reflecting this period of investment'. | `sequence`: The completed cloud platform. → The AI products Rightmove builds on it. |\n| p34 | evidence | A collective claim of up to £1.56 billion against Rightmove was filed in April 2026, with certification scheduled for November 2026, and the fetched text does not identify the class or its theory. | quotation: 'seeks damages of up to £1.56 billion'; Rightmove considers it 'without merit'. | `contrast`: AI as the growth story. → A legal risk in the same results. |\n\n### REA Group: Selling Depth per Listing\n\n**Controlling idea** (`evidence`, id `rea`): REA documents a per-listing depth model in rich financial disclosures, and almost nothing current about its engineering.\n\n**Advances the thesis** (S3, S4, S5): The clean per-listing case, the owner-tracked property asset and a thin engineering record.\n\n**Transition in:** `contrast`: Rightmove's per-advertiser subscription. → A portal that charges per listing.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The FY26 facts first, then the author's reading of them as a depth model, then the engineering gap, so the section moves from what is documented to where it stops, as the case's evidence does. The gap before the facts would leave the reader no measure of what is missing; the reading before the facts would be unsupported.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p35 | evidence (list) | REA's fiscal 2026 release documents a property group whose residential revenue grew 12% with flat listings, with large audiences, owner-tracked properties, growing seller leads and AI products. | statistic: Portfolio: realestate.com.au, realcommercial.com.au, property.com.au, PropTrack, Mortgage Choice, Campaign Agent, Realtair, 20% of Move. Revenue A$1,793 million (+7%), 66% margin; residential A$1,290 million (+12%), Buy yield +13% on flat listings; FY27 'low double-digit' yield growth on 'an 8% Premiere+ price rise'; 12.7 million monthly visitors, 146.4 million visits; 5.2 million 'unique properties tracked by their owner'; seller leads +22%; AI Assistant, Campaign Assist, Planitar. |  |\n| p36 | analysis | In the author's reading REA is the cleanest documented per-listing depth model, so its architecture must treat the depth tier as a per-listing order that can be upgraded, vendor-financed and attributed, and its owner-tracked properties are the same property-first asset as Zillow's living database. |  | `cause_effect`: Revenue up 12% on flat listings. → Why that implies per-listing orders in the architecture. |\n| p37 | evidence | REA's engineering evidence is thin and dated, a 2015-era Elasticsearch migration and an unread 2022 event listing, and the author will not pad it. | source: rea-group.com refused automated fetches; undated Elastic event page (2015 Elastic{ON} Tour Sydney by URL): 'has been slowly migrating its search function to Elasticsearch', 'thousands of simultaneous updates', more than 100 queries per second; Elastic Community 2022 event on percolation against millions of saved searches (redirected, not read). | `contrast`: Rich financial and product disclosure. → The absence of current engineering evidence. |\n\n### Idealista: What Little Is Public\n\n**Controlling idea** (`evidence`, id `idealista`): Idealista's public record is an ownership deal and one product fact about duplicates, and nothing technical, so the case makes no statement about its systems.\n\n**Advances the thesis** (S3, S5): The duplicate-clustering fact and the explicit end of the evidence.\n\n**Transition in:** `sequence`: REA's thin engineering record. → The portal with the least public evidence.\n\n**Order of paragraphs** (`order_of_importance`): Ownership first because it is what is best reported, then the one product fact, then the explicit statement that the evidence ends, which closes the run of company sections in descending order of evidence. The end-of-evidence statement placed earlier would leave the duplicate fact looking like an afterthought rather than the one documented exception.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p38 | evidence | Idealista's best-reported fact is Cinven's June 2024 purchase of 70%, at a valuation reports state differently, while no revenue, margin or audience figures are public. | fact: Leading portal in Spain and Portugal, challenger in Italy (trade press); 28 June 2024 deal reported at €2.9 billion, Online Marketplaces reporting a little over €3 billion and Bloomberg €2.9 billion; more than double EQT's €1.3 billion in September 2020; EQT kept 18%; Jesús Encinar continued to lead. |  |\n| p39 | evidence | Idealista's April 2021 duplicate-control feature groups ads for the same property across agencies and portals, treating legitimate duplicates as a cluster to present rather than abuse to remove. | quotation: Groups ads 'listed by multiple agencies or individuals on idealista and other portals'; notifies agents of price changes, removals and new duplicates; 'updated daily'; agents see duplicates only of their own properties. Also a Search API for approved partners. | `contrast`: Ownership facts with no financials. → The one useful product fact. |\n| p40 | claim | That is where Idealista's evidence ends: no engineering blog, talk or filing describes its search, ingestion, data platform or ranking, so any statement about how it builds its systems would be invention. |  | `conclusion_summary`: The deal and the duplicate tool. → The explicit end of the evidence. |\n\n### CoStar: A Curated-Data Counterpoint\n\n**Controlling idea** (`comparison`, id `costar`): CoStar reached property marketplaces from curated commercial data, and its Homes.com competes on whom the lead belongs to, which shows up in the architecture as a lead-routing rule aimed at the agents who control supply.\n\n**Advances the thesis** (S2, S4): Contrasts lead ownership with Zillow's and ties it to agents' control of supply.\n\n**Transition in:** `contrast`: Four portals read in descending order of evidence. → A company that reached the market from the other direction.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p41 | evidence | CoStar gathers data by research and field teams and runs Homes.com on a listing-agent lead model, completing Matterport and Domain in 2025 and calling itself 'the agent's ally'. | quotation: Researchers by phone, e-mail, field inspection, public records and news; field teams with Matterport tours; direct feeds; Homes.com on a 'your-listing your lead basis', powered by 'Homes AI'; Matterport completed 28 February 2025, Domain 27 August 2025; Andy Florance: 'We are the agent's ally, and we will never operate at their expense'. |  |\n| p42 | analysis | In the author's reading CoStar is a curated data business with a marketplace on top, and the difference from Zillow over whom the lead belongs to is commercial but appears in the architecture as a lead-routing rule aimed at the agents who control supply. |  | `cause_effect`: CoStar's data collection and lead model. → What the lead model means architecturally, against Zillow's. |\n\n### A Reference Architecture for a Property Portal\n\n**Controlling idea** (`synthesis`, id `reference-architecture`): Since no company has published a whole-system view, a labeled inference connects the documented pieces into five load-bearing parts: licensed-supply ingestion, a property registry, valuation models registered by decision tier, a monetization core shaped by the unit of charge, and agent workflow surfaces.\n\n**Advances the thesis** (S1, S2, S3, S4): Assembles the case's lessons into one labeled design.\n\n**Transition in:** `conclusion_summary`: The five company sections and their documented pieces. → A synthesis across them, labeled as inference.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p43 | transition | None of the companies has published a whole-system view, so the synthesis connecting the documented pieces is labeled as inference. | reasoning: INFERENCE, NOT DOCUMENTED callout: five parts (licensed-supply ingestion with license, embargo and attribution metadata and snapshot reconciliation; a property registry with listings, sales, rentals and valuations as events; valuation models registered by decision tier; a monetization core by unit of charge; agent workflow surfaces feeding outcomes back).; figure: Figure 7: a reference architecture inferred from the public record. |  |\n\n### Trade-offs the Cases Illustrate\n\n**Controlling idea** (`comparison`, id `trade-offs`): The cases set four choices side by side (unit of charge, use of valuation, supply posture, lead ownership), and because Rightmove and REA report the two highest margins with almost opposite pricing units, the rows are not a scorecard: the architecture follows the unit of charge and the profit follows the audience position. Audience position is glossed in the prose as how large and how direct a portal's audience is, with Rightmove's direct traffic and REA's lead over its nearest competitor from earlier sections.\n\n**Advances the thesis** (S4, S1, S2): States when each option is right and warns against reading the table as a ranking.\n\n**Transition in:** `elaboration`: The reference architecture's five parts. → The choices a portal makes within them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p44 | analysis | The reference architecture leaves four choices and the table shows both sides of each, read with one warning: Rightmove and REA, with almost opposite pricing units, report the two highest margins in the case, so the rows are not a scorecard; the architecture follows the unit of charge and the profit follows the audience position (how large and how direct a portal's audience is). Stated in short separate sentences; the unit-of-charge row marks its three metrics as not comparable. | table: Four rows: unit of charge, use of valuation, supply posture and lead ownership, each with options A and B, what the record shows and when A is right. |  |\n\n### Failure Modes the Record Exposes\n\n**Controlling idea** (`analysis`, id `failure-modes`): The record exposes five failure modes for any marketplace: changing a model's decision tier by product launch, treating a forecasting product as an estimating one, monitoring the model but not the operations it drives, treating supply as owned, and reporting engagement as impact.\n\n**Advances the thesis** (S1, S2, S4): Names the failures each lesson guards against.\n\n**Transition in:** `contrast`: Trade-offs that say what to choose. → Five failure modes that say what to avoid.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p45 | analysis (list) | Where the trade-offs say what to choose, five failure modes say what to avoid in any marketplace, each stated in general terms: a tier change by product launch, a forecasting product treated as an estimating one, a model monitored without the operations it drives (these three generalize the Zillow lessons, so each cites its Zillow evidence only in brief, in a parenthesis that points back to the lesson), supply treated as owned, and early engagement figures reported as impact (pointing back to the Rightmove section). | reasoning: February 2021 offer and the declined-offer accuracy claim; the letter's 'future home prices' and 'capacity and demand planning challenges'; license changes, access-rule litigation and agents redirecting stock; Rightmove's 'roughly double the propensity to send leads'. |  |\n\n### Where the Public Evidence Stops\n\n**Controlling idea** (`evidence`, id `evidence-stops`): For each case, the record answers some architecture questions and leaves others open, and several facts remain open as of October 2026.\n\n**Advances the thesis** (S5): Lists the unanswered questions instead of filling them.\n\n**Transition in:** `contrast`: Failure modes resting on what the record shows. → What the record does not show, case by case.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p46 | evidence | The table collects, case by case, what the record does not show, gathering the limits each section stated (for most portals the economics are public and the systems are not); beyond the limits already stated section by section (Zillow Offers pricing, the Zestimate's serving, pay-at-close attribution, Rightmove's migration and search, REA's and Idealista's systems), the class and theory of the Rightmove collective claim, the remaining government complaints against Zillow and CoStar's plans for Domain's platform are also open as of October 2026. | table: Seven questions with what is public and what is not: Zillow Offers pricing and limits, the neural Zestimate today, pay-at-close attribution, Rightmove's migration sequence, Rightmove search today, REA's platform, Idealista's systems. |  |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `chief-architect`): The cases yield five decision rules (govern models by decision, treat supply terms as architecture, design for the unit of charge, make the property the durable entity, measure AI assistants as a lead channel) and a short list of group-level indicators.\n\n**Advances the thesis** (S1, S2, S3, S4): States the author's rules, labeled as judgement.\n\n**Transition in:** `problem_solution`: What the record shows and where it stops. → The author's rules for acting on it.\n\n**Order of paragraphs** (`order_of_importance`): The model-governance rule first because Zillow Offers is the case's costliest documented failure; supply terms next because they constrain everything downstream including training; the monetization core and the durable entity follow; the AI channel last as the newest; the indicators close the section because they watch all five rules. Supply terms after the monetization rule would hide that training eligibility is a supply term before it is a product decision; indicators h. |  |\n| p54 | comparison | Hearthly's 2027 decisions (declining Hearthly Direct, reporting Valuo's errors separately, the commission-share pilot, agency subscriptions, Keybridge neutrality, Supply Contract v1 and property clustering) each have a parallel in the record that confirms or conditions them. | scenario: Hearthly Direct at 94% of the Valuo estimate, declined; Valuo 7.4% off-market and 2.3% on-market (October 2027), trained on DVF prices; commission-share pilot in the Lyon metropolitan area in 2028 with consent; agency subscriptions €270 million (2026), ARPA about €616; Keybridge neutrality; Supply Contract v1 (September 2027) and the Lyon apartment's three agency listings clustered. The Lyon apartment is glossed at the table as the book's example flat in Lyon 7e, described below. | `example`: The book's patterns as the record tests them. → Veldmark's Hearthly decisions against the same record. |\n| p55 | example | The Lyon apartment shows the difference between the tiers in one listing: its Valuo interval supports an 'in line' badge, but as a commit-tier output it would have to answer questions about holding-period price, error on accepting owners and capital exposure that a present-value back-test does not. | scenario: 68 m² T3 in Lyon 7e listed at €389,000; Valuo 80% interval €372,000-€401,000; 94% of midpoint about €363,000; Valuo's €40 million data and lead revenue; Ingrid Halvorsen declined Hearthly Direct (ml-platform). | `example`: Hearthly's decisions in a table. → One listing that shows the tier difference. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Eight questions let a reader test their own portal against the case: commit-tier models, tier changes, error reporting, license terms, supply share, the unit of charge, delete reconciliation and AI-channel measurement.\n\n**Advances the thesis** (S1, S2, S4): Turns the case into questions for the reader's own portal.\n\n**Transition in:** `problem_solution`: ture must carry explicitly: license terms on the listing, the property as the durable entity, and the decision tier on the model. The unit of charge then decides which core carries the money.\n\n**So what:** A Chief Architect reviewing a property portal looks first at its contracts, its entity model and its model register, not its stack, because those are where the documented successes and the costliest documented failure sit.\n\n**Callback:** The introduction's three traits of property portals (external system of record, durable property, data that tempts the portal up the value chain). The reader can now say what each property demands of the architecture and which company's record shows it.\n\n**Takeaway** (`course_of_action`): Ask of any portal proposal what the model will decide, whose terms the supply carries, what entity the data hangs off and what the portal charges for; then read case-automotive for the same questions where supply is written by dealer software.\n\n**Hand-off** to [mobile.de, Auto Trader and AutoScout24: Lessons from Automotive Marketplaces](case-automotive.html): `similarity`: The property portals' closing: a listing business sitting on valuable data and a professional supply base it does not control. → The same questions in a vertical where the durable entity is the vehicle, the professional is a dealer and supply is written by dealer software, not licensed from agents.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p58 | synthesis | In the author's reading the three traits the case opened with are three ways a portal depends on what it does not control (agents' supply, a home that outlives its listings, and data that tempts the portal into decisions that depend on a future price), and each becomes something the architecture must carry explicitly: license terms on the listing, the property as the durable entity and the decision tier on the model, with the unit of charge deciding the monetization core. |  |  |\n| p59 | transition | Property portals show a listing business sitting on valuable data and a professional supply base it does not control, and case-automotive follows the same questions into a vertical where the durable entity is the vehicle, the professional is a dealer and supply is written by dealer software rather than licensed from agents. |  | `similarity`: Dependence on what the portal does not control. → The same questions in automotive. |\n\n## Non-goals\n\n- A company profile or an investment view; no verdict on the pending litigation.\n- Re-teaching the feed contract. See [Many Doors In: Forms, APIs and Bulk Feeds](listing-ingestion.html).\n- Re-teaching entity resolution. See [One Property, Three Listings: Duplicates and Entity Resolution](entity-resolution.html).\n- Re-teaching decision tiers. See [Models in Production: ML Platforms and Use Cases](ml-platform.html).\n- Re-teaching monetization mechanics. See [How Listing Marketplaces Make Money](monetization-models.html), [Packages, Bumps and Quotas: Products, Pricing and Entitlements](products-and-entitlements.html).\n- AVIV Group. See [AVIV Group: Building a European Real-Estate Platform from Acquisitions](case-aviv.html).\n- Automotive portals. See [mobile.de, Auto Trader and AutoScout24: Lessons from Automotive Marketplaces](case-automotive.html).\n- REA's or Idealista's current systems, for which no public evidence was found.\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- REA's engineering blog (rea-group.com) refused automated fetches; a reviewer with a browser should check for current architecture posts. (Carried over from spec.md.)\n- Idealista's revenue, margin and closing date of the 2024 Cinven deal are not confirmed from a primary source. (Carried over from spec.md.)\n- The class and theory of the Rightmove collective claim (certification hearing November 2026). (Carried over from spec.md.)\n- Whether Zillow ever published the pricing and exposure contr
