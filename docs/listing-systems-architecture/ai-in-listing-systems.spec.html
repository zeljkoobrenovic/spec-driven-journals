<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, acceptance criteria AC-1 to AC-3, the thesis and the role are copied unchanged from the ai-in-listing-systems entry in journal-spec.json; the supporting claims, audience and AC-4 and AC-5 are this spec's own. Units added by this conversion: introduction roadmap p04; lead sentences that give the autonomy ladder (p08), the hosting table (p15), the five steps (p19), the evaluation table (p40), the trade-offs table (p46/p47) and the vertical table (p48/p49) their own units; the conclusion widened to two paragraphs (p59, p60).\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Where generative AI and agents have shipped at marketplaces from 2023 to 2026 across the listing lifecycle (creation, search, moderation, pro tooling, valuation), and the autonomy ladder.\n- **Know:** The control layer between models and listings (constrained generation, validation, provenance, trust checks before generation, the AI gateway and evaluation harness), conversational search as a query compiler, search as an API product for external agents, AI crawlers and data licensing, cost per outcome, evaluation, and the EU AI Act's dated obligations.\n- **Believe:** A model's output is a proposal to be validated, never listing data.\n- **Believe:** The structured assets (taxonomy, attribute dictionary, search schema, trust rules) become more valuable when AI arrives, not less.\n- **Be able to:** Review an AI proposal by asking what structured thing the model produces and what checks it.\n- **Be able to:** Design an assisted insertion flow in which the platform validates every suggestion and records its provenance.\n- **Be able to:** Register an AI use with its autonomy level, owner, evaluation set, cost per outcome, AI Act classification and kill switch.\n\n**Audience:** Group and brand Chief Architects, CPOs and CTOs, heads of data and ML, search and trust-and-safety leads deciding on AI features in 2026-2028. They know what LLMs are; they need the marketplace-specific architecture, evidence and governance.\n\n**Already knows:**\n\n- What an API, a database, an event stream, a search engine and Kubernetes are; what large language models are.\n- From earlier chapters: Veldmark (fictional), its brands and cast, Common Ground, Yardstick, the advice forum, Valuo and the Lyon apartment, Dealer Hub, the Keybridge neutrality decision; the taxonomy and bikes split, the attribute dictionary and attribute provenance; decision tiers, the gate tier and the model registry (ml-platform); DSA statements of reasons and the P2B Regulation; the failure patterns named in the chapter.\n\n**Does not yet know:**\n\n- The terms this chapter owns: structured-output compiler, AI listing assistant, agentic search, agent-to-marketplace interface, autonomy level and ladder, AI gateway, AI use register.\n- MCP and its governance, faithfulness as a metric, the text-and-data-mining reservation, AI Act Article 50 and Annex III after the Digital Omnibus.\n- Veldmark's photo-to-listing pilot, its results and the February 2028 channel decision record.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given an AI feature design that writes model output straight into listings, the reader names the controls the architecture lacks. *Probe:* A marketplace launches an assistant that reads a seller's photos and writes the category, attributes, price and description straight into the listing, with the model choosing free-text values. Two weeks later its color filter has over a thousand distinct values, some prices are wrong, and fraud analysts say scam listings now read as well as genuine ones. Using only this chapter: what does the architecture lack, and what do you build? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-4 | Given a request to expose search to an external AI assistant, the reader states what the tools should return and the controls the channel needs. *Probe:* A property portal is asked to let a popular AI assistant search its listings and send buyers' enquiries straight from the assistant. Using only this chapter: what should the portal offer, and on what terms? | `custom` | cold_reader | minor |\n| AC-5 | Given a marketplace's AI uses, the reader says which AI Act obligations apply and from when. *Probe:* A marketplace group runs a conversational search assistant, generates listing descriptions, targets job ads with AI in its jobs section, and is asked to feed its valuation model into a bank's lending decisions. Using only this chapter: which EU AI Act obligations apply to which use, and from when? | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** Where do AI and agents create value in listing marketplaces, and what architecture keeps them controlled?\n\n> **Claim:** AI creates value in listing marketplaces where it translates people's intent into structures the marketplace already has (photos into a category and attributes, a sentence into search filters, a message into a policy label, a lead into a drafted reply). It stays controlled only behind a layer that treats every model output as a proposal: constrained to the taxonomy, the attribute dictionary and the search filter schema, validated and stored with per-field provenance, preceded by trust checks, and never the source of a number a buyer relies on, which comes from a registered predictive model. Search offered to external assistants becomes an API product with contracts, quotas and lead attribution, and every AI use is registered with its autonomy level, owner, evaluation set, cost per outcome, AI Act classification and kill switch.\n\n**Disputed by:** The view that generative models make structured listing data less necessary, so a model can write free-text listings and answer buyers directly; or the practice of letting each team launch AI features from vendor demos, judged by uptake, with governance added after launch.\n\n**So what:** A Chief Architect who accepts this extends the model registry into an AI use register and blocks launches that cannot fill it in; treats the taxonomy, attribute service, search API and trust platform as the AI strategy; runs one AI gateway and evaluation harness for the group while brand teams build the features; puts each brand's channel strategy toward external assistants in a decision record with a review date; enforces data-use rules in pipelines; and approves AI features by cost per outcome.\n\n**How and why:** Veldmark's photo-to-listing pilot (approved 15 November 2027, 5% of Tradeyard Netherlands' private sellers, goods only) was possible only because the group taxonomy and attribute service went live in October and the shared trust-and-safety platform in November. In nine weeks it produced about 154,000 assisted listings: 62% uptake, 92.4% of categories accepted unchanged, 78% of attribute suggestions accepted, unsupported claims in 1.9% of audited descriptions, median insertion time 2 min 50 s against 6 min 40 s, and 9 percentage points more started listings published, at €0.0062 of model cost per listing. Constrained values raised the share of cargo-bike listings recording electric assist from 61% to 88%; an earlier prototype with free-text attributes produced 1,100 distinct colors in two weeks. Fraudsters used the assistant as often as anyone, removing poor text as a scam signal. The search platform's head asked who pays for an external assistant's queries at the Sunday-evening peak of 31,000 queries per second, which is why search offered to assistants needs contracts and quotas.\n\n**Supporting claims**\n\n- **C1** — AI creates value in listing systems where it translates people's intent into structures the marketplace already has, and every documented 2023-2026 implementation keeps the structured system of record and lets the model translate into it.\n- **C2** — Every model output is a proposal: a control layer (gateway, prompt registry, tools, evaluation harness, validators and guardrails) constrains it to the taxonomy, attribute dictionary and filter schema, records per-field provenance, and never lets a model write to a system of record.\n- **C3** — In an assisted insertion flow, trust checks run before generation, the price comes from a registered predictive model and never from the language model, and the seller confirms; constrained values improve the catalog, while fraudsters lose polished text as a signal against them.\n- **C4** — Conversational search compiles a sentence into the existing filter schema, and search offered to external assistants becomes an API product with contracts, quotas, lead attribution and data-use terms, alongside a crawler and licensing policy for the involuntary channel.\n- **C5** — The same propose-and-validate discipline governs moderation, pro copilots and valuation explanations: LLMs in the gray zone over a deterministic floor, copilots acting only with confirmation on permitted data, explanations that narrate retrieved facts only.\n- **C6** — Every AI use is governed by its autonomy level, cost per outcome, evaluation and AI Act classification, recorded in an AI use register with an owner and a kill switch, and the structured assets are the AI strategy.\n\n## Role in the part\n\nExtends model governance to generative AI and agents: AI proposes, the structured systems the earlier parts built decide, and every AI use is registered and costed. Supports P8-4 of part `part-8`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `assertion_evidence_reasoning` in scene to veldmark: the question, the vocabulary, the public evidence, the design, the worked example; `grouping` in trust to copilots: the other stages of the listing lifecycle, moderation first because the pilot's fraud finding leads into it, then buyer search and the channel, then pro tooling and valuation)\n\nThe scene poses Ingrid's question; the concepts give the terms every later section uses; the public evidence shows the pattern the control layer then designs for; the photo-to-listing pilot applies the layer to creation, the stage with the most evidence, and comes before the other stages because each of them reuses its parts (screening, constrained output, registered models). Trust and safety follows the pilot because the pilot's fraud finding is its question; search and the channel, then copilots and valuation, reuse the same pattern on other users. Cost, evaluation and the AI Act come after the features they govern, because they measure and classify those features, and their results are the fields of the AI use register the Chief Architect's view proposes; trade-offs, vertical differences, failure modes, the Chief Architect's view and the questions test and govern the whole. The architecture before the evidence would design for a pattern the reader has not seen; the pilot after search would show the compiler in its less documented use first; the register before the features would list fields with nothing to fill them.\n\n## Introduction\n\n**Hook** (`intriguing_example`): A seller choosing a category from a tree of 1,400 leaves (marked in the prose as a generic example beside Veldmark's 1,640) and filling twenty attribute fields; a buyer translating 'a family car that fits a dog and costs less than twenty thousand' into make, body type, price and mileage filters.\n\n**Bridge:** Every listing chapter of Parts II to IV is in part about the cost of making people translate into the marketplace's structures. → Generative AI can do much of that translation, which is both its value and its danger.\n\n**Thesis statement** (KEY POINTS callout (all three bullets) and paragraphs p01-p02.): AI creates value by translating intent into the structures the marketplace already has; its output is a proposal the platform validates, records and decides on; search for external assistants becomes an API product; and every AI use is registered and governed by autonomy, cost and consequence.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p04, which lists the sections in order and names the kinds of evidence.):\n\n- Six AI requests at Veldmark. *Kept in:* scene.\n- The terms and the autonomy ladder. *Kept in:* concepts.\n- Where AI has shipped at marketplaces. *Kept in:* shipped.\n- The control layer. *Kept in:* architecture.\n- Tradeyard's photo-to-listing pilot. *Kept in:* veldmark.\n- Trust and safety, search and external assistants, pro copilots and valuation. *Kept in:* trust, search, copilots.\n- Cost, evaluation and the EU AI Act. *Kept in:* cost-eval, regulation.\n- Trade-offs, vertical differences, failure modes, the Chief Architect's view and review questions. *Kept in:* trade-offs, verticals, failure-modes, ca-view, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | For most of their history listing marketplaces made people translate what they had or wanted into the marketplace's structure, and generative AI is the first technology that can do much of that translation, which is where its value lies. | example: A seller choosing a category from a tree of 1,400 leaves and filling twenty attribute fields; a buyer turning 'a family car that fits a dog and costs less than twenty thousand' into make, body type, price and mileage filters. |  |\n| p02 | claim | The same ability makes AI dangerous, because a model fills fields and answers whether or not the input supports it, so the architecture must treat AI output as a proposal to be validated and the structured assets become more valuable, not less. | figure: Figure 1: proposal cards from an AI assistant pass a stencil checkpoint before reaching the listing shelf. | `contrast`: AI's ability to translate. → The danger of the same ability, and the chapter's claim that output is a proposal. |\n| p03 | transition | The chapter rests on the structured services that the replacement of Yardstick delivers and on the ML platform and the Part II taxonomy and attribute schemas, leaves enrichment, query understanding, moderation and SEO to their owning chapters, and draws its example from the fictional Veldmark. | reasoning: Links to modernization-and-migration, ml-platform, categories-and-taxonomies, attribute-schemas, normalization-and-enrichment, query-understanding, trust-and-safety-architecture, web-and-seo-architecture, long-term-evolution and meet-veldmark. | `cause_effect`: The previous chapter's closing: the platform replacing Yardstick arrives capability by capability, with the taxonomy and attribute service, Listing Search API v1 and the shared trust-and-safety platform. → Those services as what generative AI runs on, and the chapter's boundaries. |\n| p04 | transition | The chapter moves from six AI requests at Veldmark through definitions and the public record to the control layer, the photo-to-listing pilot, trust and safety, search and external assistants, copilots and valuation, cost, evaluation and the AI Act, and closes with trade-offs, verticals, failure modes, the Chief Architect's view and review questions, using dated 2023-2026 launches, EU law and Veldmark as evidence. | reasoning: The section list in order and the kinds of evidence. | `sequence`: Where the chapter sits. → The order in which it makes its argument. |\n\n## Sections\n\n### Setting the Scene at Veldmark: Six AI Requests in One Quarter\n\n**Controlling idea** (`context`, id `scene`): Six AI requests from six Veldmark teams in one quarter all reduce to one review question: what structured thing does the model produce, and what checks it?\n\n**Advances the thesis** (C1, C2): Poses the chapter's question through six concrete proposals.\n\n**Transition in:** `elaboration`: The claim that AI output is a proposal to be validated. → Six concrete AI proposals at Veldmark in November 2027 that pose the question the claim must answer (what checks each one); the worked example answers it later.\n\n**Order of paragraphs** (`large_to_small`): The proposals first so the questions have objects; Ingrid's question last because it generalizes the others into the chapter's test.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | description (list) | By November 2027 Veldmark's Group CPO has six AI proposals from six teams, covering listing creation, conversational search, a dealer copilot, moderation, valuation explanations and AI crawlers. | scenario: Tradeyard's photo-to-listing assistant (2.3 million new listings a week, 78% from private sellers); Hearthly's conversational search in France and Spain and an app in a third-party assistant; Motorvane's dealer copilot for 21,400 dealers; LLMs in the moderation gray zone after the July 2027 Barcelona fake-rental ring; Valuo explanations; Tradeyard SEO on AI crawlers (46% of web sessions from organic search). |  |\n| p06 | claim | Veldmark's leaders ask about fraud, the AI Act and who pays for assistant queries at the 31,000-queries-per-second peak, and Ingrid asks of each proposal what structured thing the model produces and what checks it, a question whose answer is the same for all six. | scenario: Aisha Rahman's fraud question, Lucía Ortega's AI Act question, Tomasz Wiśniewski's Sunday-evening peak of 31,000 queries per second, Ingrid Halvorsen's question. | `elaboration`: The six proposals. → The questions the group's leaders ask of them, ending with Ingrid's. |\n\n### Concepts: Generative AI, Agents and Autonomy\n\n**Controlling idea** (`definition`, id `concepts`): The chapter needs precise terms for generative AI, the structured-output compiler, agentic search, agent interfaces, autonomy and governance, and an autonomy ladder that ties each level to its controls.\n\n**Advances the thesis** (C1, C6): Defines the vocabulary, including the structured-output compiler and the autonomy ladder used to govern AI uses.\n\n**Transition in:** `elaboration`: The six requests and Ingrid's question. → The terms the requests rest on.\n\n**Order of paragraphs** (`large_to_small`): Definitions first, then the one term (autonomy) expanded into a ladder, then the rule that applies it; the rule before the ladder would use levels the reader has not met.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | definition (list) | Seven terms carry the chapter, chief among them the structured-output compiler, in which a model translates unstructured input into a structure the marketplace already has and the structure is validated deterministically. | source: Model Context Protocol: introduced by Anthropic in November 2024 and donated to the Agentic AI Foundation under the Linux Foundation in December 2025. |  |\n| p08 | comparison | Autonomy levels form a ladder (suggest, draft, act with confirmation, act autonomously) in which each step up removes a person from the decision and needs stronger controls. | table: The autonomy ladder: level, what the AI does, listing example, who confirms, typical controls. | `elaboration`: Autonomy level, one of the seven terms. → The four levels as a ladder with controls. |\n| p09 | recommendation | The author's rule is that anything that changes what buyers see about a seller's listing stays at draft or below unless the seller opts in, and anything that restricts users' rights follows the DSA's rules for automated decisions. |  | `cause_effect`: The ladder and its controls. → The rule the author applies to listing systems. |\n\n### Where AI Has Shipped: The Lifecycle in Public Evidence\n\n**Controlling idea** (`evidence`, id `shipped`): Documented marketplace launches from 2023 to 2026 cover every stage of the listing lifecycle and show three patterns: the structured system of record stays, rollouts are staged by structure, and the biggest 2026 change is distribution.\n\n**Advances the thesis** (C1): Shows from public evidence that the model translates into existing structures.\n\n**Transition in:** `additional_support`: The terms and the ladder. → Where such features have actually shipped.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | evidence | Between 2023 and 2026 marketplaces shipped AI at every stage of the listing lifecycle, mostly documented by company announcements, with trade press and third-party summaries labeled. | table: Lifecycle table: eBay magical listing (September 2023); Kleinanzeigen photo-to-listing (November 2025, trade press); OLX Auto Description (August 2026; 98% style and relevance, 89% faithfulness); OLX job-role extraction (January 2024; about 4,000 requests a day, 'approximately 15K per month'); coches.net filter compilation (November 2024; about 20,000 calls a day for about €19); leboncoin conversational assistant (March 2024); OLX Magic (2024, third-party summary; 5-10 s against 300-500 ms); OLX CompassGPT and AutoGPT in ChatGPT (February and April 2026); ImmoScout24 MCP server and ChatGPT app (January and March 2026); OLX Chat Images GenAI (January 2026); OLX AutoIQ (February 2026); Adevinta SEO (June 2023). |  |\n| p11 | analysis | Three patterns run through the table: every implementation keeps the structured system of record, rollouts are staged by structure, and the biggest 2026 change is distribution rather than modeling. |  | `cause_effect`: The table of launches. → The three patterns it shows. |\n\n### Architecture: The Control Layer Between Models and Listings\n\n**Controlling idea** (`explanation`, id `architecture`): Keeping the structured systems in charge takes a control layer of gateway, prompt registry, tools and evaluation harness with validators and guardrails, and hard boundaries between model output and listing data.\n\n**Advances the thesis** (C2): Specifies the control layer that makes every output a proposal.\n\n**Transition in:** `cause_effect`: The pattern that every implementation keeps the structured system of record. → The control layer that enforces it.\n\n**Order of paragraphs** (`large_to_small`): Components first, then the checks around them, then the boundaries they enforce; the boundaries before the components would name rules with nothing to enforce them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p12 | description (list) | An AI feature in a listing system needs four parts that the predictive-ML platform lacks: an AI gateway, a prompt and configuration registry, tools over the marketplace's own capabilities and an evaluation harness. |  |  |\n| p13 | explanation | Validators check every output deterministically against the attribute dictionary, filter schema or policy taxonomy, and guardrails block contact details, payment instructions, prohibited items and unsupported claims, so models never write to systems of record directly. | figure: Figure 2: models never write to systems of record directly. | `additional_support`: The four parts. → The validators and guardrails around them. |\n| p14 | claim (list) | Four boundaries matter: model output is never a listing field until a validator and a person accept it, every field carries provenance, the search index stays the retrieval layer, and trust and safety runs on assisted content too. | reasoning: Provenance values ai_suggested, seller_confirmed and seller_edited; the seller is responsible for a confirmed description, the marketplace for one it published unconfirmed. | `elaboration`: Validators and guardrails. → The boundaries they enforce. |\n\n### Veldmark Worked Example: The Photo-to-Listing Assistant\n\n**Controlling idea** (`example`, id `veldmark`): Tradeyard's photo-to-listing assistant, built on the taxonomy service and the trust platform, screens photos first, constrains category and attributes, takes price from a registered model and drafts text last, and its pilot shows constrained AI improves the catalog while removing a weak fraud signal.\n\n**Advances the thesis** (C3): Works the assisted insertion flow end to end with numbers.\n\n**Transition in:** `example`: The control layer and its boundaries. → The control layer in one Veldmark assistant.\n\n**Order of paragraphs** (`chronological`): Approval, dependencies, design, one listing, the pilot's results, the design changes and rollout, then fraud: the order in which the pilot unfolded, so each result is read against the design that produced it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p17 | description | Tradeyard's assistant was approved for a narrow pilot on 15 November 2027, excluding vehicles, property, jobs and services because those need data that photos do not give. | scenario: Tradeyard Netherlands, iOS first, goods only, 5% of private sellers; exclusions follow eBay and Kleinanzeigen. |  |\n| p18 | cause_effect | The assistant depends on two Common Ground capabilities that went live just before it, the group taxonomy and attribute service (October 2027) and the shared trust-and-safety platform (November 2027), without which the model would have nothing to compile into and nothing to check it. | scenario: Taxonomy and attribute service, October 2027; shared T&S platform for Tradeyard NL and BE, November 2027. | `cause_effect`: The pilot's approval. → What made it possible. |\n| p19 | process (list) | Before the seller sees anything the assistant runs five steps: screen photos, propose a category from allowed leaves, propose attributes from the schema with 'unknown' allowed, take a price range from the registered price-hint model, and draft title and description last behind guardrails. | scenario: Perceptual hashes and an image classifier; a vision-language model ranking leaf categories; dictionary-constrained attributes; Tradeyard's price-hint model; guardrails stripping contact details, URLs, payment instructions and unsupported claims. | `sequence`: The two capabilities. → The steps built on them. |\n| p20 | description | The seller confirms all five as an editable form, and the published listing carries an AI label and per-field provenance. | figure: Figure 3: the language model ranks categories from an allowed list, fills a schema and writes prose last. | `sequence`: The five steps. → The seller's confirmation and the label. |\n| p21 | example | One Utrecht cargo bike shows the flow: no hash match, Bikes › Cargo at 0.94, seven of nine attributes with two returned as unknown, a €1,450-€1,700 price hint, and publication 2 minutes 10 seconds after the first photo. | scenario: Monday 6 December 2027, 19:05 CET; listed at €1,600; published 19:07. | `example`: The flow in general. → One listing through it. |\n| p22 | evidence | After nine weeks the pilot produced about 154,000 assisted listings with high uptake and acceptance, faster insertion, more published listings and a model cost below one cent per listing. | table: Pilot measures to 17 January 2028: 62% uptake; 92.4% category accepted; attributes 78/15/7%; 1.9% unsupported claims in a 2,000-listing audit; 2 min 50 s against 6 min 40 s; +9 points started-to-published; +4% contacts (weak signal); €0.0062 per assisted listing. | `time`: One listing in December. → The pilot's results in January. |\n| p23 | analysis | Two findings changed the design: constrained values raised attribute coverage, the Attribute Junkyard in reverse, and unsupported claims clustered in condition superlatives that the guardrail now strips. | statistic: Electric assist recorded on cargo bikes rose from 61% to 88%; an earlier free-text prototype produced 1,100 distinct colors in two weeks.; figure: Figure 4: junkyard against swatch cabinet. | `cause_effect`: The pilot's numbers. → What they changed in the design. |\n| p24 | analysis | At full rollout model cost is not the constraint; evaluation across four languages and 1,640 leaf categories is, so the forum extends the pilot only where evaluation sets exist. | scenario: About €230,000 a year forecast; extension to 25% of Netherlands sellers and Belgium on iOS and Android from 24 January 2028; Poland and Portugal once evaluation sets exist. | `contrast`: The design changes. → What limits the rollout. |\n| p25 | cause_effect | Fraudsters used the assistant as often as anyone, so polished text stopped being a signal against them and the trust model must lean on account, device, image and price signals, with generated photos countered behaviorally rather than visually. | scenario: 2,300 attempts with matching photos blocked in the pilot; generated apartment photos have no hash to match.; figure: Figure 5: two equally polished listings, signals lighting for the fraudulent one. | `contrast`: Benefits to honest sellers. → What fraudsters did with the same assistant. |\n\n### AI in Trust and Safety\n\n**Controlling idea** (`recommendation`, id `trust`): Generative models help moderation where policy changes faster than labels accumulate, under three rules: LLMs in the gray zone only, a deterministic floor, and respect for the law on automated decisions.\n\n**Advances the thesis** (C5): Applies propose-and-validate to moderation.\n\n**Transition in:** `cause_effect`: The pilot's fraud finding: polished text no longer separates scams, and the trust model must lean on other signals. → Where generative models themselves help moderation, and the rules that keep them controlled.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p34 | recommendation (list) | Three rules keep LLMs in moderation controlled: use them only in the gray zone, keep a deterministic floor, and respect the DSA's limits on automated decisions. | scenario: About 138,000 new-listing decisions a week go to human review at Tradeyard; 94% are decided automatically.; quotation: DSA Article 20(6): complaint decisions not taken 'solely on the basis of automated means'. |  |\n| p35 | example | OLX's chat-image model shows a well-scoped gate-tier use, and Veldmark's gray-zone design follows the same scope discipline with every model registered. | case: OLX Chat Images GenAI (2026): one fraud vector, real time, measured precision. | `example`: The three rules. → A documented use that follows them. |\n\n### Search, Agents and the New Channel\n\n**Controlling idea** (`explanation`, id `search`): In search the model compiles a sentence into the existing filter schema, agentic flows belong only in high-consideration journeys, and search offered to external assistants and crawled by AI companies becomes a channel governed by contracts, quotas, attribution and a crawler policy.\n\n**Advances the thesis** (C4): Applies the proposal pattern to search and the new distribution channel.\n\n**Transition in:** `similarity`: The propose-and-validate pattern in listing creation and moderation. → The same compiler pattern in buyer search, then the new channel.\n\n**Order of paragraphs** (`large_to_small`): Search on own surfaces first (compiler, its limits, agents), then the voluntary external channel, then the involuntary one; the crawler trade-off last because it needs both channels.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p26 | explanation | Hearthly's conversational search compiles a sentence into its existing filter schema, shows the filters to the user and runs normal search, which keeps results explainable and cost low. | case: The coches.net and leboncoin pattern. |  |\n| p27 | claim | Natural language helps mainly where filters are many and vocabulary is vague, and a conversational layer that cannot say there is no filter for a wish will invent one. | example: 'Quiet', 'bright', 'near a good school' have no filter. | `elaboration`: The compiler. → Where it helps and where it must refuse. |\n| p28 | recommendation | Agentic search costs an order of magnitude more latency, so it belongs in high-consideration journeys rather than default search. | case: OLX's account: 5-10 seconds against 300-500 ms; a blank chat interface replaced by the familiar search page with AI built in. | `contrast`: One-call compilation. → Multi-step agentic search. |\n| p29 | claim | When an external assistant calls the marketplace, search becomes an API product whose tools (search with a filter schema, listing summaries, links back) have their own release mechanics. | case: ImmoScout24's cached tool descriptors; Rightmove's FY2025 results (February 2026) on conversational search and a ChatGPT app.; figure: Figure 6: an external assistant gets tools, not pages. | `sequence`: Search on the marketplace's own surfaces. → Search called by other companies' assistants. |\n| p30 | example | Veldmark's February 2028 decision record answers the questions every group faces about the channel: which brands first, what tools return, no contact through the assistant, quotas, attribution, ranking and partner data use. | table: Seven decisions with reasons: Hearthly France and Motorvane Germany first; public fields and a tracked link; no contact through the assistant; per-partner quotas lowered Sunday 20:00-22:00 CET; leads tagged by channel and partner; same organic ranking, paid labeled; no training or long caching by partners. | `example`: Search as an API product. → Veldmark's decisions for it. |\n| p31 | context | The other half of the channel is involuntary: AI crawlers copy the inventory that is a marketplace's product and return no traffic. |  | `contrast`: The voluntary channel. → Crawlers that take data without asking. |\n| p32 | explanation | The architecture has three levers against crawlers: technical controls, a machine-readable legal reservation, and commercial licensing. | source: Cloudflare blocked AI crawlers by default for new domains and announced pay-per-crawl on 1 July 2025; AI Act Article 53 and Article 4(3) of Directive (EU) 2019/790. | `problem_solution`: Crawlers copying inventory. → The three levers. |\n| p33 | recommendation | Crawler policy trades data protection against search traffic, so the brand's GM decides it quarterly with SEO and legal and the architecture makes each lever a configuration. | scenario: 46% of Tradeyard's web sessions start from organic search. | `contrast`: The levers. → The cost of using them. |\n\n### Pro Copilots and Valuation Explanations\n\n**Controlling idea** (`recommendation`, id `copilots`): Copilots for pros act only with confirmation on the dealer's own and permitted data, and valuation explanations narrate retrieved facts under a validator that checks every number.\n\n**Advances the thesis** (C5): Applies propose-and-validate to pro tooling and valuation.\n\n**Transition in:** `sequence`: Search and the channel, the buyer side of the lifecycle. → Pro tooling and valuation.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p36 | example | Motorvane's dealer copilot acts with confirmation inside Dealer Hub, uses only the dealer's own and Motorvane's market data, explains prices in public price-rating terms, and Keybridge's equivalent stays inside Keybridge's tenancy. | scenario: Price change for forty cars after a preview; March 2027 Keybridge neutrality decision. |  |\n| p37 | recommendation | Valuo explanations narrate structured inputs and may not introduce a comparable, number or trend, because an explanation that invents a comparable turns an estimate into a misrepresentation. | scenario: Lyon apartment: 68 m², Lyon 7e, energy class D, estimate €372,000-€401,000. | `similarity`: Copilot constraints. → Constraints on generated explanations. |\n\n### Cost and Evaluation\n\n**Controlling idea** (`recommendation`, id `cost-eval`): Generative AI should be budgeted by cost per outcome, with volume moved to cheaper hosting as tasks stabilize, and guarded by evaluation at five stages, with faithfulness measured apart from fluency.\n\n**Advances the thesis** (C6): Supplies the cost and evaluation fields of the register.\n\n**Transition in:** `cause_effect`: The features across the lifecycle. → What they cost and how they are evaluated.\n\n**Order of paragraphs** (`large_to_small`): The cost figures, then the unit that outlasts them, then hosting as the lever on that unit, then evaluation, which guards every change including a move down the hosting table; evaluation before hosting would leave the cheaper-model move unguarded in the reader's mind.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p38 | evidence | Every feature is paid per call, which makes cost visible, but the public numbers are few and old. | table: coches.net ~20,000 calls a day for ~€19 (2024); OLX ~4,000 calls a day, 'approximately 15K per month' (2024); Veldmark €0.0062 per assisted listing (illustration). |  |\n| p39 | recommendation | The unit that matters is cost per outcome, reported by the gateway per feature and brand with a budget and an alert. |  | `contrast`: The cost figures. → The unit that outlasts them. |\n| p15 | comparison | Cost per outcome also depends on where a model runs, and there are four options, from a frontier model through a provider API to a distilled classical model, each fitting a different volume and task stability. | table: Model choice and hosting: frontier API, small or mid-sized API, self-hosted open model, distilled classical model, with strengths, weaknesses and fits. | `cause_effect`: Cost per outcome as the unit to manage. → Where a model runs, the main lever on that cost. |\n| p16 | recommendation | The documented trajectory matches the table, so the author's rule is to start with an API to learn the task and move volume down the table as it stabilizes, keeping the gateway so that the move is a routing change. | case: leboncoin moved guardrails from prompts into fine-tuning for latency; OLX's job-role extraction cost prompted evaluation of self-hosted models. | `example`: The hosting table. → Documented moves along it and the author's rule. |\n| p40 | process | Evaluation runs at five stages, from golden sets before launch to sampled audits of production traffic. | table: Golden sets, regression on every change (block if category accuracy drops more than 1 point), adversarial testing, online experiments, sampled production audit. | `sequence`: Cost levers: the unit and where models run. → The evaluation that must guard every change, including a move to a cheaper model. |\n| p41 | claim | Faithfulness deserves its own metric, because fluent and wrong is the characteristic failure of generative models and usage metrics miss it. | statistic: OLX Auto Description: 98% style, 89% faithfulness. | `emphasis`: The five stages. → The metric they must include. |\n\n### Regulation: The EU AI Act for Marketplaces\n\n**Controlling idea** (`explanation`, id `regulation`): The AI Act's dated obligations, after the Digital Omnibus, touch marketplaces through Article 50 transparency and Annex III high-risk uses in jobs and credit, and Veldmark designs so as not to depend on unresolved legal questions.\n\n**Advances the thesis** (C6): Supplies the AI Act classification field of the register.\n\n**Transition in:** `additional_support`: Cost and evaluation as governance. → Legal obligations as governance.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p42 | evidence | The AI Act applies in phases, some moved by the Digital Omnibus (Regulation (EU) 2026/1744), with five dated obligations relevant to marketplaces, stated as of the book's October 2026 research date and placed against the Veldmark story's November 2027 to February 2028 timeline, across which the 2 December 2027 high-risk date falls. | table: 2 February 2025; 2 August 2025; 2 August 2026 with marking by 2 December 2026; 2 December 2027; 2 August 2028. |  |\n| p43 | explanation | Annex III makes AI that targets job ads or selects candidates, and creditworthiness evaluation, high-risk, which reaches jobs marketplaces and valuation models feeding lenders. Lucía's answer (none of the six is high-risk as proposed) still holds after that date. | quotation: Annex III point 4(a): 'to place targeted job advertisements, to analyse and filter job applications, and to evaluate candidates'. | `elaboration`: The high-risk date in the table. → Which marketplace uses it reaches. |\n| p44 | recommendation | Whether Article 50's marking duty applies to a marketplace assistant is a question for counsel, so Veldmark labels and marks assisted content from launch regardless. |  | `sequence`: Annex III. → Article 50 and Veldmark's answer. |\n| p45 | context | The AI Act sits alongside the DSA, the P2B Regulation, consumer law and the GDPR covered elsewhere in the book. |  | `additional_support`: The AI Act. → The other rules that also apply. |\n\n### Trade-offs\n\n**Controlling idea** (`comparison`, id `trade-offs`): Each AI decision has a default and a condition under which the alternative is right, and the defaults keep model output in drafts and schemas.\n\n**Advances the thesis** (C2, C4, C6): Gathers the chapter's decisions as choices with conditions.\n\n**Transition in:** `conclusion_summary`: The decisions made section by section. → All of them side by side.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p46 | comparison | Each decision in the chapter has a default and a condition under which the alternative is right. | table: Seven decisions: where AI writes, output form, search interface, external channel, model hosting, crawler policy, moderation. |  |\n| p47 | analysis | The first two rows carry the chapter's argument: wherever output is searchable, filterable or seen by buyers, the model drafts into a schema and a person or validator decides. |  | `emphasis`: The table. → The rows that carry the argument. |\n\n### Vertical Differences\n\n**Controlling idea** (`comparison`, id `verticals`): How much each AI decision matters depends on the vertical: the assistant pays most in general classifieds, conversational search and the external channel in real estate and automotive, and jobs carries the highest AI Act exposure.\n\n**Advances the thesis** (C1, C6): Shows where the value and risk concentrate.\n\n**Transition in:** `elaboration`: The decisions in general. → How they differ by vertical.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p48 | comparison | How much each decision matters depends on the vertical. | table: Assistant value, creation risk, conversational fit, external channel fit (ImmoScout24, OLX CompassGPT, OLX AutoGPT), copilots, AI Act exposure across four verticals. |  |\n| p49 | analysis | General classifieds gain most from the assistant, real estate and automotive from conversational search and the external channel, and jobs carries the highest regulatory risk. |  | `conclusion_summary`: The vertical table. → What it adds up to. |\n\n### Failure Modes\n\n**Controlling idea** (`counterargument`, id `failure-modes`): Each design choice has a characteristic failure, from free-text attributes to crawler policy by accident.\n\n**Advances the thesis** (C2, C3, C4, C5, C6): Shows what breaks without each control.\n\n**Transition in:** `contrast`: The right choice per vertical. → What goes wrong when choices are made badly or not at all.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p50 | description (list) | Nine failure modes follow from missing controls: free-text attributes, an assistant that helps scammers, numbers from the language model, prompt changes without regression tests, agentic search as default, contact through the assistant, conversation data at the vendor, crawler policy by accident and AI-washed explanations. |  |  |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `ca-view`): A Chief Architect governs AI with an AI use register, treats the structured assets as the AI strategy, owns the gateway centrally, decides channel strategy per brand, enforces data-use rules in pipelines, budgets by outcome and watches a short list of indicators.\n\n**Advances the thesis** (C6): Turns the chapter into group decisions.\n\n**Transition in:** `problem_solution`: The failure modes. → The group decisions that prevent them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p51 | recommendation | Extend the model register into an AI use register that every feature must fill in before launch. | scenario: Extends the registry decided on 9 November 2027. |  |\n| p52 | recommendation | Make the structured assets the AI strategy, because AI features compile into them and the order of Common Ground's deliveries was the order of what AI could do. |  | `sequence`: The register. → The assets AI depends on. |\n| p53 | recommendation | Own the gateway and evaluation harness centrally and the features locally. |  | `sequence`: The assets. → Who owns the shared AI platform. |\n| p54 | recommendation | Decide each brand's channel strategy explicitly in a decision record with a review date. |  | `sequence`: The central platform. → The per-brand channel decision. |\n| p55 | recommendation | Write data-use rules down and enforce them in pipelines, including the Keybridge neutrality commitment. |  | `sequence`: Channel strategy. → Data-use rules. |\n| p56 | recommendation | Budget AI by outcome and move stable volume to cheaper hosting. |  | `sequence`: Data-use rules. → Budgets. |\n| p57 | recommendation | Watch a short list of indicators, from register coverage and faithfulness to crawler traffic and unclassified AI Act uses. |  | `conclusion_summary`: The six decisions. → The indicators that show whether they hold. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Ten questions let a reader review any AI feature against the chapter.\n\n**Advances the thesis** (C2, C3, C4, C6): Turns the chapter into a review checklist.\n\n**Transition in:** `sequence`: The Chief Architect's decisions. → Questions for a design review.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p58 | recommendation (list) | Ten review questions start from what structured output the model produces and what checks it, and cover provenance, trust, cost, evaluation, the external channel, crawlers, the AI Act and data use. |  |  |\n\n## Conclusion: From AI to the Long View\n\n**Synthesis:** AI is a translator between people and the structures the marketplace already has: where those structures are clean, the control layer lets AI make listing, search and pro work faster while every proposal stays checked, attributed and costed, on Veldmark's own surfaces or as tools for another company's assistant, and recorded in the register; where they are not, AI accelerates the mess.\n\n**So what:** A Chief Architect's AI roadmap is therefore the structured-asset roadmap, and Ingrid's question decides every proposal.\n\n**Callback:** The opening's picture of sellers and buyers doing the work of translation, and Ingrid's question about the six requests. The reader now sees that translation is what AI takes over and that one question answered all six requests.\n\n**Takeaway** (`course_of_action`): Ask of every AI proposal what structured thing the model produces and what checks it, and invest in the structures it compiles into.\n\n**Hand-off** to [Built to Be Replaced: Evolving a Marketplace Platform Over a Decade](long-term-evolution.html): `conclusion_summary`: AI is safe where the marketplace's structures are clean and accelerates the mess where they are not, and it is only one stressor a platform must absorb. → Keeping the platform coherent over a decade of stressors: acquisitions, regulation and the swing between central and local control.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p59 | synthesis | Ingrid's question had the same answer for all six requests, because AI arrives as a translator into existing structures: where they are clean the control layer keeps every proposal checked, attributed, costed and registered, on own surfaces or another company's assistant; where they are not AI accelerates the mess, so the AI roadmap is the structured-asset roadmap. |  |  |\n| p60 | transition | AI is only one of the stressors a platform must absorb over a decade, alongside acquisitions, regulation and the swing between central and local control, which long-term-evolution takes up. |  | `conclusion_summary`: AI as one technology shift. → The decade-long view in the next chapter. |\n\n## Non-goals\n\n- Predictive-model platform, decision tiers and AVM governance. See [Models in Production: ML Platforms and Use Cases](ml-platform.html).\n- LLM-based attribute extraction pipeline design. See [From Raw Supply to Usable Listings: Normalization and Enrichment](normalization-and-enrichment.html).\n- Query understanding and hybrid retrieval evaluation. See [What Did They Mean? Query Understanding and Autocomplete](query-understanding.html).\n- Moderation pipeline and DSA statements of reasons. See [Trust and Safety as a Platform](trust-and-safety-architecture.html), [Rules of the Marketplace: DSA, DAC7 and Vertical Regulation](marketplace-regulation.html).\n- SEO for answer engines. See [Found by Google: Web, App and SEO Architecture for Listings](web-and-seo-architecture.html).\n- Fraud signals and risk scoring. See [Scams, Fakes and Account Takeovers: Fraud Prevention for Listings](fraud-prevention.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Whether a marketplace building an assistant on a third-party model is an AI Act 'provider' for Article 50(2), and whether seller-confirmed descriptions fall under the editing exception: left to counsel; the chapter's design marks content regardless. (Carried over from spec.md.)\n- Database-right protection of listing data against AI crawlers: the CJEU's job-ads case law could not be fetched, so the chapter states only that it is a question for counsel. Add the case with a verified citation in a later pass. (Carried over from spec.md.)\n- Kleinanzeigen and OLX Magic evidence is trade press or third-party summary; recheck against first-party sources. (Carried over from spec.md.)\n- Marktplaats and other Adevinta-brand AI listing creation remained unverified and is not mentioned. (Carried over from spec.md.)\n\n## Decision log\n\n- **2026-10-19** — Made 'AI proposes, the platform decides' (the structured-output compiler) the organizing pattern, because every documented classifieds implementation keeps the structured system of record.\n- **2026-10-19** — Used Tradeyard's photo-to-listing pilot as the single worked example, tied to the October 2027 taxonomy service and November 2027 T&S platform so that the dependency on structured assets is visible; added its decisions and metrics to the ledger.\n- **2026-10-19** — Treated external assistants and AI crawlers as one channel question (voluntary and involuntary distribution), following the OLX and Scout24 2026 evidence.\n- **2026-10-19** — Used the Digital Omnibus dates (verified September 2026) for the AI Act table.\n- **2026-11-12** — Converted spec.md to spec.json. Success criteria: autonomy ladder, control layer and Veldmark pilot criteria are covered by the journal spec's AC-1; the lifecycle-table, AI-use-register-design and '10 review questions' criteria were inventories and are dropped; the external-agent criterion became AC-4 and the AI Act criterion AC-5 (both minor, added by this spec); the three T&S rules criterion is dropped as an inventory (the rules are p34's evidence). Rejected: Carrying the success criteria over as written (inventories).; A cold-reader criterion for the autonomy ladder (covered by AC-1's expected answer and the can_do outcomes).\n- **2026-11-12** — No word limit was set in spec.md; max_words set to the published prose length by check_draft's count (7,180) plus 5%, 7,539.\n- **2026-11-12** — Supporting claims C1 to C6 written here (the journal spec gives none for this post) from the thesis's parts: translation into existing structures, the control layer, the assisted insertion flow, search and the channel, moderation/copilots/valuation, and governance by register, cost and AI Act.\n- **2026-11-12** — Thesis rubric (fresh agent, thesis object only): pass on all four tests. It noted small orphans in this spec's supporting claims (C3's fraud signal, C4's data-use terms and crawler policy, C6's 'structured assets are the AI strategy'), which come from how_why and so_what rather than the claim; kept, since the thesis is copied from the journal spec.\n- **2026-11-12** — Flow rubric (sound with notes): moved AI in Trust and Safety from after Search to directly after the Veldmark pilot, so the pilot's fraud finding leads into the moderation rules; rewrote the transition_in of trust, search and copilots, the roadmap (p04 and promises) and the flow rationale (no longer claims a chronological lifecycle; says what breaks); p09 names the DSA; the conclusion synthesis now names the external channel and the register. Rejected: Merging the one-sentence table leads p46 and p48 into the paragraphs after the tables (each table would then attach to no unit).; Cutting or folding p56 ('budget by outcome, move stable volume to cheaper hosting'), which overlaps p16: published text, kept.\n- **2026-11-12** — Flow rubric rerun after the reorder (sound with notes): the flow rationale now says cost, evaluation and the AI Act supply the fields of the register that the Chief Architect's view proposes, rather than implying the register was introduced earlier. Other notes recorded under open_questions.\n- **2026-11-12** — Draft check round 1 (ESCALATE: one corroborated flow failure at fault in the spec). Both flow readers found 'Model choice and hosting' interrupting the path from the control layer to the worked example and arguing from cost; moved p15 and p16 from Architecture to Cost and Evaluation after p39, rewrote p15's and p40's transition_in and the two sections' controlling ideas and flows. Intent, thesis and role unchanged. Draft-fault failures revised in the prose: section openers of scene, shipped, veldmark, copilots and regulation now express their transitions; 'gray zone' glossed at first use in the scene. Rejected: Changing the opening's '1,400 leaves' figure to agree with Veldmark's 1,640 (published figure; recorded as an open question instead, and the later figure named as Veldmark's).\n- **2026-11-12** — Draft check round 2 (REVISE, all failures at fault in the draft): lead sentence for the boundaries list (p14); Valuo paragraph opens on the likeness to the copilot constraints (p37); evaluation lead ties evaluation to every change including a move to a cheaper model (p40); 'As verified in October 2026' now says it precedes the Veldmark scenes; 'Fast M nder the author's delegation, 2026-11-12: terms from earlier chapters (gate tier, Common Ground, the bikes split, Keybridge, Priya Raman) stay as known to the audience; the post-round-3 wording fixes (scene opener, roadmap sentence, October 2026 note, p03 opening) are checked by the round-4 draft check rather than recorded as open.\n- **2026-11-12** — After round 4 (ESCALATE on two corroborated draft-fault flow findings), fixed by wording as authorised by the coordinator: Regulation ¶1 now dates the table as the book's research date ('The law as it stood when this book was checked, in October 2026 (the book's research date, not a date in the Veldmark story):'); Regulation ¶2 points to 'the Article 50 transparency duties in the table above' instead of 'below'. No legal fact changed; spec units unchanged (their wording does not carry these phrases). Round 5 run.\n- **2026-11-13** — Fixed under the author's delegation (fix-only pass), round-5 blocking findings: (1) scene transition_in changed from 'example' to 'elaboration' (the scene poses the question the proposal claim must answer; the worked example answers it) and the scene opener reworded to match; (2) two clocks: Regulation ¶1 now places the October 2026 table against the story's November 2027-February 2028 timeline (high-risk date falls between the requests and the January 2028 widening), Lucía's answer states it holds after 2 December 2027, question 9 reworded ('are, or could become, high-risk under the obligations that apply from'); p42 and p43 controlling ideas updated. Also the minor appositive in Worked Example ¶1 split. No legal fact, date or figure changed.\n\n## Sources\n\n- **Internal**\n  - _journals/listing-systems-architecture/journal-spec.json — Intent outcome, acceptance criteria AC-1 to AC-3, thesis, role, modernization-and-migration's closing for the opening and long-term-evolution's transition_in for the hand-off.\n  - _research/brief-platform-data-ml.md Part 11 and Part 7.5; _research/brief-se
