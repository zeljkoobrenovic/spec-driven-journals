<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, acceptance criteria AC-1 to AC-3, the thesis and the role are copied unchanged from the ml-platform entry in journal-spec.json; the supporting claims and audience are this spec's own. Units added by this conversion: introduction roadmap p04, and a conclusion widened from one paragraph to two (p54 synthesis and callback, p55 hand-off).\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The use-case portfolio (category prediction, attribute extraction, image classification, fraud scoring, ranking, recommendations, price estimation and AVMs, lead scoring) and the four decision tiers: inform, order, gate, commit.\n- **Know:** What an ML platform for listings contains: point-in-time-correct features, labels from moderation, contacts and sales, training and serving, a prediction log joined to outcomes, monitoring, a model registry and lifecycle.\n- **Know:** The documented record, including Zillow Offers' 2021 wind-down; shared, per-brand and per-market models; the EU AI Act as it touches marketplaces.\n- **Believe:** The decision a model makes, not its algorithm, sets the governance it needs.\n- **Believe:** An estimate accurate enough to inform is not accurate enough to commit money.\n- **Be able to:** Assign a tier to each consumer of a model and set the gates for each tier.\n- **Be able to:** Write display, label and data-exclusion rules for a consumer-facing estimate.\n- **Be able to:** Decide when a model may move to a higher tier and who absorbs the loss if it is wrong.\n\n**Audience:** Chief and enterprise architects of marketplace groups, heads of data and ML, ML platform leads, and product leaders who own valuation, pricing or trust models. They know ML in general; they need the marketplace-specific decisions and the group-level governance.\n\n**Already knows:**\n\n- What an API, a database, an event stream, a search engine and Kubernetes are; machine learning in general (training, evaluation, serving).\n- From earlier chapters: Veldmark (fictional), its brands Tradeyard, Motorvane, Hearthly and Keybridge, the cast (Ingrid Halvorsen, Priya Raman, Claire Fontaine, Julien Marchand, Lucía Ortega), the architecture advice forum, Valuo, the Lyon apartment, the Essen Golf and the Keybridge neutrality decision (meet-veldmark); entity resolution and canonical clusters; the category taxonomy and the bikes split; learning to rank, LambdaMART and the P2B Regulation (ranking); DSA statements of reasons (trust-and-safety-architecture); the AI Act (media-pipeline, marketplace-regulation); the listing event stream and ListingUpdated (event-driven-listings); the lakehouse and governed metrics (data-platform); interference and cluster randomization (experimentation); the failure patterns Set-and-Forget AI, The Forced Fit and Vanity Liquidity.\n\n**Does not yet know:**\n\n- The terms this chapter owns: ML capability, ML platform, feature store, model governance, automated valuation model, the four decision tiers (inform, order, gate, commit), prediction log.\n- ML-operations vocabulary: training-serving skew, data, concept and label drift, point-in-time correctness, model registry, model cards, golden path, hidden feedback loops and undeclared consumers.\n- France's DVF transaction data, iBuying and the Zillow Offers wind-down, AI Act Annex III and the Digital Omnibus dates.\n- Veldmark's model inventory, the pricing-hint rules, Hearthly Direct and the ML platform decision of 9 November 2027.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given one model and three proposed uses, the reader assigns tiers and decides each use. *Probe:* A property portal's valuation model has a median error of about 7% for off-market homes. Three proposals arrive: a badge comparing each asking price with the estimate, a guaranteed purchase offer at 94% of the estimate funded by a partner, and a bank licensing estimates for mortgage pre-approval. Using only this chapter: how do you classify and decide each, and what does the platform need before the badge ships? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** Which ML capabilities matter in listing marketplaces, and what platform runs them responsibly?\n\n> **Claim:** The ML capabilities that matter in a listing marketplace are the ones that make its decisions about listings, buyers and money (category and attribute prediction, image classification, fraud scoring, ranking and recommendations, price estimates and valuations, lead scoring), so a marketplace should classify each production model by the decision it makes (informs, orders, gates or commits), not by its algorithm, and let that tier set the depth of validation, monitoring and approval; run every model on one shared path whose first services are point-in-time-correct features, labels taken from moderation decisions, contacts and sales, and a prediction log joined to outcomes; make registration with an owner, a tier per consumer, a label definition, a monitor and a cost a condition of production access; and move a model to a higher tier only with a new validation regime, new owners and a limit on the money it can commit, because an estimate accurate enough to inform a buyer is not accurate enough to commit money.\n\n**Disputed by:** The view that model governance should scale with the model's sophistication, that each brand's data-science team chooses its own training stack and monitoring, and that a model validated for one use can be reused for a more consequential one once it scores well offline.\n\n**So what:** A Chief Architect who accepts this owns the inventory and the tier rules rather than the models; withdraws production credentials from unregistered models after a deadline; turns tiers into gates (segment evaluation for inform, two-sided experiments for order, sampled labels, appeals and statements of reasons for gate, independent validation and capital limits for commit); makes label events part of the producing teams' contracts; funds the platform as a product measured by adoption; and treats any promotion to commit as a board-level decision.\n\n**How and why:** Veldmark's first inventory in September 2027 found 146 production models on four training stacks, 23 without an owner, 41 without monitoring beyond uptime and 12 that could not be retrained. Valuo, the same model behind three requests, has a median absolute error of 7.4% off-market and 2.3% for listed homes; the badge shipped under eight rules (shown only when the interval width is at most 12% of the midpoint with at least eight comparable sales, DVF prices as the only labels, Keybridge data rejected by a lineage tag), while Hearthly Direct's guaranteed offer at 94% of the estimate was declined because Valuo had never been back-tested on resale or on owners who would accept. Zillow's 2021 wind-down of Zillow Offers is the documented case of an estimate used to commit. Registration became a condition of production access on 9 November 2027.\n\n**Supporting claims**\n\n- **S1** — The ML capabilities that matter in a listing marketplace are the models that make its decisions about listings, buyers and money, and in most groups they have accumulated team by team into a portfolio nobody can list, own or reproduce.\n- **S2** — Governance follows the decision a model makes (inform, order, gate or commit), not its algorithm, and because one model can serve several consumers at different tiers, the tier is assigned per consumer and every consumer must be declared.\n- **S3** — The listing-specific hard parts of an ML platform are point-in-time-correct features, labels from moderation decisions, contacts and sales, and a prediction log joined to outcomes; most listing models are scored on events and stored on the listing, and an online feature store pays only for real-time behavioral features.\n- **S4** — An estimate accurate enough to inform is not accurate enough to commit money: moving a model to the commit tier needs a new validation regime (forward back-tests on the population that accepts), new owners and a limit on the money it can commit, as the Zillow Offers record and Veldmark's two declined Valuo uses show.\n- **S5** — For a consumer-facing estimate, the validation the inform tier sets takes the form of written display, label and data-exclusion rules, with labels taken from recorded sales and the label and exclusion rules enforced by the pipeline rather than by policy, and the estimate is launched as an experiment randomized by area.\n- **S6** — Every model runs on one shared path in the sense that it registers in one registry and logs and is monitored to one standard, with registration (owner, tier per consumer, label definition, monitor and cost) a condition of production access; training and serving migrate to the golden path when it is better, so the platform is adopted rather than forced, and model weights are shared only where the task is generic.\n\n## Role in the part\n\nGoverns the models that now make most of the changes the platform measures, by the consequence of their errors. Supports P7-6 of part `part-7`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in scene poses the inventory and Valuo's three requests; the Valuo section answers them after the tiers, platform and documented record have been built; `grouping` in sharing, trade-offs, verticals, failure-modes, ca-view, questions: the book's standard judging sections)\n\nThe scene comes first because its inventory and three requests are the problems the chapter solves. The concepts follow because every later section uses the tiers. The platform comes before the documented record so the reader can place each public account in a part of the platform. The documented record ends on Zillow Offers because its lessons are the rules the Valuo section applies to the commit-tier requests; placed after Valuo, the decline of Hearthly Direct would rest on reasons the reader has not met. Sharing follows Valuo and Motorvane because they are the per-brand models it judges; the judging sections come last because they apply the whole design.\n\n## Introduction\n\n**Hook** (`intriguing_example`): A category predictor arrived with a new insertion flow, a fraud model after a bad quarter, a learning-to-rank model when the search team hired its first data scientist, a price estimate because a competitor had one; a few years later nobody can list them all.\n\n**Bridge:** Architects who know APIs, event streams and search engines see each model as one team's component on that team's stack. → In a marketplace group those models make decisions about listings, buyers and money, so the question is which decisions they make and what platform and governance run them.\n\n**Thesis statement** (KEY POINTS callout (all three bullets) and WHY ARCHITECTS SHOULD CARE callout; p03 states the contrast in Valuo's case.): Classify every model by the decision it makes (inform, order, gate, commit), build the platform first around features, labels and a prediction log, and promote a model up a tier only with a new validation regime, new owners and a capital limit, because an estimate good enough to inform is not good enough to commit.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p04, which lists the sections in order and names the kinds of evidence.):\n\n- Veldmark's 146-model inventory and the three requests for Valuo. *Kept in:* scene.\n- The use cases and the four decision tiers. *Kept in:* concepts.\n- The parts of an ML platform for listings: serving, features, labels and monitoring. *Kept in:* architecture.\n- What marketplaces have documented, up to the Zillow Offers wind-down. *Kept in:* documented.\n- Valuo's pricing hint and the fate of the other two requests. *Kept in:* valuo.\n- Sharing models across brands, trade-offs, vertical differences, failure modes, the Chief Architect's view and questions for a design review. *Kept in:* sharing, trade-offs, verticals, failure-modes, ca-view, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Every listing marketplace above a modest size runs dozens of models that arrived one at a time on whatever stack each team knew, so a few years later the group has more models than anyone can list, training data nobody can reproduce, and a valuation model pulled into decisions it was never validated for. | example: A category predictor with a new insertion flow, a fraud model after a bad quarter, a learning-to-rank model with the first data scientist, a price estimate because a competitor had one. |  |\n| p02 | transition | The chapter turns that accumulation into a portfolio with a platform under it: it builds on data-platform and experimentation, feeds multi-country-platforms, leaves the use cases to the chapters that own them, and owns what they share: the ML platform, the feature store question, model governance and the AVM. | reasoning: Links to data-platform, experimentation, multi-country-platforms, ranking, recommendations, fraud-prevention, normalization-and-enrichment and ai-in-listing-systems. | `problem_solution`: An accumulation of models nobody planned. → The chapter's answer: a portfolio with a platform under it, and its boundaries. |\n| p03 | claim | The argument runs through one model: Veldmark's Valuo, Hearthly's AVM in France, is asked in 2027 to badge every listing, power a guaranteed offer and feed a bank's mortgage decisions, and the model is the same in all three while the decisions are not. | scenario: Valuo's three requests: a price-position badge, a guaranteed-offer product and a bank's mortgage input. | `example`: The portfolio and the governance the chapter owns. → The single model the argument follows. |\n| p04 | transition | The chapter first sets the scene at Veldmark, then defines the use cases and the four decision tiers, describes the parts of an ML platform for listings, reviews what marketplaces have documented up to the Zillow Offers wind-down, follows Valuo's pricing hint, and closes with sharing models across brands, trade-offs, vertical differences, failure modes, the Chief Architect's view and questions, using engineering posts, filings, research, EU law and the fictional Veldmark as evidence. | reasoning: The section list in order and the evidence types (OLX and Adevinta engineering, Zillow filings and shareholder letter, Uber and Airbnb engineering, ML-systems research, the EU AI Act, Veldmark). | `sequence`: The one model the argument follows. → The order in which the chapter makes the argument. |\n\n## Sections\n\n### Setting the Scene at Veldmark: 146 Models and One Price Badge\n\n**Controlling idea** (`context`, id `scene`): Veldmark's first inventory shows an unowned, unmonitored portfolio, and three requests for the same Valuo model show that the consequence of its error, not the model, differs by use.\n\n**Advances the thesis** (S1, S2, S4): Gives the problem the chapter solves in measured form and the case it follows.\n\n**Transition in:** `example`: The portfolio problem and the one model the argument follows. → Veldmark's inventory and the three requests.\n\n**Order of paragraphs** (`small_to_large`): The inventory comes first because it shows the portfolio problem in numbers; the three requests narrow it to one model; Ingrid's question about each request closes the scene because it is the principle that organizes the rest of the chapter. Placed earlier, the question would have no requests to apply to.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | evidence | Priya Raman's first group model inventory for Veldmark, compiled by asking around, finds 146 production models on four training stacks, 23 without a named owner, 41 without monitoring beyond uptime and 12 that could not be retrained, none of which was known before. | statistic: Monday 20 September 2027, Priya Raman: 146 models (Tradeyard 71, Motorvane 38, Hearthly 29, Keybridge 8); SageMaker, Kubeflow, Vertex AI and Azure ML; 23 ownerless, 41 unmonitored, 12 not reproducible; six weeks to compile. |  |\n| p06 | description (list) | Three requests arrive the same month, all involving Valuo: a pricing-hint badge on every French sale listing, a guaranteed purchase offer at 94% of the estimate, and a French bank's license for mortgage pre-approval. | scenario: Claire Fontaine's badge (below, in line, above); Hearthly Direct at 94% funded by a property-investment partner with a share of resale margin; the bank's license. | `sequence`: The inventory presented that month. → The three requests for one of those models. |\n| p07 | claim | Ingrid asks, before any technology is discussed, who loses money and how much if the estimate is 8% wrong, and because the answers differ (a misled buyer, a partner's balance sheet, a household's mortgage) the chapter is organized around the consequence of error, not the algorithm. | figure: Figure 1: one valuation model feeding a badge, a guaranteed offer and a mortgage input, with the weight of an error growing.; reasoning: The three answers to Ingrid's question. | `cause_effect`: The three requests. → The question that tells them apart. |\n\n### Concepts: Use Cases, Decision Tiers and the Platform\n\n**Controlling idea** (`definition`, id `concepts`): A marketplace's models are classified by the decision each makes into four tiers that set governance and attach to uses, and the common use cases fall mostly into the gate and order tiers.\n\n**Advances the thesis** (S1, S2): Defines the vocabulary and the tiers every later section uses.\n\n**Transition in:** `cause_effect`: Ingrid's question: the consequence of error organizes the chapter. → The terms and the tiers that express consequence.\n\n**Order of paragraphs** (`prerequisite_order`): The terms come first because the tiers and the portfolio use them; the tiers come before their three properties, and both before the portfolio table, which assigns a tier to each use case; public evidence on concentration closes the section. Placed before the tiers, the portfolio table would have no tier column to read.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | definition (list) | The chapter's terms are ML capability, model (with its lineage), ML platform, feature store, training-serving skew, drift, automated valuation model and model governance. | source: Uber Engineering 2017 on Michelangelo as the reference feature-store account (online features in Cassandra, same pipelines for training and serving). |  |\n| p09 | claim | A model's governance follows the decision it makes, and the chapter sorts those decisions into four tiers (inform, order, gate, commit), each with its own examples, bearer of error and required governance. | table: Tier table: what the model does, marketplace examples, who bears the error, governance it needs (P2B transparency for order, DSA statements of reasons for gate, capital limits and independent review for commit). | `sequence`: The terms, including model governance. → The classification that sets governance. |\n| p10 | explanation (list) | Three properties of the tiers matter: they attach to uses rather than models, moving up a tier is a new launch, and gate models erase the evidence for their own labels unless passed and blocked items are sampled. | example: Valuo is inform on a listing page and commit inside a purchase offer; a moderation model that rejects a listing removes the evidence of whether it was right. | `elaboration`: The four tiers. → What follows from them. |\n| p11 | description | The common ML use cases of listing marketplaces map to a lifecycle stage, a tier, a serving mode, a label source and an owning chapter, and labels are listed because a classifieds marketplace often never sees the sale. | table: Portfolio table: category prediction, attribute extraction, image classification, duplicate detection, moderation and fraud, ranking, recommendations, query understanding, price estimation, AVM, lead scoring, demand insight. | `example`: Tiers attach to uses. → The common uses, each with its tier. |\n| p12 | evidence | Public evidence shows such portfolios are concentrated in trust and safety and in search and recommendations, which matches Veldmark's inventory: 58 of 146 models are gate-tier and 39 order-tier. | quotation: OLX Tech 2020: 'more than 40 machine learning services'; 'more than half of the models we use in production are in the trust and safety and search and recommendations areas' (may be superseded).; statistic: Veldmark: 58 gate-tier trust-and-safety models, 39 order-tier search and recommendation models. | `additional_support`: The portfolio table. → How concentrated real portfolios are. |\n\n### Architecture: What an ML Platform for Listings Contains\n\n**Controlling idea** (`explanation`, id `architecture`): An ML platform for listings has seven parts, and the listing-specific design lies in event-triggered scoring stored on the listing, a conditional feature store, labels from proxies with known biases, and monitors for four listing-specific drift sources.\n\n**Advances the thesis** (S3): Specifies the platform and its hard parts.\n\n**Transition in:** `sequence`: The use cases and tiers. → The platform that runs them.\n\n**Order of paragraphs** (`large_to_small`): The seven parts come first so each subsection can name its part; serving comes next because it decides whether features must be online; the feature store follows because it depends on that answer; labels follow features because a model needs both; monitoring comes last because it watches features, labels and predictions together. Reversed, the feature-store rule would come before the reader knows most models are scored on events.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p13 | description (list) | The platform has seven parts (data access, training orchestration, model registry, serving, features, labels, and the prediction log with monitoring), and the last three are where listing marketplaces need specific design. | figure: Figure 2: the listing-specific parts are label pipelines, shared feature definitions and the prediction log. |  |\n| p14 | claim | Because a listing changes rarely compared with how often it is viewed, batch or event-triggered scoring with the result stored on the listing is the default serving mode for most listing-level models. | example: A Tradeyard listing published once, edited a few times and viewed hundreds of times; rescoring on ListingUpdated.; table: Serving modes: batch, event-triggered asynchronous, synchronous endpoint, in-engine scoring; when each fits, examples and main risk. | `elaboration`: Serving as one of the seven parts. → Which serving mode most listing models need. |\n| p15 | example | Zillow's 2020 floor-plan detection shows the event-triggered mode in practice: inference attached to the media lifecycle as batch jobs, chosen because a live endpoint took far longer to create. | source: Zillow Tech Hub 2020: panoramas land in storage, a workflow launches batch-transform jobs for window and door detection; endpoint about ten minutes to create versus a one-to-two-minute batch start (current state not public). | `example`: Event-triggered scoring as the default. → A documented case of it. |\n| p16 | example | In-engine scoring is the documented pattern for ranking, and the platform's job there is to keep the model's features fresh in the index and its version in the registry. | source: OLX Tech 2022: LambdaMART trained with XGBoost, run inside Solr's learning-to-rank plugin, some features 'refreshed periodically (e.g. CTR)' (current setup may differ). | `additional_support`: The event-triggered mode. → The in-engine mode for ranking. |\n| p17 | claim | Feature stores are the most oversold part of ML platforms in this industry: no classifieds company has documented one, and the documented platforms work without one or with stores under another name. | source: Adevinta Tech Blog 2024 (Kubeflow, MLflow, no feature store); OLX Tech 2025 (ScyllaDB and DynamoDB as an online store without the name). | `contrast`: Serving modes that read scores stored on the listing. → The feature store, usually assumed necessary. |\n| p18 | explanation | Many listing models need no feature store because their features are intrinsic to the listing, and a store pays only for aggregated behavioral features shared by several models and, almost always, for real-time behavioral features. | table: Feature kinds: listing-intrinsic, aggregated behavioral (batch), real-time behavioral (streaming); where each lives without a store and when a store pays. | `cause_effect`: No classifieds feature store is documented. → Why many listing models do not need one. |\n| p19 | recommendation | The rule is to build or buy an online feature store when real-time behavioral features drive a gate-tier or order-tier model, and until then to standardize feature definitions in the lakehouse and log features at prediction time, which solves training-serving skew. | source: Airbnb's Chronon README: features defined once, point-in-time-correct backfills, consistency job comparing backfills with logged fetches. | `conclusion_summary`: The three feature kinds. → The rule that follows from them. |\n| p20 | explanation (list) | A classifieds marketplace usually never sees the sale, so its labels come from proxies (contacts, delisting, moderator decisions, registered transaction prices), each with its own bias. | quotation: OLX Tech 2022: ranking trained on purchases 'or messages/calls to sellers' because 'transactions aren't always confirmed'.; example: Delisting after contact as a sale proxy; the 'mark as sold' button; moderators blind to what they did not see; DVF lagging the market by months. | `sequence`: Features, the inputs a model needs. → Labels, the outcomes it learns from. |\n| p21 | claim | The label pipeline is a product with an owner, a definition and a delay, because choosing the label is choosing what the marketplace optimizes, which is the mechanism behind Vanity Liquidity. | reasoning: A ranking model trained on clicks learns to produce clicks. | `cause_effect`: Every label is a biased proxy. → Why the label pipeline needs an owner and a contract. |\n| p22 | explanation (list) | Beyond generic drift, listing marketplaces have four drift sources that need explicit monitors: taxonomy and schema changes, seasonality and market shifts, adversarial drift and feedback loops. | scenario: Tradeyard's bikes split on Monday 1 November 2027 gives every category-using model a new value.; quotation: Sculley et al., NeurIPS 2015: 'hidden feedback loops' and 'undeclared consumers'. | `sequence`: Labels, the last input to training. → Monitoring what changes after deployment. |\n\n### What Marketplaces Have Documented\n\n**Controlling idea** (`evidence`, id `documented`): The public record shows group platforms built around one way of registering, deploying and observing models, valuation offered as a product with measured error, and in Zillow Offers the documented cost of using an estimate to commit money.\n\n**Advances the thesis** (S3, S4, S6): Grounds the platform and the commit-tier rule in dated public evidence.\n\n**Transition in:** `contrast`: The platform as designed in this chapter. → What marketplaces have actually published.\n\n**Order of paragraphs** (`grouping`): Platform evidence (Adevinta, OLX) comes first because it builds on the architecture just described; pricing and valuation evidence follows, price guidance outside property before property valuation so that the published error figures lead straight into the Zillow case, ending on the Zillow Offers case because its lessons set up the Valuo decisions in the next section. Placed before the valuation evidence, the Zillow case would lack the on-market and off-market error figures its lessons rely on.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p23 | context | The public record on marketplace ML platforms is thin and uneven: Adevinta and OLX publish the most, Zillow, Rightmove and the motor portals publish outcomes but little about how, so the evidence is dated. |  |  |\n| p24 | evidence | Adevinta's golden path shows that a group platform means one way of registering, deploying and observing models, not one serving runtime. | quotation: Adevinta Tech Blog 2024: Kubeflow Pipelines, MLflow, a project template and CLI; 'Do not hide external tools'; 'Use it quickly first, learn it progressively later'.; statistic: Adevinta 2023: GPU serving with scale-up under three minutes; OCR service at 330 million requests a month, about twelve times cheaper than the external API. | `example`: The record is thin. → The richest account, Adevinta's. |\n| p25 | evidence | OLX consolidated its ranking models into one repository with per-brand configuration and built its other models on a shared set of tools, while choosing team ownership over runtime efficiency for recommendations. | quotation: OLX Tech 2025: 'duplicated efforts'; 'all LTR projects within a single repository' with hierarchical configuration per brand; 2023 MLflow, FrejaML, Airflow; 2025 recommendations p99 under 10 ms. | `additional_support`: Adevinta's group platform. → OLX's consolidation of ranking models. |\n| p26 | evidence | OLX's embedding-model selection shows that offline evaluation is necessary and never sufficient for order-tier models. | quotation: OLX Tech 2025: filtered leaderboards, own offline set, fine-tuned winner, lost the first A/B test because it ignored location and price; 'similarity is not relevance'. | `additional_support`: OLX's platform pieces. → OLX's model-selection discipline. |\n| p28 | evidence | Pricing guidance outside property is documented by OLX for Otomoto and by Airbnb, while motor-portal price ratings are undocumented, so the chapter offers a labeled reference architecture. | source: OLX Tech 2020 (Otomoto price range); KDD 2018 Airbnb three-stage pricing; mobile.de, AutoScout24, Auto Trader UK methodology not public. | `contrast`: OLX's platform and model-selection evidence. → Price guidance products in goods, vehicles and stays, where the method is published or not. |\n| p27 | evidence | Valuation is sold as a product with a measured error that is much lower for listed homes, because the model sees the asking price, and listing licenses now govern training as well as display. | statistic: Zillow FY2025 10-K: Zestimate 'our patented proprietary automated valuation model', 2025 median error 1.8% listed and 7.2% off-market; risk of limits on licensed data 'such as model training'. Meilleurs Agents: self-reported 6% median error for 2021. | `contrast`: Price guidance outside property, whose accuracy is unpublished. → Property valuation, where the error is published. |\n| p29 | evidence | Zillow wound down Zillow Offers in November 2021 after it could not forecast home prices, with a $304.4 million inventory write-down and about a 25% workforce reduction. | quotation: Zillow 8-K and shareholder letter, 2 November 2021: 'wind down Zillow Offers operations'; 'home pricing unpredictability, capacity constraints and other operational challenges'; '$304.4 million write-down of inventory'; 'unable to accurately forecast future home prices at different times in both directions'; 'too risky, too volatile'; 'only about 10% of the serious sellers'. | `emphasis`: Valuation as a product that informs. → The documented case of valuation used to commit. |\n| p30 | analysis (list) | Four architectural lessons follow, as the author's interpretation: the forward forecast was the binding problem, selection makes error one-sided, operational capacity couples to model error, and the commit tier needs its own validation regime. | figure: Figure 3: owners accept overvalued offers and decline the rest. | `cause_effect`: The documented Zillow Offers facts. → The lessons drawn from them, labeled as interpretation. |\n\n### In Practice: Valuo and the Pricing Hint\n\n**Controlling idea** (`example`, id `valuo`): Valuo's pricing hint ships as an inform-tier use under written rules enforced by the pipeline, while the guaranteed offer is declined and the lender license sent to review under the AI Act's postponed dates, and Motorvane's price rating shows an undeclared consumer moving a model up a tier.\n\n**Advances the thesis** (S2, S4, S5): Applies tiers, platform and the commit rule to the three requests from the scene.\n\n**Transition in:** `problem_solution`: The Zillow Offers lessons and the platform design. → How Veldmark answers the three requests from the scene.\n\n**Order of paragraphs** (`problem_solution`): Valuo's metrics come first because every rule uses them; the Lyon apartment shows one badge before the rules generalize it; the rules come before their enforcement and launch; the two declined uses follow the badge because they are judged against what the badge's validation does not cover, and the regulation note follows the lender license because that decision rests on its dates and scope; Motorvane closes as a second vertical showing tier creep through an undeclared consumer. Placed before the badge, the declined uses would have no validated use to contrast with.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p31 | description | Valuo estimates French residential values from DVF transactions and Hearthly listings, rescored weekly and on listing events, with a median absolute error of 7.4% off-market and 2.3% for listed properties and an 80% prediction interval on every estimate. | statistic: October 2027 back-test: 7.4% off-market, 2.3% listed; 80% intervals; Google Cloud stack. |  |\n| p32 | example | For the canonical Lyon apartment, the €389,000 asking price falls inside Valuo's €372,000 to €401,000 interval, so the badge reads in line with the estimate. | scenario: Three-room 68 m² flat in Lyon 7e, class D, listed May 2027 by three agencies clustered into one property; interval width €29,000, 7.5% of the €386,500 midpoint. | `example`: Valuo's interval. → One listing's badge. |\n| p33 | description | Before anyone builds the badge, the forum turns it into eight rules covering when to show it, thresholds, coverage, explanation, labels, data exclusion, monitoring and owners. | table: Rules of Monday 4 October 2027: interval width at most 12% of midpoint and at least 8 comparable DVF sales within 18 months; thresholds from the interval; about 71% coverage; explanation link; DVF prices only as labels; reject Keybridge-tagged data; weekly error by arrondissement and price band; owners named including Julien Marchand. | `elaboration`: One badge. → The rules that govern every badge. |\n| p34 | analysis | Two of the rules are enforced by the architecture rather than by policy: the Keybridge exclusion as a lineage tag the training pipeline checks, and the label rule, which cuts the feedback loop at its source. | figure: Figure 4: the label rule cuts the loop from asking prices back into training.; figure: Figure 5: the pricing hint as event-triggered inference stored on the listing read model, every score logged with its version. | `emphasis`: The eight rules. → The two that the pipeline enforces. |\n| p35 | process | The badge goes live in Lyon and Bordeaux on Monday 22 November 2027, under the ML platform decision of 9 November 2027 that made one registry and one prediction-log standard mandatory, as an experiment randomized by city district, because a badge on one listing changes how buyers judge its neighbors. | scenario: District randomization in Lyon and Bordeaux.; scenario: The ML platform decision of Tuesday 9 November 2027 (one group model registry and one prediction-log standard mandatory), named here so the launch is told after the decision it ran under; its options are weighed in Trade-offs. | `sequence`: The rules and their enforcement. → The launch. |\n| p36 | analysis | Hearthly Direct is declined because a guaranteed offer is a commit-tier use for which Valuo was never back-tested on resale over a holding period or on the owners who would accept, and the partner's losses would return through the revenue share. | case: Ingrid's written decision record; a referral to an independent buyer that prices its own offers as the only way the idea may return. | `contrast`: The badge, which shipped. → The guaranteed offer, which did not. |\n| p37 | analysis | The lender license, a commit-tier credit input, goes to review because creditworthiness evaluation is high-risk under the AI Act and counsel must decide whether a property estimate falls under it, so the architecture prepares a separate model version with its own model card, segment error report and bias test either way. | quotation: AI Act Annex III: 'AI systems intended to be used to evaluate the creditworthiness of natural persons'; stand-alone obligations from 2 December 2027 after the 2026 amendment; Lucía Ortega's point. | `additional_support`: The declined guaranteed offer. → The second commit-tier request, the lender license. |\n| p44 | evidence | The Digital Omnibus on AI postponed the high-risk obligations to 2 December 2027 for stand-alone systems and 2 August 2028 for embedded ones, and Annex III point 5(b) covers creditworthiness except fraud detection, to be checked with counsel. | source: Regulation (EU) 2026/1744, published 24 July 2026; European Parliament Legislative Train, September 2026; AI Act Annex III. | `elaboration`: The lender paragraph's AI Act creditworthiness rule and its 2 December 2027 date. → The regulation behind the date and its scope. |\n| p38 | example | Motorvane's market-value model shows the same pattern in vehicles: it is inform-tier for buyers but order-tier in practice because ranking uses the rating as a feature, an undeclared consumer that moves a model up a tier without anyone deciding it. | scenario: Essen Golf: €22,800 rating against €21,900 on Wednesday 14 April 2027; cut to €21,400 on Thursday 22 April, received in that day's 17:00 DMS snapshot, whose import triggers the rescore; alerts to 1,180 watchers. | `similarity`: Valuo's three uses, each decided by its tier, ending with the regulation behind the lender review. → A vehicle model, earlier in 2027, whose second use nobody decided. |\n\n### Shared, Per-Brand or Per-Market Models\n\n**Controlling idea** (`recommendation`, id `sharing`): A group decides model by model whether to share it, sharing the platform and registry everywhere and models only where the task is generic.\n\n**Advances the thesis** (S6): Sets the sharing rule for models across brands.\n\n**Transition in:** `sequence`: Valuo and Motorvane, two per-brand models in different verticals. → Whether a group should share models across brands.\n\n**Order of paragraphs** (`comparison`): The four options, whose table places Valuo and the vehicle price rating as per-brand models, come before the rule that chooses among them; stated first, the rule would name choices the reader has not seen.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p39 | comparison | A group has to decide model by model whether to share it, choosing among one shared model, a shared model with per-market configuration, a per-brand model on the shared platform and a per-brand model on a local stack. | table: Options with when each fits, examples (image quality; OLX ranking per brand; AVM and price rating; Valuo on Vertex AI) and main risk. |  |\n| p40 | recommendation | The rule for Veldmark is to share the platform and the registry everywhere, share models where the task is generic, and never force a vertical model onto a shared code base, because vertical models look for different things. | example: Tradeyard's payment-link phishing and Hearthly's fake rentals: share features, label infrastructure and monitoring, not weights. | `conclusion_summary`: The four options. → The rule that chooses among them. |\n\n### Trade-offs\n\n**Controlling idea** (`comparison`, id `trade-offs`): Veldmark chooses a hybrid platform, registry and monitoring first and migration later, builds what differentiates and buys commodity models, and controls cost through architecture.\n\n**Advances the thesis** (S6, S3): Weighs platform strategies, build or buy, and cost.\n\n**Transition in:** `elaboration`: Sharing decided model by model. → The platform strategy that sharing runs on, and its costs.\n\n**Order of paragraphs** (`grouping`): Platform strategy first because it frames build-or-buy per capability; cost last because the controls it names (events, stored scores, retirement, cost in the registry) depend on both; placed first, the cost controls would refer to a registry and serving choices not yet decided.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p41 | recommendation | Of the platform strategies, Veldmark chooses the hybrid: one mandatory registry and monitoring standard over heterogeneous training and serving, because registration first and migration later avoids The Forced Fit; capabilities are then built where they differentiate and bought where they are commodity. | table: Platform strategy table: managed suite per brand, one suite group-wide, open-source golden path, hybrid.; scenario: Decision of Tuesday 9 November 2027: MLflow registry and prediction-log standard mandatory; AWS golden path for Tradeyard and Motorvane; Hearthly keeps Vertex AI, Keybridge Azure ML.; table: Build or buy per capability: ranking, AVM and price rating, OCR and vision, fraud scoring, text extraction. |  |\n| p42 | explanation | ML cost is dominated by GPU work, repeated rescoring and unused models, and at Veldmark about €11.2 million a year, so the effective controls are architectural, including showing each model's cost next to its owner. | statistic: €11.2 million a year in 2027, about €3.1 million image inference. | `additional_support`: Platform and build-or-buy choices. → What ML costs and how to control it. |\n\n### Vertical Differences\n\n**Controlling idea** (`comparison`, id `verticals`): Verticals differ in their highest-consequence models, label quality and regulatory exposure, and Veldmark's jobs models are high-risk under the AI Act.\n\n**Advances the thesis** (S2, S4): Shows where tiers and regulation bite per vertical.\n\n**Transition in:** `sequence`: Group-wide platform and cost decisions. → How the verticals differ.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p43 | analysis | The jobs row matters for Veldmark because any model in Tradeyard's small jobs sections that ranks candidates or filters applications is high-risk under the AI Act from 2 December 2027, so the cheapest option may be not to build one. | table: Vertical table: highest-consequence models, label quality, inputs, price model use, regulatory exposure (Annex III jobs quote), data rights.; scenario: Tradeyard's jobs sections in Poland and Portugal. |  |\n\n### Failure Modes\n\n**Controlling idea** (`analysis`, id `failure-modes`): The common failures are a missing inventory, undeclared consumers, tier creep, training on one's own influence, silent taxonomy breaks, gate models without sampled labels, monitoring the service instead of the model, licensed data in the wrong pipeline, and a platform built before demand.\n\n**Advances the thesis** (S1, S2, S3, S4, S6): Names each failure the design prevents.\n\n**Transition in:** `conclusion_summary`: The design and its trade-offs. → What goes wrong without it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p45 | analysis (list) | Each failure mode is a missing part of the design, from the model nobody can list to a platform built before demand. | example: Priya's 23 ownerless models as Set-and-Forget AI; Zillow Offers as tier creep; the Keybridge commitment as the casualty of untracked lineage. |  |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `ca-view`): The Chief Architect owns the inventory and the tier rules rather than the models, turns tiers into gates, assigns label ownership, funds the platform by adoption and treats promotion to commit as a board-level decision.\n\n**Advances the thesis** (S2, S4, S6): Turns the chapter into the Chief Architect's decisions.\n\n**Transition in:** `problem_solution`: The failure modes. → The decisions that prevent them.\n\n**Order of paragraphs** (`prerequisite_order`): Registration comes first because every other control needs the inventory; tier gates next, then the lifecycle that applies them; label ownership, funding and tier promotion follow; the indicators close because they watch all of the above; listed earlier, they would measure decisions the reader has not yet seen.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p46 | recommendation | The group architect owns the rule that every production model is registered with an owner, a tier per consumer, a label definition, a monitor and a cost, enforced at Veldmark by withdrawing production credentials after a deadline. | scenario: Registration a condition of production access on 9 November 2027; deadline 31 March 2028 for the 146 existing models. |  |\n| p47 | recommendation | Governance scales with the tier, not with the model's sophistication, and the tiers translate into concrete gates documented with model cards. | example: A gradient-boosted badge needs light review; a simple rule that suspends accounts needs a heavy one; gates per tier.; source: Mitchell et al., 2018, model cards. | `sequence`: Registration. → What each tier's registration requires. |\n| p48 | process | The registry enforces the same lifecycle for every model, with the tier deciding how heavy each gate is and a drift alert sending a production model back to shadow. | figure: Figure 6: lifecycle states with tier-dependent evidence at each transition. | `elaboration`: Gates per tier. → The lifecycle that applies them. |\n| p49 | recommendation | Label events should be part of the producing teams' published contracts, so a change in how moderators record decisions is reviewed as a change to every model that learns from them. |  | `additional_support`: The model lifecycle. → The labels that feed it, owned by other teams. |\n| p50 | recommendation | The platform is funded as a product measured by adoption, because if adoption stalls the platform is not yet better and a mandate will not fix that. |  | `additional_support`: Label ownership. → How the platform itself is funded and judged. |\n| p51 | recommendation | Promotion up a tier is a board-level decision when money is committed, with the Hearthly Direct record as the template. | case: Hearthly Direct decision record: what the model was validated for, what the new use requires, who absorbs the loss, what limit applies. | `emphasis`: Platform funding. → The most consequential decision: promotion to commit. |\n| p52 | recommendation | The indicators to watch cover ownership, monitoring, logging, speed to production, label delay, cost, segment error for consumer-facing models and realized loss against the limit for commit uses. |  | `conclusion_summary`: The Chief Architect's decisions. → The indicators that show whether they hold. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Ten review questions test whether a group can list its models, knows their labels and consumers, controls feedback, tier creep, licensed data and AI Act exposure, and knows what each model costs.\n\n**Advances the thesis** (S1, S2, S3, S4, S6): Turns the chapter into a design-review checklist.\n\n**Transition in:** `conclusion_summary`: The Chief Architect's decisions. → The questions a review asks.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p53 | recommendation (list) | A design review asks ten questions, from whether every model, owner, consumer and tier can be listed today to which models have no consumer left. |  |  |\n\n## Conclusion: From Models to Many Markets\n\n**Synthesis:** The tier says who bears an error, the platform's labels, prediction log and registry are what let anyone measure that error for each consumer, and promotion to a higher tier is allowed only when that measurement exists for the new use; Valuo shows all three in one model.\n\n**So what:** The expensive errors sit in the uses nobody classified: a group that cannot list its models cannot tell which of them already commit money.\n\n**Callback:** Ingrid's question in the scene (if the estimate is 8% wrong, who loses money, and how much?) and the unplanned portfolio of the opening. The conclusion answers the question for Valuo's three uses with the tier, the platform and the promotion rule.\n\n**Takeaway** (`course_of_action`): Register every model with an owner, a tier per consumer, a label, a monitor and a cost, and promote none to commit without a new validation regime and a limit.\n\n**Hand-off** to [One Platform, Many Marketplaces: Multi-Country and Multi-Brand Architecture](multi-country-platforms.html): `elaboration`: Ml-platform's closing: its table of shared, per-brand and per-market models only touched how one platform serves many markets. → The tenancy model that answers that question for every capability: tenants, configuration, extension points, release rings and exit paths.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p54 | synthesis | The chapter treated models as a portfolio, and its parts add up to one answer to Ingrid's question: the tier says who bears an error, the platform's labels, log and registry let anyone measure it, and promotion waits for that measurement, as Valuo showed with one badge shipped and two commit-tier proposals declined or diverted; it matters because a group that cannot list its models, as Veldmark could not before Priya's inventory, cannot tell which already commit money. | scenario: Ingrid's 8% question; the badge with uncertainty rules, clean label and enforced exclusion; Hearthly Direct declined and the lender license diverted to review. |  |\n| p55 | transition | Generative models reuse this platform and are taken up by ai-in-listing-systems, while the next chapter, multi-country-platforms, takes up the question the sharing table only touched: how one platform serves many countries, brands and verticals without forcing them into one product. |  | `elaboration`: The sharing decision as one part of the answer. → The wider question of one platform for many markets. |\n\n## Non-goals\n\n- Learning-to-rank design and paid-organic blending. See [Ranking for Two Sides: Relevance, Freshness and Paid Visibility](ranking.html).\n- Candidate generation and similar listings. See [Recommendations for Inventory That Disappears](recommendations.html).\n- Risk scoring and fraud signals. See [Scams, Fakes and Account Takeovers: Fraud Prevention for Listings](fraud-prevention.html).\n- Attribute extraction and enrichment pipelines. See [From Raw Supply to Usable Listings: Normalization and Enrichment](normalization-and-enrichment.html).\n- Experiment design and interference. See [Testing a Two-Sided Market: Experimentation Platforms](experimentation.html).\n- Lakehouse, tracking plan and governed metrics. See [Data Platform for Marketplaces: Events, Lakehouse and Data Products](data-platform.html).\n- Generative AI, agents and AI governance beyond models. See [AI Across the Listing Lifecycle](ai-in-listing-systems.html).\n- How one platform serves many countries and brands (tenancy). See [One Platform, Many Marketplaces: Multi-Country and Multi-Brand Architecture](multi-country-platforms.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Whether a property AVM used inside a mortgage decision falls under AI Act Annex III point 5(b) is unresolved; the chapter says so and leaves it to counsel.\n- No classifieds company has publicly documented a feature store; if one appears, update the feature-store section.\n- Motor price-rating methodologies (mobile.de, AutoScout24, Auto Trader UK) remain undocumented; the chapter offers a labeled reference-architecture inference only.\n- Zillow Tech Hub posts are cited via the Medium publication (RSS-read); the individual floor-plan post URL could not be fetched directly.\n\n## Decision log\n\n- **2026-10-19** — Organized the chapter around decision tiers (inform, order, gate, commit) instead of a catalog of algorithms, because governance and validation depend on consequence of error, and Valuo shows one model in three tiers.\n- ** g opening sentence, the Trade-offs opening (split, and the 9 November decision placed before the badge launch), the lifecycle states named in p48 from Figure 6, and 'Earlier' signalling the April date in p38. Intent, thesis and role unchanged.\n- **2026-11-12** — Flow rubric after moving p44 (sound with notes): Sharing flow relabelled comparison, Chief Architect's View flow relabelled prerequisite_order, Vertical Differences left without a section flow. Draft check round 3: ESCALATE (17 pass, 12 fail; one corroborated spec-fault on the 9 versus 22 November order, recorded in open_questions for the author); closing fixes to p17, p38 and p41 applied without another round.\n- **2026-11-12** — Added a roadmap paragraph (p04) to the introduction so the opening predicts the sections (AC-2), and widened the conclusion from one paragraph to two so that it synthesizes, calls back to Ingrid's question and hands off to multi-country-platforms.\n- **2026-11-12** — Escalation resolved under the author's delegation (\"auto resolve all ESCALATE topics\"), 2026-11-12: the 9 versus 22 November order. Of the two options, the Valuo section now mentions the 9 November 2027 ML platform decision in the launch paragraph p35 (controlling idea and evidence updated), and Trade-offs p41 refers back to it ('under which the Valuo badge launched') instead of 'before the badge launch'. No unit moved; the roadmap and the section order are unchanged, so AC-2's expected answer needs no edit.\n- **2026-11-12** — Timeline correction (rule: figures follow the ledger), 2026-11-12: the Essen Golf's price cut of Thursday 22 April 2027 no longer triggers the rescore through a `ListingUpdated` event, which the ledger dates to Listing event contract v1 live from 1 July 2027 [event-driven-listings]. p38 now has the cut arrive in that day's 17:00 DMS snapshot and its import trigger the rescore, as the [listing-ingestion] Essen Golf feed-timing line states. 'The rating moves up a band' became 'the rating improv onverted spec.md to spec.json (outcome-spec pipeline); spec.md removed. Roadmap paragraph and two-paragraph conclusion added; p28 moved before p27 and the regulation note p44 moved into the Valuo section after the flow rubric and draft check; three draft-check rounds, ending ESCALATE on one spec-fault finding. Status draft. (AI-mediated session)\n- **2026-11-12** — Escalation resolved under the author's delegation: the 9 November 2027 platform decision named in the Valuo launch paragraph; the April Golf rescore runs through the DMS snapshot import; minor reader points fixed; max_words 7,700; draft check round 4. (AI-mediated session)\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {

            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }

            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');

                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);

                if (sectionEl.firstChild) {

        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
