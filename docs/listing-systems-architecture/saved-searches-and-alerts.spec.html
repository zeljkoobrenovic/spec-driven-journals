<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, acceptance criteria AC-1 to AC-4, the thesis and the role are copied unchanged from the saved-searches-and-alerts entry in journal-spec.json; the conclusion realises Part IV's closing (synthesis, so-what, callback, takeaway) from the same file, and the hand-off uses Part V's transition_in. Units added by this conversion: the roadmap paragraph p04 and two conclusion paragraphs.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Saved searches as persisted, normalized queries with an owner, a notification policy and a lifecycle; percolation versus batch re-querying; alert fan-out with deduplication, quotas and bursts.\n- **Know:** The rule of notifying on entering the match set, send-time re-checks for digests, the alert metrics (latency, alert-to-contact, ghost-alert, unsubscribe and dormant rates), the risk gate in front of the matcher, saved-search migration through taxonomy changes, and consent and retention.\n- **Believe:** Alerts are a liquidity lever and a trust surface at once: they shorten time to contact and amplify whatever they carry, fraud included.\n- **Believe:** A saved search is user data that must survive taxonomy changes and model upgrades, and alerts are judged by contacts, never by sends.\n- **Be able to:** Size a matcher by candidates per event and choose between percolation and re-querying for a latency target.\n- **Be able to:** Design the saved-search service, notification orchestrator, risk gate and migration plan for a group, and put any widening of saved-search semantics through capacity review.\n\n**Audience:** Chief architects, search and platform leads, notification and CRM engineering leads, and product directors of classifieds, property and automotive marketplaces.\n\n**Already knows:**\n\n- APIs, databases, event streams, search engines, messaging infrastructure and Kubernetes (the book's baseline).\n- From earlier chapters: the listing aggregate and its events, the event-driven listing stream, the publication pipeline and what 'searchable' means, the taxonomy and attribute dictionary, entity resolution and canonical properties, the search architecture and search contract, query understanding, ranking, recommendations and the status read model, and map-search's geo query compiler, drawn polygons and isochrones.\n- Veldmark, its brands and cast, Common Ground, Yardstick, Safe Deal, Femke's bike, the Essen Golf, the Lyon apartment, and the failure-pattern names.\n\n**Does not yet know:**\n\n- Saved search, percolation and alert fan-out as this chapter defines them; the match set, the entry/exit rule and the match ledger.\n- Percolator constraints, candidate selection, Lucene monitor and Vespa predicate fields.\n- Provider quotas, mail sender rules, one-click unsubscribe and the ePrivacy question for alerts.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a cron-based alert system with stale digests and a fraud wave carried by alerts, the reader states the target design and its metrics. *Probe:* Your instant alerts run as a ten-minute cron job with a 23-minute p95 on Sunday evenings; digests assembled in the afternoon still advertise listings sold that evening; and a wave of fake rentals reached tens of thousands of renters through alerts before takedown. Using only this chapter: what do you build, and how do you know it works? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-4 | The chapter's last section performs the part's closing: it shows how the six surfaces fit together, answers the part opening's three questions for discovery as a whole and hands off to Part V through the risk alerts carry. | `conclusion_calls_back_to_introduction` | rubric | major |\n\n## Thesis\n\n**Question:** How do you notify millions of users within minutes when a matching listing appears?\n\n> **Claim:** Saved searches should be a system of record of normalized queries, in the same format as the search API and the geo query compiler, from which percolator indices are rebuilt; every new or changed listing is matched against them as reverse search, and an alert fires only when a listing enters a match set and passes a risk gate owned by trust and safety, with a send-time re-check for anything delivered later than it was computed and a match ledger that survives taxonomy migrations; and the service is held to latency (5 minutes p95 from searchable to provider at Veldmark), alert-to-contact and ghost-alert targets, not to the number of alerts sent.\n\n**Disputed by:** The common practice of running alerts as a periodic cron job that re-queries recent listings against saved searches in a relational table, assembling digests hours before they are sent, counting notifications sent as success, and dropping or resetting saved searches when the taxonomy changes.\n\n**So what:** A Chief Architect who accepts this makes the saved-search store, matcher, notification orchestrator and consent policy group platforms while brands keep alert content and design, reports alert latency and ghost-alert rate weekly as platform SLOs, puts every widening of saved-search semantics through capacity review, makes saved-search migration part of every taxonomy and gazetteer change, and lets trust and safety govern alertability as a derived listing state.\n\n**How and why:** Femke's €240 bike matched 312 saved searches and drew its first contact from an alert seven minutes after it became searchable, yet 214 digest e-mails assembled from a replica at 17:30 still featured it at 07:00 after its sale; Tradeyard's ten-minute cron ran at a 23-minute p95 on Sunday evenings and about 4% of digest items were no longer available. Matching is costly by candidates per event, not by events: at a peak of 80 events per second and 50,000 candidates each the percolator evaluates up to 4 million stored queries per second, which dormancy pausing and place pre-filters reduce. And 180 fake Eixample rentals produced about 41,000 alerts and about €71,000 in losses before takedown, which is why risky listings stay not alertable until a review clears them.\n\n**Supporting claims**\n\n- **S1** — A saved search is a stored, normalized, versioned query with an owner, a notification policy and a lifecycle, kept as personal data in a saved-search store of record in the same format as the search API and the geo query compiler, from which percolator indices are rebuilt.\n- **S2** — Instant alerts at scale need reverse search on the listing event stream, percolation with candidate selection by category and place, because matching costs by candidates per event; batch re-query serves digests and reconciliation only.\n- **S3** — An alert fires only when a listing enters a saved search's match set, a listing that leaves it is retracted, a match ledger deduplicates across channels and time, and anything delivered later than it was computed re-checks availability at send time.\n- **S4** — Fan-out, channels and consent are part of the design: delivery is sized for hot listings and bounded by provider quotas, user attention and mail reputation, its order is a fairness decision, and unsubscribe, push permission and retention are group policy enforced by the orchestrator.\n- **S5** — Alerts are a liquidity lever and a trust surface at once: they are judged on latency, alert-to-contact and ghost-alert rates rather than sends, and a risk gate owned by trust and safety keeps risky listings not alertable until cleared.\n- **S6** — Saved searches outlive the taxonomy and gazetteer, so every reference-data change migrates them, preserving recall, rebuilding percolators in a parallel run and never resetting the match ledger.\n\n## Role in the part\n\nTurns a search into standing demand that reuses every earlier surface, and performs the part's closing: discovery now reaches motivated buyers within minutes, which is why trust must gate it. Supports P4-6 of part `part-4`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in concepts to worked-example: each section uses the vocabulary or component the previous one established (match set, then matching, then the components, then fan-out from the orchestrator, then digests over the channels, then the sizing of that matcher and fan-out); `grouping` in liquidity, risk-gate, taxonomy, consent: four properties of alerts beyond delivery (lever, amplifier, long-lived data, regulated messages))\n\nThe scene states the problem with numbers (a cron job, snapshot digests, a 23-minute p95 against a 5-minute target); the concepts give the words the answer needs; the two ways to match decide the core mechanism; the architecture assembles it and replays the bike; fan-out and channels follow the matches out to the user. Liquidity comes before the risk gate because the gate is the same speed turned against buyers; the taxonomy and consent sections follow because they govern the saved search over its lifetime rather than at the moment of matching. The worked example sizes the matcher and fan-out right after the delivery sections that complete the design, so the reader does not jump back from the legal material to the matcher; trade-offs, vertical differences, failure modes, the Chief Architect's view and questions judge it. Putting the architecture before matching would name percolator projections before the reader knows why percolation wins; putting the risk gate before liquidity would present the amplifier before the speed it amplifies. Fan-out precedes channels because the channel choice and digest rules answer the limits fan-out meets; taxonomy precedes consent because migration keeps the saved search alive, and consent and retention then decide how long it may live and what it may send. The migration from the cron job sits in the Chief Architect's View, beside the decisions it carries out, not under the sizing heading.\n\n## Introduction\n\n**Hook** (`intriguing_example`): \"Tell me when a city bike under €300 appears within 10 km of Rotterdam\", \"a T3 in this polygon in Lyon under €400,000\", \"a Golf from 2019 or later with less than 60,000 km\": the same question asked continuously, about what is listed after the buyer searched.\n\n**Bridge:** The earlier Part IV chapters help a buyer find what is listed at the moment they search, including the area drawn on a map. → Saving the search turns that moment of intent into standing demand and obliges the marketplace to notify the buyer within minutes, across 46 million saved searches at Veldmark.\n\n**Thesis statement** (KEY POINTS callout (three bullets); p02 states that the alert system is only as correct as the systems it joins.): A saved search is a stored, normalized query matched by reverse search against every new or changed listing; alerts fire on entry into the match set, re-check availability at send time, and are judged by contacts rather than sends, with the risk gate, consent rules and caps designed in from the start.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p04, which names the sections in order.):\n\n- Show the problem at Veldmark: Femke's bike, Tradeyard's cron job and the 5-minute target. *Kept in:* scene.\n- Define saved searches, match sets and watchers. *Kept in:* concepts.\n- Compare percolation with batch re-querying. *Kept in:* matching.\n- Propose the target architecture and follow matches through fan-out and channels. *Kept in:* architecture, fan-out, channels.\n- Size the matcher for Veldmark. *Kept in:* worked-example.\n- Treat alerts as a liquidity lever, a fraud amplifier behind a risk gate, and user data that outlives taxonomy changes and obeys consent rules. *Kept in:* liquidity, risk-gate, taxonomy, consent.\n- Close with trade-offs, vertical differences, failure modes, the Chief Architect's view and questions. *Kept in:* trade-offs, verticals, failure-modes, ca-view, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A saved search asks the question of earlier Part IV chapters continuously, covering what is listed after the buyer searched, so saving it turns a moment of intent into standing demand and obliges the marketplace to notify the buyer quickly enough to matter. | example: Three saved searches: a city bike under €300 within 10 km of Rotterdam; a T3 in a drawn polygon in Lyon under €400,000; a Golf from 2019 or later with under 60,000 km. |  |\n| p02 | context | At Veldmark the obligation covers 46 million active saved searches and about 38 million alert notifications a day, and alerts are where the event stream, taxonomy, search platform, trust gate and channels meet, so the alert system is only as correct as the weakest of them. | statistic: 46 million active saved searches; about 38 million alert notifications a day by push and e-mail. | `example`: The marketplace's obligation to notify. → Veldmark's size of that obligation and the systems it depends on. |\n| p03 | definition | The chapter owns three terms, saved search, percolation and alert fan-out, and builds on the chapters that own the engine, the event stream, searchability and drawn areas, while ranking and recommendations use its signals and Part V begins at its risk gate. |  | `elaboration`: The systems alerts depend on. → The terms this chapter owns and the chapters it builds on. |\n| p04 | transition | The chapter moves from Femke's bike and Tradeyard's cron job through the concepts, the two ways to match, the target architecture, fan-out, channels and the sizing of Veldmark's matcher, then treats alerts as a liquidity lever, a fraud amplifier, user data that must outlive taxonomy changes and messages under consent rules, and names trade-offs, vertical differences, failure modes, the Chief Architect's view and questions before closing Part IV. |  | `sequence`: The terms and dependencies. → The order in which the chapter uses them. |\n\n## Sections\n\n### Setting the Scene at Veldmark: 312 Saved Searches and a Ten-Minute Cron\n\n**Controlling idea** (`context`, id `scene`): Tradeyard's alerts are fast by luck and wrong by design: a cron job and a snapshot digest turned a bike's 312 matches into seven-minute pushes and 214 stale e-mails, against a group target of 5 minutes p95.\n\n**Advances the thesis** (S2, S3, S5): Gives the case every later section is tested on: a cron-based matcher, a snapshot digest and a latency target.\n\n**Transition in:** `example`: The obligation and the roadmap. → The case that shows the obligation failing.\n\n**Order of paragraphs** (`chronological`): The bike's Sunday, then Tuesday's digests, then the jobs behind both, then the numbers and the target; the question comes last because it names every problem the scene has shown.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | example | Femke's €240 city bike, searchable at 19:48 on Sunday 7 March 2027, matched 312 saved searches and drew its first contact from an alert seven minutes later. | scenario: Listed 19:42 CET, searchable 19:48 (the six-minute baseline), 312 saved searches matched, first contact 19:55 from an alert, 14 conversations in 24 hours, sold Monday for €225 through Safe Deal, marked sold 18:10, removed from search 18:11. |  |\n| p06 | example | On Tuesday at 07:00, 214 digest e-mails still featured the sold bike because the digest was assembled from a replica at 17:30 on Monday and sent without a re-check. | scenario: 214 digests; three recipients ask whether the bike is still available; candidate list assembled at 17:30 Monday from a read replica of Yardstick and sent thirteen and a half hours later. | `contrast`: The fast alert and the prompt removal from search. → The digest that was not told. |\n| p07 | description (list) | Tradeyard runs alerts as two Yardstick jobs, a ten-minute cron that matches new listings against saved searches in MySQL and a daily digest (a scheduled message collecting a saved search's matches since the last one) that re-runs saved searches against Solr, and the bike's quick push was luck. | scenario: About 2,300 listings per Sunday-evening run; category-and-province index in MySQL plus PHP filters; the bike picked up by the 19:50 run and 312 pushes sent 19:51–19:53; a listing searchable at 19:51 waits until 20:00. | `cause_effect`: The stale digests. → The two jobs that produce both the fast push and the stale digest. |\n| p08 | evidence | Veldmark's 2027 baseline puts numbers on the problem: 46 million saved searches, 38 million notifications a day, a 23-minute p95 on Sunday evenings, about 4% stale digest items and about 38% of saved searches never opened in a year. | table: Baseline table: saved searches by brand (31, 8, 7 million); notifications by channel (22, 14, 2 million); latency median 7 minutes, p95 23 minutes; about 4% stale digest items; about 38% dormant. | `additional_support`: Tradeyard's two jobs. → The group-wide numbers they produce. |\n| p09 | claim | The Common Ground target is an instant alert at the provider within 5 minutes p95 of the listing becoming searchable, in every brand by the end of 2028, which with the 90-second publication target means about six and a half minutes from publish to buyer. | fact: Target agreed with Noor Hassan; 90-second publication target from publication-pipeline. | `contrast`: The 23-minute p95 baseline. → The target that replaces it. |\n| p10 | transition | Ingrid frames the question: how to match every new and changed listing against 46 million stored queries and notify the right people within minutes without spam, ghost or fake alerts, or broken saved searches when the taxonomy changes. |  | `conclusion_summary`: The baseline and the target. → The question the rest of the chapter answers. |\n\n### Concepts: Saved Searches, Match Sets and Alerts\n\n**Controlling idea** (`definition`, id `concepts`): A saved search is a stored query with a contract, alerts are about changes to its match set, and watching one listing is a different subscription with its own rules.\n\n**Advances the thesis** (S1, S3): Defines the four parts of a saved search, the match set and its entry/exit rule, and watchers, which the architecture implements.\n\n**Transition in:** `sequence`: Ingrid's question. → The vocabulary needed to answer it, starting with what a saved search is.\n\n**Order of paragraphs** (`large_to_small`): From the whole saved search to its parts (query, lifecycle, personal data), then to what it matches over time and the rule on that, then to the narrower subscription to one listing and its gaming rule. Watchers come last because their price-drop alerts are defined against the match-set rule.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p11 | definition | A saved search has four parts, query, owner and identity, notification policy and lifecycle, and confusing them causes most alert bugs. | table: Table of the four parts with a Tradeyard NL example: city bikes within 10 km of postcode area 3011 under €300; one iOS device and one e-mail; push instantly, digest at 07:00, quiet 23:00–07:00; created January 2026 on taxonomy version 2026.4. |  |\n| p12 | claim | The query part must be stored in normalized, versioned form, the same intermediate representation the search API and the geo query compiler use, because URLs and engine query strings change with every redesign and engine migration. |  | `elaboration`: The query part. → How it must be stored. |\n| p13 | description | Figure 1 shows the lifecycle of a saved search, in which dormancy and migration are states with owners rather than cleanup scripts. | figure: Figure 1: the saved-search lifecycle (created, opened, matched, paused, dormant, expired, migrated). | `elaboration`: The lifecycle part. → Its states, drawn. |\n| p14 | claim | A saved search is personal data governed by the GDPR, because it says where someone wants to live, what they can afford or what they want to buy. | source: The productscape model's capability 'Saved Search / Alerts' and its data asset kept 'until user deletion or inactivity threshold'. | `elaboration`: The lifecycle's dormancy and expiry states. → Why the lifecycle is a legal matter. |\n| p15 | definition (list) | Alerts are about changes to a saved search's match set, the live alertable listings that satisfy it now, and a listing event can make a listing enter, stay in or leave that set. |  | `sequence`: What a saved search is. → What it matches over time: the match set. |\n| p16 | claim | The design rule is notify on entry, retract on exit, ignore the rest, which needs the listing's previous state for matching and a match ledger for deduplication. | figure: Figure 2: the match set as an enclosure; entering listings ring a bell, changes inside are ignored, leaving listings pull back pending notifications. | `cause_effect`: The three things an event can do to the match set. → The rule that follows and what implementing it requires. |\n| p17 | example (list) | A watcher subscribes to one listing rather than a query, so one price cut on the Essen Golf alerts its 1,180 watchers and newly matches about 640 saved searches. | scenario: Autohaus Ruhrblick cuts a 2021 Golf 1.5 TSI from €21,900 to €21,400 on Thursday 22 April 2027; one PriceChanged event produces price-drop alerts to 1,180 watchers and new-match alerts to about 640 Motorvane saved searches with limits between €21,400 and €21,899. | `contrast`: The match set of a saved search. → Watching a single listing. |\n| p18 | recommendation | Price-drop alerts invite gaming, so a minimum drop and a weekly cap per watcher keep them meaningful. | reasoning: A €10 cut every three days would alert every three days; a 2% minimum and one alert per listing per watcher per week stop it; the Golf's €500 cut is 2.3% and passes. | `cause_effect`: Price-drop alerts to watchers. → How sellers can game them and the rule against it. |\n\n### Two Ways to Match: Percolate or Re-query\n\n**Controlling idea** (`comparison`, id `matching`): At Veldmark's scale instant alerts need percolation with candidate selection by category and place; batch re-query is fast enough only for digests, and a structured matcher trades fidelity for speed.\n\n**Advances the thesis** (S2): Compares the matching options with arithmetic and documented practice, and locates the cost in candidates per event.\n\n**Transition in:** `sequence`: The match set and the entry rule. → How a platform finds which saved searches a listing enters.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The claim first, then the arithmetic against re-query, then percolation and its documented use and constraints, then where its cost lies, then the alternative that trades fidelity; the structured matcher comes last because its weakness is measured against the engine semantics just described.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p19 | claim | At Veldmark's scale instant alerts need percolation; batch re-query is fast enough only for digests. |  |  |\n| p20 | analysis | Batch re-query reuses the engine exactly but costs in proportion to saved searches and is as slow as its interval, so for Tradeyard's 31 million saved searches every five minutes it would need about 100,000 queries a second, three times the group's search peak. | reasoning: 31 million saved searches re-run every five minutes ≈ 100,000 queries per second against a whole-group peak of 31,000. | `sequence`: The claim. → The first option and why it fails for instant alerts. |\n| p21 | explanation | Percolation inverts the problem: listings are submitted against indexed queries, its cost scales with events times candidates, and its latency is per event. | figure: Figure 3: one query against many listings versus one listing against 46 million stored queries. | `contrast`: Batch re-query's cost and latency. → The inverted approach. |\n| p22 | evidence (list) | Property portals document percolation for alerts: Rightmove named percolator-based instant alerts as a priority of its 2014 move to Elasticsearch, and Homegate percolates each new property against a search alert index. | source: Elastic case study on Rightmove (2025, describing 2014); Elastic blog with Homegate (2024-04-29). | `example`: Percolation in principle. → Documented use at portals. |\n| p23 | evidence (list) | Elastic's documentation, which applies to OpenSearch, sets four architectural constraints: the percolator index is coupled to the listing mapping, it must be reindexed and so is a projection, analysis can dominate cost, and some queries are unsupported or fetch stale data. | source: Elastic percolator documentation (n.d.) and OpenSearch percolator field type (n.d.). | `elaboration`: Use at portals. → The engine constraints that shape the architecture. |\n| p24 | cause_effect | The fourth constraint means a percolated saved search that references a stored drawn shape keeps the old shape until it is re-indexed. |  | `cause_effect`: Point 4: data fetched at index time can go stale. → Its consequence for map-search's drawn polygons. |\n| p25 | evidence | Other engines offer the same capability: Lucene's monitor module with a presearcher, and Vespa's predicate fields, whose documentation names saved searches. | source: Apache Lucene monitor package (module from Luwak, Lucene 8.2, 2019); Vespa predicate fields documentation (n.d.). | `similarity`: Elasticsearch and OpenSearch percolators. → The same capability in Lucene and Vespa. |\n| p26 | process (list) | Percolation wins or loses on candidate selection, which at Veldmark partitions indices by brand, country and category and pre-filters stored queries by category, place cells and price band before testing keywords last. |  | `contrast`: Engines that can percolate. → What makes percolation affordable at scale. |\n| p27 | example | For Femke's bike the pre-filter did almost all the work, cutting about 1.9 million saved searches in the partition to about 58,000 candidates and 312 matches. | scenario: NL city-bikes partition ≈ 1.9 million; place pre-filter ≈ 58,000; full test 312 (illustrative). | `example`: The candidate-selection design. → Its effect on the bike. |\n| p28 | comparison | A structured matcher skips the engine and is fast and cheap for browse-shaped searches, but it reimplements search semantics, so every difference becomes an alert that disagrees with the site. | example: Tradeyard's Yardstick cron job is a primitive structured matcher in MySQL and PHP; differences such as how 10 km is measured or how keywords are tokenized. | `contrast`: Percolation in the search engine. → The alternative that leaves the engine. |\n\n### Architecture: A Saved-Search Store with Rebuildable Percolators\n\n**Controlling idea** (`description`, id `architecture`): The target design keeps saved searches in a store of record with percolators as rebuildable projections, gates listings before matching, and gives an orchestrator deduplication, policy and the send-time check.\n\n**Advances the thesis** (S1, S2, S3): Assembles the concepts and the matching choice into components with owners, and replays the bike on them.\n\n**Transition in:** `cause_effect`: Percolation with candidate selection, and its constraint that a percolator index is a projection. → The architecture built on those conclusions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p29 | description | Because percolation with candidate selection gives instant alerts their speed and a percolator index is only a projection, the target architecture in Figure 4 puts a store of record behind the percolators. | figure: Figure 4: saved-search store as system of record, percolator projections, risk gate, matcher, orchestrator with deduplication and send-time check, channel workers, engagement feedback. |  |\n| p30 | description (list) | Eight components divide the work, from the saved-search service as system of record and its rebuildable percolator projections to the matcher, retraction handler, risk gate, orchestrator, channel workers and engagement feedback. | reasoning: A saved search that exists only in a percolator index is Search as System of Record in miniature. | `elaboration`: The figure. → Each component's responsibility. |\n| p31 | recommendation | Matching is a hybrid: percolation for instant alerts and digests built from the match ledger and re-checked at send time, with batch re-query kept as a reconciliation job. |  | `conclusion_summary`: The components. → How they divide matching between channels. |\n| p32 | example | Figure 5 replays Femke's listing on the Common Ground design. | figure: Figure 5: 312 matches become 289 instant pushes, 14 deferred to digests, 9 suppressed as duplicates; the sale retracts the bike from pending digests. | `example`: The hybrid design. → The bike on it. |\n| p33 | analysis | The ledger and the caps decide what each of the 312 matches becomes: nine duplicates suppressed, fourteen deferred to the digest and 289 pushes within seconds. | scenario: Nine users with two overlapping saved searches; fourteen at their evening cap; 289 pushes (illustrative). | `elaboration`: The figure's numbers. → Which mechanism produces each. |\n\n### Fan-out: Hot Listings, Quotas and Bursts\n\n**Controlling idea** (`explanation`, id `fan-out`): Fan-out is sized for the tail of the match distribution and bounded by provider quotas, user attention and mail reputation, and its order is a fairness decision.\n\n**Advances the thesis** (S4): Shows that delivery has its own limits and a policy question, so it belongs in the design.\n\n**Transition in:** `sequence`: The orchestrator and channel workers of the architecture. → What happens when a match becomes thousands of sends.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p34 | claim | Fan-out must be sized for the tail, because some listings match tens of thousands of saved searches, and queues must absorb the burst. | example: A cheap two-room flat in a capital, an underpriced popular car, a new iPhone at half price. |  |\n| p35 | evidence (list) | Three layers of limits shape the design: provider quotas, user attention and mail reputation. | source: Firebase Cloud Messaging quotas (600,000 messages per minute per project; 20-message burst per device refilling every three minutes; 240 per minute and 5,000 per hour per Android device); Gmail sender rules from 1 February 2024 (over 5,000 a day, SPF, DKIM, DMARC, spam rate below 0.30%, one-click unsubscribe); RFC 8058 (2017).; statistic: Veldmark's 22 million pushes a day ≈ 15,000 a minute. | `elaboration`: Sizing for the tail. → The limits the burst meets. |\n| p36 | evidence | At 14 million alert e-mails a day, mail is a system with its own engineering, as leboncoin's move of about 12 million transactional e-mails a day to PowerMTA shows. | source: leboncoin tech blog, 2026-06-03: about 12 million transactional e-mails a day moved from 20 Postfix servers to PowerMTA on AWS. | `example`: Mail reputation. → The scale of mail infrastructure at a comparable marketplace. |\n| p37 | recommendation | The order of a large fan-out decides who gets the viewing, so it should be randomized within the latency target and any paid change to it decided as policy. | reasoning: 40,000 people alerted to the same flat; creation order favours old accounts, database order is arbitrary; a paid early alert is a ranking decision in disguise. | `contrast`: The capacity limits of fan-out. → Its fairness. |\n\n### Channels, Digests and Relevance\n\n**Controlling idea** (`comparison`, id `channels`): Each channel suits a different urgency, digests need retraction and a send-time check, and relevance within alerts is where alerts meet ranking.\n\n**Advances the thesis** (S3, S4): Turns the entry/exit rule into digest requirements and links alerts to ranking.\n\n**Transition in:** `sequence`: Fan-out's decision of who is notified and when. → What each channel is for and how digests stay correct.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p37a | comparison | Once fan-out has decided who is notified and when, each match needs a channel, and push, e-mail, the in-app inbox and SMS each suit a different urgency. | table: Channel table: push (seconds; Android 13 POST_NOTIFICATIONS permission; iOS authorization), e-mail, in-app inbox, SMS and messaging apps. |  |\n| p38 | claim | A digest trades speed for attention, and the bike shows it needs retraction of items that left the match set and a send-time availability check as the safety net, which together bring the 4% stale rate to near zero. |  | `elaboration`: The table's e-mail and overflow rows. → The digest, the channel that trades speed for attention, and what keeps it correct. |\n| p39 | recommendation | Alert relevance is not binary, so items within a digest are ordered by the site's ranking minus paid boosts plus a penalty for seen items, and clear duplicates are suppressed. |  | `elaboration`: Digest correctness. → Digest quality. |\n\n### Worked Example: Sizing the Matcher for Veldmark\n\n**Controlling idea** (`example`, id `worked-example`): Matching at Veldmark is expensive because of candidates per event, not events, and its demand comes from brand decisions while its capacity sits on the shared platform.\n\n**Advances the thesis** (S2): Applies the matching and fan-out design to Veldmark's volumes right after it is described.\n\n**Transition in:** `sequence`: The matching, architecture, fan-out and channel design just described. → Veldmark's numbers run through it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p53 | evidence | Veldmark's alert-relevant event rate is modest, about 14 per second on average and 60–80 at peak. | statistic: About 2.75 million new listings a week (Tradeyard 2.3 million, Motorvane 210,000, Hearthly 240,000) ≈ 4.5 per second; three times that with other events. |  |\n| p54 | analysis | At 80 events a second and 50,000 candidates each the percolator evaluates up to 4 million stored queries a second, so reducing candidates is the cheapest lever; pausing the dormant 38% removes about a third of candidates, less because dormant searches sit less in busy partitions. | reasoning: 80 × 50,000 = 4 million; dormancy removes about a third; finer place pre-filters remove more. | `contrast`: The modest event rate. → The cost of candidates per event. |\n| p55 | analysis | Fan-out averages about 440 notifications a second with bursts of tens of thousands, so queues absorb bursts and the latency target applies to their drain time. | statistic: 38 million notifications a day ≈ 440 per second; Sunday peaks perhaps five times higher. | `sequence`: Matching cost. → Delivery load. |\n| p56 | recommendation | Matching capacity sits in the search platform's budget but its demand comes from brand features, so any widening of saved-search semantics goes through capacity review. |  | `cause_effect`: The sizing. → Who pays and who decides. |\n\n### Alerts as a Liquidity Lever\n\n**Controlling idea** (`claim`, id `liquidity`): Alerts shorten the time from supply to demand on both sides of the market, so they are measured by latency, contacts and ghost alerts, never by sends.\n\n**Advances the thesis** (S5): Establishes the liquidity half of 'lever and trust surface' and the metrics that judge alerts.\n\n**Transition in:** `cause_effect`: The cost of matching and delivering alerts at Veldmark's scale. → What that cost buys: speed, a lever on liquidity.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p40 | claim | Alerts shorten the time from supply appearing to demand responding, which the buyer journey in the productscape model names as the differentiator. | quotation: 'Alert speed is the differentiator: for in-demand local goods the first buyer to message usually wins, so minutes matter'; pains 'alerts after the item is sold' and 'batching or delayed indexing means the alert arrives hours late'. |  |\n| p41 | example | The lever works on both sides: the bike's first contact came from an alert seven minutes after it was searchable, and fast first contacts make private sellers list again. | scenario: First contact 19:55 from an alert. | `elaboration`: The buyer's view. → Both sides of the market. |\n| p42 | evidence | Six metrics measure the lever, led by alert latency and alert-to-contact rate. | table: Alert latency, alert-to-contact rate, saved-search activation, ghost-alert rate, unsubscribe and complaint rates, dormant share, with definitions and reasons. | `cause_effect`: Alerts as a lever. → How to measure it. |\n| p43 | analysis | Alerts sent is deliberately absent, because a system rewarded for sends widens matching and lowers thresholds until users unsubscribe. |  | `contrast`: The six metrics. → The metric left out and why. |\n\n### The Risk Gate: Alerts Amplify Whatever They Carry\n\n**Controlling idea** (`cause_effect`, id `risk-gate`): Because alerts amplify whatever they carry, a risk gate owned by trust and safety must keep risky listings not alertable until cleared, with holds targeted rather than general.\n\n**Advances the thesis** (S5): Establishes the trust half of 'lever and trust surface' and the gate in front of the matcher.\n\n**Transition in:** `contrast`: Alerts as a liquidity lever. → The same speed delivered to a fraudster.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p44 | claim | An alert system is an amplifier that puts a new listing in front of the most motivated buyers within minutes, which is exactly what a scammer wants. |  |  |\n| p45 | evidence | The Barcelona ring's 180 fake rentals produced about 41,000 alert notifications and about €71,000 of losses before takedown. | scenario: July 2027, 26 accounts, 180 listings in Eixample with stolen photos about 35% below market, deposits by bank transfer; 63 people lost about €71,000; about 41,000 alerts, mostly pushes. | `example`: Alerts as an amplifier. → A fraud wave it amplified. |\n| p46 | claim | The design consequence is a risk gate in front of the matcher, owned by trust and safety. | figure: Figure 6: a risk gate stopping a fake rental before the alert amplifier. | `cause_effect`: The fraud wave. → The gate it requires. |\n| p47 | process (list) | The gate makes alertability a derived listing state with a stricter threshold in high-stakes categories, retracts taken-down listings like sales, may send safety notices by policy, and holds new accounts' first listings for minutes. |  | `elaboration`: The gate. → Its four rules. |\n| p48 | counterargument | Every minute of hold costs honest sellers speed, so holds must be targeted by risk and category, measured and reviewed with the brands. |  | `contrast`: The hold rule. → Its cost to honest sellers. |\n\n### Saved Searches Outlive the Taxonomy\n\n**Controlling idea** (`recommendation`, id `taxonomy`): Saved searches outlive the reference data they are written against, so taxonomy and gazetteer changes migrate them, preserving recall and the match ledger.\n\n**Advances the thesis** (S6): Shows the migration plan that keeps saved searches as user data through change.\n\n**Transition in:** `sequence`: Risks at the moment of matching. → A risk over the saved search's lifetime: changing reference data.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p49 | claim | Saved searches outlive the category tree, attribute dictionary, gazetteer and shapes they reference, so they are user data to migrate, not drop. | reasoning: The rule, stated as the book's own: saved searches are user data; migrate them, don't drop them. It originates in the book's listing-data research notes, which readers never see, so the prose does not cite them. |  |\n| p50 | example (list) | Veldmark's bikes split on 1 November 2027 rewrites about 1.3 million saved searches by versioning references, rewriting deterministically, preserving recall on splits, rebuilding percolators in parallel and never resetting the match ledger. | scenario: Bike listings move from 19 country leaves into the canonical bike leaves; about 1.3 million saved searches across four countries; five-step plan. | `example`: The migrate-don't-drop rule. → The bikes split. |\n| p51 | explanation | Place references, drawn polygons and commute searches follow the same pattern, and commute searches store their parameters and recompute the isochrone. |  | `similarity`: Category migration. → Place, polygon and commute migration. |\n\n### Consent, Unsubscribe and Retention\n\n**Controlling idea** (`recommendation`, id `consent`): Alerts sit on a legal boundary that differs by country, so the group sets principles for message classification, unsubscribe, push permission, retention and inference.\n\n**Advances the thesis** (S4): Puts consent and retention into the design as group policy enforced by the orchestrator.\n\n**Transition in:** `sequence`: Saved searches as user data over time. → The legal rules on that data and on the messages it triggers.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p52 | recommendation (list) | Veldmark's Data Protection Officer sets five principles: alerts are service messages until paid content enters them, unsubscribe is one-click and precise, push permission is asked at save time, dormant saved searches are paused and deleted, and saved searches stay out of ad targeting without consent. | source: Article 13 of the ePrivacy Directive 2002/58/EC as amended in 2009; RFC 8058; Gmail rules.; statistic: Pause after 12 months without an opened alert, delete six months later; dormancy pauses about 38% of Tradeyard's saved searches and removes about a third of percolation candidates. |  |\n\n### Trade-offs\n\n**Controlling idea** (`comparison`, id `trade-offs`): Speed trades against safety and attention, so each protective mechanism should be a configurable policy per brand and category, measured against alert-to-contact rate.\n\n**Advances the thesis** (S2, S3, S5): Sets the chapter's choices side by side with when each option fits.\n\n**Transition in:** `conclusion_summary`: The design, its sizing and its policies for liquidity, risk, taxonomy and consent. → Its decisions as options.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p58 | analysis | Every protective mechanism delays some alerts and every speed mechanism adds noise and risk, so each is a policy per brand and category measured against alert-to-contact rate. | table: Seven decisions with two options each: matching, engine, digest content, storage, triggers, fan-out order, risk gate. |  |\n\n### Vertical Differences\n\n**Controlling idea** (`comparison`, id `verticals`): Verticals differ in saved-search shape, speed sensitivity, channels, duplicates, fraud and taxonomy churn, which changes how alerts are tuned.\n\n**Advances the thesis** (S3, S5): Shows how the same design is tuned per vertical, and where it depends on other chapters.\n\n**Transition in:** `contrast`: Trade-offs within one design. → How verticals shift them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p59 | example | The same design is tuned differently per vertical, as the table shows; real-estate alerts go per canonical property, and automotive retractions arrive as late as the dealer feed, which the send-time check cannot see. | table: Vertical table for Tradeyard, Hearthly, Motorvane and jobs across seven dimensions.; scenario: Three agencies list the Lyon apartment in May 2027; the Golf sold on 29 April and the feed reported it 26 hours later. |  |\n\n### Failure Modes\n\n**Controlling idea** (`counterargument`, id `failure-modes`): Ten failure modes show the design's rules broken one at a time.\n\n**Advances the thesis** (S1, S2, S3, S4, S5, S6): Each failure mode is the absence of one rule.\n\n**Transition in:** `contrast`: The design as intended. → How it fails.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p60 | counterargument (list) | Ten failure modes, from snapshot digests and engine-stored saved searches to measuring sends, each name a rule of the design that was skipped. |  |  |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `ca-view`): Saved searches and alerts are a shared platform with brand-owned content, governed by seven decisions with named owners, reached by a market-by-market migration from the cron job, and watched for natural-language saved searches.\n\n**Advances the thesis** (S1, S5, S6): Turns the design into ownership and governance decisions for the group.\n\n**Transition in:** `conclusion_summary`: The design, its options and its failures. → What the Chief Architect decides.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p61 | claim | At group level alerts are a clear case of sharing platforms, not products: the store, matcher, orchestrator, channel workers and policy engine are shared, while content and presentation stay with brands. |  |  |\n| p62 | recommendation (list) | Seven decisions assign owners: the saved-search service to the search platform, one orchestrator to platform engineering, alertability to trust and safety, consent to the DPO, latency and ghost-alert SLOs, migration in taxonomy changes, and paid influence to product and regulatory leads. |  | `elaboration`: The shared platform. → The decisions that make it real. |\n| p57 | process | Veldmark moves off the cron job by running the new matcher in comparison mode from Q4 2027 and taking over market by market as Tradeyard's search leaves Yardstick, finishing in Q4 2028, while Motorvane keeps Elasticsearch percolators but adopts the group service and orchestrator. | scenario: Event stream live 1 July 2027; comparison mode Q4 2027; Portugal first in Q2 2028; Belgium and the Netherlands last; Motorvane's engine until the 2029 review. | `time`: The decisions for the target platform. → How Veldmark gets there from the cron job. |\n| p63 | recommendation | Natural-language saved searches must compile to the same normalized form and be pinned at save time, or alerts will change meaning when the model is upgraded. | source: The Title Report (2023): Zillow natural-language searches can be saved for alerts; Zillow has not published how. | `time`: The decisions and the migration path that carries them out by 2028. → What to watch over the longer term. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Ten questions take the chapter's design into a review of one's own alert system.\n\n**Advances the thesis** (S1, S2, S3, S4, S5, S6): Each question tests one claim against the reader's own systems.\n\n**Transition in:** `sequence`: The Chief Architect's decisions. → Questions that apply them in a review.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p64 | recommendation (list) | Ten questions, from where saved searches are recorded to which metric the alerts team optimizes, take the design into a review. |  |  |\n\n## Conclusion: From Discovery to Trust\n\n**Synthesis:** Alerts use every surface before them (the normalized query of the search contract and the geo query compiler, percolators on the shared search platform, the status read model that recommendations re-read, contact-based measurement from ranking), so Part IV's six chapters make discovery one pipeline in which every surface forgets a sold listing quickly, names who decided the order and is judged by the contacts it produces.\n\n**So what:** Discovery now puts a new listing in front of its most motivated buyers within minutes, which is worth as much to a fraudster as to an honest seller; the speed Part IV builds is safe only behind a risk gate and decisions every surface obeys.\n\n**Callback:** The Part IV opening's three questions (is this listing still available, who decided its position, did it lead to a contact), and this chapter's opening scene of Femke's bike. The reader can now answer the three questions for discovery as a whole, and sees the bike's seven-minute first contact as the speed that also carried the Eixample fake rentals.\n\n**Takeaway** (`broader_implications`): Alerts amplify whatever they carry, as the 180 fake Eixample rentals and their 41,000 alerts showed; Part V begins with trust-and-safety-architecture, which builds the trust platform whose decisions publication, search and alerts must obey.\n\n**Hand-off** to [Part V — TRUST: Keeping the Marketplace Safe](part-5.html): `cause_effect`: Part IV's discovery surfaces, which put a new listing in front of its most motivated buyers within minutes, and saved-searches-and-alerts' closing warning that alerts amplify whatever they carry, as the 180 fake Eixample rentals and their 41,000 alerts showed. → The risk that contact between strangers carries, and the trust platform whose decisions publication, search, alerts and messaging must obey.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p65 | synthesis | The chapter's design (a store of record of normalized queries, rebuildable percolators, entry-only alerts with a send-time re-check, a ledger that survives migrations, judged by latency, contacts and ghost alerts) uses every earlier Part IV surface, so the six chapters together make discovery one pipeline that answers the part's three questions once: the listing stream and status read model say whether a listing is still available, a versioned policy with named owners decides its position, and contacts judge every change. | reasoning: The normalized query of the search contract and the geo query compiler; percolators on the shared search platform; the status read model that recommendations re-read and the send-time check re-reads; contact-based measurement from ranking. |  |\n| p66 | cause_effect | That pipeline now puts a new listing in front of its most motivated buyers within minutes, as it did for Femke's bike, and that speed is worth as much to a fraudster as to an honest seller, so it is safe only behind a risk gate and decisions every surface obeys. | scenario: The bike's first contact seven minutes after it was searchable; the 180 fake Eixample rentals and their about 41,000 alerts. | `cause_effect`: One pipeline that reaches buyers within minutes. → What that speed carries. |\n| p67 | transition | Alerts bring buyers back to listings that are fresh and real, and whether they are real is Part V's work, which begins with trust and safety as a system rather than a queue. |  | `cause_effect`: Speed that is safe only behind trust decisions. → Part V and its first chapter. |\n\n## Non-goals\n\n- Search engine choice, index design and reindexing. See [Search Architecture for Listings: Indices, Freshness and Scale](search-architecture.html).\n- Listing event contract, outbox and ordering. See [Every Change Is an Event: Event-Driven Listing Architecture](event-driven-listings.html).\n- Publication SLA and unpublish propagation in general. See [From Submitted to Searchable: The Publication Pipeline](publication-pipeline.html).\n- Map, polygon and commute query semantics. See [Searching by Place: Map, Polygon and Commute Search](map-search.html).\n- Messaging notifications and lead routing. See [From Interest to Contact: Messaging and Lead Management](messaging-and-leads.html).\n- Fraud detection models; legal details per market. See [Scams, Fakes and Account Takeovers: Fraud Prevention for Listings](fraud-prevention.html), [Rules of the Marketplace: DSA, DAC7 and Vertical Regulation](marketplace-regulation.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- No classifieds operator (Marktplaats, Kleinanzeigen, leboncoin, OLX) has published its alert matching or fan-out design in the sources found; the architecture is labeled as the author's reference design. (Carried over from spec.md.)\n- The REA Group percolation talk could not be read; it is not cited. (Carried over from spec.md.)\n- Whether user-requested alert e-mails count as direct marketing under national ePrivacy implementations is a legal judgement per market; the chapter states Veldmark's policy and does not generalize it. (Carried over from spec.md.)\n- spec.md listed checklist, summary, dialog and comics as unchecked modality boxes; none of those files exists, so modalities is empty.\n- Thesis rubric (2026-11-12, pass with notes; thesis copied from the journal spec, so not acted on): the claim packs
