t rule and the send-time check, because the canonical Ghost Inventory example (the bike's stale digests) is the clearest teaching case and both rules generalize.\n- **2026-10-19** — Recommended a hybrid (percolation for instant alerts, ledger-based digests, batch re-query as reconciliation) over pure batch, with explicit arithmetic, rather than presenting the options as equal.\n- **2026-10-19** — Included the risk gate and fan-out ordering as design topics because alerts amplify fraud and decide who wins scarce listings; both are governance questions for the Chief Architect.\n- **2026-10-19** — Kept the legal section to principles with Veldmark's policy, pointing to the regulation chapter, because the ePrivacy classification differs by member state.\n- **2026-11-12** — Added a roadmap paragraph (p04) so a reader of the opening can predict the sections (AC-2). Rejected: Relying on the IN THIS CHAPTER callout, which names the mechanisms but not the sections.\n- **2026-11-12** — Widened the conclusion from one paragraph to three (synthesis with the callback to Part IV's three questions, so-what with the callback to the bike and the Eixample ring, hand-off) to carry Part IV's closing, as the journal spec requires; 'Questions to Ask' is specified as the last body section. The published two sentences are kept as the hand-off paragraph. Rejected: Putting Part IV's closing in the Chief Architect's View.\n- **2026-11-12** — spec.md's success criteria were inventories (definitions present, three diagrams, tables present, every company claim dated); they are replaced by the journal spec's four outcome criteria, which cover the same ground as reader outcomes (AC-1 the design and its metrics, AC-2 the opening, AC-3 the outline, AC-4 the closing). No post-level criterion was added. Rejected: Carrying the inventory criteria over as they were.\n- **2026-11-12** — Length limit set to the published draft's length plus 5% (7,780 words by check_draft's count, which includes callouts and tables, so 8,169), because spec.md set no limit.\n- **2026-11-12** — Order of sections and paragraphs kept as published after the flow rubric (sound with notes); its notes were addressed by wording, not by moves. Rejected: Moving the channels section's digest argument into the architecture section.; Folding Trade-offs into the Chief Architect's View.\n- **2026-11-12** — After draft check round 2 (two corroborated flow failures at fault in the spec), moved the Worked Example section from after Consent to after Channels, and moved its migration paragraph (p57) into the Chief Architect's View after the decisions list; rewrote the transitions into Worked Example, Alerts as a Liquidity Lever, Trade-offs, p57 and p63, and the roadmap. Intent, thesis, role and the journal spec's criteria unchanged. Rejected: Moving the Risk Gate section next to the Architecture (it would put the amplifier before the speed it amplifies).; Keeping the order and escalating to the author.\n- **2026-11-12** — Round-3 escalation item 1: added a lead-in paragraph p37a ('Once fan-out has decided who is notified and when, each match still needs a channel, and each channel suits a different urgency:') that carries the channel table, so the Channels section no longer opens on a bare table; p38 now carries an elaboration transition from the table to the digest. Resolved accepted under the author's delegation, 2026-11-12. Rejected: Attaching the table to p38 by moving p38's prose above the table (it would define digests before showing the channels).\n- **2026-11-12** — Round-3 escalation item 2: 'The listing-data brief puts the rule simply' became 'The rule is simple'; the published rule text ('saved searches are user data; migrate them, don't drop them') is unchanged, only the attribution to an internal research document readers never meet is dropped. Resolved accepted under the author's delegation, 2026-11-12. Rejected: Keeping the attribution and introducing the brief (it is not part of the book).\n- **2026-11-12** — Round-3 escalation item 3 (minor): the definition of a digest ('a scheduled message that collects matches since the last digest') moved from the Channels section into the scene's description of Tradeyard's digest job (p07), before the architecture reasons about digests; the Channels paragraph now starts 'Digests trade speed for attention'. Resolved accepted under the author's delegation, 2026-11-12. Rejected: Adding a second definition in Concepts.\n- **2026-11-12** — length.max_words raised from 8,169 to 8,200 (+0.4%, within the 10% allowed by the delegation) to make room for the p37a lead-in; no published fact, figure, name, link or the 38% dormancy sentence was cut. accepted under the author's delegation, 2026-11-12. Rejected: Trimming published text to make room.\n- **2026-11-13** — Vertical Differences: added a lead-in saying what the vertical table shows and moved the table after the paragraph, so its point is stated (evidence_is_explained). fixed under the author's delegation (fix-only pass). Rejected: Leaving the table's point to the reader.\n- **2026-11-13** — Architecture p29: opening now states that the architecture follows from percolation with candidate selection and from the percolator index being a projection, hence a store of record (cause_effect transition). fixed under the author's delegation (fix-only pass). Rejected: Pointing at the figure only.\n- **2026-11-13** — Concepts p14: opening links personal data to the dormancy and expiry states of Figure 1; productscape model glossed on first use as the author's working reference model (see [Map What the Marketplace Does Before What Runs It](business-capabilities.html)) and pointed back to in Alerts as a Liquidity Lever (transition and known_before_new). fixed under the author's delegation (fix-only pass). Rejected: Adding productscape to already_knows.\n- **2026-11-13** — Worked example p54 and Consent: one clause explains why pausing 38% of saved searches removes only about a third of candidates (a listing meets only its own partitions' searches; fewer dormant ones sit in busy partitions); Consent points back to it. fixed under the author's delegation (fix-only pass). Rejected: Changing the published 38% or 'about a third'.\n- **2026-11-13** — Chief Architect p57: Transition paragraph labelled per brand (Tradeyard, then Motorvane), Motorvane's Elasticsearch percolators stated as the target rather than implied as current. fixed under the author's delegation (fix-only pass). Rejected: Splitting the paragraph unit.\n- **2026-11-13** — Minor reader findings fixed in wording: 'Tradeyard baseline delay' (Setting the Scene) and the buyer side named in Alerts as a Liquidity Lever p41. fixed under the author's delegation (fix-only pass).\n- **2026-11-13** — length.max_words raised from 8,200 to 8,400 (+2.4%, within 10%) for the glosses and lead-ins; nothing published was cut. fixed under the author's delegation (fix-only pass). Rejected: Trimming published text.\n\n## Sources\n\n- **Internal**\n  - _journals/listing-systems-architecture/journal-spec.json — Intent outcome, acceptance criteria, thesis, role, Part IV's closing and Part V's transition_in.\n  - event-driven-listings, listing-aggregate, publication-pipeline — Event names, the bike's digest timeline, derived alertability. (Carried over from spec.md.)\n  - map-search, location-and-geo, categories-and-taxonomies, entity-resolution, trust-and-safety-architecture, ranking — Drawn areas, geo cells, the bikes split, canonical properties, the risk gate's owner, digest ordering. (Carried over from spec.md.)\n  - _research/brief-search-discovery.md Part 11; _research/productscape-digest.md; _research/scenario-ledger.md — Research, the productscape quotations and every Veldmark figure.\n- **External**\n  - Elastic Rightmove case study (2025); Homegate on Elastic's blog (2024); leboncoin tech blog post on PowerMTA (2026); The Title Report on Zillow (2023) — Documented percolation at portals, mail infrastructure scale, natural-language saved searches.\n  - Elastic and OpenSearch percolator documentation; Lucene monitor; Vespa predicate fields; Firebase quotas; Android notification permission; Gmail sender guidelines; RFC 8058; Directive 2002/58/EC — Engine constraints, provider limits and legal rules.\n\n## Changelog\n\n- **2026-11-12** — Resolved the round-3 escalation under the author's delegation: lead-in p37a for the channel table, internal brief attribution dropped, digest defined in the scene, max_words 8,200. (AI-mediated session)\n- **2026-11-12** — Draft check rounds 1-3 (REVISE, ESCALATE on spec order, ESCALATE on draft); spec order changed after round 2 (logged in decision_log); close-out fixes after round 3 recorded in open_questions. check-report.json is stale against the close-out edits.\n- **2026-11-12** — Order changed after draft check round 2: Worked Example moved after Channels; the migration paragraph moved to the Chief Architect's View. Units p53-p56, p57, p58 and p63 redrafted at their boundaries; flow rubric rerun.\n- **2026-11-12** — Converted spec.md to spec.json (reconstructed from the published index.md); added roadmap paragraph p04 and two conclusion paragraphs to carry Part IV's closing; spec.md removed. (AI-mediated session)\n- **2026-10-21** — Renamed failure patterns to match where-listing-systems-go-wrong. (AI-mediated session)\n- **2026-10-20** — Replaced 3 mermaid diagrams with generated illustrations (figure numbers and captions unchanged; sources archived in _research/mermaid-figures.json); Figure 4 kept attempt 3 with two known differences from the source. (AI-mediated session)\n- **2026-10-20** — Sharpening pass: 7,317 → 7,335 prose words; opening places the chapter after Part IV's find-what-exists chapters and points to part-5; match-set heading renamed; 9 paragraph openings state their point. (AI-mediated session)\n- **2026-10-20** — Architecture heading now names the design (a saved-search store with rebuildable percolators). (AI-mediated session)\n- **2026-10-20** — Cross-chapter consistency sweep: 3 headings aligned with the book's shared section names, glossary terms and source-group structure. (AI-mediated session)\n- **2026-10-19** — Added 3 inline illustrations (article-illustrator); figures renumbered. (AI-mediated session)\n- **2026-10-19** — Editorial review pass: hand-off to part-5, Tradeyard transition aligned with the Yardstick exit plan, baseline labels fixed, leboncoin source linked, acronyms expanded, ePrivacy Art. 13 verified. (AI-mediated session)\n- **2026-10-19** — Initial spec and article. (AI-mediated session)\n- **2026-11-13** — Fix-only pass on the round-5 blocking findings (six majors) and two minors; max_words 8,400. (AI-mediated session)\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
