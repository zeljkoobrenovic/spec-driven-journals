<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, the four acceptance criteria, the thesis and the role are copied unchanged from the case-adevinta entry in journal-spec.json. A roadmap paragraph (p03) and a conclusion section (p62, p63; p63 is the published closing paragraph moved under its own heading) were added.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Adevinta's five dated phases: the Schibsted federation; selective centralization under the 2019 rule (centralize where 'investment requirements are large and the technology is uniform'); absorbing eBay Classifieds (2021–2023); verticals and the 2023 convergence decision; decentralization and break-up (mid-2024 to 2026).\n- **Know:** The layer map of what was shared when, the documented wins (a voluntary Kubernetes platform grown from about 1,500 to more than 4,000 developers, ten experimentation tools reduced to one, shared OCR and media services) and where the public evidence stops (product layers, the fate of the leboncoin–Kleinanzeigen convergence and of SCHIP).\n- **Believe:** Deciding what to share by layer held up; converging product platforms is a separate investment with its own scope and stage gates.\n- **Believe:** When ownership can change, separability is a design requirement reviewed like security.\n- **Be able to:** Apply the two-part test (large investment, uniform technology) to a proposal for a new shared capability.\n- **Be able to:** Ask of each shared capability what a departing tenant takes, what is switched off and what runs twice meanwhile.\n\n**Audience:** Chief and enterprise architects of marketplace groups, platform-engineering leads and engineering directors deciding what to share across marketplaces after acquisitions, or preparing for a possible divestment.\n\n**Already knows:**\n\n- What an API, a database, an event stream, a search engine and Kubernetes are.\n- How to make and defend an architecture decision.\n- Part IX's evidence rules and its first lesson, from part-9.\n- Global components, tenancy and consolidation sequencing, from multi-country-platforms and platform-consolidation.\n\n**Does not yet know:**\n\n- Adevinta's corporate history and its brands.\n- Adevinta-internal names: SCHIP, FIAAS, Houston, Fisher, YAMS, EU5.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a group's proposal to share several capabilities and converge two product platforms, the reader sorts the proposal by layer using Adevinta's dated record and says what the convergence needs before it is funded. *Probe:* A group proposes to share its cloud platform, its experimentation tool, an image-recognition service and, in a second stage, to merge its two largest generalist marketplaces onto one product platform. Its owner is a private-equity fund. Using only this chapter: which parts does Adevinta's record support, what does it say about the merger, and what must every shared part be able to do? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's questions, its evidence and where it ends. *Probe:* After reading only the callouts and the paragraphs before the first heading: what questions will this chapter ask, what kind of evidence will it use, and how will it end? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-4 | Every statement about Adevinta's internal systems that no cited source documents sits in a callout or figure caption labeled as inference, and every company fact outside those labels carries its source and publication year. *Probe:* Is there any sentence outside an `INFERENCE, NOT DOCUMENTED` callout or a labeled figure caption that describes how Adevinta builds or runs a system without a dated source, or a company fact with no source and year? | `custom` | rubric | major |\n\n## Thesis\n\n**Question:** What did Adevinta share across its marketplaces in each phase from the 2019 demerger to the 2025–2026 break-up, at which layer, and what did the sharing cost when its capital strategy changed?\n\n> **Claim:** Adevinta's record supports deciding what to share by layer: its 2019 test, centralize where 'investment requirements are large and the technology is uniform', put infrastructure, data, experimentation and narrow machine-learning services on shared platforms that grew by voluntary adoption, whereas its 2023 decision to turn the leboncoin and Kleinanzeigen platforms into 'a unified global platform' was last reported 'progressing well' in May 2024 and then overtaken by the 2025 move to standalone marketplaces, in which central functions were ramped down, intellectual property was localized and central and local services ran in parallel. Since the record never reports the convergence completed or its savings realized, product-platform convergence needs its own investment case with scope and stage gates; and since a change of owner forced that unwinding, every shared capability must be designed to be separable.\n\n**Disputed by:** The reading that Adevinta's 2025 reversal shows central platforms were a mistake and a group should keep its marketplaces independent; or the opposite reading that the convergence was sound and only the new owners interrupted it, so a group should still aim at one product platform for its generalist marketplaces.\n\n**So what:** A Chief Architect writes the two-part test into the group's architecture principles and makes every proposal for a shared capability answer both halves; measures a platform by how many tenants choose it and funds migration engineers rather than deadlines; requires any product-platform convergence to state its capabilities, markets, stage gates and exit criteria before it is staffed; and reviews every shared capability for separability (one account boundary per tenant, tenant-scoped data with contracts, deployment that runs outside the platform, clear ownership of code and models).\n\n**How and why:** Demerged from Schibsted in April 2019 as a federation of locally built sites, Adevinta adopted a 'centralised strategy to data and analytics' while keeping product autonomy; its Common Platform served about 1,500 engineers in January 2020 and, as SCHIP, more than 4,000 developers in June 2023, with no mandate in the record. It bought eBay Classifieds Group in June 2021, targeting €130–165 million of run-rate cost synergies, and moved most EU5 platforms to AWS in 2023. The convergence decision came the same year; the take-private settled in May 2024; from July 2024 a new operating model 'empowering local marketplaces' ramped down central functions, localized intellectual property and ran central and local services in parallel, and Adevinta Spain was sold to EQT (announced July 2025, completed February 2026). The case is strongest on infrastructure and weakest exactly where the convergence bet was placed, so its completion cannot be judged from the public record.\n\n**Supporting claims**\n\n- **A1** — Adevinta's 2019 rule, centralize where 'investment requirements are large and the technology is uniform', put infrastructure, data, experimentation and narrow machine-learning services on shared platforms that grew by voluntary adoption and harvested local inventions; these are the record's documented wins.\n- **A2** — The 2023 decision to turn the leboncoin and Kleinanzeigen platforms into 'a unified global platform' was last reported 'progressing well' in May 2024 and then overtaken by the 2025 move to standalone marketplaces, so product-platform convergence needs its own investment case with scope and stage gates.\n- **A3** — Under private-equity ownership from 2024, the 2025 move to standalone marketplaces ramped down central functions, localized intellectual property and ran central and local services in parallel: a change of owner forced the unwinding of shared platforms.\n- **A4** — Because a change of owner forced that unwinding, every shared capability must be designed to be separable: one account boundary per tenant, tenant-scoped data with contracts, portable deployment, clear code ownership.\n- **A5** — The record is strongest on infrastructure, data and organization and weakest at the product layer, where the convergence bet was placed: it never reports the convergence completed or its savings realized.\n\n## Role in the part\n\nThe fullest public test of the centralization pendulum: what sharing by layer delivered, what product convergence left unproven, and what a change of owner made shared platforms cost. Supports P9-1, P9-2, P9-5 of part `part-9`.\n\n## Flow\n\n**Pattern:** `chronological` (also `grouping` in layer-map to evidence-stops: cross-phase views (by layer, by inferred architecture, by option, by vertical, by risk, by gap); `problem_solution` in chief-architect to questions: rules from the record, their test against the book and Veldmark, and questions for the reader's group)\n\nReading rules and the timeline come first because every later sentence is a dated fact, a reading or an inference. The five phases run in time order because the case's teaching value is the movement of the shared/local line over time (decision of 2026-10-19); read out of order, the 2025 reversal would have no convergence to reverse. The cross-phase views come only after all five phases, because each one (the layer map, the trade-offs, the verticals) uses facts from every phase; the evidence limits close that group so the rules that follow do not outrun them. The author's rules, the comparison and the questions come last because they apply what the record has shown.\n\n## Introduction\n\n**Hook** (`intriguing_example`): Adevinta changed its platform strategy several times in seven years, in public: demerged from Schibsted in 2019 as a federation of locally built sites, it bought eBay Classifieds Group in 2021, announced in 2023 that two of its largest generalist platforms would become one, and from mid-2024, under new private-equity owners, ramped down central functions, moved capabilities and intellectual property to the marketplaces and sold businesses.\n\n**Bridge:** A Chief Architect deciding what a group of marketplaces should share, under owners who may buy or sell them. → One group ran the whole centralization pendulum and wrote much of it down, so each phase can be asked what was shared, at which layer and what the sharing cost when the strategy changed.\n\n**Thesis statement** (KEY POINTS callout (all three bullets) and paragraph p02.): Share the uniform, expensive layers first, treat product-platform convergence as a separate decision, and design every shared layer so a tenant can leave.\n\n**Roadmap** (Paragraph p03, after the three questions.):\n\n- Set the reading rules and the limits of the evidence. *Kept in:* how-to-read.\n- Give the dated timeline. *Kept in:* timeline.\n- Follow the five phases in order, from the Schibsted federation to the break-up. *Kept in:* phase-1, phase-2, phase-3, phase-4, phase-5.\n- Look across the phases: a layer map, a labeled reference architecture, the trade-offs, the verticals, the failure modes and where the evidence stops. *Kept in:* layer-map, reference-architecture, trade-offs, verticals, failure-modes, evidence-stops.\n- End with the author's decision rules, a comparison with the book's patterns and with Veldmark, and questions to ask. *Kept in:* chief-architect, comparison, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Adevinta ran the whole centralization pendulum in public, from a 2019 federation through a 2021 acquisition and a 2023 convergence decision to a reversal from mid-2024, and its value is that it wrote much of it down. | fact: Demerged from Schibsted 2019; eBay Classifieds Group bought 2021; 2023 announcement that two generalist platforms would become one; from mid-2024 central functions ramped down and businesses sold. |  |\n| p02 | claim | The chapter asks three questions of each phase, what was shared, at which layer and what the sharing cost when the strategy changed, and argues for sharing the uniform layers first, treating product convergence separately and designing every shared layer so a tenant can leave. |  | `elaboration`: A pendulum written down in public. → The questions asked of it and the argument it supports. |\n| p03 | transition | The evidence, Adevinta's reports, releases and engineering blog, is strongest on infrastructure, data and organization and weakest on core product layers, and the chapter reads it through reading rules and a timeline, the five phases, views across them, and the author's rules, a comparison with Veldmark and questions. |  | `sequence`: The three questions and the argument. → The evidence and the route through the chapter. |\n\n## Sections\n\n### How to Read This Case\n\n**Controlling idea** (`definition`, id `how-to-read`): The case keeps documented fact, the author's reading and labeled inference apart, and its evidence is strongest on infrastructure and weakest on the product layer.\n\n**Advances the thesis** (A5): Sets the evidence rules and says where the record is thin before any fact is used.\n\n**Transition in:** `elaboration`: The introduction's promise of a dated public record and its route. → The rules for reading that record and its known limits.\n\n**Order of paragraphs** (`large_to_sm hemselves.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | evidence | The timeline gives each event the date of its cited release or report, with ownership and portfolio as of October 2026, and Figure 1 shows each phase moving the line between shared and local to a different layer. | table: Timeline from leboncoin's 2006 launch through the 2019 demerger, the 2021 eCG acquisition, the 2023 convergence decision, the 2024 take-private, the July 2024 operating model, the 2025 sales and the 3 March 2026 Spanish branch.; figure: Figure 1: each phase moved the line between shared and local to a different layer. |  |\n\n### Phase 1: The Schibsted Federation (Before 2019)\n\n**Controlling idea** (`description`, id `phase-1`): The Schibsted era left a federation of national sites, documented as a portfolio but not as a build, whose most durable shared abstraction was a local invention.\n\n**Advances the thesis** (A1, A5): Shows the starting point the later sharing worked from and where the record is lore.\n\n**Transition in:** `time`: The timeline's first entries. → The phase before the demerger.\n\n**Order of paragraphs** (`chronological`): What is documented about the federation, the author's reading of the copied code base, then FIAAS, the local invention that outlived the era and leads into Phase 2's platform. FIAAS last lets the next section pick it up.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | evidence | The public record documents the Schibsted-era portfolio of national generalist sites but not how it was built; the shared Blocket-derived code base is widely repeated but unverified, so it stays lore. | fact: leboncoin (launched 2006), Subito, InfoJobs, Segundamano; the 2012 Nieman Lab '28 countries on the Blocket platform' could not be retrieved. |  |\n| p09 | analysis | My reading is that a copied starting code base is the classic origin of the Copy-Paste Country, and that the later phases tried to recover the economics copying gave away without losing local autonomy. |  | `cause_effect`: A shared starting code base evolved locally. → What such an origin leads to. |\n| p10 | evidence | Adevinta's most durable shared abstraction, FIAAS, was a local invention at FINN.no, a Schibsted site, promoted to group level once it was open-sourced in the year of the demerger. | fact: FINN's 2017 KubeCon talk: about 350 microservices, 1,200 deployments a week, about 147 lines of Kubernetes configuration replaced by a short file; open-sourced 2019; a 2023 Adevinta post still calls it the 'Golden Path'; FINN.no stayed with Schibsted. | `contrast`: Copying as the origin of duplication. → A shared abstraction that came from one site and spread. |\n\n### Phase 2: Selective Centralization (2019–2020)\n\n**Controlling idea** (`claim`, id `phase-2`): In 2019 Adevinta centralized only where investment was large and technology uniform, and its platform grew under that rule by voluntary adoption.\n\n**Advances the thesis** (A1): States the two-part test and the first documented win under it.\n\n**Transition in:** `time`: The federation that Schibsted left. → The first choices of the listed company.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The rule as stated, the money behind it, the author's reading of it, then the platform built under it, how it was offered and how it grew. The reading needs the quotation; the growth needs the design choices that explain it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p11 | evidence | Adevinta's first annual report, for 2019, centralized data and analytics because there 'investment requirements are large and the technology is uniform', while keeping local autonomy in product and technology. | quotation: \"...we are adopting a centralised strategy to data and analytics. This one area where investment requirements are us on 'five core European markets'. | `contrast`: The scale the deal brought. → The parts removed before integration. |\n| p19 | evidence | The 2023 annual report shows what integration cost, but whether the synergy target was met, and how much came from technology, is not public. | statistic: €69 million eCG integration expenses in 2023; €15 million rebrand of eBay Kleinanzeigen; €22 million verticalization. | `sequence`: The scope that remained. → What integrating it cost. |\n| p20 | transition | The engineering blog documents consolidation at four layers, each followed past 2023 to its last documented state, so some evidence is dated 2024. |  | `contrast`: Unpublished synergy outcomes. → The layers the engineering blog does document. |\n| p21 | evidence | Infrastructure and cloud were consolidated: EU5 onto AWS, SCHIP onto EKS at 2,000+ nodes across 25 marketplaces, and 732 AWS accounts and 425 Google Cloud projects mapped to teams and cost centers. | statistic: 'to a single public cloud vendor' (AWS), Canada to Google Cloud; 30+ clusters (2023), 'over 2,000 Kubernetes nodes' in 30 clusters 'across 25 marketplaces' (2024); 732 AWS accounts, 425 Google Cloud projects (Dec 2024), fewer than 150 in 2019. | `sequence`: Four layers. → The first: infrastructure and cloud. |\n| p22 | evidence | Data ran on a central event platform while Adevinta Spain built a data mesh whose contracts cut the time to usable data from about five days to about 30 minutes. | statistic: Nearly a billion events a day over Kafka (2022); Databricks lakehouse with data mesh principles and immutable data contracts (2024). | `sequence`: Infrastructure. → The data layer. |\n| p23 | evidence | Chat and moderation were consolidated without a published architecture, while several narrower shared services are documented with their scale. | table: Shared services: Text in Image OCR, image models, YAMS media, dispute back office, Houston experimentation, each with scale and date. | `sequence`: Data. → The overarching components. |\n| p26 | evidence | The dispute back office is the only cross-marketplace product component with a published architecture, built to normalize each marketplace's events into a common model. | case: Kafka, SQS or REST events normalized behind a Kotlin API, extensible micro-frontend; 'We couldn't hardcode anything… or make any assumptions.'; figure: Figure 3 and an INFERENCE, NOT DOCUMENTED callout: per-tenant ingestion, canonical model, extensible front end; the component is only as good as the worst tenant's events. | `contrast`: The narrow shared services in the table, among them the dispute back office. → The one product component with a published design. |\n| p24 | evidence | Experimentation is the best-documented consolidation: ten A/B tools in 22 marketplaces became one platform through a build-buy-bridge decision, around a statistics package harvested from Marktplaats. | case: Houston chosen over buy with a third-party bridge; 2023 benchmark of 21 companies; Fisher used in more than 90% of Marktplaats experiments within a year, then group-wide. | `emphasis`: The documented shared services and the one product component. → The consolidation documented end to end: experimentation. |\n| p25 | evidence | Machine learning followed the same path, with the 2024 ML Golden Path replacing scattered tooling with one workflow and a catalog that accepts promoted components. | fact: 'a set of scattered tooling' replaced by one workflow on SCHIP and a central catalog (August 2024). | `similarity`: Experimentation's path. → The same path for machine learning. |\n\n### Phase 4: Verticals and the Convergence Bet (2023 to Mid-2024)\n\n**Controlling idea** (`analysis`, id `phase-4`): In 2023 Adevinta moved the shared line up to the product platform itself, a step of a different kind that fails the uniform-technology condition and whose completion the record never reports.\n\n**Advances the thesis** (A2, A5): States the convergence decision, why it differs, and where its record stops.\n\n**Transition in:** `time`: Consolidation of the uniform layers through 2023. → The 2023 strategy that went further.\n\n**Order of paragraphs** (`chronological`): The strategy and revenue mix set the context; then the decision, its last progress report, the author's reading of it and what the rationale actually supports; last, the capability the rationale names first. The reading must follow the documented decision so it is not mistaken for it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p27 | evidence | While the uniform layers were still being consolidated, the 2023 annual report describes the Growing at Scale strategy that went further and a vertical operating model for a group with €1,826 million of revenue; the lead-in says the table shows where the money came from when the convergence was decided. | table: 2023 revenue by segment and type (classifieds, advertising, transactional), total €1,826 million; EBITDA €651 million. |  |\n| p29 | analysis | The segment table, from the 2023 report's segment note, shows mobile.de's dealer listings earning about as much classifieds revenue as the whole French segment and transactions at about 6% of group revenue, while the convergence that follows concerns leboncoin and Kleinanzeigen, not mobile.de. |  | `elaboration`: The 2023 segment table. → Its source and what two of its figures show. |\n| p30 | evidence | In 2023 Adevinta decided to share the product itself, turning the leboncoin and Kleinanzeigen platforms into 'a unified global platform'. | quotation: \"...the compelling case for stronger consolidation prompted a change in this strategy... transforming the two platforms into a unified global platform to support Adevinta's generalist marketplaces.\" | `contrast`: The vertical organization and revenue mix. → The decision to share the product, not only components. |\n| p31 | evidence | The last public word on the convergence, in May 2024, was 'progressing well and according to plan', and no later source describes its delivery, architecture or fate. | quotation: 'the creation of a multi-tenant platform'; 'Platform convergence project progressing well and according to plan.' | `time`: The 2023 decision. → The last public statement on it. |\n| p32 | analysis | My reading is that the convergence was a different kind of step from everything before it, because a generalist product platform for France and Germany fails the uniform-technology condition. |  | `contrast`: The documented decision and its last progress report. → The author's reading of what kind of step it was. |\n| p33 | analysis | Adevinta's rationale argues for shared capabilities behind two products more than for one product platform, and the record does not say which was built. |  | `elaboration`: Why the platform fails the second condition. → What the stated rationale does support. |\n| p34 | evidence | The transactional journey, named first in the rationale, is the best-documented capability at marketplace level, with similar flows run on national contracts. | table: leboncoin, Kleinanzeigen, Marktplaats and mobile.de transactional records with providers and dates. | `example`: The capabilities the rationale names. → The first of them, as documented. |\n| p35 | evidence | Transactions grew revenue and costs together. | fact: Rising 'direct costs from transactional services'; two-point fall in France's EBITDA margin; transactional revenue +31% in Q1 2024.; figure: Figure 4 and an INFERENCE, NOT DOCUMENTED callout: the provider holds funds, the marketplace owns the state machine; similar everywhere, national underneath. | `cause_effect`: The transactional flows. → What they did to revenue and costs. |\n\n### Phase 5: Decentralization and Break-Up (Mid-2024 to 2026)\n\n**Controlling idea** (`evidence`, id `phase-5`): Under its new owners Adevinta decentralized to standalone marketplaces, and the strategic reports show what unwinding a shared platform cost.\n\n**Advances the thesis** (A3): Documents the reversal and its costs, and gives the author's reading of why it happened.\n\n**Transition in:** `time`: The convergence last reported in May 2024. → What the new owners did from July 2024.\n\n**Order of paragraphs** (`chronological`): The stated move, how it was organized, what it cost, what was left, and then why: the reading comes last so it rests on the documented costs.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p36 | evidence | In July 2024, two months after the take-private settled, Adevinta started a new operating model, which the 2025 report describes as a move from a centralized structure to standalone marketplaces. | quotation: \"The Group has evolved from a centralised structure to a decentralised, standalone operating model... ramp-down of central functions, the transfer of key capabilities, the localisation of intellectual property...\" |  |\n| p37 | evidence | The group carried out the move knowing its risks: it created standalone local teams while its own 2024 risk register named operational and data decentralization as risks. | quotation: 'standalone teams across core functions to strengthen local market ownership'; 'operational decentralisation (which may affect areas such as… trust and fraud) and data decentralisation'. | `elaboration`: The stated move. → How it was organized and what risks were named. |\n| p38 | evidence (list) | The strategic reports, not the engineering posts, show what decentralizing a shared platform cost: central and local services run in parallel, intellectual property localized in new legal entities, a carve-out with advisors, a smaller group and infrastructure owned by the marketplaces. | fact: Parallel running (cloud emissions 'more than doubled'); IP localized and a Spanish branch for Kleinanzeigen.de GmbH (3 March 2026); a carve-out with EY; Spain sold 27 February 2026 with a gain of about €1.1 billion; headcount 4,439; leboncoin's own infrastructure team. | `cause_effect`: The decision to decentralize. → What carrying it out cost. |\n| p39 | evidence | The 2025 accounts show a smaller group of six remaining businesses with €1,891 million of revenue from continuing operations. | statistic: Revenue €1,891 million; adjusted EBITDA €865 million (€970 million including Spain); portfolio as of October 2026. | `sequence`: The costs. → The group that remained. |\n| p40 | analysis | My reading is that the reversal was economic before it was technical: a shared platform that was a synergy asset becomes a separation cost when value is realized by selling marketplaces, so platform topology must match the capital strategy. | figure: Figure 5: the same shared platform as synergy asset and as separation cost. | `cause_effect`: The reversal and its costs. → Why the economics flipped. |\n\n### The Layer Map: What Was Shared, When\n\n**Controlling idea** (`synthesis`, id `layer-map`): Across the five phases the uniform layers stayed shared until 2024, and the product platform is the only layer whose convergence was announced.\n\n**Advances the thesis** (A1, A2): Pulls the phases into one view by layer.\n\n**Transition in:** `conclusion_summary`: The five phases. → One view of them by layer.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p41 | synthesis | The layer map pulls the five phases into one view at the layers Figure 1 introduced, where a blank means no public evidence either way. | table: Layer map: compute, cloud accounts, data, narrow ML and media, experimentation, chat and moderation, generalist product platform, across 2019-2026. |  |\n\n### A Reference Architecture for the Shared Platform\n\n**Controlling idea** (`analysis`, id `reference-architecture`): A labeled reference architecture shows why a pooled platform couples its tenants, and the record suggests much of the separability needed in 2025 was built for other reasons.\n\n**Advances the thesis** (A4, A5): Reasons about coupling and separability where the record stops, labeled as inference.\n\n**Transition in:** `cause_effect`: The layer map's shared layers and its blanks. → How a platform of those layers couples tenants, by inference.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The labeled inference first, so the reader has the model of fleet-level coupling; then the documented incidents that confirm it; then the author's reading of what that platform already offered for separation. The reading needs both the model and the evidence before it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p42 | explanation | The public posts never describe the whole platform, so a labeled inference fills the gap only to reason about coupling and separability. | reasoning: INFERENCE, NOT DOCUMENTED callout: a hub-and-spoke internal developer platform whose savings ('up to €30,000 per month', October 2024) and coupling are both fleet-level. |  |\n| p43 | evidence | The engineering posts confirm the fleet-level coupling. | case: A renamed metrics component broke tenants' dashboards (2023); an Argo CD ApplicationSet began deleting applications across 30+ clusters (2024); the 2025 PlatformCon retrospective and Hyrum's Law. | `additional_support`: The inferred coupling. → Documented incidents that confirm it. |\n| p44 | analysis | My reading is that most of the separability the 2025 transition needed was already present, built for chargeback, data quality and portability. |  | `contrast`: Coupling across tenants. → The separability already present. |\n\n### Trade-offs the Case Illustrates\n\n**Controlling idea** (`comparison`, id `trade-offs`): The right line between shared and local depends on the layer, on how uniform the technology is, and on how long the group expects to own each tenant.\n\n**Advances the thesis** (A1, A2, A3): Compares the five sharing options the record shows.\n\n**Transition in:** `cause_effect`: Separability built for other reasons. → The options a group chooses between, with the ownership horizon as a condition.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p45 | comparison | Once separability can be built in, the question is when to share at all, and the right line between shared and local depends on the layer, on how uniform the technology is, and on how long the group expects to own each tenant, the last condition being the one the record adds to the 2019 test. | table: Five options: share infrastructure, narrow services, product components, converge product platforms, decentralize; what the record shows, when each is right and when it fails. |  |\n\n### Vertical Differences in the Record\n\n**Controlling idea** (`comparison`, id `verticals`): Generalist, automotive and real-estate marketplaces behaved differently under one strategy, and what was built inside a marketplace left with it.\n\n**Advances the thesis** (A3, A4): Shows separability mattering most where businesses are likeliest to be sold.\n\n**Transition in:** `elaboration`: The ownership horizon as a condition. → How it differed by vertical.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p46 | comparison | The trade-offs' ownership-horizon condition played out differently by vertical: under one group strategy, Adevinta's generalist, automotive and real-estate marketplaces differed in scale, revenue model and which were sold or put up for sale, and so in how separable a shared capability had to be. | table: Generalist (58 million and 88 million live ads, 2025), automotive (mobile.de 1.6 million listings, 140 million monthly visits, 2025), real estate (Spanish portals to Scout24). |  |\n| p47 | example | A capability built inside a marketplace leaves with that marketplace, while one built centrally has to be split OLX Brasil joint venture, are volatile as of October 2026. |  | `additional_support`: The eight open questions. → Two more that may change. |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `chief-architect`): Adevinta's record gives five decision rules: share by layer, grow by adoption, fund convergence separately, design for separability and expect owners to reverse strategy.\n\n**Advances the thesis** (A1, A2, A3, A4): Turns the record into the author's labeled rules.\n\n**Transition in:** `cause_effect`: What the record shows and where it stops. → The rules the author takes from it.\n\n**Order of paragraphs** (`order_of_importance`): The layer test comes first because the other four rules apply it: adoption is how layers that pass it grow, convergence is the case that fails it, separability and owner reversals are what the ownership horizon adds. Read in another order, the later rules would lack the test they qualify.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p52 | recommendation | Of the five decision rules Adevinta's record gives, the first is to decide what to share by layer, writing the 2019 two-part test into the group's architecture principles. |  |  |\n| p53 | recommendation | Grow platforms by adoption and harvest local inventions, measuring a platform by how many tenants choose it. |  | `sequence`: The first rule, the layer test. → The second rule, from the documented successes. |\n| p54 | recommendation | Treat product-platform convergence as its own investment case, with scope, stage gates and a plan that survives a change of owner. |  | `sequence`: Platforms grown by adoption. → The third rule, for convergence. |\n| p55 | recommendation | Make separability a design requirement reviewed like security, asking of each shared capability what a departing tenant takes, what is switched off and what runs twice. | figure: Figure 6: separability designed in through four connectors. | `sequence`: Convergence as its own case. → The fourth rule, for owners who may sell. |\n| p56 | recommendation | Expect owners to reverse platform strategy within a year, and keep the platform cheap to reshape in either direction. |  | `sequence`: Separability. → The fifth rule. |\n\n### Comparing the Case to the Book's Patterns and to Veldmark\n\n**Controlling idea** (`comparison`, id `comparison`): Adevinta's record supports most book patterns it touches, leaves the rest untested, and makes separability a costed question for Veldmark.\n\n**Advances the thesis** (A4, A3): Tests the book's patterns and Veldmark's choices against the case.\n\n**Transition in:** `elaboration`: The author's rules. → How the book's patterns and Veldmark's choices fare against the case.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p57 | comparison | Adevinta's record supports most book patterns it touches, leaves two untested, and adds capital strategy as a stressor. | table: Seven book patterns with Adevinta's record and a verdict each. |  |\n| p58 | comparison | Veldmark's 2027 program sits close to Adevinta's 2019 rule and further from its 2023 plan. | table: Five Veldmark choices with their Adevinta parallels and what the case suggests. | `contrast`: The book's patterns. → The fictional group's 2027 choices. |\n| p59 | example | Separability becomes a costed question when Veldmark's investor asks in November 2027 what a 2030 sale of Hearthly would cost. | scenario: By then Hearthly uses Veldmark ID, shared OpenSearch, the Confluent backbone and the catalog and entitlement service while on Google Cloud. | `example`: Veldmark's private-equity ownership. → A concrete sale question. |\n| p60 | recommendation | The answer is not to share less but to make each shared capability tenant-separable from its first release, which Ingrid Halvorsen prices for the board. | scenario: Transitional services for seven shared capabilities for about nine to twelve months with the rules, more than twenty months without (labeled estimate, December 2027). | `problem_solution`: The cost question of a Hearthly sale. → The architectural answer. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Nine questions let a reader test a group's sharing decisions against the case.\n\n**Advances the thesis** (A1, A2, A3, A4): Turns the thesis into review questions.\n\n**Transition in:** `cause_effect`: The comparison with Veldmark. → Questions for the reader's own group.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p61 | recommendation (list) | Nine questions put the rules and the comparison to the reader's own group: the two-part test, adoption versus mandate, convergence scope, the cost of a tenant's exit, per-tenant scoping, local inventions, the synergy case, pooled trust signals and blast radius. |  |  |\n\n## Conclusion: From Adevinta to OLX\n\n**Synthesis:** Asked of every phase, the opening's three questions add up to one rule: what was shared held where the 2019 test said it would (uniform, expensive layers grown by adoption); the layer mattered most when the line moved up to the product platform, which fails the uniform-technology test and is never shown finished; and the cost was set by the owner, not the architecture, since the same layers were synergy in 2021 and separation in 2025. So: share by layer, fund product convergence as its own case, and design each shared layer for a tenant's exit.\n\n**So what:** A Chief Architect can apply the rule from the public record alone, without knowing how Adevinta's convergence ended: share by layer, fund product convergence as its own case with scope and stage gates, and size every shared layer for the day a tenant leaves.\n\n**Callback:** The hook: Adevinta ran the whole centralization pendulum and wrote much of it down. The reader can now say what each swing of the pendulum shared, at which layer and at what cost, and why the last swing's outcome is unknown.\n\n**Takeaway** (`course_of_action`): Put the two-part test and the separability question to every shared capability; read case-olx next for what happens when the portfolio changes on its own, not together with the platform strategy.\n\n**Hand-off** to [OLX Group: Regional Platforms, Verticalization and Retreat](case-olx.html): `elaboration`: Adevinta's closing: one group ran the whole centralization pendulum in public; the next case follows a group that built regional platforms across several continents, verticalized and retreated, a different route through the same questions. → The question Adevinta's record leaves undocumented: what happens to a shared platform when the portfolio changes on its own, not together with the platform strategy as at Adevinta in 2025, and how a listing stack is improved in place while it does.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p62 | synthesis | The opening's three questions add up to one rule, share by layer, fund product convergence as its own case and design each shared layer for a tenant's exit, because what was shared held where the 2019 test said, the product layer was the one that failed it, and the owner set what sharing cost. |  |  |\n| p63 | transition | Adevinta shows one group running the whole pendulum in public, and case-olx follows a group that built regional platforms, verticalized and retreated, taking up the question Adevinta's record leaves undocumented: what happens to a shared platform when the portfolio changes. |  | `cause_effect`: One group's full pendulum. → The different route and open question of the next case. |\n\n## Non-goals\n\n- A company profile or an investment view; no judgement on whether the owners' decisions were right.\n- Re-teaching tenancy models, consolidation sequencing, team topologies or payments design. See [One Platform, Many Marketplaces: Multi-Country and Multi-Brand Architecture](multi-country-platforms.html), [After the Deal: Consolidating Platforms After Acquisitions](platform-consolidation.html), [Who Owns What: Organizing Marketplace Engineering](organizing-marketplace-engineering.html), [Beyond the Contact: Payments, Shipping and Buyer Protection](transactions-and-payments.html).\n- eBay Classifieds Group before 2021, and OLX. See [eBay Classifieds Group: Shared Platforms, Local Brands and a Sale](case-ebay-classifieds.html), [OLX Group: Regional Platforms, Verticalization and Retreat](case-olx.html).\n- leboncoin's, Kleinanzeigen's or mobile.de's search and ranking engines, for which no public evidence was found.\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Did the 'unified global platform' for leboncoin and Kleinanzeigen ship in any form? Revisit if Adevinta or either marketplace publishes on it.\n- Outcome of the reported mobile.de IPO-or-sale process and the willhaben sale completion date (both volatile as of October 2026; the web-search quota ran out before they could be rechecked).\n- Whether the €130–165 million eCG synergy target was reported as achieved.\n- Primary documentation of the Schibsted-era 'Blocket platform' model.\n- AC-4: South Africa sale (2022) and leboncoin's LLM search front end (2024) are attributed only at publication level (Online Marketplaces; Adevinta Tech Blog); the specific articles are not in the source list. The author may add them or accept the publication-level attribution.\n\n## Decision log\n\n- **2026-10-19** — Organized the case as five dated phases plus a cross-phase layer map, rather than by capability, because the case's teaching value is the movement of the shared/local line over time.\n- **2026-10-19** — Treated the 2023 convergence as unverified in outcome: quoted the decision and the May 2024 progress line, and refused to infer its architecture. Rejected: Presenting it as a failure, which the record does not show.\n-                     i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
