<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, AC-1 to AC-3, the thesis and the role are copied unchanged from the chapter's entry in journal-spec.json; the conclusion carries Part VII's closing from the same file. Where the published text did not yet do what the contract asks (a roadmap, the part closing), the spec asks for it and the units are listed in decision_log.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The traffic shape of a listing platform (evening and Sunday peaks, TV campaigns, scheduled batch work, bots and scrapers) and journey objectives: indicators, objectives and error budgets per liquidity journey, with peak-window reporting.\n- **Know:** Control points in the search path, capacity planning for known peaks, the degradation ladder, multi-region ambition, incident management, and bot, scraper and crawler management.\n- **Know:** Unit costs (per thousand searches, per live listing, per contact) allocated through an ownership catalog, and FinOps practice for marketplaces.\n- **Believe:** Reliability is defined per journey where liquidity is made, not per service.\n- **Believe:** Most peaks are predictable and many failures are self-inflicted, so the order of sacrifice should be decided before the incident.\n- **Be able to:** Write journey objectives with error budget policies that change what teams ship.\n- **Be able to:** Design a degradation ladder and a peak calendar for a search path.\n- **Be able to:** Report unit costs that turn a run-cost target into specific work.\n\n**Audience:** Chief architects, platform and SRE leads, search platform leads and engineering directors of multi-brand marketplace groups.\n\n**Already knows:**\n\n- APIs, databases, event streams, search engines (Solr, Elasticsearch, OpenSearch), caching, CDNs, Kubernetes, availability zones and percentile latency; the general idea of SLOs.\n- From earlier chapters: Veldmark (fictional) and its brands Tradeyard, Motorvane, Hearthly and Keybridge, the Yardstick monolith, Ingrid Halvorsen, the architecture advice forum, Common Ground and its €38 million run-cost target; liquidity and contacts (liquidity-and-network-effects); the Rotterdam city bike and Femke; Ghost Inventory, Search as System of Record, Fast Mail for Fraudsters, Vanity Liquidity and Deal-Shaped Architecture.\n- From Part VII: the listing event stream, the register of copies, the web and SEO layer, the data platform and the tenancy model of multi-country-platforms; the part introduction's test (for any listing fact, where it is true, which copies hold it and how you would rebuild or erase them).\n\n**Does not yet know:**\n\n- The terms this chapter defines: service level indicator, service level objective, error budget, critical user journey, journey SLO, peak window, degradation mode and ladder, peak and campaign calendar, peak rehearsal, cost per search.\n- Marketplace-specific load: the evening and Sunday peak, campaign steps, supply events, and the share and kinds of automated traffic.\n- Bot-management vocabulary: crawler verification, RFC 9309, the sui generis database right; FinOps unit economics.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a peak-hour outage, the reader names the journey objective, the planning control and the degradation order that apply. *Probe:* On a Sunday evening a TV campaign raises search traffic 30% while a weekly full reindex runs; caches go cold, apps retry failed searches twice without backoff, and a third of search load comes from crawlers and scrapers. Search latency rises from 400 ms to 7 seconds for 48 minutes. The post-incident review proposes moving the reindex and adding two nodes. Using only this chapter: what does the architecture lack, and what do you build? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-4 | The chapter's last section performs Part VII's closing: it states what the eight chapters build in common, says why that matters for Part VIII, and returns to the part introduction's test of where a listing fact is true and how its copies are rebuilt or erased. *Probe:* Does the final section state something about Part VII that no single chapter states, say why it matters for Part VIII, and return to the question the part introduction ends on? | `custom` | rubric | minor |\n\n## Thesis\n\n**Question:** How do you keep a listing platform fast, available and affordable at scale?\n\n> **Claim:** A listing platform should define reliability per liquidity journey (search, listing view, listing visible, listing gone, message delivered, alert sent, insertion), each with an indicator measured where the user is that counts human requests and deliberate safety holds as good events, an objective, and an error budget whose spending restricts changes on that journey; should plan for its predictable peaks with a peak and campaign calendar that keeps batch work out of peak windows and a degradation ladder that sheds bots first, optional features second, freshness third and search itself last; and should report cost per thousand searches, per live listing and per contact through an ownership catalog, so a run-cost target becomes specific work.\n\n**Disputed by:** The common practice of setting availability targets per service or component, adding capacity after each incident, deciding what to switch off during the incident, treating bot traffic as load like any other, and cutting run cost by an even percentage across teams.\n\n**So what:** A Chief Architect who accepts this has the group define the liquidity journeys and their indicators once while each brand sets objectives and names a journey owner; makes the peak calendar, peak-window freezes and batch scheduling rules platform capabilities that marketing joins; puts degradation and read-only modes on a roadmap with a date; requires a business case for active-active regions; treats automated traffic as a cross-functional policy that engineering enforces; and publishes unit costs per brand in the quarterly architecture review next to the journey objectives.\n\n**How and why:** On Sunday 17 January 2027 a TV campaign, a weekly full reindex scheduled years earlier and cache eviction took Tradeyard NL's search p99 from about 400 ms to about 7 seconds for 48 minutes; retries without backoff and unthrottled bots, a third of the load, amplified it. About 3.4 million searches failed, about 9,800 fewer first contacts were made, and 30% of the 28-day search budget went in 48 minutes. At the same campaign slot on 16 January 2028, with the peak calendar, bot shedding, edge caching, a retry budget and the ladder, 37% of peak requests were shed or cached, search spent 6 minutes at level 2 with p99 about 1.3 seconds, under 0.2% of human searches failed and 2% of the budget was spent, still on Solr. Search costs the group about €11.8 million a year, €0.042 per thousand queries.\n\n**Supporting claims**\n\n- **S1** — A listing platform's load is predictable and partly self-made (evening and Sunday peaks, campaign steps, supply bursts and a steady third of automated traffic), so incidents like the brown-out are collisions of known load rather than exotic failures.\n- **S2** — Reliability is defined per liquidity journey: an indicator measured from the user's side that counts human requests and deliberate safety holds as good events, an objective with a named owner, and an error budget, reported separately for the peak window, whose spending restricts changes on that journey.\n- **S3** — Capacity for known peaks comes first from control points in the request path (batch work isolated and scheduled by a calendar, retry budgets and admission control, caches warmed and keyed) and from a peak and campaign calendar shared with marketing, and only then from more nodes.\n- **S4** — What a journey gives up under load is decided in advance: a degradation ladder sheds bots first, optional features second, freshness third and search last, never safety scanning, and the regional ambition for a country-scoped group is multi-zone plus a tested read-only mode.\n- **S5** — Automated traffic is a policy area with its own capacity class, controlled in layers from robots.txt and crawler verification to edge classification, quotas, product design, contracted access and law, and enforced at the edge.\n- **S6** — Cost per thousand searches, per live listing and per contact, allocated through an ownership catalog and reported per brand, turns a run-cost target into specific work, and the platform team holds the largest levers.\n\n## Role in the part\n\nMeasures the whole platform at the moments liquidity is made, sets what it gives up first and what it costs per unit of work, and carries the part's closing into Part VIII. Supports P7-8 of part `part-7`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in traffic to cost: each section uses the vocabulary or decision of the one before (the load and its automated third before the objectives that count humans, journeys before the control points that protect them, with bot controls at the edge as the first control point, control points before the capacity model that counts on them, capacity before the ladder that takes over beyond it); `grouping` in trade-offs, verticals, failure-modes, ca-view, questions: the book's standard judging sections)\n\nThe scene states the problem (a 48-minute brown-out that nothing in the architecture anticipated) and Ingrid's question names what the architecture lacked; the body supplies each missing piece in the order the reader needs it, and the worked example reruns the same campaign slot a year later as the solution's test. The traffic shape comes first because every later section designs for it, including the automated third and its kinds of client. Why bots come and the layers that control them sit inside the control points, next to edge classification: both round-3 flow readers read a separate bot section before the journey objectives as protection arriving before the chapter says what is protected. Journey objectives follow the load because the control points, capacity plan and ladder exist to protect them; placed after those, the reader would meet error budgets and peak windows used before they are defined. The control points precede capacity planning because the capacity model counts on the cached and shed share they create; capacity precedes degradation because the ladder takes over where planned capacity ends; regions extend degradation (the read-only mode doubles as one) to the loss of a site; incident management covers what still goes wrong. Cost comes after the mechanisms whose spending it measures (shedding, caching, headroom), including the third of search cost that serves automated clients. The worked example needs every mechanism before it, and the judging sections apply the whole design.\n\n## Introduction\n\n**Hook** (`direct_statement`): The earlier chapters of Part VII built the shared platform beneath Veldmark's brands; this one asks whether that platform holds at the hour when liquidity is made. Reliability engineering in a marketplace is mostly the discipline of knowing the traffic shape and designing for it, rather than reacting to it.\n\n**Bridge:** Every platform reader knows the daily shape (quiet nights, a lunchtime bump, a long evening peak) and has seen campaigns, pushes, bulk feeds and scrapers add to it. → A minute of failed search at the weekly peak loses more contacts than an hour at night, so the question is how to keep the platform fast, available and affordable at the hour that matters.\n\n**Thesis statement** (KEY POINTS callout (three bullets), with p01 stating that reliability is designing for a known traffic shape.): Define reliability per liquidity journey rather than per service, with error budgets that change what teams do; plan for predictable peaks with a calendar that keeps batch work out and degradation modes that shed bots and optional features before searches fail; and make cost per search, per listing and per contact an architecture metric.\n\n**Roadmap** (Paragraph p04, with the IN THIS CHAPTER callout.):\n\n- Take apart one 48-minute search brown-out. *Kept in:* scene.\n- Traffic shape, automated traffic included. *Kept in:* traffic.\n- Journey objectives, and control points with the bot controls at the edge. *Kept in:* journeys, control-points.\n- Capacity, degradation and regions. *Kept in:* capacity, degradation, regions.\n- Incidents and cost. *Kept in:* incidents, cost.\n- Rerun the brown-out a year later. *Kept in:* worked.\n- Trade-offs, vertical differences, failure modes, the Chief Architect's view and questions to ask. *Kept in:* trade-offs, verticals, failure-modes, ca-view, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | claim | The earlier Part VII chapters built the shared platform, and this one asks whether it holds at the hour liquidity is made; reliability engineering in a marketplace is mostly knowing the traffic shape and designing for it, including the spikes the business creates and the traffic nobody invited. | fact: Quiet nights, a lunchtime bump and a long evening peak; on top, a television campaign, a push to millions of alert subscribers, a bulk dealer feed, and scrapers and bots. |  |\n| p02 | context | The stakes are asymmetric: a minute of failed search at the weekly peak loses more contacts than an hour at night, and the peak hour is where reliability, revenue and trust meet. | reasoning: Peaks are when sellers check visibility, scammers count on stretched moderators and advertising inventory is worth most. | `cause_effect`: The traffic shape with its evening peak. → Why failure at that peak costs more than failure at night. |\n| p03 | context | The chapter builds on its neighbours (search-architecture, event-driven-listings, multi-country-platforms) and adds journey objectives, a degradation ladder, a regional ambition and unit costs per brand, which Part VIII weighs when it decides which of Veldmark's stacks to consolidate. |  | `place`: The peak as the place reliability, revenue and trust meet. → Where this chapter sits among its neighbours and what it adds for Part VIII. |\n| p04 | transition | The chapter takes one brown-out apart: the load (traffic shape, automated traffic included), what reliability means (journey objectives), what protects it (control points with the bot controls at the edge, capacity, degradation, regions, incidents) and what it costs, citing SRE, Vinted, Adevinta, Rightmove, FinOps and bot reports; a rerun a year later, trade-offs, vertical differences, failure modes, the Chief Architect's view, questions and Part VII's closing follow. |  | `sequence`: What the chapter adds. → The order in which it is built. |\n\n## Sections\n\n### Setting the Scene at Veldmark: Forty-Eight Minutes on a Sunday Evening\n\n**Controlling idea** (`example`, id `scene`): Three ordinary things at once, amplified by retries and bots, browned out Tradeyard NL's search for 48 minutes, and nothing in the architecture knew the hour mattered.\n\n**Advances the thesis** (S1): The brown-out is the chapter's case of predictable load colliding with itself.\n\n**Transition in:** `example`: The roadmap's first item: one 48-minute brown-out. → The brown-out itself, on Sunday 17 January 2027.\n\n**Order of paragraphs** (`chronological`): Symptoms, then causes, amplifiers and cost in the order the review found them; the question comes after the cost so it lands on known facts; the evidence label closes the scene.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | description | On Sunday 17 January 2027 at 20:35 CET, search on Tradeyard Netherlands slowed from about 400 ms to about 7 seconds at p99 for 48 minutes, and about 9% of searches failed. | scenario: Tradeyard NL, 17 January 2027, 20:35 CET: p99 about 400 ms to about 7 s for 48 minutes; about 9% of requests failed; spinners, errors and partial pages without facets. |  |\n| p06 | cause_effect (list) | The post-incident review, read by Ingrid in her first week, finds no single cause but three ordinary things at once: a TV campaign, a weekly full reindex scheduled years earlier, and cache eviction at the peak. | scenario: Declutter spot in the 20:30 ad break (+about 30% in four minutes); weekly in-place reindex of the NL Solr collections at Sunday 20:00, now almost three hours; caches flushed as segments committed. | `cause_effect`: The symptoms of the brown-out. → Its three causes. |\n| p07 | cause_effect | Two amplifiers made it worse: apps retried failed searches twice with no backoff, and about a third of backend requests came from automated clients that were not throttled. | figure: Figure 1: the brown-out's causal chain. | `additional_support`: The three causes. → Two amplifiers that fed the overload back. |\n| p08 | claim | The review counts about 3.4 million failed searches and about 9,800 fewer first contacts and proposes familiar fixes, but Ingrid asks why nothing in the architecture knew that the hour mattered, that a campaign was coming, that bots could wait or that facets were optional. | scenario: About 3.4 million failed searches; about 9,800 fewer first contacts; actions: move the reindex, warm caches, add capacity. | `cause_effect`: Causes and amplifiers. → The cost and the question the chapter answers. |\n| p09 | evidence | The Sunday-evening peak is a Veldmark illustration; Rightmove's documented 2021 busiest minute, during a prime-time TV ad break, is the public example of a marketing-driven peak. | quotation: Rightmove's busiest minute: \"8:48 pm on Wednesday, during the final ad break on prime-time TV\". | `contrast`: Veldmark's fictional campaign peak. → A documented real example of the same kind of peak. |\n\n### The Traffic Shape of a Listing Platform\n\n**Controlling idea** (`description`, id `traffic`): Four kinds of load shape a listing platform, three of them predictable, and automated traffic is a large, mixed share that needs its own policy.\n\n**Advances the thesis** (S1): Shows the load is a known shape, not a surprise.\n\n**Transition in:** `cause_effect`: Ingrid's question of why nothing knew the peak. → The traffic shape the architecture should have known.\n\n**Order of paragraphs** (`grouping`): Kinds of load first, then the strongest predictable one (seasons), then the uninvited one and its local share; the bot share is used again in capacity, degradation and cost.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | comparison | Four kinds of load shape a listing platform (leisure browsing, marketing and notifications, supply events, external shocks), and three of them can be predicted. | table: Load, shape, predictability and example; Veldmark's search peaks at 31,000 queries per second on Sunday 20:00–22:00 CET against an average of 9,000; Vinted's 2021 Facebook-outage load (+about 15% on its databases). |  |\n| p11 | evidence | Seasonality can be strong enough to drive architecture, as Vinted's autumn did, yet architectures often treat known seasons as surprises. | quotation: Vinted's autumn, \"the most extreme growth and workload period of the whole year\", pushed it from manually sharded MySQL to Vitess. | `elaboration`: The predictable kinds of load. → Seasonality as the strongest of them. |\n| p12 | description | Automated traffic is a large share of load and falls into groups the business wants, contests or fights: search crawlers, AI crawlers, partners and aggregators, scrapers and attack traffic. | statistic: Imperva 2025: automated traffic 51% of web traffic, bad bots 37%; a security vendor's whole-web figures. | `contrast`: The load the business creates or expects. → The traffic nobody invited. |\n| p13 | evidence | Each automated group costs capacity and needs its own policy; at Tradeyard about a third of search-backend requests are automated and only about 6% of the total come from verified search crawlers. | scenario: Tradeyard 2027: about a third automated; about 6% verified search crawlers.; figure: Figure 2: a week of traffic with evening humps, a campaign spike and a steady band of bots. | `example`: The groups of automated clients. → Their share at Tradeyard. |\n\n### Journey SLOs: Defining Reliability Where Liquidity Is Made\n\n**Controlling idea** (`definition`, id `journeys`): Reliability objectives belong on the journeys that create liquidity, measured from the user's side, with error budgets whose spending changes decisions, reported for the peak window.\n\n**Advances the thesis** (S2): Defines journey objectives, the first part of the thesis.\n\n**Transition in:** `problem_solution`: The traffic shape, human and automated, whose peak matters most. → A definition of reliability that says which journey and which hour matter.\n\n**Order of paragraphs** (`large_to_small`): General SRE vocabulary, then the book's journey SLO and its journeys, then the choices inside them, then budgets and the peak-window refinement that depends on them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | definition | Site reliability engineering defines an SLI as good events over total events, an SLO as a target for customers and the error budget as 100% minus the SLO, and recommends objectives on critical user journeys rather than components. | quotation: SLI \"the number of good events divided by the total number of events\"; SLO \"sets a target level of reliability for the service's customers\"; error budget \"100% minus the SLO\"; critical user journey \"a sequence of tasks that is a core part of a given user's experience\". |  |\n| p15 | definition | In this book a journey SLO is an objective on a marketplace journey that creates or protects liquidity, measured from the user's side, with an owner and an error budget policy, and component objectives serve it. | table: Seven liquidity journeys (search, listing view, listing visible, listing gone, message delivered, alert sent, insertion) with good event, measurement point, Tradeyard 2027 objective and why it matters. | `elaboration`: The SRE vocabulary and critical user journeys. → The book's marketplace version of it, and the journeys it applies to. |\n| p16 | explanation (list) | Three design choices in the table matter more than the numbers: measure humans and classify bots, count deliberate holds as good events, and treat removal as a journey. | scenario: The 37 messages withheld after Femke's report on 7 March 2027; the Rotterdam city bike out of search a minute after sale while the morning digest still featured it. | `emphasis`: The table of journeys and objectives. → The three choices in it that matter most. |\n| p17 | recommendation | An error budget is useful only if spending it changes decisions, so Veldmark's April 2027 policy restricts changes on a journey's critical path at half the budget and allows only reliability fixes when it is gone. | scenario: More than half spent: journey-owner approval; exhausted: reliability fixes only; the brown-out spent about 30% of Tradeyard NL's 28-day search budget in 48 minutes, against about 7 billion requests in 28 days. | `sequence`: The objectives. → The budget and the policy that make them change behaviour. |\n| p18 | recommendation | Because a peak-hour failure costs more contacts, Veldmark reports search reliability separately for the peak window, Sunday 18:00–23:00, and I would start there rather than weight events by expected contacts. | reasoning: Peak-window reporting versus weighting events by expected contacts: more precise, harder to explain. | `elaboration`: The 28-day budget and its policy. → The marketplace-specific refinement for the peak window. |\n\n### Architecture: Control Points in the Search Path\n\n**Controlling idea** (`description`, id `control-points`): Four control points (classify at the edge, admit and degrade at a gateway, separate optional work, keep batch work out of peak windows) protect every journey; bot controls at the edge, isolation, retry rules and layered caching are how they are built.\n\n**Advances the thesis** (S3, S5): Describes the mechanisms that keep known load from colliding, starting with the layered control of automated traffic enforced at the edge.\n\n**Transition in:** `problem_solution`: Journey objectives that the brown-out broke. → The architecture that protects them in the search path.\n\n**Order of paragraphs** (`large_to_small`): The four control points first, then the edge and its bot controls (the first control point, next to edge classification as both round-3 flow readers asked), then isolation, retries and caching in the order the brown-out's causes and amplifiers appeared.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p19 | claim | The same control points apply to every journey, not only search: classify at the edge, admit and degrade at a gateway, separate optional from essential work and keep batch work out of peak windows with the peak calendar set out under capacity planning. | figure: Figure 3: control points in the search path (edge, gateway, optional facet and personalization calls, batch under the calendar). |  |\n| p40 | explanation | The first control point is the edge, where automated traffic is classified; listing data is valuable to others, so scraping is a capacity, commercial and trust-and-safety problem at once, met by seven control layers from policy to legal. | scenario: The Barcelona fake-rental ring of July 2027 posted 180 listings in Eixample with photos copied from real listings.; table: Policy (RFC 9309, \"these rules are not a form of access authorization\"), verification (Google's DNS and IP checks), classification, rate limits and quotas, product design, contracted access, legal (Directive 96/9/EC). | `elaboration`: The control points, the first of which classifies traffic at the edge. → Why bots come and the layers that control them at the edge. |\n| p41 | explanation | AI crawlers add a commercial question, since Cloudflare changed its default to block them unless they pay, and this chapter's concern is only that the policy is enforced at the edge with its own capacity class. | fact: On 1 July 2025 Cloudflare announced it was changing its default to block AI crawlers unless they pay for content. | `contrast`: The control layers for known kinds of bot. → AI crawlers, where the question is commercial. |\n| p20 | recommendation (list) | Five standard isolation rules keep work that can wait apart from work that cannot, because the brown-out came from interactive queries, reindexing and cache warm-up sharing nodes. | source: Vinted's idle indexing after catch-up (2021); a reindex as a deployment with alias switch; Vinted's separate facet calls (about 20% more CPU, about 71 ms faster item search, about 50% facet cache hit ratio, 2023); bulk writers rate-limited (a dealer group's 40,000-listing update); tenants isolated. | `sequence`: The edge, where automated traffic is classified and limited. → Isolation behind the edge, as five rules. |\n| p21 | evidence | Google's SRE book gives the retry rules that would have shortened the brown-out: randomized exponential backoff, a server-wide retry budget, no retries at several levels, load shedding and tested degraded modes. | quotation: \"always use randomized exponential backoff when scheduling retries\", \"consider having a server-wide retry budget\", \"avoid amplifying retries by issuing retries at multiple levels\". | `sequence`: Isolation of batch work. → The second control: retries and timeouts. |\n| p22 | recommendation | In a marketplace, apps retry search once with jitter, the gateway enforces a retry budget, timeouts shrink down the stack and admission control rejects or degrades work past a concurrency limit. | source: OLX's reported 2021 posts on load shedding with NGINX adaptive concurrency control could not be retrieved. | `example`: The general SRE rules. → Their marketplace form. |\n| p23 | description | Caching in a listing platform has three layers, edge, gateway and service, and engine, each with a different staleness tolerance and invalidation. | table: Layer, what is cached, staleness tolerated, invalidation. | `sequence`: Retries and admission control. → The third control: caching. |\n| p24 | recommendation | Two brown-out lessons apply to caching: warm caches before switching to a new index, node or restart, and normalize cache keys so equivalent queries share an entry. | statistic: Vinted raised its facet cache hit ratio by about five percentage points by removing a per-user filter, at the cost of slightly inaccurate counts. | `cause_effect`: The three cache layers. → What the brown-out teaches about them. |\n\n### Capacity Planning for Known Peaks\n\n**Controlling idea** (`process`, id `capacity`): Capacity is planned from the weekly peak with a model in which caching and shedding move the result more than nodes, and a shared calendar and peak rehearsals make the model's factors knowable.\n\n**Advances the thesis** (S3): Turns the control points into a capacity plan and the calendar that feeds it.\n\n**Transition in:** `cause_effect`: The control points: classification and shedding at the edge, retry budgets and caching. → How much backend capacity remains to plan for once they have absorbed their share.\n\n**Order of paragraphs** (`chronological`): The planning steps in order: peak figures, the model, the model applied, the levers, the calendar that supplies its campaign factor, then the rehearsal that tests the plan.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p25 | evidence | Capacity planning starts from the weekly peak, not the average: Veldmark's group search averages 9,000 and peaks at 31,000 queries per second, and Tradeyard carries about 70% of it. | scenario: 9,000 average, 31,000 peak (ratio about 3.4); Tradeyard about 70%, roughly 21,700 at the Sunday peak; Tradeyard NL a little under half of Tradeyard's. |  |\n| p26 | definition | Counting queries as results-page requests, the backend's required capacity is expected peak × campaign factor × failure headroom × (1 − share served from cache or shed). | fact: Each query fans out to about 2.6 engine requests at Tradeyard (search-architecture). | `elaboration`: Peak figures. → The model that turns them into capacity. |\n| p27 | example | For Tradeyard NL before the changes the model asks for about 19,500 queries per second, close to twice the expected peak, against a cluster sized for about 13,000. | scenario: Expected peak about 10,000; campaign factor 1.3; failure headroom 1.5 for the loss of one of three zones; almost nothing cached or shed. | `example`: The capacity model. → The model applied to Tradeyard NL. |\n| p28 | analysis | Caching and shedding unverified bots take about 35% of peak requests off the backend in the 2027 plan, cutting the requirement to about 12,700, so the cheapest capacity is the request that never reaches the cluster. | scenario: About 35% off the backend; about 12,700 queries per second required, roughly the existing cluster.; figure: Figure 4: requests narrowed at the edge before reaching the cluster. | `contrast`: A requirement close to twice the peak. → The two levers that bring it down. |\n| p29 | recommendation | The campaign factor is knowable only if engineering knows about campaigns, so Veldmark puts campaigns, scheduled sends, bulk imports and batch jobs into one peak and campaign calendar owned by platform engineering. | scenario: The calendar drives pre-scaling, blocks heavy batch work in peak windows and spreads 38 million daily alert notifications. | `cause_effect`: The campaign factor in the model. → Where that factor comes from. |\n| p30 | recommendation | The useful load test is a peak rehearsal: production traffic replayed at 1.3 times the weekly peak, with a cache reset and the reindex running, on production-like data. |  | `sequence`: The calendar that plans peaks. → How to test the plan before the peak. |\n\n### Graceful Degradation: Deciding in Advance What to Give Up\n\n**Controlling idea** (`recommendation`, id `degradation`): Degradation modes are product decisions made before the incident, ordered bots first, optional features second, freshness third and search last, and each journey has its own ladder that never drops safety scanning.\n\n**Advances the thesis** (S4): Specifies the order of sacrifice, the second half of the peak plan.\n\n**Transition in:** `contrast`: Capacity planned and rehearsed for known peaks. → What to do when load exceeds the plan anyway.\n\n**Order of paragraphs** (`large_to_small`): Definition and ladder, then its order and evidence, then the other journeys' ladders and the exception for safety.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p31 | definition | A degradation mode is a predefined, tested reduction of functionality designed with the product owner before an incident, and the search ladder has five levels from normal to browse only. | table: Levels 0–4 (normal, shed bots, trim optional work, serve from cache, browse only) with triggers, changes, what users notice and who switches.; figure: Figure 5: the search degradation ladder with recovery stepping down after sustained health. |  |\n| p32 | analysis | The marketplace-specific part of the ladder is its order, bots first, optional features second, freshness third, search last, supported by Vinted's approximate facet counts and SRE guidance, and with levels 1 and 2 the brown-out would most likely have been minutes of approximate counts. | source: Vinted shows counts above 500 as \"500+\" with an early-termination limit and caps facet cardinality (2023); SRE guidance on cheaper fallbacks and testing degraded paths.; figure: Figure 6: degradation as planned ballast. | `emphasis`: The ladder's levels. → The order that makes it marketplace-specific, and what it would have changed on 17 January. |\n| p33 | recommendation | Each journey has its own ladder, and messaging never skips safety scanning, because turning off scam detection under load turns a reliability incident into a fraud incident. | example: Messaging delays attachments and read receipts, not text; alerts delay digests and keep instant alerts; insertion accepts and queues and keeps moderation in the path; Fast Mail for Fraudsters. | `similarity`: The search ladder. → The ladders of the other journeys. |\n\n### Multiple Regions: How Far to Go\n\n**Controlling idea** (`recommendation`, id `regions`): For a country-scoped classifieds group, multi-zone plus a tested read-only mode is the right regional ambition, and single-site legacy is the larger risk.\n\n**Advances the thesis** (S4): Extends what to give up in advance to the loss of a site.\n\n**Transition in:** `elaboration`: Degradation inside a working region. → Losing a zone, a region or a site.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): Documented record, then the failure that motivates it, then the recommendation, then Veldmark's application.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p34 | evidence | Classifieds are mostly country-scoped, and the documented record shows single-writer designs with read-only projections and multi-cluster traffic shifting rather than multi-writer regions. | quotation: Vinted 2026: \"all writes happen in the primary site and read-only projections are replicated around the world\"; multi-writer avoided \"without a strong business need\".; source: Adevinta's many clusters with weighted DNS and a pod-health controller. |  |\n| p35 | evidence | Regional cloud failures take shared dependencies down together, as the October 2025 us-east-1 event showed, so regional control planes are shared dependencies and autoscaling is not capacity during a regional event. | fact: AWS post-event summary of 19–20 October 2025: a latent defect in DynamoDB's automated DNS management left an empty DNS record; effects over about 14.5 hours on EC2 launches, Network Load Balancer, Lambda, container services, STS and console sign-in. | `contrast`: Designs that keep writes in one place. → What happens when that one region fails. |\n| p36 | recommendation | For most journeys of a country-scoped group the right answer is multi-zone plus a tested read-only mode, which keeps the most valuable traffic and doubles as a degradation mode inside a region. | table: Five options (multi-zone, backup and restore, read-only warm standby, active-active single writer, active-active multi-writer) with what each gives, costs and fits; the table sits before this paragraph. | `cause_effect`: Regional failure and its lessons. → The ambition that follows for a country-scoped group. |\n| p37 | example | Veldmark's starting point is more fragile than its cloud estate suggests, because Yardstick runs in one Amsterdam data center, so the plan sequences read-only standby after the Q4 2028 search extraction and funds a backup and an edge fallback meanwhile. | scenario: Tradeyard's newer services across three zones in AWS eu-west-1; Yardstick and MySQL in one co-located Amsterdam data center; self-hosted Solr; regional read-only standby after Q4 2028; Yardstick database backup to AWS and an edge browse-from-cache fallback. | `example`: The general recommendation. → Veldmark's position against it. |\n\n### Incident Management: When It Goes Wrong Anyway\n\n**Controlling idea** (`recommendation`, id `incidents`): Incident management in a marketplace sets severity by journey and time, communicates with professional customers, contains shared-platform blast radius and produces architectural actions.\n\n**Advances the thesis** (S2, S4): Applies journey objectives and pre-decided degradation to incidents that still happen.\n\n**Transition in:** `contrast`: Design that prevents or contains failure. → What happens when it goes wrong anyway.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p38 | explanation (list) | Incident management has the usual parts plus three marketplace emphases: severity follows journeys and time, professional customers need their own communication, and shared platforms have shared blast radius. | source: Adevinta incident reviews: a GitOps controller read a source-control outage as \"0 applications\" and began deleting applications across more than 30 clusters (2024); renaming node groups replaced about 40 nodes per group within a minute, one critical cluster took 8 minutes to recover (2023). |  |\n| p39 | example | Reviews should be blameless and produce architectural actions, as the brown-out review's accepted version did. | scenario: First draft: move the reindex, add two nodes; accepted version: the ladder, the peak calendar, the retry budget, bot classification at the edge and the journey SLOs, each with an owner and a date. | `sequence`: Handling an incident. → What the review afterwards should produce. |\n\n### Cost: Making Scale Visible per Unit of Work\n\n**Controlling idea** (`analysis`, id `cost`): Three unit costs, computed per brand through an ownership catalog, show where scale is cheap and where it is not, and the platform team and the group's duplicated stacks hold the largest levers.\n\n**Advances the thesis** (S6): Makes cost an architecture metric, the third part of the thesis.\n\n**Transition in:** `cause_effect`: The mechanisms built so far (shedding, caching, headroom), which change what the platform spends. → Cost per unit of work.\n\n**Order of paragraphs** (`large_to_small`): Definitions, Veldmark's baseline and its readings, documented levers, who holds them, and Veldmark's own largest lever.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p42 | definition (list) | Unit economics relate technology spending to its value, and three unit costs are worth computing for a listing platform: per thousand searches, per live listing per month and per contact. | quotation: FinOps Foundation: \"what an organization spends on technology and the value that technology spending creates\". |  |\n| p43 | evidence | Veldmark's 2027 baseline shows why the first two unit costs belong in architecture reviews. | table: Per brand: search cost (Tradeyard €6.0M, Motorvane €3.2M, Hearthly €2.6M, group €11.8M), query share (70/16/14%), cost per 1,000 queries (€0.030/0.070/0.065, group 0.042), platform run cost (€44M/27M/24M, group €104M incl. Keybridge €5M and group €4M), live listings, cost per live listing per month (€0.28/1.55/0.77). | `example`: The three unit costs. → Veldmark's figures for the first two. |\n| p44 | analysis | Three readings follow from the baseline: search is cheap per query and expensive in total, Motorvane's unit costs are highest and must be read against revenue, and about a third of Tradeyard's search cost serves automated clients. | reasoning: Run rates for infrastructure, not people, excluding the data estate; about 284 billion queries a year. | `cause_effect`: The baseline table. → What it means. |\n| p45 | evidence (list) | The best-documented FinOps work in classifieds, Adevinta's, points to platform-level levers: an ownership catalog, telemetry treated as a cost line, and platform defaults. | source: 732 AWS accounts and 425 Google Cloud projects in a catalog (2024); logging cost cut 35%, metrics ingested cut by more than 33% and the observability bill by more than 20% (2024); Intel to AMD up to €30,000 a month and a cheapest-first policy that hurt CPU-bound work (2024); ARM by default for thousands of applications, no savings figure (2023). | `contrast`: Veldmark's unit costs. → Where documented savings came from. |\n| p46 | claim | The platform team holds the largest cost levers, because its defaults apply to everyone. |  | `conclusion_summary`: Adevinta's three levers. → Who holds them. |\n| p47 | example | Veldmark's three search engines, three clouds and four observability stacks are the cost face of Deal-Shaped Architecture, and the September 2027 shared-search decision is justified by reliability and cost with tenancy isolation as a requirement. | scenario: Tradeyard and Hearthly to a shared Amazon OpenSearch Service platform, Motorvane on Elasticsearch until a 2029 review; one team doing rehearsals and ladders well instead of three; tenancy isolation per brand and country required. | `elaboration`: Platform defaults as the largest lever. → The largest duplicated cost at Veldmark. |\n\n### Veldmark Worked Example: The Brown-Out, Redesigned\n\n**Controlling idea** (`example`, id `worked`): A year later, at the same campaign slot and still on Solr, the redesigned platform shed or cached about 37% of peak requests, spent six minutes at level 2 and about 2% of its budget.\n\n**Advances the thesis** (S2, S3, S4): Tests the design against the scene's incident.\n\n**Transition in:** `problem_solution`: The mechanisms built section by section, and the brown-out that posed the problem. → The same campaign run against the redesigned platform.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p48 | evidence | On Sunday 16 January 2028 Tradeyard runs the same campaign slot against the redesigned platform, and the comparison shows the brown-out reduced to six minutes at level 2. | table: 17 January 2027 against 16 January 2028: origin requests ~13,000/s against ~8,200/s; ~2% against ~37% shed or cached; reindex in the window yes against blocked; no ladder against level 2 for 6 minutes; p99 ~7 s for 48 minutes against ~1.3 s for 6 minutes then ~450 ms; ~9% against under 0.2% failed; ~30% against ~2% of budget; two retries without backoff against one with jitter. |  |\n| p49 | synthesis | The redesign needed no new search engine, only an architecture that knows when the peak is, what is optional, who the bots are and how much budget remains. |  | `conclusion_summary`: The comparison table. → What made the difference. |\n\n### Trade-offs\n\n**Controlling idea** (`comparison`, id `trade-offs`): Each of the chapter's choices has a condition under which the other option is right, and the shared search platform is the most contested.\n\n**Advances the thesis** (S2, S3, S4, S5, S6): States when each recommendation does not hold.\n\n**Transition in:** `contrast`: The redesign's success at Veldmark. → When the same choices would be wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p50 | comparison | Eight decisions in the redesign have a real alternative, and the table gives the condition under which each option is right. | table: Reliability objectives, peak capacity, reindexing, degradation, regions, automated traffic, search platform, cost visibility: options A and B and when to choose each. |  |\n| p51 | analysis | The most contested trade-off is the shared search platform, whose blast radius is priced in through per-tenant isolation, staged country rollouts and peak-window freezes rather than avoided. |  | `emphasis`: The eight trade-offs. → The most contested one. |\n\n### Vertical Differences\n\n**Controlling idea** (`comparison`, id `verticals`): The verticals differ in traffic shape, most demanding journey, write load, scraper interest, professional SLAs and cost drivers, so the most important journey is not always search.\n\n**Advances the thesis** (S1, S2): Shows the journeys and peaks vary by vertical.\n\n**Transition in:** `contrast`: Trade-offs that hold for every vertical. → Where the verticals differ.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p52 | comparison | General classifieds, real estate and automotive differ in six reliability concerns. | table: Traffic shape, most demanding journey, write load, main scraper interest, professional SLAs and cost driver per vertical; Hearthly stores 1.8 billion images. |  |\n| p53 | example | In real estate the scarcest moments are not the busiest, so the alert journey outranks search latency, and in automotive lost lead delivery becomes a commercial dispute. | example: In a tight rental market the first alert wins the viewing, so a five-minute Hearthly alert outage can cost more trust than a slower search page; a dealer paying for a package expects leads, so an hour of lost lead delivery becomes a dispute. | `emphasis`: The six differences. → The two that change which journey matters most. |\n\n### Failure Modes\n\n**Controlling idea** (`analysis`, id `failure-modes`): Without journey objectives, a calendar, a ladder and bot classes, reliability fails in nine recognizable ways.\n\n**Advances the thesis** (S1, S2, S3, S4, S5, S6): Names what goes wrong when each part of the thesis is missing.\n\n**Transition in:** `contrast`: What the design should be in each vertical. → What happens without it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p54 | analysis (list) | Nine failure modes recur: the reindex at the peak, retry storms, unclassified bot load, degradation invented during the incident, uptime theater, the untested failover, platform changes at the peak, trust turned off for speed, and unowned telemetry. |  |  |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `ca-view`): The Chief Architect makes journeys, peaks, degradation, regions, automated traffic and unit costs group decisions with owners, and watches a short list of measures.\n\n**Advances the thesis** (S2, S3, S4, S5, S6): Turns the thesis into group-level decisions.\n\n**Transition in:** `problem_solution`: The nine failure modes. → The decisions that prevent them at group scale.\n\n**Order of paragraphs** (`chronological`): The decisions in the order the chapter built them (journeys, peak, degradation, regions, bots, cost), then what to watch.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p55 | recommendation | The group defines the liquidity journeys and indicators once, brands set objectives and name owners, and the Chief Architect makes sure they exist, are measured from the user's side and have budget policies that change behaviour. |  |  |\n| p56 | recommendation | The peak is a platform concept: the calendar, freezes, batch rules and rehearsals are cheap platform capabilities, and marketing joining the calendar is a governance decision. |  | `sequence`: Journeys and owners. → The peak as a platform concept. |\n| p57 | recommendation | Degradation and read-only modes must be funded deliberately, because features used a few times a year are not built unless they are on a roadmap with a date. |  | `sequence`: The peak calendar. → Funding for the modes that protect the peak. |\n| p58 | recommendation | The regional ambition is set explicitly: multi-zone plus tested read-only standby, active-active only with a business case, and single-site legacy like Yardstick first. |  | `sequence`: Degradation and read-only modes. → How far to go across regions. |\n| p59 | recommendation | Automated traffic is a cross-functional policy area involving SEO, legal, trust and safety and commercial teams, which engineering enforces. |  | `sequence`: Regional ambition. → Automated traffic policy. |\n| p60 | recommendation | Unit costs by brand belong in the quarterly architecture review next to journey SLOs, because they turn Common Ground's €38 million run-cost target into specific work. |  | `sequence`: Automated traffic policy. → Unit costs in the review. |\n| p61 | recommendation | The Chief Architect watches peak-window budget consumption, time in degraded modes, the automated share, edge cache hit ratios, cost per thousand human searches and batch jobs in peak windows, which should be zero. |  | `conclusion_summary`: The six decisions. → The measures that show whether they hold. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Ten questions let a reader test a platform against the chapter in a design review.\n\n**Advances the thesis** (S2, S3, S4, S5, S6): Turns the thesis into review questions.\n\n**Transition in:** `cause_effect`: The Chief Architect's decisions and measures. → Questions that test whether a platform has them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p62 | recommendation (list) | Ten questions test journeys, peak-window budgets, batch work, campaign notice, automated load, degradation modes, retries, regional loss, unit costs and platform freezes. |  |  |\n\n## Conclusion: From Platform to Leadership\n\n**Synthesis:** Reliability, peak planning and cost are one design, because each rests on the same knowledge: which journeys make liquidity and at which hours. Across Part VII, every platform capability gets the same three things: a published contract, an owner and a check that shows whether the contract holds, which is what lets brands rely on the platform without being ordered to.\n\n**So what:** The contracts exist on paper before they exist in a group assembled by acquisition: the brands must move onto them, teams must be organized to own them and the monolith must be retired while it serves traffic, a problem of change that Part VIII takes up.\n\n**Callback:** Ingrid's question in the scene (why nothing in the architecture knew the hour mattered), and for the part, the Part VII introduction's closing test (for any listing fact, where it is true, which copies hold it and how you would rebuild or erase them). The reader can now answer Ingrid's question with the journeys and peak window, and answer the part's test for the Rotterdam city bike's sale, with the listing-gone objective as the check that the removal reached every copy.\n\n**Takeaway** (`course_of_action`): Treat every platform capability as a contract with an owner and a check that it holds; Part VIII begins with platform-consolidation, the order in which acquired stacks move onto these contracts.\n\n**Hand-off** to [Part VIII — LEADERSHIP: The Chief Architect's Agenda](part-8.html): `time`: The platform beneath the marketplaces makes liquidity dependable at the moments that matter, and building it across acquired brands with teams never designed to work together is a leadership problem as much as an engineering one. → Change over time: consolidating acquired stacks onto the platform, organizing teams around it, retiring the monolith while it runs, controlling AI, and evolving the platform over a decade, beginning with platform-consolidation.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p63 | synthesis | Ingrid's question has one answer used four times: knowing which journeys make liquidity and at which hours sets the objectives, the calendar, the order of the ladder and the unit costs, so reliability, peaks and cost are one design. |  |  |\n| p64 | synthesis | Part VII's eight chapters give every platform capability a published contract, an owner and a check, which answers the part's opening test for the Rotterdam city bike, with the listing-gone objective as the check that its removal reached every copy. | reasoning: Contracts: the listing event, the register entry for each copy, the lifecycle rule, the metric definition, the experiment standard, the model registry entry, the tenant code and configuration schema, the journey objective; the bike's sale is true in Yardstick, held by the copies in the register, rebuilt from the event stream, erased through the register with a receipt. | `place`: The chapter's own synthesis. → The part's: the eight chapters this one closes. |\n| p65 | transition | The contracts exist on paper before they exist in a group assembled by acquisition, so building them across acquired brands and old teams is a leadership problem of change over time, which Part VIII takes up, beginning with platform-consolidation. |  | `cause_effect`: Contracts with owners and checks. → Why building them is a problem of change, and where that is taken up. |\n\n## Non-goals\n\n- Index design, aliases and reindex mechanics. See [Search Architecture for Listings: Indices, Freshness and Scale](search-architecture.html).\n- Event backbone and outbox. See [Every Change Is an Event: Event-Driven Listing Architecture](event-driven-listings.html).\n- Tenancy model. See [One Platform, Many Marketplaces: Multi-Country and Multi-Brand Architecture](multi-country-platforms.html).\n- AI crawler licensing and agent access. See [AI Across the Listing Lifecycle](ai-in-listing-systems.html).\n- Crawl budget and SEO status codes. See [Found by Google: Web, App and SEO Architecture for Listings](web-and-seo-architecture.html).\n- Fraud detection and scam patterns. See [Scams, Fakes and Account Takeovers: Fraud Prevention for Listings](fraud-prevention.html).\n- Messaging safety. See [From Interest to Contact: Messaging and Lead Management](messaging-and-leads.html).\n- Organizational design of on-call and platform teams. See [Who Owns What: Organizing Marketplace Engineering](organizing-marketplace-engineering.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- No classifieds operator published journey SLOs or degradation ladders; both are labeled recommendations. Replace with documented examples if they appear. (Carried over from spec.md.)\n- OLX's 2021 load-shedding post could not be retrieved; only its existence is cited. (Carried over from spec.md.)\n- Cost per contact is described but not computed for Veldmark; a later chapter or the toolkit may define it precisely. (Carried over from spec.md.)\n\n## Decision log\n\n- **2026-10-19** — Organized reliability around liquidity journeys rather than components, so that the chapter connects to the book's central idea.\n- **2026-10-19** — Placed degradation as a product decision made in advance, with a fixed order of sacrifice, rather than an operational runbook topic.\n- **2026-10-19** — Recommended multi-zone plus read-only standby over active-active for country-scoped groups; active-active needs a business case.\n- **2026-10-19** — Added Veldmark unit-cost baseline (search cost per brand, platform run cost) as canonical ledger facts so later chapters can reuse them.\n- **2026-11-12** — Converted spec.md to spec.json, reconstructed from the published index.md in its own order. Success criteria: the journeys, error-budget, capacity-model, ladder, regional, bot-control and unit-cost criteria are covered by the journal spec's AC-1 (the peak-hour outage probe) and the intent outcome; their lists of contents (citing Vinted and AWS, RFC 9309, Adevinta levers) are inventories and are dropped
