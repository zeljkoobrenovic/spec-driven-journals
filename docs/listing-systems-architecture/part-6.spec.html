<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published page (posts/part-6-intro/index.md) and its former spec.md (accepted 2026-10-21), which it replaces; one spec paragraph per unit of the page, in the page's order. Intent outcome, AC-1 to AC-3 and role are copied unchanged from the post's entry in journal-spec.json; the introduction realises Part VI's opening (hook, bridge, roadmap) from the same file. The journal spec gives this post no thesis, so the thesis and its three supporting claims are written here from the part's thesis and flow. The five callouts (IN THIS PART, WHY THE BUSINESS CARES, WHY ARCHITECTS SHOULD CARE, KEY POINTS, FAILURE PATTERNS) stand before the first paragraph and are kept as the house format; the KEY POINTS callout carries the part's claim in three bullets and the IN THIS PART callout names the five chapter subjects in reading order. Units added to the published page to meet the contract, in the shape the Part II to V introductions now share: a roadmap paragraph (p03) giving the reading order and the reason for it, a lead-in to the chapter table (p04), and a closing paragraph under 'Where to begin' (p07) with synthesis, callback and hand-off, grown from the published last line of the Veldmark section.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Part VI's argument: conversion and monetization are one pipeline with a conflict built in; contact needs a conversation and a lead as separate objects; the unit of charge chooses the architecture and every model spends liquidity; what was sold must be proved delivered.\n- **Know:** The five chapters in reading order and the question each answers, and the Veldmark cases and 2027 decisions they follow.\n- **Be able to:** Pick the Part VI chapter that answers the money problem in front of them.\n\n**Audience:** Chief architects, monetization and commercial-platform leads, and product and engineering directors who decide what a listing marketplace sells, how it is delivered and how it is billed (the journal's readers), who have read Part V and are about to start Part VI, or who arrive with a money problem in hand and want the chapter that answers it.\n\n**Already knows:**\n\n- What an API, a database, an event stream, a search engine and Kubernetes are; how to make and defend an architecture decision; what a ledger and an invoice are.\n- Part I's liquidity and match rate (buyers finding the right listing and making contact), Part IV's ranking with its relevance floor, and Part V's trust-and-safety platform, message controls, DAC7 perimeter and trader records (liquidity-and-network-effects, part-4, part-5, marketplace-regulation).\n- The fifteen named failure patterns, among them Fast Mail for Fraudsters, Multiplier Creep and Billing by Guesswork (where-listing-systems-go-wrong).\n- Veldmark in outline: a fictional group of four brands (Tradeyard, Motorvane, Hearthly, Keybridge) and a group ad unit, Ingrid Halvorsen its Group Chief Architect, the architecture advice forum, Tradeyard Safe Deal as its in-platform payment, and the recurring examples, among them Femke's Rotterdam city bike and the Essen Volkswagen Golf (meet-veldmark).\n\n**Does not yet know:**\n\n- Conversation versus lead, the message safety gate's verdicts and the lead contract (owned by messaging-and-leads; the KEY POINTS callout glosses a conversation as a private exchange and a lead as a commercial record delivered, counted and billed).\n- Unit of charge, system of record per model and guardrail metric (owned by monetization-models; the KEY POINTS callout names the six units and says a guardrail is owned outside the team that books the revenue).\n- Entitlement, entitlement ledger and paid effect (owned by products-and-entitlements; the KEY POINTS callout and the Veldmark thread name them, glossing Tally as the group entitlement service).\n- Header bidding, ad load and the ad policy layer (owned by advertising-platforms; the page uses 'header bidding' and 'ad load' only in the table's 'Read it when' column).\n- Order, payment edge, buyer protection and the transaction ledger (owned by transactions-and-payments; the page says 'in-platform payment, shipping or buyer protection').\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader of this page alone can name the five chapters' subjects in reading order. *Probe:* After reading only this page: what will each of the next five chapters tell you, in order? | `intro_predicts_content` | cold_reader | major |\n| AC-2 | Given situations the chapter table lists, the reader names the chapter to open. *Probe:* Your dealers' lead counts never match yours; separately, a dealer disputes an invoice you cannot explain; and the ad team changed the header-bidding timeout without a contacts guardrail. Using only this page, which chapter do you open for each? | `custom` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-4 | The reader can say what Part VI takes from earlier parts and which later part supplies what it needs. *Probe:* Using only this page: what does this part take from earlier parts of the book, and what does a later part supply to it? | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** What does this part argue, and in what order should its chapters be read?\n\n> **Claim:** Part VI argues that conversion and monetization are one pipeline with a conflict built in: a classifieds marketplace sells access to attention, and many of its revenue lines earn more when buyers see more pages or paid listings displace relevant ones, so every revenue line needs a record both sides can count, proof that what was sold was delivered, and a guardrail on the match rate it spends; its five chapters are read in the order money arises (the contact and its lead, the deal, the revenue models, the record of what sellers bought), with advertising last because it earns from page views rather than from matches.\n\n**Disputed by:** The common practice of treating each revenue line (chat, payments, visibility products, packages, ads) as a product owned by its own team and judged by its own revenue, so the money chapters are independent topics a reader may consult in any order.\n\n**So what:** A reader who accepts it reads messaging first, or opens the one chapter that answers the money problem in front of them, and judges any paid product by its unit of charge, the liquidity it spends and how its delivery would be proved, not by its business case alone.\n\n**How and why:** The lead defined in messaging is what monetization prices and products-and-entitlements bills; the transaction follows the contact into the deal; the entitlement ledger records what every model sold; advertising reuses those records and the contacts guardrail. Veldmark's 2027 decisions follow the same order: one conversation service and lead contract, three monetization proposals, the transaction platform funded first, Veldmark Ads rules with contacts per session as the guardrail, and Tally after 1,140 Motorvane dealers were overbilled.\n\n**Supporting claims**\n\n- **PVI-1** — The five chapters follow money in the order it arises, from the contact to the record of what sellers bought, with advertising last, and each is the chapter to open first for a recognizable symptom.\n- **PVI-2** — The money pipeline sits between the book's other parts: it takes the message safety gate, the DAC7 perimeter and trader records from Part V and the relevance floor from Part IV, and needs Part VII's events, governed metric and guardrailed tests.\n- **PVI-3** — Veldmark meets the money pipeline with €1.31 billion of revenue sold through four catalogs and a group ad unit, and answers with five 2027 decisions that the chapters design.\n\n## Role in the part\n\nPerforms the part's opening: states that conversion and monetization are one pipeline with a conflict built in, gives the reading order of the five chapters, and frames them with Veldmark's revenue, the city bike and the Essen Golf, and five 2027 decisions.\n\n## Flow\n\n**Pattern:** `large_to_small` (also `prerequisite_order` in p03 and the chapter table in p04: the five chapters in the order money arises, each pricing or recording what the one before produced)\n\nThe page opens where Part V left off (contact made safe) and on what a classifieds site sells (access to attention), states the part's claim (one pipeline with a conflict built in), then gives the reading order with the reason for it and narrows to one row per chapter with the symptom that sends a reader there. It widens once to place the pipeline in the book, shows Veldmark's revenue and five 2027 decisions, and ends with a short synthesis, the part's test and the hand-off to the first chapter. The order is given before the table because the rows read as a sequence only once the reader knows that each chapter prices or records what the one before produced; the connection section follows the table because it says what the chapters take from Parts IV and V and need from Part VII; the Veldmark section follows because its decisions are what the chapters design; the conclusion comes last and holds no new material. Put Veldmark first and its decisions arrive before the reader knows which chapter designs each; put the connection first and it names the safety gate, DAC7 and the relevance floor before the reader has met the chapters that use them.\n\n## Introduction\n\n**Hook** (`direct_statement`): Part V made contact between strangers safe enough to happen. A classifieds site usually steps aside before the sale, so it charges for access to attention: the right to list, a better position, a package of slots, a lead, an advertisement.\n\n**Bridge:** Part V's trust platform, which made contact between strangers safe enough to happen. → What the marketplace earns from that contact, and the conflict built into its revenue: core revenue comes when buyers find the right listing quickly, while many revenue lines earn more when buyers see more pages or paid listings displace relevant ones.\n\n**Thesis statement** (KEY POINTS callout; paragraph p02 (bold phrase)): Conversion and monetization are one pipeline with a conflict built in; each revenue line sells attention while its cost to the match rate is measured and capped.\n\n**Roadmap** (IN THIS PART callout; paragraph p03):\n\n- Five chapters in the order money arises: first the contact, whose lead later chapters price and bill; then the payment that closes the deal; then the revenue models and the record of what sellers bought; and advertising last, because it earns from page views rather than matches; a table says when to open each. *Kept in:* chapters.\n- After the table, a section placing the part between Parts IV, V and VII, and the Veldmark thread showing the decisions the chapters design. *Kept in:* connects, veldmark.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Part V made contact between strangers safe enough to happen, and Part VI turns to what the marketplace earns from it: a classifieds site usually steps aside before the sale, so it charges for access to attention. | example: The things a classifieds site sells: the right to list, a better position, a package of slots, a lead, an advertisement. |  |\n| p02 | claim | The part's claim is that conversion and monetization are one pipeline with a conflict built in: core revenue comes when buyers find the right listing quickly, many revenue lines earn more when buyers see more pages or paid listings displace relevant ones, and the chapters design each revenue line to sell attention while measuring and capping what it costs the match rate. | figure: Figure 1: a pipeline in which attention becomes contacts and then revenue, with paid products feeding in through capped valves and a match-rate gauge below. | `problem_solution`: Charging for access to attention. → The conflict that creates and the part's answer: one pipeline whose revenue lines are measured and capped against the match rate. |\n| p03 | transition | The chapters follow money in the order it arises: the contact first, because later chapters price and bill its lead, then the payment that closes the deal, the revenue models and the record of what sellers bought, and advertising last, because it earns from page views rather than matches; a table says when to open each chapter, a section places the part between Parts IV, V and VII, and the Veldmark thread shows the decisions the chapters design. |  | `elaboration`: The chapters that design each revenue line. → The order in which they are read, and why. |\n\n## Sections\n\n### Chapters in this part\n\n**Controlling idea** (`description`, id `chapters`): Each of the five chapters answers one question and is the one to open first for a recognizable symptom.\n\n**Advances the thesis** (PVI-1): Lists the chapters in reading order with the question each answers and the symptom that sends a reader to it.\n\n**Transition in:** `elaboration`: The five chapters in the order money arises. → One row per chapter: its question and when to open it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p04 | description | Each row of the table gives a chapter's question and the symptom that should send a reader to that chapter. | table: Five rows in reading order: messaging-and-leads (scams close in your chat, or dealers' lead counts never match yours), transactions-and-payments (adding in-platform payment, shipping or buyer protection, or finance cannot match refunds and payouts to orders at month-end), monetization-models (a new revenue model is proposed, or price rises meet professional pushback), products-and-entitlements (a price change needs a release, or a dealer disputes an invoice you cannot explain), advertising-platforms (ad load, header bidding or consent changes are made without a contacts guardrail). |  |\n\n### How this part connects\n\n**Controlling idea** (`context`, id `connects`): The money pipeline takes three threads from Part V and the relevance floor from Part IV, and needs Part VII's plumbing.\n\n**Advances the thesis** (PVI-2): Says what the pipeline inherits from earlier parts, what a later part supplies and where the payments depth lives.\n\n**Transition in:** `place`: The five chapters of the pipeline. → Where the pipeline sits in the book: what it takes from Parts IV and V and what Part VII supplies.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | context | Part V hands this part three threads (the message safety gate, DAC7 seller reporting brought into scope by in-platform payments, trader records that feed billing), paid effects sit under Part IV's relevance floor, Part VII supplies the plumbing (events, a governed contact metric, guardrailed pricing tests), and the sibling book holds the payments and ledger depth behind Safe Deal. |  |  |\n\n### The Veldmark thread\n\n**Controlling idea** (`example`, id `veldmark`): Veldmark sells through four separate catalogs and a group ad unit, and Ingrid Halvorsen's team answers with five 2027 decisions that the chapters design.\n\n**Advances the thesis** (PVI-3): Shows the group's starting point, the two recurring cases and the decision each chapter designs.\n\n**Transition in:** `example`: The pipeline and the parts around it. → Veldmark's revenue, its two recurring money cases and its five 2027 decisions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | example (list) | Veldmark (fictional) earned €1.31 billion in 2026 through four separate product catalogs and a group ad unit; Femke's city bike and the Essen Golf's leads carry the thread, and Ingrid Halvorsen's team and Olivier Petit (VP Monetization) take one 2027 decision per chapter, listed in chapter order. | scenario: €1.31 billion of 2026 revenue sold through four product catalogs and a group ad unit; Femke's Rotterdam city bike sold for €225 through Tradeyard Safe Deal; a Volkswagen Golf in Essen with 23 raw leads (19 once repeat contacts are merged). Decisions, in chapter order: one group conversation service with a message safety gate (May 2027), live for Tradeyard NL and BE in November 2027, and a lead event contract with a stable lead ID in Q1 2028 (messaging-and-leads); a transaction platform funded before any Safe Deal expansion (September 2027: Safe Deal Portugal approved for Q3 2028, Motorvane private-car 'secure handover' left at design study, protected rental deposits in Spain declined) (transactions-and-payments); three monetization proposals at the advice forum in May 2027 (Top listing price rise approved, Motorvane per-lead 'lead ledger' counted but not billed, Hearthly commission pilot for 2028) (monetization-models); Tally, the group entitlement service, designed in October 2027 after an audit found 1,140 Motorvane dealers overbilled for cars never published (products-and-entitlements); Veldmark Ads rules (July 2027: contacts per session as the guardrail for ad changes, at most three paid positions in the first ten rows on Tradeyard Poland from Q1 2028) (advertising-platforms). |  |\n\n## Conclusion: Where to begin\n\n**Synthesis:** Read together, the chapters give every revenue line a record both sides can count, proof of delivery and a guardrail on the match rate.\n\n**So what:** That is how the marketplace sells attention without selling out its liquidity, and how a reader can answer the part's test for any paid product.\n\n**Callback:** The opening (p01): a classifieds site charges for access to attention. The closing paragraph says how that attention can be sold without selling out the liquidity the marketplace lives on.\n\n**Takeaway** (`course_of_action`): By the end of Part VI, say for any paid product which unit it charges for, what liquidity it spends and how you would prove it was delivered; begin with messaging-and-leads.\n\n**Hand-off** to [From Interest to Contact: Messaging and Lead Management](messaging-and-leads.html): `elaboration`: The part introduction's first key point, that contact is the marketplace's output and needs two objects, a conversation and a lead. → The conversation and the lead as separate objects, the safety gate on the delivery path, and the lead contract with professionals' systems.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | synthesis | Read together, the chapters give every revenue line a record both sides can count, proof of delivery and a guardrail on the match rate, so the marketplace sells attention without selling out its liquidity and a reader can say, for any paid product, which unit it charges for, what liquidity it spends and how its delivery would be proved; a reader begins with messaging-and-leads. |  |  |\n\n## Non-goals\n\n- Re-teaching any chapter's content; defining lead, VAS, entitlement or ad stack beyond one clause; the chapters own them and the page points to them. See [From Interest to Contact: Messaging and Lead Management](messaging-and-leads.html), [Beyond the Contact: Payments, Shipping and Buyer Protection](transactions-and-payments.html), [How Listing Marketplaces Make Money](monetization-models.html), [Packages, Bumps and Quotas: Products, Pricing and Entitlements](products-and-entitlements.html), [Selling Attention: Display, Native and Retail-Media Advertising](advertising-platforms.html).\n- Payments and ledger depth behind Safe Deal. See [Payments for Finance Architects: Eleven Reasons the Numbers Disagree](../finance-systems-architecture/payments-fundamentals.html).\n- External factual claims; the page cites no company facts and needs no sources.\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-10-19** — Modeled on part-2 (callout set, chapter table, connections, Veldmark thread, hand-off) so all part intros look alike.\n- **2026-10-19** — Failure patterns limited to the three strongest for the part; Vanity Liquidity left to the chapters.\n- **2026-10-19** — The Veldmark thread lists decisions only; figures stay in the chapters, except the €1.31 billion group revenue and the overbilling count that motivate the part.\n- **2026-10-19** — Chapter 29 row and the Veldmark thread updated from the written transactions-and-payments chapter (former open question, resolved).\n- **2026-11-12** — Converted spec.md to spec.json. Success criteria: the callout-format, argument, chapter-table, connection, Veldmark-facts, hand-off and word-count criteria were inventories of contents or format and are dropped (format stays governed by the style guide; Veldmark facts by the ledger; the hand-off is now conclusion.hand_off; the word count is length.max_words). They are replaced by the journal spec's AC-1 to AC-3 and one added minor criterion, AC-4 (what the part takes from earlier parts and what Part VII supplies), which tests the connection section. Rejected: Carrying the success criteria over as written (inventories).\n- **2026-11-12** — Thesis and supporting claims PVI-1 to PVI-3 written here, since the journal spec's entry for this post has none: the question is the entry's question; the claim condenses the part thesis to what this page argues (one pipeline with a conflict built in, and the reading order). For the author to confirm. Rejected: Copying the part thesis whole, which this page summarizes but does not argue.\n- **2026-11-12** — Word limit: max_words 1,000 by check_draft's co d 2. (AI-mediated session)\n- **2026-10-21** — Renamed failure patterns to match where-listing-systems-go-wrong. (AI-mediated session)\n- **2026-10-20** — Sharpening pass: 742 → 746 prose words; two sentences tightened (the part argument now says what the chapters design; the Part V threads read as one list); no heading, section or fact changes. (AI-mediated session)\n- **2026-10-19** — Added 1 inline illustration (article-illustrator); figures renumbered. (AI-mediated session)\n- **2026-10-19** — Editorial review pass: chapter 29 row rewritten from the written chapter, Safe Deal transaction-platform decision added to the Veldmark thread, Golf leads labeled raw versus merged. (AI-mediated session)\n- **2026-10-19** — Initial spec and article. (AI-mediated session)\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
