<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, acceptance criteria AC-1 to AC-3, the thesis and the role are copied unchanged from the messaging-and-leads entry in journal-spec.json. Added units not in the published text: the roadmap paragraph p04 and the synthesis paragraph p75.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The difference between a conversation and a lead (owner, lifecycle, retention), and the contact channels compared by what the platform sees, safety leverage and attribution quality.\n- **Know:** The contact path: contact policy, conversation storage and real-time delivery, the message safety gate, the lead service, lead routing and delivery adapters, and the outcome feedback loop.\n- **Know:** Lead creation and deduplication rules, the lead state machine, push versus pull delivery (Rightmove's export contract), retention per data class, attribution, ROI and disintermediation.\n- **Believe:** Safety checks belong on the delivery path, before the recipient sees a message, because that is where scams close.\n- **Believe:** A lead is a governed contract with the professional's systems, not an e-mail, and changing the lead-creation rule is a pricing change.\n- **Be able to:** Place a synchronous safety gate with a latency budget and verdicts on the delivery path, and say what runs asynchronously.\n- **Be able to:** Define a lead-creation and deduplication rule and a delivery contract that portal and professional can reconcile.\n- **Be able to:** Decide which parts of messaging a group shares and who owns the gate, the verdict logic, billable lead states and retention.\n\n**Audience:** Chief architects, principal engineers and engineering leaders of classifieds, real-estate and automotive marketplaces who own or depend on messaging and lead delivery; product and monetization leaders who sell leads to professionals; trust-and-safety leads who need to know where their checks attach to messaging.\n\n**Already knows:**\n\n- What an API, a database, an event stream, a search engine, a webhook and Kubernetes are; p99 and p95 latency.\n- From earlier chapters: Veldmark (fictional) and its brands Tradeyard, Motorvane, Hearthly and Keybridge, the cast (Ingrid Halvorsen, Aisha Rahman, Lucía Ortega), the Common Ground program, the architecture advice forum, Yardstick, Tradeyard Safe Deal, Dealer Hub, the Rotterdam city bike, the Essen Golf, the Lyon apartment, bounded contexts and anti-corruption layers, listing events, entity resolution, the trust-and-safety platform's synchronous gate and asynchronous path, fraud signals, DSA statements of reasons, disintermediation, and the failure patterns Ghost Inventory and Vanity Liquidity.\n- From the part introduction: contact is the marketplace's output and needs two objects, a conversation and a lead.\n\n**Does not yet know:**\n\n- The terms this chapter owns: conversation, lead and lead routing; 'connection' as a portal-specific count.\n- Lead-delivery practice: DMS and CRM integration, ADF XML, Rightmove's Real Time Datafeed, pull versus push delivery and exactly-once on a lead ID.\n- Message-store design: hot partitions, per-participant inbox indexes, idempotency keys.\n- The legal frame of message scanning: GDPR legitimate interest and the EECC's 'interpersonal communications service'.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a phishing message and a lead-count dispute, the reader places each control on the contact path. *Probe:* A seller receives a link to a fake payment page sixteen minutes after her first buyer contact; the check that should catch it runs after the message is stored and pushed. Separately, a car produced 23 contacts on your portal (14 e-mails, 7 calls, 2 bookings) and the dealer's CRM shows 14 leads. Using only this chapter: where should the check sit, and how do you make both sides count the same leads? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-4 | Given a proposal to count billable leads from the chat store and to copy message text into the data warehouse, the reader says why both are wrong and what to build instead. *Probe:* Your team proposes to bill dealers per lead by counting conversations in the chat database, and to copy all message text into the data warehouse for analytics. Using only this chapter: what is wrong with each proposal, and what would you build instead? | `custom` | cold_reader | minor |\n| AC-5 | Given a small vendor polling with overlapping windows and a dealer group wanting leads in seconds, the reader chooses a delivery style for each and says who deduplicates. *Probe:* A small agency-software vendor polls your lead export every 15 minutes, always asking for the last 20 minutes, and complains of duplicate leads; a large dealer group wants each lead in its CRM within seconds and wants proof it arrived. Using only this chapter: what do you tell each, and who removes duplicates in each case? | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** How should a marketplace connect buyers and sellers so contacts become deals, without creating a scam channel?\n\n> **Claim:** A marketplace should model the moment of contact as two objects with different owners and retention, a platform-held conversation and a commercial lead, with only the conversation service storing message content; safety checks on links, domain age, payment and contact details, images and QR codes belong on the delivery path as a synchronous gate with a fixed latency budget (150 ms p99 at Veldmark) and four verdicts (deliver, deliver with warning, withhold, block), fail-closed for links and payment details from new accounts, while slower conversation-level scoring can withdraw messages afterwards; and a lead is a versioned contract with the professional's systems, with one creation and deduplication rule across channels, a stable lead ID, push or pull delivery acknowledged exactly once, and outcome feedback, so portal and professional count the same leads before any lead is billed.\n\n**Disputed by:** The common practice of building messaging for delivery speed with safety checks after delivery or only on user reports, using the chat store as the lead database or the CRM e-mail as the only lead record, and counting every message, call and form submission as a lead.\n\n**So what:** A Chief Architect who accepts this shares one conversation service and safety gate across brands while each keeps its own interface, makes the lead contract a governed interface with an owner, a schema registry entry and a versioning policy, reviews any change to the lead-creation rule as a pricing change, and puts time to first reply, gate p99 and fail-open rate, lead acknowledgement rate and the reconciliation gap between portal and CRM lead counts on the group dashboard.\n\n**How and why:** On 7 March 2027 a link to a fake Safe Deal page reached Femke sixteen minutes after her first buyer contact, because Tradeyard's deny-list check ran after the message had been stored and pushed and the domain had been registered that afternoon; the account had already reached nine other sellers, and 37 similar messages were withheld only after an analyst wrote a rule that evening. Under a gate, the domain-age rule withholds the message and Femke never sees it. The Essen Golf's 23 contacts were 23 leads to Motorvane and 14 in the dealer's CRM, because calls and bookings were never exported and a repeat e-mail counted twice; under one deduplication rule and a stable lead ID both sides count 19, which a per-lead charge on Motorvane's €40 million lead and referral line needs.\n\n**Supporting claims**\n\n- **S1** — The moment of contact is two objects, a platform-held conversation and a commercial lead created from contacts by a versioned rule, with different owners, lifecycles and retention, and only the conversation service stores message content.\n- **S2** — Contact channels differ in what the platform sees, its safety leverage and the quality of attribution, and a channel the platform cannot see it can neither protect nor count.\n- **S3** — Safety checks on messages belong on the delivery path as a synchronous gate with a fixed latency budget and four verdicts, fail-closed for links and payment details from new accounts, with slower scoring withdrawing messages afterwards, under a written legal position on scanning.\n- **S4** — A lead is a versioned contract with the professional's systems: one creation and deduplication rule across channels, a stable lead ID, typed qualification, states both sides recognize, versioned routing and push or pull delivery acknowledged exactly once, so both sides count the same leads.\n- **S5** — Lead value is proven downstream, with outcome data from the professional's systems, and users are kept on the platform with value rather than walls.\n- **S6** — A group shares the conversation service and the safety gate, governs the lead contract with explicit owners, and measures the contact path rather than contact volume.\n\n## Role in the part\n\nDefines the conversation, the lead and the safety gate on the contact path, the objects the rest of the part prices, bills and measures, and shows which of them a group shares. Supports P6-1, P6-6 of part `part-6`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in scene poses Ingrid's two questions (where safety checks sit, what a lead is); the worked example answers them after the body has built the design; `chronological` in channels, architecture, safety, leads, routing and attribution follow one contact through its life: how it arrives, how it is carried and checked, how it becomes a lead, how the lead is delivered and what it produces; retention follows both objects to the end of that life)\n\nThe definitions come before anything else because every later section is about either the conversation or the lead. The channels come next because the architecture's components exist to handle them. The safety gate follows the architecture because it sits on the step between stored and shown that the delivery tiers expose. Leads, routing and attribution then follow the lead from creation to outcome; placed before the conversation sections, the lead rule would merge contacts the reader has not seen arrive. Retention comes after attribution because its rules cover both objects, including the lead copy in the professional's CRM and the export window of the pull contract; placed after safety, as first drafted, it treated lead records before the lead sections had introduced them. The worked example can only replay the cases once both objects and their controls exist; trade-offs, vertical differences, failure modes, the Chief Architect's view and the questions apply the whole design, so they come last. The public-record evidence is not a section of its own: in three positions (after attribution, after retention, before the Chief Architect's View) both flow readers could not tell why it was there, so Adevinta's shared chat supports the Chief Architect's first decision and CarGurus' consent point is the fourth channel observation.\n\n## Introduction\n\n**Hook** (`direct_statement`): Search, ranking and alerts exist to produce one event: a buyer deciding to contact a seller. The contact is the last moment the marketplace can see both parties at once, and the last moment it can protect either of them.\n\n**Bridge:** Architects who built Part IV's search, ranking and alerts to bring buyers to listings, and who read in the part introduction that contact is the marketplace's output. → At the moment of contact a private seller's conversation and a professional's lead meet, and most platforms model only one of them.\n\n**Thesis statement** (KEY POINTS callout (all three bullets) and paragraphs p02 and p03; the scene's last paragraph (p10) poses the two questions the body answers.): Model the contact as two objects, a platform-held conversation guarded by a safety gate on the delivery path and a lead delivered to professionals as a versioned contract both sides can count, and prove lead value with outcomes that flow back.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p04, which lists the sections in order and names the kinds of evidence.):\n\n- Two Veldmark cases: the Rotterdam city bike and the Essen Golf. *Kept in:* scene.\n- Definitions of contact, conversation and lead. *Kept in:* concepts.\n- The contact channels compared. *Kept in:* channels.\n- The contact path and its safety gate. *Kept in:* architecture, safety.\n- Leads from creation through routing and delivery to attribution. *Kept in:* leads, routing, attribution.\n- Retention for messages and leads. *Kept in:* retention.\n- Both cases replayed under Veldmark's 2027 design. *Kept in:* worked.\n- Trade-offs, vertical differences, failure modes, the Chief Architect's view and review questions. *Kept in:* trade-offs, verticals, failure-modes, ca-view, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Search, ranking and alerts exist to produce one event, a buyer deciding to contact a seller, which is the marketplace's unit of output and the last moment it can see, and protect, both parties at once. |  |  |\n| p02 | claim | Two different systems meet at that moment: for private sellers the contact is a conversation, for professionals it is a lead that their software receives and counts, and most platforms start with one and bolt the other on. | example: General classifieds start with chat and discover dealers want CRM leads; vertical portals start with e-mail leads and discover buyers want chat, where the fraud is. | `elaboration`: The contact as the unit of output. → The two objects that share the contact: the conversation and the lead. |\n| p03 | transition | This chapter treats both objects as first-class and opens Part VI because the contact is the first thing the marketplace can count and charge for; it owns the terms lead, conversation and lead routing and leaves fraud detection, the moderation pipeline and the professional's tooling to their own chapters. | reasoning: monetization-models prices the lead, products-and-entitlements bills it, transactions-and-payments starts from the offer agreed in a conversation; fraud-prevention, trust-and-safety-architecture and professional-seller-tooling own the neighbouring topics. | `elaboration`: The two objects. → Why the chapter that defines them opens Part VI, and what it leaves to neighbouring chapters. |\n| p04 | transition | The chapter starts from two Veldmark cases, defines the contact, the conversation and the lead, compares the channels, lays out the contact path and its safety gate, follows leads from creation through routing and delivery to attribution, sets retention for messages and leads, replays both cases under Veldmark's 2027 design, and ends with trade-offs, vertical differences, failure modes, the Chief Architect's view and review questions, drawing on dated company engineering posts and investor filings, EU law and the fictional Veldmark. |  | `sequence`: What the chapter covers and leaves out. → The order of the sections and the evidence they use. |\n\n## Sections\n\n### Setting the Scene at Veldmark: Fourteen Conversations and Twenty-Three Leads\n\n**Controlling idea** (`example`, id `scene`): A phishing link delivered sixteen minutes after Femke's first contact and a lead count the dealer could not reconcile pose the chapter's two questions: where safety checks sit in a message's life, and what a lead is as an object both sides can count.\n\n**Advances the thesis** (S3, S4): Shows the cost of a late safety check and of an uncountable lead, and poses the questions the body answers.\n\n**Transition in:** `example`: Veldmark as the running example. → The two spring 2027 cases.\n\n**Order of paragraphs** (`problem_solution`): The two cases come first because each poses one of the questions the body answers; the questions close the section so the reader carries them into the definitions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | context | In early 2027 Veldmark ran four contact systems, and two cases from that spring set the agenda for its messaging work. | fact: Veldmark is the fictional group the book follows (meet-veldmark). |  |\n| p06 | example | On 7 March 2027 a link to a fake Safe Deal payment page reached Femke at 20:11, sixteen minutes after her first buyer contact, because Tradeyard's deny-list check could not know a domain registered that afternoon; she reported it and the account was suspended at 20:26. | case: €240 city bike listed 19:42, searchable 19:48, 312 saved searches, first message 19:55, 14 conversations; phishing link 20:11; report 20:19; suspension 20:26; 37 similar messages withheld by a rule written that evening; sold Monday 8 March for €225 via Safe Deal pay at pickup. | `example`: The two cases. → The first case: the Rotterdam city bike. |\n| p07 | analysis | The problem Ingrid and Aisha saw was not the seven minutes from report to suspension but that the check ran after the message was stored and pushed, by which time the account had reached nine other sellers who were never warned. | reasoning: Sixteen minutes from first contact to phishing link; nine other sellers contacted before the report. | `cause_effect`: The city bike timeline. → What it shows: the check sat in the wrong place. |\n| p08 | example | On 14 April 2027 the Essen Golf produced 23 raw leads on Motorvane but only 14 in Autohaus Ruhrblick's CRM, because calls and bookings were never exported and a repeat e-mail counted twice, so the two sides counted different things with no shared lead identifier. | case: €21,900 2021 Golf from the DMS feed; 14 e-mails, 7 calls, 2 test-drive bookings in ten days; sold 29 April; CRM showed 14; calls and bookings only in Dealer Hub; two of the fourteen the same person. | `contrast`: The safety problem in a private sale. → The second case, explicitly a counting problem rather than a safety problem. |\n| p09 | cause_effect | The gap mattered beyond one car because Motorvane, which earns €40 million a year from leads and financing referrals, was about to charge per lead, and a per-lead charge on a number the dealer cannot reconcile generates disputes. | statistic: Motorvane's €40 million leads and financing referrals line; proposed per-lead charge above a monthly allowance. | `cause_effect`: The 23 against 14 gap. → Why it matters: the planned per-lead charge. |\n| p10 | transition | Ingrid took two questions to the architecture advice forum in May 2027: where safety checks should sit in a message's life, and what a lead is as an object both Veldmark and a dealer can count. |  | `conclusion_summary`: Both cases. → The two questions the chapter answers. |\n\n### Concepts: Contact, Conversation, Lead\n\n**Controlling idea** (`definition`, id `concepts`): A contact is an event, a conversation is the platform-held thread, a lead is a record created from contacts by a versioned rule, and the conversation and the lead differ in almost every property.\n\n**Advances the thesis** (S1): Defines the objects the architecture is built from.\n\n**Transition in:** `problem_solution`: Ingrid's question what a lead is. → Definitions that answer it.\n\n**Order of paragraphs** (`large_to_small`): The vocabulary comes first, then the one distinction the chapter turns on, then the rule that links contacts to leads, which needs both definitions. With the rule first, it would count leads before the reader knew a lead differs from a conversation.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p11 | definition (list) | Ingrid's question what a lead is needs definitions first, so the book fixes contact, conversation, message, lead, lead routing and connection, owning conversation, lead and lead routing, because the industry uses these words loosely and published counts differ. | quotation: CarGurus' FY2025 10-K defines connections to include clicks to directions; Zillow's 10-K calls Premier Agent connections 'validated customer connections, or leads'. |  |\n| p12 | comparison | The conversation and the lead often begin with the same click, but almost every property differs: purpose, owner, lifecycle, identity, what counts, retention, risk and link to revenue. | table: Conversation versus lead across purpose, owner, lifecycle, record identity, what counts, retention driver, main risk and monetization link. | `emphasis`: The definitions. → The central distinction between conversation and lead. |\n| p13 | claim | A lead is created from a contact by a rule that changes the number on a professional's invoice, so the rule needs an owner and a version like a pricing rule. | example: Typical rules: first message in a new conversation; calls above a duration threshold; every booking; repeat contacts within a window update the existing lead.; figure: Figure 1: one click forking into a guarded conversation and a counted lead record. | `elaboration`: The lead as a different object. → How a lead is created from contacts, and why the rule is a pricing decision. |\n\n### Contact Channels: What the Platform Sees\n\n**Controlling idea** (`comparison`, id `channels`): Each contact channel gives the platform a different view of the exchange, a different safety lever, a different attribution quality and its own legal obligations, and what the platform cannot see it can neither protect nor count.\n\n**Advances the thesis** (S2): Compares the channels on the three properties the design depends on.\n\n**Transition in:** `elaboration`: The contact as an event with many forms. → The channels through which a contact happens.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The table states the comparison; the four observations each draw one consequence from it, ordered from safety (needed by the next sections) to lead quality and attribution (needed by the lead sections), ending with the consent each channel must record, which the architecture's contact policy and the retention rules carry. Reversed, the lead-quality and attribution observations would arrive before the safety point the next three sections build on. The consent observation sat in a separate public-record section until 2026-11-12; both flow readers in three rounds could not say why that section was separate.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | comparison | Each way a buyer can reach a seller gives the platform a different view of the exchange, a different lever for safety and a different quality of attribution, and four observations follow from the comparison. | table: Eight channels (chat, e-mail form or relay, visible phone, masked phone, callback, booking, offer or reservation, application) by what the platform sees, safety leverage, attribution quality and typical fit. |  |\n| p15 | claim | Every channel the platform cannot see is a channel it cannot protect, because classifieds fraud is mostly pre-payment and the conversation is the platform's last chance to intervene. |  | `sequence`: The comparison. → The first observation: visibility is protection. |\n| p16 | evidence | Channels with more friction produce better leads, as Autotrader's reservation figures show, though pushing such a channel too fast has a cost. | statistic: Autotrader FY26: 137,000 Deal Builder reservations (49,000 the year before), enquiries that 'convert at double the rate into sales'; a fall in retailer numbers partly attributed to 'the speed and nature' of the roll-out. | `sequence`: The first observation. → The second: friction and lead quality. |\n| p17 | claim | Channels evolve away from what the platform cannot attribute: whatever a portal cannot deliver into the professional's system it reports only in its own dashboards, where it is easy to dispute. | fact: Rightmove's RTDF change log: version 1.3.6 (April 2021) removed the phone-lead calls, leaving e-mail lead exports; the specification gives no reason. | `sequence`: The second observation. → The third: attribution shapes which channels survive. |\n| p58 | claim | Channels carry their own law, as CarGurus' 10-K shows by listing TCPA compliance as a risk, so a contact channel is also a consent record the platform must keep. | fact: CarGurus lists TCPA compliance as a risk because its platforms send texts and calls. | `sequence`: The third observation. → The fourth: each channel is also a consent record. |\n\n### Architecture: The Contact Path\n\n**Controlling idea** (`description`, id `architecture`): The contact path has eight components with explicit boundaries, of which only the conversation service stores message content, and its store and delivery tiers are shaped by busy inboxes and by the step between stored and shown.\n\n**Advances the thesis** (S1, S3): Lays out the components and the two boundaries the conversation-lead split depends on.\n\n**Transition in:** `elaboration`: What each channel lets the platform see. → The components that carry contacts through the platform.\n\n**Order of paragraphs** (`large_to_small`): The whole path first, then component ownership, then the two boundaries the conversation-lead split depends on, then the storage and delivery details of the one component that holds content; the section ends on the step between stored and shown so the safety section can pick it up.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | description | Whatever the channel, contacts pass through one contact path of eight components, and Figure 2 shows the reference architecture Veldmark adopted, which is not a description of any real company's systems. | figure: Figure 2: contact policy, conversation service calling the gate before delivery, lead service, routing and outcome feedback. |  |\n| p19 | description | A table states what each component owns and what it must not own. | table: Contact policy, conversation service, message safety gate, real-time gateway, call tracking, booking service, lead service, lead routing and delivery: responsibility, owns, does not own. | `elaboration`: The eight components. → Their ownership boundaries. |\n| p20 | explanation | Contact policy is where friction for new accounts lives: capping how many sellers a new account may contact per hour and masking contact details until the account has history. | quotation: Experts for Ofcom recommend 'creating delays between creating an account and reaching a large audience'. | `elaboration`: The component table. → The first component's job in practice. |\n| p21 | transition | Two boundaries cause most of the trouble when they are blurred. |  | `emphasis`: The components and their ownership. → The two boundaries that matter most. |\n| p22 | claim | The listing is referenced, not copied: a conversation keeps only a small snapshot, and listing events must close contact when the listing is sold or removed, or the inbox keeps accepting messages as Ghost Inventory. | case: The city bike marked sold at 18:10 on Monday should close new contact within seconds. | `sequence`: Two boundaries. → The first: listing reference. |\n| p23 | claim | Only the conversation service stores message content: leads carry the first message and consented contact details, analytics receive message events without content, and every extra copy has to be found, secured and deleted. |  | `sequence`: The first boundary. → The second: one store of message content. |\n| p24 | description | A conversation store has a simple access pattern, users reading their own inbox newest first, and a demanding volume of small writes to messages whose content is immutable but whose metadata changes. |  | `elaboration`: The conversation service as the only store of content. → What that store must handle. |\n| p25 | evidence | OLX's 2021 account of chat on Cassandra shows how mutable metadata on 'immutable' messages shapes the store, down to the compaction strategy. | quotation: OLX stored chat on Cassandra partitioned by user, with chats and threads tables, and moved from time-window to leveled compaction because 'additional states have to be associated with the messages'. | `example`: Mutable metadata on immutable messages. → A marketplace's documented store. |\n| p26 | evidence | Discord's 2023 account shows the problem at scale: messages partitioned by channel and time bucket, and hot partitions solved by request coalescing and a database migration. | statistic: 177 Cassandra nodes to 72 ScyllaDB nodes; p99 historical fetch from 40-125 ms to 15 ms. | `similarity`: OLX's store. → A larger public example outside marketplaces. |\n| p27 | recommendation (list) | In a listing marketplace the hot partition is the busy inbox, so the recommended design partitions messages by conversation, keeps a per-participant inbox index, treats professional inboxes as a separate product, uses idempotency keys and stores attachments as references. | example: A dealer with hundreds of open conversations; an agency branch with a popular development; a private seller with eighty messages an hour. | `contrast`: Discord's busy channels. → The marketplace's version of the problem and the design for it. |\n| p28 | description | Delivery has three tiers (an open connection, push notification, e-mail fallback), and the conversation service records the delivery state the gateway reports without knowing the tier. |  | `sequence`: Storing messages. → Delivering them. |\n| p29 | claim | Delivery speed earns money, but speed and safety pull against each other on exactly one step, the moment between stored and shown, which the next section resolves. |  | `contrast`: Delivery tiers. → The tension between delivery speed and safety. |\n\n### Safety on the Delivery Path\n\n**Controlling idea** (`claim`, id `safety`): The message safety gate must decide before delivery, within a fixed latency budget, with four verdicts, slower detectors working asynchronously and a written legal position on scanning.\n\n**Advances the thesis** (S3): Argues for the gate's place, budget, verdicts and legal basis.\n\n**Transition in:** `problem_solution`: The step between stored and shown. → The gate that decides on that step.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): Scope first, then the claim (gate before delivery) and its public evidence, then the design parameters in the order a builder needs them (budget, asynchronous path, verdicts), and last the legal constraint that can change all of them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p30 | transition | The step between stored and shown is where Veldmark put the message safety gate; the moderation pipeline and fraud signals have their own chapters, so this section covers only what is specific to messages. | reasoning: Pointers to trust-and-safety-architecture and fraud-prevention. |  |\n| p31 | claim | The gate must sit before delivery because the scams that matter in classifieds close in the conversation, and once a phishing link is on the seller's screen the platform depends on the seller's judgement. | example: Fake 'payment received' pages; deposit requests by bank transfer; fake landlords asking for money before a viewing. | `problem_solution`: What the section covers. → Why the gate must come before delivery. |\n| p32 | evidence | Large classifieds operators are moving the decision earlier, as OLX's real-time chat-image blocking and earlier warn-in-context pattern show, and a platform's own brand inside a message is itself a risk signal. | statistic: OLX 2026: Chat Images GenAI blocks suspicious images in real time; fraudulent images about 30% of fraud cases in Poland; QR-code detection at 80% precision.; case: OLX South Africa 2018: payment keywords and moves to e-mail or WhatsApp triggered safety tips; Kleinanzeigen warns that 'Kleinanzeigen' messages in chat can come from the chat partner. | `additional_support`: The argument for deciding before delivery. → Public evidence that operators do so. |\n| p33 | claim | Because the gate runs on every message it must be deterministic, cheap and bounded: Veldmark set 150 ms at p99, fail-open for low-risk conversations and fail-closed for links or payment details from accounts under 24 hours old. | table: Checks that fit the budget: URL lists, domain age, platform brand, IBAN and handles, image hashes and QR decoding, sender velocity, counterparty and listing risk, each with what it catches and its typical verdict. | `sequence`: Where the gate sits. → What it can afford. |\n| p34 | explanation | Slower checks run asynchronously on message events and can withdraw delivered messages and warn counterparties, with LLMs used only on the uncertain band because at 14 million messages a day sending every message would cost more than the fraud it prevents. | statistic: About 14 million messages a day; the uncertain 1-2% sent to an LLM. | `contrast`: What runs synchronously. → What runs asynchronously. |\n| p35 | claim | The gate needs four verdicts (deliver, deliver with warning, withhold silently, block), because a sender told a message was blocked learns which words to change, and a withhold may require a DSA statement of reasons. | figure: Figure 3: a message's life with the gate before delivery and asynchronous withdrawal after. | `sequence`: Synchronous and asynchronous checks. → The verdicts the gate returns. |\n| p36 | claim | Automated scanning of private messages engages the GDPR and possibly the ePrivacy confidentiality rules, so a platform needs a written legal position before building message scanning. | quotation: The EECC excludes services where communication is 'merely a minor ancillary feature that is intrinsically linked to another service'. | `contrast`: What the gate does. → The legal limits on doing it. |\n\n### Leads: Creation, Qualification and Lifecycle\n\n**Controlling idea** (`process`, id `leads`): The lead service creates leads by one rule across channels, deduplicates them, carries qualification as typed fields, and moves each lead through states both sides recognize.\n\n**Advances the thesis** (S4): Defines the lead object the contract carries.\n\n**Transition in:** `contrast`: The conversation and its safety gate. → The other object: the lead and the service that creates it.\n\n**Order of paragraphs** (`chronological`): The section follows a lead from creation to qualification to its lifecycle states, the order in which the lead service acts on it. Qualification placed before creation would enrich a lead the reader has not seen created, and the lifecycle placed first would name states for an object without a rule.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p39 | description | With the conversation and its gate in place, the chapter turns to the other object: the lead service turns contacts into leads by subscribing to conversation, call and booking events and applying the creation, deduplication and enrichment rules. |  |  |\n| p40 | claim | Veldmark's version of the typical rules is that a lead is created by a first buyer message to a professional, a tracked call of at least 30 seconds, a confirmed booking or a callback request, and further contacts from the same buyer about the same listing within 30 days attach to it: one buyer, three channels, one lead. | fact: Veldmark's lead rule. | `elaboration`: The lead service. → Its creation and deduplication rule. |\n| p41 | evidence (list) | A lead's value depends on what the professional learns from it, and the published examples all add structured information at the moment of contact. | statistic: Rightmove Enhanced Leads (used by 50% of letting lead senders; over 80% signed in; 60% attach a property to their Mortgage in Principle); CarGurus Digital Deal and Pre-Qualified Leads; Autotrader Buying Signals on more than 800,000 enquiries, high-intent leads converting at twice the average rate. | `sequence`: Creation and deduplication. → Qualification and enrichment. |\n| p42 | analysis | A signed-in buyer, a structured enquiry and a model score make a lead worth more than free text, so qualification data must travel in the lead contract as typed fields, and lead scoring needs the ownership of any model. |  | `conclusion_summary`: The three published examples. → The pattern and its architectural requirement. |\n| p43 | claim | A lead needs states that both sides recognize, because each state is a potential dispute. | figure: Figure 4: the lead lifecycle Veldmark adopted. | `sequence`: Qualification. → The lead lifecycle. |\n| p44 | explanation | Delivered means the recipient's system accepted the lead, and the states after Acknowledged are reported by the professional, so they are only as good as the integration. |  | `elaboration`: The lifecycle figure. → Two points in it that are easy to miss. |\n\n### Lead Routing and Delivery\n\n**Controlling idea** (`process`, id `routing`): Routing is a separate, versioned rule set, and delivery is one lead contract with adapters per channel, where pull shifts deduplication to the client and push keeps it at the portal.\n\n**Advances the thesis** (S4): Specifies how the lead contract reaches the professional exactly once.\n\n**Transition in:** `sequence`: A created and qualified lead. → Who receives it and how.\n\n**Order of paragraphs** (`chronological`): Routing comes before delivery because the recipient must be chosen before a channel is; the section ends on the single contract both depend on. Placed before routing, the delivery channels would have no recipient to deliver to, and the one-contract recommendation would arrive before the reader had seen why pull and push need the same lead ID.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p45 | comparison | Most leads go to the professional who owns the listing, but some models route by commercial rules, and dealer groups and agency networks route further to a branch and a salesperson. | quotation: CoStar's Homes.com 'your-listing your lead basis'; Zillow's share-of-voice distribution with no promised share; Follow Up Boss 'intelligent lead routing'. |  |\n| p46 | recommendation | The routing decision should be a separate, versioned rule set with logged inputs because it is commercially sensitive, subject to transparency obligations where paid, and the first thing examined in a dispute. |  | `cause_effect`: Routing models. → How the routing decision should be built. |\n| p47 | claim | Professionals receive leads in systems the portal does not control, so the delivery adapter is the anti-corruption layer between the lead contract and each of them. | table: E-mail, structured e-mail or file (ADF XML in US automotive), pull API, push webhook, portal pro inbox: how each works, strengths, weaknesses, when to use. | `sequence`: Who receives the lead. → How it reaches them. |\n| p48 | claim | A pull contract shifts the exactly-once problem to the client, which must deduplicate on the lead ID because overlapping windows deliver leads at least once, while push keeps it at the portal, which is where larger portals are heading. | quotation: Rightmove advises polling at most every 15 minutes and requesting the last 20 minutes, because Replication_Lag reports replication 'between the three Rightmove datacentres'.; quotation: mobile.de's July 2026 Lead API transfers leads 'directly and securely into existing CRM systems'. | `contrast`: The delivery channels. → The difference between pull and push for duplicates. |\n| p50 | recommendation | A multi-brand group should define one versioned lead contract and implement each delivery channel as an adapter on it, which is what makes the Golf disagreement disappear. |  | `conclusion_summary`: Routing and both delivery styles. → The recommendation that combines them. |\n\n### Attribution, ROI and Disintermediation\n\n**Controlling idea** (`analysis`, id `attribution`): Lead value is proven only with outcomes from the professional's systems, lead counts are an operational signal, and users are best kept on the platform with value rather than walls.\n\n**Advances the thesis** (S5): Closes the lead's life with the outcome and the leakage it competes with.\n\n**Transition in:** `sequence`: Delivered leads. → What happens to them afterwards.\n\n**Order of paragraphs** (`large_to_small`): The section defines attribution and says where its data lives, adds the operational use of lead counts, and ends on contacts that leave the platform and the answer to that leakage. Disintermediation placed first would argue about leakage before the reader knows what the platform loses when an outcome goes unattributed.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p52 | claim | A professional pays for outcomes and is sold contacts, and because the portal rarely owns the outcome, attribution that both sides accept needs outcome data sent back from the professional's systems or long-period transaction matching. | quotation: Zillow's pay-at-close fee charged 'when a real estate transaction is closed with one of the leads, generally within two years', estimated from 'the conversion rate of a lead'. |  |\n| p53 | claim | Lead counts are also an operational signal: a broken contact button looks like a quiet day unless someone watches lead counts against a forecast. | statistic: Adevinta's Artemis monitors more than 140 product metrics and caught a drop in iOS leads of about 100,000 a day, about €41,000 a day, within a day. | `additional_support`: Leads as a commercial measure proven by outcomes. → Leads as an operational signal. |\n| p54 | definition | Disintermediation, buyers and sellers moving off the platform once they have met, is the other side of attribution: part of the business model for visibility businesses, revenue leakage for pay-per-lead and transactional models, and fighting it with walls works only until it damages the match. |  | `contrast`: Measuring what leads produce. → Contacts that leave the platform. |\n| p55 | recommendation | The defensible position is to keep users on the platform with value rather than walls, as Marktplaats and Kleinanzeigen do by tying buyer protection to the conversation. | case: Marktplaats buyer protection (2022) only for deals arranged in platform messaging; Kleinanzeigen 'Sicher bezahlen' starts from a chat agreement.; figure: Figure 5: a walled marketplace against an open square. | `problem_solution`: Leakage and walls. → The alternative. |\n\n### Retention: What to Keep, and for How Long\n\n**Controlling idea** (`claim`, id `retention`): Retention is set per data class, and lead payloads must be minimized at design time because a lead copy in a professional's CRM is beyond the platform's reach.\n\n**Advances the thesis** (S1): Shows that the two objects have different retention drivers.\n\n**Transition in:** `sequence`: The conversation and the lead followed through their lives, from first message to outcome. → How long each kind of data from both objects is kept.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p37 | claim | Both objects leave data behind, and because messages are the most sensitive unpublished data a listing platform holds, retention is set per data class. | table: Message content, message metadata, safety evidence, platform lead record, lead copy at the professional: example, retention driver, Veldmark 2027 rule (content deleted 24 months after the last message; lead contact details removed after 13 months). |  |\n| p38 | recommendation | Lead payloads must be minimized at design time because the platform cannot delete a buyer's details once they are in a dealer's CRM, and a bounded export window, as at Rightmove, keeps the portal from becoming an indefinite lead archive. | quotation: Rightmove's brand-level lead export returns 'a maximum of 24 hours within the last 28 days'. | `cause_effect`: The last row of the retention table. → What it implies for lead design. |\n\n### Veldmark Worked Example: One Messaging Platform, Four Brands\n\n**Controlling idea** (`example`, id `worked`): Under the design Veldmark adopted in May 2027, the city bike's phishing link is withheld before Femke sees it and the Golf's 23 contacts become 19 leads both sides count, recorded in four decisions.\n\n**Advances the thesis** (S3, S4, S6): Answers the scene's two questions with the design applied.\n\n**Transition in:** `problem_solution`: Ingrid's two questions and the design built since, ending with retention. → The design applied to both cases.\n\n**Order of paragraphs** (`problem_solution`): Baseline and load first, then the two cases in the order the scene posed them, then the decisions that commit the group. With the decisions first, the reader would meet commitments before seeing the load and the two replays that justify them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p59 | context | The advice forum adopted the reference design in May 2027 as part of Common Ground, replacing four brand-specific contact systems (Keybridge as the receiving fourth), none of which checked a message before delivery or gave a lead an identifier the recipient's software shared. | table: Baseline per brand: contact channels, message store, safety, lead delivery. |  |\n| p60 | analysis | At about 14 million messages a day the capacity problem is not storage but the synchronous gate at about 600 calls a second at peak inside 150 ms, and the inbox fan-out for professionals. | statistic: 14 million messages a day, 11 million on Tradeyard; average about 160 a second; planned peak about 600 a second; about 11 GB a day and about 4 TB a year on Tradeyard. | `elaboration`: The adopted design. → Its load. |\n| p61 | example | Replayed under the gate, the city bike's 20:11 message is withheld by the domain-age rule, Femke never sees it, the nine other sellers get safety notices, and the 37 messages are withheld within seconds instead of after an analyst writes a rule. | case: Three signals (day-old domain, 'Safe Deal' in text, account created Saturday); 13 genuine conversations continue; sale on Monday as before. | `problem_solution`: The load the gate must carry. → What it does to the first case. |\n| p62 | example | Replayed under the lead contract, the Golf's 23 contacts become 19 leads with stable IDs delivered by webhook with acknowledgements, so both sides count the same leads and the per-lead charge can be priced on an auditable number. | case: 14 e-mails from 13 buyers make 13 leads; one booking merges, one is new; 7 calls of which two merge make 5; 13 + 1 + 5 = 19; sale on 29 April reported against one lead.; figure: Figure 6: 23 against 14 before, 19 shared lead IDs after. | `sequence`: The first case replayed. → The second case replayed. |\n| p63 | recommendation (list) | The forum recorded four decisions: one group conversation service with brand interfaces, a gate owned by T&S with a Messaging contract, a Lead event contract v1 from Q1 2028, and Keybridge on the receiving side only. | fact: Stages from November 2027 (Tradeyard NL and BE) and 2028 (Motorvane, Hearthly gains chat); 150 ms p99 and fail-closed rule; e-mail-only delivery retired by end of 2028; the March 2027 neutrality decision applied to leads. | `conclusion_summary`: Both replays. → The decisions that make them real. |\n\n### Trade-offs\n\n**Controlling idea** (`comparison`, id `trade-offs`): Six design choices, from build or buy to one group platform, each have conditions under which the other option is right, and masking can also be a paid entitlement.\n\n**Advances the thesis** (S2, S4, S6): States when the recommendations do not apply.\n\n**Transition in:** `contrast`: Veldmark's decisions. → When the other option is right.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p64 | analysis | Veldmark's decisions are not the only right answers, since for each of six choices the table says when the other option is right, and of these masking needs the most care: it protects private sellers and makes counting possible but can feel to professionals like the portal standing in the way, and where it is a paid entitlement the contact policy service enforces it from the entitlement read model. | table: Build or buy, safety placement, contact details, lead delivery, lead definition, group platform: option A, option B, when each is right.; quotation: CarGurus' free tier offers 'capped anonymous leads and connections'. |  |\n\n### Vertical Differences\n\n**Controlling idea** (`comparison`, id `verticals`): Channels, recipients, fraud, qualification, routing and outcome data differ by vertical, and real estate and automotive each change one rule of the design.\n\n**Advances the thesis** (S4, S5): Shows how the lead design varies by vertical.\n\n**Transition in:** `elaboration`: General trade-offs. → Differences by vertical.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p65 | claim | Channels, recipients, fraud, qualification, routing and outcome data change by vertical, and in real estate the lead goes to the agency whose listing the buyer contacted, even when entity resolution has clustered several agencies' listings, because routing it elsewhere would be ranking disguised as routing. | table: Five verticals by dominant channel, recipient, need for a lead object, main fraud, qualification data, routing complexity and outcome data.; case: The Lyon apartment listed by three agencies (entity-resolution). |  |\n| p66 | claim | In automotive outcome data is closest to the portal, so lead attribution can be most precise there if the dealer agrees to share it. | case: The Golf's removal arrived 26 hours after the sale. | `contrast`: Real estate. → Automotive. |\n\n### Failure Modes\n\n**Controlling idea** (`analysis`, id `failure-modes`): Eight recurring failures each break one of the chapter's rules, from safety after delivery to lead volume treated as success.\n\n**Advances the thesis** (S1, S2, S3, S4, S5, S6): Names what goes wrong when each claim is ignored.\n\n**Transition in:** `sequence`: Variation by vertical. → What goes wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p67 | analysis (list) | Eight failure modes each break one of the rules above and each has a symptom: safety after delivery, the chat store as lead database, e-mail as the lead contract, duplicate leads, contacts on gone listings, copies of message content, hidden routing rules and lead volume treated as success. |  |  |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `ca-view`): Five group-level decisions: share the conversation platform early, govern the lead contract, assign ownership explicitly, measure the path rather than the volume, and plan for AI on both sides.\n\n**Advances the thesis** (S6, S4): Turns the design into the group's agenda.\n\n**Transition in:** `problem_solution`: The eight failure modes. → The decisions that prevent the failures at group scale.\n\n**Order of paragraphs** (`order_of_importance`): Sharing comes first because it fixes the platform the other decisions govern; AI comes last because it extends the design rather than founds it. Governance or ownership placed before sharing would assign owners to a platform not yet decided. The Adevinta evidence that was a separate 'In Practice' section until 2026-11-12 now sits in the first decision, which it supports.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p68 | transition | The failure modes are prevented by decisions above any single team: at group scale messaging and leads raise five decisions for the Chief Architect's agenda, which generalize the four Veldmark's forum recorded. |  |  |\n| p69 | recommendation | Share the conversation platform early: messaging is a natural client of the group identity, and the little marketplaces publish on messaging points the same way, since Adevinta consolidated chat first, suggesting messaging is generic enough to share and close enough to trust and safety that sharing pays twice; the brand experience stays local. | quotation: 'consolidating enabling capabilities such as cloud and data, and overarching elements such as chat and moderation'; no architecture post on the shared service. | `sequence`: Five decisions. → The first: share the conversation platform. |\n| p70 | recommendation | Make the lead contract a governed interface with a registry entry, a versioning policy, an owner and a change process, and review any change to the lead-creation rule as a pricing change. |  | `sequence`: The first decision. → The second: govern the lead contract. |\n| p71 | recommendation | Assign ownership explicitly: Messaging, Trust & Safety, Monetization, the Data Protection Officer and Professional Tools each own a named piece, and the forum reviews changes that cross two. |  | `sequence`: The second decision. → The third: ownership. |\n| p72 | recommendation | Measure the path, not the volume: reply times, scam reports and withheld-message precision, gate p99 and fail-open rate, lead delivery latency and acknowledgement, the reconciliation gap and lead-to-outcome rate. |  | `sequence`: The third decision. → The fourth: metrics. |\n| p73 | recommendation | Plan for AI on both sides of the conversation, so the conversation model marks machine-generated messages, the lead contract records them and lead rules decide whether an assistant's enquiry is a lead. | quotation: Zillow reports 'AI-supported smart message suggestions' in its CRM. | `sequence`: The fourth decision. → The fifth: AI. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Ten review questions test a messaging and lead design against the chapter's claims.\n\n**Advances the thesis** (S1, S2, S3, S4, S5, S6): Turns each claim into a question for a design review.\n\n**Transition in:** `sequence`: The Chief Architect's decisions. → Questions that check them in a review.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p74 | recommendation (list) | Ten questions test a contact design against the decisions above, from where the first safety check runs to which outcome data flows back. |  |  |\n\n## Conclusion: From Contact to Transaction\n\n**Synthesis:** Ingrid's two questions have one answer: keep the conversation and the lead apart and give each its own control, a gate inside the conversation before delivery and one versioned lead contract both sides read.\n\n**So what:** A platform that merges the two objects can neither stop a phishing link in time nor defend an invoice; one that separates them can share a conversation service across brands and put a price on the lead.\n\n**Callback:** The opening claim that the contact is the last moment the marketplace sees both parties, and the two cases of the scene. The gate is where the platform uses that moment to protect Femke; the lead contract is where it counts the Golf's 19 leads with the dealer.\n\n**Takeaway** (`course_of_action`): Put the safety gate on the delivery path, make the lead contract a governed interface, and review any change to the lead-creation rule as a pricing change.\n\n**Hand-off** to [Beyond the Contact: Payments, Shipping and Buyer Protection](transactions-and-payments.html): `sequence`: An offer accepted in chat leaves the marketplace a choice between stepping aside and carrying the deal through payment, and the phishing link that reached Femke imitated exactly that Safe Deal flow. → Payment, shipping and buyer protection, and when a classifieds marketplace should take part in them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p75 | synthesis | Ingrid's two questions have one answer: keep the conversation and the lead apart, put the check that protects Femke inside the conversation before delivery, and make the rule that turns the Golf's 23 contacts into 19 leads one versioned contract both sides read, because a platform that merges them can neither stop a phishing link in time nor defend an invoice. | reasoning: The city bike and the Golf, each answered by one of the two objects. |  |\n| p76 | transition | A contact that turns into an agreement leaves the marketplace a choice between stepping aside and carrying the deal through payment, and the phishing link that reached Femke imitated exactly the Safe Deal flow the next chapter examines. |  | `sequence`: The contact as two objects. → The next step after contact: the transaction. |\n\n## Non-goals\n\n- Fraud typology, risk scoring and step-up friction. See [Scams, Fakes and Account Takeovers: Fraud Prevention for Listings](fraud-prevention.html).\n- The moderation pipeline, enforcement propagation and appeals. See [Trust and Safety as a Platform](trust-and-safety-architecture.html).\n- The professional's lead inbox, CRM features and pro SaaS. See [Serving the Pros: Dealer, Agent and Merchant Tooling](professional-seller-tooling.html).\n- Lead pricing, quotas and billing. See [Packages, Bumps and Quotas: Products, Pricing and Entitlements](products-and-entitlements.html), [How Listing Marketplaces Make Money](monetization-models.html).\n- Payments and buyer protection after the contact. See [Beyond the Contact: Payments, Shipping and Buyer Protection](transactions-and-payments.html).\n- The legal analysis of DSA statements of reasons. See [Rules of the Marketplace: DSA, DAC7 and Vertical Regulation](marketplace-regulation.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Whether marketplace chat is an 'interpersonal communications service' under the European Electronic Communications Code is presented as a legal question; a reviewer with EU telecoms-law expertise should check the framing. (Carried over from spec.md.)\n- The ADF (Auto-lead Data Format) XML convention for US dealer CRMs is stated as industry practice without a primary-source citation; verify before print. (Carried over from spec.md.)\n- No primary source on pay-per-call or masked-number products at European portals was found; the call-tracking discussion is reference architecture. (Carried over from spec.md.)\n- Known differences between generated figures and their mermaid sources (Figure 2: an extra arrow from the gate to the lead service carrying the BookingConfirmed label and two parallel lines from call tracking; Figure 4: Merged points to Acknowledged instead of the end) are recorded in the 2026-10-20 changelog entry and not fixed. (Carried over from spec.md.)\n\n## Decision log\n\n- **2026-11-12** — Resolved the round-3 escalation under the author's delegation ('auto resolve all ESCALATE topics'): dissolved 'In Practice: The Public Record', the move both flow readers converged on in rounds 1-3. Adevinta's annual-report quotation, its citation, the note that no architecture post is public and the bold strategic reading moved into the Chief Architect's first decision (p69), together with the scope sentence that marketplaces publish little on messaging and lead architecture; the CarGurus TCPA point, quotation and citation became the fourth observation of Contact Channels (p58). Dropped only the parenthetical recap of sources already cited in the body (OLX, Rightmove, Autotrader, CarGurus, Zillow), whose citations all remain where they are used. Rewrote the ca-view transition and opener (p68), the channels opener (three to four observations), the roadmap (p04 and its promises) and the flow rationales. Journal-spec AC-2's expected answer still lists the public record and retention before leads; the replacement text is handed to the orchestrator, the journal spec is not edited here. Rejected: Keeping the house 'In practice' heading, which three rounds of flow readers could not place.; Moving the CarGurus point to Failure Modes, where it would be the only item that is not a design failure.\n- **2026-11-12** — Added one sentence to the worked example's baseline (p59) saying what the table shows: each brand's own contact system, Keybridge as the receiving fourth, no pre-delivery check and no shared lead ID. This also answers the minor finding that 'four contact systems' did not match the table. No raise of length.max_words was needed: the draft is 9,421 words against 9,457 after dissolving the section.\n- **2026-11-12** — Thesis-rubric and flow-rubric notes (four runs, 2026-11-12) accepted under the author's delegation, 2026-11-12, as recorded and not acted on further: S2, S5 and S6 support the claim indirectly and the claim is one long sentence (copied from the journal spec, unchanged); condensing the storage items, moving p20 beside p16, merging p41/p42, p53 near p72, patterns for the closing reference sections. Kept the published text and order (rule: keep the published text when no option is clearly better).\n- **2026-11-12** — Round-3 minor findings (one reader each) left as published: the nine contacted sellers versus the 37 withheld messages, the 'connection' bullet in Concepts, the link from lead monitoring to disintermediation. The 'one buyer had e-mailed twice' wording (13 + 1 + 5 = 19) is kept.\n- **2026-11-12** — After draft check round 2 (two corroborated flow findings judged spec faults): moved Figure 3 from the end of the architecture section (p29) to the safety section after the verdicts (p35), since its caption uses withhold, withdrawal and the silent sender that section explains; moved In Practice to directly before The Chief Architect's View, whose first decision cites Adevinta. Rewrote the transitions into worked, practice, ca-view and trade-offs, the roadmap and the flow rationale; added lead-ins to the failure-mode and question lists and section openers for concepts, architecture and safety; framed p40 as Veldmark's version of the typical rules. Rejected: Folding In Practice into the Chief Architect's View, which would drop the house heading.\n- **2026-11-12** — After draft check round 1 (three corroborated flow findings judged spec faults): moved the Retention section after Attribution, since its lead rows need the lead sections; moved the disintermediation definition out of the Concepts list into the attribution paragraph that uses it (p54; link and facts kept, duplicate sentence merged); made the public-record opener say which forum decisions the two documents bear on. Rewrote the affected transitions (leads, retention, practice), the roadmap (p04 and its promises) and the flow rationale. Rejected: Folding the In Practice section into the Chief Architect's View, which would drop the house 'In practice' heading.; Splitting retention between the safety and lead sections, which would separate two rules set by one table.\n- **2026-11-12** — Applied flow-rubric notes: merged the one-sentence push paragraph (p49) into the pull/push paragraph (p48) and the attribution definition (p51) into p52; attribution flow declared large_to_small; added what-breaks statements to the rationales. Rejected: Moving units across sections (retention, storage evidence, contact policy), which would reorder the published chapter beyond what the rubric found necessary.\n- **2026-11-12** — Rewrote the spec.md success criteria as reader outcomes: the conversation-versus-lead criterion became AC-4 and the push-versus-pull criterion AC-5 (both minor, added for this post); the safety-gate and lead-rule criteria are covered by the journal spec's AC-1. Dropped as inventories: the channel comparison, the component sketch (Figure 1), the Veldmark arithmetic and the dated-sources criterion (dated sources stay governed by the style guide). Rejected: Carrying the success criteria over unchanged.\n- **2026-11-12** — Added a roadmap paragraph (p04) and a synthesis paragraph (p75) that the published text lacked, so the introduction announces every section and the conclusion returns to the opening and to Ingrid's two questions instead of only handing off.\n- **2026-10-19** — Organized the chapter around the conversation/lead split rather than around channels, because the split explains both the fraud problem (conversations) and the billing-dispute problem (leads), and keeps the boundaries with chapters 17, 25 and 31 clean. (Carried over from spec.md.)\n- **2026-10-19** — Used Rightmove's RTDF v1.4.1 lead-export contract as the documented delivery example, since it is the only public, detailed lead-delivery specification found. (Carried over from spec.md.) Rejected: Inventing internals for dealer platforms.\n- **2026-10-19** — Re-counted the Golf's ledger '23 leads' as 23 contacts yielding 19 deduplicated leads under the new rule, keeping the ledger figure as Motorvane's 2027 count rather than changing it. (Carried over from spec.md.)\n- **2026-10-19** — Kept the trust-and-safety detail to the message-specific gate (checks, verdicts, privacy) and linked to chapter 24 for the general pipeline, to avoid re-teaching. (Carried over from spec.md.)\n\n## Sources\n\n- **Internal**\n  - _journals/listing-systems-architecture/journal-spec.json — Intent outcome, acceptance criteria AC-1 to AC-3, thesis, role and the hand-off relationship of transactions-and-payments.\n  - trust-and-safety-architecture, fraud-prevention — Gate, detectors, the city bike enforcement timeline.\n  - monetization-models — Motorvane's per-lead proposal; lead-based fees.\n  - event-driven-listings, entity-resolution, professional-seller-tooling, products-and-entitlements, data-platform — Neighbouring owners linked from the chapter.\n  - _research/brief-trust-safety-regulation.md, brief-monetization-economics.md, brief-real-estate-portals.md, brief-adevinta.md — Research behind the gate, lead economics, portals and Adevinta's shared chat.\n  - _research/scenario-ledger.md; _research/consistency-issues.md — Veldmark figures, the city bike and Golf timelines, the May 2027 contact-path decisions; the 23 raw / 19 deduplicated ruling.\n- **External**\n  - OLX Tech Blog, Cassandra Compaction Trade-Offs (2021) — Chat storage.\n  - Discord, How Discord Stores Trillions of Messages (2023) — Message storage at scale.\n  - OLX Group, AI fraud prevention (2026); ITWeb on OLX South Africa (2018) — Chat safety.\n  - Rightmove, Real Time Datafeed Specification v1.4.1 (2023) and FY2025 results (2026) — Lead exports, Enhanced Leads.\n  - Autotrader FY26 results (2026); CarGurus, Zillow and CoStar 10-Ks for FY2025 (2026) — Lead products, definitions, routing.\n  - Adevinta Annual Report 2023 (2024) and Artemis post (2024) — Shared chat; lead monitoring.\n  - Directive (EU) 2018/1972, Art. 2 — Interpersonal communications service definition.\n\n## Changelog\n\n- **2026-11-12** — Escalation resolved under the author's delegation: In Practice dissolved (Adevinta into the Chief Architect's View, CarGurus TCPA into Contact Channels); baseline-table sentence added to the worked example; rubric notes moved to the decision log; draft check round 4. (AI-mediated session)\n- **2026-11-12** — Converted spec.md to spec.json (reconstructed from index.md); added roadmap and synthesis units; applied flow-rubric merges (p49 into p48, p51 into p52); status draft. (AI-mediated session) After draft check round 1: Retention moved after Attribution; disintermediation definition moved into p54; public-record opener, Golf contrast and arithmetic, 18:10 sale time, neutrality gloss and table references fixed in the draft. After draft check round 2: Figure 3 moved into the safety section; In Practice moved before the Chief Architect's View; section openers, list lead-ins, the neutrality sentence and p40 revised. After draft check round 3 (ESCALATE): Golf duplicate wording, architecture opener and Chief Architect's View opener fixed without a re-check; remaining findings in open_questions.\n- **2026-10-21** — Renamed failure patterns to match where-listing-systems-go-wrong. (AI-mediated session)\n- **2026-10-20** — Replaced 3 mermaid diagrams with generated illustrations (figure numbers and captions unchanged; known differences for Figures 2 and 4 listed in open questions). (AI-mediated session)\n- **2026-10-20** — Sharpening pass: 8,034 to 8,032 prose words; one heading renamed ('The Contact Channels' to 'Contact Channels: What the Platform Sees'); three long paragraphs split. Cross-chapter consistency sweep: 3 headings aligned. (AI-mediated session)\n- **2026-10-19** — Initial spec and article; editorial review pass (Golf aligned to 23 raw / 19 merged leads, OLX chat-image claim matched to the 202     (function () {
        const data = JSON.parse(document.getElementById('data').textContent);

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';

        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');

                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);

            if (postStatusRaw) {

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;

                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
