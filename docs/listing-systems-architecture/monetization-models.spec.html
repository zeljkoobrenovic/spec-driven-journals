<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, acceptance criteria AC-1 to AC-3, the thesis and the role are copied unchanged from the monetization-models entry in journal-spec.json. Five units are additions to the published text (p67 and p69 lead-ins to the trade-off and vertical tables, p71 lead-in to the failure modes, the conclusion's synthesis p82, and p54 rewritten from a table note into prose); see decision_log.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** A monetization model as who pays, for which unit, at which moment and on what pricing basis, and the ten models from insertion fees to consumer subscriptions with dated public evidence.\n- **Know:** Published KPIs (ARPA, ARPR, yield per listing, revenue per visit, take rate) and what their denominators reveal about the model, and the systems each model requires.\n- **Know:** What each model spends in liquidity, its guardrail metric, and the limits of pricing power (Autotrader FY26, Hemnet 2026).\n- **Believe:** The unit of charge is the architectural decision, because it selects the system of record.\n- **Believe:** Every model spends liquidity and needs a guardrail owned outside the team that books the revenue; the value of paid products must be measured causally.\n- **Be able to:** Put four questions to any revenue proposal: what unit, which system holds the truth, what it costs in liquidity, who notices first.\n- **Be able to:** Name the systems a model requires and the guardrail metric and stop condition it needs before launch.\n- **Be able to:** Fill in a model readiness card and refuse a model that cannot.\n\n**Audience:** Chief architects, principal engineers and engineering directors at marketplace groups who are asked to add a revenue stream or to support a price-and-product event; also product and monetization leaders who need to see what their models cost in systems.\n\n**Already knows:**\n\n- APIs, databases, event streams, search engines and Kubernetes (the book's baseline).\n- From earlier chapters: liquidity and the match rate, the listing aggregate and its monetization flags, sellers and accounts, ranking and Tradeyard's paid boosts, experimentation, the data platform's governed metrics, marketplace regulation (P2B, Omnibus, DSA, DAC7), messaging-and-leads' lead object and the Essen Golf's 19 leads, and transactions-and-payments' Safe Deal and its take rate.\n- Veldmark, its brands, Common Ground and the cast (Ingrid Halvorsen, Olivier Petit, Felix Brandt, Priya Raman, Lucía Ortega), Yardstick, Keybridge, Valuo, the Essen Golf, the Lyon apartment, and the failure-pattern names.\n\n**Does not yet know:**\n\n- Portal KPIs and their denominators: ARPA, ARPR, QARSD, ARPL, yield per listing, revenue per visit, take rate.\n- VAS (value-added services) and the price structure of two-sided markets.\n- How lead-based and outcome-based fees work: cost per lead, share of voice, pay at close and variable consideration.\n- Propensity score matching as a way to measure paid products.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a revenue proposal, the reader names its unit, system of record, liquidity cost and the condition for launch. *Probe:* Your automotive portal sells dealers monthly packages of listing slots. The monetization team proposes billing every qualified lead above a monthly allowance; today calls, e-mails and test-drive bookings are counted in three systems with three buyer identities. Using only this chapter: what is the unit, which system holds the truth, what liquidity does it spend, and what do you decide? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-4 | Given three portals' headline KPIs, the reader says what each denominator reveals about the model and the system of record it needs. *Probe:* One portal reports revenue per listing, a second reports average revenue per subscribing dealer per quarter, and a third reports net revenues divided by gross merchandise volume. Using only this chapter: what does each denominator tell you about the portal's monetization model, and which system of record does that model need? | `custom` | cold_reader | minor |\n| AC-5 | Given a planned price rise on slot-based packages and a dashboard that says premium packages underperform, the reader names the dealers' response, the public evidence and what the systems must support. *Probe:* Your automotive portal plans its annual price rise on dealer packages priced by the number of paid slots, and the sales team's dashboard shows that listings on premium packages get fewer contacts than listings on basic ones. Using only this chapter: how can dealers respond without cancelling, what public evidence shows this happening, why might the dashboard be wrong, and what must your systems support? | `custom` | cold_reader | minor |\n| AC-6 | No company's internal monetization architecture is presented as fact; the reference architecture and capability matrix are labeled as the author's inference from published product mechanics. *Probe:* Does the chapter anywhere describe a real company's internal monetization systems as fact, rather than its published products, KPIs and filings? Are the capability matrix and Figure 2 labeled as the author's inference? | `custom` | rubric | minor |\n\n## Thesis\n\n**Question:** Which revenue models fit which marketplace, and what does each require from the systems?\n\n> **Claim:** A revenue model fits a marketplace only where its unit of charge matches how that marketplace's sellers sell and where the marketplace can count and prove delivery of that unit: paid visibility where free private supply is large, slot subscriptions where professionals list continuously, per-lead fees only where leads are deduplicated across channels and reconcilable with the professional's CRM, take rates where goods ship and protection is worth paying for, and pay at close only where outcomes are observable; the unit (listing, position, account, lead, transaction or audience) selects the system of record, and the KPI a portal publishes (ARPA, ARPR, yield per listing, take rate) reveals which unit it chose; and because every model spends organic liquidity (insertion fees spend supply depth, paid positions relevance, lead fees professional trust, advertising page speed and attention), none should go live without a named guardrail metric, a stop condition agreed in advance and an owner outside the team that books the revenue.\n\n**Disputed by:** The view that choosing a revenue model is a pricing and commercial decision for the monetization team, judged by its business case and revenue forecast, with the systems adapted afterwards and liquidity effects left to show up in next year's numbers.\n\n**So what:** A Chief Architect who accepts this puts four questions to every revenue proposal (what unit, which system holds the truth about what was sold, what it costs in liquidity, who notices first), requires a model readiness card (unit, system of truth, delivery evidence, dispute process, accounting treatment, regulatory review, rollback) before launch, has the group own one catalog model, entitlement service and metering standard so a new model is configuration rather than a fifth implementation, holds prices and packages as data that can be rolled back, and funds experiments or matched comparisons to measure package ROI.\n\n**How and why:** Veldmark earned €1.31 billion in 2026 through nine of the ten models, each implemented four times. At the May 2027 forum the four questions turned three proposals into three decisions. Tradeyard's 'Spotlight' would take the most-viewed paid slot while the existing Solr boost was already eating relevance, so only a Top listing price rise passed. Motorvane's per-lead fee had no system of truth: the Essen Golf's 23 raw contacts are 19 billable leads, and at an illustrative €12 that one car would cost €228 in ten days against about €15 a month of slot value, so a lead ledger counts for six months without billing. Hearthly's commission share is earned on a notary's deed months after the lead, so it runs as a one-region pilot. Autotrader's FY26 results show concentrated dealers pushing back on price through the stock they list.\n\n**Supporting claims**\n\n- **S1** — A monetization model is who pays, for which unit, at which moment and on what pricing basis; the unit of charge selects the system of record, and the KPI a portal publishes (ARPA, ARPR, yield per listing, revenue per visit, take rate) reveals which unit it chose.\n- **S2** — Each of the ten models needs its own systems on top of one shared commercial core and fits only where its unit matches how sellers sell and delivery can be counted: paid visibility where free private supply is large, slot subscriptions where professionals list continuously, per-lead fees only with cross-channel deduplication reconcilable with the professional's CRM, take rates where goods ship and protection is worth paying for, pay at close only where outcomes are observable; the core holds only if the listing keeps references, delivery systems emit evidence and ranking consumes paid effects under its own guardrails.\n- **S3** — Proving delivery includes proving value and keeping the unit's price changeable: concentrated professionals push back through the stock they list (Autotrader FY26), so prices and packages must ship as dated, reversible data and paid products must be measured causally, or the model is renegotiated on the professional's own numbers.\n- **S4** — Every model spends organic liquidity (supply depth, relevance, professional trust, page speed and attention), so none should go live without a named guardrail metric, a stop condition agreed in advance and an owner outside the team that books the revenue.\n- **S5** — Put to Veldmark's three May 2027 proposals, the four questions (what unit, which system holds the truth, what liquidity it costs, who notices first) turn pricing proposals into three different architecture decisions: a price rise only, a lead ledger that counts before it bills, and a one-region pilot.\n- **S6** — The Chief Architect's part is to separate model choice from implementation: brands choose models and prices, the group owns one catalog model, entitlement service, paid-label pipeline and metering standard, and no model launches without a readiness card and causal measurement.\n\n## Role in the part\n\nTurns the contacts and deals of the first two chapters into revenue models, ties each unit of charge to a system of record and a liquidity guardrail, and names the commercial core the next chapter designs. Supports P6-3, P6-6 of part `part-6`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `grouping` in models: the ten models in the order of the summary table; `grouping` in trade-offs, verticals, failure-modes, ca-view, questions: the book's standard judging sections)\n\nThe scene poses three proposals and four questions; concepts give the vocabulary (who pays, unit of charge, KPI denominators, VAS) the catalog needs; the ten models each show what they require and spend; the architecture section gathers the requirements into one shared core; pricing power and liquidity then supply the two remaining answers (what the business can change and what it costs); only then can the worked example answer all four questions for each proposal, and the judging sections generalize. Putting the worked example earlier would ask the reader to judge a per-lead fee before knowing what a lead model requires or what it spends; putting the guardrail table before the models would name costs for models not yet described.\n\n## Introduction\n\n**Hook** (`direct_statement`): A listing marketplace connects buyers and sellers and then usually steps aside. The sale happens on a doorstep, at a dealership or at a notary's office. Classifieds therefore rarely charge for the transaction. They charge for access to attention.\n\n**Bridge:** Architects who have just followed a contact into a lead and, for some categories, into a protected payment that adds a revenue line but usually not the largest. → The other things a listing marketplace charges for, defined as who pays, for which unit, at which moment and on what pricing basis, each part of which becomes a system.\n\n**Thesis statement** (KEY POINTS callout (three bullets) and paragraph p02's operational definition.): The unit of charge is the architectural decision: each unit needs a different system of record, the KPI a portal publishes shows which unit it chose, every model spends liquidity and needs a guardrail owned outside the revenue team, and the systems must let prices change as data, be measured causally and roll back.\n\n**Roadmap** (IN THIS CHAPTER callout and the closing sentences of paragraph p03, which name the sections in order.):\n\n- Start with three revenue proposals at Veldmark. *Kept in:* scene.\n- Define the terms and the KPIs portals publish. *Kept in:* concepts.\n- Catalog the ten models with public evidence. *Kept in:* models.\n- Show the systems each model requires. *Kept in:* architecture.\n- Test pricing power and its limits. *Kept in:* pricing-power.\n- Set a liquidity guardrail for each model. *Kept in:* liquidity.\n- Answer Veldmark's three proposals. *Kept in:* worked-example.\n- Close with the trade-offs, vertical differences, failure modes and the Chief Architect's view. *Kept in:* trade-offs, verticals, failure-modes, ca-view, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A listing marketplace usually steps aside before the sale, so classifieds rarely charge for the transaction and instead charge for access to attention (the right to list, a better position, a package of slots, a delivered lead, an advertisement), though many have recently started charging for the transaction too. | example: The sale happens on a doorstep, at a dealership or at a notary's office; a buyer who meets the seller can complete the deal without the platform. |  |\n| p02 | definition | A monetization model is the combination of who pays, for which unit, at which moment in the funnel and on what pricing basis, and the definition is operational because each part becomes a system. | reasoning: Who pays sets identity and billing depth; the unit sets the system of record for what was sold; the moment sets which flow carries the checkout; the pricing basis sets what must be metered. | `elaboration`: The list of things classifieds charge for. → The book's operational definition of a monetization model. |\n| p03 | transition | Part VI has followed a contact into a lead and some leads into a protected payment that adds a revenue line but usually not the largest, so this chapter asks what the marketplace charges for along that path, names the neighbors that own advertising, the transactional pivot and the commercial core, and lays out its sections in order. | reasoning: messaging-and-leads turned contacts into leads; transactions-and-payments carried some through payment; advertising-platforms and transactions-and-payments own their models; products-and-entitlements designs the systems that implement every model. | `contrast`: The definition of a model as who pays, unit, moment and pricing basis, and the previous chapter's protected payment. → Where the chapter sits in Part VI, what it leaves to neighbors and the order of its sections. |\n\n## Sections\n\n### Setting the Scene at Veldmark: Where Does the Next Euro Come From?\n\n**Controlling idea** (`example`, id `scene`): In May 2027 Veldmark's owner asks where revenue growth will come from, and Olivier Petit brings three proposals that Ingrid Halvorsen asks the forum to judge with four architecture questions.\n\n**Advances the thesis** (S5): Poses the chapter's question as three concrete proposals and introduces the four questions the worked example answers.\n\n**Transition in:** `example`: The roadmap's first promise: three revenue proposals at Veldmark. → The May 2027 forum and its three proposals.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p04 | example (list) | In mid-May 2027 Veldmark's private-equity owner asks how revenue grows from €1.31 billion without cutting the Common Ground budget, and Olivier Petit brings three proposals to Ingrid Halvorsen's architecture advice forum. | scenario: 2026 revenue €1.31 billion; the forum set up in April 2027; Tradeyard NL's stronger visibility ladder (Top listing price rise and a new 48-hour 'Spotlight'), Motorvane DE's per-lead component above a package allowance, Hearthly FR's commission share on Valuo seller leads. |  |\n| p05 | claim | Olivier presents the proposals as pricing decisions, but Ingrid treats them as architecture decisions and puts four questions to each: what unit, which system holds the truth, what it costs in liquidity, and who notices first. | scenario: Ingrid's four questions; the rest of the chapter supplies the answers and the proposals return at the end as a worked example. | `contrast`: The three proposals as Olivier frames them. → Ingrid's reframing as architecture decisions and her four questions. |\n\n### Concepts: What a Listing Marketplace Sells\n\n**Controlling idea** (`definition`, id `concepts`): A listing marketplace sells a probability of a match to the side that pays, and the unit it charges for, visible in the denominator of the KPI it publishes, is the most useful single fact about its model.\n\n**Advances the thesis** (S1): Gives the vocabulary (price structure, probability of a match, unit of charge, ARPA, ARPR, take rate, VAS) the rest of the chapter relies on.\n\n**Transition in:** `elaboration`: The scene's question of what a marketplace charges for. → The first part of the answer, who pays: the price structure of two-sided markets.\n\n**Order of paragraphs** (`small_to_large`): From who pays, to what the payer buys, to the unit and the KPI that reveals it, then the exact definitions and the one industry term (VAS) the model catalog uses; each term is needed by the next.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | definition | Two-sided markets have a price structure, not only a price level, and classifieds keep buyers and private sellers free because their participation is the value the paying professionals buy. | source: Rochet and Tirole (2003): platforms try to get 'both sides on board' and divide prices between the sides; the usual reading is that platforms subsidize the side whose participation creates most value for the other. |  |\n| p07 | evidence | Charging the demand side is the exception and works only where supply is scarce, as ImmoScout24's consumer Plus subscriptions show. | statistic: Scout24 2025: private-segment subscription revenue +18.8% to €107.2 million with 506,937 average customers, partly from monetized credit checks inside Plus for renters. | `contrast`: Free buyers as the norm. → The exception where buyers pay. |\n| p08 | claim | A professional buying a package buys a probability of a match, which is only as good as the organic liquidity beneath it, so every monetization model is a way of spending liquidity. | reasoning: Views become contacts, contacts test drives, test drives sales; a top position is worth something only while enough buyers look at the top of the results. | `elaboration`: The paying side, introduced in the price structure. → What the paying side actually buys. |\n| p09 | definition | The unit of charge, the thing whose quantity sets the bill, is the most useful single fact about a model, and public portals reveal it through the denominator of the KPI they report. | table: Headline unit KPIs: Rightmove ARPA £1,621/month (2025), Autotrader ARPR £2,995/month (FY26), CarGurus QARSD US$6,616/quarter (Q4 2025), REA Buy yield +13% (FY26), Hemnet ARPL SEK 9,095 (Q2 2026), Zillow revenue per visit US$0.178 (2025), eBay take rate 13.94% (2025). | `cause_effect`: Every model spends liquidity on behalf of a paying side. → The unit that side is charged for, and where it is visible. |\n| p10 | evidence | The table's values come from dated 2026 filings and investor pages, referenced in full in Sources and Evidence. | source: Rightmove RNS 2026-02-27; Autotrader FY26 results 2026-05-21; CarGurus and Zillow 10-K FY2025; REA FY26 release 2026-08-06; Hemnet investor page accessed 2026-10-19; eBay 10-K FY2025. | `additional_support`: The KPI table. → Its sources and dates. |\n| p11 | definition | Three KPI definitions recur in this part of the book: ARPA per advertiser, ARPR per retailer forecourt, which counts retailer revenue only, and take rate as net revenue over GMV. | quotation: Rightmove's ARPA definition; £2,995 × 13,942 forecourts × 12 ≈ £501 million, Autotrader's reported retailer revenue; eBay's 'net revenues divided by GMV'. | `elaboration`: The KPI table and its sources. → Exact definitions of the three KPIs it uses, before they are compared. |\n| p12 | analysis | Comparing the denominators rather than the values shows four different businesses (a lead-generation portal counts per consumer visit because it sells the contacts visits produce), and classifieds report ARPA and its relatives because they have no observable GMV. | quotation: a16z (2020): GMV is 'the total sales dollar volume of merchandise transacting through the marketplace'; revenue is 'the portion of GMV that the marketplace takes'. | `elaboration`: The three KPI definitions. → What the denominators reveal when compared. |\n| p13 | definition | VAS (value-added services) are paid options bought on top of a basic listing that change how it is presented or ranked, as OLX's ranking stack shows, while subscriptions that bundle them remain a separate model. | quotation: OLX Tech (2025): a 'VAS LTR' model balances 'maximizing relevance for users and ensuring visibility for Value Added Services (VAS), ads that have paid for additional exposure'. | `additional_support`: The KPIs that describe whole models. → The industry's name for the paid options inside them. |\n\n### The Ten Models\n\n**Controlling idea** (`description`, id `models`): Listing marketplaces use ten recurring models; for each, the unit of charge decides what the systems must do and what liquidity it spends.\n\n**Advances the thesis** (S1, S2, S4): Catalogs each model with dated evidence, what it requires and what it spends.\n\n**Transition in:** `sequence`: The vocabulary of who pays, unit and KPI. → The ten models.\n\n**Order of paragraphs** (`grouping`): The models follow the summary table and Figure 1, roughly from the top of the funnel (listing, position, account, listing tier) to the lead and the transaction, then the side revenues (audience, software, referrals, consumers); within each, evidence comes before requirements and requirements before liquidity cost, so the reader sees the model working before judging what it costs.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | claim | Listing marketplaces use ten recurring revenue models, each charging a different unit at a different point in the funnel, and most groups run several with one center of gravity per brand. | table: The ten models with who pays, unit of charge and a dated example each (insertion fee to consumer subscriptions).; figure: Figure 1: each model charges at a different point in the funnel; the further down, the more systems the marketplace must build. | `sequence`: The vocabulary of who pays, unit and KPI. → The ten models laid out with it. |\n| p15 | evidence | An insertion fee charges a seller to publish, usually only in valuable or thin categories or above a free quota, and private supply under it is price-sensitive. | statistic: Scout24 pay-per-ad +10.9% in 2025; Autotrader private-seller revenue £23.6 million in FY26, 11% lower than the year before. | `example`: The table's first row. → Insertion fees in detail. |\n| p16 | explanation | An insertion fee turns the insertion flow into a checkout and makes durations, renewals and moderation refunds billable events. |  | `cause_effect`: Charging at publication. → What that requires from the systems. |\n| p17 | analysis | An insertion fee spends supply by removing the marginal listing, so it fits where each listing is valuable to its seller, and it also works as a trust control because a paid listing is a more expensive attack. |  | `contrast`: What the fee requires. → What it costs in liquidity. |\n| p18 | description (list) | Paid visibility, free listing with paid prominence, comes as bumps, top or featured slots, and highlights. | quotation: Vinted bumps for 3 or 7 days priced by 'duration, item price and … territorial scope' (2026); CarGurus 'Highlight' slots (FY2025). | `sequence`: Charging for the right to list. → Charging for prominence after listing. |\n| p19 | explanation | Paid visibility needs a scheduler, a separate ranking timestamp, slot rotation, a paid label required by EU consumer law and a measure of what the position delivered. | quotation: Directive (EU) 2019/2161, Annex I point 11a: results 'without clearly disclosing any paid advertisement or payment specifically for achieving higher ranking' are always unfair. | `cause_effect`: The three mechanics. → The systems they need. |\n| p20 | analysis | Paid visibility spends relevance, and OLX's retraining after adding vector retrieval shows that a search change is a monetization change. | quotation: OLX Tech (2025): the keyword-trained model under-scored semantic results, which 'would be particularly problematic for VAS ads retrieved via semantic search'. | `contrast`: What paid visibility requires. → What it costs. |\n| p21 | definition | The vertical portals' center of gravity is the professional subscription, a monthly contract of slots, boosts, tools and prominence arranged in tiers. |  | `contrast`: Charging per listing and per position. → Charging per account per month. |\n| p22 | evidence | Published filings show the dominant professional shape as a commitment plus metered or à-la-carte extras, with contract terms and a free tier. | statistic: Rightmove 2025: ARPA +£97 to £1,621, 62% of agency increase from product, Optimiser Edge 35% of independents, 'more than 50%' bought above commitment; CarGurus terms and Restricted Listings. | `example`: The subscription defined. → Its published shape. |\n| p23 | evidence | Autotrader's FY26 results decompose ARPR growth of £141 into price, stock and product levers. | table: Price +£117 (FY25 +£78), stock −£48 (−£22), product +£72 (+£77), with Autotrader's own descriptions. | `additional_support`: Rightmove's commitment plus extras. → Autotrader's lever-by-lever decomposition. |\n| p24 | analysis | The stock lever shows that dealers can cut spend without churning by listing fewer cars, so slot design is a revenue-elasticity decision held in the entitlement service, while bundling Co-Driver shows a feature becoming a pricing argument. |  | `cause_effect`: The lever table. → What its stock and product rows mean for architecture. |\n| p25 | explanation | A professional subscription needs contract management, an entitlement and quota service on every insertion path including feeds, postpaid invoicing, an account hierarchy and ROI reporting that renewal is negotiated on. | example: A dealer management system pushing 300 cars into a 250-slot package overnight; CarGurus account managers providing 'ROI tracking'. | `cause_effect`: Slot design as an entitlement decision. → The full set of systems a subscription needs. |\n| p26 | analysis | A subscription spends less liquidity because the charge sits on the paying side, but it exposes the portal to concentrated customers and to packages competing for the same top positions. |  | `contrast`: What subscriptions require. → What they spend. |\n| p27 | evidence | In seller-pays property markets revenue is listings times yield, and REA's and Hemnet's 2026 figures show yield growing while Hemnet's volume fell (net sales down while revenue per listing rose means fewer listings sold) and it made entry-level formats free. | statistic: REA FY26: Residential revenue A$1,290 million (+12%), Buy yield +13% with flat listings, Premiere+ +7%; Hemnet Q2 2026 ARPL +12.4% to SEK 9,095 while net sales fell 23.1%, and free entry-level formats announced 29 September 2026. | `contrast`: Charging per professional account. → Charging per listing tier, paid by the seller through the agent. |\n| p28 | explanation | Depth products need per-listing orders and mid-life upgrades, agent-mediated billing and delivery evidence per listing, because the payer is not the person who sees the dashboard. |  | `cause_effect`: Per-listing yield. → The systems it needs. |\n| p28a | analysis | A depth product spends supply: because revenue is listings times yield, every tier price rise is paid by sellers who could list less or elsewhere, so a per-listing model is exposed to supply leaving and its most direct defense is free entry. |  | `contrast`: What depth products require. → What they spend. |\n| p29 | description (list) | Lead-generation portals charge for the contact itself in three documented variants: cost per lead, share of voice and pay at close, whose revenue is variable consideration. | quotation: Zillow FY2025 10-K: Rentals cost-per-lead pricing; Premier Agent connections in proportion to 'share of voice'; Zillow Preferred 'performance advertising fee when a real estate transaction is closed', 'variable consideration'. | `contrast`: Charging for listings and positions. → Charging for the contact itself. |\n| p30 | evidence | In Europe, AVIV France monetizes seller leads through a commission share. | quotation: AVIV France 'monetises seller leads through a commission-share model' (2023). | `additional_support`: Zillow's three variants. → A European example. |\n| p31 | explanation | Lead-based fees put the most new systems behind the revenue line (billable-lead definition and deduplication, an allocation engine, an outcome pipeline), so the revenue is only as trustworthy as the attribution chain beneath it. |  | `cause_effect`: The lead-based variants. → What each requires. |\n| p32 | analysis | Lead-based fees spend trust between portal and professional, because the portal gains from manufacturing contacts and the professional from disputing them or moving buyers off the platform. |  | `contrast`: What lead fees require. → What they spend. |\n| p33 | evidence | When the marketplace takes the payment it can charge a seller commission, a buyer fee or a shipping margin, as eBay and Vinted show. | statistic: eBay take rate 13.94% on US$79.6 billion GMV in 2025; Vinted's buyer fee, 'usually 3% to 8% + £0.3 to £0.8' in the UK and 'usually 5% + $0.70' in the US (October 2026). | `sequence`: Charging for leads before the deal. → Charging on the deal itself. |\n| p34 | evidence | Classifieds groups that add transactional fees report modest totals and a margin cost. | statistic: Adevinta 2023: transactional €103 million of €1,826 million; France €73 million of €548 million, with a two-point EBITDA margin fall attributed to the business mix. | `contrast`: eBay's and Vinted's mature take rates. → What classifieds groups adding it report. |\n| p35 | explanation | Transactional fees need the payments stack owned elsewhere, and add two monetization points: a buyer fee on every card puts pricing on the read path, and buyer protection is a liability priced against provisioned losses. | quotation: Vinted's fee varies by 'item characteristics, order value, order type'; eBay books buyer-protection losses and chargebacks as transaction losses. | `cause_effect`: The model's revenue. → What it requires beyond the payments stack. |\n| p36 | analysis | Transactional fees spend margin and simplicity, raising liquidity where buyers fear scams and lowering it where cash handovers are the norm. |  | `contrast`: What the model requires. → What it spends. |\n| p37 | evidence | Advertising monetizes the audience rather than sellers, earns far more at horizontals than verticals, runs sponsored listings in the search stack, and is the model most exposed to Vanity Liquidity because its revenue follows traffic rather than matches. | statistic: Adevinta 2023 advertising €312 million (about 17%), about 27% in European Markets (€204 million of €744 million); Autotrader Manufacturer & Agency £15.2 million in FY26. | `contrast`: Models charging buyers and sellers. → The model charging advertisers for the audience. |\n| p38 | evidence | Data and SaaS lines bring their own billing and stacks and a neutrality problem, because the portal sells tools that create listings for its competitors. | statistic: Scout24 Transaction Enablement €106.6 million in 2025 (+17.5%); Zillow's Follow Up Boss; Veldmark's Keybridge. | `sequence`: Selling the audience. → Selling software and data to professionals. |\n| p39 | evidence | Financing and insurance referrals sell high-intent moments to partners and need partner APIs, consented handoff and commission reconciliation against the partner's reporting. | statistic: Rightmove Mortgages £6.8 million in 2025 (+46%), Rental Services ancillaries £2.6 million; Autotrader's lower insurance-partner revenue in FY26. | `sequence`: Selling to professionals. → Selling buyers' high-intent moments to partners. |\n| p40 | explanation | Consumer subscriptions let buyers pay for advantage where supply is scarce, need consumer entitlements that gate search features, and raise a fairness question for non-paying renters. |  | `similarity`: Partners paying for buyers' moments. → Buyers paying for themselves, as ImmoScout24 Plus showed earlier. |\n\n### Architecture: The Systems Each Model Requires\n\n**Controlling idea** (`analysis`, id `architecture`): The ten models draw on one shared set of monetization capabilities, each on a different subset, and three boundaries around that core matter more than its boxes.\n\n**Advances the thesis** (S2): Turns the per-model requirements into one shared core and the boundaries that keep it honest.\n\n**Transition in:** `conclusion_summary`: The 'what it requires' paragraphs of the ten models. → One shared set of capabilities.\n\n**Order of paragraphs** (`large_to_small`): The whole capability map first, then the core it implies, then the three boundaries that make the core trustworthy.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p41 | analysis | The ten models draw on one shared set of capabilities, each on a different subset, and mapping one onto the other is the first task for an architect asked to add a revenue stream. | table: Capability matrix: catalog and pricing, consumer checkout, contracts and invoicing, entitlements and quotas, ranking hooks, delivery metering, lead attribution, payments ledger, ad server, outcome matching, against the ten models. |  |\n| p42 | evidence | The matrix is the author's synthesis from published mechanics, and Figure 2 draws the shared catalog, pricing, entitlement and billing core with one delivery system per model emitting metering events, as an inference rather than any company's design. | figure: Figure 2: a reference monetization architecture; delivery systems emit metering events so billing can be reconciled with delivery; labeled the author's inference. | `additional_support`: The matrix. → Its basis and the architecture it implies. |\n| p43 | transition | Read down the matrix, catalog and pricing, entitlements, ranking hooks and metering serve most models, so they form one shared core, and three boundaries around it matter more than the boxes. |  | `cause_effect`: The matrix and Figure 2. → What they show and the three boundaries that follow. |\n| p44 | claim | The listing holds references to paid effects, not commercial truth, which lives in the entitlement ledger and billing so refunds and takedowns can change paid state without the listing service understanding contracts. | example: A listing knows it carries a Top listing until Sunday at 20:00 but not the price, contract or payment. | `sequence`: The three boundaries announced. → The first boundary. |\n| p45 | claim | Delivery systems must emit evidence of what each paid product delivered, or nobody can answer the professional's question of what they got for their money. |  | `sequence`: The first boundary. → The second. |\n| p46 | claim | Ranking consumes paid effects but does not own them: how far a paid input may move the order belongs to ranking's guardrails, set jointly with monetization, or Multiplier Creep follows. |  | `sequence`: The second boundary. → The third. |\n\n### In Practice: Pricing Power and Its Limits\n\n**Controlling idea** (`analysis`, id `pricing-power`): Mature portals grow through annual price-and-product events, which the systems must ship as data, but concentrated customers limit that power and paid products must be measured causally.\n\n**Advances the thesis** (S3): Shows how pricing power works, where it stops, and what systems it needs.\n\n**Transition in:** `cause_effect`: The shared core and its boundaries. → The commercial event that tests that core hardest: the annual price change.\n\n**Order of paragraphs** (`problem_solution`): Growth through price events, its system consequence, its limit, the staging that answers the limit, then how to measure whether the products sold actually work.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p47 | evidence | Mature portals grow revenue per customer far faster than their customer count through an annual price-and-product event. | statistic: Rightmove 2025 membership +1%, ARPA +6%, 2026 guidance ARPA +£110–120; Autotrader forecourts −0.5%, ARPR +5%; CarGurus growth from tier upgrades, add-ons and price increases; Autotrader's 'annual 1 April 2025 pricing and product event'. |  |\n| p48 | recommendation | A price change is a recurring, dated release that must ship as data, with effective dates and a rollback, or the year's main commercial event becomes a deployment risk. |  | `cause_effect`: The annual price-and-product event. → What it means for the systems. |\n| p49 | evidence | Pricing power weakens where professional customers are concentrated, and Autotrader's FY26 forecourt fall shows that market leadership does not prevent customer revolt over a commercial-model change. | quotation: Gurley (2012): 'High buyer and supplier fragmentation is a huge positive'; Autotrader FY26: average forecourts 236 (1.7%) lower in the second half, attributed to 'more difficult cost-related trading conditions and concerns with the speed and nature of our Deal Builder product roll-out', alongside a share of time on site eleven times its nearest competitor's. | `contrast`: Pricing power as a growth engine. → Its limit with concentrated customers. |\n| p50 | recommendation | Changing what professionals are sold needs the rollout tools of a risky code change: cohorts, contract-tied flags, account-manager feedback and a measured rollback. |  | `cause_effect`: Customer revolt over a commercial change. → The staging it calls for. |\n| p51 | evidence | A naive dashboard can make the best paid products look worst because of selection bias, as OLX showed with matched comparisons validated by an A/B test. | statistic: OLX Tech (2026): premium-package listings 'appeared to perform worse'; after propensity score matching, +17.6% from Package 1 to 2 and +97.4% from Package 1 to 4, validated against a randomized A/B test. | `sequence`: Staging commercial changes. → Measuring whether a paid product works. |\n| p52 | recommendation | The ROI dashboard used in renewals must not be a naive comparison, and causal measurement needs the experimentation platform, or the model will be renegotiated on the professional's numbers. | figure: Figure 3: naive comparison versus matched pairs of similar cars. | `cause_effect`: OLX's selection bias. → Its two consequences for architecture. |\n\n### Monetization Versus Liquidity\n\n**Controlling idea** (`recommendation`, id `liquidity`): Every model spends the same reserve, organic liquidity, so each needs a guardrail metric owned outside the team that books the revenue.\n\n**Advances the thesis** (S4): Gathers the per-model liquidity costs into one table of guardrails.\n\n**Transition in:** `contrast`: Pricing power and paid-product value, measured on the revenue side. → What each model costs on the other side, and the guardrail for it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p53 | recommendation | Every model that draws on the match spends organic liquidity, so each needs a guardrail metric with a stop condition agreed before launch, owned outside the revenue team, in practice by the general manager and the liquidity metrics owner. | table: For each model: what it spends, guardrail metric and typical failure (insertion fee to consumer subscription). |  |\n| p54 | analysis | The guardrails measure supply, relevance, trust or experience rather than revenue, so a revenue dashboard cannot see them, and their definitions belong in the governed metrics layer. | figure: Figure 4: the monetization-liquidity loop; revenue funds liquidity, overcharging erodes it. | `elaboration`: The guardrail table. → What its rows have in common and where definitions live. |\n\n### Veldmark Worked Example: Revenue Mix and Three Proposals\n\n**Controlling idea** (`example`, id `worked-example`): Veldmark's revenue mix and the forum's answers to the four questions turn three pricing proposals into three architecture decisions.\n\n**Advances the thesis** (S5, S1, S4): Applies the chapter's tests to ledger figures and to each proposal.\n\n**Transition in:** `example`: The chapter's models, systems, pricing limits and guardrails. → Veldmark's own numbers and the three proposals from the scene.\n\n**Order of paragraphs** (`grouping`): Revenue mix first, because Motorvane's slot exposure is needed to judge Proposal 2; then the proposals in the scene's order, each as case, four answers, decision.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p55 | evidence | Veldmark's 2026 revenue of €1.31 billion splits across brands and models (figures from the scenario ledger), with derived unit figures as this chapter's arithmetic. | table: Tradeyard €410M (VAS €150M, pro subscriptions €135M, Safe Deal €75M, insertion €50M); Motorvane €360M; Hearthly €395M; Keybridge €45M; Veldmark Ads €100M; derived VAS ≈ €1.25 per new listing, Safe Deal take rate ≈ 7.4%, Motorvane ARPA ≈ €927, Hearthly ≈ €616, Keybridge ≈ €383. |  |\n| p56 | analysis | Veldmark runs nine of the ten models (all but consumer subscriptions), each implemented four times, which is why one group catalog and entitlement service by Q2 2028 is a Common Ground goal. |  | `elaboration`: The revenue table. → What it shows about models and implementations. |\n| p57 | analysis | Motorvane's revenue is exposed at the slot, worth about €15 a month per car, so any package change must model the stock lever. | reasoning: €927 a month per dealer; about 62 listings each (1.45 million × 91% ÷ 21,400); about €15 per slot. | `elaboration`: The ARPA column. → Where Motorvane is exposed. |\n| p58 | context | Olivier argues Tradeyard NL's Top listing is underpriced and that Spotlight would add a premium step. |  | `sequence`: The revenue mix. → Proposal 1. |\n| p59 | analysis (list) | The forum finds the unit is a listing per 48-hour window, the system of truth is weak, the liquidity cost high, and buyers and Top-listing sellers would notice first. | scenario: Top listings enforced partly by reserved slots and partly by a Solr boost multiplier in Yardstick; no report of promised versus existing top positions; Priya Raman's April ranking review already showing the boost eating relevance. | `problem_solution`: Olivier's case. → The four answers. |\n| p60 | claim | Spotlight is deferred until the ranking review reports and paid effects are explicit fields, and only the Top listing price rise is approved because it changes no system and no position count; a month later the June ranking policy made the deferral final by withdrawing Spotlight before it launched. | scenario: A month after the May forum, Ranking policy v1 (June 2027) capped paid positions on the first page and withdrew 'Spotlight', making Proposal 1's deferral final. | `cause_effect`: The four answers. → The decision. |\n| p61 | context | Olivier argues dealers already measure Motorvane by leads, so leads above an allowance should be billed at an illustrative €12. |  | `sequence`: Proposal 1's decision. → Proposal 2. |\n| p62 | analysis (list) | The Essen Golf's 23 raw contacts are 19 billable leads, worth €228 in fees against about €15 of slot value, and no system of truth for leads exists. | scenario: 14 e-mails, 7 calls, 2 test-drive bookings in 10 days; rule one buyer, one listing, one lead per 14 days; three counting systems and three identities; Veldmark ID only in 2028; guardrail share of tracked contacts plus response time. | `example`: Olivier's case. → The Essen Golf worked through. |\n| p63 | claim | The per-lead component is approved for design, not launch: a lead ledger counts billable leads for six months without billing until it agrees with dealers' CRMs. |  | `cause_effect`: The missing system of truth. → The decision. |\n| p64 | context | Olivier argues Valuo homeowners are property's most valuable leads and a commission share aligns Hearthly with agencies. |  | `sequence`: Proposal 2's decision. → Proposal 3. |\n| p65 | analysis (list) | On the Lyon apartment a commission share would earn about €3,100 months later on a price Hearthly does not observe, needing outcome matching, revenue estimation, and governance limits from the Keybridge decision and consent. | scenario: Valuo €372,000–€401,000, listed at €389,000; 4% agency fee, 20% share; DVF matching with lag; Keybridge decision of March 2027; Lucía Ortega's consent requirement. | `example`: Olivier's case. → The Lyon apartment worked through. |\n| p66 | claim | The commission share runs as a one-region Lyon pilot in 2028 beside the flat-fee product, with finance agreeing the estimation method first, because its revenue depends on a partner reconciliation that must be designed before launch. | figure: Figure 5: one four-question review, three verdicts. | `cause_effect`: The outcome outside Hearthly's systems. → The decision. |\n\n### Trade-offs: Choosing a Model\n\n**Controlling idea** (`comparison`, id `trade-offs`): Each model is right only under specific conditions, and complexity compounds when several models claim the same page.\n\n**Advances the thesis** (S2): Generalizes the worked example's judgement to every model.\n\n**Transition in:** `cause_effect`: Three proposals judged one by one. → A comparison of all models on the same criteria.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p67 | comparison | Compared on predictability, liquidity risk, system complexity and regulatory exposure, each model is right only where its unit matches how sellers sell and where the marketplace can count what it delivers. | table: Ten rows (insertion fee to consumer subscription, with pay per lead, share of voice and pay at close separate) against five criteria and a 'right when' column. |  |\n| p68 | analysis | Model complexity compounds when models share a page, because each paid claim competes for the same few positions, so a group needs a shared rule or Multiplier Creep follows; at Veldmark that rule is the June ranking policy that settled Proposal 1. | example: A single Motorvane results page combining package prominence, depth products, a sponsored listing and display ads, each sold by a different team. | `contrast`: The table's model-by-model view. → What it cannot show: models on one page. |\n\n### Vertical Differences\n\n**Controlling idea** (`comparison`, id `verticals`): Payers, units, KPIs and risks differ by vertical, so the monetization model is the least shareable part of a marketplace even when the systems beneath it are shared.\n\n**Advances the thesis** (S2, S6): Shows what a group can share and what it must leave to brands.\n\n**Transition in:** `elaboration`: The model-level trade-offs. → How the choice differs by vertical.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p69 | comparison | The right model also depends on the vertical, which changes the main payer, the center of gravity, the KPI, lead value, the distinctive system and the distinctive risk. | table: General classifieds, real estate, automotive, jobs and recommerce against six dimensions. |  |\n| p70 | recommendation | The monetization model is the least shareable part of a marketplace, so a group shares the catalog model, entitlements, paid labels and metering and leaves packages, prices and model choice to brands. | example: AVIV's experience that generic infrastructure is shared while monetization stays local; Veldmark's 'share platforms, not products'. | `cause_effect`: The vertical table. → Its consequence for groups. |\n\n### Failure Modes\n\n**Controlling idea** (`explanation`, id `failure-modes`): Monetization fails in recurring ways when a model is launched before the systems that count, cap and prove what it sells.\n\n**Advances the thesis** (S4, S6): Names the breakdowns the chapter's tests prevent.\n\n**Transition in:** `contrast`: What a group should share and leave to brands. → What goes wrong when it does not.\n\n**Order of paragraphs** (`grouping`): The three named failure patterns from the opening callout first, then the failures specific to measurement, lead fees, outcomes and fraud.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p71 | transition | Most monetization failures come from launching a model before the systems that count, cap and prove it, and they recur in a few shapes. |  |  |\n| p72 | explanation | Selling views or impressions sells exposure that cannot convert (Vanity Liquidity), so portals should report contacts and leads under governed definitions shared by billing and the ROI dashboard. |  | `example`: The failures announced. → The first: Vanity Liquidity. |\n| p73 | explanation | Paid positions without a per-page cap fill the first page gradually (Multiplier Creep), invisible in revenue until contact rates fall. |  | `sequence`: Selling the wrong quantity. → Selling too much of the right one. |\n| p74 | explanation | Revenue models added as conditions in services leave nobody able to say what a seller is entitled to (Billing by Guesswork). |  | `sequence`: Overselling positions. → Implementing products as code. |\n| p75 | explanation | Misleading ROI dashboards discount the best products and price events shipped as code make the commercial calendar hostage to the release train; the remedies are matched comparisons on the experiment platform and prices shipped as dated, reversible data, as the pricing section showed. |  | `similarity`: Products as code. → Two measurement and release failures, each with its remedy, pointing back to the pricing section. |\n| p76 | explanation | Pay-per-lead launched before a lead definition, deduplication and a credit process will be defined by the first hundred disputes. |  | `sequence`: Measurement failures. → Lead fees without a dispute process. |\n| p77 | explanation | Outcome-based revenue reported only by the professional is a trust arrangement, not billing, and finance's estimation question must be answered before launch. |  | `sequence`: Disputes over leads. → Outcomes the marketplace cannot see. |\n| p78 | explanation | Paid visibility can reward the scammer, so every boost goes through the listing's risk checks and is refunded, not delivered, when moderation removes the listing. |  | `sequence`: Outcome-based revenue. → Revenue from fraudulent accounts. |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `ca-view`): A Chief Architect does not choose prices but owns the systems that make every model measurable, enforceable and reversible, and watches the signals of silent decline.\n\n**Advances the thesis** (S6, S4): States the decisions the chapter assigns to the Chief Architect.\n\n**Transition in:** `problem_solution`: The failure modes. → The systems decisions that prevent them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p79 | recommendation (list) | Five decisions are the Chief Architect's: separate model choice from implementation, make paid effects explicit, attach a liquidity guardrail to every change, require a model readiness card, and fund causal measurement. | scenario: Veldmark's Common Ground goal of one catalog and entitlement service by Q2 2028; the readiness card's fields; toolkit's entitlement matrix. | `problem_solution`: The failure modes. → The decisions that prevent them. |\n| p80 | recommendation | Over the long term the Chief Architect watches outcome-dependent revenue, paid stock against known stock, the paid share of first-page positions and the engineering cost of the price event. |  | `sequence`: The five decisions. → The signals to watch afterwards. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Ten questions turn Ingrid's four into a working review of any revenue proposal.\n\n**Advances the thesis** (S6, S1, S4): Gives the reader a review drawn from every section.\n\n**Transition in:** `cause_effect`: The Chief Architect's decisions. → Questions that test them on a proposal.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p81 | recommendation (list) | Ten questions test a proposal's unit and system of truth, delivery evidence, liquidity guardrail, page competition, price-event readiness, lead and outcome definitions, measurement method, regulatory duties and shareability. |  | `cause_effect`: The Chief Architect's decisions. → Questions that test them. |\n\n## Conclusion: From Models to Machinery\n\n**Synthesis:** Choosing a monetization model is choosing which unit to count, which system holds the count and how much liquidity to spend; the business case says whether sellers will pay, but only those three choices say whether the marketplace can deliver what it sold without spending what makes it worth buying.\n\n**So what:** A revenue proposal is an architecture proposal: put the four questions to it before its business case, or the marketplace leaks revenue, invites disputes and spends its liquidity unseen.\n\n**Callback:** The scene's framing: Olivier presented the three proposals as pricing decisions and Ingrid as architecture decisions with four questions. The conclusion says the four questions turned three pricing proposals into three different architecture decisions: a price rise only, a lead ledger that counts before it bills, and a one-region pilot.\n\n**Takeaway** (`course_of_action`): Put the four questions to the next revenue proposal before its business case.\n\n**Hand-off** to [Packages, Bumps and Quotas: Products, Pricing and Entitlements](products-and-entitlements.html): `problem_solution`: All three Veldmark proposals ran into the same missing piece: no brand could say from one system what a seller had bought and what they had received. → The commercial core that supplies that record: product catalog, pricing engine, entitlement ledger, enforcement points, metering and the sold-versus-delivered reconciliation.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p82 | synthesis | Choosing a model is choosing a unit, the system that counts it and the liquidity it spends, which is why Ingrid's four questions turned three pricing proposals into three different architecture decisions and should come before the next business case. | scenario: A Top listing price rise without Spotlight, a lead ledger that counts before it bills, a one-region commission pilot. |  |\n| p83 | transition | The ten models share one commercial core, and all three proposals ran into the same missing piece, no brand able to say from one system what a seller bought and received, which products-and-entitlements designs. |  | `problem_solution`: Three decisions reached with the four questions. → The missing record they all exposed, and the chapter that builds it. |\n\n## Non-goals\n\n- Designing the catalog, pricing engine, entitlements, quotas and billing. See [Packages, Bumps and Quotas: Products, Pricing and Entitlements](products-and-entitlements.html).\n- The ad stack, header bidding, consent and retail media. See [Selling Attention: Display, Native and Retail-Media Advertising](advertising-platforms.html).\n- Payments, shipping, buyer protection and the transactional pivot. See [Beyond the Contact: Payments, Shipping and Buyer Protection](transactions-and-payments.html).\n- Lead objects, conversations and lead routing. See [From Interest to Contact: Messaging and Lead Management](messaging-and-leads.html).\n- Paid-organic blending inside ranking. See [Ranking for Two Sides: Relevance, Freshness and Paid Visibility](ranking.html).\n- Regulatory detail on paid-ranking disclosure. See [Rules of the Marketplace: DSA, DAC7 and Vertical Regulation](marketplace-regulation.html).\n- Network effects and liquidity metrics in depth. See [Liquidity Is the Product: Network Effects, Local Markets and Marketplace Metrics](liquidity-and-network-effects.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- (Resolved 2026-10-19.) The editor corrected Safe Deal 2026 to 11.6M transactions and about €1.02B GMV, so the €75M of fees (buyer fees about €59M plus shipping-label margin about €16M) reconciles; the chapter states the derived take rate of about 7.4%.\n- The cause of Hemnet's 2026 volume decline is not verified; the chapter states only the published figures.\n- No primary source was verified for pay-per-call products at major portals; the model is mentioned only within lead-based fees.\n\n## Decision log\n\n- **2026-10-19** — Organized the chapter around the unit of charge rather than around companies, because the unit maps directly to the system of record. Rejected a company-by-company tour, which belongs in Part IX.\n- **2026-10-19** — Framed every model as spending liquidity, with a guardrail table, so the monetization-versus-liquidity tension is operational rather than rhetorical.\n- **2026-10-19** — Used three proposals at the architecture advice forum as the worked example, instead of a single revenue-mix table, so the chapter ends in decisions (defer, design without billing, regional pilot).\n- **2026-10-19** — Kept advertising and transactions as short model sections that link out, to avoid re-teaching their chapters.\n- **2026-11-12** — Converted spec.md to spec.json. Success criteria rewritten: the KPI-denominator criterion became AC-4; pricing power and causal ROI became AC-5; the inference-labelling criterion became AC-6 (rubric); 'name the ten models', 'state what each model spends' and the Veldmark worked-example criterion are covered by the journal spec's AC-1. Dropped as inventories: the list of tables, diagrams and sections. AC-4 to AC-6 are this pass's own criteria, minor.\n- **2026-11-12** — Added lead-in units p67 (trade-off table), p69 (vertical table) and p71 (failure modes), a lead sentence to the Questions list (p81), and a synthesis paragraph p82 before the hand-off, so each section boundary and the conclusion carry their declared transition, synthesis and callback. Rewrote the guardrail table's italic note (p54) as prose that says what the table shows, keeping its content and link. Rejected leaving the sections to open on a bare table or list, which earlier LISTED draft checks failed.\n- **2026-11-12** — Thesis rubric (fresh agent, thesis object only): tests 1-5 passed; test 6 failed because S3 (pricing power) argued a point the claim does not make and S2 stated the fit conditions only generically. Rewrote S3 as part of the claim's 'count and prove delivery' condition and spelled out the five pairings in S2; the copied claim was not changed. Rubric notes not acted on: how_why does not argue why the guardrail owner sits outside the revenue team, and the claim is one long sentence; both live in journal-spec.json, which this pass does not edit.\n- **2026-11-12** — Flow rubric (fresh agent, --flow output only): sound with notes. Taken: the stop condition agreed before launch added to p53, and p54 reworded so it no longer repeats p53's point about ownership. Order unchanged. Notes not taken are listed in open_questions.\n- **2026-11-12** — Draft check round 1 escalated on a spec fault: both flow readers met ARPA, ARPR and QARSD in the comparison of denominators before the paragraph that defines them. Swapped the two units: the KPI definitions are now p11 and the denominator comparison p12, with both transitions rewritten. Also changed the transition into Concepts (it now carries over the scene's question rather than claiming 'who pays' is one of Ingrid's questions) and into Monetization Versus Liquidity (contrast between the revenue side and the cost side). Intent, thesis, role and criteria unchanged.\n- **2026-11-12** — Draft check round 2 escalated on a spec fault: both flow readers expected every model to end with what it requires and what it spends. The declared pattern inside The Ten Models now applies to models 1-6 only, and p14 tells the reader that the four smaller models are covered briefly. Round-2 draft fixes: failure-modes lead-in now picks up the shared systems, the liquidity opening split into two sentences, 'as the ledger records' replaced by 'as shown below', the Spotlight withdrawal marked as looking ahead, RECONCILED glossed as the companion finance-systems book. Own additions trimmed to stay within the limit.\n- **2026-11-12** — Word limit: spec.md set none, so max_words is the published length by check_draft's count (8,890) plus 5%: 9,334.\n- **2026-11-12** — Escalation resolved under the author's delegation: p56 now says Veldmark runs nine of the ten models, because the revenue table shows nine (insertion, VAS, pro subscriptions, depth, leads, transactional, advertising, data and SaaS, referrals) and the ledger states no count. The copied thesis.how_why still says 'eight' because it must equal journal-spec.json; the correction to 'nine' is passed to the orchestrator as a journal-spec edit.\n- **2026-11-12** — Escalation resolved under the author's delegation: depth products get their own 'What it spends' unit (p28a), so models 1-6 all follow evidence, requires, spends. It holds Hemnet's structural point moved from p27 (published text kept) plus one sentence on listings × yield; no new real-company claim.\n- **2026-11-12** — Escalation resolved under the author's delegation: the Spotlight withdrawal by the June ranking policy moved from p60 (forum-day decision) to p68 (models sharing a page need a shared rule), where it is the example of that rule, so the worked example keeps its forum-day frame. Wording kept; 'capped paid positions on the first page' follows the ledger's Ranking policy v1 line.\n- **2026-11-12** — Draft fixes under the author's delegation: ARPR's scope stated before its arithmetic (p11); the seller-pays sentence split in two (p12); transitions into p13 (VAS), p51 (OLX measurement) and the Questions list now carry over what the spec declares; minor fixes in p01 ('though'), p09 (bridge from the paying side), p57 (no pointer to absent counts). Autotrader's Deal Builder glossed only from the quoted sentence (retailers' trading costs and how a new product was introduced to them). Minor findings not acted on: Proposals 2 and 3 do not answer all four questions explicitly (adding answers would add Veldmark facts); the OLX subsection stays under the pricing-power heading (order kept).\n- **2026-11-12** — Word limit raised under rule 2 from 9,334 to 9,600 (+2.8%) for the p28a unit and the readability fixes.\n- **2026-11-12** — Flow-rubric notes not taken (listed earlier in open_questions): accepted under the author's delegation, 2026-11-12; they would cut or move published text.\n- **2026-11-12** — Unchecked modalities (checklist, summary, dialog, comics): none exists in the folder, so modalities stays empty; accepted under the author's delegation, 2026-11-12.\n- **2026-11-13** — Spec fault (flow, major): the June ranking policy outcome moved from p68 (Trade-offs) to p60 (Proposal 1's decision), worded as withdrawing Spotlight before it launched; p68 keeps a one-clause pointer. fixed under the author's delegation (fix-only
