<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, acceptance criteria AC-1 to AC-3, the thesis and the role are copied unchanged from the identity-and-verification entry in journal-spec.json. Added for this post: the audience, supporting claims S1 to S6, AC-4 and AC-5 (minor), a roadmap sentence set in the introduction, a lead paragraph for Trade-offs and a synthesis and so-what in the conclusion.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Proofing, authentication and business verification as separate axes in the NIST SP 800-63-4 vocabulary; identity levels (person and business ladders) derived from claims; KYB; verified badges as statements to the other side.\n- **Know:** The identity service and its neighbors, the claim record (type, method, source, attributes, assurance, expiry, status) and its lifecycle; passkeys, risk-based authentication, recovery and pre-hijacking; proofing methods including bank eIDs and the EU Digital Identity Wallet with its actual obligations.\n- **Know:** The group identity options (per-brand, shared with one profile, shared with brand profiles and pairwise identifiers, federation broker) and why separability matters.\n- **Believe:** The right amount of identity depends on what the user is about to do; asking for everything at the door or nothing at all both fail.\n- **Believe:** A badge that outlives its claim is a false statement, and a group identity that cannot be cut is a liability to the owners.\n- **Be able to:** Design the claim contract and the level policy, and place step-up verification at specific risky actions with its cost estimated.\n- **Be able to:** Name the account-takeover controls and the recovery rules that keep a strong login strong.\n- **Be able to:** Choose a group identity topology and challenge a 'verified' badge that promises more than was checked.\n\n**Audience:** Chief and enterprise architects of marketplace groups, identity and security leads, trust-and-safety and product leaders who decide where friction goes, and data protection officers who must approve what verification collects.\n\n**Already knows:**\n\n- APIs, databases, event streams, search engines and Kubernetes (the book's baseline), and OIDC and multi-factor authentication in general.\n- From earlier chapters: the trust platform and its decision record (trust-and-safety-architecture); fraud signals, the risk scoring service, the identity graph and step-up friction chosen by a cost model (fraud-prevention); seller accounts, organizations and the group business party registry (sellers-and-accounts).\n- Veldmark, its brands (Tradeyard, Motorvane, Hearthly, Keybridge), its cast, Safe Deal, Femke's bike and the 7 March 2027 phishing incident, the Barcelona fake-rental ring, and the failure-pattern names.\n\n**Does not yet know:**\n\n- Proofing, authentication and business verification as separate axes; NIST SP 800-63-4 identity and authenticator assurance.\n- Identity levels L0 to L5 and the business ladder B1 to B3; KYB and its difference from KYC; the claim record and its lifecycle; verified badges as scoped promises.\n- Passkeys, synced passkeys, session and account posture, recovery assurance and pre-hijacking.\n- Bank eIDs, document and liveness checks, and the EU Digital Identity Wallet with its actual obligations.\n- Pairwise identifiers, a controller per brand and separability of a group identity.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a group with per-brand logins, a phone-number badge, one-time dealer checks and an owner asking about a sale, the reader names what to build. *Probe:* Your group runs a separate login per brand; its 'verified' badge means a confirmed phone number; dealers were checked once when they signed; and the owner asks what it would cost to sell one brand. Using only this chapter: what do you build? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-4 | The reader can state what the EU Digital Identity Wallet does and does not oblige a classifieds marketplace to do. *Probe:* Using only this chapter: from the end of 2026, must a classifieds marketplace that is not a very large online platform accept the EU Digital Identity Wallet for login or verification, and what role should the wallet play in its plans? | `custom` | cold_reader | minor |\n| AC-5 | Every statement about a real company carries a dated source, and every inference about a real company's internal design is labeled as such. *Probe:* Does every statement about Mercari, FINN, Schibsted, Vend, Adyen or another real company cite a dated source, and is every inference about their internal systems labeled? | `custom` | rubric | minor |\n\n## Thesis\n\n**Question:** How much should a marketplace know about its users, and how does it verify it?\n\n> **Claim:** A marketplace should model identity as separate, expiring and revocable claims (contactability, authentication strength, proof of person, proof of business), each with a method, source, time and expiry, and derive identity levels and badges from them rather than store a 'verified' flag; it should require a level at the moment of risk (contacting a seller, publishing a rental, receiving a payout, trading) rather than at registration; hold account recovery to the strength of login, with passkeys and risk-based authentication against takeover; let a badge state only what was checked and lapse with its claim; and, in a group, run one identity service with brand profiles and pairwise identifiers so that any brand can be cut out with its users.\n\n**Disputed by:** The common practice of asking for almost nothing at registration and then, after a fraud wave or a regulator's letter, an identity document from everyone, with one 'verified' flag, business checks done once at contract signature, and either a login per brand or one shared account and profile across the group.\n\n**So what:** A Chief Architect who accepts this owns the claim types, levels and badge catalog centrally while brands decide which actions require which level, treats the identity service as tier-zero infrastructure, makes brand separability a requirement with an answer measured in weeks, budgets verification as a per-use cost in each policy's business case, and keeps the EU Digital Identity Wallet on the roadmap but off the critical path.\n\n**How and why:** Femke's scammer was phone-verified on Tradeyard, and the same number had registered a Motorvane account three weeks earlier, because about 80 million accounts sat in three identity stores with no shared notion of a person while about 11 million people held accounts on two or more brands. None of the 26 Barcelona accounts had proved more than an e-mail address; requiring L4 of private landlords publishing rentals in Spain was estimated at about €115,000 a year and 8–12% drop-out of honest landlords, against about €71,000 lost in one ring, and makes each fake landlord cost a real, checkable identity. Motorvane's 21,400 dealers had been checked once, at signature. And Veldmark's private-equity owner may sell a brand, which only pairwise identifiers, a controller per brand and export make cheap.\n\n**Supporting claims**\n\n- **S1** — Identity is separate claims on three axes (proof of person, strength of authentication, proof of business) plus contactability, from which identity levels and a business ladder are derived, and a badge is a scoped promise that states only what was checked.\n- **S2** — The identity service is built around the claim record (type, subject, method, source, attributes, assurance, expiry, status) as its contract, with risk scoring and raw documents kept outside it, and a lifecycle in which every expiry or revocation recomputes levels and badges.\n- **S3** — Authentication strength is defended by phishing-resistant passkeys, risk-based checks on sensitive actions such as payout changes, recovery held to at least the assurance the account had, and cross-brand linking only after proof of control, never by e-mail match.\n- **S4** — Proofing methods differ by country, assurance and cost, and the EU Digital Identity Wallet is an option rather than an obligation for most marketplaces, so the verification orchestrator is pluggable by country and method and every adapter writes the same claim.\n- **S5** — A level is required at the moment of risk (contact, rental publication, payout, trading) with its cost estimated against the losses it prevents, and business claims expire and are re-checked continuously.\n- **S6** — A group runs one identity service with brand profiles, pairwise identifiers, a controller per brand and export, so that any brand can be cut out with its users.\n\n## Role in the part\n\nSupplies the strongest friction fraud scoring calls for and the business registry on which regulation builds its trader record: identity as claims, levels required at moments of risk, and one group login designed to be cut. Supports P5-4, P5-2 of part `part-5`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in concepts to proofing: the vocabulary (axes, levels, badges), then the service built on the claim, then authentication and takeover, then the proofing methods behind L4; `small_to_large` in in-practice then levels-in-practice: the group identity design, then the single policies built on its level model (Barcelona, Motorvane, Femke replayed))\n\nThe scene states the problem with Veldmark's facts (a phone-verified scammer, the same number on a second brand, three identity stores and a pending group login). The concepts give the words the answer needs: three axes, levels derived from claims and badges as promises. The architecture then makes the claim the contract, which authentication and proofing both write to: authentication first, because takeover is the daily risk and recovery bounds the strength of every login, then proofing, because it fills the L4 claim the levels require. The group identity question comes after the parts it shares, and takes up pre-hijacking next to Veldmark ID's rules, because that back door opens only when a group links its brands' accounts; and the Veldmark policies apply the whole model to the opening's cases. Trade-offs, vertical differences, failure modes, the Chief Architect's view and the questions judge the design the reader has seen. Putting proofing before authentication would compare L4 methods before the reader knows that recovery must reach the assurance the account had, which is why high-assurance proofing is needed after onboarding too. Putting the architecture before the concepts would name claims, levels and badges before they are defined; putting the group question before authentication would ask which parts a group shares before the reader knows what recovery demands of a shared login.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): Most marketplaces answer the identity question twice, badly: first they ask for almost nothing, because every registration field costs sign-ups; then, after a fraud wave or a regulator's letter, they ask everyone for an identity document. Browsing needs no identity; publishing a rental in a city full of fake-rental rings needs a great deal.\n\n**Bridge:** Fraud-prevention ended on its strongest and most expensive friction: asking users to prove who they are. → How much a marketplace should know about its users, how it verifies it, what a badge promises and how one identity service serves a group of brands.\n\n**Thesis statement** (KEY POINTS callout (three bullets) and p01, which states that the right amount of identity depends on what the user is about to do.): Identity is a set of separate claims with a method, source, time and expiry, from which levels are derived; a level is asked for at the moment of risk; recovery is held to the strength of login; a badge says only what was checked; and a group runs one identity service with brand profiles and pairwise identifiers so a brand can still be separated.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p02, which names the sections in order.):\n\n- Start at Veldmark, with one phone number on two brands. *Kept in:* scene.\n- Separate proofing, authentication and business verification, and turn them into identity levels and badges. *Kept in:* concepts.\n- Design the identity service around one contract, the claim. *Kept in:* architecture.\n- Follow account takeover and recovery. *Kept in:* authentication.\n- Compare the methods for proving who a person is, including the EU Digital Identity Wallet. *Kept in:* proofing.\n- Take up the group question, one login for four brands or four logins forever, and apply the levels to Veldmark's Barcelona, Motorvane and Femke cases. *Kept in:* in-practice, levels-in-practice.\n- Close with the trade-offs, vertical differences, failure modes, the Chief Architect's view and questions to ask. *Kept in:* trade-offs, verticals, failure-modes, ca-view, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | claim | The right amount of identity depends on what the user is about to do, which is why both the first answer (ask for almost nothing) and the second (ask everyone for a document after a fraud wave) fail. | reasoning: Every registration field costs sign-ups; an incident makes identity feel like the solution; browsing needs none, a rental in a city full of fake-rental rings needs a great deal. |  |\n| p02 | transition | The chapter separates proofing, authentication and business verification and then follows them, in order, through Veldmark's scene, levels and badges, the identity service, takeover and recovery, proofing methods, the group question and Veldmark's policies, to the closing judgements. |  | `elaboration`: The claim that identity depends on the action. → The three questions an identity system answers and the order in which the chapter takes them up. |\n| p03 | context | The result is an identity service that neighboring chapters call, each of which owns a related topic; the running example is Veldmark and the public evidence comes from NIST and FIDO standards, Mercari's and FINN's practice, Schibsted's account separation and EU law. |  | `cause_effect`: What the chapter will build. → Who uses it and which neighbors own what: sellers-and-accounts, fraud-prevention, marketplace-regulation (which builds its trader record on the business registry designed here), messaging-and-leads and transactions-and-payments. |\n\n## Sections\n\n### Setting the Scene at Veldmark: One Phone Number, Two Brands\n\n**Controlling idea** (`context`, id `scene`): Femke's scammer carried a green 'verified' tick for a phone number, and the same number had a Motorvane account nobody could see, because Veldmark ran three identity stores with no shared notion of a person.\n\n**Advances the thesis** (S1, S6): Gives the two failures the chapter answers: one claim shown as identity, and brands that cannot see each other's users.\n\n**Transition in:** `example`: The question of how much to know and the roadmap. → The Veldmark case that shows both failures.\n\n**Order of paragraphs** (`chronological`): The incident, then the two facts Aisha found, then Ingrid's inventory and its numbers, then the decision and the questions it left; the questions come last because they name what the rest of the chapter answers.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p04 | example | On 7 March 2027 a fake Safe Deal payment link reached Femke, and when Aisha traced the account the following week two facts stood out. | scenario: Sunday 7 March 2027; a fake Tradeyard Safe Deal payment link for her €240 city bike; account suspended at 20:26, seven minutes after Femke's report; Aisha Rahman, Group Head of Trust & Safety. |  |\n| p05 | example | The first fact was that the scammer's account was phone-verified, which in Tradeyard's vocabulary earned a green 'verified' tick for proving control of a number for a few minutes. | scenario: Tradeyard's green tick meant a phone number confirmed by a six-digit SMS code. | `sequence`: The two facts. → The first: the tick. |\n| p06 | example | The second fact was that the same number had registered a Motorvane account three weeks earlier, which Motorvane could not know because each brand runs its own identity system. | scenario: Motorvane private-seller account registered three weeks earlier with the same number. | `sequence`: The first fact. → The second: the other brand. |\n| p07 | evidence | Asked what each brand knew about its users, Lucía and Aisha answered in one table that shows four logins, four meanings of 'verified' and business checks done once. | table: Per brand: login methods, what 'verified' means (phone by SMS at Tradeyard, e-mail at Motorvane and Hearthly), business verification (VAT at subscription, contract checks at signature, manual checks by sales) and accounts (46 million, 19 million, 15 million, 61,000 Keybridge staff users). | `cause_effect`: Two brands that could not see each other. → Ingrid's inventory of what every brand knew. |\n| p08 | evidence | About 80 million accounts sat in three stores while about 11 million people held accounts on two or more brands, and in June 2027 Veldmark approved Veldmark ID. | statistic: About 80 million consumer accounts in three identity stores; about 11 million people on two or more brands by verified e-mail match; Veldmark ID approved June 2027, one login with brand-specific profiles, rolling out in 2028. | `conclusion_summary`: The table. → What it adds up to and the decision it led to. |\n| p09 | transition | Approving a login was the easy part; the forum's harder questions were what 'verified' means, which actions need which level, who keeps the evidence, and whether a sold brand's users can leave with it. |  | `contrast`: The approved login. → The questions the rest of the chapter answers, including the 2030 sale of Hearthly. |\n\n### Concepts: Identity, Authentication and Business Verification\n\n**Controlling idea** (`definition`, id `concepts`): Identity is not one ladder but separate claims on three axes, from which levels are derived and badges are promised.\n\n**Advances the thesis** (S1): Defines the vocabulary (account versus identity, three axes, levels, the business ladder, KYB, badges) the thesis is stated in.\n\n**Transition in:** `problem_solution`: The forum's question of what 'verified' means. → Definitions that separate what the tick merged.\n\n**Order of paragraphs** (`prerequisite_order`): Words first, then the axes they sit on, then levels built from the axes, then the business ladder and KYB beside them, then badges as what is shown of the levels; each step uses the one before.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | definition | Identity discussions go wrong when one word stands for several things, so the book fixes five terms: identity, account, profile, seller account and claim. | table: Five terms with meaning and a Veldmark example (Femke; her Veldmark ID account; 'Femke R.' on Tradeyard; Autohaus Ruhrblick with nine staff users; Femke's phone claim and Ruhrblick's trade-register claim). |  |\n| p11 | explanation | The account-identity distinction matters most, because one person can hold many accounts and one account can be shared. |  | `emphasis`: The five terms. → Which distinction matters most and why. |\n| p12 | definition | NIST SP 800-63-4 gives the clearest vocabulary by separating identity assurance from authenticator assurance, a separation that applies to any platform though it binds none. | source: NIST SP 800-63-4, finalized July 2025: identity assurance, authenticator assurance, a third axis for federation. | `elaboration`: Identity as distinct from account. → A reference vocabulary for its axes. |\n| p13 | example | A user can be well proven and weakly authenticated, or the reverse, and a single verification level hides which gap fraud is using. | example: A dealer checked five years ago who logs in with a reused password; an anonymous buyer with a passkey. | `example`: The two assurances. → Users who sit high on one and low on the other. |\n| p14 | definition (list) | For a listing marketplace three axes are enough: proof of person, strength of authentication and proof of business. | figure: Figure 1: one green tick opened into three gauges at different levels. | `conclusion_summary`: The independent assurances. → The three axes the chapter uses. |\n| p15 | definition | An identity level is a named combination of claims, derived and recomputed rather than set, and Veldmark adopted six for natural persons. | table: L0 Anonymous to L5 Payee-verified, each with required claims, what it defeats and what it does not. | `sequence`: The three axes. → Levels combined from claims on them. |\n| p16 | definition | Businesses get a parallel ladder, B1 to B3, because an organization is not a person with more documents. | table: B1 Declared trader, B2 Registered business, B3 Accredited professional, with required claims. | `similarity`: The person ladder. → The business ladder beside it. |\n| p17 | analysis | B1 and B2 map closely to the DSA's trader-traceability duty, so the trader record is a business identity claim set that belongs in the identity service. | source: DSA Art. 30: name, address, phone, e-mail, identification document or electronic identification, payment account, trade-register number, self-certification, best efforts against official databases. | `elaboration`: B1 and B2. → Their legal counterpart and where the record lives. |\n| p18 | definition | KYB names the business-ladder checks and KYC the payment provider's checks; they overlap but have different owners, so Veldmark takes Adyen's verification as a status claim, not its evidence. | quotation: Adyen 'must verify the users in your platform' before payouts and re-verifies when data changes. | `elaboration`: Business checks. → The names KYB and KYC and who owns each. |\n| p19 | claim | A verified badge is a promise to the other side, so it must say what was verified, by which method, and nothing more. | example: 'Identity verified with BankID' versus 'Verified', which a buyer reads as 'safe to pay'. | `sequence`: Levels and claims. → What is shown of them to other users. |\n| p20 | evidence | Attackers value badges too, so a badge on a taken-over account is worse than no badge. | quotation: Fraudsters taking over accounts 'gain check marks, verification'. | `additional_support`: The badge as a promise. → Its value to attackers. |\n\n### Architecture: The Identity Service and Its Neighbors\n\n**Controlling idea** (`description`, id `architecture`): The identity service is a set of components with different owners joined by one contract, the claim record, whose lifecycle decides what every badge may say.\n\n**Advances the thesis** (S2): Turns the vocabulary into components and makes the claim, with method, source, time, expiry and status, the contract every provider writes and every consumer reads.\n\n**Transition in:** `cause_effect`: Claims, levels and badges as concepts. → The service that stores and derives them.\n\n**Order of paragraphs** (`large_to_small`): Components first, then the two boundaries, then the claim record that crosses them, its design rules, the tax exception and its lifecycle.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p21 | description | The identity capability splits into components that change at different speeds and have different owners. | table: Eight components: authentication service, account recovery, verification orchestrator, claim store, level and badge engine, business registry, profile service, consent and privacy service, each with what it owns and does not own. |  |\n| p22 | claim | Two boundaries matter most: risk scoring lives outside identity, and documents live outside the claim store. | figure: Figure 2: Veldmark ID's components, with brand-specific identifiers, provider adapters writing normalized claims and level events to the fraud and trust-and-safety platform. | `emphasis`: The component table. → The two boundaries that matter most. |\n| p23 | definition | The claim's shape, not the login API, is the most important interface, because every adapter writes one and every consumer reads one. | table: Claim record fields: claim_type, subject, method, source, attributes, assurance, verified_at and expires_at, status, each with example and reason. | `elaboration`: The claim store and its boundary with documents. → The claim record itself. |\n| p24 | recommendation | Two design rules follow: policies reference claim types and assurance, never providers, and claims carry only the attributes a policy needs. | source: GDPR Arts. 5(1)(c) and 25: data 'limited to what is necessary', data protection by design.; example: 'Private-landlord rentals in Spain require person.identified at substantial' versus 'requires an Onfido check'. | `cause_effect`: The claim fields. → The rules they imply. |\n| p25 | explanation | Seller tax reporting needs more attributes, which stay in a separate, purpose-bound tax profile rather than in the general claim. |  | `contrast`: Claims hold only what a policy needs. → Seller tax reporting as the exception that tests the minimization rule, and where its data goes. |\n| p26 | process | Claims expire and get revoked, and the lifecycle must model every way they end, because a badge that outlives its claim is a false statement. | example: A reassigned phone number, a dissolved company, a deleted passkey, a provider freezing a seller.; figure: Figure 3: a claim's lifecycle; every transition recomputes level and badges; revocation is a state, not a deletion. | `sequence`: The claim's fields, expires_at and status among them. → How claims end. |\n\n### Authentication and Account Takeover\n\n**Controlling idea** (`explanation`, id `authentication`): Most identity incidents begin at authentication, so a marketplace needs phishing-resistant authenticators, risk-based checks on sensitive actions and a recovery path at least as strong as login.\n\n**Advances the thesis** (S3): Shows how the authentication axis is defended and why recovery and account linking decide its real strength.\n\n**Transition in:** `contrast`: The proofing claims the service stores, which are made once in a while. → Authentication, which happens every day and where most identity incidents begin.\n\n**Order of paragraphs** (`problem_solution`): Authenticators and passkeys first, with Mercari's results and migration and FINN's direction; then risk-based authentication for accounts without strong authenticators; then recovery, the back door that undoes both. Pre-hijacking, the back door specific to linking a group's accounts, is taken up in the group identity section next to Veldmark ID's rules.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p27 | claim | Most identity incidents begin at authentication, so a marketplace needs a small set of authenticators, each with a clear role. | table: Password, e-mail code or link, SMS code, social login, passkey, bank eID, each with role, strength and weakness. |  |\n| p28 | definition | A passkey is a phishing-resistant FIDO credential, and synced passkeys are the realistic target for a marketplace. | quotation: 'An authentication credential based on FIDO standards'; synced or device-bound.; source: NIST accepts syncable authenticators at its middle level, not the highest. | `elaboration`: The passkey row of the table. → What a passkey is and which kind to target. |\n| p29 | evidence | Mercari documents that required passkeys stop large-scale phishing, at a cost in lost users and support load. | case: About 13 million users with a passkey; phishing-resistant accounts; 'large-scale phishing financial damages have been effectively zero' where required; users leave or are locked out. | `example`: Passkeys in principle. → A marketplace that requires them. |\n| p30 | process | Mercari's migration is worth copying because it is gradual: disabling the password is the first step, not the last. | case: Four account states from password or e-mail link to passkey only, with the e-mail link as a bridge. | `elaboration`: Mercari's results. → How it got there. |\n| p31 | evidence | FINN moves in the same direction from a different start: e-mail one-time codes for its shared Vend account (glossed as FINN's parent group) and encouraged two-step authentication after takeovers. | quotation: 'As on other digital platforms', some FINN users have had accounts taken over. | `similarity`: Mercari's migration away from passwords. → FINN's version of it. |\n| p32 | definition | Risk-based authentication protects accounts without strong authenticators by judging each login and sensitive action on session posture and account posture. | source: Mercari's session posture (device, network, client) and account posture (capabilities, verification history, behavior), weighted per decision. | `contrast`: Strong authenticators protect the accounts that use them. → Protection for the rest. |\n| p33 | description | For a listing marketplace the sensitive actions are predictable, and each deserves its own policy. | table: New-device login, change of contact or password, change of payout account, rapid publishing, messages with links, enabling a badge in a new brand, each with why attackers want it and the control. | `elaboration`: Risk judged per sensitive action. → Which actions those are. |\n| p34 | claim | Recovery is the back door attackers use, so a weak recovery path cancels a strong login. |  | `contrast`: Controls on login and sensitive actions. → The flow that bypasses them. |\n| p35 | evidence | Mercari's strict recovery rule shows the general principle: recovery requires at least the assurance the account had and returns the account in a cautious state. | quotation: Recovery through My Number Card or document and selfie; 'We do not restore passwords.' | `example`: The weak back door. → A strict documented rule and the principle it carries. |\n\n### Proofing People: Methods and Their Trade-offs\n\n**Controlling idea** (`comparison`, id `proofing`): Proofing methods differ by country, cost and assurance, and the EU wallet is an option rather than an obligation, so the verification orchestrator must be pluggable by country and method.\n\n**Advances the thesis** (S4): Shows how the L4 claim is obtained and why the claim contract, not a vendor, is what policies rely on.\n\n**Transition in:** `sequence`: The authentication axis. → The proof-of-person axis and how L4 is reached.\n\n**Order of paragraphs** (`comparison`): The methods side by side, then FINN's bank eID in use and what to copy from it, then the EU wallet's timetable and its actual obligations, then the architectural conclusion drawn from all of them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p37 | comparison | When a policy asks for L4, the orchestrator chooses a method by country, cost, user experience and the attribute needed. | table: Bank-based eID, EU Digital Identity Wallet, document plus liveness, payment-instrument name match, phone carrier lookup: how each works, assurance, coverage, cost and friction. |  |\n| p38 | evidence | FINN is the clearest documented case of a bank eID used for marketplace trust: a BankID badge, one verified user per person, required only in some categories, and not for businesses. | quotation: 'People with this symbol are experienced as safer to trade with'; chosen display name; one FINN user per BankID; required to contact advertisers in some categories; business advertisers need not verify. | `example`: The bank-eID row. → A marketplace that uses it. |\n| p39 | analysis (list) | Four design choices in FINN's description are worth copying: verified but pseudonymous, one verified account per person, required only where risk concentrates, and a different track for businesses. |  | `cause_effect`: FINN's description. → The design lessons drawn from it. |\n| p40 | evidence | The EU Digital Identity Wallet will change the method mix on a slower and narrower path than its publicity suggests: wallets are due by the end of 2026 and relying-party registration applies from 24 December 2026. | source: Regulation (EU) 2024/1183 Art. 5a (24 months after implementing acts); first acts published 4 December 2024; Commission statement; Implementing Regulation 2025/848 applying from 24 December 2026. | `contrast`: Bank eIDs that work in their own country. → The EU-wide wallet and its timetable. |\n| p41 | analysis | The wallet's acceptance obligations for private companies are narrow, so for most marketplaces it is an option to adopt, not an obligation, and a good one for B-ladder and L4 checks. | source: Art. 5f: private relying parties must accept only where law or contract requires strong user authentication, from 36 months; small and micro enterprises exempt; very large online platforms must accept it; none of the classifieds, real-estate or automotive marketplaces designated as of October 2026; DSA Art. 30(1)(b) allows electronic identification. | `elaboration`: The wallet's arrival. → What it obliges a marketplace to do. |\n| p42 | recommendation | The architectural conclusion is that the verification orchestrator must be pluggable by country and method, with every adapter writing the same claim. |  | `conclusion_summary`: Methods that differ by country and change every year. → The design that absorbs the change. |\n\n### In Practice: The Group Identity Question\n\n**Controlling idea** (`example`, id `in-practice`): A group identity is a bet on the group's shape, so Veldmark ID shares one account across brands but is designed to be cut, and links existing accounts only after proof of control.\n\n**Advances the thesis** (S6): Answers the group question with the public Schibsted/Vend case, Veldmark ID's five rules and chosen option, and the rule that accounts are linked only after proof of control.\n\n**Transition in:** `cause_effect`: Claims, levels, authentication and proofing as parts a group could share. → Whether and how a group shares them, and the policies built on them.\n\n**Order of paragraphs** (`small_to_large`): The public case first (Schibsted's split and Vend), then its lesson, then Veldmark's rules and the option they select, then the pre-hijacking risk of linking the brands' existing accounts into the chosen design; the rules need the lesson, the option table needs the rules, and the linking risk needs the shared account it attacks.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p43 | evidence | Schibsted's shared account shows what users feel when a group splits: two accounts, per-company privacy choices and a new web address. | case: Schibsted account as 'the shared login solution for all Schibsted services'; after the split into Schibsted Media and Schibsted Marketplaces, users of both got two accounts, privacy choices per company, and password managers stopped recognizing the marketplace login. |  |\n| p44 | evidence | Schibsted Marketplaces is now Vend, whose account is a shared login and payment solution across its services. | source: Vend account for FINN.no, Helthjem and Morgenlevering. | `time`: The separation. → What followed it. |\n| p45 | analysis | The lesson is not that shared identity is wrong but that a group identity is a bet on the group's shape, which has to be cut along new lines when owners change. | reasoning: Labeled inference callout: the shared identity plausibly carried data and consents for two businesses in one store, and separating them required a controller decision per user and data item; case-adevinta makes the same point about shared platforms. | `conclusion_summary`: The Schibsted and Vend facts. → The lesson for a group architect. |\n| p46 | recommendation (list) | Because a private-equity owner may sell any brand, Veldmark ID was designed to be cut, under five rules the forum adopted in June 2027. | scenario: One account with brand profiles; pairwise identifiers; controller per brand, processor for the group; separable by export; Keybridge staying outside (March 2027 commitment). | `cause_effect`: A group identity as a bet on the group's shape. → Veldmark's design for a shape that may change. |\n| p47 | comparison | Of four group identity options, Veldmark chose shared identity with brand profiles and pairwise identifiers, passing through a federation broker for Hearthly.es. | table: Per-brand identity, shared identity and profile, shared identity with brand profiles and pairwise IDs, federation broker: what users see, gains, costs, when right.; figure: Figure 4: one account hub with brand profiles on dashed cut lines. | `elaboration`: The five rules. → The options they were chosen against and the migration path. |\n| p36 | evidence | Linking the brands' accounts into Veldmark ID, like any group identity program, opens a second back door after recovery, pre-hijacking, so accounts should be linked across brands only after the user proves control of both. | source: At least 35 of 75 popular services vulnerable to one or more of five pre-hijacking variants. | `additional_support`: Veldmark ID's design and recovery, the first back door, from the authentication section. → The second back door, specific to linking accounts in a group program. |\n\n### In Practice: Levels at the Moment of Risk\n\n**Controlling idea** (`example`, id `levels-in-practice`): Veldmark's first policies on the level model ask for a level at the moment of risk, with its cost estimated, make business claims expire, and replayed on the March incident would have kept the link from Femke.\n\n**Advances the thesis** (S5): Applies levels at moments of risk: a costed landlord rule, continuous KYB, and the opening incident replayed.\n\n**Transition in:** `sequence`: Veldmark ID and its level model. → The first policies built on the level model.\n\n**Order of paragraphs** (`order_of_importance`): The Barcelona landlord rule first, because it is the first policy built on the person levels and the one with a costed decision; then Motorvane's business-ladder equivalent; the opening incident is replayed last because it needs every earlier piece. Putting these policies before Veldmark ID would require levels from a group service the reader has not seen designed.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p48 | example | The first policy built on the level model came from the Barcelona ring, none of whose 26 accounts had proved more than an e-mail address. | scenario: July 2027: 26 accounts, 180 fake rentals in Eixample, prices about 35% below market, 63 people losing about €71,000; Hearthly Spain asked private landlords for nothing more than e-mail. |  |\n| p49 | evidence | The proposed policy required L4 for private landlords publishing rentals in Spain, and the forum priced it at about €115,000 a year and 8–12% honest drop-out against about €71,000 lost in one ring. | table: About 5,200 private-landlord rental listings a week, about 1,900 by landlords not at L4, about 1,600 verifications a week at about €1.40, about €115,000 a year, 8–12% drop-out, about €71,000 lost in one ring; labeled as Veldmark's planning estimates. | `problem_solution`: An action with no identity requirement. → A level required at that action, and its cost. |\n| p50 | analysis | The forum approved the policy with measurement and a fallback path, and it made each fake landlord cost a real, checkable identity rather than stopping fraud. | scenario: Approved September 2027; weekly drop-out against a control region; partner-agency path; live Q4 2027. | `time`: The estimate. → The decision and what it achieved. |\n| p51 | example | Motorvane's one-time dealer checks had gone stale: a June 2027 re-check found 212 dealer accounts with deleted register entries or invalid VAT numbers, 37 with live listings. | scenario: 21,400 dealers checked once at signature; pilot against the German trade register and VIES; 212 failing, 37 with live listings. | `similarity`: A level policy for private landlords. → The business ladder's equivalent gap at Motorvane, opened by 'The business ladder had its own gap.' |\n| p52 | recommendation | The fix was to make business claims expire and re-check them continuously, which is also how a platform notices what the DSA asks it to correct. | scenario: Re-check every 90 days; L4 re-verification when a dealer's administrator changes; a BusinessClaimRevoked event suspends publication.; source: DSA Art. 30(3): ask for correction and, failing that, swiftly suspend the trader's offers. | `problem_solution`: Stale business checks. → Expiring business claims. |\n| p53 | example | Replayed under Veldmark ID's level policy, the March scammer's account would still be L2, but its link would be held for a risk check and never reach Femke. | scenario: An L2 account younger than 30 days sending a link outside the allow list has the message held and the link rendered as text; the domain registered that day fails. | `sequence`: Policies built on the level model. → The opening incident replayed under them. |\n| p54 | example | Femke's own account shows what a badge should say: a payee.verified claim from Adyen shown as 'Payouts verified by our payment partner', not 'Verified'. | scenario: Safe Deal sale on 8 March; Adyen had verified Femke as a payee; in 2027 the fact lived only in Adyen and a Safe Deal table. | `contrast`: The scammer's account. → Femke's own account and its badge. |\n\n### Trade-offs\n\n**Controlling idea** (`comparison`, id `trade-offs`): Identity by action is the default for marketplaces, and the group builds its trust vocabulary while buying the commodity checks.\n\n**Advances the thesis** (S5, S2): Compares when to ask for identity and what to build, buy or federate.\n\n**Transition in:** `conclusion_summary`: The design and its Veldmark applications. → The choices it rests on, set against their alternatives.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p55 | comparison | Set against their alternatives, the chapter's choices trade conversion, fraud resistance and ownership: the tables that follow show identity by action as the default, with incentives as a complement, and the claim store, levels, badges and business registry as the parts a group must build. | table: When to ask for identity: at registration, by action, by incentive, or no identity beyond e-mail, compared on conversion, fraud resistance, data held and when right.; table: Build, buy or federate per capability: authentication, passkeys, document checks, eID and wallet adapters, claim store, levels and badges, business registry. |  |\n\n### Vertical Differences\n\n**Controlling idea** (`comparison`, id `verticals`): Identity risk, checks and badges differ by vertical, and on a rental portal identity matters for the person receiving sensitive data as much as for the one posting.\n\n**Advances the thesis** (S5): Shows where the levels sit in each vertical.\n\n**Transition in:** `contrast`: The general trade-offs. → How they differ by vertical, stated in the first sentence after the vertical table, which also announces real estate's risk in the other direction.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p56 | example | On a rental portal identity risk runs in both directions, so Hearthly's tenant application files carry their own access rules. | table: General classifieds, real estate, automotive and jobs: who lists (78%, 84%, 91% at Veldmark's brands), main identity risk, key check, badges buyers understand, sensitive data on the other side.; scenario: Tenant shares a file with a specific listing; the agency sees it for a limited time; every view logged. |  |\n\n### Failure Modes\n\n**Controlling idea** (`counterargument`, id `failure-modes`): The common failures each break one rule of the model: unscoped badges, badges that outlive claims, SMS as proof of person, weak recovery, merging by e-mail, scattered evidence, unmeasured verification and vendor lock-in.\n\n**Advances the thesis** (S1, S2, S3): Names the failures the claim model, recovery rule and claim contract prevent.\n\n**Transition in:** `contrast`: The design and its trade-offs. → How identity systems fail in practice.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p57 | counterargument (list) | Eight failure modes recur, from 'verified' meaning five things to vendor lock-in through the data model. | example: The March 2027 scammer as the SMS-as-proof case; pre-hijacking for merging by e-mail; GDPR minimization for scattered evidence. |  |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `ca-view`): The Chief Architect owns the identity vocabulary centrally, runs identity as tier-zero infrastructure, makes separability and verification cost explicit, watches four numbers and keeps the EU wallet off the critical path.\n\n**Advances the thesis** (S5, S6): Turns the thesis into decisions the Chief Architect owns.\n\n**Transition in:** `cause_effect`: The failures. → The decisions that prevent them.\n\n**Order of paragraphs** (`order_of_importance`): Ownership of the vocabulary first, because every other decision uses it; then reliability, separability and cost, which follow from treating identity as group platform; then the numbers that test it, and last the wallet, the one item to keep off the plan's critical path.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p58 | recommendation | Decide the vocabulary centrally and the thresholds locally. | scenario: A bike market in Rotterdam and a rental market in Barcelona; Aisha's team proposes, product owns friction, Lucía signs off data. |  |\n| p59 | recommendation | Treat identity as tier-zero infrastructure, because when Veldmark ID is down nobody can log in to any brand. |  | `cause_effect`: A central vocabulary in one service. → The reliability that service needs. |\n| p60 | recommendation | Make separability a requirement, with an answer to the cost of selling a brand measured in weeks. |  | `additional_support`: A shared service every brand depends on. → The requirement that it can be cut. |\n| p61 | recommendation | Budget for verification as a variable cost in each policy's business case. |  | `additional_support`: Costs to state up front. → The per-use cost of verification. |\n| p62 | recommendation | Watch four numbers, and if fraud does not fall as levels rise, the levels measure the wrong thing. |  | `sequence`: Policies with stated costs. → The numbers that show whether they work. |\n| p63 | recommendation | Keep the EU Digital Identity Wallet on the roadmap, not on the critical path. |  | `sequence`: Decisions for now. → The one to defer. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Ten questions test an identity design against the chapter's rules.\n\n**Advances the thesis** (S1, S3, S5, S6): Lets a reader test their own system against each part of the thesis.\n\n**Transition in:** `cause_effect`: The Chief Architect's decisions. → Questions that test whether a design meets them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p64 | recommendation (list) | Ten questions cover badges, levels and their approval, derived levels, recovery assurance, phishable accounts, evidence storage, vendor change, cross-brand linking, business re-checks and a brand sale. |  |  |\n\n## Conclusion: From Identity to Obligation\n\n**Synthesis:** The two facts of the opening are one failure seen twice: Veldmark had no record of what it knew about a person, only a tick in one brand and nothing across brands. Claims with method, source and expiry give that record; levels required at moments of risk spend it where fraud concentrates; recovery and careful linking keep it attached to the right person; and one group service that can be cut lets every brand use it. Together they answer the chapter's question: a marketplace should know as much as the user's next action needs, and be able to say exactly what it knows, how and until when.\n\n**So what:** What a marketplace knows about a user is a statement others rely on: a buyer reads the badge, a regulator reads the trader record and an owner reads the cost of selling a brand, so a vague 'verified' fails all three.\n\n**Callback:** The opening scene: the scammer's green tick for a phone number and the same number's unseen Motorvane account. The reader now sees the tick as one L2 claim shown as identity, and the unseen account as the absence of one identity service, and can say what replaces both.\n\n**Takeaway** (`broader_implications`): Much of what the chapter built (the trader record, the business registry, the evidence trail and the minimization rules) exists because the law now asks marketplaces to know their traders and explain their decisions; marketplace-regulation turns those rules into system requirements.\n\n**Hand-off** to [Rules of the Marketplace: DSA, DAC7 and Vertical Regulation](marketplace-regulation.html): `elaboration`: Identity-and-verification's trader record, business registry, evidence trail and minimization rules, which it built partly because the law now asks marketplaces to know their traders and explain their decisions. → Those laws themselves: the DSA, DAC7, ranking and consumer transparency and vertical rules, turned into system requirements served by five shared components.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p65 | synthesis | The scammer's green tick and the unseen Motorvane account were one failure, no record of what Veldmark knew about a person, and the chapter's parts together replace it, so a marketplace knows as much as the next action needs and can say what, how and until when. | reasoning: Claims give the record; levels at moments of risk spend it; recovery and linking keep it attached; one separable group service shares it. |  |\n| p66 | cause_effect | What a marketplace knows about a user is a statement others rely on, a buyer through the badge, a regulator through the trader record and an owner through the cost of a sale, so a vague 'verified' fails all three. |  | `cause_effect`: A record that says what is known, how and until when. → Who relies on that record. |\n| p67 | transition | Much of what the chapter built exists because the law now asks marketplaces to know their traders and explain their decisions, which marketplace-regulation turns into system requirements. |  | `elaboration`: The regulator as one reader of the record. → The laws themselves and the next chapter. |\n\n## Non-goals\n\n- The seller account model, organizations, branches and trader status. See [Private Sellers, Dealers and Agencies: Modeling Who Lists](sellers-and-accounts.html).\n- Risk scoring, fraud signals and step-up friction as fraud controls. See [Scams, Fakes and Account Takeovers: Fraud Prevention for Listings](fraud-prevention.html).\n- The legal detail of DSA trader traceability, DAC7 and other regulation. See [Rules of the Marketplace: DSA, DAC7 and Vertical Regulation](marketplace-regulation.html).\n- Message-level safety controls. See [From Interest to Contact: Messaging and Lead Management](messaging-and-leads.html).\n- Payment KYC internals of PSPs. See [Beyond the Contact: Payments, Shipping and Buyer Protection](transactions-and-payments.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- EUDI Wallet relying-party fees and per-country availability in Veldmark's markets are not yet known (as of October 2026); revisit when wallets launch. (Carried over from spec.md.)\n- The exact date of the Art. 5f(2) private-relying-party obligation is inferred from the implementing acts' entry into force; confirm when the Commission publishes guidance. (Carried over from spec.md.)\n- Whether Spain's or France's national eID schemes can serve Hearthly's L4 checks at acceptable cost was not researched. (Carried over from spec.md.)\n\n## Decision log\n\n- **2026-10-19** — Modeled identity as claims with derived levels instead of a single verification flag, because the documented failure (a phone-verified scammer shown with a tick) comes from conflating claims. (Carried over from spec.md.)\n- **2026-10-19** — Used FINN (BankID badge, Vend account, Schibsted account separation) and Mercari (passkeys, recovery) as the documented cases, because they are first-party, dated and current. (Carried over from spec.md.) Rejected: tionale now says what breaks if proofing precedes authentication; Vend glossed at its first use in p31. Not taken (open_questions): renaming or splitting the in-practice section, merging Failure Modes with Questions to Ask. Rejected: Swapping Barcelona and Motorvane to make the section chronological, which would put the business ladder's example before the first policy built on the person levels.\n- **2026-11-12** — After draft-check round 1 (escalate on one spec fault): p31 no longer requires a gloss of Vend as the renamed Schibsted Marketplaces, which forced a forward reference; it now glosses the Vend account as the login FINN shares with its sister services. The in-practice section's transition is a sentence opening p43, not a separate paragraph, so the published units stay as they are. The verticals transition is carried by the first sentence after the vertical table. The Trade-offs paragraph p55 moved from after the two tables to before them, so it can carry the section's transition. p03 now names the public evidence (AC-2). Rejected: Adding a transitional paragraph as a new unit before Schibsted, which would add a unit the published text does not have.; Dropping the Vend account mention, which is a published, linked fact.\n- **2026-11-12** — After draft-check round 2 (escalate on a spec fault: the in-practice heading named only the group question while half its units were level policies, reported by both flow readers and by the flow rubric): split the section, adding the H2 'In Practice: Levels at the Moment of Risk' before the Barcelona subsection, with p48 to p54 moved unchanged in order. The authentication section's transition is declared as the contrast the prose makes (proofing once in a while, authentication every day) and p51's similarity is now expressed by an opening sentence. Rejected: Renaming the published heading 'In Practice: The Group Identity Question'.; Leaving the heading and waiving the corroborated finding, which only the author may do.\n- **2026-11-12** — Accepted under the author's delegation, 2026-11-12: the H2 'In Practice: Levels at the Moment of Risk', which splits the level policies (Barcelona, Motorvane, Femke replayed) from 'In Practice: The Group Identity Question'. No published heading was changed or removed.\n- **2026-11-12** — Under the author's delegation, 2026-11-12 (spec-fault order finding corroborated by both round-3 flow readers): the subsection 'Linking accounts: the second back door' (p36) moved from the end of the authentication section to the end of the group identity section, after Veldmark ID's rules, option table and Figure 4. Its opening now names recovery as the first back door and linking the brands' accounts as the second; the post, authentication and group-section flow rationales and the group section's controlling idea were updated. No fact, citation or link was cut. The AC-2 expected answer needs no change (it names authentication and takeover, and the group question, both still true). Rejected: Leaving pre-hijacking under Authentication, where both readers found it anticipated the group question.\n- **2026-11-12** — Under the author's delegation, 2026-11-12 (DAC7 paragraph p25 interrupting the claim-contract argument, fault unclear, corroborated): kept in place with every fact, and its opening now ties it to the argument as the exception that tests the minimization rule; its closing says the general claim stays minimal. Rejected: Reducing p25 to a one-sentence pointer to marketplace-regulation, which would cut published facts.\n- **2026-11-12** — Under the author's delegation, 2026-11-12 (rule 2): length.max_words raised from 7,977 to 8,100 (+1.5%) so the Architecture section can open with a sentence tying the service to claims, levels and badges (its declared cause_effect transition), and the minor fixes below fit.\n- **2026-11-12** — Minor fixes under the author's delegation, 2026-11-12: the claim-lifecycle subsection now states in the prose that every status change recomputes level and badges (was only in the Figure 3 caption); failure 1 '\"Verified\" means five things' now lists five meanings, all from the scene's brand table (phone, e-mail, ID check, dealer contract, VAT number checked once); 'L4 methods come later' became a sentence saying where they are compared; the failure-modes lead says each failure breaks 'a rule or a condition set above' (failure 7 breaks the Barcelona measurement condition); the options table's 'Per-brand identity (Veldmark in 2026)' became '(Veldmark before Veldmark ID)', because per-brand logins ran until the 2028 rollout (ledger: identity baseline Mar 2027; Veldmark ID approved Jun 2027, rollout 2028).\n- **2026-11-12** — Under the author's delegation, 2026-11-12 (AC-5, minor): the statement that as of October 2026 no classifieds, real-estate or automotive marketplace is designated a very large online platform is kept as published, without a new link; no new statement about a real company or law was added.\n- **2026-11-12** — Under the author's delegation, 2026-11-12 (rule 8): Failure Modes and Questions to Ask stay as two published sections (not merged); 'taken-over account' in p20 stays before the authentication section, judged intuitive. Modalities stay empty: spec.md's unchecked modality boxes had no files behind them (accepted).\n- **2026-11-12** — Recorded, 2026-11-12: draft check ended ESCALATE at round 3 (20 pass, 16 fail); cheap fixes applied after it (group-section opener names 'these parts', duplicated vertical sentence cut, 'those decisions' before the questions, DMS glossed, two referents fixed, scene-table lead-in) are kept, and round 4 re-checks the draft.\n\n## Sources\n\n- **Internal**\n  - trust-and-safety-architecture — The March 2027 phishing incident and the cross-brand phone number.\n  - fraud-prevention — The Barcelona fake-rental ring and step-up friction.\n  - sellers-and-accounts — Seller accounts, organizations and the business party registry.\n  - marketplace-regulation — Where the legal detail of trader traceability and DAC7 lives.\n  - case-adevinta — The separability lesson about shared platforms.\n  - _journals/listing-systems-architecture/_research/scenario-ledger.md — Veldmark's identity baseline, Veldmark ID rules, the Hearthly ES landlord rule and Motorvane continuous KYB.\n- **External**\n  - Mercari Engineering (Tatsuya Karino), July 2026 — Passkeys, risk-based authentication, recovery.\n  - FINN help center, 2024–2026 — BankID verification, two-step authentication, Schibsted/Vend account separation.\n  - Regulation (EU) 2022/2065 Art. 30; Regulation (EU) 2024/1183 Arts. 5a and 5f; Implementing Regulations (EU) 2024/2979 and 2025/848; GDPR Arts. 5 and 25 — Trader traceability, wallet provision and acceptance, relying-party registration, minimization.\n  - NIST SP 800-63-4 (2025); FIDO Alliance passkeys; Sudhodanan and Paverd (2022); Adyen platform verification documentation; Integrity Institute for Ofcom (2026) — Assurance axes, passkeys, pre-hijacking, payee KYC, badges as a takeover prize.\n\n## Changelog\n\n- **2026-11-12** — Resolved the round-3 escalations under the author's delegation: pre-hijacking subsection moved into the group identity section; Architecture opening sentence; DAC7 paragraph tied to the minimization rule; minor fixes; max_words 8,100. (AI-mediated session)\n- **2026-11-12** — Draft-check round 3 (escalate, budget spent): cheap close-out fixes to index.md as listed in open_questions; check report stale. (AI-mediated session)\n- **2026-11-12** — Draft-check round 2 (escalate, one spec fault): new section levels-in-practice split from in-practice; authentication and p51 transitions revised; p31 and p36 ideas updated; index.md revised for Vend and SMS-pumping glosses, the pre-hijacking tie to Veldmark ID, the vertical table sentence and the Motorvane opening, offset by trimming this pass's own added sentences. (AI-mediated session)\n- **2026-11-12** — Draft-check round 1 (escalate, one spec fault)
