<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, the three journal acceptance criteria, the thesis and the role are copied unchanged from the fraud-prevention entry in journal-spec.json. Two units are added to the published text: a roadmap paragraph in the introduction (p04, for AC-2) and a synthesis paragraph before the hand-off (p58).\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The classifieds threat model: authorized push payment fraud that is set up on the platform and closes off it, a fraud typology with dated public evidence, and a signal taxonomy judged by availability, cost of evasion and cost to genuine users.\n- **Know:** The risk scoring service: real-time and streaming paths, a feature store only when real-time behavioral features need one, rules and models with a backtest-shadow-rollout lifecycle, the identity graph and actor-level scoring.\n- **Know:** Step-up friction and its cost model, message-level fraud controls, late and biased labels, adversarial adaptation, and collaboration with banks and police.\n- **Believe:** A fake listing looks plausible one at a time; the fraud is visible when listings, accounts, devices, payment accounts and photos are linked and scored together.\n- **Believe:** Blocking everything suspicious costs liquidity; friction in proportion to risk, at a threshold chosen by cost, costs genuine users little and fraudsters a lot.\n- **Be able to:** Design a risk scoring service that insertion, messaging, login and payout call, with actor-level scoring and a rule lifecycle.\n- **Be able to:** Choose a friction threshold from an explicit cost model and name who owns each input.\n- **Be able to:** Say which components would have turned the Barcelona ring's day-one signals into day-one action.\n\n**Audience:** Heads of trust and safety, fraud and data science leads, principal engineers on insertion, messaging and identity, and chief architects deciding what to share across brands.\n\n**Already knows:**\n\n- APIs, databases, event streams, search engines and Kubernetes; ML and streaming basics.\n- From earlier chapters: the failure patterns, the publication pipeline, entity resolution and multi-agency duplicates, perceptual hashing as a media capability, attribute schemas, Veldmark's brands, cast and the 7 March 2027 phishing incident.\n- From trust-and-safety-architecture: the five functions, the decision service and decision record, enforcement propagation, the evidence store, random-sample prevalence measurement and statements of reasons.\n\n**Does not yet know:**\n\n- Authorized push payment (APP) fraud and money mules.\n- Perceptual hashing limits, the identity graph as a fraud structure, actor-level scoring.\n- Friction economics: choosing a threshold from a cost model.\n- Point-in-time correctness of features and the backtest-shadow-rollout rule lifecycle.\n- Verification of Payee.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given the first evening of a fake-rental ring, the reader names what should happen and when. *Probe:* A new account posts a flat at 35% below comparable rents with a photo that matches another agency's listing; that evening two more new accounts on the same device post similar flats. Your photo matches go to a 'possible duplicates' queue and price anomalies to a separate low-priority queue. Using only this chapter: what should happen, and when? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-4 | Given a friction's illustrative inputs, the reader picks the cost-minimizing threshold and says who owns each input. *Probe:* Your marketplace is choosing the score threshold above which new accounts must verify a phone number. Using only this chapter: how should the threshold be chosen, which inputs does that need, and who should own or measure each input? | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** How do marketplaces detect and stop fraud, from fake listings to payment scams?\n\n> **Claim:** Because classifieds fraud is mostly authorized push payment fraud that closes off the platform, by bank transfer after a conversation, a marketplace should stop it at the setup: one risk scoring service, called by insertion, messaging, login and payout within the latency of the action, combines weak signals (reused photos, prices far below market, new accounts, shared devices and IBANs) and scores actors linked in an identity graph as well as items; combined rules are backtested and shadowed before rollout; risk is answered with step-up friction at the threshold an explicit cost model chooses, with the cost of a lost genuine user owned by the general manager; links and payment requests in messages are checked before delivery; and labels from victims, banks, reviewers and appeals reach the models within days.\n\n**Disputed by:** The view that classifieds fraud is the payment provider's and the bank's problem, or that the answer is a better classifier judging each listing on its own, with suspicious items blocked outright and fraud queues worked in the order reports arrive.\n\n**So what:** A Chief Architect who accepts this builds one risk scoring service with a contract for every caller instead of scoring in each team, puts the identity graph and its cross-brand data flows under the Data Protection Officer's approval, buys signals but owns decisions and labels, has general managers own the cost of a lost genuine user, and tracks time from first fraudulent listing to cluster takedown in hours rather than days.\n\n**How and why:** The Barcelona ring's signals existed on day one: photo matches to unrelated sellers were queued as possible duplicates, prices about 35% below market sat in a separate low-priority queue, and the 26 accounts looked unrelated, so 180 fake rentals ran from 1 to 13 July 2027 and 63 people lost about €71,000, most of it paid between 5 and 12 July. A rule combining a photo match with an unrelated seller, rent at least 25% below the district estimate, an account younger than 30 days and a lister that is not a verified agency stopped the ring in an afternoon, twelve days in. Tradeyard's first-contact friction shows the threshold arithmetic: a message-risk threshold of 0.5 gave a weekly cost of about €171,500 against €360,000 with no friction, lower than both the stricter 0.7 and the looser 0.3.\n\n**Supporting claims**\n\n- **F1** — Classifieds fraud is mostly authorized push payment fraud set up on the platform and closed off it by bank transfer, so the controls that work act before the payment: on who lists, what messages carry and how the money side is reached through banks.\n- **F2** — Signals that are weak on their own (reused photos, prices far below market, new accounts, shared devices and IBANs) become decisive when combined, and a photo match between unrelated sellers is a fraud signal, not a duplicate.\n- **F3** — One risk scoring service, called by insertion, messaging, login and payout within the latency of the action, reads precomputed features and scores actors linked in an identity graph as well as items.\n- **F4** — Rules give the fast response and models the durable one; both are backtested and shadowed before rollout, and labels from reviewers, victims, banks and appeals must reach them within days because organized fraud adapts within days.\n- **F5** — Risk is answered with step-up friction rather than blocks, at a threshold an explicit cost model chooses, with the cost of a lost genuine user owned by the business.\n- **F6** — A group shares the scoring service, identity graph, hashed block lists and label store within data-protection limits, buys signals and owns decisions and labels, and measures time to cluster takedown in hours.\n\n## Role in the part\n\nFills the platform's detection slot with the most demanding detector, risk scoring of actors against adaptive adversaries, and makes the case for scoring and labels shared across brands. Supports P5-3, P5-2 of part `part-5`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `large_to_small` in threat model, vertical differences, signals and architecture: the whole threat and how it varies by vertical, then the signals, then the service that combines them; `grouping` in trade-offs to questions: the book's reference sections)\n\nThe Barcelona scene poses the problem: signals on day one, action on day twelve. The threat model says why controls sit before the payment, vertical differences show how the threat and where the money moves vary by vertical, and the signals section names what the controls can observe; the risk scoring service then combines those signals, so it must follow them. Friction and messaging controls say what to do with a score, labels and bank collaboration keep the scores current, and only then can Barcelona be answered component by component. The reference sections test and govern the design. Putting the architecture before the signals would leave the service combining things the reader has not met; putting Barcelona's answer earlier would leave half its table unexplained.\n\n## Introduction\n\n**Hook** (`direct_statement`): A listing marketplace is a machine for getting strangers to trust each other enough to meet, call or pay. Fraud exploits exactly that.\n\n**Bridge:** Trust-and-safety-architecture's platform, which left detection as a slot that detectors plug into, and the adversaries who study the platform and adapt within days. → Fraud that borrows the platform's trust, moves the victim off the platform to pay, and has to be caught at the setup.\n\n**Thesis statement** (KEY POINTS callout (all three bullets); paragraphs p01 and p02 state that the scam is set up on the platform and must be caught there.): Classifieds fraud is set up on the platform and closes off it, so it is stopped before the payment by one risk scoring service that combines weak signals and scores actors linked in a graph, answers risk with friction at a cost-chosen threshold, checks messages before delivery and learns from labels within days.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p04, which names the sections in order.):\n\n- The Barcelona fake-rental ring. *Kept in:* scene.\n- The threat model, how it differs by vertical, and the signals that expose fraud. *Kept in:* threat-model, verticals, signals.\n- The risk scoring service. *Kept in:* architecture.\n- Step-up friction and fraud controls in messaging. *Kept in:* friction, messaging.\n- Feedback loops and labels, and collaboration with banks and police. *Kept in:* labels, banks.\n- The return to Barcelona. *Kept in:* back-to-barcelona.\n- Trade-offs, failure modes, the Chief Architect's view and questions. *Kept in:* trade-offs, failure-modes, chief-architect, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A listing marketplace gets strangers to trust each other enough to meet, call or pay, and fraud borrows that trust to start a conversation and then moves the victim somewhere the platform cannot see, so most of the loss happens off the platform although the scam is set up on it. |  |  |\n| p02 | definition | The chapter is about catching the setup, and it owns three terms: a fraud signal (an observable property that changes the probability of fraud), a risk score (a calibrated estimate of that probability for one action) and step-up friction (an extra check in proportion to risk that genuine users pass and fraudsters do not). |  | `elaboration`: The scam is set up on the platform and closes off it. → Catching the setup, and the three terms the chapter owns for doing so. |\n| p03 | context | Trust-and-safety-architecture built the decision service and left detection as a slot; this chapter fills it with the most demanding detector, aimed at people who study the platform and adapt within days, hands its strongest friction to identity-and-verification, leaves payment-side fraud to transactions-and-payments in Part VI, and uses the fictional Veldmark as its running example. |  | `problem_solution`: The three terms the chapter owns. → Where the chapter sits in Part V: the slot the previous chapter left for detection, the adversary this detector faces, and what neighbouring chapters own. |\n| p04 | transition | The chapter opens with the Barcelona ring, then sets out the threat model and how it differs by vertical, the signals, the risk scoring service, step-up friction, fraud controls in messaging, feedback loops and labels, and collaboration with banks and police, returns to Barcelona, and closes with trade-offs, failure modes, the Chief Architect's view and questions, on public evidence and the fictional Veldmark. | reasoning: The chapter's sections in order and the kinds of evidence (UK Finance, OLX, Which?, Meta, Stripe and Airbnb public sources; the fictional Veldmark). | `sequence`: The chapter's place in Part V and its running example. → The order in which the chapter answers its question and the kinds of evidence it uses. |\n\n## Sections\n\n### Setting the Scene at Veldmark: The Barcelona Fake-Rental Ring\n\n**Controlling idea** (`context`, id `scene`): In July 2027 a fake-rental ring on Hearthly Spain ran for twelve days although its signals fired on day one, because nothing turned those signals into one decision; that poses the chapter's question with Veldmark's numbers.\n\n**Advances the thesis** (F2, F3): Shows on one dated case that weak signals existed early and failed only because they were never combined or linked to actors.\n\n**Transition in:** `example`: The setup the chapter will catch, and the order it will go in. → A dated Veldmark case where the setup was visible and was not caught.\n\n**Order of paragraphs** (`chronological`): The ring in the order it happened: the listings, the losses, why the signals failed, the manual takedown, then the question the review asked.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | example | From Thursday 1 July 2027, 26 new accounts on Hearthly Spain published 180 rental listings in Barcelona's Eixample at about 35% below comparable rents, with photos copied from real agencies' listings and a landlord abroad who asked for a deposit by bank transfer. | scenario: First listing Thu 1 July 2027; 26 accounts, 180 listings over twelve days, about 35% below comparable rents; photos copied from live agency listings; landlord abroad, no viewing, deposit by bank transfer. |  |\n| p06 | evidence | By the takedown on Tuesday 13 July, 63 people had lost about €71,000, roughly €1,130 each and mostly one month's rent paid as a deposit, from about 4,700 contacts. | statistic: 63 victims, about €71,000, about €1,130 each, about 4,700 contacts, listings down Tue 13 July. | `time`: The ring's twelve days of listings. → What it cost by the day the listings came down. |\n| p07 | analysis (list) | The detectors did not miss the ring: perceptual-hash matches and rent anomalies fired from day one, and what failed was everything between the signals and a decision, because the signals went to separate queues, reviewers saw listings rather than actors, no identity graph linked the accounts, and the first victim report went to support. | case: Hash index matched the first stolen photos within minutes on 1 July; rent-anomaly check flagged most listings; photo match went to a general 'possible duplicate' queue and the rent anomaly to a low-priority 'price check' queue; 11 photo-match items closed as legitimate duplicates; 26 accounts on five devices and four mule bank accounts, none proving more than an e-mail address; first victim report on Fri 9 July routed to support.; figure: Figure 1: three signals flowing into three walled-off trays with nothing combining them. | `contrast`: The harm the ring caused. → That the signals existed from the first day and the failure lay between signal and decision. |\n| p08 | example | An analyst linked all 26 accounts by hand in an afternoon on 12 July, and a combined rule took everything down by 16:40 on 13 July, while Hearthly Spain, the former Casavista, was not yet on the shared trust-and-safety platform. | case: Analyst noticed on Mon 12 July that three victim reports named photo-flagged listings; combined rule live Tue morning; all 180 listings and accounts down by 16:40; shared platform live for Tradeyard NL and BE in November 2027. Hearthly Spain is the former Casavista, acquired 2025 and rebranded 2026. | `time`: The four gaps between signal and decision. → How the ring was finally stopped, by hand, twelve days in. |\n| p09 | transition | Ingrid's question in the review, what it would have taken to act on day one when the signals were there on day one, is the question the rest of the chapter answers with actor scoring, an identity graph, rules and models, graduated friction and fast feedback loops. |  | `cause_effect`: Signals present from day one, action only on day twelve. → The question the chapter answers and the components of the answer. |\n\n### The Threat Model: What Classifieds Fraud Looks Like\n\n**Controlling idea** (`explanation`, id `threat-model`): Classifieds fraud is mostly authorized push payment fraud that the platform cannot see or reverse, so its controls sit before the payment, and a typology names where each kind of fraud can be stopped.\n\n**Advances the thesis** (F1): Establishes that fraud closes off the platform, which places the controls before the payment.\n\n**Transition in:** `elaboration`: Ingrid's question about acting on day one. → The general threat that Barcelona is one instance of.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): Define the dominant fraud, show its size, draw the consequence for where controls sit, then map the fraud types to those controls.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | definition | Because most classifieds platforms are lead-generation businesses whose payments move elsewhere, the dominant fraud is authorized push payment (APP) fraud, in which the victim willingly sends a bank transfer to someone who is not who they claim to be. |  |  |\n| p11 | evidence | UK Finance's 2026 report shows purchase scams are the most common kind of APP fraud, low in value and largely reimbursed by banks, which is why banks now ask for seller verification and secure payment protections on marketplaces. | statistic: 175,809 purchase-scam cases in 2025, £118.1 million lost, 71% of APP scam cases, average £671, 78% of losses returned; quotation on persuading victims to pay by bank transfer; the ask to 'mandate seller verification and secure payment protections'; a lobbying position, not law, as of October 2026. | `additional_support`: APP fraud as the dominant classifieds fraud. → Public figures for its size and the banks' policy ask. |\n| p12 | claim | The architectural consequence is that a classifieds platform's controls are mostly pre-payment: who can list, what can be listed, what can be said and linked in messages, and how strongly buyers are steered to protected payment. |  | `cause_effect`: Fraud that closes by bank transfer the platform cannot see. → Where the controls must therefore sit. |\n| p13 | evidence (list) | A typology of classifieds fraud, with each type's strongest signals and main control point, is sharpened by three public observations: images carry much chat fraud, scammers edit ads after approval, and fraud is run industrially. | table: Typology: advance payment, payment-link phishing, fake rentals, vehicle deposit scams, triangulation, overpayment, account takeover, fake sellers and shops, counterfeit and prohibited goods, each with mechanism, signals and control point.; statistic: OLX, January 2026: fraudulent images about 30% of fraud cases in Poland; QR-code detection at 80% precision.; case: Which?, December 2024: edited scam ads passed Gumtree review in minutes.; statistic: Meta, November 2024: more than two million accounts linked to scam centers removed. | `elaboration`: Controls that sit before the payment. → The fraud types those controls face and the evidence about how they operate. |\n\n### Vertical Differences\n\n**Controlling idea** (`comparison`, id `verticals`): Fraud differs by vertical in type, loss, signal and natural friction, and where the money moves decides the link between fraud and transactions.\n\n**Advances the thesis** (F1): Shows that moving money onto the platform changes the threat model rather than ending it.\n\n**Transition in:** `elaboration`: The fraud typology and the pre-payment controls it implies. → How fraud type, loss, signal, natural friction and where the money moves differ by vertical.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p51 | analysis | Where the money moves explains the strategic link between fraud and transactions: protected on-platform payment turns unrecoverable APP fraud into a mediated dispute but creates a new surface, phishing that imitates the platform's payment product, so launching it changes the threat model rather than ending it. | table: General classifieds, real estate, automotive, jobs, recommerce with payments: dominant fraud, loss per victim, strongest signal, natural friction, where the money moves.; case: Femke's fake Safe Deal link. |  |\n\n### Fraud Signals\n\n**Controlling idea** (`explanation`, id `signals`): Fraud signals are judged by availability at decision time, cost of evasion and cost to genuine users; price and the graph are the hardest to fake, and a photo match is a fraud signal only when the policy looks at who the two sellers are.\n\n**Advances the thesis** (F2): Shows which weak signals exist and why combining them, with seller context, is what exposes a ring.\n\n**Transition in:** `elaboration`: The strongest signals named for each fraud type in the typology and for each vertical. → The signals themselves, judged on when they are available and what they cost to evade.\n\n**Order of paragraphs** (`large_to_small`): All signal families and the tests for them, then the two hardest to fake, then the case, then the strongest single signal (image reuse) in detail: detector, its limits, and the policy that gives a match its meaning.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | explanation | A fraud signal is useful only if it is available at decision time, costly for the fraudster to change and cheap for genuine users, and the signal families for listings can be judged on those terms. | table: Nine signal families (device and client, network, account and identity, behavior and velocity, content, price, media reuse, graph, external) with examples, when each is available and the fraudster's cost to evade it. |  |\n| p15 | claim | Price and the graph deserve special attention because they are hard to fake: a fake bargain needs a low price, so a market-value model doubles as a fraud feature, and a ring must reuse devices, phones, bank accounts and photos to stay profitable. | scenario: Motorvane's market-value model rates the Essen Golf at €22,800 against €21,900 asked, and could flag a 2021 Golf at €12,000. | `emphasis`: The signal families judged by cost of evasion. → The two signals that are hardest to evade. |\n| p16 | example | The Barcelona ring illustrates both: its prices were about 35% below market, computable only from structured attributes, and its 26 accounts shared five devices and four IBANs, so no single account was alarming while the cluster was unmistakable. | case: About 35% below market; 26 accounts, five devices, four IBANs. | `example`: Price and graph as the hardest signals. → Both signals in the Barcelona ring. |\n| p17 | evidence | Image reuse is the strongest single signal against fake rentals and cloned listings, and the best public classifieds design for it is OLX's duplicate-listing detection described at PyCon DE 2019. | source: Grigorev, PyCon DE 2019: candidates by category, city, seller, IP, device and image hashes; a pairwise classifier on price, location, title and image similarity; hashes then embeddings in Elasticsearch; about ten million listings a day; cropping, rotation and flipping defeat simple hashes. | `elaboration`: Photos as one of the ring's shared resources. → Image reuse as a signal and a documented design for detecting it. |\n| p18 | explanation | A platform needs both a hash for cheap exact and near-exact matches and an embedding for crops and edits, because perceptual hashes such as Meta's PDQ document their own limits. | source: PDQ documentation: a suggested match threshold, a quality score below which hashes are discarded, no guaranteed invariance to rotation or flips. | `cause_effect`: The OLX design and its note that edits defeat simple hashes. → Why a platform needs both a hash and an embedding. |\n| p19 | recommendation | The Barcelona lesson is about policy, not the detector: the same photos mean a repost, a multi-agency listing or a theft depending on who posted them, so a photo match between unrelated sellers must go to fraud scoring with the seller context, never to a deduplication queue on its own. | case: Eleven photo-match items closed as legitimate duplicates in Barcelona; entity-resolution's same point from the clustering side. | `contrast`: The detector that finds matching photos. → The policy that decides what a match means. |\n\n### Architecture: The Risk Scoring Service\n\n**Controlling idea** (`description`, id `architecture`): One risk scoring service answers 'how risky is this action, by this actor, right now?' for every caller, reading precomputed features in real time, combining rules and models under a backtest-shadow-rollout lifecycle, and scoring actors linked in an identity graph as well as items.\n\n**Advances the thesis** (F3, F4): Designs the service that combines the signals and the lifecycle that keeps its rules and models current.\n\n**Transition in:** `problem_solution`: Signals that are weak alone and a match whose meaning depends on the sellers. → The service that combines signals with their context within the latency of an action.\n\n**Order of paragraphs** (`large_to_small`): The service and its provenance first, then its paths and the feature store that feeds them, then the rules and models that consume features and their lifecycle with the Barcelona rule, then the unit of scoring and the identity graph with its limits. Rules and models come before the identity graph because the graph is the source of the features that let them score actors.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p20 | definition | A risk scoring service answers one question for many callers (insertion and edit, message send, login and recovery, contact reveal and, where the marketplace handles payments, payout release) and returns scores, reasons and recommended friction to the decision service rather than deciding enforcement itself. |  |  |\n| p21 | context | The design is a reference-architecture inference from public adjacent systems, because no classifieds company has published a fraud-scoring architecture in this form. | source: Meta's Sigma, Stripe Radar's rule operations, Uber's 2017 feature store, Mercari's 2026 risk-based authentication.; figure: Figure 2: the risk scoring service with real-time path, streaming and batch jobs, and labels returning. | `elaboration`: What the service does for its callers. → Where the design comes from and how far it can be trusted. |\n| p22 | explanation | The real-time path has a budget of tens of milliseconds inside a user's action, so it reads features that streaming and batch jobs have already computed, and each kind of work runs where its latency allows. | table: Work by place and latency: block-list lookups and simple rules, model inference (real-time); velocity counters and incremental graph updates (streaming); image matches (asynchronous); community detection and training (batch). | `sequence`: The design as a whole. → Its first split: what runs on the request and what runs before it. |\n| p23 | claim | A feature store is justified once real-time behavioral features drive decisions, which fraud is the use case that brings about, and its essential property is point-in-time correctness. | source: Uber's 2017 Michelangelo: precomputed online features, the same pipelines for training and serving, predictions logged and joined with outcomes.; reasoning: No classifieds company has documented one; many classifieds models use attributes the listing already holds; fraud features are behavioral, cross-entity and time-sensitive. | `elaboration`: Features precomputed by streaming and batch jobs. → The component that serves them consistently, and when it is worth building. |\n| p24 | comparison | Rules and models are not alternatives but do different jobs: rules handle known patterns fast and fail by rot, models combine weak signals and fail by drift. | table: Rules versus models: best at, time to deploy, explainability, failure mode, adversarial behavior. | `sequence`: Where features come from. → What consumes them: rules and models. |\n| p25 | evidence | The operating model that works is Stripe Radar's documented rule lifecycle (backtest, shadow mode at 0% traffic, gradual rollout, audit trail), with Meta's Sigma adding policies as code deployed continuously. | source: Stripe Radar docs (n.d.): conditions on attributes including model scores, backtesting, shadow mode, gradual rollout, audit.; source: Engineering at Meta, 2015: Sigma, policies as code hot-swapped into production. | `elaboration`: Rules as the fast tool. → The lifecycle that keeps rules fast without making them dangerous. |\n| p26 | example | The Barcelona combined rule shows what a rule is for: written in an afternoon, it held every listing of a young, unverified account whose photos matched an unrelated seller and whose rent was at least 25% below the district estimate. | case: Photo match to an unrelated seller and rent at least 25% below the district estimate and account younger than 30 days and lister not a verified agency, so hold all the account's listings and open one case for the cluster. | `example`: The rule lifecycle. → The rule that actually stopped Barcelona. |\n| p27 | analysis | A model trained on the ring and on about 2,000 earlier fake-rental listings replaced the rule six weeks later, because the next ring would change its discount and account age: rules are the fast response and models the durable one. | scenario: Model trained on the 180 listings and about 2,000 fake-rental listings removed over the previous year; replaced the rule six weeks later; next ring expected at 20% discounts with older accounts. | `cause_effect`: The rule that stopped the ring. → Why a model replaced it and what that says about rules and models together. |\n| p28 | claim | The deepest design choice is the unit of scoring: organized fraud is an actor problem, because a ring's listings are designed to pass item checks and its infrastructure is not. |  | `elaboration`: Rules and models scoring what they are given. → What they should score: the actor as well as the item. |\n| p29 | definition (list) | The identity graph links accounts through shared devices, phone numbers, e-mail patterns, payment accounts, IP ranges, image hashes and near-identical text, and is used to propagate known fraud, detect rings and scope enforcement to the whole cluster. | figure: Figure 3: clean listings in the item view against a cluster of 26 accounts on five devices and four bank accounts in the actor view. | `elaboration`: The actor as the unit of scoring. → The structure that makes actors visible: the identity graph and its three uses. |\n| p30 | explanation | The graph has two hard constraints: shared attributes are not proof, so graph features raise scores and widen cases but do not terminate accounts alone, and the graph is personal data, so at Veldmark only hashed identifiers of fraud-terminated accounts cross brands. | scenario: Shared cross-brand block list of hashed identifiers of fraud-terminated accounts, two-year retention approved by Lucía Ortega under a fraud-prevention legitimate interest; each brand's graph of ordinary accounts stays in the brand. | `contrast`: What the identity graph can do. → The limits on what it may do. |\n\n### Step-Up Friction\n\n**Controlling idea** (`recommendation`, id `friction`): Risk is better answered with step-up friction than with blocks, and the threshold at which to apply it comes from an explicit cost model whose inputs the business owns.\n\n**Advances the thesis** (F5): Turns a score into graduated friction and shows the threshold arithmetic.\n\n**Transition in:** `cause_effect`: A risk score and the decision service it feeds. → What to do with a score short of a block.\n\n**Order of paragraphs** (`problem_solution`): Why blocks fail, the documented alternative, the ladder of frictions and its evidence, then a worked threshold that shows who owns the inputs.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p31 | claim | Blocking is a blunt answer to a probability that loses genuine customers, so step-up friction asks for evidence a genuine user can give quickly and a fraudster cannot, or only at a cost that ruins the scam. |  |  |\n| p32 | evidence | Airbnb described this in 2018 as targeted friction, choosing the threshold by minimizing a loss that weighs genuine users' abandonment against fraud prevented, and measuring each friction's cost by A/B tests. | source: InfoQ, 2018, summarizing Airbnb: micro-authorizations, 3-D Secure, billing-statement verification; loss-based threshold; A/B testing on low-risk users. | `example`: Friction in place of blocks. → A documented case of friction chosen by cost. |\n| p33 | description | A friction ladder for a listing marketplace runs from in-context warnings to protected payment only, each rung defeating a different fraud at a different cost to genuine users. | table: Warning, delay, limits, phone verification, strong authentication, identity or business verification, protected payment only: what each defeats, its cost to genuine users, its typical trigger. | `elaboration`: Friction as a general method. → The rungs available to a listing marketplace. |\n| p34 | evidence | Two 2026 public sources support the ladder's upper rungs: Mercari's passkeys and risk-based authentication, and the Ofcom-commissioned expert report on delays and verification friction. | quotation: Mercari, July 2026: where passkeys were required, 'large-scale phishing financial damages have been effectively zero'; risk-based authentication on session and account posture.; quotation: Integrity Institute for Ofcom, July 2026: 'creating delays between creating an account and reaching a large audience'; verification friction 'directly disrupts' repeat bad actors. | `additional_support`: The ladder's upper rungs. → Public evidence that they work. |\n| p35 | example | Tradeyard's December 2027 first-contact friction poses the threshold question with illustrative assumptions from a two-week shadow evaluation: about 2,000 fraud accounts a week, 85% stopped, 8% of genuine accounts lost, €180 of harm per fraud account and €25 per lost genuine account. | scenario: New accounts sending more than five first contacts in an hour must verify a phone number if message risk is above a threshold; assumptions labelled illustrative. | `problem_solution`: Friction chosen by cost in principle. → A Veldmark friction whose threshold has to be chosen. |\n| p36 | analysis | The cost model puts the optimum at a score of 0.5, neither the most aggressive nor the most permissive threshold, and the lesson is that the cost of a lost genuine user is a business input the general manager owns, abandonment is measured by experiment, and the threshold moves when fraud adapts. | table: Weekly cost by threshold: none €360,000; 0.3 €201,000; 0.5 €171,500; 0.7 €209,160; formula (2,000 − fraud stopped) × €180 + genuine lost × €25. | `cause_effect`: The friction and its assumptions. → The threshold the arithmetic picks and what the arithmetic teaches. |\n\n### Fraud Controls in Messaging\n\n**Controlling idea** (`recommendation`, id `messaging`): Most classifieds scams close in the conversation, so links, payment requests and off-platform moves must be checked before a message is delivered.\n\n**Advances the thesis** (F1, F5): Places a pre-payment control in the channel where scams close.\n\n**Transition in:** `similarity`: Friction that acts before an action completes. → The same before-the-action control applied to sending a message, the action where most scams close.\n\n**Order of paragraphs** (`problem_solution`): Why the conversation is the control point, the Veldmark case of scanning too late, the design that fixes it, then the legal limits on the design.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p37 | claim | Most classifieds scams close in the conversation, so fraud controls have to act before a message is delivered, inside the conversation model that messaging-and-leads owns. |  |  |\n| p38 | example | Tradeyard shows the cost of scanning too late: on 7 March 2027 a fake Safe Deal payment link reached Femke because its domain had been registered that day and no rule checked domain age. | case: About 11 million messages a day and about 41,000 NL and BE payment-link phishing reports in 2026; Femke's €240 city bike; suspension seven minutes after her report; a new rule withheld 37 similar messages. | `example`: Controls before delivery. → A Veldmark message that was delivered and should not have been. |\n| p39 | process (list) | A reference design for message-level fraud controls extracts identifiers from every message and image, checks links, withholds before delivery when confident, warns in context when not, scores the whole conversation and masks off-platform contact details for new accounts. | source: OLX Group 2026 (blocking suspicious chat images before delivery); ITWeb 2018 on OLX South Africa (safety tips on payment keywords and off-platform moves).; figure: Figure 4: the 7 March message scored before delivery, the domain check decisive, the message withheld and a case opened. | `problem_solution`: A phishing link delivered because no rule checked it. → The steps that would have stopped it. |\n| p40 | explanation | Scanning private messages for fraud has a legal side under the GDPR, ePrivacy and the DSA, which Veldmark meets by documenting the purpose, running an impact assessment, disclosing the scanning and keeping content only as long as the case needs. | scenario: Veldmark documents fraud prevention as the purpose, runs a DPIA, discloses automated scanning in its terms, limits retention. | `contrast`: What the message gate does. → The legal limits on doing it. |\n\n### Feedback Loops and Labels\n\n**Controlling idea** (`recommendation`, id `labels`): A fraud model is only as current as its labels, which are late, biased and incomplete, so the loop needs a random sample, late labels joined to features as they were, shadow testing, rule monitoring and defenses against probing.\n\n**Advances the thesis** (F4): Shows how labels from victims, banks, reviewers and appeals reach the models within days and how the gate resists adaptation.\n\n**Transition in:** `sequence`: Controls at insertion, friction and messaging that produce decisions. → How the outcomes of those decisions return as labels.\n\n**Order of paragraphs** (`problem_solution`): The label problem, the practices that address it, then the adversary who adapts to the loop.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p41 | claim | Fraud labels are late, biased and incomplete, and each source confirms something different with its own delay and bias. | table: Label sources: reviewer decisions, user reports, victim loss reports, bank and police reports, chargebacks, appeal reversals, random-sample review, with what each confirms, its delay and its bias.; figure: Figure 5: the feedback loop with sources, random sample and shadow mode. |  |\n| p42 | recommendation (list) | Four practices keep the loop honest: correct selection bias with a blind random sample, treat late labels as first-class by joining them to point-in-time features, shadow every rule and model before enforcement, and monitor rules for rot with an owner and expiry. | source: Stripe Radar docs on shadow mode and rule metrics. | `problem_solution`: Labels that are late and biased. → The practices that correct for it. |\n| p43 | recommendation (list) | Fraudsters probe the gate, as Which?'s testers did by changing devices and editing approved ads, so the gate re-scores every material edit, does not leak thresholds in rejections and rate-limits retries per identity cluster. | case: Which?, 2024: testers changed devices, Wi-Fi networks and identities and edited approved ads into scam ads. | `contrast`: A loop that learns from labels. → An adversary who learns from the gate's rejections. |\n\n### Collaboration with Banks and Police\n\n**Controlling idea** (`recommendation`, id `banks`): A platform sees the setup and a bank sees the money, so exchanging identifiers with banks and evidence packages with police is one of the few controls on the money side of fraud the platform cannot see.\n\n**Advances the thesis** (F1, F4): Extends pre-payment controls to the money side and adds bank and police reports as labels and signals.\n\n**Transition in:** `additional_support`: Bank and police reports as the latest and sparsest labels. → The banks and police as partners who see what the platform cannot.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p44 | explanation (list) | Neither platform nor bank can stop APP fraud alone: bank-side Verification of Payee does not stop a mule's real account, identifiers exchanged both ways are fraud signals for each side, and police need evidence packages from the evidence store. | fact: EU Instant Payments Regulation: euro-area payment service providers offer Verification of Payee since 9 October 2025.; case: Barcelona's four IBANs belonged to recruited mules, so a name check would have matched. |  |\n| p45 | example | After Barcelona, Veldmark set up a bank liaison function with two Spanish and three Dutch banks that feeds reported mule IBANs, hashed, into the shared block list, a control slow to set up and cheap to run. | scenario: Bank liaison for Hearthly Spain and Tradeyard; two Spanish and three Dutch banks; hashed mule IBANs in the shared block list hold messages and listings asking for payment to them. | `example`: Identifier exchange as a principle. → Veldmark's bank liaison function. |\n\n### Back to Barcelona: What Day-One Action Would Have Required\n\n**Controlling idea** (`synthesis`, id `back-to-barcelona`): Each Barcelona failure maps to a missing capability the chapter has designed, and with them the ring would have been held at the gate on its first evening.\n\n**Advances the thesis** (F2, F3, F4): Applies the design to the opening case, component by component.\n\n**Transition in:** `conclusion_summary`: The full design: signals, scoring service, friction, messaging controls, labels and bank exchange. → The design applied to the opening case.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p46 | synthesis | Ingrid's question can now be answered component by component: each thing that happened in Barcelona maps to a missing capability and its target design. | table: Photo matches as duplicates, separate price queue, unrelated-looking accounts, listing-at-a-time review, victim report to support, twelve days to a combined rule, each with missing capability and target design. |  |\n| p47 | analysis | With those components the cluster would plausibly have formed on the first evening and the remaining listings been held at the gate, which matters because most of the €71,000 was paid between 5 and 12 July; Hearthly Spain's move to the shared platform was brought forward to the first quarter of 2028. | scenario: Plausible timeline: first five or six listings live on 1 July, cluster formed that evening through a shared device; most losses paid 5 to 12 July; move to the shared platform brought forward to Q1 2028. | `cause_effect`: The missing capabilities. → What having them would have changed, and what Veldmark did. |\n\n### Trade-offs\n\n**Controlling idea** (`comparison`, id `trade-offs`): The main trade-offs are build, buy or share; friction against liquidity; and real-time against batch detection, and each has a defensible default.\n\n**Advances the thesis** (F5, F6): Gives the conditions under which each choice holds and the author's recommendation.\n\n**Transition in:** `sequence`: The design applied to Barcelona. → The choices the design forces and their alternatives.\n\n**Order of paragraphs** (`grouping`): Three independent trade-offs, from what to own, to what friction costs, to when detection runs.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p48 | recommendation | For a group, the right sourcing is a hybrid: buy hard-to-build signals such as device intelligence and domain reputation, and own the decisions, the identity graph and the label store as the platform's memory of its adversaries. | table: Per-brand in-house, shared group platform (Veldmark's choice), commercial vendor, hybrid: strengths, weaknesses, when right. |  |\n| p49 | recommendation | Every friction costs liquidity somewhere, so the defensible position is targeted friction by risk tier with abandonment measured by experiment and thresholds reviewed with the general managers who own liquidity targets. | reasoning: Held listings are not searchable; verification loses some sellers; masked numbers slow contacts; liquidity-and-network-effects on why the first hours matter. | `contrast`: What the platform builds or buys. → What its frictions cost the marketplace. |\n| p50 | recommendation | Most platforms need a real-time gate plus asynchronous scoring, with risk tiers deciding which items wait for the asynchronous result, as a new unverified private landlord in Barcelona should have. | table: Everything real-time, real-time gate plus asynchronous scoring, batch only: benefit and cost.; case: A rental from a new, unverified private account in Barcelona should have waited. | `sequence`: Friction against liquidity. → The timing trade-off: real-time against batch detection. |\n\n### Failure Modes\n\n**Controlling idea** (`description`, id `failure-modes`): Ten failure modes, from signals without combination to late labels dropped, are the ways a fraud stack fails in practice.\n\n**Advances the thesis** (F2, F3, F4, F5): Restates each rule as the failure that follows from breaking it.\n\n**Transition in:** `sequence`: The trade-offs and their defaults. → The ways fraud stacks commonly fail.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p52 | description (list) | Ten failure modes recur: signals without combination, item-only scoring, duplicates and fraud in one queue, messages scanned after delivery, models on last year's fraud, rules without owners, blocking instead of friction, badges that survive takeover, thresholds leaked in rejections and late labels dropped. |  |  |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `chief-architect`): A marketplace group's scale is an advantage against fraud only if the architecture shares the identity graph, block lists and label store, assigns each decision an owner and tracks time to cluster takedown in hours.\n\n**Advances the thesis** (F6): Sets out the group decisions, owners and measures that make shared fraud scoring work.\n\n**Transition in:** `problem_solution`: The ten ways a fraud stack fails. → The group decisions that prevent them.\n\n**Order of paragraphs** (`order_of_importance`): The reason group scale matters, the decisions that realize it, the measures that check it, then the long-term view.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p53 | claim | Fraud prevention is where group scale is a genuine advantage, because a ring that hits one brand tries the next, and a shared identity graph, block lists and label store let the group learn once instead of four times. |  |  |\n| p54 | recommendation | Seven decisions belong on the architecture agenda, each with an owner and something to watch, from a single scoring service with a contract for all callers to bank and law-enforcement exchange. | table: Decision, who decides, what to watch: single scoring service, actor scoring with data-protection boundaries, rule lifecycle, friction thresholds, label pipeline, buy versus build, bank and police exchange. | `elaboration`: Group scale as an advantage. → The decisions that make it one, and who owns them. |\n| p55 | recommendation | Three numbers belong on the group dashboard, and the second, time from first fraudulent listing to cluster takedown, is the one Barcelona exposed at about twelve and a half days when the target is hours. | statistic: Sampled prevalence of fraudulent listings by brand; time from first fraudulent listing to cluster takedown; victim-reported losses per million contacts; Barcelona at about twelve and a half days. | `sequence`: The decisions and their owners. → The measures that show whether they work. |\n| p56 | claim | As generative AI makes fraud and detection cheaper alike, the defense does not change: a platform that combines signals, scores actors, applies proportional friction and learns within days absorbs new attack tools, and one that relies on any single detector does not. |  | `contrast`: Today's measures. → The long-term shift and what stays the same. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Ten questions let a reader test their own fraud stack against the chapter's rules in a design review.\n\n**Advances the thesis** (F1, F2, F3, F4, F5, F6): Turns each rule into a question.\n\n**Transition in:** `sequence`: The Chief Architect's decisions and measures. → Questions to take into a review.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p57 | recommendation (list) | Ten questions cover which actions are scored, where photo matches go, linking at creation, time to a shadow-tested rule, pre-delivery message checks, threshold ownership, label delay, vendor portability, badges on takeover and time to cluster takedown. |  |  |\n\n## Conclusion: From Risk to Identity\n\n**Synthesis:** Every part of the design answers Ingrid's day-one question from a different side: the platform cannot see the payment, so it must act on the setup, and the setup becomes visible only when weak signals about one actor are combined; the identity graph links them, the risk score weighs them, friction makes the score cost the fraudster rather than the genuine user, and labels keep the weights current.\n\n**So what:** That is why time from first fraudulent listing to cluster takedown can be hours rather than twelve and a half days, and why the strongest friction left to apply is a check on who the actor is.\n\n**Callback:** The opening paragraph: fraud borrows the trust strangers place in the platform, and the platform is where the scam is set up even though the money leaves it; and Ingrid's question about acting on day one. The conclusion says what catching the setup takes now that each component is known, and answers the day-one question in one sentence.\n\n**Takeaway** (`course_of_action`): Route every signal to one risk scoring service that scores actors as well as items, and measure time from first fraudulent listing to cluster takedown.\n\n**Hand-off** to [Who Is on the Other Side? Identity and Verification](identity-and-verification.html): `cause_effect`: Fraud-prevention's finding that every risk score is indirect evidence about who is on the other side, and that its strongest and most expensive frictions are identity checks. → Therefore the identity question itself: how much a marketplace should know about its users, how it verifies it, what a badge promises, and how one identity serves a group of brands.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p58 | synthesis | The day-one question has one answer seen from every section: the platform cannot see the payment, so it acts on the setup, which is visible only when weak signals about one actor are combined by the identity graph, weighed by the risk score, turned into friction that costs the fraudster and kept current by labels, and that is what brings cluster takedown from days to hours. |  |  |\n| p59 | transition | Fraud prevention keeps returning to who is on the other side, because a risk score is indirect evidence and its strongest frictions are identity checks, so identity-and-verification takes up how much a marketplace should know about its users, how it verifies it and what a badge promises. |  | `cause_effect`: Combining evidence about the actor as the core of the design. → The identity question, in the next chapter. |\n\n## Non-goals\n\n- The moderation pipeline, decision service, enforcement propagation, appeals and trust-and-safety metrics. See [Trust and Safety as a Platform](trust-and-safety-architecture.html).\n- Identity levels, KYB, passkey rollout and verified badges in depth. See [Who Is on the Other Side? Identity and Verification](identity-and-verification.html).\n- The legal analysis of message scanning, the DSA and the UK Online Safety Act. See [Rules of the Marketplace: DSA, DAC7 and Vertical Regulation](marketplace-regulation.html).\n- Payment-side fraud in transactional flows and buyer protection design. See [Beyond the Contact: Payments, Shipping and Buyer Protection](transactions-and-payments.html).\n- Perceptual hashing as an image capability. See [Photos Sell: Media Pipelines for Listings](media-pipeline.html).\n- Clustering of legitimate duplicates. See [One Property, Three Listings: Duplicates and Entity Resolution](entity-resolution.html).\n- The feature store and model governance as platform components. See [Models in Production: ML Platforms and Use Cases](ml-platform.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- The Airbnb targeted-friction evidence comes from a 2018 InfoQ summary; the original Medium post was not fetched (Medium returns 403). Verify against the original before print. (Carried over from spec.md.)\n- No classifieds fraud-scoring arc ort.json is stale; remaining items in open_questions. (AI-mediated session)\n- **2026-11-12** — Resolved the round-3 escalation under the author's delegation: Casavista sentence moved to p08, Messaging bridge rewritten, Vertical Differences moved after the threat model (roadmap, flow and transitions updated; AC-2 expected edit pending in the journal spec), max_words raised to 7,950, cheap minor fixes; open questions reduced to the four carried over from spec.md. (AI-mediated session)\n"}]}]}</script>

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,

        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped

                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');

            while (i < lines.length) {

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));

                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();

                if (bullet.test(line) || ordered.test(line)) {

                        const mBul = cur.match(bullet);

                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
