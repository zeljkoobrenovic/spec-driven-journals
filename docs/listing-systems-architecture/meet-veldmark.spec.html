<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, the acceptance criterion AC-1, the thesis and the role are copied unchanged from the meet-veldmark entry in journal-spec.json; the conclusion realises the Preface's closing (synthesis, so-what, callback, takeaway) from the same file. Two units were added by this conversion: a roadmap paragraph in the introduction (p03) and a closing section (p32, p33) that carries the Preface closing; the old hand-off paragraph moved into it.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Veldmark's four brands and their business models, its volumes, systems landscape and people.\n- **Know:** Its eight 2027 problems and the Common Ground program.\n- **Know:** The recurring worked examples whose numbers the chapters share.\n- **Be able to:** Recognize a Veldmark problem, person or worked example when a chapter cites it, and check its figures against this page.\n\n**Audience:** Experienced architects and engineering leaders working on listing marketplaces: chief and enterprise architects of marketplace groups, principal and staff engineers, search, data and ML leads, platform-engineering leads, product and engineering directors of classifieds, real-estate, automotive, jobs and recommerce marketplaces, and technology leaders integrating acquired marketplaces.\n\n**Already knows:**\n\n- What an API, a database, an event stream, a search engine and Kubernetes are.\n- How to make and defend an architecture decision.\n- From the introduction: the liquidity-machine claim, liquidity as the likelihood of a match per place and category, the general manager's scene, and that Veldmark is the book's fictional group.\n- From where-listing-systems-go-wrong: the fifteen failure-pattern names and one Veldmark illustration for each.\n\n**Does not yet know:**\n\n- Marketplace economics: liquidity, network effects, multi-homing.\n- Search and ML vocabulary: learning to rank, percolation, hybrid retrieval.\n- Regulatory detail: DSA statements of reasons, DAC7, P2B.\n- Vertical specifics: VINs, property and vehicle feed standards.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader of this page can name at least four of Veldmark's eight 2027 problems and, where the page names one, the failure pattern each is an instance of. *Probe:* Using only this page: name four of Veldmark's eight 2027 problems and, for each, the pattern it is an instance of. | `custom` | cold_reader | minor |\n| AC-2 | Given a chapter's figures for a worked example, the reader checks each against this page and corrects the ones that disagree. *Probe:* Using only this page: a chapter says Femke's Rotterdam bike sold for €225 on Monday 8 March 2027, with a Safe Deal buyer fee of €12.65, after a reservation at 16:32. Which of these figures agree with this page, and what should the others be? | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** Which group do the book's examples come from, and what state are its systems in?\n\n> **Claim:** The book's examples come from Veldmark, a fictional composite marketplace group whose four brands work and are profitable while running three or four separate identity, trust-and-safety, search and data systems beneath them, so that most of its eight 2027 problems are instances of the named failure patterns, which its Common Ground program answers by sharing platforms beneath the brands, not products.\n\n**Disputed by:** The reading that a group with slow publication, duplicates, phishing and four identity systems has eight separate problems, or should consolidate onto one brand's stack and one product.\n\n**So what:** The reader can take each chapter's scene as one more view of a single group, check any figure against this page, and ask of each Common Ground decision what the equivalent decision would be in their own group.\n\n**How and why:** Tradeyard grew country by country on one codebase, Motorvane was built for professional supply, and Hearthly and Keybridge arrived by acquisition with their own clouds and stacks; each choice fitted its moment, and together they left three clouds, three search engines and four identity systems. The brands differ in supply, money and risk, so sharing the product would force one marketplace's physics on the others.\n\n**Supporting claims**\n\n- **MV1** — The book's examples come from one fictional composite group, Veldmark, described once with fixed figures, people and stories so every chapter can draw on the same facts.\n- **MV2** — Veldmark's four brands are working, profitable businesses that differ in who supplies the listings, how the money is made and what risk they carry.\n- **MV3** — Each phase of Veldmark's history left its own stack, so the brands run three or four separate identity, trust-and-safety, search and data systems with almost nothing shared beneath them.\n- **MV4** — Most of Veldmark's eight 2027 problems are instances of the named failure patterns, and none is a technology problem alone.\n- **MV5** — Common Ground answers the problems by sharing platforms beneath the brands, not products, which leaves each brand its own physics.\n\n## Role in the part\n\nSupplies the one group, with fixed figures, problems and decisions, that every chapter's scene and worked example draws on, and performs the part's closing. Supports PF-3 of part `preface`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in Eight Problems Veldmark Starts 2027 With, then The Common Ground Program; `large_to_small` in the group as a whole, then its brands, systems and people, then single listings in The Recurring Worked Examples)\n\nEach section supplies what the next one uses. The glance gives size and ownership and names the brands; the history explains why almost nothing is shared and introduces the brands as they arrived; the brands section then says what each one sells, and the volumes size them. The systems landscape is described after the brands because its table is organized by brand and its three facts depend on what each brand is. The people come after the systems they own. The eight problems need the brands, the systems and Ingrid; the program answers the problems, so it follows them; the worked examples replay problems and program decisions in single listings, so they need both; how the chapters use Veldmark needs the problems and examples it maps. Put the problems before the systems and the reader would meet Yardstick, Solr and Keybridge's neutrality as names without a referent; put the program before the problems and 'share platforms, not products' would answer nothing.\n\n## Introduction\n\n**Hook** (`direct_statement`): This book tests its argument against one fictional group, detailed enough to be realistic and consistent enough to be followed across fifty chapters; a toy marketplace is too simple and a real company's internals cannot be verified.\n\n**Bridge:** The previous page illustrated each failure pattern with one scene from Veldmark at a time. → This page shows the whole group once, as the reference every chapter's scene draws on, and labels it fictional.\n\n**Thesis statement** (KEY POINTS callout (three bullets) and paragraph p01, which says the failure patterns appear here as Veldmark's 2027 problems.): Veldmark is a fictional composite whose four brands differ in supply, money and risk and run four of almost everything beneath them; its 2027 problems are the failure patterns at work, and Common Ground answers them by sharing platforms, not products.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p03, which lists the page's sections in order and says the page ends by drawing the Preface together.):\n\n- The group at a glance and how it came to be. *Kept in:* glance, history.\n- Its four brands and the volumes they carry. *Kept in:* brands, volumes.\n- Its systems and the people who own them. *Kept in:* systems, people.\n- The eight problems it starts 2027 with and the Common Ground program that answers them. *Kept in:* problems, program.\n- The worked examples the chapters reuse, and how the chapters use the group. *Kept in:* examples, chapters.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | claim | The book tests its argument against one fictional group, realistic and consistent across the chapters, and this page is that group's reference, where the failure patterns appear as its 2027 problems. | reasoning: A toy marketplace (one listing table and a search box) is too simple to show why hard decisions are hard; a real company's internals cannot be verified and its choices do not transfer. |  |\n| p02 | definition | Veldmark Group is fictional: a composite of patterns common in the classifieds industry, not a portrait of any real company, while the real companies the book discusses appear under their own names with dated sources. | example: The borrowed patterns: a horizontal brand grown country by country on one codebase, a vertical brand for professional supply, acquisitions with their own clouds, a transactional product on a contact marketplace, a private-equity owner wanting growth and efficiency; Adevinta, OLX, Kleinanzeigen, Rightmove and Auto Trader named as real companies discussed elsewhere. | `emphasis`: One fictional group as the book's test bed. → The label that it is fictional and what it is composed of. |\n| p03 | transition | The page describes the group in the order a newcomer needs it, from the group at a glance to how the chapters use it, and ends by drawing the three preface pages together. | reasoning: The page's sections in order: glance and history; brands and volumes; systems and people; the eight problems and Common Ground; the worked examples and how the chapters use them; a closing on the Preface. | `sequence`: Veldmark as a fictional composite. → The order in which the page describes it. |\n\n## Sections\n\n### The Group at a Glance\n\n**Controlling idea** (`description`, id `glance`): Veldmark is a profitable, privately held group of €1.31 billion revenue in eight countries that shares almost nothing beneath its brands, so it pays for most capabilities several times.\n\n**Advances the thesis** (MV2, MV3): Shows the brands as working businesses and names the cost the rest of the page explains: almost nothing shared.\n\n**Transition in:** `sequence`: The page's map. → Its first item: the group's size, ownership and footprint.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p04 | description | Veldmark is a privately held, multi-country, multi-vertical group in Rotterdam whose private-equity owner wants growth and a lower run cost at once, which makes clean boundaries between brands a strategic asset. | table: Glance table: revenue €1.31 billion; adjusted EBITDA about €470 million (about 36%); about 5,200 employees, 1,450 in product and technology, 1,150 engineers; 8 countries and ten country marketplaces plus Keybridge in three; about 17.25 million live listings; about 57 million monthly active users; shared services Veldmark Ads and SAP S/4HANA finance only. |  |\n| p05 | analysis | The margin is typical of mature classifieds, and the table's last row matters most: with almost nothing shared, the group pays for search, moderation, identity, media and data several times over. |  | `emphasis`: The glance table. → Which of its rows matters most to this book. |\n\n### How Veldmark Came to Be\n\n**Controlling idea** (`cause_effect`, id `history`): Each phase of Veldmark's fictional history, country copies, a separate automotive build and acquisitions with their own clouds, left a layer in the systems.\n\n**Advances the thesis** (MV3): Explains why the group runs several of each system: every decision fitted its moment.\n\n**Transition in:** `cause_effect`: A group that pays for most capabilities several times. → The history that produced it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | description | Veldmark's history is fictional, but its shape follows the industry's: launch, copy to new countries, build a vertical, acquire portals, add payments. | table: Timeline: Tradeyard NL 2004; Yardstick 2006; Motorvane DE 2008; Tradeyard BE 2009 and PT 2014 on their own copies of Yardstick, PL 2012 by purchase with its own Elasticsearch; Hearthly 2023; Keybridge and Safe Deal NL 2024; Casavista, the private-equity majority and Safe Deal BE 2025; Hearthly.es and Safe Deal PL 2026; Common Ground January 2027. |  |\n| p07 | cause_effect | Each phase left a layer in the systems: four category trees in one monolith deployed per country, a separate automotive stack, Google Cloud and Azure from the acquisitions, and payments on a contact marketplace never designed to know when something was sold. |  | `cause_effect`: The phases of the timeline. → What each left behind in the systems. |\n\n### Four Brands, Four Business Models\n\n**Controlling idea** (`comparison`, id `brands`): Veldmark's four brands differ in who supplies the listings, where the marketplace's job ends and how the money is made, with Veldmark Ads the one shared exception.\n\n**Advances the thesis** (MV2): Shows the four marketplace physics that sharing the product would force together.\n\n**Transition in:** `elaboration`: The brands as history assembled them. → What each one is and how it makes money.\n\n**Order of paragraphs** (`large_to_small`): The whole portfolio in one table, then its total, then the four features that recur across the book, then the one shared unit; the features need the table's terms.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | comparison | Veldmark runs four businesses and one shared advertising unit that differ in who supplies the listings, where the marketplace's job ends and how the money is made. | table: Brand table: Tradeyard €410M (VAS €150M, pro subscriptions €135M, Safe Deal €75M, insertion fees €50M); Motorvane €360M (dealer subscriptions €238M, depth/VAS €52M, leads and financing €40M, private-seller fees €30M); Hearthly €395M (agency subscriptions €270M, new-build €55M, Valuo €40M, rental services €30M); Keybridge €45M from 9,800 agencies; Veldmark Ads €100M. |  |\n| p09 | evidence | The five lines add up to €1.31 billion, with no brand above a third of revenue. | statistic: Tradeyard about 31%, Hearthly 30%, Motorvane 27%, Veldmark Ads 8%, Keybridge 3%.; figure: Figure 1: four different buildings on one shared ground plate. | `conclusion_summary`: The revenue column of the brand table. → The total and each brand's share. |\n| p10 | description (list) | Four features of the brand portfolio recur throughout the book: Tradeyard is a contact marketplace with a transactional product inside it, Motorvane and Hearthly are professional-supply businesses, Hearthly's Valuo product turns listings into a data product, and Keybridge must stay neutral. | fact: Safe Deal in NL, BE and PL on Adyen for Platforms, fee 5% plus €0.70, 11.6 million transactions, about €1.02 billion GMV, €75 million revenue (about €59 million buyer fees, €16 million label margin); Motorvane's 21,400 dealers supply 91% of listings, 88% via DMS feeds; Hearthly's 36,500 agencies supply 84% via about 160 software vendors; Valuo trained on DVF open data plus listing data; Keybridge publishes to Hearthly's competitors. | `elaboration`: The four brands and their revenue. → The four features of them the book returns to. |\n| p11 | description | Veldmark Ads is the exception to 'four of everything': one ad stack sells inventory on all three marketplaces. |  | `contrast`: Four brands each with their own model. → The one unit they already share. |\n\n### Volumes Every Design Is Sized Against\n\n**Controlling idea** (`evidence`, id `volumes`): The 2026 volumes give each brand the scale every design in the book is sized against, and ratios between places matter more than totals.\n\n**Advances the thesis** (MV1, MV2): Fixes the figures chapters reuse and shows the brands' scale.\n\n**Transition in:** `elaboration`: The four brands and their models. → Their size in listings, users, queries, alerts, media and moderation.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p12 | evidence | The four brands differ as much in volume as in model, and these rounded 2026 figures are what every design in the book is sized against. | table: Volumes table: 17.25M live listings with brand and country splits; new listings per week; monthly active users; supply mix; search 9,000 queries/s average and 31,000 peak on Sunday evenings; 46 million saved searches and 38 million alerts a day; 6.4 billion images; 40 million indexed URLs; 94% automated moderation and 210 moderators; 1.7 listings per property at Hearthly France; four Tradeyard trees and 3,900 attribute keys. |  |\n| p13 | analysis | Two caveats govern how to read the volumes: the Sunday-evening peak is a Veldmark illustration, and ratios matter more than totals. | statistic: Tradeyard NL and PT have almost the same monthly users per live listing (2.3 and 2.5), yet a new Dutch listing gets its first contact in a median of 2.6 hours and a Portuguese one in 19. | `contrast`: The table of totals. → The limits on reading it. |\n\n### The Systems Landscape\n\n**Controlling idea** (`description`, id `systems`): The 2027 estate is the product of the history, with almost nothing shared between the brands' stacks, and three facts in it shape most of the book.\n\n**Advances the thesis** (MV3): Shows the three or four separate systems per area that the thesis names.\n\n**Transition in:** `elaboration`: The volumes the brands carry, and the history that left a layer per phase. → The 2027 estate that carries those volumes.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | description | The 2027 baseline estate that carries these volumes is the product of that history. | figure: Figure 2: three marketplaces on three stacks and two clouds, an agent CRM on a third cloud, only advertising and finance shared.; table: Systems table by area and brand: core application, search, events, identity, trust and safety, data and media for Tradeyard, Motorvane, Hearthly and Keybridge. |  |\n| p15 | analysis (list) | Three facts in the landscape shape most of the book: Yardstick does almost everything for Tradeyard, Motorvane is modern but self-contained, and Hearthly and Keybridge kept their clouds. | fact: Yardstick's ads table has 214 columns read by 38 modules; it deploys twice a week and blocks about 140 Tradeyard engineers. | `emphasis`: The landscape table. → The three facts in it that matter most. |\n\n### The People\n\n**Controlling idea** (`description`, id `people`): Each fictional person owns something the architecture depends on, and most of the book's tensions are between their legitimate goals.\n\n**Advances the thesis** (MV1): Fixes the cast every chapter's scene uses.\n\n**Transition in:** `elaboration`: The systems and brands just described. → The people who own them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p16 | description | Each person owns something the architecture depends on, and most of the book's tensions are between their legitimate goals. | table: Cast table: seventeen people with role, pronouns and what they own, starting with Ingrid Halvorsen, Group Chief Architect from Monday 1 February 2027, reporting to Mateus Carvalho. |  |\n| p17 | description | The recurring customers, Femke, Autohaus Ruhrblick and Agence Rhône Habitat, are fictional too. |  | `additional_support`: The staff cast. → The three customers who recur. |\n\n### Eight Problems Veldmark Starts 2027 With\n\n**Controlling idea** (`claim`, id `problems`): Ingrid arrives at a working, profitable group with eight problems, most of them instances of the named failure patterns and none a technology problem alone.\n\n**Advances the thesis** (MV4): Ties the group's problems to the patterns the previous page named.\n\n**Transition in:** `time`: Ingrid Halvorsen and the systems she inherits. → Her starting position in February 2027.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | claim (list) | When Ingrid arrives the group works and is profitable, but eight problems define her starting position, most of them instances of the named patterns. | example: Four of everything (Deal-Shaped Architecture); six minutes to searchable, target 90 seconds p95 by end 2028; six weeks for a category, target 2 days (Category Straitjacket, Attribute Junkyard); 1.7 listings per property at Hearthly (Seeing Double); payment-link phishing (Fast Mail for Fraudsters); Yardstick blocks Tradeyard; Keybridge neutrality; overlap in Poland, about 2,900 dealers on both brands, about 40% paying both (Deal-Shaped Architecture).; figure: Figure 3: four islands with their own towers, joined by one thin bridge. |  |\n| p19 | analysis | None of the problems is a technology problem alone: each also has a product, commercial or portfolio cause. | reasoning: Phishing exists because messaging was built as a feature, not a trust surface; neutrality is a commercial promise with no architecture yet; the Polish overlap is a portfolio decision systems cannot make. | `emphasis`: The eight problems. → What they have in common. |\n\n### The Common Ground Program\n\n**Controlling idea** (`explanation`, id `program`): Common Ground answers the problems with €140 million of shared platform capabilities beneath brands that keep their own products, under new governance and a dated sequence of decisions.\n\n**Advances the thesis** (MV5): States the program and its principle, share platforms, not products.\n\n**Transition in:** `problem_solution`: The eight problems. → The program approved to answer them.\n\n**Order of paragraphs** (`grouping`): Goals, principle and governance, then the standing cloud decision, then the dated decisions by year; the decision table needs the goals, the forum it names and the cloud stance behind its AWS choices.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p20 | description (list) | In January 2027 the board approved Common Ground, €140 million over 2027–2030, with three goals: shared platform capabilities, Yardstick retired by the end of 2029, and run costs cut by €38 million a year by 2030. | fact: Capabilities: Veldmark ID, trust and safety, media, search, messaging, product catalog and entitlements, event backbone, data platform, taxonomy and attribute service; strangler milestones Q2 2028, Q4 2028, end 2029. |  |\n| p21 | claim | The governing principle is share platforms, not products, and the hard design work is deciding which part of each capability is shared. | example: A shared trust-and-safety pipeline serving local policies; a shared search engine with brand-specific relevance; a shared entitlement ledger with brand-owned packages and prices.; figure: Figure 4: brands keep what buyers and sellers see; Common Ground builds beneath; Keybridge stays outside. | `elaboration`: The goals. → The principle that governs how they are pursued. |\n| p22 | description | Common Ground is also a governance change: from April 2027 architecture principles, a weekly open advice forum and mandatory decision records for cross-brand decisions. |  | `additional_support`: The program as platforms 4 alert e-mails, now with names, owners and figures attached.\n\n**Takeaway** (`course_of_action`): Begin Part I as Ingrid Halvorsen began in February 2027: ask what kind of marketplace each part of the group actually is, and why the answer decides the architecture.\n\n**Hand-off** to [Part I — MARKETPLACE: The Business Behind the Listings](part-1.html): `elaboration`: The preface's claim that a listing marketplace is a liquidity machine, the fifteen failure patterns and the fictional group Veldmark. → The business before the systems: what kind of marketplace each part of Veldmark is, what it sells and how that decides the architecture.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p32 | synthesis | The three preface pages make one argument at three sizes, and the general manager's six minutes and sold bike return here as Veldmark's problem 2 and Femke's €240 bike in 214 alert e-mails. | reasoning: The introduction's liquidity-machine claim; the fifteen patterns as ways the machine loses matches at boundaries; Veldmark's problems as instances; Common Ground's principle as the claim written as a program. |  |\n| p33 | recommendation | Every chapter's scene is therefore one more view of a known group and a decision about a boundary, and Part I begins where Ingrid began: by asking what kind of marketplace each part of Veldmark is. |  | `cause_effect`: The one argument at three sizes. → What it lets the reader expect of every chapter, and where to start. |\n\n## Non-goals\n\n- Industry history and real-company evidence. See [From Newspaper Columns to Portfolios: How the Classifieds Industry Evolved](industry-evolution.html), [Adevinta: From Schibsted's Copy-Paste Model to a Portfolio Platform](case-adevinta.html), [OLX Group: Regional Platforms, Verticalization and Retreat](case-olx.html), [eBay Classifieds Group: Shared Platforms, Local Brands and a Sale](case-ebay-classifieds.html), [AVIV Group: Building a European Real-Estate Platform from Acquisitions](case-aviv.html), [Zillow, Rightmove, Idealista and REA: What Property Portals Teach](case-property-portals.html), [mobile.de, Auto Trader and AutoScout24: Lessons from Automotive Marketplaces](case-automotive.html).\n- Marketplace classification and the profile register. See [Classifieds, Leads, Transactions and Managed Models: A Marketplace Taxonomy](marketplace-taxonomy.html).\n- Capability map and context map details. See [Map What the Marketplace Does Before What Runs It](business-capabilities.html), [Bounded Contexts for Marketplaces: Where One Listing Becomes Many Models](bounded-contexts.html).\n- The internals of each Common Ground platform (owned by the Part II–VII chapters).\n- Chief Architect role and governance in depth. See [Who Owns What: Organizing Marketplace Engineering](organizing-marketplace-engineering.html).\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-10-19** — Followed the shape of RECONCILED's Meet Northmere (glance, brands, landscape, people, problems, program, examples, how chapters use it) so the two books' running examples read alike; kept the house callouts and a failure-pattern callout. (Carried over from spec.md.)\n- **2026-10-19** — Kept the page to scenario facts only, with no real-company claims, so the Sources section needs almost no external evidence (DVF is the one real dataset cited). (Carried over from spec.md.)\n- **2026-10-19** — Included a dated decision table drawn from chapters' ledger additions, so readers can place each chapter's scene in the 2027 timeline; detail stays in the owning chapter. (Carried over from spec.md.)\n- **2026-10-19** — Stated the Sunday-evening peak explicitly as a Veldmark illustration, per the writer brief. (Carried over from spec.md.)\n- **2026-11-12** — Converted spec.md to spec.json. Success criteria: the fictional-labeling, brand-table, context-diagram, cast-table, Common Ground, worked-example and problem-map criteria were inventories of contents and are dropped; their facts are now paragraph evidence checked against the ledger. The 'eight problems tied to patterns' criterion is replaced by the journal spec's AC-1. The hand-off criterion is replaced by conclusion.hand_off. The spec set no word limit, so length.max_words is the published draft's 4,701 counted words plus 5% (4,936). Rejected: Carrying the success criteria over as written (inventories).\n- **2026-11-12** — Added AC-2 (minor, cold reader): checking a chapter's bike figures against this page, which tests the outcome's can_do ('check its figures against this page') that AC-1 does not reach.\n- **2026-11-12** — Supporting claims MV1 to MV5 written here (the journal spec gives none for this post) from the thesis's parts: one fictional group with fixed facts; brands that differ and work; a history that left several of each system; problems as pattern instances; the program's principle. For the author to confirm.\n- **2026-11-12** — Added a roadmap paragraph (p03) to the introduction, because the IN THIS CHAPTER callout did not announce the history, the glance or how the chapters use Veldmark, and a closing section, 'From the Preface to Part I' (p32, p33), because the page carries the Preface's closing and the published page ended on a hand-off with no synthesis or callback. The heading follows the house 'From <X> to <Y>' hand-off form. Rejected: Making 'How the Chapters Use Veldmark' the conclusion: its problem-to-chapter table is body evidence and would make a weak conclusion.\n- **2026-11-12** — Corrected two statements toward the [editor] ledger line that the Belgian and Portuguese copies of Yardstick were folded back into one codebase in 2016–2018, with database and deployment still per country: the Copy-Paste Country callout said the sites 'run on their own copies of Yardstick' in 2027, and the history paragraph said 'country copies of one monolith'.\n- **2026-11-12** — Flow rubric verdict sound with notes; order unchanged. p10                 if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
