<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published page (posts/part-3-intro/index.md) and its former spec.md (accepted 2026-10-21), which it replaces; one spec paragraph per unit of the page, in the page's order. Intent outcome, AC-1 to AC-3 and role are copied unchanged from the post's entry in journal-spec.json; the introduction realises Part III's opening (hook, bridge, roadmap) from the same file. The journal spec gives this post no thesis, so the thesis and its three supporting claims are written here from the part's thesis and flow. The five callouts (IN THIS PART, WHY THE BUSINESS CARES, WHY ARCHITECTS SHOULD CARE, KEY POINTS, FAILURE PATTERNS) stand before the first paragraph and are kept as the house format; the KEY POINTS callout carries the part's claim in three bullets. Following the Part II intro's check, the Veldmark thread is a body section and the conclusion has its own heading. Units added to or changed on the published page to meet the contract: the roadmap sentences in p02, the lead-in to the chapter table (p03), and the closing paragraph (p06, grown from 'Begin with [Many Doors In: Forms, APIs and Bulk Feeds](listing-ingestion.html).' and taking the Part IV sentence from the connection paragraph).\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Part III's argument: supply is one chain, not five features, with a contract per door, provenance on every value, entities behind duplicates, and a publication path whose removal side matters more.\n- **Know:** The five chapters in reading order and the question each answers, and the Veldmark incidents and decisions they follow in 2027.\n- **Be able to:** Pick the Part III chapter that answers the supply problem in front of them.\n\n**Audience:** Chief and enterprise architects, principal engineers and leads for ingestion, catalog, publication, partner integration or professional products (the journal's readers) who have read Part II and are about to start Part III, or who arrive with a supply problem in hand and want the chapter that answers it.\n\n**Already knows:**\n\n- What an API, a database, an event stream, a search engine and Kubernetes are; how to make and defend an architecture decision; what idempotency means for a write.\n- Part II's listing model: a small aggregate referencing governed categories, attributes, media, places and seller accounts by ID; compiled attribute schemas; organizations, branches and integration principals (part-2, attribute-schemas, sellers-and-accounts).\n- Part I's liquidity metrics, among them time to first contact, and what a ghost listing is (liquidity-and-network-effects, where-listing-systems-go-wrong).\n- The fifteen named failure patterns, among them Feed Roulette, Seeing Double and Ghost Inventory (where-listing-systems-go-wrong).\n- Veldmark in outline: a fictional group of four brands (Tradeyard, Motorvane, Hearthly, Keybridge), Ingrid Halvorsen its Group Chief Architect, and the recurring examples (the Essen Volkswagen Golf, the Lyon apartment) (meet-veldmark); the page still glosses Keybridge where its data matters.\n\n**Does not yet know:**\n\n- Feed contract, snapshot versus delta, mass-change guard (owned by listing-ingestion; the KEY POINTS callout says only that a contract states what it means when a listing is missing from a feed).\n- Provenance, canonical value and replayable enrichment (owned by normalization-and-enrichment; the KEY POINTS callout and p02 use 'recorded provenance' in the plain sense of where a value came from).\n- Entity and cluster identifier (owned by entity-resolution; the KEY POINTS callout glosses an entity as the one flat or car behind several listings and avoids 'cluster identifier').\n- Freshness SLA, SLA card and stage budget (owned by publication-pipeline; the page says only 'an SLA card with a time budget per stage').\n- Dealer Hub, the lead ledger and neutrality controls (owned by professional-seller-tooling; the page says 'Motorvane's dealer portal').\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader of this page alone can name the five chapters' subjects in reading order. *Probe:* After reading only this page: what will each of the next five chapters tell you, in order? | `intro_predicts_content` | cold_reader | major |\n| AC-2 | Given a situation the chapter table lists, the reader names the chapter to open. *Probe:* A partner's bad file unpublished thousands of listings overnight, and separately dealers dispute your lead counts. Using only this page, which chapter do you open for each? | `custom` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-4 | The reader can say what Part III takes from earlier parts and which later part reads its result. *Probe:* Using only this page: what does this part take from Parts I and II, and which later part depends on what it delivers? | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** What does this part argue, and in what order should its chapters be read?\n\n> **Claim:** Part III argues that supply is one chain, not five features: every door writes through one path under its own contract, every value keeps its original and its recorded source, listings of the same thing are recognized as one, and publication is a decision followed by a propagation whose removal side matters more; its five chapters take the links in the order a record meets them and end with professional tooling, where the professionals who supply most of the inventory check the chain's output against their own systems.\n\n**Disputed by:** The common practice of treating each door, the deduplication job, the index and the pro dashboard as separate features owned by the teams that built them, so the supply chapters are a set of independent topics a reader may consult in any order.\n\n**So what:** A reader who accepts it reads ingestion first, or opens the one chapter that answers the supply problem in front of them, and expects every later part (search, alerts, recommendations) to inherit whatever weakness a link of the chain leaves.\n\n**How and why:** Normalization works only on records ingestion accepted; entity resolution compares the canonical values normalization produces; the publication pipeline budgets stages the reader has by then met; and professional tooling reconciles leads from listings already published, which is why it comes last. Veldmark meets each link first as an incident: a truncated file that unpublished 38,400 Motorvane listings, a six-minute baseline that ignored held listings, 23 portal leads against 14 in a dealer's CRM.\n\n**Supporting claims**\n\n- **PIII-1** — The five chapters take the chain's links in the order a record meets them, and each is the chapter to open first for a recognizable symptom.\n- **PIII-2** — The chain sits between the book's other parts: it consumes Part II's contracts, takes its targets from Part I's liquidity metrics and delivers what Part IV reads.\n- **PIII-3** — Veldmark meets each link first as an incident or a mismatch and answers it with a contract or a design, one per chapter.\n\n## Role in the part\n\nPerforms the part's opening: states that supply is one chain with a contract, a provenance record and a removal path at every link, the reading order of the five chapters and the Veldmark incidents they answer.\n\n## Flow\n\n**Pattern:** `large_to_small` (also `prerequisite_order` in p02 and the chapter table in p03: the five chapters in the order a record meets the links)\n\nThe page opens on the problem (supply arriving through many doors, each growing its own idea of a listing), states the part's claim (one chain) together with the order in which the chapters take its links, then narrows to one row per chapter with the symptom that sends a reader there. It then widens once to place the chain in the book, shows Veldmark meeting each link as an incident in chapter order, and ends with a short synthesis that hands off to the first chapter. The professionals' check is stated as the chain's last link, where its output is checked, so that 'five features' and five chapters agree. The order of the chapters is stated before the table because the rows only make sense once the reader knows they follow one record; the connection section follows the table because it says what the chapters take from Parts I and II; the Veldmark section follows the connection because its incidents are the chain's weaknesses in practice, listed in chapter order; the conclusion comes last, holds no new material and carries the forward link to Part IV, which is the chain's so-what. Put Veldmark first and the incidents arrive before the reader knows which link each belongs to; put the connection first and it names contracts and targets before the reader knows which chapters use them.\n\n## Introduction\n\n**Hook** (`direct_statement`): Supply arrives through many doors, at different rhythms, from systems the marketplace does not control, and each door tends to grow its own idea of what a listing is.\n\n**Bridge:** Part II's listing model: a small aggregate referencing governed categories, attributes, media, places and accounts. → That model put under load by supply from forms, partner APIs and bulk feeds the marketplace does not control.\n\n**Thesis statement** (KEY POINTS callout; paragraph p02 (bold phrase)): Supply is one chain, not five features; its last link is the professionals who check its output, and the five chapters take the links in order.\n\n**Roadmap** (paragraph p02):\n\n- Five chapters on the chain's five links in order: entering under a contract, normalization and enrichment with recorded provenance, recognition of what is already known, publication and, above all, unpublication within a freshness target, and, as the last link, the professionals who check the output against their own systems; a table says when to open each. *Kept in:* chapters.\n- After the table, the part's place in the book and the Veldmark thread. *Kept in:* connects, veldmark.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Part II modeled the listing as a small aggregate referencing governed subdomains, and this part puts that model under load: supply arrives through many doors, at different rhythms, from systems the marketplace does not control, and each door tends to grow its own idea of what a listing is. | example: Many doors, at different rhythms, from systems the marketplace does not control, each growing its own idea of a listing. |  |\n| p02 | claim | The part's claim is that supply is one chain, not five features: a record enters under a contract, is normalized and enriched with recorded provenance, is recognized when it describes something already known, and is published and, above all, unpublished within a freshness target, and the chain's last link is the professionals who check its output against their own systems; the five chapters take these links in order, and a table, the part's place in the book and the Veldmark thread follow. | figure: Figure 1: a single conveyor carrying listings from phone, dealer-system and agency doors through contract, provenance, matching and publication stations, with a return path for removal. | `problem_solution`: The many doors, each growing its own idea of a listing. → The part's answer: one chain, and the chapters as its links in order. |\n\n## Sections\n\n### Chapters in this part\n\n**Controlling idea** (`description`, id `chapters`): Each of the five chapters answers one question and is the one to open first for a recognizable symptom.\n\n**Advances the thesis** (PIII-1): Lists the chapters in reading order with the question each answers and the symptom that sends a reader to it.\n\n**Transition in:** `elaboration`: The five chapters in the chain's order. → One row per chapter: its question and when to open it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p03 | description | Each row of the table gives a chapter's question and the symptom that should send a reader to that chapter. | table: Five rows in reading order: listing-ingestion (a partner's bad file can unpublish thousands of listings overnight), normalization-and-enrichment (nobody can tell typed values from inferred ones), entity-resolution (one flat appears three times, or reposts crowd out new supply), publication-pipeline (publication takes minutes, or sold items still appear in alerts), professional-seller-tooling (dealers dispute lead counts, or the group sells software to professionals). |  |\n\n### How this part connects\n\n**Controlling idea** (`context`, id `connects`): The chain consumes Part II's contracts, takes its targets from Part I's liquidity metrics and hosts trust and safety's moderation gate.\n\n**Advances the thesis** (PIII-2): Says which earlier models and metrics the chain uses and which part owns the gate inside it.\n\n**Transition in:** `place`: The five chapters of the chain. → Where the chain sits in the book: what it consumes from Part II and what Part I sets as its targets.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p04 | context | This part consumes Part II's contracts (ingestion validates against the attribute schemas, writes commands to the listing aggregate and attaches records to seller accounts), Part I's liquidity metrics set its targets (time to first contact sets the publication budget, ghost rates the removal guarantee), and trust and safety (Part V) owns the moderation gate inside the publication pipeline. |  |  |\n\n### The Veldmark thread\n\n**Controlling idea** (`example`, id `veldmark`): At Veldmark, each link of the chain shows up first as an incident or a mismatch and is answered by a contract or a design, one per chapter.\n\n**Advances the thesis** (PIII-3): Shows each link's weakness and answer at Veldmark, in chapter order.\n\n**Transition in:** `example`: The chain and the targets that the earlier parts set for it. → Veldmark's supply incidents and answers in this part, one per chapter.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | example (list) | At Veldmark (fictional) supply problems arrive as incidents before designs, and Ingrid Halvorsen's team answers one per chapter, in chapter order. | scenario: The 8 March 2027 incident at Motorvane, the group's car marketplace (truncated snapshot files unpublished 38,400 listings), answered by Supply Contract v1 in September 2027, given in its own sentence with its parts glossed: one envelope and one error catalog, mandatory mass-change guards that hold unusually large removals or changes for review, and brand-local adapters each brand keeps for its partners' formats (listing-ingestion); the Essen Volkswagen Golf's 31 decoded attributes each given a recorded source (normalization-and-enrichment); the Lyon apartment's three agency listings clustered into one canonical property on Hearthly, the group's property portal, using only what each listing carries as published to Hearthly, never data from Keybridge, the group's agency software that also feeds rival portals, with the reason (agencies fear Veldmark would use their data to favor Hearthly) in its own sentence (entity-resolution); the 90-second p95 publication target of Tradeyard, the group's classifieds site, written as an SLA card with a time budget per stage (publication-pipeline); the Golf's 23 leads in Motorvane's dealer portal reconciled against the 14 in the dealer's CRM, and, on the agency side under the same neutrality rule as Lyon, Keybridge's cross-portal report (each agency's performance on every portal) kept out of Hearthly's reach (professional-seller-tooling). |  |\n\n## Conclusion: Where to begin\n\n**Synthesis:** Read together, the five chapters turn many doors into one chain: a contract per door, a source for every value and a removal that reaches every copy.\n\n**So what:** Part IV's search, alerts and recommendations are only as fresh, deduplicated and trustworthy as that chain.\n\n**Callback:** The opening (p01): supply arriving through many doors, each growing its own idea of a listing. The closing paragraph names what the many doors become when the chapters are read together.\n\n**Takeaway** (`course_of_action`): Begin with listing-ingestion and read the chapters in order, or open the chapter the table names for the supply problem in front of you.\n\n**Hand-off** to [Many Doors In: Forms, APIs and Bulk Feeds](listing-ingestion.html): `elaboration`: The part introduction's first link of the chain, 'many doors, one write path, one contract per door', and the 8 March 2027 incident it names. → The four channel types, snapshot and delta semantics, the clauses of a feed contract and the architecture that sends every door through one idempotent write path.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | synthesis | Read together, the five chapters turn many doors into one chain (a contract per door, a source for every value, a removal that reaches every copy), and Part IV's search, alerts and recommendations are only as fresh, deduplicated and trustworthy as that chain; a reader begins with listing-ingestion. |  |  |\n\n## Non-goals\n\n- Re-teaching feed contracts, provenance, matching, pipeline budgets or neutrality design; the chapters own them and the page points to them. See [Many Doors In: Forms, APIs and Bulk Feeds](listing-ingestion.html), [From Raw Supply to Usable Listings: Normalization and Enrichment](normalization-and-enrichment.html), [One Property, Three Listings: Duplicates and Entity Resolution](entity-resolution.html), [From Submitted to Searchable: The Publication Pipeline](publication-pipeline.html), [Serving the Pros: Dealer, Agent and Merchant Tooling](professional-seller-tooling.html).\n- Search and alerts. See [Part IV — DISCOVERY: Matching Intent to Inventory](part-4.html).\n- The moderation gate's design. See [Trust and Safety as a Platform](trust-and-safety-architecture.html).\n- External factual claims; the page cites no company facts and needs no sources.\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-10-19** — Structure follows the sibling part-2 intro for consistency; no diagram, to stay within 800 words.\n- **2026-10-19** — Failure patterns chosen: Feed Roulette, Seeing Double, Ghost Inventory, each the lead pattern of at least one chapter in the part.\n- **2026-11-12** — Converted spec.md to spec.json. Success criteria: the callout-format, KEY POINTS synthesis, chapter-table, connection, Veldmark-facts, hand-off and word-count criteria were inventories of contents or format and are dropped (format stays governed by the style guide; Veldmark facts by the ledger; the hand-off is now conclusion.hand_off; the word count is length.max_words). They are replaced by the journal spec's AC-1 to AC-3 and one added minor criterion, AC-4 (what the part takes from Parts I and II and which part reads its result), which tests the connection section and the closing. Rejected: Carrying the success criteria over as written (inventories).\n- **2026-11-12** — Thesis and supporting claims PIII-1 to PIII-3 written here, since the journal spec's entry for this post has none: the question is the entry's question; the claim condenses the part thesis to what this page argues (one chain, and the reading order). For the author to confirm. Rejected: Copying the part thesis d Tradeyard glossed at first use; 'this part's targets'; KEY POINTS 'what a missing listing means' and 'checked for every copy' instead of 'absence' and 'audited per consumer'; Ghost Inventory callout 'with evidence for each'. To stay within 800 words: the Dealer Hub name became 'Motorvane's dealer portal', and the clause 'the 6-minute baseline ignored the 6% of listings held for human review' was cut (both readers stumbled on it; the publication-pipeline chapter keeps the figure). For the author to confirm. Rejected: Keeping the four-plus-one framing and adding a sentence to explain it (no words left).; Raising the word limit.\n- **2026-11-12** — Draft check round 3: ESCALATE (pass 31, fail 7; five blocking, all fault draft; budget spent). Close, without a fourth round: p02 now says 'The last link is the professionals' check of its output' (both readers stumbled on a link that was a group of people) and its roadmap names 'a table of when to open each chapter' (AC-1); the Seeing Double callout reads 'Blocks abusive reposts and clusters legitimate multi-listing' instead of 'Separates abuse… clusters the latter'; the connection paragraph restores 'ghost rates set'. To stay within 800 words the SLA-card gloss is shortened to 'an SLA card with a time budget per stage' and 'without using data' to 'without data'. Remaining points in open_questions.\n- **2026-11-12** — Orchestrator: max_words raised from 800 to 1,000 by check_draft's count, as for the Part II introduction (the old 800 was a prose cap without callouts), and the published Veldmark-thread facts the pass had cut to fit 800 restored: Supply Contract v1's four clauses, the published-to-Hearthly-only rule for the Lyon cluster, the 6% held for human review behind the 6-minute baseline, the Dealer Hub name, and keeping Keybridge's cross-portal report out of Hearthly's reach.\n- **2026-11-12** — Escalation resolved under the author's delegation ('auto resolve all ESCALATE topics'). KEY POINTS: bullet 3 now ends 'Last, the professionals check the result, down to lead counts, against their own systems', so the callout names the chain's last link without a fourth bullet (exactly-three rule kept). Rejected: A fourth KEY POINTS bullet (house rule of exactly three).\n- **2026-11-12** — Lyon bullet now says why Keybridge data is not used: 'agencies fear Veldmark would use their data to favor Hearthly' (ledger 'Keybridge neutrality', item 7; Mar 2027 neutrality decision). Spec p05 evidence updated to match.\n- **2026-11-12** — Callout cuts listed in open_questions restored to the published wording (rule: published callout sentences are never cut): IN THIS PART's list of the five chapter subjects, 'not just data quality' in WHY THE BUSINESS CARES, and WHY ARCHITECTS SHOULD CARE's parenthetical. The callout rewordings made on reader findings (KEY POINTS glosses 'the one flat or car behind several listings', 'stable IDs other systems can rely on', 'a time budget per stage', 'checked for every copy'; Seeing Double and Ghost Inventory rewordings) accepted under the author's delegation, 2026-11-12. Minor: 'what a missing listing means' reworded to 'what it means when a listing is missing from a feed'.\n- **2026-11-12** — Flow rubric note (a third table column or naming each Veldmark bullet's chapter) not taken; the published Veldmark list is kept, accepted under the author's delegation, 2026-11-12. Thesis-rubric minor notes (length, 'removal matters more' unqualified, PIII-2 not in the claim) and the large_to_small flow label: thesis and label kept as written, accepted under the author's delegation, 2026-11-12. The agent-written thesis and supporting claims PIII-1 to PIII-3 and the added minor criterion AC-4 accepted under the author's delegation, 2026-11-12.\n- **2026-11-13** — Round-4 blocking findings fixed under the author's delegation (fix-only pass): (1) KEY POINTS bullet 3 heading now names the professionals' check ('..., removal matters more, and professionals check the result') and ' check made the chain's last link (spec fault fixed in p02); glosses for Motorvane, Tradeyard, missing listings and per-copy checks; 6-minute baseline clause and Dealer Hub name cut for length. After round 3: close fixes to p02, the Seeing Double callout and p04; check report stale.\n- **2026-10-21** — Renamed failure patterns to match where-listing-systems-go-wrong. (AI-mediated session)\n- **2026-10-20** — Sharpening pass: 657 → 657 words; headings unchanged (match sibling part intros); long connections sentence split; meet-veldmark link added to the Veldmark thread to match sibling intros. (AI-mediated session)\n- **2026-10-19** — Added 1 inline illustration (article-illustrator); figures renumbered. (AI-mediated session)\n- **2026-10-19** — Editorial review pass: restored part-1 and part-5 links in the connections section. (AI-mediated session)\n- **2026-10-19** — Initial spec and article. (AI-mediated session)\n- **2026-11-12** — (AI-mediated session) Escalation resolved: KEY POINTS bullet 3 names the professionals' check; Lyon bullet gives the Keybridge neutrality reason; published callout wording restored; open questions closed into decision_log.\n- **2026-11-13** — (AI-mediated session) Fix-only pass on round-4 flow and known-before-new findings: KEY POINTS bullet 3, Veldmark thread bullets 1, 3 and 5 split and glossed; intro p02 referent.\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
