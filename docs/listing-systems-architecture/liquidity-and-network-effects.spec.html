<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, acceptance criteria AC-1 to AC-3, the thesis and the role are copied unchanged from the chapter's entry in journal-spec.json. Two units were added to the published text: a roadmap paragraph (p03) and a synthesis paragraph in the conclusion (p56).\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Liquidity, cross-side and same-side network effects, multi-homing and disintermediation, and why the place-and-category cell is the unit.\n- **Know:** The liquidity metric tree from fresh supply through exposure and contact to outcomes, with its counter-metrics.\n- **Believe:** Liquidity metrics, defined carefully, are the source of most non-functional requirements in a listing platform.\n- **Be able to:** Trace a publication, alert, removal or capacity target to the liquidity metric it protects, and reject one that cannot be traced.\n\n**Audience:** Chief architects, data and ML leads, product directors and engineering directors who set targets for a marketplace platform and need to justify them in business terms, or who inherit dashboards built on listing and traffic counts.\n\n**Already knows:**\n\n- APIs, databases, event streams, search engines and Kubernetes; latency percentiles and service-level objectives.\n- From marketplace-taxonomy: classifieds, lead generation, transactional and managed models; the marketplace profile.\n- From meet-veldmark: Veldmark (fictional), its brands Tradeyard, Motorvane, Hearthly and Keybridge, Safe Deal, the Common Ground program and its people.\n\n**Does not yet know:**\n\n- Two-sided markets, network effects (cross-side, same-side, asymptotic), liquidity and the cell, multi-homing, disintermediation.\n- Liquidity metrics and counter-metrics: ghost share, duplicate ratio, unsafe contact rate.\n- Learning to rank and propensity-score matching (owned by ranking and experimentation).\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given two markets with the same buyers per listing and different outcomes, the reader says what to measure and which requirements follow. *Probe:* Two countries have the same number of users per live listing, yet one gets far fewer contacts per new listing. Using only this chapter: what do you measure, and what engineering requirements could follow? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-4 | Given a reported rise in contact rate, the reader names what to check before calling it a liquidity gain. *Probe:* A team reports that contact rate in its category rose 20% this quarter. Using only this chapter: what would you check before believing liquidity improved? | `custom` | cold_reader | minor |\n| AC-5 | The reader can say what a leading portal's share of attention protects it from and what it does not, with the chapter's documented evidence. *Probe:* A portal has about 80% of the time users spend on portals in its market. Using only this chapter: what does that protect it from, what does it not, and what evidence does the chapter give? | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** What does a listing marketplace sell, and how do we measure whether it works?\n\n> **Claim:** A listing marketplace sells liquidity, the likelihood that a listing and a buyer find each other in a given place and category fast enough that both come back; because network effects work per place-and-category cell, national counts of listings and visits hide empty cells, so liquidity must be measured as matches per cell with counter-metrics, and those metrics, not engineering preference, set the platform's publication, alert, removal and peak-capacity targets.\n\n**Disputed by:** The view that a marketplace's health shows in listing counts, traffic and users per listing, and that targets such as indexing latency or peak capacity are engineering choices set by benchmarks and cost.\n\n**So what:** A team that accepts this rejects any latency or freshness objective that does not name the liquidity metric it protects, sizes search for the weekly peak rather than the daily average, and decides where to seed supply cell by cell rather than country by country.\n\n**How and why:** Tradeyard Portugal had 2.5 users per live listing against the Netherlands' 2.3, yet 46% of its new listings were contacted within 48 hours against 71%, because only 11% of its cells were liquid against 38%. In dense goods cells the first buyer to message wins, so six minutes to searchable, a sold listing still in alerts and a 48-minute brown-out at the Sunday peak (about 9,800 lost first contacts) each cost matches.\n\n**Supporting claims**\n\n- **L1** — A listing marketplace sells liquidity: the probability of a qualified match within a time window that matters, in a place-and-category cell.\n- **L2** — Network effects work per cell, so leadership is won cell by cell and national counts of listings, users and visits hide empty cells.\n- **L3** — Leadership in a cell rests on buyers' attention rather than exclusive inventory, because supply multi-homes and deals leak off-platform, so the platform's advantage lies in the freshness, quality and trust its own systems deliver, which are what the liquidity metrics measure.\n- **L4** — Liquidity must be measured as matches per cell in a metric tree with counter-metrics and model-specific success events, not as listings and visits.\n- **L5** — Liquidity metrics, not engineering preference, set the platform's publication, alert, removal and peak-capacity targets, each owned by a later chapter.\n\n## Role in the part\n\nDefines liquidity and its metrics, and makes them the source of the targets that later chapters design for. Supports P1-2 of part `part-1`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in scene to requirements: Veldmark's puzzle, then the concepts, measures and requirements that resolve it; `grouping` in tradeoffs to questions: the book's fixed closing sections)\n\nThe puzzle comes first so the concepts have a question to answer; the concepts supply the vocabulary that competition, the metric tree and the Veldmark measurements use; requirements come only after the bike and the ghosts have shown what the metrics expose. Moving the requirements before the metric tree would leave targets with nothing to trace to; moving the concepts after the tree would use 'cell' and 'network effect' before they are defined.\n\n## Introduction\n\n**Hook** (`intriguing_example`): A listing marketplace does not sell listings: sellers and buyers can list and browse anywhere. What it sells is the likelihood that a seller who lists a city bike on a Sunday evening hears from a serious buyer within the hour.\n\n**Bridge:** Marketplaces differ in where their job ends (marketplace-taxonomy), and their dashboards count listings and visits. → How well the job is done is liquidity, and its metrics turn into the platform's engineering targets.\n\n**Thesis statement** (p01 (liquidity is the product), p02 (metrics as the source of requirements, bolded) and KEY POINTS bullets 1 to 3.): A listing marketplace sells liquidity, which is local and measured per cell as matches; liquidity metrics, defined carefully, are the source of most non-functional requirements in a listing platform.\n\n**Roadmap** (p03, with the IN THIS CHAPTER callout):\n\n- Veldmark's question why Tradeyard Portugal does worse than the Netherlands at the same users per listing. *Kept in:* scene.\n- Two-sided markets, network effects, liquidity and the cell. *Kept in:* concepts.\n- How marketplaces compete for liquidity: seeding, winner-take-most, multi-homing and disintermediation. *Kept in:* competing.\n- The liquidity metric tree with its counter-metrics, applied to Veldmark's cells, the Rotterdam bike and the other brands. *Kept in:* tree, practice.\n- Metrics turned into architecture requirements, each with the chapter that owns its design. *Kept in:* requirements.\n- Trade-offs, vertical differences, failure modes, the Chief Architect's view and questions for a design review. *Kept in:* tradeoffs, vertical, failure, ca, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | claim | A listing marketplace does not sell listings; it sells the likelihood that a match happens, which is liquidity, and every other system in the book exists to produce it. | example: A seller who lists a city bike on a Sunday evening hearing from a serious buyer within the hour; a buyer finding a still-available two-bedroom flat near a metro station. |  |\n| p02 | claim | Where the previous chapter asked where a marketplace's job ends, this one asks how well the job is done, and it argues that liquidity metrics, defined carefully, are the source of most of a listing platform's non-functional requirements. |  | `contrast`: Liquidity as the product. → The link back to marketplace-taxonomy (where the job ends) and the chapter's thesis that liquidity metrics set the requirements; the four terms the chapter owns. |\n| p03 | transition | The chapter moves from Veldmark's Portugal-versus-Netherlands question through the concepts, the competition for liquidity, the metric tree and Veldmark's measurements to the requirements, and closes with trade-offs, vertical differences, failure modes, the Chief Architect's view and review questions, using dated public sources and fictional Veldmark figures. |  | `sequence`: The thesis just stated. → The order in which the chapter argues it and the kinds of evidence it uses. |\n\n## Sections\n\n### Setting the Scene at Veldmark: Same Brand, Different Markets\n\n**Controlling idea** (`example`, id `scene`): Tradeyard Portugal and the Netherlands have almost the same users per live listing yet very different outcomes, because a national average blends dense and empty cells.\n\n**Advances the thesis** (L1, L2): Poses the chapter's question with a case in which the national ratio of buyers to listings misleads and the cell explains.\n\n**Transition in:** `example`: The roadmap's first item, Veldmark's question. → The quarterly business review in April 2027.\n\n**Order of paragraphs** (`problem_solution`): Question, the data that deepens it, the contradiction, the explanation, then the new question; reversing any pair would give the answer before the reader sees the puzzle.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p04 | context | In April 2027 Henrik de Boer, Veldmark's Group CEO, asked whether Tradeyard Portugal, with growing users but weaker renewals and revenue, was a smaller Netherlands or a different kind of market, and no dashboard could answer. | scenario: Henrik de Boer's question at the quarterly business review; Tradeyard PT 1.1 million live listings, faster user growth than NL for three years, lower renewals and revenue per listing. |  |\n| p05 | evidence | Priya Raman's team built one liquidity view with one definition per metric across Tradeyard's four countries, and the national comparison put Portugal far behind on every outcome. | table: Tradeyard 2026, NL vs PT: live listings 6.1M vs 1.1M; MAU 14.2M vs 2.8M; MAU per live listing 2.3 vs 2.5; contacted within 48 h 71% vs 46%; median time to first contact 2.6 h vs 19 h; sold within 30 days 48% vs 29%; search sessions with a contact 9.4% vs 5.1%; zero-result searches 3.8% vs 11.6%. | `sequence`: The unanswered question. → Who was asked to answer it and the comparison they built. |\n| p06 | analysis | The national ratio of buyers to listings made Portugal look as liquid as the Netherlands, while every outcome metric said the opposite. |  | `contrast`: The comparison table. → The contradiction between the input ratio and the outcomes. |\n| p07 | cause_effect | Split into cells of region by leaf category, the difference was geography: far fewer Portuguese cells were liquid, so the national average blended two markets and described neither. | statistic: NL 38% of cells liquid against PT 11%, with the three minimums of a liquid cell (25 active listings, 50 searches a week, median first contact under 24 hours) given in a parenthesis; Lisbon and Porto hold 64% of Portuguese listings (the full cell table is p32's evidence). | `cause_effect`: The contradiction. → Its explanation: cells. |\n| p08 | transition | The meeting changed its question from how to grow Tradeyard Portugal to which Portuguese cells could become liquid and what that would take, which the rest of the chapter answers. |  | `cause_effect`: The cell explanation. → The new question the chapter's concepts and requirements answer. |\n\n### Two-Sided Markets and Network Effects\n\n**Controlling idea** (`definition`, id `concepts`): Liquidity comes from cross-side network effects that flatten once a cell is deep, so it is defined as a per-cell probability of a timely, qualified match.\n\n**Advances the thesis** (L1, L2): Supplies the terms (two-sided market, network effect, asymptotic, liquidity, cell) the rest of the argument uses.\n\n**Transition in:** `elaboration`: The meeting's new question about which cells can become liquid. → The concepts behind it, starting with two-sided markets.\n\n**Order of paragraphs** (`prerequisite_order`): Two-sided market, then network effects, then their shape, then the definition that rests on them, then why its cell is the unit. The scene has already introduced cells informally, so 2.3 can speak of a deep cell; defining liquidity before network effects would leave its 'place and category' part unexplained.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | definition | A two-sided market serves two groups whose value depends on each other, and in classifieds the side that creates most value for the other pays little or nothing while professionals pay. | source: Rochet and Tirole (2003): platforms must 'get both sides on board', and the allocation of prices between sides affects volume. |  |\n| p10 | definition (list) | Listing marketplaces have two kinds of network effect: cross-side effects, the main and positive engine, and same-side effects, usually negative among sellers and sometimes among buyers where supply is scarce. | statistic: Scout24 private-segment subscriptions averaged 506,937 customers in 2025, up 14%. | `elaboration`: Two groups whose value depends on each other. → Network effects and their two kinds. |\n| p11 | explanation | Marketplace network effects are asymptotic: the benefit of more participants flattens once a cell is deep, so the binding constraint is supply in the long tail of cells. | quotation: NFX: 'network effects with diminishing returns'; 'in nearly every marketplace, one side ... is harder to acquire'.; example: A Rotterdam city-bike buyer gains a lot from 5 to 50 listings and little from 500 to 5,000. | `elaboration`: Cross-side effects as the engine. → Their shape: diminishing returns. |\n| p12 | definition (list) | Sharpening the book's reference model, this book defines liquidity as the probability that, within a time window that matters, a listing gets a qualified contact and a buyer finds a suitable available listing, measured per place and category, and three parts of the definition do the work. | quotation: The Productscape reference model of a general-listings marketplace (describes no real company): value is 'enough fresh, relevant supply in a given place and category'; 'success in one metro/category does not transfer automatically'; 'a perfect match 300 km away is useless to a pickup buyer'.; figure: Figure 1, the liquidity loop (cross-side engine, same-side competition, paid visibility worth buying only while the loop turns). | `cause_effect`: Network effects that work locally and flatten. → The precise definition of liquidity built on them. |\n| p14 | explanation (list) | The cell is how the market works, not a reporting convenience: leadership is won cell by cell, network effects rarely cross borders, and cell definitions differ by vertical. | source: Parker (2010) on startups carving categories out of Craigslist.; fact: Zillow allocates share-of-voice leads per zip code. | `elaboration`: The 'place and category' part of the definition and the cell it names. → Why the cell is the unit and three consequences. |\n\n### Competing for Liquidity\n\n**Controlling idea** (`analysis`, id `competing`): Marketplaces win liquidity cell by cell, and because supply multi-homes and deals leak off-platform, a leader's advantage rests on attention and on what its own systems do with inventory.\n\n**Advances the thesis** (L2, L3): Shows how locality shapes competition (seeding, winner-take-most) and what multi-homing and leakage leave the platform to own.\n\n**Transition in:** `cause_effect`: Liquidity is per cell and leadership is won cell by cell. → How a marketplace gets a cell started and keeps it.\n\n**Order of paragraphs** (`chronological`): Follows a marketplace's life in a cell: getting started (seeding), leading (winner-take-most and its limits), then the two forces that cap a lead (multi-homing, disintermediation). Reversed, the limits would arrive before the dominance they limit.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p15 | process (list) | Entering a cell means solving the chicken-and-egg problem, and the documented solutions all lower the cost of listing or bring supply in from elsewhere. | scenario: Motorvane receives 88% of dealer listings and Hearthly 84% of listings through feeds.; fact: Facebook launched Marketplace in October 2016 on buy-and-sell groups visited by about 450 million people a month; the EC's 2024 decision concerned tying Marketplace to Facebook. |  |\n| p16 | explanation | Seeding is a phase: once a cell is liquid, the problem becomes keeping supply quality high enough that buyers keep trusting the results. |  | `time`: Seeding. → What comes after it. |\n| p17 | evidence (list) | Once a marketplace leads a country and vertical its lead tends to widen, and vertical portals document that dominance each in its own measure. | statistic: Rightmove 89% of time (Comscore) vs 75% (SimilarWeb, Data.ai, SensorTower) in December 2025; Autotrader 11x time vs nearest competitor; REA 6.3M exclusive of 12.7M; Hemnet about 90% of property sold. | `time`: A cell that has become liquid. → What happens after a marketplace leads: the lead widens. |\n| p18 | explanation | The mechanism is local cross-side effects plus an asymmetry in multi-homing (glossed here, defined below), which lets the leader capture a disproportionate share of attention, and attention turns listings into leads. |  | `cause_effect`: The dominance figures. → The mechanism that produces them. |\n| p19 | evidence | Gurley's marketplace factors explain why these markets tip, and fragmented professionals cannot easily coordinate against a leading portal. | quotation: 'High buyer and supplier fragmentation is a huge positive'; frequency 'obviously better'; 'network effects are rare but golden'. | `additional_support`: The mechanism. → A practitioner's account of why such markets tip. |\n| p20 | counterargument | Dominance has documented limits: a leader's share of attention protects it from buyers leaving, not from suppliers paying less or listing elsewhere. | fact: Autotrader forecourts fell 0.5% (1.7% in H2), partly attributed to Deal Builder roll-out concerns; the stock lever subtracted £48 from ARPR.; fact: Hemnet announced free entry-level formats on 29 September 2026 after net sales fell 23.1%; the cause is undocumented and any supply-moving reading is labeled an inference. | `contrast`: Why leads widen. → Where dominance stops protecting the leader. |\n| p21 | definition (list) | Multi-homing, taking part in several competing platforms at once, is asymmetric: professionals do it cheaply, buyers do it at first and then concentrate, and private sellers do it occasionally. | scenario: Keybridge publishes stock for 9,800 agencies, including to Hearthly's competitors.; fact: The Bundeskartellamt (October 2026) found mobile.de has a strong market position constrained by dealers' multi-homing and data export. | `elaboration`: The multi-homing asymmetry named as part of the mechanism and the suppliers' room to list elsewhere. → Its definition and three forms. |\n| p22 | cause_effect | Because supply multi-homes, inventory is not exclusive, so differentiation must come from what the platform does with it: freshness, data quality, deduplication, ranking, alerts, trust and professional tools. | quotation: NFX: multi-tenanting occurs with 'low costs or no costs' and can 'harm the defensibility of a network ... but only up to a point'; a16z lists 'prevalence of multi-tenanting' as a defensibility metric. | `cause_effect`: Multi-homing's forms. → Its architecture consequence. |\n| p23 | definition (list) | Disintermediation, completing a deal off the platform, is structural in classifieds and becomes a liquidity problem when it carries fraud, hides the outcome or undermines transaction or lead monetization. |  | `additional_support`: Supply that leaves to other platforms. → Deals that leave the platform after the match. |\n| p24 | recommendation | Network effects do not protect a marketplace against leakage, so classifieds answer it with product and trust measures rather than prohibitions. | source: Hagiu and Rothman, 'Network Effects Aren't Enough', HBR 2016, as commonly summarized (body paywalled). | `problem_solution`: The three ways leakage hurts liquidity. → The documented responses. |\n\n### The Liquidity Metric Tree\n\n**Controlling idea** (`description`, id `tree`): Liquidity is measured as a tree that follows supply through exposure and contact to outcomes and retention, with counter-metrics that catch inflation and model-specific success events.\n\n**Advances the thesis** (L4): Turns the definition into measurements per cell, as matches rather than inventory.\n\n**Transition in:** `problem_solution`: Competition and leakage change liquidity cell by cell and hide outcomes. → The metrics that show whether matches are happening.\n\n**Order of paragraphs** (`large_to_small`): The whole tree first, then the rules that make it usable, then the two refinements (success event by model, causation). The rules name metrics (time to first contact, counter-metrics) that only the table defines, so moving them first would use undefined terms.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p25 | definition | Liquidity metrics tell a marketplace whether matches happen per cell fast enough, and they are best organized as a tree from supply to outcome with counter-metrics. | table: Metric tree: supply (fresh available supply, completeness), exposure (early exposure, zero-result rate), match (contact rate, time to first contact, search-to-contact), outcome (sell-through, lead conversion, days to sell), retention (seller return, standing demand), counter-metrics (ghost share, duplicate ratio, unsafe contact rate), each with a definition and a pitfall. |  |\n| p26 | transition | Three design rules make the tree usable. |  | `sequence`: The tree. → The rules for using it. |\n| p27 | recommendation | Time to first contact must be measured from 'searchable', not 'submitted', so the platform's publication delay is separated from market demand. |  | `sequence`: Three rules announced. → The first rule. |\n| p28 | recommendation | Where outcomes are invisible, the contact is the success event. | fact: OLX (2022) trained its learning-to-rank model on purchases or 'messages/calls to sellers' because transactions are not always confirmed, and unique contacted sellers rose.; quotation: a16z 'match rate': 'How successfully can the two sides of the marketplace find each other?' | `sequence`: The first rule. → The second rule. |\n| p29 | recommendation | Every metric needs a counter-metric, because each can be improved dishonestly. | figure: Figure 2, the metric tree with dotted counter-metric branches. | `sequence`: The second rule. → The third rule. |\n| p30 | comparison | The success event depends on the marketplace model, so a group needs one tree with model-specific success events at the outcome level and common definitions elsewhere. | example: Rightmove's lead products, Zillow's pay-at-close fees and AVIV France's commission share depend on outcomes recorded outside the portal. | `elaboration`: The contact as success event where outcomes are invisible. → How the success event differs by model. |\n| p31 | counterargument | Liquidity dashboards show where matches happen, not what caused them, which is the job of experimentation. | statistic: OLX (2026): dashboards showed premium packages performing worse because sellers self-select; propensity-score matching validated by a randomized experiment found uplifts of 17.6% to 97.4%. | `contrast`: What the tree measures. → What it cannot tell: causes. |\n\n### In Practice: Veldmark's Liquidity Measures\n\n**Controlling idea** (`example`, id `practice`): Applied at Veldmark, the tree changes decisions: cells redirect Portugal's spending, the Rotterdam bike shows publication delay inside time to first contact, and ghosts and duplicates distort supply in the other brands.\n\n**Advances the thesis** (L4, L5): Shows the metrics in use and exposes the platform delays and ghosts that later become requirements.\n\n**Transition in:** `example`: The metric tree and its rules. → Veldmark's application of them, back to Priya's team.\n\n**Order of paragraphs** (`large_to_small`): Cells first (they answer the scene's question), then one listing in one cell, then the other brands; the bike makes sense only after the cell is the unit.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p32 | definition | Priya's team defined a liquid cell by thresholds on listings, searches and time to first contact and keyed cells by region and leaf category; the definition was a judgement, valuable because it was applied the same way everywhere. | table: NL 1,420 leaf categories, 17,040 cells, 38% liquid, 86% of listings in them; PT 760, 15,200, 11%, 52%; 64% in Lisbon and Porto.; figure: Figure 3, two grids of cells. |  |\n| p33 | example | The cell analysis changed three decisions, each pulling a different lever: supply acquisition in illiquid cells (the supply branch), shipping that changes the cell definition itself, and labeled radius expansion (the exposure branch). | scenario: Marketing moved to supply acquisition in the twenty largest illiquid cells; Safe Deal shipping proposed for PT goods (760 national cells instead of 15,200 regional); labeled 'nearby' radius expansion. | `cause_effect`: The cell analysis. → The decisions it changed. |\n| p34 | example | The Rotterdam city bike's thirteen minutes from submission to first contact look excellent because it sat in one of Tradeyard's densest cells. | scenario: Femke's bike, €240, listed Sunday 7 March 2027 19:42, searchable 19:48, matched 312 saved searches, first contact 19:55. | `sequence`: Cell-level decisions. → The listing-level worked example. |\n| p35 | analysis | Split at 'searchable', six of the thirteen minutes were the platform's own publication delay, which Common Ground's 90-second target (set as a requirement in the next section) would remove. | figure: Figure 4, the thirteen minutes split into six of platform delay and seven of demand.; quotation: 'the first buyer to message usually wins' (Productscape buyer journey). | `elaboration`: The thirteen minutes. → What they contain when split at searchable. |\n| p36 | example | The same bike shows ghost inventory: it left search a minute after it sold but still appeared in the next morning's alert digest, visible only when ghost share covers digests. | scenario: Sold Monday 8 March for €225 via Safe Deal 'pay at pickup', marked sold 18:10, removed from search 18:11, still in the evening digest the next morning. | `additional_support`: The bike's publication delay. → A second fault on the same listing: a ghost. |\n| p37 | example (list) | The other brands show the counter-metrics in verticals: a dealer feed left a sold car live for 26 hours at Motorvane, and duplicates overstated Hearthly's supply by 70%. | scenario: Essen Golf sold Thursday 29 April 2027; feed removal 26 hours later.; scenario: Hearthly France 1.9M listings for about 1.12M properties, 1.7 per property. | `additional_support`: Ghosts in a goods marketplace. → Ghosts and duplicates in the vertical brands. |\n\n### From Liquidity Metrics to Architecture Requirements\n\n**Controlling idea** (`cause_effect`, id `requirements`): Each branch of the liquidity tree generates a non-functional requirement with an owner chapter, and the Sunday-evening brown-out shows the cost of missing one in lost first contacts.\n\n**Advances the thesis** (L5): Traces publication, alert, removal, feed, deduplication, peak-capacity, fraud and zero-result targets to the metrics they protect.\n\n**Transition in:** `cause_effect`: The bike's six-minute delay, the ghost in the digest and the stale dealer feed. → The requirements those metrics generate.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The traceability table, a worked case of one row, then the reasoning that turns the case into a funded requirement; the cost estimate means nothing before the incident, and the incident is only an example once the table has given it a row.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p38 | claim | Most of a listing platform's non-functional requirements come from the liquidity tree, and each can be traced to a mechanism, a metric and an owner chapter. | table: Mechanism, metric, Veldmark 2027–2028 requirement and owner chapter: 90-second p95 publication; alerts within 5 minutes; removal within a minute with recheck at send time; feed reconciliation; canonical entities; peak-hour capacity; message screening; query relaxation; one governed definition.; figure: Figure 5, metrics on the left and the requirements they generate on the right. |  |\n| p39 | example | The peak-hour row is where liquidity meets reliability, as Tradeyard NL's 48-minute Sunday-evening brown-out at the weekly peak shows. | scenario: Peak about 31,000 queries/s group-wide, 70% Tradeyard; Sunday 17 January 2027 20:35 CET, p99 400 ms to 7 s for 48 minutes, about 9% of searches failed after a TV campaign, a reindex and a Solr cache eviction.; fact: Rightmove's busiest minute was 8:48 pm on a Wednesday during a prime-time ad break. | `example`: The peak-hour row of the table. → A worked example of it. |\n| p40 | analysis | Estimated in liquidity terms, the brown-out cost about 9,800 first contacts in the best cells, which turned 'search was slow' into a funded capacity case. | scenario: Nearly 10,000 queries/s on Tradeyard NL at peak (31,000 x 70% x 45% = about 9,800); about 3.4 million failed requests; about 9,800 fewer first contacts. | `cause_effect`: The brown-out. → Its liquidity cost and what the estimate changed. |\n\n### Trade-offs in Measuring and Managing Liquidity\n\n**Controlling idea** (`comparison`, id `tradeoffs`): Of the choices in measuring and managing liquidity, the sold signal is the most consequential, and inferring it is more honest for a cell.\n\n**Advances the thesis** (L4): Shows when each measurement choice fits, so the metrics are defined deliberately.\n\n**Transition in:** `contrast`: Requirements that follow from the metrics. → The choices that decide how the metrics are measured in the first place.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p41 | recommendation | The sold signal is the most consequential choice: inferring outcomes from several weak signals is less precise per listing but more honest per cell, and it must be labeled as an inference. | table: Seven choices (unit, success event, sold signal, cell definition, contact channel, seeding, paid visibility), each with two options and when each is right. |  |\n\n### Vertical Differences\n\n**Controlling idea** (`comparison`, id `vertical`): Cells, time windows, success events, multi-homing and leakage differ by vertical, so verticals compete differently and need different requirements.\n\n**Advances the thesis** (L2, L5): Shows that cells and the requirements they generate are vertical-specific.\n\n**Transition in:** `elaboration`: The trade-offs, whose answers depend on the vertical. → How cells and the other liquidity dimensions differ by vertical.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p42 | comparison | Vertical portals live with supply multi-homing and compete on audience and tools, horizontal goods marketplaces compete on cell density and speed, and tight rental markets combine both with the highest fraud risk. | table: Six verticals by cell, time window, success event, multi-homing and disintermediation risk.; scenario: Barcelona fake-rental ring, July 2027: 26 accounts, 180 fake listings about 35% below market. |  |\n\n### Failure Modes\n\n**Controlling idea** (`analysis`, id `failure`): Liquidity measurement fails in recurring ways that reward the wrong teams: inputs instead of matches, national averages, the wrong start event, ghosts, duplicates, unowned definitions and one-sided optimization.\n\n**Advances the thesis** (L4): Names the ways the metric tree is misused, tied to the chapter's failure patterns.\n\n**Transition in:** `contrast`: How the metrics should differ by vertical. → How they go wrong.\n\n**Order of paragraphs** (`grouping`): Failures of what is measured (inputs, unit, start event, ghosts, duplicates), then of who defines it, then of what is optimized; each failure recalls a point already argued, so the order follows the chapter's own order of argument.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p43 | analysis | A dashboard of inputs rewards teams for making liquidity worse; this is Vanity Liquidity. | scenario: Tradeyard Portugal's growing user count hid its thin cells. |  |\n| p44 | analysis | National averages for local markets lead to decisions that help the cells that need help least. |  | `additional_support`: Inputs instead of matches. → A second failure: the wrong unit. |\n| p45 | analysis | Measuring from submission hides the platform's own pipeline delay, and the fix is a 'searchable' event emitted by the publication pipeline. |  | `additional_support`: The wrong unit. → The wrong start event. |\n| p46 | analysis | Ghosts counted as supply inflate categories and consume alerts and contacts, and show up only if ghost share is measured in every channel; this is Ghost Inventory. |  | `additional_support`: The wrong start event. → Ghosts in the supply count. |\n| p47 | analysis | Duplicates counted as depth inflate supply and split demand until the unit becomes the real-world entity; this is Seeing Double. | scenario: Hearthly's 1.7 listings per property overstated depth by 70%. | `similarity`: Ghosts that inflate supply. → Duplicates that inflate it the same way. |\n| p48 | analysis | When nobody owns the metric definitions, every liquidity discussion becomes a discussion about definitions, so governed definitions are an architecture asset. |  | `additional_support`: Failures in what is counted. → A failure in who defines it. |\n| p49 | analysis | Optimizing ranking for one side can drive the other away, and OLX's check on unique contacted sellers is a simple guard. |  | `additional_support`: Failures of measurement. → A failure of optimization. |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `ca`): A Chief Architect makes liquidity metrics the governed source of targets: versioned with the architecture, defined once for the group, funded per cell, aimed at what multi-homing cannot copy and watched through counter-metrics.\n\n**Advances the thesis** (L5, L3): Turns the chapter's argument into decisions, owners and rules at group scale.\n\n**Transition in:** `problem_solution`: The failure modes. → The decisions and governance that prevent them.\n\n**Order of paragraphs** (`order_of_importance`): From the rule that makes targets traceable, through who owns the definitions it relies on and how targets are funded, to strategy and monitoring; funding per cell presupposes governed, cell-keyed definitions, which presuppose the tree in the repository.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p50 | recommendation | The metric tree belongs in the architecture repository so every target traces to a metric and owner, and Veldmark's forum requires each new latency or freshness objective to name the liquidity metric it protects. | scenario: Architecture advice forum rule. |  |\n| p51 | recommendation | Definitions are governed at group level and measured at cell level, with cell keys from the shared location and taxonomy services. |  | `sequence`: Where the tree lives. → Who owns its definitions and keys. |\n| p52 | recommendation | Requirements are funded in proportion to the cells they serve, so group platforms support different service levels per vertical. |  | `sequence`: One set of definitions. → Different service levels. |\n| p53 | recommendation | Multi-homing is a given, so investment goes to what it cannot copy, and neutrality commitments protect the trust that keeps professionals using the group's tools. |  | `sequence`: Funding per cell. → Where to invest against multi-homing. |\n| p54 | recommendation | Counter-metrics are the early warnings and are watched as closely as the metrics. |  | `sequence`: Investment priorities. → What to watch. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Ten questions let a reader test their own marketplace's cells, metrics and traceability in a design review.\n\n**Advances the thesis** (L4, L5): Gives the reader the chapter's tests in a usable form.\n\n**Transition in:** `sequence`: The Chief Architect's decisions. → Questions a reader can take into a review.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p55 | recommendation (list) | Ten questions test the cell definition, liquid share, start event, sold signal, ghost coverage, supply unit, traceability of targets, multi-homing, contact channels and the definition of contact. |  |  |\n\n## Conclusion: From Liquidity to History\n\n**Synthesis:** The same per-cell view that explains Tradeyard Portugal also sets the platform's targets: liquidity decides where to seed, what to measure and how fast the systems must be, so a business question and an engineering requirement are one question asked at different levels.\n\n**So what:** A team should build no latency, freshness or capacity target that cannot name the liquidity metric it protects, and should judge a market by its liquid cells, not by its national counts.\n\n**Callback:** The hook (the bike seller on a Sunday evening) and the scene (Henrik's Portugal question). Portugal is now seen as two dense metro markets plus a tail of empty cells, and the Sunday-evening bike seller as the customer of the publication pipeline.\n\n**Takeaway** (`course_of_action`): Trace every target to a liquidity metric, and reject the ones that cannot be traced.\n\n**Hand-off** to [From Newspaper Columns to Portfolios: How the Classifieds Industry Evolved](industry-evolution.html): `cause_effect`: Network effects are local and leadership is won per country and vertical. → Groups formed as portfolios of local leaders, in waves that each left systems behind.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p56 | synthesis | The answer to Henrik's question is an engineering brief as much as a market plan: the per-cell view that explained Portugal also sets how fast a listing must become searchable and reach alerts, how quickly a sold one must disappear and how much search must carry at the peak. |  |  |\n| p57 | transition | Liquidity's locality also explains the industry's shape: why marketplaces become local leaders and groups are portfolios of them, which the next chapter traces with dates and what each phase left in the systems. |  | `cause_effect`: Liquidity as local, deciding targets. → What locality did to the industry, handed to industry-evolution. |\n\n## Non-goals\n\n- Marketplace models and endpoints. See [Classifieds, Leads, Transactions and Managed Models: A Marketplace Taxonomy](marketplace-taxonomy.html).\n- Industry history. See [From Newspaper Columns to Portfolios: How the Classifieds Industry Evolved](industry-evolution.html).\n- Governed metric implementation and tracking plans. See [Data Platform for Marketplaces <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
