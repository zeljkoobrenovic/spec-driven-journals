<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, the four journal acceptance criteria, the thesis and the role are copied unchanged from the case-aviv entry in journal-spec.json. A roadmap paragraph (p04) and a conclusion section (p55, p56; p56 is the published closing paragraph moved under its own heading) were added.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** AVIV's four dated phases: assembling national portals (SeLoger 2010, Immoweb 2012, Immowelt and Immonet combined 2015, Logic-Immo 2018, Yad2, Meilleurs Agents 2019), moving up the seller funnel (Meilleurs Agents, the Ultimmo professional offer in November 2022, SeLoger opened to private sellers in 2023, commission-share seller leads), the 2021 integration intent, and the 2025 carve-out under KKR and CPP Investments with local autonomy and group functions.\n- **Know:** Why real estate resists one platform (national feed formats, disclosures, address systems, agent software and pricing norms) and how thin AVIV's public record is: no engineering blog, talks or public code, so no AVIV system can be described.\n- **Believe:** In real estate a group platform stops well short of the product, at the professional edge where the agent's software, the feed format, the disclosure rules and the pricing meet.\n- **Believe:** An integration goal needs a written layer-by-layer scope before it is staffed.\n- **Be able to:** Draw the shared boundary of a multi-country property group by capability, saying what to share as platform, what as method, and what to keep local.\n\n**Audience:** Chief and enterprise architects of marketplace groups with property portals in several countries, and engineering leaders weighing a group platform after acquisitions.\n\n**Already knows:**\n\n- What an API, a database, an event stream, a search engine and Kubernetes are.\n- How to make and defend an architecture decision.\n- Part IX's evidence rules, from part-9, and the earlier cases' reading of shared layers.\n- Global components, tenancy and consolidation sequencing, from multi-country-platforms and platform-consolidation; real estate's national requirements, from vertical-requirements; multi-homing, from liquidity-and-network-effects.\n\n**Does not yet know:**\n\n- AVIV's corporate history, owners and brands (SeLoger, Logic-Immo, Meilleurs Agents, Immoweb, Immowelt, Immonet, Yad2).\n- French real-estate terms: the agency mandate, DPE energy disclosures, DVF open transaction data, notary transaction records.\n- OpenImmo, the German real-estate feed standard.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a proposal for one platform across two countries' property portals, the reader uses AVIV's record to say which layers to share, which to keep local and what the decision record must state. *Probe:* A property group running portals in two countries proposes a single platform for both, to be extended to future acquisitions. Using only this chapter: what does AVIV's dated record show about such a goal, which layers would you share, which keep local, and what must the decision record state? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's questions, its evidence and where it ends. *Probe:* After reading only the callouts and the paragraphs before the first heading: what questions will this chapter ask, what kind of evidence will it use, and how will it end? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-4 | Every statement about AVIV's internal systems that no cited source documents sits in a callout or figure caption labeled as inference, and every company fact outside those labels carries its source and publication year. *Probe:* Is there any sentence outside an `INFERENCE, NOT DOCUMENTED` callout or a labeled figure caption that describes how AVIV builds or runs a system without a dated source, or a company fact with no source and year? | `custom` | rubric | major |\n| AC-5 | The text attributes each statement of intent and outcome to its speaker: the 2021 goal is quoted as AVIV's CEO said it, and the phrase 'fully integrated platform' is shown to be the interviewer's, not AVIV's. *Probe:* Does the chapter quote the 2021 CEO statement exactly ('...to create a European real estate marketplace'), avoid calling AVIV's goal 'unified', and make clear that 'fully integrated platform' comes from the interviewer's question in December 2025? | `custom` | rubric | minor |\n\n## Thesis\n\n**Question:** How much of a property portal can a group share across countries, as AVIV's acquisitions, 2021 integration intent and 2025 turn to local autonomy show it from the outside?\n\n> **Claim:** AVIV's documented integration moves were commercial and data-driven, not a shared listing platform: it shared valuation science and a bundled professional offer to capture sellers early and route them to paying agents, and its 2021 goal of 'a European real estate marketplace', never scoped in public, gave way by December 2025 to local autonomy with group functions 'where they create clear advantages'; the record therefore places a property group's shared boundary at infrastructure, data, engines and methods, short of the professional edge where national feed formats, disclosure rules, agent software and pricing norms meet, and it shows that an integration goal without a written scope cannot be changed cheaply.\n\n**Disputed by:** The view that national property portals are similar enough (listings, search, agents, leads) for a group to run them on one European product platform, and that AVIV's 2025 reversal reflects its new owners' preferences rather than the vertical's limits.\n\n**So what:** A Chief Architect of a multi-country property group shares infrastructure, data, identity tooling and engines without hesitation, shares valuation and ranking methods as group science, and keeps feed adapters, disclosure validation, professional products and lead routing local; requires a layer-by-layer scope, markets per stage and an exit criterion per stage before staffing any integration goal; governs valuation as a supply product with an owner and published accuracy definitions; and builds the attribution chain behind commission-share revenue as local, consented and auditable work.\n\n**How and why:** Axel Springer bought SeLoger (2010), 80% of Immoweb (2012), Immowelt combined with Immonet (2015, cleared by the Bundeskartellamt as Germany's second and third portals) and Logic-Immo (cleared in 2018), with Yad2 and Meilleurs Agents (bought for €200 million in September 2019 to 'widen the value chain'). Its integration moves were Ultimmo, one professional offer across SeLoger, Logic-Immo and Meilleurs Agents (November 2022), the 2023 opening of SeLoger to private sellers and seller leads monetized through commission share; Immowelt and Immonet still ran side by side nine years after combining. The 2021 CEO statement and the 2025 interview are the only public statements of intent and outcome; the phrase 'fully integrated platform' is the interviewer's. The carve-out became effective in April 2025 and a sale of Yad2 was signed in December 2025. AVIV publishes no engineering material, so the boundary is traced from strategy, not systems.\n\n**Supporting claims**\n\n- **V1** — AVIV is a portfolio of national portals bought one at a time as whole businesses, and its public record is corporate, not technical, so every statement about its systems is either dated evidence or a labeled inference, and the open questions are listed rather than filled.\n- **V2** — Real estate's national structure (agencies multi-homing through their own software, national feed formats, disclosures, address and property data, and pricing norms) puts the professional edge beyond the reach of a group platform.\n- **V3** — AVIV's documented integration moves were commercial and data-driven: valuation science, a bundled professional offer within France and the opening of SeLoger to private sellers served one seller funnel, monetized locally through commission share, with no shared listing platform in the record.\n- **V4** — The 2021 goal of 'a European real estate marketplace' was never scoped in public and gave way by December 2025 to local autonomy with group functions 'where they create clear advantages', a reversal whose size and cause the record does not show.\n- **V5** — The record places a property group's shared boundary at infrastructure, data, engines and methods, short of the professional edge, and shows that an integration goal needs a written layer-by-layer scope before it is staffed.\n\n## Role in the part\n\nTraces from the outside where a property group's shared boundary sits, and shows an integration goal of unpublished scope giving way to local autonomy. Supports P9-1, P9-4, P9-5 of part `part-9`.\n\n## Flow\n\n**Pattern:** `chronological` (also `grouping` in resists to evidence-stops: cross-phase views (by national requirement, by asset type, by option, by risk, by gap); `problem_solution` in chief-architect to questions: rules from the record, their test against the book and Veldmark, and questions for the reader's group)\n\nReading rules and the timeline come first because every later sentence is a dated fact, a reading or an inference, and AVIV's evidence is thinner than any other case's. The four phases run in time order because the case's lesson is a sequence: portals bought whole, a funnel shared commercially, an integration goal announced, then reversed; read out of order, the 2025 reversal would have no goal to reverse. The cross-phase views come only after all four phases because each one (the national requirements, the asset types, the trade-offs); the two readings of the record (by country, by asset type) come before the options they add up to uses facts from every phase; the evidence limits close that group so the rules that follow do not outrun them. The author's rules, the comparison and the questions come last because they apply what the record has shown (decision of 2026-10-19: four dated phases, because the evidence documents strategy direction, not systems). The phases overlap in time (the 2021 goal falls inside the 2019–2023 funnel phase): they are ordered by the start of each strand, so the funnel's products are read whole before the goal that ran beside them.\n\n## Introduction\n\n**Hook** (`intriguing_example`): Axel Springer bought national property portals one at a time (SeLoger in France, Immoweb in Belgium, Immowelt in Germany, Logic-Immo in France again) with an Israeli horizontal site, Yad2, and a French valuation business, Meilleurs Agents, gave them a common name and a common technology leadership, and in 2021 announced the goal of a European real-estate marketplace.\n\n**Bridge:** A Chief Architect of a group that has bought property portals in several countries and is asked whether they should run on one platform. → AVIV made that move in public, so its record can be read for how much of a property portal a group can share across countries, even though AVIV has published almost nothing about its systems.\n\n**Thesis statement** (KEY POINTS bullets 2 and 3 and paragraph p03.): In real estate, ingestion formats, mandatory disclosures, address systems, agent software and monetization norms are national, so a group platform has to stop well short of the product; AVIV's documented moves (shared valuation science, a bundled professional offer, then local autonomy with group functions) trace that boundary from the outside.\n\n**Roadmap** (Paragraph p04, after the argument.):\n\n- Set the reading rules and the limits of the evidence, then give the dated timeline. *Kept in:* how-to-read, timeline.\n- Follow AVIV's four phases in order: assembling national portals, moving up the seller funnel, the integration intent, and separation and local autonomy. *Kept in:* phase-1, phase-2, phase-3, phase-4.\n- Look across the phases: why real estate resists one platform, the differences between asset types, the trade-offs, the failure modes and where the public evidence stops. *Kept in:* resists, verticals, trade-offs, failure-modes, evidence-stops.\n- End with my decision rules, a comparison with the book's patterns and with Veldmark's Hearthly, and questions to ask of your own group. *Kept in:* chief-architect, comparison, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | AVIV Group neither built its platform nor bought marketplaces that already shared one: Axel Springer bought national property portals one at a time, gave them a common name and technology leadership and in 2021 set a European goal, which makes the case a test of how much of a property portal can be shared across countries. | fact: SeLoger (France), Immoweb (Belgium), Immowelt (Germany), Logic-Immo (France), Yad2 (Israel) and Meilleurs Agents (France) bought one at a time; the 2021 goal of a European real-estate marketplace. |  |\n| p02 | explanation | The evidence is thin and corporate, enough to show the direction of AVIV's strategy and the funnel it served but not to describe a single system. | fact: AVIV's GitHub organization has no public repositories, its Medium publication had no posts when fetched in October 2026, and no conference talk by AVIV engineers was found; what exists is corporate history, regulatory decisions, trade-press interviews and product announcements. | `contrast`: A group whose integration question is worth testing. → How little evidence there is to test it with. |\n| p03 | claim | The record tests the book's argument that in real estate national ingestion formats, disclosures, address systems, agent software and monetization norms stop a group platform well short of the product, and AVIV's documented moves trace that boundary from the outside. |  | `elaboration`: Evidence enough to show direction, not systems. → The argument that evidence tests and the boundary it traces. |\n| p04 | transition | The chapter sets the reading rules and a dated timeline, follows AVIV's four phases in order, looks across them (why real estate resists one platform, asset types, the trade-offs, failure modes and where the evidence stops), and ends with the author's rules, a comparison that applies the same boundary to Veldmark's Hearthly, and questions to ask, and a closing. |  | `sequence`: The boundary the record traces. → The route through the chapter, ending with the boundary applied to Hearthly. |\n\n## Sections\n\n### How to Read This Case\n\n**Controlling idea** (`definition`, id `how-to-read`): The case keeps documented fact, the author's reading and labeled inference apart, and AVIV's evidence is thinner than any earlier case's, so weak signals are named and not used.\n\n**Advances the thesis** (V1): Sets the evidence rules and says how thin the record is before any fact is used.\n\n**Transition in:** `elaboration`: The introduction's promise of reading rules and the limits of the evidence. → The rules themselves.\n\n**Order of paragraphs** (`large_to_small`): From the rules every Part IX case follows, to how far this case's evidence reaches, to the signals deliberately left out, to the one fictional element and where it appears. The rules come first because the limits are stated in their terms.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | definition | Part IX cases separate three kinds of statement: a documented fact carries its source and year, the author's interpretation is marked 'my reading' or sits in the Chief Architect's view, and a reference-architecture inference appears only in a labeled callout and never describes how AVIV is built. |  |  |\n| p06 | explanation | AVIV's evidence limits are tighter than Adevinta's, because AVIV has never been listed and publishes no financial breakdown, so most evidence comes from two trade publications, owners' releases and competition authorities. | fact: A segment inside Axel Springer (delisted 2020) before 2025 and a privately held joint venture since April 2025; AVIV 'does not publish' a financial breakdown. | `contrast`: The rules every Part IX case follows. → How much tighter AVIV's limits are than Adevinta's. |\n| p07 | explanation | Three kinds of weak signal (job advertisements seen only as search snippets, a tech-stack aggregator's profile and former employees' CVs) were found and deliberately not used as fact, because they say nothing about architecture. |  | `additional_support`: The sources the case relies on. → The sources it found and set aside. |\n| p08 | context | Veldmark appears only in the final comparison (one earlier sentence points ahead to it), and Hearthly's overlap with AVIV's French business is a teaching device, not a disguised description of AVIV or SeLoger. |  | `contrast`: The real-world evidence and its limits. → The one fictional element and where it appears. |\n\n### Timeline: AVIV in Dated Events\n\n**Controlling idea** (`evidence`, id `timeline`): AVIV's record from 2010 to December 2025 is a dated sequence of acquisitions, competition clearances, seller-funnel products, an integration goal, a carve-out and a reversal.\n\n**Advances the thesis** (V1, V4): Gives every later phase its dated anchor.\n\n**Transition in:** `sequence`: e`: The 2008 method built on local data. → The 2019 purchase and the intent to share that method across countries. |\n| p21 | evidence | By 2022 Meilleurs Agents reported a 45-person data team and a self-reported 6% median error for 2021, with no independent audit or methodology note found. | quotation: Thomas Lefevre: 'it is not complicated to make an estimation tool. What is complicated, however, is to make a fair estimate'; 'the median estimate error of our valuations against final transaction value in 2021 was just 6%'. | `time`: The 2019 intent to share valuation science. → What that science looked like in 2022: the team and its self-reported accuracy. |\n| p22 | analysis | My reading is that the valuation tool is a supply-acquisition product: it reaches a likely seller months before they choose an agent, and that moment can be sold to agents as a seller lead. | case: The same logic as Rightmove's Online Agent Valuation and Zillow's Zestimate, compared in case-property-portals; the modeling side in ml-platform. | `cause_effect`: Valuation science the group meant to share and kept investing in. → What that capability does for supply. |\n| p23 | evidence | In October 2022 Franck Le Tendre described combining SeLoger's relationship with professionals and Meilleurs Agents' mandate acquisition, with the prospecting map already rolled out across the group's entities. | source: Le Tendre interview. | `sequence`: Valuation as a way to reach sellers. → AVIV France's plan to combine that with SeLoger's relationship with professionals. |\n| p24 | evidence | In November 2022 AVIV launched Ultimmo, one professional offer across SeLoger, Logic-Immo and Meilleurs Agents that bundles visibility with seller detection among buyer contacts. | statistic: More than one million visits a day across the three brands, 630,000 sellers identified each month, two sales in three beginning on a group platform; features from listing distribution to an estimation tool and a prospecting map; Caroline Evans de Gantès: 'Les professionnels ne sont plus seulement en demande de mandats'. | `time`: The plan to combine the two brands' strengths, described in October 2022. → The offer launched a month later. |\n| p25 | analysis | Ultimmo is the only cross-brand integration in AVIV's public record described at the level of features, and it is commercial: in my reading its features need shared data and a shared professional account, but nothing says they required a shared listing or search platform. |  | `emphasis`: The plan and the offer that carried it out. → What kind of integration it is. |\n| p26 | evidence | In late June 2023 SeLoger opened free sale listings to private sellers to capture undecided sellers and direct them to professionals, a move that angered many agents. | quotation: Le Tendre: professionals' share flat for 15 to 20 years, about a third of sellers who try alone give up, 'notre objectif est de capter ces indécis et de les diriger vers des professionnels'; 800 people on innovation; about 6,000 private sale listings at the end of September 2023 against just under a million professional listings. | `sequence`: An offer that sells seller prospects to agents. → A new entry point for sellers in 2023. |\n| p27 | evidence | AVIV France monetizes the seller leads through a commission-share model, so the funnel's revenue event happens outside the portal, in a local transaction. | quotation: Seller leads monetized 'through a commission-share model'.; figure: Figure 4: the seller funnel drawn from the public product descriptions (2019–2023), not AVIV's systems; every entry point produces a seller lead.; reasoning: INFERENCE, NOT DOCUMENTED callout: a commission-share model needs a lead ledger, homeowner consent and reconciliation against closings, and is local by nature. | `cause_effect`: A funnel that routes sellers to agents. → The revenue model behind it. |\n\n### Phase 3: The Integration Intent (2021–2024)\n\n**Controlling idea** (`evidence`, id `phase-3`): The integration phase is documented only as statements of intent, with leadership and hiring behind them and no published scope.\n\n**Advances the thesis** (V4): Shows the 2021 goal and its unknown scope.\n\n**Transition in:** `time`: The French funnel built from 2019 to 2023. → The group technology goal, set in 2021 while that funnel was still being built (so the phase overlaps Phase 2) and documented only as intent.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): What was said, then what was not said, then my reading of the gap; the reading needs both before it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p28 | evidence (list) | The integration phase began in 2021, while the French funnel was still being built, and is documented almost entirely by statements of intent: the 2021 CTO appointment and CEO goal, the 2023 hiring plan, the 2024 German rename and the 2024 signing release. | quotation: Ait Voncke: 'we are aligning our tech roadmap across the organization to create a European real estate marketplace', announcing Brent McLean (ex-eBay Classifieds Group and Domain) as CTO.; fact: 300 technology, product and data hires planned for 2023 and 'write the future of real estate'; Felix Kusch on 'the know-how and innovative strength of an international tech company' (2024); 'significant platform and technology investments over the past five years' (2024). |  |\n| p29 | evidence | No public source describes what the European marketplace or the 'fully integrated platform' was meant to contain, and the latter phrase comes from an interviewer, not from AVIV. | source: No source describes a shared listing service, search engine, agent tools, billing or infrastructure, a portal moving onto a group platform, a migration milestone or a cost; 'fully integrated platform' appears in the interviewer's question of December 2025. | `contrast`: What was said. → What was not said. |\n| p30 | analysis | ol of Yad2 from March 2025 through the carve-out; whether Yad2 still sat inside AVIV is not clear; real estate 56% of Yad2's projected 2025 revenue. | `time`: New owners from April 2025. → Their first visible portfolio move. |\n| p33 | evidence | The December 2025 interview with Immowelt's new head records the reversal: the interviewer's question describes AVIV rowing back on a fully integrated platform, and Theo Mseka describes strengthened local autonomy plus group-level functions 'where they create clear advantages'. | quotation: 'We recently saw AVIV Group row back on its plans for a fully integrated platform for all its European portals' (interviewer); 'AVIV has strengthened the autonomy of its local businesses'; 'we continue to operate group-level functions where they create clear advantages'; 'sometimes local and sometimes cross-group'; 'run at their own pace'. | `elaboration`: The ownership and portfolio facts of 2025. → The clearest statement of the model that followed. |\n| p34 | evidence | Local autonomy is visible market by market: each market built its own adjacencies around its own transaction, valuation and commission share in France, tax and financing services in Germany, valuation data in Belgium. | quotation: Theo Mseka: 'the subscription model remains the core model in the German market today'; AI features including 'a tool for creating high-quality property descriptions'; Kaufpreis-Aufteilung.com, nutzungsdauer.com and BauDarlehen24 bought in 2025. The dated January 2025 report in the timeline records two of the 2025 deals, majority stakes in tax-depreciation services.; fact: Immoweb agreed to buy Realo, which also sells 'data as a service' and valuations, in January 2024. | `elaboration`: Mseka's account of strengthened local autonomy, in the same interview. → What local autonomy looks like market by market, in Germany and Belgium. |\n| p35 | analysis (list) | My reading has three conditional parts: the reversal is real but its size is unknown, ts. | source: Service-Public.fr on DPE (January 2026); OpenImmo e.V. (October 2026); Mseka interview (2025); FrenchWeb (2008); Immoweb–Realo (2024). | `elaboration`: The table. → Where its entries come from. |\n| p38 | analysis | OpenImmo is a German standard, yet AVIV is its French member: the only public sign that AVIV has looked at a common ingestion format beyond Germany, with nothing found about how it uses it. | fact: OpenImmo e.V. lists AVIV Group as its member from France.; reasoning: INFERENCE, NOT DOCUMENTED callout: a federated multi-country property group puts landing zones, security, identity tooling, the data platform and ML tooling at group level, offers a shared ingestion engine and core schema extended per country, may share a search engine with local ranking, shares valuation methods, and keeps monetization, billing, agent CRM and professional tools local.; figure: Figure 5: a labeled reference architecture, not AVIV's: shared core of infrastructure, data, identity, engines and methods; local edge of everything an agent, regulator or homeowner sees. | `contrast`: National ingestion standards. → A German standard with AVIV as its French member, AVIV's one public link to a common format. |\n\n### Vertical Differences in the Record\n\n**Controlling idea** (`comparison`, id `verticals`): AVIV's asset types behaved differently: property portals kept the edge local, valuation services shared methods, brokerages raised trust limits on data, and the horizontal asset was separated first.\n\n**Advances the thesis** (V2, V3): Shows that what can be shared depends on the asset type, and that agent trust limits data sharing.\n\n**Transition in:** `elaboration`: The record read by national dimension, ending in a shared core and a local edge. → The same record read by asset type.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p39 | comparison | Read by asset type rather than by country, AVIV's record shows a tform; local autonomy with group functions), each with what AVIV's record shows and when it is right or fails. |  |\n\n### Failure Modes the Record Exposes\n\n**Controlling idea** (`analysis`, id `failure-modes`): The record exposes five risks: an integration goal with no published scope, duplication behind two same-country brands, valuation treated as a feature, funnel moves that anger the supply side, and group functions defined after the fact.\n\n**Advances the thesis** (V4, V5): Turns the record into risks a group can check for.\n\n**Transition in:** `cause_effect`: What the record shows by asset type and by option. → The risks it exposes.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p42 | analysis (list) | Read by option and by asset type, the record exposes five failure modes, each tied to a dated move: scope never published, two of everything behind two brands, valuation filed as a feature, funnel moves that anger agents, and group functions defined after the fact. |  |  |\n\n### Where the Public Evidence Stops\n\n**Controlling idea** (`evidence`, id `evidence-stops`): The questions that matter most to an architect, about the integrated platform, group functions, shared stacks, ingestion, valuation and attribution, are answered by no public source, and two facts are volatile.\n\n**Advances the thesis** (V1): Lists the gaps rather than filling them.\n\n**Transition in:** `contrast`: What the record exposes. → What it cannot answer.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p43 | evidence | Eight questions that matter to an architect are not answered by any public source, and the chapter does not fill them with inference. | table: Eight questions (the integrated platform, the remaining group functions, shared stacks behind same-country brands, ingestion, valuation method, commission-share attribution, what engineers run, Housell, Homeday and Zumper) with what is public and what is not. |  |\n| p44 | context | Two facts are volatile as of October 2026, the closing of the Yad2 sale and the status of immonet as a separate brand, and readers should check both. |  | `additional_support`: Questions no source answers. → Facts that may change. |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `chief-architect`): From a record of strategy rather than systems, the author draws five rules for where a property group's platform boundary sits and how to commit to it.\n\n**Advances the thesis** (V5): States the boundary and the scope rule as the author's recommendations.\n\n**Transition in:** `conclusion_summary`: What the record shows and where it stops. → What the author takes from it.\n\n**Order of paragraphs** (`large_to_small`): The boundary rule first, then the scope that commits to it, then the two capabilities that cross it (valuation, attribution), then the handover rule that applies to every group function; each later rule assumes the boundary.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p45 | transition | What I take from AVIV is less about systems, which are not public, than about where the boundary of a property group's platform sits. |  |  |\n| p46 | recommendation | Draw the shared boundary by capability and expect it to stop short of the agent, at the professional edge where the agent's software, the feed format, the disclosure rules and the pricing meet. |  | `elaboration`: Where the boundary sits. → The rule that draws it. |\n| p47 | recommendation | Write down a layer-by-layer scope, the markets in each stage and an exit criterion per stage for any integration goal before staffing it. |  | `sequence`: A boundary drawn by capability. → Committing to it in writing before staffing. |\n| p48 | recommendation | Treat valuation as a supply product with its own owner, accuracy definitions, data-rights checks and a line between an estimate that informs and one that commits money. |  | `elaboration`: A shared boundary that keeps methods central. → The method that drives supply, valuation. |\n| p49 | recommendation | Keep the attribution chain behind commission-share revenue local and explicit, designed as legal, auditable work rather than bolted onto a listing service. |  | `similarity`: Valuation governed as a product. → The revenue chain that follows the seller lead. |\n| p50 | recommendation | Design every group function to be handed over, tenant-scoped from its first release, because a business can be sold within months of a carve-out. | fact: Yad2's sale was signed about seven months after the carve-out became effective. | `additional_support`: Functions kept local or shared by design. → Shared functions that may have to leave with a business. |\n\n### Comparing the Case to the Book's Patterns and to Veldmark\n\n**Controlling idea** (`comparison`, id `comparison`): AVIV's record supports the book's real-estate patterns and is consistent with its multi-country ones, and applied to Veldmark it supports sharing engines and methods under Hearthly while rejecting a single product platform until the Spanish market is profiled.\n\n**Advances the thesis** (V5): Tests the boundary against the book's claims and applies it to the running example.\n\n**Transition in:** `elaboration`: The author's rules, resting on AVIV's public record of strategy rather than systems. → Their test against the book's patterns and Veldmark's choices.\n\n**Order of paragraphs** (`large_to_small`): The book's patterns first, then Veldmark's four parallel choices, then one worked decision; each step narrows from the book to one proposal. The worked decision needs the four choices before it, and the Veldmark choices are read against the patterns' verdicts; reversed, the advice would rest on unexplained parallels.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p51 | comparison | The author's rules rest on a record of strategy, and that record, set against the book's patterns, supports the real-estate, valuation, feed-contract and funnel-metric claims and is only consistent with the multi-country and consolidation claims. | table: Six book patterns (vertical-requirements, multi-country-platforms, platform-consolidation, ml-platform and monetization-models, listing-ingestion, liquidity-and-network-effects) with AVIV's record and a verdict.; reasoning: Two sentences before the table state why four claims are supported (dated evidence) and two only not contradicted (a stated end state and a reversal, not what was shared or in what order). |  |\n| p52 | comparison | Veldmark's Hearthly, a real-estate portal in France and Spain whose group follows 'share platforms, not products', is introduced as the fictional group's counterpart to AVIV's French business. | scenario: Hearthly: France (acquired 2023) and Spain (acquired 2025), €395 million 2026 revenue, 84% of listings via feeds from about 160 vendors, Valuo trained on DVF and Hearthly listing data; Common Ground (2027–2030) and its principle. | `contrast`: The real record tested against the book. → The fictional group, labeled as such. |\n| p52a | comparison (list) | AVIV's record sharpens four of Veldmark's choices, each named and glossed in its own item before the table tests it. | scenario: Four choices (Supply Contract v1, Hearthly's applications on Google Cloud through 2028 while its search moves to the group's shared OpenSearch platform on AWS by end of 2028, the Valuo commission-share pilot in Lyon in 2028, Keybridge neutrality) against AVIV parallels, in a table. | `elaboration`: Hearthly and Common Ground. → The four choices the case sharpens, one per list item. |\n| p53 | recommendation | Faced with a proposed single Hearthly platform for France and Spain, I would approve the parts that pass the clear-advantage test and reject a single product platform until the Spanish market is profiled, with a decision record that states which layers are shared and what would change the split. | scenario: Claire Fontaine's 2027 proposal; Hearthly France de-duplicates 1.9 million listings into about 1.12 million properties (1.7 per property); Hearthly Spain rebranded only in 2026; Valuo Spain planned for 2028; advice to Ingrid Halvorsen. | `example`: Four choices the case sharpens. → The 2021 question put to Hearthly as a worked decision. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Nine questions let a reader test their own group's shared boundary, integration scope, valuation governance, attribution and separability.\n\n**Advances the thesis** (V5): Turns the boundary and the scope rule into questions for the reader's group.\n\n**Transition in:** `elaboration`: A decision record that states the shared and local layers. → The questions that record must answer in the reader's own group.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p54 | recommendation (list) | Nine questions turn the case's lessons into checks on a group's own capabilities, supply edge, disclosures, valuation, commission share, duplicated brands, integration scope, agent trust and separability. |  |  |\n\n## Conclusion: From AVIV to the Property Portals\n\n**Synthesis:** Read in order, the four phases and the cross-phase views answer the chapter's question with one boundary seen twice: what AVIV shared in public (valuation science, a professional offer within one country, group functions 'where they create clear advantages') is what travels without touching the agent, and the 2021 goal and the 2025 shift are that boundary first announced without a written scope and then corrected in an interview.\n\n**So what:** A Chief Architect who writes the boundary down layer by layer before staffing an integration goal can move it later without a write-off; one who does not inherits AVIV's position, a goal that could be reversed but never evaluated.\n\n**Callback:** The hook: national portals bought one at a time, given a common name and technology leadership, and asked in 2021 to become one European marketplace. The reader can now say which parts of those portals the record shows being shared (methods, a commercial offer, group functions) and which stayed national (the feed edge, disclosures, agent products and monetization).\n\n**Takeaway** (`course_of_action`): Draw the shared boundary by capability and write its scope down before staffing; read case-property-portals next for what one portal's supply, properties and valuation models demand.\n\n**Hand-off** to [Zillow, Rightmove, Idealista and REA: What Property Portals Teach](case-property-portals.html): `elaboration`: AVIV's closing: how little of a property portal travels across borders, seen from the outside. → The question underneath AVIV's: what licensed supply, durable properties and valuation models demand of one portal, read through the portals that publish the most about their economics and engineering.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p55 | synthesis | My reading is that the four phases show the same boundary in two ways, in what AVIV shared and in how its goal changed from an unscoped 2021 goal to the 2025 correction, and a group that writes that boundary down layer by layer before staffing an integration goal can move it later without a write-off. |  |  |\n| p56 | transition | AVIV shows from the outside how little of a property portal travels across borders, and case-property-portals takes up the question underneath it: what licensed supply, durable properties and valuation models demand of one portal, read through the portals that publish the most. |  | `elaboration`: A boundary that stops at the professional edge. → What lies on the other side of it, inside one portal. |\n\n## Non-goals\n\n- A company profile,     (function () {
        const data = JSON.parse(document.getElementById('data').textContent);

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;

                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,

                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');

            while (i < lines.length) {

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
