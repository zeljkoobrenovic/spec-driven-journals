<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, acceptance criteria AC-1 to AC-4, thesis and role are copied from the journal spec. The conclusion was extended in this pass to carry Part VIII's and the journal's closing.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The book's argument restated part by part: each part as a stage of the liquidity machine, the guarantee it must give, the liquidity metric it protects and the failure pattern when it does not, and the four ideas that run through all parts.\n- **Know:** Stressor analysis, attractors and residues; the three rates of change (contracts and identifiers, engines, content); portability of listing data and events; the centralization pendulum and the cost to reverse; technical debt as a liquidity tax; the twelve marketplace fitness functions; the architecture function's own evolution.\n- **Believe:** A target state assumes a known future; a marketplace group should design against stressors instead.\n- **Believe:** What lasts a decade is a few contracts, identifiers and measures, and a group should steer by fitness functions tied to matches rather than by program milestones.\n- **Be able to:** Run a stressor analysis on a marketplace group and rank components by the residues they carry.\n- **Be able to:** Estimate what a carve-out of one brand would cost and which residues would shorten it.\n- **Be able to:** Define marketplace fitness functions with owners, counter-metrics and drills.\n\n**Audience:** Group Chief Architects, CTOs and CPOs of multi-country, multi-vertical marketplace groups, and the architects who will inherit their decisions.\n\n**Already knows:**\n\n- What an API, a database, an event stream, a search engine and Kubernetes are, and how to make and defend an architecture decision.\n- The earlier chapters of the book, or how to navigate to them: liquidity per cell, the failure patterns, the listing event contract, Veldmark and Common Ground.\n\n**Does not yet know:**\n\n- Residuality theory: stressor, attractor, residue, naive and residual architecture.\n- Fitness functions from evolutionary architecture.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a ten-year platform plan, the reader replaces its target state with a stressor analysis and a fitness scorecard and says where long-term investment belongs. *Probe:* A marketplace group presents a ten-year target-state diagram with one shared product platform for all brands, tracked by program milestones. Its owner may sell a brand within three years, a new platform law is expected, and a fifth of one brand's search traffic may soon arrive through an AI assistant. Using only this chapter: what do you put in place of the plan, and where should the long-term investment go? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-4 | The chapter's final section performs the journal's closing: it synthesizes the parts as stages of the liquidity machine, restates the introduction's central claim, and returns to the introduction's opening question of why a site whose every team reports green loses contacts per listing to a smaller competitor. | `conclusion_calls_back_to_introduction` | rubric | major |\n| AC-5 | Given three decisions, the reader places each in its rate of change and says how it may change. *Probe:* Using only this chapter: in which layer do these three belong, and how may each be changed: the group listing ID format, the managed search engine, and a brand's package prices? | `custom` | cold_reader | minor |\n| AC-6 | The reader explains why a stressor workshop combines stressors and what Veldmark's combined scenario found. *Probe:* Using only this chapter: why does a stressor analysis combine several stressors into one scenario, and what did Veldmark's combined scenario find? | `custom` | cold_reader | minor |\n| AC-7 | The final section performs Part VIII's closing: it states what the five chapters do together, says why it matters and returns to the four questions the part introduction ends on (Part VIII AC-4, checked here). *Probe:* Does the final section state something about Part VIII that no single chapter states, say why it matters, and return to the four questions the part introduction ends on (what to change first, who owns it, how you will know it worked, what must stay true)? | `custom` | rubric | minor |\n\n## Thesis\n\n**Question:** How does a Chief Architect keep a marketplace platform coherent over ten years of acquisitions, verticals, regulations and technology shifts?\n\n> **Claim:** Over a decade a Chief Architect should not steer toward a target state. Instead: write down the argument the platform serves (turning fresh, trustworthy supply into matches, cell by cell, at a cost the business can carry); run a stressor analysis every year and after every capital event to find the few structures that survive many stressors (the listing event contract, stable identifiers, identity with pairwise identifiers, tenant-partitioned data) and spend design attention there, choosing engines for replaceability and changing content as data; write the cost to reverse into every sharing decision, so that moving a capability between central and local control is a costed, reversible decision rather than a reorganization; and steer by about a dozen marketplace fitness functions, each with an owner, a counter-metric and the failure pattern it guards against, with drills for rebuild and separability, reviewed every quarter in place of program milestones.\n\n**Disputed by:** The standard architecture-program practice of drawing a ten-year target-state diagram, executing it as a program with milestones, fixing once what is central and what is local, and reporting progress by milestones delivered, listings and visits.\n\n**So what:** A Chief Architect who accepts this owns the argument and the top layer of contracts and identifiers and leaves engines to platform teams and content to brands; keeps the stressor table in the architecture repository and re-runs it after every change of owner, portfolio or law; makes separability a review criterion like security, proved by a yearly tenant-exit tabletop; and shows the board the stressor table and the separability estimate once a year and the fitness scorecard every quarter.\n\n**How and why:** Between 2016 and 2026 Schibsted pitched one global product and tech organization, demerged Adevinta, which bought eBay Classifieds Group, set out to converge two of its largest platforms, was taken private and moved to a decentralized, standalone model; Prosus exited OLX Autos and Zillow closed Zillow Offers. None had the decade it planned. At Veldmark's November 2027 stressor workshop, 11 of 14 stressors touched the listing event contract and core, 8 identity, 8 the data platform and 2 the media service; a combined scenario of selling Hearthly Spain amid a generated-photo fraud ring found one missing residue, source-tenant provenance on the shared block list. With the separability residues, a 2030 Hearthly carve-out needs transitional services for seven capabilities for about nine to twelve months; without them, an estimated twenty months or more. The advice forum adopted a twelve-function fitness scorecard on 8 December 2027.\n\n**Supporting claims**\n\n- **L1** — The book's argument defines what must stay true: a listing marketplace is a liquidity machine whose every part designs one stage with a guarantee, a protected liquidity metric and a failure pattern, and four ideas run through all the parts.\n- **L2** — Target states fail in marketplace groups because ownership, regulation and demand channels change within a decade, so a group should plan for properties, finding them with stressor analysis and checking them with fitness functions.\n- **L3** — Decisions change at three rates; design attention belongs disproportionately on the top layer of contracts and identifiers, with engines chosen for replaceability and content changed as data, and portable data and events keep the systems replaceable.\n- **L4** — A stressor analysis, run every year and after every capital event, finds the residues that survive many stressors, ranks components by the residues they carry, and turns a carve-out question into a labeled estimate, so separability is designed in and tested before it is needed.\n- **L5** — Because the swing between central and local control is driven by forces architecture does not control, the cost to reverse belongs in every sharing decision, with contracts shared first and product platforms last.\n- **L6** — A group steers by about a dozen marketplace fitness functions, each with an owner, a counter-metric and a failure pattern, with drills for rebuild and separability, reviewed every quarter in place of program milestones, and classifies its debt and measures its architecture function by the same instrument.\n\n## Role in the part\n\nRestates the book's argument as the liquidity machine, turns it into a stressor analysis and a fitness scorecard for steering the platform over a decade, closes Part VIII and carries the journal's closing, handing off to Part IX as evidence. Supports P8-5 of part `part-8`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in argument, concepts, lasts, stressors: each supplies what the next applies (criteria, vocabulary, layers, then the workshop); `grouping` in tradeoffs to questions: the book's fixed closing sections for every chapter)\n\nThe scene poses the problem (a sound design facing an unknown future). The argument comes next because it defines what must stay true; the concepts then supply the vocabulary; the layering sorts Veldmark's decisions before the workshop tests them, because the residue count is read against the layers. Portability and the pendulum generalize the separability residues the workshop found. The scorecard comes before debt because debt items are classified by the fitness function they hurt; placed first, the debt register would name functions the reader has not met. The architecture function comes last of these because it owns the argument, the stressor table, the scorecard and the debt register. Placed before the argument, the stressor workshop would have no criteria; placed before the stressor analysis, the scorecard's separability drill would have no reason. The house closing sections follow, then the conclusion carries Part VIII's and the journal's closing.\n\n## Introduction\n\n**Hook** (`intriguing_example`): In the ten years from 2016 to 2026, Schibsted pitched 'one global product and tech organization', demerged its international marketplaces as Adevinta, Adevinta bought eBay Classifieds Group, set out to merge two of its largest product platforms, was taken private, then moved to 'a decentralised, standalone operating model' and sold businesses; Prosus exited OLX Autos; Zillow closed Zillow Offers. None of them had the decade they planned for.\n\n**Bridge:** Architecture books and programs that end with a target state: the clean diagram of what the platform will look like once the program is done. → Groups whose decades did not go to plan turn the question into what must stay true while everything else changes, and how the group will know.\n\n**Thesis statement** (KEY POINTS callout (three bullets) and paragraph p02 (the bold question and the three moves).): Ask not what the platform should look like in ten years but what must stay true while everything else changes and how you will know: restate the argument, design against stressors rather than toward a target state, and steer by marketplace fitness functions rather than program milestones.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p02, which names the three moves and the sections between and after them; paragraph p03 names the Veldmark example.):\n\n- The worked example of Veldmark. *Kept in:* scene.\n- Restate the book's argument: a liquidity machine. *Kept in:* argument.\n- Stressor analysis, adapted from residuality theory. *Kept in:* concepts, stressors.\n- Separate what must outlive every system from what should be replaced. *Kept in:* lasts.\n- Keep data portable and design for separability as well as sharing. *Kept in:* portable.\n- Manage the swing between central and local control. *Kept in:* pendulum.\n- Technical debt as a liquidity tax and the architecture function's own evolution. *Kept in:* debt, function.\n- Marketplace fitness functions. *Kept in:* concepts, scorecard.\n- Trade-offs, vertical differences, failure modes, the Chief Architect's view and questions to ask. *Kept in:* tradeoffs, vertical, failures, view, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | The documented record of marketplace groups from 2016 to 2026 argues against ending with a target state: every group had a credible architecture plan at the start of the decade and none had the decade it planned for. | fact: Schibsted pitched 'one global product and tech organization' (widely reported), demerged Adevinta, which bought eBay Classifieds Group, set out to merge two of its largest product platforms, was taken private and moved to 'a decentralised, standalone operating model' and sold businesses; Prosus exited OLX Autos; Zillow closed Zillow Offers. |  |\n| p02 | claim | The Chief Architect's question is therefore not what the platform should look like in ten years but what must stay true while everything else changes and how the group will know, and the chapter answers it in three moves (the book's argument, stressor analysis, marketplace fitness functions) with what lasts, portability and separability, the central-local swing, technical debt and the architecture function's evolution between and after them, and trade-offs, vertical differences, failure modes, the Chief Architect's view and questions to ask at the end. |  | `cause_effect`: The record of groups whose decades did not go to plan. → The question that record forces on a Chief Architect, the three moves that answer it and the order of the remaining sections. |\n| p03 | context | The chapter closes Part VIII, whose introduction promised answers to four questions (what to change first, who owns it, how you will know it worked, what must stay true when owners, laws and channels change); the chapter takes the last of them and gathers the part's answers to all four at its close; it builds on the four earlier chapters of the part and on the platform chapters of Part VII, follows the fictional Veldmark with numbers taken from earlier chapters, and leaves Part IX's cases to test the argument against real groups. |  | `elaboration`: The chapter's three moves. → Where the chapter sits in the book: what it builds on, whose example it uses and what follows it. |\n\n## Sections\n\n### Setting the Scene at Veldmark: The Investor's Question\n\n**Controlling idea** (`context`, id `scene`): Two questions put to Veldmark in November 2027, what separating Hearthly would cost and what stops Common Ground from becoming another Yardstick, both ask how Common Ground holds up in a world it was not designed for.\n\n**Advances the thesis** (L2): Gives the chapter's problem a concrete case: a sound 2027 design facing an unknown future.\n\n**Transition in:** `example`: The Chief Architect's question: what must stay true while everything else changes. → Veldmark's investor and CEO asking that question about Common Ground.\n\n**Order of paragraphs** (`chronological`): The questions arrive in order (investor, then CEO), Ingrid diagnoses them, then acts; reversing would show the workshop before the reader knows what it is for.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p04 | context | Ten months after approving Common Ground, Veldmark's private-equity owner asks what it would cost to separate Hearthly, or Hearthly Spain alone, from the platforms being built if it decides to sell in 2030. | scenario: Board review on Tuesday 9 November 2027; the operating partner's two-line follow-up for the board meeting on Tuesday 14 December 2027; Common Ground costs €140 million and is meant to save €38 million a year from 2030. |  |\n| p05 | context | Henrik adds his own question: after a year of 2027 decisions, what stops Common Ground from turning into another Yardstick by 2037? | scenario: The 2027 decisions from the capability map in March to the ML and trust-and-safety platforms in November. | `additional_support`: The investor's question passed to Ingrid. → A second question from the CEO about the same decisions. |\n| p06 | analysis | Both questions ask how Common Ground holds up in a world it was not designed for: it was designed against the 2027 problems and has not been tested against those of 2030 or 2035. | scenario: Four of everything, a six-minute publication time, duplicates, payment-link phishing, a monolith that deploys twice a week. | `similarity`: The two questions. → What they have in common. |\n| p07 | process (list) | In the four weeks before the board meeting Ingrid writes down the argument behind Common Ground, runs a two-day stressor workshop and has the architecture advice forum adopt a twelve-function fitness scorecard. | scenario: The stressor workshop in Rotterdam on Thursday 18 and Friday 19 November 2027 with the brand CTOs, platform leads, Aisha Rahman, Lucía Ortega, Priya Raman, Olivier Petit and a partner from the investor's portfolio team, working through fourteen stressors; the scorecard adopted on Wednesday 8 December 2027. | `cause_effect`: The diagnosis that Common Ground was never tested against a changed world. → What Ingrid does about it. |\n| p08 | transition | The stressor analysis answers the investor with Ingrid's estimate; Henrik's question gets two answers, the scorecard for the platform and the architecture function's survivability-of-the-record measure for the record of decisions; both rest on the argument. |  | `conclusion_summary`: Ingrid's three outputs. → Which output answers which question, and that the argument comes first. |\n\n### The Argument: A Liquidity Machine\n\n**Controlling idea** (`claim`, id `argument`): A listing marketplace is a liquidity machine: each part of the book designs one stage, with the guarantee it must give, the liquidity metric it protects and the failure pattern when it does not, and four ideas run through all the parts.\n\n**Advances the thesis** (L1): States the book's argument part by part, which defines what must stay true over the decade.\n\n**Transition in:** `cause_effect`: Both answers rest on the argument. → The argument itself.\n\n**Order of paragraphs** (`large_to_small`): The claim first, then the part-by-part table, then the four ideas the table shares, then their use as criteria; the criteria make sense only after the table.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | claim | A listing marketplace sells matches, and listings, search, trust and monetization are stages of one pipeline whose throughput is liquidity, which is local, measured per cell and the only thing that compounds into network effects. | example: A seller wants a buyer, a dealer wants leads, an agency wants mandates, a buyer wants the right item, car or home before somebody else. |  |\n| p10 | explanation | Read that way, every part of the book describes one stage of the machine, the guarantee that stage must give and the way it fails. | figure: Figure 1: the liquidity machine, from supply to matches and money, with outcomes and paid effects flowing back. | `elaboration`: The machine whose throughput is liquidity. → Each part of the book as one of its stages. |\n| p11 | evidence | The table states the argument part by part: for each of the eight parts, the stage, the guarantee, the liquidity metric it protects and the failure pattern when it does not. | table: Parts I to VIII with stage, guarantee (with the chapters that design it), protected metric and failure patterns. | `elaboration`: Each part as a stage. → The part-by-part mapping. |\n| p12 | synthesis (list) | Four ideas run through all eight parts and outlast any particular system: the listing is an offer with one owner, content is data while engines are shared, every consequential decision leaves evidence, and the marketplace measures matches rather than activity. | example: Ghost Inventory and Search as System of Record as unregistered copies; share platforms, not products as the second idea applied to a group. | `conclusion_summary`: The part-by-part table. → What the parts have in common. |\n| p13 | transition | These four ideas are the criteria for the rest of the chapter: a decision that serves them should survive the decade, and one that served only the 2027 problem list should be easy to replace. |  | `cause_effect`: The four ideas. → Their use as criteria for sorting decisions. |\n\n### Concepts: Stressors, Residues and Fitness Functions\n\n**Controlling idea** (`definition`, id `concepts`): Target states fail in marketplace groups, so the chapter plans for properties instead, using stressor analysis, adapted from residuality theory, to find what survives, and marketplace fitness functions to check it still holds.\n\n**Advances the thesis** (L2): Defines the two tools the chapter uses in place of a target state.\n\n**Transition in:** `sequence`: The argument as the criteria for what must stay true. → The vocabulary for the second and third moves: why target states fail, stressor analysis for planning against stressors, and fitness functions for measuring.\n\n**Order of paragraphs** (`problem_solution`): Why target states fail comes first so the vocabulary arrives as the answer; stressors before fitness functions because the first finds what must hold and the second checks it; the stance last because it summarizes both.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | claim (list) | A target-state architecture is useful for communication but dangerous as a plan in a marketplace group, because ownership changes, regulation arrives on fixed dates with uncertain scope, and demand channels move. | fact: Shared platforms valued in a 2021 synergy case became separation costs in 2025 at Adevinta; the DSA, DAC7, P2B, the AI Act and the GPSR changed what marketplaces must store, show and report between 2019 and 2026; organic search brought 46% of Tradeyard's web sessions in 2026 while marketplaces began publishing search inside AI assistants. |  |\n| p15 | claim | The alternative is not to stop planning but to plan for properties that must hold in many possible futures and to treat any specific system as replaceable. |  | `contrast`: Why target states fail. → What to plan for instead. |\n| p16 | definition (list) | Residuality theory, developed by Barry M. O'Reilly from 2020, gives the vocabulary for that plan: stressor, attractor, residue, and naive versus residual architecture. | source: O'Reilly's articles from 2020 and his 2024 book Residues: Time, Change, and Uncertainty in Software Architecture. | `elaboration`: Planning for properties. → The vocabulary for doing it. |\n| p17 | example | The two Productscape domain models the book started from ran exactly this exercise, and their residual architectures summarize Parts II to VI reached from the other direction. | quotation: The general-listings model's residual architecture 'separates actor, identity evidence, account, role, listing, ...'; the real-estate model's property identity persists 'while risk, value, financing, listing authority, and transaction readiness change independently'. | `example`: The residuality vocabulary. → Two worked applications of it. |\n| p18 | explanation | Two properties make the method useful at group scale: residues recur across unrelated stressors, and combined stressors test the decomposition. | figure: Figure 2: many stressors, the same few residues (event contract, identifiers, tenant-separable data, entitlement ledger). | `elaboration`: The domain models' combined tests. → The two properties that make the method work for a group. |\n| p19 | definition | Stressor analysis, as this book defines it, lists stressors for a group, records for each the attractor, what breaks and the surviving residue, and counts which components carry the most residues, which then deserve the most care. |  | `conclusion_summary`: The vocabulary and its two properties. → The practice the chapter calls stressor analysis. |\n| p20 | definition | The fitness function, the concept behind the third move, comes from evolutionary architecture: an objective, preferably automated check that an architecture still has a property it was designed to have. | source: Ford, Parsons, Kua and Sadalage, Building Evolutionary Architectures (2017; 2nd ed. 2022); Auto Trader's 2026 post on ArchUnit tests in the build. | `sequence`: Stressor analysis, the first concept. → The concept behind the third move. |\n| p21 | definition | A marketplace fitness function measures a stage of the liquidity machine and differs from a business KPI by having an architectural owner and remedy, and from an SLO by measuring the whole machine. | example: 'A sold listing disappears from every registered consumer within two minutes at p95'; 'no more than four paid listings in the first twenty results'. | `elaboration`: Fitness functions in general. → The marketplace form the chapter uses. |\n| p22 | claim | The chapter's stance is that systems are built to be replaced while contracts, identifiers and measures are built to last, because when a system's internals become everyone's interface it cannot be replaced. | scenario: Yardstick: 214 columns in the ads table read by 38 modules, a digest reading a MySQL replica, ranking boosts in Solr configuration. | `conclusion_summary`: Stressor analysis and fitness functions. → The stance both serve, named in the chapter's title. |\n\n### What Lasts and What Gets Replaced\n\n**Controlling idea** (`claim`, id `lasts`): The 2027 decisions sort into three rates of change, and design attention belongs disproportionately on the top layer of contracts and identifiers, with engines chosen for replaceability.\n\n**Advances the thesis** (L3): Applies 'built to be replaced' to Veldmark's decisions and says where design attention goes.\n\n**Transition in:** `example`: The stance: systems are replaced, contracts and identifiers last. → Veldmark's 2027 decisions sorted by how long they should last.\n\n**Order of paragraphs** (`large_to_small`): The whole sorting first, then the top layer, then the middle layer, then the test that applies both.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p23 | evidence | Before the workshop, Ingrid's paper sorts the 2027 decisions into three layers by how long they are meant to last (contracts and identifiers, engines and implementations, and content and policy), a starting hypothesis the stressor analysis then tests. | table: Three layers with Veldmark decisions, expected life (ten years or more; three to eight years; weeks to two years), how each changes and owner.; figure: Figure 3: three rates of change. |  |\n| p24 | claim | The top layer deserves a disproportionate share of design attention, because a wrong field in the listing event envelope costs more over a decade than a wrong search engine. | scenario: The envelope copied into 23 consumer groups at go-live; the engine replaceable behind the search contract in a year. | `cause_effect`: The three layers. → Where design attention should go first. |\n| p25 | claim | The middle layer should be chosen for replaceability as much as for fit, and its revisits are scheduled rather than left open. | scenario: September 2027: every product application on Listing Search API v1 before any engine change; the deferred Vespa evaluation and the 2029 reviews of Motorvane's Elasticsearch and Hearthly's cloud. | `sequence`: The top layer. → The middle layer. |\n| p26 | recommendation | Every forum proposal should be tested by which layer it belongs in and whether it lets the layer below change without touching the layer above. | example: A brand's ranking rule in the event envelope fails; so does a consumer reading the engine's internal document format. | `conclusion_summary`: The layers and their rules. → A single test for new proposals. |\n\n### Stressor Analysis for a Marketplace Group\n\n**Controlling idea** (`process`, id `stressors`): Veldmark's stressor workshop shows the method: stressors from seven families, a table of attractors, breaks and residues, a residue count per component, a combined stressor that finds a missing residue, and a labeled carve-out estimate.\n\n**Advances the thesis** (L4): Runs the stressor analysis on Veldmark and answers the investor's question with it.\n\n**Transition in:** `sequence`: The layering of Veldmark's decisions. → The workshop that tests them against stressors.\n\n**Order of paragraphs** (`chronological`): Follows the workshop as it ran: method, families, table, count, combined scenario, then the answer to the investor; the estimate depends on the residues the earlier steps found.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p27 | explanation | The workshop's value comes from the breadth of the stressors and the honesty of the 'what breaks' column, not from its loop, which is simple. | figure: Figure 4: stressor analysis as Veldmark runs it, with combined stressors as the check. |  |\n| p28 | description | The stressors are drawn deliberately from seven families, because architects left alone list mostly technical risks. | table: Capital and portfolio, regulation, demand channel, supply ecosystem, adversarial, technology and suppliers, physical world and markets, each with marketplace examples. | `elaboration`: Breadth as the source of value. → The seven families that give it. |\n| p29 | evidence | Veldmark's table shows ten of the fourteen stressors, each with the attractor, what breaks in the 2027 design, the residue that survives and its status. | table: S1 to S10, from the sale of Hearthly to a competition complaint against Keybridge, with status integrated, already survived, partly integrated or open. | `example`: The seven families. → Veldmark's stressors drawn from them. |\n| p30 | evidence | The four stressors not shown were a transactional pivot at Tradeyard, a model withdrawal, Polish data localization and a professional boycott at Motorvane, three survived and one open. | example: Survived by the profile register and transaction context, the AI gateway, price-as-data and the lead ledger; localization open, low likelihood. | `additional_support`: The ten rows shown. → The four not shown. |\n| p31 | analysis | Three readings of the table matter more than any row: most residues already existed, the open residues cluster, and S1 is the stressor the 2027 design made worse, which argues for paying the small early price of separability. | statistic: Eight of ten stressors fully or partly covered by 2027 decisions; open residues in tenant-scoped exports, media provenance and dated facts on the canonical property. | `conclusion_summary`: All fourteen stressors. → What the table as a whole shows. |\n| p32 | evidence | The second exercise counts, per Common Ground component, how many of the fourteen stressors touch it, which ranks components by how much of the group's future they carry. | table: Listing event contract and core 11, identity 8, data platform 8, T&S platform 7, Tally 5, search 5, taxonomy and Place 4, AI gateway 3, media 2. | `sequence`: The stressor table. → The second exercise, counting residues per component. |\n| p33 | analysis | The ranking matches the layering of Figure 3 and tells the board where Common Ground's quality budget belongs: the event contract, identity, the data platform and the T&S platform's tenancy model. |  | `cause_effect`: The residue count. → What it means for where to invest. |\n| p34 | example | On the second afternoon the workshop combines three stressors in July 2030: the sale of Hearthly Spain, a generated-photo rental fraud ring and an AI assistant partner sending a fifth of its search traffic. | scenario: July 2030 combined scenario. | `time`: The first day's single stressors and the count. → The second afternoon's combined scenario. |\n| p35 | example (list) | Walked through the existing residues, the sale, the fraud and the channel are each covered by pairwise identities, tenant-partitioned data, actor-graph scoring and per-brand channel contracts. | scenario: The sale: pairwise identifiers, tenant-partitioned Iceberg tables, vm:hearthly:es identifiers; the fraud: actor graph and bank liaison feed; the channel: per-channel attribution under the 2028 contract. | `elaboration`: The combined scenario. → How each of its three parts is met. |\n| p36 | analysis | One residue is missing: the shared block list records no source tenant for its entries and the T&S platform has no tested per-tenant export, and both went onto the 2028 backlog. |  | `contrast`: The three parts that are covered. → The one gap the combination exposes. |\n| p37 | analysis | That is what the combined test is for: it found a cheap residue, one field and one export, in 2027 instead of an expensive one during a carve-out. |  | `conclusion_summary`: The missing residue. → Why finding it now matters. |\n| p38 | evidence | Ingrid answers the investor with a labeled estimate: with the separability residues a 2030 carve-out of Hearthly needs transitional services for seven shared capabilities for about nine to twelve months, without them twenty months or more, at a small incremental cost. | scenario: Seven capabilities named; nine to twelve months versus twenty or more; incremental cost small against €140 million because most residues are design rules. | `cause_effect`: The residues the workshop confirmed and added. → The answer to the investor's question. |\n| p39 | context | The board accepts the paper and adds a yearly separability tabletop for Hearthly Spain from the third quarter of 2028. |  | `time`: Ingrid's estimate. → The board's response. |\n\n### Keeping Listing Data and Events Portable\n\n**Controlling idea** (`explanation`, id `portable`): Portability, the practical form of 'built to be replaced', comes from eight rules from earlier chapters, accepts lock-in deliberately with an exit estimate, and at its strongest is separability, whose cost Adevinta's 2025 decentralization documents.\n\n**Advances the thesis** (L3, L4): Turns the surviving residues into rules for portable data and events, and shows the cost of separation from the public record.\n\n**Transition in:** `elaboration`: The separability residues and the board's tabletop. → The general rules that keep data and events portable.\n\n**Order of paragraphs** (`large_to_small`): The rules, then the qualification about managed services, then the strongest form, then the documented cost; the evidence closes the section because it argues for the rules.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p40 | definition | Portability means the group's listings, accounts, events and evidence can move to a new system, owner or cloud without being reverse-engineered, and eight rules from earlier chapters provide it. | table: Eight rules (own the identifiers, one replayable event contract, one system of record per fact, open formats by tenant and time, pairwise identifiers, entitlement ledger, contracts in front of engines, configuration over code) with where each is designed and the stressors it answers. |  |\n| p41 | claim | Portability does not mean avoiding managed cloud services but accepting lock-in deliberately, with an exit estimate and a contract that makes the exit possible. | scenario: Kafka on Confluent Cloud, Amazon OpenSearch Service, Snowflake compute; a managed service called directly from forty product services as 'a decision nobody made'. | `contrast`: The rules. → What portability does not require. |\n| p42 | explanation | Separability is the strongest form of portability; Veldmark wrote it into Tenancy model v1 in June 2027, and the stressor workshop tests the exit paths rather than trusting the documents. | scenario: Tenancy model v1 adopted Wednesday 9 June 2027: tenant code mandatory in every identifier, event, API call, log, metric and cost tag; documented exit path for every shared capability. | `elaboration`: Portability in general. → Its strongest form. |\n| p43 | evidence | Adevinta's 2025 strategic report documents what separation costs: parallel running of central and local services, paid in money, carbon and engineering attention. | quotation: 'evolved from a centralised structure to a decentralised, standalone operating model'; 'a temporary spike linked to our ongoing decentralisation, which required parallel running of central and local services during a transitional period'. | `example`: Separability as a designed property. → A documented case of separating without it. |\n\n### Managing the Centralization Pendulum\n\n**Controlling idea** (`claim`, id `pendulum`): The swing between central and local control is driven mostly by forces architecture does not control, so architecture's job is to make each swing cheaper by writing the cost to reverse into every sharing decision.\n\n**Advances the thesis** (L5): Adds the long-term stance on the pendulum without re-teaching multi-country-platforms.\n\n**Transition in:** `cause_effect`: The cost of separation. → The swing between central and local control that causes such separations.\n\n**Order of paragraphs** (`problem_solution`): The pendulum and its drivers, then the question that changes the decision, then the rule, then the practices that apply it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p44 | claim | Separations like Adevinta's are what the swing between central and local control produces; groups swing between local autonomy and central platforms, driven mostly by capital strategy, market maturity and leadership, so architecture's job is to make each swing cheaper. | fact: Schibsted's 2016 'one global product and tech organization'; Adevinta's 2019 rule to centralize where 'investment requirements are large and the technology is uniform'; its 2023 convergence into 'a unified global platform'; its 2025 decentralization.; figure: Figure 5: the centralization pendulum. |  |\n| p45 | analysis | At the forum the question becomes what reversing a sharing decision in four years would cost, and the answer depends on what is shared. | table: Contracts and vocabularies, engines as multi-tenant platforms, infrastructure and tooling, product platforms: value of sharing, cost to reverse and long-term stance for each. | `cause_effect`: The pendulum's drivers. → The question that keeps a swing cheap. |\n| p46 | recommendation | Share platforms, not products sits in the first three rows, Adevinta's 2023 convergence sat in the fourth, and the cost to reverse should be written into every sharing decision, most reversible forms first. | case: Adevinta's 2023 convergence decision, which the public record does not show completed before the 2025 reversal. | `example`: The four kinds of sharing. → Where Veldmark and Adevinta sit among them. |\n| p47 | recommendation (list) | Three practices keep the pendulum cheap at Veldmark: a tenant-exit test for every shared platform, brands keeping the capability to build product, and adoption measured rather than mandated below the contract layer. | scenario: The annual separability tabletop; stream-aligned teams in the brands; Keybridge's distribution stack as a deliberate duplicate and Motorvane's Elasticsearch as a dated one. | `elaboration`: The rule to cost reversal. → The practices that apply it. |\n\n### Marketplace Fitness Functions: The Scorecard\n\n**Controlling idea** (`explanation`, id `scorecard`): Veldmark's twelve-function scorecard, with baselines, targets, kinds, owners and failure patterns, works because of five design choices: few functions with owners, targets where the remedy lives, counter-metrics beside metrics, drills that count, and versioned definitions.\n\n**Advances the thesis** (L6): Gives the steering instrument and the design choices that make it hold up.\n\n**Transition in:** `sequence`: Cost to reverse and the tenant-exit test, which protect the group when it changes shape. → The third move: the scorecard that measures whether the machine still works in the meantime.\n\n**Order of paragraphs** (`large_to_small`): The whole scorecard, then the five choices in turn; the loop closes the section because it shows the scorecard in use.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p51 | evidence | The scorecard adopted on 8 December 2027 has twelve functions in four groups, each with a definition, a 2027 baseline, a target, a kind, an owner and the failure pattern it guards against. | table: F1 publication freshness to F12 separability and registration, in supply, matching, trust, and economics and evolvability groups, with Veldmark baselines from earlier chapters. |  |\n| p52 | transition | Five design choices in the scorecard are the parts other groups tend to get wrong. |  | `elaboration`: The scorecard. → The design choices behind it. |\n| p53 | recommendation | Keep the functions few, each with one owner who can act on it. | example: Twelve as about as many as a quarterly review can discuss; F6 owned by the Group CPO because its remedies are often commercial. | `sequence`: Five choices announced. → The first. |\n| p54 | recommendation | Set targets where the remedy lives: the center sets definitions and cell keys, the brands set targets for market outcomes. | example: F5 and F6 have no central target; time to first contact in a rural Portuguese district depends on supply and marketing more than latency. | `sequence`: Owners. → Targets. |\n| p55 | recommendation | Put counter-metrics next to the metrics so nobody improves one by weakening another. | example: F1 beside F2 and F8; F7 beside VAS revenue per search. | `sequence`: Targets. → Counter-metrics. |\n| p56 | recommendation | Count drills as fitness functions: rebuildability and separability can only be shown, and a drill not run in two quarters is a failure. |  | `sequence`: Monitored metrics. → Properties that can only be drilled. |\n| p57 | recommendation | Keep the scorecard versioned in the architecture repository and computed from the governed metrics catalog, so that the steering loop, not a target diagram, is the long-term plan. | figure: Figure 6: the steering loop, from fitness functions through the quarterly review and stressor updates to decision records. | `sequence`: Drills. → Versioning and the loop the scorecard feeds. |\n\n### Technical Debt as a Liquidity Tax\n\n**Controlling idea** (`claim`, id `debt`): Over a decade, the technical debt that matters is the debt that slows a stage of the liquidity machine or hides its true state, so each debt item names the fitness function it hurts and competes for funding through the same liquidity case as features.\n\n**Advances the thesis** (L6): Connects debt to the fitness functions, making the debt register an investment ranking.\n\n**Transition in:** `cause_effect`: The steering loop, in which a failing fitness function becomes a debt item. → Technical debt, the main way architecture loses coherence over a decade, classified by the fitness function it hurts.\n\n**Order of paragraphs** (`large_to_small`): The classification, then the rules for using it, then its limit.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p48 | claim | Over a decade the debt that matters in a marketplace slows a stage of the liquidity machine or hides its true state, so classifying debt by the fitness function it hurts turns the register into an investment ranking. | table: Structural, copy, policy, definition, schema and model debt, each with a Veldmark 2027 example, what it taxes and the fitness function that exposes it.; figure: Figure 7: debt as toll booths on the liquidity conveyor. |  |\n| p49 | recommendation | Two rules make the register useful: every item names the fitness function it hurts with an estimate in the business's currency, and debt competes with features through the same liquidity case. | scenario: The phishing rule three days late to Tradeyard BE and never to PL/PT; Ranking policy v1 framed as debt repayment and justified by search sessions with a contact up 5.3%, at a cost of 2.5% of VAS revenue per search. | `elaboration`: Debt classified by fitness function. → The two rules that make the classification useful. |\n| p50 | analysis | Debt never reaches zero and should not, but fitness functions keep deliberate debt from becoming invisible debt. |  | `contrast`: Rules for funding repayment. → The limit of repayment. |\n\n### The Architecture Function's Own Evolution\n\n**Controlling idea** (`explanation`, id `function`): The architecture function must itself change from founding to building to stewardship, becoming smaller in decisions and larger in evidence, and should measure its own fitness.\n\n**Advances the thesis** (L6): Applies the chapter's steering to the architecture function, the owner of the scorecard.\n\n**Transition in:** `additional_support`: The scorecard, the stressor table and the debt register. → The architecture function that owns them, which must change too.\n\n**Order of paragraphs** (`chronological`): Three phases in time order, then the measures that tell which phase the function is in.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p58 | claim | An architecture function right for a group's founding year is usually wrong for its fifth, and Veldmark's 2027 founding phase produced mostly the top layer. | scenario: Capability map, context map, profile register, twelve principles, the weekly advice forum; 74 cross-brand decision records by 31 December 2027 with a median of nine working days. |  |\n| p59 | explanation | In the building phase, 2028 to 2030, the work shifts to platform teams, the function holds the contracts steady, and the danger is the Forced Fit. |  | `time`: The founding phase. → The building phase. |\n| p60 | explanation | After 2030, in the stewardship phase, the function becomes smaller in decisions and larger in evidence, leaving most design decisions to teams through the advice process. |  | `time`: The building phase. → The stewardship phase. |\n| p61 | recommendation (list) | The architecture function measures itself with five fitness functions of its own, from decision lead time to the survivability of the record. The survivability-of-the-record measure answers Henrik's question for the record of decisions, as the scorecard answers it for the platform. | example: Decision lead time; share of decisions taken by teams; exceptions and deliberate duplicates; revisits on schedule; survivability of the record, which answers Henrik's question. | `cause_effect`: Three phases with different jobs. → How the function knows it is in the right one. |\n\n### Trade-offs\n\n**Controlling idea** (`analysis`, id `tradeoffs`): The main tension is between synergy and separability, and the defensible position is to take synergy where it is large and the technology uniform and to buy separability cheaply at design time for all of it.\n\n**Advances the thesis** (L5): Weighs the chapter's choices against their alternatives.\n\n**Transition in:** `contrast`: The chapter's recommendations. → The conditions under which their alternatives are right.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p62 | analysis | Every shared platform saves money while the group holds together and costs money when it comes apart, so take synergy where large and uniform and buy separability cheaply at design time. | table: Five choices (how to plan, how much to share, separability, fitness functions, who sets targets) with when each option is right. |  |\n\n### Vertical Differences\n\n**Controlling idea** (`comparison`, id `vertical`): Long-term stressors and the fitness functions that matter most differ by vertical, so a single group scorecard needs vertical parameters.\n\n**Advances the thesis** (L6): Shows how the scorecard and the stressor list must vary by vertical.\n\n**Transition in:** `elaboration`: Trade-offs at group level. → How they differ by vertical.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p63 | comparison | The dominant stressors, the most important fitness functions, the entity that must outlive listings, what separability protects and the time windows differ across general classifieds, automotive, real estate and professional SaaS and jobs. | table: Tradeyard, Motorvane, Hearthly, Keybridge and jobs across five dimensions. |  |\n| p64 | analysis | That is why a single group scorecard needs vertical parameters. | example: A 90-second publication target is worth much in Tradeyard NL's dense goods cells and less in Hearthly's property cells; 1.7 listings per property means nothing for city bikes. | `cause_effect`: The vertical table. → What it means for the scorecard. |\n\n### Failure Modes\n\n**Controlling idea** (`description`, id `failures`): Five failure modes undo long-term evolution: the frozen target state, synergy without separability, contracts that drift into internals, scorecard decay and the permanent founding phase, each with a remedy from the chapter.\n\n**Advances the thesis** (L2, L4, L6): Names how the chapter's methods fail and the remedy for each.\n\n**Transition in:** `contrast`: How the methods should work across verticals. → How they fail.\n\n**Order of paragraphs** (`grouping`): One mode per paragraph, from how the group plans, to what it shares, to the contract it keeps, to how it measures, to who decides; each mode undoes one of the chapter's tools and its remedy points back to it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p65 | description | The frozen target state: a first-year plan becomes the definition of success and is defended rather than revised; remedy, plan in stressors and fitness functions. |  |  |\n| p66 | description | Synergy without separability: shared platforms mix tenants because the business case counted only savings, and the first carve-out takes two years; remedy, tenant-exit tests before they are needed. |  | `additional_support`: The first failure mode. → The second. |\n| p67 | description | Contracts that drift into internals: the event contract acquires brand-specific fields until it is as hard to change as Yardstick's tables; remedy, review every contract change against the layering rule. |  | `additional_support`: The second failure mode. → The third. |\n| p68 | description | Scorecard decay: functions lose owners or are redefined to look better; remedy, owners, versioned definitions, counter-metrics and drills that fail when not run. |  | `additional_support`: The third failure mode. → The fourth. |\n| p69 | description | The permanent founding phase: the function keeps deciding everything and becomes a bottleneck and a mandate; remedy, measure the function's own fitness and shift decisions to teams. |  | `additional_support`: The fourth failure mode. → The fifth. |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `view`): Over a decade the Chief Architect owns the argument, the top layer, the stressor analysis and the scorecard, makes separability and the cost to reverse review criteria, and knows who decides and what to watch.\n\n**Advances the thesis** (L1, L3, L4, L5, L6): Turns the chapter into the decisions the Chief Architect holds at group level.\n\n**Transition in:** `conclusion_summary`: Methods, trade-offs and failure modes. → The decisions the author would hold at group level.\n\n**Order of paragraphs** (`order_of_importance`): The argument first because every other decision cites it; then the layer it protects, the analysis and criteria that keep it, the instrument that measures it, and finally who decides and what to watch.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p70 | context | Over a decade the Chief Architect owns very few systems and a handful of things that outlast all of them. |  |  |\n| p71 | recommendation | Own the argument: write down in one page what the platform is for and have every top-layer decision cite it. |  | `sequence`: The handful of things that outlast systems. → The first: the argument. |\n| p72 | recommendation | Own the top layer, and only the top layer by default, leaving engines to platform teams and content to brands. |  | `sequence`: The argument. → The top layer. |\n| p73 | recommendation | Run a stressor analysis every year and after every capital event, and spend quality where the residue count is high. |  | `sequence`: The top layer. → The stressor analysis. |\n| p74 | recommendation | Make separability a review criterion like security, answered in the decision record before a shared platform is built and proved by the yearly tabletop. |  | `sequence`: The stressor analysis. → Separability as a review criterion. |\n| p75 | recommendation | Write the cost to reverse into every sharing decision next to the synergy case. |  | `sequence`: Separability. → Cost to reverse. |\n| p76 | recommendation | Steer by the scorecard: a dozen fitness functions with owners, baselines, targets, counter-metrics and failure patterns, reviewed quarterly. |  | `sequence`: Cost to reverse. → The scorecard. |\n| p77 | recommendation | Decision rights are split: the Group Chief Architect owns the argument, top layer, stressor analysis and scorecard definitions; the CTO investments and unit costs; the Group CPO market outcomes; platform owners their engines; the board sees the stressor table and the separability estimate yearly. |  | `elaboration`: The decisions held at group level. → Who holds each. |\n| p78 | recommendation | Watch the trend of the twelve functions, open residues, drills not run, the age of deliberate duplicates and the function's own lead time, and fix the scorecard first if it is green while users complain. |  | `sequence`: Who decides. → What to watch. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Ten questions let a reader apply the chapter to their own group.\n\n**Advances the thesis** (L1, L3, L4, L6): Turns the chapter into a review the reader can run.\n\n**Transition in:** `elaboration`: The Chief Architect's decisions. → Questions that test whether one's own group has made them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p79 | recommendation (list) | Ten questions, from stating the platform's purpose in matches to whether every debt item names its fitness function, let a reader check their own group against the chapter. |  |  |\n\n## Conclusion: From Argument to Evidence\n\n**Synthesis:** Part VIII's five chapters answer the part introduction's four questions as one method (what to change first: the consolidation sequence and migration waves ordered by risk to liquidity; who owns it: one owning team per capability and the advice process; how you will know it worked: liquidity gates, relevance parity and the fitness scorecard; what must stay true: the top-layer contracts and identifiers that survive the stressors), and the book's parts map to the stages of one liquidity machine, each with its guarantee, protected metric and failure pattern, so the chapters read as one argument rather than a set of topics.\n\n**So what:** A group can measure every quarter, with marketplace fitness functions, whether its machine still turns fresh, trustworthy supply into matches, instead of steering by program milestones, and change sequenced, owned and measured this way keeps the machine's throughput while owners, laws and channels change.\n\n**Callback:** The introduction's central claim, restated in the same words, its warning that the synthesis was left to this chapter, and its opening question: why a smaller competitor turns its listings into more contacts per listing while every team's report is green; and the Part VIII introduction's four questions. The reader now sees that the scorecard measures the machine at the hand-offs where the general manager's contacts were lost (publication freshness, removal propagation, ghost share, duplicate exposure, paid share, time to first contact), which no team's own report measured.\n\n**Takeaway** (`course_of_action`): Steer the platform by a small set of marketplace fitness functions, each with an owner and a counter-metric, re-run the stressor analysis every year, and test the argument against the public cases in Part IX.\n\n**Hand-off** to [Part IX — PRACTICE: How Others Built It](part-9.html): `contrast`: Veldmark is fictional and shows how the argument plays out, not that it is right; whether it is right is a question for evidence, so read the cases as a set of stressors that actually arrived and as a check on which residues survived. → The dated public record of six real groups and portals, read as stressors that actually arrived, with fact, interpretation and inference kept apart.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p80 | synthesis | Part VIII's five chapters answer the four questions its introduction promised answers to and this chapter's introduction recalled (what to change first, who owns it, how you will know it worked, what must stay true) as one method, and change sequenced, owned and measured that way keeps the machine's throughput while owners, laws and channels change, so it does not depend on the decade going to plan. |  |  |\n| p81 | synthesis | This book has argued that a listing marketplace is a liquidity machine judged by how reliably it turns fresh, trustworthy supply into matches with demand, and the part-by-part table in this chapter's section 'The Argument', the synthesis the book's introduction left to it, maps every part to a stage, a guarantee, a protected metric and a failure pattern so the chapters read as one argument. |  | `conclusion_summary`: Part VIII as one method. → The whole book as one argument. |\n| p82 | synthesis | That answers the general manager's question from the book's introduction: the scorecard measures the machine at the hand-offs where a smaller competitor wins more contacts per listing, which no team's green report measured, so a group that reviews it every quarter sees the loss before the competitor's chart shows it. | example: Publication freshness, removal propagation, ghost share, duplicate exposure, paid share of the first page and time to first contact set against the introduction's six-minute publication, sold bike in the alert e-mail, flat listed three times and half-paid first page. | `cause_effect`: The book's argument and its part-by-part synthesis. → What it answers: the question the book opened with. |\n| p83 | transition | Veldmark, however, is fictional and shows how the argument plays out, not that it is right; whether it is right is a question for evidence, which Part IX's cases supply as stressors that actually arrived and a check on which residues survived. | case: Adevinta, OLX, eBay Classifieds Group, AVIV, the property portals and the automotive marketplaces. | `contrast`: The answer the book gives through Veldmark. → The limit of a fictional example and the real record that tests it. |\n\n## Non-goals\n\n- The tenancy model and the documented history of central versus local platforms. See [One Platform, Many Marketplaces: Multi-Country and Multi-Brand Architecture](multi-country-platforms.html).\n- Consolidation sequence and synergy cases. See [After the Deal: Consolidating Platforms After Acquisitions](platform-consolidation.html).\n- Team topology and the advice process. See [Who Owns What: Organizing Marketplace Engineering](organizing-marketplace-engineering.html).\n- Migration techniques (strangler, parallel run, relevance parity). See [Changing the Engine in Flight: Modernizing a Live Marketplace](modernization-and-migration.html).\n- AI governance. See [AI Across the Listing Lifecycle](ai-in-listing-systems.html).\n- Journey SLOs and unit-cost definitions (reused here as fitness functions). See [Sunday Evening Peaks: Reliability, Performance and Cost](reliability-and-scale.html).\n- Company case detail. See [Adevinta: From Schibsted's Copy-Paste Model to a Portfolio Platform](case-adevinta.html), [Part IX — PRACTICE: How Others Built It](part-9.html).\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-10-19** — Placed the synthesis of the book's argument near the start rather than at the end, so the stressor analysis and the scorecard can be judged against it; the end keeps a short restatement and the bridge to Part IX. (Carried over from spec.md.)\n- **2026-10-19** — Made the investor's carve-out question the scene, because capital events are the dominant documented stressor for marketplace groups and the one Common Ground's 2027 design made worse. (Carried over from spec.md.)\n- **2026-10-19** — Built the scorecard only from baselines already in the ledger and earlier chapters; added the stressor workshop, the scorecard adoption, the separability estimate and the tabletop to the ledger. (Carried over from spec.md.)\n- **2026-10-19** — Treated the centralization pendulum through 'cost to reverse' to avoid re-teaching multi-country-platforms. (Carried over from spec.md.)\n- **2026-11-12** — Converted spec.md to spec.json. Success criteria: the argument table and figure, the residuality vocabulary with dated sources, the three rates of change, the stressor workshop, portability with Adevinta 2025 evidence, cost to reverse, the twelve-function scorecard and the Part IX bridge were inventories; they are now covered by the journal's AC-1 to AC-4 and the added AC-5 to AC-7 (all minor), and the dated-source and ledger-match criteria are left to the sources list and the ledger. Rejected: Keeping the inventory criteria as written.\n- **2026-11-12** — Extended the conclusion from two to four paragraphs so it carries Part VIII's closing (the four questions), the journal's closing (synthesis, callback to the central claim and to the general manager's question) and the contrast hand-off to Part IX; added one roadmap sentence to p02 so the introduction announces every section. Rejected: Moving the
