<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, acceptance criteria AC-1 to AC-3, the thesis and the role are copied unchanged from the ranking entry in journal-spec.json. Added units not in the published text: the roadmap paragraph p04 and the synthesis paragraph p62.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Why there is no neutral order, and why listing ranking is harder than retail ranking: unique, short-lived inventory, rare and delayed outcomes, and two sides served at once.\n- **Know:** The three layers of ranking (relevance model, versioned ranking policy, ranking log), the politics of the default sort and bumps, learning to rank with position-bias correction, paid-organic blending under a relevance floor and a cap, and ranking transparency under the P2B Regulation and the Omnibus Directive.\n- **Believe:** Mixing paid products into engine boost functions is how Multiplier Creep starts; the model and the policy need different owners, change processes and tests.\n- **Believe:** A relevance floor can make the paid product more valuable to the sellers who buy it, not only the organic results better.\n- **Be able to:** Write a ranking policy with a relevance floor, a cap on paid positions, seller-diversity and exploration rules, delivery events and reason codes.\n- **Be able to:** Evaluate a ranking change on contacts and seller-side guardrails with a design that limits interference, and set up a ranking council that owns the objective.\n\n**Audience:** Chief architects, search and ranking leads, data science leads and monetization product leads in listing marketplaces.\n\n**Already knows:**\n\n- What an API, a database, an event stream, a search engine (including text scoring such as BM25 and boost functions) and A/B testing are.\n- From earlier chapters: Veldmark and its brands and cast, the listing aggregate and its lifecycle, liquidity and contacts, entity resolution and duplicate clusters, the publication pipeline, the search architecture with its search contract (Listing Search API v1) and update storms, and query understanding (structured queries, candidates, hybrid retrieval and re-ranking).\n\n**Does not yet know:**\n\n- Learning-to-rank vocabulary: LambdaMART, NDCG, position bias and propensity weighting, interleaving, training-serving skew.\n- The EU texts on ranking: the P2B Regulation, the Omnibus Directive and the Unfair Commercial Practices Directive (UCPD), and the DSA articles on advertising labels, recommender parameters and demotion.\n- Classifieds paid products: value-added services (VAS) such as bumps, top listings and highlights.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a results page dominated by paid listings and a revenue-only test culture, the reader states what to change and how to decide whether it worked. *Probe:* Over eight years, five paid-visibility features were added to your engine as reserved slots and score multipliers, each A/B tested on revenue per search. Paid listings now hold 38% of first-page positions, sessions with a contact are falling, and Monetization says the products work. Using only this chapter: what do you change, and how do you decide whether it worked? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-4 | Given a ranker trained on raw clicks from the current ranking, the reader names what goes wrong for buyers and new listings and what to change in labels, logging and policy. *Probe:* A marketplace's data team trains its new ranking model on last quarter's clicks, taken from the results pages the current ranking produced, and recomputes the features from today's listing data. Using only this chapter: what will go wrong, for buyers and for newly listed items, and what would you change? | `custom` | cold_reader | minor |\n| AC-5 | Given a fraud model that pushes suspected listings down the results, the reader says what EU law requires and how the ranking architecture should carry it. *Probe:* Your trust team wants the ranking to quietly push down listings that a fraud model suspects, as a score multiplier, without removing them. Using only this chapter: is that acceptable in the EU, and how should it be built? | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** How should a marketplace order results so buyers find the right listing and sellers get fair exposure?\n\n> **Claim:** The order of a listing results page should come from two separately owned parts: a relevance model trained on contacts that never sees what a seller paid, and a versioned ranking policy that applies freshness, paid products, seller diversity and exploration under a relevance floor and a cap on paid positions (at most four paid listings in the first 20 at Tradeyard), emits delivery events billing can read and reason codes from which the legally required description of ranking parameters is generated, and is judged on contacts and seller-side guardrails rather than on clicks or revenue per search.\n\n**Disputed by:** The common practice of expressing paid visibility as reserved slots and score multipliers in engine boost functions, each A/B tested on revenue per search, on the grounds that sellers buy them because they work and that the revenue funds the free listings that keep the marketplace liquid.\n\n**So what:** A Chief Architect who accepts this sets a group standard that relevance models consume no entitlements, gives each brand a ranking council that owns the primary metric, guardrails and policy file, shares the ranking service, log schema, evaluation tooling and transparency generator while models and policy values stay per brand, and watches the paid share of first-page positions, the new-listing first-contact rate and delivery against sold for every paid product.\n\n**How and why:** Tradeyard's ranking was deposited in five boost layers between 2016 and 2025, each tested on revenue alone: paid listings rose from 12% to 38% of first-page positions, almost a third of them below median organic relevance, sessions with a contact fell from 10.6% to 9.4% and new private listings without a contact in 48 hours rose from 24% to 33%. Ranking policy v1, tested from 6 September to 17 October 2027, cut the paid share to 17%, raised sessions with a contact by 5.3% and contacts per top listing sold by 21% at a 2.5% cost in VAS revenue per search, because no paid listing was shown below the relevance floor and each reached buyers whose query it matched.\n\n**Supporting claims**\n\n- **S1** — No results order is neutral, and listing ranking is harder than retail ranking (unique, short-lived inventory, rare and delayed contacts, two sides of whom some have paid), so paid and business rules added as engine boosts and tested alone on revenue degrade relevance into Multiplier Creep.\n- **S2** — The order should come from separate components with written contracts: retrieval, a relevance model that reads no entitlements, a versioned ranking policy that applies freshness, paid, diversity, exploration and trust rules, presentation, and a ranking log of features as served, positions, policy version and reason codes.\n- **S3** — The relevance model should learn from contacts with two-sided labels, from features logged as served and with position-bias correction, while exploration slots and per-seller caps that share exposure stay rules of the policy.\n- **S4** — Paid visibility should compete in one ordering under a relevance floor and a cap on paid positions, be sold as guaranteed exposure and counted by delivery events, which makes the paid product better for the sellers who buy it.\n- **S5** — EU law makes ranking a regulated function, so the description of main parameters, paid labels and statements of reasons for demotions must be generated from explicit policy configuration and reason codes.\n- **S6** — Ranking changes must be judged on contacts and seller-side guardrails with designs that limit interference, and owned per brand by a ranking council while the group shares the machinery of ranking, not the ranking.\n\n## Role in the part\n\nMakes the order of results an owned, versioned policy separate from the relevance model, and defines the candidate, re-ranking, exposure and logging machinery the later surfaces reuse. Supports P4-3 of part `part-4`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in the Tradeyard scene, which poses the problem (five boost layers and the forum's question), and the Veldmark remedy, which applies the chapter's design to it; `large_to_small` in the design sections: first the whole ranking function, then its parts in the order a query meets them: the relevance model, then the policy's rules (freshness and the bump, then paid blending), then the legal duties the policy must meet, and the evaluation of any change)\n\nThe scene ends with the forum's question, what should own the order of a results page and how will we know when it is wrong, and the body answers it in the order each answer is needed. What ranking is comes first, because the legal definition (prominence on any surface) and the four working terms are what the architecture separates. The architecture names the components and their contracts; the next four sections fill them in in pipeline order: the learned relevance model first, ending on position bias; then the policy's rules side by side under one heading, freshness and the bump (the oldest rule and the first Tradeyard broke) with the other exposure rules (exploration slots for the new listings position bias hurts most, exposure as an allocated resource, the per-seller cap), and paid blending under a floor, which needs a model free of entitlements; then the transparency duties that paid labels and demotions create. Evaluation comes last of the design sections, after transparency rather than right after blending, because it judges changes to all of them, including legally visible policy changes, and the guardrails it defines cover paid delivery and paid share. The Veldmark remedy then applies all of them with numbers, and trade-offs, vertical differences, failure modes, the Chief Architect's decisions and the review questions are judgements about a design the reader has now seen. Moving the remedy earlier would use the floor, the cap and cluster randomization before they are explained; moving paid blending before the architecture would discuss floors without the separation of model and policy that makes them possible; moving transparency before blending would explain paid labels before paid products are.\n\n## Introduction\n\n**Hook** (`direct_statement`): There is no neutral order: even 'newest first' favors sellers who post often, makes the bump product possible and decides that a city bike listed a minute ago matters more than a better match listed yesterday.\n\n**Bridge:** Architects who know search engines see the order of a results page as a sort setting or a relevance score. → In a listing marketplace that order serves buyers and sellers at once, some sellers have paid to be seen, and the law asks for it to be explained, so the question is what should own it.\n\n**Thesis statement** (KEY POINTS callout (all three bullets) and WHY ARCHITECTS SHOULD CARE callout; the scene's last paragraph (p09) poses the question the body answers.): Separate a relevance model that reads no entitlements from a versioned ranking policy that bounds freshness, paid visibility and exposure under a relevance floor and a cap, log what was served and why, and judge changes on contacts and seller-side guardrails.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p04, which lists the sections in order and names the kinds of evidence.):\n\n- Tradeyard's top-listing boost that ate relevance, and the question it raised. *Kept in:* scene.\n- What ranking is: prominence, not a sort, with the terms and signals the chapter uses. *Kept in:* concepts.\n- The architecture: relevance model, ranking policy layer and ranking log. *Kept in:* architecture.\n- Learning to rank: labels, models, features as served and position bias. *Kept in:* ltr.\n- The ranking policy's exposure rules: the default sort and bumps, exploration slots for new listings and per-seller caps. *Kept in:* freshness.\n- Blending paid visibility with organic results. *Kept in:* blending.\n- Transparency as a regulated function under EU law. *Kept in:* transparency.\n- How ranking changes are evaluated. *Kept in:* evaluation.\n- Veldmark's Ranking policy v1 and its experiment. *Kept in:* remedy.\n- Trade-offs, vertical differences, failure modes, the Chief Architect's view and questions for a design review. *Kept in:* trade-offs, verticals, failure-modes, ca-view, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | claim | Every marketplace has an opinion about which listing comes first: even newest first is a ranking policy with winners, so there is no neutral order, only orders whose effects are measured or not. | example: Newest first favors frequent posters, makes the bump possible and puts a bike listed a minute ago above a better match listed yesterday. |  |\n| p02 | explanation | Ranking in a listing marketplace is harder than in retail search because inventory is unique and short-lived, the outcome that matters is rare and delayed, and the marketplace serves two sides at once, some of whom have paid. |  | `elaboration`: No order is neutral. → Why choosing the order is harder for listings than for retail. |\n| p03 | transition | Ranking is where Part IV decides how fairly fresh supply turns into contacts: this chapter orders the candidates that search architecture retrieved and query understanding interpreted, owns learning to rank, paid-organic blending and ranking transparency, and only points to the chapters that own entitlements, experimentation and regulation. | reasoning: Part IV's test (how fast and how fairly supply becomes contacts); search-architecture and query-understanding before; part-6 paid products and recommendations after; products-and-entitlements, experimentation and marketplace-regulation as owners of neighbouring topics. | `sequence`: Why ordering listings is hard. → Where this chapter sits in Part IV and what it owns. |\n| p04 | transition | The chapter starts from Tradeyard's boost archaeology, defines ranking, lays out the architecture, works through learning to rank, the ranking policy's rules (default sort and bumps, exploration slots and per-seller caps), paid blending, transparency and evaluation, applies them in Veldmark's Ranking policy v1, and ends with trade-offs, vertical differences, failure modes, the Chief Architect's view and review questions, drawing on published marketplace ranking work, EU law and the fictional Veldmark. |  | `sequence`: What the chapter owns. → The order in which it covers it and the kinds of evidence. |\n\n## Sections\n\n### Setting the Scene at Veldmark: The \"Top Listing\" Boost That Ate Relevance\n\n**Controlling idea** (`context`, id `scene`): Tradeyard's first page was shaped by five paid-visibility boosts added over nine years and tested only on revenue, which pushed relevant listings down and made the forum ask what should own the order.\n\n**Advances the thesis** (S1): Shows Multiplier Creep happening, with its cost to buyers and new sellers, and poses the chapter's question.\n\n**Transition in:** `example`: The chapter's map and its claim that no order is neutral. → The running example: what a Tradeyard Netherlands buyer actually sees.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): A framed narrative: the question (April 2027), the archaeology of 2016-2025 that answers it, the measured effect, one listing that shows it, then the objections that turn the finding into the chapter's question.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | context | Veldmark earns €150 million a year from Tradeyard's paid visibility products, and in April 2027 Ingrid Halvorsen asked Priya Raman's team what a buyer in Tradeyard Netherlands actually sees on the first page. | scenario: VAS revenue €150M (bumps, top listings, highlights); Ingrid joined in February 2027; the question to Priya Raman's data team in April 2027. |  |\n| p06 | evidence | Tradeyard's ranking was not designed but deposited: five paid-visibility changes from 2016 to 2025 accumulated in Yardstick's Solr configuration and templates, each asked for by a different team. | table: 2016 top listing with three reserved slots; 2019 bump overwriting sort_date; 2021 relevance default with a ×1.8 top-listing multiplier; 2023 bump recency boost in relevance sort; 2025 ×1.3 Visibility Plus multiplier.; figure: Figure 1: five boost layers burying relevance. | `elaboration`: Ingrid's question about the first page. → The answer: an archaeology report of five layers. |\n| p07 | evidence (list) | Each change was reasonable and was A/B tested on revenue alone, never against the others, and together they filled the first page with paid listings while contacts and new sellers' first contacts fell. | statistic: Paid share of first-page positions 12% (2021) to 38% (2027); almost a third below median organic relevance; sessions with a contact 10.6% (2021) to 9.4% (2026) while VAS revenue grew; new private listings with no contact in 48 hours 24% to 33%. | `cause_effect`: Five layers, each added for a reason. → What their untested sum did to the page. |\n| p08 | example | Femke's €240 city bike makes the drift concrete: it sat at position 14 for 'stadsfiets' below paid slots, poorly matched listings and four listings from one reseller, and her first contact came from saved searches, not from ranking. | scenario: Listed 19:42 on Sunday 7 March 2027, searchable 19:48; at 19:50 position 14 under three top-listing slots, two e-bikes around €1,400, a children's bike and four Visibility Plus reseller listings; first contact at 19:55 from one of 312 matching saved searches. | `example`: The aggregate figures of the drift. → One familiar listing that shows it. |\n| p09 | counterargument | Monetization and the search platform each raised a fair objection, revenue that funds free listings and an engine migration nobody wanted to port boosts into, so the forum's question became what should own the order of a results page and how to know when it is wrong. | scenario: Olivier Petit: sellers buy top listings because they work and the revenue funds free private listings. Tomasz Wiśniewski: Solr to OpenSearch by end of 2028, nobody wants to port five layers of unowned boosts. | `contrast`: The evidence that the boosts hurt buyers and sellers. → The case for paid visibility and the engine constraint, which reframe the question. |\n\n### What Ranking Is: Prominence, Not a Sort\n\n**Controlling idea** (`definition`, id `concepts`): Ranking is the relative prominence of listings on any surface, built from separable parts (sort order, relevance model, ranking policy, exposure) fed by signal families with different owners and risks.\n\n**Advances the thesis** (S1, S2, S5): Defines the terms the architecture separates and shows why paid and trust signals need an explainable layer.\n\n**Transition in:** `sequence`: The forum's question of what should own the order. → A definition of the order precise enough to assign ownership.\n\n**Order of paragraphs** (`large_to_small`): The legal definition first, then the working terms, then the signals, then the rules the signals imply.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | definition (list) | The Omnibus Directive defines ranking as relative prominence irrespective of the technological means, which makes reserved slots, every ordered surface and template rules all ranking. | quotation: Directive (EU) 2019/2161, Art. 3: 'the relative prominence given to products, as presented, organised or communicated by the trader, irrespective of the technological means used...' |  |\n| p11 | definition (list) | Four working terms separate the parts of the order: sort order, relevance model, ranking policy and exposure. |  | `elaboration`: The legal definition of ranking. → The four terms the chapter uses for its parts. |\n| p12 | description | Ranking signals fall into families with different owners, update rates and risks, which is the reference for any proposal to 'just add a boost'. | table: Nine signal families (query match, geography, freshness, listing quality, engagement, seller, trust, paid, personal) with examples, source, update rate and main risk. | `sequence`: The relevance model and the policy as consumers of inputs. → The families of signals they consume. |\n| p13 | analysis | Two rules follow from the signal table: fast-changing signals stay out of the inverted index, and paid and trust signals carry legal duties, so they belong in a layer that can be logged and explained. |  | `cause_effect`: The signal families and their risks. → Two design rules that follow from them. |\n\n### Architecture: Model, Policy Layer and Ranking Log\n\n**Controlling idea** (`description`, id `architecture`): A listing ranking function is a multi-stage pipeline plus a separate ranking policy layer and a ranking log, each with a written contract, in which the relevance model reads no entitlements and every page records features, positions, policy version and reasons.\n\n**Advances the thesis** (S2): Lays out the components, their contracts and the interfaces that keep model, policy and log apart.\n\n**Transition in:** `cause_effect`: Paid and trust signals need a layer that can be logged and explained. → An architecture with that layer.\n\n**Order of paragraphs** (`large_to_small`): The industry's staged shape, the stage added for listings, the contracts of each component, the most important rule, then the data each query records and the interfaces that make it work.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | evidence | Marketplaces that publish their designs converge on a multi-stage pipeline in which each stage scores fewer candidates with a more expensive method. | source: Airbnb 2026: retrieval of tens of thousands, a first-stage neural ranker, a set-wise re-ranker; Vespa first, second and global phases; Vinted 2024 ranking 200,000 candidates per query after moving to Vespa. |  |\n| p15 | recommendation | For a listing marketplace the author adds a ranking policy layer that published papers rarely draw separately, because that is where business rules live. | figure: Figure 2: retrieval, relevance model, ranking policy, the results page (presentation) and the ranking log, the five components of the contract table. | `contrast`: The staged pipeline published papers describe. → The stage they rarely draw: the ranking policy layer. |\n| p16 | description | Each component needs a written contract stating its responsibility, what it owns and what it must not do, because Tradeyard's failure was missing boundaries rather than bad engineering. | table: Retrieval, relevance model, ranking policy, presentation and ranking log with responsibility, owns and must not. | `elaboration`: The four stages. → The contract of each component. |\n| p17 | claim | The relevance model must not read entitlements, because a model that sees payment learns that paid listings get contacts and turns payment into relevance; OLX's 2025 stack shows how such coupling makes a retrieval change a monetization change. | quotation: OLX 2025: a 'VAS LTR' model 'balances two objectives: maximizing relevance for users and ensuring visibility for Value Added Services (VAS)'; after adding vector retrieval the model under-scored semantic results, 'particularly problematic for VAS ads', and had to be retrained. | `emphasis`: The contracts in the table. → The one rule that matters most: no entitlements in the model. |\n| p18 | description | Every ranked page produces data that training, delivery reporting, experiment analysis and regulatory explanation depend on, as one ranked query shows. | figure: Figure 3: one ranked query; entitlement effects read from a fast read model; the ranking service logs features as served, positions and policy version. | `elaboration`: The components and their contracts. → What one query records and who uses it. |\n| p19 | process (list) | Three interface decisions make the separation work: entitlement effects arrive as data, the policy is versioned configuration, and every result carries a reason code. |  | `elaboration`: What one ranked query records. → The interface decisions that make it possible. |\n\n### Learning to Rank\n\n**Controlling idea** (`explanation`, id `ltr`): The relevance model should be a learned ranker trained on contacts with two-sided labels, from features logged as served and corrected for position bias.\n\n**Advances the thesis** (S3): Specifies the model the policy sits on.\n\n**Transition in:** `sequence`: The components and their contracts. → The first component to fill in: the relevance model.\n\n**Order of paragraphs** (`prerequisite_order`): What LTR is, then what it learns from, which model learns it, which data it trains on, and the bias in that data and its correction; the effect of that bias on new listings is taken up by the policy, which answers it with exploration slots.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p23 | definition | Learning to rank is supervised machine learning that orders candidates from logged outcomes, and it replaced hand-tuned scoring because hand weights stop scaling beyond a handful of signals. |  |  |\n| p24 | comparison | The choice of label is the most consequential design decision, a business decision disguised as a technical one. | table: Click, save, contact, transaction and lead quality with volume, bias and fit. | `sequence`: What learning to rank is. → The first decision: what it learns from. |\n| p25 | explanation | Because contacts are sparse, most marketplaces combine them with auxiliary labels, and a two-sided label that counts an unanswered contact as less rewards listings that produce matches. | source: Airbnb 2023 Journey Ranker: intermediate guest actions as milestones plus host-side outcomes (rejections, cancellations). | `problem_solution`: Contacts are the right but sparse label. → A multi-task, two-sided objective. |\n| p26 | evidence | The published lineage runs from gradient-boosted trees to neural networks once tree gains plateau, as Airbnb's papers show, and Etsy's results show that learned models pay at that scale. | source: Airbnb 2018 ('deep learning was steep learning for us'), 2020 (position bias, cold start), 2022 (diversity), 2024 (maps); Etsy 2023 unified embeddings +5.58% search purchase rate. | `sequence`: What the model learns from. → Which model family learns it. |\n| p27 | evidence | Closer to classifieds, mobile.de uses XGBoost learning to rank and leboncoin a two-tower re-ranker, the latter's gains reported only by secondary sources. | source: mobile.de, Berlin Buzzwords June 2024: XGBoost LTR, millions of searches a day, under 30 ms. leboncoin 2023: DistilBERT two-tower re-ranker of Elasticsearch's top candidates, up to 5% more clicks and contacts per secondary write-ups. | `contrast`: Airbnb and Etsy, outside classifieds. → Classifieds operators. |\n| p28 | recommendation | The author's default for a mid-sized marketplace is a GBDT ranker with a LambdaMART-style objective trained on contacts, moving to neural re-rankers only when three conditions hold. | reasoning: Conditions: tree gains plateaued online, text and image understanding limit quality, GPU inference fits the latency budget; not met for Tradeyard Portugal, possibly for Tradeyard Netherlands. | `cause_effect`: The evidence from large operators and classifieds. → The author's default and its conditions. |\n| p29 | process | Learning to rank needs feature values as the ranker saw them, so the ranking service logs the feature vector of every scored candidate and training joins it to outcomes by impression. | reasoning: Recomputing features from today's data causes training-serving skew; sampling non-shown candidates is the usual compromise. | `sequence`: The model and its objective. → The training data the model needs. |\n| p30 | evidence | Training on clicks from the current ranking teaches the model to reproduce it, and propensity weighting corrects that position bias even when queries rarely repeat. | source: Joachims, Swaminathan and Schnabel 2017: propensity-weighted clicks give unbiased LTR without repeated queries; Airbnb 2020: position-bias handling gave 'one of the largest gains'. | `contrast`: Features logged as served remove one distortion. → A second distortion in the outcomes: position bias. |\n\n### Ranking Policy: Default Sort, Bumps, Exploration and Seller Caps\n\n**Controlling idea** (`analysis`, id `freshness`): The ranking policy's rules share attention: the default sort decides who wins without any user choosing; newest first is legitimate where recency is relevance; bumps stay sound only as separate, bounded ranking events rather than a second multiplier; and exploration slots for new listings and per-seller caps are further exposure rules of the same policy.\n\n**Advances the thesis** (S1, S2, S3): Gathers the policy's exposure rules under one heading: the oldest rule, freshness and the bump, where Tradeyard broke it, then exploration slots for new listings and the per-seller cap.\n\n**Transition in:** `sequence`: The relevance model, corrected for position bias. → The ranking policy above it, starting with its oldest rule: the default sort and the bump.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The claim that the default is political, the case for newest first with the rules that keep its bump sound, the Tradeyard failure that shows why the bump must be a bounded policy term under a relevance default (the bounded term itself is stated in Ranking policy v1), then the other exposure rules of the policy: exploration slots for new listings (the listings the cold-start loop hurts most, which position-bias correction cannot fix), exposure as an allocated resource, and the per-seller cap.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p20 | comparison | The default sort is the sort order a buyer gets before choosing one; the marketplace sets it, so it is a policy decision and the most political in a classifieds product, and its three common options each favor different sellers. | table: Newest first, relevance, hybrid: what each optimizes, who it favors and where it fits. |  |\n| p21 | recommendation (list) | Newest first is not naive, since for bargain hunters recency is relevance, which is why the bump sells well; four rules keep bumps sound. | fact: mobile.de's API keeps renewalDate apart from creationDate.; example: Tradeyard overwrote the creation date in 2019. | `contrast`: Newest first favors frequent posters. → Where recency is relevance, and the rules that keep its paid product sound. |\n| p22 | analysis | When relevance is the default the bump becomes a term of the policy, and Tradeyard's 2023 change shows the failure: the bump kept its newest-first effect and gained a relevance multiplier, buying two kinds of prominence nobody decided on. | example: 2023 bump recency boost in relevance sort on top of the 2019 re-dating. | `cause_effect`: The four bump rules under newest first. → What happens to the bump under a relevance default. |\n| p31 | recommendation (list) | New listings need exposure most and cannot earn it, because of the cold-start loop (no engagement history means low rank means no engagement), which position-bias correction cannot fix and which in classifieds is a supply problem; two tools address it: exploration slots in the policy and content-based priors in the model. | reasoning: No engagement history means low rank means no engagement; a private seller whose first listing gets no early contact often does not list again (local liquidity). | `contrast`: The bump, exposure a seller buys through recency. → New listings, which need exposure most and can neither buy nor earn it, because of the cold-start loop that position-bias correction does not fix. |\n| p32 | explanation | Exploration slots, like the bump before them and the per-seller cap after them, are exposure rules that decide how attention is shared, and Singh and Joachims framed exposure as a resource a ranking allocates under constraints. | source: Singh and Joachims 2018: constrain how exposure is distributed while maximizing user utility. | `similarity`: The bump and now exploration slots, as ways the policy shares attention. → Exposure as a resource the ranking allocates, which the per-seller cap also governs. |\n| p33 | recommendation | Because listings on a page are not independent, a per-seller cap tunable per category is a policy rule, not a model feature, protecting buyers from monotony and private sellers from being buried. | source: Airbnb 2022: booking probability depends on what else is shown; similarity-aware ranking reduces redundancy.; example: One professional seller with two hundred near-identical listings; at most three per seller in the first twenty; new-car inventory where one dealer group holds most stock. | `additional_support`: Exposure as an allocated resource. → A second exposure rule: the per-seller cap. |\n\n### Blending Paid Visibility with Organic Results\n\n**Controlling idea** (`comparison`, id `blending`): Paid visibility should compete with organic results in one ordering under a relevance floor and a cap, be sold as guaranteed exposure and counted by delivery events, measured causally and shown once per page.\n\n**Advances the thesis** (S4): Compares the blending options, argues for the floor and cap, and adds the accounting a paid product needs.\n\n**Transition in:** `sequence`: A relevance model with no entitlements, and the ranking policy's exposure rules (default sort and bump, exploration slots, per-seller cap). → Paid visibility as the policy's last and most contested rule: how paid positions enter the order.\n\n**Order of paragraphs** (`problem_solution`): The options, the evidence for the floor, the classifieds complications, then the accounting and page rules the chosen design needs.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p34 | comparison | Paid visibility is a product to keep honest rather than hide, and the design question is how it competes with organic results; the table compares four approaches, and only unified ranking with a relevance floor and a cap removes a paid listing that would hurt the page. | table: Fixed slots, score multiplier, separate auction then merge, unified ranking with a relevance floor: how each works, strength, risk, evidence. |  |\n| p35 | evidence | eBay's 2020 unified ranker is the clearest public statement of the floor: promoted and organic listings compete, and no promoted listings appear at the top when few relevant items exist. | source: eBay 2020: promoted and organic previously came from two stacks; the unified ranker weighs relevance, past performance and ad rate; no promoted listings on top when few relevant items exist. The source is six years old. | `example`: The unified approach in the table. → eBay's public description of it. |\n| p36 | analysis (list) | Classifieds add two complications retail does not have: paid products are sold as positions, so product and ranking must change together, and private sellers buy them, so guaranteed exposure replaces unconditional position. |  | `contrast`: eBay's retail sponsored listings. → What is different for classifieds. |\n| p37 | process | Whatever the blending rule, the ranking log must emit delivery events that billing reconciles, so a seller can be told whether they got what they paid for. | reasoning: Impressions in paid slots, positions and queries emitted by the ranking log; reconciliation owned by products-and-entitlements. | `cause_effect`: Paid products sold as guaranteed exposure. → The counting that guarantee requires. |\n| p38 | evidence | Counting what was delivered is the easier half; measuring whether paid exposure creates value needs causal methods, because sellers self-select into packages. | statistic: OLX 2026: premium boost packages for professional car sellers looked worse than cheaper ones in naive dashboards; propensity-score matching validated by a randomized test showed uplifts of 17.6% to 97.4% between package levels. | `contrast`: Counting what was delivered. → Measuring what the delivery was worth. |\n| p39 | recommendation | A listing should appear once per page, in the higher position, which requires the policy layer to see paid and organic lists together. |  | `additional_support`: Delivery and value accounting for paid products. → One more page rule that only the policy layer can apply. |\n\n### Transparency: Ranking as a Regulated Function\n\n**Controlling idea** (`explanation`, id `transparency`): EU law requires a marketplace to describe its main ranking parameters and what payment does to them, label paid results and give reasons for demotions, which is cheap only when the policy is explicit configuration with reason codes.\n\n**Advances the thesis** (S5): Maps the legal duties to engineering consequences and shows that the layered design meets them by construction.\n\n**Transition in:** `cause_effect`: Paid positions sold, labeled and counted in the order. → The legal duties that attach to that order.\n\n**Order of paragraphs** (`large_to_small`): The whole legal map, its caveats, the most surprising duty, then the single design answer.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p40 | description | Three EU instruments apply to a classifieds group and a fourth to the largest platforms, each with an engineering consequence for the ranking function. | table: P2B Art. 5; Omnibus Annex I 11a and UCPD Art. 7(4a); DSA Arts. 26, 27 and 17; DSA Art. 38: what each requires and its engineering consequence. |  |\n| p41 | explanation | Two cautions qualify the table: the P2B Regulation may be repealed, and whether a private seller's promoted listing is an advertisement under the DSA is a legal judgment. | source: Commission proposal of 19 November 2025 to repeal P2B; a proposal as of October 2026; ranking guidelines proposed to remain. | `contrast`: The table of obligations. → Its two uncertain points. |\n| p42 | analysis | Under DSA Art. 17 a quiet demotion of suspected fraud is a restriction owed a statement of reasons, so trust demotions must be enforcement actions applied by the policy with a reason code. |  | `emphasis`: The four instruments. → The point that surprises ranking teams most. |\n| p43 | claim | The architectural answer to all four obligations is the same: explicit policy configuration and per-result reason codes make the description generated, the labels correct and the audit trail present. |  | `conclusion_summary`: Each obligation and its consequence. → The one design that meets them all. |\n\n### Evaluating Ranking Changes\n\n**Controlling idea** (`explanation`, id `evaluation`): A ranking change is judged offline, online and after rollout, each with a known trap, and every experiment reports fixed guardrails whose owners must decide on any breach.\n\n**Advances the thesis** (S6): Gives the methods and guardrails that answer 'how will we know when it is wrong'.\n\n**Transition in:** `sequence`: A model and policy that can be changed and explained. → How to know whether a change is better.\n\n**Order of paragraphs** (`chronological`): The three stages in the order a change meets them, then the guardrails and the rule that applies across all stages.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p44 | claim | A ranking change is judged three times, offline, online and after rollout, and each stage has a known trap. |  |  |\n| p45 | evidence | Offline NDCG on logged data predicts online results poorly, because logs hold only what was shown and list metrics ignore maps. | source: Airbnb 2026: replaying production traffic against the current ranker's top results tracked A/B outcomes better; Airbnb 2025: maps about 80% of search interactions, map-specific NDCG. | `sequence`: Three stages. → The first stage: offline. |\n| p46 | evidence | Online tests on rare contacts need large samples, and interleaving raises sensitivity for model comparisons but not for page-level policy changes. | statistic: Airbnb 2025: interleaving and counterfactual methods raised sensitivity by up to 100×. | `sequence`: Offline evaluation. → Online evaluation. |\n| p47 | evidence | Buyers in treatment and control compete for the same listings, so buyer-randomized tests of attention-moving changes overstate lifts, and seller-side, two-sided or cluster randomization reduces the bias. | source: Johari et al. 2020: customer-side randomization biased when supply-constrained, listing-side when demand-constrained. | `sequence`: Online tests. → Interference, the trap after rollout. |\n| p48 | recommendation | Every ranking experiment reports a fixed set of guardrails beside its primary metric, covering buyers, new sellers, concentration, paid delivery, paid share, ghost listings and latency. | table: Seven guardrails with why and a typical threshold. | `elaboration`: The methods for judging a change. → What every judgement must report. |\n| p49 | recommendation | A change that wins on the primary metric and breaches a guardrail ships only by explicit decision of the guardrail's owners, which turns an experiment win into group governance. |  | `cause_effect`: The fixed guardrails. → The rule for when one is breached. |\n\n### The Veldmark Remedy: Ranking Policy v1\n\n**Controlling idea** (`example`, id `remedy`): Veldmark's ranking decision applies the chapter's layering to Tradeyard, and a cluster-randomized test shows the relevance floor made the paid product better at a small revenue cost.\n\n**Advances the thesis** (S2, S3, S4, S5, S6): Runs the whole design on the scene's problem with numbers.\n\n**Transition in:** `problem_solution`: Tradeyard's five boost layers, the forum's question and the design the chapter has built. → Veldmark's decision and its test.\n\n**Order of paragraphs** (`chronological`): Decision, test, then the result's meaning and the go-live.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p50 | example (list) | The June 2027 decision record had five parts: an engine-agnostic ranking service, a relevance model trained on contacts, Ranking policy v1 as versioned configuration, delivery and transparency by construction, and a product change with the ranking change. | scenario: Top 500 candidates through Listing Search API v1 within a 40 ms re-ranking budget; GBDT on two-sided labels with no entitlement features; floor at the 20th organic result; at most 4 paid in the first 20; bumps bounded to four positions; Visibility Plus no longer a multiplier; at most 3 per seller; two exploration positions in the first 30; reason codes and delivery events; generated parameters page reviewed by Lucía Ortega; top listing repositioned as seven days of guaranteed prominence; Spotlight withdrawn. |  |\n| p51 | evidence | The cluster-randomized experiment in Tradeyard Netherlands raised contacts and contacts per top listing sold while cutting the paid share of the first page, at a small revenue cost. | table: 6 September to 17 October 2027, category × region clusters: sessions with a contact 9.4% to 9.9% (+5.3%); new private listings with a contact within 48 hours 67% to 71% (+6.0%); paid share 38% to 17%; contacts per top listing sold +21%; VAS revenue per search −2.5%. | `time`: The decision. → Its test. |\n| p52 | analysis | Fewer paid positions were shown but each where it fit, so paying sellers got more contacts per euro, which carried the decision and its go-live. | scenario: Henrik de Boer approved the 2.5% revenue cost with monthly delivery reporting; live in Tradeyard NL and BE on Wednesday 1 December 2027, PL and PT with the move to OpenSearch.; figure: Figure 4: before and after results pages with the relevance floor. | `cause_effect`: The experiment's numbers. → Why they carried the decision. |\n\n### Trade-offs\n\n**Controlling idea** (`comparison`, id `trade-offs`): Each choice in the chapter, from the default sort to the experiment unit, has conditions under which the other option is right.\n\n**Advances the thesis** (S2, S3, S4, S6): Bounds the recommendations by stating when the alternatives fit.\n\n**Transition in:** `contrast`: The choices made for Tradeyard. → When other choices fit.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p53 | comparison | No choice in this chapter is right everywhere, and seven decisions each have a condition for the other option. | table: Default sort, where ranking runs, model family, paid blending, label, personalization, experiment unit: option A, option B and when to choose each. |  |\n\n### Vertical Differences\n\n**Controlling idea** (`comparison`, id `verticals`): Ranking differs more by vertical than by country, and in automotive and real estate a ranking signal becomes a business dispute.\n\n**Advances the thesis** (S1, S4): Shows how query shape, freshness, supply concerns and paid products change the policy by vertical.\n\n**Transition in:** `elaboration`: Trade-offs by situation. → Differences by vertical.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p54 | comparison | Ranking physics differ more by vertical than by country. | table: General classifieds, automotive, real estate and jobs compared on query shape, freshness half-life, supply concern, paid product, distinctive signal and risk. |  |\n| p55 | example | Two cells turn a ranking signal into a business dispute: Motorvane's price rating becomes an exposure model, and Hearthly must decide which agency's listing represents a duplicate cluster without favoring payers. | scenario: Essen Golf rated a 'good price' at €21,900 against an estimate of €22,800; the Lyon apartment's three agency listings; the March 2027 Keybridge neutrality commitment; the author's rule: most complete and most recently updated listing, paid tier as a disclosed tie-breaker at most. | `example`: The vertical table. → Two cells from it that become disputes. |\n\n### Failure Modes\n\n**Controlling idea** (`description`, id `failure-modes`): Eight recurring failure modes, each with a warning sign, show how ranking goes wrong when the chapter's separations are missing.\n\n**Advances the thesis** (S1, S2, S3, S5, S6): Turns each claim into a failure to watch for.\n\n**Transition in:** `contrast`: How to choose well by situation and vertical. → How ranking goes wrong everywhere when the separation of model, policy and log is missing.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p56 | description (list) | Eight failure modes, from boost accretion to one policy for every country, each come with a warning sign a reviewer can check. |  |  |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `ca-view`): Because every part of the business believes it owns ranking, the Chief Architect makes the claims coexist in a structure: a group standard for layering, a ranking council per brand, shared machinery with local values, and a short list of metrics to watch.\n\n**Advances the thesis** (S6): States what to decide at group level, who owns the objective and what to watch.\n\n**Transition in:** `problem_solution`: The failure modes. → The decisions that prevent them at group level.\n\n**Order of paragraphs** (`prerequisite_order`): Why the role exists, then the decisions it makes, then the indicators that show whether those decisions hold, then the long-term consideration that depends on them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p57 | claim | Most failures start with unclear ownership: search, monetization, trust, pro sales and legal each believe they own ranking, and the Chief Architect's job is to make those claims coexist in a structure rather than in an unreadable configuration file. |  |  |\n| p58 | recommendation (list) | At group level the Chief Architect decides the layering standard, gives each brand a ranking council that owns the objective, and shares the machinery of ranking while keeping models and policy values local. |  | `elaboration`: The competing claims of ownership. → The structure that holds them. |\n| p59 | recommendation (list) | Five indicators show whether ranking is healthy: paid share of the first page, new-listing first contacts, delivery against sold, model freshness with an owner, and regulatory change. |  | `sequence`: What to decide. → What to watch. |\n| p60 | recommendation | In the long term machines also consume ranking, and the ranking service's output contract with reason codes and paid flags is what lets the group enforce how its order is presented elsewhere. |  | `time`: What to watch now. → The long-term consideration. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Ten review questions test a ranking design against the chapter's claims.\n\n**Advances the thesis** (S1, S2, S3, S4, S5, S6): Turns each claim into a question for a design review.\n\n**Transition in:** `conclusion_summary`: The decisions and indicators. → Questions that check them in a review.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p61 | recommendation (list) | Ten questions check a ranking design in a review, from listing every factor that moves a listing to what would need rebuilding on an engine change. |  |  |\n\n## Conclusion: From Ranking to Recommendations\n\n**Synthesis:** The forum's two questions have one answer: the order is owned when the model says what buyers will act on, the policy says what the business adds and within what bounds, and the log proves both. That separation is what lets the same order be trained, billed, explained to a regulator and moved to another engine, and it is why a floor could make paid listings more valuable rather than less: only with entitlements kept out of the model can the policy apply a floor, so each paid listing reaches buyers whose query it matched.\n\n**So what:** A group that keeps model, policy and log apart can change any one of them, the model, a paid product or the engine, without breaking the others; a group that mixes them gets Multiplier Creep and cannot move its ranking.\n\n**Callback:** The opening claim that there is no neutral order, only orders whose effects someone has measured, and Femke's bike at position 14. Ranking policy v1 is an order whose effects are measured and owned, with exploration positions for new listings like Femke's and paid listings only where they match.\n\n**Takeaway** (`course_of_action`): Separate the relevance model from a versioned ranking policy, put paid visibility under a floor and a cap, log features, positions and reasons, and judge every change on contacts with seller-side guardrails.\n\n**Hand-off** to [Recommendations for Inventory That Disappears](recommendations.html): `contrast`: Ranking's machinery (candidate generation, re-ranking, exposure policy and position-corrected logging), which orders what a buyer asked for. → Surfaces with no query to anchor relevance, such as similar listings and home feeds, where every listing is a cold start and may be gone before the buyer clicks.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p62 | synthesis | The forum's question has one answer: the model says what buyers will act on, the policy says what the business adds and within what bounds, and the log proves both, so the order can be trained, billed, explained and moved, and has stopped being neutral by accident. |  |  |\n| p63 | transition | Ranking orders what a buyer asked for; recommendations reuse its machinery for what the buyer did not ask for, without a query to anchor relevance. |  | `contrast`: The ranking machinery, which orders what the buyer asked for. → Surfaces without a query, the next chapter. |\n\n## Non-goals\n\n- Engine choice, index design, update storms and reindexing. See [Search Architecture for Listings: Indices, Freshness and Scale](search-architecture.html).\n- Query parsing, synonyms and hybrid retrieval. See [What Did They Mean? Query Understanding and Autocomplete](query-understanding.html).\n- Product catalog, entitlement ledger and sold-versus-delivered reconciliation. See [Packages, Bumps and Quotas: Products, Pricing and Entitlements](products-and-entitlements.html).\n- Revenue models. See [How Listing Marketplaces Make Money](monetization-models.html).\n- Interference designs in depth. See [Testing a Two-Sided Market: Experimentation Platforms](experimentation.html).\n- Model governance. See [Models in Production: ML Platforms and Use Cases](ml-platform.html).\n- The full regulatory map. See [Rules of the Marketplace: DSA, DAC7 and Vertical Regulation](marketplace-regulation.html).\n- Map-specific ranking. See [Searching by Place: Map, Polygon and Commute Search](map-search.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- P2B repeal: the 19 November 2025 proposal is still pending as of October 2026. Recheck its status before print. (Carried over from spec.md.)\n- Does a promoted listing bought by a private seller count as an \"advertisement\" under DSA Art. 26? The chapter labels this as a legal judgment and takes the prudent reading. (Carried over from spec.md.)\n- The DSA article texts were read from an unofficial mirror. Check the wording against EUR-Lex. (Carried over from spec.md.)\n- The leboncoin re-ranker figures rest on secondary sources, because the primary Medium post returned 403. (Carried over from spec.md.)\n- No classifieds operator has published its bump mechanics or seller-exposure caps. The chapter presents those as industry practice and recommendation. (Carried over from spec.md.)\n\n## Decision log\n\n- **2026-10-19** — Built the chapter around the separation of the relevance model from the ranking policy, rather than around algorithms. The Multiplier Creep failure is organizational and architectural, and an algorithm survey would not show it.\n- **2026-10-19** — Told the Veldmark case as \"boost archaeology\", a dated table of five accreted rules, so that the mechanism of drift is concrete. Reused the Rotterdam city bike (position 14; first contact came from saved searches) without changing any ledger fact.\n- **2026-10-19** — Recommended GBDT LambdaMART-style ranking as the default and neural re-rankers conditionally, grounded in mobile.de (2024) and the Airbnb lineage. Rejected: A neural-first recommendation.\n- **2026-10-19** — Made the experiment cluster-randomized (category × region) and reported a revenue cost (−2.5% VAS revenue per search) alongside the gains, to keep the trade-off honest.\n- **2026-11-12** — Success criteria of spec.md not carried over as such: the journal entry's AC-1 to AC-3 replace them. The criteria on the four-stage function, the 'no entitlements' rule, blending options, delivery accounting, evaluation methods and guardrails are covered by AC-1; the LTR criterion (labels, features as served, position bias, exploration) becomes the minor post-level AC-4; the regulatory-mapping criterion is narrowed to its most consequential case, demotion as a restriction, as the minor AC-5; the definitions and signal-table criterion and the bump criterion are covered by the reverse outline of the concepts and freshness sections; the Veldmark-case criterion (an inventory of contents) was dropped.\n- **2026-11-12** — Thesis rubric (copied thesis): PASS on all four tests; the reader noted the claim packs many parts into one sentence, which fails no test. Flow rubric: sound with notes. Acted on: the post rationale now says why freshness precedes learning to rank and why evaluation follows transparency; the scene's pattern relabeled as a framed narrative (assertion, evidence, reasoning), Freshness relabeled to match its ending, the Chief Architect's view relabeled as prerequisite order; the conclusion's so-what states the cost of mixing the parts (Multiplier Creep). Order unchanged. Notes not taken are in open_questions.\n- **2026-11-12** — Draft check round 1 ESCALATE on two spec-fault flow findings corroborated by both flow readers: the order policy (Freshness) - model (Learning to Rank) - policy (Blending) made readers rebuild the pipeline picture, and exposure rules sat in the model section. Under the brief's rule for spec faults, swapped the Freshness and Learning to Rank sections (now model first, then the policy's rules side by side), rewrote the transitions into ltr, freshness and blending, the flow rationale, the roadmap order (p04 and the IN THIS CHAPTER callout) and the large_to_small note. Intent, thesis, role and journal criteria unchanged; no units added, dropped or merged. Rejected: Keeping the published order and only rewording the rationale (the flow rubric's alternative), because two cold readers independently lost the thread on it.\n- **2026-11-12** — Draft check round 2 ESCALATE on one spec-fault flow finding corroborated by both flow readers (exposure rules in the model section). Under the brief's rule, moved p32-p33 (exposure as an allocated resource, per-seller caps) from Learning to Rank to the end of Freshness, rewrote p32's transition (similarity to freshness as a share of attention), the section ideas and flows of ltr and freshness, the blending transition and the roadmap promise; reworded p31 so exploration is a policy rule and content priors a model input. No units added, dropped or merged; intent, thesis, role and journal criteria unchanged.\n- **2026-11-12** — Added minor, post-level units not in the published text: a roadmap paragraph (p04) so the opening announces every section and the kinds of evidence, and a synthesis paragraph (p62) with a callback to the opening's 'no neutral order' and Femke's bike. Added criteria AC-4 and AC-5 are minor.\n- **2026-11-12** — Round 3 escalation resolved under the author's delegation (auto-resolve), spec-fault order finding corroborated by both flow readers: the policy's exposure rules now sit under one heading. The Freshness section is retitled 'Ranking Policy: Default Sort, Bumps, Exploration and Seller Caps'; p31 (new listings, exploration slots, content priors) moved from the end of Learning to Rank to that section, after p22 and before p32, under the subheading 'Exposure: new listings and per-seller caps'; the LTR subheading is now 'Position bias'. Rewrote the transitions into freshness, p31, p32 and blending, the ltr and freshness ideas and flows, the post flow rationale, p04 and the roadmap promises; p32 no longer names the per-seller cap as if already introduced. Paid blending keeps its published heading (rule: keep published text when no option is clearly better) and opens as the policy's last rule. Journal-spec AC-2 expected answer needs the new order (reported to the orchestrator).\n- **2026-11-12** — Draft faults blocked by the word limit, fixed under the author's delegation: length.max_words raised from 8,288 to 8,500 (+2.6%, within the 10% allowance); p34 now says what the blending table shows (only a floor and a cap remove a paid listing that would hurt the page; multipliers are unbounded) and names the cap in prose; 'cannibalization model' glossed in the table; the Failure Modes lead now states the declared contrast (choices between sound designs by situation and vertical vs failures everywhere without the separations); p20 introduces the ranking policy and the default sort as the order a buyer gets before choosing any; 'Spotlight' glossed in p50 as the private-seller upgrade guaranteeing the first reserved slot for 48 hours (as stated in monetization-models), keeping the published fact that the forum deferred it in May and Ranking policy v1 withdrew it (ledger, monetization-models line).\n- **2026-11-12** — Accepted under the author's delegation, 2026-11-12: the added units p04 and p62, minor criteria AC-4 and AC-5, the renamed headings, the Figure 2 alt-text fix, the 'complement' wording and the Keybridge gloss. Flow-rubric notes not taken in earlier rounds stay not taken (they would change the author's text and no option is clearly better): merging p32/p33 and p51/p52, a closing paragraph for the policy section, stating the bounded bump term in p22, moving p39, the forward and back references in p38, p43 and p59, and merging p26/p27. The empty modalities list stands until other modalities are written.\n- **2026-11-13** — Round-5 blocking findings fixed under the author's delegation (fix-only pass): 'entitlement' glossed at first use in the introduction (p03) as a seller's purchased right to a paid effect such as a top slot or a bump; sort-order definition says the ranking policy sets the default, and p20 says why the default sort is a policy decision; p31 names the cold-start loop as the reason new listings cannot earn exposure and says position-bias correction does not fix it; p32 drops the antecedent-less 'Like freshness' and names the bump and the per-seller cap as the other exposure rules; p34's four-row preview sentence shortened to the one point (only a floor with a cap removes a paid listing that would hurt the page), the table carries the rest; subheading renamed 'Delivery and value accounting' and p38 opens by contrasting counting with valuing; the conclusion names the link from the division of labor to the floor's result. Minor (one reader): 'among others' added to the position-14 list. The minor P2B colon finding is left (one reader only). length.max_words raised from 8,500 to 8,600 (+1.2%, within the 10% allowance) to fit the glosses and pointers (draft 8,506 words).\n\n## Sources\n\n- **Internal**\n  - _journals/listing-systems-architecture/journal-spec.json — Intent outcome, acceptance criteria AC-1 to AC-3, thesis, role and the hand-off relationship of recommendations.\n  - _research/scenario-ledger.md — Tradeyard VAS revenue, boost archaeology, Femke's bike, Ranking policy v1 and its experiment, cast, Essen Golf, Keybridge commitment.\n  - _research/brief-search-discovery.md Parts 5-8 — LTR lineage, blending, position bias, evaluation.\n  - _research/brief-monetization-economics.md 5.1-5.3, 9.2-9.3 — Paid products, OLX VAS LTR and causal measurement, P2B and Omnibus text.\n  - _research/brief-trust-safety-regulation.md 5.1-5.6 — DSA Arts. 17, 26, 27; demotion as restriction; P2B repeal proposal.\n  - _research/brief-platform-data-ml.md Part 9 — Interference designs.\n  - search-architecture, products-and-entitlements, experimentation, marketplace-regulation, recommendations — Neighbouring contracts.\n- **External**\n  - eBay (2020) on unified promoted-listing ranking; OLX Engineering (2025, 2026); mobile.de at Berlin Buzzwords (2024); Airbnb papers (2018-2026); Joachims et al. (2017); Singh and Joachims (2018); Johari et al. (2020) — Company and research evidence.\n  - Regulation (EU) 2019/1150 Art. 5; Directive (EU) 2019/2161; Regulation (EU) 2022/2065 Arts. 17, 26, 27 and 38 (Official Journal texts via the EU Publications Office, checked 19 Oct 2026) — The legal duties on ranking.\n\n## Changelog\n\n- **2026-11-13** — Fix-only pass on round-5 flow and known-before-new findings (entitlement gloss, default-sort reason, cold-start loop, exposure-rule framing, blending lead, delivery and value accounting, conclusion link). (AI-mediated session)\n- **2026-11-12** — Escalation resolved (author's delegation): policy exposure rules gathered under one 'Ranking Policy' heading (p31 moved from Learning to Rank), blending-table reading sentence, cannibalization and Spotlight glosses, Failure Modes lead; max_words 8,288 to 8,500. (AI-mediated session)\n- **2026-11-12** — Draft check round 3 ESCALATE; close-out fixes only (Figure 2 alt text, complement wording in the remedy table, Keybridge gloss); remaining findings in open_questions. (AI-mediated session)\n- **2026-11-12** — After draft check round 2: moved p32-p33 from Learning to Rank to Freshness; Figure 2 evidence names five components. (AI-mediated session)\n- **2026-11-12** — After draft check round 1: swapped the Freshness and Learning to Rank sections and rewrote the affected transitions and roadmap <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');

            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);

                sectionEl.appendChild(document.createTextNode(postId));

        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
