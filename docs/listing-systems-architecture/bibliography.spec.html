<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, the three acceptance criteria and the role are copied unchanged from the bibliography's entry in journal-spec.json; the thesis question is copied from that entry and the claim is written here from the Reference part's supporting claim R-3. The conclusion performs the Reference part's closing (journal-spec.json, parts/reference/closing), which the published page did not. The ~600 source entries are list items inside the topic and chapter units and are not specified one by one.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The register's rules: 587 sources harvested from the Sources and Evidence sections of 55 pages, deduplicated, with stable R-numbers that are never reused; twelve evidence types and how to read each; thirteen topic sections (six of them company sections) and a Sources by Chapter list.\n- **Be able to:** Find the sources behind a chapter or a topic, and weigh a claim by the kind and age of the source behind it.\n- **Be able to:** Tell documented facts (backed by a source here) from labeled inferences, the author's recommendations and the fictional Veldmark, which no source describes.\n\n**Audience:** Experienced architects and engineering leaders working on listing marketplaces: chief and enterprise architects of marketplace groups, principal and staff engineers, search, data and ML leads, platform-engineering leads, product and engineering directors of classifieds, real-estate, automotive, jobs and recommerce marketplaces, and technology leaders integrating acquired marketplaces.\n\n**Already knows:**\n\n- What an API, a database, an event stream, a search engine and Kubernetes are.\n- How to make and defend an architecture decision.\n\n**Does not yet know:**\n\n- Marketplace economics: liquidity, network effects, multi-homing.\n- Search and ML vocabulary: learning to rank, percolation, hybrid retrieval.\n- Regulatory detail: DSA statements of reasons, DAC7, P2B.\n- Vertical specifics: VINs, property and vehicle feed standards.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a company claim from a chapter, the reader finds its source in the register and says how far to trust it from its evidence type and year. *Probe:* A chapter says a marketplace rebuilt its search index from an event log in under 30 minutes, citing a company engineering post from 2019. Using only this page: how do you find the entry, and how far should you rely on it for how that marketplace works today? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone can say what the register includes and excludes and how to use it. *Probe:* After reading only the callouts and the paragraphs before the first heading: what does this register include and leave out, and how should you use it? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the page, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** What must the book's source register record, and how must it be organised, for a reader to weigh any claim the book makes?\n\n> **Claim:** A claim in this book can be weighed only if every source behind it is listed once, under an identifier that never changes, with the year its citing chapter gave, its evidence type and the pages that cite it, findable by topic and by chapter; a source listed without its date and type lets an engineering post from one year stand for a system as it runs today.\n\n**Disputed by:** The view that a bibliography is an alphabetical, undated reading list kept for completeness, which a reader can skip without losing anything the chapters say.\n\n**So what:** Before citing a source from the book in a decision record, a reader checks its year and evidence type here and follows a secondary entry to its primary source, and can tell which statements rest on no source at all (Veldmark, inferences, recommendations).\n\n**How and why:** Company engineering posts are the largest evidence type in the register (127 of 587), and each records one group's platform at one date; a filing records reported numbers, a regulation a requirement, trade press an event. Reading an entry's type and year tells the reader what the source can and cannot support, and the Cited in lines and Sources by Chapter connect each source to the argument that relies on it.\n\n**Supporting claims**\n\n- **B1** — Every source a page cited appears once, with an identifier that is never renumbered or reused, and nothing is listed that no page cites.\n- **B2** — Each entry's year and evidence type say how far to trust the claim it supports: a company engineering post records one platform at one date, a filing reported numbers, a regulation a requirement.\n- **B3** — The register can be entered by topic, through a topic index of contiguous identifier blocks, or by chapter, through the identifiers each page cites.\n- **B4** — Documented facts are kept distinct from what no listed source supports: the internal research briefs, labeled inferences, the author's recommendations and the fictional Veldmark.\n\n## Role in the part\n\nGives every documented fact in the book a findable source of known kind and age, and performs the reference part's closing. Supports R-3 of part `reference`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `grouping` in the thirteen topic sections (economics, six company sections, six technical topics))\n\nThe reading rules come first because an entry cannot be weighed before the reader knows what its year and type mean. The topic index comes before the topic sections it maps, and the sections follow in identifier order. Sources by Chapter comes after the entries because it lists identifiers that point into them. Put the chapter list first and the reader meets bare R-numbers with nothing to resolve them against; put the rules last and the first entries are read without knowing how far to trust them.\n\n## Introduction\n\n**Hook** (`direct_statement`): This page lists the external sources the chapters cite.\n\n**Bridge:** A reader who meets a company claim, a regulatory date or a practice recommendation in a chapter and wants to check it before relying on it. → Where the book's evidence comes from: each source once, with its year, evidence type and citing chapters, and how the October 2026 research, secondary summaries and 2026 naming shape what the entries say.\n\n**Thesis statement** (KEY POINTS callout (all three bullets).): Sources are listed because they were cited, and their dates and evidence types tell the reader how far to trust a claim; documented facts, inferences and Veldmark are kept distinct.\n\n**Roadmap** (IN THIS SECTION callout and paragraph p02.):\n\n- How to read an entry and how far each kind of evidence can be trusted. *Kept in:* how-to-read.\n- Find a source by topic: a topic index, then the thirteen topic sections that hold the entries. *Kept in:* topic-index, economics, adevinta, olx, ebay, aviv, automotive, other-marketplaces, search, trust, regulation, platform, web, method.\n- Find the sources a chapter rests on. *Kept in:* by-chapter.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | The register records sources as the October 2026 research found them: consulted then, with access, version or update dates kept where a chapter recorded them, some facts known only through secondary summaries, and names as of 2026. | fact: Research conducted in October 2026; some company pages blocked automated access; secondary summaries are a trade-press article or a third-party digest of an engineering post; Schibsted is now Vend, eBay Kleinanzeigen is now Kleinanzeigen, the former eBay Classifieds Group is part of Adevinta. |  |\n| p02 | transition | The page opens with how to read an entry and each kind of evidence, then a topic index and the thirteen topic sections that hold the entries, then the sources each chapter cites, and closes by linking the register to the toolkit and glossary; the book's own research briefs are not listed. |  | `elaboration`: When and how the sources were consulted. → How the page is laid out and what it leaves out. |\n\n## Sections\n\n### How to Read This Register\n\n**Controlling idea** (`explanation`, id `how-to-read`): Each entry has a stable identifier, the year its citing chapter gave and an evidence type, and the type says how far the source can be trusted for a given kind of claim.\n\n**Advances the thesis** (B1, B2, B4): States the rules that make an entry usable for weighing a claim: one source once, a permanent identifier, a year, an evidence type, and what is deliberately not a source.\n\n**Transition in:** `sequence`: The roadmap's first item. → How to read an entry.\n\n**Order of paragraphs** (`prerequisite_order`): What gets an identifier (1.1) and what does not (1.2) must come first, because the counts in the evidence-type table (1.3) are counts of exactly those registered sources, R566 included; placed after the table, the exclusions read as a step back to the opening (draft check round 2), and placed before 1.1 they would exclude things from a register not yet described.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p03 | explanation | The 587 sources were harvested from the Sources and Evidence sections of 55 pages and deduplicated, and their R-numbers identify rather than rank and are never renumbered or reused. | fact: 587 sources from 55 pages, deduplicated by normalized URL; new sources append from the next free R-number; a removed source's number is retired. |  |\n| p04 | explanation | Only public sources get an R-number: the book's research briefs are working notes and are left out, with the public source behind any fact they collected listed instead; the one non-public entry is R566, Productscape, the author's domain models, listed because chapters cite it. |  | `elaboration`: The sources that were harvested and given identifiers. → What gets no identifier (the research briefs) and the one non-public source that does (R566). |\n| p05 | explanation | Each entry gives its title, publisher, the year the citing chapter gave, what it supports, an evidence type and its citing chapters, and the twelve evidence types each say how far a source can be trusted. | table: The evidence-type table: twelve types with counts (company engineering 127, filings 85, company documentation 38, technical documentation 100, standards 25, law and regulators 63, research 34, books 7, practitioner 34, news 59, encyclopedia 14, author's working model 1), what each is and how to read it.; reasoning: A company engineering post more than about three years old is a record of that date, not of today. | `sequence`: What gets an identifier. → What each entry gives besides its identifier, and how far each evidence type can be trusted. |\n\n### Topic Index\n\n**Controlling idea** (`description`, id `topic-index`): Each topic is one contiguous block of identifiers, so a reader with a subject goes straight to its block and its most widely cited source.\n\n**Advances the thesis** (B3): Makes the register findable by topic.\n\n**Transition in:** `elaboration`: Identifiers assigned in topic order. → The topic blocks and how sources are placed in them.\n\n**Order of paragraphs** (`grouping`): The placement rule comes first because it explains why a source sits where it does; the thirteen blocks then follow in identifier order, the same order as the sections below, so the index and the sections can be read side by side. Moved after the sections, the index would no longer tell the reader which block to open.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | explanation | Identifiers run in topic order, fixed when they were assigned: the company sections hold every evidence type a group published or was reported in, each source sits under the one topic it serves best, and the blocks run from economics through the company sections in case-chapter order to the technical topics in rough chapter order (Platform before Web because the topic list the identifiers were assigned from put them so) and architecture method last. | reasoning: A source cited across several topics keeps one place; its Cited in line lists every chapter that uses it. |  |\n| p07 | description | The Marketplace economics and business models block (R1–R8, 8 sources) covers two-sided market theory, network effects, marketplace metrics and the history of classifieds, and names its most widely cited source. |  | `example`: The rule that each topic is one contiguous block of identifiers. → The first block, R1–R8. |\n| p08 | description | The Company sources: Adevinta and Schibsted block (R9–R75, 67 sources) covers Adevinta, Schibsted (now Vend) and their brands, and names its most widely cited source. |  | `sequence`: The block ending before R1. → The block R9–R75. |\n| p09 | description | The Company sources: OLX and Prosus block (R76–R133, 58 sources) covers OLX and its owner Prosus (and Naspers), and names its most widely cited source. |  | `sequence`: The block ending before R9. → The block R76–R133. |\n| p10 | description | The Company sources: eBay Classifieds, Kleinanzeigen and Marktplaats block (R134–R174, 41 sources) covers the former eBay Classifieds Group and its brands, and names its most widely cited source. |  | `sequence`: The blo urce: One line per citing page with its count and identifiers, from introduction (3) to toolkit (12). |  |\n\n## Conclusion: From Template to Source\n\n**Synthesis:** With this register the three reference pages form one chain: a template's field names a term, the term's glossary row names its owning chapter, and that chapter's line in Sources by Chapter names the dated sources behind it.\n\n**So what:** A reader can trace any decision record built from the book back through its definitions to evidence of a known kind and age, and see which parts rest on fiction (Veldmark) or labeled inference rather than on sources.\n\n**Callback:** The toolkit's opening claim that each template leaves evidence someone else can check, and this page's KEY POINTS on keeping documented facts, inferences and Veldmark distinct. The reader now sees the register as the place where that check ends: the chain reaches dated evidence for documented facts and stops, by label, at Veldmark and the author's judgement.\n\n**Takeaway** (`course_of_action`): Before citing a source in a decision record, check its year and evidence type in the register, and follow it to the primary source where the entry is secondary.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p34 | synthesis | A chapter's line in Sources by Chapter is the last link of one reference chain from a toolkit template through a glossary definition to dated sources, which is how the toolkit's evidence 'someone else can check' is checked. |  |  |\n| p35 | recommendation | Before citing a source from the book in a decision record, check its year and evidence type here and follow a secondary entry to its primary source. |  | `cause_effect`: The chain that reaches dated evidence. → What the reader should do with it before citing. |\n| p36 | synthesis | The chain stops where the evidence stops: Veldmark is fictional, and architectural recommendations and labeled inferences are the author's judgement. |  | `contrast`: What the sources support. → What no source supports. |\n\n## Non-goals\n\n- Further reading or annotated reading lists; nothing is listed that no page cites.\n- Verifying or rewriting the chapters' citations; missing URLs or years are reported to the chapter owners, not fixed here.\n- Definitions of terms and templates. See [Glossary: The Language of Listing Systems](glossary.html), [Field Kit: Templates for the Marketplace Architect](toolkit.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Rerun the harvest (gen.py -> classify.py -> fix.py -> render.py in _research/bib-tools/) whenever a page's sources change; keep ids.json so existing identifiers do not shift. (Carried over from spec.md.)\n- Eight entries have no URL (among them the Prosus FY25 results booklet, the Schibsted Q3 2016 investor presentation, the eBay Classifieds Group archived pages, the two DDD books and Broder 1997), and the OLX duplicate-detection posts in media-pipeline are cited as known only through search summaries. Chapter owners should add primary URLs where they exist. (Carried over from spec.md.)\n- Several company engineering entries carry 'n.d.' (for example the Airbnb Tech guest-journey post, the Chronon and FIAAS repositories and the AVIV Group pages); the style guide asks for a year on company engineering evidence. (Carried over from spec.md.)\n- The harvest scripts (_research/bib-tools/classify.py, fix.py, render.py) and manuscripts/listing-systems/bibliography.md still name the six company topics 'Company engineering: ...'; update them to 'Company sources: ...' before the next harvest or manuscript export, or a rerun restores the old headings (outside this post's folder, so not changed here).\n\n## Decision log\n\n- **2026-10-19** — Generated the register by script from the pages' Sources and Evidence sections, so the Cited in lines and Sources by Chapter come from the actual citations.\n- **2026-10-19** — Split multi-link source line         function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
