<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, the three acceptance criteria, the thesis and the role are copied unchanged from the recommendations entry in journal-spec.json. Four units are added to the published text: a roadmap paragraph in the introduction (p04, for AC-2), lead-ins for the trade-offs and vertical-differences tables (p42, p43), and a synthesis paragraph before the hand-off (p54).\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The recommendation surfaces of a listing marketplace and why churn breaks the usual recommender: every listing is a cold-start problem and may disappear before the buyer clicks.\n- **Know:** The generate, filter, re-rank, apply-policy architecture; events and serving-time checks; cold start for new listings, new users and new markets; feedback loops and exposure; evaluation by contacts and coverage; consent and the non-profiling option for very large platforms.\n- **Believe:** Churn changes a recommender's plumbing more than its algorithms, and a nightly batch job over a catalog that changes by the hour produces Ghost Inventory.\n- **Believe:** Carousel click-through is the wrong success metric; contacts and inventory coverage are the right ones.\n- **Be able to:** Design a recommendation pipeline whose candidate indices take inserts and deletes from listing events and whose single serving-time filter reads the shared status read model.\n- **Be able to:** Set an exposure policy (dealer concentration cap, exploration slot) and decide what a group shares for recommendations and what each brand keeps.\n\n**Audience:** Chief architects, recommendation and ML leads, discovery product owners and data protection leads in listing marketplaces, who know recommender basics and need the marketplace-specific failure modes and the architecture that avoids them.\n\n**Already knows:**\n\n- APIs, databases, event streams, search engines and Kubernetes; recommender basics (collaborative filtering, click-through as a metric).\n- From earlier chapters: Ghost Inventory and the other failure patterns, the listing event stream, the publication pipeline's unpublish events and status read model, the search index as a read model, enrichment that fills attributes, entity-resolution clusters, and Veldmark's brands, cast and the Essen Golf.\n- From ranking: candidate generation and re-ranking stages, the ranking policy as a separate layer, gradient-boosted decision trees, position bias and propensity correction, exploration positions, reason codes, and why paid status must not be a model feature.\n\n**Does not yet know:**\n\n- Cold start, co-view and co-contact signals, matrix factorization and graph methods, session-based models and two-tower embeddings.\n- Approximate nearest-neighbor (ANN) indices, filtered versus post-filtered kNN search.\n- Recall at k, NDCG, and coverage, novelty and concentration as recommendation metrics.\n- Articles 27 and 38 of the Digital Services Act.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a carousel that shows sold items and ignores new ones, the reader redesigns it and names the metric that decides success. *Probe:* Your 'similar vehicles' carousel is a nightly co-view job. It starts 7% of leads, but 41% of new listings get no carousel impression in their first three days and about 4% of clicks land on sold cars. Using only this chapter: how do you rebuild it, and by what metric do you judge the rebuild? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** How do you recommend items that may be sold tomorrow?\n\n> **Claim:** Recommending inventory that may be sold tomorrow depends on plumbing more than on modeling: several candidate sources, each one index lookup, including content and image features that give a listing a place before anyone has viewed it, feed candidate indices that listing events update within a minute; one serving-time filter on the shared status read model removes unavailable, ineligible and unconsented items; a re-ranker with an exposure policy (a cap per dealer group, an exploration slot for new listings) is judged on contacts and inventory coverage rather than click-through; and every surface has a non-personalized mode that serves a complete list when personalization is unavailable or not consented to.\n\n**Disputed by:** The common practice, inherited from retail, of building recommendations as a nightly collaborative-filtering batch job (co-views or co-purchases written to a key-value store) and judging it on carousel click-through.\n\n**So what:** A Chief Architect who accepts this shares the status read model and listing event stream, candidate-serving infrastructure with real-time upserts, deletes and filtered search, the recommendation log and evaluation tooling and consent propagation across brands, keeps models, source weights and policy values per brand, and watches contacts on unavailable listings by surface, new-listing exposure within 72 hours, weekly coverage and seller concentration.\n\n**How and why:** Motorvane's 2020 co-view carousel could recommend only cars someone had already viewed alongside another: 41% of new listings got no carousel impression in their first 72 hours although the carousel started 7% of leads, 3.8% of clicks landed on sold or removed cars, and the sold Essen Golf stayed in carousels until the next nightly run. The rebuild (four candidate sources, one filter, a GBDT re-ranker, at most two cars per dealer group in ten) raised carousel-started leads by 16% relative, cut new listings without an impression to 8% and clicks on unavailable cars to 0.3%, while click-through fell 4%.\n\n**Supporting claims**\n\n- **R1** — Listing churn breaks the retail recommender: every listing is a cold start and may disappear before the buyer clicks, so a nightly, behavior-only batch job both recommends sold items and starves new ones.\n- **R2** — Several candidate sources, at least one content-based, served from indices that take inserts, deletes and filtering from the listing event stream, give a listing a place from its first minute.\n- **R3** — One serving-time filter on the same status read model as search, cards rendered from the live read model, and send-time checks keep unavailable, ineligible and unconsented listings off every surface.\n- **R4** — A re-ranker trained on contacts and an exposure policy (dealer caps, diversity, exploration), judged on contacts and inventory coverage rather than click-through, counter feedback loops and seller concentration.\n- **R5** — Consent and regulation make a complete non-personalized mode and governed, opt-in cross-brand data part of the design, not an afterthought.\n- **R6** — At group scale the status read model, event stream, candidate-serving infrastructure, logs and consent lineage are shared, while models, source weights and policy values stay with each brand.\n\n## Role in the part\n\nExtends the read-model and owned-order arguments to ranking without a query, where churn makes availability and cold start the design problem. Supports P4-4 of part `part-4`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `large_to_small` in surfaces, why listings differ and methods: the whole field of surfaces and assumptions before individual methods; `chronological` in architecture: the four stages in the order a request passes through them; methods: the documented cases in date order; `grouping` in trade-offs to questions: the book's reference sections)\n\nThe scene poses the problem with the sold Golf and the starved new listings. Surfaces and the broken retail assumptions say why it is general, and the methods table shows which families can treat new and sold listings, so the architecture can then combine them. Events and serving-time checks follow the architecture because they keep its stages current. Cold start, feedback loops and evaluation refine the parts the architecture introduced (candidate sources, policy, metrics); privacy limits what the whole may use. Evaluation must precede the rebuild, whose falling click-through only reads as success once the case against click-through has been made. The rebuild comes after all of these because it applies every one of them to the opening case, and the reference sections test and govern the design. Putting the methods after the architecture would leave the four stages without a reason for several sources.\n\n## Introduction\n\n**Hook** (`intriguing_example`): In retail, a recommender learns that people who bought a kettle also bought a toaster, and the lesson stays useful for years because the same kettle is sold every day. The Essen Volkswagen Golf with 48,000 kilometers exists once, for fifteen days, and then it is gone.\n\n**Bridge:** Ranking, as the previous chapter built it, orders what a buyer asked for with candidate generation, re-ranking, exposure policy and logging. → Recommendation surfaces have no query to anchor relevance, reuse that machinery, and face inventory that is new and may be gone tomorrow.\n\n**Thesis statement** (KEY POINTS callout (all three bullets); introduction paragraphs p01 and p02 state the churn-and-plumbing claim.): Churn changes a recommender's plumbing more than its algorithms: several candidate sources including content, indices kept live by listing events, one serving-time filter on the shared status read model, a re-ranker and exposure policy judged on contacts and coverage, and a non-personalized mode on every surface.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p04, which names the sections in order.):\n\n- Motorvane's carousel and the sold Golf it kept recommending. *Kept in:* scene.\n- The surfaces, why listings break the usual recommender, and how each method treats a new and a sold listing. *Kept in:* surfaces, why-listings-differ, methods.\n- The four-stage architecture with its events and serving-time checks. *Kept in:* architecture, freshness.\n- Cold start, feedback loops, evaluation, and consent and regulation. *Kept in:* cold-start, feedback-loops, evaluation, privacy.\n- The Motorvane rebuild. *Kept in:* rebuild.\n- Trade-offs, vertical differences, failure modes, the Chief Architect's view and questions for a design review. *Kept in:* trade-offs, verticals, failure-modes, chief-architect, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | In retail a recommender's lessons last because the same kettle is sold every day (people who bought it also bought a toaster), but a listing exists once and briefly, so every listing is a cold-start problem and every recommendation a bet on an item that may disappear before the buyer clicks. | example: The kettle and toaster bought together for years; the Essen Volkswagen Golf with 48,000 km that exists once, for fifteen days. |  |\n| p02 | claim | Churn changes a recommender's plumbing more than its algorithms: the working marketplace systems kept fairly simple models and changed indices, filtered retrieval, content features and serving-time checks, while the failures come from a nightly batch job over a catalog that changes by the hour. |  | `cause_effect`: Every listing as a cold start that may disappear. → What that does to a recommender's architecture: plumbing rather than models. |\n| p03 | definition | The chapter owns candidate generation, similar listings and cold start; it treats a recommendation module as a ranked list without a query that reuses ranking's machinery, and its availability rule returns in map search and alerts, while the ML platform and event stream are owned elsewhere. |  | `contrast`: Ranking's machinery (candidate generation, re-ranking, exposure policy, logging), which orders what a buyer asked for. → Surfaces with no query to anchor relevance, and the terms this chapter owns. |\n| p04 | transition | The chapter starts with Motorvane's carousel and the sold Golf, names the surfaces, shows why listings break the usual recommender and how each method treats a new and a sold listing, builds the four-stage architecture with its events and serving-time checks, then covers cold start, feedback loops, evaluation and consent and regulation, applies the design in the Motorvane rebuild, and closes with trade-offs, vertical differences, failure modes, the Chief Architect's view and questions, drawing on published marketplace recommender work, EU regulation and Veldmark. | reasoning: The chapter's sections in order, and the kinds of evidence. | `sequence`: The terms the chapter owns. → The order in which the chapter covers them. |\n\n## Sections\n\n### Setting the Scene at Veldmark: The Golf That Kept Being Recommended\n\n**Controlling idea** (`context`, id `scene`): Motorvane's nightly co-view carousel kept recommending the sold Essen Golf and gave four in ten new listings no exposure, which poses the chapter's question with Veldmark's numbers.\n\n**Advances the thesis** (R1): Shows the two failures of a nightly, behavior-only recommender on one dated case.\n\n**Transition in:** `example`: Every listing as a cold start that may disappear; the roadmap. → A dated Veldmark case: the carousel and the Golf.\n\n**Order of paragraphs** (`problem_solution`): The design first, then the incident it produced, the numbers that show it is systematic, why the method causes it, and the question it leaves.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | context | Motorvane's similar-vehicles carousel was built in 2020 as a nightly Spark job that writes each listing's top ten co-viewed neighbors to a key-value store, and nobody has looked at it closely since its launch. | scenario: Ten 'similar vehicles' on every German detail page; nightly item-to-item co-views written to a key-value store. |  |\n| p06 | example | The Essen Golf, sold at 15:10 on 29 April 2027, was removed from search within minutes of a feed removal that arrived 26 hours late, but stayed in other cars' carousels until the nightly job ran on 1 May, and two of three enquiries in between came through the carousel. | case: Golf listed 14 April 2027 at €21,900; 23 raw leads (19 deduplicated) in 10 days; price cut to €21,400 on 22 April with alerts to 1,180 watchers; sold 15:10 Thursday 29 April; removal 17:10 Friday 30 April; three e-mail enquiries in between, two via the carousel; carousel kept it until early Saturday 1 May.; figure: Figure 1: the Golf's timeline, with search dropping it and the carousel keeping it. | `time`: The carousel's nightly design. → A dated incident that design produced. |\n| p07 | evidence | A review of the German carousel found that the Golf was not an exception: the carousel distributes a large share of traffic and leads while sending clicks to sold listings and leaving new and much of the live inventory unseen. | table: 12% of detail-page views and 7% of leads from the carousel; 41% of new listings with no impression in 72 hours; 3.8% of clicks on sold or removed listings; 31% from the anchor's dealer group; 46% weekly coverage (illustrative). | `additional_support`: The Golf as one incident. → The review's numbers across the carousel. |\n| p08 | analysis | A co-view recommender can recommend only listings someone has already viewed alongside another, so a car that arrived this morning gets none of the carousel's traffic, and dealers who pay for listing slots notice. | statistic: 7% of leads from the carousel against 41% of new listings with no impression in 72 hours. | `cause_effect`: The review's numbers. → Why a co-view method starves new listings and why dealers care. |\n| p09 | transition | Felix's practical question to Ingrid and Priya was how Motorvane should recommend cars that may be sold tomorrow and were not there yesterday. |  | `conclusion_summary`: Ghost listings and starved new ones. → The chapter's question as Motorvane put it. |\n\n### Recommendation Surfaces\n\n**Controlling idea** (`definition`, id `surfaces`): Recommendation surfaces differ in what anchors them, and the anchor decides the method, the freshness requirement and the outcome metric.\n\n**Advances the thesis** (R1): Shows that freshness needs and outcomes vary by surface, and that some surfaces are where churn hurts most.\n\n**Transition in:** `elaboration`: Motorvane's question about one carousel. → The full set of recommendation surfaces a marketplace runs.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | definition | A recommendation is a list the user did not explicitly request, chosen from what is known about the context, the user or both, and each surface's anchor decides its method, freshness need and metric. | table: Seven surfaces (similar listings, home feed, continue your search, recommended searches, zero- and low-result fallback, buyers also contacted, e-mails and push) with anchor, latency budget, freshness need and primary outcome. |  |\n| p11 | example | Low-result fallback is where recommendations protect liquidity most directly, turning a narrow search with three results into a contact on a similar listing farther away or in a neighboring category. | example: A cargo-bike search within five kilometers of a small town; Airbnb's 2025 description of augmenting narrow searches with recommendations. | `emphasis`: The surface table. → The surface that matters most for liquidity. |\n| p12 | example | Recommendation e-mails are where Ghost Inventory is most visible, because a list computed at 02:00 and opened at 09:00 can be seven hours stale. | case: Femke's Rotterdam city bike, sold on 8 March 2027, still in Tradeyard's alert digest the next morning. | `contrast`: The surface where recommendations help most. → The surface where they fail most visibly. |\n\n### Why Listings Break the Usual Recommender\n\n**Controlling idea** (`cause_effect`, id `why-listings-differ`): Listings violate the retail recommender's assumptions of a stable catalog, logged-in repeat customers and purchase labels, so the recommender must describe a listing nobody has interacted with.\n\n**Advances the thesis** (R1, R2): Turns the scene's failures into a design principle: content at the center.\n\n**Transition in:** `contrast`: The retail recommender the opening set against listings (the kettle). → The three retail assumptions a listing marketplace violates.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p13 | evidence | Retail recommendation assumes a stable catalog, logged-in repeat customers and purchases as labels, and the published marketplace research says that listings violate all three. | source: FINN.no's 2018 paper (unique second-hand items, poor item data, interactions finishing off the platform); OLX Jobs 2023 ('limited information regarding users and items').; table: Item lifetime, multiplicity, churn, identity, outcome and supply side, retail against listings, with the consequence of each. |  |\n| p14 | claim | The consequence is a design principle: the recommender must be able to describe a listing it has never seen anyone interact with, which rules out collaborative filtering as the only method and puts the listing's own content at the center. | figure: Figure 2: a new car isolated in a co-view network against the same car placed among similar cars by its attributes, price, location and photo. | `cause_effect`: The broken assumptions and their consequences. → The principle that follows from them. |\n\n### Methods Under Churn\n\n**Controlling idea** (`comparison`, id `methods`): What matters about each recommendation method for listings is how it treats a new listing and a sold one, and published designs settle the same trade-off differently according to how long their inventory lives.\n\n**Advances the thesis** (R1, R2): Compares methods by the two questions churn asks, with dated marketplace evidence.\n\n**Transition in:** `elaboration`: The principle that content must carry a listing. → How each method family treats new and sold listings.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p15 | comparison | For listings, what matters about each method family is how it treats a new listing and a sold one. | table: Content-based similarity, item-to-item CF, factorization and graph methods, session-based models, learned embeddings and bandits: how each works, new listing, sold listing, cost, marketplace evidence. |  |\n| p16 | evidence (list) | The documented cases, in date order, show embeddings from sessions, text for listings that attributes describe poorly, a candidate pool limited to recently active items, real-time indices with pre-filtering, and a daily listing tower whose staleness suits long-lived inventory. | case: Airbnb 2018 (embeddings; 99% of conversions through search ranking and similar listings); Zillow 2021 (Word2Vec on about 10 million descriptions, gains for vacant land); Adevinta 2022 (ANN over items active in 90 days and viewed in 15); Vinted 2023 (Faiss rebuilds and no pre-filtering replaced by Vespa; exact search raised p99 from about 50 to 70 ms; recall kept at 60–70%); Airbnb 2026 (daily listing tower, features up to a day old). | `example`: The method table. → Dated marketplace cases, in date order. |\n| p17 | analysis | Vinted and Airbnb made the same trade-off and settled it differently because their inventory lives for different lengths of time, and that is the most useful way to read any published recommender design. |  | `conclusion_summary`: The five cases. → The lesson that ties them together: read designs by inventory lifetime. |\n\n### Architecture: Generate, Filter, Re-rank, Apply Policy\n\n**Controlling idea** (`process`, id `architecture`): Recommendations for listings run in four stages with strict responsibilities: several cheap candidate sources, one serving-time filter on the shared status read model, a contact-optimized re-ranker, and a policy for rules a model should not learn.\n\n**Advances the thesis** (R2, R3, R4): Gives the pipeline the thesis names, stage by stage.\n\n**Transition in:** `similarity`: The multi-stage shape of search ranking from the previous chapter. → Four stages for recommendations, with candidate generation carrying more load because no query anchors relevance.\n\n**Order of paragraphs** (`chronological`): The stages in the order a request passes through them, each stage's key rule right after it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | claim | Recommendation shares the multi-stage shape of search ranking, but without a query to anchor relevance candidate generation carries more of the load, so the author uses four stages with strict responsibilities. | figure: Figure 3: four stages; several candidate sources, one content-based, feed one filter; re-ranker and policy; the event stream keeps indices and filter current. |  |\n| p19 | process (list) | Candidate generation selects a few hundred plausible items for recall and speed from several sources that cover each other's weaknesses: attribute and geography similarity, embedding nearest neighbors served from an ANN index that filters during the search, co-view and co-contact, and fresh local listings. | source: Elastic's documentation: filtering during approximate kNN returns k matches; post-filtering can return fewer. | `sequence`: The four stages. → The first stage and its sources. |\n| p20 | recommendation | Candidate sources return listing identifiers and scores, never rendered content, so cards are assembled at serving time from the current listing read model and are never stale. |  | `elaboration`: The candidate sources. → The rule for what they return. |\n| p21 | process | One deliberately simple filter, applied at serving time to every candidate from every source, keeps sold, ineligible and untrusted listings off every surface. | table: Availability, eligibility, trust, duplicates, already seen or contacted, consent, each with its rule and source of truth. | `sequence`: Candidate generation. → The second stage, the filter. |\n| p22 | claim | The availability check uses the same status read model as search, because buyers find any disagreement between the two, as they did with the Golf. | case: The Golf, dropped by search and kept by the carousel. | `emphasis`: The filter's rules. → The one rule that matters most: the shared status model. |\n| p23 | process | The re-ranker scores filtered candidates for the probability of a contact from anchor, candidate and pair features, with a gradient-boosted model as a sound default, and never uses paid status as a feature. |  | `sequence`: The filter. → The third stage, the re-ranker. |\n| p24 | recommendation (list) | The policy applies rules a model should not learn: seller and dealer caps, diversity, exploration positions and reason codes. | example: At most two listings from one seller or dealer group in a ten-item carousel; spread across price bands; one or two exploration positions from the content source; reason codes such as similar_attributes, viewed_together, new_nearby. | `sequence`: The re-ranker. → The fourth stage, the policy. |\n\n### Keeping Recommendations Alive: Events and Serving-Time Checks\n\n**Controlling idea** (`process`, id `freshness`): The listing event stream that feeds search keeps candidate indices current, the serving-time check catches what indices still hold, and batch surfaces such as e-mail need a check at send time.\n\n**Advances the thesis** (R2, R3): Shows how the pipeline stays live, removal first.\n\n**Transition in:** `elaboration`: The four stages and the filter's status rule. → How events and serving-time checks keep the stages current.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p25 | claim | Freshness runs in two directions and removal matters more than insertion; both come from the listing event stream that already feeds search, replayed here for the Golf's sale in Motorvane's target design. | figure: Figure 4: the unpublish event deletes from candidate indices, the serving-time check catches what indices still hold, and neither fixes a feed that reports a sale 26 hours late. |  |\n| p26 | recommendation (list) | Three design points follow: indices that cannot delete are a liability, precomputed lists are acceptable only behind a live filter, and late feeds are not a recommender problem but recommenders amplify them. | case: Vinted's periodically rebuilt Faiss index; the Golf's 26-hour lag from the dealer's DMS export schedule, fixed in the feed contract and by Motorvane's own sold signals. | `cause_effect`: The diagram. → The design points it implies. |\n| p27 | recommendation | E-mail and push need a send-time check, and rendering the card when the message is opened is the stronger version, with care for e-mail clients that prefetch images. |  | `additional_support`: Serving-time checks for on-page surfaces. → The same check for batch surfaces. |\n\n### Cold Start in Three Forms\n\n**Controlling idea** (`definition`, id `cold-start`): Cold start comes in three forms, new listing, new or anonymous user and new market or category, and published evidence supports content and image representations for new listings and the session as the user for anonymous visitors.\n\n**Advances the thesis** (R2): Shows how content features and sessions give listings and users a place without history.\n\n**Transition in:** `elaboration`: The candidate sources that already give new listings a place. → Why the section returns to new listings (the evidence behind that choice) and the two forms the architecture has not yet covered, new users and new markets.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p28 | definition | Cold start, recommending without the interaction history collaborative methods need, has three marketplace forms, each with its own approach. | table: New listing (the Golf on 14 April), new or anonymous user, new market or category (Tradeyard's cargo-bike leaf from November 2027), each with an approach. |  |\n| p29 | evidence | For new listings the published evidence supports describing a listing by what it is, with content and image representations. | source: Airbnb 2020 (cold start for new listings a main improvement); Airbnb 2026 (more bookings for new listings); Vinted 2025 (item tower from category, brand and image embeddings). | `elaboration`: The three forms. → The evidence for the first. |\n| p30 | claim | For anonymous users the session is the user: the last few viewed listings personalize a logged-out visitor within a few clicks, without a long-term profile, which is also the privacy-friendly option. |  | `sequence`: New listings. → The second form, anonymous users. |\n\n### Feedback Loops and Exposure\n\n**Controlling idea** (`cause_effect`, id `feedback-loops`): A recommender trained on its own output drifts toward what it already recommends, and in recommendations only the policy limits that drift.\n\n**Advances the thesis** (R4): Shows why the exposure policy is needed.\n\n**Transition in:** `contrast`: Ways to give new listings and users a start. → Feedback that works against new listings by pulling exposure toward what is already recommended.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p31 | cause_effect (list) | A recommender trained on its own output drifts toward what it already recommends, with three effects specific to listings: popularity bias amplifies Ghost Inventory, exposure is supply-side value, and carousels have position bias too. | reasoning: The best deals are most viewed and sell first; the carousel distributes 12% of detail-page traffic; the first two items get most clicks. |  |\n| p32 | analysis | The tools are the same as in ranking, but in recommendations nothing limits the drift except the policy, because there is no query. |  | `contrast`: The three effects. → How the tools apply, and the difference from ranking. |\n\n### Evaluating Recommendations\n\n**Controlling idea** (`claim`, id `evaluation`): Recommendations should be judged on contacts and the distribution of exposure, offline and online, with guardrails, because click-through rewards the wrong listings.\n\n**Advances the thesis** (R4): Names the metrics the thesis requires and why click-through misleads.\n\n**Transition in:** `contrast`: Clicks, which the feedback loops above amplify. → Click-through as the most common and one of the least useful metrics, and what to measure instead.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p33 | claim | Click-through rate is the most common recommendation metric and one of the least useful, because a carousel of suspiciously cheap cars has excellent click-through. |  |  |\n| p34 | recommendation | Offline, measure recall at k and NDCG against held-out contacts plus coverage, novelty and concentration, and treat the serving index's ANN recall as an explicit, measured engineering decision. | case: Vinted accepted 60–70% recall because exact search cost more latency than it returned. | `contrast`: Click-through as the wrong metric. → The offline metrics to use instead. |\n| p35 | recommendation | Online, A/B test on contacts with guardrails, at a scale that needs an experimentation platform rather than a one-off launch test. | case: Vinted's dense retrieval reached full rollout after about 50 A/B tests.; table: Guardrails: contacts on unavailable listings, new listings with an impression in 72 hours, top-1% seller share, weekly coverage, p99 latency, each with what it protects. | `sequence`: Offline evaluation. → Online evaluation and guardrails. |\n\n### Privacy, Consent and Regulation\n\n**Controlling idea** (`claim`, id `privacy`): Consent, the Digital Services Act, anti-discrimination and retention rules limit personalization, so consent travels with the request, every surface has a good non-personalized mode, and cross-brand data is a governed decision.\n\n**Advances the thesis** (R5): Argues the non-personalized mode and governed cross-brand data the thesis requires.\n\n**Transition in:** `contrast`: What the system optimizes and how it is measured. → What the law and consent allow it to use.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p36 | claim (list) | Recommendations turn behavioral data into visible decisions about a person, so consent (which travels with the request and requires a non-personalized mode on every surface good enough to stand on its own), DSA transparency, discrimination rules and retention limits shape them more than search ranking. | source: ePrivacy consent and GDPR legal basis; DSA Article 27 (main parameters in plain language, for online platforms that are not micro or small enterprises) and Article 38 (a non-profiling option for very large platforms, 45 million users threshold); 24 CFR §100.75; Airbnb 2026 sequences up to seven years. |  |\n| p37 | recommendation | Cross-brand data is a separate decision whose architectural answer is opt-in at the feature level with lineage: Veldmark ID makes it technically possible, but consent scope, privacy notices and the Keybridge neutrality commitment decide whether it is allowed. | scenario: Veldmark ID approved June 2027 for rollout in 2028; the March 2027 neutrality commitment excludes Keybridge data from Hearthly ranking or sales targeting; Lucía Ortega's team owns the answer. | `elaboration`: Consent and regulation within one brand. → The same question across brands. |\n\n### The Veldmark Rebuild: Similar Vehicles at Motorvane\n\n**Controlling idea** (`example`, id `rebuild`): Motorvane's rebuild applies the design on its own Elasticsearch 8 stack and raises leads and coverage while click-through falls, which shows both the design and the metric argument at work.\n\n**Advances the thesis** (R2, R3, R4): Shows the thesis working on the scene's problem, with numbers.\n\n**Transition in:** `problem_solution`: The design and its limits. → Motorvane's rebuild of the carousel from the opening scene.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p38 | example (list) | Felix's team rebuilt the carousel between June and August 2027 on Elasticsearch 8 with four candidate sources, one serving-time filter, a GBDT re-ranker, a policy and events that update the indices within a minute. | scenario: Attribute similarity once VIN decoding fills 31 attributes; filtered kNN embeddings with a content tower; co-contact every two hours; fresh listings nearby; at most two cars per dealer group in ten; one exploration slot; ListingSold from Dealer Hub at once. |  |\n| p39 | evidence | A September 2027 A/B test randomized by user compared the rebuilt carousel with the old one. | table: Carousel leads 7.0% to 8.1% (+16% relative); no-impression new listings 41% to 8%; clicks on unavailable listings 3.8% to 0.3%; dealer-group share 31% to 14%; coverage 46% to 79%; click-through −4% (illustrative). | `sequence`: The rebuild. → Its test result. |\n| p40 | analysis | The click-through row would have killed the project had click-through been the metric: the new carousel shows fewer eye-catching popular cars and more new, comparable ones, so it is clicked less and produces more leads. |  | `emphasis`: The results table. → The row that carries the metric argument. |\n| p41 | example | Under the new design the Golf would appear in carousels within minutes of becoming searchable and leave within a minute of the sold signal, so the 26-hour gap closes at the source, not in the recommender. | scenario: Searchable at 17:05 on 14 April; Dealer Hub's mark as sold; the Supply Contract v1 (September 2027) status delta within 15 minutes of a sale. | `example`: The rebuild's design and results. → The opening Golf replayed through it. |\n\n### Trade-offs\n\n**Controlling idea** (`comparison`, id `trade-offs`): Each design choice in the chapter has an alternative that is right under other conditions, and the table says when each holds.\n\n**Advances the thesis** (R2, R4, R6): Tests the design against its alternatives.\n\n**Transition in:** `contrast`: Motorvane's choices. → The alternatives and when they are right.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p42 | comparison | Each design choice has an alternative that is right under other conditions, and the table pairs them. | table: Candidate source mix, index update model, representation freshness, ANN precision, optimization target, personalization depth and ownership, each with two options and when to choose each. |  |\n\n### Vertical Differences\n\n**Controlling idea** (`comparison`, id `verticals`): What 'similar' means, the signal that carries a new listing, freshness pressure and the distinctive risk differ by vertical, and two cells need decisions beyond the model.\n\n**Advances the thesis** (R4, R6): Shows what stays local per vertical and where policy rather than the model must decide.\n\n**Transition in:** `elaboration`: General trade-offs. → How they land in each vertical.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p43 | comparison | Recommendations differ by vertical in what 'similar' means, which signal carries a new listing, freshness pressure and the distinctive risk, as the table shows. | table: General classifieds, automotive, real estate and jobs: main surface, meaning of similar, cold-start signal, freshness pressure, distinctive risk, supply-side sensitivity. |  |\n| p44 | recommendation | Recommending competing dealers on a dealer's own page is a product decision with commercial weight, and if 'own stock only' is sold it is a paid effect that belongs in the policy layer with a label, not inside the model. |  | `elaboration`: The vertical table. → The automotive cell that needs a decision. |\n| p45 | example | At Hearthly the duplicate filter has a fairness side: when the Lyon apartment's three agency listings are clustered, the recommender must pick one with the same rule ranking uses, or agencies see inconsistent treatment. | case: The Lyon apartment listed by three agencies. | `additional_support`: The automotive cell. → The real-estate cell. |\n\n### Failure Modes\n\n**Controlling idea** (`analysis`, id `failure-modes`): The common recommender failures in listing marketplaces each break one rule of the chapter and have a warning sign.\n\n**Advances the thesis** (R1, R2, R3, R4, R5): Restates each rule as the failure that ignores it.\n\n**Transition in:** `contrast`: The design and its variants. → What goes wrong when a rule is ignored.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p46 | analysis (list) | Eight failure modes, each with a warning sign: nightly lists over hourly inventory, behavior-only candidates, click-through as the goal, rendering from the candidate store, post-filtering a static ANN index, personalization without a fallback, one dealer's showroom, and unowned after launch. | example: Warning signs such as contacts on sold listings concentrated in recommendation surfaces, recommended listings far older than live inventory, and nobody able to name a model's owner. |  |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `chief-architect`): At group scale recommendations are a platform capability with brand-specific models: the Chief Architect decides what to share, what to keep local, who decides and what to watch.\n\n**Advances the thesis** (R6): Gives the group-level so-what the thesis names.\n\n**Transition in:** `problem_solution`: Failures a single brand can make. → The group decisions that prevent them.\n\n**Order of paragraphs** (`grouping`): The line first, then what to share, what to keep, who decides, what to watch and the long-term view, the order a group decision is made.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p47 | claim | Recommendations look like a squad's feature but at group scale are a platform capability with brand-specific models, and the Chief Architect's work is to draw that line. |  |  |\n| p48 | recommendation (list) | Share the status read model and event stream, the candidate-serving infrastructure, the recommendation log and evaluation tooling, and consent propagation with cross-brand lineage. | scenario: Common Ground event backbone; the shared OpenSearch platform for Tradeyard and Hearthly from 2028; Motorvane on Elasticsearch until the 2029 review. | `elaboration`: The line between platform and brand. → What sits on the platform side. |\n| p49 | recommendation | Keep models, candidate-source weights and policy values local, because 'similar' means different things for a city bike, a Golf and a Lyon apartment. |  | `contrast`: What to share. → What to keep local. |\n| p50 | recommendation | Each brand's discovery product owner owns the objective and guardrails, the group data protection officer owns consent scope and cross-brand use, and the architecture advice forum reviews cross-brand or paid recommenders. |  | `sequence`: What to share and keep. → Who decides. |\n| p51 | recommendation | Watch contacts on unavailable listings by surface, new-listing exposure in 72 hours, weekly coverage, seller concentration and every model's retraining age, because an unretrained recommender is Set-and-Forget AI. |  | `sequence`: Who decides. → What to watch. |\n| p52 | recommendation | As recommendations reach users through AI assistants and buyer agents, a similar-listing API needs the same availability guarantees as the carousel, so the pipeline should be built as a service with a contract. |  | `sequence`: What to watch now. → The long-term consideration. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Ten questions let a reader test their own recommenders against the chapter's rules in a design review.\n\n**Advances the thesis** (R1, R2, R3, R4, R5, R6): Turns each rule into a question.\n\n**Transition in:** `sequence`: The group view. → Questions to take into a review.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p53 | recommendation (list) | Ten questions cover coverage and age, removal delay per surface, first-hour candidates, index deletes and filtering, the primary metric, the non-personalized experience, caps, card rendering, cross-brand data and ownership. |  |  |\n\n## Conclusion: From Lists to Maps\n\n**Synthesis:** Every part of the chapter answers the same fact from a different side, that the item recommended is new, unique and about to go: content sources give a listing a place on its first day, events and one status filter take it out within a minute of the sold signal, and contacts and coverage keep the carousel from drifting toward the most clickable cars; that is why Motorvane's gain came from plumbing and measurement rather than a better model.\n\n**So what:** A group that shares the status read model and event stream across surfaces gets most of the value before any brand trains a model, and the same rule (one status model, read by every surface) carries into map search and alerts.\n\n**Callback:** The opening contrast between the retail kettle and the Essen Golf, and the claim that every recommendation is a bet on an item that may disappear. The conclusion returns to the kettle and the Golf and says how each part of the design answers that bet.\n\n**Takeaway** (`course_of_action`): Give every recommendation surface a content-based source, one status filter shared with search and a contact metric before tuning any model.\n\n**Hand-off** to [Searching by Place: Map, Polygon and Commute Search](map-search.html): `similarity`: Recommendations' principles (content first, availability always, measurement on matches rather than clicks) and the lesson that a surface without a typed query still needs its own ranking and evaluation. → The map, where the result set is scoped by place and list-based metrics do not describe how people look.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p54 | synthesis | The kettle recommender fails on listings for one reason every section answered from a different side, that the item is new, unique and about to go, which is why Motorvane's gain came from plumbing and measurement rather than a better model and why sharing the status model and event stream is worth more than any one brand's model. |  |  |\n| p55 | transition | Recommendations rank without a query; the next chapter, map search, ranks within a place, and the same principles return there: content first, availability always, and measurement on matches rather than clicks. |  | `similarity`: Recommendations' principles. → Map search, in the next chapter. |\n\n## Non-goals\n\n- Search ranking, learning-to-rank training details and paid blending. See [Ranking for Two Sides: Relevance, Freshness and Paid Visibility](ranking.html).\n- Saved-search matching and alert fan-out. See [Tell Me When It Appears: Saved Searches and Alerts](saved-searches-and-alerts.html).\n- Feature stores, model governance and the ML platform. See [Models in Production: ML Platforms and Use Cases](ml-platform.html).\n- The listing event contract and outbox. See [Every Change Is an Event: Event-Driven Listing Architecture](event-driven-listings.html).\n- Tracking plan and consent propagation. See [Data Platform for Marketplaces: Events, Lakehouse and Data Products](data-platform.html).\n- Interference designs for experiments. See [Testing a Two-Sided Market: Experimentation Platforms](experimentation.html).\n- Agentic and AI channels. See [AI Across the Listing Lifecycle](ai-in-listing-systems.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Airbnb KDD 2018 details (the cold-start averaging of nearby listing embeddings, corpus sizes, the +21% similar-listing CTR) appear only in secondary sources. The ACM text could not be fetched, so the chapter cites the abstract-level claims only. (Carried over from spec.md.)\n- The Zillow 2021 post is cited through the Medium RSS feed, because the post's own page was blocked. (Carried over from spec.md.)\n- The ePrivacy and GDPR statements are kept at the level of general principle; Lucía Ortega's role in the scenario stands in for counsel review. (Carried over from spec.md.)\n\n## Decision log\n\n- **2026-11-12** — Round-3 escalation resolved under the author's delegation ('auto resolve all ESCALATE topics'), 2026-11-12: (1) Methods p15 now glosses two-tower and content tower in two sentences before the table; de-offs and vertical-differences tables (p42, p43) so each table is introduced, and a synthesis paragraph (p54) so the conclusion synthesizes and returns to the opening before handing off to map search. Rejected: Leaving the conclusion as the single hand-off paragraph, which neither synthesizes nor calls back to the opening.\n- **2026-11-12** — From the flow rubric (sound with notes): p01's controlling idea names the kettle so the conclusion's callback has its setup; p19 names the ANN index that filters during the search; p36 names the non-personalized mode the thesis requires; the flow rationale states why evaluation precedes the rebuild. No unit was moved, so the order was not re-run. Thesis rubric passed. Rejected: Adding a separate non-personalized-mode paragraph, which would change the author's published privacy list.\n- **2026-11-12** — After draft-check round 2, four section transitions (why-listings-differ, architecture, feedback-loops, evaluation) were re-declared to the relationship the published prose expresses: the reconstruction had guessed relationships (cause_effect, problem_solution) that the author's section openings do not make. No unit, order, intent, thesis or role changed. Rejected: Rewriting four of the author's section openings to fit the guessed relationships, which would add words at the limit.\n- **2026-11-12** — Modalities left empty: spec.md listed checklist, summary, dialog and comics as unchecked boxes and none of those files exists.\n- **2026-10-19** — Organized the chapter around churn and availability rather than a survey of algorithms, because the failure readers meet in practice is Ghost Inventory in carousels and e-mails, not a weak model. (Carried over from spec.md.)\n- **2026-10-19** — Used the canonical Essen Golf and its 26-hour feed removal as the problem case, with local, non-canonical carousel statistics and a September 2027 A/B result; the click-through decrease was kept visible to make the metric argument concrete. (Carri housing advertising.\n\n## Changelog\n\n- **2026-11-12** — Draft check: round 1 REVISE, round 2 REVISE, round 3 ESCALATE; remaining failures recorded under open_questions. The check report is stale after this entry.\n- **2026-11-12** — Re-declared four section transitions after draft-check round 2 to match the published prose (see decision log).\n- **2026-11-12** — Converted spec.md to spec.json (outcome spec), reconstructed from the published index.md; spec.md removed. Status draft.\n- **2026-10-21** — Renamed failure patterns to match where-listing-systems-go-wrong. (AI-mediated session)\n- **2026-10-20** — Replaced 2 mermaid diagrams with generated illustrations (figure numbers and captions unchanged; sources archived in _research/mermaid-figures.json); Figure 3 kept attempt 4 with a missing dashed arrow and a duplicated label. (AI-mediated session)\n- **2026-10-20** — Sharpening pass: 5,820 to 5,855 words; lead ties the chapter to Part IV; 'Methods and Their Fit' renamed 'Methods Under Churn'; two two-point paragraphs split. (AI-mediated session)\n- **2026-10-20** — Cross-chapter consistency sweep: 1 heading aligned with the book's shared section names; no body text changed. (AI-mediated session)\n- **2026-10-19** — Added 2 inline illustrations (article-illustrator); figures renumbered. (AI-mediated session)\n- **2026-10-19** — Editorial review pass: Golf leads labeled raw (23) vs deduplicated (19), sale time added, DSA Arts. 27/38 checked against the Official Journal (Art. 27 small-enterprise exemption noted), Zillow source linked to the 2021 post, old evidence flagged, acronyms expanded. (AI-mediated session)\n- **2026-10-19** — Initial spec and article. (AI-mediated session)\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
