<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, acceptance criteria AC-1 to AC-3, the thesis and the role are copied unchanged from the multi-country-platforms entry in journal-spec.json; the supporting claims and audience are this spec's own. Units added by this conversion: introduction roadmap p05 (the published introduction named neighbouring chapters but not the chapter's own sections), a Trade-offs lead-in p50 that says what the two trade-off tables show, and a conclusion widened from one paragraph to two (p61 synthesis and callback, p62 hand-off).\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Tenants, global components and configuration; the platform models from the fork per country to the product platform, with the documented record (Adevinta's 2019 rule and Common Platform, eBay Classifieds, OLX, AVIV).\n- **Know:** A tenancy model: tenant codes in every identifier, event, log, metric and cost tag; isolation separated from identity; a configuration hierarchy; extension points; release rings; group-urgent change classes; tenant exit paths.\n- **Know:** What to share first and the centralization pendulum.\n- **Believe:** The tenant is a first-class architectural element, not a column added later.\n- **Believe:** The platform model is decided per capability, and sharing beneath the product keeps the next swing of the pendulum cheap.\n- **Be able to:** Define a tenant and decide where each market difference lives: configuration, extension point or a fork with an expiry date.\n- **Be able to:** Set release rings and the change classes that bypass them.\n- **Be able to:** Score a capability for sharing and order what a group shares first.\n\n**Audience:** Group and enterprise architects, platform-engineering leads and engineering directors of multi-country, multi-brand marketplace groups.\n\n**Already knows:**\n\n- What an API, a database, an event stream, a search engine and Kubernetes are; multi-tenant SaaS and cloud platforms in general; feature flags and staged rollouts.\n- From earlier chapters: marketplace profiles (marketplace-taxonomy), vertical requirement profiles (vertical-requirements), the listing event envelope with its tenant field, glossed there as one brand in one country (event-driven-listings), statements of reasons under the DSA (trust-and-safety-architecture, marketplace-regulation), the search index topology (search-architecture), the data platform's purpose-bound sharing (data-platform), and ml-platform's shared, per-brand and per-market models.\n- Veldmark (fictional), its brands Tradeyard, Motorvane, Hearthly and Keybridge, Yardstick, Safe Deal, Common Ground, the architecture advice forum, Ingrid Halvorsen, Daan Visser and Femke, and the failure-pattern names (The Copy-Paste Country, The Forced Fit, Deal-Shaped Architecture, The Category Straitjacket, Billing by Guesswork).\n\n**Does not yet know:**\n\n- The terms this chapter owns: tenancy model, global component, configuration over code; and tenant in full (brand × country, distinct from brand, market and marketplace profile).\n- Tenant identity versus tenant isolation and the three isolation tiers (logical, partitioned, dedicated); the tenant register; the configuration hierarchy; extension points; the configure–extend–fork ladder; release rings, tenant-scoped flags and group-urgent change classes; tenant exit paths.\n- The six platform models and the public record behind them (Adevinta's 2019 rule and Common Platform, eBay Classifieds Group federation and MoVe, OLX's one-repo frontend and Hydra configuration, AVIV, Vinted).\n- GDPR Chapter V transfer rules as they bear on data residency; BCP 47 locale tags, ISO 4217 currency codes and Unicode CLDR.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a rule that reaches markets unevenly and a brand's objection, the reader names the tenancy controls that apply. *Probe:* A fraud rule written on Sunday evening protects one country within the hour, reaches a second country three days later with the next deploy of a shared monolith, and never reaches two others or the group's car marketplace, where the same phone number had registered. A brand that already runs four countries on one stack objects to a group configuration service. Using only this chapter: what tenancy model fixes the rule's path, and how do you answer the brand? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** How do you share a platform across countries, brands and verticals without forcing them into one product?\n\n> **Claim:** A group should share a platform across countries, brands and verticals by making the tenant (at Veldmark brand × country, ten tenants) a first-class element that every shared capability carries in identifiers, events, configuration, releases, logs and costs; holding market differences that are data as versioned, schema-checked, effective-dated configuration resolved along a hierarchy, putting differences in behavior behind owned extension points and allowing a fork only with an expiry date; releasing in rings from the smallest tenants to the largest while fraud rules, security fixes and legal takedowns reach all tenants at once; documenting an exit path for every tenant of every shared capability; and deciding the platform model capability by capability rather than once for the group, sharing beneath the product and starting with capabilities whose technology is uniform and whose value grows when data is pooled, while product surfaces stay with the brands.\n\n**Disputed by:** Either of two common positions: each country or brand forks the codebase and adapts it locally, or the group converges every brand onto one product platform; both treat the platform model as one decision for the whole group rather than one per capability.\n\n**So what:** A Chief Architect who accepts this decides the tenant definition, code format, mandatory carriage and exit-path rule once at group level; decides the platform model capability by capability, scoring each on investment, uniformity of technology and value of pooled data and publishing the scores; shares in order infrastructure, the event backbone and data platform, trust signals and identity, media and search, then taxonomy and the commercial core, leaving product surfaces last; requires an expiry date on every approved fork; and watches adoption without mandate, country branches in code, lead time from the first tenant to the last and a yearly separability drill.\n\n**How and why:** On 7 March 2027 a phishing rule protected Tradeyard NL within the hour, reached Belgium on 10 March with the next Yardstick deploy, and never reached Poland, Portugal or Motorvane, where the same phone number had an account. Yardstick held about 2,600 branches on the country code and four category trees. Tenancy model v1 (9 June 2027) defined ten brand × country tenants, mandatory tenant codes, partitioned isolation by default, one configuration service for global components, release rings with the three largest tenants last, group-urgent classes for fraud, security and takedowns, and exit paths, because a private-equity owner may sell any tenant. Replayed, the rule split into a group detector and locale packs within a 48-hour shadow window. Adevinta's 2019 rule and the swings at Adevinta and AVIV are the public record.\n\n**Supporting claims**\n\n- **S1** — The tenant, at a marketplace group usually brand × country, is defined once and carried by every shared capability in its records, events, configuration, releases, logs, cache keys and cost lines; tenant identity is mandatory everywhere, while isolation is chosen per capability with partitioned isolation as the default.\n- **S2** — Market differences that are values are held as schema-checked, versioned, effective-dated configuration resolved along a hierarchy; differences in behavior go behind owned extension points; and a fork is allowed only under a decision record with an expiry date (configure, then extend, and only then fork).\n- **S3** — Changes reach tenants through release rings, smallest tenants first, and tenant-scoped flags, while named group-urgent change classes (fraud and scam rules, security fixes, legal takedowns) reach every relevant tenant at once.\n- **S4** — Every shared capability records which tenant may use which data and documents an exit path for each tenant, because the boundaries between tenants are legal and commercial as well as technical, and any tenant may be sold, closed or moved.\n- **S5** — The platform model is decided capability by capability, not once for the group: the public record shows sharing working within a vertical and at lower layers across verticals, while both public attempts at a converged product platform were rowed back.\n- **S6** — A group shares first the capabilities whose technology is uniform and whose value grows when data is pooled, leaves product surfaces to the brands, and designs shared layers so that the next swing of the centralization pendulum is cheap.\n\n## Role in the part\n\nDecides how every capability of the part is shared across countries and brands, and how the group keeps the ability to undo a sharing decision. Supports P7-7 of part `part-7`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in scene poses the phishing rule's uneven path and Ingrid's question; in-practice answers them with Tenancy model v1 after the body has built the design; `grouping` in trade-offs, verticals, failure-modes, ca-view, questions: the book's standard judging sections)\n\nThe scene comes first because its incident and inventory are the problems the chapter solves. The concepts follow because every later section uses tenant, tenancy model, global component and configuration over code; placed later, the platform models would be compared in words the reader cannot yet separate. The platform models come before the architecture because the record (sharing within a vertical and beneath the product; converged products rowed back) is what justifies designing for global components rather than one product. The architecture then specifies the tenancy model the record points to, and the worked example applies it to the scene's problem; placed before the architecture, the decision record would cite registers, rings and extension points not yet explained. The judging sections apply the whole design, so they come last, with the Chief Architect's sharing order after the trade-offs and vertical differences it draws on.\n\n## Introduction\n\n**Hook** (`direct_statement`): Most marketplace groups grew one country at a time, and every market that was copied must later be changed separately: a group with ten copies of its insertion flow pays for each new rule, regulation and improvement ten times.\n\n**Bridge:** Architects of multi-country groups know both failures: country copies that multiply every change, and a group platform imposed as one product that local teams route around. → The architecture between those two failures: a shared platform that earns its tenants through contracts, built on a tenancy model, global components and configuration over code.\n\n**Thesis statement** (KEY POINTS callout (three bullets), with the WHY callouts and the failure-patterns callout; p03 names the three terms the chapter owns.): Make the tenant a first-class element that every shared capability carries; hold market differences that are data as governed configuration, behavior in owned extension points, and forks only with an expiry date; and share beneath the product, starting with what is uniform and pooled, deciding the model capability by capability.\n\n**Roadmap** (Paragraph p05, with the IN THIS CHAPTER callout.):\n\n- Open with a phishing rule that protected one Veldmark market within the hour, another three days later and two others never. *Kept in:* scene.\n- Define the terms and compare the six platform models marketplace groups use. *Kept in:* concepts, platform-models.\n- Design a tenancy model layer by layer. *Kept in:* architecture.\n- Test Veldmark's Tenancy model v1. *Kept in:* in-practice.\n- Close with trade-offs, vertical differences, failure modes, the Chief Architect's view and questions to ask. *Kept in:* trade-offs, verticals, failure-modes, ca-view, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | claim | Marketplace groups grew one country at a time for good reasons, but every market that was copied must later be changed separately, so a group with ten copies pays for each new rule, regulation and improvement ten times. | reasoning: Launching or buying one country at a time; local teams knowing local buyers, law and competitors; ten copies of the insertion flow. |  |\n| p02 | counterargument | The opposite mistake, one platform imposed on every market as is, is just as common: it fits the market that designed it, and local teams route around it with workarounds, shadow systems and a case for leaving. | reasoning: Workarounds, then shadow systems, then a case for leaving. | `contrast`: The cost of copying every market. → The opposite failure: a platform imposed as one product. |\n| p03 | definition | The chapter designs the architecture between those two failures, applying Part VII's argument that a shared platform earns its tenants through contracts rather than mandates, and owns three terms: tenancy model, global component and configuration over code. | reasoning: Short definitions of tenancy model, global component and configuration over code. | `conclusion_summary`: The two failures, copying and imposing. → The architecture between them and the three terms it rests on. |\n| p04 | context | The chapter answers for every capability the question ml-platform asked of models (shared, per brand or per market), building on the event envelope's tenant field and the marketplace profiles, and hands the shared platform to reliability-and-scale, acquired stacks to platform-consolidation and the organization to organizing-marketplace-engineering. | reasoning: Links to ml-platform, event-driven-listings, marketplace-taxonomy, reliability-and-scale, platform-consolidation and organizing-marketplace-engineering. | `place`: The three terms the chapter owns. → Where the chapter sits: what it builds on and what takes its results further. |\n| p05 | transition | The chapter opens with the uneven phishing rule, defines the terms, compares six platform models, designs a tenancy model, tests Veldmark's Tenancy model v1 (two tests and a first release), and closes with trade-offs, vertical differences, failure modes, the Chief Architect's view and questions, on evidence from the public record of five groups, standards and EU law. | source: Adevinta, eBay Classifieds Group, OLX, AVIV and Vinted; locale and currency standards; EU data-protection law. | `sequence`: Where the chapter sits among its neighbours. → The order of its own sections. |\n\n## Sections\n\n### Setting the Scene at Veldmark: One Rule, Four Countries, Three Days\n\n**Controlling idea** (`context`, id `scene`): A phishing rule that protected Tradeyard Netherlands within the hour reached Belgium three days later and never reached Poland, Portugal or Motorvane, because Veldmark's brands had each solved multi-country inside their own walls and Common Ground had to solve it across them.\n\n**Advances the thesis** (S1, S2, S3): Poses the chapter's question with the incident and inventory that Tenancy model v1 later answers.\n\n**Transition in:** `example`: The roadmap's promise to open with the phishing rule. → The incident at Veldmark.\n\n**Order of paragraphs** (`small_to_large`): From one phishing message to the four markets it reached unevenly, to the question it raised, to the group-wide inventory, and then to the decision record that answers it; the reader sees the cost in hours and days before the structural cause. Opened with the inventory instead, the 2,600 branches would read as abstract duplication with no cost attached, and the question in p08 would have no incident to come from.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | context | On Sunday 7 March 2027 a phishing message to Femke on Tradeyard Netherlands was reported, the account suspended and a new rule written within the hour, so Veldmark stopped the attack in one market quickly. | scenario: 20:11 fake Safe Deal payment link; reported 20:19; account suspended 20:26; a new rule withheld 37 similar messages. |  |\n| p07 | evidence | The rule did not reach the other markets: Belgium got it on 10 March with the next Yardstick deploy, Poland and Portugal never, and nothing connected the suspended account's phone number to its Motorvane account. | scenario: Yardstick deploy cycle; outsourced PL/PT moderation queues with their own rule sets; the same phone number on a Motorvane private-seller account; Figure 1. | `contrast`: The rule stopped the attack in one market in under an hour. → It did not reach the others. |\n| p08 | context | Ingrid used the incident to ask what Common Ground's slogan 'share platforms, not products' had left unanswered: what a market is in a shared platform, and where each difference should live. | scenario: Common Ground, the €140 million program approved in January 2027; a rule that should reach four countries in minutes against a Polish fee or a Belgian bilingual form that should stay local. | `cause_effect`: The rule's uneven path. → The question it raised for Common Ground. |\n| p09 | evidence | The May 2027 inventory made the problem concrete: ten marketplace tenants in eight countries, nine locales and two currencies, Yardstick's 2,600 country branches and four category trees, Motorvane already configured per country, and Hearthly part-way through moving Spain onto its French platform. | scenario: Tradeyard NL, BE, PL, PT; Motorvane DE, NL, PL, AT; Hearthly FR, ES; Keybridge a SaaS company, not a marketplace; nine locales, EUR and PLN; about 2,600 branches; trees of 1,420, 1,380, 980 and 760 leaves; Motorvane's one Kotlin stack; Spanish login still on Casavista's code. | `elaboration`: The question of what a market is. → The group's inventory of markets. |\n| p10 | transition | The three brands had each solved multi-country inside their own walls in three different ways, so Common Ground had to solve it across brands, and the decision record of 9 June 2027, Tenancy model v1, is the chapter's thread. |  | `conclusion_summary`: The inventory of three brands' arrangements. → The across-brand problem and the decision record that answers it. |\n\n### Concepts: Tenants, Global Components and Configuration\n\n**Controlling idea** (`definition`, id `concepts`): Four terms (brand, market, tenant, marketplace profile) must be kept apart, tenant identity must be separated from tenant isolation, and the global component and configuration over code, with its extension-point limit, are the two mechanisms of sharing.\n\n**Advances the thesis** (S1, S2, S5): Defines the vocabulary every later section uses.\n\n**Transition in:** `cause_effect`: Common Ground's question of what a market is, raised by the scene. → Precise definitions of the words groups use loosely.\n\n**Order of paragraphs** (`prerequisite_order`): Tenant terms come first because the tenancy model is defined in them; identity and isolation follow because they qualify what a tenant is in storage and load; the global component then names what is shared across tenants; configuration over code and extension points name how tenant differences are expressed in it. Placed earlier, the global component would have no tenants to serve.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p11 | definition | Marketplace groups use brand, market, tenant and marketplace profile interchangeably, and this book fixes each one, with the tenant as the unit a shared capability scopes, configures, isolates, releases and bills by. | table: Brand, market, tenant and marketplace profile with definitions and Veldmark examples (Tradeyard; Poland; ty:pl; Tradeyard Poland vehicles). |  |\n| p12 | definition | A tenancy model is the set of decisions that answer, for every shared capability, what a tenant is and how it is identified, isolated, configured, released, costed and allowed to leave; the answers may differ by capability but the tenant codes may not. |  | `elaboration`: The tenant as the unit a shared capability works by. → The full set of decisions about it. |\n| p13 | explanation | The tenant is usually brand × country, because law, language, currency, competitors and partner ecosystems follow the country, and not smaller, because profiles share their market's users, accounts and legal entity. |  | `elaboration`: The tenancy model's first question, what a tenant is. → Why brand × country is the usual answer. |\n| p14 | definition (list) | Tenant identity, which every record, event, request, log line, metric and cost line must carry, is separate from tenant isolation, which is a per-capability choice among logical, partitioned and dedicated tiers, each with its cost. | table: Isolation tiers: logical, partitioned, dedicated, with what is separate, typical use and cost. | `contrast`: What a tenant is. → Two different properties teams often conflate as 'multi-tenant'. |\n| p15 | recommendation | Partitioned isolation is the right default, shared fleets with each tenant's data in movable units, and moving a tenant to dedicated infrastructure must not change any client. | reasoning: search-architecture's index per brand and country on shared clusters; aliases, routing tables and per-tenant connection configuration; Figure 2. | `cause_effect`: The three isolation tiers and their costs. → The default a marketplace group should choose. |\n| p16 | definition | A global component is a capability built and run once for the group with a stable contract beneath local products, and it is not a shared product, because the tenant's product team decides how the capability appears to its users. | example: An image pipeline, an identity service, a moderation decision pipeline, a search engine platform, an experimentation statistics engine. | `sequence`: What a tenant is and how it is separated. → What is shared across tenants. |\n| p17 | evidence | Adevinta's 2019 annual report gives the clearest public test for choosing global components: centralize where investment is large and the technology uniform, and keep product local. | quotation: 'a centralised strategy to data and analytics'; 'where investment requirements are large and the technology is uniform, and where the maxim built once; used many times clearly applies'; 'local autonomy and decentralised capacity in product and technology'. | `elaboration`: The global component as a concept. → A documented test for which capabilities qualify. |\n| p18 | definition | Configuration over code means tenant differences that are data, values a tenant owner can change without a developer, are governed configuration rather than code branches. | example: Locales, currencies, category trees, attribute requirements, fee tables, legal texts, consent purposes, moderation thresholds, feature switches, endpoints per profile. | `sequence`: The global component, what is shared. → How tenant differences are expressed inside it. |\n| p19 | explanation | Because configuration that can express anything becomes an unreviewed programming language, the principle needs three companions: a schema per configuration type, a resolution hierarchy and change control. |  | `cause_effect`: Configuration as governed data. → The controls that keep it from becoming code. |\n| p20 | definition | A difference that is behavior belongs in an extension point where a tenant-owned component plugs in, which gives the ladder configure, then extend, and only then fork. | example: A VIN decoder for cars, an energy-certificate validator for French property, a Polish tax rule. | `contrast`: Differences that are values. → Differences that are behavior, and the ladder. |\n\n### Platform Models: From the Fork to the Product Platform\n\n**Controlling idea** (`comparison`, id `platform-models`): Marketplace groups use six platform models, not a maturity ladder; the public record shows sharing working within a vertical and at lower layers across verticals, while both public converged product platforms were rowed back.\n\n**Advances the thesis** (S5): Grounds the per-capability platform decision in the documented record.\n\n**Transition in:** `elaboration`: The global component and configuration over code, the two mechanisms of sharing. → The platform models groups actually build from them.\n\n**Order of paragraphs** (`large_to_small`): The six-model table first, then what the record shows within a vertical, across verticals and for converged products; each reading cites rows of the table. Without the table first, the readings would cite models the reader has not seen; and the converged-product reversals come last because they qualify the top row and set up the architecture's choice to share beneath the product.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p21 | comparison | Marketplace groups use six platform models, from the fork per country to the converged product platform, and they are not a maturity ladder: most groups run several at once for different capabilities. | table: Fork per country (Schibsted-era Blocket-derived sites, primary documentation unavailable); federation with coordinated choices (Marktplaats and eCG, 2015, republished 2017); shared core with local configuration (OLX 2026 one repo three brands; Adevinta Benelux job posting); global components beneath local products (Adevinta's 2019 rule); platform as product (Adevinta Common Platform, Navarro 2020); converged product platform (Adevinta 2023 'a unified global platform'; AVIV 2021). |  |\n| p22 | evidence | Most successful multi-country sharing is within a vertical: OLX's evidence points to one codebase per vertical serving several country brands, and eCG's 2020 motors partner contract suggests a shared motors platform, both readings labeled as inference. | source: OLX one frontend repository for three brands; centralized learning-to-rank repository with brand configuration; Prosus FY25 credits a 'unified platform' in real estate.; source: eCG MoVe reference repositories, 2020. | `example`: The six models and where each works. → The first pattern in the record: sharing within a vertical. |\n| p23 | comparison | Across verticals the shared layers sit lower: a car marketplace and a property portal share infrastructure, identity, media, messaging, trust signals and data far more easily than an insertion flow. |  | `contrast`: Sharing within a vertical. → Sharing across verticals. |\n| p24 | evidence | Both public attempts at a converged product platform were rowed back: Adevinta's 2023 plan for 'a unified global platform' gave way by 2025 to decentralization (told in full in case-adevinta), and AVIV's 2021 integration ambition gave way by 2025 to local autonomy with selective group functions. | quotation: AVIV CEO, August 2021: 'aligning our tech roadmap across the organization to create a European real estate marketplace'; December 2025 interview: the interviewer's phrase 'fully integrated platform'; the answer 'strengthened the autonomy of its local businesses' while operating 'group-level functions where they create clear advantages'. | `contrast`: Shared layers that work within and across verticals. → The model at the top of the table, and how both public examples ended. |\n\n### Architecture: A Tenancy Model for a Marketplace Group\n\n**Controlling idea** (`description`, id `architecture`): A tenancy model for a marketplace group consists of a layered split of shared and local, a tenant register, a configuration hierarchy, extension points with the configure–extend–fork ladder, release by tenant with group-urgent classes, data boundaries between tenants, and localization beyond translation.\n\n**Advances the thesis** (S1, S2, S3, S4): Specifies each element of the tenancy model the thesis calls for.\n\n**Transition in:** `cause_effect`: The record's lesson that sharing works beneath the product. → A reference architecture for sharing that way.\n\n**Order of paragraphs** (`prerequisite_order`): The layer model first, because every later element sits in its tenancy services; the register next, because configuration, rings and exit paths read it; the configuration hierarchy before extension points, because extensions start where configuration ends; release by tenant after both, because rings and flags release configuration and code alike. The first four elements say how a tenant's differences are expressed and changed; the last two turn from mechanisms to what tenants may not share: data boundaries (where data may live and which tenant may use it, which needs the register's legal entity and hosting profile) and localization, which applies configuration, extensions and release scope to language and ends on Belgium, the case that tests the tenant definition. Placed before the register, data boundaries would cite legal-entity and hosting attributes not yet introduced; placed in the concepts, localization would have no configuration or extension mechanism to point at. Placed earlier, the rings would have no register to read, and Belgium would test a definition the reader had not yet seen used.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p25 | description | The author's reference architecture, not any company's, separates shared from local by layer and puts the tenancy services, on which every layer depends, in the middle. | figure: Figure 3: brands own product surfaces, commercial terms and market policies; the group owns global components and infrastructure; tenancy services carry market differences down as configuration, extensions and release scope. |  |\n| p26 | claim | Local does not mean outside the platform: local content such as a Polish fee table or a Belgian bilingual form is applied by shared components, so the brand owns the content and the platform owns the mechanism. |  | `elaboration`: The layered split of shared and local. → What 'local' means in it. |\n| p27 | description (list) | The tenant register is the small, authoritative list of tenants that every shared capability reads, and an entry holds the code, brand, country and legal entity, locales, currency, time zone and regulator, hosting and isolation profile, profiles and lifecycle. | source: BCP 47 tags (RFC 5646, 2009); ISO 4217 codes with minor units; the DSA for statements of reasons. | `sequence`: The tenancy services at the center of the layers. → Their first element, the register. |\n| p28 | claim | Lifecycle is the attribute most groups omit: a leaving tenant needs export jobs, transitional services and a switch-off plan, and the register is where the platform learns of it. |  | `emphasis`: The register's attributes. → The one most often missing. |\n| p29 | process | Configuration is resolved along a hierarchy from the most general scope to the most specific, inherited unless overridden, with the schema stating the levels at which each key may be set. | figure: Figure 4: the configuration hierarchy, with experiment arms last. | `sequence`: The register, which says what tenants exist. → How each tenant's configuration is resolved. |\n| p30 | evidence | OLX published a small, concrete version of the hierarchy in 2025: one learning-to-rank repository with Hydra composing brand-level configuration, one code path with configuration composed by scope. | source: OLX centralized learning-to-rank projects that had caused 'duplicated efforts' and used Hydra with configs such as brand: olx and brand: real_estate. | `example`: The configuration hierarchy. → A published instance of it. |\n| p31 | recommendation (list) | Four rules keep a configuration hierarchy healthy: every key has a schema, an owner and a level; changes are versioned, reviewed and effective-dated; configuration is data, not logic; and resolution is observable. |  | `cause_effect`: The hierarchy and its published example. → The rules that keep it from decaying. |\n| p32 | definition | When configuration is not enough, a shared capability offers extension points, defined interfaces where a tenant-owned component runs under a contract with an owner on each side. |  | `sequence`: Configuration and its limit, rule three. → The next rung: extension points. |\n| p33 | evidence | Adevinta's 2023 dispute back office is the clearest published example: per-tenant adapters in, a canonical model in the middle and an extensible surface out, the general pattern for a global component that serves different products. | source: Events via Kafka, SQS or REST normalized into one model; an extensible micro-frontend; 'We couldn't hardcode anything… or make any assumptions'. | `example`: Extension points defined. → A published instance. |\n| p34 | comparison | The configure–extend–fork ladder decides which mechanism a difference gets, with an owner and an exit for each rung. | table: Configure (a value; brand content on a group schema); extend (behavior at a known point; promote to core if a second tenant needs it); fork (neither works and the market cannot wait; expiry date and a plan to fold back or leave). | `conclusion_summary`: Configuration and extension points. → The ladder that chooses between them and the fork. |\n| p35 | analysis | The fork rung exists because pretending it does not starts shadow systems: a declared, dated fork is a managed exception, an undeclared one the Copy-Paste Country in miniature. |  | `elaboration`: The fork rung in the ladder. → Why it is there. |\n| p36 | process (list) | Releases of a shared platform are scoped by tenant through release rings, which move a deployment from synthetic to small to the largest tenants, and tenant-scoped feature flags, whose release toggles must expire. | source: Hodgson's taxonomy of release, experiment, operational and permission toggles. | `sequence`: How a difference is expressed: configuration, extension or fork. → How a change reaches each tenant. |\n| p37 | claim | Rings limit a defect's blast radius and flags let a tenant adopt a change on its schedule, but some changes must not wait for any schedule, so the tenancy model names group-urgent change classes in advance. | example: A fraud rule, a security fix or a legal takedown. | `contrast`: Rings and flags as two mechanisms. → Their opposite purposes and the changes that must bypass both. |\n| p38 | explanation | For an EU group, data residency does not mean keeping data in the user's country: GDPR Chapter V restricts transfers outside the EEA, so EU hosting with governed outside access covers most needs, and stricter constraints go in the register's hosting profile. | source: Regulation (EU) 2016/679, Chapter V. | `contrast`: The mechanisms that express and release a tenant's differences. → What tenants may not share: where their data may live and who may use it. |\n| p39 | claim | The harder boundary in a multi-brand group is legal and commercial, which tenant may use which data, so a shared platform needs tenant-scoped access by default and explicit, recorded exceptions. | example: Purpose limitation, competition law, platform-to-business commitments, the group's promises; a shared fraud block list as an exception. | `contrast`: The geographic boundary. → The legal and commercial boundary between tenants. |\n| p40 | comparison | Multi-region deployment is a separate decision that country-scoped classifieds rarely need; Vinted's single cross-border catalog with a primary writer and replicated read projections is the documented exception. | quotation: 'not to shard our primary data models across regions'; 'Eventual consistency is being built into how the system works, not an edge case we try to hide'. | `contrast`: Boundaries between tenants' data. → Whether data spans regions at all. |\n| p41 | explanation (list) | Localization in a listing platform touches at least six layers, and only the first is text: interface text, formats, taxonomy labels, search analysis, legal and policy content, and trust content. | source: Unicode CLDR plural and gender rules; links to location-and-geo, categories-and-taxonomies, attribute-schemas, search-architecture. | `elaboration`: Configuration, extensions and release scope, and the boundaries between tenants. → Language: the market difference that runs through every layer and uses all of those mechanisms. |\n| p42 | example | Belgium is the test case: in 2013 eBay described 2dehands.be and 2ememain.be as one bilingual marketplace under two names, so a model that equates tenant with locale, or brand with domain, cannot represent it. | source: eBay Classifieds Group brand page, 2013 archived snapshot: 'bilingual' Dutch and French search and listing. | `example`: Localization beyond translation. → A market that tests the tenant definition. |\n\n### In Practice: Veldmark's Tenancy Model v1\n\n**Controlling idea** (`example`, id `in-practice`): Veldmark's Tenancy model v1 of 9 June 2027 applies every element of the reference architecture, and its two tests (the phishing replay and the classification of Yardstick's branches), one market that combines the layers (Polish vehicles) and its first release (the taxonomy service's rings) confirm it and refine it.\n\n**Advances the thesis** (S1, S2, S3, S4): Shows the tenancy model decided, tested and used at a group with the scene's problem.\n\n**Transition in:** `example`: The reference tenancy model. → Veldmark's decision record that applies it.\n\n**Order of paragraphs** (`chronological`): In date order: the decision record and the arguments it settled (June 2027), the rings' first use for the taxonomy service (October 2027), the replay of the phishing rule before the trust-and-safety platform went live (November 2027), the branch classification for the insertion flow leaving Yardstick (Q2 2028), and the Polish vehicles section, which combines configuration, extensions and commercial ownership and so needs both tests before it. The rings follow the arguments because the second argument was about ring placement; in any other order the dates jump, which both round-2 flow readers reported.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p43 | evidence | The decision record adopted on 9 June 2027 had nine parts, from ten brand × country tenants to tenant exit paths, each with its reason. | table: 1 ten tenant codes; 2 codes in every identifier vm:<brand>:<country>:<id>, event, API call, log line, metric, cache key and cost tag; 3 Keybridge not a tenant; 4 partitioned default; 5 one configuration service, group → brand → tenant → profile → seller segment → experiment; 6 extension points (VIN decoding, energy certificates, Polish insertion fees); 7 release rings; 8 group-urgent classes; 9 tenant exit paths, because a private-equity owner may sell any tenant. |  |\n| p44 | refutation | The two decisions that drew argument were settled by scope and by traffic: the configuration service is mandatory only for global components, so Motorvane keeps its own, and Poland is too large to be a canary. | scenario: Felix Brandt's objection; Katarzyna Nowak's question; Poland with 3.6 million live listings and 8.9 million monthly users. | `contrast`: The record as adopted. → The two parts of it that were contested. |\n| p49 | evidence | The rings were first used for the group taxonomy and attribute service in October 2027, and the ring-1 week found two defects, one of them a cache key without the tenant code, which is why decision 2 requires the code in every cache key. | scenario: ty:pt on Monday 4 October 2027, ring 2 a week later, ty:nl on Monday 25 October, a week before the bikes split on 1 November; a Portuguese label falling back to Dutch; a cache key missing the tenant code. | `example`: The ring placement argued over, Poland too large to be a canary. → The rings' first use, for the taxonomy service in October 2027. |\n| p45 | process | Before the shared trust-and-safety platform went live for Tradeyard Netherlands and Belgium in November 2027, Ingrid's team replayed the 7 March incident against it as a design test of the tenancy model. | figure: Figure 5: the rule as policy content with a tenant scope; tenants in other languages in shadow mode until a locale term list is reviewed. | `time`: The rings' first use in October 2027. → The replay of the scene's incident before the shared trust-and-safety platform went live in November 2027. |\n| p46 | analysis (list) | The replay produced three findings that went back into the model: rules split into a group detector and tenant locale packs, cross-brand signals need one recorded exception, and statements of reasons stay tenant-scoped. | scenario: The domain-age signal and link pattern global, the wording Dutch; a 48-hour shadow window for Polish and Portuguese packs; a shared block list of hashed identifiers of accounts terminated for fraud, approved by the Group Data Protection Officer; DSA statements of reasons issued per Member State. | `cause_effect`: The replay. → What it found. |\n| p47 | evidence | The second test, on the Tradeyard insertion flow leaving Yardstick in Q2 2028, sampled 300 of the 2,600 country branches and found about 70% values, 20% behavior and 10% dead code, and no branch that justified a fork. | statistic: Daan Visser's team's sample: about 70% configuration, about 20% extensions (Polish insertion fees, Belgian title language detection, Portuguese tax identifiers), about 10% dead; Figure 6. | `sequence`: The first test, on trust and safety. → The second, on the insertion flow. |\n| p48 | example | The Polish vehicles section shows the layers combined: one market, two brands, one shared capability and two commercial owners, all of which the tenancy model has to represent. | scenario: Private-seller listings in tenant ty:pl, with insertion fees in złoty from the ty:pl vehicles profile; Motorvane's VIN decoding through the same extension contract; dealers offered Motorvane packages in tenant mv:pl and syndicated to Tradeyard; the listing core records the commercial owner. | `example`: The branch classification. → One market where all mechanisms meet. |\n\n### Trade-offs\n\n**Controlling idea** (`comparison`, id `trade-offs`): The platform model and the isolation tier are chosen per capability, and the configure-and-share approach stops holding when a market's product has structurally diverged, one tenant dominates, or ownership is about to change.\n\n**Advances the thesis** (S5, S1, S4): Sets out the per-capability choices and states when the thesis does not hold.\n\n**Transition in:** `cause_effect`: Veldmark's decisions and their tests. → The choices behind them, set side by side, and their limits.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p49a | transition | Veldmark's tested decisions rest on choices every group faces, so the section sets them side by side in two tables (a platform model per capability, an isolation tier per workload) and then says when the guidance does not hold. |  |  |\n| p50 | comparison | Read across the two trade-off tables, a capability with uniform technology goes to a global component on a partitioned default while the brand keeps its insertion flow, web, apps and prices, and Veldmark's 2027 choices follow that line. | table: Platform model per capability with Veldmark's 2027 choice (compute, identity, trust and safety, search, taxonomy, catalog, insertion flow, web and apps, packages and prices).; table: Isolation choices: logical everywhere, partitioned by default, dedicated for the largest tenant, dedicated per tenant, with benefit, cost and when each is right. | `elaboration`: The two tables the lead-in announced. → What they show read together, and Veldmark's choices along that line. |\n| p51 | counterargument | The configure-and-share approach fails when a market's product has diverged for structural reasons, when one tenant is so large that the shared platform becomes its platform, and when ownership is likely to change soon. | example: A transactional model among lead-based ones; a regulatory regime with no equivalent; a dominant tenant; an imminent sale (case-adevinta). | `contrast`: The choices the tables recommend. → When those choices do not hold. |\n\n### Vertical Differences\n\n**Controlling idea** (`comparison`, id `verticals`): Every vertical shares its engines and identity easily and its country-specific edges hardly at all, and real estate is the hardest vertical to share across countries.\n\n**Advances the thesis** (S5, S6): Shows where sharing beneath the product stops in each vertical.\n\n**Transition in:** `elaboration`: The trade-offs and the conditions under which sharing stops holding. → How those limits fall in each vertical, which the section's opening sentence names.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p52 | comparison | Real estate is the hardest vertical to share across countries, because professional-software ecosystems, mandatory disclosures and valuation data differ most there, so a shared engine with local ingestion, disclosure and pro-tooling edges fits the evidence and a single property product does not. | table: What varies by country, what is easiest and hardest to share, and the documented signal, for general classifieds, real estate, automotive and jobs. |  |\n\n### Failure Modes\n\n**Controlling idea** (`analysis`, id `failure-modes`): Eight failure modes recur when the tenancy model is missing or partial, from the tenant added as an afterthought to the missing exit path.\n\n**Advances the thesis** (S1, S2, S3, S4): Shows the cost of omitting each element of the tenancy model.\n\n**Transition in:** `contrast`: Where sharing fits each vertical. → What goes wrong when the tenancy model is missing.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p53 | analysis (list) | Eight failure modes recur: the tenant added as an afterthought, brand equated with domain or locale, configuration that became code, release toggles that never expire, rings without a group-urgent lane, the largest tenant as design authority, pooled data without recorded boundaries, and no exit path. | scenario: Belgium, Poland's vehicles section and a rebrand break brand-as-domain; Tradeyard Netherlands carries about 45% of Tradeyard's search traffic; Keybridge's commitments. |  |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `ca-view`): A Chief Architect decides the tenancy model once at group level, the platform model per capability, what to share first and who decides what, watches six measures, and designs the platform to survive the next swing of the centralization pendulum.\n\n**Advances the thesis** (S1, S4, S5, S6): Turns the thesis into decisions, an order of sharing and measures.\n\n**Transition in:** `cause_effect`: The failure modes. → The decisions that prevent them at group scale.\n\n**Order of paragraphs** (`order_of_importance`): The group-level tenancy decision comes first because everything else may vary by capability; then the per-capability model, the sharing order that follows from it, the split of decision rights, the measures that show whether it works, and last the pendulum, which explains why all of it is designed to be reversible. Placed before the per-capability scoring, the sharing order would have no criteria behind it; placed first, the pendulum would argue for reversibility before the reader knows what is being shared.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p54 | recommendation | Decide the tenancy model once, early, at group level: the tenant definition, code format, mandatory carriage and exit-path requirement are the only parts that may not vary by capability. |  |  |\n| p55 | recommendation | Decide the platform model per capability by asking whether it passes both halves of Adevinta's 2019 test, whether its value grows when data is pooled, and whether it can be shared without converging the product above it, and publish the scores. |  | `contrast`: What is decided once for the group. → What is decided per capability. |\n| p56 | recommendation | Share in order infrastructure and cloud governance, the event backbone and data platform, trust signals and identity, media and the search engine, then taxonomy and the catalog and entitlements model, with product surfaces last and often never. | reasoning: Uniform and invisible; everything depends on them; value grows with pooling and fraud ignores brand boundaries; expensive and uniform; need the tenancy services first. | `cause_effect`: The three questions for scoring a capability. → The order of sharing they produce. |\n| p57 | recommendation | The group decides schemas, contracts and the tenancy model, the brand decides configuration values, extensions and product, the platform team decides how a capability is built and run, and the forum decides forks, with an expiry date. |  | `sequence`: What to share and in what order. → Who decides what. |\n| p58 | recommendation (list) | Six measures show whether the model works: adoption without mandate, country branches in code, configuration health, lead time from one tenant to all, cost per tenant, and yearly separability drills. | scenario: On 7 March 2027 the lead time was three days to Belgium and never to Poland or Portugal. | `sequence`: Decision rights. → The measures that show whether the decisions work. |\n| p59 | recommendation | Groups swing between centralization and local autonomy faster than platforms change, so the goal is not the right position on the pendulum but a platform that survives the next swing. | fact: Adevinta (2023 convergence, 2025 decentralization) and AVIV (2021 integration, 2025 localization).; reasoning: Global components a tenant can leave, configuration it can take with it, products that never depended on another brand's code; long-term-evolution's cost to reverse. | `cause_effect`: The measures, including separability drills. → Why reversibility is the design goal. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Ten questions let an architect test a group's platform against the tenancy model: tenant codes, isolation, branches in code, configuration governance, extension points, lead time to all tenants, shared data, exit paths, adoption without mandate and convergence initiatives.\n\n**Advances the thesis** (S1, S2, S3, S4, S5, S6): Gives the reader a working review drawn from every section.\n\n**Transition in:** `cause_effect`: The Chief Architect's decisions and measures. → Questions that test whether they are in place.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p60 | recommendation (list) | Ten questions test whether a group's tenant codes, isolation tiers, branches in code, configuration governance, extension points, lead time to all tenants, shared data, exit paths, adoption and convergence initiatives meet the chapter's design. |  |  |\n\n## Conclusion: From Sharing to Staying Up\n\n**Synthesis:** Each kind of market difference has one place to live (a value in configuration at its level, a behavior in an extension point, a fork only under an expiry date, an urgent rule in a group-urgent lane), and all of them depend on one thing decided once: a tenant code carried everywhere, with an exit path for every tenant.\n\n**So what:** With that model each fraud rule, search upgrade or consent change is built once and reaches every tenant, while each market keeps what makes it local and the group can still sell or move a tenant.\n\n**Callback:** The scene's 7 March phishing rule, which reached Belgium three days late and Poland and Portugal never, and Ingrid's question of where each difference should live. The conclusion answers Ingrid's question difference by difference and shows the replayed rule reaching every tenant at once, with locale packs following within the shadow window.\n\n**Takeaway** (`course_of_action`): Write the tenancy decision record first: tenant definition and codes, mandatory carriage, isolation default, configuration hierarchy, rings with group-urgent classes, and an exit path per capability.\n\n**Hand-off** to [Sunday Evening Peaks: Reliability, Performance and Cost](reliability-and-scale.html): `contrast`: A tenancy model decides how the platform is shared, but not whether the shared platform stays up when every tenant uses it at once. → Reliability, performance and cost: journey objectives, peak planning, degradation and unit costs at the Sunday-evening peak.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p61 | synthesis | Ingrid's question now has an answer for each kind of difference (configuration, extension point, fork with an expiry date, group-urgent lane), all resting on a tenant code carried everywhere, and replayed under Tenancy model v1 the 7 March rule reaches every tenant at once instead of Belgium three days late, so each improvement is bought once while markets stay local. | scenario: The 7 March rule; Belgium on 10 March; Poland and Portugal never; the replay's detector and locale packs within the 48-hour shadow window. |  |\n| p62 | transition | A tenancy model decides how the platform is shared but not whether the shared platform stays up when everyone uses it at once, which reliability-and-scale takes up at the Sunday-evening peak. |  | `contrast`: What the tenancy model decides. → What it leaves open: staying up, fast and affordable at the peak. |\n\n## Non-goals\n\n- Consolidation after acquisitions, synergy cases and brand migrations. See [After the Deal: Consolidating Platforms After Acquisitions](platform-consolidation.html).\n- Team topologies, funding and governance forums. See [Who Owns What: Organizing Marketplace Engineering](organizing-marketplace-engineering.html).\n- Search index topology in depth. See [Search Architecture for Listings: Indices, Freshness and Scale](search-architecture.html).\n- Event contract details. See [Every Change Is an Event: Event-Driven Listing Architecture](event-driven-listings.html).\n- Cross-brand data products. See [Data Platform for Marketplaces: Events, Lakehouse and Data Products](data-platform.html).\n- Reliability, capacity and cost at peak. See [Sunday Evening Peaks: Reliability, Performance and Cost](reliability-and-scale.html).\n- A full retelling of Adevinta's history. See [Adevinta: From Schibsted's Copy-Paste Model to a Portfolio Platform](case-adevinta.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Which OLX brands share which codebase is not publicly documented; revisit if OLX publishes its vertical platform architecture.\n- What AVIV's 'fully integrated platform' consisted of, and how far it got, is not public.\n- The Benelux multi-tenant platform rests on recruiter copy; replace with a technical source if one appears.\n\n## Decision log\n\n- **2026-10-19** — Defined the tenant as brand × country and made marketplace profiles configuration scopes inside it, to stay consistent with the profile register in marketplace-taxonomy and the event identifier format in event-driven-listings.\n- **2026-10-19** — Used the 7 March 2027 phishing rule (ledger) as the motivating incident, because it shows the cost of country forks in hours and days rather than in abstract duplication.\n- **2026-10-19** — Kept Keybridge outside the tenancy model, with registry access only as an integration principal, to agree with sellers-and-accounts and the March 2027 neutrality decision.\n- **2026-10-19** — Treated converged product platforms as one model among six, with both public examples (Adevinta, AVIV) reversed, rather than as the end of a maturity ladder.\n- **2026-11-12** — Converted spec.md to spec.json. Success criteria rewritten: the seven inventory criteria (definitions, a six-model table, a layered architecture with three diagrams, residency and localization coverage, the Veldmark worked example, trade-off and vertical tables with 6–10 questions, grouped sources) are replaced by the journal entry's outcome criteria AC-1 (an uneven rule and a brand's objection: which tenancy controls apply), AC-2 (the opening predicts the sections) and AC-3 (reverse outline); diagram, table and source counts are dropped as inventories. No criteria added. Rejected: Keeping the counts of diagrams, tables and questions as <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';

                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing

            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);

        const tagsHost = document.getElementById('tags');
