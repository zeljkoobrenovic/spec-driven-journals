<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published page (posts/part-7-intro/index.md) and its former spec.md (accepted 2026-10-21), which it replaces; one spec paragraph per unit of the page, in the page's order. Intent outcome, AC-1 to AC-3 and role are copied unchanged from the post's entry in journal-spec.json; the introduction realises Part VII's opening (hook, bridge, roadmap) from the same file. The journal spec gives this post no thesis, so the thesis and its three supporting claims are written here from the part's thesis and flow. The five callouts (IN THIS PART, WHY THE BUSINESS CARES, WHY ARCHITECTS SHOULD CARE, KEY POINTS, FAILURE PATTERNS) stand before the first paragraph and are kept as the house format; the KEY POINTS callout carries the part's claim in three bullets and the IN THIS PART callout names the eight chapter subjects in reading order. Units added to the published page to meet the contract, in the shape the Part II to VI introductions now share: a roadmap paragraph (p03) giving the reading order and the reason for it, a lead-in to the chapter table (p04), and a closing paragraph under 'Where to begin' (p07) with synthesis, callback and hand-off, grown from the published last line of the Veldmark section.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Part VII's argument: a shared platform earns trust through published contracts, not mandates, and two-sided markets break the defaults for experiments and models; share beneath the product and measure by journey.\n- **Know:** The eight chapters in reading order, the question each answers and when to read it, and the Veldmark incidents and 2027 decisions they follow.\n- **Be able to:** Pick the Part VII chapter that answers the platform problem in front of them.\n\n**Audience:** Chief architects, platform-engineering, data and ML leads, and principal engineers responsible for the shared layers beneath a multi-brand marketplace group (the journal's readers), who have read Part VI and are about to start Part VII, or who arrive with a platform problem in hand and want the chapter that answers it.\n\n**Already knows:**\n\n- What an API, a database, an event stream, Kafka, a data warehouse, a search engine, an SLO and Kubernetes are; how to make and defend an architecture decision.\n- Part II's listing lifecycle, Part IV's discovery surfaces (search, ranking, recommendations, saved searches and alerts), Part V's trust decisions and Part VI's revenue lines with their paid effects, leads, contact counts and pricing tests (part-2, part-4, part-5, part-6).\n- The fifteen named failure patterns, among them Search as System of Record, The Copy-Paste Country and Set-and-Forget AI (where-listing-systems-go-wrong).\n- Veldmark in outline: a fictional group of four brands (Tradeyard, Motorvane, Hearthly, Keybridge), Ingrid Halvorsen its Group Chief Architect, Yardstick, Tradeyard's PHP monolith, and the people table, among them Sven Lindqvist (event platform), Priya Raman (Data & ML) and Yara Mendes (Platform Engineering) (meet-veldmark).\n\n**Does not yet know:**\n\n- Transactional outbox, event envelope, schema compatibility and replay (owned by event-driven-listings; the page says 'one owned listing event stream').\n- Consumer registry and staleness budget (owned by listing-data-management; the KEY POINTS callout glosses the registry as 'a register of every copy' and the staleness budget as its 'allowed delay', and the Veldmark thread glosses the consumer registry as 'the register of copies').\n- Interference and cluster randomization (owned by experimentation; the KEY POINTS callout says buyers and sellers affect each other and glosses interference-aware designs as 'ones that allow for that spillover').\n- Decision tier (owned by ml-platform; the FAILURE PATTERNS callout glosses it as 'what it may decide').\n- Journey objectives (owned by reliability-and-scale; the roadmap speaks of 'user journeys' and the Veldmark thread of 'journey service level objectives').\n- Read model (owned by listing-data-management; the FAILURE PATTERNS callout glosses it as 'a copy').\n- Extension points (owned by multi-country-platforms; the FAILURE PATTERNS callout glosses them as 'where a market adds its own code').\n- Error budgets (owned by reliability-and-scale; the KEY POINTS callout glosses them as 'the failure each journey may spend').\n- Degradation ladder (owned by reliability-and-scale; the Veldmark thread glosses it as 'steps that shed load before search fails').\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader of this page alone can name the eight chapters' subjects in reading order. *Probe:* After reading only this page: what will each of the next eight chapters tell you, in order? | `intro_predicts_content` | cold_reader | major |\n| AC-2 | Given situations the chapter table lists, the reader names the chapter to open. *Probe:* Sold listings stay in Google's index; separately, a winning ranking test disappoints once it ships to everyone; and every new fraud rule has to be built once per country. Using only this page, which chapter do you open for each? | `custom` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-4 | The reader can say which earlier parts rely on the platform and which later part takes it further. *Probe:* Using only this page: which earlier parts of the book rely on this platform, and for what; and which later part takes it further? | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** What does this part argue, and in what order should its chapters be read?\n\n> **Claim:** Part VII argues that the platform beneath a group's marketplaces earns trust through published contracts, each with an owner and a check, not through mandates: one owned listing event stream, a register of every copy, governed metrics, experiments and models designed for a market whose two sides affect each other, a tenancy model that shares beneath the product, and reliability and cost measured by journey; its eight chapters are read in the order each builds on a contract an earlier one published: the event stream, the copies and public web built from it, the data platform's metrics, experiments that need them, models that need both, the tenancy model that decides how all of them are shared, and reliability across the whole platform.\n\n**Disputed by:** The common practice in which the platform grows from private integrations (polling jobs, nightly dumps, copied country codebases) or is imposed by a central team as one product stack, so the platform chapters are independent infrastructure topics a reader may consult in any order.\n\n**So what:** A reader who accepts it reads the event chapter first, or opens the one chapter that answers the platform problem in front of them, and judges any platform proposal by its owner, its contract and the check that proves the contract holds.\n\n**How and why:** Every later chapter reads the listing event stream: copies are rebuilt from it, sitemaps follow its lifecycle events, and models are scored from it; experiments need the data platform's governed metrics, and models need both; the tenancy model decides how the capabilities already met are shared; reliability's journeys cross them all. Veldmark starts 2027 with four messaging technologies, three warehouses and 146 production models on four training stacks, browns out Tradeyard NL search for 48 minutes on 17 January 2027, and answers with a series of 2027 contracts the chapters design.\n\n**Supporting claims**\n\n- **PVII-1** — The eight chapters build the platform in the order each reads a contract an earlier one published, and each is the chapter to open first for a recognizable symptom.\n- **PVII-2** — The platform sits beneath every earlier part, which relied on it, and Part VIII takes it to the Chief Architect's agenda.\n- **PVII-3** — Veldmark starts 2027 with a platform that grew without contracts, meets its cost in a Sunday-evening search brown-out, and answers with a series of 2027 decisions that the chapters design.\n\n## Role in the part\n\nPerforms the part's opening: states that a shared platform earns trust through published contracts, not mandates, gives the reading order of the eight chapters, and frames them with the Sunday-evening brown-out and Veldmark's 2027 platform decisions.\n\n## Flow\n\n**Pattern:** `large_to_small` (also `prerequisite_order` in p03 and the chapter table in p04: the eight chapters in the order each reads a contract an earlier one published)\n\nThe page opens on the layer Parts II to VI stood on without designing it, states the part's claim (trust through contracts, not mandates), then gives the reading order with the reason for it and narrows to one row per chapter with the symptom that sends a reader there. It widens once to say which earlier parts rely on the platform and where Part VIII takes it, shows Veldmark's starting point, the brown-out and its 2027 decisions, and ends with a short synthesis, the part's test and the hand-off to the first chapter. The order is given before the table because the rows read as a sequence only once the reader knows each chapter reads a contract an earlier one published; the connection section follows the table because it names what earlier parts assumed of the chapters just listed; the Veldmark section follows because its decisions are what the chapters design; the conclusion comes last and holds no new material. Put Veldmark first and its decisions arrive before the reader knows which chapter designs each; put the connection first and it names the event contract and copies before the reader has met the chapters that build them.\n\n## Introduction\n\n**Hook** (`direct_statement`): Parts II to VI designed what a marketplace does. Most groups never designed the layer all of that stands on: it grew from polling jobs, nightly dumps and copied country codebases.\n\n**Bridge:** Parts II to VI, which designed what a marketplace does (model listings, take supply in, match it to demand, keep it safe, make money from it) and assumed the layer beneath. → The distributed system all of those capabilities stand on, which most groups never designed, and the part's answer: a written promise, an owner and a check for each piece of it.\n\n**Thesis statement** (KEY POINTS callout; paragraph p02 (bold phrase)): A shared platform earns trust through contracts, not mandates.\n\n**Roadmap** (IN THIS PART callout; paragraph p03; the section headings):\n\n- Eight chapters in the order each builds on the ones before: the event stream first, then the copies and public web built from it, the data platform's metrics, the experiments that need them, the models that need both, tenancy, which decides how all of them are shared, and reliability last, whose journeys cross them all; a table says when to open each. *Kept in:* chapters.\n- After the table, the part's place in the book and Veldmark's 2027 decisions, announced by their section headings (the prose signpost was cut to stay within 1,000 words). *Kept in:* connects, veldmark.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Parts II to VI designed what a marketplace does, and Part VII turns to the distributed system all of those capabilities stand on, a layer most groups never designed because it grew from polling jobs, nightly dumps and copied country codebases. |  |  |\n| p02 | claim | The part's claim is that a shared platform earns trust through contracts, not mandates: events, copies, URLs, metrics, experiments, models, tenants and service levels each need a written promise, an owner and a way to check the promise is kept, so the brands above can move at their own pace without breaking each other. | figure: Figure 1: a tangle of pipes, dumps and copied code on the left contrasted with a foundation of six owned contract tiles on the right, on which four brand storefronts stand independently. | `problem_solution`: The layer that grew from polling jobs, nightly dumps and copied codebases. → The part's answer: contracts with owners and checks, not mandates. |\n| p03 | transition | The eight chapters are read in the order each builds on the ones before: the event stream, then the copies and public web built from it, the data platform's metrics, experiments that need them and models that need both; tenancy decides how all of them are shared, and reliability, spanning every user journey, comes last. |  | `elaboration`: The contracts the chapters write. → The order in which the chapters build them, and why. |\n\n## Sections\n\n### Chapters in this part\n\n**Controlling idea** (`description`, id `chapters`): Each of the eight chapters answers one question and is the one to open first for a recognizable symptom.\n\n**Advances the thesis** (PVII-1): Lists the chapters in reading order with the question each answers and the symptom that sends a reader to it.\n\n**Transition in:** `elaboration`: The eight chapters in reading order. → One row per chapter: its question and when to open it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p04 | description | A one-sentence lead-in says each row of the table, in reading order, gives a chapter's question and the symptom that should send the reader to it. | table: Eight rows in reading order: event-driven-listings (removals arrive late, or a new consumer takes a quarter to build), listing-data-management (nobody can list every copy, or an erasure request takes at:** With every copy and derived product under a checked promise, a reader can answer the part's test for any listing fact: where it is true, which copies hold it and how they would be rebuilt or erased.\n\n**Callback:** The opening (p01): the layer that grew from polling jobs, nightly dumps and copied country codebases. The closing paragraph says what the contracts give that those integrations never could.\n\n**Takeaway** (`course_of_action`): By the end of Part VII, say for any listing fact where it is true, which copies hold it and how you would rebuild or erase them; begin with event-driven-listings.\n\n**Hand-off** to [Every Change Is an Event: Event-Driven Listing Architecture](event-driven-listings.html): `elaboration`: The part introduction's first key point, that the platform is a set of published contracts starting with one owned listing event stream. → The listing event as a contract: reliable publication, idempotent consumption, schema evolution and replay.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | synthesis | Read together, the chapters put each contract under a check, which polling jobs and nightly dumps never had, so a reader can say for any listing fact where it is true, which copies hold it and how to rebuild or erase them; a reader begins with event-driven-listings. |  |  |\n\n## Non-goals\n\n- Re-teaching any chapter's content; explaining Kafka, lakehouses or SLOs; the chapters own them and the page points to them. See [Every Change Is an Event: Event-Driven Listing Architecture](event-driven-listings.html), [System of Record and Read Models: Listing Data Management](listing-data-management.html), [Found by Google: Web, App and SEO Architecture for Listings](web-and-seo-architecture.html), [Data Platform for Marketplaces: Events, Lakehouse and Data Products](data-platform.html), [Testing a Two-Sided Market: Experimentation Platforms](experimentation.html), [Models in Production: ML Platforms and Use Cases](ml-platform.html), [One Platform, Many Marketplaces: Multi-Country and Multi-Brand Architecture](multi-country-platforms.html), [Sunday Evening Peaks: Reliability, Performance and Cost](reliability-and-scale.html).\n- Defining, beyond a short gloss, terms the page uses only as names of what a chapter builds: read model, extension points, error budgets, degradation ladder. See [System of Record and Read Models: Listing Data Management](listing-data-management.html), [One Platform, Many Marketplaces: Multi-Country and Multi-Brand Architecture](multi-country-platforms.html), [Sunday Evening Peaks: Reliability, Performance and Cost](reliability-and-scale.html).\n- Veldmark platform figures beyond the decision dates and headline counts (event volumes, copy counts, unit costs, model inventory detail). See [Every Change Is an Event: Event-Driven Listing Architecture](event-driven-listings.html), [System of Record and Read Models: Listing Data Management](listing-data-management.html), [Models in Production: ML Platforms and Use Cases](ml-platform.html), [Sunday Evening Peaks: Reliability, Performance and Cost](reliability-and-scale.html).\n- External factual claims; the page cites no company facts and needs no sources.\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-10-19** — Modeled on part-2 so all part intros look alike; the eight-chapter table makes this intro the longest of the set.\n- **2026-10-19** — Failure patterns chosen for the platform layer; Ghost Inventory, already named in Part II, is left to the chapters.\n- **2026-10-19** — Veldmark decisions listed in date order; figures stay in the chapters. Superseded 2026-11-12: listed in chapter order, each with its date.\n- **2026-11-12** — Converted spec.md to spec.json. Success criteria: the callout-format, argument, chapter-table, connection, Veldmark-facts, hand-off and word-count criteria were inventories of contents or format and are dropped (format stays governed by the style guide; Veldmark facts by the ledger; the hand-off is now conclusion.hand_off; the word count is length.max_words). They are replaced by the journal spec's AC-1 to AC-3 and one added minor criterion, AC-4 (which earlier parts rely on the platform and where Part VIII takes it), which tests the connection section. Rejected: Carrying the success criteria over as written (inventories).\n- **2026-11-12** — Thesis and supporting claims PVII-1 to PVII-3 written here, since the journal spec's entry for this post has none: the question is the entry's question; the claim condenses the part thesis to what this page argues (contracts, not mandates, and the reading order from the part's flow). For the author to confirm. Rejected: Copying the part thesis whole, which this page summarizes but does not argue.\n- **2026-11-12** — Word limit: max_words 1,000 by check_draft's count, as for the Part II to VI introductions (the old spec's 500–800 words was prose without callouts). The published page counted 910 by it.\n- **2026-11-12** — Units added so the page carries the part opening, in the shape the Part II to VI introductions share: a roadmap paragraph (p03) giving the reading order and the reason for it; a lead-in to the chapter table (p04); and a closing paragraph under a new 'Where to begin' heading (p07) with synthesis, callback and hand-off, grown from the published 'By the end of Part VII… Begin with [Every Change Is an Event: Event-Driven Listing Architecture](event-driven-listings.html).' For the author to confirm. Rejected: Keeping the part's test and the hand-off as the last line of the Veldmark section, which leaves the page without a conclusion.\n- **2026-11-12** — Thesis rubric: pass on all four questions; minor notes in open_questions. Flow rubric: sound with notes. Taken: the conclusion's synthesis (p07) covered only the event stream and copies; it now names all eight contracts (every event, copy, page, metric, experiment, model, tenant and journey under a c <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
