<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, acceptance criteria AC-1 to AC-3, the thesis and the role are copied unchanged from the location-and-geo entry in journal-spec.json. Units added by this conversion: a lead paragraph for the Trade-offs section (p51) and a synthesis paragraph (p63) before the hand-off in the closing section; the introduction's third paragraph gained the roadmap.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Country-shaped addresses, geocoding outputs, gazetteers and place hierarchies, precision levels and geo indexes.\n- **Know:** The three representations per listing (restricted precise point, public point, place IDs) and the semantics of radius, polygon and place searches.\n- **Believe:** Location is a small subsystem, not a field, and geocoding is a licensing decision before it is a technical one.\n- **Be able to:** Find where their platform leaks a private seller's location, including through distances and API payloads.\n- **Be able to:** Check whether their stored coordinates are licensed for storage, and why their filters, maps and landing pages disagree.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a location leak that the listing page did not show, the reader explains how it happened and what the model changes. *Probe:* A marketplace shows only a postcode district on private sellers' listings, yet a buyer turned up at a seller's door. Using only this chapter: how could that happen, and what does the location model change? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** How do you model and process location so search, maps, trust and analytics work across countries?\n\n> **Claim:** A listing's location is a small subsystem, not a field: it stores a restricted precise point, a public point derived from it deterministically by a group precision policy, and stable place IDs from a versioned gazetteer, so radius search, landing pages, duplicate detection, fraud signals and analytics each read the representation meant for them; distances, map pins, payloads, feeds and structured data are computed from the public point only, enforced on the server; and geocoder licence terms are recorded with every coordinate, because storage rights depend on provider, country and use.\n\n**Disputed by:** The view that location is one coordinate field, geocoded once and read by every consumer, with privacy handled by what the listing page displays and geocoder choice a matter of price and accuracy.\n\n**So what:** A group that accepts this runs one gazetteer and geocoding gateway (Veldmark Place, approved in May 2027), makes the precision policy group policy with brand parameters, chooses providers per country and use behind the gateway and reviews their licences in every acquisition, and publishes location quality weekly, with a precise-point exposure target of zero and any exposure treated as a privacy incident.\n\n**How and why:** Tradeyard showed '3014 Rotterdam' on the page but returned the seller's postcode centroid to six decimals in its search API and showed distances to one decimal, so a stranger found a seller's door; Hearthly Spain showed exact pins for private landlords. Search radius, landing pages, duplicate detection and fraud each need a different representation: the Barcelona ring's 35%-below-market signal exists only because rent medians are computed per small H3 cell.\n\n**Supporting claims**\n\n- **L1** — A listing's location is a small subsystem, not a field: it has several kinds, country-shaped addresses, geocoder results that carry match level, confidence and provenance, a gazetteer of administrative and marketplace places, a precision scale and geo indexes for different jobs.\n- **L2** — Location is stored as three representations, a restricted precise point, a public point derived from it deterministically by policy, and place IDs with all ancestors from a versioned gazetteer, each read by the consumers meant for it.\n- **L3** — Privacy is enforced on the server: every distance, pin, payload, event, feed and structured-data field a buyer or partner can read is computed from the public point, and internal reads of the precise point are purposeful and logged.\n- **L4** — Radius, place and polygon queries agree only when each reads a declared representation (a curated search origin, stored place IDs, public points) from one gazetteer shared across countries.\n- **L5** — Geocoding is a licensing decision before it is a technical one: providers are chosen per country and per use, and the licence terms are recorded with every stored coordinate.\n- **L6** — At group scale location needs one owner: one gazetteer and geocoding gateway, a group precision policy with brand parameters, providers behind the gateway, and published quality metrics.\n\n## Role in the part\n\nModels location as three representations under a precision policy and a governed gazetteer, which search, maps, alerts, duplicate detection and fraud later read. Supports P2-5 of part `part-2`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `assertion_evidence_reasoning` in practice: the model tested on three Veldmark cases and quality metrics)\n\nEach section supplies what the next needs. The scene poses the problem; the concepts give the vocabulary; the licences say what the geocoder outputs just defined may be stored and shown, which the architecture's gateway and provenance then rely on; the architecture combines concepts and constraints into three representations and the distance rule; query semantics are decisions about those representations; the Veldmark cases run the whole model; trade-offs, vertical differences, failure modes, the Chief Architect's decisions and review questions are judgements about a model the reader has now seen. Moving the architecture before the concepts would use match levels, places and precision levels before they are defined, and moving the licences after it would describe a licence-aware gateway before the licences.\n\n## Introduction\n\n**Hook** (`intriguing_example`): A buyer searching 'within 10 km of Utrecht' gets a bike 14 km away; 'apartments in Lyon' leaves out Villeurbanne; a private seller's home can be worked out from distances in the app.\n\n**Bridge:** Search bugs the reader has seen: wrong radius results, missing landing-page listings. → They come from how location was modeled, and in Part II's model location is a governed subdomain on which search, maps, alerts, duplicates, fraud and SEO build.\n\n**Thesis statement** (KEY POINTS callout (all three bullets) and paragraph p02.): Location is not an attribute but a small subsystem: three representations under a precision policy and a gazetteer, privacy enforced on the server, and licences recorded with every coordinate.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p03.):\n\n- Veldmark's five answers to 'where is it?' *Kept in:* scene.\n- The concepts: kinds of location, addresses, geocoding, gazetteers, precision and geo indexes. *Kept in:* concepts.\n- Geocoding licences. *Kept in:* licences.\n- The three representations and the services behind them. *Kept in:* architecture.\n- The semantics of radius, polygon and place queries. *Kept in:* semantics.\n- The Rotterdam bike, the Lyon apartment and the Barcelona fake-rental ring through the model. *Kept in:* practice.\n- Trade-offs, vertical differences, failure modes, the Chief Architect's view and review questions. *Kept in:* trade-offs, verticals, failure-modes, ca-view, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A marketplace's wrong answers to 'where is it?' look like search bugs but come from how location was modeled. | example: A bike 14 km away in a 'within 10 km of Utrecht' search; Lyon flats in Villeurbanne left out of 'apartments in Lyon'; a private seller's home worked out from distances in the app. |  |\n| p02 | claim | Location is not an attribute but a small subsystem in Part II's model of a listing that references governed subdomains, one whose design decides whether a private seller's home stays private and on which search, maps, alerts, duplicate detection, fraud and SEO all build. |  | `cause_effect`: Failures that come from how location was modeled. → What location is in the book's model: a subdomain and a subsystem, with what it builds on and what builds on it. |\n| p03 | transition | The chapter follows Veldmark, whose listing brands hold five different ideas of what a location is, from those five answers through the concepts, the licences, the three representations and query semantics, to three Veldmark cases and the trade-offs, vertical differences, failure modes, Chief Architect's view and review questions, with evidence from providers' terms, standards, documentation and Veldmark. |  | `sequence`: Location as a subsystem. → The running example and the order of the chapter. |\n\n## Sections\n\n### Setting the Scene at Veldmark: Five Answers to \"Where Is It?\"\n\n**Controlling idea** (`context`, id `scene`): A privacy complaint at Tradeyard and an inventory of five brand answers show that one location field read by every consumer leaks private locations, leaves licences unknown and blocks group search.\n\n**Advances the thesis** (L2, L3): Poses the problem the three representations and the server-side rule solve.\n\n**Transition in:** `sequence`: The chapter's plan, starting with Veldmark's five answers. → The complaint that started Ingrid's review.\n\n**Order of paragraphs** (`problem_solution`): One concrete leak first, then its mechanism, then the five brands' answers, then what those answers prevent at group level; the inventory reads as a diagnosis only after the reader has seen how one of its rows let a stranger find a door.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p04 | context | A Tradeyard seller in Rotterdam found a stranger at her door although the listing page showed only '3014 Rotterdam'. | scenario: Lucía Ortega brings Ingrid Halvorsen the complaint in late March 2027; the page showed only the postcode district. |  |\n| p05 | cause_effect | The leak came from the system behind the page: distances computed from the full six-character postcode centroid and that centroid returned to six decimals in the search API, so a payload read or three searches located the door. | scenario: Distances to one decimal ('2.3 km') from the centroid of a six-character postcode; the centroid in the JSON payload to six decimal places.; figure: Figure 1: three distance circles intersect at the seller's front door. | `cause_effect`: The puzzle of how he found her. → The reconstruction by Daan Visser's team. |\n| p06 | evidence | Each Veldmark brand captures, stores, shows and geocodes location differently, including exact pins for private landlords at Hearthly Spain. | table: Five rows: Tradeyard NL/BE, Tradeyard PL/PT, Motorvane, Hearthly FR, Hearthly ES, by capture, storage, public display and geocoder. | `elaboration`: One brand's leak. → How every brand handles location. |\n| p07 | analysis | Each answer was reasonable alone, but together they leave Veldmark unable to say what location data it publishes about private individuals, whether its coordinates were licensed for storage, or to run one map, one cross-border search or one rent comparison. |  | `cause_effect`: The five answers. → What they cost the group, and the model the rest of the chapter proposes. |\n\n### Concepts: What \"Location\" Means for a Listing\n\n**Controlling idea** (`definition`, id `concepts`): Location is a subsystem of distinct concepts: kinds of location, country-shaped addresses, geocoder outputs, gazetteers and place hierarchies, a precision scale and geo indexes.\n\n**Advances the thesis** (L1): Defines the parts the subsystem is made of.\n\n**Transition in:** `problem_solution`: Five inconsistent answers and the model Ingrid's team proposes. → The vocabulary that model is built from.\n\n**Order of paragraphs** (`prerequisite_order`): Kinds of location first (what is being located), then the address as captured, then geocoding that turns it into coordinates with a match level, then the places those coordinates fall in, then precision (which needs places to name its levels), then geo indexes that query all of it. Precision before places would leave its levels undefined; indexes first would index something not yet described.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | definition | A listing can carry four kinds of location, item, seller, handover and service area, and confusing them is the first modeling mistake; a kind says what is located, while how precisely one location is stored and shown is a separate question that the precision levels and the architecture answer. | table: Kind, definition, example, who needs it, for the four kinds. |  |\n| p09 | explanation | For goods, item and seller location usually coincide, which is why systems store one field, but they part often enough to matter, and shipping turns item location from a hard filter into a delivery-cost input. | example: A dealer group with ten branches, an item at a parent's house, a property listed by an agency elsewhere, shipped items; Tradeyard Safe Deal parcels. | `elaboration`: Four kinds. → Why systems usually store one, and when that breaks. |\n| p10 | definition | There is no universal address model: postcodes alone differ in shape and meaning across Veldmark's countries, so address formats must be data per country. | table: Postcode shapes and specificity for NL, BE, DE/AT, FR, ES/PT/PL with consequences. | `sequence`: What is being located. → How its address is captured. |\n| p11 | evidence | Industry practice parses free-text addresses into components before matching, and libpostal does it well enough but heavily enough to run as a shared service. | source: libpostal: 99.45% full-parse accuracy on held-out data, '60+ languages', model about 1.8 GB. | `elaboration`: Country-shaped addresses. → How free text becomes components. |\n| p12 | definition (list) | Geocoding and reverse geocoding are inexact, so every geocoder result must keep its match level, confidence and provenance, and the licence makes provenance mandatory for location. |  | `sequence`: Parsed address components. → Turning them into coordinates, and what to keep with the result. |\n| p13 | definition (list) | A gazetteer is a reference dataset of named places with stable IDs, names, geometries and parent relations, and OpenStreetMap's admin levels and Who's On First show the design space. | source: OSM admin_level 2 to 10, meanings varying by country (Berlin at 4); Who's On First stable 64-bit IDs, multiple hierarchies, query by ID not name. | `sequence`: Coordinates. → The places they fall in. |\n| p14 | explanation | Marketplaces need places with several parents and places no administration defines, so the gazetteer holds administrative places and curated marketplace places. | example: Lyon 7e in the commune, the Métropole and the Rhône; 'Randstad', 'Costa del Sol', 'Eixample'. | `elaboration`: The two public models. → What a marketplace needs from them. |\n| p15 | claim | Listings reference places by ID and carry all ancestor IDs, so 'all listings in Rotterdam' is a term filter and renaming a place changes no listing. |  | `cause_effect`: A gazetteer of administrative and marketplace places. → How listings point at it. |\n| p16 | definition | Location precision is the level of detail at which a location is known, stored or shown, and Veldmark adopts a six-level scale from P0 country to P5 exact. | table: P0 to P5 with Tradeyard NL and Hearthly FR examples. | `sequence`: Places and hierarchies. → Levels of detail named after them, completed by two finer levels (street and exact address). |\n| p17 | analysis | Precision applies three times, capture, stored and display, and the Rotterdam mistake was letting display precision follow stored precision with only the page template blurring it. |  | `elaboration`: The six levels. → The three moments they apply to, and the Rotterdam case read in those terms. |\n| p18 | definition (list) | A geo index makes spatial queries cheap, and four families matter in listing systems: engine-native types, geohash, H3 and S2. | source: Elastic BKD trees and tessellation; geohash cell-edge problem; H3 (Uber 2018) 16 resolutions, 36.13 km² at res 6 to 0.105 km² at res 9; S2 levels 0 to 30, Hilbert ordering; Airbnb 2026 uses S2 cells as a feature. | `sequence`: Locations, places and precision. → The data structures that query them. |\n| p19 | synthesis | The four index families are complementary: engine-native types serve queries, H3 serves aggregation and privacy, and S2 or geohash serve key-value lookups. |  | `conclusion_summary`: Four index families. → The job each one serves, with a pointer to the trade-offs. |\n\n### Geocoding Providers and Licences\n\n**Controlling idea** (`comparison`, id `licences`): Geocoding and map-data licences decide what a marketplace may store, so providers are chosen per country and use, the licence is recorded with every coordinate, and most groups end up with a mix whose volumes are smaller than feared.\n\n**Advances the thesis** (L5): Shows the terms that make geocoding a licensing decision and the rule that follows.\n\n**Transition in:** `cause_effect`: The concepts, including geocoder results that record provider and licence. → The constraint to know before designing: what the providers' licences allow a marketplace to store and show.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The terms first, as dated evidence; then the rule they force; then the build-versus-buy mix that follows; then the cost reassurance. The rule before the terms would ask the reader to accept a constraint without seeing it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p39 | evidence | Geocoding and map-data licences differ in ways that decide what a marketplace can store, as the providers' terms in October 2026 show, so the constraint must be known before the design. | table: Google (storage restricted, place IDs storable, display on a Google Map), Mapbox (temporary not cacheable, permanent=true paid), Nominatim public (1 request/second, no bulk), OSM data (ODbL share-alike), Pelias (MIT), national registers (BAG public domain mark, BAN Licence Ouverte 2.0, OS Open UPRN about 40 million locations). |  |\n| p40 | claim | The provider is chosen per country and per use, and the licence is a property of every stored coordinate, because storage, autocomplete and base maps are different uses with different terms. |  | `cause_effect`: Terms that differ by provider. → The rule they force. |\n| p41 | recommendation (list) | Most groups end up with a mix: self-hosted national registers where open, a commercial geocoder with storage rights elsewhere, and an open-data gazetteer extended with curated places. |  | `cause_effect`: Provider per country and use. → The mix that results. |\n| p42 | analysis | The volumes that drive geocoding cost are smaller than feared, because most private listings are geocoded from a postcode lookup and full-address geocoding is concentrated in feeds whose results can be stored. |  | `elaboration`: The mix of providers. → What it costs. |\n\n### Architecture: Three Representations and the Services Behind Them\n\n**Controlling idea** (`explanation`, id `architecture`): The location value object has three parts read by different consumers, produced by six components, with the public point derived deterministically and every buyer-facing distance, event and search field computed from the public side.\n\n**Advances the thesis** (L2, L3): Sets out the three representations and the server-side rule that keeps the precise point private.\n\n**Transition in:** `sequence`: The concepts and the licence constraints. → The model assembled from them: one value object and the services behind it.\n\n**Order of paragraphs** (`large_to_small`): The value object first, because every later paragraph refers to its three parts, followed directly by how the parts derive from each other in the table's order; then the components that produce the parts, with Figure 2 after the list that numbers them, and the reason the precise part's store is restricted (personal data) right after the restricted store it explains; then the one derivation that decides privacy (the public point), closed by Airbnb's documented example of the same separation; then the rule for distances that depends on it; then the event and search document that carry the result downstream. Starting with the search document would show fields before the reader knows which part they come from; placing the personal-data evidence between the table and the derivation interrupted the table's line of thought.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p20 | claim | With the concepts and licence constraints in place, location inside the listing aggregate is a value object with three parts, precise location, public location and place references, written together but read by different consumers. | table: Part, contents, classification, readers for the three parts. |  |\n| p21 | explanation | The table's order is also the order of derivation: each part can be recomputed from the one above it, which makes policy changes and boundary reforms backfills rather than migrations. |  | `elaboration`: The three parts in the table's order. → The table's order as the order of derivation, which makes changes backfills. |\n| p23 | description (list) | Six components produce and guard the three parts: country address capture, a geocoding gateway, a gazetteer service, a place resolver, a precision policy engine and a restricted location store. | figure: Figure 2: location enters as text and leaves as two products; everything right of the policy engine sees only what the policy allows. | `sequence`: The value object and how its parts derive from each other. → The services behind it, with Figure 2 after the list that numbers them. |\n| p22 | evidence | The store is restricted because a private seller's precise location is personal data while the gazetteer is not, which the GDPR states and which the author's generic Productscape reference models show is easy to get wrong. | quotation: GDPR Art. 4(1): location data as one of the identifiers that make a person identifiable.; source: The author's two generic reference models built with Productscape, a product-domain modeling method introduced in business-capabilities, describing no real company: the real-estate model classifies geo reference data as non-personal and listings with a private owner's location as 'possible-personal'; the general-listings model's own review notes its non-personal classification is wrong for private sellers. | `cause_effect`: The restricted location store (component 6) and Figure 2's audited path. → Why the precise part is restricted: it is personal data for private sellers. |\n| p24 | comparison (list) | The precision policy can derive the public point by snapping to an H3 cell centre or by a seeded offset, and the offset must be deterministic or repeated versions average back to the true point. | source: H3 res 7 average edge 1.41 km, res 8 0.53 km.; figure: Figure 3: seeded offset versus redrawn pins that average back to the house. | `elaboration`: The precision policy engine. → How it derives the public point. |\n| p25 | explanation | Both methods need two refinements: the public point must stay inside the public place, and in sparse areas the policy coarsens until the area holds a minimum number of addresses. |  | `additional_support`: Two derivation methods. → Refinements that apply to both. |\n| p26 | evidence | Airbnb's documented obfuscation shows the principle that the exact address is released for a reason, to a known person, not at publication. | quotation: 'within about a half mile (less than 1 kilometer) of the street address'; 'guests don't receive the address until their reservation is confirmed'. | `example`: Deriving a public point. → A documented public example. |\n| p27 | claim | Distances shown to buyers and distance sorting must be computed from the public point and rounded to its precision, because precise distances turn three searches into a location. |  | `cause_effect`: The public point. → The rule for every distance a buyer sees, back to the Rotterdam case. |\n| p28 | counterargument | Internal consumers such as duplicate detection and fraud models need the precise point, and read it from the restricted store with every read logged. | figure: Figure 4: one precise point, many audiences. | `contrast`: Buyer-facing distances from the public point. → Internal consumers that need the precise one. |\n| p29 | claim | The listing event carries the public part and the place references, not the precise part, so the event stream and every downstream copy stay free of precise private locations. | case: Femke's bike listing existed in seven copies. | `sequence`: Which consumers read which part. → How the parts travel downstream in events. |\n| p30 | description (list) | The search document holds the public point, all place IDs and ancestors, H3 cell IDs and the display label and level. |  | `sequence`: The event contract. → The search document built from it. |\n| p31 | explanation | For real estate the search document may also hold a precise point that is never returned and is used for polygon queries only where the agency chose exact display, and map-search owns the query design. |  | `elaboration`: The public search document. → The real-estate exception and the pointer to map search. |\n\n### Radius, Polygon and Place: Getting the Semantics Right\n\n**Controlling idea** (`explanation`, id `semantics`): Each kind of location query hides a decision, and the model makes each one explicit: a curated search origin, administrative and marketplace places, names on IDs, place filters on stored IDs and polygons on public points, one model across borders, and the routing provider's terms as a constraint.\n\n**Advances the thesis** (L4): Shows that filters, maps and landing pages agree only when each query reads a declared representation.\n\n**Transition in:** `cause_effect`: The three representations and what the search document holds. → The decisions hidden in the queries that read them.\n\n**Order of paragraphs** (`grouping`): One query type per paragraph, from the simplest (radius origin) to the widest in scope (cross-border), with travel time last because it moves beyond the location model to a provider constraint and echoes the licences section. The place-versus-polygon rule needs the administrative and marketplace places and the names-on-IDs rule before it; placed earlier, it would use place IDs whose meaning had not been settled for the buyer's words.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p32 | claim | Each kind of location query hides a decision that becomes a visible bug if left implicit. |  |  |\n| p33 | example | A radius needs an origin, and Veldmark's gazetteer stores a curated reference point for every place used as a search origin. | example: Rotterdam's municipality includes Hoek van Holland about 30 km from the centre, so its geometric centroid can fall somewhere unhelpful. | `example`: Hidden decisions. → The first: where a radius starts. |\n| p34 | example | 'In Lyon' can mean the commune, the metropolis or a buyer's mental map, so the gazetteer offers an administrative and a marketplace place and query understanding chooses. | example: Villeurbanne, a separate commune inside the Métropole de Lyon.; figure: Figure 5: commune outline, neighbouring commune, dashed marketplace place. | `sequence`: Where a radius starts. → What a place name means. |\n| p35 | example | Names belong to place IDs, with aliases, so bilingual and alternative names resolve to one place. | example: Brussels-Capital Region's 19 municipalities with French and Dutch names; 'Elsene' and 'Ixelles'; 'The Hague', 'Den Haag', ''s-Gravenhage'. | `sequence`: Which place a name means. → Several names for one place. |\n| p36 | claim | Place filters use stored place IDs and polygons use public points, with the real-estate exact-display case as the one exception, and the listing page names the stored place, so what the buyer sees matches the filter that found it. |  | `contrast`: Names on IDs. → Polygons and places, which can disagree at boundaries. |\n| p37 | example | A cross-border radius is possible only with one coordinate system, gazetteer and index across countries, so a country fork rules it out before anyone decides whether it is wanted. | example: Motorvane in Germany, the Netherlands, Poland and Austria; a buyer in Aachen searching within 50 km covers parts of three countries. | `sequence`: Queries within one country. → Queries that cross a border. |\n| p38 | example | Travel-time search shows that the routing provider's commercial model is an architectural constraint like the geocoder's licence. | source: Rightmove's 'My Places' uses the TravelTime API; the vendor case study says Rightmove chose a fixed annual licence with unlimited requests to avoid pay-as-you-go cost growth. | `sequence`: Distance-based queries. → Commute time, and the provider terms behind it. |\n\n### In Practice at Veldmark\n\n**Controlling idea** (`example`, id `practice`): Three Veldmark cases and a weekly quality report show the model at work: the Rotterdam bike's public point reveals no more than a district, the Lyon apartment's agencies' choices are honoured consistently, the Barcelona ring is caught partly through location signals, and quality is measured.\n\n**Advances the thesis** (L2, L3, L6): Applies the representations, the distance rule and the published metrics to fictional cases.\n\n**Transition in:** `sequence`: The model, its providers and its query semantics. → The model run end to end on Veldmark's three cases, starting with a private seller like the one in the scene.\n\n**Order of paragraphs** (`grouping`): The private-seller case first because it answers the scene's complaint; the agency case adds place hierarchies, seller choice and duplicates; the fraud case adds location as a trust signal; the quality metrics close because they measure everything the cases used. Putting the metrics first would measure a pipeline the reader has not seen run.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p43 | example (list) | Femke, a different private seller in Rotterdam from the scene's complainant, listed her bike on the old model on 7 March; replayed under the policy adopted later in 2027, it is captured, geocoded, placed, given a P3 public point, indexed and searched in six steps, with a 2.6 km buyer seeing 'about 3 km'. | scenario: €240 city bike on Sunday 7 March 2027 at 19:42; postcode centroid; H3 res 7 public point inside 3014; 312 saved searches.; source: ExifTool GPSLatitude and GPSLongitude tags. |  |\n| p44 | analysis | Nothing a buyer sees reveals more than the district: the precise centroid exists only in the restricted store, and a would-be visitor finds nothing more precise than a 5 km² cell. | scenario: Under the replayed model a would-be visitor finds nothing more precise than a 5 km² cell (H3 resolution 7). | `cause_effect`: Six steps. → What they guarantee. |\n| p44a | analysis | The model closes the location route and no other: the real 20:11 fake payment link of 7 March is a messaging and fraud risk, covered in messaging-and-leads. | scenario: At 20:11 on 7 March 2027 a 'buyer' sent Femke a fake payment link. | `contrast`: What the replayed model guarantees for the location. → A risk of the real evening that the location model does not address. |\n| p45 | example (list) | The Lyon apartment's three agency listings are parsed, geocoded to one building, placed, clustered into one property, shown at the coarsest agency choice and valued from the precise point. | scenario: Three-room 68 m² flat in Lyon 7e, May 2027, three agencies via two vendors and Keybridge; Agence Rhône Habitat P4, others P3; Valuo €372,000 to €401,000. | `contrast`: A private seller's postcode. → Professional feeds with full addresses. |\n| p46 | explanation | Agencies hide the street for privacy and for business, and the portal's job is to honour the choice consistently, including in the map, structured data and alert e-mail. |  | `elaboration`: The agencies' display choices. → Why they choose and what the portal owes them. |\n| p47 | example (list) | The Barcelona ring was detected through photo matches and price anomalies, and location is part of both signals. | scenario: July 2027: 26 accounts, 180 fake rentals in Eixample, about 35% below market; rent medians per H3 res 8 cell (0.737 km²); stolen photos from other districts. | `contrast`: Location serving search and privacy. → Location serving fraud detection. |\n| p48 | recommendation | After the incident Aisha Rahman's team adds two location signals for new accounts, far-from-history listings and bursts in one district, which work in combination. |  | `sequence`: Location in the detected signals. → Signals added afterwards. |\n| p49 | evidence | Ingrid's team publishes a small set of location quality metrics weekly per brand and country, and they show how differently the brands start, from Tradeyard NL's postcode centroids to Hearthly FR's rooftop points, with exposure held at zero. | table: Match-level mix, low-confidence rate, coordinate defects, place drift and precise-point exposure for Tradeyard NL and Hearthly FR, Q3 2027. | `sequence`: Three cases. → How the group measures all of them. |\n| p50 | explanation | Swapped coordinates are a perennial defect because GeoJSON and WKT order longitude first, and the check for them is trivial while the damage without it is not. | source: Elastic documentation on coordinate order.; example: A Lisbon listing with swapped coordinates lands in the Indian Ocean. | `emphasis`: The metrics table, labelled illustrative. → Its coordinate-defects row and why swapped coordinates keep recurring. |\n\n### Trade-offs\n\n**Controlling idea** (`comparison`, id `trade-offs`): Three choices recur, where to store location, which geo index serves which job and how to derive the public point, and each has a right answer that depends on the job.\n\n**Advances the thesis** (L2, L3): Compares the three representations with simpler options and the public-point methods by privacy risk.\n\n**Transition in:** `cause_effect`: The model at work in Veldmark's cases. → The choices behind it, compared.\n\n**Order of paragraphs** (`large_to_small`): The three choices and their verdicts first, with the tables as evidence; then the one row of the public-point table that is a common mistake. The warning before the comparison would single out a method the reader has not yet seen beside its alternatives.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p51 | comparison | Three choices recur in location design, where to store location, which geo index fits which job and how to derive the public point, and the tables give each a job-dependent answer: three representations for multi-country groups, engine-native types for queries and H3 for aggregation, and a public point coarsened in sparse areas. | table: Where to store location: single point, precise plus public, three representations, property-first.; table: Which geo index for which job: engine-native, tile aggregations, H3, S2 or geohash, place-ID filter, H3 plus address ID.; table: Public-point methods: label only, H3 snap, seeded offset, circle of uncertainty. |  |\n| p52 | analysis | A privacy circle centred on the real address gives the address away as its centre, so the circle must be centred on the public point. |  | `emphasis`: The public-point methods table. → Its last row, a classic mistake. |\n\n### Vertical Differences\n\n**Controlling idea** (`comparison`, id `verticals`): Location carries the most weight in real estate, is most often personal data in general classifieds, and sits in between in automotive.\n\n**Advances the thesis** (L1, L3): Shows how the same model is parameterized per vertical.\n\n**Transition in:** `contrast`: Trade-offs that apply to every vertical. → How the verticals differ.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p53 | comparison | Real estate is where location carries the most weight, general classifieds where it is most often personal data, and automotive sits in between. | table: Seven dimensions across general classifieds, real estate, automotive, and jobs and services. |  |\n\n### Failure Modes\n\n**Controlling idea** (`analysis`, id `failure-modes`): Nine recurring failures, from side-door leaks to imposing one country's address model, each have an architectural control.\n\n**Advances the thesis** (L3, L4, L5): Names what goes wrong when one of the chapter's rules is missing.\n\n**Transition in:** `sequence`: How verticals differ. → What goes wrong in any of them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p54 | analysis (list) | Nine failure modes, side-door leaks, distance trilateration, non-deterministic jitter, licence debt, name-based matching, stale place references, centroids treated as precise, exploding polygons and one country's model imposed on another, each have a control. |  |  |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `ca-view`): Nobody owns location end to end, so at group scale it needs one owner and four explicit decisions, with signals to watch and a limit to where the design is worth it.\n\n**Advances the thesis** (L6): Turns the model into the group decisions the thesis's so-what names.\n\n**Transition in:** `problem_solution`: Failure modes that cross teams. → Who should own location and what they decide.\n\n**Order of paragraphs** (`prerequisite_order`): The ownership gap first, because the decisions answer it; then the four decisions in dependency order (the gateway and gazetteer that the policy, providers and metrics run on); then long-term signals, which can change those decisions; then the boundary of applicability, which qualifies all of them. A decision before the gap would answer a problem not yet stated, and the policy before the gateway would put it in a service that does not yet exist.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p55 | claim | In most organizations nobody owns location end to end, so at group scale it needs one owner and four explicit decisions. |  |  |\n| p56 | recommendation | Decision 1 puts one gazetteer and geocoding gateway, Veldmark Place, under group platform engineering, because place IDs are the shared language across search, alerts, landing pages, analytics and fraud. | scenario: Approved at the architecture advice forum in May 2027; inside the Common Ground taxonomy and attribute platform under Yara Mendes; live for Tradeyard in October 2027, Hearthly and Motorvane in 2028. | `sequence`: Four decisions. → The first. |\n| p57 | recommendation | Decision 2 makes the precision policy group policy with brand parameters, with the restricted-store rule non-negotiable and Hearthly Spain's exact pins fixed in the first release. |  | `sequence`: The shared gateway and gazetteer. → The policy that runs inside it. |\n| p58 | recommendation | Decision 3 chooses providers per country and use behind the gateway and reviews the licence register at renewals and in every acquisition. | scenario: When Veldmark bought Casavista in 2025, nobody asked what its coordinates were licensed for. | `sequence`: The policy. → The providers. |\n| p59 | recommendation | Decision 4 publishes location quality weekly beside publication-time and duplicate-rate metrics, with precise-point exposure targeted at zero and treated as a privacy incident. |  | `sequence`: The providers. → How the whole is measured. |\n| p60 | context | Over the long term, open registers, shipping, regulators' interest and AI search agents will change what location means and what a leak costs. |  | `time`: Decisions for now. → Signals to watch over years. |\n| p61 | counterargument | The design is too much for a single-country marketplace of businesses at public addresses, but necessary as soon as private sellers appear. |  | `contrast`: Where the design is going. → Where it is not worth it. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Ten questions turn the chapter into a design review of a group's location handling.\n\n**Advances the thesis** (L2, L3, L4, L5, L6): Gives the reader the model as review questions.\n\n**Transition in:** `cause_effect`: The Chief Architect's decisions. → Questions a reader can take into a review.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p62 | recommendation (list) | Ten review questions test public exposure, distance computation, deterministic derivation, coordinate licences, place IDs, place meaning, internal reads, match levels, cross-border search and defect monitoring. |  |  |\n\n## Conclusion: From Place to Seller\n\n**Synthesis:** The failures this chapter met had two causes. The first runs through all five answers in Ingrid's table: each brand stored one location and let every reader take what it needed, which let a stranger reach the Rotterdam door and left coordinates nobody could say were licensed. The second explains the opening's 'apartments in Lyon' landing page that left out Villeurbanne: there were no place references to choose between. One model removes both: three representations under a group policy, one gazetteer and a licence on every coordinate answer all three failures.\n\n**So what:** The group fixes location once, as a shared service, instead of five brand fixes, and can then answer the regulator, the licensor and the cross-border buyer.\n\n**Callback:** The Rotterdam seller who found a stranger at her door, and the five answers to 'where is it?'. The reader can now say what the Rotterdam payload would carry under the model: a cell centre and a district, never a doorstep.\n\n**Takeaway** (`course_of_action`): Store three representations, compute everything public from the public point on the server, and record the licence with every coordinate.\n\n**Hand-off** to [Private Sellers, Dealers and Agencies: Modeling Who Lists](sellers-and-accounts.html): `additional_support`: The location chapter's precision choice that each agency makes in its account settings, and the four subdomains already modeled. → The last subdomain the listing references: the people and organizations that supply it, from a private seller to an agency network with franchisees.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p63 | synthesis | The chapter's failures had two causes, one location read by every consumer (the leak and the unlicensed coordinates, in all five answers) and no place references (the opening's Villeurbanne gap); one model removes both, so the Rotterdam payload would carry a cell centre and a district, never a doorstep, and the group fixes location once as a shared service that answers the regulator, the licensor and the cross-border buyer. |  |  |\n| p64 | transition | Location says where a listing is, not who sells it, and even the precision rule depends on the seller's type and an agency's account settings, so the last subdomain the listing references, who lists, comes next. |  | `additional_support`: The location model and the agencies' precision choices. → Who lists: the last referenced subdomain. |\n\n## Non-goals\n\n- Polygon, isochrone and map-clustering query design and map ranking. See [Searching by Place: Map, Polygon and Commute Search](map-search.html).\n- Parsing locations out of search queries. See [What Did They Mean? Query Understanding and Autocomplete](query-understanding.html).\n- The general enrichment pipeline and attribute provenance. See [From Raw Supply to Usable Listings: Normalization and Enrichment](normalization-and-enrichment.html).\n- Duplicate-detection algorithms beyond location as a blocking key. See [One Property, Three Listings: Duplicates and Entity Resolution](entity-resolution.html).\n- EXIF stripping and image processing. See [Photos Sell: Media Pipelines for Listings](media-pipeline.html).\n- Erasure across copies and read-model design in general. See [System of Record and Read Models: Listing Data Management](listing-data-management.html).\n- The regulatory catalogue (DSA, GDPR detail). See [Rules of the Marketplace: DSA, DAC7 and Vertical Regulation](marketplace-regulation.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Google's historically cited latitude-longitude caching window was not found on the policy page fetched in October 2026; the chapter cites only the current page. Re-check the service-specific terms before print. (Carried over from spec.md.)\n- Whether an enriched gazetteer built partly on OpenStreetMap is a 'derivative database' under the ODbL is left to legal review; the chapter says so rather than answering it. (Carried over from spec.md.)\n- Belgian, Polish, Portuguese and Spanish national address and cadastral registers were not verified in this session and are not named. (Carried over from spec.md.)\n- A minimum-address-count rule for sparse areas is recommended without a published benchmark; consider adding one if a source appears. (Carried over from spec.md.)\n\n## Decision log\n\n- **2026-11-13** — Round-4 blocking findings fixed under the author's delegation (fix-only pass). Spec faults: (1) p44 held two ideas and the fake-payment-link aside broke the case's close: split into p44 (the location guarantee, now ending on the 5 km² cell) and a new p44a (the model closes the location route only; the real 20:11 link is a messaging and fraud risk), no published fact cut. (2) The personal-data paragraph p22 interrupted the table and the derivation: architecture order is now p20, p21, p23, p22, a third order (the two earlier ones were both tried), with p22 opening as the reason for the restricted store (component 6) just listed; transitions of p21, p23 and p22 and the flow rationale rewritten. (3) The conclusion's 'one reason' then 'a different cause': synthesis and p63 now announce two causes and place the Villeurbanne page in the opening. Draft faults: p08 no longer points back to the callouts; Figure 2 moved after the list that numbers e now opens 'Not every risk Femke met that evening was a location one', in past tense as the real event, and the scammer clause is marked as the replayed model. Evidence 'what' updated. Rejected: Cutting the clause or moving it to messaging-and-leads (cuts a published Veldmark detail).\n- **2026-11-12** — Escalation (b), p22: the Productscape evidence is published and stays in place (rule 7, rule 8: both orders were tried). The paragraph now opens its second half with 'Reference models show how easily this classification goes wrong', names whose review notes they are, and p21 opens 'Back to the table's order' to return the reader to the table. p22 controlling idea reworded to match. Rejected: Moving the Productscape evidence to Sources or dropping it.\n- **2026-11-12** — Escalation (c), conclusion: the synthesis and p63 no longer call Villeurbanne the same fault as the leak and the licences. The leak and the unlicensed coordinates come from one stored location; the Villeurbanne gap had a different cause (no place references) that the same model's third representation fixes. Callback to the Rotterdam payload kept.\n- **2026-11-12** — Draft faults left after round 3, fixed in prose without reordering: Trade-offs lead now gives the public-point table its verdict (each method trades privacy against map quality; a snapped or seeded point, coarsened in sparse areas) and p52 names the table it reads; Vertical Differences opens by contrasting itself with the vertical-neutral trade-offs and ties property-first and the Lyon clustering to real estate (kept after Trade-offs: the declared contrast order is sound, and moving it would break the Trade-offs lead's link to the cases); Femke's walk-through is stated plainly as a replay before the steps; p08 says kinds and representations are different axes; 'Geo service' became 'the location components below'; 'radius of uncertainty' is glossed as the circle a map draws around the public point; Figure 2's caption numbers the component me and polygon search to short summaries with links to map-search to avoid re-teaching what that chapter owns.\n\n## Sources\n\n- **Internal**\n  - _journals/listing-systems-architecture/journal-spec.json — Intent outcome, acceptance criteria AC-1 to AC-3, thesis, role and the hand-off relationship of sellers-and-accounts.\n  - listing-aggregate, categories-and-taxonomies, media-pipeline, entity-resolution, map-search, fraud-prevention, multi-country-platforms — Neighbouring ownership.\n  - _research/brief-listing-data-ingestion.md Part 7; _research/brief-search-discovery.md Part 3; _research/brief-real-estate-portals.md C.8 and D; _research/brief-trust-safety-regulation.md 5.10; _research/productscape-digest.md 5.3-5.5 — Address parsing, geocoding licences, hierarchies, H3/S2, obfuscation; personal-data classification.\n  - _research/scenario-ledger.md — Veldmark names, dates and figures for the three cases and Veldmark Place.\n- **External**\n  - Google Geocoding policies (2026), Mapbox Geocoding, OSMF Nominatim policy, OSM copyright — Licensing constraints.\n  - Airbnb location guidance (2025) — The documented obfuscation example.\n  - Uber H3 (2018), H3 resolution table, S2 documentation, Elastic geo-shape docs — Geo indexing.\n  - Kadaster BAG, data.gouv.fr Base Adresse Nationale, OS Open UPRN — National registers.\n  - GDPR Art. 4(1) — Location data as personal data.\n\n## Changelog\n\n- **2026-11-13** — Fix-only pass on the round-4 blocking findings: architecture order p20, p21, p23, p22; p44 split (new p44a); conclusion synthesis reworded to two causes with the so-what; Figure 2 after the component list; glosses for Productscape and Femke; length raised to 8,500. (AI-mediated session)\n- **2026-11-12** — Resolved the round-3 escalation under the author's delegation: p44 setup, p22 framing, conclusion synthesis reworded, draft faults on the public-point table, Vertical Differences lead, replay tense, kinds vs representations and five unexplained terms; two cut author sentences restored; max_words 8,134 to 8,350.\n- **2026-11-12** — After draft-check round 3 (escalate): two close fixes without a further round ('Radius filters can use the public point too'; Vertical Differences lead sets itself against the trade-offs); remaining failures recorded in open_questions. Check report is therefore stale by these two sentences.\n- **2026-11-12** — After draft-check round 2: p22 and p21 swapped; Lyon steps 4 and 5 swapped; prose fixes for the trade-off tables' reading, the typed-address bridge, the coordinate-defects link, Femke named only in her own case and marked as a different seller, the replay timeline, the res-7 cell area, the metrics lead, and the closing callback (now the Villeurbanne page).\n- **2026-11-12** — After draft-check round 1: licences section moved before the architecture (spec fault); prose revised for missing section and paragraph transitions, unexplained Veldmark names, the quality-metrics table reading, the real-estate search-document exception, the Rotterdam radius example and the Lyon step order.\n- **2026-11-12** — Converted spec.md to spec.json (outcome spec, paragraph level); spec.md removed. Prose revised to match: roadmap added to p03, Trade-offs lead p51, synthesis paragraph p63 and a rewritten hand-off p64.\n- **2026-10-21** — Renamed failure patterns to match where-listing-systems-go-wrong. (AI-mediated session)\n- **2026-10-20** — Replaced 2 mermaid diagrams with generated illustrations; consistency fix to the scene heading ('Five Answers'); sharpening pass 6,540 to 6,550 prose words; cross-chapter consistency sweep. (AI-mediated session)\n- **2026-10-19** — Initial spec and article; editorial review pass (eight countries, Motorvane's markets, copy count tied to Femke's erasure case); 3 inline illustrations added. (AI-mediated session)\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
