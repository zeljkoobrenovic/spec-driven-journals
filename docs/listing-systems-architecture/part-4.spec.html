<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published page (posts/part-4-intro/index.md) and its former spec.md (accepted 2026-10-21), which it replaces; one spec paragraph per unit of the page, in the page's order. Intent outcome, AC-1 to AC-3 and role are copied unchanged from the post's entry in journal-spec.json; the introduction realises Part IV's opening (hook, bridge, roadmap) from the same file. The journal spec gives this post no thesis, so the thesis and its three supporting claims are written here from the part's thesis and flow. The five callouts (IN THIS PART, WHY THE BUSINESS CARES, WHY ARCHITECTS SHOULD CARE, KEY POINTS, FAILURE PATTERNS) stand before the first paragraph and are kept as the house format; the KEY POINTS callout carries the part's claim in three bullets. Units added to the published page to meet the contract: the roadmap paragraph (p03), the lead-in to the chapter table (p04) and a synthesis, callback and hand-off in a closing paragraph under 'Where to begin' (p07, grown from 'By the end of Part IV… Begin with [Search Architecture for Listings: Indices, Freshness and Scale](search-architecture.html)'), the shape the Part II and Part III introductions now share.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Part IV's argument: discovery is one pipeline with six surfaces, every surface is a read model of the listing stream that must honor removals faster than insertions, structure beats cleverness, and order is a policy with owners.\n- **Know:** The six chapters in reading order and the question each answers, and the Veldmark discovery decisions of 2027 they follow.\n- **Be able to:** Pick the Part IV chapter that answers the discovery problem in front of them.\n\n**Audience:** Chief and enterprise architects, principal engineers, and search, data and ML leads (the journal's readers) who have read Part III and are about to start Part IV, or who arrive with a discovery problem in hand and want the chapter that answers it.\n\n**Already knows:**\n\n- What an API, a database, an event stream, a search engine and Kubernetes are; how to make and defend an architecture decision; percentiles such as p95.\n- Part III's supply chain: listings published through a publication pipeline within a freshness target, removals propagated to every copy, and listings of the same thing grouped into entity clusters (part-3, publication-pipeline, entity-resolution).\n- Part II's categories, attributes and location model (part-2).\n- What a read model is: a copy of listing data built from the listing event stream and owned by its consumer, never the system of record (bounded-contexts, where-listing-systems-go-wrong).\n- The fifteen named failure patterns, among them Search as System of Record, Multiplier Creep and Ghost Inventory (where-listing-systems-go-wrong).\n- Veldmark in outline: a fictional group of four brands (Tradeyard, Motorvane, Hearthly, Keybridge), Ingrid Halvorsen its Group Chief Architect and Tomasz Wiśniewski its head of the group search platform (meet-veldmark).\n\n**Does not yet know:**\n\n- Relevance model, ranking policy, relevance floor and paid placements such as top listings (owned by ranking; the page names them and points to the chapter).\n- Compiling a query into categories and attribute filters, embeddings and language models as layers over it (owned by query-understanding).\n- Listing Search API v1, the group's search contract (owned by search-architecture).\n- The geo query compiler and draw-your-area search (owned by map-search).\n- The saved-search service and alert matching (owned by saved-searches-and-alerts).\n- The risk gate (owned by trust-and-safety-architecture, Part V).\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader of this page alone can name the six chapters' subjects in reading order. *Probe:* After reading only this page: what will each of the next six chapters tell you, in order? | `intro_predicts_content` | cold_reader | major |\n| AC-2 | Given a situation the chapter table lists, the reader names the chapter to open. *Probe:* Paid listings crowd your first results page and nobody can explain why a listing is third; separately, your alert digests advertise listings that are already sold. Using only this page, which chapter do you open for each? | `custom` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-4 | The reader can say which earlier parts discovery reads from and which later parts constrain or supply it. *Probe:* Using only this page: what does discovery take from earlier parts of the book, and which later parts constrain it or supply what it needs? | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** What does this part argue, and in what order should its chapters be read?\n\n> **Claim:** Part IV argues that discovery is one pipeline with six surfaces, not six products: search, query understanding, ranking, recommendations, the map and alerts read the same listing stream and taxonomy, each must say whether a listing is still available, who decided its position and whether it led to a contact, and each is judged on contacts; its six chapters are read in an order where each reuses what the one before established, starting with the search index every other surface queries and ending with alerts, which reuse all of them.\n\n**Disputed by:** The common practice of building search, recommendations, maps and alerts as separate products on separate copies of the data, each tuned to its own metric (clicks, sends, revenue per search), so the discovery chapters are independent topics a reader may consult in any order.\n\n**So what:** A reader who accepts it reads search-architecture first, or opens the one chapter that answers the discovery problem in front of them, and asks of every surface how fast it forgets a sold listing and who owns the order it shows.\n\n**How and why:** Query understanding compiles words into the structured query the search contract accepts; ranking orders what that retrieval returns; recommendations reuse ranking's machinery without a query; map search compiles places as query understanding compiles words; alerts store normalized queries and areas and run them in reverse over the same index. Veldmark's 2027 discovery decisions each turn one surface (five of the six) into a shared, owned component on that pipeline.\n\n**Supporting claims**\n\n- **PIV-1** — The six chapters take the surfaces in an order where each reuses what the one before established, and each is the chapter to open first for a recognizable symptom.\n- **PIV-2** — Discovery sits between the book's other parts: it reads Part II's categories, attributes and location model and Part III's publication pipeline and entity clusters, and Parts V, VI and VII constrain or supply it.\n- **PIV-3** — Veldmark starts 2027 with three search engines and a search brown-out and, over the year, decides one change for each surface except query understanding, in chapter order.\n\n## Role in the part\n\nPerforms the part's opening: states that discovery is one pipeline with six surfaces that read the same stream, forget sold listings quickly and are judged on contacts, gives the reading order of the six chapters and the Veldmark decisions they follow.\n\n## Flow\n\n**Pattern:** `large_to_small` (also `prerequisite_order` in p03 and the chapter table in p04: the six chapters in the order each reuses the one before)\n\nThe page opens on what makes listing discovery different (a high-write system judged by how fast listings appear and disappear), states the part's claim (one pipeline, six surfaces, three questions), then narrows to the six chapters in the order each reuses the one before, and to one row per chapter with the symptom that sends a reader there. It then widens once to place discovery in the book, shows Veldmark's 2027 decisions in chapter order, and ends with a short synthesis that answers the three questions for the whole pipeline and hands off to the first chapter. The order of the chapters is stated before the table because the rows only make sense once the reader knows that each surface builds on the last; the connection section follows the table because it says what the chapters read from Parts II and III and what later parts impose; the Veldmark section follows the connection because its decisions put the pipeline's shared components into practice, one per chapter; the conclusion comes last and holds no new material. Put Veldmark first and its policy, carousel and compiler arrive before the reader knows which surface each belongs to; put the connection first and it names inputs and constraints before the reader knows which chapters use them.\n\n## Introduction\n\n**Hook** (`direct_statement`): Listing discovery looks like web search but behaves like a high-write operational system: documents live for days, most queries contain no text, and it is judged by how fast a new listing appears and a sold one disappears.\n\n**Bridge:** Part III's supply: clean, deduplicated and searchable within a freshness target. → The other side of the market: the buyer who types three words, draws a shape on a map or saves a search and waits.\n\n**Thesis statement** (KEY POINTS callout; paragraph p02 (bold phrase)): Discovery is one pipeline with six surfaces, not six products: each reads the same stream and taxonomy and must answer three questions: is this listing still available, who decided its position, and did it lead to a contact.\n\n**Roadmap** (IN THIS PART callout; paragraph p03):\n\n- Six chapters, in the order each builds on the last, with the reason for each position: the search index and its contract first, then query understanding, ranking, recommendations, map search, and alerts last; a table says when to open each. *Kept in:* chapters.\n- The page then places the part in the book and follows Veldmark through it. *Kept in:* connects, veldmark.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Part IV turns from Part III's clean, searchable supply to the buyer's side of the market, where listing discovery looks like web search but behaves like a high-write operational system: documents live for days, most queries contain no text, and it is judged by how fast a new listing appears and a sold one disappears. | example: The buyer who types three words, draws a shape on a map or saves a search and waits; documents that live for days and queries without text. |  |\n| p02 | claim | The part's claim is that discovery is one pipeline with six surfaces, not six products: each reads the same stream and taxonomy and must answer three questions: is this listing still available, who decided its position, and did it lead to a contact. | figure: Figure 1: one listing stream branching into six discovery surfaces that converge on buyer contacts. | `problem_solution`: A system judged by how fast listings appear and disappear (named again as what every surface is judged on). → The part's answer: one pipeline with six surfaces and three questions each must answer. |\n| p03 | transition | The six chapters take the surfaces in the order each builds on the last: search first, because every other surface queries its index and contract; query understanding, which decides which listings a query can reach; ranking, which orders them; recommendations, which reuse ranking's machinery without a query; map search, which compiles places as query understanding compiles words; and alerts last, because they reuse every surface before them. The page then places the part in the book and follows Veldmark. |  | `sequence`: The six surfaces of the one pipeline. → The six chapters in reading order, the reason for that order, and what the rest of the page does. |\n\n## Sections\n\n### Chapters in this part\n\n**Controlling idea** (`description`, id `chapters`): Each of the six chapters answers one question and is the one to open first for a recognizable symptom.\n\n**Advances the thesis** (PIV-1): Lists the chapters in reading order with the question each answers and the symptom that sends a reader to it.\n\n**Transition in:** `elaboration`: The six chapters in order. → One row per chapter: its question and when to open it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p04 | description | Each row of the table gives a chapter's question and the symptom that should send a reader to that chapter first. | table: Six rows in reading order: search-architecture (choosing an engine, planning a reindex or sizing for the evening peak), query-understanding (high zero-result rates, or synonyms in scattered config files), ranking (paid listings crowd the first page, or nobody can explain position 3), recommendations (carousels show sold items, or new listings never appear in them), map-search (map traffic dominates, or polygon queries break the latency budget), saved-searches-and-alerts (alerts on a cron job, or digests advertising listings already gone). |  |\n\n### How this part connects\n\n**Controlling idea** (`context`, id `connects`): Discovery reads what Parts II and III built, and three later parts constrain or supply it.\n\n**Advances the thesis** (PIV-2): Says what discovery reads from earlier parts and what each later part imposes on or supplies to it.\n\n**Transition in:** `place`: The six chapters and the surfaces they design. → Where those surfaces sit in the book: the parts they read from and the parts that constrain or supply them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | context | Discovery reads the categories, attributes and location model from Part II and the publication pipeline and entity clusters from Part III; Part V puts its trust platform's risk gate (glossed as able to hold a risky listing back) in front of search and alerts, Part VI sells the paid placements ranking must blend and account for, and Part VII supplies the event backbone, experimentation and ML platform the chapters assume. |  |  |\n\n### The Veldmark thread\n\n**Controlling idea** (`example`, id `veldmark`): Veldmark starts 2027 with three search engines and a search brown-out caused by an index that could not be rebuilt beside the live one, and over the year decides five changes, one for each surface except query understanding, in chapter order.\n\n**Advances the thesis** (PIV-3): Shows the pipeline's shared components as dated Veldmark decisions, in chapter order.\n\n**Transition in:** `example`: The pipeline and the parts it reads from and depends on. → Veldmark's 2027 discovery changes, one surface each (none for query understanding on this page).\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | example (list) | Veldmark (fictional), whose brands run three search engines, shows the pipeline being built: a reindex writing into the live index browned out Tradeyard NL search on 17 January 2027, the cost of an index that cannot be rebuilt beside the live one, and over 2027 its Group Chief Architect, search platform team and brands decide one change for each surface except query understanding, listed in chapter order. | scenario: Three search engines; Sunday 17 January 2027 Tradeyard NL brown-out, about 9% of searches failed for 48 minutes. Decisions, in chapter order: shared search platform on OpenSearch (14 September 2027), every application moving to Listing Search API v1 first, Motorvane on Elasticsearch until a 2029 review (search-architecture); Ranking policy v1 (June 2027): at most four paid listings in the first 20 positions, top listings only above a relevance floor, live for Tradeyard NL and BE on 1 December 2027 (ranking); rebuilt Motorvane similar-vehicles carousel, new listings with no carousel impression 41% to 8% (recommendations); geo query compiler for Hearthly's draw-your-area search (map-search); group saved-search service targeting five minutes p95 from searchable to alert for 46 million saved searches (saved-searches-and-alerts). |  |\n\n## Conclusion: Where to begin\n\n**Synthesis:** Read together, the six chapters answer the three questions once for the whole pipeline rather than six times: the listing stream says whether a listing is still available, a policy with named owners decides its position, and contacts judge every change.\n\n**So what:** A fix made once in the shared pipeline reaches every surface.\n\n**Callback:** The three questions of p02 (is this listing still available, who decided its position, did it lead to a contact). The closing paragraph answers each question once for the whole pipeline and restates the part's test: for each surface, how fast it forgets a sold listing and who owns the order it shows.\n\n**Takeaway** (`course_of_action`): Begin with search-architecture and read the chapters in order, or open the chapter the table names for the discovery problem in front of you.\n\n**Hand-off** to [Search Architecture for Listings: Indices, Freshness and Scale](search-architecture.html): `elaboration`: The part introduction's first claim, that every discovery surface is a read model of the listing stream that must honor removals faster than insertions, and the 17 January 2027 brown-out it names. → The search index as the first and busiest of those read models: its document, topology, write and read paths, reindexing, capacity and the contract in front of the engine.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | synthesis | Read together, the six chapters answer the three questions once for the whole pipeline (the stream says whether a listing is available, a policy with named owners (the KEY POINTS callout's 'order is a policy with owners') decides its position, contacts judge every change), so a fix made once reaches every surface; a reader should end Part IV able to say, for each surface, how fast it forgets a sold listing and who owns the order it shows, and begins with search-architecture, the first and busiest read model. |  |  |\n\n## Non-goals\n\n- Engine comparisons, ranking methods or alert designs, and defining the terms the chapters own; the page names them and points to the chapter. See [Search Architecture for Listings: Indices, Freshness and Scale](search-architecture.html), [What Did They Mean? Query Understanding and Autocomplete](query-understanding.html), [Ranking for Two Sides: Relevance, Freshness and Paid Visibility](ranking.html), [Recommendations for Inventory That Disappears](recommendations.html), [Searching by Place: Map, Polygon and Commute Search](map-search.html), [Tell Me When It Appears: Saved Searches and Alerts](saved-searches-and-alerts.html).\n- External factual claims; the page cites no company facts and needs no sources. The Airbnb map-traffic figure is left to map-search. See [Searching by Place: Map, Polygon and Commute Search](map-search.html).\n- Veldmark's numbers beyond the brown-out and the headline of each decision; the rest stay in the chapters.\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-10-19** — Modeled on RECONCILED's part introductions with this book's callout set and a chapter table.\n- **2026-10-19** — Failure patterns: Search as System of Record, Multiplier Creep and Ghost Inventory, the three that recur across most of the part's chapters.\n- **2026-10-19** — The Airbnb map-traffic figure from map-search is left to that chapter to avoid an ext <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
