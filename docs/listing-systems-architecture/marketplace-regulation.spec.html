<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, acceptance criteria AC-1 to AC-3, the thesis and the role are copied unchanged from the marketplace-regulation entry in journal-spec.json; the conclusion realises Part V's closing (synthesis, so-what, callback, takeaway) from the same file, and the hand-off uses Part VI's transition_in. Units added or split by this conversion: introduction p03/p04 (split), roadmap p05, GDPR p38/p39 (split), one lead-in paragraph each for Trade-offs (p59) and Vertical Differences (p60), and two conclusion paragraphs.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The legal roles (hosting service, online platform, online marketplace, online intermediation service, reporting platform operator) and the features that trigger each; which rules reach a pure lead-generation site and which turn on contracts or payments concluded through the platform.\n- **Know:** The DSA as system requirements (demotion and payment holds as restrictions, trader traceability as a data lifecycle, statements of reasons against the Transparency Database schema, transparency reports from the event log); ranking, advertising, price-reduction and review disclosures; GDPR retention per data class; DAC7 and its pipeline from the payment ledger; property and vehicle rules; UK and US rules in brief.\n- **Know:** The obligation, the control and the evidence, and the five components that serve every law.\n- **Believe:** Every transaction feature is a regulatory decision and should be reviewed as one.\n- **Believe:** Compliance by design, with the evidence query written with the control, costs less than compliance by project.\n- **Be able to:** Map a regulation's articles to system requirements and owning components, and design a statement-of-reasons pipeline and a DAC7 pipeline.\n- **Be able to:** Specify the disclosures and regulated listing attributes a marketplace needs, and set retention per data class.\n- **Be able to:** Hold country differences as configuration over shared components and make every reported number reproducible.\n\n**Audience:** Chief and enterprise architects, trust-and-safety, data and payments leads, and regulatory or data-protection leads who must jointly turn legal obligations into systems; not lawyers.\n\n**Already knows:**\n\n- APIs, databases, event streams, search engines and Kubernetes (the book's baseline).\n- From earlier chapters: the listing aggregate and its price history, attribute schemas, listing ingestion, sellers and accounts with trader status, ranking and paid products, recommendations, the trust-and-safety decision service, decision record, policy registry, enforcement propagation and appeals, fraud prevention's risk scores, and identity-and-verification's claims, KYB and business registry.\n- Veldmark, its brands and cast (Ingrid Halvorsen, Lucía Ortega), Yardstick, Safe Deal, Femke's bike and the phishing incident, the Essen Golf, the Lyon apartment, and the failure-pattern names.\n\n**Does not yet know:**\n\n- The legal roles (hosting service, online platform, online intermediation service, online marketplace, reporting platform operator) and their triggers.\n- Statement of reasons, the DSA Transparency Database and its schema; obligation, control and evidence; compliance by design.\n- P2B, UCPD, CRD and Omnibus disclosure rules; DAC7 consideration and excluded sellers; EPBD, DPE and Pkw-EnVKV fields; UK and US rules.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given an irreproducible regulatory figure and a planned payments launch, the reader names what is needed and what changes. *Probe:* Your regulator asks you to reproduce last year's count of listing removals, and your brands' exporters give different numbers; separately, product wants to launch in-platform payments in two countries next quarter. Using only this chapter: what do you need, and what changes? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-4 | The chapter's last section performs Part V's closing: it shows how the decision record, risk scores, identity claims and the law's five components fit together, says why that matters for Part VI, and returns to the part introduction's test of who decided, under which policy version, where it propagated and how to prove it. *Probe:* Does the final section state something about Part V that no single chapter states, say why it matters for Part VI, and return to the question the part introduction ends on? | `custom` | rubric | minor |\n\n## Thesis\n\n**Question:** Which regulations shape marketplace architecture and how do they become system requirements?\n\n> **Claim:** The regulations that bind a listing marketplace are triggered by its features, not by the label 'classifieds': a pure lead-generation site falls under the DSA's moderation duties, ranking transparency and platform-to-business rules but outside DAC7 until payments to sellers pass through it, and largely outside the DSA's online-marketplace duties until consumers conclude contracts with traders through it, so every payment, checkout or shipping feature is a regulatory decision; and the many obligations ask for five components built once, an obligation register with an evidence query per control, a decision record and evidence store, one trader and business registry, disclosure surfaces generated from documented parameters, and reporting views that are saved, versioned queries over immutable events and the payment ledger, with country differences held as configuration and each data class kept only as long as the law requires.\n\n**Disputed by:** The common practice of treating regulation as legal review at the end of a project, met by a separate exporter, form or code path per law and per country when a deadline arrives, with transparency numbers assembled by hand each year and payments launched as a product decision only.\n\n**So what:** A Chief Architect who accepts this owns the map from obligation to control to evidence while counsel interprets the law, puts regulatory review at the moment a transaction feature is proposed, funds the five components as platform rather than compliance overhead, and measures compliance like reliability: the share of restricting decisions with a statement sent and submitted, the time from decision to submission, and reports that can be produced again from the log.\n\n**How and why:** Veldmark's first DSA transparency reports, due at the end of February 2027, drew on five statement-of-reasons exporters that counted differently: an edit rejected and then accepted counted once in one system and twice in another, Motorvane counted a paused dealer listing as a restriction in one quarter and not the next, and Hearthly Spain had no record of which decisions were automated, so no figure could be produced again. Tradeyard Safe Deal, 11.6 million transactions worth about €1.02 billion in 2026, brought Veldmark into DAC7, where about 21,000 of about 1.3 million paid sellers were reportable, which makes the pipeline a filter over the ledger; Motorvane and Hearthly, which only list and advertise, stay outside. Demotion and payment holds are restrictions that need statements of reasons, and energy-performance indicators are mandatory listing fields, so ranking, payments and schema teams build to the law as well.\n\n**Supporting claims**\n\n- **S1** — A marketplace's legal roles are triggered by its features: lead generation brings DSA moderation duties, ranking transparency and P2B rules, while DAC7, US INFORM and, largely, the DSA's online-marketplace duties turn on payments or contracts concluded through the platform, so every transaction feature is a regulatory decision.\n- **S2** — The DSA turns moderation into system requirements: demotion and payment holds are restrictions, one decision record generates the user's statement and the Transparency Database submission, trader traceability is a data lifecycle, and every reported number is a saved, versioned query over immutable events.\n- **S3** — Ranking, advertising, consumer and vertical rules ask for disclosure surfaces generated from documented parameters and for regulated listing fields validated at ingestion and owned by someone who tracks the law.\n- **S4** — Retention is set per data class, each with a legal basis, a trigger and a timer, and kept only as long as the law requires.\n- **S5** — DAC7 makes in-platform payments a tax-reporting obligation met by a pipeline that filters the payment ledger, asks sellers early and keeps the tax profile separate.\n- **S6** — The obligations ask for five components built once (obligation register, decision record and evidence store, trader and business registry, disclosure surfaces, reporting views), with country differences as configuration, owned, reviewed and measured by the Chief Architect like reliability.\n\n## Role in the part\n\nShows that the law asks for the records the earlier chapters build (the decision record, the trader record) plus three more components, and that payments move the legal perimeter, which carries Part V into Part VI. Supports P5-5 of part `part-5`.\n\n## Flow\n\n**Pattern:** `large_to_small` (also `order_of_importance` in dsa to beyond-eu: the law that most changes the architecture first (DSA), then the disclosure rules that reach lead generation, GDPR retention, DAC7 (the clearest perimeter shift), vertical listing fields followed at once by exposure by vertical across every rule, and rules outside the EU last; `grouping` in trade-offs, failure-modes, ca-view, questions: the book's standard judging sections)\n\nThe scene states the problem (an irreproducible report and an unmapped list of duties); the concepts give the roles and the obligation-control-evidence vocabulary every later section uses; the rules follow law by law, most consequential first, each ending in the component it asks for; the compliance section then assembles the five components the rules have named one by one, and the judging sections test that design. Putting the components before the laws would present five abstractions before the reader has seen the obligations that justify them; putting DAC7 before the role concepts would show a perimeter shift before the reader knows what a perimeter is; GDPR comes before DAC7 because it sets up the per-data-class retention model into which DAC7's seller data then fits as one class (the table names it; the DAC7 section explains it); after DAC7, the tax profile's separation and retention would be argued before the reader has the retention model. The vertical-differences comparison sits directly after Vertical Rules, not among the judging sections, because it recaps exposure by vertical across the laws just covered; placed after Trade-offs it read as a template section far from the rules it summarizes (draft check, two flow readers).\n\n## Introduction\n\n**Hook** (`direct_statement`): Until about 2020, regulation reached most classifieds architects as a legal review at the end of a project: a privacy notice, a cookie banner, a clause in the terms. That is no longer possible.\n\n**Bridge:** Architects who know regulation as a review at the end of a project, and the trader record and decision record Part V's earlier chapters built. → The DSA, DAC7, consumer and energy-performance law now specify records, aggregations, explanations and fields, so the question is which laws a marketplace's features trigger and what each asks the system to do.\n\n**Thesis statement** (KEY POINTS callout (three bullets) and paragraph p02.): A marketplace's features decide which laws apply, so every transaction feature is a regulatory decision; most obligations ask for the same few artifacts, built once as compliance-by-design components with evidence built in.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p05, which names the sections in order.):\n\n- Show Veldmark's five exporters and the report that could not be produced again. *Kept in:* scene.\n- Define the legal roles that features trigger and the obligation-control-evidence vocabulary. *Kept in:* concepts.\n- Turn the DSA into requirements, with the statement-of-reasons pipeline and reports. *Kept in:* dsa.\n- Cover ranking, advertising and consumer transparency, GDPR, DAC7, vertical rules and how exposure differs by vertical, and UK and US rules. *Kept in:* transparency, gdpr, dac7, vertical, verticals, beyond-eu.\n- Assemble the five components that serve every law. *Kept in:* compliance.\n- Close with trade-offs, failure modes, the Chief Architect's view and questions, and Part V's closing. *Kept in:* trade-offs, failure-modes, ca-view, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Regulation used to reach classifieds architects as a legal review at the end of a project, but the DSA, DAC7, consumer law and energy-performance law now specify decision records, aggregations, explanations and listing fields, so regulation is partly written in the vocabulary of systems design. | fact: The DSA, applicable to all platforms since 17 February 2024, specifies what a moderation decision record must contain, how quickly notices are handled and what is submitted to a Commission database; DAC7 specifies a quarterly per-seller aggregation of payments; consumer law what a results page must explain about ranking; energy-performance law fields on property listings. |  |\n| p02 | claim | The chapter maps the regulations that shape listing marketplaces into requirements, concentrating on the EU and treating the UK and US briefly, without being legal advice, and claims that the obligations ask for a small number of artifacts that compliance by design builds once. |  | `cause_effect`: Regulation written in the vocabulary of systems design. → The chapter's scope, its limits and its claim that compliance by design is cheaper than compliance by project. |\n| p03 | transition | Identity-and-verification built the trader record, the business registry, the evidence trail and the minimization rules partly because the law asks marketplaces to know their traders and explain their decisions, so this chapter takes up those laws, which ask for the decision record and the trader record and bind Part VI's payments, paid products and advertising. |  | `elaboration`: The claim that a few artifacts serve many obligations. → The previous chapter's trader record and Part V's decision record as those artifacts, and the laws that ask for them. |\n| p04 | context | This chapter states what the law asks of the records rather than rebuilding them or their machinery, which stays with neighboring chapters (moderation and enforcement, identity levels and the business registry, payment flows, ranking and advertising); Veldmark is the running example. |  | `contrast`: The records this chapter's laws ask for. → Which chapters own the machinery behind them, so this chapter states obligations rather than rebuilding it. |\n| p05 | transition | The chapter runs from Veldmark's irreproducible 2026 transparency report through the legal roles, the DSA, ranking and consumer transparency, GDPR, DAC7, vertical rules with exposure by vertical, and UK and US rules, to the five components that serve every law, then trade-offs, failure modes, the Chief Architect's view, questions and Part V's closing. |  | `sequence`: The scope and the neighbors. → The order of the sections. |\n\n## Sections\n\n### Setting the Scene at Veldmark: Five Exporters and One Report\n\n**Controlling idea** (`example`, id `scene`): Veldmark's first DSA transparency reports, compiled in February 2027 from five statement-of-reasons sources that counted differently, could not be produced again, and the group had no list of what else it was obliged to do.\n\n**Advances the thesis** (S2, S6): Shows the problem the chapter's components solve: decision counts that depend on the exporter, and obligations nobody has mapped.\n\n**Transition in:** `example`: The claim that many obligations ask for a few artifacts and that regulated numbers must be reproducible. → Veldmark's February 2027 transparency report as the case.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | example | In February 2027 Lucía Ortega had to deliver one DSA transparency report per online platform for the first full harmonized period, 1 January to 31 December 2026, by the end of February. | scenario: Lucía Ortega, Group DPO and regulatory lead; Commission Implementing Regulation (EU) 2024/2835: period 1 January–31 December 2026, due two months after; one report each for Tradeyard, Motorvane and Hearthly. |  |\n| p07 | example | The inputs came from five statement-of-reasons sources that counted the same decisions differently, so the numbers did not agree. | scenario: Yardstick's template for Tradeyard NL and BE, two vendor exports for PL and PT, Motorvane's hand-built tool, two Hearthly exporters; Tradeyard NL about 20,000 statements a week from listing removals; an edit rejected then accepted counted once in one system and twice in another; Motorvane's 'dealer listing paused for missing data' a restriction in one quarter and not the next; Hearthly Spain with no record of automation. | `cause_effect`: The deadline and the three reports. → Why the inputs disagreed. |\n| p08 | example | Ingrid Halvorsen's two questions, whether the number could be produced again next year and what else the group was obliged to do, received a 'no' and a list that became the obligation register behind the shared trust-and-safety platform. | scenario: Ingrid joined as Group Chief Architect that month; the list became the obligation register; the shared T&S platform went live for Tradeyard NL and BE in November 2027 and was designed against it. | `cause_effect`: The disagreeing numbers. → The two questions they raised and what came of the answers. |\n\n### Concepts: Who Is the Marketplace in Law?\n\n**Controlling idea** (`definition`, id `concepts`): EU law regulates roles defined by what a service does, so a marketplace's features decide its obligations, and three terms (obligation, control, evidence) turn those obligations into architecture.\n\n**Advances the thesis** (S1, S6): Establishes that features trigger roles and that an obligation is met by a control proven by evidence.\n\n**Transition in:** `problem_solution`: Ingrid's question about what else the group was obliged to do. → The answer begins with which legal roles Veldmark holds.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | definition | EU digital regulation regulates roles defined by what a service does, and one marketplace can hold several roles at once, each with its own obligations. | table: Eight roles (hosting service, online platform, platform allowing distance contracts with traders, very large online platform, online intermediation service, online marketplace, reporting platform operator, controller), each with its source, trigger and Veldmark example; Tradeyard is a reporting platform operator for Safe Deal transactions only; no classifieds marketplace was designated a VLOP as of October 2026. |  |\n| p10 | evidence | The role table rests on the Official Journal texts of the DSA, P2B Regulation, Omnibus Directive and DAC7, and the Commission's list of designated very large online platforms updated 15 October 2026. | source: Links to Regulation (EU) 2022/2065, 2019/1150, Directive (EU) 2019/2161, Council Directive (EU) 2021/514, and the Commission's VLOP list. | `additional_support`: The role table. → Its sources. |\n| p11 | analysis | Some definitions explicitly cover lead generation while others turn on a contract concluded through the platform, which is the chapter's most important architectural fact. | quotation: P2B and the UCPD ranking rule apply 'irrespective of where those transactions are ultimately concluded'; DSA trader traceability, CRD marketplace duties and DAC7 turn on a contract or payment through the platform; DAC7 excludes software that 'exclusively' allows users 'to list or advertise'. | `elaboration`: The roles in the table. → The split between lead-generation and contract-based definitions. |\n| p12 | recommendation | The author's working rule is to assume the contract-based rules apply to every trader listing and to treat every transaction feature as a perimeter change reviewed before launch. | figure: Figure 1: a marketplace moves across the perimeter into trader traceability, marketplace duties and DAC7 when it adds payment, checkout or shipping.; example: Safe Deal, shipping labels, deposits, rental applications with payment and online car reservation as perimeter changes. | `cause_effect`: The uncertainty over whether a contact button 'allows' distance contracts. → A working rule that is cheap if wrong. |\n| p13 | explanation | Small-company exemptions in the DSA and the P2B Regulation do not help a group, because linked-enterprise rules make an acquired small marketplace part of the group. | fact: DSA Arts. 19 and 29 exempt micro and small enterprises; P2B Art. 11(5) exempts small enterprises from complaint handling; both refer to Recommendation 2003/361/EC with its linked-enterprise rules. | `contrast`: Roles that apply by feature. → The exemptions a group might hope would switch them off. |\n| p14 | definition (list) | Three terms make regulation tractable: an obligation is a duty in a legal source, a control is the system behavior that meets it, and evidence is the data that proves the control worked. | example: DSA Art. 17(1) as an obligation; the decision service emitting a statement-of-reasons event as the control; restriction count equals statements plus documented exceptions as the evidence query. | `sequence`: Which rules apply to which features. → The vocabulary for meeting them. |\n| p15 | comparison | Compliance by design builds controls into components with the evidence query written alongside, while compliance by project builds an exporter per obligation; the first costs more for the first law and less for every later one. |  | `elaboration`: Obligation, control and evidence. → The two ways of building them. |\n\n### The Digital Services Act as a Set of System Requirements\n\n**Controlling idea** (`explanation`, id `dsa`): The DSA regulates the moderation process itself, so each of its articles becomes a requirement on a named component, and one decision record must generate the user's statement, the database submission and reproducible reports.\n\n**Advances the thesis** (S2): Maps DSA articles to components and shows the statement-of-reasons pipeline and event-log reports that serve them.\n\n**Transition in:** `elaboration`: The online-platform and trader-contract roles named in the role table. → The DSA articles those roles bring, as system requirements.\n\n**Order of paragraphs** (`large_to_small`): From the whole DSA as a table of requirements, to the three surprising entries, to the statement-of-reasons interface and pipeline, to one decision, then to the reports that aggregate decisions; the reports come last because they count what the pipeline records.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p16 | evidence | The DSA most changes listing-system architecture because it regulates the moderation process, and its articles for a non-designated platform with trader listings map to owning components. | table: Articles 14, 15 and 24(1), 16, 17, 20 and 21, 22, 23, 24(2), 24(5), 25, 26, 27, 30, 31, 32, each with obligation, system requirement and owning component. |  |\n| p17 | transition | Three entries in the table catch ranking, payments and seller-data teams by surprise. |  | `emphasis`: The article table. → The three entries that reach teams outside trust and safety. |\n| p18 | explanation | Demotion is a restriction that needs a statement of reasons, so a ranking feature that quietly pushes suspected scams down is a moderation decision. | fact: Art. 17 lists 'demoting content'; the Transparency Database has DECISION_VISIBILITY_CONTENT_DEMOTED. | `example`: The three surprising entries. → The first: demotion. |\n| p19 | explanation | Payment holds are restrictions too, so a Safe Deal payout held by fraud rules needs a statement of reasons unless another regime applies. | quotation: 'Suspension, termination or other restriction of monetary payments' is in the same list. | `similarity`: Demotion as a restriction. → Payout holds as another. |\n| p20 | explanation | Trader traceability is a data lifecycle, because Article 30 requires deletion six months after the trader relationship ends. | quotation: Store trader information 'for a period of six months after the end of the contractual relationship' and then delete it. | `additional_support`: Two restrictions that surprise teams. → The third surprise, for seller-data teams. |\n| p21 | description | The Transparency Database is a concrete interface with fixed batches, required fields, a fixed vocabulary and a ban on personal data. | fact: Batches of up to 100 that fail as a whole; required fields including ground, content type, category, dates, facts, source, automation, territorial scope and a puid of up to 500 characters; restriction, ground, source and automation values; 16 categories; no personal data (Art. 24(5)). | `elaboration`: Statements of reasons as the output of every restriction. → The database they are submitted to. |\n| p22 | evidence | The database operates at scale, holding about 4.4 billion statements from 375 platforms in the 180 days to 19 October 2026, 41% fully automated, and its schema is in effect a regulator-defined moderation event model worth adopting internally. | statistic: About 4.4 billion statements from 375 platforms, 41% fully automated (accessed 19 October 2026).; reasoning: INFERENCE callout: a decision record that cannot be mapped field by field needs a lossy translation layer; adopt the regulatory vocabulary and extend it. | `additional_support`: The database's interface. → Its scale and what follows for the internal record. |\n| p23 | example | Veldmark's decision record maps field by field to the statement, with the decision ID as the idempotency key and personal data stripped from the facts. | table: Nine mappings: decision_id to puid; action to the four decision fields; policy to ground; reason_facts to decision_facts with PII stripping; source; automation; territorial scope; seller_type to account_type; dates. | `example`: Adopting the regulatory vocabulary. → Veldmark's mapping. |\n| p24 | process | The pipeline that replaced the five exporters has four stages and one rule: the user's statement and the database submission are two views of one decision from the same record. | figure: Figure 2: the user receives the full statement with redress; the database receives a PII-free version, batched and keyed by decision ID. | `elaboration`: The field mapping. → The pipeline built on it. |\n| p25 | explanation (list) | Throughput is not the hard part (about 61,000 restricting decisions a week, about 610 API calls), while atomic batch failure, personal data in free text and documented exceptions are. | statistic: About 61,000 restricting decisions a week in 2027, Tradeyard NL's roughly 20,000 weekly removals the largest source; about 610 calls a week at 100 per batch.; fact: Art. 17(2) exceptions: no electronic contact details, or 'deceptive high-volume commercial content'. | `contrast`: The pipeline's stages. → Where its difficulty actually lies. |\n| p26 | example | The suspension of the account that phished Femke on 7 March 2027, replayed as it would have run on the November 2027 pipeline, shows both views: the decision record's fields, the Dutch statement to the user, the database values without personal data, and the evidence kept in the evidence store. | scenario: 20:26 Sunday 7 March 2027; suspend_account; POL-FRAUD-PAYLINK version 2; user report; partly automated; NL; database values DECISION_ACCOUNT_SUSPENDED, DECISION_GROUND_INCOMPATIBLE_CONTENT, STATEMENT_CATEGORY_SCAMS_AND_FRAUD, SOURCE_TYPE_OTHER_NOTIFICATION, AUTOMATED_DECISION_PARTIALLY; facts without domain, user name or phone. | `example`: The hard parts of the pipeline. → One decision traced through it. |\n| p27 | description | The implementing regulation fixes calendar-year reporting, publication within two months and five years' availability, and its templates ask for counts, times and accuracy indicators. | fact: Arts. 2 and 3 of Implementing Regulation (EU) 2024/2835; templates ask for notices by category and trusted flagger, actions by basis, median times, complaints, reversals and automated-tool accuracy. | `sequence`: Statements per decision. → Reports over all decisions. |\n| p28 | recommendation | Every number in a regulatory report should be a saved query over immutable events, versioned with the report, which made Veldmark's 2027 report the first that could be produced again. | scenario: Report for 2027 published February 2028, each template cell generated by a named query over decision, notice, complaint and enforcement events with policy and model versions; the shared platform wrote events directly from November 2027, and earlier months and brands not yet on the platform were loaded from their own logs in the same event shape before any number was computed (ledger ruling, 2026-11-13).; figure: Figure 3: five exporters versus one event log feeding a saved query that gives the same report every time. | `problem_solution`: What the templates ask for. → How to make those numbers reproducible. |\n\n### Ranking, Advertising and Consumer Transparency\n\n**Controlling idea** (`explanation`, id `transparency`): Four overlapping sources on ranking, advertising and seller status ask for three disclosure surfaces, while P2B process rules and two Omnibus rules reach professional tooling, price badges and reviews.\n\n**Advances the thesis** (S3, S1): Turns ranking, ad and consumer rules into generated disclosure surfaces and data requirements, several of which apply to lead generation too.\n\n**Transition in:** `additional_support`: DSA Arts. 26 and 27 on ad labels and recommender parameters in the article table. → The other sources that regulate ordering and labeling.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p29 | claim | Four overlapping sources (five rules, because the UCPD contributes two) regulate how a marketplace orders and labels what users see, and read together they ask for three disclosure surfaces; the section then covers further P2B rules for seller tooling and Omnibus rules for price badges and reviews. | table: P2B Art. 5; UCPD Art. 7(4a); UCPD Annex I point 11a; DSA Arts. 26 and 27; CRD Art. 6a, with what each requires and whom it protects. |  |\n| p30 | evidence | The disclosure table rests on the Official Journal texts of the P2B Regulation, the Omnibus Directive and the DSA. | source: Links to Regulation (EU) 2019/1150, Directive (EU) 2019/2161 and Regulation (EU) 2022/2065. | `additional_support`: The disclosure table. → Its sources. |\n| p31 | description (list) | The three surfaces are a ranking explanation per search surface, labels on every paid placement, and seller status on every listing, each generated from data another chapter owns. | example: Veldmark labels every paid boost, including a private seller's €4.99 bump, because an undisclosed paid boost is blacklisted either way; one trader-status field drives the DSA Art. 30(7) panel and the CRD Art. 6a notice. | `elaboration`: Three disclosure surfaces. → What each one is. |\n| p32 | explanation | The P2B Regulation adds notice periods for business users, so terminating a dealer is a workflow with a timer, and its proposed repeal does not remove the need for the capability. | fact: Terms changes notified at least 15 days ahead; whole-service termination with reasons at least 30 days ahead (Arts. 3 and 4); repeal proposed November 2025, ranking guidelines to remain (European Commission, updated 2 July 2026). | `elaboration`: The P2B Regulation's ranking rule (Art. 5) in the disclosure table. → Its other duties toward business users: notice periods for terms changes and terminations. |\n| p33 | transition | Two Omnibus rules reach listing features that rarely get legal review. |  | `additional_support`: P2B rules for professional tooling. → Two consumer rules on price badges and reviews. |\n| p34 | example | A 'price reduced' badge must show the lowest price of the previous 30 days, so the listing must keep its full price history. | fact: Price Indication Directive as amended by Directive (EU) 2019/2161, Art. 2: the prior price is the lowest in at least 30 days.; scenario: The Essen Golf cut from €21,900 to €21,400 on Thursday 22 April 2027; the badge needs the lowest price in 30 days, not the previous price. | `example`: Two Omnibus rules. → The first, on price reductions. |\n| p35 | example | Reviews must be checked as coming from real buyers, so Veldmark ties Tradeyard ratings to a completed Safe Deal or confirmed handover and logs the check as evidence. | fact: The UCPD blacklists claiming reviews are genuine without 'reasonable and proportionate steps' and commissioning fake reviews.; case: FINN publishes buyer and seller ratings at the same time, or after three weeks. | `sequence`: Price-reduction badges. → The second rule, on reviews. |\n\n### GDPR: Retention, Minimization and Address Privacy\n\n**Controlling idea** (`explanation`, id `gdpr`): GDPR's minimization, storage limitation and accountability principles make retention a per-data-class design with legal basis, trigger and timer, and raise two issues specific to marketplaces.\n\n**Advances the thesis** (S4): Gives each data class its own retention driven by the law that governs it.\n\n**Transition in:** `contrast`: Rules about what must be shown to users. → Rules about what may be kept and for how long.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p36 | definition | Three GDPR principles produce the most architecture for listing systems: data minimization, storage limitation and accountability. | quotation: Personal data 'limited to what is necessary'; the duty to demonstrate compliance. |  |\n| p37 | recommendation | Retention per data class works because other laws require keeping data the GDPR would delete and fraud prevention wants it longer, so each class gets a legal basis, a trigger and a timer enforced by logged deletion jobs. | table: Five classes: DSA trader data (six months after the relationship, then delete); moderation evidence (at least six months, default 12 at Veldmark); hashed block-list identifiers (two years); DAC7 seller data (national periods); messages (per brand policy).; fact: Recital 47 recognizes processing 'strictly necessary for the purposes of preventing fraud' as a legitimate interest. | `cause_effect`: Minimization, storage limitation and accountability. → The design that satisfies them alongside other laws. |\n| p38 | explanation | Address privacy is specific to marketplaces: private sellers' exact addresses should be hidden by default, while the DSA requires a trader's address to be shown. | fact: DSA Art. 30(7) requires the trader's address; INFORM has a home-address exception for some sellers; the author found no equivalent in Art. 30. | `elaboration`: Retention as the general design. → The first of two marketplace-specific GDPR issues. |\n| p39 | explanation | An automated account suspension can fall under GDPR Art. 22, and the DSA's appeal process should be designed as the same mechanism that provides its safeguards. | quotation: A decision that 'similarly significantly affects' a person requires safeguards including human intervention and the right to contest. | `additional_support`: Address privacy. → The second issue, automated decisions. |\n\n### DAC7: When Payments Turn a Marketplace into a Tax Reporter\n\n**Controlling idea** (`explanation`, id `dac7`): DAC7 makes a platform that knows the consideration it pays sellers a reporting platform operator, so in-platform payments bring a quarterly per-seller tax pipeline that is mostly a filter over the payment ledger.\n\n**Advances the thesis** (S5, S1): Shows the clearest perimeter shift and the pipeline that serves it.\n\n**Transition in:** `elaboration`: The reporting-platform-operator role in the role table and the DAC7 class the retention paragraph announced. → What DAC7 requires and how Veldmark meets it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p40 | definition (list) | DAC7 requires a reporting platform operator to collect, verify and report seller information each year, under definitions of relevant activities, consideration, excluded sellers, reported fields and deadlines. | fact: Relevant activities; consideration net of platform fees 'known or reasonably knowable'; excluded seller: fewer than 30 sales of goods and not more than €2,000; identity and per-quarter consideration, activity count and fees; due diligence by 31 December, report by 31 January; first period 2023. |  |\n| p41 | analysis | DAC7's platform definition excludes software that only lists or advertises, so a classifieds site that only lists is outside and one that collects the price and pays the seller is inside. | quotation: Not software that, 'without any further intervention in carrying out a Relevant Activity', exclusively processes payments, lets users list or advertise, or redirects users. | `emphasis`: The DAC7 definitions. → The exclusion that matters most for classifieds. |\n| p42 | example | Safe Deal brought Veldmark into DAC7 through Tradeyard B.V., which reports to the Dutch tax administration for NL, BE and PL sellers, while Motorvane and Hearthly stay outside. | scenario: Tradeyard B.V. contracts Safe Deal for all three countries; Motorvane and Hearthly only list and advertise; Hearthly's tenant application files do not collect or pay rent. | `example`: The rule that payments bring a platform inside. → Veldmark's case. |\n| p43 | evidence | DAC7 is mostly a filtering problem: of about 1.3 million sellers paid through Safe Deal in 2026, about 21,000 were reportable. | statistic: 11.6 million transactions, about €1.02 billion GMV in 2026; about 1.3 million distinct sellers; about 21,000 with 30 or more sales or above €2,000; about 17,500 with complete, validated TIN and date of birth by 30 November; two reminder cycles plus payout holds. | `cause_effect`: Being in scope. → The size of the problem. |\n| p44 | example | Because the buyer protection fee is charged to the buyer, Femke's €225 bike sale is her full consideration and, as one sale, leaves her an excluded seller. | scenario: Sold for €225 on Monday 8 March 2027; buyer paid the €11.95 fee on top; 30 sales in 2027 would make her reportable and require her TIN before 31 December. | `example`: The excluded-seller test across 1.3 million sellers. → One seller through the test. |\n| p45 | recommendation | Building the pipeline taught three lessons: aggregate from the ledger, ask sellers early, and keep the tax profile separate from general identity claims. | figure: Figure 4 (placed just before this paragraph): payment ledger, identity claims, a separate tax profile, the report to the tax authority and the same data to each seller.; fact: Early flag at 20 sales or €1,500. | `cause_effect`: The population and the edge case. → What the pipeline was built to do. |\n\n### Vertical Rules: Property and Vehicles\n\n**Controlling idea** (`explanation`, id `vertical`): Vertical rules govern the listing rather than the marketplace and arrive as mandatory structured fields, so regulated attributes need validation at ingestion and an owner who tracks the law.\n\n**Advances the thesis** (S3): Shows regulated listing attributes as schema and ingestion requirements.\n\n**Transition in:** `contrast`: Horizontal rules that govern the marketplace. → Vertical rules that govern the listing.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p47 | claim | Horizontal rules govern the marketplace, while vertical rules govern the listing and arrive as fields. |  |  |\n| p48 | evidence | The recast EPBD requires energy class and indicator in property advertisements including portals, which removes any argument that the duty is only the advertiser's. | quotation: Indicator and class 'stated in online and offline advertisements, including in property search portal websites'; transposition by 29 May 2026. | `example`: Rules that arrive as fields. → The EU property case. |\n| p49 | evidence | French law adds the climate class, an F/G warning, an estimated annual energy cost with its reference year, fines and rental bans, and recalculations can change a home's class. | fact: Fines €3,000, or €15,000 for a company; G-rated homes not newly let since 1 January 2025, F from 2028, E from 2034; calculation changes from 1 January 2026. | `elaboration`: The EU duty. → What one country adds. |\n| p50 | example (list) | The Lyon apartment's incomplete feeds led Hearthly to four ingestion rules: mandatory DPE fields, blocking with feedback, effective-dated values, and class constraining category. | scenario: 68 m² T3 in Lyon 7e, €389,000, DPE class D, May 2027, two vendors and Keybridge; one feed lacked the climate class, none carried the annual cost; about 3.8% of Hearthly France's feed listings failed the check in May 2027. | `example`: The French requirements. → What they meant for one listing. |\n| p51 | recommendation | Regulated attributes need an owner who tracks the law, because the schema changes on the regulator's timetable. |  | `cause_effect`: The four ingestion rules. → Who must keep them current. |\n| p52 | explanation | Vehicle rules are more fragmented and mostly bind dealers, but Germany's Pkw-EnVKV makes consumption and CO2 fields mandatory for new cars in Motorvane's dealer feed. | fact: Pkw-EnVKV § 5, transposing Directive 1999/94/EC, as amended 2 March 2026: energy consumption, CO2 emissions and CO2 class for new passenger cars in promotional material.; scenario: The Essen Golf, a 2021 car with 48,000 km, is used and outside the rule. | `contrast`: Property rules that name portals. → Vehicle rules that mostly bind dealers. |\n\n### Vertical Differences in Legal Exposure\n\n**Controlling idea** (`comparison`, id `verticals`): General classifieds, real estate and automotive face the same horizontal laws with different weight, differ most in their listing rules, and fall under DAC7 only when they handle payments.\n\n**Advances the thesis** (S1, S3): Shows how the roles and regulated fields differ by vertical.\n\n**Transition in:** `elaboration`: The listing fields of Vertical Rules, the section just above. → Across every rule in the chapter, how exposure differs by vertical.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p60 | comparison | Across every rule in the chapter, not only the listing fields just described, the three verticals share the horizontal laws with different weight; they differ most in listing rules and enter DAC7 only when the platform handles payments (two plain sentences). | table: Horizontal exposure, vertical listing rules and DAC7 per vertical. |  |\n\n### Beyond the EU: UK and US Rules in Brief\n\n**Controlling idea** (`comparison`, id `beyond-eu`): UK and US rules differ in structure from the EU's but reward the same components, and INFORM repeats DAC7's payment trigger.\n\n**Advances the thesis** (S1, S6): Shows the components are not EU-specific and that payments move the perimeter in the US too.\n\n**Transition in:** `place`: EU vertical and horizontal rules, ending with exposure by vertical. → Rules outside the EU, for groups with brands there.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p53 | comparison | UK and US rules differ from the EU's in structure but reward the same components, which matters to groups that, unlike Veldmark, operate there. | table: UK OSA illegal-content duties (fraud a priority offence; risk assessments due 16 March 2025, measures from 17 March 2025); OSA fraudulent-advertising duties (codes consulted July–October 2026, final statement expected by mid-2027); DMCC Act reviews from 6 April 2025, fines up to 10%; INFORM thresholds 200 sales and $5,000, disclosure above $20,000; 24 CFR § 100.75. |  |\n| p54 | evidence | The UK and US table rests on legislation.gov.uk, Ofcom, Which?, the FTC and the Cornell Legal Information Institute. | source: Six linked sources with dates. | `additional_support`: The UK and US table. → Its sources. |\n| p55 | analysis | Because only marketplace-processed sales count toward INFORM's threshold (stated first), INFORM repeats the DAC7 pattern and launching in-platform payments is a regulatory decision outside the EU as well: a US lead-generation classifieds site is largely outside its seller-verification and disclosure duties, and payments bring it in. | fact: Under INFORM only sales made through the marketplace with payment processed by it count toward the high-volume seller threshold. | `emphasis`: The INFORM row. → Its parallel with DAC7's payment trigger. |\n\n### Compliance as Architecture\n\n**Controlling idea** (`synthesis`, id `compliance`): The chapter's many obligations ask for five components built once, with country differences held as configuration that counsel changes through review.\n\n**Advances the thesis** (S6): Assembles the components that serve every law and the rule for national variation.\n\n**Transition in:** `conclusion_summary`: The obligations of every law in the chapter. → The five systems they ask for.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p56 | synthesis | The obligations form a long list but ask for only five systems: an obligation register, a decision record and evidence store, a trader and business registry, disclosure surfaces and regulatory reporting views. | table: Each component with the laws it serves and its key property (machine-readable register; immutable evidence; one record, many views; generated disclosures; saved, versioned queries).; figure: Figure 5: each obligation points to a control in a shared component and to an evidence query; country differences enter as configuration. |  |\n| p57 | cause_effect | National differences tempt a code path per country, which is The Copy-Paste Country and multiplies every change by eight. | fact: Illegal content, consumer-law transposition, DAC7 formats and energy-label rules differ by country. | `contrast`: Shared components. → National variation that threatens to split them. |\n| p58 | recommendation | Veldmark holds  --- |\n| p61 | explanation (list) | Seven failure modes recur: exporters instead of records, silent demotion, unlabeled boosts, payments launched without the tax view, trader data kept forever, law in code, and personal data in the public database. | example: The February 2027 Veldmark situation; Multiplier Creep; DAC7 learned of in November; DSA Art. 30(5) breach; free-text notes in decision_facts. |  |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `ca-view`): The Chief Architect owns the map from obligations to components and evidence, puts regulatory review at the moment a feature is designed, funds the components as platform, watches the regulatory pipeline, and measures compliance like reliability.\n\n**Advances the thesis** (S6, S1): Turns the design into the architect's responsibilities and measures.\n\n**Transition in:** `problem_solution`: The failure modes. → What the Chief Architect does to prevent them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p62 | recommendation | The Chief Architect owns the map from obligations to components and evidence, not the law, and the obligation register has a legal owner and an architecture owner. | scenario: Lucía Ortega owns the legal content, Ingrid's architecture team the control and evidence columns. |  |\n| p63 | recommendation | Regulatory review belongs before design is final at the predictable moments that change the legal perimeter. | scenario: New transaction feature, paid ranking product, cross-brand data sharing, acquisition, new country; Safe Deal's Polish launch in 2026 would have been cheaper with the DAC7 tax profile designed in. | `sequence`: Owning the map. → When to review it. |\n| p64 | recommendation | The shared components should be funded as platform rather than compliance overhead, because trust and safety, seller tooling, ranking and finance need them too. |  | `sequence`: Reviewing at the right moment. → How to fund what the review asks for. |\n| p65 | recommendation | Proposals in the regulatory pipeline, as of October 2026, change the components' configuration rather than the components, which is the test of the architecture. | fact: Proposed P2B repeal; a Digital Fairness Act in preparation after the 2024 fitness check; EU Digital Identity Wallets due by the end of 2026. | `sequence`: Funding the components. → Testing them against coming law. |\n| p66 | recommendation | Compliance should be measured like reliability, with per-brand monthly metrics whose fall is an incident. | example: Share of restricting decisions with a statement sent and submitted; median time to submission; complete trader data; regulated listings with all fields; obligations with a passing evidence query. | `sequence`: Testing against coming law. → Measuring the present. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Ten questions let an architect test a marketplace against the chapter: features and laws in scope, decisions and statements, reproducibility, personal data, trader deletion, disclosures, DAC7 timing, regulated fields, country code and the register.\n\n**Advances the thesis** (S1, S6): Gives the reader a working audit drawn from every section.\n\n**Transition in:** `cause_effect`: The Chief Architect's responsibilities. → Questions that test whether they are met.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p67 | recommendation (list) | Ten questions test whether a marketplace's features, decisions, reports, data, disclosures, payments, fields and country rules meet the chapter's requirements. |  |  |\n\n## Conclusion: From Trust to Money\n\n**Synthesis:** Part V's four chapters produce and read the same few records: the decision record that trust-and-safety-architecture makes the single output of moderation, the risk scores and actor clusters that fraud prevention feeds into it, the identity claims and trader record that identity-and-verification keeps, and the five components through which the law asks for exactly these records as evidence. Trust is one platform because its records are shared, not because its people are.\n\n**So what:** Every revenue line in Part VI steps onto this platform: messaging is where scams close and where identity levels gate contact, in-platform payments move the marketplace into DAC7 and trader traceability, and paid placements need the labels and ranking disclosures regulation specifies; a group that built trust as four stacks pays for each of those again.\n\n**Callback:** The Part V introduction's closing test (for any enforcement decision, who made it, under which policy version, where it propagated and how you would prove all three a year later) and Ingrid's question in this chapter's scene whether the report could be produced again. The reader can now answer the test for Femke's suspension from records Part V built (the decision record with POL-FRAUD-PAYLINK version 2 and the analyst, the enforcement event acknowledged by each consumer, the statement keyed by decision ID and the saved query), and sees Lucía's 'no' become 'yes' because the records are shared.\n\n**Takeaway** (`course_of_action`): Review every transaction feature as a trust and regulatory decision before it is a product decision; Part VI begins with messaging-and-leads, the moment a buyer decides to contact a seller.\n\n**Hand-off** to [Part VI — MONEY: Conversion and Monetization](part-6.html): `sequence`: Part V's three threads: the message safety gate, DAC7 seller reporting for in-platform payments, and trader records. → Contact, transactions and the revenue models built on top of them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p68 | synthesis | Part V's four chapters produce and read the same few records (decision record, risk scores and actor clusters, identity claims and trader record, and the law's five components that ask for them as evidence), so trust is one platform because its records are shared, not because its people are. | reasoning: The decision record from trust-and-safety-architecture, the risk scores fed into it by fraud-prevention, the identity claims and trader record of identity-and-verification, and the five components of this chapter. |  |\n| p69 | synthesis | The part's test can now be answered for Femke's suspension as it would run on the records Part V built (the same counterfactual as the DSA section): the decision record would say who decided and under which policy version, the acknowledged enforcement event where it propagated, and the statement keyed by decision ID with the saved query would prove it a year later. | scenario: Femke's suspension at 20:26 on 7 March 2027 under POL-FRAUD-PAYLINK version 2, an analyst confirming a rule hit; the statement and submission keyed by decision ID; the saved query of the 2027 report. | `example`: Shared records. → The part introduction's test applied to one decision. |\n| p70 | recommendation | Part V's threads run into Part VI, so every transaction feature should be reviewed as a trust and regulatory decision before it is a product decision: messaging is where scams close and identity levels gate contact, payments change the legal perimeter, labels govern paid placements, trader records feed billing, a group that built trust as four separate stacks pays for each again, and Part VI begins with the moment a buyer contacts a seller. |  | `cause_effect`: A trust platform whose records answer the test. → What that means for the revenue lines of Part VI, and the hand-off to it. |\n\n## Non-goals\n\n- The moderation pipeline, decision service and enforcement propagation. See [Trust and Safety as a Platform](trust-and-safety-architecture.html).\n- Identity levels, KYB and the business registry. See [Who Is on the Other Side? Identity and Verification](identity-and-verification.html) nter on ratings. — National, UK and US rules and the FINN ratings design.\n\n## Changelog\n\n- **2026-11-13** — Fix-only pass under the author's delegation: seven blocking draft-check findings fixed (p04 contrast, verticals section moved after Vertical Rules, p60 split, p28 backfill ruling, p69 counterfactual, p29 rule count, p55 order) and one minor (p62); check report now stale. (AI-mediated session)\n- **2026-11-12** — Escalation resolved under the author's delegation: INFORM correction kept; 'Vertical Differences' renamed 'Vertical Differences in Legal Exposure' with a lead-in that separates it from Vertical Rules; p70 adds messaging and the four-stacks cost (AC-4); max_words 8,811 to 9,000. (AI-mediated session)\n- **2026-11-12** — Draft check round 3: ESCALATE (16 pass, 13 fail; 3 corroborated, one of them a spec fault on Vertical Differences' position). Cheap fixes applied afterwards without a further round; the check report is therefore stale. (AI-mediated session)\n- **2026-11-12** — After draft check round 2 (escalate on two spec faults): transitions into p32 and Vertical Differences restated, p26 recorded as a replay; draft revised at the corroborated flow points. (AI-mediated session)\n- **2026-11-12** — After draft check round 1 (escalate on one spec fault): p55's controlling idea corrected (INFORM is a regulatory, not tax-reporting, decision); draft revised at the failing transitions and flow points. (AI-mediated session)\n- **2026-11-12** — Converted spec.md to spec.json (status draft): one paragraph per unit, reconstructed from the published text; added roadmap, two table lead-ins, two splits and a three-paragraph conclusion carrying Part V's closing; spec.md removed. (AI-mediated session)\n- **2026-10-21** — Renamed failure patterns to match where-listing-systems-go-wrong. (AI-mediated session)\n- **2026-10-20** — Replaced 3 mermaid diagrams with generated illustrations; consistency fix naming ranking, payments and seller-data teams and the four pip             function inline(s) {

                // Bold/italic, including nested combinations: ***x***,

                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
