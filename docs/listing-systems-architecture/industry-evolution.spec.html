<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, the three acceptance criteria, the thesis and the role are copied unchanged from the chapter's entry in journal-spec.json. Two units are new against the published text: the introduction's roadmap (p03, rewritten from the method paragraph) and the conclusion's synthesis paragraph (p75).\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The industry timeline in five waves, from print columns to private-equity break-ups, with dated sources.\n- **Know:** The portfolio model, and what each wave typically left in the systems: pioneer monoliths, country copies, acquired national stacks, shared platforms and carve-out residue.\n- **Believe:** A group's architecture is the sediment of its corporate history, and capital strategy changes faster than platforms do.\n- **Be able to:** Ask of any inherited system which strategy deposited it and whether that strategy still holds.\n- **Be able to:** Specify a shared platform that can survive the sale of one brand.\n\n**Audience:** Chief and enterprise architects of marketplace groups, technology leaders integrating acquisitions or preparing carve-outs, and engineering directors who inherit landscapes they did not design.\n\n**Already knows:**\n\n- What an API, a database, an event stream, a search engine and Kubernetes are.\n- From earlier pages: classifieds, horizontal and vertical marketplaces, recommerce, liquidity and local network effects, Veldmark's brands, cast and systems, and the fifteen failure-pattern names.\n\n**Does not yet know:**\n\n- The dated history of the classifieds industry and its groups.\n- Deal vocabulary: portfolio model, take-private, carve-out, transitional services agreement.\n- Convergence as distinct from sharing enabling layers, and architectural sediment.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a likely sale of one brand, the reader states what that changes in the design of a shared platform. *Probe:* The group's owner may sell one of its brands within five years. Using only this chapter: how does that change the design of the shared search platform the group is about to build? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** How did today's marketplace groups form, what did each phase do to their architectures, and what must a group's shared platforms therefore survive?\n\n> **Claim:** Today's marketplace groups formed in five waves (print columns, online pioneers, portfolio building, consolidation, and take-privates and break-ups), each of which left systems that outlived the strategy that deposited them, so a group's architecture should be read as sediment rather than as a set of mistakes; and because capital strategy changes faster than platforms, as Adevinta's 2023 convergence and 2025 decentralization show, every shared group platform must be built to be separable when a brand is sold.\n\n**Disputed by:** The view that a group's several search engines and identity systems are technical debt from poor past decisions, to be consolidated onto one target stack for maximum synergy in a portfolio treated as permanent.\n\n**So what:** An architect who accepts this asks of every system which strategy deposited it before proposing to remove it, and writes tenant-scoped data, per-brand accounts and a documented exit path into every shared platform, judging its business case by whether it survives the sale of any one brand.\n\n**How and why:** Because network effects are local, groups grew by copying one codebase per country or buying national leaders and keeping them as separate businesses; each move left a stack. Consolidation then built shared platforms for synergy, and take-privates and break-ups turned them into separation costs. Veldmark's 2006 monolith, its four Tradeyard category trees from country copies and its third and fourth clouds from the 2023–2025 acquisitions each trace to one wave.\n\n**Supporting claims**\n\n- **E1** — Today's marketplace groups formed in five waves (print columns, online pioneers, portfolio building, consolidation, and take-privates and break-ups), each documented in a dated public record.\n- **E2** — Because network effects are local, each wave's growth method (copying a codebase per country, buying and keeping national leaders, launching group brands, rebranding, building verticals, sharing platforms) left a characteristic layer of systems that outlived the strategy that deposited it.\n- **E3** — A group's architecture is therefore best read as sediment: for each system, ask which strategy deposited it and whether that strategy still holds, instead of treating duplicates as mistakes.\n- **E4** — Capital strategy changes faster than platforms: the shared platforms consolidation built for synergy became separation costs when take-privates and break-ups followed within two or three years (Adevinta 2023 to 2025, AVIV 2021 to 2025).\n- **E5** — Every shared group platform must therefore be separable by design, with tenant-scoped data, per-brand accounts and cost centres, exportable contracts, a documented exit path and a business case that survives the sale of any one brand.\n\n## Role in the part\n\nExplains why a group's landscape looks as it does and adds separability as a requirement on every shared platform. Supports P1-3 of part `part-1`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `chronological` in wave01, wave2, wave3, wave4: the waves in the order they happened)\n\nThe scene poses the question, the concepts and timeline give the vocabulary and the dates, and the four wave sections then tell the history in order, each ending with what it left in the systems. Only after all waves can the sediment table name every layer, and only after the table can Veldmark be read with it. Trade-offs, vertical differences, failure modes and the Chief Architect's view generalize from the record and the example; placed before the waves they would be unsupported advice.\n\n## Introduction\n\n**Hook** (`thought_provoking_question`): Why does a group run three search engines, four identity systems and a monolith from 2006?\n\n**Bridge:** Every review of a group's landscape reaches the question 'why is it like this?'. → The answer is rarely that someone chose it; a strategy put it there and changed before the system did, so the industry's history is the explanation.\n\n**Thesis statement** (KEY POINTS bullets 1 and 3, and the last sentence of p01.): A marketplace group's architecture is the sediment of its corporate history, and because capital strategy changes faster than platforms, separability belongs in every group platform.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p03.):\n\n- Veldmark's systems laid out by year. *Kept in:* scene.\n- The terms and the dated timeline. *Kept in:* concepts, timeline.\n- Each wave's public record and what it left in the systems. *Kept in:* wave01, wave2, wave3, wave4.\n- A way of reading a group's architecture as sediment, applied to Veldmark. *Kept in:* sediment, veldmark.\n- Trade-offs, vertical differences, failure modes, the Chief Architect's view and questions to ask. *Kept in:* tradeoffs, vertical, failure, cav, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | claim | Because leadership is won country by country, groups are portfolios of local leaders, and the answer to 'why is our landscape like this?' is that a strategy put each system there and changed before the system did: a group's architecture is the sediment of its corporate history. |  |  |\n| p02 | context | The chapter traces the industry from newspaper columns to the take-privates and break-ups of 2024 to 2026, owns the terms industry timeline and portfolio model, leaves taxonomy, liquidity economics and the full Adevinta story to other chapters, and gives later chapters the separability rule they build on. |  | `elaboration`: The sediment claim. → The span of history the chapter covers, the terms it owns and its boundaries with other chapters. |\n| p03 | transition | The chapter moves from Veldmark's landscape laid out by year, through definitions, a dated timeline and each wave's public record with what it left in the systems, to a way of reading a group as sediment applied to Veldmark, and ends with trade-offs, vertical differences, failure modes and the Chief Architect's view; every company statement carries its source and year, and inferences and the fictional Veldmark are labeled. |  | `sequence`: The scope of the chapter. → The order in which the chapter covers it and the kinds of evidence it uses. |\n\n## Sections\n\n### Setting the Scene at Veldmark: Twenty-Three Years in One Diagram\n\n**Controlling idea** (`example`, id `scene`): Laid out by year, Veldmark's systems fall into layers that each match a period of its corporate history, which raises the question of which layers others consolidated and which a future sale would force it to take apart.\n\n**Advances the thesis** (E2, E3): Shows, in the fictional group, systems that each trace to a strategy, and poses the chapter's two questions.\n\n**Transition in:** `example`: The claim that architecture is the sediment of corporate history. → Veldmark's inventory as a case of it.\n\n**Order of paragraphs** (`chronological`): The scene follows Ingrid's week in order: the request, what the dates showed, how to read it, and the questions it raised. The questions come last because they need the layers to be visible first.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p04 | context | In February 2027 Ingrid Halvorsen asked each brand of Veldmark, the fictional group this book follows, for every production system with the year it was built and why it exists, and the dates ran from 2004 to 2027. | scenario: Veldmark: four brands, eight countries, €1.31 billion revenue in 2026, about 1,150 engineers; slides dated 2004 to 2027. |  |\n| p05 | example | Laid out by year rather than by brand, the systems clustered into four layers, each matching a period of Veldmark's corporate history, with Common Ground starting as a fifth. | table: Period table: 2004-2008 Tradeyard and Yardstick, Motorvane; 2009-2014 copies for Belgium and Portugal, Poland bought; 2015-2022 Motorvane's Kotlin platform and Tradeyard's AWS services; 2023-2025 acquisitions and a private-equity owner; 2027 Common Ground at €140 million. | `cause_effect`: The inventory with dates. → What the dates reveal when the systems are ordered by year. |\n| p06 | analysis | Each 'of everything' on the board's slide was a fossil from a different strategy, defensible when it was made, not a mistake. | example: The four identity systems: residue of an organic launch (Tradeyard), an automotive build (Motorvane) and two recent purchases (Hearthly, Keybridge).; figure: Figure 1: architecture as sediment, five strata of system fossils. | `contrast`: The five layers on Ingrid's diagram. → The board's 'four of everything' reading set against hers. |\n| p07 | transition | The diagram raised two questions, the Group CTO Mateus Carvalho's (which layers larger groups consolidated and at what cost) and the CEO Henrik de Boer's (which planned platforms a brand sale in 2030 would force Veldmark to take apart), and the rest of the chapter answers both from the industry's record. |  | `cause_effect`: The layers read as fossils of strategies. → The CTO's and CEO's questions that the chapter answers. |\n\n### Concepts: Waves, Portfolios and Sediment\n\n**Controlling idea** (`definition`, id `concepts`): The chapter's argument rests on a small set of defined terms, from classifieds and local number-ones to convergence, carve-outs and architectural sediment, and on five approximate waves.\n\n**Advances the thesis** (E1, E3): Defines the terms the history and the sediment reading use, and the five waves the history is divided into.\n\n**Transition in:** `sequence`: The two questions the scene raised. → The vocabulary needed before the industry's answer can be told.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | definition (list) | Nine terms carry the chapter: classifieds, local number-one, portfolio model, copy-paste market entry, shared platform, convergence, take-private, carve-out with transitional services agreement, and architectural sediment, which is not a defect until nobody remembers which strategy deposited it. |  |  |\n| p09 | explanation | The chapter divides the history into five numbered waves, Wave 0 (print) to Wave 4 (take-privates and break-ups), whose boundaries are approximate and overlap, because different groups reached each wave at different times. | figure: Figure 2: five waves of classifieds strategy, with vertical portals alongside and the transactional pivot through consolidation. | `sequence`: The defined terms. → The five waves that organize the rest of the chapter. |\n\n### The Timeline in Dated Events\n\n**Controlling idea** (`evidence`, id `timeline`): A dated, sourced timeline from 1977 to 2026 shows that the same assets change hands repeatedly and that systems outlive the waves.\n\n**Advances the thesis** (E1, E4): Gives the public record of the five waves and the two patterns, ownership churn and short waves, that make separability matter.\n\n**Transition in:** `sequence`: The five waves. → The dated events that fill them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | evidence | The book's reference timeline keeps to events with public sources, from Auto Trader's founding in 1977 to Adevinta's decentralization and OLX's purchase of La Centrale in 2025 to 2026. | table: Timeline table, 1977 to 2025-2026, each event with its source and year (eBay's 2004 purchases, OLX 2006 and Naspers 2010/2014, Adevinta's 2019 demerger and 2021 eCG completion, Adevinta's 2024 take-private, AVIV's 2025 separation, Adevinta's 2025 decentralization). |  |\n| p11 | analysis | The timeline shows that the same assets change hands repeatedly and that the waves are short compared with the systems, so a system routinely outlives two or three owners. | fact: Gumtree has had at least three owners, mobile.de three, AutoScout24 two.; case: Kleinanzeigen's 2009 platform served under eBay, Adevinta's listing, its take-private and its decentralization before users were migrated off it in 2025. | `cause_effect`: The dated events. → The two patterns visible in them before any architecture. |\n\n### Wave 0 and Wave 1: From Paid Columns to Free Pages\n\n**Controlling idea** (`evidence`, id `wave01`): Print left vocabulary and pricing habits, and the online pioneers inverted print's model with free, local, minimal sites whose monoliths, free listings and category structure still shape platforms.\n\n**Advances the thesis** (E1, E2): Gives the first two waves' record and what they left in the systems.\n\n**Transition in:** `sequence`: The timeline's first events. → The first two waves in detail.\n\n**Order of paragraphs** (`chronological`): Print comes before the pioneers who inverted it, the pioneers' record before what it left. Reading the legacy list before the record would leave its items unexplained.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p12 | description | For most of the twentieth century classifieds were a newspaper's most profitable pages, small paid notices sold by the line, and specialist print titles grew alongside. | fact: Auto Trader began in 1977 as Thames Valley Trader and published its final print edition in June 2013, 'after thirty six years'. |  |\n| p13 | analysis | Print's architectural legacy is vocabulary and pricing habits, not code: category columns became category trees, paying per listing survives in insertion fees and bumps, and each city as its own market survives in per-country, per-city structure. |  | `cause_effect`: Print's paid columns. → What they left in today's platforms. |\n| p14 | example | The pioneers inverted the print model: listings became free for private sellers and money came from a few paid categories, as craigslist shows. | case: Craigslist: Craig Newmark's 1995 e-mail list, web 1996, incorporated 1999, other cities from 2000; revenue mainly from paid job ads, $25 job posts in New York and Los Angeles from August 2004. | `contrast`: Print's paid listings. → The pioneers' free listings. |\n| p15 | evidence | Free listings pushed down newspapers' classified prices, as research on craigslist's entry into US local markets measured. | statistic: Seamans and Zhu: classified-ad rates fell by 20.7% at newspapers relying heavily on classifieds; classified-ad buyers saved about $5 billion between 2000 and 2007. | `cause_effect`: Free listings. → Their effect on newspapers. |\n| p16 | example | In Europe the same years produced the national leaders that still dominate, and those founded by their suppliers, like Rightmove, inherited a feed-first relationship with them. | fact: mobile.de (1996), ImmobilienScout24 and AutoScout24 (1998), Marktplaats (1999), Rightmove and Gumtree (2000); Rightmove's founders were Countrywide, Halifax, Royal & Sun Alliance and Connells. | `place`: The US pioneers. → The European leaders of the same years. |\n| p17 | analysis (list) | Wave 1 left minimal monolithic stacks, free listings as the default for private sellers, and categories as the unit of the business. | case: Kleinanzeigen's 2009 architecture: 'a plain old database backend', Solr master/slave, built 'to process 10K new ads per day'; by 2019, 34 million live ads.; quotation: Parker on the unbundling of craigslist: 'a team of thirty-or-so people manages a top 10 ranked English-speaking website'. | `conclusion_summary`: The pioneers' record. → What Wave 1 left in the systems. |\n\n### Wave 2: The Portfolio Builders\n\n**Controlling idea** (`evidence`, id `wave2`): Between about 2005 and 2016 Schibsted, eBay and Naspers with OLX built international portfolios by different entry methods, and the vertical portals grew into the assets portfolios most wanted; each method left a different architecture, and its cost was deferred, not avoided.\n\n**Advances the thesis** (E1, E2): Gives the portfolio wave's record per builder and maps each entry method to the architecture it left.\n\n**Transition in:** `sequence`: The pioneer leaders. → The groups that assembled them into portfolios.\n\n**Order of paragraphs** (`grouping`): One builder at a time, each with its record and then its architectural reading, so the reader holds one method at once; verticals come after the horizontals because they were what the horizontals bought; the summary table comes last because it needs every method.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | claim | Between roughly 2005 and 2016 three groups, Schibsted, eBay and Naspers with OLX, turned local classifieds into international portfolios by different entry methods, each of which left a different architecture. |  |  |\n| p19 | evidence | Schibsted's documented expansion facts are dated (leboncoin and willhaben founded in 2006), while the widely told copy-paste account built on the Blocket platform is reported, not verified. | fact: leboncoin founded 28 April 2006; willhaben in 2006 as a 50/50 joint venture with Styria.; source: A 2012 Nieman Lab article reportedly saying Schibsted ran classifieds in 28 countries on the Blocket platform (not retrieved). | `example`: The three groups. → The first: Schibsted. |\n| p20 | evidence | The record shows that Schibsted's group was a federation of locally run marketplaces that stayed local in product and technology for a long time; the group's own words for that model and for the pull toward central scale came when consolidation began, and Wave 3 opens with them. | fact: The 2006 launches were local brands: leboncoin in France and willhaben in Austria.; reasoning: Forward pointer to Wave 3, where the 2016 heading and Adevinta's 2019 report are quoted. | `contrast`: The unverified copy-paste account. → What the record does show. |\n| p21 | example | The federation also produced group platforms from local inventions, such as FINN.no's FIAAS deployment abstraction. | fact: FIAAS built at FINN.no and open-sourced in early 2019; FINN.no reported 350 microservices and about 1,200 deployments a week in 2017.; reasoning: INFERENCE callout: copy-paste entry produces country codebases that diverge; the mechanism behind The Copy-Paste Country; central scale later built as new shared components. | `additional_support`: The local federation. → Group platforms that grew from it. |\n| p22 | evidence | eBay assembled its classifieds portfolio mainly by buying national leaders and keeping their brands, and launched group brands where it had no leader. | fact: mobile.de 2004 (about €121 million), Marktplaats 2004 (about €225 million, run 'as a separate business'), Gumtree and LoQUo 2005, dba.dk and Bilbasen 2008 (about US$390 million), 2dehands/2ememain 2013, Vivanuncios 2015; Kijiji 2005, eBay Kleinanzeigen 2009. | `contrast`: Schibsted's launch-and-copy model. → eBay's buy-the-leader model. |\n| p23 | evidence | The bought leaders mostly survived and grew while many greenfield launches were closed, renamed or sold, with eBay Kleinanzeigen as the exception. | fact: Kijiji Hong Kong and Taiwan closed in 2015; Kijiji China became Baixing; Kijiji India became Quikr; iBazar retired; eBay Kleinanzeigen launched with about 700,000 live ads by absorbing a Kijiji audience. | `cause_effect`: eBay's two entry methods. → How each fared. |\n| p24 | evidence | Technically eCG was a federation with group functions, and its clearest shared element, the parent's Voyager search, became an orphaned black box that Marktplaats replaced with Elasticsearch itself. | quotation: eCG job ads 2009-2011: a 'sister Classifieds platform'; Marktplaats 2015: eBay 'has moved on from Voyager several years ago', 'almost become a black box for us'; migrated in three months with two or three developers, zero downtime. | `elaboration`: eBay's portfolio of kept brands. → What it shared technically. |\n| p25 | recommendation | Two lessons travel from eBay: coordinate the technology choice across brands but let each brand migrate itself, and expect a parent's platform to become orphaned legacy faster than local code. |  | `conclusion_summary`: The Voyager case. → The two lessons drawn from it. |\n| p26 | evidence | Naspers built OLX into a global roll-up, rebranding acquired local sites to one name while vertical brands kept their own, reaching 45 markets by 2018. | fact: OLX founded 2006; Naspers majority 2010, 95% in 2014 with rebranding across Romania, Bulgaria, Kazakhstan, Belarus, Hungary, Poland and Indonesia; OLX Group in 2016; 'a network of leading classifieds platforms in 45 markets' (2018); Otomoto, Otodom, Standvirtual, Imovirtual, Autovit, Storia kept their names. | `contrast`: eBay's keep-the-brand method. → OLX's rebrand-to-one-name method. |\n| p27 | analysis | Rebranding to one name implies a push toward shared product, but OLX's public record documents shared practices and some shared code more than one global platform, and its identity standardization is a direct trace of sediment. | fact: One frontend repository for three brands (2026); a centralized learning-to-rank repository with per-brand configuration (2025); user identification standardized 'across 71 services' at OLX Motors (2024-2025). | `contrast`: What one brand name implies. → What OLX's engineering record documents. |\n| p28 | evidence | While the horizontals built portfolios, the vertical portals became the industry's most profitable businesses by monetizing professionals. | statistic: Rightmove: 70% underlying operating margin on £425.1 million revenue for 2025; Autotrader: 70% operating margin for the year to March 2026; most traffic arrives directly. | `time`: The horizontal portfolio builders. → The verticals growing in the same years. |\n| p29 | explanation | Verticals were the assets portfolios most wanted to own, and their architecture differs because supply arrives through professional feeds, items have authoritative identities and data products are part of what they sell. | fact: eBay bought mobile.de; Axel Springer combined Immowelt and Immonet in 2015 and bought Meilleurs Agents for €200 million in 2019; OLX built and bought motors and property brands per country. | `cause_effect`: Verticals' margins. → Why portfolios bought them and how their systems differ. |\n| p30 | synthesis | Each entry method was a reasonable way to win local leadership quickly, so the table of what each left behind is not a ranking: the architecture cost was deferred, not avoided. | table: Entry method, example and architecture left behind: copy the codebase (diverged copies, The Copy-Paste Country), buy and keep separate (national stacks, Deal-Shaped Architecture), group brand (fragile where it did not lead), buy and rebrand (brand ahead of platform), verticals per country (deeply local feeds and schemas). | `conclusion_summary`: The five entry methods described in this section. → What each left in the systems, and the judgement on them. |\n\n### Wave 3: Consolidation\n\n**Controlling idea** (`evidence`, id `wave3`): From around 2016 the portfolio builders integrated what they owned: sharing enabling layers worked and paid while the portfolio held together, converging product platforms was attempted, and the wave left shared platforms, partial convergence, transitional dependencies and rebrand residue.\n\n**Advances the thesis** (E1, E2, E4): Gives the consolidation wave's record and shows the shared platforms that the next wave would have to separate.\n\n**Transition in:** `cause_effect`: The deferred architecture cost of the portfolio builders. → The consolidation that tried to collect it.\n\n**Order of paragraphs** (`grouping`): The opening gives the turn of around 2016 and the 2019 rule for what to share, quoted here rather than in Wave 2 because they belong to this era. The Adevinta deal first, because it is the largest and its layers (remedies, enabling layers, product convergence) show the whole range; then the other two groups' contrasting paths; then the transactional thread that ran through all of them; the legacy list last because it summarizes all of them. Placed after OLX or AVIV, the Adevinta deal would leave the reader without the baseline (shared enabling layers, then product convergence) that their paths are contrasted with.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p31 | cause_effect | From around 2016, the year Naspers consolidated its classifieds under OLX Group and Schibsted presented 'one global product and tech organization', the portfolio builders turned to integrating what they owned, driven by the cost of many stacks, rising user expectations local teams could not meet alone, and deals that combined portfolios of comparable size. | quotation: 2016: Naspers consolidates classifieds under OLX Group; Schibsted investor presentation heading 'one global product and tech organization'. |  |\n| p31a | evidence | Adevinta, Schibsted's demerged classifieds business, set out in its 2019 annual report the rule the consolidation would follow: local autonomy in product and technology had been a historic success formula, and data and analytics would be centralized because the investment was large and the technology uniform. | quotation: Adevinta 2019: 'one of our historic success formulas has been local autonomy and decentralised capacity in product and technology', data centralized because 'investment requirements are large and the technology is uniform'. | `example`: Schibsted's 2016 turn toward one product and tech organization. → The rule its demerged classifieds business wrote down in 2019. |\n| p32 | evidence | The largest consolidation was Adevinta's acquisition of eBay Classifieds Group, completed in June 2021 with targeted cost synergies of €130-165 million after three years. | fact: Announced 21 July 2020 for US$2.5 billion plus about 540 million shares (eBay about 44%); completed 25 June 2021; number-one positions in 16 countries; run-rate cost synergies of €130-165 million after three years. | `example`: The drivers of consolidation and the deals that combined portfolios. → The largest consolidation deal. |\n| p33 | evidence | Competition law shaped the result before integration began, forcing divestments served by transitional services, and Adevinta then sold further businesses to focus on five core markets. | quotation: CMA undertakings: sale of Gumtree UK with Motors.co.uk and of Shpock; 'Adevinta and eBay have offered to provide transitional services'; Adevinta 2022: 'five core European markets: Benelux, France, Germany, Italy and Spain'. | `time`: The deal. → What happened before integration started. |\n| p34 | evidence | Integration proceeded layer by layer, from cloud and data centres to chat and moderation, and its costs, such as the eBay Kleinanzeigen rebrand, show how far sediment reaches. | quotation: 'to a single public cloud vendor for our EU5 businesses', 'close three of four data centre footprints'; integration cost €69 million in 2023, the rebrand €15 million; the old domain to 'remain accessible for several more years'. | `sequence`: The deal and its remedies. → The integration that followed. |\n| p35 | evidence | Sharing the enabling layers worked and paid, at least while the portfolio held together. | statistic: Kubernetes platform for 'more than 4,000 developers' (2023) and 'over 2,000 Kubernetes nodes and 30 clusters across 25 marketplaces' (2024); experimentation from about ten tools across 22 marketplaces to one. | `cause_effect`: Layer-by-layer integration. → Its result for the enabling layers. |\n| p36 | evidence | In 2023 Adevinta set out to converge the product platform itself, Kleinanzeigen's and leboncoin's into one unified global platform, and no public source confirms it was delivered. | quotation: Stop 'individually addressing local market customer needs'; transform 'the two platforms into a unified global platform'; May 2024: 'progressing well and according to plan'. | `emphasis`: Shared enabling layers. → The further step: convergence of product. |\n| p37 | comparison | OLX consolidated differently, by merging regional businesses into larger local players and keeping minority stakes, which is architecturally the cleanest exit because the group keeps equity, not systems. | fact: June 2020: dubizzle and Middle East and South Asia operations into EMPG for 39%; March 2020: letgo US with OfferUp for 40%; Brazilian joint venture with Adevinta bought Grupo ZAP for about R$2.9 billion. | `contrast`: Adevinta's integrate-and-converge path. → OLX's merge-into-others path. |\n| p38 | example | Axel Springer's property business, AVIV, took the integrate-first path in 2021. | quotation: AVIV's CEO, 2021: 'we are aligning our tech roadmap across the organization to create a European real estate marketplace'. | `contrast`: OLX's merger path. → AVIV's integrate-first path. |\n| p39 | evidence | In the same years the horizontals moved toward payments and shipping, and payments became the main product capability consolidators wanted to build once, while recommerce specialists built that model from the start. | fact: Marktplaats transactional 2017, shipping 2019; leboncoin 2019; 'Sicher bezahlen' October 2020; Adevinta transactional revenue €103 million in 2023, about 6%; OLX Pay&Ship 2023 and Prosus's 'de-prioritisation of pay-and-ship in Europe'; Vinted €10.8 billion GMV and €1.1 billion revenue for 2025. | `time`: The consolidation paths. → The transactional pivot running through the same years. |\n| p40 | analysis (list) | Wave 3 left shared enabling platforms with their coupling, partially converged product platforms, transitional-services dependencies and rebrand residue. | quotation: mobile.de Android, 2025: a rebrand 'took only two weeks to implement once the base refactoring was done', after removing 'technical debt from 8 years ago'. | `conclusion_summary`: The consolidation record. → What Wave 3 left in the systems. |\n\n### Wave 4: Take-Privates, Focus and Break-Ups\n\n**Controlling idea** (`evidence`, id `wave4`): From 2022 owners changed their minds about breadth: OLX retreated to a few markets, Adevinta and AVIV reversed their integration under new owners at real separation cost, and consolidation moved to platform buyers, so platform topology has to match a capital strategy that can change within two or three years.\n\n**Advances the thesis** (E1, E4): Documents the reversals that make capital strategy faster than platforms.\n\n**Transition in:** `contrast`: The consolidators' shared and converged platforms. → The owners who changed their minds about breadth.\n\n**Order of paragraphs** (`grouping`): The opening claim first, then one owner per paragraph from retreat to break-up to reversal, then the buyers who kept consolidating, which sets up the inference that topology must follow capital strategy. The reversals must come before the platform buyers, because the contrast in p46 needs both, and the inference needs both reversals to generalize from.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p41 | claim | From 2022 the cost of capital rose and the industry's owners changed their minds about breadth. |  |  |\n| p42 | evidence | OLX retreated from 45 markets in 2018 to seven in 2026, the starkest public example of a group concluding that local leadership in a few markets beats global breadth. | fact: Avito sold for RUB 151 billion (October 2022); exit from OLX Autos announced March 2023 after $1.6 billion revenue in the year to March 2022; India and Indonesia sold 2023; Uzbekistan and Kazakhstan agreed for sale 2025; year to March 2026: seven markets, US$992 million revenue, 48% adjusted EBITDA margin, La Centrale bought for €1.1 billion. | `example`: Owners rethinking breadth. → OLX's retreat. |\n| p43 | evidence | After its take-private, Adevinta moved from a centralized to a decentralized standalone model and sold businesses, and the parallel running this required shows that undoing a shared platform costs real money. | quotation: NOK 115 per share offer (November 2023), completed May 2024; 'evolved from a centralised structure to a decentralised, standalone operating model… ramp-down of central functions… localisation of intellectual property'; willhaben stake sold 2025; Spain to EQT, completed 27 February 2026, Fotocasa and Habitaclia on to Scout24; cloud emissions 'more than doubled' from 'parallel running of central and local services'. | `example`: OLX's retreat. → Adevinta's take-private and break-up. |\n| p44 | evidence | The break-up reached mobile.de, which had come to Adevinta with eBay Classifieds Group in 2021, and whose sale process is reported but whose outcome is not public as of October 2026, so the separation is still under way. | fact: FT (October 2025, via PYMNTS): IPO or sale at up to about €10 billion; mobile.de's August 2026 release still calls it an Adevinta subsidiary; Bundeskartellamt (October 2026) names 'Oak Germany Buyer GmbH' as its parent. | `elaboration`: Adevinta's break-up. → One of its remaining pieces, mobile.de, and its unsettled sale. |\n| p45 | evidence | AVIV, separated from Axel Springer under KKR and CPP Investments in 2025, rowed back on its fully integrated platform in favour of local autonomy. | quotation: Separate joint ventures from 29 April 2025, Axel Springer keeping about 10%; interviewer (not AVIV), December 2025: rowed 'back on its plans for a fully integrated platform'; Immowelt's head: 'AVIV has strengthened the autonomy of its local businesses'; Yad2 sale to Apax signed the same month. | `similarity`: Adevinta's reversal. → AVIV's reversal. |\n| p46 | analysis | The consolidation logic did not disappear but moved to platform buyers who integrate acquisitions into their own platform, and for owners pursuing break-up value a shared product platform is a liability, so topology has to match the capital strategy. | fact: CoStar completed Domain (August 2025), 'ready to apply that same proven playbook'; AutoScout24 migrated '110 AWS accounts across 4 business units' of Trader in 2025.; reasoning: INFERENCE callout: a shared product platform creates transitional services, IP questions and double running at exit; the 2021 synergy became a 2025 separation cost.; figure: Figure 3: the centralize-decentralize swing in Adevinta's own words, 2019-2026. | `contrast`: The reversals at Adevinta and AVIV. → Owners who kept consolidating, and what the contrast means. |\n\n### Reading a Group's Architecture as Sediment\n\n**Controlling idea** (`explanation`, id `sediment`): For each major system, asking which wave deposited it and under what assumption about ownership and sharing predicts its behavior better than its technology does, and says what to do with it.\n\n**Advances the thesis** (E3): Turns the waves into the chapter's practical tool.\n\n**Transition in:** `conclusion_summary`: The five waves and what each left. → A tool that reads any group's systems by the wave that deposited them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p47 | explanation | For each major system an architect should ask which wave deposited it and under what assumption about ownership and sharing, because the answer predicts its behavior and what to do with it better than the technology does; a table of seven layers of sediment gives the assumption, symptom and treatment of each. | table: Seven layers of sediment (pioneer monolith, country copies, acquired stacks, inherited parent technology, shared enabling platforms, converged product platforms, carve-out residue) with assumption, symptom in 2027 and what to do.; figure: Figure 4: the loop behind the timeline, ownership sets topology, sediment sets the cost of the next deal. |  |\n\n### In Practice: Veldmark's History, Read as Sediment\n\n**Controlling idea** (`example`, id `veldmark`): Read layer by layer, Veldmark's fictional history explains its monolith, its four category trees, its overlapping automotive businesses and its extra clouds, and Common Ground answers Henrik's question by writing a separability rule into every shared platform.\n\n**Advances the thesis** (E3, E5): Applies the sediment reading to the fictional group and shows separability specified in advance.\n\n**Transition in:** `example`: The sediment table. → Veldmark's history read with it.\n\n**Order of paragraphs** (`chronological`): Veldmark's layers in the order they were deposited, as in Ingrid's diagram, so each paragraph matches a row of the sediment table; the decisions table and its separability column come last because they answer Henrik's question from the reading. The 2025 owner and Common Ground get their own paragraph after the acquisitions, saying outright that Veldmark met the industry's Waves 3 and 4 in reverse order, so the labels do not read as a sequence error.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p48 | transition | Veldmark's history is fictional but was written to follow the industry's waves, so Ingrid's diagram can be read with the sediment table, each layer labeled by the strategy that deposited it rather than by its date. |  |  |\n| p49 | example | Yardstick is Wave 1 sediment: built for one country and one team, it now carries 6.1 million listings and 140 engineers, which is why Common Ground strangles it capability by capability. | scenario: Tradeyard NL 2004 from the founding family's classified pages; Yardstick the 2006 PHP rewrite on MySQL; 6.1 million live listings in 2026; single deployable for 140 engineers, released twice a week; insertion out Q2 2028, search Q4 2028, decommissioned end of 2029. | `sequence`: The reading of Veldmark by wave. → Wave 1. |\n| p50 | example | Wave 2's copies and acquisition left four country category trees and a separate Polish search, The Copy-Paste Country in reference data, which is why the group taxonomy service comes before sharing Tradeyard's code. | scenario: Belgium 2009 and Portugal 2014 on copies of Yardstick, folded back 2016-2018 (about 2,600 country branches); Poland 2012 bought, kept Elasticsearch; 1,420, 1,380, 980 and 760 leaf categories; 3,900 attribute keys, 41% on fewer than 0.1% of listings; about six weeks to add a category. | `sequence`: Wave 1 at Veldmark. → Wave 2's copies. |\n| p51 | example | Motorvane is the vertical-portal pattern, one automotive platform across four countries, and its overlap with Tradeyard's cars section in Poland is its sediment. | scenario: Motorvane launched in Germany in 2008 because its supply was dealers with feeds; rebuilt 2017-2020 as about 120 Kotlin services on AWS; NL, PL, AT on one platform; Tradeyard's cars section and Motorvane Poland selling to the same dealers by 2027. | `contrast`: Tradeyard's copies. → The vertical built as a separate brand. |\n| p52 | example | Veldmark's 2023-2025 acquisitions followed Wave 2's buy-and-keep strategy: Hearthly France, Keybridge and Casavista were each kept as a separate business with its own cloud, search engine and data warehouse. | scenario: Hearthly France 2023, Keybridge 2024, Casavista 2025; each kept separate; each acquisition brought its own cloud, search engine and data warehouse. | `sequence`: Waves 1 and 2 at Veldmark, read by strategy. → The recent acquisitions, labeled by the strategy that made them. |\n| p52a | analysis | At Veldmark the industry's last two waves came in reverse order: a private-equity investor, the owner type of Wave 4, became majority owner in 2025, and Common Ground, Veldmark's Wave 3, started after that change of owner, which makes Henrik's question a design input. | scenario: Private-equity majority owner 2025; Common Ground approved January 2027. | `contrast`: The Wave 2 strategy repeated at Veldmark. → Where Veldmark's order departs from the industry's: a Wave 4 owner before its Wave 3 program. |\n| p53 | evidence | Ingrid's March 2027 table gives, for each duplicated capability, the wave that created the copies, the Common Ground decision and a separability rule. | table: Identity (4), search (3 engines), taxonomy (4 trees), events (4), data warehouses (3), product catalog (4), Keybridge platform (1), each with the wave whose strategy created the copies (labeled by strategy, not date), decision and separability rule. | `conclusion_summary`: The waves read at Veldmark, including the reversed order of its Waves 3 and 4. → Ingrid's table that turns them into decisions. |\n| p54 | analysis | The separability column applies Wave 4's lesson in advance: because the owner is a future seller, every Common Ground platform carries tenant-scoped data, per-brand accounts and cost centres, exportable contracts and a documented exit path, and the €38 million run-cost target must survive the sale of any one brand. | figure: Figure 5: fused modules tearing versus brand drawers sliding out cleanly. | `emphasis`: Ingrid's table. → Its last column and the reason for it. |\n\n### Trade-offs: Growth Strategies and Their Architecture Bills\n\n**Controlling idea** (`comparison`, id `tradeoffs`): Every growth strategy sends a later architecture bill, and how much a group should share depends on its capital strategy: share what you can separate cheaply.\n\n**Advances the thesis** (E4, E5): Compares strategies and sharing topologies by their cost at exit.\n\n**Transition in:** `cause_effect`: Veldmark's decisions and separability rule. → The general trade-offs behind them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p55 | comparison | Each wave's growth strategy sent an architecture bill that arrived later. | table: Seven strategies (copy, group platform, buy and keep, buy and integrate, regional merger, vertical spin-out, convergence) with speed, architecture left, when right, when it backfires. |  |\n| p56 | comparison | Underneath sits a second trade-off, how much to share given the capital strategy, because the cost at exit rises from federation to converged product platform. | table: Federation, shared enabling layers, shared capability services, converged product platform: what is shared, best fit, cost at exit (low to high). | `elaboration`: Growth strategies and their bills. → The sharing decision beneath them. |\n| p57 | recommendation | Adevinta's 2019 rule, centralize where investment is large and technology uniform, is the best default in the public record, and the swings that followed add a second rule: share whatever you can separate cheaply. |  | `conclusion_summary`: The two trade-off tables. → The two rules that resolve them. |\n\n### Vertical Differences\n\n**Controlling idea** (`comparison`, id `vertical`): The waves hit verticals differently: real estate's local differences are structural, while recommerce's uniform model allows merging, though even there per country and per user.\n\n**Advances the thesis** (E2): Shows that what each wave left depends on the vertical's local differences.\n\n**Transition in:** `contrast`: The general trade-offs. → How they differ by vertical.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p58 | comparison | The waves hit verticals differently, and that is visible in their architectures today. | table: General classifieds, real estate, automotive, jobs and recommerce by pioneer origin, how portfolios grew, consolidation outcome, why local wins and typical sediment. |  |\n| p59 | comparison | Real estate and recommerce sit at opposite ends: real estate's local differences are structural, the most plausible reading of AVIV's scaled-back platform, while Vinted could merge its country portals but still had to migrate per user with consent. | case: Vinted merged its per-country portals into one marketplace with per-user consent, because each country had been a separate legal entity with separate databases. | `elaboration`: The vertical table. → The two extremes in it. |\n\n### Failure Modes\n\n**Controlling idea** (`analysis`, id `failure`): Misreading the history produces seven recurring mistakes, from copying the last wave's answer to pricing rebrands as marketing projects.\n\n**Advances the thesis** (E3, E5): Names what goes wrong when sediment is misread or separability is missing.\n\n**Transition in:** `cause_effect`: The waves, the sediment reading and the trade-offs. → What goes wrong when they are misread.\n\n**Order of paragraphs** (`chronological`): The mistakes roughly follow a deal's life: the strategy chosen, the synergy case, the platform built, the acquired stacks kept, convergence forced, dependencies forgotten, the rebrand; the general mistake of copying the last wave comes first because the others are instances of misreading. Placed elsewhere, it would read as one more mistake rather than the frame for the six specific ones.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p60 | claim | Misreading the history produces seven recurring mistakes. |  |  |\n| p61 | analysis | Copying the last wave's answer, convergence during consolidation or autonomy during a break-up, follows a fashion instead of reading the group's own ownership, markets and sediment. |  | `sequence`: The count of seven mistakes. → The first. |\n| p62 | analysis | A synergy case that counts platform retirements as straight-line savings ignores the long tails the record shows and should carry the convergence's risk. | fact: Rebrands keeping old domains for years; €69 million integration cost at Adevinta in 2023; transitional services for divested brands. | `additional_support`: The previous mistake. → Synergy cases that count platforms as savings. |\n| p63 | analysis | A shared platform without tenant-scoped data, per-brand accounts and cost allocation turns every later sale into a carve-out project. | fact: Adevinta's parallel running during decentralization. | `additional_support`: The previous mistake. → Shared platforms with no exit path. |\n| p64 | analysis | Treating acquired stacks as temporary without a dated, funded plan creates Deal-Shaped Architecture. |  | `additional_support`: The previous mistake. → Acquired stacks treated as temporary. |\n| p65 | analysis | Forcing convergence where local differences are the product invites The Forced Fit, with local teams routing around the platform. |  | `additional_support`: The previous mistake. → Convergence forced over local differences. |\n| p66 | analysis | Inherited dependencies from a former parent, sister brand or TSA run quietly until their owner stops supporting them, as Voyager did. |  | `additional_support`: The previous mistake. → Forgotten inherited dependencies. |\n| p67 | analysis | Rebrands priced as marketing projects miss the engineering they touch, as mobile.de's two-week rebrand after eight years of debt removal shows. |  | `additional_support`: The previous mistake. → Rebrands priced as marketing. |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `cav`): At group scale history is an input to four standing decisions: know the owner's horizon, make separability a non-functional requirement, separate enabling layers from the product edge, and keep a sediment register.\n\n**Advances the thesis** (E5, E4): Turns separability and the sediment reading into standing decisions.\n\n**Transition in:** `problem_solution`: The seven mistakes. → The standing decisions that prevent them.\n\n**Order of paragraphs** (`prerequisite_order`): The owner's horizon comes first because separability follows from it; separability before the choice of what to share, because it is the constraint that choice works under; the register and the measures last, because they keep the first three decisions current. Asking for separability before the owner's horizon would give the reader a requirement with no reason.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p68 | claim | At group scale history is an input to four standing decisions. |  |  |\n| p69 | recommendation | The architecture function should ask for the owner's capital strategy in writing and revisit platform topology when it changes, as Veldmark's March 2027 decision record does. | scenario: March 2027 decision record: any brand may be sold within five years. | `sequence`: The four decisions. → The first: the owner's horizon. |\n| p70 | recommendation | Separability should be a non-functional requirement: no shared platform goes live without a written answer to how a brand's slice would be handed to a buyer in six months. |  | `cause_effect`: The owner's horizon. → The requirement it imposes on shared platforms. |\n| p71 | recommendation | Share enabling layers and decide per capability at the product edge, because sharing infrastructure paid while converging whole product platforms was slow and often reversed. |  | `sequence`: Separability as a requirement. → Where to share at all. |\n| p72 | recommendation | A sediment register records for each major system its wave, assumption, owner, consumers and fate, turning 'why is it like this?' from folklore into a decision record. |  | `sequence`: Where to share. → How to keep the history usable. |\n| p73 | recommendation | Four measures show whether these decisions hold: duplicated engineering, dependencies a sale would break, run costs per brand without allocation arguments, and whether the platform plan changed within a quarter of each deal. |  | `conclusion_summary`: The four decisions. → What to watch to see whether they hold. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Nine questions take the sediment reading and the separability rule into a strategy review or due-diligence meeting.\n\n**Advances the thesis** (E3, E5): Gives the reader the chapter's questions to use.\n\n**Transition in:** `sequence`: The Chief Architect's decisions. → The questions that test them in a review.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p74 | recommendation (list) | Nine questions, from which strategy created each system to what the last rebrand cost, take the chapter into a strategy review or due-diligence meeting. |  |  |\n\n## Conclusion: From History to Capabilities\n\n**Synthesis:** The industry's record and Ingrid's diagram tell one story from two sides: every layer was deposited by a strategy that was defensible when it was made, and every group that shared a layer later had to separate it under a different owner, so the sediment reading and the separability rule are one discipline, looking back and looking forward.\n\n**So what:** A Chief Architect who reads the landscape this way stops treating duplicates as mistakes to remove and starts treating each shared platform as something a future owner may have to divide, which is a decision made at design time, not at signing.\n\n**Callback:** Henrik's question in the opening scene: if our owner sells a brand in 2030, which of the platforms we are about to build will we have to take apart? The reader can now answer it: none of them, if each carries the separability rule from its first design review, because that is what Adevinta and AVIV lacked when their owners changed.\n\n**Takeaway** (`course_of_action`): Before deciding what to share, describe what the marketplaces do independently of their systems, which is the next chapter's capability map.\n\n**Hand-off** to [Map What the Marketplace Does Before What Runs It](business-capabilities.html): `problem_solution`: The history, which explains how the systems got here but not what they should become. → A description of what the marketplace does that is independent of its systems: the capability map, value streams and heat map.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p75 | synthesis | Read together, the industry's record and Ingrid's diagram say that every layer was right when deposited and every shared layer had to be separated under a new owner, so Henrik's question is answered at design time: no Common Ground platform has to be taken apart if each carries the separability rule. |  |  |\n| p76 | transition | The history explains how the systems got here but not what they should become, so deciding what to share needs a description of what the marketplaces do independent of their systems, which business-capabilities builds. |  | `problem_solution`: The answer to Henrik's question. → The question it leaves open, what to share, and the next chapter that answers it. |\n\n## Non-goals\n\n- Marketplace models and the endpoint ladder. See [Classifieds, Leads, Transactions and Managed Models: A Marketplace Taxonomy](marketplace-taxonomy.html).\n- Liquidity economics and why leadership is local; stated briefly only. See [Liquidity Is the Product: Network Effects, Local Markets and Marketplace Metrics](liquidity-and-network-effects.html).\n- The full Adevinta, OLX, eBay Classifieds and AVIV stories. See [Adevinta: From Schibsted's Copy-Paste Model to a Portfolio Platform](case-adevinta.html), [OLX Group: Regional Platforms, Verticalization and Retreat](case-olx.html), [eBay Classifieds Group: Shared Platforms, Local Brands and a Sale](case-ebay-classifieds.html), [AVIV Group: Building a European Real-Estate Platform from Acquisitions](case-aviv.html).\n- Payment, shipping and buyer-protection design. See [Beyond the Contact: Payments, Shipping and Buyer Protection](transactions-and-payments.html).\n- The method for consolidating platforms and designing multi-country platforms. See [After the Deal: Consolidating Platforms After Acquisitions](platform-consolidation.html), [One Platform, Many Marketplaces: Multi-Country and Multi-Brand Architecture](multi-country-platforms.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- mobile.de ownership after the 2025 dual-track process is unclear (Bundeskartellamt names 'Oak Germany Buyer GmbH' in October 2026); re-check before publication. (Carried over from spec.md; needs an external check, not a decision.)\n\n## Decision log\n\n- **2026-10-19** — Organized the chapter by waves rather than by company, so companies appear as evidence for architectural questions, consistent with the book's company-neutral stance.\n- **2026-10-19** — Introduced 'architectural sediment' and a sediment register as the chapter's practical tool, linking history to decisions rather than narrating it.\n part from this line. (AI-mediated session)\n- **2026-11-12** — Draft check round 1 (REVISE, 10 pass, 23 fail): p05, p09, p44 and p48 controlling ideas and p44 transition_in reworded to the revised prose (layers four plus the program; waves numbered; mobile.de introduced as part of the break-up; layers labeled by strategy). Order unchanged. (AI-mediated session)\n- **2026-11-12** — Flow rubric (sound with notes): p07 names Mateus Carvalho and Henrik de Boer, p47 names the sediment table, rationales added for wave3, wave4, failure and cav; order unchanged. index.md: p03 rewritten as the roadmap, conclusion synthesis paragraph p75 added. (AI-mediated session)\n- **2026-11-12** — Converted spec.md to spec.json (outcome spec), reconstructed from the published text; status draft. (AI-mediated session)\n- **2026-10-21** — Renamed failure patterns to match where-listing-systems-go-wrong. (AI-mediated session)\n- **2026-10-20** — Replaced 3 mermaid diagrams with generated illustrations (figure numbers and captions unchanged; sources archived in _research/mermaid-figures.json). (AI-mediated session)\n- **2026-10-20** — Sharpening pass: 7,848 to 7,837 words; excerpt and first KEY POINT name the chapter's five waves; lead names what the chapter builds on and which chapters use it; 'What Wave 1 left in the systems' made a subheading; teaser first sentences replaced. (AI-mediated session)\n- **2026-10-19** — Added 2 inline illustrations (article-illustrator); figures renumbered. (AI-mediated session)\n- **2026-10-19** — Editor: reconciled with multi-country-platforms (copies folded back into one codebase 2016-2018, origin of the country branches). (AI-mediated session)\n- **2026-10-19** — Editorial review pass: timeline checked against the six case pages; eight countries; AVIV CEO quote corrected (no 'unified'); mobile.de and Marktplaats 2004 dates separated; OLX Autos revenue dated; Central Asian sales as agreements; separability decision record dated March 2027. (AI-mediated se     (function () {

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,

                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');

            while (i < lines.length) {

                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
