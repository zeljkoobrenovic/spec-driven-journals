<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, acceptance criteria AC-1 to AC-3, thesis and role are copied unchanged from the experimentation entry in journal-spec.json; the hand-off uses ml-platform's transition_in. Units added by this conversion: roadmap p04, one lead-in each for Trade-offs (p47) and Vertical Differences (p48), and a synthesis paragraph p54 before the published hand-off.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The four contracts of an experimentation platform: assignment, exposure logging, governed metrics and one analysis engine (SRM checks, CUPED, sequential testing, cluster-aware inference).\n- **Know:** Interference in two-sided markets and the designs that address it: listing-side, two-sided, cluster, switchback and geo randomization, with their loss of power.\n- **Know:** Metric choice (liquidity first, revenue second), marketplace guardrails, experiments on ranking and prices, governance by risk and long-term holdouts.\n- **Believe:** A buyer- or seller-randomized test in a marketplace can measure a transfer between groups rather than an effect.\n- **Believe:** Pricing and ranking experiments are monetization and regulatory decisions that need an owner, pre-registered metrics and review.\n- **Be able to:** Choose the randomization unit for a change from the mechanism it works through.\n- **Be able to:** Set the guardrails that protect the side of the market not being tested.\n- **Be able to:** Decide which parts of experimentation the group centralizes first.\n\n**Audience:** Chief architects, heads of data and experimentation, search and monetization leads, and product directors in listing marketplaces.\n\n**Already knows:**\n\n- What an API, a database, an event stream, a search engine and Kubernetes are; what an A/B test is in general.\n- From earlier chapters: Veldmark (fictional) and its brands Tradeyard, Motorvane and Hearthly, the cast (Ingrid Halvorsen, Priya Raman, Olivier Petit, Lucía Ortega), the architecture advice forum, Valuo; contacts and liquidity (liquidity-and-network-effects, messaging-and-leads); ranking, paid-organic blending, the ranking guardrails and the September 2027 cluster experiment (ranking); paid visibility products such as top listings and bumps (monetization-models, products-and-entitlements); the qualified contact, governed metrics, the experiment_exposure event and provisional versus final metric values (data-platform); the failure patterns Vanity Liquidity and Multiplier Creep.\n\n**Does not yet know:**\n\n- The terms this chapter owns: interference, cluster randomization, guardrail metric.\n- Experiment-statistics vocabulary: SUTVA, randomization and analysis unit, primary metric (overall evaluation criterion), exposure, sample ratio mismatch, CUPED and variance reduction, sequential or always-valid inference, two-sided randomization, switchback and carryover, synthetic control, interleaving, surrogate models.\n- The Veldmark bump-price test, Experimentation standard v1 and the Tradeyard Belgium retest.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a test result that reverses at rollout, the reader explains the cause and designs the retest. *Probe:* A marketplace lowers the price of a paid 'bump' that moves a listing back to the top of newest-first results. A test randomized by seller account shows +48% bumps and +18% bump revenue for the cheaper price, with no loss of contacts per bumped listing. Eight weeks after rollout to everyone, bump revenue is down 2.5% and contacts per bumped listing are down 31%. Using only this chapter: what went wrong, and how should the retest be designed and governed? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** How do you run trustworthy experiments when buyers and sellers affect each other?\n\n> **Claim:** Because treated and control units in a two-sided market compete for the same buyers' attention and the same scarce listings, an experimentation platform should be built as four agreeing contracts (assignment, exposure log, governed metrics and one analysis engine), and each test should choose its randomization unit (buyer, seller, listing, cluster or time slot) by the mechanism the change works through, accepting the loss of statistical power that larger units bring; every test should be guarded on the side not tested by a control-trend guardrail, a congestion guardrail for paid visibility and a ranking guardrail set, and any test that changes visibility, prices, fees or trust thresholds should be pre-registered and reviewed before it starts.\n\n**Disputed by:** The common practice of randomizing users or seller accounts for every test, judging price and ranking changes by the treated group's revenue or purchases, and leaving experiment tooling to each team, so the test with the largest sample is trusted most.\n\n**So what:** A Chief Architect who accepts this funds one analysis engine and one exposure log tied to the governed metrics before standardizing flag tools; makes the randomization unit a platform capability with published cluster maps; classifies experiments by risk and requires pre-registration and review for visibility, price, fee and trust-threshold changes; mandates the marketplace guardrails and a long-term holdout; and watches the gap between experiment estimates and post-rollout effects for every major launch.\n\n**How and why:** Tradeyard NL's February 2027 bump test, randomized by seller account, showed a €1.99 price lifting bump revenue 18% (a forecast of about €6.8 million a year); after rollout revenue fell about 2.5%, roughly €950,000 a year below the old price, and contacts per bumped listing fell 31%. Control sellers' contacts per bump had fallen 9% during the test: a transfer, not an effect. The retest under Experimentation standard v1 (30 June 2027) randomized 96 region × category-group clusters in Tradeyard Belgium and estimated −3.3% (interval −6.2% to −0.4%), close to what rollout showed; the price was withdrawn on 6 December 2027.\n\n**Supporting claims**\n\n- **S1** — In a two-sided market treated and control units compete for the same buyers' attention or the same scarce listings, so a buyer- or seller-randomized test can measure a transfer between groups rather than an effect, and the bias can reverse the sign.\n- **S2** — An experimentation platform is four contracts (assignment, exposure log, governed metrics, one analysis engine) that must agree on unit, time and definitions, and a group should centralize the analysis engine and the metric definitions before flag tools and interfaces.\n- **S3** — The randomization unit (buyer, seller or listing, two-sided, cluster, time slot, geography) is chosen by the mechanism a change works through and which side is scarce, accepting the loss of statistical power that larger units bring.\n- **S4** — Liquidity metrics come first and revenue second, observed on both sides, and every test is guarded on the side not tested by a control-trend guardrail, a congestion guardrail for paid visibility and the ranking guardrail set, with long-term holdouts for cumulative effects.\n- **S5** — Experiments that change visibility, prices, fees or trust thresholds are monetization and regulatory decisions, so they are pre-registered with an owner, primary metric and guardrails and reviewed before they start.\n\n## Role in the part\n\nGives the platform a way to establish causation in a two-sided market, on the governed metrics and exposure log the data platform defines. Supports P7-5 of part `part-7`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in concepts before interference, designs and architecture, which use its terms; the requirements before the platform that supports them; `grouping` in trade-offs, verticals, failure-modes, ca-view, questions: the book's standard judging sections)\n\nThe bump test states the problem the chapter solves. Concepts give the terms every later section uses. Interference explains the mechanism behind the bump test, and the designs answer it directly after. Metrics and guardrails then say what to measure once the unit is fixed, and ranking and price experiments show where those choices become governance, which needs the metrics and guardrails already defined. The four contracts come after all of them because each platform requirement (unit types and cluster maps, two-sided exposure, governed metrics, cluster-aware inference, a registry for review) is the support one of those sections demands; placed earlier, as first published, the requirements arrived before the reader knew why they were needed. The architecture sits just before Veldmark's standard, whose first decisions are platform decisions, and the standard and retest can only apply the solution once all of it exists; the judging sections apply the whole design last.\n\n## Introduction\n\n**Hook** (`direct_statement`): An A/B test rests on an assumption so basic that most tools never state it: what happens to one unit does not depend on which group the other units are in.\n\n**Bridge:** The data-platform chapter gave Veldmark one definition of a contact and a log of exposures: trustworthy measurement. → The next question, causation: whether a change caused the movement, when buyers and sellers compete and the A/B test's basic assumption often fails.\n\n**Thesis statement** (KEY POINTS callout (three bullets), with p02 stating that interference can reverse the sign of a result.): An experimentation platform is four contracts that must agree; in a two-sided market the randomization unit is a design decision chosen by mechanism, at a cost in power; guardrails protect the side not tested, and price and ranking experiments need an owner, pre-registered metrics and review.\n\n**Roadmap** (Paragraph p04, which names the sections in order, with the IN THIS CHAPTER callout.):\n\n- Open with a Veldmark price test that reported a gain and delivered a loss. *Kept in:* scene.\n- Define the terms an experiment depends on. *Kept in:* concepts.\n- Explain how interference arises and which designs contain it. *Kept in:* interference, designs.\n- Choose metrics and guardrails. *Kept in:* metrics.\n- Treat ranking and price experiments as governance. *Kept in:* ranking-prices.\n- Set out the four contracts of the platform that supports all of it. *Kept in:* architecture.\n- Apply the design in Veldmark's experimentation standard and its retest of the bump price. *Kept in:* practice.\n- Close with trade-offs, vertical differences, failure modes, the Chief Architect's view and questions to ask. *Kept in:* trade-offs, verticals, failure-modes, ca-view, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | claim | An A/B test assumes that one unit's outcome does not depend on which group other units are in (SUTVA), which is close enough to true on a search engine or news site and often false in a listing marketplace, where buyers and sellers compete. | example: Buyers competing for the same apartment in Lyon; sellers competing for the first screen of a bike search in Rotterdam; a paid bump helping one listing only by moving another down. |  |\n| p02 | definition | When SUTVA fails, the treatment-control difference is the effect plus a transfer between groups, called interference, and the transfer can make an experiment report the wrong sign. |  | `cause_effect`: The assumption fails in marketplaces. → What the measured difference then contains: effect plus transfer. |\n| p03 | context | After the data platform gave Veldmark one definition of a contact and a log of exposures, this chapter asks whether a change caused a movement, an answer that decides which ranking, pricing and paid-product changes ship; it owns three terms and leaves offline model evaluation to other chapters. |  | `sequence`: Interference can reverse a result. → Where the chapter sits: after measurement, the question of causation, and which chapters send changes here. |\n| p04 | transition | The chapter follows a Veldmark price test, then covers terms, interference and the designs that contain it, metrics and guardrails, ranking and price experiments, the platform's four contracts, Veldmark's standard and retest, and the judging sections, drawing on published marketplace research, Adevinta, eBay, OLX and Zalando, EU consumer law and Veldmark. |  | `sequence`: The chapter's question and the terms it owns. → The order in which it answers. |\n\n## Sections\n\n### Setting the Scene at Veldmark: The Bump That Ate Itself\n\n**Controlling idea** (`example`, id `scene`): Tradeyard NL's seller-randomized bump-price test reported +18% bump revenue and delivered about −2.5% after rollout, because treatment sellers took first-page time from control sellers: the test measured a transfer, not an effect.\n\n**Advances the thesis** (S1, S4): Gives the case the whole chapter answers and shows the unwatched control trend.\n\n**Transition in:** `example`: Interference and the chapter's question. → The Veldmark bump test as the running case.\n\n**Order of paragraphs** (`chronological`): Proposal, test, forecast, rollout, diagnosis: the reader needs the reported result before the reversal, and the reversal before the explanation, or the transfer has nothing to explain.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | context | In January 2027 Olivier Petit proposed testing a cheaper bump on Tradeyard Netherlands, where a bump (the paid re-dating of a listing in newest-first results) cost €2.49, on the hypothesis that sellers of low-value goods would bump more if it cost less. | case: Bump at €2.49; a €40 lamp and a €240 city bike as the low-value goods. |  |\n| p06 | evidence | From 1 to 28 February 2027 half of Tradeyard NL's private sellers, chosen at random by account, saw €1.99 and half €2.49, and the results looked decisive. | table: Per-seller indices: bumps 1.48 (+48%), bump revenue 1.18 (+18%), contacts per bumped listing 0.99 (−1%, not significant), sellers buying a bump 11.2% vs 15.9% (+42%). | `sequence`: The proposal. → The test design and its results. |\n| p07 | analysis | The arithmetic made the case: 48% more bumps at a 20% lower price gave 18% more bump revenue per seller, a forecast of about €6.8 million on €38 million a year, and the price went live for all NL sellers on 6 April 2027. | statistic: 1.48 × 1.99 ÷ 2.49 ≈ 1.18; NL bump revenue about €38M a year; forecast +€6.8M; live Tue 6 Apr 2027. | `cause_effect`: The test's results. → The forecast and the rollout decision they produced. |\n| p08 | evidence | Eight weeks after rollout bump revenue was down about 2.5% instead of up 18%, because purchases rose only 22% while contacts per bumped listing fell 31% and first-page time per bump fell from 2.6 to 1.5 hours. | statistic: Bumps +22% YoY; 1.22 × 1.99 ÷ 2.49 ≈ 0.975; about €950,000 a year below the old price; contacts per bumped listing −31%; median first-page time 2.6 h → 1.5 h; repeat purchases falling. | `contrast`: The forecast of +18%. → What actually happened after rollout. |\n| p09 | analysis | Ingrid's question about the control group exposed the cause: control sellers' contacts per bump had fallen 9% during the test, so treatment sellers had taken first-page time from control sellers, a transfer that vanished at rollout when there was no control group left to take from. | statistic: Control sellers' contacts per bump −9% vs January; treatment flat.; figure: Figure 1: two pies; in the test one slice grows by taking from the other, at rollout the pie is cut into thinner slices. | `problem_solution`: The reversal, unexplained. → The diagnosis: a transfer from control sellers. |\n| p10 | transition | The rest of the chapter is the platform and method Veldmark built so the next price test would not repeat the error. |  | `cause_effect`: The diagnosed failure. → The platform and method the chapter now builds. |\n\n### Concepts: What an Experiment Must Get Right\n\n**Controlling idea** (`definition`, id `concepts`): A controlled experiment assigns, exposes, measures and attributes, and five terms (randomization unit, analysis unit, interference, cluster randomization, guardrail metric) plus primary metric and exposure carry the marketplace argument.\n\n**Advances the thesis** (S1, S3, S4): Gives the vocabulary every later section uses.\n\n**Transition in:** `sequence`: The bump test and the promise of a platform and method. → The vocabulary needed to describe them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p11 | definition | Explaining the bump test and building a platform that would have caught it needs precise terms: an online controlled experiment randomly assigns units to variants, exposes them, measures outcomes and attributes the difference, and five terms carry the marketplace-specific argument. | source: Kohavi, Tang and Xu, Trustworthy Online Controlled Experiments (Cambridge University Press, 2020).; table: Randomization unit, analysis unit, interference, cluster randomization, guardrail metric, each with definition and why it matters in a marketplace. |  |\n| p12 | definition | Two more terms recur in the metrics and architecture sections; the first, the primary metric, is the one metric a test is powered to move, chosen before the test so the winner cannot be picked afterwards. |  | `additional_support`: The five terms in the table. → Two further terms the later sections depend on, starting with the primary metric. |\n| p12a | definition | Exposure, the moment a unit meets the treatment, often comes well after assignment. | example: A seller assigned to a new bump price is exposed only when the price is shown. | `additional_support`: The first of the two further terms, the primary metric. → The second term, exposure. |\n\n### Interference: Why Marketplace Tests Report the Wrong Number\n\n**Controlling idea** (`cause_effect`, id `interference`): Interference in a listing marketplace comes from competition for attention, competition for scarce supply and market-level responses, its bias depends on which side is scarce, and published work shows it can be large.\n\n**Advances the thesis** (S1, S3): Explains the mechanisms behind the bump test and why the right design depends on scarcity.\n\n**Transition in:** `elaboration`: Interference as defined in Concepts, and the bump test as its case. → The three mechanisms that produce it and the size of its bias.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The mechanisms first, then the formal result on which side's randomization is biased, then the measured size of the bias; each step needs the one before.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p22 | claim | The bump test is one case of interference, which in a listing marketplace comes from three mechanisms, each suggesting a different design. | table: Competition for attention (paid bumps, boosts), competition for scarce supply (best Lyon apartments), market-level responses (price badges); what a naive test measures in each. |  |\n| p23 | evidence | Johari and colleagues showed that customer randomization is biased in supply-constrained markets, listing randomization in demand-constrained ones, and two-sided randomization can be close to unbiased at both, so the bias depends on which side is scarce, which varies by category and city. | source: Johari, Li, Liskovich and Weintraub (2020, revised 2021).; example: Buyers scarce for second-hand furniture in a small town; listings scarce for rentals in central Barcelona. | `elaboration`: The first two mechanisms. → Their formal analysis. |\n| p24 | evidence | The bias can be large: Airbnb's meta-experiment attributed at least 32.60% of a listing-randomized estimate to interference, through the same mechanism that undid the bump test. | quotation: Holtz et al. (2020): '32.60% of the Bernoulli-randomized treatment effect estimate is due to interference bias' (Bernoulli-randomized glossed as listing by listing), a lower bound.; figure: Figure 2: how the bump test misled under seller randomization, by the same mechanism as Airbnb's listings. | `emphasis`: That the bias exists and depends on scarcity. → How large it can be. |\n\n### Designs for Two-Sided Markets\n\n**Controlling idea** (`comparison`, id `designs`): Each randomization design (listing or seller, buyer, two-sided, cluster, switchback, geographic) trades bias for power, cost or speed, and the right one follows from the mechanism a change works through; interleaving adds power for ranking-model comparisons.\n\n**Advances the thesis** (S3): Gives the reader the designs and the rule for choosing among them.\n\n**Transition in:** `problem_solution`: Interference and its dependence on scarcity. → The designs that contain it.\n\n**Order of paragraphs** (`small_to_large`): Designs run from the finest unit (one side) to the coarsest (cities), so each larger unit is introduced as the answer to the interference the previous one leaves; the comparison table and decision figure follow all six, and interleaving comes last as a different tool for model comparisons.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p25 | claim | Each design trades bias for power, cost or speed, and the right one depends on the mechanism the change works through. | figure: Figure 3: six tiles splitting the market by buyer, listing, pair, region × category cluster, time slot and city. |  |\n| p26 | analysis | Listing- or seller-side randomization suits supply-side changes with diffuse buyer effects but is biased for anything that changes visibility, which was the bump test's error. |  | `sequence`: Designs in general. → The first, randomizing listings or sellers. |\n| p27 | analysis | Buyer-side randomization suits demand-side changes when listings are plentiful and is biased for ranking changes in supply-constrained cells. | case: A Veldmark carousel test randomized by user, reasonable because recommendations redistribute less attention than ranking. | `contrast`: Randomizing the supply side. → Randomizing the demand side. |\n| p28 | analysis | Two-sided randomization treats an interaction only when both buyer and listing are treated, which suits cases where it is unclear which side is scarce, at a cost in ranking-service complexity and units per cell. |  | `problem_solution`: One-sided designs, each biased when its side is not scarce. → A design for when scarcity is unclear. |\n| p29 | analysis | Cluster randomization assigns groups of units that interact mostly with each other and contains most interference at the price of power, so cluster maps should be published reference data built from observed interaction and checked for spillover. |  | `sequence`: Designs that split individual units. → Splitting whole groups of interacting units. |\n| p30 | example | Cluster randomization is also the only practical design for changes that cannot be split by user, such as SEO changes, where landing-page groups are randomized. | example: City × category landing-page templates measured by organic sessions; no classifieds company has documented its SEO testing design. | `additional_support`: Clusters to contain interference. → A second reason to use clusters. |\n| p31 | analysis | Switchbacks alternate a whole market between variants over time slots, but long carryover in listing marketplaces limits them to short-lived mechanisms and makes them poor for prices. | source: DoorDash 2018 (widely reported, not retrieved); Bojinov, Simchi-Levi and Zhao (2020, revised 2025) on carryover.; example: A listing bumped at 19:00 is still on page one at 21:00; a seller remembers yesterday's cheaper price. | `contrast`: Splitting by space. → Splitting by time. |\n| p32 | analysis | Geographic experiments assign whole cities or countries for market-level changes, but so few units force synthetic-control (a weighted mix of untreated cities as the comparison) or difference-in-differences analysis whose results are estimates with wide uncertainty, not A/B tests. |  | `sequence`: Clusters and time slots. → The coarsest unit, whole geographies. |\n| p32a | comparison | Across the six designs the trade-off runs one way: coarser units mean less interference and less power, and the first question in choosing is whether the change reallocates something units compete for. | table: Six designs by bias from interference, power, implementation cost and fit.; figure: Figure 4: choosing a randomization unit; first ask whether the change reallocates something units compete for. | `conclusion_summary`: The six designs, from the finest unit to whole geographies. → Their comparison in one table and the decision rule. |\n| p33 | analysis | Interleaving is not a seventh design but a ranking-model method: it merges two rankers' results on one page, adding large sensitivity for model comparisons while sidestepping buyer-side interference, but it cannot answer whole-page policy questions such as how many paid slots to show. | statistic: Airbnb 2025: up to 100× sensitivity from interleaving and counterfactual methods (Zhang et al., 2025). | `contrast`: Designs that split the market. → A method that compares models on the same page. |\n\n### Metrics: Liquidity First, Revenue Second, Both Watched\n\n**Controlling idea** (`recommendation`, id `metrics`): The primary metric decides what a marketplace learns, so liquidity outcomes lead and revenue follows, metrics are observed on both sides, guardrails include the control group's trend and congestion, and holdouts measure long-term effects.\n\n**Advances the thesis** (S4): Specifies the metrics and guardrails that protect the side not tested.\n\n**Transition in:** `sequence`: Designs that fix the randomization unit. → The primary metric and guardrails to measure in them.\n\n**Order of paragraphs** (`prerequisite_order`): The metric hierarchy comes first because guardrails are defined against it, and placed after them the guardrails would have nothing to protect; both-sided observation, then the guardrails, their computation, and finally long-term effects, which the short-run guardrails cannot see.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p34 | claim | Once the design fixes the unit, the primary metric decides what a marketplace learns; revenue is the easiest to defend and the most dangerous to optimize alone, so the hierarchy puts liquidity first, monetization second, behavior as diagnostics and health as guardrails. | table: Liquidity outcomes, monetization outcomes, behavior, health, with examples and use in experiments. |  |\n| p35 | explanation | A marketplace experiment's metrics must be observed on both sides, including sellers who did not bump and seller-side outcomes of ranking tests. |  | `elaboration`: The metric hierarchy. → Observing it on both sides. |\n| p36 | recommendation (list) | Besides the guardrails the ranking chapter applies to every ranking experiment, every marketplace experiment needs a control-trend guardrail and a congestion guardrail, either of which would have stopped the bump test. | case: Control sellers' contacts per bump −9%, visible by the second week; first-page time per bump as the congestible resource. | `sequence`: Metrics on both sides. → Guardrails that must not degrade. |\n| p37 | explanation | Guardrails need near-real-time computation for harm and final computation for the rest, which is why results are computed as a stream while a test runs and why provisional and final metric values are separated. |  | `elaboration`: The guardrails. → How quickly they must be computed. |\n| p38 | recommendation | Because marketplace effects compound, long-running holdouts and surrogate models measure cumulative and long-run effects, at a cost lower than discovering a supply decline a year later. | source: Airbnb Tech 2025: causal framework for long-term ranking effects from A/B data. | `contrast`: Short-run guardrails. → Effects that appear only over months. |\n\n### Experimenting on Ranking and Prices\n\n**Controlling idea** (`analysis`, id `ranking-prices`): Ranking, pricing, fee and trust-threshold experiments change who gets exposure and who pays what, so they are governance and are pre-registered and reviewed before they start: ranking tests are monetization tests, price tests raise supply, legal and contract concerns, and price badges need district randomization.\n\n**Advances the thesis** (S5, S3): Shows why visibility and price tests need owners and review.\n\n**Transition in:** `emphasis`: Metrics and guardrails for any experiment. → The two kinds of experiment where they become governance.\n\n**Order of paragraphs** (`grouping`): The claim that these tests are governance comes first; ranking, then prices, then price signals shown to buyers follow as its three cases, ordered from the change the reader already knows from the ranking chapter to the one with market-level interference.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p39 | claim | Ranking, pricing, fee and trust-threshold experiments are where experimentation becomes governance, because they change who gets exposure and who pays what, so each needs an owner and a unit, primary metric and guardrails registered and reviewed before it starts: a metric chosen after the results can be the one that won by chance, and a wrong unit cannot be repaired after the test. |  |  |\n| p40 | analysis | Every ranking change reallocates exposure among sellers, some of whom paid for it, so a classifieds ranking experiment is also a monetization experiment and reports paid-product delivery as a guardrail. | source: eBay 2020: one ranker for promoted and organic listings balancing relevance against cannibalization.; case: Veldmark's ranking-policy experiment, 6 Sep–17 Oct 2027, Tradeyard NL, category × region clusters. | `example`: Governance in general. → Ranking. |\n| p41 | analysis (list) | Price experiments add supply elasticity, fairness and law, and professional contracts, each requiring more than revenue measurement. | source: Directive (EU) 2019/2161, Article 6(1)(ea) CRD, recital 45; Commission guidance; Veldmark tests prices by cluster and publishes price lists.; statistic: OLX 2026: propensity-score matching estimated +17.6% to +97.4% between package levels, validated against a randomized test. | `additional_support`: Ranking as governance. → Prices. |\n| p42 | example | A price badge changes how buyers judge neighboring listings, a market-level interference, so Hearthly's pricing hint goes live on 22 November 2027 randomized by city district. | case: Hearthly pricing hint in Lyon and Bordeaux from 22 Nov 2027, district-randomized. | `additional_support`: Prices sellers pay. → Price signals shown to buyers. |\n\n### Architecture: The Four Contracts\n\n**Controlling idea** (`explanation`, id `architecture`): An experimentation platform is four components (assignment, exposure logging, governed metrics, an analysis engine) whose difficulty is agreement on units, timestamps and definitions, and the documented classifieds record supports centralizing the engine and metrics first.\n\n**Advances the thesis** (S2, S3): Specifies the four contracts and their marketplace requirements, and the order of centralization.\n\n**Transition in:** `cause_effect`: The designs, metrics, guardrails and review the previous sections require. → The platform components that must support them.\n\n**Order of paragraphs** (`grouping`): One paragraph per contract in the order data flows (assign, expose, measure, analyze), then the public record, then the author's reading of it; the recommendation needs both the components and the record before it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p13 | claim | Every design, metric and review above needs platform support: four simple contracts (assignment, exposure logging, metrics, analysis), with a registry that is not a fifth contract but the record all four read, fixing unit, metrics and owner before launch; the hard part is agreeing on units, timestamps and definitions. | figure: Figure 5: registry, assignment, exposure, governed metrics and analysis engine. |  |\n| p14 | explanation (list) | The assignment service hashes unit identifiers deterministically and, for a marketplace, must support several unit types, layers for mutual exclusion, and server-side evaluation for anything priced or ranked. | case: The September 2027 ranking-policy experiment and the bump-price retest of the next section could not share Tradeyard NL's clusters. | `sequence`: The four components. → The first, assignment. |\n| p15 | explanation | The exposure log records when a unit met its variant, using the experiment_exposure event, restricts analysis to exposed units, and must be two-sided, recording the sellers a change moved as well as the buyers who saw it. |  | `sequence`: Assignment of units. → Recording when assigned units met the treatment. |\n| p16 | explanation | Experiments consume the governed metrics computed by the same code as the board pack, so a test's contact is the business's contact. | example: A ranking test on qualified contacts per searcher and a board steering on qualified contacts per live listing must share the contact definition and its 72-hour fraud restatement. | `sequence`: Exposures logged. → The metrics computed over them. |\n| p17 | explanation | The analysis engine turns exposures and metrics into effects and decisions, and four capabilities (SRM check, variance reduction, valid early looks, cluster-aware inference, which every design described above requires) separate it from a dashboard. | table: SRM check (Zalando 2021), CUPED about 50% variance reduction at Bing (Deng et al. 2013), always-valid inference (Johari, Pekelis and Walsh 2015/2019) and safe testing on 162 Vinted experiments (Beasley 2023), cluster-aware inference. | `sequence`: Metrics. → The engine that analyzes them. |\n| p18 | recommendation | Because sequential and classical tests agree less on long-delay metrics such as contacts and sales, early stopping should be allowed on harm guardrails and used with care on the primary metric. | source: Beasley (2023): lower agreement for transactions and cancellations than for searches and sessions. | `elaboration`: Valid early looks in the engine. → A marketplace-specific limit on them. |\n| p19 | evidence | Adevinta's record shows a classifieds group consolidating ten testing tools across 22 marketplaces toward one in-house platform, Houston, through a hybrid build-and-buy decision. | source: Adevinta Tech Blog 2024 (ten tools in 2021, 'inefficiencies, redundancy and escalating costs', scoring matrix, hybrid decision) and 2023 benchmark of 21 companies ('crawling' band, 'keep building'). | `example`: The four components in the abstract. → The documented record of a classifieds group building them. |\n| p20 | evidence | The group's statistics came from one marketplace: Fisher, built at Marktplaats and used in most of its experiments, became the basis of Nightingale, Houston's engine. | source: Adevinta Tech Blog 2023: Fisher in more than 90% of Marktplaats experiments, about three hours of analyst time per experiment, Nightingale as Houston's engine. | `elaboration`: Adevinta's consolidation of tools. → Where its statistics came from. |\n| p20a | evidence | Beyond the statistics, Adevinta computed results incrementally on a stream so rollout problems show in near real time; all these posts predate the 2025 decentralization. | source: Adevinta Tech Blog 2023: Kafka Streams with user-level aggregates and weighted Welford updates; posts predate the 2025 decentralization. | `additional_support`: Where the group's statistics came from. → How results were computed in near real time. |\n| p21 | recommendation | The author's reading is to centralize the statistics engine and the metric definitions before the interface and flag tooling, because the same engine and contact metric make results comparable while the same tool with different metric code does not. |  | `conclusion_summary`: Adevinta's path from one marketplace's package to a group platform. → The recommendation it supports. |\n\n### In Practice: Veldmark's Experimentation Standard\n\n**Controlling idea** (`example`, id `practice`): Veldmark turned the bump post-mortem into Experimentation standard v1, and the cluster-randomized retest in Belgium estimated −3.3%, close to the rollout result, at the cost of wider intervals.\n\n**Advances the thesis** (S2, S3, S4, S5): Applies every claim to the bump case and shows the corrected answer.\n\n**Transition in:** `example`: The platform, designs, metrics and governance. → Veldmark's post-mortem and the standard that applied them.\n\n**Order of paragraphs** (`chronological`): Post-mortem, standard, retest, result: the standard must exist before the retest can follow it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p43 | context | The post-mortem reached the advice forum on 9 June 2027 framed as a platform gap: tools that could randomize only users and sellers, per-user t-tests, nobody watching the control, and about 640 experiments on three tools with three contact metrics. | case: Forum Wed 9 Jun 2027; about 640 experiments in 2026 across Tradeyard, Motorvane and Hearthly on three tools. |  |\n| p44 | recommendation (list) | Experimentation standard v1, adopted 30 June 2027, has six parts: one analysis engine first, unit types as a platform capability, governed metrics only, design review by risk, mandatory marketplace guardrails, and a 2% long-term holdout. | case: The six parts, owners (Priya Raman's Data & ML team, Olivier Petit's team, Lucía Ortega's regulatory team) and flag tools kept until 2028. | `problem_solution`: The platform gap. → The decision record that closed it. |\n| p45 | evidence | The retest ran 6 September–31 October 2027 in Tradeyard Belgium, because NL's clusters were reserved for the ranking-policy experiment (p40), with 96 region × category-group clusters, 48 per price, prices published per cluster. | table: Bumps +21% (+14% to +28%), bump revenue −3.3% (−6.2% to −0.4%), contacts per bumped listing −26% (−33% to −19%), first-page time 2.4 h → 1.5 h, qualified contacts per live listing 0% (−2% to +2%). | `sequence`: The standard. → The retest run under it. |\n| p46 | analysis | The cluster estimate was close to the NL rollout and far from February's, its wider intervals were the price of the right sign, and the €1.99 price, live in the Netherlands until the retest's result was reviewed, was withdrawn on 6 December 2027 in favor of a bump with guaranteed first-page time. | statistic: −3.3% vs about −2.5% after rollout vs +18% in February; 96 clusters vs hundreds of thousands of sellers; withdrawn Mon 6 Dec 2027. | `cause_effect`: The retest's results. → What they meant and the decision that followed. |\n\n### Trade-offs\n\n**Controlling idea** (`comparison`, id `trade-offs`): Seven recurring choices, each with a default given in the table (buy or build, centralization order, randomization, stopping, sensitivity, prices for professionals, long-term effects) each have a default the chapter's argument supports.\n\n**Advances the thesis** (S2, S3, S4): Turns the argument into decisions with defaults.\n\n**Transition in:** `conclusion_summary`: The design applied at Veldmark. → The choices it implies for any group.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p47 | recommendation | Building experimentation for a marketplace group means seven choices, and the table gives the default for each that follows from the sections above. | table: Platform, centralization order, randomization, stopping, sensitivity, prices for pros, long-term effects: options and how to choose. |  |\n\n### Vertical Differences\n\n**Controlling idea** (`comparison`, id `verticals`): The verticals differ in which side is scarce, the natural cluster, outcome delay and sample size, and real estate's small districts and slow outcomes leave Hearthly with longer cluster tests, variance reduction and validated leading indicators.\n\n**Advances the thesis** (S3): Shows how scarcity and power change the design choice by vertical.\n\n**Transition in:** `contrast`: Defaults for a group. → How they differ by vertical.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p48 | comparison | The verticals differ in which side is usually scarce, which cluster is natural, how long outcomes take and how much traffic a test gets, so the same design has a different cost in each. | table: General classifieds, real estate, automotive and jobs by scarce side, interference risk, natural cluster, outcome delay, pricing experiments and sample size. |  |\n| p49 | recommendation | Real estate matters most: few listings and buyers per district and outcomes months away leave Hearthly's honest options as longer cluster tests, stronger variance reduction, validated leading indicators and restraint about small effects. |  | `emphasis`: The comparison across verticals. → The row that matters most. |\n\n### Failure Modes\n\n**Controlling idea** (`analysis`, id `failure-modes`): Marketplace experimentation fails in recognizable ways when transfers pass for effects, revenue stands alone, SRM is ignored, results are peeked at, units are mismatched, experiments overlap, prices are assigned in the client, metrics disagree with the board, or the passive side is not logged.\n\n**Advances the thesis** (S1, S2, S3, S4): Shows the cost of ignoring each supporting claim.\n\n**Transition in:** `contrast`: What the right design looks like across verticals. → What goes wrong without it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p50 | analysis (list) | Ignoring the defaults produces nine recognizable failure modes, from the transfer mistaken for an effect to missing exposure logs for the passive side, each with its remedy. |  |  |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `ca-view`): The Chief Architect makes sure the platform can test prices, visibility and paid products by funding one engine and exposure log, making units a platform capability, reviewing by risk, mandating guardrails and keeping a holdout, with clear owners and the estimate-to-rollout gap as the report card.\n\n**Advances the thesis** (S2, S3, S4, S5): Turns the claims into decisions in order, with owners and measures.\n\n**Transition in:** `problem_solution`: The failure modes. → The decisions that prevent them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p51 | recommendation (list) | Preventing these failures is the Chief Architect's job, in five decisions in order: one analysis engine and exposure log, the randomization unit as a platform capability, risk classification with pre-registration and review, mandatory marketplace guardrails, and a long-term holdout. | statistic: A forecast that missed by nearly €8 million a year. |  |\n| p52 | recommendation | Ownership of the decisions is split among data and ML, product and monetization, the guild, legal and regulatory, and the Group Chief Architect. |  | `elaboration`: The five decisions. → Who owns them. |\n| p52a | recommendation | Five measures show whether the decisions work, and the gap between experiment estimates and post-rollout effects is the platform's real report card. |  | `sequence`: Who owns the decisions. → What to watch. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Ten questions test a marketplace's experimentation against the chapter: units, control trends, scarcity, metric definitions, two-sided exposure, early stopping, estimate-to-rollout gaps, price review, overlaps and holdouts.\n\n**Advances the thesis** (S1, S2, S3, S4, S5): Gives a working audit drawn from every section.\n\n**Transition in:** `cause_effect`: The Chief Architect's decisions and measures. → Questions that test whether they are in place.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p53 | recommendation (list) | Ten questions test whether those decisions hold in an organization's experiments. |  |  |\n\n## Conclusion: From Experiments to Models\n\n**Synthesis:** In the bump test seller assignment broke the no-interference assumption and nothing caught it (no guardrail watched the control, no review asked whether a cheaper bump only moves first-page time between sellers); the retest gave the right sign because unit, guardrails and review were set before launch, and it paid for that with wider intervals.\n\n**So what:** Experiment results decide which ranking, price and paid-product changes ship, so a platform that can split only users commits the business to changes whose real effect may have the opposite sign.\n\n**Callback:** The introduction's assumption that one unit's outcome does not depend on other units' groups, and the February 2027 bump test. The conclusion names the February test as the place the assumption broke and the retest as where the design made it hold.\n\n**Takeaway** (`course_of_action`): Set unit, guardrails and review before launch, and judge the platform by the gap between each experiment's estimate and the effect after rollout.\n\n**Hand-off** to [Models in Production: ML Platforms and Use Cases](ml-platform.html): `cause_effect`: Experimentation's closing: the experiment and data platforms give trustworthy measurements, and most of the changes they measure are now made by models. → How those models are trained, served, monitored and governed, by the decision each makes.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p54 | synthesis | In the February bump test seller assignment broke the assumption the chapter opened with while no guardrail or review caught it; the retest held because unit, guardrails and review were set before launch, and since experiments decide what ships, a platform that splits only users can commit the business to the wrong sign, which the gap between estimate and rollout effect reveals. | reasoning: Seller assignment, an unwatched control, no review of a congestible product; the retest's cluster unit, guardrails and wider intervals. |  |\n| p55 | transition | The experiment and data platforms give trustworthy measurements, and since most changes they measure are now made by models, how those models are trained, served, monitored and governed is the next chapter's subject. |  | `cause_effect`: Trustworthy measurement of changes. → The models that now make most of those changes. |\n\n## Non-goals\n\n- Governed metric definitions and exposure event design. See [Data Platform for Marketplaces: Events, Lakehouse and Data Products](data-platform.html).\n- Ranking models, offline evaluation and the ranking guardrail list in detail. See [Ranking for Two Sides: Relevance, Freshness and Paid Visibility](ranking.html).\n- Model lifecycle and governance. See [Models in Production: ML Platforms and Use Cases](ml-platform.html).\n- Monetization model design and package economics. See [How Listing Marketplaces Make Money](monetization-models.html), [Packages, Bumps and Quotas: Products, Pricing and Entitlements](products-and-entitlements.html).\n- Regulatory detail of personalized pricing and P2B. See [Rules of the Marketplace: DSA, DAC7 and Vertical Regulation](marketplace-regulation.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- No classifieds company has published an interference-aware design (cluster or two-sided) for its own experiments; the chapter relies on Airbnb research and Veldmark. Revisit if one appears.\n- Whether randomized consumer price tests trigger the personalized-price information duty is stated as a question for counsel; confirm against the consolidated Consumer Rights Directive.\n- DoorDash's 2018 switchback post could not be retrieved; it is cited as widely reported only.\n\n## Decision log\n\n- **2026-10-19** — Built the chapter on a seller-randomized bump-price test, because a paid visibility product sells a congestible resource and shows interference more clearly than a ranking model change (which ranking already uses for its cluster experiment).\n- **2026-10-19** — Recommended centralizing the stats engine and metrics before tools, following Adevinta's documented Fisher → Nightingale → Houston path, rather than a single-vendor standardization.\n- **2026-10-19** — Ran the Veldmark retest in Tradeyard Belgium rather than the Netherlands so that it did not overlap the ranking-policy cluster experiment, illustrating experiment layers.\n- **2026-10-19** — Reported the retest's wider intervals explicitly, to make the power cost of cluster designs part of the lesson.\n- **2026-11-12** — spec.md's six success criteria were content inventories or house-style rules; their reader outcomes are covered by the journal entry's outcome and AC-1 to AC-3 (AC-1 tests choosing a unit, guardrails and review for the bump case). None is carried over; 'every claim carries a dated source' stays a style-guide rule. Rejected: Carrying the criteria over as they were.\n- **2026-11-12** — Added a roadmap paragraph (p04) so a reader of the opening can predict the sections (AC-2); the IN THIS CHAPTER callout omits Concepts, the Veldmark standard and the judging sections. Rejected: Relying on the callout alone.\n- **2026-11-12** — Gave Trade-offs and Vertical Differences, whose tables opened their sections, one lead-in sentence each (p47, p48) so each table belongs to a unit. Rejected: Leaving the tables unattached, hidden from the draft readers.\n- **2026-11-12** — Flow rubric (sound with notes): kept the order; added a section flow to Experimenting on Ranking and Prices, recast the Metrics flow as prerequisite order, and said in the post-level rationale why the architecture precedes interference and what the governance section needs and enables. Other notes are listed in open_questions. Rejected: Moving Interference before Architecture, which would separate it from the designs that answer it.\n- **2026-11-12** — After draft check round 1 (escalate on one spec fault: both flow readers could not say why Architecture came before Interference): moved Architecture: The Four Contracts after Experimenting on Ranking and Prices, just before the Veldmark standard; rewrote the transitions into Interference, Metrics, Architecture and In Practice, the roadmap promise order and p04, and the post-level flow rationale. The analysis-engine table's pointer 'in the next section' became 'described above'. Rejected: Interference and Designs before Architecture with Architecture before Metrics (flow reader B), which would leave the Adevinta record apart from the standard it supports.; Keeping the published order with a forward-looking frame, which both readers' difficulty argues against.\n- **2026-11-12** — Added a synthesis paragraph (p54) to the conclusion that returns to the introduction's assumption and the February test; the published hand-off is kept as p55. Rejected: A one-paragraph conclusion that only hands off.\n- **2026-11-12** — Raised length.max_words from 6,433 to 6,650 (+3.4%, under the 10% allowance) so the round-3 draft faults could be fixed: the Concepts opening now picks up the bump test (p11); Interleaving is introduced as not a seventh design, under the renamed subheading 'a ranking-model method, not a design' (p33), and the table lead-in says 'the six designs'; the forward pointer to Adevinta's streaming computation was replaced by a statement of why results are streamed (p37); the ranking-policy experiment now names the June 2027 standard it followed (p40); p13 says the registry is not a fifth contract. Cheap minor fixes: Concepts names the three owned terms among the five; the four cells of two-sided randomization are spelled out; 'first key point' pointer reworded.\n- **2026-11-12** — The June–December 2027 gap before the €1.99 price was withdrawn (6 December 2027, ledger): neither the ledger nor the chapter gives a reason, so p46 says plainly that the price stayed live in the Netherlands until the retest's result was reviewed; no reason is invented and no date changed. Rejected: Inventing a reason such as waiting for the retest's significance or a contractual notice period.\n- **2026-11-12** — Argued the pre-registration and review rule in Experimenting on Ranking and Prices (p39): fee and trust-threshold
