taxonomy releases and Veldmark's bikes split.\n- Veldmark, its brands and cast, from meet-veldmark.\n\n**Does not yet know:**\n\n- Marketplace attribute design: dictionaries, requiredness levels, product versus instance scope, stewardship.\n- Entity-attribute-value storage and facet design on a search index.\n- Vertical reference data: VIN decoding, licensed vehicle taxonomies, property feed standards (RESO, OpenImmo).\n- Regulatory attributes: the French DPE and the German Pkw-EnVKV.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a request to change an existing attribute, the reader classifies the change and says how to ship it. *Probe:* A steward wants battery capacity to become required on e-bikes now, and separately to change mileage from kilometres to miles in one country. Using only this chapter: how is each shipped? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** How should listing attributes be modeled so they can be validated, searched, faceted and evolved per category and vertical?\n\n> **Claim:** Listing attributes need three layers with different owners: a dictionary that fixes each attribute's meaning, type, unit and allowed values; versioned category schemas that bind attributes as required, recommended or optional; and listing values with provenance. One schema service compiles these into forms, validators, search mappings, facets and feed mappings, and changes follow event-schema compatibility rules: an optional addition is safe, a new requirement ships with an effective date, and a change of meaning, type or unit creates a new attribute. The storage model may differ per brand.\n\n**Disputed by:** The view that attributes are a storage choice (wide columns, EAV or a JSON document) that each team, country or feed extends as needed, with forms, feeds and search each validating and interpreting values themselves, and that a group-wide definition is only worth having if it comes with one shared storage model.\n\n**So what:** A group that accepts this shares the dictionary, compiler, validator library and reference-data service but not storage, gives each vertical a named steward, makes a reviewed new attribute live in two working days, and tracks coverage, validity and the long-tail ratio. Veldmark mapped 2,310 of Tradeyard's 3,900 keys to 1,240 canonical attributes, retired 990 and kept 600 as country extensions, migrating first the 31 retired keys something still read.\n\n**How and why:** Attributes are read by more systems than any other part of the listing, so a key without a governed definition gets a different meaning in each: Tradeyard stored frame size under eleven keys, and 41% of its 3,900 keys were used on fewer than 0.1% of listings. Making a field required breaks every producer that does not yet send it, so battery capacity for e-bikes shipped as recommended with a required date of 1 March 2028 to give dealer feeds time.\n\n**Supporting claims**\n\n- **A1** — The Attribute Junkyard forms when attributes have no governed definition: attributes are read by more systems than any other part of the listing, so each system gives an ungoverned key its own meaning.\n- **A2** — An attribute's meaning, its binding to a category and its value are three layers with different owners, and the dictionary entry that fixes meaning records type, unit, allowed values, scope and the purposes that make every reader of the attribute visible.\n- **A3** — Attributes change under event-schema compatibility rules applied separately to producers and readers: an optional addition is safe, a new requirement ships recommended first with an effective date and is enforced on create and revise, and a change of meaning, type or unit creates a new attribute.\n- **A4** — The storage model may differ per vertical and brand, provided every attribute, including those held in typed vertical models, is registered in the one dictionary.\n- **A5** — One schema service compiles the dictionary and schemas into forms, validators, search and facet mappings and feed mappings that every system loads locally, so every channel validates with the same code and no write path depends on a request-time lookup; reference data, normalization targets and what each reader needs are defined in the same place.\n- **A6** — A group cleans up the Junkyard from an inventory of keys and their readers and keeps it from regrowing with federated stewards, a time target for new attributes and a few tracked numbers: coverage, validity and the long-tail ratio.\n\n## Role in the part\n\nDefines the attribute contract that ingestion validates, enrichment normalizes toward and search turns into filters and facets. Supports P2-3 of part `part-2`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in scene to schema-service: the Junkyard, then the layers, rules and service that prevent it; `chronological` in in-practice: Veldmark's seven cleanup steps)\n\nThe scene poses the question; the three layers give the vocabulary every later section uses; the dictionary entry and the category schema specify the definition and binding layers and the rules for changing them; reference data, normalization and readers' needs then fill in what the dictionary must hold; storage comes only after the dictionary is complete, so the reader sees that it matters less and meets the search-index trade-off just before the compiler that produces the search mapping; the schema service comes after all of them because it compiles every one of them (reference data, canonical units, purposes, sensitivity flags, feed mappings) into what each system loads; the public examples and Veldmark's cleanup apply the whole design; trade-offs, vertical differences, failure modes, the Chief Architect's view and review questions test and govern it. Storage before the dictionary's contents would answer the question architects ask first and leave the dictionary looking optional, and it interrupted the account of the dictionary for both round-1 flow readers; the schema service before reference data, normalization and the readers' needs would compile things the reader has not met.\n\n## Introduction\n\n**Hook** (`intriguing_example`): A listing titled \"Gazelle Chamonix, nice condition\" cannot be found by a buyer searching for a city bike with a 57 cm frame, three gears and a front basket.\n\n**Bridge:** Attributes in most platforms start as a few columns, then spread into key-value tables and per-country and per-feed keys that nobody reviews. → The chapter's subject: a contract that keeps one definition of each attribute true in every system that reads it.\n\n**Thesis statement** (KEY POINTS callout (all three bullets) and paragraph p03.): Listing attributes need three layers with different owners (a dictionary for meaning, versioned category schemas for binding, values with provenance), one schema service that compiles them into the forms, validators, search mappings and feed mappings every system uses, and event-schema compatibility rules for change, while each brand may keep its own storage.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p04, which names the sections in order.):\n\n- Veldmark's eleven keys for frame size. *Kept in:* scene.\n- The three layers of definition, binding and value. *Kept in:* layers.\n- What a dictionary entry holds, and how category schemas evolve under compatibility rules. *Kept in:* dictionary-entry, schemas.\n- Reference data, the normalization of values and what each reader needs. *Kept in:* reference-data, normalization, readers.\n- Storage models, and a schema service that compiles the dictionary and maps partner feed standards. *Kept in:* storage, schema-service.\n- Public examples and Veldmark's cleanup step by step. *Kept in:* in-practice.\n- Trade-offs, vertical differences, failure modes, the Chief Architect's view and questions for a design review. *Kept in:* trade-offs, verticals, failure-modes, chief-architect, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A listing title cannot answer a structured search, so attributes, the structured and typed facts about an item, drive filters, facets, ranking, validation and feeds, yet they get less design attention than almost any other part of the listing. | example: The title \"Gazelle Chamonix, nice condition\" against a search for a city bike with a 57 cm frame, three gears and a front basket. |  |\n| p02 | cause_effect | Neglected attributes grow into the Attribute Junkyard, thousands of duplicate keys whose cost appears far from its cause: in empty facets, in duplicate detection that cannot compare listings and in trust rules that never fire. |  | `cause_effect`: The neglect of attributes. → How the neglect accumulates into the Attribute Junkyard and what it costs. |\n| p03 | claim | Preventing the Junkyard takes a contract, and this chapter gives attributes one (dictionary, category schema, storage model, validation and governance) one layer below the category, which decides which schema applies but does not define it, without forcing one storage model on every brand; ingestion, enrichment and search then depend on that contract. |  | `problem_solution`: The Attribute Junkyard. → The contract that prevents it and the chapter's place between the category chapter and the chapters that depend on it. |\n| p04 | context | The chapter builds the contract in order: Veldmark's eleven frame-size keys, the three layers, the dictionary entry, how category schemas evolve, reference data, normalization and what each reader needs, then storage models, which matter less, and a schema service that compiles all of it and maps partner feed standards, then public examples and Veldmark's cleanup, and finally trade-offs, vertical differences, failure modes, the Chief Architect's view and review questions. |  | `sequence`: The parts of the contract. → The order in which the chapter takes them up. |\n\n## Sections\n\n### Setting the Scene at Veldmark: Eleven Ways to Say \"Frame Size\"\n\n**Controlling idea** (`context`, id `scene`): Veldmark's attempt to show one frame-size facet reveals the Attribute Junkyard in numbers at Tradeyard and attributes held in a different shape by each of its other brands, which poses the chapter's question.\n\n**Advances the thesis** (A1): Shows, at one group, that keys without a governed definition multiply and that no facet can be built from them.\n\n**Transition in:** `example`: The Attribute Junkyard described in general. → A concrete case of it at Veldmark in 2027.\n\n**Order of paragraphs** (`small_to_large`): The scene goes from one facet question to the group: Tradeyard's numbers, one listing that carries them, then the other two brands, ending in the question the chapter answers. Starting with the question would ask it before the reader has seen why it is hard.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | context | Weeks before Veldmark's group taxonomy and attribute service goes live and the bikes split ships, the Group Chief Architect asks what the new frame-size facet on the city-bikes page will show. | scenario: Late August 2027; service live for Tradeyard in October; bikes split on Monday 1 November 2027; Ingrid Halvorsen asks Daan Visser and Tomasz Wiśniewski. |  |\n| p06 | evidence | The answer is the Junkyard in numbers: 3,900 keys, 41% of them used on fewer than 0.1% of listings, frame size under eleven keys with many value formats, and a usable frame size on only about 23% of live Dutch bike listings. | statistic: Four country trees (NL 1,420 leaves, BE 1,380, PL 980, PT 760); 3,900 keys, 41% on fewer than 0.1% of listings; eleven frame-size keys; values such as 57, 57 cm, 22\", L; about 23% usable coverage. Figure 1. | `sequence`: The question about the facet. → The answer, as a spreadsheet of keys and values. |\n| p07 | example | Femke's city bike shows the cost on one listing: a bare 57 typed into a free-text field puts the bike in no frame-size filter. | case: Femke's Rotterdam city bike, €240, listed Sunday 7 March 2027, \"maat\" = 57. | `example`: The keys and values across Tradeyard. → One listing that carries them. |\n| p08 | evidence | The problem is not only Tradeyard's: Motorvane's VIN-decoded vehicle model and Hearthly's French and Spanish energy-performance fields each hold attributes in their own shape. | case: The Essen Golf's 31 decoded attributes with names differing from Tradeyard Poland's car section; the Lyon apartment's energy class D in documents structured differently in France and Spain. | `additional_support`: Tradeyard's sprawl. → The two other verticals, each structured differently. |\n| p09 | claim | The Group Chief Architect's question is the chapter's: can one dictionary and one schema service serve three verticals without forcing every brand into one shape and without a central team that every change queues for? |  | `conclusion_summary`: The three brands' attribute problems. → The question they add up to. |\n\n### Three Layers: Definition, Binding and Value\n\n**Controlling idea** (`definition`, id `layers`): Attribute problems start from treating an attribute's meaning, the categories that use it and the value on a listing as one thing; they are three layers with their own owners and rates of change.\n\n**Advances the thesis** (A2): Defines the three layers and reference data, and says what separating them gains.\n\n**Transition in:** `problem_solution`: Tradeyard's sprawl and the question whether one dictionary can serve all brands. → The distinction that the answer rests on: definition, binding and value.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | definition (list) | The three layers are the attribute definition, the category schema that binds definitions to a category and the attribute value with its provenance, each with its own owner and rate of change; the dictionary that collects definitions and reference data complete the vocabulary. | table: The layer table: question, typical owner, rate of change and example for definition, schema, reference data and value. |  |\n| p11 | analysis | Separating the layers makes meaning reusable, change local and ownership possible. | figure: Figure 2: one definition, schemas binding it, values with provenance badges. | `cause_effect`: The separated layers. → Three payoffs of the separation. |\n\n### The Attribute Dictionary Entry\n\n**Controlling idea** (`explanation`, id `dictionary-entry`): A dictionary entry is a small contract whose fields come from public marketplace dictionaries and from what downstream readers need; purposes and scope are the fields most often missing.\n\n**Advances the thesis** (A2): Specifies the definition layer: what a governed definition records.\n\n**Transition in:** `elaboration`: The definition layer, which the previous section named. → What one entry in the dictionary contains.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The section says where the fields come from, shows the two public models, combines them into a recommended entry, singles out the two fields most often missed and then fills one entry in. The example comes last because it uses every field the reader has just met.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p12 | context | Two kinds of evidence say which fields a dictionary entry needs: the public dictionaries marketplaces expose to sellers and the systems that read attributes downstream. |  |  |\n| p13 | evidence | eBay's Taxonomy API is the most complete public dictionary, recording per leaf category requiredness, selection mode, type, cardinality, product or item scope and an expected-required date. | source: eBay Taxonomy API specification v1.1.1 (n.d.): AspectConstraint fields and the warning that required aspects block listing or revising. | `example`: Public dictionaries as the first kind of evidence. → The most complete one. |\n| p14 | evidence | Amazon publishes its attribute requirements as JSON Schema 2019-09 with a small marketplace vocabulary on top, which shows a standard schema language extended for marketplace needs. | source: Amazon SP-API Product Type Definitions guide (updated 2026): editable, maxUtf8ByteLength, selectors, enumeration labels, version pinning. | `additional_support`: eBay's dictionary. → A second public model built on a standard. |\n| p15 | recommendation | Combining the public models with what downstream systems need gives a recommended dictionary entry of fourteen fields. | table: The field table: key, labels, description, type, unit, allowed values, mode, cardinality, scope, editability, purposes, sensitivity, mappings, owner and status. | `conclusion_summary`: The two public models and the needs of downstream readers. → The entry they add up to, labeled as a recommendation. |\n| p16 | transition | Purposes and scope are the two fields most often missing. |  | `emphasis`: The fourteen fields. → The two that matter most because they are usually absent. |\n| p17 | explanation | Purposes make an attribute's dependants visible, so the impact of a change is known before it is made. |  | `elaboration`: Purposes, the first missing field. → What it makes possible. |\n| p18 | evidence | Scope separates product facts a catalog match can supply from instance facts only the seller knows, as eBay's rolled-back catalog mandate shows. | source: eBay PBSE playbook (n.d., covers 2018–2020): catalog matching mandated, then rolled back; product versus instance aspects. | `sequence`: Purposes. → Scope, the second missing field. |\n| p19 | example | Veldmark's fictional frame-size entry shows the fields filled in, including a separate letter-size attribute. | table: The bike.frame_size_cm entry: labels in five languages, seat-tube meaning, integer cm with inch conversion, 30–70, purposes, related bike.frame_size_class, owner and status. | `example`: The recommended fields. → One entry written with them. |\n| p20 | analysis | Keeping letter sizes as a separate attribute is less elegant and more honest, because a letter size cannot be converted to centimeters reliably. | example: Size L is 54 cm from one brand and 58 cm from another. | `elaboration`: The related entry in the example. → Why it is a separate attribute. |\n\n### Category Schemas and How They Evolve\n\n**Controlling idea** (`explanation`, id `schemas`): A category schema binds definitions to a category through inheritance, three levels of requiredness and immutable versions, and it changes under compatibility rules applied separately to producers and readers.\n\n**Advances the thesis** (A3): Gives the binding layer and the rules under which it and the definitions change.\n\n**Transition in:** `sequence`: The definition layer. → The binding layer: category schemas and how they change.\n\n**Order of paragraphs** (`grouping`): The three design choices come first because the compatibility rules apply to schemas that are inherited, leveled and versioned; the event-platform vocabulary then frames the change table, and the section ends on the two rules the table leads to.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p21 | definition | A category schema is a list of bindings, and three design choices shape how it behaves over time. |  |  |\n| p22 | explanation | Attributes bound high in the tree are inherited by every leaf, and a leaf may tighten an inherited binding but not loosen it. |  | `sequence`: The three design choices. → The first: inheritance. |\n| p23 | explanation | Requiredness needs three levels, because the recommended level gives producers a runway before enforcement. | source: eBay's expectedRequiredByDate; Autotrader Connect (n.d.): breaking changes announced at least 30 days ahead, new mandatory parameters and validation errors listed as breaking. | `sequence`: Inheritance. → The second choice: three levels of requiredness. |\n| p24 | explanation | Schema versions are immutable and recorded on each listing, and they are separate artifacts from taxonomy versions. |  | `sequence`: Requiredness. → The third choice: immutable versions. |\n| p25 | context | Evolving schemas follows the compatibility logic of event platforms, which Confluent defines as backward, forward, full, transitive and none. | source: Confluent Schema Evolution and Compatibility (n.d.); backward is the default. | `similarity`: Versioned schemas. → The event-platform vocabulary for changing them. |\n| p26 | analysis | Applied to attributes, compatibility has two kinds of schema user to protect, producers and readers, and a change can be safe for one and breaking for the other. | table: The change table: seven kinds of change, their effect on producers and readers, and the rule the author uses. | `elaboration`: Compatibility logic. → Its application to attributes, with producers and readers judged separately. |\n| p27 | claim | A change of type, unit or meaning must create a new attribute, because changing it in place corrupts every historical value and every reader at once. |  | `emphasis`: The table's last two rows. → The rule they lead to. |\n| p28 | explanation | Enforcing a new requirement on create and revise rather than on all stored listings makes backfill gradual. | source: eBay: sellers blocked \"from listing or revising\" without required aspects.; figure: Figure 3: lifecycle of an attribute definition. | `elaboration`: The rule for making an attribute required. → Where it is enforced and what that does to existing listings. |\n\n### Reference Data: Makes, Models, Property Types and Energy Classes\n\n**Controlling idea** (`explanation`, id `reference-data`): Large controlled vocabularies are reference data with their own service, supplier mappings and provenance; in real estate and new cars regulation decides which of them are required and how they are computed.\n\n**Advances the thesis** (A5, A2): Defines reference data and shows the dictionary carrying legal obligations.\n\n**Transition in:** `elaboration`: The allowed values of a dictionary entry and the closed enumerations of the change rules. → Vocabularies too large for an enumeration: reference data, and how each vertical's differs.\n\n**Order of paragraphs** (`grouping`): Reference data is defined and its three sources announced, then grouped by vertical and by what drives it: cars (supplier trees, design rules, a Veldmark case, then the German labeling rules), property (French regulation) and brands (curation). Cars come first because they give the design rules the other groups reuse; the German new-car rules sit with the cars, so the passage moves from vehicles to property once, not back again.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p42 | definition | Enumerations do not scale to thousands of hierarchical, aliased and supplied values, which are reference data with their own service and governance, coming from suppliers, regulation or curation. |  |  |\n| p43 | evidence | Automotive reference data is the deepest case, with supplier taxonomies, reference endpoints and VIN decoding. | source: Autotrader Connect (n.d.) taxonomy to derivatives; mobile.de Seller-API (n.d.) reference endpoints, hsn, tsn, schwackeCode; NHTSA vPIC version 4.10 (2026). | `example`: Reference data in general. → Its deepest case, cars. |\n| p44 | recommendation (list) | Three design rules follow: keep identity, specification and listing apart; map licensed taxonomies to internal IDs; and record decode results with provenance and version. |  | `cause_effect`: Supplier taxonomies and decoders. → The design rules they force. |\n| p45 | example | The Essen Golf's decode conflict shows why decode results need provenance. | case: Autohaus Ruhrblick's DMS feed, Wednesday 14 April 2027; 31 decoded attributes; 96 kW and 110 kW candidates; dealer states 96 kW; market value €22,800. | `example`: The third rule. → A listing where it decides the outcome. |\n| p48 | evidence | Regulation shapes vehicle attributes too: Germany's passenger-car energy-labeling ordinance makes \"new\" a computed regulatory classification derived from registration date and mileage. | source: Pkw-EnVKV (amended 2026): consumption, CO2 and CO2 class once motorization data is shown; new if first registered at most eight months ago or with 1,000 km or less. | `additional_support`: The Essen Golf, where supplier data shapes vehicle attributes. → Regulation, which shapes vehicle attributes too: the German new-car labeling rules. |\n| p46 | evidence | Real-estate reference data is driven by regulation: French ads must show the DPE energy and climate classes, a warning for F and G, and estimated energy costs, and the classes affect rental eligibility and can move with a calculation change. | source: Service-Public.fr, DPE (2026): mandatory disclosures, fines of €3,000 and €15,000, G barred from new leases since 1 January 2025, F in 2028, E in 2034, electricity factor 2.3 to 1.9 from 1 January 2026. | `contrast`: Cars, where reference data comes mostly from supplier trees. → Real estate, where it comes almost entirely from regulation. |\n| p47 | recommendation | For the dictionary, DPE class, climate class and cost range are required in French residential schemas, with the DPE date and method as companions and rental eligibility derived. | case: The Lyon apartment's class D. | `cause_effect`: The French rules. → What they require of the dictionary. |\n| p49 | example | Brands sit between supplier trees and regulation, and Vinted's brand curation shows the pattern for turning free text into reference data. | source: Vinted Engineering, 2023: about two million brand strings to about 40,000 verified brands. | `additional_support`: Supplier-driven and regulation-driven reference data. → A third kind, curated from free text. |\n\n### Normalization of Units and Values\n\n**Controlling idea** (`recommendation`, id `normalization`): The dictionary defines the target of normalization: one canonical unit, the value as entered beside the normalized value, normalization on write, explicit special states and no conversion of what cannot be converted.\n\n**Advances the thesis** (A5): Puts the normalization target in the dictionary rather than in each reader.\n\n**Transition in:** `sequence`: Reference data, which fixes which values exist. → How entered values are brought to the dictionary's form.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p50 | recommendation (list) | Five rules belong in a group's attribute standard: one canonical unit per attribute, the value as entered kept beside the normalized one, normalization on write, explicit special states and no conversion of what cannot be converted. |  |  |\n| p51 | recommendation | Standard codes inside the dictionary cost nothing and save a mapping layer later. | source: schema.org Vehicle (V30.1, 2026): UN/CEFACT unit codes such as KMT; ISO 4217 currencies. | `additional_support`: The normalization rules. → Standard unit and currency codes. |\n\n### Attributes for Search, Trust, Ads and Feeds\n\n**Controlling idea** (`explanation`, id `readers`): Each reader needs something different from the same attribute, and the purposes field records it, so one definition serves search, trust, ads, outbound feeds and analytics.\n\n**Advances the thesis** (A2, A5): Shows one definition serving every reader through purposes and versioned mappings.\n\n**Transition in:** `elaboration`: Normalized values and the purposes field of the entry. → What each reader needs from them.\n\n**Order of paragraphs** (`large_to_small`): All readers first in one table, then the three rows that need prose, ending on outbound schemas, the last thing the dictionary must hold before storage and the schema service that compiles it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p52 | explanation | Different readers need different things from the same attribute, and the purposes field records which reader needs what. | table: The purposes table: facet, filter and sort, ranking feature, trust rule, ads targeting, outbound feeds and SEO, analytics, with the dictionary requirement and an example for each. |  |\n| p53 | transition | Three of the rows carry lessons the table cannot show. |  | `emphasis`: The purposes table. → The three rows that need more. |\n| p54 | evidence | Trust rules depend on attribute quality more than on rule cleverness. | case: The Barcelona fake rentals, priced about 35% below market, detectable only because district, surface and rooms were structured. | `sequence`: The three rows. → Trust rules. |\n| p55 | explanation | Ads targeting needs a sensitivity flag, because an attribute harmless as a filter can reveal too much about a viewer as a targeting key. |  | `sequence`: Trust rules. → Ads targeting. |\n| p56 | evidence | Outbound schemas are outputs, not models. | source: Google Search Central (2025): vehicle-listing structured data added October 2023, phase-out notices June 2025, removed September 2025. | `sequence`: Ads targeting. → Outbound schemas. |\n\n### Storage Models: Wide Tables, EAV, Documents and Typed Schemas\n\n**Controlling idea** (`comparison`, id `storage`): The storage choice matters less than the dictionary: a hybrid of typed core fields, validated documents and typed vertical models fits most groups provided every attribute is registered in the dictionary, and facets run on the search index, not on the store.\n\n**Advances the thesis** (A4): Shows that storage may differ per brand while meaning stays in the dictionary.\n\n**Transition in:** `contrast`: The dictionary's contents, now complete: definitions, schemas, reference data, normalization targets and what each reader needs. → The storage question, which architects usually ask first and which matters less.\n\n**Order of paragraphs** (`comparison`): The four models are defined and compared before the recommendation; the search index comes last because it applies the same comparison to the place where facets run, uses the purposes field the readers section explained, and leads into the compiler's search mapping.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p29 | claim | With the dictionary's contents in place, storage is the question architects reach for first and it matters less than the dictionary, though it constrains validation, queries and the cost of change. |  |  |\n| p30 | definition | There are four storage models: wide tables, entity-attribute-value (EAV) rows, validated documents and typed per-vertical models, and EAV is where junkyards grow fastest. |  | `elaboration`: The storage question. → The four answers to it. |\n| p31 | evidence | A document store needs a schema as much as any other, so a schemaless document store is EAV with better syntax. | source: PostgreSQL JSON Types documentation (current): jsonb_path_ops indexes, whole-row locking on update, advice to keep a somewhat fixed structure.; table: The storage comparison: strengths, weaknesses and when each model is right, with the hybrid as the last row. | `elaboration`: Validated documents, one of the four models. → Why validation is not optional for them. |\n| p32 | recommendation | The hybrid is the recommendation for a group, under the rule that typed vertical models are registered in the dictionary. | example: Motorvane keeps its Kotlin vehicle types, but vehicle.mileage_km is a dictionary entry with meaning, unit and mappings. | `cause_effect`: The comparison. → The recommendation it leads to and the one rule that makes it work. |\n| p33 | evidence | Whatever the primary store, faceted queries run on the search index, and Vinted's brand curation, described under reference data, shows that a dictionary decision has a measured search effect. | source: Vinted Engineering, 2023: facets over almost 600 million items, about 20% more CPU for about 71 ms faster item search, brands cut from about 2,000,000 to about 40,000, p99 about 15 ms lower. | `contrast`: The system of record's storage. → The search index, where facets are actually computed. |\n| p34 | analysis | The search index has its own storage dilemma between typed fields and generic structures, and the dictionary's purposes field decides which attributes get typed fields. | source: Elastic nested field type documentation (current): nested queries are typically expensive; flattened gives up typed range queries. | `similarity`: The storage hybrid. → The same trade-off inside the search index. |\n\n### Architecture: A Schema Service That Compiles\n\n**Controlling idea** (`explanation`, id `schema-service`): Schemas should be compiled into artifacts that every system loads locally rather than served by a request-time lookup, and the design rests on one validator for every channel, hard and soft validation outcomes, and readers that tolerate the unknown. Its inbound feed mappings make each partner standard a versioned mapping with an owner.\n\n**Advances the thesis** (A5): Designs the service that makes one definition true in every reader.\n\n**Transition in:** `problem_solution`: Everything the dictionary now holds (definitions, schemas, reference data, normalization targets, purposes and outbound schemas), needed by several stores and a search index. → The service that compiles it into what every system loads.\n\n**Order of paragraphs** (`large_to_small`): The principle comes first, then the components, then the three properties that matter more, then one Veldmark contract that applies them. The properties need the components in view, and the example needs the properties. The inbound feed mappings close the section in a subsection of their own: they are the one compiled output that faces partners, and the readers of rounds 2 and 3 found the feed standards out of place both among the readers' needs and under reference data.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p35 | claim | Everything the dictionary holds has to reach every system that writes or reads listings, and schemas should compile into artifacts for it, because a request-time schema service puts a network hop on every write path and turns a governance tool into an availability dependency. |  |  |\n| p36 | description (list) | The design has six components: a dictionary store, a schema compiler, a validator library, a reference-data service, release events and quality metrics. | figure: Figure 4: stewards change the dictionary; the compiler produces validator, forms, mappings and configurations loaded locally. | `elaboration`: Compiled artifacts. → The components that produce and distribute them. |\n| p37 | transition | Three properties of the design matter more than its components. |  | `emphasis`: The six components. → The three properties that matter more. |\n| p38 | explanation | Every channel validates with the same code and error codes, which removes the most common source of Feed Roulette. |  | `sequence`: The three properties. → The first: one validator. |\n| p39 | explanation | Validation has a hard and a soft outcome, and the schema says which rules block a write and which only flag a value. |  | `sequence`: One validator. → The second property: two outcomes. |\n| p40 | explanation | Readers ignore unknown attributes and map unknown values to a safe default, which is the reader-side half of backward compatibility and a coding standard. |  | `sequence`: Two outcomes. → The third property: tolerant readers. |\n| p41 | example | Tolerant readers make Veldmark's Listing event contract v1 work: it carries attributes as a typed map whose meaning comes from the dictionary, and readers ignore keys they do not know. | case: Listing event contract v1, live 1 July 2027: key, normalized value, unit and schema version per entry. | `example`: Tolerant readers and the compiled dictionary. → How Veldmark's event contract carries attributes. |\n| p57 | evidence (list) | The compiler's inbound feed mappings face partners, who bring vocabularies of their own: inbound feed standards set what they send, each with its own size and change rate. | source: RESO Data Dictionary 2.0 (n.d.): more than 1,700 fields and 3,100 lookups; OpenImmo (n.d.): about 250 features, 2.0 not compatible; Rightmove RTDF v1.4.0 (2022) and v1.4.1 (2023). | `elaboration`: The compiler's inbound feed mappings from partner standards, the one output that faces partners. → The vocabularies partners bring: inbound feed standards. |\n| p58 | claim | A feed mapping is a versioned artifact with an owner, not a transformation hidden in an importer. | case: Hearthly France's connectors to about 160 real-estate software vendors. | `conclusion_summary`: The three feed standards. → What they show about mappings. |\n\n### In Practice: Public Examples and Veldmark's Cleanup\n\n**Controlling idea** (`evidence`, id `in-practice`): Public examples show dictionaries published as data, schemas used as model inputs and policy encoded as validation rules, and Veldmark's seven-step cleanup shows a group turning 3,900 keys into one dictionary and keeping it.\n\n**Advances the thesis** (A1, A3, A4, A6): Shows the design in public practice and, in the fictional group, as a cleanup with governance.\n\n**Transition in:** `example`: The design built in the previous sections. → How it looks in public practice and in Veldmark's cleanup.\n\n**Order of paragraphs** (`chronological`): Public examples come first because they show each part of the design outside Veldmark; the cleanup then follows its own seven steps in time (profiling and decisions from June, the namespaces, the backfill finished by the end of September 2027, the bikes split of 1 November 2027, the other brands and governance), ending with the reader inventory because its value appears only once the steps are done.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p59 | context | The public record on attribute design is thin, but three groups of examples teach most of what is needed. |  |  |\n| p60 | evidence | eBay and Amazon publish their dictionaries as data that partners can diff and validate against locally. | source: eBay's fetchItemAspects bulk file (can exceed 100 MB compressed) and Taxonomy SDK; Amazon's JSON Schema contracts. | `sequence`: The three groups. → The first. |\n| p61 | evidence | Mercari and Etsy show the schema as an input to extraction models, which can fill a dictionary but cannot replace one. | source: Mercari Engineering (2024): attribute keys supplied at request time; Etsy via a secondary ZenML summary (2025): coverage 31% to 91%. | `sequence`: Dictionaries as data. → The second group: schemas as model inputs. |\n| p62 | evidence | Autotrader's validation errors show regulation and policy encoded as schema rules with stable error codes. | source: Autotrader Connect (n.d.): rejections for a price below a minimum and for DVLA category A or B write-offs. | `sequence`: Schemas as model inputs. → The third group: policy as validation. |\n| p63 | context | Veldmark's attribute work ran from June to October 2027 under Common Ground, and its numbers are fictional. |  | `contrast`: Public examples. → The fictional group's cleanup. |\n| p64 | process | Step 1 profiled every key: its usage per country and category, the value types observed and every reader that could be found. | statistic: About 410 million EAV rows, Polish Elasticsearch mappings, Portuguese forms; 3,900 keys. | `sequence`: The cleanup. → Its first step. |\n| p65 | process | Step 2 gave each key one of three fates: mapped into a canonical attribute, retired or kept as a country extension. | table: 2,310 keys mapped into 1,240 canonical attributes; 990 retired; 600 kept as country extensions; 3,900 total. | `sequence`: The profile. → The decision per key. |\n| p66 | analysis | Frame size's eleven keys became two attributes, and history, not language, was the largest source of duplicates. |  | `example`: The three fates. → What they did to frame size, and the main cause of duplicates. |\n| p67 | process | Step 3 organized the dictionary in three tiers (group core, vertical namespaces and country extensions), which answers the question of centralization. |  | `sequence`: Mapped and retired keys. → Where the kept ones live. |\n| p70 | process | Step 4 backfilled values without blocking listings, which raised usable frame-size coverage on live Dutch bike listings from 23% to 71% by the end of September 2027. | case: Femke's maat: 57 normalized to 57 cm with medium confidence, provenance seller-entered, unit inferred; the extraction pilot. | `sequence`: The namespaces. → Backfilling the values of existing listings. |\n| p68 | process | Step 5 shipped the bikes split's new e-bike attributes on 1 November 2027 under the compatibility rules: battery capacity recommended with a required date four months later, in two releases; the split's model re-classification of existing listings, with low-confidence cases left for seller confirmation, is told in the category chapter. | case: Eight inherited attributes; motor position, battery capacity and assist speed added; battery capacity required from 1 March 2028.; case: Listings that existed before 1 November re-classified by a model; low-confidence cases left in a transitional category until sellers confirmed at the next edit.; figure: Figure 5: two releases, recommended then enforced on create and revise once the readiness report shows feeds are ready. | `time`: The backfill, done by the end of September 2027. → The first schema change made in the new dictionary: the bikes split of 1 November 2027. |\n| p71 | process | Step 6 brought Motorvane and Hearthly into the dictionary without moving their storage, and search typing followed the dictionary too. | case: Motorvane's 212 vehicle attributes in vehicle.*; Hearthly's property.* with DPE companions and a separate Spanish certificate; typed index fields for about 610 of Tradeyard's original keys. | `sequence`: Tradeyard's bikes split. → The other two brands. |\n| p72 | process | Step 7 put governance on a clock: a reviewed new attribute is live in two working days, stewardship is federated, and the core changes only by decision record. |  | `sequence`: The brands joining. → The governance that keeps the result. |\n| p73 | analysis | Looking back over the seven steps, the reader inventory from step 1 was the cleanup's most useful by-product: 31 retired keys still had readers and were migrated first. | statistic: 31 of the 990 retired keys still read by something, mostly old reports and one partner export. | `emphasis`: The seven steps. → The single result that mattered most. |\n\n### Trade-offs\n\n**Controlling idea** (`comparison`, id `trade-offs`): Each choice in the design, from storage and dictionary scope to validation strictness, enumeration openness and release cadence, is right under stated conditions, and validation strictness is a liquidity decision.\n\n**Advances the thesis** (A3, A4): States when each recommended choice does not hold.\n\n**Transition in:** `contrast`: The one path Veldmark took. → The alternatives and when each is right.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p74 | comparison | Each choice in the chapter has a cost, and a table compares the main alternatives with the conditions for each. | table: Five decisions: storage, dictionary scope, validation, enumerations, schema evolution, each with two options and when to choose them. |  |\n| p75 | analysis | Validation strictness is a liquidity decision: the right set of hard rules is the smallest one that protects legal compliance and downstream integrity. |  | `emphasis`: The trade-off table. → The row with a business consequence. |\n\n### Vertical Differences\n\n**Controlling idea** (`comparison`, id `verticals`): Verticals differ most visibly in their attributes, which is why one dictionary with namespaces works better than one flat schema or separate systems.\n\n**Advances the thesis** (A4): Shows that the namespaced dictionary absorbs vertical differences that storage alone cannot.\n\n**Transition in:** `elaboration`: The dictionary-scope row of the trade-offs. → How far the verticals actually differ.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p76 | comparison | Attributes are where the verticals differ most, so one dictionary with namespaces works better than either one flat schema or separate systems. | table: Five verticals compared on attributes per listing, source of truth, reference data, regulatory attributes, main junkyard risk and typical storage. |  |\n| p77 | example | In jobs, mapping a free-text title to an occupation is probabilistic, so occupation carries a confidence score and an override. | source: ESCO v1.2.1 (European Commission, 2025): 3,039 occupations and 13,939 skills in 28 languages. | `example`: The vertical table. → The jobs vertical's reference data. |\n\n### Failure Modes\n\n**Controlling idea** (`cause_effect`, id `failure-modes`): Eight failures recur in attribute design, each with a control from the chapter.\n\n**Advances the thesis** (A1, A3, A5, A6): Names what goes wrong when each part of the design is missing.\n\n**Transition in:** `sequence`: The trade-offs and vertical differences. → What goes wrong in practice.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p78 | cause_effect (list) | Eight failures to look for first in a design review: unreviewed keys, meaning changed in place, requirements without runway, validation only in the interface, facet values drifting from the dictionary, readers that reject the unknown, sensitive attributes in the wrong place and a dictionary team as bottleneck, each with its control. |  |  |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `chief-architect`): At group scale attributes are a governance problem: share the dictionary, compiler, validator and reference data but not storage, give each layer an owner, measure five numbers and watch three long-term pressures.\n\n**Advances the thesis** (A4, A6): Gives the group-level decisions that keep the design in place.\n\n**Transition in:** `problem_solution`: The failure modes. → The decisions at group level that prevent them.\n\n**Order of paragraphs** (`order_of_importance`): Ranked by how much each decision constrains the others: what is shared decides who must own what, ownership decides who answers for the five numbers, and the long-term pressures matter only once the numbers are tracked. Putting the measures first would ask for numbers no owner is accountable for.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p79 | claim | At group scale attributes are a governance problem with an architecture attached, and the Chief Architect's decisions about them are few but durable. |  |  |\n| p80 | recommendation | The group should share the dictionary, compiler, validator library and reference-data service but not a storage model. |  | `sequence`: The few decisions. → The first: what is shared. |\n| p81 | recommendation | Stewards own definitions, category owners own bindings, the platform team owns the service, the architecture advice forum decides the core, and data protection reviews sensitive and regulatory attributes. |  | `sequence`: What is shared. → Who decides. |\n| p82 | recommendation | Five numbers show whether the dictionary works: coverage, validity, the long-tail ratio, time to a new attribute and facet coverage. |  | `sequence`: Who decides. → What to measure. |\n| p83 | recommendation | Three long-term pressures will test the design: model-generated attributes, regulation with effective dates and acquisitions bringing new dictionaries. |  | `sequence`: What to measure. → What to watch. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Ten review questions let a reader test their own platform's definitions, change process, validation, reader tolerance, legal attributes, purposes, reference data, long tail, provenance and sensitivity.\n\n**Advances the thesis** (A1, A2, A3, A4, A5, A6): Turns each supporting claim into a question a design review can ask.\n\n**Transition in:** `conclusion_summary`: The Chief Architect's decisions. → The questions a reader takes into a review.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p84 | recommendation (list) | The chapter's decisions become ten questions for a design review. |  |  |\n\n## Conclusion: From Attributes to Pictures\n\n**Synthesis:** The Attribute Junkyard was never a storage problem: it forms wherever each reader interprets an attribute itself, so putting meaning in one compiled, versioned dictionary is what lets storage stay per brand and lets attributes change without breaking producers or readers.\n\n**So what:** A group can answer yes to the opening question: Veldmark shares the dictionary, compiler, validator and reference data but not storage, ships a reviewed attribute in two working days and watches the long-tail ratio to see whether the Junkyard regrows.\n\n**Callback:** Ingrid's question whether one dictionary and one schema service can serve three verticals without forcing one shape on all brands or creating a central queue, and Femke's bare 57. The conclusion answers the question with the namespaces, the compiled artifacts and federated stewards, and notes that Femke's 57 now appears in the frame-size facet.\n\n**Takeaway** (`course_of_action`): Start with an inventory of your own keys and their readers, and measure the long-tail ratio before choosing any storage model.\n\n**Hand-off** to [Photos Sell: Media Pipelines for Listings](media-pipeline.html): `contrast`: The attribute dictionary, which describes what a listing says in words and numbers. → Pictures, which buyers judge first: a second and far larger body of listing data with its own pipeline, storage economics, privacy risks and fraud signals.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p85 | synthesis | The answer to the opening question is yes, because the Junkyard forms where readers interpret attributes on their own, not in any particular store: one compiled dictionary with namespaces and federated stewards lets each brand keep its storage, and Femke's 57 now reaches the facet. |  |  |\n| p86 | transition | The attribute dictionary describes what a listing says in words and numbers, but buyers decide on pictures first, and media is a second, far larger body of listing data that the next chapter takes up. |  | `contrast`: Attributes, the words and numbers of a listing. → Pictures and the media pipeline. |\n\n## Non-goals\n\n- The category tree, taxonomy versioning and category migrations. See [Category Trees That Can Change: Designing Marketplace Taxonomies](categories-and-taxonomies.html).\n- The normalization and enrichment pipeline, attribute provenance mechanics and LLM extraction design. See [From Raw Supply to Usable Listings: Normalization and Enrichment](normalization-and-enrichment.html), [AI Across the Listing Lifecycle](ai-in-listing-systems.html).\n- Feed contracts, error reporting to partners and ingestion channels. See [Many Doors In: Forms, APIs and Bulk Feeds](listing-ingestion.html).\n- Search index design, faceting performance and ranking. See [Search Architecture for Listings: Indices, Freshness and Scale](search-architecture.html), [Ranking for Two Sides: Relevance, Freshness and Paid Visibility](ranking.html).\n- The listing aggregate's lifecycle and invariants. See [The Listing Aggregate: Identity, Lifecycle and Invariants](listing-aggregate.html).\n- Event contract design. See [Every Change Is an Event: Event-Driven Listing Architecture](event-driven-listings.html).\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-10-19** — Organized the chapter around three layers (definition, binding, value) rather than around storage technologies, because storage choice matters less than the dictionary and readers usually start from the wrong end.\n- **2026-10-19** — Used event-schema compatibility (Confluent's backward/forward vocabulary) as the frame for schema evolution, applied separately to producers and readers. Rejected: A simple breaking/non-breaking list, too coarse for enumeration changes.\n- **2026-10-19** — Made the compiled-artifacts architecture the recommendation. Rejected: A request-time schema lookup service on the write path.\n- **2026-10-19** — Chose the frame-size key sprawl and the bikes split as the main Veldmark thread, with the Essen Golf decode conflict and the Lyon DPE fields as vertical counterpoints.\n- **2026-11-12** — Converted spec.md to spec.json. Success criteria: 'distinguish the layers', 'list the fields of a dictionary entry', 'compare storage models', 'describe a compiling schema service' and 'name the regulatory attributes' are kept as intent.outcome.know and tested through AC-1 to AC-3; 'classify a schema change and apply the rollout rule' is the journal spec's AC-1; 'follow Veldmark's cleanup numbers' and 'every company claim is dated and sourced' were inventories of contents and evidence format and are dropped (the style guide still governs sourcing). No acceptance criteria were added. Rejected: Carrying the success criteria over as written (inventories).\n- **2026-11-12** — Supporting claims A1 to A6 written here (the journal spec gives none for this post) from the thesis's parts: how the Junkyard forms, the three layers and the entry, compatibility rules, storage per brand under one dictionary, the compiling service, and cleanup with governance. For the author to confirm.\n- **2026-11-12** — Added a roadmap paragraph (p04) to the introduction so that a reader of the opening can predict the sections (AC-2). Rejected: Relying on the IN THIS CHAPTER callout, which names only the layers, storage, the schema service and Veldmark.\n- **2026-11-12** — Widened the conclusion from the hand-off paragraph alone to a synthesis paragraph (p85) that answers the scene's question and calls back to Femke's bike, followed by the hand-off (p86). Rejected: Leaving the synthesis to the Chief Architect's View, which is a body section.\n- **2026-11-12** — Flow rubric (sound with notes): moved Architecture: A Schema Service That Compiles from after Storage Models to after Attributes for Search, Trust, Ads and Feeds, so the compiler comes after everything it compiles (reference data, units, purposes, feed mappings); rewrote the transitions into reference data and the schema service, the roadmap (p04) and the opener of p35; p49 now points back to Vinted under storage. Rejected: Changing the declared reason to admit the compiler comes before its inputs.\n- **2026-11-12** — After draft check round 1 (ESCALATE on two spec-fault flow findings corroborated by both readers, plus a corroborated 'Storage unclear'): moved Storage Models from after Category Schemas to after Attributes for Search, Trust, Ads and Feeds (just before the schema service), so the account of the dictionary runs without a break and Vinted's brand curation is met under reference data first; moved p48 (Pkw-EnVKV) from after the French DPE paragraphs to directly after the Essen Golf (p45), so the passage goes from cars to property once. Transitions into reference data, storage, the schema service, p48 and p46 rewritten; roadmap p04 updated. Intent, thesis, role and criteria unchanged. Rejected: Keeping storage after the schemas and only stating the reason in its opener (both readers suggested the move).\n- **2026-11-12** — After draft check round 2 (ESCALATE on one spec-fault flow finding corroborated by both readers): moved the inbound feed-standards subsection (p57, p58) from Attributes for Search, Trust, Ads and Feeds to the end of Reference Data, because inbound standards are vocabularies partners send, not reader needs; transitions into p57 and Normalization rewritten. AC-2's expected answer (copied from the journal spec) still lists storage and the schema service before reference data; the journal spec is not edited from this pass, so this is left for the orchestrator. Rejected: Moving the subsection into the schema-service section next to the compiler's inbound mappings.\n- **2026-11-12** — Length limit set to the published draft's length plus 5% (8,633 words by check_draft's count, which includes callouts and tables; limit 9,065), because spec.md set no limit.\n- **2026-11-12** — Escalation resolved under the author's delegation: the inbound feed-standards subsection (p57, p58) moved from the end of Reference Data to the end of the schema-service section, beside the compiler's inbound feed mappings (the placement both round-3 flow readers proposed; the readers section was tried in round 1 and failed). Transitions into p57 and Normalization rewritten, the schema-service carry-over now names outbound schemas, roadmap p04 and its promise updated. AC-2's expected answer (journal spec) is out of order with this post; the replacement is handed to the orchestrator. Rejected: A section of its own for feed standards (one more heading for two paragraphs).; Retitling Reference Data to include partner vocabularies.\n- **2026-11-12** — Escalation resolved under the author's delegation: p69 (category re-classification) merged into the bikes-split step as a clause and evidence item, with all its facts kept, so it no longer interrupts the numbered steps. Rejected: Moving p69 before Figure 5 as a separate paragraph (it would separate the figure from the step it illustrates).\n- **2026-11-12** — Escalation resolved under the author's delegation: the cleanup steps stay declared chronological and the backfill (done by the end of September 2027) now comes before the bikes split (1 November 2027): old Step 5 is Step 4 and old Step 4 is Step 5. Ledger dates unchanged; transitions into p70, p68 and p71 rewritten. Rejected: Declaring the steps a grouping of overlapping workstreams (readers would still meet a later date before an earlier one).\n- **2026-11-12** — Supporting claims A1 to A6 accepted under the author's delegation, 2026-11-12.\n- **2026-11-12** — Thesis-rubric notes ('safe' mildly evaluative; how_why does not say why storage may differ per brand) accepted under the author's delegation, 2026-11-12: the thesis is copied from the journal spec and stays unchanged; no rewording is clearly better.\n- **2026-11-12** — Flow-rubric notes not taken in earlier passes (merge Vertical Differences into Trade-offs, merge signposts p37/p53/p59, cut p69 to a clause, p60's overlap with p13-p14, gloss Feed Roulette and the advice forum, p73 inside steps 1 and 2) kept as published, accepted under the author's delegation, 2026-11-12; p69 is now a clause under the escalation decision above.\n- **2026-11-12** — Round-3 single-reader minor points (no dictionary row in the layer table, Pkw-EnVKV placement, 'had decode and dealer disagreed silently', the Category Straitjacket only in the callout, JSON Schema 2020-12 beside Amazon's 2019-09, 'feed cycle') kept as published, accepted under the author's delegation, 2026-11-12; they did not block and no clearly better option was found.\n- **2026-11-12** — Carried-over research items kept as published, accepted under the author's delegation, 2026-11-12: Etsy's 31% to 91% stays with its stated secondary-summary caveat; EU EPBD recast obligations are not cited (no new real-law claim); vehicle reference-data licensing stays a design rule only.\n- **2026-11-12** — max_words raised from 9,065 to 9,300 (under the 10% allowed) for the transitions added by the moves above. Rejected: Cutting published text to make room.\n\n## Sources\n\n- **Internal**\n  - _journals/listing-systems-architecture/journal-spec.json — Intent outcome, acceptance criteria, thesis, role and the incoming transition and hand-off.\n  - posts/09-attribute-schemas/spec.md (accepted 2026-10-20) — Audience, non-goals, open questions, decision log, sources and changelog.\n  - categories-and-taxonomies, normalization-and-enrichment, listing-ingestion, search-architecture, media-pipeline — Neighbouring chapters and the hand-off.\n  - _research/brief-listing-data-ingestion.md (Parts 3, 4, 8, 11), brief-real-estate-portals.md (C.1, C.4, C.7), brief-automotive.md (A.2, A.3, A.7), brief-search-discovery.md (2.2, 2.7), scenario-ledger.md — Evidence and the Veldmark facts.\n- **External**\n  - eBay Taxonomy API specification and PBSE playbook — The public attribute-dictionary model and the product/instance split.\n  - Amazon SP-API Product Type Definitions — JSON Schema contracts with a custom vocabulary.\n  - Vinted Engineering, faceted search (2023) — Facets on the index; brand curation.\n  - Autotrader Connect and mobile.de Seller-API documentation — Vehicle taxonomies, reference data, breaking-change policy, validation rules.\n  - Confluent schema-evolution docs; PostgreSQL JSON docs; Elastic nested docs; NHTSA vPIC — Compatibility vocabulary, storage and index trade-offs, VIN decoding.\n  - Service-Public.fr (DPE), Pkw-EnVKV, RESO Data Dictionary, OpenImmo, Rightmove RTDF v1.4.1, ESCO — Regulatory attributes and feed and occupation standards.\n\n## Changelog\n\n- **2026-11-12** — Orchestrator review: reverted 'about 610 of the 2,310 mapped original keys' to the published 'about 610 of Tradeyard's original keys'; the ledger does not say the 610 are a subset of the 2,310. Check report stale.\n- **2026-10-19** — Initial spec and article. (AI-mediated session)\n- **2026-10-19** — Editorial review pass: acronyms expanded on first use (DMS, NHTSA), reading time corrected; frame-size baseline (23%) confirmed against the editor's ledger line; DPE, Vinted and ESCO figures re-verified. (AI-mediated session)\n- **2026-10-19** — Added 2 inline illustrations (article-illustrator); figures renumbered. (AI-mediated session)\n- **2026-10-20** — Cross-chapter consistency sweep: 2 headings aligned with the book's shared section names, glossary terms and source-group structure; no body text changed. (AI-mediated session)\n- **2026-10-20** — Sharpening pass: 7,807 to 7,867 prose words; lead now places the chapter in Part II; 1 heading renamed (\"In Practice: Public Examples and Veldmark's Cleanup\"); 3 long paragraphs split; \"four examples\" corrected to \"three groups of examples\". (AI-mediated session)\n- **2026-10-20** — Replaced 3 mermaid diagrams with generated illustrations (figure numbers and captions unchanged; sources in _research/mermaid-figures.json). (AI-mediated session)\n- **2026-11-12** — Converted spec.md to spec.json (outcome spec), reconstructed from the published text; status draft. (AI-mediated session)\n- **2026-11-12** — After draft check round 3 (ESCALATE): wording fixes only (p03, p04, p26, p33, p42, p71, p76, p85); no further round; check report stale. (AI-mediated session)\n- **2026-11-12** — After draft check round 2: feed-standards subsection moved into Reference Data; draft fixes (bikes-split gloss, layer table row order, producers no longer called consumers, sources of reference data announced, Amazon explained, event-contract tied to tolerant readers, step 6 tied to search typing, Trade-offs, Failure Modes and Chief Architect openers); trims to stay within 9,065 words. (AI-mediated session)\n- **2026-11-12** — After draft check round 1: storage section moved before the schema service; Pkw-EnVKV paragraph moved next to the Essen Golf; draft-fault fixes (layer table header, Barcelona and Common Ground glosses, 610 keys, event-contract opener, intro opener, change-of-meaning pointer, Questions lead-in, Golf market value, Lyon class D). (AI-mediated session)\n- **2026-11-12** — Flow rubric applied: schema-service section moved after the readers section; roadmap paragraph p04 and conclusion synthesis p85 added; transitions rewritten. (AI-mediated session)\n- **2026-11-12** — Escalation resolved under the author's delegation: feed standards moved to the schema-service section, p69 merged into the bikes-split step, Steps 4 and 5 swapped into date order, open questions closed into the decision log, max_words 9,300. (AI-mediated session)\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
