<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, acceptance criteria AC-1 to AC-3, the thesis and the role are copied unchanged from the advertising-platforms entry in journal-spec.json; the conclusion realises Part VI's closing (synthesis, so-what, callback, takeaway) from the same file, and the hand-off uses Part VII's part-level transition_in (re-read at the end of the pass, when Part VII had reached full detail). Units added or split by this conversion: introduction p02/p03 (split) and roadmap p04, concepts p12/p13 (split), one lead-in paragraph each for Trade-offs (p40) and Vertical Differences (p42), and a conclusion widened from one paragraph to three (p52 to p54).\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Advertising as three businesses (display and native, sponsored listings, retail media), the components of a marketplace ad stack and who owns each.\n- **Know:** The header-bidding timeout trade-off and page-speed rules for ad slots; why sponsored listings belong inside ranking and the regulatory floor for paid ranking (Omnibus, P2B, DSA Art. 26).\n- **Know:** Consent architecture (TCF, certified CMPs, the EDPB consent-or-pay opinion) and a first-party audience service with consent checks, exclusions, minimum sizes and controlled activation.\n- **Believe:** Consent and latency set the ceiling on display revenue, so changes to them are revenue changes and match-rate changes that need experiments and guardrails.\n- **Believe:** First-party intent data is the marketplace's advantage and its main liability, and data held in a neutral role stays out of advertising.\n- **Be able to:** Set an ad-change rule with contacts per session as the guardrail and run the experiment that tests it.\n- **Be able to:** Design an audience service whose segments are consented, purpose-bound and approved by the data-protection officer.\n- **Be able to:** Put every paid position, whoever sells it, under one relevance floor and slot cap and one invoice line.\n\n**Audience:** Chief architects, heads of ad tech and data, product and monetization leaders at marketplace groups who own or depend on an advertising unit; data-protection leads who must approve audience products.\n\n**Already knows:**\n\n- What an API, a database, an event stream, a search engine, a read model and Kubernetes are; page-speed basics such as largest contentful paint and the 75th percentile.\n- From earlier chapters: Veldmark (fictional) and its brands Tradeyard, Motorvane, Hearthly, Keybridge and Valuo, the cast (Ingrid Halvorsen, Noor Hassan, Priya Raman, Lucía Ortega, Felix Brandt), the architecture advice forum, Safe Deal, contacts and leads (messaging-and-leads), the relevance floor for top listings and paid-organic blending (ranking), the group product catalog and entitlement effects (products-and-entitlements), guardrail metrics (monetization-models), DSA labels and remunerated-ranking disclosure (marketplace-regulation), and the failure patterns Multiplier Creep, Vanity Liquidity, Billing by Guesswork and Ghost Inventory.\n- From the part introduction: the test for any paid product (which unit it charges for, what liquidity it spends, how delivery is proved).\n\n**Does not yet know:**\n\n- The terms this chapter owns: ad stack, first-party audience, sponsored listing.\n- Ad-industry vocabulary: ad server and line items, SSP, DSP, header bidding and Prebid, PMP deals, native ads, retail media, CMP, TCF and the TC string, ad load, CPM, eCPM, CPC, viewability.\n- Supply-chain files (ads.txt, app-ads.txt, sellers.json), clean rooms, and the EDPB's consent-or-pay opinion.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given three advertising conflicts, the reader names the component that decides each and the rule it applies. *Probe:* Your ad unit lengthened the header-bidding timeout and earned about 4% more per thousand page views while listing pages loaded half a second slower; it built an 'in-market' audience for a car maker from search behavior without a consent review; and sellers can buy a fixed-price top listing from the brand and a sponsored campaign from the ad unit for the same rows. Using only this chapter: what decides each, and what rule applies? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-4 | The chapter's last section performs Part VI's closing: it states what the five chapters build in common for every revenue line, says why that matters for Part VII, and returns to the part introduction's test of unit, liquidity spent and proof of delivery. *Probe:* Does the final section state something about Part VI that no single chapter states, say why it matters for Part VII, and return to the question the part introduction ends on? | `custom` | rubric | minor |\n\n## Thesis\n\n**Question:** How do marketplaces run advertising alongside listings without degrading the experience or breaking privacy law?\n\n> **Claim:** Advertising on a listing marketplace is three businesses that should run on three decision paths, display and native through an ad server with header bidding, sponsored listings inside each brand's search and ranking, and retail media through a consented first-party audience service, under one ad policy service, held as configuration by the product organization that owns the page, which sets ad load, labels, exclusions and the floors and caps on paid positions; changes to auction timeouts, slot counts or ad load ship only behind an experiment with contacts per session as the guardrail; fixed-price and auctioned paid positions share one relevance floor and slot cap; and audiences are built only from consented, purpose-bound sources, excluding special-category data, minors and data the group holds in a neutral role.\n\n**Disputed by:** The view that advertising is a separate business unit optimized against eCPM, fill rate and revenue per page view, which sets its own timeouts, ad load and sponsored placements on result pages and builds audiences from whatever behavioral data the group holds.\n\n**So what:** A Chief Architect who accepts this shares the ad server, header bidding, consent integration, audience service and measurement as one group stack but serves sponsored listings inside each brand's ranking, puts all paid positions in one product family in the group catalog, has the data-protection officer approve every audience purpose with exclusions enforced by access control, keeps the campaign, targeting and reporting model group-owned to limit vendor dependency, and shows eCPM and fill rate next to contacts per session and page speed on one dashboard.\n\n**How and why:** Veldmark Ads earned €100 million in 2026. Raising the Prebid timeout on Tradeyard Netherlands from 1,000 to 1,500 ms lifted programmatic revenue per thousand page views about 4% but worsened the 75th-percentile largest contentful paint from 2.4 to 2.9 seconds on a site where 46% of sessions start from organic search, and nobody measured contacts; in the July 2027 experiment, 900 ms with server-side bidders and lazy loading lost 1.9% of that revenue and gained about 1% in contacts, which is worth more because contacts drive renewals, VAS purchases and Safe Deal transactions. A car maker's 'electric SUV' segment fell from about 310,000 to about 240,000 users once consent purposes were checked. On Tradeyard Poland a seller could pay twice, on two invoices, for a Top listing and a Sponsored campaign claiming the same rows, the second outside the relevance floor.\n\n**Supporting claims**\n\n- **S1** — Advertising on a listing marketplace is three businesses with different buyers, auctions, latency budgets and rules (display and native through an ad server with header bidding, sponsored listings inside search and ranking, retail media through placements and first-party audiences), so they run on three decision paths rather than one ad stack.\n- **S2** — One ad policy service, held as configuration by the product organization that owns the page, sets ad load, labels, exclusions and the floors and caps on paid positions for all three paths; advertising rents positions under that policy.\n- **S3** — Consent and latency set the ceiling on display revenue: the consent record must reach every bid request and audience pipeline server-side, and the auction timeout, slot counts, ad load and the consent dialog are revenue and match-rate parameters that change only behind an experiment with contacts per session as the guardrail.\n- **S4** — Sponsored listings are decided inside ranking, and fixed-price and auctioned paid positions are one product family under one relevance floor, one slot cap and one invoice line, with a paid flag carried from campaign to rendering to meet the EU's paid-ranking rules.\n- **S5** — A first-party audience is a data product: segments are built only from consented, purpose-bound sources approved by the data-protection officer, exclude special-category data, minors and data held in a neutral or other-purpose role, have minimum sizes, and leave the platform only as identifiers in a clean room, never as exported lists.\n- **S6** — At group scale the generic ad stack (ad server, header bidding, consent integration, ads.txt, audience service, measurement) is shared under a group-owned campaign, targeting and reporting model that limits vendor dependency, while sponsored-listing serving stays in each brand's ranking and ad revenue is reported next to contacts and page speed.\n\n## Role in the part\n\nAdds the one revenue line paid for attention rather than matches, puts it under the same guardrails and product family as the others, and carries the part's closing into Part VII's platform demands. Supports P6-5, P6-6 of part `part-6`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in scene poses Ingrid's three arguments (timeout against page speed, an unreviewed audience, two products for one position); worked answers each with a decision after the body has built the design; `grouping` in trade-offs, verticals, failure-modes, ca-view, questions: the book's standard judging sections)\n\nThe scene comes first because its three arguments are the questions the chapter answers. The concepts follow because every later section uses ad-industry terms (ad server, SSP, header bidding, TC string, first-party audience) that marketplace engineers do not know; the scene glosses header bidding in passing. The architecture then lays out the three decision paths and the policy layer, path by path; consent follows it because its consequences name components the architecture introduced (Prebid Server, the audience service, app backends) and cut across all three paths; placed before the architecture, consent would be a list of rules for systems the reader has not seen. The public record comes right after the vocabulary and before the design, as the evidence that motivates it: advertising is large and cyclical on horizontals, and sponsored listings and audiences are decided in the marketplace's own systems; placed after the design, as first published, it repeated sources the architecture had already cited and separated consent from the worked example that applies it. The worked example can only replay the scene's three arguments once the timeout rule, the audience-service rules and the sponsored-listing design exist. Trade-offs, vertical differences, failure modes, the Chief Architect's view and the questions apply the whole design, so they come last, and the conclusion closes Part VI.\n\n## Introduction\n\n**Hook** (`direct_statement`): A marketplace earns its core revenue when buyers find the right listing quickly; it earns advertising revenue when they look at more pages.\n\n**Bridge:** Part VI so far: messaging-and-leads turned contacts into leads, monetization-models chose what to charge for, and products-and-entitlements proved that what was sold was delivered, all revenue paid for matches. → Advertising, the part's last revenue line and the only one paid for attention, sold to brands that sell nothing on the marketplace, so the architecture must decide where the balance between pages viewed and matches made is enforced.\n\n**Thesis statement** (KEY POINTS callout (three bullets), with p02 naming the three businesses.): Advertising is three businesses (display and native, sponsored listings, retail media) built as three products under one shared policy layer for labels, ad load, consent and data use; consent and latency changes are revenue changes that need experiments and guardrails; first-party intent data is used only through consented, purpose-bound segments that exclude sensitive and neutral-role data.\n\n**Roadmap** (Paragraph p04, which names the sections in order, with the IN THIS CHAPTER callout.):\n\n- Open with three arguments over Veldmark Ads that reached the Group Chief Architect in one week. *Kept in:* scene.\n- Define the vocabulary of the ad stack. *Kept in:* concepts.\n- Show the public record. *Kept in:* practice.\n- Set out three decision paths under one policy layer. *Kept in:* architecture.\n- Explain the consent signal behind display revenue. *Kept in:* consent.\n- Apply the design in three 2027 Veldmark decisions. *Kept in:* worked.\n- Close with trade-offs, vertical differences, failure modes, the Chief Architect's view, questions and Part VI's closing. *Kept in:* trade-offs, verticals, failure-modes, ca-view, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Advertising is Part VI's last revenue line and the only one paid for attention rather than for matches, so a marketplace that earns core revenue when buyers find the right listing quickly and ad revenue when they look at more pages must decide where the balance between the two is enforced. | reasoning: Part VI's chapters so far (messaging-and-leads, monetization-models, products-and-entitlements) priced matches; advertisers such as car makers, banks, insurers, energy suppliers and furniture retailers pay to reach an audience with commercial intent without selling anything on the marketplace. |  |\n| p02 | definition | \"Advertising\" hides three different businesses (display and native sold through an ad server, sponsored listings sold to sellers inside search results, and retail media sold to brands against the marketplace's own audiences), and the chapter owns the terms ad stack, first-party audience and sponsored listing. |  | `elaboration`: Advertising as one revenue line paid for attention. → The three businesses the word hides and the terms the chapter owns. |\n| p03 | context | Neighbouring chapters own paid-organic blending (ranking), the sale and entitlement of visibility products (products-and-entitlements) and revenue models (monetization-models), while the chapter's two platform demands, a consent signal on every event and contacts as the guardrail for every ad change, return in Part VII. |  | `contrast`: The terms this chapter owns. → What it leaves to neighbouring chapters and what it hands to Part VII. |\n| p04 | transition | The chapter runs from three arguments over Veldmark Ads through the vocabulary, the public record, three decision paths under one policy layer and consent, to three 2027 decisions, the judging sections and Part VI's closing. |  | `sequence`: The chapter's scope and neighbours. → The order of the sections. |\n\n## Sections\n\n### Setting the Scene at Veldmark: One Ad Unit, Three Arguments\n\n**Controlling idea** (`example`, id `scene`): Veldmark Ads, a €100 million shared unit, faced three arguments in one week of June 2027 (a longer auction against page speed, an unreviewed audience, two products for one position), which pose the chapter's question of which parts of advertising are one platform, which slots and data each may use and who decides conflicts.\n\n**Advances the thesis** (S1, S3, S4, S5): Shows the cost of a timeout set without contacts, an audience built without consent review and paid positions sold outside ranking, and poses the questions the body answers.\n\n**Transition in:** `example`: The three businesses and the conflict between pages viewed and matches made. → Veldmark Ads as the running example.\n\n**Order of paragraphs** (`problem_solution`): The unit and its revenue come first so the reader knows what is at stake; the three arguments follow, each a problem one of the later decisions answers; Ingrid's question closes the section so the reader carries it into the vocabulary and design.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | description | Veldmark runs one shared advertising unit, Veldmark Ads, which earned €100 million in 2026 on Google Ad Manager with Prebid header bidding (glossed as an auction run before the ad server decides), split across four products with different buyers and different places where they run: the three businesses, with display and native sold two ways, programmatic and direct. | table: 2026 revenue by product: programmatic display €41M (agencies through SSPs, ad server with Prebid), direct-sold display and native €26M (Veldmark Ads sales team, ad server), sponsored listings €19M (professional sellers on Tradeyard Poland and Motorvane, self-serve, served by each brand's search stack), retail media €14M (car makers, banks and insurers, ad server placements plus audience deals); total €100M. |  |\n| p06 | evidence | By inventory, Tradeyard pages earned €58 million, Motorvane €24 million and Hearthly €18 million, and Keybridge carries no advertising. | statistic: Tradeyard €58M, Motorvane €24M, Hearthly €18M; Keybridge none. | `additional_support`: Revenue by product. → Revenue by the brand whose pages carried the inventory. |\n| p07 | transition | In June 2027 three disagreements about advertising reached Ingrid Halvorsen, the Group Chief Architect, in the same week. |  | `time`: Veldmark Ads and its revenue. → The week in June 2027 when three arguments arrived. |\n| p08 | example | Raising the Prebid timeout on Tradeyard Netherlands from 1,000 to 1,500 ms lifted programmatic revenue per thousand page views about 4% but slowed listing pages from 2.4 to 2.9 seconds at the 75th percentile, on a site where 46% of web sessions start from organic search, and nobody measured contacts. | scenario: Q1 2027 timeout change 1,000 ms to 1,500 ms; +4% programmatic revenue per 1,000 page views; LCP p75 2.4 s to 2.9 s; 46% of Tradeyard web sessions from organic search; contacts not measured. | `example`: Three disagreements. → The first: page speed against bids. |\n| p09 | example | A car maker's 'in-market for an electric SUV' audience built from Motorvane search and saved-search behavior raised three questions the Group Data Protection Officer could not get answered: which consent purposes covered it, whether dealer-side data was used, and how it would be kept from leaving Veldmark. | scenario: Lucía Ortega's three unanswered questions about consent purposes, dealer-side data and leakage. | `sequence`: The first argument, over page speed. → The second: an audience nobody had reviewed. |\n| p10 | example | On Tradeyard Poland a seller could buy a brand-sold Top listing and a Veldmark Ads Sponsored campaign for the same first rows, paying twice on two invoices, and the sponsored units escaped ranking's relevance floor because a separate service inserted them. | scenario: Top listing (fixed price, seven days) and Sponsored (cost per click, self-serve, since 2026) claiming the first rows; two invoices from two systems; relevance floor not applied to sponsored units. | `sequence`: The second argument, over an audience. → The third: two products for one position. |\n| p11 | claim | Ingrid's question was not whether to sell advertising, which at €100 million Veldmark clearly should, but which parts of advertising are one platform, which slots and data each part may use, and who decides when they conflict. |  | `conclusion_summary`: The three arguments. → The single question they pose, which the rest of the chapter answers. |\n\n### Concepts: The Vocabulary of the Ad Stack\n\n**Controlling idea** (`definition`, id `concepts`): Two distinctions, media sold to advertisers versus visibility sold to sellers, and the first-party audience as a data product, shape the chapter, and a short vocabulary of ad-industry terms makes the rest readable.\n\n**Advances the thesis** (S1, S5): Separates display from sponsored listings and treats audiences as data products, the basis of two supporting claims.\n\n**Transition in:** `cause_effect`: Ingrid's question about which parts are one platform. → The distinctions and terms needed to answer it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p12 | definition | Display and native ads are a media business sold to advertisers who may have no listings, sponsored listings are a visibility product sold to sellers about their listings, and a first-party audience is a data product that needs purpose limitation, access control and ownership. | reasoning: The two distinctions and the pointer to data-platform for data products. |  |\n| p13 | definition | A table defines the ad-industry terms the chapter uses, most unfamiliar to marketplace engineers, from the ad stack and ad server to header bidding, the data clean room, the TC string, ad load and viewability. | table: Sixteen definitions: ad stack, ad server, SSP, DSP, header bidding and Prebid, PMP deal, native ad, sponsored listing, retail media, data clean room, first-party audience, CMP with TCF and TC string, ad load, CPM/eCPM/CPC, viewability with the MRC 50%-for-one-second rule. | `elaboration`: The two distinctions. → The vocabulary the chapter uses. |\n\n### In Practice: What the Public Record Shows\n\n**Controlling idea** (`evidence`, id `practice`): Public filings show advertising is large on horizontals, cyclical, built on SSPs as critical suppliers and, for sponsored listings and audiences, decided in the marketplace's own systems.\n\n**Advances the thesis** (S1, S6): Grounds the three businesses and the shared-stack argument in documented company facts.\n\n**Transition in:** `additional_support`: The vocabulary of the ad stack. → What companies have documented about the business those terms describe.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p32 | evidence | Marketplaces publish advertising revenue more readily than architecture, but their figures show how large and cyclical the business is and where its decisions run. | table: Seven rows: Adevinta 2023 advertising €312M of €1,826M (about 17%), €204M of €744M (about 27%) in European Markets, France down 7%; SSPs as key suppliers and revenue 'recognised as the ads are displayed'; first-party advertising in the convergence plan; eBay US$1,993M; CarGurus audience targeting; Autotrader £15.2M (+14%) next to £585.3M revenue; OLX VAS LTR. |  |\n| p33 | analysis | Display advertising follows the advertising market, not the marketplace's liquidity, so a group should never plan platform investments on display revenue growing with audience. | statistic: Adevinta European Markets earned more than a quarter of revenue from advertising while France reported a 7% decline driven by agencies and programmatic demand; Adevinta has been private since 2024. | `conclusion_summary`: The documented figures. → The lesson they support. |\n\n### Architecture: Three Stacks, One Policy Layer\n\n**Controlling idea** (`description`, id `architecture`): Veldmark's reference design keeps the display, sponsored-listing and retail-media decision paths apart, each with its own rules, and puts one policy service over all of them.\n\n**Advances the thesis** (S1, S2, S4, S5): Lays out the three paths and the policy layer, path by path, with the rules each path needs.\n\n**Transition in:** `cause_effect`: The public record: advertising is large, cyclical and, for sponsored listings and audiences, decided in the marketplace's own systems. → The reference architecture that follows from that record.\n\n**Order of paragraphs** (`grouping`): The overview and component table come first; then each path in turn, display (with native placements, which share its ad server), sponsored listings, retail media and the audience service, ordered from the most generic to the most marketplace-specific, so each path can be contrasted with the one before.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | description | Veldmark's reference architecture keeps three decision paths apart and puts one policy service, owned by the product organization as configuration, over all of them, with a named owner for each component. | figure: Figure 1: display and native decided by the ad server after header bidding, sponsored listings inside the search stack, retail media using both plus the audience service; one policy service sets ad load, labels, exclusions and floors; measurement reports contacts next to revenue.; table: Eight components with responsibility and owner: CMP (group privacy), header bidding, ad server, audience service (Veldmark Ads with Data & ML; DPO approves purposes), sponsored listing auction (each brand's search team), campaign and budget service, ad policy service (Group CPO's organization; configuration, not code), measurement and billing. |  |\n| p15 | process | A display impression on a listing page is a short distributed transaction with a hard deadline, from consent through bid requests, the ad server's decision and rendering to impression and viewability reports. |  | `elaboration`: The architecture as a whole. → The display path, step by step. |\n| p16 | explanation | The header-bidding timeout trades bids against page speed, as Prebid's documentation says, and because apps cannot run browser header bidding, server-side bidding through Prebid Server is not optional for a marketplace with much app traffic. | quotation: Prebid: late bidders 'will not be included in the auction'; finding the balance 'might require some time and experimentation'; Prebid Server 'required in environments that don't have HTML header sections'; Prebid Mobile works 'in conjunction with Prebid Server'.; figure: Figure 2: one display impression, timeout bounding the bid step, late bids dropped, consent string on every request, lazy-loaded slots below the fold. | `cause_effect`: A transaction with a hard deadline. → The trade-off that deadline creates and the server-side path. |\n| p17 | recommendation (list) | Five rules keep the auction off the page's critical path: never block listing content, reserve slot dimensions, lazy-load below-the-fold slots, move heavy bidders server-side, and treat the timeout as a product parameter with an owner and an experiment measured on contacts. |  | `problem_solution`: The timeout's trade-off. → The rules that limit its cost to the page. |\n| p18 | explanation | Supply-chain hygiene is part of the stack: ads.txt, app-ads.txt and sellers.json declare who may sell the inventory and must be kept in step with every SSP contract, per domain, app and brand. | quotation: IAB Tech Lab: ads.txt lets a publisher declare authorized sellers, 'making it harder for bad actors to profit from selling counterfeit inventory'. | `additional_support`: The rules for the page. → The configuration around the auction. |\n| p19 | recommendation | The ad server is a dependency to manage: Google Ad Manager is a reasonable default but a concentration risk after the April 2025 US antitrust ruling, so line items, targeting keys, creatives and reporting belong in a group-owned model that makes the ad server replaceable in a quarter. | source: US Department of Justice (2025): a court held Google 'violated antitrust law by monopolizing open-web digital advertising markets'. | `additional_support`: Configuration that tracks contracts. → The largest vendor dependency in the stack. |\n| p20 | claim | Native ads inside the result list must be labeled as advertising under the DSA, and their positions count against the same ad-load budget as sponsored listings because each is a position not given to the most relevant listing. | quotation: DSA Art. 26(1): recipients identify 'in a clear, concise and unambiguous manner and in real time' that the information is an advertisement, on whose behalf and who paid. | `place`: The display path and its ad server. → Native placements, which the same ad server fills inside the listing grid. |\n| p21 | evidence | Sponsored listings are the advertising product closest to the core marketplace, and public sources from eBay and OLX show that paid visibility lives inside ranking whatever team sells it. | statistic: eBay FY2025 10-K: Promoted Listings 'a first-party advertising offering' producing 'a meaningful amount of our revenue'; advertising revenue US$1,993M against US$79.6B GMV.; source: OLX Tech Blog (2025): a 'VAS LTR' model balancing relevance and visibility for paid listings, retrained when vector retrieval changed which paid listings were retrieved.; figure: Figure 3: campaigns and budgets in the ad unit's service; the decision which paid listings appear, where, above a relevance floor, made inside ranking from a read model; billing and attribution consume impression and click events. | `contrast`: Native ads, filled by the ad server. → Sponsored listings, which belong to the search stack. |\n| p22 | recommendation (list) | Five design choices keep paid positions inside the marketplace's rules: the auction runs inside ranking from a read model, budgets are paced, invalid traffic is filtered before billing, attribution reports contacts, and sponsored and fixed-price visibility products are one product family. | example: A campaign with €300 a day should not spend it in the first hour of a Sunday peak; overspend of a few percent is credited. | `cause_effect`: Paid visibility lives inside ranking. → The design choices that follow from it. |\n| p23 | claim | EU law sets a clear floor for paid ranking (undisclosed paid ranking is blacklisted for consumers, and business users must be told how payment affects ranking), so a sponsored listing needs a machine-readable paid flag from campaign to rendering. | quotation: Directive (EU) 2019/2161, UCPD Annex I point 11a: search results without clearly disclosing paid advertisement or payment for higher ranking; Regulation (EU) 2019/1150 Art. 5: describe the possibility to influence ranking against remuneration and its effects. | `additional_support`: The design choices for sponsored listings. → The legal floor they must meet. |\n| p24 | evidence | Retail media sells brands placements, audiences and measurement against outcomes the marketplace can see, as CarGurus, Autotrader and Rightmove show in their filings. | quotation: CarGurus FY2025 10-K: 'Audience Targeting' retargeting off site by 'geography, search history, CarGurus website activity', plus manufacturer and 'non-endemic programmatic advertisers'.; statistic: Autotrader FY26: Manufacturer & Agency revenue £15.2M, up 14%, expected to grow in FY27, small next to £585.3M Autotrader revenue but reported on its own and growing; Rightmove: about 10 million consumers subscribed to its marketing CRM. | `sequence`: The sponsored-listing path. → The third path: retail media. |\n| p25 | recommendation (list) | The first-party audience service concentrates the privacy risk, so Veldmark's five rules make segments reviewed data, check consent at build and activation, exclude special-category, minors' and neutral-role data at the source, never export raw data, and protect sellers' interests. | quotation: DSA Art. 26(3): no ads 'based on profiling … using special categories of personal data'; Art. 28(2): no profiling-based ads to recipients known 'with reasonable certainty' to be minors.; example: A car maker's audience built from Motorvane searches is, to a dealer, Motorvane selling its dealers' buyers to a competitor; Keybridge's agency CRM data is out of scope by policy and access control. | `cause_effect`: Retail media sells audiences. → Where that concentrates privacy risk and the rules that contain it. |\n\n### Consent: The Signal That Sets the Revenue\n\n**Controlling idea** (`claim`, id `consent`): Consent determines how much inventory can be sold with personalized targeting, so the consent record, the consent dialog and the fallback for users who decline are architecture decisions with revenue and legal consequences.\n\n**Advances the thesis** (S3, S5): Shows consent as the signal that sets display revenue and gates audiences.\n\n**Transition in:** `elaboration`: The three paths, each of which carries or checks consent. → Consent as the signal they all depend on.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The legal and industry frame comes first, then three consequences from the most technical (where the record lives) to the most strategic (what decliners see), and finally the dependency on third-party identifiers that the contextual fallback reduces.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p26 | context | All three paths depend on consent: EU law requires consent to read or store device identifiers, the industry encodes it through IAB Europe's TCF (v2.3, with a 28 February 2026 adoption deadline), and Google requires a certified TCF-integrated CMP for personalized ads in the EEA and UK since 16 January 2024. | source: IAB Europe TCF versions v1.1 (2018) to v2.3 (April 2025); 'TCF participants have until 28 February 2026 to adopt TCF v2.3'; Disclosed Vendors segment mandatory.; source: Google Ad Manager Help: 'a certified CMP integrated with the TCF', in force since 16 January 2024; traffic without it may still receive non-personalized or limited ads. |  |\n| p28 | claim | The first of three architectural consequences is that consent is per user, device, purpose and vendor and it changes, so the CMP's record must be available server-side to Prebid Server, the audience service and app backends, and withdrawals must propagate within a stated time. |  | `cause_effect`: The legal and industry frame. → Three architectural consequences, and the first: where the consent record lives. |\n| p29 | claim | The consent dialog is a revenue component and the most regulator-visible design decision in the stack, so changes to it belong under experimentation with legal review, not under a growth team's control. |  | `sequence`: The consent record. → The second consequence: the dialog that creates it. |\n| p30 | recommendation | Consent or pay is not a safe default after the EDPB's 2024 opinion, so the more robust design is consent or contextual, which a listing marketplace does unusually well because the page states the intent. | quotation: EDPB Opinion 08/2024 (17 April 2024): 'in most cases, it will not be possible for them to comply with the requirements for valid consent'; consider a free alternative 'without behavioural advertising'.; fact: No classifieds marketplace was on the Commission's list of designated very large online platforms when checked in October 2026.; figure: Figure 4: consent or contextual, decliners see ads targeted by category, location and price band. | `sequence`: The dialog. → The third consequence: what users who decline see. |\n| p31 | recommendation | Contextual targeting also keeps a marketplace's dependence on third-party identifiers low, which matters because browser identity plans keep changing, as Google's 2025 reversal on third-party cookies and Privacy Sandbox showed. | quotation: Google (October 2025): Chrome would 'maintain our current approach to offering users third-party cookie choice' and retire Topics and Protected Audience, citing 'low levels of adoption'. | `cause_effect`: Contextual targeting, which needs no third-party identifier. → Why reducing that dependency matters. |\n\n### Veldmark Worked Example: Three Decisions in 2027\n\n**Controlling idea** (`example`, id `worked`): In July 2027 the architecture advice forum answered the scene's three arguments with three decisions: a timeout set with contacts as the guardrail, audiences rebuilt from approved building blocks, and one product family of paid positions.\n\n**Advances the thesis** (S3, S4, S5): Applies the guardrail rule, the audience rules and the one-product-family rule to the scene's cases, with numbers.\n\n**Transition in:** `problem_solution`: The scene's three arguments, and the design and consent rules that answer them. → The decisions the forum took.\n\n**Order of paragraphs** (`problem_solution`): The decisions follow the order of the scene's arguments, so each answer meets its problem in the same position; within each decision, the evidence comes before the rule adopted.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p34 | transition | The architecture advice forum took three decisions in July 2027, each with a decision record. | fact: Three decisions in July 2027, each recorded. |  |\n| p35 | evidence | Priya Raman's team tested the timeout in a four-week user-randomized experiment on Tradeyard Netherlands with three arms, and the arm at 900 ms with server-side bidders and lazy loading was fastest and produced the most contacts. | table: Arms 1,500 ms / 900 ms / 900 ms server-side and lazy-load: programmatic revenue per 1,000 page views 100 / 96.8 / 98.1; LCP p75 2.9 / 2.5 / 2.3 s; search-to-contact rate 100 / 100.5 / 100.9; contacts per 1,000 sessions 100 / 100.6 / 101.0. | `example`: Three decisions. → Decision 1: the experiment on the auction timeout. |\n| p36 | recommendation | The forum adopted the third arm because about 1% more contacts is worth more than 1.9% of programmatic revenue, and made a rule that every change to ad timeouts, slot counts or ad load ships behind an experiment with contacts per session as the guardrail, with revenue that costs contacts decided by the CPO. | reasoning: Contacts drive renewals, VAS purchases and Safe Deal transactions; Noor Hassan decides revenue that requires fewer contacts.; figure: Figure 5: a balance scale with the faster page and more contacts outweighing slightly more ad revenue; a contacts gate for ad changes. | `cause_effect`: The experiment's results. → The decision and the general rule drawn from them. |\n| p37 | example | The car maker's electric-SUV audience was rebuilt from approved building blocks (Motorvane searches and saved searches in 30 days, consented users only, no dealer, Keybridge, Valuo or contact data, at least 1,000 users, off site only through a clean room), and the consent check cut it from about 310,000 to about 240,000 users, a 23% difference the original had ignored. | case: Segment of about 310,000 users in Germany falling to about 240,000 after the consent check; minimum 1,000 users per activation; private deals and on-site activation; off site only via clean room with aggregate reporting.; figure: Figure 6: an audience tower built from approved blocks only, excluded data outside, shrunk by a consent filter, off-site use only through a clean room. | `sequence`: Decision 1 on the timeout. → Decision 2: the audience rebuilt. |\n| p38 | recommendation | The forum accepted Felix Brandt's condition that car makers' retail-media placements stay off Motorvane dealer listing detail pages, because dealers paying €238 million a year in subscriptions matter more than a €14 million retail-media line. | statistic: Motorvane dealer subscriptions €238M a year against €14M of retail media; placements only on search, editorial and model pages; dealers see which placements ran next to their stock. | `additional_support`: The rebuilt audience. → A second condition on the same retail-media deal: where its placements may appear. |\n| p39 | example | Decision 3 took effect later, from Q1 2028: Top listing and Sponsored on Tradeyard Poland became one product family, two pricing modes for one slot type read by ranking from one read model under the relevance floor, with at most three paid positions in the first ten rows and one invoice line per seller per period. | case: Sponsored-listing revenue on Tradeyard Poland fell about 6% in the first months of 2028, after the floor, while contacts per paid position rose; Veldmark Ads keeps the auction, budgets and self-serve tool; the brand keeps the product description and slot rules. | `sequence`: Decision 2 on audiences. → Decision 3: one family of paid positions, signposted as taking effect later, from Q1 2028. |\n\n### Trade-offs\n\n**Controlling idea** (`comparison`, id `trade-offs`): Most ad-stack choices have two defensible options that depend on scale, privacy posture and the matching business, and the general rule is to own the decisions that use the marketplace's listings and audiences and rent the plumbing for generic display.\n\n**Advances the thesis** (S1, S6): Separates what a marketplace should own from what it should rent.\n\n**Transition in:** `conclusion_summary`: The design and its three applications. → The choices behind it, with the conditions for each option.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p40 | comparison | For seven recurring ad-stack choices, a table gives two options and the conditions under which each is right. | table: Ad server, header bidding, sponsored-listings owner, audience activation, users who decline consent, ad load, sales: option A, option B, when each is right. |  |\n| p41 | analysis | An in-house display ad server is rarely justified because demand sits in the programmatic ecosystem, but sponsored listings and retail media are decided in the marketplace's own systems anyway, so a marketplace should own the decisions that use its listings and audiences and rent the plumbing for generic display. |  | `conclusion_summary`: The table's seven choices. → The rule that sums them up. |\n\n### Vertical Differences\n\n**Controlling idea** (`comparison`, id `verticals`): Advertising's revenue share, buyers, sensitive data and main conflict differ by vertical, and real estate shows how a vertical's sensitive data shapes the audience rules.\n\n**Advances the thesis** (S5, S1): Shows the audience exclusions and the three businesses varying by vertical.\n\n**Transition in:** `contrast`: Choices that hold across marketplaces. → How the same choices differ by vertical.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p42 | comparison | Advertising differs by vertical in revenue share, buyers, sensitive data and main conflict. | table: General classifieds, real estate, automotive, jobs, recommerce across share of revenue from ads, main buyers, sponsored listings, sensitive data risk and main conflict. |  |\n| p43 | example | In real estate a property search reveals a household's budget and life events, so Hearthly's mortgage and insurance advertisers buy contextual placements and consented search audiences, and never segments derived from Valuo valuation requests, which were collected for another purpose. | scenario: The Hearthly rule: contextual placements by price band and region, audiences only from consented search behavior, no Valuo-derived segments. | `example`: Sensitive data varies by vertical. → The real-estate case at Veldmark. |\n\n### Failure Modes\n\n**Controlling idea** (`analysis`, id `failure-modes`): Advertising fails in recognizable ways when it escapes ranking, measures only revenue, stops consent at the browser, builds or exports audiences without controls, competes with sellers, runs unrestricted scripts, lets seller files go stale or keeps gone listings alive.\n\n**Advances the thesis** (S1, S2, S3, S4, S5, S6): Shows the cost of ignoring each supporting claim.\n\n**Transition in:** `contrast`: What the right design looks like across verticals. → What goes wrong without it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p44 | analysis (list) | Without the design, advertising fails in nine ways, from sponsored units inserted after ranking (Multiplier Creep by a second door) to ads on gone listings (Ghost Inventory monetized). |  |  |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `ca-view`): At group scale the Chief Architect decides five things about advertising: what is shared, who owns the page, what data advertising may use, how dependent to be, and how to measure.\n\n**Advances the thesis** (S6, S2, S5): Turns the design into group-level decisions.\n\n**Transition in:** `cause_effect`: The failure modes. → The questions a Chief Architect owns to prevent them.\n\n**Order of paragraphs** (`grouping`): One paragraph per question, from the structural (what is shared, who owns the page) to the operational (data, dependency, measurement), so the last question returns to the contacts the chapter measures against.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p45 | transition | At group scale, preventing these failures raises five questions for the Chief Architect's agenda. |  |  |\n| p46 | recommendation | The ad server, header bidding, CMP integration, ads.txt management, audience service and measurement are generic and belong to one group stack, while sponsored-listing serving belongs inside each brand's ranking and paid positions in the group product catalog. |  | `sequence`: Five questions. → The first: what is shared. |\n| p47 | recommendation | A listing page has one owner, the brand's product team, and advertising rents positions on it under a policy the product organization sets as configuration in the ad policy service. |  | `sequence`: What is shared. → The second question: who owns the page. |\n| p48 | recommendation | The audience service is a data product with DPO-approved purposes and hard exclusions (special categories, minors, Keybridge's neutral-role data, Valuo's other-purpose data), and every segment has an owner, a definition, a size and an activation log. |  | `sequence`: Who owns the page. → The third question: what data advertising may use. |\n| p49 | recommendation | A display business on one vendor's ad server and one browser's identity choices has two dependencies it does not control, so the campaign, targeting and reporting model stays group-owned, identity stays first-party and the exit plan is reviewed when the landscape changes. |  | `sequence`: What data advertising may use. → The fourth question: how dependent to be. |\n| p50 | recommendation | The group dashboard shows advertising's revenue, eCPM, fill rate and viewability next to contacts per session, search-to-contact rate and page speed, so measurement puts back the matches advertising does not depend on. |  | `sequence`: How dependent to be. → The fifth question: how to measure. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Ten questions let an architect test a marketplace's advertising against the chapter: paid positions under one floor, the timeout, consent reach, decliners, audience approval, exclusions, seller visibility, vendor exit, supply-chain files and labels.\n\n**Advances the thesis** (S1, S2, S3, S4, S5, S6): Gives the reader a working audit drawn from every section.\n\n**Transition in:** `cause_effect`: The Chief Architect's five questions. → Detailed questions that test whether they are answered.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p51 | recommendation (list) | Ten questions test the Chief Architect's five answers: whether a marketplace's paid positions, timeouts, consent, audiences, exclusions, seller visibility, vendor dependency, seller files and labels meet the chapter's design. |  |  |\n\n## Conclusion: From Revenue to the Platform Underneath\n\n**Synthesis:** The five chapters of Part VI give every revenue line three things: a record both sides can count (the lead ID, the order and transaction ledger, the entitlement ledger, and one invoice line for all paid positions), delivery events that prove the record, and a guardrail on what the line costs in contacts. Money is one pipeline because those records and guardrails are shared, not because one team sells everything.\n\n**So what:** Those records and guardrails are platform demands: the ad stack needs a consent signal on every event, a read model of paid positions inside ranking and measurement joining impressions to contacts, and the earlier chapters need leads and paid effects as events, one governed contact definition and guardrails on pricing tests; these are platform problems, which Part VII builds the shared platform to solve.\n\n**Callback:** The Part VI introduction's closing test (for any paid product, which unit it charges for, what liquidity it spends and how you would prove it was delivered). The reader can now answer the test for a Sponsored campaign on Tradeyard Poland from the chapter's design: a position priced per click; the organic listings it pushes down, within the relevance floor and three paid positions in the first ten rows; impression and click events from ranking proving delivery on one invoice line.\n\n**Takeaway** (`course_of_action`): Review every revenue change for its cost in contacts, with its record, delivery evidence and guardrail named before launch; Part VII begins with event-driven-listings, the event backbone these records ride on.\n\n**Hand-off** to [Part VII — PLATFORM: The Distributed System Underneath](part-7.html): `place`: The ad stack needed a consent signal on every event, a read model of paid positions inside ranking and measurement that joins impressions to contacts, and Part VI as a whole assumed events for leads and paid effects, contact counts and pricing tests without building them. → The distributed system beneath every stage: events, copies, the public web, data, experimentation, ML, tenancy and reliability, starting with the event backbone in event-driven-listings.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p52 | synthesis | Ingrid's question is answered (the ad stack and one policy layer are shared, the policy service and DPO-approved audience blocks set which slots and data each business may use, the forum settles conflicts and the CPO decides revenue that costs contacts), and Part VI's five chapters give every revenue line a record both sides can count, delivery events that prove it and a guardrail on what it costs in contacts, so money is one pipeline because its records and guardrails are shared, not because one team sells everything. | reasoning: The lead ID (messaging-and-leads), the order and transaction ledger (transactions-and-payments), the entitlement ledger (products-and-entitlements) and one invoice line for paid positions (this chapter). |  |\n| p53 | synthesis | The part introduction's test can now be answered for a Sponsored campaign on Tradeyard Poland: it charges per click for a position, spends the organic listings it pushes down within the relevance floor and slot cap, and is proved delivered by impression and click events on the seller's one invoice line. | scenario: Tradeyard Poland Sponsored (cost per click) under the relevance floor and at most three paid positions in the first ten rows, from Q1 2028; impression and click events consumed by billing. | `example`: Records, delivery events and guardrails shared across the part. → The part introduction's test applied to one paid product of this chapter. |\n| p54 | recommendation | These records depend on systems beneath every brand (consent on every event, a read model of paid positions, measurement joining impressions to contacts, leads and paid effects as events, a governed contact definition, guardrails on tests), so every revenue change should be reviewed for its cost in contacts, and Part VII turns to that distributed platform, starting with the event backbone. |  | `cause_effect`: A test answered from shared records. → What those records demand of the platform, and the hand-off to Part VII. |\n\n## Non-goals\n\n- How paid and organic candidates are blended and evaluated in ranking. See [Ranking for Two Sides: Relevance, Freshness and Paid Visibility](ranking.html).\n- Product catalog, pricing and entitlements for visibility products. See [Packages, Bumps and Quotas: Products, Pricing and Entitlements](products-and-entitlements.html).\n- Revenue model comparison and KPIs. See [How Listing Marketplaces Make Money](monetization-models.html).\n- Tracking plans and consent on behavioral events in general. See [Data Platform for Marketplaces: Events, Lakehouse and Data Products](data-platform.html).\n- Core Web Vitals and SEO. See [Found by Google: Web, App and SEO Architecture for Listings](web-and-seo-architecture.html).\n- Full regulatory analysis. See [Rules of the Marketplace: DSA, DAC7 and Vertical Regulation](marketplace-regulation.html).\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-10-19** — Split advertising into three businesses rather than describing one 'ad stack', because their decision points (ad server, ranking, audience service) and owners differ, and the conflicts between them are the chapter's real subject.\n- **2026-10-19** — Invented a Veldmark Ads revenue split (programmatic €41M, direct and native €26M, sponsored listings €19M, retail media €14M; inventory Tradeyard €58M, Motorvane €24M, Hearthly €18M) summing to the ledger's €100M, and recorded it in the ledger.\n- **2026-10-19** — Measured ad decisions against contacts in the worked example, tying the chapter to the book's liquidity thesis instead of to ad-industry metrics alone.\n- **2026-10-19** — Kept consent mechanics here and linked to data-platform for ePrivacy basics, to avoid repeating chapter 36.\n- **2026-11-12** — spec.md's seven success criteria were inventories in substance (figures and tables present, regulations cited, the Veldmark figure used); the reader outcomes behind them are covered by the journal entry's outcome (know, believe, can_do) and AC-1 to AC-3, so none is carried over. 'Every company claim carries a dated source' is a house-style rule, kept in the style guide. Rejected: Carrying the criteria over as they were.\n- **2026-11-12** — Added AC-4 (minor, custom rubric) so the post checks that its last section performs Part VI's closing, mirroring Part VI's AC-4 in the journal spec. Rejected: Leaving the part closing unchecked at post level.\n- **2026-11-12** — Split the published second introduction paragraph into the three businesses with the owned terms (p02) and the neighbours with the Part VII demands (p03), because it held two ideas, and added a roadmap paragraph (p04) so a reader of the opening can predict the sections (AC-2). Rejected: Relying on the IN THIS CHAPTER callout, which names the businesses but not the sections.\n- **2026-11-12** — Split the Concepts paragraph so the two distinctions (p12) and the sentence introducing the terms table (p13) are separate units, with the table as p13's evidence.\n- **2026-11-12** — Gave Trade-offs and Vertical Differences, whose tables opened their sections, one lead-in sentence each (p40, p42) so each table belongs to a unit. Rejected: Leaving the tables unattached, which hides them from the draft readers.\n- **2026-11-12** — Widened the conclusion from one paragraph to three (Part VI synthesis, the part introduction's test answered for a Tradeyard Poland Sponsored campaign, platform demands with takeaway and hand-off) to carry Part VI's closing, as the journal spec requires; the published sentences are kept in p52 and p54, and the hand-off now names Part VII's 'distributed system beneath every stage' (relationship place). Rejected: Putting Part VI's closing in the Chief Architect's View.\n- **2026-11-12** — Flow rubric (sound with notes): merged the one-sentence signpost 'Three architectural consequences follow.' (former p27) into p28. Rejected: Keeping a signpost as its own unit.\n- **2026-11-12** — Draft check round 1 (escalate): both flow readers found the public record's position unclear (fault spec). Moved 'In Practice' from after Consent to after Concepts, as evidence that motivates the design, and rewrote the transitions into practice, architecture and worked plus the roadmap (p04) and flow rationale. Draft revised at the failing units: table explanations (p05, p14), section openers (consent, trade-offs, failure modes, ca-view, questions), glosses for header bidding, key-values, AMP and clean room, Ghost Inventory, the forum principle, and 'match rate' replaced by contacts in the conclusion; the four-catalogs clause dropped from p54 to stay within the word limit. Rejected: Raising max_words.; Leaving In Practice between Consent and the worked example.\n- **2026-11-12** — Draft check round 2 (revise, six draft faults): p31 now opens from contextual targeting; p39 dates the 6% fall to the first months of 2028; Vanity Liquidity named in Failure Modes and Billing by Guesswork in Decision 3; the scene's revenue table points to the next section for its terms; deal ID and clean room glossed at first use in p25; fill rate glossed in p50. Words offset by tightening p53, p54 and the Failure Modes lead-in. Rejected: Raising max_words.\n- **2026-11-12** — Set length.max_words to 6,793 (the published 6,470 words by check_draft's count plus 5%), because spec.md set no word limit.\n- **2026-11-12** — Resolved the four draft faults round 3 escalated, raising length.max_words from 6,793 to 6,950 (+2.3%, within the 10% allowed): p05 maps the four products onto the three businesses (display and native sold two ways, programmatic and direct); p39 signposts that Decision 3 took effect later, from Q1 2028, and keeps 'in the first months of 2028, after the floor', which the chapter's own Q1 2028 start date (ledger: 'from Q1 2028 Top listing and Sponsored on Tradeyard PL are one product family') supports; 'data clean room' added to the terms table (sixteen definitions); p24 says what the Autotrader £15.2M shows, using only the £585.3M Autotrader revenue the In Practice table already cites from the same source. accepted under the author's delegation, 2026-11-12. Rejected: Cutting published sentences to stay within 6,793 words.\n- **2026-11-12** — Moving In Practice to after Concepts (round 1) accepted under the author's delegation, 2026-11-12.\n- **2026-11-12** — Flow notes taken: Valuo introduced at first use (p37, Hearthly's valuation product), Priya Raman (Head of Data & ML, p35) and Felix Brandt (Motorvane's CTO, p38) named with their roles at first use, and a sentence in p52 answering Ingrid's question from p11. Notes not taken, keeping the published text: moving the public-company citations from p21 and p24 into In Practice, seeding Felix Brandt's condition in the scene, an evidence paragraph before Decision 3, and cutting p48's repetition of p25. accepted under the author's delegation, 2026-11-12.\n- **2026-11-12** — Unverified real-company points stay out (eBay Promoted Listings pricing modes, the European Commission's adtech proceedings) and Google Ad Manager terminology stays generic, as published; no new real-company statements added. accepted under the author's delegation, 2026-11-12.\n- **2026-11-12** — Thesis rubric note on S6 (supports the so_what more than the claim): thesis and supporting claims kept as copied from the journal spec. accepted under the author's delegation, 2026-11-12.\n\n## Sources\n\n- **Internal**\n  - _journals/listing-systems-architecture/journal-spec.json — Intent outcome, acceptance criteria AC-1 to AC-3, thesis, role, Part VI's closing and Part VII's transition_in.\n  - ranking — Top-listing relevance floor; paid-organic blending.\n  - monetization-models, products-and-entitlements, data-platform, messaging-and-leads, experimentation — Guardrail metrics, the product catalog and entitlement effects, consent on events, contacts and leads, guardrails in experiments.\n  - _research/brief-monetization-economics.md, brief-adevinta.md, brief-trust-safety-regulation.md; _research/scenario-ledger.md — Research briefs and the canonical Veldmark Ads figures and 2027 decisions.\n- **External**\n  - Adevinta Annual Report 2023 (2024); eBay, CarGurus 10-Ks for FY2025 (2026); Autotrader FY26 and Rightmove FY2025 results (2026); OLX Tech Blog on hybrid search (2025) — Advertising revenue, Promoted Listings, audience targeting, manufacturer advertising, CRM audience, paid visibility in ranking.\n  - DSA Arts. 26 and 28; Directive (EU) 2019/2161; Regulation (EU) 2019/1150; EDPB Opinion 08/2024 (2024); European Commission VLOP list (updated 15 October 2026) — Labels, profiling exclusions, paid-ranking disclosure, consent or pay.\n  - IAB Europe TCF; Google Ad Manager CMP requirement; Prebid documentation; IAB Tech Lab ads.txt; MRC viewability guideline (2015); Google Privacy Sandbox update (2025); US DOJ press release (2025) — Consent framework, CMP requirement, header bidding, supply-chain files, viewability, identity changes, ad-server antitrust ruling.\n\n## Changelog\n\n- **2026-11-12** — Resolved the round-3 escalation under the author's delegation: four draft fixes, three name introductions, the answer to Ingrid's question in the conclusion, a clean-room definition; max_words raised to 6,950; open questions closed. (AI-mediated session)\n- **2026-11-12** — After draft check round 3 (escalate, budget spent): two cheap fixes applied (p28 'First,', p44 'this chapter's design'); four draft findings left for the author in open_questions; check report now stale. (AI-mediated session)\n- **2026-11-12** — After draft check round 2 (revise): p31's controlling idea reworded to start from contextual targeting; draft revised at six failing units. (AI-mediated session)\n- **2026-11-12** — After draft check round 1 (escalate on one spec fault): In Practice moved after Concepts; transitions, roadmap and flow rationale rewritten; conclusion's so-what no longer cites the four-catalog problem; draft revised at the failing units. (AI-mediated session)\n- **2026-11-12** — Converted spec.md to spec.json (status draft): one paragraph per unit, reconstructed from the published text; added roadmap, two table lead-ins, two splits and a three-paragraph conclusion carrying Part VI's closing; spec.md removed. (AI-mediated session)\n- **2026-10-21** — Renamed failure patterns to match where-listing-systems-go-wrong. (AI-mediated session)\n- **2026-10-20** — Replaced 3 mermaid diagrams with generated illustrations; sharpening pass 5,566 → 5,615 prose words; cross-chapter consistency sweep of 4 headings. (AI-mediated session)\n- **2026-10-19** — Initial spec and article; editorial review (hand-off restored to part-7, VLOP statement sourced, Omnibus and P2B citations
