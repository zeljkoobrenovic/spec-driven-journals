<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, acceptance criteria AC-1 to AC-3, the thesis and the role are copied unchanged from the map-search entry in journal-spec.json. Added units not in the published text: the roadmap paragraph p04, the canonical-property paragraph p24a (from the flow rubric) and the synthesis paragraph p56.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The five ways buyers say 'here' (named area, radius, viewport, drawn shape, commute) and why a map is a different product from a list: many small viewport queries, clusters and counts, its own ranking and evaluation.\n- **Know:** The geo query compiler and its primitives, the three clustering approaches, polygon normalization, isochrones versus post-retrieval travel times, neighborhood data, and caching at the peak.\n- **Believe:** The compiler, not the client, owns the translation of a gesture into a query, so caching, privacy and cost rules apply everywhere.\n- **Believe:** Precision, privacy and routing cost are design inputs: pins come from the public point, one canonical property is one pin, and the routing provider's pricing decides how commute search runs.\n- **Be able to:** Specify a geo query compiler with vertex caps, snapping and precision rules configured per brand, and budget map requests separately in capacity planning.\n- **Be able to:** Decide on a routing provider from a forecast of peak isochrone and matrix volumes.\n\n**Audience:** Chief architects, search and platform leads, and product and engineering directors of property, automotive and general classifieds marketplaces.\n\n**Already knows:**\n\n- What an API, a database, an event stream, a search engine and Kubernetes are, and maps as users.\n- From earlier chapters: Veldmark, its brands, cast and the Common Ground program; location-and-geo's public point, precision levels P0-P5, place IDs and H3 resolutions; search-architecture's shared OpenSearch decision and facet counts; ranking's paid placements and transparency duties; entity resolution and canonical properties; recommendations' rule that a surface without a typed query needs its own ranking and evaluation; the failure patterns Seeing Double, Ghost Inventory and The Forced Fit.\n\n**Does not yet know:**\n\n- Map-search vocabulary: bounding box, isochrone, geo clustering, map tiles (zoom/x/y), vector tiles, travel-time matrices.\n- Engine geo primitives (geo_point, geo_shape, geotile_grid, geohex_grid) and polygon simplification.\n- Routing providers' commercial terms and self-hosted routing engines (Valhalla, GTFS timetables).\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given slow drawn-area queries, stacked pins and a commute-search request, the reader states the design for each. *Probe:* At your property portal, drawn-area searches arrive as raw finger traces of hundreds or thousands of vertices and take almost two seconds at peak; agencies complain that one flat they list jointly shows as three stacked pins; and product wants '30 minutes by public transport' search for spring. Using only this chapter: what do you build, and how do you choose the routing provider? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-4 | Given a plan to compute map clusters from stored exact coordinates, the reader says what leaks and what rule prevents it. *Probe:* Your map team wants cluster markers and price heatmaps to look precise, so it plans to compute cluster centroids and heatmap cells from the exact coordinates stored for every listing, including private sellers'. Using only this chapter: what is the risk, and what rule should the platform enforce? | `custom` | cold_reader | minor |\n| AC-5 | Given a proposal to reuse the list ranker and list metrics for the map, the reader explains why not, with dated evidence and its limits. *Probe:* A colleague proposes to plot the list ranker's top results as map pins and to judge the map with the same NDCG and click-through-by-position metrics the list uses. Using only this chapter: what is wrong with that, what is the evidence, and how strong is it for a property portal? | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** How do you build location-centric discovery for verticals where place is the main filter?\n\n> **Claim:** Where place is the main filter, map search should be built as its own product over one geo query compiler, owned by the search platform and configured by brands, that turns named areas, drawn shapes, commutes and viewports into a few cacheable primitives (place-ID filters, simplified polygons, isochrones or post-retrieval travel times, tile-aligned boxes); pins and clusters are computed from each listing's public point and counted per canonical property; map traffic is budgeted, ranked and evaluated separately from lists; and commute search is costed from a forecast of peak isochrone and matrix volumes, because at hundreds of isochrones per second a per-request price grows with every campaign while a fixed license or a self-hosted engine turns the cost into capacity planning.\n\n**Disputed by:** The common practice of treating location as one filter among many (a radius around a postcode), letting each client build its own geo queries from raw gestures, plotting the ranked list as pins, and choosing a routing provider by its feature list.\n\n**So what:** A Chief Architect who accepts this shares the geo primitives, compiler, place and boundary service, isochrone service and tile cache while brands keep the map experience, writes the precision rule as a platform invariant signed off by the data protection officer, puts entity resolution's quality on the search platform's dashboard, budgets map requests rather than searches, and decides routing on a forecast of peak isochrone and matrix volumes.\n\n**How and why:** At Hearthly France 61% of sessions open the map and 17% draw an area; about 2,700 of 4,200 peak requests per second are map requests; raw traces arrive with a median of 146 vertices and more than 2,000 at most, giving polygon queries a 1.8-second p99 against 210 ms for list queries over the same city; and a Lyon flat listed by three agencies showed as three stacked pins. In the worked example the compiler simplifies a 181-vertex trace to 27 vertices and shows the flat as one pin with three offers; Airbnb reports that maps carry about 80% of its search interactions and that list metrics misjudge them; and peak commute load in the low hundreds of isochrones and tens of thousands of matrix elements per second moves Hearthly to a fixed-license matrix provider and self-hosted isochrones.\n\n**Supporting claims**\n\n- **S1** — Where place is the main filter, the map is a different product from the list: it sends many small viewport queries, shows clusters and counts instead of a ranked page, and needs its own ranking, evaluation and capacity budget.\n- **S2** — Buyers say 'here' in five ways with different meanings, primitives and costs, so one server-side geo query compiler, owned by the search platform and configured by brands, should compile every place expression into a few cacheable primitives; clients send intent, not engine queries.\n- **S3** — Every geometry the map returns (pins, clusters, heatmaps, area statistics) is computed from the listing's public point, and one canonical property is one pin, so precision, privacy and duplicate rules hold everywhere on the map.\n- **S4** — Drawn shapes and commutes are normalized before they reach the engine: polygons are repaired, simplified, capped and stored by reference, and commute search combines cached isochrones for filtering with per-listing travel times for display.\n- **S5** — The routing provider's pricing unit, limits and storage and display terms are architectural constraints, so commute search is costed from a forecast of peak isochrone and matrix volumes, not chosen by feature list.\n- **S6** — Map traffic is cached, invalidated and degraded as its own workload (tile-aligned caches, event-driven invalidation against Ghost Inventory), and at group level the geo machinery is a shared platform while each brand owns its map product.\n\n## Role in the part\n\nApplies the compile-into-structure claim to place, and shows that a map surface needs its own budget, ranking and evaluation over shared geo machinery. Supports P4-5 of part `part-4`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in the Hearthly scene, which poses three questions (query shapes and their owner; grouping, caching and ranking; commute cost), and the body and worked example, which answer them; `large_to_small` in the design sections: first the whole compiler architecture, then the inputs and outputs it governs one by one (drawn polygons, clusters, commutes, neighborhood layers), then the load they make at the peak)\n\nThe scene ends with Ingrid's three questions and the body answers them in the order each answer is needed. The five ways to say 'here' come first because every later section uses their names and primitives. The map as a different product comes next because it justifies giving the map its own architecture and budget, and it answers the ranking part of the second question: on a map, ranking moves to which pins are shown, highlighted and listed. The compiler architecture answers the first question and names the components the next sections fill in: drawn polygons first (the costliest input and the scene's headline problem, so the 1.8-second polygons are answered as soon as the compiler exists), clustering next (the map's main output, which answers the grouping part of the second question and states the privacy rule), then commute search (the second polygon, answering the third question), neighborhood data (the remaining input), then performance at the peak, which needs all of them before the levers make sense. Commute search ends with the peak arithmetic that decides the routing provider, because it needs the isochrone cache's hit rate. The worked example then runs one session through all of them with numbers, and trade-offs, vertical differences, failure modes, the Chief Architect's decisions and the review questions are judgements about a design the reader has now seen. Moving the worked example earlier would use snapping, canonical counting and the isochrone cache before they are explained; moving performance before clustering and commute would list levers (cheaper shapes, isochrone fallback) for parts not yet described.\n\n## Introduction\n\n**Hook** (`direct_statement`): Search usually treats location as one filter among many, a radius around a postcode applied before price and category; for many listing marketplaces that is backwards.\n\n**Bridge:** Architects who know search engines see location as one filter among many and the map as a list drawn with pins, and recommendations has just shown that a surface without a typed query needs its own ranking and evaluation. → In property and other place-first verticals the buyer starts with where, so the map is the main surface and every way of saying 'here' must be compiled, cached and priced on purpose.\n\n**Thesis statement** (KEY POINTS callout (all three bullets) and WHY ARCHITECTS SHOULD CARE callout; the scene's last paragraph (p09) poses the three questions the body answers.): Build map search as its own product over one geo query compiler that turns every place expression into a few cacheable primitives, compute pins and clusters from public points per canonical property, budget and evaluate the map separately, and cost commute search from a forecast of peak routing volumes.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p04, which lists the sections in order and names the kinds of evidence.):\n\n- Hearthly's polygon problem and Ingrid's three questions. *Kept in:* scene.\n- The five ways to say 'here'. *Kept in:* five-ways.\n- Why the map is a different product. *Kept in:* map-product.\n- A geo query compiler in front of the engine. *Kept in:* architecture.\n- Drawn polygons, clustering, commute search and neighborhood data. *Kept in:* polygons, clustering, commute, neighborhood.\n- Performance and caching at the peak. *Kept in:* performance.\n- The Lyon apartment followed through the design. *Kept in:* worked-example.\n- Trade-offs, vertical differences, failure modes, the Chief Architect's view and review questions. *Kept in:* trade-offs, verticals, failure-modes, ca-view, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | claim | Recommendations showed that a surface without a typed query needs its own ranking and evaluation; for many listing marketplaces place is the first and main filter, not one filter among many, and in real estate the main way people browse, so the map too needs its own ranking and evaluation, built on contacts rather than clicks. | example: A family looking for a flat starts with where; a car buyer with how far they will drive; a sofa buyer with how far they can carry it. | `similarity`: Recommendations' lesson that a surface buyers browse without a typed query still needs its own ranking and evaluation, measured on contacts rather than clicks; the claim for the map is stated after the place-first argument. → The map, where the result set is scoped by place and displayed as pins and clusters, and the geo query compiler that turns gestures into query primitives. |\n| p02 | definition | This chapter owns map search, isochrone search and geo clustering; location-and-geo decides what point a listing has, and this chapter decides how buyers search over those points. |  | `elaboration`: Place as the main filter. → The terms this chapter owns and its boundary with location-and-geo, search-architecture, ranking, entity-resolution and saved-searches-and-alerts. |\n| p03 | context | Hearthly's draw-your-area search in France is the chapter's case: by 2027 it is both the feature agencies praise and the workload the search team fears. | scenario: Hearthly launched Dessinez votre zone in France; agencies praise it and the search team fears its load. | `example`: The chapter's subject. → Veldmark (fictional) and Hearthly's draw-your-area search as the case. |\n| p04 | transition | The chapter starts from Hearthly's polygon problem, defines the five ways to say 'here', shows why the map is a different product, lays out a geo query compiler in front of the engine, then works through drawn polygons, clustering, commute search, neighborhood data and performance at the peak, follows the Lyon apartment through the design, and ends with trade-offs, vertical differences, failure modes, the Chief Architect's view and review questions, drawing on Airbnb's and Zillow's published work, Rightmove's case studies, engine and routing documentation and the fictional Veldmark. |  | `sequence`: The case and what the chapter owns. → The order in which the chapter covers it and the kinds of evidence. |\n\n## Sections\n\n### Setting the Scene at Veldmark: The Polygon Problem at Hearthly\n\n**Controlling idea** (`context`, id `scene`): Hearthly's map-shaped traffic (most sessions on the map, raw finger traces as polygons, stacked pins for one flat, and a per-request routing quote) does not fit a shared search platform tuned for Tradeyard's list-shaped queries, which raises three questions about query shapes, grouping and commute cost.\n\n**Advances the thesis** (S1, S2, S3, S5): Shows the map's load, polygon cost, duplicate pins and routing cost at one brand and poses the questions the body answers.\n\n**Transition in:** `example`: The chapter's map of sections and its claim that place leads discovery. → The running case: a meeting about Hearthly's draw-your-area search before the shared-platform migration is planned.\n\n**Order of paragraphs** (`problem_solution`): Setting and people first, then the numbers, then the two complaints, then why they matter for the migration, then the three questions the body answers; the questions need all four before them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | context | In late September 2027, two weeks after Veldmark decided on 14 September to move Tradeyard and Hearthly onto a shared search platform on Amazon OpenSearch Service by the end of 2028, Julien Marchand asks Ingrid Halvorsen and Tomasz Wiśniewski for a session about one feature before the migration is planned. | scenario: Decision of 14 September 2027; shared platform on Amazon OpenSearch Service by end 2028; Julien (Hearthly CTO), Ingrid (Group Chief Architect), Tomasz (group search platform). |  |\n| p06 | evidence (list) | Hearthly France serves 1.9 million live listings (about 1.12 million distinct properties) on self-managed OpenSearch, and its map numbers for September 2027 show a map-first, polygon-heavy workload. | statistic: 61% of sessions open the map (54% on mobile); 17% draw an area; about 2,700 of 4,200 peak requests per second are map requests; polygons median 146 vertices, max over 2,000; polygon p99 1.8 s vs 210 ms for list queries; about 1.1 million of 7 million saved searches contain a polygon. | `elaboration`: The feature the session is about. → Hearthly's platform and Julien's numbers. |\n| p07 | evidence | Two complaints come with the numbers: Lyon agencies such as Agence Rhône Habitat see one flat as three stacked pins, and product wants commute search for spring 2028 with a quote priced per isochrone request. | scenario: Agence Rhône Habitat (fictional, 14 branches) sees one flat as three stacked pins; product wants '30 minutes by public transport' for spring 2028 with a per-isochrone quote. | `additional_support`: The load and latency numbers. → Two problems the numbers do not show: stacked pins and the commute request. |\n| p08 | analysis | Tomasz worries that Hearthly's map-shaped traffic does not fit a shared platform sized for Tradeyard's list-shaped queries, and that every pan and zoom could cross clouds while Hearthly stays on Google Cloud through 2028. | scenario: Tradeyard produces about 70% of group queries and is list-shaped; Hearthly is on Google Cloud through 2028; the shared platform runs on AWS. | `cause_effect`: Hearthly's numbers and complaints. → What they mean for the shared platform. |\n| p09 | transition | Ingrid frames three questions the chapter answers: what query shapes the map needs and who translates gestures into them, how results are grouped, cached and ranked on a map, and what commute search costs in latency, money and license terms. |  | `problem_solution`: The traffic-shape worry. → The three questions the session must answer. |\n\n### Five Ways to Say \"Here\"\n\n**Controlling idea** (`definition`, id `five-ways`): Buyers express place in five ways (radius, viewport, drawn polygon, named area, travel time), each with its own meaning, engine primitive and cost, and treating them as one location filter causes most map-search bugs.\n\n**Advances the thesis** (S2, S3): Gives the vocabulary the compiler compiles from and the semantic traps it must settle once.\n\n**Transition in:** `sequence`: Ingrid's first question: which query shapes the map needs. → The five ways buyers express place, as the vocabulary for the answer.\n\n**Order of paragraphs** (`large_to_small`): The five expressions first, then the terms the table uses, then the engine primitives behind them, then the traps hidden in the table.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | definition | Buyers express place in five ways, each with a different meaning, index primitive and cost, so treating them as one location filter is the source of most map-search bugs. | table: Radius, viewport, drawn polygon, named area and travel time: what the buyer means, the Elasticsearch/OpenSearch primitive, and cost and cacheability. |  |\n| p11 | definition | Five terms used throughout are defined: bounding box, map tile, isochrone, place ID (ancestor place IDs make a named area a term filter) and public point (deliberately coarser than the true location for private sellers). |  | `elaboration`: The table's expressions. → Definitions of its terms. |\n| p12 | evidence | Elasticsearch documents the primitives and OpenSearch uses the same names: shapes are tessellated and their cost scales with vertex count, and the geo_shape query can run against points and reference shapes stored in another index. | source: Elastic geo-shape field type and geo-shape query documentation (n.d.): tessellation into triangles in a BKD tree, ~1e-7 degree precision, cost scales with vertices; spatial relations; pre-indexed shapes. | `additional_support`: The primitives named in the table. → What the engine documentation says about them. |\n| p13 | analysis (list) | Three semantic traps sit in the table: radius and named area disagree at the edges, a viewport is a display scope not intent, and a coarse public point makes 'within' probabilistic; each is a product rule to state once. | example: A flat 300 m outside Lyon 7e is in a 2 km radius but not in 'Lyon 7e'; a Rotterdam bike shown at the center of an H3 resolution-7 cell (edge about 1.4 km). | `contrast`: The primitives as documented. → Where their meaning diverges from what users expect. |\n\n### The Map Is a Different Product\n\n**Controlling idea** (`claim`, id `map-product`): The map is a different product from the list: it is a search client with its own query mix and latency budget, and ranking moves onto pin selection rather than disappearing, as Airbnb's published work shows and property portals' long use of maps suggests.\n\n**Advances the thesis** (S1): Establishes with dated evidence that the map needs its own ranking, evaluation and budget.\n\n**Transition in:** `sequence`: The five expressions of place. → The surface they are used on, and why it is not a list with pins.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The strongest public evidence first, then the property-portal evidence and its limits with a comparison table, then the two consequences for the architecture.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | evidence | Airbnb's published work is the strongest public evidence that the map is a different product: list assumptions did not hold on the map, maps carry about 80% of search interactions, and list NDCG fails to model attention on maps. | source: Haldar et al., Learning to Rank for Maps at Airbnb (arXiv, 2024); Airbnb Tech 2025 year in review ('roughly 80% of search interactions', map-specific NDCG); Airbnb EBR paper (arXiv, 2026): map-based geographic filters on nearly all searches, S2 cells as a feature. |  |\n| p15 | comparison | Property portals have long treated the map as central (Rightmove's 2014 'rich, map-centric results'), but applying Airbnb's ranking findings to them is the author's inference; the mechanics carry over, and a table shows how list and map differ. | source: Elastic's 2025 case study on Rightmove's 2014 move to Elasticsearch.; table: List view versus map view: unit of result, queries per session, what must be fast, what ranking means, attention model, evaluation. | `additional_support`: Airbnb's findings. → Property-portal evidence, its limits and a list-versus-map comparison. |\n| p16 | cause_effect | Two consequences follow: the map is a search client in its own right with its own latency budget and query mix, and ranking moves to which pins to show, highlight and list, where paid placements raise the transparency questions of the ranking chapter. | example: A viewport over central Lyon holds 2,400 matching flats; the system decides which 300 become pins. | `cause_effect`: The list-versus-map differences. → Their two consequences for capacity planning and ranking. |\n\n### Architecture: A Geo Query Compiler in Front of the Engine\n\n**Controlling idea** (`explanation`, id `architecture`): A geo query compiler between the map clients and the engine, with narrow components for the map API, places and boundaries, isochrones, tile caching and neighborhood data, makes the server the owner of every place expression; a single pan shows how it keeps the map cacheable.\n\n**Advances the thesis** (S2, S6): Answers the first question: the compiler, not the client, translates gestures into queries.\n\n**Transition in:** `problem_solution`: The map as a separate product with many small queries. → The architecture that serves it: a geo query compiler in front of the engine.\n\n**Order of paragraphs** (`large_to_small`): The whole design and its figure first, then each component, then the rule that holds it together, then one pan as the most frequent interaction, then the three choices that pan reveals.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p17 | claim | The recommended design puts a geo query compiler between the map clients and the engine and gives each other map concern its own component with a narrow interface, as Figure 1 shows for Hearthly's target state. | figure: Figure 1: the geo query compiler turns every place expression into a normalized query before any cache or engine sees it; commute requests go through an isochrone service; listing events invalidate cached tiles. |  |\n| p18 | description (list) | Seven components each own one concern: the map search API, the geo query compiler at the center, the place and boundary service, the isochrone service, the tile and cluster cache, the search engine and the neighborhood data service. |  | `elaboration`: The design in outline. → Each component and its responsibility. |\n| p19 | claim | The rule that holds the design together is that clients send intent, not engine queries, because a client that builds its own geo queries puts the map's cost and correctness in every app release, and mobile releases are slow to reach users. |  | `conclusion_summary`: The seven components. → The single rule they enforce. |\n| p20 | example | A single pan, the most frequent interaction, shows the sequence: snapping the viewport to tiles turns an uncacheable bounding box into reusable cache entries. | figure: Figure 2: snapping the viewport to tiles; a pan reuses most previous tiles, so the engine sees only the edge of the movement. | `example`: The ownership rule and the components of Figure 1. → One pan as the components in motion, with a pointer forward to the performance levers that reuse its choices. |\n| p21 | recommendation (list) | Three choices in the figure matter: debounce in the client but enforce budgets on the server, snap viewports to tiles, and separate the count from the pins. | source: Elastic geotile grid aggregation documentation (n.d.): zoom/x/y tiles at precision 0-29, only non-empty cells, finest precision under 10 cm, use a bounding-box filter.; example: Counts are the expensive part, like facet counts (search-architecture on Vinted's 2023 facets). | `elaboration`: The pan sequence. → The three design choices it relies on. |\n\n### Drawn Polygons: Normalize Before You Query\n\n**Controlling idea** (`process`, id `polygons`): A drawn polygon is the most expressive and most dangerous place query, so the compiler normalizes it in six steps before the engine sees it, which at Hearthly turns a 1.8-second p99 into 240 milliseconds.\n\n**Advances the thesis** (S2, S4): Shows normalization as the compiler's job and measures its effect.\n\n**Transition in:** `sequence`: The compiler, its components and the pan sequence; the scene's 1.8-second polygons. → The first and most expensive input the compiler must normalize: the drawn polygon, the scene's headline problem.\n\n**Order of paragraphs** (`problem_solution`): The risk and the absence of public implementations first, then the six steps, then their measured effect at Hearthly, then the one semantic choice left.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p27 | claim | A drawn polygon, the scene's headline problem, is the first input the compiler must normalize and the most expressive and most dangerous place query; large portals offer it without documenting how they implement it, and the natural implementation is a geo_shape query against listing points. | fact: Rightmove, Idealista and Zillow offer draw search; their implementations are not publicly documented. |  |\n| p28 | process (list) | The compiler should apply six steps to every drawn shape: validate and repair, simplify, cap, snap to known areas, store as an object and pre-filter coarsely. | example: Douglas-Peucker simplification at 15-25 m; Hearthly's cap of 64 vertices; covering H3 or S2 cells as a pre-filter. | `problem_solution`: The cost and fragility of raw polygons. → The six normalization steps. |\n| p29 | evidence | At Hearthly, simplification and the cap alone cut the median from 146 to 31 vertices and replayed polygon p99 from 1.8 seconds to 240 milliseconds, the direction the Elastic documentation predicts. | statistic: Simplify at 20 m: median 146 to 31 vertices, max over 2,000 to 64; replayed Sunday-evening p99 1.8 s to 240 ms (illustrative).; figure: Figure 3: a jittery trace simplified into a clean polygon, latency falling. | `example`: The six steps. → Their effect on Hearthly's Lyon polygons. |\n| p30 | analysis | The remaining choice, within versus intersects for points, rarely matters; the real boundary question is the coarse public point, which should be decided once in the compiler. |  | `contrast`: The measured gain. → The one semantic question normalization does not settle. |\n\n### Clustering: Three Ways to Show Ten Thousand Results\n\n**Controlling idea** (`comparison`, id `clustering`): Results can be clustered on the server, on the client or in pre-rendered vector tiles, usually combined by zoom level; whichever is used, pins and counts are per canonical property where properties are listed several times, and every geometry returned to a client is computed from the public point.\n\n**Advances the thesis** (S1, S3): Answers part of the second question (grouping) and states the privacy rule for aggregations.\n\n**Transition in:** `sequence`: The inputs that decide which listings match (drawn shapes, viewports, named areas). → Ingrid's second question: how the matches are grouped and shown, clustering being the map's output.\n\n**Order of paragraphs** (`comparison`): The three approaches side by side, their sources, how they combine, then the unit they count, then the privacy trap all three share and the rule that closes it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p22 | comparison | Inputs decide which listings match and clustering decides how they appear: geo clustering groups nearby results into markers with counts, and it can be done in three places: server-side grid aggregation, client-side clustering, or pre-rendered vector tiles, each with a different fit and risk. | table: Server-side grid aggregation, client-side clustering (Supercluster), pre-rendered vector tiles: how each works, when it fits, main risk. |  |\n| p23 | evidence | The table rests on undated engine and library documentation (OpenSearch geohex grid, Supercluster, Elasticsearch's vector tile API), and an OpenSearch team should check whether the vector tile endpoint exists before assuming it. | source: OpenSearch geohex grid (H3 cells, precision 0-15); Mapbox Supercluster ('a very fast geospatial point clustering library'); Elastic vector tile search API (_mvt, hits/aggs/meta layers, up to 10,000 hits per tile). | `additional_support`: The three approaches. → The documentation behind them and its limits. |\n| p24 | recommendation | The approaches combine by zoom level, and H3 hexagons make clusters that look less mechanical than square tiles because every hexagon has six equidistant neighbors. | source: H3, introduced by Uber in 2018. | `elaboration`: The three approaches as alternatives. → How they are combined in practice. |\n| p24a | claim | Pins and cluster counts need a unit: counting listings shows one property listed by several agencies as stacked pins and inflates every count, so in real estate the unit is the canonical property that entity resolution writes into each listing document. |  | `elaboration`: How the approaches combine to show results. → What each pin and each count stands for. |\n| p25 | claim | Aggregations can leak what pins hide: a cluster, heatmap or vector-tile hit computed from the exact point places a marker at a private seller's front door. |  | `contrast`: Clustering as a display technique. → Its privacy risk. |\n| p26 | recommendation | The rule is absolute: every geometry returned to a client is computed from the public point, which must be deterministic, and the map search API cannot read the exact point at all. | scenario: Tradeyard private sellers: center of an H3 resolution-7 cell; Hearthly agencies choose P3, P4 or P5; a property listed by several agencies shows the coarsest choice.; figure: Figure 4: a cluster of one from the exact point marks the seller's front door; from the public point it sits at the center of a coarse hexagon. | `problem_solution`: The leak through aggregations. → The rule that closes it and how it applies at Tradeyard and Hearthly. |\n\n### Commute Search: Isochrones and Travel Times\n\n**Controlling idea** (`explanation`, id `commute`): Commute search needs both an isochrone filter over the whole inventory and per-listing travel times for each result; the routing provider's pricing, limits and license, together with an isochrone cache keyed by a snapped origin, decide how it runs, and a forecast of peak volumes decides the provider.\n\n**Advances the thesis** (S4, S5): Answers the third question: how commute search works and what it costs.\n\n**Transition in:** `sequence`: The drawn polygon, normalized by the compiler, and the clusters it feeds. → Ingrid's third question: commute search, the second polygon the compiler must obtain and normalize.\n\n**Order of paragraphs** (`large_to_small`): The two documented forms, then the two patterns behind them and why both are needed, then the provider terms that constrain them, the self-hosted alternative, the cache that makes either affordable, and finally the peak arithmetic, which needs the cache hit rate and decides the provider.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p31 | evidence (list) | Commute search lets buyers filter or sort by travel time, and the property sector has two documented forms: Rightmove's per-listing travel times through TravelTime under a fixed annual license, and Zillow's 2024 commute criterion in natural-language search, whose implementation is not public. | source: TravelTime's Rightmove case study (n.d., vendor marketing): My Places, four modes, a fixed annual license with unlimited requests because the transactional model 'would simply not be possible'.; source: HousingWire, 2024-09-04: Zillow adds commute time, affordability and points of interest as natural-language criteria. |  |\n| p32 | comparison | Behind both forms sit two patterns a platform usually needs together: an isochrone filter computed once per search and cacheable, and per-listing travel times computed with a matrix call that grow with traffic. | table: Isochrone filter versus per-listing travel time: how it works, cost profile, accuracy. | `elaboration`: The two documented forms. → The two technical patterns behind them. |\n| p33 | analysis | The isochrone filter makes whole-inventory filtering possible and per-listing travel time makes each card honest, so a design with only one either shows only a band such as 'within 30 minutes', wrong at the polygon's edges, or cannot filter. |  | `cause_effect`: The two patterns' properties. → Why using only one fails. |\n| p34 | claim (list) | The routing provider's commercial model is an architectural input, through three kinds of terms: the pricing unit, the limits and the storage and display rights. | source: Mapbox Isochrone API (as of 2026): 60 minutes per contour, four contours, driving/walking/cycling, 300 requests per minute, display on a Mapbox map. | `cause_effect`: The routing calls both patterns need. → The terms under which those calls are bought. |\n| p35 | comparison | A self-hosted routing engine such as Valhalla moves the cost from license fees to engineering (road and transit data, timetables in GTFS, peak capacity), and for public transport the departure time must be part of the cache key and stated to the user. | source: Valhalla isochrone service documentation (n.d.): reachable areas, car, bicycle, pedestrian and multimodal costing, up to four contours, polygon output. | `contrast`: Commercial providers' terms. → The self-hosted alternative. |\n| p36 | recommendation (list) | Commute requests repeat because people commute to the same few places, so the isochrone cache key is the origin snapped to an H3 resolution-9 cell, the mode, the rounded time budget and the departure time bucket. | fact: H3 resolution 9: about 0.1 km², average edge about 200 m (location-and-geo). | `problem_solution`: The cost of routing calls under either model. → Caching isochrones. |\n| p37 | analysis | Snapping the origin by up to about 200 meters is an acceptable trade for a high hit rate because the per-listing travel time corrects the displayed number, and cached isochrones must expire with timetable or road data and be stored simplified. |  | `elaboration`: The cache key. → Why its approximation is acceptable and when entries expire. |\n| p47 | analysis | Commute arithmetic, not a feature comparison, decides routing: 10% of 2,700 peak map requests is 270 commute requests per second, a 70% isochrone cache hit rate leaves about 80 isochrones per second, and matrices for 50 pins to one or two places add about 13,500 to 27,000 elements per second, so Hearthly chooses a fixed-license matrix provider and a self-hosted engine for cached isochrones. | reasoning: 10% of 2,700 peak map requests per second from commute sessions, a new isochrone per parameter change and a matrix per page, 70% isochrone cache hits. | `cause_effect`: The isochrone cache and its hit rate. → The peak routing volumes that remain with the cache in place (premises: every commute request looks up an isochrone and needs a matrix for the pins on screen), and the routing decision they force, marked as its own step. |\n\n### Neighborhood Data and Points of Interest\n\n**Controlling idea** (`explanation`, id `neighborhood`): Neighborhood context is reference data with owners, sources and licenses, cheap to display but costly to filter, statistically fragile and in some markets legally sensitive.\n\n**Advances the thesis** (S2, S3): Brings neighborhood layers under the compiler's and the data rules' control.\n\n**Transition in:** `sequence`: Travel time as one kind of place context. → The other context buyers search by: schools, transit, noise, flood risk and prices.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p38 | claim | Neighborhood context is the most often under-designed part of map search because it looks like content rather than data. |  |  |\n| p39 | recommendation (list) | Four rules apply: it is reference data with owners, sources and refresh cycles; display is cheap and filtering is not; area statistics must use enough data; and some facts are legally sensitive. | fact: OpenStreetMap's ODbL requires attribution and has share-alike terms.; scenario: Valuo learns from DVF transactions, never asking prices; Hearthly computes local price medians per H3 resolution-8 cell.; source: 24 CFR §100.75 via Cornell LII: US fair-housing rules prohibit advertisements indicating a preference, including through selection of locations. | `problem_solution`: Neighborhood data treated as content. → Four rules that treat it as data. |\n\n### Performance and Caching at the Peak\n\n**Controlling idea** (`recommendation`, id `performance`): Map traffic peaks with all search traffic, so the map needs its own ordered levers (tile-aligned caching, cheaper shapes, approximate counts, zoom limits, degradation), event-driven tile invalidation against Ghost Inventory, and, at Hearthly, a map API and tile cache on the Hearthly side of the cloud boundary.\n\n**Advances the thesis** (S6): Answers the caching part of the second question and the cross-cloud worry.\n\n**Transition in:** `sequence`: The compiler's inputs and the data around them. → The load all of it must carry at the Sunday-evening peak.\n\n**Order of paragraphs** (`order_of_importance`): The peak first, then the levers in the order to pull them, then invalidation, which the cache levers create a need for, then the Hearthly-specific cross-cloud lever.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p40 | evidence | Map traffic peaks with all search traffic: Veldmark's group peak is about 31,000 queries per second on Sunday evenings, Rightmove's documented busiest minute fell in a prime-time TV ad break, and map requests are about 2,700 of Hearthly's 4,200 peak requests per second. | statistic: Group peak about 31,000 queries/s, Sunday 20:00-22:00 CET; Hearthly 2,700 of 4,200.; source: Google Cloud press release (2021): Rightmove's busiest minute, 8:48 pm on a Wednesday during the final ad break on prime-time TV. |  |\n| p41 | recommendation (list) | Five levers, in the order to pull them, keep the map fast: tile-aligned caching of aggregations, cheaper shapes, approximate counts and separate paths, zoom-dependent limits, and degradation modes; the first and third apply the pan's tile snapping and separate count path (p20-p21) to the peak, and the list refers back to them rather than introducing them anew. |  | `problem_solution`: The peak, which the map sets for Hearthly, and the pan choices of p20-p21. → The levers that carry it. |\n| p42 | recommendation | Cache invalidation is where map caching meets Ghost Inventory: listing events should drop the tiles containing the listing's public point at each cached zoom, with a short TTL as a backstop, and the tile cache must meet the unpublish SLA. |  | `cause_effect`: Caching as the first lever. → The staleness it causes and how events remove it. |\n| p43 | recommendation | Hearthly's cross-cloud constraint adds a lever: running the map search API and tile cache on the Hearthly side means most pans are answered without crossing clouds and only cache misses reach the engine. | scenario: Shared platform on AWS; Hearthly on Google Cloud through 2028; Ingrid's recommendation. | `additional_support`: The general levers. → One specific to Hearthly's two clouds. |\n\n### Worked Example: The Lyon Apartment on the Map\n\n**Controlling idea** (`example`, id `worked-example`): Following one buyer's session over the Lyon apartment through the target design shows each rule enforced once by the compiler and entity resolution turning three agency listings into one pin.\n\n**Advances the thesis** (S2, S3, S4): Applies the design end to end with ledger numbers.\n\n**Transition in:** `example`: The design and its levers. → One buyer's session through all of them.\n\n**Order of paragraphs** (`chronological`): The flat, then the session step by step, then what the session shows.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p44 | context | In May 2027 a T3 68 m² flat in Lyon 7e is listed at €389,000 (DPE D) by three agencies, one of them Agence Rhône Habitat, and entity resolution clusters the three listings into one canonical property valued by Valuo at €372,000-€401,000. | scenario: The Lyon apartment: T3, 68 m², €389,000, DPE D, three agencies via two software vendors and Keybridge; Valuo €372,000-€401,000. |  |\n| p45 | example (list) | Sophie's evening session from May 2027, walked through the target design (not a record of what happened, since commute search does not exist yet), runs through commute filter, map view (square tiles as cache keys, H3 hexagons as clusters), draw, pins and save, and the flat appears as one pin with three offers and a 24-minute travel time. | scenario: Isochrone cached and simplified to 58 vertices; 9 tiles, 7 cache hits; 14 clusters, 412 properties counted per canonical property; 181-vertex trace to 27 vertices; 63 properties; one pin at the exact address; 24-minute matrix travel time; saved search stores polygon by reference and isochrone parameters. | `example`: The flat. → A buyer's session over it. |\n| p46 | analysis | The example shows the value of one compiler, which enforces the canonical-property, public-point, normalization and isochrone-cache rules once, and of entity resolution, without which the flat would be three stacked pins. | figure: Figure 5: three stacked pins versus one canonical pin opening a card with three offers. | `conclusion_summary`: Sophie's session. → What it demonstrates. |\n\n### Trade-offs\n\n**Controlling idea** (`comparison`, id `trade-offs`): Each design choice in the chapter has conditions under which the other option is right, and every geo feature that becomes a saved search also becomes an alert workload.\n\n**Advances the thesis** (S2, S3, S4, S5): Bounds the recommendations by stating when the alternatives fit.\n\n**Transition in:** `contrast`: The choices made for Hearthly. → When other choices fit.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p48 | comparison | Seven decisions, from where geo logic lives to the map unit, each have a condition for the other option. | table: Where geo logic lives, area filtering, clustering, commute, routing, map ranking, map unit: options A and B and when to choose each. |  |\n| p49 | analysis | The table hides one cross-cutting cost: every geo feature in a saved search becomes an alert workload, so map product decisions are also capacity decisions for alerts. |  | `emphasis`: The table's choices. → A cost none of its rows shows. |\n\n### Vertical Differences\n\n**Controlling idea** (`comparison`, id `verticals`): Place plays a different role in general classifieds, real estate, automotive and jobs, so the map is primary in real estate, a dealer map in automotive and a local-liquidity lever in general classifieds.\n\n**Advances the thesis** (S1, S3): Shows where the map-first design applies and where it does not.\n\n**Transition in:** `contrast`: The general trade-offs. → How they differ by vertical.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p50 | comparison | For automotive the place that matters is the dealer's, so Motorvane's map is a dealer map with a radius as its main query, and its staying on Elasticsearch until 2029 does not stop it using the shared compiler; for general classifieds the strongest geo lever is local liquidity, expanding the radius when local results are thin. | table: General classifieds, real estate, automotive and jobs: role of place, typical query, point precision, map view, duplicates, commute search, neighborhood data.; scenario: Motorvane stays on Elasticsearch until a 2029 review; Umkreissuche as its main geo query. |  |\n\n### Failure Modes\n\n**Controlling idea** (`analysis`, id `failure-modes`): Nine recurring mistakes in map-search designs follow from breaking one of the chapter's rules.\n\n**Advances the thesis** (S1, S2, S3, S4, S5, S6): Turns each rule into the failure its absence causes.\n\n**Transition in:** `contrast`: The designs recommended for each vertical. → The mistakes to look for in a review.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p51 | analysis (list) | Nine mistakes to look for first in a design review, from raw client geometry and accidental viewport filters to aggregations over exact points, stacked pins, stale tiles, unstated isochrone assumptions, per-request routing at peak, hard-coded boundaries and list metrics for the map. |  |  |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `ca-view`): At group level the geo machinery is a shared platform and the map product belongs to each brand, which turns into six decisions for the advice forum and one long-term watch: natural-language search raises the value of one compiler.\n\n**Advances the thesis** (S2, S3, S5, S6): Gives the group-level decisions, owners and what to watch.\n\n**Transition in:** `conclusion_summary`: The failure modes. → The decisions that prevent them at group level.\n\n**Order of paragraphs** (`large_to_small`): The principle first, then the decisions that apply it, then the long-term consideration that tests it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p52 | claim | Map search tests the principle 'share platforms, not products': the geo primitives, compiler, place and boundary service, isochrone service and tile cache are platform capabilities, while each brand keeps its map product. | scenario: Common Ground's principle; Hearthly map-first, Tradeyard radius-first. |  |\n| p53 | recommendation (list) | Six decisions go to the advice forum: the compiler owned by the search platform and configured by brands, the precision rule as a platform invariant signed off by the DPO, the canonical property as the map unit, routing bought on a volume forecast, the map budgeted separately, and the map measured as a product. | scenario: Tomasz's team owns the compiler; Lucía Ortega signs off the precision rule; Ingrid with Mateus Carvalho and finance decide routing. | `elaboration`: The platform principle. → The decisions that apply it. |\n| p54 | analysis | Conversational search will express place in sentences, which raises the value of the compiler: an LLM that turns sentences into filters should emit the same place IDs, polygons and isochrone parameters as the map client. | example: Zillow's 2024 natural-language commute criterion. | `time`: The decisions for now. → What to watch over the long term. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Ten review questions test a map-search design against the chapter's claims.\n\n**Advances the thesis** (S1, S2, S3, S4, S5, S6): Turns each claim into a question for a design review.\n\n**Transition in:** `conclusion_summary`: The decisions and what to watch. → Questions that check them in a review.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p55 | recommendation (list) | Ten questions check a map-search design in a review, from which component translates gestures to which neighborhood layers carry legal risk. |  |  |\n\n## Conclusion: From Maps to Standing Promises\n\n**Synthesis:** Ingrid's three questions have one answer: the server owns place. Because one compiler translates every gesture, the same component that makes polygons cheap also enforces the public-point rule, counts canonical properties and keys the isochrone cache, so speed, privacy, duplicates and routing cost are settled in one place instead of in every client.\n\n**So what:** A group that puts the compiler on the shared platform can move Hearthly onto it without The Forced Fit, and can add new place interfaces, such as natural-language search or saved polygons, without rebuilding geo logic in each client.\n\n**Callback:** The scene: Hearthly's 1.8-second polygons, the three stacked pins Agence Rhône Habitat complained about, the per-request routing quote and Ingrid's three questions. The synthesis paragraph answers the three questions and names what became of the polygons, the pins and the quote.\n\n**Takeaway** (`course_of_action`): Put one geo query compiler on the search platform, compute every returned geometry from the public point, count canonical properties, budget map requests separately and cost commute search from a forecast of peak isochrone and matrix volumes.\n\n**Hand-off** to [Tell Me When It Appears: Saved Searches and Alerts](saved-searches-and-alerts.html): `time`: Map search's saved draw-your-area search, stored as a normalized polygon and isochrone parameters, and the finding that a buyer can only find what is listed at the moment they search. → What is listed afterwards: the saved search as standing demand, matched by reverse search against every new or changed listing and delivered as alerts within minutes.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p56 | synthesis | Ingrid's three questions have one answer, that the server owns place: one compiler produces the query primitives, results are grouped from public points per canonical property and cached by tile, and commute search is bought on a forecast of peak isochrone and matrix volumes; because one component does this, the 1.8-second polygons, the three stacked pins and the per-request quote were all fixed in one component rather than in each client. |  |  |\n| p57 | transition | The map turns place into a query, and a buyer can only find what is listed at the moment they search; the next chapter turns the saved polygon around Jean-Macé into a standing promise to tell her within minutes when a matching flat appears. |  | `time`: The saved search at the end of Sophie's session. → What is listed afterwards, and alerts. |\n\n## Non-goals\n\n- Geocoding, address models, location precision policy and geo index choice (H3/S2); summarized and linked. See [Where Is It? Location, Geocoding and Privacy](location-and-geo.html).\n- Engine choice, index topology and reindexing. See [Search Architecture for Listings: Indices, Freshness and Scale](search-architecture.html).\n- Ranking models and paid-placement blending in depth. See [Ranking for Two Sides: Relevance, Freshness and Paid Visibility](ranking.html).\n- Saved polygon searches and alerts. See [Tell Me When It Appears: Saved Searches and Alerts](saved-searches-and-alerts.html).\n- Duplicate clustering algorithms. See [One Property, Three Listings: Duplicates and Entity Resolution](entity-resolution.html).\n- General capacity and degradation model. See [Sunday Evening Peaks: Reliability, Performance and Cost](reliability-and-scale.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- No primary engineering source was found for draw-on-map search at Rightmove, Idealista or Zillow, or for Zillow's commute computation; revisit if one is published. (Carried over from spec.md.)\n- Whether OpenSearch offers an equivalent of Elasticsearch's vector tile search API was not verified; the chapter tells readers to check current documentation. (Carried over from spec.md.)\n- The TravelTime case study is undated vendor marketing; a dated Rightmove source on My Places would be stronger. (Carried over from spec.md.)\n\n## Decision log\n\n- **2026-10-19** — Centered the chapter on a server-side geo query compiler as the single owner of place semantics, rather than organizing it by query type, because the cost, privacy and caching rules all hang on that seam.\n- **2026-10-19** — Used Airbnb's map-ranking papers as the main public evidence, labeled the transfer to property portals as inference, because no portal has published comparable map evaluation work.\n- **2026-10-19** — Made the canonical property the map unit in the Lyon example to tie Seeing Double to a visible map symptom; entity resolution itself stays in its own chapter.\n- **2026-10-19** — Treated the routing provider's commercial model as an architectural constraint (Rightmove/TravelTime, Mapbox limits) instead of a procurement footnote.\n- **2026-11-12** — Success criteria of spec.md not carried over as such: the journal entry's AC-1 to AC-3 replace them. Rewritten as minor outcome criteria: the clustering and public-point criterion (AC-4) and the Airbnb-evidence criterion (AC-5). Dropped as inventories: the place-expression table, the two diagrams, the polygon steps and commute patterns (covered by AC-1), the Veldmark numbers (checked against the ledger instead), the trade-off, vertical, failure-mode, Chief Architect and question sections, and dated company sources (house rules, not reader outcomes).\n- **2026-11-12** — Thesis rubric (copied thesis): PASS on all four tests; the reader noted the claim packs about six sub-claims into one sentence, which fails no test. Flow rubric: sound with notes. Acted on: a new paragraph p24a in Clustering states the canonical-property unit before the worked example uses it (the rubric found it first explained in the example); 'map tile' added to the definitions in p11; the synthesis p56 now names routing bought on a volume forecast; the clustering rationale updated. Order of sections unchanged. Notes not taken are in open_questions.\n- **2026-11-12** — Draft check round 1 ESCALATE on a spec-fault flow finding corroborated by both flow readers: the commute arithmetic (p47) sat at the end of the worked example, after its wrap-up p46, although it answers the third question and belongs with routing. Under the brief's rule for spec faults, moved p47 to the end of Commute Search (after the isochrone cache, whose hit rate it uses), rewrote its transition_in, the commute and worked-example controlling ideas and flows, and the post rationale. Intent, thesis, role and journal criteria unchanged; no units added, dropped or merged. Rejected: Placing p47 inside the routing-provider subsection before the cache, because the arithmetic uses the 70% cache hit rate.\n- **2026-11-12** — Draft check round 2 REVISE: added section transitions into map-product, polygons, commute, verticals (prose moved above its table) and questions; clarified 'not an issue' (p13), the forms-to-patterns mapping (p32), tiles versus hexagons (p45); tightened text added in this pass to stay within the word limit. Round 3 ESCALATE on two spec-fault findings (section order of Clustering and Drawn Polygons; the p47 arithmetic) and draft-level points recorded in open_questions. After round 3, two cheap fixes only: the precision-rule pointer names Clustering (p18), and 'My Places is per-listing travel time' (p32).\n- **2026-11-12** — Added minor, post-level units not in the published text: a roadmap paragraph (p04) so the opening announces every section and the kinds of evidence, and a synthesis paragraph (p56) that answers Ingrid's three questions and calls back to the scene. Added a similarity transition from recommendations at the start of p01. Added criteria AC-4 and AC-5 are minor.\n- **2026-11-12** — Section order (draft check round 3, spec fault corroborated by both flow readers), decided under the author's delegation: Drawn Polygons moved directly after Architecture, before Clustering, so the scene's headline problem is answered as soon as the compiler exists and the compiler's inputs come before its output. Rewrote the transition_in of polygons, clustering and commute, the opening sentences of those three sections, p22 and p27, the roadmap (p04 and promises), the post flow rationale and the large_to_small note; Figures 3 and 4 renumbered. The journal spec's AC-2 expected answer lists clustering before drawn polygons; the copy must equal the journal spec, so it is left unchanged here and the swap is reported to the orchestrator as a journal-spec edit. Rejected: Keeping the order and explaining in the prose why outputs come first, because both readers found Clustering's position unclear and asked for the move.\n- **2026-11-12** — p47 commute arithmetic corrected to the arithmetic (rule 3, under the author's delegation): 10% of 2,700 = 270 commute requests per second; 30% isochrone cache misses = about 80 isochrones per second (not 'low hundreds'); the matrix figure now states its assumption from the chapter's own figures (50 pins, the largest list page in the map-versus-list table, timed to one or two places) and gives about 13,500 to 27,000 elements per second instead of an unsupported 'tens of thousands'. The routing decision, which is in the ledger, is unchanged.\n- **2026-11-12** — Round-3 draft points fixed under the author's delegation, with length.max_words raised from 8,498 to 8,750 (+3%, within the 10% allowed): p01 now states what recommendations showed first and puts the map's ranking claim after the place-first argument, explaining 'rather than clicks'; p33 says an isochrone-only design can show only a band ('within 30 minutes'), wrong at the polygon's edge, instead of per-listing minutes; p45 states that the May 2027 session is a design walk-through, not a record, and that tiles are the cache keys and hexagons the clusters; p50 ties the Motorvane-on-Elasticsearch aside to the shared compiler. Minor findings also fixed: 'BKD tree' glossed; ' roduct forms. (fixed under the author's delegation (fix-only pass)).\n- **2026-11-13** — p47 (flow, draft): premises stated (each commute request looks up an isochrone, cached or computed, and needs a matrix for the pins on screen); the routing decision marked as its own step. Figures unchanged. (fixed under the author's delegation (fix-only pass)).\n- **2026-11-13** — p40 (evidence and flow, draft): the 31,000 group peak related to Hearthly (its 4,200 requests/s are Hearthly's part of the peak, nearly two thirds map) and to the point of the section (the map sets Hearthly's capacity need); Rightmove sentence given its point (peaks are sharp and marketing-driven). (fixed under the author's delegation (fix-only pass)).\n- **2026-11-13** — p45 (flow, draft): timeline stated plainly: in September 2027 the team replays a May 2027 session on the target design. (fixed under the author's delegation (fix-only pass)).\n- **2026-11-13** — p50 (flow, draft): 'postcode in German (Umkreissuche)' made 'postcode, called Umkreissuche in German'; minor: 'the table below' made 'the table at the end of this section'. (fixed under the author's delegation (fix-only pass)).\n- **2026-11-13** — length.max_words raised from 8,750 to 8,900 (+1.7%, within the 10% allowance) to fit the glosses and pointers added by the fixes; draft is 8,808 words; no published facts cut (fixed under the author's delegation (fix-only pass)).\n\n## Sources\n\n- **Internal**\n  - _journals/listing-systems-architecture/journal-spec.json — Intent outcome, acceptance criteria AC-1 to AC-3, thesis, role and the hand-off relationship of saved-searches-and-alerts.\n  - _research/scenario-ledger.md — Hearthly map search numbers (Sep 2027), the Lyon apartment, Agence Rhône Habitat, precision levels, cast, group peak, saved-search counts.\n  - _research/brief-search-discovery.md Part 3; _research/brief-listing-data-ingestion.md Part 7 — Map search, clustering and commute research.\n  - location-and-geo, search-architecture, ranking, entity-resolution, saved-searches-and-alerts, reliability-and-scale, meet-veldmark — Public point, place IDs and H3 resolutions; engine decision; ranking concepts; canonical properties; alerts; capacity model; Veldmark facts.\n- **External**\n  - Haldar et al., Learning to Rank for Maps at Airbnb (arXiv, 2024); Airbnb Tech 2025 year in review; Airbnb EBR paper (arXiv, 2026) — Map ranking and evaluation differ from list ranking.\n  - TravelTime, Rightmove case study (n.d.); HousingWire on Zillow commute search (2024); Elastic Rightmove case study (2025); Google Cloud press release on Rightmove (2021) — Commute search forms, routing licensing, map-centric portals, marketing-driven peaks.\n  - Elastic geo-shape, geotile grid and vector tile documentation; OpenSearch geohex grid; Mapbox Isochrone API; Valhalla isochrone service; Mapbox Supercluster; Uber H3 (2018); 24 CFR §100.75 — Engine primitives, clustering options, routing limits and self-hosting, hexagonal grids, fair-housing rules.\n\n## Changelog\n\n- **2026-11-13** — Fix-only pass on the round-6 blocking findings (9 fixed: intro, map-product bridge, pan subsection/levers back-reference, commute patterns, commute arithmetic premises, peak paragraph, worked-example timeline, Umkreissuche); spec p20, p40, p41, p47 updated; status draft. (AI-mediated session)\n- **2026-11-12** — Converted spec.md to spec.json (reconstructed from index.md); added roadmap, canonical-property and synthesis units; status draft. (AI-mediated session)\n- **2026-10-21** — Renamed failure patterns to match where-listing-systems-go-wrong. (AI-mediated session)\n- **2026-10-20** — Sharpening pass (7,522 to 7,516 words; lead tied to Part IV); cross-chapter consistency sweep (6 headings aligned); architecture heading renamed; unsourced commute claim removed; 2 mermaid diagrams replaced with generated illustrations. (AI-mediated session)\n- **2026-10-19** — Initial spec and article; editorial review pass (American spelling, Zillow 2     (function () {
        const data = JSON.parse(document.getElementById('data').textContent);

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
