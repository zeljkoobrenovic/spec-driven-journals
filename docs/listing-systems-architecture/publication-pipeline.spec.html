<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, acceptance criteria AC-1 to AC-3, the thesis and the role are copied unchanged from the publication-pipeline entry in journal-spec.json. Units added by this conversion: a roadmap paragraph in the introduction (p04) and a synthesis paragraph (p52) before the hand-off.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The eight stages from submission to full visibility, the two clocks (platform latency and source latency), and pre- versus post-moderation.\n- **Know:** The split between a synchronous decision path and an asynchronous propagation path, and the mechanisms of unpublish propagation: a consumer registry, version-gated events, tombstones, send-time re-checks and a propagation monitor.\n- **Believe:** Unpublishing is harder than publishing and matters more, and a single p95 that hides coverage, clock and the held listings is not an SLA.\n- **Be able to:** Write a publication-pipeline SLA card with coverage, clock, removal objectives per consumer and a stage budget.\n- **Be able to:** Find where a slow or ghost listing comes from, and decide which stage's budget pays for a new pre-publication check.\n\n**Audience:** Chief and principal architects, platform and search leads, and engineering directors of classifieds, automotive and real-estate marketplaces who own (or inherit) publication latency targets, moderation integration or Ghost Inventory complaints.\n\n**Already knows:**\n\n- What an API, a database, an event stream, a search engine and Kubernetes are; percentiles such as p95; Kafka partitions and consumer offsets.\n- From earlier chapters: the listing aggregate, its lifecycle states, events and versions (listing-aggregate); feeds, snapshots and reconciliation (listing-ingestion); normalization and entity resolution; Veldmark, its brands, cast and Common Ground (meet-veldmark); the failure-pattern names (where-listing-systems-go-wrong); Part I's time to first contact and ghost rates.\n\n**Does not yet know:**\n\n- Publication pipeline, freshness SLA, unpublish propagation, platform latency and source latency, pre- and post-moderation, risk gate, consumer registry, tombstone, zombie listing.\n- Search-engine refresh and soft-commit semantics and searcher warming.\n- The transactional outbox and the event contract (owned by event-driven-listings), the moderation decision service (trust-and-safety-architecture) and the DSA statement of reasons (marketplace-regulation), which are named here and defined in their chapters.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a fast-looking p95 and a sold listing in a digest, the reader names what the SLA hides and where the ghost came from. *Probe:* Your dashboard shows a two-minute p95 from submit to searchable, and a listing sold yesterday evening appeared in this morning's alert digest although search removed it within a minute. Using only this chapter: what might the p95 hide, and how do you stop the digest problem? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-4 | Given a proposed new pre-publication check, the reader decides which listings should wait for it and how its cost is paid within the target. *Probe:* Trust and safety wants every new listing to wait, before it goes live, for an image model that takes up to 25 seconds. Using only this chapter: should every listing wait, and how do you decide whether the 90-second target can absorb it? | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** What happens between a seller pressing \"publish\" and a buyer finding the listing, and how fast must it be?\n\n> **Claim:** Publishing is a decision followed by a propagation: the synchronous path holds only what decides whether a listing may go live (validation, the risk gate and the entitlement check, within about two seconds), and everything else is driven by one listing event under a latency budget per stage that sums to the target (90 seconds p95 at Tradeyard); the freshness target is a contract that names the listings it covers, the clock it measures and the objective for listings held for review, with removal objectives per consumer (10 seconds for search, 2 minutes for every registered copy) tighter than the insertion target; and removal reaches every registered copy through version-gated events, tombstones and send-time re-checks, with a monitor that proves each consumer acknowledged it.\n\n**Disputed by:** The common practice of a serial pipeline in which moderation, enrichment and batch indexing run one after another, 'published' means 'present in the search index', the freshness metric is one p95 over the listings that passed automatically, and removal is designed for the search index only.\n\n**So what:** A Chief Architect who accepts this gives the whole path one owner and an SLA card decided at the architecture forum, makes registration in the consumer registry the price of subscribing to listing events, asks which stage's budget pays for any new pre-publication check, and watches insertion latency by moderation path, the share of listings held and removal latency for the worst consumer.\n\n**How and why:** Tradeyard's six-minute p95 measured only the 94% of listings the automated gate cleared; the other 6%, about 138,000 a week, had no number, and nobody could say how long a sold listing took to disappear from everything. Femke's bike left search one minute after its sale and still appeared in 214 digests assembled from a replica snapshot. In the 90-second budget the synchronous path takes 2 seconds and indexing 15, with search removal at 10 seconds p95 and every registered consumer at 2 minutes; changing the pipeline's shape brings Tradeyard to about 2 minutes by the end of 2027 on the same Solr engine.\n\n**Supporting claims**\n\n- **S1** — Publishing is a decision followed by a propagation: the synchronous path holds only validation, media readiness, the risk gate and the entitlement check, ends with one listing event written through the outbox, and everything else (indexing, alerts, SEO, recommendations, syndication) consumes that event in parallel rather than passing the listing from stage to stage.\n- **S2** — A freshness SLA is a contract that names the listings it covers, the clock it measures (platform or source latency) and the objective for listings held for review, because the moderation mode decides which stages sit on the critical path and a single p95 over the gate-cleared listings hides the rest.\n- **S3** — The target is met by a latency budget per stage that sums to it (90 seconds p95 at Tradeyard), and most of the gain comes from the pipeline's shape (events instead of stacked timers) before the engine's visibility model gives the last part.\n- **S4** — Removal touches more copies than publication and a missed removal can send buyers to a scammer, so it reaches every registered copy through a consumer registry, version-gated events, tombstones and send-time re-checks, with takedowns on the same path at a higher priority and objectives per consumer tighter than the insertion target.\n- **S5** — The pipeline is provable only when 'published' is defined by the listing record and its event rather than by the index, one owner holds the SLA card and the registry, and instruments measure every stage and every consumer.\n\n## Role in the part\n\nTies the earlier links into one path with a time budget and makes removal reach every copy, setting the freshness and removal guarantees that discovery reads. Supports P3-4 of part `part-3`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `assertion_evidence_reasoning` in in-practice: public records first, then Tradeyard's baseline, contract, budget and plan, then the removal test on the bike; `grouping` in trade-offs, failure modes, the Chief Architect's view and the questions: the book's closing judgements on a design already shown)\n\nThe scene states two problems: an insertion number that covers only some listings, and a removal path with no number, and it reconstructs where the six minutes went, so the stacked timers motivate what follows. The concepts give the stages, clocks and moderation modes both answers need. The architecture answers the insertion problem's shape (decide, then propagate) and lays down the ordering rules that removal depends on; unpublish propagation then answers the removal problem with those rules in hand; observability gives the proof both answers need. The worked example then tests the design on public records and prices it at Tradeyard against the scene's baseline, closing both scene questions; the vertical section generalizes the card it produced. Trade-offs, failure modes, the Chief Architect's view and questions judge a design the reader has already seen. Unpublish before architecture would use version-gated events and tombstones before they are defined; expiry sits with the other causes of removal, so that sale, expiry and takedown meet on one path; the budget before the stages and the engines' visibility model would allocate seconds to things not yet explained; the vertical table before Tradeyard's card would show a format before the reader has seen one filled in.\n\n## Introduction\n\n**Hook** (`direct_statement`): The publication pipeline is the path that turns an accepted listing into visible supply, and back again.\n\n**Bridge:** The earlier Part III chapters bring a record in, clean it and match it, and none of that reaches a buyer until the listing appears in search, an alert, a search-engine result or a recommendation. → The path through a dozen systems owned by half a dozen teams, each adding latency, each able to fail and each holding a copy that must later be removed.\n\n**Thesis statement** (KEY POINTS callout (all three bullets); p01 frames the path in both directions.): Publishing is a decision followed by a propagation under a budget per stage; a freshness SLA is a contract that names its coverage, its clock and the held listings; and unpublishing, harder and more important than publishing, must reach every registered copy through version-gated events, tombstones, send-time re-checks and a per-consumer monitor.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p04.):\n\n- Tradeyard's six minutes, where they went, and the sold bike in 214 digests. *Kept in:* scene.\n- The stages, clocks and moderation modes. *Kept in:* concepts.\n- A decision path and a propagation path, with its ordering rules. *Kept in:* architecture.\n- Making unpublishing reach every copy through a consumer registry, send-time re-checks, expiry and one path for takedowns. *Kept in:* unpublish.\n- How to prove the pipeline works. *Kept in:* observability.\n- How others got faster and Tradeyard's 90-second budget. *Kept in:* in-practice.\n- Freshness SLAs by vertical, trade-offs, failure modes, the Chief Architect's view and review questions. *Kept in:* verticals, trade-offs, failure-modes, ca-view, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | The publication pipeline is the last link of Part III's supply chain: it turns a listing that ingestion, normalization and entity resolution have brought in, cleaned and matched into visible supply and back again, through a dozen systems that each add latency, can fail and hold a copy. | reasoning: Ingestion, normalization and entity resolution reach no buyer until the listing appears in search, an alert, a search-engine result or a recommendation; Part I's time to first contact sets the publication budget and its ghost rates the removal guarantee; Part IV is only as fresh as this pipeline. |  |\n| p02 | definition | The chapter owns three terms: the publication pipeline (the stages from submission to visibility on every surface, and back), the freshness SLA (the target for how fast a change becomes visible and an ended listing disappears) and unpublish propagation (the mechanism that carries the end of a listing to every copy, with evidence). |  | `elaboration`: The path from submission to visibility and back. → The three terms the chapter owns for it. |\n| p03 | context | Neighboring chapters own the parts (lifecycle states, the moderation gate, the event contract, indexing, alert fan-out); this chapter owns the whole path, the budget that ties the stages together and the measurement that proves it works. |  | `contrast`: The terms this chapter owns. → The parts that other chapters own, and what is left for this one. |\n| p04 | transition | The chapter starts with Tradeyard's six minutes and a sold bike that reached 214 alert digests, defines the stages, clocks and moderation modes, splits the pipeline into a decision path and a propagation path, makes unpublishing reach every copy (registry, send-time re-checks, expiry, takedowns), shows how to prove it works, then works through public records, Tradeyard's baseline and its 90-second budget, freshness SLAs by vertical, trade-offs, failure modes, the Chief Architect's view and review questions, and names its kinds of evidence. |  | `sequence`: What this chapter owns. → The order in which it builds the path, and the Veldmark case it uses. |\n\n## Sections\n\n### Setting the Scene at Veldmark: Where Did Six Minutes Go?\n\n**Controlling idea** (`context`, id `scene`): Tradeyard's six-minute p95 and Femke's sold bike in 214 digests pose the chapter's two questions, which listings the publication number describes and how long a sold listing takes to disappear from everything, and the reconstruction shows the six minutes are stacked timers.\n\n**Advances the thesis** (S2, S4, S3): Shows an unmeasured held share, an unmeasured removal path and a delay built from stacked timers, the gaps the thesis closes.\n\n**Transition in:** `example`: The roadmap's first item. → Femke's bike on Tradeyard Netherlands, with Veldmark named as fictional.\n\n**Order of paragraphs** (`chronological`): The bike's timeline first, then the number Ingrid puts on it, then her two questions, which only make sense once the number and the timeline are known; then the reconstruction answers the heading's question of where the six minutes went, so the reader carries the stacked timers into the concepts and the architecture they motivate.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | example | Femke's city bike went from submission at 19:42 on 7 March 2027 to searchable at 19:48, sold on Monday and left search at 18:11, yet appeared in 214 Tuesday digests assembled at 17:30 from a replica snapshot that was never re-checked. | scenario: 19:42 submit, 19:44 cleared, 19:48 searchable, 312 saved searches, first buyer 19:55, 14 conversations, sold Monday for €225 via Safe Deal, marked sold 18:10, removed from search 18:11, 214 Tuesday 07:00 digests assembled 17:30 from a replica snapshot. |  |\n| p06 | context | Ingrid reads the six minutes as Tradeyard's p95 against Common Ground's 90-second target, and Daan explains that it comes from a batch moderation consumer, a timed batch indexer and Solr's commit timer. | scenario: p95 of 6 minutes; Common Ground (€140 million) target of 90 seconds p95 by end of 2028; Yardstick's RabbitMQ batch moderation consumer, timed batch indexer and Solr commits. | `elaboration`: The bike's timeline. → The number it stands for and where the time goes. |\n| p07 | claim | Ingrid's first question is which listings the six minutes describes (only the 94% cleared by the automated gate, with the 6%, about 138,000 a week, unmeasured) and her second is how long a sold listing takes to disappear from everything, for which nobody had a number either. | scenario: 94% automated clearance; 6% (about 138,000 a week) to human review, visible after minutes or hours; no removal number. | `contrast`: Daan's explanation of how to make stages faster. → The questions Ingrid asks instead. |\n| p35 | evidence | Ingrid's team reconstructed Tradeyard's six minutes stage by stage from Yardstick's logs, with illustrative figures that show where the time goes. | table: Baseline table: submit 2 s/4 s; thumbnails 18 s/70 s; moderation consumer 50 s/140 s; batch indexer 70 s/150 s; Solr soft commit and warming 40 s/85 s; end to end 3 min 10 s median, 6 min p95. | `cause_effect`: Ingrid's questions and Daan's account of batches and timers. → The stage-by-stage reconstruction of where the six minutes went. |\n| p36 | example | Femke's bike sits at the slow end of the table: cleared at 19:44, it waited for the indexer's next run and the next soft commit and was searchable at 19:48. | scenario: Cleared 19:44, searchable 19:48 after the indexer run and soft commit. | `example`: The baseline table. → The bike's place in it. |\n| p37 | analysis | The reconstruction produced three findings: every timer stacks, images were processed at the wrong moment, and the held 6% had no measure at all. | figure: Figure 1: three timed stops versus a continuous stream. | `cause_effect`: The baseline and the bike. → What they show. |\n\n### Concepts: Stages, Clocks and Moderation Modes\n\n**Controlling idea** (`definition`, id `concepts`): Eight stages split into a decision and a propagation, a freshness SLA must name one of two clocks, and the moderation mode decides which stages sit on the critical path.\n\n**Advances the thesis** (S1, S2): Gives the stage split the architecture rests on and the coverage and clock terms the SLA needs.\n\n**Transition in:** `cause_effect`: Ingrid's two questions, which cannot be answered without knowing what the pipeline consists of. → The stages, clocks and moderation modes that answering them requires.\n\n**Order of paragraphs** (`prerequisite_order`): Stages first, because the clocks are measured across them and the moderation mode decides which of them sit on the critical path; the leboncoin and Which? cases follow the moderation definition because they test it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | definition | A listing passes eight stages between submission and full visibility, each with what it decides, a typical owner and whether it runs synchronously. | table: Stage table: validation, media readiness, risk gate, entitlement and pricing check, enrichment, asynchronous risk checks, indexing and cache invalidation, notification and distribution. |  |\n| p09 | analysis | The first four stages decide whether the listing may go live and the last four decide where it must appear, and mixing the two is the root of most slow pipelines. | reasoning: Indexing inside the request makes the seller wait for search; moderating after the indexer has seen the listing shows unmoderated content. | `elaboration`: The eight stages. → The two questions they answer. |\n| p10 | definition (list) | A freshness SLA must say which clock it measures: platform latency, from receipt to visible, which the marketplace controls, or source latency, from the real-world change to receipt, which it controls only indirectly. |  | `sequence`: The stages a listing passes. → The two clocks a time across them can be measured on. |\n| p11 | example | For dealers the two clocks diverge, as in the Essen Golf whose sale reached Motorvane 26 hours late while its own removal took ten minutes, so an SLA that does not separate them blames the wrong team. | scenario: Autohaus Ruhrblick sold the Golf on 29 April 2027; removal arrived through the next day's snapshot, 26 hours after the sale; Motorvane's platform latency ten minutes. | `example`: The two clocks. → A case where they differ by two orders of magnitude. |\n| p12 | definition | Pre-moderation checks before visibility and post-moderation after, large classifieds choose per listing by risk, and the moderation mode therefore decides which stages sit on the critical path and must be reported separately in the SLA. | example: A verified dealer's car goes live on the gate's verdict; a new account's first rental in a fake-rental city waits for image and duplicate checks. | `sequence`: Clocks, the first thing an SLA must name. → Moderation modes, which decide what lies on the clock's path. |\n| p13 | evidence | The pipeline's actual moderation mode must match what the marketplace tells users, as the 2015 Paris judgment against leboncoin shows. | case: December 2015: leboncoin found guilty of misleading commercial practices for claiming every ad passed validation when not all were reviewed before going live; as a host it had no duty to check every ad in advance. | `elaboration`: Choosing the moderation mode per listing. → The obligation to describe that choice truthfully. |\n| p14 | recommendation | A material edit is a new submission and must re-enter the gate, as the 2024 Which? test of Gumtree shows. | case: December 2024 Which? undercover test: Gumtree blocked a first scam-style ad, but edited versions passed review 'in minutes'. | `additional_support`: The rule that the actual mode must match the claim. → A second rule about which changes the gate must see. |\n\n### Architecture: A Decision Path and a Propagation Path\n\n**Controlling idea** (`process`, id `architecture`): The synchronous path decides and stops at one event written through the outbox; the asynchronous path fans that event out to consumers that apply events by version and keep tombstones.\n\n**Advances the thesis** (S1, S4): Builds the decide-then-propagate design and the ordering rules removal later depends on.\n\n**Transition in:** `problem_solution`: The concepts' finding that mixing decision and propagation slows pipelines. → A design that separates them.\n\n**Order of paragraphs** (`large_to_small`): The whole design (Figure 2) first, then the synchronous path, then the asynchronous path's shape, then the rules that make fan-out safe. The ordering rules come last because they only matter once many consumers receive one stream.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p15 | context | The reference architecture is Veldmark's target design and an inference from public building blocks, because no classifieds operator has published its complete pipeline; Figure 2 shows the decision path ending in one event and the propagation path fanning it out. | figure: Figure 2: decision path, one event, propagation path with every consumer reporting to a freshness monitor; the human-review path rejoins at the same publication step. |  |\n| p16 | process (list) | The synchronous path runs while the seller waits, gives a definite answer and does four things only: validate, confirm media readiness, run the risk gate and check entitlements. | example: Media processed during drafting; gate within a few hundred milliseconds; insertion fees for vehicles and property at Tradeyard Poland; a missing entitlement as a decision outcome. | `elaboration`: Figure 2's decision path. → Its four steps. |\n| p17 | process | The listing context then writes the listing and its event in one transaction through the transactional outbox and returns; that record and its event, not the index, define what 'published' means; the event is ListingPublished for most listings and ListingSubmitted for a gate-cleared listing whose risk tier waits for further checks; everything after the write is propagation, and the seller gets a promise the platform can keep. |  | `sequence`: The four decision steps. → The write that ends the synchronous path. |\n| p18 | recommendation | Indexing, alert matching, sitemaps, recommendations and syndication must never be called from the request, because each can be slow or down and none decides whether the listing may exist. |  | `emphasis`: Everything after the write is propagation. → The stages that must stay out of the request, and why. |\n| p19 | claim | The asynchronous path begins with the listing event and should fan it out rather than pass the listing from stage to stage. |  | `sequence`: The synchronous path's end, the event. → What the asynchronous path does with it. |\n| p20 | comparison | In the sequential design each stage calls the next, so latency is the sum, a slow stage blocks everything and adding a consumer is invasive, and Yardstick's timers were a version of it. |  | `elaboration`: Fan out rather than pass along. → The design that passes along, and its costs. |\n| p21 | comparison | In the fan-out design the listing context publishes ListingPublished once and every consumer subscribes, so consumers run in parallel, each surface waits only for the decision and its own consumer, and a new consumer touches nobody else. |  | `contrast`: The sequential design's costs. → The fan-out design that removes them. |\n| p22 | explanation | Asynchronous checks that may still change the decision run before ListingPublished for the risk tiers that need them and after it for the rest, where they can still demote, hold or remove a live listing through enforcement. |  | `elaboration`: Fan-out after the decision. → The checks that can still change it, and where they sit. |\n| p23 | process (list) | Fan-out is safe only if every consumer applies duplicate, late and out-of-order events correctly, through three rules: per-listing order, version-gated apply and tombstones instead of deletions. | source: Vinted's 2021 indexing pipeline used the Kafka offset as the Elasticsearch external version and documented that adding partitions broke the ordering assumption. | `cause_effect`: Many consumers receiving one event stream. → What each must do so that duplicates, delays and reordering do no harm. |\n| p24 | cause_effect | These rules prevent the zombie listing, in which a replay or reindex writes an old active state over a sold one, the most common way a backfill creates Ghost Inventory. | figure: Figure 3: a backfill's version 3 finds the tombstone and is ignored; without it the sold listing is recreated. | `cause_effect`: The three rules. → The failure they prevent. |\n\n### Unpublish Propagation\n\n**Controlling idea** (`recommendation`, id `unpublish`): Removal touches more systems than publication and its failures cost more, so it needs a consumer registry with objectives per consumer, send-time re-checks for work assembled in advance, a lifecycle scheduler that ends listings on time, and takedowns on the same path at a higher priority.\n\n**Advances the thesis** (S4): Specifies the removal half of the thesis, consumer by consumer.\n\n**Transition in:** `contrast`: Publication through fan-out and the rules that keep removed listings removed. → Removal as its own problem, harder than publication.\n\n**Order of paragraphs** (`prerequisite_order`): The registry comes first because nothing can be removed from a copy nobody knows about; the objectives per consumer follow the registry they belong to; send-time re-checks close the gap that events alone leave; expiry follows as the second cause of removal, by the clock rather than the seller; takedowns come last because they reuse everything before them, and Figure 5 then gathers every cause of removal on one path.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p27 | claim | Removal is the mirror image of publication but touches more systems, because a week-old listing has been copied into digests, candidate stores, feeds and caches, and its failures cost more, because a listing left up after a takedown sends buyers to a scammer. |  |  |\n| p28 | claim | The first requirement is a consumer registry of every system that holds listing data, because a removal cannot reach a copy nobody knows exists. | scenario: Veldmark's March 2027 audit: about 41,000 Tradeyard NL listings a week still present in at least one downstream copy 24 hours after ending in Yardstick, mostly in the alert-digest cache and the recommendation candidate store, neither on any list.; figure: Figure 4: removal reaches only registered copies.; table: Consumer table: search index, caches, alert matcher and digests, recommendations, listing page and SEO, messaging, advertising, partner feeds, analytics, each with removal action and objective. | `sequence`: Removal touches more systems. → The first thing needed to reach them. |\n| p29 | explanation | The objectives in the table are Veldmark's 2027 targets aligned with the search and event chapters, and how an ended listing is rendered is decided from the reason it ended, which the pipeline must carry. |  | `elaboration`: The consumer table. → Where its numbers come from and what the pipeline must carry beside them. |\n| p30 | recommendation | Consumers that assemble work in advance must re-check each listing's current state just before sending, because purges on removal events can fail or arrive late. | scenario: Femke's bike in 214 Tuesday digests built at 17:30 and sent at 07:00; one batched lookup per digest. | `additional_support`: Removal events and purges for every registered copy. → A second safeguard for copies assembled before the removal. |\n| p25 | process (list) | The lifecycle scheduler, which ends the listings no seller ends, is part of the pipeline and fails in three ways: midnight expiry storms, a lagging scheduler, and renewals treated as republication. | quotation: mobile.de's Seller API keeps a separate renewalDate, 'the date the ad was last marked as new, which makes it appear new in search', next to creation and modification dates. | `sequence`: Removal of sold listings through events, purges and send-time re-checks. → Removal by the clock: the lifecycle scheduler that ends the listings no seller ends. |\n| p26 | evidence | Downstream channels enforce expiry whether the marketplace does or not, so the pipeline must execute lifecycle rules on time and propagate their results. | source: Google Merchant Center expires products 30 days after their last update; Google's job-posting guidance warns failing to remove expired jobs 'may result in a manual action'. | `cause_effect`: The scheduler's failure modes. → Why they cannot be left to downstream channels. |\n| p31 | recommendation | Takedowns should ride the same removal path as sales on a priority lane, because two mechanisms guarantee that one falls behind the registry; only priority, the gone page, pending messages and the statement of reasons differ. | figure: Figure 5: sales, expiry, takedowns and feed reconciliation end in one removal event; each consumer acknowledges the version it applied to the propagation monitor. | `similarity`: Removal for sales and for expiry. → Removal for fraud and policy takedowns, which uses the same rails. |\n\n### Observability: Proving the Pipeline Works\n\n**Controlling idea** (`recommendation`, id `observability`): A pipeline spanning eight teams is proven by five instruments no single team can game: the listing journey, synthetic canaries, stuck-listing detection, copy reconciliation and the two SLAs side by side.\n\n**Advances the thesis** (S5): Gives the measurement that makes the budget and the removal objectives provable, and ties it to defining 'published' in the record.\n\n**Transition in:** `cause_effect`: Objectives for insertion and for every consumer's removal. → The measurement that proves each is met.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p32 | recommendation (list) | Five instruments prove the pipeline works, and copy reconciliation works only because the record, not the index, defines what is published. | reasoning: If the index is the only place that knows, the pipeline has become Search as System of Record and none of the questions can be answered. |  |\n\n### In Practice: How Others Got Faster, and Tradeyard's Budget\n\n**Controlling idea** (`evidence`, id `in-practice`): Public records show that changing the pipeline's shape gives most of the gain and the engine's visibility model the rest, and Tradeyard's contract, budget and plan follow the same order while the bike's sale tests the removal side.\n\n**Advances the thesis** (S3, S2, S4): Tests the design on public records and prices it in Tradeyard's SLA card and budget.\n\n**Transition in:** `example`: The design and the instruments that prove it. → Documented cases and Tradeyard's own numbers.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): Public records first, so the shape-first lesson is established; the scene's baseline findings then justify the contract and budget; the plan shows the order of gains; the removal test closes the case the scene opened. Putting the plan before the public records would present Tradeyard's two-step order of gains (shape, then engine) without the evidence that it is the usual order.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p33 | evidence | Vinted's public record shows that its first freshness gain came from changing the pipeline's shape and the second from the engine's visibility model. | source: Vinted 2023: from Sidekiq delta jobs (up to about seven minutes) to CDC and Flink read models (about one minute); 2024, after moving to Vespa: 5-second visibility interval and a 4.64-second p99 to index a single item. |  |\n| p34 | explanation | Each engine documents when new documents become visible and at what cost, which is why commit frequency is a capacity decision as much as a freshness one. | source: Elasticsearch refresh every second only for search-active indices, lighter than a commit; Solr 8.11 soft and hard commits; new searchers auto-warm from the old one's caches. | `elaboration`: The engine's visibility model as the second lesson. → What the engines document about it. |\n| p38 | recommendation (list) | Ingrid's team wrote the 90-second target as a contract with three parts on the SLA card: coverage (gate-cleared listings, with a held-listing objective and the held share beside both), clock (platform latency) and removal objectives (the consumer table's targets). | scenario: Coverage: 94% gate-cleared; held p90 under 30 minutes to decision in staffed hours; held share published. Clock: platform latency from receipt to searchable; feeds have their own SLA. Removal: search p95 10 s, every registered consumer p95 2 min, partner feeds 15 min, nothing sent after the end. | `problem_solution`: The three findings, including the unmeasured held share. → The contract that closes them. |\n| p39 | evidence | The budget allocates the 90 seconds to stages, counting media and asynchronous checks once because they run in parallel. | table: Budget: sync path 2 s, outbox to topic 2 s, async checks and media 30 s, publication decision 1 s, indexing 15 s, caches 20 s, slack 20 s, total 90 s. | `elaboration`: The contract's insertion target. → Its allocation to stages. |\n| p40 | evidence | The plan reaches about two minutes on Solr by the end of 2027 by changing the pipeline's shape, and the rest with the 2028 moves of the insertion flow and search, so shape gives most of the gain and the engine the last part. | scenario: Second half of 2027: event-driven indexer fed from the listing event contract (live 1 July 2027), image processing during drafting, moderation pull as a stream; about 2 minutes p95 by end of 2027; insertion flow out of Yardstick Q2 2028; OpenSearch Q4 2028. | `sequence`: The budget. → How and when it is delivered. |\n| p41 | example | The bike's sale tests the removal side: under the new contract the digest service purges and re-checks at send time, so the bike reaches no Tuesday digest and the monitor shows each consumer's acknowledgement. | scenario: ListingSold at 18:10; recommendation store acknowledges 18:11, partner syndication feed 18:19; no Tuesday digest. | `contrast`: The insertion side of the plan. → The removal side, tested on the same bike. |\n\n### Freshness SLAs by Vertical\n\n**Controlling idea** (`comparison`, id `verticals`): A group needs one SLA format with values per vertical and channel, because supply channels, removal risks and moderation paths differ.\n\n**Advances the thesis** (S2): Shows coverage, clock and moderation path as fields whose values differ by vertical.\n\n**Transition in:** `elaboration`: Tradeyard's SLA card. → The same format filled in for the other verticals.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p42 | comparison | A group does not need one SLA but one SLA format with values per vertical and channel. | table: Vertical table: Tradeyard, Motorvane (88% dealer feeds), Hearthly (84% agency feeds), jobs; what sellers notice, insertion objective, dominant removal risk, source-latency control, moderation path, special constraint. |  |\n| p43 | example | In real estate a listing that waits for a duplicate check before going live is slower but lands in the right property cluster, so Hearthly accepted a slower insertion objective, and the Barcelona ring made image and duplicate checks pre-publication for rentals in fake-rental cities. | scenario: Hearthly's slower objective for entity resolution; the Barcelona ring of July 2027 used photos stolen from real listings. | `example`: Values differ per vertical. → One vertical's deliberate choice of a slower value. |\n\n### Trade-offs\n\n**Controlling idea** (`comparison`, id `trade-offs`): The pipeline's choices (shape, moderation mode, visibility trigger, engine interval, removal mechanism, digest freshness) each have conditions, and the one that decides the others is where 'published' is defined.\n\n**Advances the thesis** (S1, S4, S5): States the recommended choices as decisions with conditions and names the decisive one.\n\n**Transition in:** `conclusion_summary`: The design, the worked example and the vertical values. → The choices they rest on, as options with conditions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p44 | analysis | The trade-off that decides the others is where 'published' is defined: by the listing context's state and event, which can be measured, reconciled and rebuilt, or by the indexer, which turns every missing or lingering listing into an investigation. | table: Trade-off table: shape, moderation mode, visibility trigger, engine visibility, removal mechanism, digest freshness, each option with when it is right and what it costs. |  |\n\n### Failure Modes\n\n**Controlling idea** (`counterargument`, id `failure-modes`): Ten common failures are what happens when each rule of the design is skipped.\n\n**Advances the thesis** (S1, S2, S3, S4): Shows the cost of each skipped rule.\n\n**Transition in:** `contrast`: The recommended choices. → What goes wrong without them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p45 | counterargument (list) | Ten failures follow from skipping the design's rules, each with its fix: a serial moderation queue, stacked timers, indexing before the decision, edits that skip the gate, one p95, removal measured only in search, zombies from replays, expiry storms and lag, unregistered copies, and renewal as republication. |  |  |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `ca-view`): The Chief Architect gives the whole path one owner, makes the SLA card a decision record, makes registration the price of access, keeps the moderation claim provable and watches the numbers that cannot be gamed.\n\n**Advances the thesis** (S5, S2, S4): Turns the design into group decisions with owners and measures.\n\n**Transition in:** `cause_effect`: The failure modes. → The decisions that prevent them.\n\n**Order of paragraphs** (`prerequisite_order`): Owner first, because the card, the registry and the watch list need someone to hold them; the card before the registry because the card sets the objectives registration commits to; honesty about the mode next; the watch list last because it measures all of them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p46 | recommendation | The whole path needs one owner, at Veldmark the listing platform team in Yara Mendes's organization, which owns the numbers that show whether the stages add up but not the stages. | scenario: Listing platform team under Yara Mendes owns the SLA card, budget, consumer registry and freshness monitor. |  |\n| p47 | recommendation | The SLA card is a decision record, decided at the architecture advice forum, so a new pre-publication check must say which stage's budget pays for it. |  | `sequence`: The owner. → The record the owner holds. |\n| p48 | recommendation | Registration in the consumer registry is the price of access to listing events, enforced at subscription time, and is the cheapest Ghost Inventory control available. |  | `sequence`: The card's removal objectives. → The rule that puts every consumer under them. |\n| p49 | recommendation | Legal and product teams must be able to state from the pipeline's configuration what share of listings is checked before publication, because the leboncoin judgment makes a moderation claim a factual claim. |  | `additional_support`: Registration as a rule the platform enforces. → A second claim the pipeline must be able to prove. |\n| p50 | recommendation | The numbers to watch are insertion latency per brand, channel and moderation path, the held share, review latency, removal latency per consumer, the overdue backlog, reconciliation mismatches and canaries at peak, and a number that improves while the held share rises is not an improvement. |  | `conclusion_summary`: The owner, card, registry and moderation claim. → The measures that show whether they hold. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Ten questions take the design into a review of the reader's own pipeline.\n\n**Advances the thesis** (S1, S2, S3, S4, S5): Gives the reader the design as questions for their own platform.\n\n**Transition in:** `conclusion_summary`: The Chief Architect's decisions. → The questions a reviewer asks to find them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p51 | recommendation (list) | Ten review questions cover the synchronous path, the SLA's coverage and clock, the stage budget, where 'published' is defined, edits, event handling, the consumer registry, send-time re-checks, takedowns and canaries at peak. |  |  |\n\n## Conclusion: From Published to Professionals\n\n**Synthesis:** Ingrid's two questions have one answer: nobody had written down what the pipeline counts. The SLA card names the listings, the clock and the held objective; the consumer registry names every copy a removal must reach; both work only because 'published' is defined by the listing record and its event.\n\n**So what:** With that definition, one owner can promise a number for the path there and back again and prove it per consumer, instead of investigating each slow or ghost listing after a buyer finds it.\n\n**Callback:** The opening's path 'and back again', and Ingrid's two questions in the scene: which listings the six minutes describes, and how long a sold listing takes to disappear from everything. The synthesis answers both questions with the SLA card and the consumer registry, and names the path there and back again as what one owner promises.\n\n**Takeaway** (`course_of_action`): Write the SLA card with coverage, clock and removal objectives, and make registration in the consumer registry the price of subscribing to listing events.\n\n**Hand-off** to [Serving the Pros: Dealer, Agent and Merchant Tooling](professional-seller-tooling.html): `contrast`: The publication pipeline, which treats every seller the same way, and the published, removable listings it produces. → The sellers who supply most of a vertical marketplace's inventory, dealers and agencies managing hundreds of listings who check the marketplace against their own systems, and how to build their tooling without compromising the marketplace's neutrality.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p52 | synthesis | Ingrid's two questions have one answer, writing down what the pipeline counts: the SLA card names the covered listings, the clock and the held objective, the registry names every copy, and both rest on defining 'published' by the listing record, which lets one owner promise and prove the path there and back again. | reasoning: The card and the registry come first; stage-by-stage speedups follow from them. |  |\n| p53 | transition | The pipeline treats every seller the same way, but most of a vertical marketplace's inventory comes from dealers and agencies managing hundreds of listings, whose tooling and its neutrality the next chapter takes up. |  | `contrast`: The pipeline that treats every seller the same way. → Professional sellers and their tooling. |\n\n## Non-goals\n\n- Lifecycle states and durations. See [The Listing Aggregate: Identity, Lifecycle and Invariants](listing-aggregate.html).\n- Moderation policy, decision service and enforcement ladder. See [Trust and Safety as a Platform](trust-and-safety-architecture.html).\n- Event contract, outbox and schema evolution. See [Every Change Is an Event: Event-Driven Listing Architecture](event-driven-listings.html).\n- Index design and engine choice; alert matching and fan-out. See [Search Architecture for Listings: Indices, Freshness and Scale](search-architecture.html), [Tell Me When It Appears: Saved Searches and Alerts](saved-searches-and-alerts.html).\n- Feed reconciliation and source-latency fixes; gone-page HTTP policy. See [Many Doors In: Forms, APIs and Bulk Feeds](listing-ingestion.html), [Found by Google: Web, App and SEO Architecture for Listings](web-and-seo-architecture.html).\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-10-19** — Framed publication as 'decide, then propagate' rather than as a linear stage list, because the sync/async split explains most latency and failure.\n- **2026-10-19** — Defined the 90-second target as covering gate-cleared listings only, with a separate review-path objective and the held share published, to stop the metric being gamed or dominated by the review queue (recorded in the ledger).\n- **2026-10-19** — Made takedowns ride the same removal path on a priority lane, consistent with trust-and-safety-architecture and event-driven-listings. Rejected: A separate takedown mechanism.\n- **2026-10-19** — Reused the index budget (15 s) and removal targets (10 s search, 2 min consumers, 15 min partner feeds) from neighboring chapters instead of inventing new ones.\n- **2026-11-12** — Converted spec.md to spec.json. Success criteria: the eight-stages, two-clocks, version-gating and unpublish-design criteria are replaced by the journal spec's AC-1 (cold reader) and AC-3 (reverse outline); the moderation criterion is rewritten as AC-4 (minor, added here lished (image models and duplicate search for tiers that require them, and late image derivatives when a photo was added just before submission, since drafting-time processing 'usually' finishes first, as the stage table says); a listing that goes live on the gate with images ready skips the row, and its 30 seconds become margin. Word limit raised from 6,505 to 6,600 (+1.5%) for this fix (accepted under the author's delegation, 2026-11-12).\n- **2026-11-12** — Minor single-reader findings kept as published (accepted under the author's delegation, 2026-11-12): 'freshness monitor' and 'propagation monitor' (the ledger names the freshness monitor; the KEY POINTS callout and Figure 5 are not renamed); Figure 3's 'version 3' (matches the figure); the decisive trade-off stays in prose before the table; the Vinted Kafka-offset detail; soft commit and searcher warming named in the baseline table before In Practice explains them; the material-edit rule under Concepts; the 'ghost rates' back-reference.\n- **2026-11-12** — Flow and thesis rubric notes not taken earlier stay not taken (accepted under the author's delegation, 2026-11-12): p25/p26 and p35/p36 stay separate units, p22 stays where it is, p44 and p32 unchanged, the baseline stays in the scene before the Vinted record; the thesis is copied from the journal spec and is not changed here.\n- **2026-11-12** — Carried-over spec.md questions closed (accepted under the author's delegation, 2026-11-12): the baseline stage breakdown stays illustrative, as the text says; Motorvane and Hearthly SLA values stay qualitative; the reference design stays until an operator documents its full pipeline.\n\n## Sources\n\n- **Internal**\n  - _journals/listing-systems-architecture/journal-spec.json — Intent outcome, acceptance criteria AC-1 to AC-3, thesis, role and the hand-off relationship of professional-seller-tooling.\n  - _research/scenario-ledger.md — Tradeyard 6-minute p95, 90-second target, 94%/6% moderation split, the Rotterdam bike, the Essen Golf, the SLA card, the 41,000-a-week audit, Yardstick milestones.\n  - listing-aggregate, search-architecture, event-driven-listings, trust-and-safety-architecture, listing-ingestion, entity-resolution — Times, budgets and removal objectives kept consistent; the online checks that run inside this pipeline.\n  - Research briefs: platform (Parts 2 and 12), trust (Part 3), data ingestion (Parts 5 and 11), search (2.5, 2.6) — Public evidence.\n- **External**\n  - Vinted Engineering 2021, 2023, 2024 — Indexing ordering and freshness improvements.\n  - Elastic near-real-time search; Apache Solr Reference Guide 8.11 — Refresh, commit and warming semantics.\n  - Clubic, 2015 (leboncoin judgment); Which?, 2024 — The moderation-claim and edited-ad cases.\n  - Google Merchant Center expiry; Google job-posting guidance; mobile.de Seller-API — Downstream expiry enforcement and the renewal date.\n\n## Changelog\n\n- **2026-11-12** — Orchestrator review: restored 'in 2026' on the 94% automated-gate share; the figure is in the ledger's 'Volumes (2026, rounded)' table. Check report stale.\n- **2026-10-19** — Initial spec and article. (AI-mediated session)\n- **2026-10-19** — Editorial review pass: digest snapshot source aligned with the ledger, restored toolkit link, Vinted p99 claim worded as published, American spelling, timetoread corrected. (AI-mediated session)\n- **2026-10-19** — Added 2 inline illustrations (article-illustrator); figures renumbered. (AI-mediated session)\n- **2026-10-20** — Cross-chapter consistency sweep: 3 headings aligned with the book's shared section names, glossary terms and source-group structure; no body text changed. (AI-mediated session)\n- **2026-10-20** — Sharpening pass: 5,573 to 5,551 prose words; lead places the chapter as the last link of Part III's supply chain; 3 headings renamed; leboncoin and Which? lessons split into point-first paragraphs. (AI-mediated session)\n- **2026-10-20** — Replaced 3 mermaid diagrams with generated illustrations (figure numbers and captions unchanged; sources archived in _research/mermaid-figures.json). (AI-mediated session)\n- **2026-10-21** — Renamed failure patterns to match where-listing-systems-go-wrong. (AI-mediated session)\n- **2026-11-12** — Converted spec.md to spec.json (outcome spec), reconstructed from the published text; status draft. (AI-mediated session)\n- **2026-11-12** — Draft check rounds 1-3 run (ESCALATE at round 3, budget spent); fixes after round 3 applied without another check (see open_questions); index.md 6,503 words against the 6,505 limit. (AI-mediated session)\n- **2026-11-12** — After draft-check round 2 (spec faults, corroborated by both flow readers): Tradeyard's baseline (p35-p37) moved from In Practice to the end of the scene, which asks where the six minutes went; the entity-resolution detail removed from p01's controlling idea; p17 now states once which event a high-risk gate-cleared listing gets; p36 says the bike sits at the slow end of the table. (AI-mediated session)\n- **2026-11-12** — After draft-check round 1 (spec faults, corroborated by both flow readers): Expiry and renewal (p25, p26) moved from Architecture into Unpublish Propagation, before takedowns; the conclusion heading renamed from 'From Pipeline to People' to 'From Published to Professionals' so it names the synthesis as well as the hand-off. (AI-mediated session)\n- **2026-11-12** — Thesis rubric (pass with notes): S4 made concrete. Flow rubric (sound with notes): p17 now states that the record and its event define published; p38 points back to the consumer table; p52 ends with the course of action. No reordering. (AI-mediated session)\n- **2026-11-12** — Escalation resolved under the author's delegation: open questions moved to the decision log; p39 explains the 30-second asynchronous checks and media row; word limit 6,600. (AI-mediated session)\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
