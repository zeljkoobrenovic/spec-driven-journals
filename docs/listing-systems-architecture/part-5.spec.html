<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published page (posts/part-5-intro/index.md) and its former spec.md (accepted 2026-10-21), which it replaces; one spec paragraph per unit of the page, in the page's order. Intent outcome, AC-1 to AC-3 and role are copied unchanged from the post's entry in journal-spec.json; the introduction realises Part V's opening (hook, bridge, roadmap) from the same file. The journal spec gives this post no thesis, so the thesis and its three supporting claims are written here from the part's thesis and flow. The five callouts (IN THIS PART, WHY THE BUSINESS CARES, WHY ARCHITECTS SHOULD CARE, KEY POINTS, FAILURE PATTERNS) stand before the first paragraph and are kept as the house format; the KEY POINTS callout carries the part's claim in three bullets. Units added to the published page to meet the contract, in the shape the Part II, III and IV introductions now share: a roadmap paragraph (p03) giving the reading order and the reason for each chapter's position, a lead-in to the chapter table (p04), and a closing paragraph under 'Where to begin' (p07) with synthesis, callback and hand-off, grown from the published last line of the Veldmark section.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Part V's argument: trust and safety is a platform capability, not a team with a queue; policy, detection, decision, enforcement and review are joined by one decision record; fraud is caught at its setup by scoring actors and adding friction in proportion to risk; identity is asked for at the moment of risk; regulation asks for a few artifacts built once.\n- **Know:** The four chapters in reading order and the question each answers, and the Veldmark incidents and decisions of 2027 they follow.\n- **Be able to:** Pick the Part V chapter that answers the trust problem in front of them.\n\n**Audience:** Chief architects, trust-and-safety and fraud engineering leads, identity architects and regulatory or data-protection leads of listing marketplaces (the journal's readers) who have read Part IV and are about to start Part V, or who arrive with a trust problem in hand and want the chapter that answers it.\n\n**Already knows:**\n\n- What an API, a database, an event stream, a search engine and Kubernetes are; how to make and defend an architecture decision.\n- Part II's listing lifecycle and enforcement overlay, Part III's publication pipeline with its moderation gate, and Part IV's discovery surfaces (search, recommendations, saved searches and alerts) (part-2, part-3, part-4).\n- The fifteen named failure patterns, among them Moderation as an Afterthought, Fast Mail for Fraudsters and Deal-Shaped Architecture (where-listing-systems-go-wrong).\n- Veldmark in outline: a fictional group of four brands (Tradeyard, Motorvane, Hearthly, Keybridge), Ingrid Halvorsen its Group Chief Architect, Tradeyard Safe Deal as its in-platform payment, and the recurring examples, among them Femke's Rotterdam city bike and the Barcelona fake-rental ring that saved-searches-and-alerts showed producing about 41,000 alerts (meet-veldmark, saved-searches-and-alerts).\n\n**Does not yet know:**\n\n- Decision service, decision record, enforcement event and propagation (owned by trust-and-safety-architecture; the page names them in plain words and the roadmap says what each does).\n- Statement of reasons, the DSA's required explanation of a moderation decision (owned by marketplace-regulation; glossed at first use in the Veldmark thread).\n- Actor-level scoring, identity graph, step-up friction and the cost model (owned by fraud-prevention; the KEY POINTS callout and the roadmap say 'scoring accounts as well as listings' and 'friction in proportion to risk').\n- Identity levels, claims and the trader record (owned by identity-and-verification; the roadmap glosses the trader record as the business record the law asks a marketplace to keep).\n- DAC7 and the obligation register (owned by marketplace-regulation; DAC7 glossed in the connection paragraph, the register in the Veldmark thread).\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader of this page alone can name the four chapters' subjects in reading order. *Probe:* After reading only this page: what will each of the next four chapters tell you, in order? | `intro_predicts_content` | cold_reader | major |\n| AC-2 | Given situations the chapter table lists, the reader names the chapter to open. *Probe:* Your removals never reach alerts and caches; separately, you are designing a group login and verified badges; and your transparency report cannot be reproduced. Using only this page, which chapter do you open for each? | `custom` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-4 | The reader can say what Part V takes from earlier parts and which later part picks up its threads. *Probe:* Using only this page: what does this part take from earlier parts of the book, and which later part picks up what it starts, through which threads? | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** What does this part argue, and in what order should its chapters be read?\n\n> **Claim:** Part V argues that trust is a platform capability beneath the brands, not a team with a queue per brand: one decision service writes one decision record that every consumer must obey, fraud is caught at its setup by scoring accounts as well as listings and adding friction in proportion to risk, identity is asked for at the moment of risk, and regulation asks for a few artifacts built once, while policy, thresholds and legal grounds stay with each brand; its four chapters are read in the order each plugs into the one before: the platform, the fraud detector that fills its detection slot, the identity checks that detector escalates to, and the regulation that reads the records all three keep.\n\n**Disputed by:** The common practice of building trust in the order incidents arrive, as a review queue per brand attached to insertion with fraud, identity and each law handled as separate projects, so the trust chapters are independent topics a reader may consult in any order.\n\n**So what:** A reader who accepts it reads the platform chapter first, or opens the one chapter that answers the trust problem in front of them, and expects every surface built in Parts II to IV, and every revenue line of Part VI, to obey the decisions this platform records.\n\n**How and why:** Fraud scoring needs a decision service to turn its scores into enforcement and a propagation path to make them take effect; identity checks are the strongest friction fraud scoring asks for; the law asks for the decision record and trader record the first three chapters build. Veldmark's 2027 incidents failed between stacks: a phishing link reached Femke sixteen minutes after her first buyer contact, and a Barcelona ring of 26 accounts posted 180 fake rentals while its signals sat in separate queues.\n\n**Supporting claims**\n\n- **PV-1** — The four chapters take the trust platform in the order each plugs into the one before, and each is the chapter to open first for a recognizable symptom.\n- **PV-2** — The trust platform sits beneath the book's other parts: the lifecycle, publication gate and discovery surfaces of Parts II to IV must obey its decisions, and it hands messaging, payments and trader records to Part VI.\n- **PV-3** — Veldmark meets the cost of separate trust stacks in two 2027 incidents and answers with four decisions that the chapters design.\n\n## Role in the part\n\nPerforms the part's opening: states that trust is a shared platform with one decision record and local policy, gives the reading order of the four chapters, and frames them with Veldmark's two 2027 incidents and four decisions.\n\n## Flow\n\n**Pattern:** `large_to_small` (also `prerequisite_order` in p03 and the chapter table in p04: the four chapters in the order each plugs into the one before)\n\nThe page opens on the risk Part IV created (fast discovery is fast for fraudsters too), states the part's claim (trust is one platform with local policy), then gives the reading order with the reason for each chapter's position, and narrows to one row per chapter with the symptom that sends a reader there. It widens once to place the platform in the book, shows Veldmark meeting the cost of separate stacks in two incidents and answering with four decisions, and ends with a short synthesis, the part's test and the hand-off to the first chapter. The order is given before the table because the rows read as a sequence only once the reader knows each chapter builds on the last; the connection section follows the table because it says what the chapters take from Parts II to IV and hand to Part VI; the Veldmark section follows because its incidents are the separate stacks in practice and its decisions are what the chapters design; the conclusion comes last and holds no new material. Put Veldmark first and the incidents arrive before the reader knows which chapter answers each; put the connection first and it names the enforcement overlay and DAC7 before the reader has met the chapters that use them.\n\n## Introduction\n\n**Hook** (`direct_statement`): Part IV built surfaces that put listings in front of buyers within seconds. Fraudsters exploit that speed: a fake rental that reaches saved searches in minutes reaches the most motivated victims first.\n\n**Bridge:** Part IV's discovery surfaces, which put strangers in contact within minutes. → The trust that makes that contact safe, and the group that builds it in the order incidents arrive and ends up with four moderation stacks that cannot share a signal.\n\n**Thesis statement** (KEY POINTS callout; paragraph p02 (bold phrase)): Trust is a platform capability, not a team with a queue: shared decision service, signals and evidence; local policy, thresholds and legal grounds.\n\n**Roadmap** (IN THIS PART callout; paragraph p03):\n\n- Four chapters in the order each plugs into the one before, with the reason for each position: the platform with its decision record and enforcement path first, then fraud prevention, which fills its detection slot and ends on identity checks, then identity and verification, which designs those checks and the trader record, and regulation last, which turns the law into requirements served by the records the others keep; a table says when to open each. *Kept in:* chapters.\n- After the table, the page places the part in the book and follows Veldmark through it. *Kept in:* connects, veldmark.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Part IV built surfaces that put listings in front of buyers within seconds, and fraudsters exploit that speed, so Part V turns to the trust that makes contact between strangers possible. | example: A fake rental that reaches saved searches in minutes reaches the most motivated victims first. |  |\n| p02 | claim | The part's claim is that trust is a platform capability, not a team with a queue: built in the order incidents arrive, it leaves a group with four moderation stacks that cannot share a signal, and these chapters replace that history with one design that shares the decision service, signals and evidence and keeps policy, thresholds and legal grounds local. | figure: Figure 1: four separate moderation stacks on the left contrasted with one shared trust platform carrying four brands, each with its own rulebook, on the right. | `problem_solution`: The fraudster who exploits Part IV's speed, and the trust that makes contact possible. → The part's answer: trust as one platform, not a queue per brand. |\n| p03 | transition | The four chapters take the platform in the order each plugs into the one before: the platform with its decision record, enforcement that reaches every system, and appeals, which leaves detection as a slot; fraud prevention, which fills that slot and ends on identity checks; identity and verification, which designs those checks and the trader record the law requires; and regulation last, because it turns the law into requirements those records serve; a table, the part's place in the book and the Veldmark thread follow. |  | `elaboration`: The one design the chapters build. → The order in which the four chapters build it, and why. |\n\n## Sections\n\n### Chapters in this part\n\n**Controlling idea** (`description`, id `chapters`): Each of the four chapters answers one question and is the one to open first for a recognizable symptom.\n\n**Advances the thesis** (PV-1): Lists the chapters in reading order with the question each answers and the symptom that sends a reader to it.\n\n**Transition in:** `elaboration`: The four chapters in reading order. → One row per chapter: its question and when to open it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p04 | description | Each row of the table, in reading order, gives a chapter's question and when to open it. | table: Four rows in reading order: trust-and-safety-architecture (each brand runs its own moderation stack, or removals never reach alerts and caches), fraud-prevention (scams close in your messaging, or fraud signals land in separate queues), identity-and-verification (you are designing a group login, verified badges or business checks), marketplace-regulation (a transparency report cannot be reproduced, or a payments feature will move your legal perimeter). |  |\n\n### How this part connects\n\n**Controlling idea** (`context`, id `connects`): Trust reads what Parts II to IV built, all of which must obey its decisions, and hands three threads to Part VI.\n\n**Advances the thesis** (PV-2): Says which earlier models and surfaces obey the platform's decisions and which threads Part VI picks up.\n\n**Transition in:** `place`: The four chapters of the trust platform. → Where the platform sits in the book: what it reads from Parts II to IV and what it hands to Part VI.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | context | Trust reads the lifecycle and enforcement overlay from Part II, the publication gate from Part III and the discovery surfaces from Part IV, all of which must obey its decisions, and it hands Part VI three threads: messaging, where scams close; in-platform payments, which bring DAC7 seller reporting into scope; and trader records, which feed billing as well as compliance. |  |  |\n\n### The Veldmark thread\n\n**Controlling idea** (`example`, id `veldmark`): At Veldmark, separate trust stacks fail in two 2027 incidents, and the group answers with four decisions that the chapters design.\n\n**Advances the thesis** (PV-3): Shows the cost of separate stacks at Veldmark and the four decisions that answer it.\n\n**Transition in:** `example`: The platform and its place between the earlier parts and Part VI. → Veldmark's starting point, its two 2027 incidents and the four decisions they drive.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | example (list) | Veldmark (fictional) starts 2027 with four trust-and-safety stacks, four identity systems and five sources of statements of reasons; two 2027 incidents, a phishing payment link sent to Femke and a Barcelona fake-rental ring, show what the split costs, and Ingrid Halvorsen's team, with Aisha Rahman and Lucía Ortega, answers with four decisions. | scenario: On 7 March 2027 a fake Safe Deal payment link reached Femke sixteen minutes after her first buyer contact, and the scammer's phone number had a Motorvane account Tradeyard could not see; in July a Barcelona ring of 26 accounts posted 180 fake rentals and 63 people lost about €71,000 while photo and price signals sat in separate queues. Decisions: Veldmark ID (June 2027), one login across brands with brand profiles, designed so that a sold brand can be cut out; an obligation register mapping the DSA and related rules to controls and evidence queries; a shared trust-and-safety platform live for Tradeyard NL and BE in November 2027 with a cross-brand block list of hashed identifiers; first-contact friction on Tradeyard (December 2027) against scams like Femke's. |  |\n\n## Conclusion: Where to begin\n\n**Synthesis:** Read together, the four chapters build and read the same few records: the decision record, the risk scores that feed it, the identity claims and trader records, and the reports the law asks for; trust is one platform because its records are shared, not because its people are.\n\n**So what:** Because the records are shared, a fake rental's photo and price signals meet in one record and one decision stops every alert before it reaches a victim, and the group can answer the part's test for any enforcement decision.\n\n**Callback:** The opening (p01): the fake rental that reaches saved searches in minutes and its most motivated victims first. The closing paragraph says what stops that rental once the chapters are read together.\n\n**Takeaway** (`course_of_action`): By the end of Part V, say for any enforcement decision who made it, under which policy version, where it propagated and how you would prove all three a year later; begin with trust-and-safety-architecture.\n\n**Hand-off** to [Trust and Safety as a Platform](trust-and-safety-architecture.html): `elaboration`: The part introduction's argument that trust is a platform capability, not a team with a queue, and its picture of Veldmark's four trust-and-safety stacks that cannot share a signal. → The platform itself: five functions, one decision service and record, enforcement that reaches every consumer, cases and appeals, metrics of harm, and the split between shared machinery and local policy.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | synthesis | Read together, the four chapters build and read the same few records, so trust is one platform because its records are shared, which is what stops the fast fake rental and lets a reader answer, for any enforcement decision, who made it, under which policy version, where it propagated and how to prove it a year later; a reader begins with trust-and-safety-architecture. |  |  |\n\n## Non-goals\n\n- Legal detail, fraud typology and identity methods; the chapters own them and the page points to them. See [Trust and Safety as a Platform](trust-and-safety-architecture.html), [Scams, Fakes and Account Takeovers: Fraud Prevention for Listings](fraud-prevention.html), [Who Is on the Other Side? Identity and Verification](identity-and-verification.html), [Rules of the Marketplace: DSA, DAC7 and Vertical Regulation](marketplace-regulation.html).\n- Safe Deal volume and DAC7 figures. See [Rules of the Marketplace: DSA, DAC7 and Vertical Regulation](marketplace-regulation.html).\n- Messaging, payments and billing design. See [Part VI — MONEY: Conversion and Monetization](part-6.html).\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-10-19** — Modeled on RECONCILED's part introductions with this book's callout set and a chapter table.\n- **2026-10-19** — Failure patterns: Moderation as an Afterthought, Fast Mail for Fraudsters, Deal-Shaped Architecture.\n- **2026-10-19** — Safe Deal and DAC7 numbers deliberately left out of the part intro; marketplace-regulation owns them (its superseded 4.1M / €310M figures were corrected in the editorial review).\n- **2026-11-12** — Converted spec.md to spec.jso e or link cut.\n- **2026-11-12** — Draft check round 3: ESCALATE (pass 43, fail 4; one blocking, corroborated, fault draft; budget spent). Close fix without a fourth round: p03's closing signpost made a full sentence ('Then come a table, the part's place in the book and the Veldmark thread.'), paid for by 'scoring linked accounts and listings' instead of 'scoring linked accounts as well as listings'. Check report is stale.\n- **2026-11-12** — Thesis and supporting claims PV-1 to PV-3 written here (the journal spec's entry has none) accepted under the author's delegation, 2026-11-12; the claim states nothing the page or ledger contradicts. Thesis-rubric minor notes (one long sentence; so_what's 'open one chapter first'; Part VI revenue lines obeying the platform; PV-3's decisions implied) noted, thesis unchanged.\n- **2026-11-12** — Flow rubric notes not taken (swap connection and Veldmark sections; move p03's reasons into a table column; the part's test first appearing in the conclusion), and the round-3 one-reader section-order point: accepted under the author's delegation, 2026-11-12; the order the Part II-IV introductions share and the published text are kept.\n- **2026-11-12** — Edits to published text accepted under the author's delegation, 2026-11-12: KEY POINTS gloss 'the setup (before money moves)'; table gloss 'legal perimeter (which laws apply)'; the shared/local split as two sentences; p05's three threads named in one sentence with 'which turns contact into revenue' and the DAC7 gloss; the Veldmark glosses (statements of reasons, Femke a Rotterdam seller, Aisha Rahman's trust-and-safety and Lucía Ortega's data-protection roles), the two incident-cause clauses (Motorvane account, separate queues; both in the ledger) and 'against scams like Femke's'; the closing heading 'Where to begin'; p03's full-sentence signpost.\n- **2026-11-12** — p02 'a group can have' reverted to the published 'the group has': the four stacks are Veldmark's, so the published wording step shown, 'the setup' glossed. After round 3: p03 signpost made a full sentence; check report stale.\n- **2026-10-21** — Renamed failure patterns to match where-listing-systems-go-wrong. (AI-mediated session)\n- **2026-10-20** — Sharpening pass: 666 → 666 words; headings unchanged (house shape); two sentences reworded (the argument sentence and the Veldmark thread's incident link); spec unchanged. (AI-mediated session)\n- **2026-10-19** — Added 1 inline illustration (article-illustrator); figures renumbered. (AI-mediated session)\n- **2026-10-19** — Editorial review pass: format, ledger facts and links checked; no article changes needed. (AI-mediated session)\n- **2026-10-19** — Initial spec and article. (AI-mediated session)\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
