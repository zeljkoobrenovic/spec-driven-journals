<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, acceptance criteria AC-1 to AC-3, the thesis and the role are copied unchanged from the listing-aggregate entry in journal-spec.json. Units changed by this conversion: a roadmap paragraph (p04) added to the introduction; the one-sentence 'Two design rules follow from the table' folded into p20; a lead-in paragraph (p32) added before the history-storage table; the units paragraph split so the RESO mapping is its own unit (p39); a synthesis paragraph (p68) added before the hand-off.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The difference between a listing, the underlying entity, a product, a placement and a moderation case, and what lives inside the aggregate.\n- **Know:** The identity scheme (internal ID, public ID, external key, entity reference), the publication lifecycle with its enforcement overlay, and the three ways to store history.\n- **Believe:** Ghost inventory is an event-consumption problem, not a search problem, and removal deadlines matter more than insertion ones.\n- **Be able to:** Write a lifecycle specification and a versioned event contract for their own marketplace, with a removal deadline per consumer and a re-check at send for pre-assembled outputs.\n- **Be able to:** Separate invariants enforced in the aggregate from policies enforced asynchronously.\n\n**Audience:** Chief and principal architects, staff engineers and engineering leaders who own or depend on a listing service in a classifieds, real-estate, automotive or jobs marketplace, reading Part II after Part I.\n\n**Already knows:**\n\n- APIs, databases, event streams, search engines and Kubernetes; event-driven systems well and domain-driven design vocabulary loosely.\n- From Part I: bounded contexts and the listing's different meanings per context, the vertical differences, the productscape capability model, and the fictional Veldmark group with its brands, cast and Common Ground program.\n- From the opening pages: the failure-pattern names, including Ghost Inventory and Search as System of Record.\n- From the Part II opening: that a listing is an offer about a thing, a small aggregate referencing five governed subdomains.\n\n**Does not yet know:**\n\n- The marketplace-specific aggregate choices: enforcement overlay, outcome records, renewal versus creation, units and availability, regulated price history.\n- Invariant versus policy as this chapter uses the terms.\n- Regulatory and vertical terms: DSA statement of reasons, trader status, the Omnibus prior-price rule, DPE, RESO statuses.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a sold listing that still reached a downstream output, the reader locates the failure and names the fix in the chapter's terms. *Probe:* A seller marks a bike sold at 18:10; it leaves search at 18:11, but a 07:00 alert digest the next morning still includes it. Using only this chapter: where did the model fail, and what fixes it? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-4 | Given a seller command that undid a moderation block, the reader explains what is wrong with the model and how the lifecycle should be structured instead. *Probe:* A seller's 'resume' command sets status = active on a listing that trust and safety blocked an hour earlier, and the listing reappears in search. Using only this chapter: what is wrong with the model, and how should the lifecycle be structured instead? | `custom` | cold_reader | minor |\n| AC-5 | Given four rules, the reader classifies each as an invariant enforced in the aggregate or a policy enforced elsewhere, and says where and when it is checked. *Probe:* Using only this chapter, classify each rule as an invariant or a policy and say where and when it is enforced: (a) the required attributes for the category are present; (b) the seller does not list the same item twice; (c) the listing does not exceed the seller's paid listing slots; (d) a paid bump does not change created_at. | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** What is a listing, what must always be true about it, and how does it change over time?\n\n> **Claim:** A listing is a seller's time-bounded offer about a thing, not the thing: one listing service owns a small aggregate that references the underlying entity, category, attributes, media, place, account and paid placements by ID, enforces synchronously the rules one listing can check alone (exactly one owning account, a leaf category valid in the taxonomy version it records, required attributes present at submission, a `created_at` that never moves, no seller command that lifts an enforcement block), and records seller and platform changes in one publication state with enforcement as a separate overlay owned by trust and safety; every transition is a versioned event, and each consumer has a declared removal deadline, so ghost inventory is a failure of event consumption, not of search.\n\n**Disputed by:** The common practice of one wide listings table with a single status field and paid flags as columns, in which the search index is the de facto record of what is for sale and a sold listing is handled by deleting it from search.\n\n**So what:** An architect who accepts this writes one lifecycle specification and versioned event contract for every brand (Veldmark's Listing event contract v1, live on 1 July 2027), registers every copy as a consumer with a removal deadline (under 10 seconds for search, 2 minutes for alerts and recommendations, 15 minutes for partner feeds), makes pre-assembled outputs such as digests re-check state before sending, and measures lingering copies weekly.\n\n**How and why:** Every context copies the listing, so a vague state is reinterpreted per copy: Femke's €240 bike, marked sold at 18:10 and out of search at 18:11, still reached 214 digests the next morning from a snapshot taken before the sale, and analytics recorded it as expired; Veldmark's audit found about 41,000 ended Tradeyard NL listings in some copy 24 hours later. Seller intent, platform time and enforcement change for different reasons and owners, so one status field lets a listing be both sold and promoted, or lets a seller's edit undo a block.\n\n**Supporting claims**\n\n- **L1** — A listing is a seller's time-bounded offer about a thing, separate from the underlying entity, the product, paid placements and moderation cases; a field belongs inside the aggregate only if a change to it must be validated with the listing's other rules in one write, and everything else, including paid visibility and moderation decisions, is a reference by ID to its owner.\n- **L2** — The listing has one internal ID that never changes and carries no meaning, with public, external, request and entity keys mapped to it; the same sale campaign keeps its ID, and a new campaign gets a new ID linked to the same entity.\n- **L3** — Rules one listing can check alone are invariants that the listing service enforces synchronously and by state (lenient in draft, strict at submission and on every revise); rules that span listings or services are policies enforced asynchronously by their owners.\n- **L4** — The lifecycle has two dimensions: seller and clock transitions share a publication state owned by the listing, enforcement is a separate overlay owned by trust and safety, visibility and contact are derived from both, bumps and renewals move only a ranking timestamp, and every terminal transition records an outcome.\n- **L5** — Every accepted change produces an immutable version and an event whose meaning the aggregate decides, stored by default as current state plus a history table plus an outbox, with price kept as its own regulated series.\n- **L6** — One service owns the aggregate and every other copy is a consumer with a declared removal deadline, and outputs assembled in advance re-check state before sending, so ghost inventory is a failure of event consumption, not of search.\n\n## Role in the part\n\nDefines the aggregate, its references, lifecycle and events, the slots that every other Part II chapter fills. Supports P2-1 of part `part-2`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `assertion_evidence_reasoning` in in-practice and bike: the model tested against public contracts, then the bike replayed through it; `grouping` in trade-offs, verticals, failure-modes, ca-view and questions: judgements about the model the reader has now seen)\n\nEach section supplies what the next needs. The scene poses the question (what was the bike's state?) with four disagreeing answers. The definition of a listing and the inside/outside test come first because identity, the lifecycle and the invariants are all properties of that object. Identity precedes the lifecycle because states are held per listing ID, and the lifecycle precedes the invariants because several invariants are rules about states and transitions (the moderation gate on the transition to active, no seller command lifting an enforcement block, a created_at that never moves). Availability follows because it extends the sold transition to many units, and versions follow because a version is what every accepted change, of state or quantity, leaves behind. Only then can the architecture assign one owner, the commands and the events with removal deadlines, which need every earlier term. Public evidence tests the model's edges, the bike replay its inside and closes the scene's case, and the trade-offs, vertical differences, failure modes, governance and review questions are judgements about a model the reader has seen. Putting the invariants before the lifecycle would state rules about states not yet defined (round 1 and 2 readers both stopped there); putting the architecture before the lifecycle would name events for undefined states; putting the replay before the architecture would show removal deadlines before they exist.\n\n## Introduction\n\n**Hook** (`intriguing_example`): Every listing marketplace has a table called something like `ads`, `items` or `listings`. It starts with a title, a price, a category and a status column. Fifteen years later it has two hundred columns, a status field with twenty values, three flags that mean \"promoted\" in different ways and a `deleted` column that nobody trusts.\n\n**Bridge:** The reader's own listings table, extended by every team since launch, and Part II's claim that a listing is an offer about a thing. → Designing that table as a domain-driven-design aggregate: one root, one owner, rules that hold after every change, and a test of whether the platform can say what state a listing is in for every copy.\n\n**Thesis statement** (KEY POINTS callout (all three bullets); p02 and p03 state the aggregate and the test it must pass.): A listing is an offer, not the thing; its lifecycle has three owners, so it is modeled as a publication state plus an enforcement overlay; and every transition is a versioned event with a removal deadline per consumer, because ghost inventory is what happens when one copy does not listen.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p04.):\n\n- Veldmark's four systems give four answers about one sold bike. *Kept in:* scene.\n- What a listing is and is not. *Kept in:* what-is.\n- Identity. *Kept in:* identity.\n- A two-dimensional lifecycle with renewals and outcomes. *Kept in:* lifecycle.\n- Invariants. *Kept in:* invariants.\n- Multi-unit listings. *Kept in:* availability.\n- Versions and price history. *Kept in:* versions.\n- One owner with its events. *Kept in:* architecture.\n- Tested on public APIs and standards. *Kept in:* in-practice.\n- And on the bike, replayed transition by transition. *Kept in:* bike.\n- Trade-offs, vertical differences, failure modes, the Chief Architect's view and review questions. *Kept in:* trade-offs, verticals, failure-modes, ca-view, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | The listing table is the oldest and most copied object in a marketplace platform, and usually the least designed. | example: The `ads` table that starts with a title, price, category and status and fifteen years later has two hundred columns, a twenty-value status, three 'promoted' flags and an untrusted `deleted` column. |  |\n| p02 | definition | Taking up Part II's claim that a listing is an offer about a thing, this chapter designs it as a domain-driven-design aggregate (one root, one owner, rules that hold after every change) and covers its identity, lifecycle, invariants, versions and events, with categories, attributes, media, location and accounts appearing only as references. |  | `elaboration`: The undesigned listing table, and the Part II opening's claim that a listing is an offer about a thing. → The aggregate as the design for it, and the scope of this chapter against Part I and the other Part II chapters. |\n| p03 | claim | The test of a listing model is whether, at any moment, the platform can say whether a listing is for sale, who can see and contact it and why, for every copy and not only the owning database. |  | `elaboration`: The aggregate and its parts. → The test the design must pass, for every copy. |\n| p04 | transition | The chapter starts from one sold bike that four Veldmark systems described differently and builds the model in the order a contract needs it (definition, identity, lifecycle, invariants, units, versions, one owner and its events), tests it on public APIs and standards and on a replay of the bike, and ends with trade-offs, vertical differences, failure modes, the Chief Architect's view and review questions. |  | `sequence`: The test question. → The order of the chapter and its kinds of evidence: public APIs and standards, and the fictional Veldmark. |\n\n## Sections\n\n### Setting the Scene at Veldmark: Four Answers to One Question\n\n**Controlling idea** (`context`, id `scene`): One sold bike had four different states in four Veldmark systems, so the group cannot write its event contract until it agrees what a listing is.\n\n**Advances the thesis** (L6): Shows ghost inventory arising in copies (a digest and an analytics extract) while the owning system and search were right.\n\n**Transition in:** `example`: The test of whether the platform can say what state a listing is in for every copy. → A Veldmark listing that fails the test.\n\n**Order of paragraphs** (`small_to_large`): The bike's story, the four answers, what they mean, then the decision they force. The decision before the answers would be an assertion; the answers without the analysis would be a list of bugs.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | example | Femke's €240 city bike, listed on Sunday 7 March 2027 and sold on Monday for €225 through Safe Deal, left search a minute after she marked it sold, yet a digest assembled the evening before still told 214 buyers about it on Tuesday. | scenario: Listed Sunday 7 March 2027 at 19:42 CET for €240; sold Monday 8 March for €225 via Tradeyard Safe Deal 'pay at pickup'; marked sold 18:10, out of search 18:11; Tuesday digest to 214 buyers. |  |\n| p06 | evidence | Ingrid's question about the bike's state at 08:00 on Tuesday gets a different answer from each of the four systems that hold the listing, with the order service as a fifth, independent record. | table: Yardstick: status 4, is_active 0, a default top_until; Solr: not present; alert digest: in 214 digests sent at 07:00 from a 17:30 replica snapshot; Snowflake: 'expired' by a fallback rule; Safe Deal order service: completed, fee €11.95. | `cause_effect`: The bike that was sold yet still mailed. → Ingrid's question and Daan's four answers. |\n| p07 | analysis | Only the order service and Yardstick agreed: search was right for the wrong reason, analytics counted a sale as a failure and the alert service mailed a sold bike. | figure: Figure 1: a sold bike surrounded by four systems whose speech bubbles disagree, while the alert system mails it. | `conclusion_summary`: The four answers in the table. → What each wrong answer means. |\n| p08 | transition | Sven's Listing event contract, due in July 2027, cannot be written until the group agrees what a listing is, which states it has, which rules hold and which changes are events, and the rest of the chapter is that agreement. |  | `cause_effect`: Four systems that disagree about one listing. → The decision this forces: define the listing before the contract. |\n\n### What a Listing Is, and What It Is Not\n\n**Controlling idea** (`definition`, id `what-is`): A listing is a seller's time-bounded offer that references the thing it is about, and the aggregate holds only what must be validated together in one write.\n\n**Advances the thesis** (L1): Defines the listing against its neighbors and gives the inside/outside test.\n\n**Transition in:** `elaboration`: The question Ingrid's team must answer first: what a listing is. → The definition and its neighbors.\n\n**Order of paragraphs** (`large_to_small`): The definition and its neighbors, then the one distinction marketplaces miss (listing versus entity) with its rule, then the test for what goes inside the aggregate and the two references that matter most. The inside/outside table needs the listing/entity rule first, since the entity reference is its first example of something kept outside.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | definition | A listing is a seller's public, time-bounded offer about a specific thing, and it must be told apart from the underlying entity, the product, the commercial offer, the placement and the moderation case. | quotation: The productscape model's definition: 'a seller-created marketplace offer with lifecycle, visibility, and transaction state'.; table: Listing, underlying entity, product, offer, placement and case, each with identity, lifetime and an example. |  |\n| p10 | evidence | Marketplaces discover the listing-entity distinction late, because one apartment or car produces many listings, and eBay's aspect model shows both the use and the limit of separating product facts from item facts. | source: eBay Taxonomy API marks each aspect as applying to the product or the item; eBay's PBSE playbook says the 2018 catalog-association mandate for all categories and brands was rolled back. | `emphasis`: The table of neighbors. → The one distinction that matters most: listing versus entity. |\n| p11 | recommendation | The rule is that the listing references the entity and never is the entity: price, description and state belong to the listing, and facts that outlive any listing belong to the entity with provenance. | figure: Figure 2: one apartment as a long-lived entity with several short-lived listing cards pointing back to it. | `cause_effect`: One entity, many listings. → The rule and the optional entity_ref maintained by entity resolution. |\n| p12 | claim | A field belongs inside the aggregate only if a change to it must be validated with the listing's other rules in one write; otherwise it is a reference to data another context owns. | table: Inside: IDs and version, category ID with taxonomy version, attribute values with provenance, title, price, location reference, contact options, lifecycle states, ranking timestamp, availability. Referenced: account, tree, schemas, media, valuation, geocode, conversations, decisions, entitlements, orders, each with its owning chapter. | `elaboration`: The entity reference as one thing the listing holds but does not own. → The general test for inside versus outside, and the full split. |\n| p13 | analysis | Paid visibility and moderation decisions are the two references that matter most, because a copied paid flag drifts and a decision must survive the listing's deletion. | scenario: Femke's bike carried a default `top_until` it never paid for. | `emphasis`: The inside/outside table. → Its two most consequential rows. |\n\n### Identity: One ID, Several Keys\n\n**Controlling idea** (`definition`, id `identity`): A listing has one internal ID that never changes or carries meaning, every other key maps to it, and relisting keeps the ID within a campaign and issues a new one for a new campaign.\n\n**Advances the thesis** (L2): Fixes the identity every invariant, version and event refers to.\n\n**Transition in:** `sequence`: The aggregate's contents, starting with the listing ID and external keys. → How the listing is identified.\n\n**Order of paragraphs** (`problem_solution`): The scheme first, then where it breaks in practice (external keys), then the hard case (relisting) and the rule that settles it. The relisting rule needs the entity reference and external key already defined.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | definition | A listing needs one internal identity that never changes and never carries meaning, and every other identifier is a key that maps to it. | table: Listing ID (Veldmark's `vm:<brand>:<country>:<id>`), public ID, external key, request key and entity reference, each with purpose and rules. |  |\n| p15 | evidence | External keys are where most identity bugs live, and real feed contracts honor the partner's identifier at the boundary while the platform uses its own inside. | source: Rightmove RTDF uses `Agent_Ref` as the key and offers `GetBranchPropertyList` to find listings 'still live on Rightmove which should have been removed'; mobile.de's Seller API supports an insertion request ID and forbids parallel requests for one ad. | `emphasis`: The external key row. → Real feed contracts that show how it is handled. |\n| p16 | comparison | Relisting is the hard identity question, and each situation (renewal, a failed sale, delete-and-repost, a new sale campaign, a feed re-import) has a default answer. | table: Five relisting situations, what keeping or changing the ID costs, and the default for each. | `contrast`: The keys that map to one ID. → The case where it is unclear whether there is still one listing. |\n| p17 | synthesis | The same campaign keeps its ID and a new campaign gets a new ID tied to the same entity, which makes delete-and-repost a duplicate-detection and ranking problem rather than an identity one. |  | `conclusion_summary`: The five defaults. → The single rule behind them. |\n\n### The Lifecycle: Two Dimensions, Not One Status\n\n**Controlling idea** (`claim`, id `lifecycle`): The lifecycle is a publication state owned by the listing plus an enforcement overlay owned by trust and safety, with visibility derived from both, a ranking timestamp that only renewals and bumps move, and an outcome on every terminal transition.\n\n**Advances the thesis** (L4): Gives the two-dimensional lifecycle, its derived visibility, its timestamps and its outcomes.\n\n**Transition in:** `sequence`: A stable ID that names the listing. → The states the listing can be in and who changes them.\n\n**Order of paragraphs** (`problem_solution`): Three owners, the failure of one column, the two-dimensional fix and the overlay; then what the two dimensions derive (visibility and URLs) and how feed vocabularies map onto the states; then the timestamps that renewals move and the outcomes that end states record. Derived visibility needs both dimensions defined; the feed mapping needs the state set; the timestamps need the renewal transition from Figure 4.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p22 | cause_effect (list) | A single status column fails because three parties change a listing's state for unrelated reasons: the seller, the platform clock and trust and safety. | example: The seller creates, submits, pauses, reserves, marks sold and withdraws; the clock expires, renews, archives and purges; trust and safety holds, blocks, restricts and restores, with appeals. |  |\n| p23 | claim | Sharing one column forces combined values or lets one owner overwrite another, so the lifecycle is a publication state for seller and clock transitions (draft, pending review, rejected, active, paused, reserved, sold, expired, withdrawn, archived) plus an enforcement overlay owned by trust and safety. | example: A seller 'resumes' a listing trust and safety blocked, because the resume command set `status = active`.; figure: Figure 3 (three hands on one lever versus a publication dial and an overlay) and Figure 4 (the publication lifecycle, without enforcement). | `problem_solution`: Three owners and one column. → The resume-lifts-block bug and the two-dimensional model. |\n| p24 | description | The enforcement overlay has its own states (none, held, restricted, blocked, restored), is orthogonal to publication, and is a legal record because the DSA requires a statement of reasons even for demotion. | source: DSA Art. 17: a decision to remove, disable or demote content requires a statement of reasons to the affected user. | `elaboration`: The overlay named in the model. → Its states and its legal weight. |\n| p25 | evidence | Visibility, contactability, alerting and URL behavior are derived from the publication state and the overlay, never stored independently. | table: Each publication state (and active under each overlay value) with searchable, detail page, contactable, alertable and URL behavior. | `cause_effect`: The two dimensions. → What each combination means for buyers. |\n| p26 | analysis | The URL column shows why the lifecycle must record why a listing left: an expired listing can keep a 200 page with alternatives while a fraud removal returns 410. |  | `example`: The URL column of the table. → The SEO decision it feeds and the reason it needs. |\n| p39 | evidence | Feeds bring their own state vocabulary, as real-estate standards show, so a mapping from each feed's states to the platform's is part of the aggregate's contract, not an ingestion detail. | source: RESO Data Dictionary 2.0 defines eleven StandardStatus values, including Coming Soon, Active Under Contract, Pending, Hold, Withdrawn and Closed. | `elaboration`: The publication states and the reasons a listing leaves. → The richer state vocabularies that feeds bring and the mapping they require. |\n| p27 | definition | Ranking and analytics depend on three timestamps (created_at, published_at and ranked_at), each moved by a different actor. | table: created_at: nobody moves it; published_at: set once; ranked_at: renewal, paid bump, relist within the campaign. | `sequence`: The states, what they derive, and how feed states map onto them. → The timestamps that renewal touches. |\n| p28 | claim | Bumps and renewals of an active listing are not state transitions; they move ranked_at and nothing else, and only renewing an expired listing also changes state, back to active. | source: mobile.de's `renewalDate`, the date the ad 'was last marked as new, which makes it appear new in search'; Vinted's Bump lasting three or seven days 'or until the item sells'. | `elaboration`: ranked_at. → Bumps and renewals as the only things that move it, with public evidence. |\n| p29 | claim | Expiry is a data-quality control, not just a revenue lever, and a lifetime per category with a renewal that asks the seller to confirm is the cheapest ghost-inventory control. | source: Google Merchant Center expires products 30 days after their last update; Google's job-posting guidance says expired jobs must be removed or the site 'may result in a manual action'. | `contrast`: Renewal as a ranking act. → Expiry as a control on stale supply. |\n| p30 | claim | Every terminal transition carries an outcome record (sold on platform, sold elsewhere, no longer available, paid off-platform, unknown), because sell-through and valuation models need it. | quotation: Productscape: 'capturing whether it sold on-platform, off-platform, or was withdrawn improves future supply and pricing signals'.; scenario: Snowflake's fallback rule turned Femke's sale into an expiry. | `additional_support`: Expiry as one way a listing ends. → Why every ending needs a recorded outcome. |\n\n### Invariants: What Must Always Be True\n\n**Controlling idea** (`claim`, id `invariants`): Rules one listing can check alone are invariants enforced synchronously and by state; rules across listings or services are policies enforced asynchronously.\n\n**Advances the thesis** (L3): Draws the line between what the aggregate guarantees and what other services check later.\n\n**Transition in:** `elaboration`: The publication states and the enforcement overlay just defined. → The rules that must hold in every state, with a gloss of the one later term the table uses (material edit).\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The distinction and the table first, then the one regulatory row that needs explanation, then the two design rules that follow from the table's 'When' column. The rules depend on the table's 'at submission' and 'on edit' entries.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | definition | An invariant holds after every successful command and can be checked on one listing; a rule that needs many listings or services is a policy enforced asynchronously, and mixing the two is the commonest modeling error. | table: Eleven rules (one owner, leaf category in a recorded taxonomy version, required attributes at submission, price, created_at, moderation gate, enforcement block, trader status; paid slots, duplicates, no placements on sold listings) with kind, enforcer and timing. |  |\n| p19 | evidence | The seller's trader-status declaration is a regulatory invariant on publish, because EU consumer law requires marketplaces to tell consumers whether the other party is a trader. | source: The Omnibus amendments to the Consumer Rights Directive (trader status based on the party's declaration) and the DSA's trader-traceability duties. | `elaboration`: The trader-status row of the table. → Why it is regulatory. |\n| p20 | recommendation | The first design rule from the table is to validate by state: drafts accept incomplete data, and the strict schema applies at the transition to review or active. | source: eBay's Inventory API: an offer becomes a live listing only when published, and some fields are required only at publish time. | `cause_effect`: The table's 'when' column. → The first of two design rules that follow from it. |\n| p21 | recommendation | The second rule is to enforce on create and on every revise, which backfills a newly required attribute without a mass migration, with price-only and pause-only commands exempt. | quotation: eBay: a seller 'will be blocked from listing or revising an item without' required aspects. | `sequence`: Validation by state. → The second rule: enforcement on revise. |\n\n### Availability, Units and Multi-Item Listings\n\n**Controlling idea** (`description`, id `availability`): The aggregate must say how many things it offers and when, because filters, alerts and the sold transition depend on it.\n\n**Advances the thesis** (L4): Extends the lifecycle to quantities, variants, programs, rentals and openings, and to feed states.\n\n**Transition in:** `contrast`: A model of one listing offering one thing, with states and rules. → Listings that offer many things, or offer them over time.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p37 | description | Listings come in six unit shapes, from a single unique item to a job with several openings, and each changes what the sold transition means. | table: Single item, fungible quantity, variants, program with units, rental with availability window, multiple openings, each with example, model and sold transition. |  |\n| p38 | recommendation | Two rules keep units manageable: a parent is a listing only if buyers can contact it, and 'sold out' differs from 'sold'. |  | `cause_effect`: The six shapes. → The rules that follow. |\n\n### Versions, Change History and Price History\n\n**Controlling idea** (`explanation`, id `versions`): Every accepted change produces an immutable, numbered version whose events the aggregate defines, kept by default as state plus history plus outbox, and price is kept as its own regulated series.\n\n**Advances the thesis** (L5): Defines versions, how history is stored, and the price and regulated-fact series.\n\n**Transition in:** `sequence`: Transitions, edits and changes of quantity. → The trace every accepted change leaves: a version.\n\n**Order of paragraphs** (`large_to_small`): Versions and their four jobs, then how to store them, then the two narrower histories (price, and facts that change without the listing changing). Storage choices only make sense once the reader knows what versions are for.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p31 | definition (list) | A listing version is an immutable, numbered snapshot after one accepted change, and versions do four jobs: ordering, concurrency, evidence and re-moderation. | example: Ordering for search and events; optimistic concurrency between a dealer feed and the dealer's staff (what mobile.de's no-parallel-requests rule approximates); evidence for a statement of reasons; material edits sending a listing back through moderation, against the bait-and-switch abuse the productscape model records. |  |\n| p32 | comparison | Three approaches can store the history, and current state plus a history table plus an outbox is the right default for most listing services. | table: State plus history plus outbox; event-sourced aggregate; CRUD with change data capture, each with how it works, strengths, weaknesses and when it is right. | `cause_effect`: Versions that must be kept. → The three ways to keep them. |\n| p33 | analysis | The outbox lets the aggregate decide what an event means, which raw CDC on a legacy table cannot, so CDC is a stage on the way to an outbox. | source: Debezium's outbox router keys messages by the aggregate ID so per-listing order is preserved. | `elaboration`: The default row of the table. → How the outbox works and why CDC falls short. |\n| p34 | claim | Price needs its own history beyond versions because buyers react to it, models learn from it and EU regulation reads it. | source: The Price Indication Directive as amended by the Omnibus Directive, applied from 28 May 2022: an announced reduction indicates the prior price, the lowest in at least 30 days before it (Art. 6a). | `contrast`: General version history. → Price as a series with its own readers. |\n| p35 | recommendation | A price event series per listing feeds badges, prior-price display and price-drop alerts, instead of comparisons between snapshots. |  | `problem_solution`: The three readers of price history. → The series that serves all three. |\n| p36 | example | Some regulated facts change without the listing changing, so those few attributes carry an effective date and a source while the version history answers what the ad showed on a date. | fact: France's DPE is recalculated with new primary-energy factors on 1 January 2026 and again on 1 January 2027, so a flat's class can move from E to D. | `similarity`: Price as a time series. → Other facts that change over time without an edit. |\n\n### Architecture: One Owner, Many Copies\n\n**Controlling idea** (`claim`, id `architecture`): One listing service owns the aggregate and emits a versioned event for every command, and every copy is a consumer with a declared removal deadline that re-checks state if it caches.\n\n**Advances the thesis** (L5, L6): Assigns the owner, the commands and events, and the three properties that keep copies honest.\n\n**Transition in:** `elaboration`: The aggregate whose parts the previous sections defined. → The one service that owns it and the events that leave it.\n\n**Order of paragraphs** (`large_to_small`): The owner, then its commands and events, then the three properties of the event contract. The properties refer to versions, states and removal events in the command table.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p40 | claim | One listing service per marketplace owns the aggregate, accepting commands, enforcing invariants, writing versions and emitting events, while everything else is a reader or a contributor of references. | figure: Figure 5: every write, including clock and enforcement transitions, enters through the listing service; every copy is rebuilt from the event stream. |  |\n| p41 | description | The command interface is small and intent-named, and each command has allowed states, a resulting event and consumers with a reaction time. | table: CreateDraft to Purge: allowed from, resulting event, and which consumers must react and how fast. | `elaboration`: The listing service. → Its commands and why they are named by intent. |\n| p42 | explanation | The table names events by meaning, while the published contract carries twelve domain event types, with internal steps kept inside Supply and related transitions distinguished by a cause field. | fact: Listing event contract v1: 12 domain event types with a `cause` field. | `contrast`: The event names in the table. → How they map to the published contract. |\n| p43 | explanation | Events carry state, not only notice, so a consumer that missed an event converges on the latest version. |  | `sequence`: The contract. → The first of three properties that make it work. |\n| p44 | recommendation | Every consumer declares a removal deadline, because removal latency is invisible to everyone but the buyer who contacts a sold item, and sold-to-gone latency is monitored per consumer. |  | `sequence`: Events that carry state. → The second property: removal deadlines. |\n| p45 | recommendation | Consumers that assemble candidates in advance must re-check state at send time or purge on removal events, the single rule that would have kept Femke's bike out of the digests. |  | `sequence`: Removal deadlines. → The third property: re-check at send for caching consumers. |\n\n### In Practice: What Public Evidence Shows\n\n**Controlling idea** (`evidence`, id `in-practice`): Public contracts show the model's edges rather than its inside, and Auto Trader's Deal Builder episode shows that who may trigger a transition is a business-model decision.\n\n**Advances the thesis** (L4): Tests the lifecycle's choices, including transition permissions, against public contracts.\n\n**Transition in:** `contrast`: The reference model and its event contract. → What real companies have published: contracts, not internals.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p46 | evidence | No classifieds company has published its lifecycle or event model, so the evidence is partner APIs, standards and investor reports that reveal contracts rather than internals. | table: Rightmove RTDF v1.4.1 (2023) and RESO Data Dictionary 2.0 (revised 2023), both cited earlier, and Auto Trader plc FY26 results (2026), each with what it documents and the lesson for the aggregate. |  |\n| p47 | example | Auto Trader's Deal Builder episode shows, in the author's interpretation, that who may trigger a transition is part of the business model, so transition permissions belong in the lifecycle specification per vertical and seller type. | source: Auto Trader paused the automatic rollout of Deal Builder, held listening sessions and introduced 'request a reservation' after retailer pushback; trade press reported that the revised flow leaves reservation to the retailer's discretion. | `elaboration`: The Auto Trader row. → The lesson drawn from it, labeled as interpretation. |\n\n### The Rotterdam City Bike, Transition by Transition\n\n**Controlling idea** (`example`, id `bike`): Replayed through the model, Femke's bike shows every transition as a versioned event with its downstream duties, and shows where the Tuesday digest failed and how the contract fixes it.\n\n**Advances the thesis** (L4, L6): Closes the scene's case with the full lifecycle and event contract.\n\n**Transition in:** `contrast`: Public contracts that show only a lifecycle's edges. → A fictional replay that shows its inside.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The replay table first, then what it shows about the aggregate's scope, then the digest failure it resolves; the resolution needs the replay's sold transition.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p48 | example | Femke's bike, replayed under the lifecycle Veldmark adopted for Listing event contract v1, passes through each command, version, state and event, with what should happen downstream at every step. | scenario: Draft 19:31 (v1), submit 19:42 (v2), approve 19:48 (v3, 312 saved searches), 14 conversations, phishing 20:11-20:26 on an account, reserve Mon 14:02 (v8), sold 18:10 (v9, outcome €225), purge on the erasure request of Mon 6 Sep 2027. |  |\n| p49 | analysis | The replay shows the aggregate changing only for facts about the offer: the phishing case stays on the account, the reservation comes from the order, and the sale price goes into the outcome rather than a price change. |  | `conclusion_summary`: The replay table. → Three observations from it. |\n| p50 | analysis | The Tuesday digest is Ghost Inventory in miniature, fixed by subscribing to removal events and re-checking before sending, and Veldmark's audit showed the problem was common. | statistic: In one week about 41,000 Tradeyard NL listings that had ended in Yardstick were still present in at least one downstream copy 24 hours later, mostly in the digest cache and the recommendations candidate store. | `problem_solution`: The sold transition in the replay. → The digest that missed it and the fix. |\n\n### Trade-offs\n\n**Controlling idea** (`comparison`, id `trade-offs`): Four decisions shape every listing model (status model, delete semantics, aggregate scope and ownership across brands), and retention sits between a regulatory floor and ceiling.\n\n**Advances the thesis** (L1, L4): Says when the narrow aggregate and the two-dimensional lifecycle are right and when a simpler choice is.\n\n**Transition in:** `sequence`: The model as tested by public evidence and the bike replay. → The choices it rests on and their alternatives.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p51 | comparison | Beyond the storage choice, four decisions shape every listing model, and each has a condition under which the simpler option is right. | table: Status model, delete semantics, aggregate scope and ownership across brands, each with two options and when each is right. |  |\n| p52 | analysis | Retention has a regulatory floor (the DSA complaint window) and ceiling (GDPR storage limitation), resolved by tiered retention per data class. |  | `elaboration`: The delete-semantics row. → Its regulatory bounds. |\n\n### Vertical Differences\n\n**Controlling idea** (`comparison`, id `verticals`): The aggregate's shape is common across verticals while lifecycles, units and invariants differ, and at Veldmark the differences are configuration, not forks.\n\n**Advances the thesis** (L4): Shows one lifecycle contract configured per vertical.\n\n**Transition in:** `contrast`: Decisions that apply to every listing model. → What differs by vertical.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p53 | comparison | The aggregate's shape is common across verticals, but lifetime, extra states, who triggers transitions, units, entity, price semantics, the strictest invariant and the main ghost-inventory source all differ. | table: General classifieds, real estate, automotive, jobs and recommerce across eight dimensions. |  |\n| p54 | example | At Veldmark the vertical table becomes configuration of one lifecycle, and the Essen Golf shows the automotive ghost source, which the aggregate can make measurable but not fix. | scenario: Hearthly maps under offer and let agreed onto reserved and sold; Motorvane allows platform-set reservations only for opted-in dealers; the Essen Golf sold on 29 April 2027 and the feed's removal arrived 26 hours later. | `example`: The vertical table. → How Veldmark's brands configure it, and the Golf. |\n\n### Failure Modes\n\n**Controlling idea** (`analysis`, id `failure-modes`): Seven recurring failures break the model, each the absence of one of the chapter's rules.\n\n**Advances the thesis** (L4, L5, L6): Names what happens when the lifecycle, versions or event consumption is left out.\n\n**Transition in:** `contrast`: The model configured correctly per vertical. → How it fails when a rule is missing.\n\n**Order of paragraphs** (`grouping`): Grouped by what fails: the state model, event consumption, timestamps, deletion, edits, the clock and erasure. Each can be read alone; the most common failure (an overloaded status) and the chapter's named pattern (Ghost Inventory) come first.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p55 | analysis | An overloaded status column that mixes seller intent, platform state, moderation and monetization grows until nobody can say which values are visible. |  |  |\n| p56 | analysis | Consumers that never hear the end, by subscribing only to publications or caching for hours, keep sold listings alive, which is Ghost Inventory. |  | `sequence`: Failures of the state model. → Failures of consumption. |\n| p57 | analysis | Bumps that reset created_at turn recency ranking into a reward for the most frequent payer and break time-to-sell analytics. |  | `sequence`: Consumption failures. → Timestamp failures. |\n| p58 | analysis | Hard deletes destroy the evidence a statement of reasons, an appeal or a police request needs. |  | `sequence`: Timestamp failures. → Deletion failures. |\n| p59 | analysis | Edits that bypass the moderation gate let a scammer turn an approved listing into a different one, which is Moderation as an Afterthought at the aggregate level. |  | `sequence`: Deletion failures. → Edit failures. |\n| p60 | analysis | Expiry jobs that fall behind go unnoticed unless overdue transitions are monitored as a first-class metric. |  | `sequence`: Edit failures. → Clock failures. |\n| p61 | analysis | Purges that miss copies are not erasure, and the ListingPurged event exists to give every copy the same deadline. |  | `sequence`: Clock failures. → Erasure failures. |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `ca-view`): At group scale the Chief Architect fixes the lifecycle contract centrally, gives every dimension one owner, governs the state vocabulary like an API, watches four fitness functions and keeps the aggregate narrow.\n\n**Advances the thesis** (L1, L6): Turns the model into group decisions and measurements, including removal deadlines and lingering copies.\n\n**Transition in:** `problem_solution`: The failure modes. → The decisions and measures that prevent them at group scale.\n\n**Order of paragraphs** (`order_of_importance`): The group contract first, because every other decision assumes it; then ownership, vocabulary governance, the fitness functions that show whether it works, and the long-term discipline of a narrow aggregate.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p62 | recommendation | Decide the lifecycle contract at group level and let brands own the services: Veldmark's Listing event contract v1 fixes states, overlay, event names, version semantics and outcome codes for every brand. | scenario: The decision record adopted at the architecture advice forum ahead of the July 2027 go-live; Yardstick still runs Tradeyard. |  |\n| p63 | recommendation | Every disputed dimension of the listing gets one owner, recorded in a decision record. |  | `additional_support`: A shared contract. → Owners for each part of it. |\n| p64 | recommendation | A change to the state vocabulary is governed like an API change with a deprecation window, because a new state touches every consumer. |  | `additional_support`: Owners of the states. → How the states change. |\n| p65 | recommendation | Four fitness functions (sold-to-gone latency, lingering copies, overdue transitions and outcome coverage) show whether the model holds, measured against Veldmark's 2027 baseline. | table: Sold-to-gone latency (about 1 minute for search; targets under 10 s search, 2 min alerts and recommendations, 15 min partner feeds); lingering copies (about 41,000 per week; target near zero); overdue transitions (not measured; zero beyond one scheduler cycle); outcome coverage (not measured; above 60% private goods, above 90% feed-driven). | `additional_support`: Governance of the contract. → The measures that show whether it works. |\n| p66 | recommendation | The aggregate should get narrower over the years, not wider, with readers served by projections instead of new columns. |  | `additional_support`: Measures of the model. → The long-term discipline that keeps it small. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Ten questions turn the chapter into a design review of a listing model.\n\n**Advances the thesis** (L1, L2, L3, L4, L5, L6): Gives the reader each rule of the chapter as a question for their own platform.\n\n**Transition in:** `cause_effect`: The Chief Architect's decisions and measures. → Questions a reader can take into a review.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p67 | recommendation (list) | Ten review questions test ownership and rebuildability, enforcement, timestamps, removal deadlines, re-check at send, material edits, relisting, price history, retention and feed-state mapping. |  |  |\n\n## Conclusion: From Aggregate to Category\n\n**Synthesis:** Each system that went wrong in the scene exposed a different rule: Yardstick held a paid flag it did not own, analytics had no outcome to read, search was right only because a hook fired, and the digest never heard the sale. No single rule fixes all of them; identity, invariants, the two-dimensional lifecycle and versioned events with a removal deadline per consumer together let the platform answer for every copy.\n\n**So what:** Those rules are the agreement Sven's Listing event contract needed; with it an architect measures ghost inventory per consumer and fixes it where it lives, instead of patching search.\n\n**Callback:** Ingrid's question in the scene: what was the state of Femke's bike at 08:00 on Tuesday? It now has one answer (sold, no enforcement, version 9, outcome sold on platform at €225), and the reader can say why each of the four systems got it wrong.\n\n**Takeaway** (`course_of_action`): Write one lifecycle specification and versioned event contract, register every copy as a consumer with a removal deadline, and make pre-assembled outputs re-check state before sending.\n\n**Hand-off** to [Category Trees That Can Change: Designing Marketplace Taxonomies](categories-and-taxonomies.html): `problem_solution`: The category ID and taxonomy version that the aggregate records and takes as given. → The problem that the tree behind them must change while millions of listings sit in it, and the chapter that designs it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p68 | synthesis | Ingrid's question now has one answer, and each system that went wrong in the scene exposed a different rule, so only the rules together let the platform answer for every copy; they are the agreement Sven's contract needed. | scenario: At 08:00 on Tuesday the bike was sold, with no enforcement, at version 9, with the outcome sold on platform at €225. |  |\n| p69 | transition | The aggregate treats its category ID and taxonomy version as given, but the category decides attributes, moderation, price and placement and its tree must change under millions of listings, which the next chapter designs. |  | `contrast`: A model that answers for every copy. → The one reference it takes as given and cannot: the category. |\n\n## Non-goals\n\n- Feed mechanics, reconciliation and idempotency at the boundary. See [Many Doors In: Forms, APIs and Bulk Feeds](listing-ingestion.html).\n- Freshness SLAs, expiry jobs and unpublish propagation end to end. See [From Submitted to Searchable: The Publication Pipeline](publication-pipeline.html).\n- Outbox, schema registry and event governance mechanics. See [Every Change Is an Event: Event-Driven Listing Architecture](event-driven-listings.html).\n- Category trees, attribute schemas, media, location and seller accounts. See [Category Trees That Can Change: Designing Marketplace Taxonomies](categories-and-taxonomies.html), [Attributes Without Chaos: Schemas, Dictionaries and Validation](attribute-schemas.html), [Photos Sell: Media Pipelines for Listings](media-pipeline.html), [Where Is It? Location, Geocoding and Privacy](location-and-geo.html), [Private Sellers, Dealers and Agencies: Modeling Who Lists](sellers-and-accounts.html).\n- Moderation decisions, statements of reasons and appeals. See [Trust and Safety as a Platform](trust-and-safety-architecture.html), [Rules of the Marketplace: DSA, DAC7 and Vertical Regulation](marketplace-regulation.html).\n- Erasure across copies and read-model consistency. See [System of Record and Read Models: Listing Data Management](listing-data-management.html).\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-10-19** — Modeled the lifecycle as a publication state plus an enforcement overlay rather than one status enum, because DSA treats demotion as a restriction and because seller commands must never undo enforcement. Rejected: A three-field model with a separate clock dimension (over-engineered; clock transitions are publication transitions with a distinct trigger).\n- **2026-10-19** — Used the canonical Rotterdam bike as the single worked example and added only local details (version numbers, a Safe Deal reservation at 14:02 per the editor's ledger line, the 214 digests, the 41,000-listing audit) that do not contradict the ledger. The phishing episode is shown as an account case that does not touch the listing.\n- **2026-10-19** — Kept the event table as the bridge to event-driven-listings and publication-pipeline, defining event meaning here and mechanics there.\n- **2026-10-19** — Included Auto Trader's Deal Builder episode as evidence that transition permissions are business-model decisions; labeled the lesson as interpretation.\n- **2026-11- ith related transitions sharing one type and a `cause` field (recurring minor reader point; event-driven-listings folds withdrawn and blocked into ListingRemoved).\n- **2026-11-12** — Conclusion so-what (flow rubric note): p68 now says the rules 'are the agreement Sven's contract needed', closing the scene's 'the contract cannot be written until the group agrees what a listing is'. No new fact.\n- **2026-11-12** — Flow rubric notes not taken, under the author's delegation (rule: keep the published text when no option is clearly better): p45's digest sentence stays before the replay (published wording; the replay shows the rule applied); the ten-unit Lifecycle section is not split (no reader converged on a split, and the timestamps and outcomes are subsections already); p47's transition-permission rule stays with its Auto Trader evidence; repeated pointers to deletion, bumps and cross-brand ownership stay as published; p34/p35 stay separate; 'campaign', the Offer row and 'share platforms, not products' stay as published.\n- **2026-11-12** — max_words raised from 8,215 to 8,300 (+1%) under the delegation's word-limit rule: restoring the published bikes-split aside and the conclusion's callback to Sven's contract add 18 words. Draft: 8,229 words.\n- **2026-11-12** — The round-3 ESCALATE (six major draft faults and two minor findings, all fixed after round 3 without a check) is re-checked by draft-check round 4.\n- **2026-11-13** — Reader-found error fixed by the orchestrator (author request 'fix the errors readers found'): Said how many events the table names (18) so 'twelve domain event types' reads as a folding, not a contradiction.\n- **2026-11-13** — Reader-found error fixed by the orchestrator (round-6 findings, author request): Invariant row now lists the same three ways to move ranked_at as the timestamp table.\n- **2026-11-13** — Reader-found error fixed by the orchestrator (round-6 findings, author request): Callout: 'two-day life' clashed with the September purge row; now two days on sale, erased six months later (ledger dates unchanged).\n\n## Sources\n\n- **Internal**\n  - _journals/listing-systems-architecture/journal-spec.json — Intent outcome, acceptance criteria AC-1 to AC-3, thesis, role, the Part II transition_in and the hand-off relationship of categories-and-taxonomies.\n  - _research/scenario-ledger.md, _research/consistency-issues.md, _research/style-guide.md — Veldmark facts (the Rotterdam bike, the Essen Golf, Listing event contract v1, the publication SLA card), rulings 9 and 24 (reservation 14:02, sold at version 9), chapter shape and failure-pattern names.\n  - bounded-contexts, vertical-requirements, meet-veldmark, entity-resolution, publication-pipeline, event-driven-listings, categories-and-taxonomies, listing-data-management — Neighbouring ownership the chapter defers to.\n  - Research briefs (listing data and ingestion; platform, data and ML; real-estate portals; automotive; trust and regulation) and the productscape digest — Lifecycle evidence, outbox and expired-page practice, RTDF and DPE, Deal Builder, DSA and Omnibus, listing definitions and stream pain points.\n- **External**\n  - mobile.de Seller-API (n.d.); Vinted Help, Bump (n.d.); eBay Inventory and Taxonomy APIs and PBSE playbook (n.d.); Rightmove RTDF v1.4.1 (2023); RESO Data Dictionary 2.0 StandardStatus (revised 2023); Auto Trader Group plc FY26 results (2026); Car Dealer Magazine (2025); Google Merchant Center and JobPosting docs (n.d.; updated 2026); Debezium Outbox Event Router (n.d.); Regulation (EU) 2022/2065 (2022); European Commission, Price Indication Directive page (n.d.); Service-Public.fr DPE (2026) — Documented public evidence for identity, renewal, expiry, validation by state, feed states, transition permissions, the outbox, enforcement records and price history.\n\n## Changelog\n\n- **2026-11-12** — Resolved the ESCALATE items under the author's delegation: open questions closed into the decision log, bikes-split aside restored, digest subscription named by meaning, conclusion calls back to Sven's contract, word limit 8,300. (AI-mediated session)\n- **2026-11-12** — Orchestrator review: restored the second links on the eBay Taxonomy API and mobile.de Seller-API citations, which the pass had turned into plain text. Check report stale.\n- **2026-11-12** — Draft check: round 1 ESCALATE (spec faults; spec reordered), round 2 ESCALATE (spec faults; Lifecycle moved before Invariants), round 3 ESCALATE (budget spent, six draft-fault majors); cheap fixes applied after round 3; check report stale. (AI-mediated session)\n- **2026-11-12** — Spec reordered after draft-check round 2: Lifecycle before Invariants; transitions rewritten; p04 and p23 updated. (AI-mediated session)\n- **2026-11-12** — Spec reordered after draft-check round 1: RESO paragraph into Lifecycle, Availability before Versions, bike replay as its own section; p06, p28, p46 ideas corrected; transitions rewritten. Check report stale. (AI-mediated session)\n- **2026-11-12** — Converted spec.md to spec.json (outcome spec), reconstructed from the published text; units changed as recorded in the decision log; status draft. (AI-mediated session)\n- **2026-10-21** — Renamed failure patterns to match where-listing-systems-go-wrong. (AI-mediated session)\n- **2026-10-20** — Replaced 2 mermaid diagrams with generated illustrations (figure numbers and captions unchanged; sources archived in _research/mermaid-figures.json); Figure 4 kept attempt 1 ('START'/'END' beside the dots; the 'seller resumes' arrow points from Paused to Rejected instead of Active). (AI-mediated session)\n- **2026-10-20** — Consistency fix: heading, third key point and excerpt now say two lifecycle dimensions, matching body, Figure 3 and glossary; unsourced price-drop-alert claim reduced to the plain fact. (AI-mediated session)\n- **2026-10-20** — Sharpening pass: 5,786 to 5,836 words; outline unchanged. (AI-mediated session)\n- **2026-10-20** — Cross-chapter consi <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);

            // Status pill goes first, then a " / " separator before the existing

            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');

                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');

                dot.className = 'status-dot';

                if (sectionEl.firstChild) {

            if (postId) {

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {

                    const buf = [];
