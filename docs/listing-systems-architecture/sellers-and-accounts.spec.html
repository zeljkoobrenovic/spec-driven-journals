<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, acceptance criteria AC-1 to AC-3, the thesis and the role are copied unchanged from the sellers-and-accounts entry in journal-spec.json; the conclusion realises Part II's closing (synthesis, so-what, callback, takeaway) from the same file, and the hand-off uses Part III's transition_in. Units added by this conversion: lead-ins and explanations for the trade-off tables (p43, p45, p46) and three conclusion paragraphs (p57, p58, p59); p03 now carries a roadmap.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Private and professional sellers, trader status, organizations, branches and networks, users and memberships, and integration principals.\n- **Know:** The three options for who-lists data in a multi-brand group (separate, shared identity and registry, one group account) and when each fits.\n- **Believe:** The account model is where marketplaces most often confuse identity with commerce, and trader status is a governed attribute, not a checkbox.\n- **Be able to:** Model an agency network with franchisees, departing staff and a feed vendor so that trader information, reviews, leads and invoices land on the right entity.\n- **Be able to:** Decide what a group shares across brand accounts and the purpose limits on it.\n\n**Audience:** Chief and principal architects, identity and account-platform leads, and product leads for professional sellers in listing marketplaces, plus technology leaders integrating acquired brands.\n\n**Already knows:**\n\n- APIs, databases, event streams, search engines and Kubernetes (the book's baseline).\n- Authentication, OAuth 2.0 and its grant types, and data modeling.\n- Part I's vocabulary: bounded contexts, supporting and core domains, C2C and B2C models, verticals.\n- Part II so far: the listing aggregate that references subdomains by ID, governed reference data, the media pipeline and the location model with its precision policy.\n- Veldmark, its brands (Tradeyard, Motorvane, Hearthly, Keybridge), cast and programs (Veldmark ID, Safe Deal, Common Ground), and the fifteen failure-pattern names.\n\n**Does not yet know:**\n\n- Trader in the EU-law sense and the DSA's trader traceability duties.\n- DAC7, the Platform-to-Business Regulation, the INFORM Consumers Act and the consumer-law trader declaration.\n- KYB (know-your-business checks) and DMS (dealer management system).\n- Integration principal, branch, network and storefront as account-model terms.\n- ARPA and the commercial units portals report (branch, forecourt, paying dealer).\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given an agency network's complaints, the reader traces them to one modeling error and assigns each to the right entity. *Probe:* An agency network with nine owned branches and five franchisees complains: franchise listings show the parent as trader, one franchisee's reviews appear on every branch, a departed agent still receives leads for 212 listings, and franchise subscriptions are invoiced to the parent. Using only this chapter: what is the single cause, and where does each fact belong? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-4 | Given a trader flag stored as a checkbox, the reader says what the trader status record must hold and how a private seller who behaves like a trader is reclassified. *Probe:* A marketplace stores trader status as a yes/no field the seller ticks at sign-up. Using only this chapter: what is wrong with that, and what should the platform store and run instead? | `custom` | cold_reader | minor |\n| AC-5 | Given a feed vendor that logs in with its dealers' passwords, the reader explains why that fails and designs the replacement. *Probe:* A dealer-software vendor uploads stock for 500 dealers by logging in with each dealer's own username and password. Using only this chapter: what is wrong with that, and what should replace it? | `custom` | cold_reader | minor |\n| AC-6 | Given a multi-brand group that wants one view of its business customers, the reader chooses what to share and states the purpose limits. *Probe:* A group runs several marketplace brands and one software product for agents, and wants to know which businesses are customers of more than one brand. Using only this chapter: what should it share across brands, what should it not share, and what limits apply? | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** How should a marketplace model the people and organizations that supply listings?\n\n> **Claim:** A seller account model must answer four questions with separate entities: who acts (users with memberships and roles), who is responsible (the legal entity, which is the trader), who pays (contracts and billing accounts) and who is shown (storefronts and branches). Trader status is a governed attribute with declaration, evidence, verification and history; organizations, not staff, own listings; integrations are principals with grants per account and branch; and a group shares login and verified legal-entity facts in a registry while keeping brand accounts separate.\n\n**Disputed by:** The common model of one user or advertiser record that is at once login, legal identity, billing party, public profile and listing owner, extended with a pro flag, parent pointers for branches and shared credentials for feed vendors; and, at group level, the alternative of one group account across all brands.\n\n**So what:** A group that accepts this standardizes the supply-side model and its events before entitlements and messaging copy their own, launches a business party registry with purpose limits and logged cross-brand queries (approved at Veldmark in August 2027), moves feed partners from shared passwords to scoped grants, and tracks the share of professional listings with a verified trader record (target 100%) and orphaned listings.\n\n**How and why:** Hearthly's single advertiser entity put the parent company on five franchisees' trader panels, showed one franchisee's reviews on every branch, left 212 listings and their leads with an agent who had left, and invoiced franchise subscriptions to a parent that refused to pay them. Trader status decides which consumer law applies, what the Digital Services Act requires the platform to verify and what is reported to tax authorities, so a checkbox cannot carry it.\n\n**Supporting claims**\n\n- **S1** — Who acts, who is responsible, who pays and who is shown are four questions answered by separate entities (users with memberships, the legal entity that is the trader, contracts and billing accounts, storefronts and branches), and one record that answers all four puts the wrong trader on listings, reviews on the wrong business, listings with departed staff and invoices on the wrong company.\n- **S2** — Trader status is a governed attribute with a declaration, evidence, a verification result and the platform's own assessment, kept with its history, enforced by the account's lifecycle (a verification gate, reclassification of private sellers who trade, suspension that propagates, and deletion of trader data on its own retention clock), because consumer law, the Digital Services Act, platform-to-business rules and tax reporting each depend on it.\n- **S3** — Organizations, not staff, own listings: the seller account owns each listing and assigns it to a branch, users act through memberships with roles, and lead routing and ratings attach to branches and accounts, so staff turnover and franchising do not move them.\n- **S4** — Integrations are principals with grants per seller account, branch and scope, never shared seller credentials, so each vendor can be identified, throttled, measured and revoked one seller at a time.\n- **S6** — A multi-brand group shares the login and verified legal-entity facts in a registry with purpose limits and logged cross-brand queries, and keeps brand accounts separate.\n\n## Role in the part\n\nModels the last referenced subdomain, who lists, and performs the part's closing: the listing's references are complete and hand supply its first dependency. Supports P2-6 of part `part-2`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in concepts, model, trade-offs and verticals: each section uses the terms or the model the previous one established; `assertion_evidence_reasoning` in in-practice: the model is tested against public interfaces and three Veldmark cases)\n\nThe scene states the problem as four complaints with one cause. The concepts then define every term the answer needs (trader, trader status, organization, branch, network, storefront, seller account, business party registry, contract and billing account, user, membership, integration principal), and leave the company evidence to the in-practice section, and the model section assembles them into one entity per question, shows the scene's network modeled correctly and adds the account's lifecycle, routing and ratings. The in-practice section tests the model against public portal interfaces and three Veldmark cases, the last of which (the Polish overlap) raises the group question the next section settles. The trade-offs follow the model directly because they weigh its own choices, and the vertical differences follow them because they show where each choice weighs most; placed after the group section (round 2) both flow readers found the verticals a detour between the Polish overlap's group question and the failure modes. Failure modes, the Chief Architect's decisions and review questions are judgements about a model the reader has already seen. Putting the model before the concepts would use undefined terms; putting the group section before the Polish overlap would answer a question nobody has asked; putting the trade-offs before the model would compare options for a model not yet described, and after the group section they re-open settled choices.\n\n## Introduction\n\n**Hook** (`intriguing_example`): \"Seller\" means a person with a phone number on a general classifieds site, an agency branch owned by one franchisee in a national network and fed by a software vendor on a real-estate portal, and a dealer group with several sites, a DMS vendor, a head office and salespeople on an automotive marketplace.\n\n**Bridge:** The reader's own user table, extended one exception at a time with a company name column, a parent-user ID for branches, a pro flag, a VAT number field and a shared login for the DMS vendor. → The account model is where marketplaces most often confuse identity with commerce, so the question is what model keeps them separate and still collapses to one person selling one bike.\n\n**Thesis statement** (KEY POINTS callout (all three bullets) and paragraph p02 (the account model confuses identity with commerce; this chapter keeps them separate).): Who acts, who is responsible, who pays and who is shown are four separate questions, each answered by its own entity; trader status is a governed attribute, not a checkbox; organizations own listings through their seller accounts on each brand, integrations are principals, and groups share identity, not accounts.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p03.):\n\n- Agence Rhône Habitat's problems on Hearthly. *Kept in:* scene.\n- The vocabulary of supply. *Kept in:* concepts.\n- The seller account model with its lifecycle, lead routing and ratings. *Kept in:* model.\n- The alternatives the model rejects and how the model differs by vertical. *Kept in:* trade-offs, verticals.\n- Tests on public company documents and on Femke, Autohaus Ruhrblick and the Polish dealers on two brands. *Kept in:* in-practice.\n- What a multi-brand group shares. *Kept in:* group.\n- Failure modes, the Chief Architect's decisions and review questions. *Kept in:* failure-modes, ca-view, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | The listing's last referenced subdomain is the seller account, and \"seller\" means something different in every vertical. | example: A person with a phone number on general classifieds; an agency branch, owned by a franchisee in a national network and fed by a software vendor, on a real-estate portal; a dealer group with several sites, a DMS (dealer management system) vendor, a head office and salespeople on an automotive marketplace. |  |\n| p02 | claim | Most marketplaces extend the first meaning one exception at a time, and the account model becomes the place where identity and commerce are most often confused; this chapter keeps them separate while still collapsing to one person selling one bike, and later chapters build on it. | example: A user table with a company name column, a parent-user ID for branches, a pro flag, a VAT number field and a shared login for the DMS vendor; entitlements, leads and partner feeds that later attach to accounts, branches and integration principals. | `cause_effect`: The many meanings of seller. → What marketplaces do with them, and the chapter's claim. |\n| p03 | transition | The chapter works through the model with fictional Veldmark in a stated order: Agence Rhône Habitat's problems, the vocabulary, the model, the alternatives it rejects and how they differ by vertical, its tests on documented patterns and three cases, what a group shares, and the closing judgements. |  | `sequence`: The chapter's claim. → How the chapter will establish it, and the fictional sellers it uses. |\n\n## Sections\n\n### Setting the Scene at Veldmark: Fourteen Branches, Three Wrong Answers\n\n**Controlling idea** (`context`, id `scene`): Agence Rhône Habitat's complaints to Hearthly trace to one entity that was login, legal identity, billing party, public profile and listing owner at once, and Veldmark's other brands have the same shape.\n\n**Advances the thesis** (S1): Gives the four failures one conflated entity produces, which the model later fixes one by one.\n\n**Transition in:** `example`: The roadmap's first item. → Agence Rhône Habitat in May 2027.\n\n**Order of paragraphs** (`problem_solution`): The network, the three complaints, the fourth problem Hearthly finds, the single cause, then the same cause in every brand and why it must be settled now. The cause before the complaints would be abstract; the brand survey before the cause would list symptoms with nothing to tie them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p04 | context | Agence Rhône Habitat is a network of 14 branches, nine run by the parent company and five franchisees that are separate companies, publishing to Hearthly through Keybridge. | scenario: May 2027; the Lyon 7e flat; 14 branches, 9 operated by the parent, 5 franchisees; Keybridge publishes to Hearthly and two competing portals. |  |\n| p05 | evidence (list) | The network's head of digital writes to Hearthly's CEO about three problems: the wrong trader on franchise listings, reviews in the wrong place and a departed agent who still owns 212 listings. | scenario: Franchise listings show the parent's name, registration and address; one franchisee's reviews appear on the network profile and every branch page; an agent who left the Villeurbanne branch in February still owns 212 listings and receives their leads at a personal e-mail address used for her 2023 login. | `time`: The network and its May 2027 listing. → The letter sent the same week. |\n| p06 | evidence | Hearthly finds a fourth problem itself: the franchisees' subscriptions are invoiced to the parent, which refuses to pay them. | scenario: Five franchisees' subscriptions invoiced to the parent company. | `additional_support`: Three problems in the letter. → A fourth that Hearthly finds. |\n| p07 | cause_effect | Hearthly's CTO traces all four problems to one design decision: the advertiser entity is at once login, legal identity, billing party, public profile and listing owner. | scenario: Julien Marchand; branches as advertisers with a parent pointer; users as e-mail addresses attached to an advertiser; feeds authenticating as the advertiser; a model built for single-office agencies.; figure: Figure 1: one strained figure holding a login key, legal document, invoice, profile card and listings, beside five figures holding one each. | `cause_effect`: Four problems. → Their single cause. |\n| p08 | context | Veldmark's Group Chief Architect sees the same shape in every brand, and the account model must be settled before Veldmark ID and the group product catalog, which both depend on it. | scenario: Tradeyard user accounts with a business flag; Motorvane dealer accounts keyed by customer number with sites as sub-accounts and DMS vendors using dealers' credentials; Keybridge's separate tenant model; Veldmark ID due for approval in June 2027; a group product catalog due in 2028. | `similarity`: Hearthly's advertiser entity. → The same shape in the other brands, and the deadline. |\n\n### Concepts: The Vocabulary of Supply\n\n**Controlling idea** (`definition`, id `concepts`): The model needs precise terms for private and professional sellers, trader status, organizations, branches, networks, storefronts, seller accounts, contracts and billing accounts, users, memberships and integration principals, several of which carry legal weight.\n\n**Advances the thesis** (S1, S2, S3, S4, S6): Defines the entities and the trader rules the model assembles.\n\n**Transition in:** `problem_solution`: One entity doing five jobs at Hearthly and the same shape in every brand. → The terms a model that separates those jobs needs, starting with the seller distinction that law depends on.\n\n**Order of paragraphs** (`prerequisite_order`): Private versus professional first, because the trader rules hang on it; then the law that makes the distinction weighty and the trader status record it requires; then the organizational levels that hold traders, the seller account through which an organization or a person sells on a brand (with the group registry that keeps the organization's facts once), and the contract and billing account that say who pays; then users, who act inside them; then integration principals, which act for them. Every entity the model's table uses is defined here, so the table assembles known terms. Company evidence is kept for the in-practice section, where it tests the assembled model. Users before organizations would give memberships nothing to belong to; integrations before users would make the contrast between a person and a client meaningless.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | definition | A private seller sells their own goods outside any business and a professional seller sells in the course of one, a distinction that matters commercially and even more legally. |  |  |\n| p10 | evidence | In EU law the professional is a trader, and the Digital Services Act's trader traceability requires platforms to collect, assess, display, keep and delete specific trader data. | quotation: DSA Art. 30: name, address, telephone number and e-mail, an identification document, payment account details, register number, self-certification; 'best efforts' to assess reliability; retention for six months after the relationship ends; display to buyers; applying since 17 February 2024. | `emphasis`: The distinction matters legally. → The EU term and the DSA's duties. |\n| p11 | analysis | Whatever the debate about whether a classifieds site is in scope, the chapter's concern is what the trader obligations do to the data model, across five regimes. | table: Regulation table: DSA Art. 30, EU consumer law (Modernisation Directive, 28 May 2022), Platform-to-Business Regulation, DAC7 (30 sales / €2,000 exclusion), US INFORM Consumers Act (FTC, 2023), each with what depends on trader status and the data the account must hold. | `elaboration`: The DSA's duties. → The scope question, handed to marketplace-regulation, and the other regimes. |\n| p12 | analysis | One verified trader record serves many laws, and launching in-platform payments brings seller tax reporting with it. | scenario: Tradeyard Safe Deal as the change that brings DAC7 reporting. | `conclusion_summary`: The five regimes in the table. → What they add up to for the record. |\n| p13 | definition (list) | Trader status is the platform's record of whether a seller acts as a trader, with four parts: declaration, evidence, verification result and platform assessment. |  | `elaboration`: One verified record. → What that record holds. |\n| p14 | process | Marketplaces most often lack the platform assessment, so the account model needs a reclassification process for private sellers who behave like traders, whose signals belong to trust and safety and whose outcome belongs to the account. | example: A private seller who lists 400 phone cases a year in original packaging; signals such as volume, new goods, repeated listings and high Safe Deal turnover open a case. | `elaboration`: The fourth part, platform assessment. → Why it is usually missing and the process that fills it. |\n| p15 | definition (list) | An organization is the legal entity that sells and is the trader, and industry practice adds branches, networks and storefronts, with a franchise network not being a legal parent of its franchisees. The model's entity table calls the organization the legal entity; the two names mean one thing. |  | `sequence`: Trader status. → The organizational levels that hold traders. |\n| p15a | definition | On each brand a private or professional seller sells through a seller account, which links to the person or to the organization that is the trader; because one organization can hold accounts on several brands, a group can keep its verified legal facts once in a business party registry. |  | `contrast`: The organization, which is the trader. → The brand-level seller account through which it sells, and the group registry of its legal facts. |\n| p15b | definition | Who pays is a separate fact: a commercial contract and a billing account, which need not belong to the organization that is the trader, because a head office may pay for some branches and a franchisee for its own. |  | `additional_support`: Who sells (the seller account) and who is responsible (the organization). → Who pays. |\n| p18 | definition | A user is a person who logs in and is not a seller; a user acts through memberships that carry roles scoped to an organization or its branches. |  | `sequence`: The organizations, their seller accounts and contracts. → The people who act inside them. |\n| p19 | recommendation (list) | Separating users from organizations gives two rules: the seller account, which is the organization's account on that brand, owns listings and assigns them to branches, and one user can belong to several organizations. | scenario: The Villeurbanne agent's 212 listings stay with the branch when her membership ends. | `cause_effect`: Users with memberships. → The rules that follow. |\n| p20 | definition | An integration principal is a software client that acts on behalf of sellers and is neither a user nor a seller. |  | `sequence`: People who act for an organization. → Software that acts for it. |\n| p22 | recommendation | OAuth security practice draws the same line between software and seller, so a vendor serving 500 dealers is one client with 500 grants, not 500 shared passwords. | quotation: RFC 9700 (January 2025): exact-match redirect URIs, PKCE for all clients, no implicit grant, the password grant 'MUST NOT be used', sender-constrained, audience-restricted tokens.; figure: Figure 2: a vendor with a tangled ring of dealers' keys beside one client badge with scoped tickets. | `similarity`: The integration principal as neither user nor seller. → The same separation in OAuth practice. |\n\n### Architecture: The Seller Account Model\n\n**Controlling idea** (`description`, id `model`): Eight entities each answer one question and live in one place, the model collapses in simple cases and untangles Agence Rhône Habitat, and the account adds a lifecycle, branch-level contact routing and deliberate rating attachment.\n\n**Advances the thesis** (S1, S2, S3): Assembles the defined terms into the model and applies it to the scene.\n\n**Transition in:** `sequence`: The defined terms. → How they fit together in one model.\n\n**Order of paragraphs** (`large_to_small`): The whole model first (eight entities and where they live), then the simple and complex cases, then the account's lifecycle, then the two attachments (contact routing and ratings) that depend on branches and accounts existing. Lifecycle before the entity table would describe states of an entity not yet placed; ratings before the Rhône case would lack the pooled-reviews problem that motivates them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p23 | description | Each of eight entities answers one question and lives in one place. | figure: Figure 3: eight entities, each answering one question.; table: Entity table: user, legal entity, seller account, branch, commercial contract and billing account, storefront, network, integration principal, each with the question it answers, key attributes and owning service. |  |\n| p24 | example | In simple cases the model collapses to a few records, so it costs nothing there and is essential in complex cases. | scenario: Femke: one user with one private seller account; a single-office agency: one legal entity, account, branch, contract and storefront.; table: Agence Rhône Habitat before and after: one advertiser and 13 child advertisers become six legal entities, six seller accounts, 14 branches (9 + 5), one network, six contracts; trader information from the owning legal entity; reviews at branch level; users with memberships; Keybridge as an integration principal with grants for the 14 branches. | `contrast`: Eight entities. → How few of them a simple case needs, and the complex case in full. |\n| p25 | analysis | Modeled correctly, Agence Rhône Habitat is six traders grouped by a network for display, because a franchise network is a display and commercial concept and the trader rules follow the legal hierarchy; any franchise network has the same shape. | figure: Figure 4: one brand umbrella over six legal entities, the parent with nine branches and five franchisees with one each. | `conclusion_summary`: The before-and-after table. → The principle it rests on. |\n| p26 | definition | A seller account runs through nine named states from registration to erasure, a lifecycle that differs for private and professional accounts mainly in the onboarding gate. | figure: Figure 5: the seller account lifecycle with a verification gate, reclassification into it and retention clocks after closing. | `sequence`: The entities and how they map onto a network. → What happens to an account over time. |\n| p27 | process (list) | Three lifecycle transitions need explicit design: reclassification, suspension that propagates, and closure followed by several retention clocks. | reasoning: Reclassification moves Active to UnderReview to Onboarding with a volume limit; suspension removes listings from search, stops grants and bumps and handles leads, with a statement of reasons; DSA trader data six months, invoices under accounting rules, hashed fraud identifiers with justification. | `elaboration`: The lifecycle diagram. → The transitions that need design. |\n| p28 | explanation | Contact options and lead routing belong to the branch and the seller account, not to the listing or the uploader. | scenario: A dealer's lead for a car on its Bochum site goes to the Bochum sales queue. | `sequence`: The account's states. → What the account configures for buyers' contact. |\n| p29 | explanation | For private sellers, contact preferences are also safety controls. |  | `contrast`: Routing for professionals. → What contact settings do for private sellers. |\n| p30 | comparison | Where ratings attach is a modeling decision with legal weight, and the branch with a labeled network aggregate is the safe default because every other choice breaks in some case. | table: Ratings table: user, seller account, branch, individual agent, each with where it works and where it breaks. | `sequence`: Contact settings on the account. → The other thing buyers see attached to it: ratings. |\n| p31 | recommendation | EU consumer law requires saying how reviews are checked, so a marketplace should record with each rating what made the reviewer eligible. | source: UCPD Art. 7(6), inserted by Directive (EU) 2019/2161: businesses giving access to consumer reviews must say whether and how they check reviewers used or bought the product. | `cause_effect`: Where ratings attach. → What the law requires each rating to carry. |\n\n### Trade-offs\n\n**Controlling idea** (`comparison`, id `trade-offs`): The model rests on three choices (how to model private sellers, who owns a listing, how integrations authenticate), and each rejected alternative fails a case already met: a private seller who must later be reclassified, the Villeurbanne agent's departure, or a vendor holding dealers' passwords.\n\n**Advances the thesis** (S1, S3, S4): Compares the alternatives the thesis rejects with the ones it recommends.\n\n**Transition in:** `elaboration`: The model just assembled. → The alternatives behind three of its choices.\n\n**Order of paragraphs** (`comparison`): One lead-in, then the three choices in the order the model introduced them: the seller (private or professional), the listing's owner, then the software that writes for it. Integrations first would compare authentication before the reader is reminded who owns what. The section sits straight after the model because it weighs the model's own choices; placed after the group section (round 1), both flow readers found it re-opened decisions already settled.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p43 | transition | Three choices behind the model had alternatives. |  |  |\n| p44 | recommendation | Of three ways to model private sellers, a seller account linked to either a user or a legal entity is best, because it keeps private data minimal, makes reclassification explicit and attaches trader rules to legal entities. | table: Private-seller options: user with a seller flag, degenerate organization of one, seller account linked to a user or a legal entity, with how each works, strengths and weaknesses. | `elaboration`: Three choices. → The first: modeling private sellers. |\n| p45 | comparison | Of three listing owners, only the seller account with branch assignment survives staff turnover and multi-site routing. | table: Ownership options: the creating user, the seller account, the seller account assigned to a branch, with where each works and breaks.; scenario: The Villeurbanne agent's 212 listings. | `sequence`: Private-seller modeling. → The second choice: who owns a listing. |\n| p46 | comparison | Of four ways to authenticate integrations, only certificates with branch authorization and OAuth grants per account and branch can withdraw one vendor's access to one dealer, so shared seller credentials should go first. | table: Integration authentication options: shared seller credentials, static API key per vendor, mutual TLS certificate per vendor with branch authorization (as Rightmove's feed uses), OAuth clients with grants per seller account, branch and scope. | `sequence`: Listing ownership. → The third choice: integration authentication. |\n\n### Vertical Differences\n\n**Controlling idea** (`comparison`, id `verticals`): The model holds in every vertical, but its weight shifts: real estate has the deepest hierarchy and rated agents, automotive depends most on integration principals, and general classifieds has the hardest trader boundary.\n\n**Advances the thesis** (S1, S2, S4): Shows which part of the model carries the most weight per vertical.\n\n**Transition in:** `contrast`: The three choices, which hold in every vertical. → How the model's weight differs by vertical.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p47 | comparison | The model holds in every vertical, but real estate has the deepest hierarchy and visible agents, automotive depends most on integration principals, and general classifieds has the hardest trader boundary to police. | table: Vertical table: typical supply (78% of new Tradeyard listings private), commercial unit, hierarchy depth, who acts, integration principals (about 160 vendors for Hearthly; 88% of Motorvane dealer listings via DMS feeds), individual professional identity, trader questions, for general classifieds, real estate, automotive and jobs. |  |\n\n### In Practice: Documented Patterns and Three Veldmark Accounts\n\n**Controlling idea** (`evidence`, id `in-practice`): Public portal interfaces and investor reports support the model's levels, commercial units and integration principals, and Femke, Autohaus Ruhrblick and the Polish dealer overlap show the model at work and raise the group question.\n\n**Advances the thesis** (S1, S2, S4, S6): Tests the model against documented interfaces and three cases with ledger figures.\n\n**Transition in:** `example`: The model, its choices and their weight per vertical. → Public evidence and three Veldmark accounts that test it.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): Documented patterns first, all public-company evidence in one place and labeled as inference, so the model is anchored in public interfaces before the fictional cases; then the simplest case (Femke) and the reclassification population that resembles her, the dealer case, and finally the cross-brand overlap, which ends on the registry question the next section answers. The overlap earlier would interrupt the single-account cases with a group question.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p32 | evidence (list) | The public record on seller models is thin, but mobile.de, Rightmove, investor reports, CarGurus and the Bundeskartellamt document separated sellers and accounts with integration principals, branch tenancy, the commercial unit as a modeling choice, accounts with contracts, and dealer data portability. Each bullet leads with what it shows about the account model; the Bundeskartellamt bullet states its bearing on integration principals before the clearance grounds. | source: mobile.de Seller API (n.d.): seller ID and customer number, multi-locations; Transfer Service Providers, with providers serving more than ten customers supplying contacts, software, VAT ID and customer numbers; every ad names the dealer's customer number; API credentials independent of sellers, seeing only linked sellers.; source: Rightmove RTDF v1.4.1 (2023): Network ID per software provider, Branch ID per office, sales and lettings channels; calls 'rejected if sending a channel to which the branch does not have access'; mutual TLS; branch-scoped leads; pre-advertising customer checks and redress-scheme membership (Rightmove guide, n.d.).; statistic: Rightmove: ARPA per advertiser, 16,385 agency branches at end 2025 (2026 results). Autotrader UK: 13,942 retailer forecourts on average in FY26, £2,995 average revenue per retailer per month.; statistic: CarGurus 10-K (2026): a paying dealer is a dealer account with an active paid subscription; 34,409 at end 2025.; source: Bundeskartellamt clearance of mobile.de's acquisition of Carwow's German business, 8 October 2026: dealers multi-home and export data. |  |\n| p33 | example (list) | Under the target model Femke is a user with one private seller account whose self-declared status, Safe Deal sales below the DAC7 thresholds and coarse public profile are all recorded. Her future Motorvane profile is a brand-specific identity record, not a storefront or seller account. | scenario: March 2027 account; private, self-declared, with date and wording; 'Private seller' shown; the €225 city bike through Safe Deal; four 2027 Safe Deal sales for €610; profile shows first name, district, member-since date and transaction-verified ratings. | `sequence`: The public patterns. → The first Veldmark account, a private seller. |\n| p34 | example | About 18,000 Tradeyard Netherlands accounts declared as private published more than 100 listings each, so reclassification fixes a legal exposure and creates sales prospects. | scenario: About 18,000 accounts in 2026 with more than 100 listings each; Aisha Rahman's sample review found most were resellers (illustrative Veldmark figure). | `contrast`: Femke, a genuine private seller. → Accounts that only look like hers. |\n| p35 | example (list) | Autohaus Ruhrblick is one legal entity with two branches, one contract and a DMS vendor that acts as an integration principal with scoped grants. | scenario: Autohaus Ruhrblick GmbH, verified in 2019 and re-verified every 90 days in the target model; one Motorvane Germany account; Essen and Bochum branches with their own routing; Pro 150 (150 slots, €1,450 a month) covering both; the DMS vendor (serving about 1,900 Motorvane dealers) with listings-write and statistics-read grants and no lead access. | `sequence`: A private seller. → A dealer. |\n| p36 | example | When Ruhrblick lists the Essen Golf, ownership, assignment, provenance, lead routing and the trader panel each come from the right entity, and the model lets Motorvane measure feed latency per vendor. | scenario: The 2021 Volkswagen Golf listed on Wednesday 14 April 2027; 23 raw leads in ten days (19 after deduplication) to the Essen queues; trader panel per DSA Art. 30(7); removal 26 hours after the 29 April sale. | `example`: Ruhrblick's model. → One listing moving through it. |\n| p37 | example | In Poland, matching the two brands' professional accounts on the tax number finds about 2,900 dealers active on both, about 40% paying both. | scenario: Tradeyard Poland's cars section and Motorvane Poland compete for dealers; no shared identifiers; a one-off NIP match finds about 2,900 dealers on both, about 40% on paid packages with both (illustrative Veldmark figure). | `sequence`: Accounts within one brand. → The same dealers across two brands. |\n| p38 | analysis | The overlap is a strategic fact that justifies a registry both brands can read, and it also warns what the registry must not be used for. |  | `cause_effect`: The 2,900 overlap. → What it implies for a group registry and its limits. |\n\n### Group-Wide Identity Versus Per-Brand Accounts\n\n**Controlling idea** (`recommendation`, id `group`): A multi-brand group should share the login and verified legal-entity facts and keep brand accounts separate, with purpose limits on the links that make neutrality commitments checkable.\n\n**Advances the thesis** (S6): Settles the group-level choice the thesis takes a position on.\n\n**Transition in:** `problem_solution`: The warning at the end of the Polish overlap. → The options a group has and the one Veldmark chooses.\n\n**Order of paragraphs** (`problem_solution`): Options first, then the choice and the case that tests it (Keybridge), then the rules that answer the case, then who owns the remaining legal sides. Rules before the Keybridge case would read as arbitrary.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p39 | comparison | A multi-brand group has three realistic options for who-lists data, each right for a different kind of group. | table: Options table: separate accounts per brand, shared identity and party registry with brand accounts, one group account across brands, with what is shared, strengths, weaknesses and when each is right. |  |\n| p40 | example | Veldmark chooses the middle option, and its Keybridge neutrality commitment shows why the purpose of the registry's links must be limited. | scenario: March 2027 commitment that no Keybridge agency data is used by Hearthly for ranking or sales targeting, with access controls and an annual independent review; Agence Rhône Habitat is both a Keybridge customer and a Hearthly advertiser.; figure: Figure 6: the registry gives every brand the same verified trader record; Keybridge reaches Hearthly only as an integration principal. | `example`: The three options. → Veldmark's choice and the case that tests it. |\n| p41 | recommendation (list) | Veldmark's decision record sets four rules: the registry holds only register and verification facts, brand accounts link to it and not to each other, Keybridge shares only verification facts, and every cross-brand use is logged and reviewed. | scenario: Group business party registry rules; cross-brand queries as privileged reports for group finance and approved analyses such as the Poland overlap. | `problem_solution`: What the registry link may be used for. → The rules that answer it. |\n| p42 | explanation | Data protection and competition law each have an owner, and the architecture's job is to make the commitment checkable. | scenario: Lucía Ortega's team owns data protection; Veldmark ID links private users' profiles across brands only when they use more than one brand; competition is for counsel. | `additional_support`: The four rules. → Who owns the data-protection and competition sides. |\n\n### Failure Modes\n\n**Controlling idea** (`counterargument`, id `failure-modes`): Nine recurring mistakes each undo part of the model, from listings owned by users to pooled reputation.\n\n**Advances the thesis** (S1, S2, S3, S4, S6): Names the failure that each claim of the model prevents.\n\n**Transition in:** `contrast`: The model as it should work, up to group level. → The ways it is commonly undone.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p48 | counterargument (list) | Nine mistakes recur, each undoing part of the model: user-owned listings, the trader checkbox, legal and display hierarchies conflated, billing and legal hierarchies conflated, shared integration credentials, suspension that does not propagate, one retention clock, cross-brand merging by e-mail and pooled reputation. | scenario: The Villeurbanne agent; franchisees under the network's legal identity; Ghost Inventory with an enforcement problem; the DSA's six-month deletion rule; the Keybridge commitment. |  |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `ca-view`): The seller account is a supporting domain that almost every core domain depends on, so a group standardizes it early through four decisions, watches five measures and knows when the model is too much.\n\n**Advances the thesis** (S2, S4, S6): Turns the model into group decisions with owners, dates and measures.\n\n**Transition in:** `problem_solution`: The failure modes. → The decisions that prevent them at group scale.\n\n**Order of paragraphs** (`prerequisite_order`): Why standardize early, then the decision that defines the model, then the registry that depends on it, then the ownership split for trader status, then integrations, then the measures that watch all four and the condition under which the model is not worth it. Measures before decisions would watch nothing yet decided.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p49 | claim | The seller account is a supporting domain that almost every core domain depends on, so a group should standardize it before other services copy their own versions. |  |  |\n| p50 | recommendation | Decision 1 makes one supply-side model with one group contract for identifiers and events across all brands, which the 2028 product catalog and entitlement service builds on. | scenario: Events SellerAccountCreated, TraderStatusChanged, BranchAdded, MembershipEnded, AccountSuspended; catalog and entitlement service due Q2 2028. | `elaboration`: Standardize early. → The first decision: what to standardize. |\n| p51 | recommendation | Decision 2 creates a group business party registry, approved in August 2027 and live with Veldmark ID in 2028, that serves every brand's trader and tax duties under the purpose rules. | scenario: Approved at the architecture advice forum in August 2027; owned by the identity platform team; serves DSA traceability, consumer-law declarations, P2B and DAC7; scheduled re-verification. | `sequence`: The shared model. → The shared registry of legal facts. |\n| p52 | recommendation | Decision 3 splits trader status between the account service, which owns the status and history, and trust and safety, which owns signals and cases, under jointly owned policy. | scenario: Aisha Rahman and the account platform's product lead own the policy; Lucía Ortega's team signs off on what buyers see. | `sequence`: The registry. → Who owns trader status. |\n| p53 | recommendation | Decision 4 moves every brand's feed and API partners to grants per seller account and branch, starting with Motorvane's DMS vendors in 2028, which also makes feed quality measurable per vendor. |  | `sequence`: Trader status ownership. → Integrations. |\n| p54 | recommendation | Five measures show whether the model holds, from the share of professional listings with a verified trader record to the volume of cross-brand registry queries. | reasoning: Verified trader share (target 100%); reclassification cases opened and resolved; orphaned listings; integration principals on shared credentials; cross-brand registry queries. | `sequence`: Four decisions. → What to watch. |\n| p55 | counterargument | A single-brand, C2C-only marketplace without payments can live without the full model until the first dealer asks for a second login. |  | `contrast`: The full model and its measures. → The condition under which it is too much. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Ten questions test a design against the model in a review.\n\n**Advances the thesis** (S1, S2, S3, S4, S6): Turns each claim into a question a review can ask.\n\n**Transition in:** `sequence`: The Chief Architect's decisions. → Questions a reader can take into a design review.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p56 | recommendation (list) | Ten questions take the model into a design review, from naming each listing's user, trader, contract and branch to finding services that keep their own account hierarchy. |  |  |\n\n## Conclusion: From the Listing to Its Supply\n\n**Synthesis:** The four problems in Agence Rhône Habitat's letter had one cause, a record answering four questions, and separate entities put each on its owner. With the seller account modeled, every reference the listing holds has an owner, a version and a contract: the aggregate and its events, the canonical tree and its releases, the attribute dictionary, the media asset model, the location value object and the supply-side account model.\n\n**So what:** Veldmark's 2027 decisions (Veldmark Place in May, Listing event contract v1 on 1 July, the business party registry in August, the taxonomy and attribute service in October, the group media decision in November) give every later stage a contract to read instead of a table to copy.\n\n**Callback:** The chapter's scene (Agence Rhône Habitat's letter and Hearthly's fourth problem) and the part opening's test: be able to say who owns each part of a listing, how it is versioned and which systems copy it. Each complaint now lands on a named entity, and the part's test can be answered for every reference the listing holds, the seller account last.\n\n**Takeaway** (`course_of_action`): For each part of your listing, name its owner, its version and the systems that copy it; Part III then puts the model under load through forms, APIs and feeds, starting with the integration principals this chapter defined.\n\n**Hand-off** to [Part III — SUPPLY: Getting Inventory In](part-3.html): `contrast`: Part II's listing model, designed as if listings arrived clean and one at a time, and the integration principals the seller account model defined. → Supply that arrives through forms, partner APIs and bulk feeds from systems the marketplace does not control, and the chain that turns it into searchable listings.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p57 | synthesis | Each problem in Agence Rhône Habitat's letter now lands on its own entity, which one advertiser record could not do because it answered four questions at once. |  |  |\n| p58 | synthesis | With the seller account modeled, every reference the listing holds has an owner, a version and a contract, which is the test Part II set for each part of a reader's own listing. |  | `conclusion_summary`: The seller account answered. → Part II's references, all owned and versioned, and the part's test. |\n| p59 | cause_effect | At Veldmark, five 2027 decisions across Part II put those contracts in place, so every later stage reads a contract instead of copying a table. | scenario: Veldmark Place (May), Listing event contract v1 (1 July), the business party registry (August), the taxonomy and attribute service (October), the group media decision (November). | `example`: The contracts in general. → The Veldmark decisions that established them. |\n| p60 | transition | Part II designed the model as if listings arrived clean and one at a time, whereas Part III puts it under load from forms, partner APIs and bulk feeds the marketplace does not control and follows the chain that turns that supply into searchable listings, starting with the integration principals defined here. |  | `contrast`: Part II's model, designed as if listings arrived clean and one at a time. → Supply from systems the marketplace does not control, and the chain that turns it into searchable listings. |\n\n## Non-goals\n\n- Authentication methods, verification levels, KYB vendors and verified badges. See [Who Is on the Other Side? Identity and Verification](identity-and-verification.html).\n- The legal analysis of the DSA, DAC7 and consumer law. See [Rules of the Marketplace: DSA, DAC7 and Vertical Regulation](marketplace-regulation.html).\n- Packages, pricing, entitlements and billing. See [Packages, Bumps and Quotas: Products, Pricing and Entitlements](products-and-entitlements.html).\n- Lead objects, conversations and routing mechanics. See [From Interest to Contact: Messaging and Lead Management](messaging-and-leads.html).\n- Pro tooling and CRM features. See [Serving the Pros: Dealer, Agent and Merchant Tooling](professional-seller-tooling.html).\n- Feed contracts and ingestion mechanics. See [Many Doors In: Forms, APIs and Bulk Feeds](listing-ingestion.html).\n- Reclassification signals and moderation cases. See [Trust and Safety as a Platform](trust-and-safety-architecture.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- The CJEU's criteria for when an online seller is a trader (Kamenova, C-105/17, 2018) would strengthen the reclassification section; the judgment could not be fetched and is not cited. (Carried over from spec.md.)\n- Whether the DSA allows an exception to displaying a home-based sole trader's address (as INFORM does) remains open; see marketplace-regulation. (Carried over from spec.md.)\n- National licensing of estate agents (for example France's professional card) is mentioned only generically; verify per country if the chapter is extended. (Carried over from spec.md.)\n\n## Decision log\n\n- **2026-10-19** — Framed the model around four questions (acts, responsible, pays, shown) rather than an entity list, because each Veldmark failure in the scene maps to one conflated question.\n- **2026-10-19** — Recommended 'seller account linked to a user or a legal entity' over 'degenerate organization of one', to keep private sellers' data minimal and make reclassification explicit.\n- **2026-10-19** — Used the Keybridge neutrality commitment as the test case for group identity, so the chapter argues for shared identity and verified facts with purpose limits, not a single group account.\n- **2026-10-19** — Labeled the seller account model as a reference architecture inferred from public interfaces (mobile.de, Rightmove), not a description of any company's schema.\n- **2026-11-12** — Converted spec.md to spec.json. Success criteria: the entity-naming and franchise criteria are covered by the journal spec's AC-1; the trader-status criterion is rewritten as reader outcome AC-4, the integration criterion as AC-5 and the group-identity criterion as AC-6, all added here at severity minor; the regulation-mapping criterion (an inventory of laws) and the worked-examples, tables and diagrams criterion (an inventory of contents) are dropped, their substance being tested by AC-1 and AC-4. Word limit: spec.md set none, so length.max_words is the published prose length (6,619 words by check_draft's count) plus 5%. Rejected: Keeping the inventory criteria as human-checked items.; A separate criterion for the regulation table (kept inside AC-4).\n- **2026-11-12** — Rewrote the closing section to perform Part II's closing (the journal spec noted that the published two-sentence closing did not): p57 answers the scene's letter, p58 states the part synthesis and the part's test, p59 gives Veldmark's 2027 decisions as the so-what, and p60 hands off to Part III with the contrast its part-level transition declares. Round 1 escalated on one spec fault: both flow readers found Trade-offs unclear after the group section, re-opening choices the model had settled. Round 2 escalated on one spec fault: both flow readers found Vertical Differences unclear between the group section and the failure modes; moved it to follow Trade-offs. Note for the author: the journal spec's AC-2 expected answer still lists trade-offs and vertical differences after the group section; this order departs from it and the journal spec was not edited. Moved Trade-offs to follow the model (the brief allows changing the spec's order on a spec fault); transitions of trade-offs, in-practice and verticals rewritten. Added a lead-in (p43) and explanations after the ownership and integration tables (p45, p46) in the trade-offs section, because the section opened on an unintroduced table and two tables had no explaining prose; p03 now carries the roadmap; p01 opens from the location chapter's per-agency precision setting, as the journal spec's transition declares.\n- **2026-11-12** — Orchestrator: restored the published 'the same identity gives her a separate Motorvane profile if she ever sells a car' (the pass's 'the same login works on Motorvane' dropped the brand-profile design that Part V's identity chapter relies on); max_words raised by the 7 words the restoration adds.\n- **2026-11-12** — Resolved the round-3 escalation under the author's delegation ('auto resolve all ESCALATE topics'). (1) Added p15a under a new 'Seller accounts and contracts' subheading in the concepts section: the seller account is the brand-level record through which a person or an organization sells, linked to the organization that is the trader, with the group business party registry introduced there; p13 now says 'whether a seller acts as a trader', so 'seller account' is first used in its definition. (2) Added p15b defining the commercial contract and billing account; the entity table's registry row no longer points forward. (3) Moved the company evidence out of the concepts section into the in-practice list (p32), removing p16 (Rightmove feed levels), p17 (commercial unit in investor reporting) and p21 (mobile.de transfer service providers) as concepts units; their published text is restored in full in p32's mobile.de, Rightmove and new investor-reports bullets, and the 'described above' back-references are gone. p22's and p18's transitions rewritten for their new predecessors. Word limit raised under the brief's rule 2 from 6,957 to 7,150 (+2.8%, within the 10% allowed) for the two definition paragraphs, the restored sentence and the hand-off clause; the draft is 7,133 words. Restored the published sentence 'The table is Veldmark's illustration, but any franchise network has the same shape.' after p25 (rule 7). Part III's journal-spec entry is now full; the hand-off (p60) was re-checked against Part III's transition_in (contrast) and now also names the chain that turns supply into searchable listings. AC-2's expected answer in journal-spec.json still lists trade-offs and vertical differences after the group section; a replacement was handed to the orchestrator, the journal spec is not edited here. Earlier flow-rubric notes not taken (fold verticals into trade-offs, align the scene's five roles with four questions, 'each of the four problems' in p57, merge p11's scope hedge into p10, the fixed order of the closing sections) are kept as decided: they keep the published text and the book's fixed chapter shape. The restored 'separate Motorvane profile' sentence stays. Rejected: Moving the concepts section's company evidence only partly (keeping Rightmove's feed in concepts), which would leave the split both round-3 flow readers reported.; Defining the seller account inside p09, which would give p09 two controlling ideas.\n- **2026-11-13** — Fixed under the author's delegation (fix-only pass), round-5 blocking findings: (1) spec fault: KEY POINTS bullet 3 and the thesis statement now say organizations own listings through their seller account on each brand, and rule 1 in p19 says the seller account is the organization's account on that brand, so key points, body, trade-off table and Failure Mode 1 agree; (2) p15 says the entity table's 'Legal entity' is the organization, and the table row reads 'Legal entity (the organization)'; (3) p33 glosses Femke's Motorvane profile as Veldmark ID's brand-specific record, not a storefront or seller account (ledger: Veldmark ID, brand-specific profiles); (4) p35's 2019 check and the June 2027 re-check pilot split into two sentences; (5) p32's Bundeskartellamt bullet now leads with its bearing on integration principals, clearance reasons kept after it. Minor findings (Keybridge writes, 'legal weight', Rightmove feed cited before In Practice) left as minor. max_words raised from 7,150 to 7,300 (+2.1%) for the glosses.\n\n## Sources\n\n- **Internal**\n  - _journals/listing-systems-architecture/journal-spec.json — Intent outcome, acceptance criteria AC-1 to AC-3, thesis, role, the Part II closing and Part III's transition_in.\n  - listing-aggregate, location-and-geo, identity-and-verification, products-and-entitlements, marketplace-regulation, listing-ingestion — Neighbouring ownership.\n  - _research/scenario-ledger.md, _research/consistency-issues.md, _research/brie
