<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, the three acceptance criteria, the thesis and the role are copied unchanged from the vertical-requirements entry in journal-spec.json; the conclusion realises Part I's closing from the same file. Two units were added to the published text: a roadmap paragraph in the introduction (p04, for AC-2) and the conclusion was widened from one paragraph to three (p72 to p74) to carry Part I's closing.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The fourteen dimensions of a vertical requirement profile and how general classifieds, real estate, automotive, jobs and recommerce differ on them.\n- **Know:** The four layers of the shared-versus-specific decision: shared platform, shared engine with vertical content, vertical capability with one owner, brand product.\n- **Believe:** Verticals differ in physics, not just in categories, and the shareable part is the machinery underneath.\n- **Be able to:** Fill in a vertical requirement profile with numbers and classify each capability part into a layer with an owner and a reason.\n- **Be able to:** Set the condition under which a vertical moves onto a shared engine.\n\n**Audience:** Chief architects and platform leads of multi-vertical marketplace groups, and engineering directors of vertical brands asked to join a shared platform.\n\n**Already knows:**\n\n- What an API, a database, an event stream, a search engine and Kubernetes are, and how to make and defend an architecture decision.\n- Part I so far: marketplace models and the endpoint ladder, liquidity cells, the industry's waves, capability maps and heat maps, bounded contexts and context maps.\n- Veldmark, its brands (Tradeyard, Motorvane, Hearthly, Keybridge), its cast, the Common Ground program and the three running listings (the Rotterdam city bike, the Essen Golf, the Lyon apartment).\n- The fifteen failure-pattern names.\n\n**Does not yet know:**\n\n- Vertical specifics: VINs and type-approval codes, dealer management systems (DMS), multiple listing services (MLS) and IDX, applicant tracking systems (ATS), France's DPE energy diagnostic, ESCO and O*NET.\n- The vertical requirement profile and the four-layer share test, which this chapter defines.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a planned move of a vertical onto a shared engine, the reader names what should decide it and which parts stay with the vertical. *Probe:* A group program plans to move its car brand onto the shared ingestion engine next quarter because the plan says so. Using only this chapter: what should decide the move, and which parts of car listings belong to the vertical? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** What genuinely differs between verticals, and what can be shared?\n\n> **Claim:** Verticals differ in physics (who supplies the inventory, whether the item has an identity outside the listing, which external system of record wins a conflict, how long a listing lives, how many attributes it carries, what a lead is worth and where the money moves), so a group should share the machinery beneath (login, events, media, messaging transport, search infrastructure), let each vertical own its content on shared engines, give vertical capabilities such as vehicle identity and property entities one group owner, and move a vertical onto a shared engine only when the engine meets that vertical's requirement profile.\n\n**Disputed by:** The synergy case that one listing platform with a category tree per vertical can carry a used sofa, a family car, an apartment and a job, and the opposite view that each vertical needs its own platform end to end.\n\n**So what:** A group that accepts this writes a numbered requirement profile per vertical, classifies every capability part into one of four layers with an owner and a reason, and turns 'move the car brand onto the shared ingestion engine' into a stage gate measured by that brand's own feed success rate and delete latency.\n\n**How and why:** A car arrives through a dealer's feed with a 17-character identity that decodes into 31 attributes; a sofa arrives from a phone camera with a title and a price; Hearthly France's 1.9 million listings describe about 1.12 million properties; a job expires on a date set in an applicant tracking system. These forces change ingestion load, the data model, ranking, fraud and monetization, while login, events, media and messaging transport behave alike in every vertical.\n\n**Supporting claims**\n\n- **V1** — Verticals differ in physics, and a fourteen-dimension requirement profile written with numbers shows the differences; shared platforms break most often on item identity, external system of record and transaction locus.\n- **V2** — What to share is decided per capability part, in four layers: shared platform, shared engine with vertical content, vertical capability with one group owner, and brand-local product.\n- **V3** — The machinery beneath can be shared only when its requirements come from every vertical's profile and each vertical can change its content without a release of the engine.\n- **V4** — Vertical capabilities such as vehicle identity and property entities should be built once, owned by the vertical that knows them best, and offered to other brands through a published contract.\n- **V5** — A vertical moves onto a shared engine only when the engine meets that vertical's profile, measured by its own metrics, and the profiles and layers are revisited when business models or owners change.\n\n## Role in the part\n\nTests where the shared capability and context maps stop fitting, gives the share test the book uses, and performs the part's closing. Supports P1-6 of part `part-1`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `assertion_evidence_reasoning` in differ to architecture: the differences, the public evidence for them, then the architecture that follows; `small_to_large` in worked-example: three listings, three brands, one brand's sections, the whole capability list)\n\nThe scene poses the question; the concepts give the two tools needed to answer it; the comparison and the public record fill in the profile; the outside parties who can change each vertical's requirements close the account of differences; the architecture turns the differences into four owned layers; the trade-offs set those layers against the pure strategies a group could choose and name the default; the worked example applies both tools to Veldmark and lands on that default; the failure modes and the Chief Architect's view govern the result. Each step uses what the one before established: the layers cannot be justified before the differences are shown, the strategies are described in terms of the layers, and the classification in the worked example needs the profile, the layers and the default option. Placing the public record before the comparison would leave the evidence without the dimensions it supports; placing the worked example before the architecture would classify capabilities into layers the reader has not seen built; placing the trade-offs after the worked example would present the alternatives after the recommendation had already been made and applied.\n\n## Introduction\n\n**Hook** (`thought_provoking_question`): Can one listing platform carry a used sofa, a family car, a three-room apartment and a warehouse job, with a different category tree for each, as a group's synergy case assumes?\n\n**Bridge:** Part I's capability map and context map, which treat the four Veldmark brands alike because most of both maps is shared. → The opposite question: where that sameness stops, answered by the forces that act on each vertical's capabilities.\n\n**Thesis statement** (KEY POINTS callout (bullets 1 to 3) and paragraphs p02 and p03.): Verticals differ in physics, so a group shares the machinery beneath, lets each vertical own its content on shared engines, gives vertical capabilities one owner, and moves a vertical onto a shared engine only when the engine meets its requirement profile.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p04.):\n\n- Veldmark's workshop on one platform for four verticals. *Kept in:* scene.\n- What 'vertical' means architecturally: the requirement profile and the share decision. *Kept in:* concepts.\n- How five verticals differ on the profile, the public record for each, and the outside parties who decide each vertical's requirements. *Kept in:* differ, in-practice, who-decides.\n- A platform with vertical seams in four layers. *Kept in:* architecture.\n- The four layers weighed against the pure strategies a group could choose instead. *Kept in:* trade-offs.\n- Three Veldmark listings and the workshop's classification. *Kept in:* worked-example.\n- Failure modes, the Chief Architect's view and review questions. *Kept in:* failure-modes, chief-architect, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Part I has so far treated the verticals alike, and this chapter asks where that sameness stops, because a group's synergy case assumes one listing platform with a category tree per vertical can carry a used sofa, a family car, an apartment and a job. | reasoning: business-capabilities generalizes the capability map across verticals by renaming and re-weighting; bounded-contexts draws one context map for all four Veldmark brands. |  |\n| p02 | claim | What differs between verticals is their physics: the forces that act on each capability, such as where supply comes from and whether the item has an identity, and these forces decide ingestion load, the data model, ranking, fraud and how money is made. | example: A car arrives through a dealer's feed with a 17-character identity that decodes into 31 attributes; a sofa arrives from a phone camera with a title and a price; an apartment arrives three times from three agencies; a job arrives from an applicant tracking system with an externally enforced expiry date. | `elaboration`: The question of where sameness stops. → The answer in one word, physics, and four items that show it. |\n| p03 | definition | The chapter owns two terms, the vertical requirement profile and the shared-versus-specific decision, and applies them to the fictional Veldmark group, whose three listing brands cover four verticals. |  | `cause_effect`: The forces that differ between verticals. → The two tools the chapter builds from them: a profile written with numbers and a four-layer classification with reasons. |\n| p04 | transition | The chapter runs from Veldmark's workshop through the two concepts, the comparison of five verticals, the public record and the outside parties who decide, to a platform with vertical seams, three Veldmark listings and the workshop's classification, and ends with trade-offs, failure modes, the Chief Architect's view and review questions, so that Part II can start from its result. |  | `sequence`: The two terms the chapter owns. → The order in which the chapter builds and uses them, and what Part II takes from the result. |\n\n## Sections\n\n### Setting the Scene at Veldmark: One Platform for Four Verticals?\n\n**Controlling idea** (`context`, id `scene`): Veldmark's Common Ground program has a capability list but no way to say which parts of each capability are shared, and three brand leaders bring three incompatible positions, so Ingrid asks for one real listing per brand described by twelve questions.\n\n**Advances the thesis** (V1): Poses the chapter's question as a decision Veldmark must take, and shows through three brand positions that the verticals' differences are claimed but not yet measured.\n\n**Transition in:** `sequence`: The roadmap, which starts at Veldmark's workshop. → The workshop's situation in March 2027.\n\n**Order of paragraphs** (`problem_solution`): The undecided capability list comes first so that the three positions read as competing answers to it; Ingrid's twelve questions come last because they are her way of settling the disagreement, and the rest of the chapter uses their answers.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | context | In mid-March 2027 Ingrid Halvorsen calls a two-day scoping workshop because Common Ground's capability list says nothing about which parts of each capability are shared. | scenario: The board approved Common Ground in January 2027: €140 million over four years under the principle 'share platforms, not products'; the capability list runs from Veldmark ID to the taxonomy and attribute service. |  |\n| p06 | description (list) | Three brand leaders, Felix Brandt of Motorvane, Julien Marchand of Hearthly and Katarzyna Nowak of Tradeyard Poland, arrive with three incompatible positions on what Veldmark should share. | scenario: Felix Brandt: 91% of Motorvane's 1.45 million listings come from 21,400 dealers, 88% of those through DMS feeds, so a shared listing service built for sofas would be a regression. Julien Marchand: Hearthly France's 1.9 million listings describe about 1.12 million properties, so he wants one property entity built once. Katarzyna Nowak: Tradeyard Poland runs goods, cars, property and jobs on one horizontal stack and does not know whose vehicle data its cars section should use. | `contrast`: The undecided capability list. → Three positions that answer it differently. |\n| p07 | process | Ingrid replaces the capability list with one real listing per brand described by the same twelve questions, whose answers become the first vertical requirement profiles. | scenario: The twelve questions: supplier, channel, identity outside the listing, lifetime, structured attributes, images, location precision, value of the first contact, who paid Veldmark, where the money of the sale moved, regulation, typical fraud. | `problem_solution`: Three positions that cannot be compared. → A method that makes them comparable. |\n\n### Concepts: What \"Vertical\" Means Architecturally\n\n**Controlling idea** (`definition`, id `concepts`): A vertical is described architecturally by the forces in its requirement profile, and the share decision places each part of a capability in one of four layers.\n\n**Advances the thesis** (V1, V2): Defines the two tools the thesis relies on: the fourteen-dimension profile and the four-layer share decision.\n\n**Transition in:** `elaboration`: Ingrid's twelve questions and the first profiles they produce. → Precise definitions of the profile and of the share decision the workshop needs.\n\n**Order of paragraphs** (`prerequisite_order`): Horizontal and vertical come first because a profile describes a vertical, including a vertical section inside a horizontal brand; the profile comes before the share decision because a capability part can only be placed in a layer once the verticals' differences are written down.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | definition | A horizontal marketplace's vertical sections inherit the horizontal platform's physics even when their own physics differ. | example: Tradeyard Poland's cars section is a vertical living inside a horizontal stack. |  |\n| p09 | definition | A vertical requirement profile describes a vertical by the forces that act on its systems, in fourteen dimensions grouped by the part of the architecture they stress: Ingrid's twelve questions plus the external system of record and the decision horizon. |  | `sequence`: Horizontal and vertical marketplaces, and sections that inherit the wrong physics. → The tool that describes a vertical's physics: the profile. |\n| p10 | description (table) | Table 1 gives each of the fourteen dimensions as a question and names the part of the architecture it stresses, in five groups: supply, item, demand, money and rules. | table: Table 1: fourteen dimensions, each with the question it answers and what it stresses (for example item identity stresses entity resolution, enrichment and history). | `example`: The fourteen dimensions named in outline. → Each dimension as a question with the architecture it stresses. |\n| p11 | explanation | The profile is comparative and is filled in with numbers where numbers exist, so two verticals that differ on few dimensions can share more than two that differ on many. | example: '88% of dealer listings via DMS feeds'; '1.7 listings per property'. | `elaboration`: The fourteen dimensions. → How the profile is used: to compare verticals, with numbers. |\n| p12 | definition (list) | A shared-versus-specific decision places a capability, or a part of one, in one of four layers: shared platform, shared engine with vertical content, vertical capability owned by the group, or brand-local product. | example: Authentication, the event backbone and image storage (layer 1); a taxonomy service running vertical schemas, an ingestion engine running vertical adapters, a ranking framework running vertical policies (layer 2); vehicle identity and a property entity and valuation model (layer 3); user experience, packages and prices (layer 4). | `sequence`: The profile, which says how verticals differ. → The second tool, which decides what follows from the differences. |\n| p13 | explanation | The share decision is taken per capability part, not per capability, so one capability such as search spans all four layers. | example: Search: the engine and its operations in layer 1, index mappings and ranking policies in layer 2, a vehicle price-rating signal in layer 3, the result page in layer 4. | `elaboration`: The four layers. → The unit the layers are applied to: the part, not the whole capability. |\n\n### How the Verticals Differ\n\n**Controlling idea** (`comparison`, id `differ`): The five verticals differ on almost every dimension of the profile, and shared platforms break most often on three of them: item identity, external system of record and transaction locus.\n\n**Advances the thesis** (V1): Fills in the profile for five verticals and shows with sourced evidence the three differences that decide data models and system boundaries.\n\n**Transition in:** `sequence`: The profile's fourteen dimensions. → The profile filled in for five verticals.\n\n**Order of paragraphs** (`large_to_small`): The full comparison comes first so the reader sees that the verticals differ almost everywhere; the three rows that break shared platforms are then taken one at a time. Starting with the three rows would hide that the others differ too; ending with the table would leave the evidence without the frame it supports.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | comparison | Table 2 compares five verticals (general classifieds, real estate, automotive, jobs and recommerce) on the fourteen dimensions, naming the typical case in each cell. | table: Table 2: five verticals by fourteen dimensions, for example item identity is weak for general classifieds, a persistent property for real estate, a VIN for automotive, probabilistic for jobs. |  |\n| p15 | analysis (table) | The comparison shows that the five verticals differ on almost every row of the profile, not only in what they list. | table: Table 2's caption. | `conclusion_summary`: The comparison table. → What it shows. |\n| p16 | claim | Shared platforms most often break on three rows: item identity, external system of record and transaction locus. |  | `emphasis`: Differences on almost every row. → The three rows that matter most for system boundaries. |\n| p17 | comparison (list) | In automotive and real estate the item has an identity the listing only references, jobs have only a probabilistic identity, recommerce sits between, while in general classifieds the ad is the item. | source: NHTSA vPIC decodes a 17-character VIN, batches of up to 50 (version 4.10, accessed October 2026); mobile.de's Seller API carries hsn, tsn and a Schwacke code; Autotrader Connect keys valuations on a derivative identifier.; source: OS Open UPRN publishes about 40 million identifiers; Zillow's FY2025 10-K describes about 173 million homes and more than 46 million user-updated records.; source: ESCO v1.2.1: 3,039 occupations and 13,939 skills in 28 languages; O*NET-SOC: 1,016 titles.; source: eBay's Product-Based Shopping Experience made catalog association mandatory from 2018; the mandate for all categories and brands was rolled back. | `sequence`: The three rows. → The first: item identity. |\n| p18 | analysis | Where the item has an identity, identity, specification and listing must be modeled as three separate things, because one item produces many listings and price history, duplicates, valuations and fraud checks hang off the identity. | figure: Figure 1: a sofa that disappears with its listing beside a car and an apartment whose identity links many listings over time. | `cause_effect`: The evidence that cars and properties have identities outside the listing. → What that requires of the data model. |\n| p19 | claim | In professional verticals the marketplace holds a copy of a record it does not own, because the dealer's DMS, the agency's CRM or the US multiple listing service is the system of record. | example: A private seller edits on the marketplace; a dealer edits in the DMS; an agency in its CRM; in the US the listing is created in an MLS that licenses copies to portals. | `sequence`: Item identity. → The second row: who wins a conflict. |\n| p20 | cause_effect | Because the record lives elsewhere, deletes arrive late or not at all, and ingestion must support push, pull, snapshots and deltas and reconcile them. | source: Rightmove's Real Time Datafeed specification v1.4.1 (updated November 2023) offers GetBranchPropertyList so integrators can check nothing is 'still live on Rightmove which should have been removed'; RESO describes replication as a full pull, then changes. | `cause_effect`: The marketplace holds a copy. → The defaults that reverses. |\n| p21 | comparison | Verticals range from no platform money flow to a full order platform, with automotive moving between the two. | source: The Productscape real-estate domain model, a generic reference model from the author's sibling repository named where it is quoted, records the property sale as settled off-platform at a notary or lease signing.; source: Vinted describes vertically integrated shipping and payments, with more than 500,000 pick-up and drop-off points and its own carrier in five countries.; statistic: Autotrader UK: more than 6,700 retailers on Deal Builder and 137,000 full reservations in the year to March 2026. | `sequence`: External system of record. → The third row: where the money moves. |\n| p22 | cause_effect | Where money moves the listing becomes an order, and transaction locus is the profile dimension most likely to change during a vertical's life. | reasoning: Payment intents, shipping labels, tracking events, disputes and a ledger follow once money moves on the platform. | `cause_effect`: The range of money flows. → What on-platform money does to the listing. |\n\n### In Practice: What the Public Record Shows\n\n**Controlling idea** (`evidence`, id `in-practice`): Read vertical by vertical rather than row by row, dated public records show how each vertical's physics shapes whole systems, and that the unit of sharing is a strategic choice that ownership can reverse.\n\n**Advances the thesis** (V1, V2): Grounds each vertical's profile in documented practice and shows sharing decisions working and reversing in real groups.\n\n**Transition in:** `additional_support`: The comparison, which cited the public record one row at a time. → The same record read vertical by vertical, with dates; sources that return from the rows (mobile.de's Seller API, Rightmove's feed specification, Vinted) are marked as returning and used for facts the rows did not use.\n\n**Order of paragraphs** (`grouping`): One vertical per subsection: the two verticals whose items have identities outside the listing first (automotive, then real estate, whose evidence ends with a country-level sharing reversal), then jobs and recommerce, then group-level evidence; general classifieds needs no subsection because it is the default the others differ from. The group cases come last because they are about sharing across verticals, which needs the vertical evidence first.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p22a | transition | The row sections cited the record one dimension at a time; read vertical by vertical, the public record shows how each vertical's physics shapes whole systems and how often groups reversed what they shared. Sources that return from the rows are named as returning, each for facts the rows did not use. |  |  |\n| p23 | evidence (list) | Automotive marketplaces describe a listing that is enriched from authoritative data rather than typed in, supplied through professional feeds. | source: mobile.de grants Seller API access to Transfer Service Providers and makes create idempotent; it returns a five-band price rating; CarGurus rates listings in five bands from Instant Market Value recalculated daily; Pkw-EnVKV presumes a car new if registered at most eight months ago or driven 1,000 km or less. | `sequence`: The vertical-by-vertical reading. → The first vertical, automotive. |\n| p24 | evidence (list) | Real-estate portals show a schema driven by law and by an external software ecosystem. | source: French DPE display duties and the ban on letting G-rated homes since January 2025; recast EPBD (EU) 2024/1275 to be transposed by 29 May 2026; Rightmove added fields in April 2022 and November 2023; Zillow's 2020 post on nearly 50 filters and more than 200 attributes; OpenImmo XML since 2001, with a REST successor expected at the end of 2026. | `sequence`: Automotive. → Real estate. |\n| p25 | evidence | Real estate resists multi-country sharing: AVIV moved from aligning its tech roadmap in 2021 to stronger local autonomy by 2025. | quotation: 2021: 'aligning our tech roadmap across the organization'; December 2025: AVIV rowed 'back on its plans for a fully integrated platform for all its European portals' and 'has strengthened the autonomy of its local businesses'. | `additional_support`: Real estate's regulation- and ecosystem-driven schema. → Its resistance to multi-country sharing. |\n| p26 | evidence (list) | Jobs marketplaces combine four properties no other vertical has together: probabilistic normalization, documents, an external expiry clock and performance pricing. | source: OLX's January 2024 LLM job-role extraction on ad events (about 2,000 ads a day, about 4,000 API requests); InfoJobs' documents on Adevinta's shared media service (January 2025); Google's validThrough rule (updated September 2026); Indeed billing on clicks or started applications. | `sequence`: Real estate. → Jobs. |\n| p27 | evidence | In recommerce the hard problems are order, payment and logistics state and search over an enormous low-structure catalog, not taxonomies or feed contracts. | source: Vinted moved search to Vespa (May 2023 to April 2024), about a billion active items, 4.64 seconds at p99 for an update to reach the index; its January 2026 post describes business events and sagas across almost 300 domains. | `sequence`: Jobs. → Recommerce. |\n| p28 | evidence | Adevinta's move from a vertical organization with a unified generalist platform plan to a decentralized operating model shows that the unit of sharing is a strategic choice that ownership can reverse. | source: Adevinta Annual Report 2023 (April 2024): organization by verticals and 'a unified global platform' for leboncoin and Kleinanzeigen; Strategic Report 2025 (May 2026): 'a decentralised, standalone operating model' with 'the localisation of intellectual property'. | `place`: Evidence from each vertical. → Evidence at the level of a group that organized by vertical. |\n| p29 | example | Kleinanzeigen's photo-based listing assistant, which excluded vehicles, jobs and services, shows that a shared capability can declare the verticals it does not serve. | case: Reported in November 2025: the assistant covered nearly all categories but excluded vehicles and intangibles such as jobs and services; the interpretation is the author's. | `contrast`: A group-level reversal. → A smaller case at feature level. |\n\n### Vertical Differences in Who Decides\n\n**Controlling idea** (`comparison`, id `who-decides`): Each vertical has outside parties who can rewrite its requirements on their own timelines, so the profile records them and the architecture makes their likely changes cheap.\n\n**Advances the thesis** (V1, V5): Adds the profile dimension the earlier tables leave implicit and shows why profiles must be revisited.\n\n**Transition in:** `additional_support`: The public record per vertical. → What it also shows: the parties outside the group who can change each vertical's requirements.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The claim that outside parties can change requirements, the table that documents them, then the one row that needs a comment. The section closes the account of how verticals differ and comes directly before the architecture, whose layers and seams must make these parties' changes cheap.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p57 | claim | The public record also shows who, outside the group, can change a vertical's requirements on their own timelines, so the profile records them and the architecture must be ready for their changes. | table: Table 3: per vertical, the parties that can change requirements, a documented example (DSA Article 30 from February 2024; NAR's 2025 listing options; Pkw-EnVKV amendments and Deal Builder backlash; Google's expiry rules; Vinted Pay's e-money licence) and the architectural readiness. |  |\n| p58 | analysis (table) | Table 3 lists, per vertical, the outside parties who can rewrite its requirements, a documented example and the readiness the architecture needs. | table: Table 3's caption. | `conclusion_summary`: Table 3. → Its consequence. |\n| p58a | analysis | Each example in Table 3 is a change the vertical did not choose, read in one clause per row: trader status became account data, IDX visibility a per-listing flag, job expiry a distribution event, and recommerce's payment party something that can change. | table: Table 3's documented examples for general classifieds, real estate, jobs and recommerce. | `elaboration`: Table 3's documented examples. → A one-clause reading of each, the automotive row left to the next paragraph. |\n| p59 | example | In a dealer vertical the supplier is also the paying customer, so per-dealer configuration and reversible platform states belong in the profile. | source: After retailer pushback, Autotrader paused the automatic rollout of Deal Builder and introduced 'request a reservation'. | `elaboration`: The automotive row of Table 3. → What the Deal Builder case means for the profile, the one row that needs a longer comment. |\n\n### Architecture: A Platform With Vertical Seams\n\n**Controlling idea** (`explanation`, id `architecture`): The four layers become an architecture when each has an owner and they meet at declared extension points: layer 1 shared only if every profile was consulted, layer 2 content changeable without an engine release, layer 3 built once with one owner, layer 4 left to the brand.\n\n**Advances the thesis** (V2, V3, V4): Turns the share test into owned layers and seams and gives the rule each layer must pass.\n\n**Transition in:** `cause_effect`: The evidence that verticals differ, that outside parties rewrite their requirements and that sharing decisions can reverse. → The architecture the author recommends in response: four owned layers with vertical seams.\n\n**Order of paragraphs** (`large_to_small`): The whole shape (Figure 2) first, then each layer from the most shared to the most local, then the seams along one listing's path. The seams come last because they connect layers the reader has already met; before the layers, an extension point would have nothing to connect.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p30 | claim | The four layers become an architecture when each layer has a clear owner and the layers meet at defined extension points. | figure: Figure 2: four layers with different owners; vertical capabilities plug into shared engines as enrichers and signals, never as forks. |  |\n| p31 | description | Layer 1 holds capabilities whose semantics do not depend on what is listed: authentication, the event backbone, media, messaging transport, search cluster operations, experimentation and the data platform. |  | `sequence`: The four layers in outline. → The first layer. |\n| p32 | claim | A layer-1 capability is shared only if its requirements were collected from every vertical profile, because each profile adds requirements the first vertical would not have written. | source: InfoJobs needed document conversion and sensitive storage; Rightmove's feed fetches up to 999 media items per property and does not re-fetch unchanged images. | `contrast`: Layer 1 as the same everywhere. → The requirements the profiles still add. |\n| p33 | claim | Layer 2 holds most of the value of a group platform and does most of the damage when its boundary is wrong. |  | `sequence`: Layer 1. → Layer 2. |\n| p34 | description (table) | In each layer-2 engine the mechanism is shared and the content is a vertical asset with its own owner and release cycle. | table: Table 4: five engines (taxonomy and attribute service, ingestion, ranking, catalog and entitlements, trust rules) with what is shared, the vertical content and who owns it. | `elaboration`: Layer 2 as the place of most value and most damage. → Its five engines, split into mechanism and content. |\n| p35 | claim | A good layer-2 boundary lets a vertical change its content without a release of the engine; otherwise content has leaked into the engine and the Category Straitjacket follows. | example: A mandatory energy-cost field for French listings that needs a code change in the shared attribute service. | `elaboration`: The split between mechanism and content. → The test that shows whether the split holds. |\n| p36 | example | OLX's configuration framework for ranking across countries and verticals is documented layer-2 thinking. | source: OLX's June 2025 post: a configuration framework for ranking models that balance paid-ad visibility across countries and verticals, including Motors and Real Estate. | `example`: The layer-2 test. → A documented case that meets it. |\n| p37 | claim | Some capabilities exist only because of one vertical's physics yet several brands need them, and building them twice or generalizing them into a layer-2 engine are both wrong. | scenario: Tradeyard Poland's cars section needs vehicle identity as much as Motorvane; Tradeyard Portugal's property section needs to recognize the same apartment listed twice. | `sequence`: Layer 2. → Layer 3. |\n| p38 | recommendation | The right answer is a vertical capability owned by the group through the vertical team with the deepest knowledge, offered through a published contract and plugged into shared engines as enrichers and signals. | example: The vehicle capability takes a VIN or registration and returns a specification with provenance and version; the property capability takes an address and listing facts and returns a canonical property identifier and its history. | `problem_solution`: Two wrong answers. → The right one. |\n| p39 | explanation | The owner of a layer-3 capability takes on obligations a brand team does not have: an internal service-level objective, versioned contracts, a roadmap that includes consuming brands, and licensing. | reasoning: Vehicle and property data often come from licensed providers whose terms may limit redistribution. | `elaboration`: Group ownership of a vertical capability. → What that ownership costs the owner. |\n| p40 | description | Layer 4, the brand's experience, packages, prices, sales tooling and professional front ends, stays with the brand. | source: Package design and prices differ by country and vertical in every portal annual report cited in monetization-models. | `sequence`: Layer 3. → Layer 4. |\n| p41 | description | Along one listing's path the flow is shared and each vertical contributes content or a capability through a declared extension point. | figure: Figure 3: one listing flow with eight vertical seams; solid arrows are the shared publication path, dotted arrows vertical rules, enrichers, policies and mappings. | `place`: The four layers. → Where they meet on the path of one listing. |\n| p42 | recommendation | Two design rules keep the seams honest: each extension point has a contract and a failure mode, and the number of seams is governed. | example: A vehicle decoder that times out leaves the listing publishable with a 'decode pending' state, because a dealer feed of 200 cars cannot wait for one provider. | `elaboration`: The extension points. → The rules that govern them. |\n\n### Trade-offs: How Much to Share\n\n**Controlling idea** (`comparison`, id `trade-offs`): Of four strategies for several verticals, a shared core with vertical extension points is the default, with a vertical platform reused only for layer-3 capabilities and separate stacks kept possible for any business that might be sold.\n\n**Advances the thesis** (V2, V5): Compares the share test's mix with the pure strategies and states when each is right.\n\n**Transition in:** `contrast`: The recommended four layers with vertical seams. → The pure strategies a group could choose instead, and the author's default among them.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The options and their conditions first, then the author's judgement drawn from them, then the condition under which the judgement fails; the caveat comes last so it qualifies a recommendation the reader has already heard. The section sits between the architecture and the worked example: the options are described in terms of the layers, so they need the architecture first, and the worked example's classification is read as an instance of the default option.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p53 | comparison | Groups choose among four broad strategies for several verticals, and the share test mixes them per capability. | table: Table 5: A one horizontal platform with vertical categories; B shared core with vertical extension points; C separate vertical stacks; D a vertical platform reused by horizontal sections; each with strengths, weaknesses and when it is right. |  |\n| p54 | analysis (table) | Most groups end up with B for the platform and D for one or two vertical capabilities, while pure A and pure C are each right only under narrow conditions. | table: Table 5's caption. | `conclusion_summary`: Table 5. → Its result. |\n| p55 | recommendation | The author's judgement is option B as the default, D only for layer-3 capabilities (D being how a layer-3 capability reaches other brands' sections) and C kept available for any business the owners might sell, because layer-1 and layer-2 services can be designed to be separable. | case: Adevinta's 2023–2025 record: a shared platform that was a synergy in one ownership era became a separation cost in the next. | `cause_effect`: The comparison's result. → The author's labelled judgement. |\n| p56 | counterargument | Option B decays into A or C unless engine teams treat vertical owners as customers and say no to forks. |  | `contrast`: Option B as the default. → Its cost and how it fails. |\n\n### Veldmark Worked Example: Three Listings, Three Physics\n\n**Controlling idea** (`example`, id `worked-example`): Three Veldmark listings and the brands' 2026 figures confirm that the physics differ in numbers, and the workshop turns its profiles into a ratified classification with one stage gate.\n\n**Advances the thesis** (V1, V2, V4, V5): Fills in profiles with ledger numbers, applies the share test to Veldmark's capability list and sets the condition for Motorvane's move.\n\n**Transition in:** `example`: The four layers and option B with D for vertical capabilities as the default. → Their application to Veldmark's listings, sections and capability list, in three dated steps: profiles drafted in March, the classification ratified in April, the profiles checked against three listings from March to May.\n\n**Order of paragraphs** (`small_to_large`): From three listings to three brands' figures, to one brand's cars and jobs sections, to the whole capability list: each step widens the scope, and the classification needs the profiles the earlier steps filled in. The stage gate comes last because it is the condition attached to the ratified table. p43 states the workshop's timeline first, so the three listings (dated March to May) read as checks on profiles drafted in March; the workshop's answer, option B with D for two vertical capabilities, comes with Table 8, after the evidence, not before it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p43 | context | The workshop applies the profile and the share test in three steps: in March it drafts the profiles from the listing each brand brought and a first classification, in April the classification is ratified (Table 8), and from March to May Ingrid's team checks the profiles against the three listings, one per brand, that this book follows. | table: Table 6: the Rotterdam city bike, the Essen Volkswagen Golf and the Lyon apartment on the profile's main rows. |  |\n| p44 | analysis (table) | The profile's main rows get three different sets of answers: the bike's physics are speed and safety, the car's identity and feeds, the apartment's entity resolution and disclosure. | table: Table 6's caption. | `conclusion_summary`: The three listings in the table. → Their physics in one phrase each. |\n| p45 | analysis | Each listing's critical numbers are of a different kind (minutes for the bike, attributes and hours for the Golf, a ratio for the apartment), so no single listing model serves all three without explicit room for identity, external systems of record and vertical schemas. Tradeyard's 6-minute publication time is added to the table's numbers, because it is not a Table 6 row. | scenario: Bike: 6 minutes to searchable, 13 minutes to first contact, phishing 29 minutes after listing. Golf: 31 decoded attributes, a market-value estimate, a 26-hour-late delete. Apartment: 1.9 million listings for about 1.12 million properties, 1.7 listings per property.; figure: Figure 4: three panels, the bike with a stopwatch, the car with a spec sheet, one building with three listing cards. | `cause_effect`: The three physics. → Their critical numbers and what they imply for the listing model. |\n| p46 | transition | The group's 2026 figures add two profile numbers for platform design: implied listing lifetime and revenue per live listing. |  | `additional_support`: Evidence from three listings. → Evidence from three brands' totals. |\n| p47 | evidence (table) | Implied lifetime is live listings divided by weekly new listings, and revenue per live listing differs by a factor of eight between Tradeyard and Motorvane. | table: Table 7: Tradeyard 13.2M live, 2.3M new a week, about 5.7 weeks, €410M, about €31; Motorvane 1.45M, 210,000, about 6.9 weeks, €360M, about €248; Hearthly 2.6M, 240,000, about 10.8 weeks, €395M, about €152. | `elaboration`: The two numbers. → Their values per brand. |\n| p48 | analysis | Write load and value are inversely distributed across the brands, so pipelines and cost models must be read against each vertical's profile. The image counts are introduced as one more group figure; the earnings ratio points to Table 7's last column. | statistic: Tradeyard produces about 84% of the group's 2.75 million weekly new listings; Hearthly stores 1.8 billion images, but each Hearthly listing earns about five times a Tradeyard listing. | `cause_effect`: Lifetime and revenue per listing. → What follows for pipelines and cost models. |\n| p49 | example (list) | Profiles for Tradeyard Poland's cars and jobs sections show that a vertical section can consume another brand's layer-3 capability or need only layer-2 content, without a vertical stack of its own. | scenario: Cars section: about 410,000 live listings, about 40% from dealers; it matches Motorvane on identity, attributes and fraud, so it consumes Motorvane's vehicle identity and price rating through the shared ingestion engine while packages stay local. Jobs section: about 140,000 live job ads; it needs a jobs schema mapped to ESCO, an expiry policy and jobs trust rules, plus document support in the media service before CV upload. | `place`: The three brands' totals. → Tradeyard Poland, the brand where four verticals share one stack. |\n| p50 | context | The workshop drafts a first shared-versus-specific table for the Common Ground capability list in March, which the architecture advice forum ratifies in April 2027; its answer is option B with D for two vertical capabilities, and the Lyon apartment, listed in May, tests it. | table: Table 8: thirteen capability parts with layer, owner and reason, from login (layer 1, Veldmark ID) to packages and pro front ends (layer 4, each brand). | `sequence`: Per-section decisions for Tradeyard Poland. → The decision for the whole capability list. |\n| p51 | analysis (table) | The classification gives two vertical capabilities group owners and three engines vertical content owners, and leaves Keybridge outside as a separate SaaS business. | table: Table 8's caption. | `conclusion_summary`: Table 8. → Its result in one sentence. |\n| p52 | claim | Felix's condition becomes a stage gate: a vertical moves onto a shared engine when the engine meets the vertical's profile, measured by its own metrics, not when the program plan says so. | scenario: Motorvane moves onto the shared ingestion engine only when the engine meets the feed success rate and delete latency Motorvane reports today. | `contrast`: The ratified table. → The one condition attached to it. |\n\n### Failure Modes\n\n**Controlling idea** (`cause_effect`, id `failure-modes`): Shared multi-vertical platforms fail when requirements come from one profile, when every vertical claims to be unique, when content leaks into engines, when one store holds many meanings, when the external system of record is ignored, and when regulatory fields are treated as optional.\n\n**Advances the thesis** (V3, V5): Shows what happens when the profile is not written, not consulted or not used to gate a move.\n\n**Transition in:** `elaboration`: Felix's stage gate, the defense against the Forced Fit (a group platform built around one vertical's physics and imposed on the others), and option B's decay when engine teams do not say no to forks. → Six recurring ways option B decays, starting with the Forced Fit's origin: profiling only the largest vertical.\n\n**Order of paragraphs** (`grouping`): Two opposite failures of profiling come first (one loud profile, every vertical exceptional), then two failures of layer-2 content (leaking into the engine, one store for many meanings), then two failures of ignoring a profile row (system of record, regulation).\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p60 | cause_effect | Building the first shared engine from the profile of the largest vertical makes every other vertical an exception. | scenario: At Veldmark that would be Tradeyard, with 84% of insertion volume, encoding form-based insertion, the marketplace as system of record and weak identity. |  |\n| p61 | cause_effect | The opposite failure, vertical exceptionalism, puts every capability in layer 3 or 4 and makes the group pay for everything several times. |  | `contrast`: One vertical's profile imposed on all. → Every vertical declaring itself unique. |\n| p62 | cause_effect | Content leaking into a shared engine makes every regulatory change an engine release, failing the layer-2 test, which is how the Category Straitjacket forms inside a well-intentioned platform. | example: A hard-coded 'energy class' field added for French real estate, then different rules from Spain and Germany. | `sequence`: Two failures of profiling. → The first failure of layer-2 content. |\n| p63 | cause_effect | A shared attribute store without vertical dictionaries ends with one key meaning different things in different verticals, so facets, feeds and models disagree. | statistic: 'Condition' as a goods grade, a vehicle damage category and a renovation state; Tradeyard's 3,900 attribute keys, 41% used on fewer than 0.1% of listings. | `similarity`: Content leaking into the engine. → Content mixing inside one store. |\n| p64 | cause_effect | A horizontal pipeline that ignores the external system of record keeps sold items live until the source's delete arrives. | scenario: The Essen Golf's 26-hour gap between sale and feed delete. | `sequence`: Failures of layer-2 content. → Failures of ignoring a profile row, starting with the system of record. |\n| p65 | cause_effect | Treating a mandatory regulatory field as a feature gap lets compliance defects pass as data-quality warnings. | source: In France a property ad without a DPE class is unlawful, with fines up to €3,000 for an individual and €15,000 for a legal entity. | `similarity`: Ignoring the system-of-record row. → Ignoring the regulatory row. |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `chief-architect`): At group scale the vertical question is a standing governance question: the Chief Architect decides profiles, layers, layer-3 owners and seams, assigns who decides, and watches fit, exceptions, drift and separability.\n\n**Advances the thesis** (V2, V4, V5): Turns the profile, the layers and the stage gate into decisions, roles and signals a group can govern.\n\n**Transition in:** `problem_solution`: Six ways a shared platform fails its verticals. → The governance that prevents them.\n\n**Order of paragraphs** (`prerequisite_order`): What to decide, then who decides it, then what to watch once it is decided, then the long-term reason the governance must persist.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p66 | claim | At group scale the vertical question is a standing governance question, and the Chief Architect's job is to make it cheap to ask and hard to dodge. |  |  |\n| p67 | recommendation (list) | Four things must be decided and written down: a profile per vertical, the layer of every capability part, the owners of layer-3 capabilities and the list of extension points. | example: Profiles for Tradeyard's goods, Tradeyard Poland's cars and jobs, Motorvane, Hearthly France and Hearthly Spain; Tool 2 in the toolkit as the template; Table 8 as the format for layers. | `elaboration`: A standing governance question. → What it requires the Chief Architect to decide. |\n| p68 | recommendation | The vertical owner decides content, the engine owner the mechanism, the advice forum the layer when they disagree, and the group CTO when funding changes. |  | `sequence`: What to decide. → Who decides it. |\n| p69 | recommendation (list) | Four signals show whether the decisions hold: fit metrics per vertical on shared engines, exception counts, profile drift and separability. | example: Feed success rate and delete latency for Motorvane; duplicate rate for Hearthly; publication time for Tradeyard; a transactional pivot, a move to pay-per-lead or an acquisition triggers a profile review. | `sequence`: Who decides. → What to watch afterwards. |\n| p70 | claim | Vertical boundaries move over time, and layers that match the physics survive reorganizations that layers matching the org chart do not. |  | `time`: What to watch now. → What changes in the long term. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Ten review questions let a reader test their own group's profiles, layers, owners, reconciliation, regulation and separability.\n\n**Advances the thesis** (V1, V2, V3, V4, V5): Turns each supporting claim into a question a design review can ask.\n\n**Transition in:** `conclusion_summary`: The Chief Architect's decisions and signals. → The questions a reader takes into a review.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p71 | recommendation (list) | Ten questions turn the chapter's tests into a design review: written profiles, whose requirements a shared capability came from, identity, system of record, content changes without engine releases, layer-3 owners, fit metrics, regulatory fields, separability and the next business-model change. |  |  |\n\n## Conclusion: From Physics to Models\n\n**Synthesis:** The chapter's answer to its opening question (no for one listing model, yes for the machinery beneath) is where Part I's reasoning ends: Part I's earlier chapters (the marketplace model, liquidity, history, capabilities and contexts) say what every later design must respect and treat the verticals alike, and the vertical profiles mark where the verticals stop being alike, so the part ends in one share test that divides each capability part into shared platform, shared engine with vertical content, vertical capability with one owner and brand product.\n\n**So what:** Veldmark's architecture advice forum ratifies a shared-versus-specific table in April 2027 instead of arguing whether each brand needs its own copy of every capability, and Motorvane moves onto the shared ingestion engine only when the engine meets its own feed success rate and delete latency.\n\n**Callback:** The opening question whether one listing platform with a category tree per vertical can carry a used sofa, a family car, an apartment and a job, and Part I's opening claim that the business model decides the architecture. The reader can now answer the question per capability part with a profile and a layer, and sees the part's claim turned into a procedure a group can review.\n\n**Takeaway** (`course_of_action`): Before proposing a shared platform, write a numbered requirement profile for each vertical and place every capability part in one of the four layers with an owner and a reason; Part II then designs the listing inside those boundaries.\n\n**Hand-off** to [Part II — LISTING: Modeling the Thing Being Sold](part-2.html): `sequence`: Part I's bounded contexts, which decided that one context owns the listing's truth, and this chapter's vertical requirement profiles, which showed items with identities and systems of record outside the listing. → The supply-side core those contexts depend on: the listing aggregate and the governed reference data around it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p72 | synthesis | The answer to the opening question, no for one listing model and yes for the machinery beneath it, completes Part I's line of reasoning, which ends in one share test. | reasoning: The marketplace model, liquidity, history, capabilities, contexts and vertical physics together say what every later design must respect before it chooses a technology. |  |\n| p73 | recommendation | The share test turns Part I's claim that the business decides the architecture into a procedure: a ratified table with owners and reasons, and moves onto shared engines gated by each vertical's own metrics. | scenario: The advice forum ratifies Table 8 in April 2027; Motorvane moves only when the shared ingestion engine meets its feed success rate and delete latency. | `cause_effect`: The share test as the end of Part I's reasoning. → What it changes for a group, and what the reader should do. |\n| p74 | transition | Part II takes the next step in sequence: after Part I decided that one context owns the listing's truth and found items whose identities and systems of record sit outside the listing, it designs the supply-side core those contexts depend on, the listing aggregate and its governed reference data. |  | `sequence`: Part I's boundaries and the vertical findings. → Part II's listing model, designed inside them. |\n\n## Non-goals\n\n- Business definitions of horizontal, vertical, classifieds and lead generation. See [Classifieds, Leads, Transactions and Managed Models: A Marketplace Taxonomy](marketplace-taxonomy.html).\n- The capability map itself, and bounded contexts. See [Map What the Marketplace Does Before What Runs It](business-capabilities.html), [Bounded Contexts for Marketplaces: Where One Listing Becomes Many Models](bounded-contexts.html).\n- Detailed designs of the listing aggregate, taxonomies, attribute schemas, ingestion, entity resolution and publication. See [The Listing Aggregate: Identity, Lifecycle and Invariants](listing-aggregate.html), [Category Trees That Can Change: Designing Marketplace Taxonomies](categories-and-taxonomies.html), [Attributes Without Chaos: Schemas, Dictionaries and Validation](attribute-schemas.html), [Many Doors In: Forms, APIs and Bulk Feeds](listing-ingestion.html), [One Property, Three Listings: Duplicates and Entity Resolution](entity-resolution.html), [From Submitted to Searchable: The Publication Pipeline](publication-pipeline.html).\n- Multi-country tenancy and consolidation strategy. See [One Platform, Many Marketplaces: Multi-Country and Multi-Brand Architecture](multi-country-platforms.html), [After the Deal: Consolidating Platforms After Acquisitions](platform-consolidation.html).\n- Monetization models and payments. See [How Listing Marketplaces Make Money](monetization-models.html), [Beyond the Contact: Payments, Shipping and Buyer Protection](transactions-and-payments.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Whether Motorvane's vehicle capability can be offered to Tradeyard Poland under the vehicle-data providers' licence terms is an open Veldmark question for normalization-and-enrichment. (Carried over from spec.md.)\n\n## Decision log\n\n- **2026-10-19** — Organized the chapter around fourteen profile dimensions rather than per-vertical sections, because the decision method needs comparable rows; per-vertical evidence follows as 'In Practice' subsections. Rejected: Per-vertical sections.\n- **2026-10-19** — Chose a four-layer share test over a binary shared/specific split; the binary version cannot express 'shared engine, vertical content' or 'vertical capability, group-owned', which is where most real disagreements sit. Rejected: A binary shared/specific split.\n- **2026-10-19** — Set the scene in a mid-March 2027 scoping workshop; the Golf and Lyon listings occur later in 2027, so the worked example is framed as checking the profiles against them over the spring.\n- **2026-10-19** — Added local illustrative numbers for Tradeyard Poland's cars (410,000 live) and jobs (140,000 live) sections and recorded them, with the layer-3 ownership decision, in the scenario ledger.\n- **2026-11-12** — Converted spec.md to spec.json. Success criteria: 'name the fourteen dimensions and say what each stresses' is kept as intent.outcome.know and tested through AC-1 and AC-3; the comparison-table, dated-evidence, diagram, worked-example-numbers, trade-off-table, sourcing and governance-and-questions criteria were inventories of contents and are dropped (the style guide still governs format and sourcing); the journal spec's AC-1 to AC-3 replace them. No acceptance criteria were added. Rejected: Carrying the success criteria over as written (inventories).\n- **2026-11-12** — Supporting claims V1 to V5 written here (the journal spec gives none for this post) from the thesis's parts: physics and the profile, the four layers, the shareable machinery, layer-3 ownership, the stage gate. For the author to confirm.\n- **2026-11-12** — Table captions ('**Table N:**') are separate units in the draft; each is specified as its own paragraph with form 'table' whose controlling idea is what the table shows. Table 2's caption was reworded so that it no longer states the same point as p16. Rejected: Merging captions into the paragraph before them, which would change the house caption format.\n- **2026-11-12** — Added a roadmap paragraph (p04) to the introduction so that a reader of the opening can predict the sections (AC-2), and moved the sentence on what Part II takes from the chapter into it. Rejected: Relying on the IN THIS CHAPTER callout, which names only ecides as its own section; Figure 3's eight seams not named in the text; Keybridge note in the Table 8 caption.\n- **2026-11-12** — Supporting claims V1 to V5, written by the agent, accepted under the author's delegation, 2026-11-12.\n- **2026-11-12** — Modalities empty: spec.md listed four unchecked modalities and none exists; accepted under the author's delegation, 2026-11-12.\n- **2026-11-12** — Length limit raised from 8,585 to 8,800 words (+2.5%) for the trade-offs move's new transitions and the minor fixes.\n- **2026-11-12** — Orchestrator: dropped 'later' from 'three later listings' (p43, prose and spec): the ledger dates the bike listing 7 March 2027, before the mid-March workshop.\n- **2026-11-13** — Failure Modes opening (section transition_in): the bridge now names Felix's gate as the defense against the Forced Fit and the Forced Fit as the first of six decays, replacing the ambiguous 'this'; fixed under the author's delegation (fix-only pass).\n- **2026-11-13** — Worked example order (spec fault): p43 now states the three dated steps (March profiles and draft classification, April ratification, March-to-May listing checks) and no longer gives the answer first; the answer, option B with D, moved to p50 with Table 8; section transition_in and flow rationale updated; fixed under the author's delegation (fix-only pass).\n- **2026-11-13** — In Practice repetition (spec fault): p22a and the section transition_in now announce that returning sources are read for new facts, and the mobile.de, Rightmove and Vinted items mark their return; no source or fact cut; fixed under the author's delegation (fix-only pass).\n- **2026-11-13** — p21: the Productscape real-estate domain model is named where it is quoted; fixed under the author's delegation (fix-only pass).\n- **2026-11-13** — Who Decides: new unit p58a reads each Table 3 example in one clause (no new claims; wording from the table's readiness column), the NAR cell reworded; p59 transition updated; fixed under the author's delegation (fix-only pass).\n- **2026-11-13** — p48: the image counts introduced as one more group figure, Table 7 cited only for the earnings ratio; fixed under the author's delegation (fix-only pass).\n- **2026-11-13** — p72/p73: the synthesis sentence names Part I's earlier chapters and replaces 'their sameness'; 'four of everything' replaced by a plain phrase (minor); fixed under the author's delegation (fix-only pass).\n- **2026-11-13** — Minor fixes also applied: p45 publication time introduced as an added number; p55 D's narrowing to single capabilities stated; fixed under the author's delegation (fix-only pass).\n- **2026-11-13** — Length limit raised from 8,800 to 9,000 words (+2.3%) for the glosses, pointers and the new p58a in this pass (draft now 8,852); fixed under the author's delegation (fix-only pass).\n\n## Sources\n\n- **Internal**\n  - _journals/listing-systems-architecture/journal-spec.json — Intent outcome, acceptance criteria, thesis, role, Part I's closing and the hand-off to part-2.\n  - posts/06-vertical-requirements/spec.md (accepted 2026-10-21) — Non-goals, open questions, decision log, sources and changelog.\n  - meet-veldmark; _research/scenario-ledger.md — Brands, volumes, the three running listings, Common Ground, the vertical-requirements ledger line (profiles, layers, owners, stage gate, Tradeyard Poland sections).\n  - business-capabilities; bounded-contexts — The shared capability skeleton and the context map the chapter tests.\n  - monetization-models — Motorvane and Keybridge revenue figures.\n- **External**\n  - Research briefs on automotive and other verticals, real-estate portals, listing data and ingestion, monetization, Adevinta and OLX (October 2026) — The verified public evidence.\n  - mobile.de Seller API; Autotrader FY2026 results and developer portal; CarGurus 10-K FY2025; NHTSA vPIC; Pkw-EnVKV — Automotive identity, supply, valuation and regulation.\n  - Rightmove RTDF v1.4.1; Service-Public DPE page; RESO Web API; OpenImmo; OS Open UPRN; Zillow 10-K FY2025; AVIV interviews (2021, 2025) — Real-estate identity, reconciliation, regulation and multi-country sharing.\n  - ESCO; O*NET; Google JobPosting documentation; OLX job-role extraction (2024); Adevinta InfoJobs post (2025); Indeed pricing — Jobs identity, documents, expiry and pricing.\n  - Vinted 2025 results and engineering posts (2024, 2026); Adevinta AR 2023 and Strategic Report 2025; eBay PBSE playbook — Recommerce, group-level sharing and its reversal.\n\n## Changelog\n\n- **2026-11-13** — Fix-only pass on the round-5 blocking findings under the author's delegation: Failure Modes bridge, worked-example timeline and answer moved to Table 8, returning sources marked in In Practice, Productscape named, Table 3 read (new p58a), image-count figure introduced, conclusion synthesis clarified; four minor points. No check round. (AI-mediated session)\n- **2026-11-12** — Resolved the round-3 escalation under the author's delegation: trade-offs moved after the architecture, transitions, roadmap and flow rationale rewritten, tables renumbered, minor reader points fixed, open questions moved to the decision log, max_words 8,800. (AI-mediated session)\n- **2026-11-12** — Draft check round 3 (ESCALATE, budget spent): cheap fixes applied without another round (table renumbering, figure sources, Productscape name, first failure label, listing timeline); table numbers in this spec renumbered to match. Remaining findings in open_questions. (AI-mediated session)\n- **2026-11-12** — Draft check round 2 (ESCALATE, spec fault): who-decides moved after in-practice; p22a added; transitions into who-decides, architecture and failure-modes rewritten; p50, p51, p03 controlling ideas adjusted; roadmap promises updated. Prose: section moved; In Practice lead paragraph; failure-modes opener folded into the first failure; Keybridge clause, DSA and MLS expansions; Table 7 caption 'three engines'; Lyon date clause; image counts and the 6-minute             function inline(s) {

                // Bold/italic, including nested combinations: ***x***,

                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
