<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (paragraph for paragraph, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, acceptance criteria AC-1 to AC-3, thesis and role are copied unchanged from the platform-consolidation entry in journal-spec.json; the hand-off uses organizing-marketplace-engineering's transition_in. Units added by this conversion: roadmap p04, one lead-in each for Trade-offs (p39) and Vertical Differences (p41), and a synthesis paragraph p52 before the published hand-off.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The integration options for an acquired business (hold separate, federate under group controls, share services beneath it, replatform onto a sibling, merge brands, divest) and the regulatory, contractual and ownership conditions that rule each out.\n- **Know:** The consolidation sequence: day-one controls; invisible and contractual capabilities, with payments as a contract; trust and identity; shared engines; the product platform last and optional, each with a measured gate.\n- **Know:** The synergy case as a ledger with dis-synergies, double running and separation cost, and brand migration as a separate workstream (site moves, accounts, partner endpoints, business-user notice).\n- **Believe:** An acquisition should be consolidated from the invisible to the visible, because the product carries the liquidity the deal paid for.\n- **Believe:** A synergy case is a hypothesis to be tracked against dated evidence, and a revenue line that depends on data needs a named permission.\n- **Be able to:** Write an integration decision record for an acquired marketplace.\n- **Be able to:** Challenge a deal model's technology and data-dependent revenue lines before the price is agreed.\n- **Be able to:** Plan a rebrand that does not compound with a platform migration.\n\n**Audience:** Chief and enterprise architects, CTOs and integration leads of marketplace groups that buy and sometimes sell marketplaces, and the finance and corporate-development partners who write synergy cases with them.\n\n**Already knows:**\n\n- APIs, databases, event streams, search engines and Kubernetes; what an acquisition and a deal model are in general.\n- From earlier chapters: Veldmark (fictional) and its brands Tradeyard, Motorvane, Hearthly and Keybridge, Common Ground, Veldmark ID, Ingrid Halvorsen, Henrik de Boer, Lucía Ortega and the architecture advice forum; liquidity and its metrics (liquidity-and-network-effects); the Barcelona fake-rental ring (fraud-prevention, identity-and-verification); the Keybridge neutrality commitment of March 2027; the marketplace profile register (marketplace-taxonomy); the redirect registry (web-and-seo-architecture); the failure patterns Deal-Shaped Architecture, The Forced Fit and Ghost Inventory.\n- From Part VII: the tenancy model and tenant-separable shared capabilities of multi-country-platforms; from the Part VIII introduction, that the part asks in what order the earlier decisions are carried out.\n\n**Does not yet know:**\n\n- The terms this chapter owns: consolidation sequence, synergy case, brand migration; and the integration options by name.\n- Deal vocabulary: run-rate synergies, dis-synergies, separation cost, carve-out and transitional services, merger-control remedies.\n- Brand-migration mechanics: site-move redirects and the Change of Address tool, app store identity and design tokens, sender-domain ramp-up, the P2B notice period.\n- The Casavista integration figures, the consolidation review of 9 November 2027 and the synergy ledger.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given an integration plan that moves the product first, the reader names what is out of order and the sequence and gates that replace it. *Probe:* A group buys a national property portal. The integration plan rebrands it onto the group brand in month four, moves listings and search onto a sibling marketplace's platform in month ten, and leaves login, the moderation tool and agency billing for year three. The synergy case lists only savings, including revenue from using the acquired CRM's customer data to sell the group's packages. Using only this chapter: what is wrong, and what do you propose? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** When a group acquires marketplaces, what should it consolidate, when, and how?\n\n> **Claim:** A group should choose an integration option for each acquired marketplace in a decision record within the first month after signing, letting merger remedies, commitments to customers and the expected holding period rule options out before technical fit; consolidate from the invisible to the visible (day-one controls, then infrastructure, data, advertising and payment contracts, then trust and identity, then shared engines), leaving the core listing and search product last and only with its own investment case; gate each stage on the acquired marketplace's liquidity metrics rather than on dates; run the synergy case as a ledger that counts traffic loss, double running and separation cost and names the permission behind every revenue line that uses data; and keep any brand migration a separate workstream that does not overlap a platform migration.\n\n**Disputed by:** The common deal-team plan: replatform the acquired marketplace onto the acquirer's or a sibling's product stack and rebrand it on the deal's timetable, moving search, listings and the brand first because that makes the acquisition visible, and tracking synergies as a spreadsheet of savings; or the opposite habit of leaving every acquired stack untouched indefinitely.\n\n**So what:** A Chief Architect who accepts this reviews every technology synergy and every data-dependent revenue synergy before the price is agreed, owns the consolidation sequence while the deal team owns the targets, reviews the synergy ledger quarterly with finance, pauses any stage whose liquidity gate fails, migrates to the group target rather than to a sibling due for replacement, and designs every integration so that it can be undone if the business is later sold.\n\n**How and why:** Veldmark replatformed Casavista product-first: the rebrand on 9 March 2026 cost 19% of organic sessions in six weeks, and listings and search moved in September 2026 before traffic had recovered, so the cause of each dip could not be separated. Login, the moderation review tool and agency billing stayed on Casavista's code at about €2.6 million a year, and in July 2027 the Barcelona ring's 26 accounts had proved no more than an e-mail address. By October 2027 the deal had delivered €9.6 million of €18 million in synergies, at €11 million of one-off cost against €6 million planned. Keybridge's €7 million cross-selling line was forbidden by the March 2027 neutrality commitment. The recommended order reverses Casavista's because the invisible layers move without users noticing, trust and identity gain value as signals are pooled and are where fraud concentrates when left behind, and the product carries the liquidity the deal paid for, so it moves last and only after the gates show the lower stages held.\n\n**Supporting claims**\n\n- **S1** — An acquirer chooses an integration option for each acquired business (hold separate, federate under group controls, share services beneath, replatform onto a sibling, merge brands, divest) in a recorded decision, and merger remedies, commitments to customers and the expected holding period rule options out before technical fit is considered.\n- **S2** — Capabilities move onto group platforms from the invisible to the visible and from pooled value to mere cost: day-one controls, then infrastructure, data, advertising and payment contracts, then trust and identity, then shared engines, with the core listing and search product last, optional and on its own investment case, and always to the group target rather than to a sibling due for replacement.\n- **S3** — Each stage is gated on the acquired marketplace's own liquidity metrics, not on the plan's dates, and a second traffic-affecting change waits until organic sessions have recovered.\n- **S4** — A synergy case is a hypothesis run as a ledger that counts dis-synergies, double running and separation cost beside the savings, tracks each line against dated evidence, and names the permission behind every revenue line that uses data.\n- **S5** — A brand migration is an architectural workstream (domains and redirects, accounts, apps, e-mail, partner endpoints, legal notice) that is kept apart from any platform migration so that one traffic risk lands at a time.\n\n## Role in the part\n\nSets the order and the gates in which an acquired marketplace's capabilities move onto group platforms, and the synergy ledger that keeps the deal honest. Supports P8-1 of part `part-8`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in concepts before architecture and practice, which use their terms; `grouping` in trade-offs, verticals, failure-modes, ca-view, questions: the book's standard judging sections)\n\nThe scene states the problem (synergies behind, costs over, a forbidden line, a fraud gap) before any solution. The concepts give the terms the answer needs, including the synergy case the ledger later tracks; the architecture gives the general answer, with gates as measured conditions; the review applies it to the scene's problem, which only works once the options, the sequence, its gates and the synergy case have been defined. Placed before the architecture, the review's 'inverted sequence' would have nothing to be inverted against. The judging sections weigh the whole design and come last.\n\n## Introduction\n\n**Hook** (`direct_statement`): A marketplace acquisition is usually justified in two sentences: the target is a market leader, and owning it alongside the group's other marketplaces will save money and grow revenue.\n\n**Bridge:** The deal rationale every reader has seen: a market leader bought for savings and growth. → The first sentence is about liquidity the acquirer must not damage, the second about platforms it must change, and the record of classifieds groups shows how often that goes wrong.\n\n**Thesis statement** (KEY POINTS callout (three bullets), with p01 stating the liquidity-against-platform tension.): Choose an integration option per business, with regulation, commitments and a likely sale ruling options out; consolidate from the bottom up, invisible and pooled first and the product last, gated on liquidity metrics; run the synergy case as a ledger with dis-synergies and separation cost; decouple brand migrations from platform migrations.\n\n**Roadmap** (Paragraph p04, with the IN THIS CHAPTER callout.):\n\n- Start from Veldmark's question about the Casavista and Keybridge synergies. *Kept in:* scene.\n- Define the integration options and the three terms. *Kept in:* concepts.\n- Set out the consolidation sequence with its gates and the brand migration as a separate workstream. *Kept in:* architecture.\n- Follow Veldmark's consolidation review, its synergy ledger and one overlap between Veldmark's own brands. *Kept in:* practice.\n- Close with trade-offs, vertical differences, failure modes, the Chief Architect's view and questions to ask. *Kept in:* trade-offs, verticals, failure-modes, ca-view, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | claim | A marketplace acquisition is justified by two sentences, one about liquidity the acquirer must not damage and one about platforms it must change, so consolidation is the work of changing the platform without damaging the liquidity while both compete for the same months, teams and risk budget. |  |  |\n| p02 | evidence | Because classifieds groups were assembled almost entirely by acquisition, their public record on consolidation is rich, and it shows more reversals than finished integrations. | case: eBay bought national leaders and kept their brands; Axel Springer combined property portals into AVIV; Naspers rebranded acquired sites as OLX; Adevinta bought eBay Classifieds Group, integrated part of it and, under new owners, decentralized and sold businesses. | `additional_support`: Consolidation as changing the platform without damaging the liquidity. → The industry's public record of acquisitions and reversals. |\n| p03 | context | This chapter opens Part VIII by asking how an acquired marketplace joins the shared platform of Part VII, owns the terms consolidation sequence, synergy case and brand migration, and hands ownership, migration techniques and Adevinta's full record to later chapters. |  | `sequence`: The public record of acquisitions. → Where the chapter sits in Part VIII, the three terms it owns and what later chapters take from it. |\n| p04 | transition | The chapter follows Veldmark's question about its Casavista and Keybridge acquisitions through the concepts, the consolidation sequence with its gates and the brand-migration workstream, Veldmark's consolidation review, synergy ledger and one overlap between its own brands, and the closing trade-offs, vertical differences, failure modes, Chief Architect's view and questions to ask. |  | `sequence`: The terms the chapter owns. → The order of the sections. |\n\n## Sections\n\n### Setting the Scene at Veldmark: Where Are the Casavista Synergies?\n\n**Controlling idea** (`example`, id `scene`): By October 2027 Veldmark's two real-estate acquisitions had delivered about half their promised synergies at nearly twice the planned cost, one synergy line had become forbidden, and the unconsolidated Spanish login had let a fraud ring in.\n\n**Advances the thesis** (S2, S3, S4): Gives the case whose inverted sequence and spreadsheet of savings the chapter's claims correct.\n\n**Transition in:** `example`: The tension between liquidity and platforms and the chapter's terms. → Veldmark's synergy question as the running case.\n\n**Order of paragraphs** (`chronological`): The owner's question comes first, then the evidence behind it in the order the reader needs it (Casavista's numbers, Keybridge's forbidden line, the July fraud), then the review that answers it; the review's three arguments make sense only once all three problems are on the table.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | context | On 14 October 2027 Henrik de Boer forwarded Ingrid Halvorsen the private-equity owner's question of where the synergies paid for in Veldmark's two real-estate acquisitions were. | scenario: Thu 14 Oct 2027; the owner's operating partner, ahead of the 2028 budget; two businesses bought into the real-estate portfolio in two years. |  |\n| p06 | evidence | Casavista, bought in 2025 and rebranded Hearthly.es in 2026, had delivered €9.6 million of €18 million in promised run-rate synergies at €11 million of one-off cost against €6 million planned, while its login, review tool and agency billing still ran on Casavista's code at about €2.6 million a year. | scenario: Deal case €18M by end 2027 (€8M platform and hosting, €4M overheads, €6M revenue); Oct 2027 tracker €9.6M (tech €3.9M, overheads €3.6M, revenue €2.1M); one-off cost €11M vs €6M; listings and search on Hearthly's Google Cloud platform since 2026; login, review tool and agency billing on Casavista code and hosting at ~€2.6M a year. | `elaboration`: The two businesses behind the owner's question. → The first business, Casavista, and its numbers. |\n| p07 | evidence | Keybridge's €7 million cross-selling line, which depended on using its 9,800 agency customers' data to sell them Hearthly packages, had been forbidden by the March 2027 neutrality commitment. | scenario: Keybridge bought 2024; €7M/yr revenue synergy from agency insight; March 2027 commitment that no Keybridge agency data be used by Hearthly for ranking or sales targeting. | `additional_support`: Casavista's shortfall. → The second business, Keybridge, and its line. |\n| p08 | evidence | In July 2027 the Barcelona fake-rental ring exploited the still-unconsolidated Spanish login, showing that the parts of the acquisition left unconsolidated were the ones that mattered most for trust. | scenario: 26 accounts, 180 fake listings, 63 people reporting losses of about €71,000; none of the 26 accounts had proved more than an e-mail address because the Spanish login was still Casavista's. | `additional_support`: Two financial problems. → A third problem, a trust failure, in July. |\n| p09 | claim | Ingrid's consolidation review of 9 November 2027, the thread of the chapter, argued that the synergy case had been sequenced in the wrong order, had counted only savings and contained one line that should never have been written. | scenario: Consolidation review presented to the board Tue 9 Nov 2027. | `problem_solution`: The three problems: shortfall, forbidden line, fraud. → The review's three arguments that answer them. |\n\n### Concepts: Options, Sequences, Synergies and Brands\n\n**Controlling idea** (`definition`, id `concepts`): Four concepts frame consolidation: the integration option chosen per business, the consolidation sequence ordered from invisible to visible, the synergy case with its usually missing parts, and the brand migration as an architectural event.\n\n**Advances the thesis** (S1, S2, S4, S5): Defines the terms each later section argues with, with dated public cases for each.\n\n**Transition in:** `sequence`: The review's three arguments. → The concepts those arguments use.\n\n**Order of paragraphs** (`prerequisite_order`): The option comes first because it decides whether any sequence is needed; the sequence before the synergy case because synergies depend on stages; the brand migration last because it is the one move the sequence keeps separate. Each definition is followed by the public case that shows it, so no example arrives before its term.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | definition | An acquirer has five integration options plus the option to sell, and they differ in what is shared and in how reversible the result is. | table: Hold separate, federate under group controls, share services beneath, replatform onto a sibling, merge brands, divest; each with what changes, what stays, reversibility and a documented example (eBay/Marktplaats 2004, Adevinta 2019–2023, iBazar to Vivanuncios 2015, OLX rebrands 2014, CMA remedies 2021). |  |\n| p11 | claim | Options are chosen per business and may be combined over time, but an acquisition without a recorded option drifts into Deal-Shaped Architecture by inertia. |  | `elaboration`: The five options. → How they are chosen and what happens when none is. |\n| p12 | evidence | Commercial integration can run years ahead of technical integration, as two documented property-portal cases show. | case: Immowelt and Immonet combined in 2015, renamed AVIV Germany in 2024 and still running both brands; AVIV's Ultimmo (2022), one professional offer across SeLoger, Logic-Immo and Meilleurs Agents. | `elaboration`: Options combined over time. → Commercial integration ahead of technical integration. |\n| p13 | definition | A consolidation sequence is the ordered set of gated stages through which an acquired marketplace's capabilities move onto group platforms, answering which capability moves next, what must be true first and what would stop it. |  | `sequence`: The integration option. → The second term, the consolidation sequence. |\n| p14 | explanation | Two rules set the order, moving what users cannot see before what they can and what gains value from pooling before what only saves cost, and the core listing and search experience fails both, so it comes last and often never. | figure: Figure 1: a building renovated from the foundation up beneath an unchanged storefront. | `elaboration`: What a consolidation sequence is. → The two rules that order it. |\n| p15 | definition | A synergy case is the quantified hypothesis that combining a business with the group raises profit, and of its four parts (cost, revenue, dis-synergies, separation cost) deal models usually show only two. | table: Four parts with typical lines and whether they usually appear in the deal model.; figure: Figure 2: a scale weighing savings against traffic loss, churn, double running and separation cost. | `sequence`: The order in which capabilities move. → The third term, the synergy case that funds the moves. |\n| p16 | evidence | Adevinta's eCG deal shows the parts a deal model leaves out arriving later: integration expenses and a forced rebrand during integration, and separation cost after the take-private. | statistic: €130–165M run-rate cost-synergy target (Adevinta, 2021); €69M eCG integration expenses in 2023 plus €15M for the eBay Kleinanzeigen rebrand (Annual Report 2023); 'parallel running of central and local services during a transitional period' (Strategic Report 2025). | `example`: The four parts of a synergy case. → A public deal in which the missing parts arrived. |\n| p17 | definition | A brand migration moves users, sellers, partners and search-engine presence from one consumer brand to another, and it is an architectural event because the brand is embedded in domains, URLs, app identities, sender reputations, partner endpoints, legal entities and contracts. |  | `sequence`: The synergy case, which a rebrand can cost. → The fourth term, the brand migration. |\n| p18 | example | The best-documented brand migration, Kleinanzeigen's, was forced by contract and was carried out two years apart from its platform migration. | case: eBay brand not usable beyond 2024; rebrand cost €15M in 2023; Kleinanzeigen from 16 May 2023 with the old domain kept accessible for several more years; a 2025 engineering post on migrating the whole platform with parallel running and per-user switching behind a reverse proxy. | `example`: What a brand migration is. → The industry's best-documented case. |\n\n### Architecture: The Consolidation Sequence\n\n**Controlling idea** (`process`, id `architecture`): The architecture of consolidation is a choice of option by four questions, a staged sequence whose gates are measured conditions resting on estate hygiene, and a brand migration run as its own workstream.\n\n**Advances the thesis** (S1, S2, S3, S5): Turns the concepts into the decision, the stages, the gates and the workstreams.\n\n**Transition in:** `sequence`: The four concepts. → The architecture that applies them, starting with the first decision after signing.\n\n**Order of paragraphs** (`prerequisite_order`): The steps follow what each needs first: the option decides whether any sequence runs; hygiene is the precondition every stage needs, so it comes before the stages it gates; the stages and their placements follow; the brand migration comes last because the sequence keeps it apart. Putting the brand workstream before the stages would invite the reader to treat it as one of them, and putting hygiene after the stages (as first published) made a precondition arrive after what it conditions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p19 | process | The integration option is the first architectural decision after signing, made with four questions. | figure: Figure 3: choosing an integration option; regulation, commitments and expected holding period remove options before technology is considered. |  |\n| p20 | explanation | The questions are ordered by how absolute they are: a remedy or a commitment to customers rules integration out whatever its savings, a likely sale rules out deep sharing, and only then do the two questions of fit arise (same vertical and market as a group brand; an investment case for product convergence). | example: Keybridge's neutrality commitment as a commitment that rules out integration. | `elaboration`: Figure 3's four questions. → Why they come in that order. |\n| p24 | evidence | The later stages depend on a prerequisite acquisitions rarely satisfy, an estate described well enough to move, and OLX's 2026 account of OLX Motors is a public checklist of that hygiene. | statistic: User identification standardized across 71 services, 'with 73% now using modern UUIDs'; 45 components moved to a central secrets manager; backup compliance for tier-1 and tier-2 databases; one deployment-notification service across more than 60 services. | `sequence`: The chosen integration option. → The hygiene every stage of the sequence needs first. |\n| p25 | recommendation | Speaking as a Chief Architect, before trust and identity move (stage 2 of the sequence below) the author requires one identifier per user and seller, an inventory of every copy of listing and user data, events mapped to the group's listing event contract and a list of partner integrations with owners. |  | `cause_effect`: Hygiene as a precondition. → The minimum the author would require. |\n| p21 | process | The reference sequence moves capabilities in stages from day-one controls to an optional product platform, each more visible than the last, and its gates, each a measured condition that includes the acquired marketplace's liquidity against its baseline rather than a date, matter more than its stage boundaries. | figure: Figure 4: the consolidation sequence; each gate is a measured condition, not a date.; table: Stages 0–4 with capabilities, why at this point, and the gate to the next stage (risk register, visibility in group tooling, detection and login success at baseline, relevance and billing parity, own investment case). | `sequence`: The minimum hygiene. → The stages and gates that can start once it is in place. |\n| p22 | explanation | Payments sit in stage 1 as a contract, not as code, because consolidating payment-provider relationships is invisible to users and often worth more than merging checkout code. | fact: Worldline's 2022 release named Marktplaats and eBay Kleinanzeigen as clients of Online Payment Platform. | `elaboration`: The stage table. → Why payments are in stage 1. |\n| p23 | explanation | Identity sits in stage 2, not stage 1, because a login change is visible to every user and must be planned with the trust capabilities that depend on it. |  | `similarity`: Why payments sit where they do. → Why identity sits where it does. |\n| p26 | claim | The governing rule for brand migrations is to decouple them from platform migrations, because together they produce a ranking drop nobody can attribute, roll back or fix quickly. |  | `sequence`: The capability stages and their placements. → The brand migration, which the sequence keeps separate. |\n| p27 | evidence | A brand migration touches more systems than its sponsors expect. | figure: Figure 5: the workstreams of a brand migration and their dependencies; most are invisible in the brand plan and visible on switch day. | `elaboration`: The decoupling rule. → How much a brand migration touches. |\n| p28 | process (list) | Each workstream of a brand migration (domains and URLs, accounts, apps, e-mail and notifications, partners, legal) has its own rules. | source: Google Search Central site-move guidance (updated 2026): permanent redirects, short chains, redirects kept generally at least one year, Change of Address tool, temporary ranking fluctuation.; fact: Kleinanzeigen accounts carried over without re-registration (press reporting, not verified against a primary source).; quotation: mobile.de: 'the rebranding itself was the final step and took only two weeks to implement once the base refactoring was done'.; fact: Regulation (EU) 2019/1150, Article 3: changes to business users' terms notified at least 15 days ahead. | `elaboration`: The workstreams in Figure 5. → The rules of each. |\n\n### In Practice: Veldmark's Consolidation Review\n\n**Controlling idea** (`example`, id `practice`): Veldmark's review found Casavista's sequence inverted, resequenced the remaining work to the group target, replaced the synergy spreadsheets with a ledger, held Keybridge separate on purpose and settled the Polish overlap as a portfolio decision.\n\n**Advances the thesis** (S1, S2, S3, S4): Applies the option, sequence, gate and ledger to the running case with numbers.\n\n**Transition in:** `example`: The sequence, gates and brand workstream. → Veldmark's review, which applies them.\n\n**Order of paragraphs** (`problem_solution`): The reconstruction of what went wrong comes first, because the revised sequence and the ledger are answers to it; the ledger follows the resequencing because its dates come from the new plan; Keybridge and the Polish overlap close the section as the cases where the right answer was not to consolidate.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p29 | evidence | Ingrid's review tested Casavista against the sequence by reconstructing the integration from the 2025 deal case and the 2026–2027 program records. | table: 2025 deal case and 'replatform onto Hearthly France, then rebrand'; Mon 9 Mar 2026 rebrand, organic sessions −19% in six weeks and −5% by Sep 2026; Sep 2026 listings and search moved, second dip; late 2026 login, review tool and billing deferred, €8M line stalled at €3.9M; July 2027 Barcelona ring. |  |\n| p30 | analysis | The sequence was inverted: the product moved first because a replatform plan starts there and it makes the deal visible, while trust and identity, whose value grows with pooling, were left for last. | figure: Figure 6: a new storefront on a cracked foundation versus a solid trust-and-identity foundation beneath an unchanged storefront. | `cause_effect`: The reconstructed timeline. → What it shows: an inverted sequence. |\n| p31 | recommendation | The rebrand and the platform move were six months apart but the second began before the first had recovered, so the review set a rule that a second traffic-affecting change waits until organic sessions are within 3% of baseline or the board accepts the risk in writing. |  | `additional_support`: The inverted order. → A second fault, the timing of the two traffic events. |\n| p32 | recommendation | The review resequenced the remaining work on the principle of migrating to the target, not to the sibling, using Common Ground's dates. | table: Moderation review tool to the shared T&S platform Q1 2028; private-landlord verification (L4) live in Q4 2027, ahead of the T&S move; login federated with Veldmark ID 2028, migrated 2029; agency billing to the group catalog in the second half of 2028 after a shadow billing cycle; Casavista hosting switched off end of 2029. | `problem_solution`: The faults the review found. → The revised sequence that fixes them. |\n| p33 | analysis | Of the €4.1 million of technology savings still missing, the revised plan delays the €2.6 million hosting line by about two years to the 2029 switch-off, while €1.5 million from search and media stays on track for end of 2028; Ingrid argued this was honest because the original date had never been real. |  | `cause_effect`: The revised dates. → Their cost and why it is acceptable. |\n| p34 | evidence | The review replaced the synergy spreadsheets with a synergy ledger, one line per synergy or dis-synergy with an owner, a mechanism, a dependency on a stage and dated evidence. | table: Nine lines: hosting €4.0M (€1.4M), search and media €4.0M (€2.5M), overheads €4.0M (€3.6M), Spanish revenue €6.0M (€2.1M), traffic-loss dis-synergy (~€1.3M in 2026, estimate), double running €2.6M a year, Keybridge cross-selling €7.0M withdrawn, Keybridge neutral synergies €1.9M added, Hearthly.es separation cost recorded. | `sequence`: The re-dated plan. → The ledger that tracks synergies against it. |\n| p35 | recommendation | The Keybridge line shows that a revenue synergy built on using one customer group's data is a breach of trust, so every revenue synergy must name the data it uses and what permits that use, signed off by the data protection officer before the deal model goes to the board. |  | `emphasis`: The ledger's lines. → The most instructive line and the rule it produced. |\n| p36 | description | Keybridge is the group's deliberate exception to consolidation, sharing with Hearthly only the public supply contract every software vendor uses. | scenario: Keybridge runs on Azure, publishes listings for 9,800 agencies to Hearthly and its competitors, is outside the Common Ground platform organization and shares only group security standards. | `elaboration`: The withdrawn Keybridge line. → Keybridge's place in the group as a whole. |\n| p37 | analysis | The review classified Keybridge as federate under group controls permanently, and since it shares almost nothing it is also the group's most separable business: neutrality and separability require the same architecture. | reasoning: Finance, security operations, procurement and the annual neutrality review shared, nothing touching agency data; separation cost close to zero; a portal owning agents' software holds a strong position (case-aviv). | `cause_effect`: Keybridge's separate position. → The option the review recorded and its corollary. |\n| p38 | example | The review applied the same choice of option inside the group and decided not to merge two of Veldmark's own brands: for the one overlap where a synergy case might have proposed a merger, Tradeyard Poland's cars section against Motorvane Poland, it kept the portfolio decision already recorded in the marketplace profile register, which costs one field in the shared listing core. | scenario: About 2,900 Polish dealers on both, about 40% paying both; dealers above a small listing count offered Motorvane packages and syndicated to Tradeyard; the shared listing core records which brand owns the commercial relationship. | `similarity`: The review's choice of option for Keybridge. → The same choice applied to an overlap between the group's own brands, where merge brands was declined. |\n\n### Trade-offs\n\n**Controlling idea** (`comparison`, id `trade-offs`): Every option and every pace trades savings and speed against liquidity risk and separation cost, and bottom-up sequencing itself stops holding when there is nothing beneath to share or the deal is meant to remove a competitor.\n\n**Advances the thesis** (S1, S2, S5): Compares the options and the approaches, and states the limits of the guidance.\n\n**Transition in:** `sequence`: The worked case. → The general trade-offs behind its choices.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p39 | comparison | The options and the pace of a consolidation each buy savings or speed with liquidity risk and later separation cost. | table: Integration options compared on savings, liquidity risk, time to value, separation cost later and when each is right.; table: Speed against safety: big-bang, rebrand first, platform first, capability by capability. |  |\n| p40 | counterargument | Bottom-up sequencing does not hold when the acquirer has no shared platform worth joining or when the acquisition exists to remove a competitor, where early brand and inventory merger can be right. |  | `contrast`: The trade-off tables, which assume bottom-up sequencing. → The cases where that assumption fails. |\n\n### Vertical Differences\n\n**Controlling idea** (`comparison`, id `verticals`): The vertical decides what a deal buys and therefore which consolidation is easy and which is hard, and in feed-driven verticals professionals can move their inventory when an integration gets worse.\n\n**Advances the thesis** (S2, S3, S5): Adjusts the sequence and the brand risk by vertical.\n\n**Transition in:** `sequence`: The general trade-offs. → How they differ by vertical.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p41 | comparison | Which consolidation is easy and which is hard differs by vertical, because each vertical's deal buys a different asset. | table: General classifieds, real estate and automotive compared on what the deal buys, easiest and hardest consolidation, brand migration risk and a documented signal (Kleinanzeigen 2023/2025; Immowelt and immonet 2015–2024; AVIV 2025 per the interviewer's phrase; OLX and La Centrale, closed November 2025). |  |\n| p42 | evidence | Real estate and automotive carry an extra risk because supply arrives through professional software, so a consolidation that breaks an integration invites professionals to move their inventory elsewhere. | quotation: Bundeskartellamt's October 2026 mobile.de/Carwow clearance: dealers multi-home and 'many platforms offer dealers data export to other platforms'. | `elaboration`: The vertical table. → The extra risk in feed-driven verticals. |\n\n### Failure Modes\n\n**Controlling idea** (`cause_effect`, id `failure-modes`): Consolidations fail in eight recurring ways, each the reverse of a rule the chapter sets.\n\n**Advances the thesis** (S1, S2, S3, S4, S5): Restates each claim as the failure that ignoring it produces.\n\n**Transition in:** `sequence`: The vertical differences. → The mistakes that recur across verticals.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p43 | cause_effect (list) | Consolidations fail when the synergy case precedes the architecture, the product moves first, migrations overlap, work moves to a sibling, revenue lines rest on forbidden data, scope is assumed at signing, the acquired organization is forgotten or no exit path exists. | example: Hearthly.es (product first, trust last); CMA 2021 remedies for Gumtree UK and Shpock; an experimentation statistics package built at Marktplaats adopted group-wide; Adevinta's parallel running in 2025. |  |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `ca-view`): The Chief Architect decides the option early, owns the sequence and the ledger, reviews the deal model before signing, gates on liquidity, separates brand from platform and designs for reversal.\n\n**Advances the thesis** (S1, S2, S3, S4, S5): Turns each claim into a decision and a signal.\n\n**Transition in:** `problem_solution`: The failure modes. → The decisions that prevent them.\n\n**Order of paragraphs** (`chronological`): The decisions follow the life of a deal: the option in the first month, the sequence and ledger for its duration, the deal-model review before signing the next deal, the gates and brand decision during migration, reversibility for the eventual sale; the watch list comes last because it monitors all of them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p44 | recommendation | The Chief Architect should decide the integration option within the first month in a decision record that names the option, reasons, constraints, holding period and review date. |  |  |\n| p45 | recommendation | The Chief Architect owns the consolidation sequence while the deal team owns the synergy targets, and the synergy ledger, reviewed quarterly with finance, is where each synergy's stage, gate and double-running cost are stated. |  | `additional_support`: The previous decision of the Chief Architect. → A further decision. |\n| p46 | recommendation | The architecture function should review every technology synergy and every data-dependent revenue synergy before the price is agreed, the cheapest point to remove a forbidden line or add a missing dis-synergy. |  | `additional_support`: The previous decision of the Chief Architect. → A further decision. |\n| p47 | recommendation | Every stage gate includes the acquired marketplace's own liquidity metrics, and a stage whose gate fails is paused rather than pushed through to meet a date. |  | `additional_support`: The previous decision of the Chief Architect. → A further decision. |\n| p48 | recommendation | The brand decision stays separate from the platform decision because brands are commercial assets with their own investment case, and merging the two decisions produces programs too big to stop. |  | `additional_support`: The previous decision of the Chief Architect. → A further decision. |\n| p49 | recommendation | Every integration should be designed so it can be undone, because any brand of a private-equity-owned group could be sold and the discipline that makes consolidation safe makes separation cheap. |  | `additional_support`: The previous decision of the Chief Architect. → A further decision. |\n| p50 | recommendation (list) | Five signals show whether a consolidation is on track: slipped stages behind unslipped ledger lines, double-running costs with an end date, liquidity against the pre-deal baseline, organic sessions and feed errors around migrations, and acquired capabilities adopted elsewhere. |  | `conclusion_summary`: The six decisions. → What to watch once they are made. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Ten review questions turn the chapter into checks on any integration plan.\n\n**Advances the thesis** (S1, S2, S3, S4, S5): Gives one or more questions per claim.\n\n**Transition in:** `sequence`: The Chief Architect's decisions. → The questions that test a plan against them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p51 | recommendation (list) | Ten questions test an integration plan's option, constraints, order and gates, synergy dependencies, dis-synergies, data permissions, overlapping migrations, brand-migration details, sibling targets and separation cost. |  |  |\n\n## Conclusion: From Sequence to Organization\n\n**Synthesis:** The option, the order, the gates, the ledger and the separate brand workstream are one mechanism: the order decides which synergies arrive, the liquidity gates decide when, and the ledger prices every delay, so a group that runs them together protects the liquidity it bought while changing the platform beneath it, which Casavista's product-first plan did not.\n\n**So what:** With the sequence and the ledger in hand, a Chief Architect can tell the owner where the synergies are, and which ones depend on which stage, before the owner has to ask.\n\n**Callback:** The opening's two sentences that justify an acquisition (liquidity not to damage, platforms to change) and Henrik de Boer's question of where the synergies were. The conclusion shows that liquidity and platform change, the subjects of the two sentences, compete hardest for months, teams and risk budget when the platform moves product first, and that the review's answer to the question was a sequence and a ledger.\n\n**Takeaway** (`course_of_action`): Record the option, sequence the capabilities bottom-up behind liquidity gates, run the synergy case as a ledger and keep the brand migration apart.\n\n**Hand-off** to [Who Owns What: Organizing Marketplace Engineering](organizing-marketplace-engineering.html): `problem_solution`: Platform-consolidation's closing: a consolidation sequence says what moves and when, but not who owns each capability once it has moved or how the acquired engineers become part of the group. → The marketplace team topology and architecture governance: one owning team per journey, context and capability, platform teams as internal products, decision rights, the advice process and funding.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p52 | synthesis | Casavista shows that the option, the order, the gates, the ledger and the separate brand workstream work as one mechanism that lets a group change the platform without damaging the liquidity it bought, so a Chief Architect who owns it can answer the owner's question before it is asked. | reasoning: The order decides which synergies arrive, the gates when, and the ledger what each delay costs; Casavista's product-first plan inverted all three. |  |\n| p53 | transition | A consolidation sequence says what moves and when but not who owns each capability once it has moved or how acquired engineers join the group, which the next chapter takes up. |  | `problem_solution`: The mechanism and what it cannot settle. → Ownership, the next chapter's subject. |\n\n## Non-goals\n\n- The tenancy model and configuration design. See [One Platform, Many Marketplaces: Multi-Country and Multi-Brand Architecture](multi-country-platforms.html).\n- Migration techniques such as strangler fig, parallel run and relevance parity. See [Changing the Engine in Flight: Modernizing a Live Marketplace](modernization-and-migration.html).\n- Team design and acquired organizations. See [Who Owns What: Organizing Marketplace Engineering](organizing-marketplace-engineering.html).\n- Full company histories. See [Adevinta: From Schibsted's Copy-Paste Model to a Portfolio Platform](case-adevinta.html), [eBay Classifieds Group: Shared Platforms, Local Brands and a Sale](case-ebay-classifieds.html), [AVIV Group: Building a European Real-Estate Platform from Acquisitions](case-aviv.html), [OLX Group: Regional Platforms, Verticalization and Retreat](case-olx.html).\n- Deal valuation and accounting for acquisitions.\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Whether Adevinta's €130–165 million eCG synergy target was achieved is not public.\n- Account continuity in the Kleinanzeigen rebrand rests on press reporting; replace with a primary source if one is found.\n- Whether OLX will move La Centrale onto its motors platform is not public; revisit when OLX reports on it.\n- Otodom and other OLX vertical brand histories could not be verified from primary sources and are not used.\n\n## Decision log\n\n- **2026-10-19** — Set the Veldmark scene in the October–November 2027 synergy review, because the ledger already places Hearthly.es partly on Casavista's code and the Barcelona ring on an unverified login, which makes the inverted sequence concrete.\n- **2026-10-19** — Added canonical Casavista synergy figures and the rebrand date to the ledger so later chapters (modernization, case studies) can reuse them.\n- **2026-10-19** — Treated Keybridge as a permanent \"federate under controls\" case and made the withdrawn cross-selling line the chapter's example of a revenue synergy that should never be written.\n- **2026-10-19** — Placed payments in stage 1 as a contract consolidation, citing the shared payment provider of Marktplaats and Kleinanzeigen, rather than as a code merger.\n- **2026-11-12** — spec.md's six success criteria were content inventories (tables, dated examples, diagrams, question counts); their reader outcomes are covered by the journal entry's outcome and AC-1 to AC-3 (AC-1 tests diagnosing a product-first plan and proposing the sequence, gates, ledger and data permission). None is carried over. Rejected: Carrying the criteria over as they were.\n- **2026-11-12** — Added a roadmap paragraph (p04) so a reader of the hapter relies on.\n- **External**\n  - eBay 8-K 2004; eBay Vivanuncios 2015; Immowelt 2015; Adevinta 2021, 2023 (annual report and rebrand release) and Strategic Report 2025; Berlin Tech Blog 2025 (two posts); Worldline 2022; Online Marketplaces 2024 and 2025; MySweetImmo 2022; OLX Tech 2026; OLX Group 2025; CMA 2021; Bundeskartellamt 2026; Regulation (EU) 2019/1150; Google Search Central (updated 2026); Wikipedia (OLX) — Dated public evidence for the options, the synergy case, brand migration and vertical differences.\n\n## Changelog\n\n- **2026-11-13** — Fix-only pass on the round-4 check report: all eight blocking findings fixed in prose (p12, p25, p21 carve-out gloss, p34 ledger label, p37, p38, conclusion) with matching spec fields; check report now stale. (AI-mediated session)\n- **2026-11-12** — Escalation auto-resolved under the author's delegation: landlord verification date corrected to Q4 2027, p33 savings sentence aligned with the ledger table, glosses for transitional services and the account-to-cost-center catalog, roadmap names the closing sections, Keybridge subheading matches its option, p38 and 'What to watch' lead-ins; length limit 6,400. (AI-mediated session)\n- **2026-11-12** — Orchestrator review: reverted 'Hearthly France's platform' to the published 'Hearthly's platform'. Check report stale.\n- **2026-11-12** — After draft-check round 3 (escalate): two closing fixes without another round (concepts opening sentence; p24 now says the later stages depend on hygiene). Remaining findings in open_questions. (AI-mediated session)\n- **2026-11-12** — After draft-check round 2: p38 recast as the integration option applied inside the group; run-rate glossed; Ultimmo paragraph says what its cases show; forward stage reference removed; p04 and p52 shortened. (AI-mediated session)\n- **2026-11-12** — After draft-check round 1: moved the hygiene subsection before the stages; added one opening sentence to seven sections; named Figure 3's four questions in p <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
