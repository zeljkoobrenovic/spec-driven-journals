<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published index.md (one spec paragraph per draft unit, in its own order) and spec.md (accepted 2026-10-21), which it replaces. Intent outcome, the three acceptance criteria, the thesis and the role are copied unchanged from the chapter's entry in journal-spec.json; the supporting claims T1 to T5 are written here.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The four rungs of the endpoint ladder (classifieds, lead generation, transactional, managed) and the six axes of a marketplace profile.\n- **Know:** What each rung adds to identity, contexts, trust, ranking signal, monetization, data and regulation, and the documented moves along the ladder in both directions.\n- **Believe:** The marketplace model is an architecture decision, not a pricing decision, and it belongs to a country and category, not to a brand.\n- **Be able to:** Write a marketplace profile register for their own group and scope a move toward the transaction by category, with an exit plan.\n\n**Audience:** Experienced architects and engineering leaders working on listing marketplaces: chief and enterprise architects of marketplace groups, principal and staff engineers, search, data and ML leads, platform-engineering leads, product and engineering directors of classifieds, real-estate, automotive, jobs and recommerce marketplaces, and technology leaders integrating acquired marketplaces.\n\n**Already knows:**\n\n- What an API, a database, an event stream, a search engine and Kubernetes are.\n- How to make and defend an architecture decision.\n\n**Does not yet know:**\n\n- Marketplace economics: liquidity, network effects, multi-homing.\n- Search and ML vocabulary: learning to rank, percolation, hybrid retrieval.\n- Regulatory detail: DSA statements of reasons, DAC7, P2B.\n- Vertical specifics: VINs, property and vehicle feed standards.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a proposal to add payments to a whole brand, the reader names what the move adds to the systems and how to scope it. *Probe:* A horizontal brand wants to add payments and buyer protection to its whole site, cars and homes included. Using only this chapter: what does the move add to the systems, and how should it be scoped? | `custom` | cold_reader | major |\n| AC-2 | A reader of the opening alone (the callouts and the paragraphs before the first heading) can predict the chapter's sections. *Probe:* After reading only the callouts and the paragraphs before the first heading: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-3 | A reverse outline of the chapter, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** What kind of marketplace is this, and why does the answer decide the architecture?\n\n> **Claim:** A listing marketplace is defined less by what it lists than by where its job ends (at the contact, a qualified lead, a completed payment and delivery, or a guaranteed outcome), and each step down that ladder adds bounded contexts, data, identity checks, liabilities and regulators; because one brand holds several models across countries and categories, and marketplaces move along the ladder in both directions, the endpoint must be recorded per country and category as configuration, and every move toward the transaction treated as a category-gated bet with an exit plan.\n\n**Disputed by:** The view that the business model is a pricing and product choice layered on one marketplace platform, that each brand has one model, and that the industry is heading to transactions everywhere, so every brand should be built for payments now.\n\n**So what:** An architect who accepts this keeps a versioned marketplace profile register that is reviewed whenever a brand proposes a model change, shares the capabilities beneath the endpoint first, and sizes a shared order and payment platform by the profiles that need it (three of Veldmark's twenty) rather than by brand.\n\n**How and why:** A classifieds platform never sees the money, so it cannot observe whether a sale happened, and its ranking and experiments optimize contacts. Adding payment switches on licensed payment partners, seller reporting and buyer-protection risk, and the managed rung changes what a model error costs, as Zillow Offers' $304.4 million write-down showed. leboncoin, Kleinanzeigen and Marktplaats added payments for goods but not for cars or homes, and OLX de-prioritized pay-and-ship in Europe.\n\n**Supporting claims**\n\n- **T1** — One brand holds several marketplace models across countries and categories, so the question of what kind of marketplace it is has to be answered per country and category, not per brand.\n- **T2** — Marketplaces are classified first by endpoint, where the platform's job ends (at the contact, a qualified lead, a completed payment and delivery, or a guaranteed outcome), and five further axes complete a marketplace profile.\n- **T3** — Each step down the endpoint ladder adds bounded contexts, data, identity checks, liabilities and regulators, and changes what the platform can observe and therefore optimize.\n- **T4** — Marketplaces move along the ladder in both directions: moves toward the transaction have worked category by category, and several pushes have been scaled back or reversed.\n- **T5** — The endpoint should therefore be recorded per country and category as configuration in a reviewed profile register, and each move toward the transaction treated as a category-gated bet with an exit plan.\n\n## Role in the part\n\nDefines the marketplace models and the marketplace profile that the liquidity chapter measures and the capability and context chapters map. Supports P1-1 of part `part-1`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `assertion_evidence_reasoning` in the trade-offs, failure modes and Chief Architect sections, which turn the vocabulary and the record into recommendations)\n\nEach section supplies what the next needs. The Veldmark grid poses the question before any term is defined; the four models define the endpoint; the six axes complete the profile; the vertical table reads the profile per vertical straight after its axes are defined; the consequences then take the axis that reaches furthest, the endpoint, into the systems; the documented moves need the consequences to show why moving is costly; Veldmark's register applies both. The three judgement sections (trade-offs, failure modes, the Chief Architect's view) then run together: the two judgements, what happens without them, and the standing decisions that keep them; the questions close the body. Defining the profile after the documented moves would leave the reader without the unit those moves are made in; four of the six draft-check readers (rounds 1 and 3) placed the vertical table directly after Six Axes.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): Ask five people in a marketplace group what kind of business it runs and you get five partly right answers: 'classifieds' (general manager), 'we are becoming transactional' (product director), 'we sell dealer subscriptions' (sales director), 'most of our money is advertising and visibility' (finance), 'a messaging platform with listings attached' (trust and safety lead).\n\n**Bridge:** Each of the five answers describes a different point at which the marketplace's job ends. → Each endpoint implies a different architecture, so the model is an architecture decision, not a pricing decision.\n\n**Thesis statement** (KEY POINTS callout and paragraph p02.): The model is an architecture decision, not a pricing decision: moving the endpoint by one step adds bounded contexts, data, identity requirements, regulators and failure modes, so the decision must be explicit, recorded per country and category, and revisable, because marketplaces move in both directions.\n\n**Roadmap** (Paragraph p03, which groups the chapter's sections into three steps (vocabulary, consequences, judgement) and names the later chapters that build on the marketplace profile.):\n\n- Start with Veldmark's grid of twenty rows. *Kept in:* scene.\n- Define the four models of the endpoint ladder. *Kept in:* four-models.\n- Add five more axes to make a marketplace profile. *Kept in:* six-axes.\n- Compare the typical profile of each vertical. *Kept in:* verticals.\n- Show what each model asks of the systems. *Kept in:* asks.\n- Follow documented moves along the ladder in both directions, and Veldmark's register of profiles. *Kept in:* in-practice, veldmark-register.\n- Weigh where a marketplace should end. *Kept in:* trade-offs.\n- Show how the taxonomy fails, the Chief Architect's standing decisions and questions to ask. *Kept in:* failure-modes, chief-architect, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Asked what kind of business their marketplace group runs, five people give five partly right answers, each describing a different end point of the marketplace's job and each implying a different architecture. | scenario: The general manager says 'classifieds', the product director 'we are becoming transactional', the sales director 'we sell dealer subscriptions', finance 'advertising and visibility', the trust and safety lead 'a messaging platform with listings attached'. |  |\n| p02 | claim | The model is an architecture decision, not a pricing decision: moving the endpoint by one step adds contexts, data, identity requirements, regulators and failure modes, so the decision must be explicit, recorded per country and category, and revisable. |  | `cause_effect`: Each answer implies a different architecture. → The chapter's claim: the model is an architecture decision, recorded per country and category. |\n| p03 | transition | The chapter gives the conversation a shared vocabulary in three stated steps: the vocabulary (Veldmark's grid, the four models, the six axes and the profile, the typical profile of each vertical), the consequences (what each model asks of the systems, documented moves along the ladder, Veldmark's register) and the judgement (where to end, failure modes, the Chief Architect's view and questions); the marketplace profile it introduces is used by later chapters. | reasoning: The sections in order; the terms the chapter owns; the later chapters that use the profile (liquidity-and-network-effects, business-capabilities, bounded-contexts, multi-country-platforms) and the neighbours that own history and vertical detail. | `sequence`: The claim that the model is an architecture decision. → How the chapter builds the vocabulary to make that decision, section by section. |\n\n## Sections\n\n### Setting the Scene at Veldmark: One Group, Four Models\n\n**Controlling idea** (`context`, id `scene`): A proposal for one checkout across Veldmark's four brands assumed one marketplace model, and a grid of five questions showed the group ran at least four, spread over twenty rows that do not line up with brands.\n\n**Advances the thesis** (T1): Shows on a concrete group that the model varies below the brand, which is why it must be recorded per country and category.\n\n**Transition in:** `sequence`: The chapter's roadmap. → Its first item: the Veldmark situation that poses the question.\n\n**Order of paragraphs** (`chronological`): Proposal, grid, rows, the hardest row, then the conclusion: the order in which the afternoon happened, so the conclusion arrives with its evidence.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p04 | context | Veldmark's Group Chief Product Officer proposes extending Tradeyard Safe Deal into one listing and order platform for all four brands, on the strength of its 2026 results. | scenario: Common Ground: €140M over four years, approved January 2027; Safe Deal 2026: 11.6 million transactions, about €1.02 billion GMV, about €75 million revenue, a take rate of about 7%. |  |\n| p05 | description (list) | Ingrid answers the slide with a grid: brands and countries down the side, five questions about endpoint, supply, item identity, who holds the money and who loses first across the top. | example: The five questions on the grid. | `contrast`: Noor's slide. → Ingrid's response: not an argument but a grid of questions. |\n| p06 | evidence | The grid had twenty rows whose answers did not line up with the brands: endpoints differed by country and category inside one brand, and Keybridge was not a marketplace at all. | scenario: Tradeyard goods ending at contact or at Safe Deal payment; Portugal without Safe Deal; Polish insertion-fee sections; Motorvane leads to 21,400 dealers; Hearthly leads and Valuo seller leads; Keybridge as SaaS. | `time`: The grid on the wall. → What it showed by the end of the afternoon. |\n| p07 | example | The most uncomfortable row was Poland, where Tradeyard's cars section and Motorvane served the same dealers under two different models. | scenario: Per-listing insertion fees on Tradeyard Poland against dealer subscriptions with slots on Motorvane Poland; both sales teams calling on the same showrooms. | `emphasis`: The twenty rows. → The one row that showed a conflict, not only a difference. |\n| p08 | synthesis | Ingrid concluded that 'one checkout for four brands' assumed one model while the group ran at least four, and the rest of the chapter is the vocabulary she used to say why. |  | `conclusion_summary`: The grid and the Polish row. → Ingrid's conclusion and the chapter's task: the vocabulary behind it. |\n\n### Where the Marketplace Ends: Four Models\n\n**Controlling idea** (`definition`, id `four-models`): Listing marketplaces are classified first by endpoint, and the four models (classifieds, lead generation, transactional, managed) form a ladder on which each rung adds what the platform must do, know and carry.\n\n**Advances the thesis** (T2): Defines the endpoint axis and the four rungs of the ladder.\n\n**Transition in:** `elaboration`: Ingrid's first question, where does our job end. → A precise definition of endpoint and its four values.\n\n**Order of paragraphs** (`small_to_large`): One definition per rung, top to bottom, then the ladder that combines them, then the one model that sits off it; the ladder cannot be read before its rungs are defined.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | definition | A listing marketplace publishes many suppliers' offers, and this book classifies it first by endpoint: the last step of the transaction the platform takes responsibility for. |  |  |\n| p10 | definition | Classifieds are marketplaces whose job ends when a buyer contacts a seller; payment and handover happen off the platform. | quotation: Meta, 2016: 'Facebook does not facilitate the payment or delivery of items in Marketplace'. | `sequence`: The endpoint axis. → Its first value: the contact. |\n| p11 | evidence | Because the platform never sees the money, classifieds monetize visibility and access, and even a group with a declared transactional push earns most of its revenue that way. | statistic: Adevinta 2023: classifieds €1,399M of €1,826M revenue, advertising €312M, transactional €103M (about 77%, 17%, 6%). | `cause_effect`: The platform does not take part in the sale. → What it can therefore charge for. |\n| p12 | definition | A lead-generation marketplace ends when a qualified enquiry reaches a professional, so it must qualify, count, route and attribute leads and prove their value at renewal. |  | `sequence`: Classifieds, which end at the contact. → The next rung, which delivers a lead to someone who pays for it. |\n| p13 | evidence (list) | Documented lead-generation models differ in how professionals pay and who receives the lead. | statistic: Rightmove ARPA £1,621/month (2025); Autotrader ARPR £2,995/month (FY26); Zillow share of voice and pay-at-close (10-K 2025); AVIV France commission share (2023); Homes.com 'your-listing your lead' (CoStar 10-K 2025). | `elaboration`: The lead as the unit of value. → The ways professionals pay for it. |\n| p14 | analysis | Pay-at-close pricing pulls the portal into the transaction's outcome without its money, which makes outcome matching a reconciliation problem rather than a payments problem. |  | `elaboration`: Pay-at-close among the models. → What it demands of the systems. |\n| p15 | definition | A transactional marketplace ends when payment and delivery are complete on the platform, and its revenue becomes a take rate on GMV that classifieds cannot observe. | statistic: eBay take rate 13.94% on GMV of $79.6B (2025); a16z (2020) GMV versus revenue; Gurley (2012) 'if you bring the cash, you are king'. | `sequence`: The lead rung. → The rung where the money passes through the platform. |\n| p16 | example | Vinted is the clearest example of a marketplace built transactional from the start, with integrated shipping and payment and a buyer fee as its main charge. | statistic: Vinted 2025: GMV €10.8B, revenue €1.1B; buyer fee 'usually 5% + $0.70' in the US (price list 2026). | `example`: The transactional definition. → Its clearest documented case. |\n| p17 | definition | A managed marketplace takes inventory, quality or outcome risk itself, by buying and reselling, guaranteeing results or curating like a retailer. | fact: Autotrader's Autorama: about 1,350 vehicles temporarily on balance sheet (FY26); iBuying in real estate. | `sequence`: The transactional rung. → One step further: the platform carries the risk. |\n| p18 | synthesis | The four models form a ladder on which each rung adds what the platform must do, know and carry. | table: The endpoint ladder table: endpoint, what the platform observes, monetization, who holds money and risk, documented examples.; figure: Figure 1: descending steps with a heavier load on each. | `conclusion_summary`: The four definitions. → Their order as a ladder. |\n| p19 | definition | Software for professionals is an adjacent model off the ladder, whose customer is the professional and whose architecture follows SaaS rules. | statistic: Scout24 Transaction Enablement €106.6M (2025); Zillow's Follow Up Boss. | `contrast`: The ladder of four models. → A business that is in the group but not on the ladder. |\n\n### Six Axes, One Profile\n\n**Controlling idea** (`definition`, id `six-axes`): The endpoint is one of six independent axes that together form a marketplace profile for one country and category, and a brand usually holds several profiles.\n\n**Advances the thesis** (T2, T1): Adds the other five axes and makes the profile, not the brand, the unit.\n\n**Transition in:** `elaboration`: The endpoint, the most consequential axis. → The other five axes and the profile they form.\n\n**Order of paragraphs** (`grouping`): The profile first, then each axis in the table's order, then the consequence for brands; the conclusion needs every axis before it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p20 | definition | Six axes vary independently and together form a marketplace profile: the combination of answers that describes one marketplace in one country and category; Ingrid's five questions covered five of them, and scope is the sixth. | table: Axis table: endpoint, scope, seller type, item identity, money flow, risk ownership, with values and what each decides first. |  |\n| p21 | comparison | Horizontal marketplaces cover many categories with mostly private supply and vertical ones specialize in a high-value domain with professional supply, and their economics differ sharply. | statistic: Rightmove and Autotrader operating margins of about 70%; Adevinta's French margin falling two points with a growing transactional share (2023). | `sequence`: The axis table. → The scope axis, named as the second axis in the table. |\n| p22 | evidence | Horizontal groups also contain verticals, and the same unbundling inside a group can set a horizontal brand's car section against a sister vertical brand. | source: Parker (2010) on the spawn of craigslist; Adevinta's 2023 reorganization by vertical; OLX motors, real estate and jobs at 71% of revenue (FY26). | `elaboration`: Horizontal versus vertical. → That the line runs inside groups too, which is Veldmark's Polish problem. |\n| p23 | explanation | Seller type matters because consumers and professionals respond to different prices and the trader line decides which consumer-protection rules apply. |  | `sequence`: Scope. → The seller-type axis. |\n| p24 | explanation | Item identity decides how much of a listing can be derived rather than typed. | example: Unique second-hand goods; vehicles with a VIN; properties with an address and parcel; catalog products. | `sequence`: Seller type. → The item-identity axis. |\n| p25 | explanation | Money flow and risk ownership are separate questions: a platform can route money without holding it, and carry buyer-protection losses without owning inventory. | quotation: eBay books losses 'resulting from our buyer protection programs, chargebacks' as transaction losses (10-K 2025). | `sequence`: Item identity. → The last two axes and why they are kept apart. |\n| p26 | claim | A brand is not a profile: Tradeyard alone holds ten, so a platform that encodes the profile by brand is wrong somewhere and needs code changes whenever a category moves. |  | `conclusion_summary`: The six axes. → What follows for how the profile is stored. |\n\n### Vertical Differences\n\n**Controlling idea** (`comparison`, id `verticals`): The endpoint and the other axes take typical values in each vertical, each with its own taxonomy trap.\n\n**Advances the thesis** (T3, T1): Shows the axes by vertical, so the reader can place a vertical on the ladder and name the trap it invites.\n\n**Transition in:** `elaboration`: The six axes and the profile they form. → The typical profile, and the classification trap, of each vertical.\n\n**Order of paragraphs** (`large_to_small`): The whole vertical table first, then two documented products that show single axes enforced; the products need the table's columns to be read as axes.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p51 | comparison | Profiles cluster by vertical: each vertical has a typical endpoint, supply, item identity, money flow and monetization unit, which places it on the ladder, and a typical classification trap. | table: Vertical table: general classifieds, real estate, automotive, jobs, recommerce. |  |\n| p52 | example | Two documented products turn single cells of the vertical table into product rules: Indeed's performance billing (the jobs monetization unit) and Vinted's separate professional channel (the recommerce supply split, the seller-type axis). | fact: Indeed bills on 'clicks or started applications' (n.d.); Vinted Pro separates commercial sellers because 'businesses have legal obligations that private sellers don't' (2026). | `example`: The vertical table. → Two documented products in which single cells of the table (the jobs monetization unit, the recommerce supply split) became product rules. |\n\n### What Each Model Asks of the Architecture\n\n**Controlling idea** (`analysis`, id `asks`): Each step down the ladder changes nearly every system, most surprisingly what the platform can observe, which identity and regulatory obligations apply, and who holds the money.\n\n**Advances the thesis** (T3): Maps each rung to its contexts, data, identity, trust and regulatory consequences.\n\n**Transition in:** `emphasis`: The axes and their typical values per vertical. → The axis that reaches furthest into the systems: what each endpoint value demands of them.\n\n**Order of paragraphs** (`large_to_small`): The whole consequence table first, then the pipeline view, then the three consequences that most surprise architects, each from the table.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p27 | claim | Moving down the endpoint ladder changes nearly every system, not just one. | table: Consequences table: identity depth, core new contexts, trust focus, ranking signal, monetization system, data kept, regulatory switch, per model. |  |\n| p28 | explanation | Every rung adds contexts and none replaces the ones before it, so a category that moves its endpoint must run the extra contexts for that category alone. | figure: Figure 2: the endpoint ladder as a pipeline. | `elaboration`: The table. → The same consequences seen as a pipeline. |\n| p29 | explanation | A classifieds platform does not know whether a sale happened; it sees contacts, while lead portals sometimes see outcomes and transactional marketplaces see the order. | quotation: OLX Tech (2022): learning-to-rank labels were purchases or 'messages/calls to sellers' 'because transactions aren't always confirmed'. | `emphasis`: The table's consequences. → The least obvious one: observability of outcomes. |\n| p30 | cause_effect | What the platform can observe decides what ranking optimizes, what experiments measure and what can be sold. | fact: Zillow treats pay-at-close fees as variable consideration and estimates lead-to-transaction conversion (10-K 2025). | `cause_effect`: What each rung can observe. → What that limits. |\n| p31 | evidence | Each rung down switches on more identity and regulatory obligations, such as EU trader traceability and ranking disclosure, because both rules attach to what the platform lets consumers do, not to what it lists. | fact: DSA Article 30 (Regulation (EU) 2022/2065); Omnibus Directive (EU) 2019/2161 definition of online marketplace and ranking parameters. | `sequence`: Observability. → Identity and regulation. |\n| p32 | claim | Adding payments switches on seller tax reporting under DAC7 that a pure classifieds site may not have, a reading to confirm with counsel. | source: Belastingdienst DAC7 guidance (n.d.); commentary that listing-only platforms fall outside. | `example`: Obligations deepen with the endpoint. → The obligation payments switch on. |\n| p33 | evidence | Classifieds groups that add payments almost always keep the money with a licensed payment service provider and own the flow around it. | fact: Kleinanzeigen 'Sicher bezahlen' holds funds up to 14 days (n.d.); Marktplaats withdrew Gelijk Oversteken in April 2022 and runs Kopersbescherming through OPP with a 5% buyer fee (2022). | `sequence`: Regulation that payments switch on. → How groups hold the money itself. |\n| p34 | evidence | The step beyond is a licence of one's own, which brings safeguarding, a ledger that reconciles to the cent and supervisory reporting. | fact: Vinted Pay EMI licence from the Bank of Lithuania; own wallet from January 2026. | `contrast`: Money held by a partner. → Money held by the marketplace's own licensed entity. |\n\n### In Practice: Moving Along the Ladder\n\n**Controlling idea** (`evidence`, id `in-practice`): Documented marketplaces moved along the ladder in both directions: horizontals added payments only for goods, some transactional and managed pushes were scaled back, and lead portals moved closer to the deal.\n\n**Advances the thesis** (T4): Supplies the documented record that the endpoint moves both ways and category by category.\n\n**Transition in:** `elaboration`: What each rung adds to the systems. → What happened when real marketplaces took that on or gave it up by changing rungs.\n\n**Order of paragraphs** (`grouping`): Four patterns, from the most common advance to retreats, then the middle path; each pattern is a group of documented cases followed by what they show.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p35 | transition | The documented history shows movement along the ladder in both directions, in four recurring patterns. |  |  |\n| p36 | evidence (list) | The large European horizontals added payments and shipping for shippable goods while keeping classifieds for everything else. | fact: leboncoin transactional since 2019, revenue €53M (2022) to €73M (2023); Marktplaats transactional 2017, shipping 2019, second carrier 2022; Kleinanzeigen's 2023 ambition (Adevinta reports 2019, 2023). | `example`: The four patterns. → Pattern 1. |\n| p37 | analysis | None of them moved cars or homes, so the transactional layer was category-gated to shippable, moderately priced goods. | fact: mobile.de earned essentially no transactional revenue in 2023. | `contrast`: What the horizontals added. → What they did not. |\n| p38 | analysis | The transactional layer also cost margin, so it may be right but is not a free revenue line. | statistic: Transactional revenue 5.6% of Adevinta's 2023 revenue; French margin diluted; rising direct payment and shipping costs. | `additional_support`: Category gating. → The cost of the layer. |\n| p39 | evidence (list) | Some groups pushed transactions further and then pulled back. | fact: OLX Pay&Ship (OLX Tech 2023) de-prioritized in Europe (Prosus FY25); Adevinta's 2023 unified platform followed by a 2025 decentralized model (strategic report 2025). | `contrast`: Pattern 1's gated advance. → Pattern 2: pushes scaled back. |\n| p40 | evidence (list) | The most expensive moves were down to the managed rung, and all three documented cases retreated. | fact: Zillow Offers wound down 2 November 2021 with a $304.4M write-down; OLX Autos $1.6B revenue then $206M half-year losses and exit announced March 2023; CarGurus wound down CarOffer on 6 August 2025. | `sequence`: Transactional retreats. → Pattern 3: retreats from the managed rung. |\n| p41 | analysis | The managed rung changes what a model error costs: an estimate that informs a listing page becomes a balance-sheet loss when the platform buys at it. | reasoning: A 7% valuation error under adverse selection. | `conclusion_summary`: The three retreats. → Their common thread. |\n| p42 | evidence | Vertical portals move closer to the deal without holding money or assets, and professionals can push back when the new step changes their workflow. | fact: Autotrader Deal Builder enquiries 'convert at double the rate' and a 1.7% forecourt drop partly attributed to its roll-out (FY26); mobile.de lead API (2026). | `sequence`: Pattern 3. → Pattern 4: lead generation moves closer to the deal. |\n\n### Veldmark: Four Brands, Twenty Profiles\n\n**Controlling idea** (`example`, id `veldmark-register`): Veldmark records its twenty profiles in a reviewed register, which sizes the shared checkout by the profiles that need it rather than by brand.\n\n**Advances the thesis** (T1, T5): Applies the profile and the both-directions lesson to one group, showing what is shared beneath the endpoint and what is not.\n\n**Transition in:** `cause_effect`: The documented moves, category by category and in both directions. → What Veldmark does with that lesson: a register of profiles.\n\n**Order of paragraphs** (`large_to_small`): The register as a whole, what it implies for the shared platform, its hardest row resolved, then two instances; resolving Poland straight after the register closes the thread the scene opened before the examples move to single listings.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p43 | description | Ingrid's grid became the marketplace profile register, a short versioned table reviewed whenever a brand proposes to change its model. | table: Register summary: brand rows with profile counts, endpoint, seller type, money flow, risk carried, monetization (2026). |  |\n| p44 | analysis | Read across the rows, a shared order and payment platform serves three Tradeyard profiles, while what every profile needs is shared beneath the endpoint. | scenario: Motorvane dealers want leads in their own systems; Hearthly transactions settle at a notary; identity, listing management, media, search, messaging, trust and safety and the catalog with entitlements are common. | `cause_effect`: The register. → What it does to Noor's proposal. |\n| p46 | example | The Polish overlap was resolved commercially first and architecturally second, as a syndication contract and a record of which brand owns each listing's commercial relationship. | scenario: Tradeyard PL vehicles stay classifieds for private sellers; larger dealers move to Motorvane packages syndicated to Tradeyard. | `sequence`: The shared platform sized by profiles. → The register's hardest row, Poland, resolved. |\n| p45 | example | The book's two running examples succeeded on different rungs, measured by different events and served by different systems above one listing core. | scenario: Femke's bike, listed at €240, sold for €225 via Safe Deal with a €11.95 buyer fee on 8 March 2027; the Essen Golf at €21,900 got 23 raw leads in 10 days (14 e-mails, 7 calls, 2 test-drive bookings), sold 29 April, removal 26 hours later.; figure: Figure 3: two successes on two rungs. | `example`: Profiles on different rungs, and the register that records them. → The book's two running examples as instances, introduced as recurring examples from meet-veldmark. |\n\n### Trade-offs: Where Should the Marketplace End?\n\n**Controlling idea** (`recommendation`, id `trade-offs`): Each endpoint option has a place where it is right and wrong, and two judgements follow: treat every move down as a bet with an exit plan, and keep the endpoint in data, not code.\n\n**Advances the thesis** (T5): Turns the ladder and the record into the chapter's two recommendations.\n\n**Transition in:** `cause_effect`: Veldmark's register and the documented moves. → The question every leadership team returns to: should we move the endpoint?\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The options table first, then the two judgements it supports, the second following from the first: a cheap exit needs the endpoint in data.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p47 | comparison | Every leadership team returns to whether to move the endpoint, and each option has its gains, costs and conditions. | table: Trade-off table: stop at contact, own the lead, own the transaction, own the outcome, hybrid category-gated; gains, costs, when right, when wrong. |  |\n| p48 | transition | Two judgements follow from the table and the documented cases. |  | `conclusion_summary`: The trade-off table. → The two judgements drawn from it. |\n| p49 | recommendation | I would treat every move down the ladder as a bet with an exit plan whose architecture makes the retreat cheap. | fact: OLX's de-prioritization of pay-and-ship as a cheap retreat; Adevinta's parallel running in 2025 that more than doubled cloud-provider emissions temporarily as an expensive one. | `sequence`: Two judgements. → The first. |\n| p50 | recommendation | The endpoint should be data, not code, so the business can move a category without a release. | example: Configuration 'Safe Deal: enabled for NL goods, BE goods, PL goods; not PT; not vehicles' against `if brand == 'tradeyard' and country != 'PT'`.; figure: Figure 4: the endpoint as configuration. | `sequence`: The first judgement. → The second. |\n\n### Failure Modes\n\n**Controlling idea** (`analysis`, id `failure-modes`): The taxonomy fails in seven recognizable ways, each traceable to a model that was assumed, hidden or mismeasured.\n\n**Advances the thesis** (T5, T3): Shows what goes wrong when the endpoint is not recorded per profile and its consequences are not designed.\n\n**Transition in:** `contrast`: What the taxonomy should decide. → How it fails in practice.\n\n**Order of paragraphs** (`order_of_importance`): The most common and costly failure first, ending with the one that concerns the model off the ladder.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p53 | transition | The taxonomy fails in practice in seven recognizable ways. |  |  |\n| p54 | analysis | Assuming one model for the whole group fits transactional goods and hurts every other brand, which is how The Forced Fit begins. |  | `sequence`: Seven ways. → The most common. |\n| p55 | analysis | When the endpoint is never written down it is hidden in code, and changing a category means finding every place that assumes it. |  | `sequence`: A model assumed. → A model never written down. |\n| p56 | analysis | A transactional pivot launched as a feature ships the screen before the ledger, disputes and reporting. |  | `sequence`: The endpoint hidden in code. → A pivot launched as a feature. |\n| p57 | example | Ignoring contact-stage fraud because the platform does not handle money is Fast Mail for Fraudsters, because messaging is where money is negotiated. | scenario: At 20:11 on Sunday 7 March 2027 a fake Safe Deal payment link reached Femke from a domain registered that day. | `sequence`: Transactional failures. → A failure at the contact endpoint. |\n| p58 | analysis | Revenue from different rungs is not comparable, and reporting it in one field makes portfolio decisions harder. | fact: OLX Autos briefly made up just over half of OLX's classifieds revenue while losing money. | `sequence`: Fraud at the endpoint. → Revenue across rungs. |\n| p59 | analysis | Borrowing the success event from the wrong model optimizes the wrong thing, which is Vanity Liquidity: counting what is easy to count instead of what the model delivers. |  | `sequence`: Revenue mismeasured. → Success mismeasured. |\n| p60 | example | Software for professionals that publishes to rivals creates a neutrality obligation, which at Veldmark is a taxonomy decision as much as a governance one. | scenario: Veldmark's March 2027 decision: no Keybridge agency data used by Hearthly for ranking or sales targeting, with access controls and an annual independent review. | `sequence`: Mismeasured success. → The off-ladder model's failure. |\n\n### The Chief Architect's View\n\n**Controlling idea** (`recommendation`, id `chief-architect`): At group scale the taxonomy is four standing decisions: a profile register as an architecture artifact, separate decision rights, sharing beneath the endpoint first, and design for movement both ways, plus four things to watch.\n\n**Advances the thesis** (T5): States how a group keeps the endpoint recorded, governed and reversible.\n\n**Transition in:** `problem_solution`: The seven failures. → The standing decisions that prevent them.\n\n**Order of paragraphs** (`grouping`): Announce the four decisions, give them in the order record, decide, share, reverse, then what to watch once they are in place.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p61 | transition | The seven failures share a remedy: at group scale the taxonomy is a set of standing decisions, of which four matter most. |  |  |\n| p62 | recommendation | Make the profile register an architecture artifact, written per country and category and reviewed when it changes. | scenario: Veldmark's twenty-row register, versioned like a decision record. | `sequence`: Four decisions. → The first. |\n| p63 | recommendation | Moving an endpoint is a commercial decision, but architecture owns the cost of change and must be consulted early. |  | `sequence`: The register. → Who decides changes to it. |\n| p64 | recommendation | Share the capabilities every profile needs first, and share rung-specific contexts only among the profiles that use them. | quotation: Adevinta's 2019 rule to centralize where 'investment requirements are large and the technology is uniform', and its 2023–2025 swing. | `sequence`: Decision rights. → What to share. |\n| p65 | recommendation | Design for movement in both directions so a retreat is a configuration change and a retention plan, not a migration. |  | `sequence`: What to share. → How to keep moves reversible. |\n| p66 | recommendation | At group level, watch the mix of contacts, leads and orders per profile, the success event, the regulatory switches and the cost per profile, all of which should change with the endpoint. |  | `conclusion_summary`: The four decisions. → The signals that show whether they hold. |\n\n### Questions to Ask\n\n**Controlling idea** (`recommendation`, id `questions`): Nine questions turn the chapter into a design review of a marketplace model.\n\n**Advances the thesis** (T5): Gives the reader the questions that expose an unrecorded or code-bound endpoint.\n\n**Transition in:** `sequence`: The Chief Architect's standing decisions. → The questions to take into a review.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p67 | recommendation (list) | Nine questions take the taxonomy into a design review or strategy discussion. | example: Questions on endpoint per country and category, success event, who holds money, who loses first, configuration or code, regulatory switches, shared-platform assumptions, retreat data, professional software. |  |\n\n## Conclusion: From Model to Liquidity\n\n**Synthesis:** The five answers from the opening were each right for some rows of the register; recorded per country and category, they stop being a disagreement about the business and become configuration the systems read, with every move along the ladder a category-gated bet with an exit plan.\n\n**So what:** A group that records its profiles can size shared platforms by the profiles that need them and change a category's endpoint without a program, instead of building one brand's model into everyone's systems.\n\n**Callback:** The five people's five answers in the opening paragraph. Each answer is shown to be the endpoint of particular rows in the register.\n\n**Takeaway** (`course_of_action`): Write the profile register for your own group, then measure whether each profile's job is being done well.\n\n**Hand-off** to [Liquidity Is the Product: Network Effects, Local Markets and Marketplace Metrics](liquidity-and-network-effects.html): `contrast`: The four models, which differ in where the marketplace's job ends. → What all of them sell underneath, liquidity, and how to measure whether the job is being done well.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p68 | synthesis | The five answers from the opening were each right for some rows of the register, so recording the model per country and category turns a disagreement about the business into configuration the systems can read, and makes each move along the ladder a category-gated bet that can be reversed. |  |  |\n| p69 | transition | The taxonomy tells a marketplace where its job ends but not whether the job is done well; all the models sell liquidity underneath, which the next chapter defines and measures. |  | `contrast`: Where the job ends. → Whether it is done well: liquidity. |\n\n## Non-goals\n\n- Liquidity and its metrics. See [Liquidity Is the Product: Network Effects, Local Markets and Marketplace Metrics](liquidity-and-network-effects.html).\n- Industry history and the formation of portfolios. See [From Newspaper Columns to Portfolios: How the Classifieds Industry Evolved](industry-evolution.html).\n- Full vertical comparison and the shared-versus-specific decision. See [Same Platform, Different Physics: How Listing Verticals Differ](vertical-requirements.html).\n- Payment, shipping and buyer-protection design. See [Beyond the Contact: Payments, Shipping and Buyer Protection](transactions-and-payments.html).\n- Revenue models and KPIs in depth. See [How Listing Marketplaces Make Money](monetization-models.html).\n- Professional SaaS and neutrality design. See [Serving the Pros: Dealer, Agent and Merchant Tooling](professional-seller-tooling.html).\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-10-19** — Chose 'endpoint' (where the job ends) as the primary axis over horizontal/vertical, because it predicts bounded contexts, observability and regulation more directly.\n- **2026-10-19** — Added 'managed marketplace' as a fourth rung and treated pro SaaS as an adjacent model off the ladder, so Keybridge and the iBuying/OLX Autos cases have a place.\n- **2026-10-19** — Introduced the Veldmark marketplace profile register (twenty rows, brand x country x category group) as the chapter's architectural artifact, rather than a brand-level classification.\n- **2026-10-19** — Resolved the Tradeyard PL / Motorvane PL overlap commercially (dealers move to Motorvane packages, syndicated to Tradeyard) to illustrate that model overlaps are commercial decisions with architectural consequences.\n- **2026-10-19** — Resolved open question: Safe Deal volume against EUR 75M revenue; the ledger gives 11.6M transactions and about EUR 1.02B GMV and the chapter states the about 7% take rate. (Carried over from spec.md.)\n- **2026-11-12** — Converted spec.md to spec.json. Success criteria: all seven were inventories of contents (definitions present, tables present, diagrams, sources) and are dropped as criteria; their substance is carried by the journal spec's AC-1 (scoping a payments move), AC-2 (the opening predicts the sections) and AC-3 (reverse outline). No acceptance criteria were added. Word limit: spec.md set none, so length.max_words is the published prose length (7,484 words by check_draft's count) plus 5%, 7,858. Rejected: Carrying the inventory criteria over as written.\n- **2026-11-12** — Supporting claims T1 to T5 written here (the journal spec gives none for this post) from the thesis's parts: model per country and category, the endpoint ladder and profile, what each rung adds, moves in both directions, the register and the category-gated bet. For the author to confirm. Rejected: A sixth claim for the failure modes; they argue T5 and T3.\n- **2026-11-12** — Audience copied from the journal-level audience; this chapter does not narrow it.\n- **2026-11-12** — Promoted the subsection 'Veldmark: four brands, twenty profiles' to its own section, 'Veldmark: Four Brands, Twenty Profiles', so that In Practice holds one controlling idea (the documented moves) and the register is a section of its own. Rejected: Keeping the register inside In Practice, which gave that section two controlling ideas.\n- **2026-11-12** — Introduction reordered to hook, claim, roadmap (published: hook, roadmap, claim), and the roadmap paragraph now names the sections in order; conclusion split into a synthesis that returns to the five answers and the existing hand-off. Rejected: Keeping the published roadmap, which named the terms the chapter owns but not its sections.\n- **2026-11-12** — Flow rubric (sound with notes): moved Vertical Differences from after Trade-offs to after the Veldmark register, so the vertical table follows the register it generalizes and the trade-offs, failure modes and Chief Architect sections run together; rewrote the transitions into verticals and trade-offs and the roadmap; glossed Vanity Liquidity in p59; added 'category-gated bet with an exit plan' to the conclusion synthesis. Rejected: Moving Vertical Differences directly after Six Axes: its traps cite CarOffer and OLX Autos, which In Practice introduces.\n- **2026-11-12** — Second flow rubric (sound with notes): no order change; notes recorded in open_questions.\n- **2026-11-12** — Draft check round 1 (ESCALATE on three spec-fa ion; introduction reordered to hook, claim, roadmap; conclusion given a synthesis and callback. (AI-mediated session)\n- **2026-11-12** — After draft-check round 1: Vertical Differences moved after Six Axes; p45/p46 swapped; p52 rewritten as one idea; prose revised for 3 transition, 2 evidence, 9 corroborated flow and 6 corroborated known-before-new findings. (AI-mediated session)\n- **2026-11-12** — After draft-check round 2: Vertical Differences moved after What Each Model Asks; prose fixes for four corroborated draft findings and three cheap minor ones; word count held at the limit. (AI-mediated session)\n- **2026-11-12** — Draft-check round 3 ESCALATE (spec fault: Vertical Differences placement; budget spent). Closing fixes applied without another round: fifth answer in the callback, recommerce gloss, p52 opener, p43 'lesson of category gating', 'all four signals', roadmap trimmed. Check report stale. (AI-mediated session)\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
