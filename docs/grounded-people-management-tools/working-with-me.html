<script id="data" type="application/json">{"meta": {"id": "PPL-WORKING-WITH-ME", "status": "draft:gray", "title": "Working with Me", "date": "2026-07-28", "author": "Željko Obrenović", "permalink": "working-with-me", "timetoread": "7 min", "excerpt": "I write the user guide to myself so that no one on my team has to reverse-engineer my management style from anecdotes. It states my operating cadence, how I decide, how I read email and chat, and how I want feedback — and I keep it current enough that my reports can quote it back to me. Writing it is a self-awareness exercise as much as a communication device.", "tags": "people management, working with me, management style, onboarding, communication, self-awareness", "icon": "assets/icons/working-with-me.png", "logo": "assets/images/working-with-me/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["people management", "working with me", "management style", "onboarding", "communication", "self-awareness"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: I write a \"Working with Me\" document and keep it current — a short, first-person guide to my operating cadence, my management style, and how I communicate and give feedback. Writing it is a self-awareness exercise as much as a communication device: I only find out what I actually believe about how I work when I try to put it in a paragraph someone else has to act on. The document is real only if my reports can quote it back to me.\n\n## Statement\n\nMy operating model for a \"Working with Me\" document has five parts:\n\n- **Write it, don't wing it.** I keep a living \"Working with Me\" document — my role and goals, my personality and boundaries, my operating cadence, my management style, and how I support people's careers — rather than letting new reports assemble my preferences from trial and error.\n- **State the cadence in numbers.** 1:1 frequency, team meeting purpose, quarterly planning rhythm, an early career session, and a quarterly review of each person's top personal goals — all named, not implied.\n- **Declare the decision style honestly.** I say plainly that I am collaborative and can be slow to decide, that I am mostly hands-off except early in a new initiative, and that I put decisions back on the person before I take them myself — and I tell people how to pull an urgent decision out of me when they need one.\n- **Set the communication contract.** Email response norms, what \"FYI\" means, chat expectations, and what I do and do not need looped in on, stated explicitly enough that no one has to guess whether my silence means approval or neglect.\n- **Make feedback and results explicit.** I say how I give and receive feedback, that I will not let venting about someone replace telling them directly, and that I measure results relentlessly rather than assuming good intentions are enough.\n\n![Diagram of a document built from five stacked layers labeled role and person, cadence, decisions, communication, and feedback.](assets/images/working-with-me/working-with-me-five-layers.jpeg)\n**Figure 1:** *The document has five layers, each building on the one below it: identity, cadence, decisions, communication, feedback.*\n\n## How to Read This\n\nThis journal is my people-management toolkit — first-person operating records built on the companion workbooks to Claire Hughes Johnson's *Scaling People: Tactics for Management and Company Building*. This record is grounded in the workbooks' \"Working with Claire\" tool and its companion \"Working with Me Template,\" read through a practitioner-executive lens: the workbook offers both as an exercise in writing down how you work; I read the finished document as a standing artifact I owe every person who joins my team, and the exercise of writing it as a check on my own self-awareness. The runnable tool — my own filled-in template — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**A management style nobody wrote down still gets learned — just slowly and expensively.** Every manager has an operating style whether or not it is documented; the only choice is whether people learn it from a written page in their first week or from a string of small surprises over months. Johnson's own account of first writing \"Working with Claire\" in 2010 makes the case for me: her executive assistant read the draft and told her it was missing \"the most important thing\" — that she likes to have a good laugh at work. The mechanics of a working relationship and the personal texture of it are both information a report needs, and neither shows up automatically.\n\n**The cadence has to be a number, not a mood.** Vague statements like \"I'm available\" or \"my door is open\" tell a new report nothing they can plan around. So I state the cadence explicitly: 1:1s biweekly or weekly, tracked in a joint document covering agendas, actions, goals, and updates; weekly team meetings that are both status and decision forums, with people expected to show up prepared; quarterly planning sessions with real pre-work and follow-up; an early career-history session in the first few months so I understand where someone is trying to go; and a quarterly review of each person's top three to five *personal* goals — the things they spend their own time on, distinct from team plans — reviewed roughly every three to six months, with me sharing mine in return. Numbers survive contact with a busy calendar; sentiment does not.\n\n**Declaring my decision style is a kindness, not a confession.** I am collaborative by default — I want to discuss options and whiteboard the big calls in a group, which means I will rarely get stuck in one position but will also be slow to reach a verdict. Rather than let people discover that the hard way against a deadline, I say it up front, with the escape hatch attached: if you need a decision quickly, make sure I know it. I am hands-off day to day and expect people to decide without me — when someone brings me a decision, my default move is to hand it back with \"what do you want to do?\" — except early in a new initiative, when I get closer to the work on purpose so I know how to help later. Naming both halves — hands-off as the norm, hands-on as a deliberate and temporary exception — prevents the exception from reading as a broken promise.\n\n![Split illustration contrasting a default hands-off working style with a temporary hands-on exception during a new initiative.](assets/images/working-with-me/hands-off-default-hands-on-exception.jpeg)\n**Figure 2:** *Hands-off is the default and decisions come back to the person; hands-on is the deliberate, temporary exception early in something new.*\n\n**Data-driven and intuitive are not a contradiction if I say so out loud.** I want consistent data reviewed regularly so we have one honest way to see progress, and I am explicit that the goal of data is insight, not a ritual that substitutes for judgment. At the same time I use intuition deliberately on people, products, and decisions — and I tell my team what that means for them: bring the counter-argument. My gut instinct is a starting hypothesis I expect people to argue with, not a verdict to defer to; I want a good fight to a better outcome, and I say so, so that disagreement reads as the job rather than as insubordination.\n\n**A communication contract removes the guessing tax on every message.** Left undeclared, email and chat norms generate constant, low-grade anxiety — did they see it, do they expect a reply, was silence a yes. So I state the contract: I read every email within about 18 hours but only respond if something requires a direct answer or was addressed as a question — silence means \"read, no action needed,\" and if a response is owed, resend it or ask directly rather than waiting. \"FYI\" in a subject line means exactly that: for my information, no response required, and I extend the same courtesy back. Chat is for anything short, timely, or important enough to interrupt; long or non-urgent topics wait for the 1:1. None of this is a rulebook for its own sake — it is what lets people stop reading tone into my inbox behavior.\n\n**Feedback that only reaches me sideways has already failed someone.** I want feedback in both directions and I say I like receiving it, particularly when it is constructive, with a quarterly review session as the formal backstop and more timely notes whenever something comes up sooner. The commitment that matters most is the one that protects the person who isn't in the room: anyone who vents to me about a colleague gets my help turning that into a direct conversation with that colleague, not a second-hand channel that lets the complaint travel without ever reaching the person who could act on it. And underneath all of it sits the plainest line in the whole document: measure, measure, measure — good intentions do not substitute for knowing whether the work actually produced good results.\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| I keep a written \"Working with Me\" document and revise it as I change. | The document is a one-time onboarding artifact filed and forgotten. |\n| I state 1:1, team meeting, and planning cadence as explicit numbers. | \"I'm generally available\" counts as an operating cadence. |\n| I am collaborative and can be slow to decide — tell me when you need speed. | Collaborative means I will always get to a fast answer, or that slowness is someone else's problem to route around silently. |\n| I am hands-off by default, hands-on early in a new initiative, on purpose. | Getting involved early in a new initiative is me not trusting the team — it's temporary and it's how I learn where to help later. |\n| FYI means no response required; if you're owed a response, resend or ask. | Silence on an email always means approval, or that unread mail is being ignored. |\n| Venting to me about a colleague gets redirected into help telling them directly. | I'll quietly hold and file complaints about someone without that person ever hearing them. |\n\nConcretely: every person joining my team receives my current \"Working with Me\" document in their first week, and I can point to the date it was last revised. If a report cannot tell me, unprompted, how I like to receive an urgent decision or what \"FYI\" means in my inbox, the document has failed regardless of whether it exists on a drive somewhere.\n\n![Flow diagram showing an email entering an 18-hour window and branching into an FYI no-reply path or a directly-asked reply path.](assets/images/working-with-me/communication-contract-flow.jpeg)\n**Figure 3:** *The communication contract as a flow: every email gets an 18-hour read, then either no reply owed or a direct answer.*\n\n## Anti-Patterns\n\n- **The undocumented style.** New reports learn my preferences by making mistakes against them instead of reading them on day one.\n- **The stale document.** Written once, years ago, no longer describing how I actually operate — worse than no document, because it actively misleads.\n- **Vague availability instead of stated cadence.** \"My door is open\" with no 1:1 rhythm, no meeting purpose, and no planning calendar — availability without structure that anyone can plan around.\n- **Silent slowness mistaken for indecision.** I say I'm collaborative and can be slow, but never give people the \"tell me if you need it fast\" escape hatch — so urgent calls wait behind my default pace.\n- **Second-hand feedback that never travels forward.** Letting someone vent about a colleague and leaving it there, instead of turning it into help telling that colleague directly.\n- **Data without a stated purpose.** Reviewing dashboards as ritual, with no one saying out loud that the point is insight, not a replacement for judgment and a good argument.\n\n## Related Records\n\n- [Self-Awareness](self-awareness.html) — the values, work style, and strengths inventory that this document draws on; a \"Working with Me\" page is that self-awareness made legible to other people.\n- [Management Prerequisites](management-prerequisites.html) — the baseline 1:1 and meeting hygiene this document names in specific, numbered form.\n- [New Leader Onboarding](new-leader-onboarding.html) — the moment this document is handed over; it belongs in the first-week packet, not discovered later.\n- [Manager Transitions](manager-transitions.html) — when I take on a new team, rewriting this document is one of my first moves, alongside the early career session.\n- [Career Conversations](career-conversations.html) — the early career-history session and the quarterly personal-goals review this document commits to are where those conversations start.\n- [Leadership Styles](../grounded-engineering-executive/leadership-styles.html) — the engineering-executive record on styles of leading; this document is one style made explicit and personal rather than left as a label.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs how I introduce my own operating style to anyone who works with me, and I revisit it whenever my role, team, or actual working habits change enough that the document would mislead a new reader — a reorg, a new function I'm managing, or a cadence I've genuinely stopped keeping. I also treat \"can my reports quote it back to me\" as a standing test; if that test fails, the document needs revision whether or not anything else has changed.\n\n## Authoritative References\n\n- Claire Hughes Johnson, *Scaling People: Tactics for Management and Company Building* (Stripe Press, 2023) — the companion workbooks' \"Working with Claire\" and \"Working with Me Template\" (Chapter 3), which this record distills.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "6 min read"}, "blocks": [{"type": "markdown", "content": "*The working tool behind this record. The Article tab carries the rationale and anti-patterns.*\n\n## 1. My role\n\n- [ ] Describe my role and goals in plain language\n- [ ] State what I'm accountable for and to whom\n- [ ] Note anything about scope that's likely to be unclear from the title alone\n\n## 2. About me\n\n- [ ] Describe my personality in a few honest sentences\n- [ ] State my communication preferences\n- [ ] State my boundaries\n- [ ] Include at least one personal, non-work detail — the \"good craic\" note: what I'm like to be around, not just how I decide\n\n## 3. Operating approach — cadence\n\n| Cadence item | My commitment |\n| --- | --- |\n| 1:1s | Weekly or biweekly, consistent slot, tracked in a joint document (agendas, actions, goals, updates) |\n| Team meetings | Weekly, as appropriate; both an update and a decision/work-review forum; come prepared |\n| Quarterly planning sessions | Real pre-work and follow-up; kept manageable and distinct from any separate business-review meetings |\n| Early career session | Held once, in the first few months of the relationship: history, choices made, ambitions |\n| Personal goals review | Each person's top 3–5 personal goals (not team plans), reviewed roughly every 3–6 months; I share mine too |\n| What to loop me in on | State explicitly what emails, docs, or team wins I want to be added to |\n\n- [ ] 1:1 cadence stated and a joint doc set up\n- [ ] Team meeting purpose stated (update + decision/work-review)\n- [ ] Quarterly planning cadence stated\n- [ ] Early career session scheduled in the first few months\n- [ ] Personal-goals review cadence stated (3–5 goals, ~3–6 months)\n- [ ] \"What to loop me in on\" stated explicitly\n- [ ] Commitment made to personally meet everyone on the team within a few months\n\n## 4. Management style — collaborative\n\n- [ ] State that I like to discuss decisions and options as a group before deciding\n- [ ] Name the tradeoff honestly: collaborative can mean slow to decide\n- [ ] Give the escape hatch: \"if you need a decision quickly, make sure I know it\"\n\n## 5. Management style — hands-off, with a stated exception\n\n- [ ] State that I am not a micromanager and won't sweat details unless something looks off track\n- [ ] State what I do when something does look off: raise the concern, plan communication together\n- [ ] Name the exception: early in a new initiative or with a new team, I get closer to the work on purpose, so I can help later\n- [ ] State the default: I expect decisions made without me; when brought to me, I put it back with \"what do you want to do?\"\n- [ ] State the ask: tell me about big decisions brewing, even if you don't need me to make them\n\n## 6. Management style — accountable and organized\n\n- [ ] State that I take action items seriously and expect the same\n- [ ] State my preference: renegotiate a deadline before it slips, not after\n- [ ] State that I want to be told about big work efforts early, not caught last-minute\n- [ ] State the expectation of ruthless prioritization under resource constraints\n\n## 7. Management style — data-driven but intuitive\n\n- [ ] State that I like consistent, reviewed data — but not torturing the numbers\n- [ ] State the purpose of data explicitly: insight, not a substitute for judgment\n- [ ] State my agreement to shared processes over everyone inventing their own\n- [ ] State that I am intuitive about people, products, and decisions\n- [ ] State the expected response to my intuition: treat it as a hypothesis, argue it out, bring data or counter-evidence\n- [ ] State that I want to know people as whole selves, not only through work output\n\n## 8. Management style — strategic and user-oriented\n\n- [ ] State how I think about strategy: identify the big lever, the problem, the timing, the information needed\n- [ ] State the daily question I hold myself to: \"what's the most important thing I can do?\"\n- [ ] Name my own failure mode honestly (e.g., getting buried in email) and invite people to flag it\n- [ ] State my interest in direct user/customer signal even though my leverage is at scale\n\n## 9. Communication norms — 1:1s and email\n\n- [ ] State what belongs in a 1:1 vs. what can wait for a written check-in\n- [ ] State it's fine to reach out between 1:1s if needed\n- [ ] State my email reading cadence: read within about 18 hours\n- [ ] State the response rule: I only respond if asked something directly or asked a question\n- [ ] State what to do if a response is owed and hasn't arrived: resend or ask directly\n- [ ] Define \"FYI\" explicitly: for information only, no response required — and I extend the same courtesy\n\n## 10. Communication norms — chat and meeting style\n\n- [ ] State when it's fine to ping me anytime (important, timely, or short items)\n- [ ] Set expectations on my response consistency (often in meetings)\n- [ ] State the preference for a quick sync over a long email thread when that's faster\n- [ ] State my documentation preference: plans documented (slides, docs, or spreadsheets — format doesn't matter), detail expected when it matters\n- [ ] State my default involvement level in work in progress: happy to be included early, but will typically weigh in when asked or at final review\n\n## 11. Feedback and results\n\n- [ ] State that I give and receive feedback, and want it early when it's constructive\n- [ ] Name the formal backstop: an official review session each quarter\n- [ ] State my commitment to raise concerns in a timely way, not save them up\n- [ ] State the redirect rule: anyone venting to me about someone gets my help telling that person directly — not a channel that lets it stop with me\n- [ ] State the results commitment plainly: measure, measure, measure\n\n## 12. Keep it current\n\n- [ ] Note the date this document was last revised\n- [ ] Share it with every new report in their first week\n- [ ] Revisit it when role, team, or actual working habits change\n- [ ] Test it: can a report quote back my decision style and my email norms unprompted?\n- [ ] Invite the team to add to it and make it \"a little more authorized\"\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Writing the user guide to yourself as a manager — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. NOA: an earnest first-time people manager, short wavy hair, rolled-up shirt sleeves, carries a clipboard with a long checklist.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Noa stands outside Vera's office surrounded by thought bubbles of confused past guesses about how Vera works.](assets/images/working-with-me/comic-01-learned-the-hard-way.jpeg)\n**Panel 1:** *The hook: a management style nobody writes down still gets learned — just slowly and expensively.*\n\n![Comic panel: Noa anxiously stares at an unanswered email, unsure if silence means approval or neglect.](assets/images/working-with-me/comic-02-guessing-tax.jpeg)\n**Panel 2:** *The problem: without a stated contract, every silence reads as a verdict.*\n\n![Comic panel: Vera gestures at an open door leading to fog while Noa looks unimpressed.](assets/images/working-with-me/comic-03-door-is-open.jpeg)\n**Panel 3:** *The wrong way: \"my door is open\" tells a new report nothing they can plan around.*\n\n![Comic panel: Vera hands Noa a short document titled Working with Me.](assets/images/working-with-me/comic-04-working-with-me-doc.jpeg)\n**Panel 4:** *The tool: a short, first-person guide to cadence, decisions, and communication — written down, not implied.*\n\n![Comic panel: Noa at a new desk on day one, checking items off the Working with Me document alongside the checklist.](assets/images/working-with-me/comic-05-first-week-handoff.jpeg)\n**Panel 5:** *How it runs: handed to every new report in the first week, worked like a runnable checklist.*\n\n![Comic panel: Vera points at a wall clock marked 18 hours beside an inbox, explaining the FYI rule to Noa.](assets/images/working-with-me/comic-06-eighteen-hour-rule.jpeg)\n**Panel 6:** *The mechanic: read within 18 hours, respond only if asked, FYI means exactly that.*\n\n![Comic panel: Vera and Noa in an unhurried discussion over option cards, with a small escape-hatch lever labeled urgent within reach.](assets/images/working-with-me/comic-07-collaborative-but-slow.jpeg)\n**Panel 7:** *The cost: collaborative can mean slow — so the escape hatch is named up front, not discovered under deadline.*\n\n![Comic panel: Noa confidently explains Vera's working norms from memory to a new hire, while Vera smiles in the background.](assets/images/working-with-me/comic-08-quote-it-back.jpeg)\n**Panel 8:** *The closer: the document is real only if the person it describes can quote it back to you.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
