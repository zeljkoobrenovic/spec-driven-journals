<script id="data" type="application/json">{"meta": {"id": "PPL-MANAGEMENT-PREREQUISITES", "status": "draft:gray", "title": "Management Prerequisites", "date": "2026-07-28", "author": "Željko Obrenović", "permalink": "management-prerequisites", "timetoread": "6 min", "excerpt": "Before I use any advanced management tool, I check the basics: regular 1:1s that are rarely rescheduled, quarterly goals tracked together, feedback on a cadence, team meetings that earn their time, and the hiring and compensation infrastructure of my division. This checklist is the entry bar I hold myself and every manager in my organization to — and I audit myself against it before I audit anyone else.", "tags": "people management, management basics, one-on-ones, performance conversations, team meetings, compensation, career ladders", "icon": "assets/icons/management-prerequisites.png", "logo": "assets/images/management-prerequisites/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["people management", "management basics", "one-on-ones", "performance conversations", "team meetings", "compensation", "career ladders"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: None of the advanced tools in this journal work until the basics are in place. Before I coach, calibrate, or restructure, I verify the prerequisites: I know my legal responsibilities as a manager; my reports get regular, rarely-rescheduled 1:1s with two-sided agendas, quarterly goals we track together, and performance conversations on a fixed cadence covering both results and *how*; my team meetings earn their time; my division has job descriptions, interview rubrics, ladders, and a compensation philosophy people understand; and I hold myself to the same bar upward. This checklist is the entry ticket to managing in my organization — including for me.\n\n## Statement\n\nMy operating model for management prerequisites has six parts:\n\n- **Basics before tools.** No manager in my organization gets to run advanced practices — reorgs, calibration, empowerment models — while failing the baseline hygiene. The prerequisites are pass/fail, not aspirational.\n- **The 1:1 is sacred infrastructure.** Every report gets a 1:1 on a weekly or biweekly cadence that is rarely rescheduled, with an agenda both sides contribute to, notes, and agreed-upon actions.\n- **Goals and feedback run on a clock.** Every report has quarterly goals we track together, a bidirectional feedback session every three to six months, and a more formal performance conversation every 3, 6, or 12 months — the faster the company is changing, the more often — that covers both the results and *how* they were achieved.\n- **Team meetings earn their time.** I hold weekly or biweekly team meetings, show up on time, avoid rescheduling them, and make sure the time together produces something — aligned plans, decisions made, or challenges workshopped.\n- **The division runs on documents, not vibes.** Every role we hire for has a job description and an interview rubric; ladders and levels are clearly communicated; a compensation philosophy and framework exist and employees understand them.\n- **The bar applies upward.** I understand my own job description and my team's function, I have quarterly goals agreed with my own manager, I have 1:1s with them on a regular cadence, and I can access regular context on overall company priorities and goals. I am aware of my legal responsibilities as a manager in every jurisdiction I operate in.\n\n![Layered diagram showing five stacked prerequisite layers from legal responsibilities and individual reports up through team meetings and division infrastructure, with an arrow looping the top layer back to the base to show the bar applies upward.](assets/images/management-prerequisites/management-prerequisites-five-layers.jpeg)\n**Figure 1:** *Five layers, one bar — and the top layer loops back to the manager's own manager.*\n\n## How to Read This\n\nThis journal is my people-management toolkit — first-person operating records built on the companion workbooks to Claire Hughes Johnson's *Scaling People: Tactics for Management and Company Building*. This record is grounded in the workbooks' opening tool, the Management Prerequisites Checklist, read through a practitioner-executive lens: the workbook offers it as a self-check; I read it as the entry bar I hold every manager in my organization to, starting with myself. It opens this journal because the workbook opens with it — every other tool here assumes it. The runnable tool lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**Advanced tools amplify whatever they sit on — including nothing.** A career framework on top of skipped 1:1s is theater. A calibration process on top of goals nobody tracks is arithmetic on fiction. Every sophisticated practice in this journal assumes a manager who already talks to their people regularly, writes goals down, and gives feedback before the annual review forces it. That is why this checklist comes first and why it is pass/fail: a manager who fails it does not need better tools, they need to do the job.\n\n![Two-panel diagram: an amplifier on a solid foundation of basics produces clean results, while the same amplifier on a cracked foundation produces static.](assets/images/management-prerequisites/management-prerequisites-amplifier.jpeg)\n**Figure 2:** *Advanced tools amplify whatever they sit on — including nothing.*\n\n**The 1:1 mechanics matter more than the 1:1 slot.** The workbook is specific, and I keep its specifics: weekly or biweekly, *rarely rescheduled*, with agendas that include contributions from both sides, notes, and agreed-upon actions. Each clause earns its place. A 1:1 that is constantly moved tells the report exactly where they rank. An agenda only the manager fills is a status download, not a conversation. No notes and no actions means the same topics resurface forever. The cadence is the cheap part — the mechanics are what make it management.\n\n**Feedback on a clock beats feedback on courage.** Left to nerve and mood, feedback arrives late and lands badly. So the prerequisites put it on a schedule: bidirectional feedback every three to six months, and a more formal performance conversation every 3, 6, or 12 months — with the workbook's sharp qualifier that the faster the company is changing, the more often these should happen. And the conversation covers two things, not one: the results the person achieved (or didn't), and *how* they did or did not achieve them. Results without the *how* rewards toxic wins; *how* without results rewards pleasant drift.\n\n**A meeting that doesn't earn its time is a tax on everyone in it.** Team meetings are in the prerequisites for the same reason 1:1s are — they are where alignment actually happens — but the bar is not merely holding them. I show up on time, I do not casually reschedule, and the test is whether the group *benefits from the time together*: aligning on plans, making decisions, or workshopping challenges so people can help each other get the work done. A standing meeting that fails that test is not a prerequisite met; it is a prerequisite faked.\n\n**Division-level infrastructure is what makes individual management fair.** Job descriptions and interview rubrics for open roles, ladders and levels people have actually been told about, a compensation philosophy employees understand — none of this is bureaucracy. It is the difference between decisions and favors. Without a rubric, hiring is taste. Without communicated levels, promotion is politics. Without a compensation framework, pay is negotiation skill. And underneath all of it sits the least glamorous line on the checklist: knowing my legal responsibilities as a manager in the jurisdiction I operate in — because the floor under everything else is the law, not my goodwill.\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| Every report gets a weekly or biweekly 1:1 that is rarely rescheduled. | Never rescheduled — life happens; a pattern of rescheduling is the failure, not one exception. |\n| Agendas are two-sided, with notes and agreed actions. | The manager owns the agenda — the report's items carry equal weight. |\n| Quarterly goals exist and are tracked together. | Goals are set once and filed — tracking together is the requirement, not the paperwork. |\n| Formal performance conversations happen every 3, 6, or 12 months and cover results **and** how. | The annual review is enough everywhere — the faster the company changes, the shorter the cycle. |\n| Job descriptions, rubrics, ladders, and a compensation philosophy exist and are understood. | Every manager writes these alone — they are division-level infrastructure; my job is to ensure they exist and my people know them. |\n| I hold myself to the same bar with my own manager. | The prerequisites are for my reports only — a manager without goals, 1:1s, and company context cannot pass context down. |\n\n![Concentric-ring clock diagram showing weekly 1:1s and team meetings on the inner ring, quarterly goals and feedback on the middle ring, and 3/6/12 month formal reviews on the outer ring.](assets/images/management-prerequisites/management-prerequisites-cadence-clock.jpeg)\n**Figure 3:** *Every prerequisite runs on its own clock — and none of them wait for the annual review.*\n\nConcretely: I can name, for each of my reports, the date of our last 1:1, their current quarterly goals, and when our last feedback exchange and last formal performance conversation happened. Any manager in my organization should be able to do the same on the spot — that is the audit, and it takes five minutes.\n\n## Anti-Patterns\n\n- **The perpetually rescheduled 1:1.** The slot exists; the meeting rarely happens. The report reads the priority signal correctly, and trust erodes on schedule.\n- **The one-sided agenda.** The manager arrives with a list, the report arrives to listen. Without both sides contributing — and without notes and actions — it is a broadcast, not a 1:1.\n- **Goals set in January, remembered in December.** Quarterly goals that are written but never tracked together turn the performance conversation into an ambush.\n- **Feedback saved for the formal review.** Six months of accumulated observations delivered in one sitting is not feedback; it is a verdict the person never got to appeal.\n- **Results-only performance conversations.** Celebrating the numbers while ignoring *how* they were achieved teaches the organization that behavior is free.\n- **Vibes-based hiring and pay.** No job description, no rubric, no communicated levels, no compensation philosophy — every people decision becomes an argument from authority, and the manager cannot explain any of them.\n- **The exempt manager.** Holding reports to a hygiene bar while having no goals, no 1:1s, and no company context of my own — prerequisites enforced downward and waived upward.\n\n## Related Records\n\n- [Writing OKRs](writing-okrs.html) — how the quarterly goals this record requires actually get written.\n- [Performance Reviews](performance-reviews.html) — the formal performance conversation, run properly, once this record has established its cadence.\n- [Compensation Conversations](compensation-conversations.html) — the conversation that the division-level compensation philosophy makes honest.\n- [The Interview Loop](interview-loop.html) — the hiring machinery that the required job descriptions and rubrics feed.\n- [Working with Me](working-with-me.html) — the user-guide document that makes my side of the 1:1 agenda legible.\n- [Meetings](../grounded-engineering-executive/meetings.html) — the engineering-executive record on making synchronous time earn its cost; the team-meeting prerequisite in miniature.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs the baseline I verify before applying any other tool in this journal — for my own reports, for every manager in my organization, and for myself upward. I will revise it if my organization's operating cadence changes enough to shift the conversation frequencies (the workbook's own rule: faster change, shorter cycles), if a jurisdiction we operate in adds manager obligations that belong on the list, or if auditing managers against it reveals a recurring failure the checklist does not catch.\n\n## Authoritative References\n\n- Claire Hughes Johnson, *Scaling People: Tactics for Management and Company Building* (Stripe Press, 2023) — the companion workbooks' Management Prerequisites Checklist (Chapter 1), which this record distills.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "6 min read"}, "blocks": [{"type": "markdown", "content": "*The working tool behind this record. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Legal responsibilities\n\n- [ ] Know your legal responsibilities as a manager in the jurisdiction(s) in which you operate\n\n## 2. You and individual reports\n\n- [ ] Hold regular 1:1s on a weekly or biweekly cadence\n- [ ] Rarely reschedule them\n- [ ] Build agendas that include contributions from both sides\n- [ ] Take notes during the 1:1\n- [ ] Capture agreed-upon actions\n- [ ] Set quarterly goals and track them together\n- [ ] Hold bidirectional feedback sessions every three to six months\n- [ ] Hold more formal performance conversations every 3, 6, or 12 months (shorten the cycle the faster your company is changing)\n- [ ] Make sure each performance conversation covers the results the person achieved (or didn't)\n- [ ] Make sure each performance conversation also covers *how* the person did or did not achieve those results\n\n## 3. You and your teams\n\n- [ ] Hold weekly or biweekly team meetings\n- [ ] Show up on time\n- [ ] Avoid rescheduling team meetings\n- [ ] Confirm the team benefits from the time together — aligning on plans, making decisions, or workshopping challenges to help one another get the work done\n\n## 4. You and your division\n\n- [ ] Maintain a job description for each role you hire for\n- [ ] Maintain an interview rubric for each role you hire for\n- [ ] Maintain job ladders and levels\n- [ ] Communicate ladders and levels clearly to employees\n- [ ] Maintain a compensation philosophy\n- [ ] Maintain a clear compensation framework that employees understand\n\n## 5. You\n\n- [ ] Understand your own job description\n- [ ] Understand the function of your own team\n- [ ] Have quarterly goals agreed with your own manager\n- [ ] Hold 1:1s with your own manager on a regular cadence\n- [ ] Can access regular context from your manager or organizational leaders on overall company priorities and goals\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Before any advanced tool, the basics have to be in place — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. NOA: an earnest first-time people manager, short wavy hair, rolled-up shirt sleeves, carries a clipboard with a long checklist.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: a new manager unpacks a toolbox of advanced tools onto a wobbly, unfinished table.](assets/images/management-prerequisites/comic-01-new-manager-toolbox.jpeg)\n**Panel 1:** *Every advanced tool needs somewhere solid to sit.*\n\n![Comic panel: a manager runs a calibration chart in front of an empty, dusty goals board.](assets/images/management-prerequisites/comic-02-theater-on-fiction.jpeg)\n**Panel 2:** *A calibration process on top of goals nobody tracks is arithmetic on fiction.*\n\n![Comic panel: a 1:1 meeting slot crossed out and rescheduled repeatedly on a calendar while a report waits outside.](assets/images/management-prerequisites/comic-03-perpetually-rescheduled.jpeg)\n**Panel 3:** *A 1:1 that is constantly moved tells the report exactly where they rank.*\n\n![Comic panel: an executive stands at a turnstile gate labeled PREREQUISITES holding a five-part checklist.](assets/images/management-prerequisites/comic-04-pass-fail-entry-bar.jpeg)\n**Panel 4:** *Not a maturity model. A pass/fail entry bar — for every manager, starting with me.*\n\n![Comic panel: a manager and report both writing items onto a shared two-sided 1:1 agenda with notes and action items.](assets/images/management-prerequisites/comic-05-two-sided-agenda.jpeg)\n**Panel 5:** *Agendas both sides fill, notes taken, actions agreed — the mechanics are what make it management.*\n\n![Comic panel: an executive holds a two-column scorecard labeled RESULTS and HOW in front of a calendar marked every three to six months.](assets/images/management-prerequisites/comic-06-results-and-how.jpeg)\n**Panel 6:** *Results without the how rewards toxic wins; how without results rewards pleasant drift.*\n\n![Comic panel: a manager stacks binders labeled job descriptions, rubrics, ladders, and compensation philosophy onto a shelf.](assets/images/management-prerequisites/comic-07-unglamorous-infrastructure.jpeg)\n**Panel 7:** *Without a rubric, hiring is taste. Without a framework, pay is negotiation skill.*\n\n![Comic panel: a senior executive holds her own 1:1 with her manager, goals and notebook open, while a junior manager watches from the doorway.](assets/images/management-prerequisites/comic-08-bar-applies-upward.jpeg)\n**Panel 8:** *The exempt manager is the one anti-pattern with no excuse: the bar applies upward too.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
