<script id="data" type="application/json">{"meta": {"id": "PPL-WRITING-OKRS", "status": "draft:gray", "title": "Writing OKRs", "date": "2026-07-28", "author": "Željko Obrenović", "permalink": "writing-okrs", "timetoread": "8 min", "excerpt": "I hold every team to 3–5 objectives with 1–5 key results each — outcomes that describe the state of the world, not activities dressed up as goals. Every metric gets scrutinized: baseline and target, a counterweight, an owner, and a relative framing that accounts for growth we would get anyway. Mid-quarter we score green/yellow/red, and changes are documented and communicated, never quietly made.", "tags": "people management, OKRs, goal setting, metrics, planning, execution, accountability", "icon": "assets/icons/writing-okrs.png", "logo": "assets/images/writing-okrs/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["people management", "OKRs", "goal setting", "metrics", "planning", "execution", "accountability"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: I treat OKRs as a written contract between a team and the company, and I hold the contract to a fixed grammar: 3–5 objectives per team, 1–5 key results per objective, objectives that describe the state of the world at quarter's end, and key results that are measurable and binary. Every metric survives scrutiny — baseline, target, counterweight, owner, relative framing — before it is published. Most goals should score 70–80 percent; the 20–30 percent marked must-hit get 95 percent or better, even if other goals are sacrificed to get there. And once the quarter starts, changes are documented and communicated — a dropped objective is rare, and it stays in the sheet for scoring.\n\n## Statement\n\nMy operating model for writing OKRs has six parts:\n\n- **Fixed grammar, no exceptions.** Each team writes 3–5 top-level objectives with 1–5 key results per objective for the quarter. More than that is a roadmap wearing an OKR costume, and I send it back.\n- **Objectives are outcomes.** An objective answers \"Where do I want to go?\" — a description of the state of the world at the end of the quarter, focused on the user problem being solved. Activities are not objectives.\n- **Every metric survives the scrutiny checklist.** Before an OKR is published, each metric is written into the objective–metric–baseline–target table and checked: is it a leading indicator, does it have a counterweight, is there a framework to evaluate it, does it have an owner, is the target relative rather than absolute, and does it account for growth we would get anyway?\n- **Ambition is calibrated, not vibes.** Most goals are ambitious yet attainable — I expect teams to score in the 70–80 percent range over the quarter. A small number (20–30 percent of a team's goals) are marked **must-hit**, with 95 percent or better attainment expected; if a must-hit is trending behind, we sacrifice other goals in its service.\n- **Write, collaborate, publish.** Drafts are shared with closely partnered teams for agreement before they are final; publishing means changing \"Draft\" to \"On track\" in the document title and putting the OKRs where the company can see them.\n- **Mid-quarter, score and adjust in the open.** Teams score progress green/yellow/red with an on-track/off-track/at-risk assessment, discuss anything off track or at risk, and handle every change to the sheet with documentation and notification of impacted teams. Dropping an objective is rare — and the dropped objective stays in for scoring and discussion.\n\n![Diagram showing a team with 3 to 5 objective blocks, each holding 1 to 5 key-result blocks, with grayed-out locked slots beyond the cap.](assets/images/writing-okrs/okr-grammar-shape.jpeg)\n**Figure 1:** *The grammar is a shape, not a suggestion: 3-5 objectives, 1-5 key results each, and no room past the cap.*\n\n## How to Read This\n\nThis journal is my people-management toolkit — first-person operating records, each grounded in a named tool from the companion workbooks to Claire Hughes Johnson's *Scaling People: Tactics for Management and Company Building*. This record is built on three adjacent tools from the Chapter 2 workbook: the **Objectives and Metrics Checklist**, the **Writing Good OKRs** guide — written by Stripe's finance and tech-enablement teams in collaboration with CTO David Singleton — and the **Iterating and Scoring** guidance, read through a practitioner-executive lens. The runnable tool — the metrics table, the scrutiny checklist, and the scoring cadence — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**The grammar is the discipline.** The 3–5 / 1–5 limits are not bureaucratic pedantry — they are the forcing function that makes a team choose. A team that writes nine objectives has not planned; it has transcribed its backlog. Capping objectives forces the question \"what is the most important work?\", and capping key results per objective forces the question \"how will I know it happened?\". Every OKR pathology I have seen — activity lists, unmeasurable aspirations, roadmaps in disguise — starts by breaking the grammar first.\n\n**Metrics lie unless you interrogate them.** A metric that looks healthy can be hiding an easy exploit: you can grow users by giving the product away for free, which is exactly why a user metric needs a counterweight revenue metric. The scrutiny checklist exists to catch these lies before publication: a leading indicator rather than a lagging one, a named owner, a defined calculation or query so two people cannot read the same number differently, and a **relative** target — \"increase users by 20 percent, from 5,000 to 6,000\" — rather than an absolute one, because \"increase users by 1,000\" hides whether the goal is ambitious or trivial. The last check is the sharpest: does the target account for existing growth? Hitting a revenue number purely through growth from existing users means the team earned nothing.\n\n![Diagram of a balance scale: a single metric alone tips it over, but paired with a counterweight metric it balances level.](assets/images/writing-okrs/okr-metric-counterweight.jpeg)\n**Figure 2:** *A metric alone can be gamed; paired with its counterweight, it has to tell the truth.*\n\n**Calibrated ambition beats sandbagging and heroics alike.** If a team scores 100 percent every quarter, the goals were too safe; if it scores 40 percent, the plan was fiction. The 70–80 percent expectation makes ambition legible: most goals are stretches we mostly reach. The must-hit tier does the opposite job — for the 20–30 percent of goals that are hard commitments, 95 percent attainment or better is the bar, and the explicit license to sacrifice other goals in their service is what makes \"commitment\" mean something. Without the two-tier structure, every goal is implicitly negotiable and nothing is truly promised.\n\n**Publishing is part of the tool.** OKRs that live in a private doc are wishes. The write–collaborate–publish sequence has a purpose at each step: collaboration catches the cross-team dependency the drafting team forgot; publication — flipping \"Draft\" to \"On track\" in the title, on the company intranet — makes the commitment visible and gives every other team something to plan against. Objectives can be shared across teams and nest up and down the organization; none of that works if the OKRs are not findable.\n\n![Diagram of a three-stage pipeline: write, collaborate, publish, ending with a document flipping from Draft to On track on a shared board.](assets/images/writing-okrs/okr-write-collaborate-publish.jpeg)\n**Figure 3:** *Write, collaborate, publish: the sequence that turns a private draft into a commitment other teams can plan against.*\n\n**Change discipline is what keeps the sheet honest.** New information will arrive mid-quarter; the failure mode is not changing the OKRs, it is changing them silently. So every add or drop of a key result is documented and impacted teams are notified; every added objective records what work was deprioritized to make room; and a dropped objective — rare, justified only by changed constraints or genuine lack of user value — stays in the OKRs for scoring and discussion. A sheet you can quietly edit is not a commitment device; it is a diary.\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| 3–5 objectives, 1–5 key results each, per team per quarter. | Fewer goals means less work — it means the important work is actually chosen. |\n| Objectives describe the state of the world at quarter's end. | Activities disappear — they live in plans and roadmaps, below the OKR line. |\n| Key results are measurable and binary: it happened or it did not. | Judgment disappears — the causal theory linking KR to objective is still argued by humans. |\n| Expect 70–80 percent scores; must-hits get 95 percent or better. | A 75 percent score is failure — on ambitious goals it is exactly the target zone. |\n| Every metric has a baseline, target, owner, and counterweight. | Metrics replace conversation — the mid-quarter discussion is where energy gets redirected. |\n| Changes are documented and impacted teams notified; dropped objectives stay in for scoring. | OKRs are frozen — they can change, but only in the open and on the record. |\n\nConcretely: no OKR set in my organization is published without the objective–metric–baseline–target table filled in and the scrutiny checklist passed. Must-hit goals are labeled as such in the published doc. Mid-quarter, every team runs the green/yellow/red review and anything off track or at risk gets discussed until there is a recovery plan or a documented change.\n\n## Anti-Patterns\n\n- **Activity as outcome.** \"Ship the migration\" is work, not a goal. If the world looks the same after you shipped it, the objective was never an objective.\n- **The unmeasurable key result.** A KR that cannot be measured in some way is an opinion with a deadline. Measurable and binary, or it does not go in.\n- **Roadmap-as-OKRs.** Pasting the delivery plan into the OKR template. The tell is objectives that read like ticket titles and key results that read like milestones.\n- **Objective sprawl.** More than 3–5 objectives or more than 1–5 key results per objective. Beyond the cap, the team is refusing to prioritize and outsourcing that refusal to the reader.\n- **The counterweight-free metric.** A single metric optimized in isolation — users without revenue, speed without quality. Any metric you can game by giving the product away needs its counterweight named.\n- **Silent mid-quarter edits.** Swapping key results without documenting the change or telling impacted teams — or deleting a failing objective so it never gets scored. The dropped objective stays in the sheet; that is the point.\n\n## Related Records\n\n- [Team Objectives](../grounded-product-management/team-objectives.html) — the product-journal record on leaders assigning problems and teams proposing OKRs; this record supplies the writing grammar and scoring discipline that model runs on.\n- [Outcomes](../grounded-product-management/outcomes.html) — the product-journal record on outcomes over output; the \"objectives describe the state of the world\" rule is the same principle applied at goal-writing time.\n- [Measuring Engineering Organizations](../grounded-engineering-executive/measuring-engineering-organizations.html) — the engineering-journal record on measurement; the counterweight-metric and metric-owner checks are the same hygiene applied to goal metrics.\n- [Quarterly Business Reviews](quarterly-business-reviews.html) — where scored OKRs meet the business narrative each quarter; this record produces the inputs that review consumes.\n- [Team Charter](team-charter.html) — the mission and plan an objective must trace to; the \"related to your team's mission\" check points here.\n- [Leadership Team Updates](leadership-team-updates.html) — the ongoing communication channel that carries mid-quarter OKR status between scoring sessions.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs how teams in my organization write, publish, score, and change their quarterly OKRs. I will revise it when a full planning cycle shows the ambition bands (70–80 percent, must-hit at 95 percent) need retuning for my context, when the scrutiny checklist misses a class of metric failure in practice, or when the cadence of mid-quarter scoring proves too coarse or too heavy for the organization's size.\n\n## Authoritative References\n\n- Claire Hughes Johnson, *Scaling People: Tactics for Management and Company Building* (Stripe Press, 2023) — the companion workbooks: the Chapter 2 \"Objectives and Metrics Checklist,\" \"Writing Good OKRs,\" and \"Iterating and Scoring\" tools this record is built on.\n- The \"Writing Good OKRs\" guide was written by Stripe's finance and tech-enablement teams in collaboration with Stripe CTO David Singleton, whose credit the workbook carries.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "9 min read"}, "blocks": [{"type": "markdown", "content": "*The working tool behind this record. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Objectives and metrics table\n\nFor each objective, fill in one row before you publish:\n\n| Objective | Metric | Baseline | Target |\n| --- | --- | --- | --- |\n| | | | |\n| | | | |\n| | | | |\n\n- [ ] Every objective has at least one row filled in\n- [ ] Baseline reflects where the metric stands today, not an assumption\n- [ ] Target is stated, not left as \"improve\" or \"grow\"\n\n## 2. Scrutinize the objectives\n\n- [ ] Inspirational?\n- [ ] Actionable by your team?\n- [ ] Related to your team's mission and vision?\n- [ ] Related to the company's priorities and goals?\n\n## 3. Check the objectives are SMART\n\n- [ ] Specific\n- [ ] Measurable\n- [ ] Achievable\n- [ ] Results-oriented\n- [ ] Targeted\n\n## 4. Scrutinize each metric\n\n- [ ] Is the metric a leading indicator?\n- [ ] Does it have a counterweight metric? (e.g., a user-growth metric needs a\n      counterweight revenue metric — you could always grow users by giving\n      the product away for free)\n- [ ] Is there a framework to evaluate the metric — a calculation or a query?\n- [ ] Does the metric have a named owner?\n- [ ] Is the target relative, not absolute? (e.g., not \"increase users by\n      1,000\" but \"increase users by 20 percent, from 5,000 to 6,000\")\n- [ ] Does the target account for existing user growth? (hitting a revenue\n      target purely from existing-user growth earns nothing new)\n\n## 5. Write, collaborate, publish\n\n- [ ] **Write**: note the top-level 3–5 objectives, with 1–5 key results per\n      objective, that the team is committed to accomplishing this quarter\n- [ ] Identify which objectives are must-hit\n- [ ] **Collaborate**: for every team you partner with closely, get feedback\n      and confirm agreement on the OKRs set\n- [ ] **Publish**: when done, change \"Draft\" to \"On track\" in the document\n      title\n- [ ] Publish OKRs where the company can find them (intranet or your\n      document-sharing method), in progress\n\n## 6. Calibrate ambition\n\n- [ ] Most goals are ambitious yet attainable — expect to score 70–80 percent\n      over the quarter across the majority of goals\n- [ ] Mark 20–30 percent of a team's goals as **must-hit** hard commitments\n- [ ] Expect must-hit goals to reach 95 percent attainment or better\n- [ ] If a must-hit goal is trending behind, sacrifice other (non-must-hit)\n      goals to protect it\n\n## 7. Best practices for good objectives\n\n- [ ] Objective answers \"Where do I want to go?\"\n- [ ] Objective is an outcome — the state of the world at the end of the\n      quarter — not an activity\n- [ ] Objective focuses on the user problem being solved\n- [ ] No more than 3–5 objectives per team\n- [ ] Objective charts intent and direction, not a task list\n- [ ] Objective can be long-term, spanning several quarters or years\n- [ ] Objective nests up and down the organization to some degree\n- [ ] Objective is ambitious and open to some interpretation and debate\n- [ ] Objective matters — the best objectives are inspirational\n- [ ] Labeled aspirational (70 percent) or committed (100 percent) explicitly\n- [ ] Shared across teams where relevant\n\n## 8. Best practices for good key results\n\n- [ ] Key result is a concrete definition of success\n- [ ] Key result answers \"How will I pace myself to see if I'm on track?\"\n- [ ] 1–5 key results per objective\n- [ ] Key result lists an outcome, not an activity\n- [ ] Key result is measurable and binary — it either happened or it did not,\n      not open to interpretation\n- [ ] Key result flows from a plausible causal theory connecting it to the\n      objective and to your own team's work\n- [ ] Key result helps build a shared model of reality across teams\n- [ ] Key result should compound over time where possible\n\n## 9. Common pitfalls — check none apply\n\n- [ ] An activity or action is being used as an outcome\n- [ ] A key result can't be measured in any way\n- [ ] The roadmap has been turned directly into objectives and key results\n- [ ] More than 3–5 objectives, or more than 1–5 key results per objective\n\n## 10. Mid-quarter scoring\n\n- [ ] Get the team together mid-quarter to discuss progress to date\n- [ ] Give each objective/key result an approximate score using green,\n      yellow, red (or a percentage-based score if that fits the team better)\n- [ ] Pair the color score with an assessment: on track, off track, or at\n      risk\n- [ ] Discuss every item scored off track or at risk\n- [ ] Find ways to redirect energy and build in time to recover\n\n## 11. Handling changes in information and priorities\n\n- [ ] Agree on a common practice for tracking and handling changes before\n      you need one\n- [ ] Communicate every change to any impacted team\n- [ ] Clearly document what changed and why\n- [ ] If adding or dropping a key result: document the decision and notify\n      impacted teams\n- [ ] If adding an objective (e.g., an urgent shift in the world): document\n      whether it deprioritized existing work, and if so, what was deprioritized\n- [ ] Treat dropping an objective as rare — only for a real change in\n      constraints or because it truly isn't providing value to users\n- [ ] When an objective is dropped, stop working on it but keep it in the\n      OKRs for scoring and discussion — it does not disappear from the sheet\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "OKRs are a written contract, not a wish list — how to write, scrutinize, and score them, in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. NOA: an earnest first-time people manager, short wavy hair, rolled-up shirt sleeves, carries a clipboard with a long checklist.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Noa hands Vera a long unrolled scroll of nine goals while Vera looks skeptical.](assets/images/writing-okrs/comic-01-nine-objectives.jpeg)\n**Panel 1:** *The hook: nine objectives is not a plan — it is a backlog wearing a costume.*\n\n![Comic panel: Noa points to a checklist item that reads like a task while Vera asks what actually changed.](assets/images/writing-okrs/comic-02-activity-as-outcome.jpeg)\n**Panel 2:** *The problem: 'ship the migration' is work, not a goal — if the world looks the same, it was never an objective.*\n\n![Comic panel: Vera peels back a corner of an OKR template taped over Noa's delivery roadmap.](assets/images/writing-okrs/comic-03-roadmap-in-disguise.jpeg)\n**Panel 3:** *The wrong way: pasting the roadmap into the OKR template fools no one for long.*\n\n![Comic panel: Vera writes '3-5 objectives, 1-5 key results' on a whiteboard while Noa trims her list.](assets/images/writing-okrs/comic-04-fixed-grammar.jpeg)\n**Panel 4:** *The principle: 3-5 objectives, 1-5 key results each — the cap forces the choice.*\n\n![Comic panel: Noa checks off scrutiny items on her clipboard while Vera watches approvingly.](assets/images/writing-okrs/comic-05-scrutiny-checklist.jpeg)\n**Panel 5:** *How it runs: every metric is scrutinized — leading indicator, counterweight, owner, relative target — before it is published.*\n\n![Comic panel: two dials, one at 70-80 percent and a smaller amber one pinned at 95 percent labeled must-hit.](assets/images/writing-okrs/comic-06-must-hit-ninety-five.jpeg)\n**Panel 6:** *The mechanic: 70-80 percent is the target zone, but must-hit goals are held to 95 percent or better.*\n\n![Comic panel: Vera stops Noa from erasing a failing key result, pointing to a documented-changes log instead.](assets/images/writing-okrs/comic-07-silent-edit-cost.jpeg)\n**Panel 7:** *The cost: nothing gets quietly erased — every change is documented, and a dropped objective still gets scored.*\n\n![Comic panel: Noa posts an OKR document titled 'On track' to a shared board where other teams' documents nest beneath it.](assets/images/writing-okrs/comic-08-published-on-track.jpeg)\n**Panel 8:** *The closer: publishing turns a private draft into a commitment the whole company can see and plan against.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
