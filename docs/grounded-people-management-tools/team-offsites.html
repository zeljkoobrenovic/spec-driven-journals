<script id="data" type="application/json">{"meta": {"id": "PPL-TEAM-OFFSITES", "status": "draft:gray", "title": "Team Offsites", "date": "2026-07-28", "author": "Željko Obrenović", "permalink": "team-offsites", "timetoread": "8 min", "excerpt": "I treat a team offsite as a high-cost meeting, not a reward: a full day pulled off the calendar for every attendee, which means it earns its cost or it does not happen. I run every offsite on a five-stage planning timeline from a month-plus out to the follow-through, a fixed five-part day structure, a named owner for every session, and pre-work distributed in advance — and I close every offsite with a feedback form and tracked action items, not applause.", "tags": "people management, offsites, meeting design, facilitation, team development, planning", "icon": "assets/icons/team-offsites.png", "logo": "assets/images/team-offsites/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["people management", "offsites", "meeting design", "facilitation", "team development", "planning"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: I treat a team offsite as a high-cost meeting: a full day, sometimes more, pulled off every attendee's calendar and often paid for in travel and venue as well as time. A meeting that expensive gets a goal, a date set a month or more out, an agenda with a named owner per section, pre-work sent ahead, and tracked action items after — or it does not happen. The five-stage planning timeline and the five-part day structure are not bureaucracy on top of the offsite; they are what makes \"we had a great offsite\" a reproducible outcome instead of a lucky one.\n\n## Statement\n\nMy operating model for team offsites has five parts:\n\n- **An offsite earns its cost or it does not happen.** Before I book a room, I can state the goal in a sentence. No goal, no offsite — a day off is a perk; a day off with a stated purpose is an offsite.\n- **The timeline runs backward from the date, in five stages.** 1+ month before, 1 month before, 1 week before, 1 day before, and the day itself each have a fixed set of deliverables. I do not compress them under time pressure — I move the date instead.\n- **Every agenda section has a named owner.** Each session gets a DRI assigned at the 1-month mark, not improvised on the day. The DRI runs their section and owns its pre-work.\n- **The day has one fixed shape: welcome, check-in, icebreaker, sessions, check-out.** I do not skip the check-in or the check-out to fit in one more session — they are where the room's energy and its takeaways actually get managed.\n- **Nothing closes without follow-through.** Every offsite ends with a feedback form and a set of action items tracked to their assigned DRIs until complete. An offsite that produces no action items produced nothing durable.\n\n![Timeline diagram showing five planning stages counting backward from the offsite date, plus a follow-through stage after.](assets/images/team-offsites/offsite-backward-timeline.jpeg)\n**Figure 1:** *The planning timeline runs backward from the date, in five fixed stages, plus follow-through after.*\n\n## How to Read This\n\nThis journal is my people-management toolkit, grounded in the companion workbooks to Claire Hughes Johnson's *Scaling People: Tactics for Management and Company Building* (Stripe Press, 2023), read through a practitioner-executive lens. This record is grounded in the workbooks' Chapter 4 tool, \"Planning and Running Your Offsite\" — the planning checklist, the day-of-offsite templates, and the worked agenda example. The runnable versions of all three — the full backward-running timeline, the welcome-email template, and the sample agenda table with time, length, and facilitator columns — live in the **Checklist** tab.\n\n## Rationale\n\n**An offsite is one of the most expensive meetings I ever hold.** Every attendee loses a full day of individual work, often more once travel is counted, and the organization often pays for venue, food, and materials on top of that. I judge an offsite by the same test I judge any expensive meeting by: does the value produced exceed the cost paid? A day away that produces good feelings and no decisions has failed that test regardless of how well-catered the lunch was. Stating the goal before I book the room is what keeps me honest about that test — if I cannot write the goal in a sentence, I am not ready to spend the day.\n\n**The five-stage timeline is what turns \"let's do an offsite\" into a plan.** Working backward from the date — 1+ month, 1 month, 1 week, 1 day, day-of, after — each stage has a small, fixed set of deliverables: goals and a date first; food, a finalized agenda, and a DRI per section at the month mark; finalized materials, a full run-through with DRIs, and the agenda and pre-reads sent to the team at the week mark; a welcome email and supplies the day before. Compressing these stages under time pressure is where offsites fail quietly — an agenda finalized the night before has no DRI who has actually rehearsed it, and a team that receives pre-reads the morning of the offsite has not actually read them. When I am tempted to compress the timeline, I move the date instead.\n\n**A DRI per section is the single mechanic that prevents an offsite from becoming one person's monologue.** The worked agenda example assigns a different facilitator to nearly every session — a check-in owner, a work-style-assessment owner, a results-retrospective owner, a strategic-pillars owner, a goals-and-DRIs owner, a wrap-up owner. Distributing ownership does two things at once: it spreads the preparation burden so no single person is building the entire day alone, and it gives the team visible proof that more than one person is invested in the day succeeding. A session with no named owner is the session most likely to run long, wander, or get cut.\n\n![Split diagram contrasting one organizer holding every session card alone versus five owners each holding one session card.](assets/images/team-offsites/offsite-one-owner-vs-dri-per-section.jpeg)\n**Figure 2:** *A named DRI per section spreads the load and proves more than one person is invested in the day.*\n\n**Pre-work distributed in advance is what makes the strategic sessions actually work.** The worked agenda flags one session explicitly — \"decide on strategic pillars for this year\" — with a parenthetical the workbook does not treat as optional: pre-reads required. A room cannot debate strategic pillars cold in an hour; it can debate them productively if everyone arrived having already read the material. The same logic runs through the whole timeline: pre-work templates go to DRIs at the month mark so they have three weeks to prepare, and pre-reads go to the full team a week out so nobody opens the agenda for the first time at 9:30 a.m.\n\n**The fixed five-part day structure exists because energy and takeaways do not manage themselves.** Welcome, check-in, icebreaker, sessions, check-out is not decoration around the \"real\" work in the sessions — the check-in (\"share expectations for the day\") sets what the room is actually there to do, the icebreaker gets a group of people who may not talk daily into a working mode together, and the check-out (\"how did we do?\") is where the day's value gets named out loud instead of assumed. A day that is wall-to-wall sessions with no check-in or check-out is a series of meetings stapled together, not an offsite.\n\n![Flow diagram of the five fixed day stages: welcome, check-in, icebreaker, sessions, check-out, with check-in and check-out bookending the day.](assets/images/team-offsites/offsite-five-part-day-flow.jpeg)\n**Figure 3:** *The day has one fixed shape — check-in and check-out are not padding around the sessions, they manage the room's energy and takeaways.*\n\n**The close is where most of the value either gets captured or evaporates.** Notes and action items go to their assigned DRIs, a feedback form goes to every participant asking them to rate the offsite, and action items are tracked until complete — not until the next Monday's enthusiasm fades. An offsite with no tracked action items afterward produced a good day and nothing else; the day itself was never the point.\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| An offsite needs a stated goal before it gets a date. | Any team gathering with food and a change of scenery counts as an offsite. |\n| The planning timeline runs 1+ month, 1 month, 1 week, 1 day, day-of, after. | The timeline can be compressed under time pressure — compression is a signal to move the date. |\n| Every agenda section has a named DRI assigned a month out. | The organizer runs every session personally — distributing ownership is the point. |\n| The day always has welcome, check-in, icebreaker, sessions, check-out. | Check-in and check-out are optional if the agenda is tight — they are where energy and takeaways are managed. |\n| Strategic sessions get pre-reads sent in advance. | Debating strategy cold in the room is an acceptable substitute for preparation. |\n| Every offsite closes with a feedback form and tracked action items. | The offsite's value is the day itself — value is what gets tracked to completion afterward. |\n\nConcretely: before I schedule an offsite I can state its goal in one sentence, I set the date at least a month out, and I have assigned a DRI to every agenda section by the one-month mark. Pre-reads for any strategic decision reach the team at least a week before the day. Every offsite I run ends with a feedback form sent to participants and a list of action items assigned to named DRIs, and I do not consider the offsite closed until those items are complete.\n\n## Anti-Patterns\n\n- **The offsite with no stated goal.** A day off-site that cannot be justified in one sentence is a perk mislabeled as a working session.\n- **The rushed timeline.** Agenda finalized the week of, pre-reads sent the morning of — the team arrives unprepared and the \"strategic\" session becomes a first read-through instead of a decision.\n- **The one-person agenda.** A single organizer builds and runs every session alone; the room experiences a monologue with breaks, not a team offsite.\n- **Skipping the check-in or check-out to fit in \"one more session.\"** The day gains content and loses the moments where expectations and takeaways actually get named.\n- **Strategic decisions debated cold.** No pre-reads, no pre-work — the room spends the session getting oriented instead of deciding.\n- **The offsite that ends at the wrap-up.** Notes are taken, nobody owns the action items, and three months later nothing from the day has changed.\n\n## Related Records\n\n- [Team Charter](team-charter.html) — the durable written identity a strategic offsite session (pillars, goals) can revisit or revise; the charter is what persists, the offsite is where it gets worked on.\n- [Writing OKRs](writing-okrs.html) — the objectives discipline behind a \"finalize goals for the quarter and DRIs\" session, when an offsite includes one.\n- [Meetings](../grounded-engineering-executive/meetings.html) — the engineering-journal record on everyday meeting hygiene; this record is the same discipline applied to the highest-cost meeting format a team runs.\n- [Gelling Your Engineering Leadership Team](../grounded-engineering-executive/gelling-your-engineering-leadership-team.html) — the engineering-journal record on building leadership-team cohesion; a well-run offsite is one of the concrete mechanisms that produces it.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs how I plan and run any team or leadership offsite: the backward-running timeline, the fixed day structure, DRI assignment per session, and the closing discipline of feedback and tracked action items. I revisit it whenever an offsite's action items go untracked past their close date, whenever a timeline stage gets compressed and the day suffers for it, or whenever the fixed day structure stops fitting the kind of offsite I am running.\n\n## Authoritative References\n\n- Claire Hughes Johnson, *Scaling People: Tactics for Management and Company Building* (Stripe Press, 2023) — the companion workbooks, Chapter 4: \"Planning and Running Your Offsite,\" the tool this record distills.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "6 min read"}, "blocks": [{"type": "markdown", "content": "*The working tool behind this record. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Set the date and the goal\n\n- [ ] Write the offsite's goal in one sentence before doing anything else\n- [ ] Set the date, time, and length\n- [ ] Record the date of offsite: __________________\n\n## 2. Planning timeline — 1+ month before\n\n- [ ] Set goals and objectives\n- [ ] Schedule date, time, and length\n- [ ] Start brainstorming the agenda with your team\n- [ ] Book space\n\n## 3. Planning timeline — 1 month before\n\n- [ ] Order food and beverages\n- [ ] Finalize the agenda and assign each section to a DRI\n- [ ] Share rough pre-work templates with DRIs\n\n## 4. Planning timeline — 1 week before\n\n- [ ] Finalize materials\n- [ ] Run through the agenda and content with DRIs\n- [ ] Send the agenda, pre-reads, and any pre-work to the team\n- [ ] Check that all meals are scheduled and confirm your headcount\n- [ ] Confirm venue setup and any materials needed with the offsite space\n- [ ] Determine how to enter the space (entrance code, or someone lets you in)\n- [ ] Duplicate the session template for each planned session\n- [ ] Duplicate the icebreaker template for each planned icebreaker\n\n## 5. Planning timeline — 1 day before\n\n- [ ] Send a welcome email to the team (venue location, how to get there, how to enter the space, reminder about pre-reads and pre-work)\n- [ ] Confirm details with vendors\n- [ ] Collect supplies from the office (pens, markers, sticky notes, flip charts, chargers, AV equipment)\n\n## 6. Day of offsite\n\n- [ ] Have your team check in\n- [ ] Follow the agenda for the rest of the day\n\n## 7. After the offsite\n\n- [ ] Send notes and action items to assigned DRIs\n- [ ] Send a feedback form to all participants and ask them to rate the offsite\n- [ ] Track all action items until complete\n\n## 8. Day-of-offsite structure\n\n- [ ] 1. Offsite welcome\n- [ ] 2. Check-in exercise\n- [ ] 3. Icebreaker\n- [ ] 4. Session(s)\n- [ ] 5. Check-out exercise\n\n## 9. Offsite welcome-email template\n\n**Opening line**\n\n- [ ] \"Welcome to the [offsite name]!\"\n- [ ] \"To get started, I'll share a bit more context about why we've gotten this group together and how we'll be using the time. And don't worry — we've got plenty of scheduled breaks and social time.\"\n\n**Purpose**\n\n- [ ] \"We're here because [explain the purpose of the offsite].\"\n\n**Logistics**\n\n- [ ] Share documentation and directions ahead of the offsite\n- [ ] Tell participants what they should bring\n- [ ] On the day, share the Wi-Fi access code\n- [ ] On the day, share directions to the restroom\n- [ ] On the day, share where the group will be eating lunch\n- [ ] Leave space for notes on anything else logistics-specific\n\n## 10. Worked agenda example\n\n| Session | What we'll be doing | Time | Length | Facilitator |\n| --- | --- | --- | --- | --- |\n| Check-in | Share expectations for the day | 9:30 a.m. | 30 minutes | Cheryl Davis |\n| Session 1 | Work style assessment discussion | 10 a.m. | 1 hour | Bethel Musa |\n| Break | Take a stretch | 11 a.m. | 15 minutes | — |\n| Session 2 | Last year results retrospective | 11:15 a.m. | 1 hour | Lola Aisca |\n| Lunch | Eat! | 12:15 p.m. | 1 hour | — |\n| Post-lunch exercise | Big-picture brainstorm | 1:15 p.m. | 30 minutes | Alan Chowansky |\n| Session 3 | Decide on strategic pillars for this year (pre-reads required) | 1:45 p.m. | 1 hour | Maria Marquis |\n| Break | Check some emails | 2:45 p.m. | 15 minutes | — |\n| Session 4 | Finalize goals for the quarter and DRIs | 3 p.m. | 1 hour | Fang Li |\n| Wrap-up and check-out | How did we do? | 4 p.m. | 1 hour | Cheryl Davis |\n| Social | Social time and team-building activity | 5 p.m. | — | Felix Marlin |\n\n## 11. Before you book the room — the one-sentence test\n\n- [ ] Can you state the offsite's goal in one sentence?\n- [ ] If not, do not schedule the date yet — resolve the goal first\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "An offsite is a high-cost meeting, not a reward — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. NOA: an earnest first-time people manager, short wavy hair, rolled-up shirt sleeves, carries a clipboard with a long checklist.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Noa pins a scenic offsite flyer to a corkboard while Vera looks skeptical.](assets/images/team-offsites/comic-01-a-nice-change-of-scenery.jpeg)\n**Panel 1:** *The hook: a change of scenery is not a reason to book a room.*\n\n![Comic panel: Noa stands in an empty offsite venue holding a blank clipboard page among leftover snacks.](assets/images/team-offsites/comic-02-a-day-off-with-no-goal.jpeg)\n**Panel 2:** *The problem: a day off produces nothing durable without a stated goal.*\n\n![Comic panel: Noa alone at night, buried in papers, frantically finishing an agenda before the offsite.](assets/images/team-offsites/comic-03-the-rushed-timeline.jpeg)\n**Panel 3:** *The wrong way: a rushed, one-person agenda with no one else invested.*\n\n![Comic panel: Vera writes GOAL on a whiteboard while Noa watches with her clipboard.](assets/images/team-offsites/comic-04-a-meeting-that-earns-its-cost.jpeg)\n**Panel 4:** *The principle: an offsite earns its cost or it does not happen.*\n\n![Comic panel: Vera points at a five-stage backward-running timeline on the wall as Noa checks her clipboard.](assets/images/team-offsites/comic-05-the-backward-timeline.jpeg)\n**Panel 5:** *How it runs: five stages counting back from the date, each with a named owner.*\n\n![Comic panel: Noa lines up five labeled cards for the day's structure while Vera nods.](assets/images/team-offsites/comic-06-the-five-part-day.jpeg)\n**Panel 6:** *The mechanic: welcome, check-in, icebreaker, sessions, check-out — never skipped.*\n\n![Comic panel: split scene of a team calmly reading pre-reads versus the same team confused debating cold.](assets/images/team-offsites/comic-07-pre-reads-or-cold.jpeg)\n**Panel 7:** *The cost: skip the pre-reads and the room debates strategy cold.*\n\n![Comic panel: Noa checks off the final tracked action item on a board weeks after the offsite while Vera smiles.](assets/images/team-offsites/comic-08-tracked-until-complete.jpeg)\n**Panel 8:** *The closer: tracked to complete — the day was never the point.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
