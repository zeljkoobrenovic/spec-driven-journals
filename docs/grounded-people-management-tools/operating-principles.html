<script id="data" type="application/json">{"meta": {"id": "PPL-OPERATING-PRINCIPLES", "status": "draft:gray", "title": "Operating Principles", "date": "2026-07-28", "author": "Željko Obrenović", "permalink": "operating-principles", "timetoread": "7 min", "excerpt": "I do not let my organization's culture live only in people's heads. I write it down in three plain sections — how we work, who we are, and what I expect of leaders — and I date the page, because the version we ship this year will not be the version we ship in three. Stripe's December 2021 set is the model I study for form; the words have to be ours.", "tags": "people management, operating principles, culture, leadership, organizational values, written culture", "icon": "assets/icons/operating-principles.png", "logo": "assets/images/operating-principles/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["people management", "operating principles", "culture", "leadership", "organizational values", "written culture"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: My organization's culture is not what I say in an all-hands — it is what I write down and hold people to. I put it in three short, named sections: how we work, who we are, and what I expect of leaders, each with a handful of two- or three-sentence principles that name a real tension and take a side. I date the page, because the set is a snapshot, not scripture. I study Stripe's December 2021 operating principles as a model of the form — I do not copy its words.\n\n## Statement\n\nMy operating model for written operating principles has five parts:\n\n- **Three sections, not one list.** How we work covers method — the behaviors that get things done. Who we are covers character — the disposition I want in every hire regardless of role. What I expect of leaders is a separate, harder section: leaders are held to demands the rest of the organization is not.\n- **Name it, then earn the name in two or three sentences.** Every principle gets a short, memorable name (two or three words) followed by a tight paragraph that states the tension it resolves and which side it takes. A principle that reads as safe on every axis was not worth writing down.\n- **Study the model, write my own words.** I read Stripe's set closely for its shape — how many principles per section, how much space each gets, how leaders are treated as a distinct tier — and then I write principles that name my organization's actual tensions. Copying another company's language produces a document nobody believes, because it was never tested against our decisions.\n- **Date the page and expect to revise it.** The set carries a visible \"as of\" date. An organization that is still changing should expect its principles to change with it; a set that has not been touched in years is either finished growing or has stopped being read.\n- **Keep a secondary layer of slogans, lightly.** Alongside the numbered principles, a short list of memorable one-line slogans — the \"classic\" phrases that predate or outlive any particular version of the formal set — can carry cultural memory without demanding the same rigor as the named principles.\n\n![Diagram of a layered operating-principles document: How We Work, Who We Are, and a narrower, sharper Leaders tier on top, with a slogan ribbon alongside and a date tag at the top.](assets/images/operating-principles/operating-principles-three-tier-shape.jpeg)\n**Figure 1:** *Three named sections stacked, with leaders as the narrowest, sharpest tier — not one undifferentiated list.*\n\n## How to Read This\n\nThis journal is my people-management toolkit, grounded in the companion workbooks to Claire Hughes Johnson's *Scaling People: Tactics for Management and Company Building*. This record is grounded in \"Stripe's Operating Principles\" — the worked example the workbook presents as of December 2021 — read through a practitioner-executive lens: the workbook offers it as a model to study before writing your own; I read it as the standard for what a written culture document should look like, and the discipline of writing one for my own organization rather than adopting someone else's. The runnable write-your-own kit lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**Unwritten culture is whatever the loudest person in the room says it is.** If \"how we work\" only exists as institutional folklore, it drifts with every reorg and gets reinvented by every new leader who wasn't there for the founding conversations. Writing it down — three named sections, a small number of principles each — fixes a reference point that survives turnover. The point is not the document; the point is that disagreements about \"is this how we operate\" become answerable instead of argued from vibes.\n\n**The three-part shape does real work.** Method, character, and leadership are different questions and blurring them produces a document that reads as generic values-poster filler. \"How we work\" is about method under pressure — speed versus polish, feedback versus certainty, ownership versus process. \"Who we are\" is about disposition — the traits I want in a hire regardless of what they build. \"Leaders\" is a separate, harder tier: a demand layer, not an aspiration layer, because the people with the most leverage over everyone else's experience of the culture need the sharpest and least negotiable expectations. A set that only has one section, or that folds leadership expectations into the general list, quietly excuses leaders from the harder half of the bargain.\n\n**Naming plus a short paragraph is the right unit of length.** A principle needs a name short enough to become shorthand in a meeting (\"that's not politely relentless\") and a body short enough to fit in one glance — two or three sentences, not a page. The name is what people actually remember and invoke months later; the paragraph is what keeps the name from becoming an empty slogan by stating, concretely, which side of a real tradeoff the principle takes. A principle that could describe any company, or that avoids taking a side, has failed the test before it is even used.\n\n**A studied model beats an inherited one.** The temptation with any famous example — Stripe's or anyone else's — is to paste the words into a handbook and call it done. That fails for a mechanical reason: a principle only means something once it has been tested against a real decision your organization actually had to make, and a borrowed sentence was tested against someone else's decisions, not yours. So I treat a published set the way I'd treat a strong essay: read it for structure, argument density, and what it dares to say plainly, then close the tab and write from what I actually believe about how my organization should behave under pressure.\n\n![Diagram contrasting copying a published example straight into a handbook (broken seal) versus studying its form and testing new principles against real decisions (solid seal).](assets/images/operating-principles/operating-principles-copied-vs-studied.jpeg)\n**Figure 2:** *Study the shape, test the words against your own decisions — copying the example is the dead end.*\n\n**The date stamp is an admission, not a formality.** Every version of a written culture document is provisional — true for this stage of the company, this market, this team's scars. Marking it \"as of\" a date does two things: it tells the reader they are looking at a snapshot, not a constitution, and it commits me to revisiting it rather than letting a stale version calcify into unquestioned scripture. An organization proud enough of its principles to publish them should be honest enough to admit they will need rewriting.\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| Culture is written down in three named sections: how we work, who we are, what leaders are held to. | One undifferentiated list of values covers the same ground — method, character, and leadership expectations are different questions. |\n| Each principle gets a short name and a two- or three-sentence body that takes a side. | Longer is better — a principle that needs a page to explain has not found its point yet. |\n| Leaders get a separate, harder section of demands. | Leadership expectations are folded into the general list — leaders answer to a distinct, sharper bar. |\n| I study a strong published example for its form. | I adopt another company's words — a borrowed principle was tested against someone else's decisions. |\n| The document carries a visible date and gets revisited. | The set is finished once published — it is a living document, not a plaque. |\n| A short slogan layer can carry memory alongside the formal set. | The slogans replace the principles — they are a lighter secondary layer, not the substance. |\n\nConcretely: my organization's operating principles live in a single page, three headed sections, each principle two or three sentences under a short bold name, with a visible \"as of\" date at the top. I can point to a real decision each principle would have changed if we had ignored it — if I cannot, the principle is decoration and needs rewriting.\n\n![Diagram of a closed loop: a principle is tested against a real decision, then kept if it would have changed the outcome or sent back for rewriting if not.](assets/images/operating-principles/operating-principles-decision-test-loop.jpeg)\n**Figure 3:** *Every principle runs this loop: tested against a real decision, kept if it would have changed the outcome, rewritten if not.*\n\n## Anti-Patterns\n\n- **The values poster.** Aspirational words with no teeth — nothing in the document would ever cost the organization a convenient decision. Every principle passes every test, which means none of them are principles.\n- **Copy-paste culture.** Another company's operating principles, lightly reworded, presented as ours. Nobody in the room can explain why line three matters here, because it was never tested against our decisions.\n- **One list, no tiers.** Method, character, and leadership expectations mashed into a single undifferentiated bullet list, so leaders escape the sharper bar they should be held to.\n- **The undated relic.** A set written three reorgs ago, never revisited, quietly ignored because everyone knows it no longer describes how the place actually runs.\n- **All slogan, no substance.** A wall of punchy one-liners with no named-principle layer behind them — memorable, but with nothing concrete enough to invoke in an actual disagreement.\n- **Leader exemption.** A leaders' section that reads as softer or vaguer than the sections applied to everyone else, instead of the sharpest, least negotiable tier in the document.\n\n## Related Records\n\n- [Organizational Values](../grounded-engineering-executive/organizational-values.html) — the engineering-journal record on how values are lived and tested day to day; this record is the tool for writing the document those values get judged against.\n- [Team Charter](team-charter.html) — a single team's mission and scope; operating principles apply organization-wide, a team charter applies to one team's slice of it.\n- [Working with Me](working-with-me.html) — one leader's personal user guide; operating principles are the shared standard every leader is measured against, including through their own user guide.\n- [Management Prerequisites](management-prerequisites.html) — the baseline hygiene every manager must clear before any written principle means anything in practice.\n- [Performance Reviews](performance-reviews.html) — where \"who we are\" and the leaders' demands actually get tested against a person's year.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs how I write and maintain my organization's operating principles document — not the specific words of any one version, which will change. I will revise it when a revision of the actual principles document teaches me something about the form (a section that didn't earn its keep, a principle nobody ever invoked), or when I notice leaders being held to a softer bar than the rest of the organization.\n\n## Authoritative References\n\n- Claire Hughes Johnson, *Scaling People: Tactics for Management and Company Building* (Stripe Press, 2023) — the companion workbooks' \"Stripe's Operating Principles\" exercise (Chapter 2), presenting Stripe's operating principles as of December 2021 as the worked example this record studies.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "9 min read"}, "blocks": [{"type": "markdown", "content": "*The working tool behind this record: a write-your-own kit for a set of operating principles. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Before you write\n\n- [ ] Confirm this is worth writing down — you have real, recurring tensions people currently resolve by guessing\n- [ ] Gather 5–10 recent decisions or disagreements that would have gone differently with a written principle\n- [ ] Read a strong published example (e.g. Stripe's operating principles) for its **form**, not its words: section count, principles per section, sentence length, whether leaders get a separate tier\n- [ ] Rule out copy-paste: if you cannot rewrite every line from scratch in your own words, you are not ready to publish\n- [ ] Decide who drafts (usually the senior leadership team) and who reviews before it ships\n\n## 2. Section 1 — How we work\n\n*Method: the behaviors that get things done under pressure.*\n\n- [ ] Draft 4–6 principles covering how your organization actually operates, e.g.:\n  - [ ] Whose needs come first when priorities conflict\n  - [ ] Speed and bias for action vs. deliberation\n  - [ ] Craft and quality standards\n  - [ ] How feedback and challenge are invited\n  - [ ] What \"outstanding results\" and accountability mean here\n- [ ] For each: write a short bold name (2–3 words) plus a 2–3 sentence body\n- [ ] Test each principle: does it take a side on a real tradeoff, or would every competitor happily sign it too?\n\n## 3. Section 2 — Who we are\n\n*Character: the disposition expected regardless of role.*\n\n- [ ] Draft 4–6 principles covering the traits you want in every hire, e.g.:\n  - [ ] Curiosity vs. certainty\n  - [ ] Resilience and how the organization treats failure\n  - [ ] Humility vs. defensiveness about current practice\n  - [ ] Optimism vs. cynicism about hard problems\n  - [ ] Energy and warmth the organization wants to be known for\n- [ ] For each: name plus 2–3 sentence body, same discipline as Section 1\n- [ ] Check these read as character, not method — if a \"who we are\" line is really about process, move it to Section 1\n\n## 4. Section 3 — And leaders\n\n*A separate, harder tier: demands, not aspirations.*\n\n- [ ] Draft 5–7 principles that apply only to people who lead others, e.g.:\n  - [ ] Talent bar — obligation to recruit and hold a high bar, and to act on mishires\n  - [ ] Ambition horizon — next year, several years out, a decade out\n  - [ ] Pace and energy leaders are expected to set for their teams\n  - [ ] Decision-making and accountability under murky ownership\n  - [ ] Translating context into a clear, referenced plan\n  - [ ] Persistence on hard problems, across team boundaries\n- [ ] Verify this section reads sharper and less negotiable than Sections 1–2 — if it reads softer, rewrite it\n- [ ] Confirm every current leader, including yourself, could be evaluated against each line\n\n## 5. Optional layer — Classic slogans\n\n- [ ] Collect 5–10 short, memorable one-liners that carry cultural memory (may predate the current formal set)\n- [ ] Keep each to a single sentence — no bodies, no explanation\n- [ ] Label this layer explicitly as secondary/lighter-weight, not equivalent to the named principles\n- [ ] Drop any slogan that has quietly become false\n\n## 6. Quality tests (run against every principle)\n\n| Test | Pass condition |\n| --- | --- |\n| Takes a side | Names which side of a real tradeoff wins, not both |\n| Not generic | Could not be lifted verbatim into a competitor's document without editing |\n| Tested against a decision | You can name a real past decision this principle would have changed |\n| Right length | One short bold name + 2–3 sentences, not a paragraph or a single word |\n| Leaders held tighter | The leaders' section reads as more demanding than the general sections, never softer |\n| Memorable | Someone could invoke the name in a meeting six months from now and be understood |\n\n## 7. Publish and date it\n\n- [ ] Add a visible \"as of [month, year]\" date stamp at the top of the document\n- [ ] Confirm the three section headers are present: how we work / who we are / and leaders\n- [ ] Circulate to leadership for a final read against Section 6's tests before wide distribution\n- [ ] Store the document somewhere every current and future employee can find it\n- [ ] Set a recurring review trigger (see Section 8) rather than treating publication as final\n\n## 8. Revisit triggers\n\n- [ ] A principle has been quoted zero times in six months — cut it or rewrite it\n- [ ] A leader is visibly not held to the leaders' section — fix the enforcement gap before rewriting the words\n- [ ] The organization's stage, size, or market has shifted enough that a past tradeoff no longer applies\n- [ ] A new leadership team member can't explain what a principle means in practice — the wording has failed\n- [ ] It has been more than 12–18 months since the date stamp was last updated\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Culture that only lives in people's heads is whatever the loudest voice says it is — write it down instead, in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. NOA: an earnest first-time people manager, short wavy hair, rolled-up shirt sleeves, carries a clipboard with a long checklist.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Noa stands confused as three colleagues loudly argue different versions of how the team works.](assets/images/operating-principles/comic-01-loudest-voice.jpeg)\n**Panel 1:** *Unwritten culture is whatever the loudest person in the room says it is.*\n\n![Comic panel: a culture poster on the wall keeps redrawing itself differently as new leaders walk through a revolving reorg door.](assets/images/operating-principles/comic-02-reorg-drift.jpeg)\n**Panel 2:** *Folklore drifts with every reorg — nothing survives turnover unless it's written down.*\n\n![Comic panel: Noa photocopies Stripe's principles onto the company handbook while Vera raises a hand in caution.](assets/images/operating-principles/comic-03-copy-paste.jpeg)\n**Panel 3:** *Copy-paste culture: a borrowed sentence was tested against someone else's decisions, not yours.*\n\n![Comic panel: Vera writes three whiteboard headers, How We Work, Who We Are, and Leaders, as Noa copies them down.](assets/images/operating-principles/comic-04-three-sections.jpeg)\n**Panel 4:** *Three sections, not one list — and leaders get the harder tier.*\n\n![Comic panel: Noa writes a short bold-named principle on an index card with a two-sentence body underneath, as Vera nods.](assets/images/operating-principles/comic-05-name-and-body.jpeg)\n**Panel 5:** *Name it, then earn the name in two or three sentences that take a side.*\n\n![Comic panel: Vera points to six numbered leader demands on Noa's clipboard, including talent bar and a multi-year ambition horizon.](assets/images/operating-principles/comic-06-six-demands.jpeg)\n**Panel 6:** *Six demands, not aspirations — talent bar, ambition horizon, pace, accountability, clarity, persistence.*\n\n![Comic panel: Noa stamps a date onto the principles document while Vera holds up a calendar with a circled future review date.](assets/images/operating-principles/comic-07-date-stamp.jpeg)\n**Panel 7:** *The date stamp is an admission: this is a snapshot, and revising it is the cost of keeping it honest.*\n\n![Comic panel: two colleagues calmly point at the pinned, dated operating principles page to settle a disagreement.](assets/images/operating-principles/comic-08-answerable.jpeg)\n**Panel 8:** *Written down, a culture disagreement becomes answerable instead of argued from vibes.*\n"}]}]}</script>

        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
