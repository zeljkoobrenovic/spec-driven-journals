<script id="data" type="application/json">{"meta": {"id": "PPL-MANAGER-TRANSITIONS", "status": "draft:gray", "title": "Manager Transitions", "date": "2026-07-28", "author": "Željko Obrenović", "permalink": "manager-transitions", "timetoread": "7 min", "excerpt": "I treat every manager change as a moment where a report's development context is either handed over deliberately or lost. Before anyone moves teams, the current manager previews the change, convenes a three-way transition meeting against a fixed agenda, and the new manager owns the follow-up. I don't let reports restart from zero.", "tags": "people management, manager transitions, onboarding, 1:1s, organizational change, continuity", "icon": "assets/icons/manager-transitions.png", "logo": "assets/images/manager-transitions/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["people management", "manager transitions", "onboarding", "1:1s", "organizational change", "continuity"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: I treat a manager change as a moment where a report's development context is either handed over deliberately or lost — and I don't let reports restart from zero. Every internal transfer runs a fixed three-step sequence: the current manager previews the move with the person directly, the current manager convenes a three-way transition meeting against a written agenda that surfaces scope, strengths, ambitions, and candid feedback, and the new manager owns follow-up on whatever comes out of it, because they own the relationship going forward.\n\n## Statement\n\nMy operating model for manager transitions has four parts:\n\n- **The context is an asset, and assets get handed over.** Scope, projects, goals, strengths, development areas, ambitions, and preferred ways of working do not live in a system of record — they live in the outgoing manager's head. A transition without a deliberate handoff throws that asset away.\n- **The current manager previews before anyone else is looped in.** The person hears about their own transition from their own manager, first, in a direct conversation — not via a calendar invite with a new manager already cc'd.\n- **The three-way meeting has a fixed agenda, not a vibe.** One meeting, three people, five discussion points, always in the same order: current scope, strengths and development areas, ambitions, ways of working plus feedback on me, and a recap of next steps.\n- **Ownership of follow-up transfers completely, on schedule.** The moment the transition meeting ends, the new manager owns the relationship and whatever action items came out of it. I do not stay the shadow manager.\n\n![Diagram of a three-step timeline: Preview, Three-Way Meeting, Follow-Up, each with a different owner icon.](assets/images/manager-transitions/manager-transitions-three-step-timeline.jpeg)\n**Figure 1:** *One fixed sequence, three distinct owners: preview, three-way meeting, follow-up.*\n\n## How to Read This\n\nThis journal is my people-management toolkit, grounded in the companion workbooks to Claire Hughes Johnson's *Scaling People: Tactics for Management and Company Building* (Stripe Press, 2023), read through a practitioner-executive lens. This record is grounded in the workbook's Manager Transitions Guide (Chapter 3): a three-step process for when a report moves to another team internally. The runnable tool — the preview checklist and the email agenda template — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**Internal moves are where context quietly evaporates.** An external hire gets an onboarding plan by default; an internal transfer often gets nothing more than an updated line in the org chart. That asymmetry is backwards — the internal mover has months or years of performance history, working style, and half-finished development plans that a new manager has no way to reconstruct on their own. Without a structured handoff, the new manager starts blind and the person effectively restarts their development from zero, regardless of how much progress they had already made.\n\n**The preview conversation is about dignity, not process.** Before any meeting gets scheduled, the current manager tells the person directly: confirm the formal move date in the HR system, say when the new manager gains access to their information and performance reviews, give a heads-up that a transition meeting is coming, and take their questions. Skipping this step and going straight to a three-way invite treats the person as a line item being reassigned rather than someone owed a direct conversation about their own career.\n\n**A written agenda turns a fuzzy handoff into a repeatable one.** Left unstructured, transition meetings drift into small talk or a one-sided data dump from the outgoing manager. The workbook's email template fixes the order: the employee shares their current scope, projects, and goals; the employee shares their own view of strengths and development areas, with the outgoing manager adding what the two of them have already worked on together; the three of them discuss, together, how the new manager can support the person's ambitions; the employee shares preferred ways of working, plus whatever feedback about the outgoing manager would be useful for the new one to hear; and the group recaps concrete next steps before closing. The order matters — the employee speaks first on scope and on their own strengths, so the meeting starts from their self-assessment rather than a handoff briefing about them.\n\n![Split diagram contrasting a one-sided briefing about an absent employee with a three-way meeting where the employee speaks first.](assets/images/manager-transitions/manager-transitions-briefing-vs-self-assessment.jpeg)\n**Figure 2:** *The order matters: the employee speaks first on their own scope and strengths, not last.*\n\n**Feedback on the old manager is the hardest line and the most valuable one.** Asking a person to offer, in front of both managers, feedback on how the outgoing manager worked with them is uncomfortable by design — and it is exactly the information a new manager cannot get any other way. Cutting this item to keep the meeting comfortable throws away the most useful signal in the whole agenda.\n\n**Clean ownership handoff prevents the worst failure mode: two managers, no manager.** Once the transition meeting closes, the new manager owns every action item and owns the relationship going forward. I do not let the old manager stay involved as an informal backchannel — that produces exactly the confusion a transition is supposed to prevent, where the person is unsure who actually has authority over their next review, their next raise, or their next hard conversation.\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| Every internal move gets a preview conversation, a three-way meeting, and a named follow-up owner. | A transition is a Slack message and an updated reporting line. |\n| The current manager convenes and runs the transition meeting. | The new manager is left to introduce themselves cold and reconstruct history on their own. |\n| The employee speaks first on their own scope and strengths. | The meeting opens with the outgoing manager briefing the new one about the person as if they weren't in the room. |\n| Feedback on the outgoing manager is an explicit agenda item. | Feedback on the outgoing manager is optional, or saved for an exit interview format. |\n| The new manager owns follow-up from the moment the meeting ends. | The outgoing manager stays the de facto manager for a transition period. |\n| The formal HR-system date and new-manager access are confirmed before the meeting. | The paperwork catches up whenever it catches up, independent of the conversation. |\n\nConcretely: I expect every internal transfer in my organization to produce, before the person's official start date on the new team, a preview conversation that already happened, a scheduled three-way meeting using the fixed agenda, and a visible list of next steps that the new manager has already claimed.\n\n![Map showing ownership of the relationship folder passing cleanly from the outgoing manager to the new manager at the transition meeting's end, with no overlap.](assets/images/manager-transitions/manager-transitions-ownership-handoff-map.jpeg)\n**Figure 3:** *Ownership moves at one clean line — no overlapping shadow-manager period.*\n\n## Anti-Patterns\n\n- **The silent handoff.** The person learns about their own transition secondhand, or in a group message that also includes the new manager.\n- **The one-way briefing.** The outgoing manager tells the new manager everything about the person, in a side conversation the person is never part of. Context transfers; consent and voice do not.\n- **The agenda-free meeting.** A well-intentioned coffee chat that never gets to ambitions, ways of working, or feedback, because nobody wrote down what the meeting was actually for.\n- **The sanitized handoff.** Strengths get mentioned; development areas and honest feedback on the old manager get quietly dropped to keep the mood pleasant.\n- **The lingering shadow manager.** The outgoing manager keeps fielding questions and approving requests weeks after the transition meeting, because ownership was never cleanly stated.\n- **The dropped action item.** Next steps get recapped in the meeting and then nobody follows up, because no single owner was named before everyone left the room.\n\n## Related Records\n\n- [Career Conversations](career-conversations.html) — the recurring development dialogue this transition must reconnect to; the new manager inherits the thread, not a blank page.\n- [Working with Me](working-with-me.html) — how I operate with a direct report day to day; preferred ways of working is exactly the item the transition meeting is meant to carry forward.\n- [New Leader Onboarding](new-leader-onboarding.html) — the parallel record for when a *leader* arrives into new scope; this one is the mirror case of an individual report moving between existing teams.\n- [Management Prerequisites](management-prerequisites.html) — the baseline expectations every manager owes their reports; a transition is a stress test of whether those baselines actually travel with the person.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs how I run internal manager transitions in my organization: the preview conversation, the three-way meeting and its agenda, and the follow-up ownership handoff. I revisit it if transitions in practice regularly surface a sixth discussion point the agenda is missing, if the preview-conversation step keeps getting skipped despite being named here, or if reorganizations at scale (many people moving at once) show the one-at-a-time meeting format does not hold up.\n\n## Authoritative References\n\n- Claire Hughes Johnson, *Scaling People: Tactics for Management and Company Building* (Stripe Press, 2023) — the companion workbooks, Chapter 3, \"Manager Transitions Guide\" (pp. 78–79), the tool this record distills.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "5 min read"}, "blocks": [{"type": "markdown", "content": "*The working tool behind this record. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Current manager previews the transition\n\n- [ ] Meet with the individual one-on-one, before anyone else is looped in\n- [ ] Let them know about the transition\n- [ ] Confirm the formal date of the move in the HR system\n- [ ] Confirm when the new manager will gain access to their information and performance reviews\n- [ ] Give a heads-up that a transition meeting with them and their new manager is coming\n- [ ] State that the meeting will cover current role and projects, plus strengths and development plans\n- [ ] Answer or acknowledge any questions the person raises\n\n## 2. Current manager schedules the three-way transition meeting\n\n- [ ] Invite the employee and the new manager\n- [ ] Allow enough time to cover all agenda topics and for questions\n- [ ] Send the meeting invite using the agenda template below\n\n### Transition meeting email template\n\n| Field | Content |\n| --- | --- |\n| To | Employee |\n| From | Current manager |\n| Cc | New manager |\n| Subject | Manager transition meeting |\n\n> I'm looking forward to the transition meeting on [date]. The main goal is to make sure [new manager] is well-informed by both of us on your work scope and work in flight, and has an overview of past performance and development conversations we've had. Let's plan to cover the following:\n\n- [ ] **Current scope** — employee shares current work responsibilities, projects, and goals; current manager adds anything that might help the new manager\n- [ ] **Strengths and development areas** — employee shares thoughts on their own strengths and areas for development; current manager adds what the two of them have discussed and worked on together\n- [ ] **Supporting ambitions** — three-way discussion on how the new manager can support the employee's ambitions and development areas\n- [ ] **Ways of working and feedback** — employee shares preferred ways of working for the new manager to hear and reinforce (or learn from); employee also shares any feedback on the current manager that would be useful for the new manager to hear\n- [ ] **Next steps** — all three recap the concrete next steps that came out of the discussion\n\n> Let me know if you have questions. I look forward to the discussion.\n\n## 3. New manager follows up\n\n- [ ] Follow up on any action items that came out of the transition meeting\n- [ ] Take ownership of the relationship going forward\n- [ ] Confirm access to the employee's information and past reviews once the HR-system date passes\n- [ ] Reconnect the employee's development plan to their stated ambitions from the transition meeting\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "A manager change should be a deliberate handoff, not a reset button — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. NOA: an earnest first-time people manager, short wavy hair, rolled-up shirt sleeves, carries a clipboard with a long checklist.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Noa stands at a new desk holding an empty folder while a stack of old development files sits abandoned behind them.](assets/images/manager-transitions/comic-01-restart-from-zero.jpeg)\n**Panel 1:** *The hook: a manager change can quietly erase months of context.*\n\n![Comic panel: Vera taps her temple with a thought bubble showing scope, strengths, and ambitions stored only in her mind.](assets/images/manager-transitions/comic-02-context-in-one-head.jpeg)\n**Panel 2:** *The problem: context lives in one manager's head, and heads don't hand themselves over.*\n\n![Comic panel: Noa reads a calendar invite with a new manager already cc'd while Vera walks away without a word.](assets/images/manager-transitions/comic-03-cold-cc-email.jpeg)\n**Panel 3:** *The wrong way: a silent handoff, where the person is the last to know.*\n\n![Comic panel: Vera draws three connected whiteboard boxes labeled Preview, Three-Way Meeting, and Follow-Up while Noa watches.](assets/images/manager-transitions/comic-04-three-step-sequence.jpeg)\n**Panel 4:** *The principle: a deliberate three-step handoff, not a passive introduction.*\n\n![Comic panel: Vera sits one-on-one with an employee in a quiet room, speaking warmly before anyone else is looped in.](assets/images/manager-transitions/comic-05-preview-conversation.jpeg)\n**Panel 5:** *How it runs: the current manager previews the move, one-on-one, first.*\n\n![Comic panel: Noa holds up a clipboard with a five-point numbered agenda during a three-way meeting with Vera and a new manager.](assets/images/manager-transitions/comic-06-five-point-agenda.jpeg)\n**Panel 6:** *The mechanic: one meeting, three people, five agenda points, always the same order.*\n\n![Comic panel: an employee speaks candidly about the outgoing manager at the three-way table while Vera listens and Noa takes notes.](assets/images/manager-transitions/comic-07-hardest-agenda-item.jpeg)\n**Panel 7:** *The cost: honest feedback on the old manager is required, not optional.*\n\n![Comic panel: Noa holds an action-item list with her name as sole owner while Vera waves goodbye and steps out of frame.](assets/images/manager-transitions/comic-08-clean-ownership.jpeg)\n**Panel 8:** *The closer: ownership transfers completely — no shadow manager, no restart from zero.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
