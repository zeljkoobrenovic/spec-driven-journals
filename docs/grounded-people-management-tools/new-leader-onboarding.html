<script id="data" type="application/json">{"meta": {"id": "PPL-NEW-LEADER-ONBOARDING", "status": "draft:gray", "title": "New Leader Onboarding", "date": "2026-07-28", "author": "Željko Obrenović", "permalink": "new-leader-onboarding", "timetoread": "7 min", "excerpt": "I do not let a new leader's first ninety days happen by accident. Every senior hire gets a New Leader Experience: welcome emails and pre-reads before day one, a named support cast, a leadership assessment, a coach for six months, and a 360° review at the ninety-day mark that turns first impressions into a coaching plan. Senior people fail from missing context and missing feedback, not missing skill, so I engineer both in.", "tags": "people management, onboarding, new leader experience, executive onboarding, coaching, feedback", "icon": "assets/icons/new-leader-onboarding.png", "logo": "assets/images/new-leader-onboarding/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["people management", "onboarding", "new leader experience", "executive onboarding", "coaching", "feedback"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: A new leader's first ninety days are too important to leave to whoever happens to grab lunch with them. I run a New Leader Experience: welcome emails and pre-reads before the start date, a named support cast — hiring manager, people partner, onboarding point person, spin-up buddy, and guide — a phased schedule of meetings from offer acceptance through month three, a leadership assessment, a coach for six months, and a 360° review at ninety days that turns first impressions into coaching goals. Senior hires fail from missing context and missing feedback, not missing skill, and this is the structure that supplies both.\n\n## Statement\n\nMy operating model for onboarding a new leader has five parts:\n\n- **Onboarding is a designed experience, not a calendar of intros.** Every new leader gets a New Leader Experience (NLE): welcome communications, prescheduled meetings and pre-reads, a leadership assessment, a coach, suggested first-month actions, and a 90-day 360° review. None of it is left to whoever remembers to reach out.\n- **The support cast is named before day one.** A hiring manager, a people partner, an onboarding point person, a spin-up buddy for day-to-day questions, and a guide — an expert outside the new leader's own team who offers a safe space for questions and observations — are assigned and introduced before the leader starts.\n- **The schedule is phased and pre-populated.** From the moment the offer is accepted through roughly three months in, I know who does what, week by week: welcome emails, weekly cast check-ins in week 1, team deep dives and stakeholder meetings in weeks 2–4, the leadership assessment around week 4, broader organizational immersion in weeks 5–8, and documentation and reflection from week 9 onward.\n- **The assessment measures the leader, not just their team.** The Hogan Personality Inventory runs early — around week 4 — so the leader gets a structured read on their own tendencies before those tendencies get set by habit in the new role.\n- **Ninety days closes the loop with a coach, not just a checklist.** A 360° review at roughly three months synthesizes how the first quarter actually landed, translates that into coaching goals, and hands the leader a matched coach for their first session — the feedback loop the rest of onboarding was building toward.\n\n![Diagram of a five-stage onboarding pipeline from offer acceptance to the 90-day review, fed by five named support-cast roles.](assets/images/new-leader-onboarding/nle-shape-offer-to-90-days.jpeg)\n**Figure 1:** *The New Leader Experience is one designed pipeline, not five disconnected favors.*\n\n## How to Read This\n\nThis journal is my people-management toolkit — first-person operating records built on the companion workbooks to Claire Hughes Johnson's *Scaling People: Tactics for Management and Company Building*. This record is grounded in the workbooks' New Leader Experience tool (Chapter 3), read through a practitioner-executive lens: the workbook offers it as a spin-up template for the team receiving a new leader; I read it as the onboarding standard I hold my organization to for every leadership hire, promotion, or transfer into a new remit. The runnable tool — the full phased WHO/WHAT schedule — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**Senior hires fail from missing context and missing feedback, not missing skill.** I did not hire this person for their competence to be in question — I hired them because it wasn't. What derails senior hires is different: nobody told them how decisions actually get made here, who the real stakeholders are, or how their first quarter is actually landing until it's too late to adjust. The New Leader Experience exists because those two failure modes — context and feedback — are structural problems, and structural problems need a structure, not good intentions.\n\n**A named cast beats an implied one.** The workbook is specific about who shows up around a new leader: the hiring manager, a people partner, an onboarding point person who coordinates the mechanics, a spin-up buddy for the day-to-day questions too small to escalate, and a guide — someone outside the new leader's own team who can offer a safe space for questions and observations without the politics of reporting-line proximity. Each role has a distinct job. Collapse them into \"the manager will handle it\" and the leader has no one to ask the questions a manager is the wrong person to hear.\n\n![Side-by-side diagram contrasting one overloaded manager role against five named support roles each with a distinct job.](assets/images/new-leader-onboarding/implied-cast-vs-named-cast.jpeg)\n**Figure 2:** *One overloaded role leaves questions unanswered; five named roles each answer a different kind of question.*\n\n**The schedule is pre-populated so nobody has to invent it under pressure.** From the moment the offer is accepted, the onboarding point person is already assigning roles, sending welcome material, and scheduling meetings — weeks before the leader's first day. Week 1 is the cast: manager, buddy, guide, and people partner, checking in weekly for the first four weeks. Weeks 2 through 4 widen to team deep dives, new direct reports, skip-levels, and the finance and recruiting partners the leader will need. Week 4 adds the people-transition meetings — the new leader meeting each direct report's *former* manager, closing a context gap that otherwise takes months to surface on its own — plus the Hogan assessment. Weeks 5 through 8 widen further still: key partners, other divisional leaders, company-wide forums, and a standing reminder to document first impressions while they're still fresh and useful, before the new leader's eye adjusts to what's normal here. Nothing here is invented in week 3 because someone finally asked what should happen next.\n\n**First impressions decay if nobody captures them.** A new leader's outside perspective is valuable for exactly as long as it's still outside — every week they stay, the organization's blind spots become their blind spots too. That's why the schedule builds in an explicit reminder to document first impressions and reflections during weeks 5–8, and why week 9 onward turns that into artifacts: a personal development plan, a \"Working with Me\" document, and 90-day reflections. Waiting until the 90-day review to ask \"what did you notice\" wastes the two months where the noticing was still sharp.\n\n**The 90-day review is where the loop closes.** Everything before this point is setup. At roughly three months, the people partner runs 360° interviews, synthesizes what they hear, and turns it into coaching goals — not a verdict, a plan. Org dev matches a coach to those goals, and the coach schedules the first session. The leader who started with pre-reads and a support cast now gets a structured, evidence-based read on how the first quarter actually went, from the people who watched it happen, with a coach lined up to work the gaps. Onboarding that stops at week 1 orientation and skips this step never finds out whether it worked.\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| Every new leader gets a named cast — manager, people partner, onboarding point person, spin-up buddy, guide — before day one. | The hiring manager can handle it alone — each role exists because the manager is the wrong person for some of these conversations. |\n| The onboarding schedule is pre-populated from offer acceptance through ~3 months. | The schedule is improvised week by week — the point is that nobody has to invent it under time pressure. |\n| The Hogan assessment runs around week 4, early in the leader's tenure. | The assessment is a gate the leader must pass — it's a self-awareness tool, not a scorecard for anyone else. |\n| First impressions are documented during weeks 5–8, while they're still fresh. | Reflection waits for the 90-day review — by then the leader has already stopped noticing half of what they'd have flagged in week 6. |\n| A 90-day 360° review synthesizes findings into coaching goals and a matched coach. | The 360° is a performance verdict — it feeds coaching, not a judgment of whether the hire was right. |\n| The guide is someone outside the new leader's own team. | Any senior colleague can be the guide — the value is specifically in having no reporting-line stake in the answers. |\n\n![Circular feedback-loop diagram showing first impressions flowing into a 360 review, then coaching goals, then a matched coach, looping back around.](assets/images/new-leader-onboarding/ninety-day-feedback-loop.jpeg)\n**Figure 3:** *The 90-day review is not an ending — it closes a feedback loop back into the leader's growth.*\n\nConcretely: before any new leader's start date, I can name their manager, people partner, onboarding point person, spin-up buddy, and guide, and I can point to a populated week-by-week schedule through month three. At the 90-day mark, I expect a synthesized set of coaching goals and a scheduled first coaching session — not a shrug and \"how's it going.\"\n\n## Anti-Patterns\n\n- **Onboarding as vibes.** No named cast, no schedule, just an assumption that smart senior people will figure it out. They will — slower, and with avoidable scar tissue.\n- **The absent guide.** Skipping the outside-the-team guide because \"their manager can answer anything.\" Some things a new leader will only ask someone with nothing to lose by hearing the question.\n- **Front-loading everything into week 1.** Cramming team deep dives, stakeholder meetings, and the assessment into the first week because onboarding \"should be fast.\" The workbook's own phasing spreads this across three months for a reason — a new leader absorbs context in stages, not all at once.\n- **Skipping the people-transition meetings.** Letting new direct reports' former managers disappear without a handoff conversation. The context that leaves with them is expensive to reconstruct later.\n- **First impressions never captured.** No reminder, no artifact — the freshest, most valuable outside perspective the organization will ever get from this person evaporates by month four.\n- **The 360° that never happens.** Onboarding budget and attention run out at week 4, and the 90-day review — the actual feedback loop — quietly does not happen.\n- **Coaching as an afterthought.** Treating the coach match as a nice-to-have that org dev gets to eventually, rather than a scheduled deliverable of the 90-day process.\n\n## Related Records\n\n- [Manager Transitions](manager-transitions.html) — the adjacent record for a leader moving into a *different* role or team rather than joining fresh; shares the coaching and context concerns but not the same cast or schedule.\n- [Working with Me](working-with-me.html) — the document the NLE schedule asks every new leader to produce at week 9+, so their own working style becomes legible fast.\n- [Career Conversations](career-conversations.html) — where the 90-day coaching goals eventually connect to a longer-run development and career conversation.\n- [Management Prerequisites](management-prerequisites.html) — the baseline 1:1 and feedback infrastructure the NLE's weekly check-ins and 360° review assume is already running.\n- [Onboarding Peer Executives](../grounded-engineering-executive/onboarding-peer-executives.html) — the engineering-executive journal's record on onboarding peer-level executives; a closely related structure told from the peer's-eye view rather than the organization's.\n- [Engineering Onboarding](../grounded-engineering-executive/engineering-onboarding.html) — the engineering-executive journal's record on onboarding engineers into a codebase and team; a different onboarding problem — context and judgment here, code and systems there.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs how I onboard a new leader — hired, promoted, or transferred into a new remit — from offer acceptance through the 90-day review. I will revise it if the phased schedule needs different cadences for different levels of seniority, if the assessment tool changes, or if a 90-day review surfaces a systemic gap this checklist does not catch.\n\n## Authoritative References\n\n- Claire Hughes Johnson, *Scaling People: Tactics for Management and Company Building* (Stripe Press, 2023) — the companion workbooks' New Leader Experience tool (Chapter 3), which this record distills.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "6 min read"}, "blocks": [{"type": "markdown", "content": "*The working tool behind this record. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Before you start: assign the cast\n\n- [ ] Assign a hiring manager (already in place from the hire)\n- [ ] Assign a people partner\n- [ ] Assign an onboarding point person to coordinate the mechanics\n- [ ] Assign a spin-up buddy — a manager or team member who answers day-to-day questions\n- [ ] Assign a guide — an expert **outside** the new leader's own team who offers a safe space for questions and observations\n- [ ] Confirm the new leader will meet all five before or during week 1\n\n## 2. When the new leader accepts the offer\n\n| Who | What |\n| --- | --- |\n| Recruiter | Send the leadership hiring welcome/onboarding email, including an onboarding 101 FAQ sheet and upcoming vacations |\n\n## 3. ~2 weeks before start date\n\n| Who | What |\n| --- | --- |\n| Onboarding point person | Confirm any unique needs for the new leader with the leadership recruiter |\n| Onboarding point person | Send a welcome email introducing the new leader to their onboarding support team |\n| Hiring manager + people partner | Assign the onboarding point person (can be admin support) |\n| Onboarding point person | Populate the new-leader checklist and coordinate across the onboarding support team — buddy, guide, and hiring manager (async via Slack and/or meetings is fine) |\n| Onboarding point person + new leader | Schedule the full meeting sequence below (week 1 through week 9+) |\n\n- [ ] Recruiter has sent the leadership welcome/onboarding email\n- [ ] Onboarding point person confirmed unique needs with the recruiter\n- [ ] Onboarding point person sent the welcome email to the support team\n- [ ] Hiring manager and people partner assigned the onboarding point person\n- [ ] Onboarding point person populated the checklist and coordinated the cast\n- [ ] Full meeting sequence (weeks 1–9+) is scheduled in advance\n\n## 4. Scheduled meeting sequence\n\n- [ ] **Week 1**: manager, onboarding buddy, guide, and people partner — weekly, for four weeks\n- [ ] **Weeks 2–4**: team deep dives, new direct reports, new skip-level reports, finance business partner, recruiting partner; add the new leader to the team's all-hands meeting\n- [ ] **Week 4**: people-transition meetings with new direct reports and their former managers; possibly take the Hogan assessment and review results\n- [ ] **Weeks 5–8**: key partners, other divisional leaders, team immersion with the people partner; add to company-wide leadership and manager forums; meet with the leadership recruiter; add a reminder to document first impressions and reflections\n- [ ] **Week 9 onward**: reminders to create a personal development plan and a \"Working with Me\" document; share 90-day reflections\n\n## 5. ~1 week before start date\n\n| Who | What |\n| --- | --- |\n| Hiring manager | Send an introduction/welcome email introducing the new leader to the company |\n\n- [ ] Hiring manager sent the company-wide introduction email\n\n## 6. First week (leader also joins company-wide spin-up/onboarding sessions)\n\n| Who | What |\n| --- | --- |\n| People partner or onboarding point person | Send the leader their welcome doc: onboarding support team, this checklist, important 1:1s, team deep dives, suggested reading (company and division level), suggested comms channels (Slack channels, email groups) |\n\n- [ ] Welcome doc sent, covering support team, checklist, 1:1s, deep dives, reading, and comms channels\n- [ ] New leader added to company-wide spin-up/onboarding sessions\n\n## 7. ~3 months in\n\n| Who | What |\n| --- | --- |\n| People partner | Conduct 360° review interviews, synthesize findings, discuss and identify goals for coaching |\n| Org dev | Complete the coach-matching process |\n| Coach | Schedule the first coaching session |\n\n- [ ] 360° review interviews conducted\n- [ ] Findings synthesized into a written set of coaching goals\n- [ ] Coach matched by org dev\n- [ ] First coaching session scheduled\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "A new leader's first ninety days should not happen by accident — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. NOA: an earnest first-time people manager, short wavy hair, rolled-up shirt sleeves, carries a clipboard with a long checklist.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: a new leader stands alone in an empty office doorway on their first day, no one there to greet them.](assets/images/new-leader-onboarding/comic-01-alone-on-day-one.jpeg)\n**Panel 1:** *The hook: a new leader's first ninety days should not happen by accident.*\n\n![Comic panel: a coworker shrugs and walks away from Noa, who studies a wall calendar covered in scattered sticky notes.](assets/images/new-leader-onboarding/comic-02-whoever-grabs-lunch.jpeg)\n**Panel 2:** *The problem: senior hires fail from missing context and missing feedback, not missing skill.*\n\n![Comic panel: Noa sits buried behind a towering stack of folders all dumped onto the desk in week one.](assets/images/new-leader-onboarding/comic-03-week-one-cram.jpeg)\n**Panel 3:** *The wrong way: cramming three months of context into week one.*\n\n![Comic panel: Vera points to a whiteboard listing five named onboarding roles while Noa checks them off a clipboard.](assets/images/new-leader-onboarding/comic-04-named-cast.jpeg)\n**Panel 4:** *The tool: a New Leader Experience with a named cast, not an implied one.*\n\n![Comic panel: Vera and Noa stand beside a long wall timeline showing phased onboarding stages from offer acceptance to week nine.](assets/images/new-leader-onboarding/comic-05-phased-timeline.jpeg)\n**Panel 5:** *How it runs: pre-populated, phase by phase, so nobody invents it under pressure.*\n\n![Comic panel: Noa fills out a short personality inventory form marked week four while Vera nods reassuringly.](assets/images/new-leader-onboarding/comic-06-week-four-assessment.jpeg)\n**Panel 6:** *The mechanic: a leadership assessment at week four — a mirror, not a gate.*\n\n![Comic panel: Noa writes quickly in a notebook labeled First Impressions while text on an earlier page visibly fades.](assets/images/new-leader-onboarding/comic-07-fading-notebook.jpeg)\n**Panel 7:** *The cost: fresh outside perspective decays fast, so capturing it is a scheduled job, not an afterthought.*\n\n![Comic panel: Vera hands Noa a one-page coaching goals document at the ninety-day mark while a new coach waves from the doorway.](assets/images/new-leader-onboarding/comic-08-coaching-goals.jpeg)\n**Panel 8:** *The closer: at ninety days, first impressions become coaching goals — and the loop closes.*\n"}]}]}</script>

        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
