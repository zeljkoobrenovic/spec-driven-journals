<script id="data" type="application/json">{"meta": {"id": "PPL-TEAM-CHARTER", "status": "draft:gray", "title": "Team Charter", "date": "2026-07-28", "author": "Željko Obrenović", "permalink": "team-charter", "timetoread": "9 min", "excerpt": "Every team I run has a written charter answering who it serves, what it owes, and what it depends on. I use the Scaling People workbook's eight-section template — mission, vision, customers, metrics with targets, strategic importance, major risks, provided interfaces, dependent interfaces — and I audit the whole operating system with one blunt test: can the mission, objectives, metrics, accountability, and cadence be filled in from documentation, not memory, for an individual, a team, and a division?", "tags": "people management, team charter, organizational design, accountability, operating cadence, OKRs", "icon": "assets/icons/team-charter.png", "logo": "assets/images/team-charter/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["people management", "team charter", "organizational design", "accountability", "operating cadence", "OKRs"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: Every team I run has a written charter answering who it serves, what it owes, and what it depends on. The charter is not a slide for a kickoff — it is a living contract with eight fixed parts: mission, vision, named customers, metrics with target values, strategic importance, major risks, what the team provides to others, and what the team depends on from others. My operating system is only real if I can fill in the same information — mission, objectives with an owner, key metrics, accountability mechanisms, operating cadence — for an individual, a team, and a division from documentation alone, not from memory.\n\n## Statement\n\nMy operating model for team definition has five parts:\n\n- **Every team writes a charter before it is staffed or tasked.** Mission, vision, customers, metrics, strategic importance, major risks, provided interfaces, dependent interfaces — all eight sections, in writing, before I let a team run on assumptions.\n- **Mission and vision are two different sentences.** The mission is what the team does, stated plainly enough to fit a sentence or two. The vision is the future state the team is building toward, including the trade-offs it accepts and the \"table stakes\" it commits to regardless.\n- **Customers are named, not implied.** A charter lists who the team is responsible for and what it protects on their behalf — as concrete bullets, not a vague \"our users.\"\n- **Every metric carries a target, not just a name.** A metric without a target value is an observation, not a commitment. Each one states what it measures and the number the team is accountable to.\n- **Interfaces are declared in both directions.** What the team provides to the rest of the organization, and what it depends on from others, are both written down — so a break on either side is a known risk, not a surprise.\n\n![Diagram of eight linked sections forming one team charter document, closed with a seal.](assets/images/team-charter/team-charter-eight-sections.jpeg)\n**Figure 1:** *The charter has eight fixed sections, written down as one contract before a team runs on assumptions.*\n\n## How to Read This\n\nThis journal is my people-management toolkit, grounded in the companion workbooks to Claire Hughes Johnson's *Scaling People: Tactics for Management and Company Building* (Stripe Press, 2023), read through a practitioner-executive lens. This record is grounded in two tools from Chapter 2 of the workbooks: the eight-section **Team Charter** template and the **Organizational Foundations** self-test. The runnable versions of both — the charter template with its worked dashboard-account-security example, and the individual/team/division foundations table — live in the **Checklist** tab.\n\n## Rationale\n\n**A team without a written mission drifts by default.** Ask five people on an unchartered team what the team is for and I expect five different answers, each defensible, none identical. The workbook's worked example is instructive precisely because it is boring: \"provide best-in-class security to all of our users and their accounts on the dashboard\" is one sentence, unambiguous, and covers both authentication and authorization. A mission this plain is worth writing down exactly because it forecloses drift — there is no room for five interpretations of one sentence.\n\n**Vision is where trade-offs get decided in advance, not in the moment.** The example vision does something a mission cannot: it states what the team accepts it will never fully solve (\"we won't ever be able to get [account takeovers] to zero\") alongside what it commits to unconditionally regardless of resourcing (\"table-stakes security features\"). Writing the acceptable failure mode down before an incident forces the trade-off conversation into a calm room instead of a war room. A team that discovers its own risk tolerance mid-crisis has skipped a step it needed.\n\n**Metrics without targets are decoration.** The workbook's metrics section has a fixed shape for a reason: each metric names what it measures — the number of accounts that experienced a takeover in a given month, account-takeover losses, percentage of users on two-factor authentication — and then a target value. Three lines, each ending in \"Target value: [X],\" is the whole discipline. A metrics section that stops at \"we track account takeovers\" without a target is a dashboard, not a commitment. I do not accept a charter missing the \"[X].\"\n\n![Side-by-side comparison of a dashboard gauge with a blank target versus one with a filled-in target value.](assets/images/team-charter/team-charter-metric-without-target.jpeg)\n**Figure 2:** *A metric without a target value is a dashboard; the same metric with a target is a commitment.*\n\n**Interfaces declared in both directions turn hidden coupling into visible risk.** The provided-interfaces list (login code, 2FA infrastructure, session infrastructure, account recovery flow) tells every other team what they can build on. The dependent-interfaces list (user registration UI, the verification service, the email team) tells my team what it cannot control alone. Both lists are short — five items, three items in the worked example — and that brevity is the point: if either list needs twenty bullets to be honest, the team's boundaries are wrong before its charter is even finished. Undeclared dependencies are the ones that break silently.\n\n**The foundations table is the charter's own audit, run at three altitudes.** The Organizational Foundations self-test asks for the same five rows — mission, objectives with an owner (a DRI), key metrics, accountability mechanisms, operating cadence — at three levels: an individual report, a team, a division. The workbook's own instruction is the sharpest line in the source material: **\"if you're having trouble filling out this template, imagine how your teams and reports must feel.\"** My own difficulty completing the table is diagnostic, not incidental — it means the operating system I believe exists is not actually documented anywhere, which means it does not actually exist for the people below me.\n\n![Grid diagram of a three-column, five-row foundations matrix examined under a magnifying glass.](assets/images/team-charter/team-charter-foundations-matrix.jpeg)\n**Figure 3:** *The foundations self-test audits the same five rows at three altitudes: individual, team, division.*\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| Every team has an eight-section written charter before it operates. | The charter is a one-time onboarding document — it is revisited as the team's scope shifts. |\n| Every metric carries a target value, not just a label. | Metrics are the whole of accountability — targets feed the QBR cadence, they do not replace it. |\n| Provided and dependent interfaces are both declared explicitly. | Declaring a dependency transfers the risk — it surfaces the risk; the team still owns its exposure to it. |\n| The foundations table spans individual, team, and division. | The table is only for the division level — an individual report deserves the same clarity a division gets. |\n| Foundations must be documented and findable on internal homepages. | Documentation is a wiki page nobody visits — it lives where the team and its reports actually look. |\n| My own difficulty filling the table in is a signal to act on. | Struggling to complete the table is a private embarrassment to paper over quietly. |\n\nConcretely: every team I run can produce its charter on request, in writing, with all eight sections filled in — including target values on every metric. I can fill in the foundations table for any of my direct reports, for any team, and for the division, from what is published on our internal homepages — not from what I happen to remember about that team this quarter.\n\n## Anti-Patterns\n\n- **The charter that exists only in the founder's head.** Mission and customers are \"obvious to everyone\" until someone new joins and nobody can articulate them consistently.\n- **Metrics without targets.** A tracked number with no target value is a vanity dashboard — it cannot tell anyone whether the team is succeeding.\n- **Vision as marketing copy.** A vision statement that promises everything and accepts no trade-off is not a vision — it is an aspiration with no teeth.\n- **Silent dependencies.** A team that never wrote down what it depends on discovers the dependency the day it breaks, at the worst possible time.\n- **The foundations table nobody can fill in.** If I cannot produce mission, objectives, metrics, accountability, and cadence for a team from documentation, the operating system I think I run is fictional.\n- **Documentation that exists but cannot be found.** A charter buried three folders deep in a wiki no one navigates to is functionally undocumented.\n\n## Related Records\n\n- [Writing OKRs](writing-okrs.html) — objectives and key results ladder from the charter's mission and metrics; the charter is the durable identity, OKRs are the season's commitments against it.\n- [Quarterly Business Reviews](quarterly-business-reviews.html) — the cadence where a charter's metrics, risks, and interfaces get inspected against reality on a recurring schedule.\n- [Operating Principles](operating-principles.html) — how I personally operate; the charter is how a team declares what it is, at a level above any one person's habits.\n- [Management Prerequisites](management-prerequisites.html) — the baseline competencies a manager needs before running a team; writing and maintaining a charter is one of the concrete duties that baseline enables.\n- [Organizational Values](../grounded-engineering-executive/organizational-values.html) — the engineering-journal record on company-wide values; a team charter's mission and vision must not contradict them.\n- [Measuring Engineering Organizations](../grounded-engineering-executive/measuring-engineering-organizations.html) — the engineering-journal record on organizational metrics; the charter's metrics section is where that discipline starts at team scope.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs how I require every team I run to declare its mission, vision, customers, metrics, strategic importance, risks, and interfaces, and how I audit the resulting operating system with the foundations table. I revisit it whenever a team's scope changes enough that its charter no longer matches reality, whenever I cannot complete the foundations table for a team without guessing, or whenever a documented interface turns out to have been wrong.\n\n## Authoritative References\n\n- Claire Hughes Johnson, *Scaling People: Tactics for Management and Company Building* (Stripe Press, 2023) — the companion workbooks, Chapter 2: the Team Charter template and the Organizational Foundations self-test this record distills.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "8 min read"}, "blocks": [{"type": "markdown", "content": "*The working tool behind this record. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Mission\n\n- [ ] Write one to two sentences stating what the team does\n- [ ] State it plainly enough that it forecloses multiple interpretations\n- [ ] Confirm it covers the full scope of the team's responsibility, not just its best-known part\n\n**Worked example (dashboard account-security team):** \"Provide best-in-class security to all of our users and their accounts on the dashboard. This encompasses both authentication and authorization, including dashboard roles and permissioning.\"\n\n## 2. Vision\n\n- [ ] State the future the team is building toward\n- [ ] Name what \"success\" looks like for the people the team serves\n- [ ] Name what the team accepts it will never fully solve\n- [ ] Name the \"table-stakes\" commitments the team delivers regardless of trade-offs\n\n**Worked example:** \"We aim to build strong trust internally and externally in our ability to provide best-in-class security for all of our users, from enterprises to small users, while avoiding overhead for our users and support team. Account takeovers will no longer be an active problem (neither as a terrible user experience nor as a financial loss). While we won't ever be able to get them to zero, we and our customers should have full faith that when they occur (e.g., through an internal bad actor on the customer side), we did everything within creative reasonability to prevent them. We will also deliver 'table-stakes' security features such that we fly through user security–related discussions with new enterprise customers.\"\n\n## 3. Customers\n\n- [ ] List who the team is responsible for, as concrete bullets\n- [ ] Name what the team protects or provides on their behalf\n- [ ] Avoid vague catch-alls (\"our users\") in favor of named groups\n\n**Worked example:**\n- We're responsible for the account security of every user and account, ensuring that their accounts and the sensitive data therein remain theirs alone.\n- We protect the interests of all merchant accounts by enabling them to control who in their business can access what, and by protecting them from rogue actions.\n\n## 4. Metrics\n\n- [ ] List each metric the team is accountable to\n- [ ] For each metric, state what it measures\n- [ ] For each metric, state a target value — no metric without a number\n\n| Metric | Measuring | Target value |\n| --- | --- | --- |\n| Number of accounts that experienced a takeover in a given month | User experience, risk of unhappy customer leak, support burden | [X] |\n| Account takeover losses | Direct financial loss and loss of margin due to account security issues | [X] |\n| Percentage of all dashboard users who have adopted two-factor authentication | Protection of entire user base from account takeovers | [X] |\n\n- [ ] Reject any draft metric that ships without a target value\n\n## 5. Strategic importance\n\n- [ ] State why this team's work matters beyond its own scorecard\n- [ ] Connect the team's work to company-level trust, risk, or growth\n- [ ] Name any competitive or sales impact\n\n**Worked example:** \"Aside from the financial benefits of reducing losses, having better account security will improve the user experience and build user trust. Strong foundations here will help prevent attacks, bad user experiences, and losses, since we will become a target if we are not world-class. A strong track record will also increase the appeal of our products to enterprise users, open up new sales conversations, and accelerate existing ones.\"\n\n## 6. Major risks\n\n- [ ] List the team's major risks as short, named bullets\n- [ ] Include distraction risk (lower-priority work pulling focus)\n- [ ] Include catastrophic risk (major incidents)\n- [ ] Include attrition-style risk (accumulating small asks, tech debt)\n\n**Worked example:**\n- Team gets pulled into lower-priority work by audit or compliance activities\n- Major security breach\n- Major new attack vectors\n- Death by a thousand cuts of one-off enterprise requests\n- Tech debt\n\n## 7. Provided interfaces\n\n- [ ] List what the team provides that other teams build on\n- [ ] Keep the list short — if it needs twenty bullets, the boundary is wrong\n- [ ] Make this list visible to teams that consume it\n\n**Worked example:**\n- Login code\n- 2FA infrastructure\n- Session infrastructure\n- Login/email challenge\n- Dashboard auditing models\n- Account recovery/password reset flow\n\n## 8. Dependent interfaces\n\n- [ ] List what the team depends on from other teams\n- [ ] Name the owning team or system for each dependency, not just the capability\n- [ ] Treat every entry as a declared risk, not a footnote\n\n**Worked example:**\n- User registration UI\n- Verificator (interface for SMS 2FA)\n- User email system and team\n\n## 9. Organizational Foundations self-test\n\nFill in the same five rows for an individual report, for one team, and for the division. If you're having trouble filling out this template, imagine how your teams and reports must feel.\n\n| | Individual | Team | Division |\n| --- | --- | --- | --- |\n| **Mission** | | | |\n| **Objectives (with owner / DRI)** | | | |\n| **Key metrics** | | | |\n| **Accountability mechanisms** | | | |\n| **Operating cadence** | | | |\n\n- [ ] Complete the Individual column for at least one direct report, from documentation alone\n- [ ] Complete the Team column for at least one team, from documentation alone\n- [ ] Complete the Division column, from documentation alone\n- [ ] Flag any cell you could only fill in from memory, not from a findable document\n\n## 10. Publish and maintain\n\n- [ ] Publish the charter and the foundations table on the team's internal homepage\n- [ ] Publish the same detail — top objectives and metrics with targets for the year — on the division's internal homepage, or at the top of the internal dashboard if separate\n- [ ] Re-check that the published version still matches reality at each quarterly review\n- [ ] Update the charter when mission, customers, metrics, or interfaces change — do not let the document go stale while the team's real work moves on\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "A written charter is the price of running a team, not optional paperwork — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. NOA: an earnest first-time people manager, short wavy hair, rolled-up shirt sleeves, carries a clipboard with a long checklist.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Noa watches team members scatter in different directions with no shared sign or map.](assets/images/team-charter/comic-01-team-adrift.jpeg)\n**Panel 1:** *The hook: an unchartered team drifts in five directions at once.*\n\n![Comic panel: five team members each give a different answer to what the team does, with Noa overwhelmed.](assets/images/team-charter/comic-02-five-answers.jpeg)\n**Panel 2:** *The problem: ask five people what the team is for and get five different answers.*\n\n![Comic panel: Noa dusts off a cobwebbed onboarding slide while Vera raises an eyebrow.](assets/images/team-charter/comic-03-onboarding-slide.jpeg)\n**Panel 3:** *The wrong way: a charter written once and never revisited is already stale.*\n\n![Comic panel: Vera writes eight labeled sections on a whiteboard as Noa checks them off her clipboard.](assets/images/team-charter/comic-04-eight-sections.jpeg)\n**Panel 4:** *The tool: an eight-section charter, written down before the team runs on assumptions.*\n\n![Comic panel: Vera points at a blank target-value bracket on Noa's metric list.](assets/images/team-charter/comic-05-target-value.jpeg)\n**Panel 5:** *How it runs: a metric without a target value is decoration, not a commitment.*\n\n![Comic panel: Noa's clipboard shows two short lists, provides and depends on, with arrows to other teams.](assets/images/team-charter/comic-06-two-way-interfaces.jpeg)\n**Panel 6:** *The mechanic: interfaces declared both ways turn hidden coupling into visible risk.*\n\n![Comic panel: Vera pauses over a blank cell in a three-column table, imagining Noa equally stuck.](assets/images/team-charter/comic-07-hard-to-fill-in.jpeg)\n**Panel 7:** *The cost: my own trouble filling in the table means the operating system isn't documented at all.*\n\n![Comic panel: Vera and Noa pin the finished charter to the team's homepage board as others read it.](assets/images/team-charter/comic-08-published-and-findable.jpeg)\n**Panel 8:** *The closer: a charter is only real once it is documented and findable, not remembered.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
