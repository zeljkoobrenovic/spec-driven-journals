<script id="data" type="application/json">{"meta": {"id": "PPL-QUARTERLY-BUSINESS-REVIEWS", "status": "draft:gray", "title": "Quarterly Business Reviews", "date": "2026-07-28", "author": "Željko Obrenović", "permalink": "quarterly-business-reviews", "timetoread": "8 min", "excerpt": "I run the QBR as a written, candid, six-page accountability ritual, not a showcase. The document must answer whether we're on track for where we said we'd be in two years, name every goal we executed or missed and why, and put investment against production. The meeting is a discussion informed by a memo everyone read in advance, not a presentation.", "tags": "people management, QBR, accountability, metrics, goals, business review", "icon": "assets/icons/quarterly-business-reviews.png", "logo": "assets/images/quarterly-business-reviews/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["people management", "QBR", "accountability", "metrics", "goals", "business review"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: I treat the Quarterly Business Review as a written, candid, six-page accountability ritual, not a showcase of successes. The document — shared at least 24 hours ahead — must leave every reader able to answer \"where do we want to be in two years, and are we on track?\", must name which goals we executed and which we did not and why, must set investment against what the area is producing, and must surface the obstacles leadership can actually unblock. The meeting itself is a discussion informed by the memo, not a presentation of it — attendees arrive having read it, and we spend the room's time on strategy and outlook, not narration.\n\n## Statement\n\nMy operating model for the QBR has six parts:\n\n- **The document is the artifact, the meeting is the discussion.** A QBR is a six-page narrative plus an appendix, shared at least 24 hours before the meeting, with reading time protected inside the meeting itself. The room's job is to discuss the memo, not hear it read aloud for the first time.\n- **Six statements must be true when it's over.** After every QBR, participants can state: the charter and operating metrics with targets through year end and whether we're on track for two years out; which goals were executed, which were not, and why; investment against production; mutual expectations for the coming period; the obstacles ahead; and what leadership can unblock.\n- **Candor over performance.** The executive summary is a candid assessment, not a summary of successes. If goals were missed, the narrative skews toward lowlights and explains why. Results-focus beats a winding discussion of plans we merely intended to execute.\n- **Concision is enforced by page limits, not goodwill.** Executive summary under 250 words, narrative under two pages, progress-on-goals under one page — everything else moves to the appendix. The limits are the discipline; without them, a QBR grows to however long its author is comfortable writing.\n- **Metrics carry a two-year horizon, not a quarter.** Charter (long-term) and operating (short-term) metrics both get quarterly targets through year end, and the charts look back roughly two years so a reader can see trajectory, not a snapshot. Revised targets are shown alongside the original.\n- **Every review closes the loop on the last one.** Prior action items get a status update before new ones are added, and the QBR itself gets a retrospective — what to improve, what to change next time.\n\n![Circular diagram showing the six connected stages of the QBR operating model looping back into the next quarter.](assets/images/quarterly-business-reviews/qbr-six-parts-loop.jpeg)\n**Figure 1:** *The QBR is a closed loop, not a one-off event — each quarter's close-out feeds the next quarter's start.*\n\n## How to Read This\n\nThis journal is my people-management toolkit — first-person operating records, each grounded in a named tool from the companion workbooks to Claire Hughes Johnson's *Scaling People: Tactics for Management and Company Building*. This record is built on the Chapter 2 \"Quarterly Business Reviews (QBRs)\" tool — the QBR guidelines, the before/during/after meeting checklists, the six-page document outline with its limits, the example outline, and the Appendix A required tables — written by Kailey Stockenbojer of the Stripe finance team in consultation with Stripe leaders, read through a practitioner-executive lens. The runnable tool — the full document skeleton, the meeting checklists, and the required tables — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**A QBR is a written commitment device, not a status update.** The six-page limit is not an arbitrary style rule — it forces the same discipline that a written narrative always forces: you cannot hide a weak argument behind slides and a confident voiceover when the words themselves have to carry the case. Sharing the document at least 24 hours ahead and protecting reading time inside the meeting means the room's synchronous time goes to the parts that actually need a live discussion — strategy and outlook — not to a leader narrating their own memo. I expect at least half of every QBR discussion to land on strategy and the next two years, not on relitigating the quarter that already happened.\n\n![Split diagram contrasting a live-narrated slide meeting that consumes most of the room's time against a pre-read memo that frees most of the time for strategy discussion.](assets/images/quarterly-business-reviews/qbr-memo-vs-narration.jpeg)\n**Figure 2:** *Live narration spends the room's time on delivery; a pre-read memo spends it on strategy and outlook.*\n\n**Candor is the point of the executive summary, and it is the easiest thing to lose.** Left unchecked, an executive summary drifts toward a highlight reel — the natural instinct of anyone presenting their own work to leadership. I hold the line the workbook draws explicitly: the summary is a candid assessment of what the team has accomplished, what it needs to do better at, and what it plans to do — not a summary of successes. When goals were missed, the narrative should skew toward lowlights and explain why, even when the team also met other goals worth celebrating. A QBR that reads as uniformly positive has usually failed at its actual job.\n\n**The six post-meeting truths are the acceptance test.** I don't judge a QBR by whether it was well delivered; I judge it by whether, afterward, every participant can answer six questions: are we on track against our charter and operating metrics for where we said we'd be in two years; which goals did we execute, which did we not, and why; how much are we investing relative to what the area produces; what do we now mutually expect from each other for the coming period; what obstacles do we see ahead; and what, specifically, can leadership unblock. A meeting that produced good energy but left any of these six unanswered was not a QBR — it was a nice conversation.\n\n**Two-year metric horizons turn a snapshot into a trajectory.** Charter metrics (long-term) and operating metrics (short-term) both need quarterly targets running through the end of the year, and the charts behind them should reach back roughly two years wherever the data exists — not just the current quarter. That horizon is what lets someone glance at a chart and answer \"where do we want to be in two years, and are we on track?\" without reading a paragraph of caveats. When targets get revised mid-cycle, the original and the revised target both stay on the chart — a silently moved goalpost is not a trajectory, it's a cover story.\n\n**Closing the loop is what makes the ritual compound.** A QBR that doesn't address its own prior action items, and doesn't reflect on its own quality, resets to zero every quarter instead of building. Prior action items get a status update before new ones are opened. After the meeting, the leader reflects explicitly on the quality of the QBR and its metrics, gathers feedback from partners and leadership if it wasn't offered freely, and names what changes next time. A QBR practice that never asks \"was that any good?\" will drift in quality without anyone noticing until it's bad.\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| Share the document at least 24 hours ahead and protect reading time in the meeting. | The meeting is a formality — it's where strategy and outlook actually get debated. |\n| The executive summary is a candid assessment. | Candor means only bad news — met goals still get named; the point is honesty, not pessimism. |\n| Six pages plus appendix, with hard limits per section. | Shorter means shallower — the limits force prioritization, not omission of substance. |\n| Metrics carry roughly a two-year horizon with original and revised targets shown. | Only the current quarter's numbers matter — trajectory is the point, not a snapshot. |\n| Missed goals get named and explained, with lowlights given real space. | Missing goals is a failure to hide — it's a prompt for \"why\" and \"what changes.\" |\n| Prior action items get addressed before new ones are added. | Each QBR starts fresh — it's a chain, and unresolved items carry forward visibly. |\n\nConcretely: every QBR I sponsor is a document first, checked against the six-page and per-section limits, shared at least 24 hours before the meeting with reading time reserved inside it. Every QBR opens by resolving the previous QBR's action items and closes with a short retrospective on its own quality.\n\n![Map of six stacked document pages each with its own limit, with the appendix shown outside the six-page boundary.](assets/images/quarterly-business-reviews/qbr-six-page-map.jpeg)\n**Figure 3:** *Six pages, each with its own hard limit — everything else moves outside the boundary into the appendix.*\n\n## Anti-Patterns\n\n- **The highlight-reel exec summary.** 250 words of accomplishments and none of the hard truths. If leadership can't tell what's not working from the summary alone, it isn't a summary — it's marketing.\n- **The narrative that skips lowlights.** Goals were missed, but the two pages read as if everything is fine. Skewing toward lowlights when goals are missed is not optional under this record.\n- **Slides instead of a memo.** A deck with bullet points and a live narration substitutes performance for rigor. The written narrative is the artifact; a deck cannot expose weak logic the way full sentences do.\n- **Same-day distribution.** Sending the document an hour before the meeting and then narrating it live defeats the entire purpose of a pre-read. Twenty-four hours minimum, with reading time still protected in the room.\n- **One-quarter metrics.** Charts that show only the current quarter hide whether a target was ever realistic and whether it was quietly revised. The two-year horizon is what makes the trajectory question answerable.\n- **Action items that vanish.** Prior action items never resurface, and no one checks whether they were done. Every QBR is disconnected from the last, and nothing compounds.\n- **No retrospective on the QBR itself.** The meeting happens, everyone moves on, and the quality of the review — its metrics, its candor, its usefulness — never gets examined or improved.\n\n## Related Records\n\n- [Writing OKRs](writing-okrs.html) — where the goals scored in a QBR are first written; this record produces the inputs the review depends on.\n- [Leadership Team Updates](leadership-team-updates.html) — the lightweight recurring update cadence; the QBR is the deep quarterly review that the lighter cadence cannot replace.\n- [Team Charter](team-charter.html) — the long-term charter metrics a QBR reports progress against; this record consumes that charter rather than redefining it.\n- [Measuring Engineering Organizations](../grounded-engineering-executive/measuring-engineering-organizations.html) — the engineering-journal record on what to measure; this record is about how those measurements get reviewed on a cadence.\n- [Inspected Trust](../grounded-engineering-executive/inspected-trust.html) — the engineering-journal record on trust with verification; the QBR is the periodic, structured instance of that inspection at the business level.\n- [The Unblocking Process](unblocking-process.html) — the mechanism leadership uses to act on the obstacles a QBR surfaces; this record is where those obstacles first get named on the record.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs how I and every leader in my organization prepare, run, and follow up on a Quarterly Business Review: the document's shape and limits, the meeting mechanics, and the required tables. I will revise it once a full year of QBR cycles shows whether the six-page limit and the two-year metric horizon hold up for teams of different sizes and maturity, and whenever a QBR retrospective surfaces a structural gap rather than a one-off execution miss.\n\n## Authoritative References\n\n- Claire Hughes Johnson, *Scaling People: Tactics for Management and Company Building* (Stripe Press, 2023) — the companion workbooks, Chapter 2, \"Quarterly Business Reviews (QBRs).\"\n- The QBR documents and guidelines were written by Kailey Stockenbojer of the Stripe finance team, in consultation with various Stripe leaders, whose credit the workbook carries.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "14 min read"}, "blocks": [{"type": "markdown", "content": "*The working tool behind this record. The Article tab carries the rationale and anti-patterns.*\n\n## 1. What must be true after the QBR meeting\n\n- [ ] The QBR provided clear charter (long-term) and operating (short-term) metrics, with quarterly targets through the end of the year\n- [ ] I can answer: where do we want to be in two years, and are we on track?\n- [ ] The QBR explained which goals we executed, which we did not, why, and how we'll close any gaps (or why the plan is changing)\n- [ ] The QBR explained how much we're investing relative to what the area is producing\n- [ ] Participants left with clear mutual expectations for the coming period\n- [ ] We know what potential obstacles may come up through the end of the year\n- [ ] Leadership understands what it needs to unblock to help us accelerate and produce outstanding results\n\n## 2. Delivering a stellar QBR\n\n- [ ] **Focus on results** — show, with metrics, how execution is progressing, rather than holding a winding discussion of potential plans\n- [ ] **Be candid** — write a candid assessment of what the team accomplished, what it needs to do better at, and what it plans to do; this is not a summary of successes\n- [ ] **Be concise** — six-page narrative maximum, plus an appendix with tables and/or charts\n- [ ] **Prepare in advance** — share the memo at least 24 hours before the meeting; reserve reading time inside the meeting itself\n- [ ] **Be present** — attendees minimize work distractions during the discussion (snooze notifications, close other windows); consume materials digitally without linking out to supplementary materials\n\n## 3. Before the QBR meeting\n\n- [ ] Link the QBR document in the calendar invite and leadership guidebook at least 24 hours in advance\n- [ ] If there are confidential topics, put them in a separate, access-restricted document and link it from the guidebook\n- [ ] Email the discussion materials directly to attendees\n- [ ] Prepare an agenda of the key topics to cover with leadership\n\n## 4. During the QBR meeting\n\n- [ ] Allow dedicated time for pre-reads and announce when reading time has ended\n- [ ] Gather top-of-mind questions and topics from attendees and add them to the prepared agenda\n- [ ] Prioritize topics so the most important ones are covered first within the allotted time\n- [ ] Include metrics as a standard discussion topic\n- [ ] The QBR leader drives the discussion based on the agenda's key topics\n- [ ] Take comprehensive notes, or assign someone in the meeting to take them — capture action items and owners\n\n## 5. After the QBR meeting\n\n- [ ] Share the notes with all QBR participants\n- [ ] Add action items to the QBR action-item tracker\n- [ ] Reflect on the quality of the QBR, including the quality of the metrics\n- [ ] Gather feedback from partners and leadership if it wasn't offered readily\n- [ ] Name what to work on and what to change for next time\n\n## 6. Document outline and limits\n\nDirectional word/page limits keep the document within six pages total. If content exceeds the limit, the QBR leader decides what to shorten.\n\n| Section | Limit | Notes |\n| --- | --- | --- |\n| Executive summary | ≤ 250 words | Candid assessment of performance and strategic direction — not a summary of successes |\n| Narrative | ≤ 2 pages | Grounded in charter and operating metrics; discusses performance against goals |\n| Metrics performance | ≤ 2 pages | Additional metrics beyond the narrative go in the appendix |\n| Progress on goals | ≤ 1 page | Top 5–10 goals only; additional goals go in the appendix |\n| Product P&L | — | Product teams work with finance to include this as a table |\n| Cross-functional focus areas | — | Scores plus a comment on what's being done to improve each score |\n| Appendix A | — | Required tables (see section 10) |\n| Appendix B | — | Optional supporting materials, at the leader's discretion |\n\n- [ ] Executive summary written to 250 words or fewer\n- [ ] Narrative written to 2 pages or fewer\n- [ ] Metrics performance section written to 2 pages or fewer, overflow metrics moved to the appendix\n- [ ] Progress-on-goals table limited to the top 5–10 goals, overflow goals moved to the appendix\n- [ ] Relevant metric visualizations embedded directly in the narrative where they help the reader\n\n## 7. Narrative content rules\n\n- [ ] Narrative speaks for itself — any live \"voiceover\" only focuses the discussion, it doesn't repeat the memo\n- [ ] Discussion of results is candid and appropriately balanced against relative performance\n- [ ] If goals were missed, the discussion skews toward lowlights — why didn't we deliver?\n- [ ] If goals were met, still discuss any areas that did not go well\n- [ ] Narrative covers quarterly results, outlook for the remainder of the year, and longer-term strategic considerations\n- [ ] At least 50 percent of the discussion is spent on strategy and outlook, not backward-looking results\n\n## 8. Example narrative outline\n\nUse at the leader's discretion — structure the narrative to best describe your team's performance and trajectory.\n\n1. **Current quarter reflection** — explain performance against goals\n   - [ ] Support performance against goals with operating and charter metrics\n   - [ ] Explain how metrics were impacted and how they changed over time\n   - [ ] Explain what the team did (or did not do) to influence them\n   - [ ] Discuss key ships, and if key ships were missed, explain why\n   - [ ] Discuss user feedback: top user asks and how well they're being addressed, plus user compliments in areas performing well\n   - [ ] Discuss overall velocity\n2. **Outlook** — look forward to the next quarter and the next year\n   - [ ] State the top three goals in order of priority\n   - [ ] Identify which metrics those goals will impact\n   - [ ] Explain how user stories and pain points will be impacted\n   - [ ] State whether the team is on track to meet these goals, and if not, why\n   - [ ] Answer: what keeps you up at night? (Read: what should leadership be worried about?)\n3. **Other sections** — use at your discretion, based on relevance\n   - [ ] Cross-functional asks\n   - [ ] Hiring progress\n   - [ ] Team morale\n\n## 9. Metrics performance\n\n- [ ] Metrics cover a roughly two-year time horizon where available, not just the current period\n- [ ] Charts briefly describe changes to the metrics used (since the last QBR, or anticipated changes)\n- [ ] If metrics were revised during planning, charts and/or commentary show both the original and the revised target\n- [ ] Metrics not already embedded in the narrative are included here\n\n## 10. Cross-functional focus areas and goal scoring\n\nFocus areas the company has defined as requiring engagement from business leaders. Add comments on the assessment score (what you're doing to improve it) and include a screenshot of the output. Reach out to the focus-area DRI with questions.\n\n| Focus area | DRI | QX score | QY score | Comments |\n| --- | --- | --- | --- | --- |\n| Reliability | | | | |\n| Security | | | | |\n| Efficiency | | | | |\n| Operations | | | | |\n| Product quality | | | | |\n\n- [ ] Focus-area scores filled in for the current quarter (QX) and prior comparison period (QY)\n- [ ] Each score has a comment describing what's being done to improve it\n\n### Progress on goals — top 5–10 goals, one page maximum\n\n| Team objective | Shipped | On track | Off track | At risk | Total |\n| --- | --- | --- | --- | --- | --- |\n| Objective 1 | | | | | |\n| Objective 2 | | | | | |\n| Objective 3 | | | | | |\n| Objective 4 | | | | | |\n| Objective 5 | | | | | |\n| **Total** | | | | | |\n| **% of total** | | | | | 100% |\n\n| Team objective | Goal (ship and/or metric to move) | Due date | Goal state | QX score | Comments |\n| --- | --- | --- | --- | --- | --- |\n| (optional) | | | | | |\n\n- [ ] Top 5–10 goals selected and summarized\n- [ ] Additional goals beyond the top 5–10 moved to the appendix, not squeezed onto this page\n\n## 11. Appendix A — required tables\n\n### Prior QBR action items\n\nAddress every action item from the prior QBR; provide a status update on anything not yet resolved.\n\n| Action item | Follow-up status / narrative | Owner |\n| --- | --- | --- |\n| | | |\n| | | |\n| | | |\n\n- [ ] Every prior action item has a status update or narrative\n- [ ] Every action item has a named owner\n\n### Operating expenses (non-product teams)\n\n- [ ] Finance partner provides operating-expenses budget vs. actuals for this section (product teams may optionally include this in addition to the product P&L)\n\n### Headcount by sub-team\n\n| Sub-team | Description | Current headcount | Current ANS | YTD net change | Year envelope | ROY net hire capacity |\n| --- | --- | --- | --- | --- | --- | --- |\n| | | | | | | |\n| | | | | | | |\n| **Total headcount** | | | | | | |\n\n- [ ] Headcount broken out by sub-team, matching how the team is actually organized\n- [ ] Total headcount row completed\n\n### Top asks from users\n\nProducts are co-created with users, internal and external. Status is **committed**, **partially committed**, or **not committed**.\n\n| User ask | User segment | Status | Comments |\n| --- | --- | --- | --- |\n| | | | |\n| | | | |\n| | | | |\n\n- [ ] Top user asks captured with segment and status\n- [ ] Status uses only the three allowed values: committed, partially committed, not committed\n\n## 12. Appendix B — additional supporting materials\n\n- [ ] Used at discretion — e.g., top recent ships, top upcoming ships, additional goals not covered on the one-page progress table\n- [ ] Kept out of the six-page core so it doesn't compete with the required content\n\n## 13. QBR retrospective\n\n- [ ] Reflected on the quality of the QBR itself, including the quality of the metrics\n- [ ] Sought feedback from partners and leadership if not offered readily\n- [ ] Named one concrete thing to work on before the next QBR\n- [ ] Named one concrete thing to change about the QBR format or process next time\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "The QBR is a written, candid, six-page accountability ritual, not a showcase — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. NOA: an earnest first-time people manager, short wavy hair, rolled-up shirt sleeves, carries a clipboard with a long checklist.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Noa presents a glossy slide deck of all-green results to a room, smiling proudly.](assets/images/quarterly-business-reviews/comic-01-showcase-mode.jpeg)\n**Panel 1:** *The hook: a QBR that only shows the wins isn't a QBR.*\n\n![Comic panel: Vera checks her watch as Noa hands out documents just as the meeting begins.](assets/images/quarterly-business-reviews/comic-02-no-memo.jpeg)\n**Panel 2:** *The problem: no pre-read means the room narrates instead of discusses.*\n\n![Comic panel: Vera holds up a hand toward Noa's bullet-point slide, objecting to a live narration.](assets/images/quarterly-business-reviews/comic-03-slides-not-memo.jpeg)\n**Panel 3:** *The wrong way: a slide deck substitutes performance for rigor.*\n\n![Comic panel: Vera holds up a six-page stapled document beside Noa's checklist clipboard.](assets/images/quarterly-business-reviews/comic-04-document-is-artifact.jpeg)\n**Panel 4:** *The principle: a QBR is a written, candid, six-page accountability ritual.*\n\n![Comic panel: Noa pins the QBR document to a calendar two days ahead while Vera reads her own copy at her desk.](assets/images/quarterly-business-reviews/comic-05-24-hours-ahead.jpeg)\n**Panel 5:** *How it runs: shared at least 24 hours ahead, reading time protected in the room.*\n\n![Comic panel: Noa trims a thick stack of pages down to six pages plus a thin appendix folder.](assets/images/quarterly-business-reviews/comic-06-six-page-limit.jpeg)\n**Panel 6:** *The mechanic: 250-word summary, two-page narrative, six pages total, everything else in the appendix.*\n\n![Comic panel: Noa uneasily writes a 'What went wrong' section while Vera reads over her shoulder approvingly.](assets/images/quarterly-business-reviews/comic-07-lowlights-cost.jpeg)\n**Panel 7:** *The cost: candor means the lowlights get real space, even when it's uncomfortable.*\n\n![Comic panel: Vera and Noa check off the last prior action item together before opening a fresh QBR page.](assets/images/quarterly-business-reviews/comic-08-closes-the-loop.jpeg)\n**Panel 8:** *The closer: close the loop on last quarter, and the ritual compounds instead of resetting.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
