surfaces a gap, I write it down and send it: the expectation, the gap, dated situation/behavior/impact examples, and actionable next steps — with weekly check-ins for a stated number of weeks.\n- **The letters form a loop, not a ladder to termination.** Initial documentation leads to a progress update, and a progress update leads one of two ways: back on track (confirmed, sustained, congratulated) or insufficient progress (recapped, and followed by a realistic conversation about whether the role is still a fit).\n- **A PIP is an escalation, never an opener.** I only start a formal Performance Improvement Plan after several documented conversations have already named the gap, offered examples, and offered support. If I am reaching for a PIP template as the first written feedback, I have already failed at the job.\n- **The PIP is short, specific, and honest about the stakes.** Four to six weeks, three or fewer improvement areas each with a standard, a gap, and dated examples, goals and milestones with real deadlines, a named HR partner, weekly check-ins, and explicit language that passing does not lower the bar afterward and that employment stays at-will throughout.\n- **Managing out follows a fixed sequence, adapted to law and place.** Feedback, then documentation, then a formal process if warranted, then a check against local employment regulations, then informing my manager and HR, then the coaching-out conversation, then an agreed timeline and communication plan, then the announcement — in that order, every time, adapted to the jurisdiction I am operating in.\n\n![Diagram of a three-stage timeline: documented feedback as a resolving loop, a short bounded Performance Improvement Plan segment, then a sequenced managing-out stage, narrowing like a funnel to show most cases resolve early.](assets/images/managing-underperformance/underperformance-arc-timeline.jpeg)\n**Figure 1:** *The arc is one escalating sequence, not three separate tools — most cases resolve before a PIP is ever needed.*\n\n## How to Read This\n\nThis journal is my people-management toolkit — first-person operating records built on the companion workbooks to Claire Hughes Johnson's *Scaling People: Tactics for Management and Company Building*. This record is grounded in three of the workbooks' tools, read as one continuous arc rather than three separate documents: the Performance Improvement Documentation Templates, the Performance Improvement Plan Template, and the Managing Out Checklist. The workbook offers them as templates to fill in; I read them as the sequence I owe every underperforming report before anything becomes irreversible. The runnable tool — all four letters, the full PIP structure, and the eight-step checklist — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**Documentation is protection for the person, not a paper trail against them.** The instinct is to treat a documented performance conversation as evidence-gathering for an eventual exit. I read it the other way: writing down the expectation, the gap, and dated examples the same week they happen is what gives the person a real chance to close the gap, because vague feedback cannot be acted on. An \"initial documentation\" letter that names the situation, the observable behavior, and the impact — followed by next steps stated as actions, not verdicts — is the clearest, kindest thing I can hand someone who is struggling. Silence is not mercy; it is a manager postponing a hard conversation at the employee's expense.\n\n**The follow-up letters exist so a PIP is never the first feedback anyone gets.** The workbook's four templates form a deliberate arc: initial documentation states the gap and starts a weekly check-in cadence; a progress update restates the expectation, cites new examples, and is explicit about what still needs to change and why it sits inside the core of the role; back on track confirms the expectations are now met, states that I expect the performance to be sustained, and closes with a genuine congratulation; insufficient progress recaps what has already been raised and moves to a realistic, honest conversation about whether the person can meet expectations at all. Three of those four outcomes never touch a formal process — which is the point. Most underperformance resolves in this loop when it is caught and documented early.\n\n![Flow diagram of four documentation letters: initial documentation to progress update, branching into back on track (looping back) or insufficient progress (continuing forward).](assets/images/managing-underperformance/four-letters-loop.jpeg)\n**Figure 2:** *The letters form a loop, not a ladder — most paths through it end back at normal work, not at a PIP.*\n\n**A PIP is a signed contract with real deadlines, not a soft warning with paperwork.** When the loop above does not close the gap, the workbook's Performance Improvement Plan Template is explicit that it is \"a signed, standalone document\" running \"typically four to six weeks\" — long enough to fairly assess performance against set goals, short enough that it does not drift into indefinite probation. It states role expectations as three to five points pulled from the job description, level, and ladder; up to three improvement areas, each with the expected standard, the gap and its impact, and dated examples; goals and deliverables with real timeframes and definitions of what success looks like; milestones with deadlines; the resources available, including a named HR partner; and a weekly cadence of progress checks. None of that is bureaucratic decoration — each element is what makes the plan fair rather than arbitrary.\n\n**A PIP protects everyone precisely because it is honest about the stakes.** The template does not soften what a PIP is: it says plainly that the PIP may be ended early, that entering one \"in no way guarantees employment,\" that the at-will nature of employment is unchanged throughout, and that even successfully completing a PIP requires *sustained* performance afterward — further underperformance can end employment without a second PIP. I keep every one of those caveats in the document I sign with someone, because ambiguity there is what turns a PIP into a false hope or a legal landmine. The workbook is also explicit that the template \"may need to be adapted for different geographical jurisdictions\" — I treat that as a standing instruction, not a footnote, and check local employment law before I use any of this language as written.\n\n**Managing out is a sequence, and skipping steps is where humane process breaks down.** The Managing Out Checklist orders eight steps: give feedback, document the feedback, run a formal process if relevant, check local employment regulations, inform my manager and HR partner, hold the coaching-out conversation, agree on the timeline and communication plan, and announce the departure with transition details if the role needs immediate coverage. Every step in that order exists because I have seen what happens when one is skipped: managers who inform HR before their own manager, who announce before the person has heard it directly from them, or who skip the local-law check because \"we've always done it this way\" elsewhere. The sequence is not ceremony — it is what keeps the exit from becoming a second injury on top of the first.\n\n![Diagram of a winding path with eight numbered waypoints in strict sequence, one waypoint shown with a broken connection to illustrate what happens when a step is skipped.](assets/images/managing-underperformance/managing-out-sequence-map.jpeg)\n**Figure 3:** *The Managing Out Checklist is a fixed route, not a menu — skipping a waypoint is where the exit turns into a second injury.*\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| Documentation starts at the first \"partially meets expectations\" signal. | Documentation is punitive — it is the same act of care as any other specific, timely feedback. |\n| Weekly check-ins follow initial documentation, for a stated number of weeks. | The check-in cadence is optional or informal — it is named explicitly in the letter and kept. |\n| A PIP follows several already-documented conversations. | A PIP can substitute for earlier feedback — if it is the first document, I have already failed. |\n| The PIP names up to three improvement areas with a standard, a gap, and dated examples. | The PIP lists every shortcoming — three or fewer keeps it actionable rather than overwhelming. |\n| The PIP states plainly that it may end early and guarantees nothing. | The PIP is a formality that always runs its full course — it can and does end sooner, either way. |\n| The Managing Out Checklist runs in a fixed order, adapted to local law. | The templates are used verbatim everywhere — the workbook itself says they need legal adaptation per jurisdiction. |\n\nConcretely: before I ever open the PIP template for someone, I can point to at least one dated documentation letter that already named the gap and the examples. Before I announce any departure, I can confirm feedback, documentation, my manager, HR, the coaching-out conversation, and the timeline all happened, in that order — the checklist is the audit, and I run it on myself.\n\n## Anti-Patterns\n\n- **The surprise PIP.** A performance improvement plan lands with no history of documented conversations behind it. If the person is shocked, the process already failed before it started.\n- **Vague documentation.** \"You need to improve\" with no dated example, no stated impact, and no actionable next step — a letter that cannot be acted on is not feedback, it is a formality.\n- **The check-in that never happens.** A letter promises weekly check-ins \"for the next X weeks\" and then the calendar goes quiet. The person is left guessing whether they are on track.\n- **A PIP with more than three improvement areas.** Everything wrong at once, all at maximum stakes — a list this long is not a plan, it is a case being built.\n- **Softening the caveats.** Leaving out the at-will language, the no-guarantee language, or the sustained-performance-after-passing language to make the document feel kinder. It does the opposite: it sets someone up to be blindsided later.\n- **Skipping the sequence.** Announcing before the coaching-out conversation, or telling HR before my own manager, or using a template unchanged in a jurisdiction with different rules. The order in the Managing Out Checklist is the safeguard, not a suggestion.\n- **Treating managing out as a private failure to hide.** Avoiding HR, avoiding my manager, and running the whole thing solo because it feels easier — the checklist's early steps exist precisely so no manager carries this alone.\n\n## Related Records\n\n- [Performance Reviews](performance-reviews.html) — the regular review cycle where a \"partially meets expectations\" rating is often the first signal that starts this record's documentation loop.\n- [Compensation Conversations](compensation-conversations.html) — a separate conversation; I keep pay decisions distinct from a PIP in progress rather than letting one leak into the other.\n- [Management Prerequisites](management-prerequisites.html) — the baseline cadence (regular 1:1s, tracked goals, feedback on a clock) that makes early documentation possible in the first place; without it, gaps go unnoticed until they are severe.\n- [Careers, Hiring, and Performance](../grounded-engineering-executive/careers-and-performance.html) — the engineering-executive journal's record on calibrating performance across a broader organization; this record is what happens when an individual's calibration does not hold.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs how I and every manager reporting to me handle a performance gap from the first documented conversation through a possible PIP to a possible managing-out process. I will revise it if a jurisdiction I operate in requires materially different documentation or notice practices, if the workbook's cadences (weekly check-ins, four-to-six-week PIPs) prove wrong for my organization's pace, or if I see the arc skipped in practice — a PIP with no documentation behind it, or a departure announced out of sequence.\n\n## Authoritative References\n\n- Claire Hughes Johnson, *Scaling People: Tactics for Management and Company Building* (Stripe Press, 2023) — the companion workbooks' Performance Improvement Documentation Templates, Performance Improvement Plan Template, and Managing Out Checklist (Chapter 5), which this record distills.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "10 min read"}, "blocks": [{"type": "markdown", "content": "*The working tool behind this record. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Initial documentation (after a 1:1 or a \"partially meets expectations\" review)\n\n- [ ] State the meeting this recaps (\"yesterday\" / \"over the past few weeks\" / \"1:1\" / \"performance review\")\n- [ ] Name the area of development where expectations are not currently being met\n- [ ] Summarize performance relative to expectation in one line\n- [ ] Give at least two dated examples of not meeting expectations, each with: the situation, the observable behavior, and the impact it had\n- [ ] State each performance expectation as an actionable next step (not a vague aspiration)\n- [ ] Set a weekly check-in cadence for a stated number of weeks\n- [ ] Close supportively: offer help, and state the goal is to see them get back on track and succeed\n\n## 2. Progress update\n\n- [ ] Restate the performance expectation from the initial documentation\n- [ ] Describe performance relative to expectation and give a progress assessment\n- [ ] Give at least two dated examples that demonstrate progress: situation, observable behavior, impact\n- [ ] Name what they should keep doing, plus other things they could also do\n- [ ] Restate any expectation that still needs work\n- [ ] Give at least one dated example of what still needs to change: situation, observable behavior, impact\n- [ ] State explicitly that the remaining area is core to the role and to meeting expectations at their ladder/level\n- [ ] Confirm the weekly check-in cadence continues\n\n## 3. Employee getting back on track\n\n- [ ] Name the time period covered and the area of development\n- [ ] Summarize performance relative to expectation\n- [ ] Give at least two recent dated examples of meeting expectations: situation, observable behavior, impact\n- [ ] Confirm they are meeting performance expectations for their role and level\n- [ ] State the expectation that this performance is sustained going forward\n- [ ] Note that these areas will continue to be monitored in regular 1:1s\n- [ ] Close by congratulating them\n\n## 4. Insufficient progress (after a reasonable period)\n\n- [ ] Name the time period covered and the area(s) still not meeting expectations\n- [ ] Summarize performance relative to expectation and its impact\n- [ ] Give at least two recent dated examples of not meeting expectations: situation, observable behavior, impact\n- [ ] Acknowledge any additional effort observed\n- [ ] State plainly that these examples show prior feedback has not been addressed\n- [ ] Propose a realistic next conversation about whether they can meet expectations for their ladder/level\n- [ ] Deliver this directly and acknowledge it is difficult to hear, while making sure they understand the situation\n\n## 5. Before starting a Performance Improvement Plan (PIP)\n\n- [ ] Confirm several documented conversations already exist identifying the development areas\n- [ ] Confirm those conversations included examples of the performance gap\n- [ ] Confirm support was already offered to help the person meet expectations\n- [ ] Confirm a PIP is not the first time this person will hear they are underperforming\n- [ ] Check local employment regulations before drafting — the template needs jurisdiction-specific adaptation\n\n## 6. PIP: header and framing\n\n- [ ] Record name, manager, and date\n- [ ] State plainly that performance has not met expectations for the role and level, as previously discussed\n- [ ] State the goal: identify development areas and provide a real opportunity to improve, with the tools and resources needed\n\n## 7. PIP: role expectations\n\n- [ ] Include 3–5 bullets summarizing key expectations for the role, based on job description, level, and ladder\n- [ ] Make each bullet specifically relate to an area needing improvement\n\n## 8. PIP: areas for improvement (up to three)\n\n| Area | Expected standard | Gap / deficiency and impact | Dated examples |\n| --- | --- | --- | --- |\n| 1 | Standard, tied to operating principles where relevant | Where the person falls short and the impact on the project/team | Specific, demonstrable, dated |\n| 2 | Standard | Gap and impact | Dated examples |\n| 3 | Standard | Gap and impact | Dated examples |\n\n- [ ] Limit to three improvement areas maximum\n- [ ] Ensure every area already appeared in prior documented feedback\n\n## 9. PIP: goals, deliverables, and milestones\n\n- [ ] For each improvement area, set a goal and time frame: what must be accomplished, by when, what success looks like\n- [ ] For each improvement area, define the deliverable: what demonstrates the goal was met\n- [ ] List concrete milestones (e.g. specific projects) with hard deadlines\n\n## 10. PIP: resources and support\n\n- [ ] Confirm commitment to helping the person achieve the goals and pass the PIP\n- [ ] Offer to help prioritize and remove or navigate blockers\n- [ ] State that the person is expected to take initiative and self-direct within the plan\n- [ ] Point to relevant educational resources or training where useful\n- [ ] Name the HR partner available for additional support or guidance\n\n## 11. PIP: progress checks and evaluation\n\n- [ ] Set a weekly meeting cadence to discuss progress against the plan\n- [ ] Ask the person to keep notes and records of accomplishments and blockers\n- [ ] Set the PIP duration — typically four to six weeks — and the evaluation date\n- [ ] State plainly that the PIP may be ended early\n- [ ] State plainly that entering the PIP does not guarantee employment for its duration\n- [ ] State plainly that the at-will nature of employment is unchanged throughout\n- [ ] State plainly that, given the duration and seriousness of the deficiencies, failing to meet the outlined expectations may result in termination\n- [ ] State plainly that successfully completing the PIP requires sustained performance afterward, and further underperformance may end employment without a further PIP\n\n## 12. PIP: close and signatures\n\n- [ ] Summarize that this is an important opportunity to demonstrate meeting all expectations for the role\n- [ ] Reaffirm commitment to clear feedback and guidance throughout\n- [ ] Invite questions about the process at any time\n- [ ] Confirm the person has read the plan, discussed it with their manager, and understands it\n- [ ] Collect employee signature\n- [ ] Collect manager signature\n\n## 13. Managing Out Checklist (run in this order)\n\n- [ ] Provide feedback on the performance issues\n- [ ] Document the feedback\n- [ ] If relevant, run a formal performance improvement process\n- [ ] Familiarize yourself with local employment regulations\n- [ ] Inform your manager and your HR partner, if you have one\n- [ ] Hold the coaching-out conversation with your report\n- [ ] Agree on the timeline for leaving and the communication plan\n- [ ] Announce the departure to the team or organization, including transition-plan details if the role requires immediate coverage\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "How I handle underperformance as one arc — documented feedback first, a PIP only if it persists, and a humane exit only if it still does not resolve — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. NOA: an earnest first-time people manager, short wavy hair, rolled-up shirt sleeves, carries a clipboard with a long checklist.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: a stunned employee reacts to receiving a Performance Improvement Plan they never saw coming, while a manager watches from the doorway.](assets/images/managing-underperformance/comic-01-the-surprise-pip.jpeg)\n**Panel 1:** *The hook: if a PIP surprises anyone, the manager already failed.*\n\n![Comic panel: a manager notices a performance gap in a 1:1 but stays silent, the concern fading into an unspoken thought bubble.](assets/images/managing-underperformance/comic-02-the-quiet-gap.jpeg)\n**Panel 2:** *The problem: silence about a gap is not mercy, it is a debt that grows.*\n\n![Comic panel: a manager gives vague verbal feedback with no notes, the words dissolving into mist behind them.](assets/images/managing-underperformance/comic-03-verbal-only.jpeg)\n**Panel 3:** *The wrong way: feedback with no date, no example, and no paper trail helps no one.*\n\n![Comic panel: an executive points to a whiteboard arc reading DOCUMENT, PIP, MANAGE OUT, with DOCUMENT circled and emphasized.](assets/images/managing-underperformance/comic-04-document-first.jpeg)\n**Panel 4:** *The principle: document early and in writing; a PIP is an escalation, never an opener.*\n\n![Comic panel: a manager pins four connected letters on a corkboard showing a feedback loop, with an executive nodding approval.](assets/images/managing-underperformance/comic-05-four-letters.jpeg)\n**Panel 5:** *How it runs: initial documentation, a progress update, then back on track or insufficient progress.*\n\n![Comic panel: a manager and employee sit with a signed Performance Improvement Plan while a calendar shows a highlighted four-to-six-week span with weekly check-ins.](assets/images/managing-underperformance/comic-06-four-to-six-weeks.jpeg)\n**Panel 6:** *The mechanic: four to six weeks, up to three improvement areas, weekly progress checks.*\n\n![Comic panel: a manager points to an at-will and no-guarantee clause on a plan while the employee nods, unsurprised.](assets/images/managing-underperformance/comic-07-honest-about-stakes.jpeg)\n**Panel 7:** *The cost: naming the stakes plainly is harder than softening them, but softening them is what blindsides people later.*\n\n![Comic panel: a manager, an executive, and an HR partner sit together reviewing an eight-step checklist calmly.](assets/images/managing-underperformance/comic-08-managing-out-together.jpeg)\n**Panel 8:** *The closer: managing out is a sequence you run with others, not a failure you carry alone.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
