<script id="data" type="application/json">{"meta": {"id": "PPL-CAREER-CONVERSATIONS", "status": "draft:gray", "title": "Career Conversations", "date": "2026-07-28", "author": "Željko Obrenović", "permalink": "career-conversations", "timetoread": "7 min", "excerpt": "I run a one-off, 60-minute career conversation with every report — 30 to 45 minutes for someone fresh out of school — because I cannot develop someone whose motivations I know only from their last performance cycle. I announce the plan up front, send a goals reminder exactly one day before, ask them to walk me through their whole history, and end with two or three development goals we track together.", "tags": "people management, career conversations, 1:1s, development, motivation, onboarding", "icon": "assets/icons/career-conversations.png", "logo": "assets/images/career-conversations/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["people management", "career conversations", "1:1s", "development", "motivation", "onboarding"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: I cannot develop someone whose motivations I know only from their last performance cycle — a snapshot of the last six months tells me what they did, not why they do anything. So I run a one-off, 60-minute career conversation with every report early in our working relationship — 30 to 45 minutes for someone fresh out of school — built around a single instruction: walk me through your history. One deliberate hour spent understanding a person's whole arc, asked about honestly and referenced deliberately afterward, pays back for years of better 1:1s, better delegation, and better development decisions.\n\n## Statement\n\nMy operating model for career conversations has five parts:\n\n- **Every report gets one, early.** A new team member gets a career conversation scheduled within the first few weeks — not folded into onboarding logistics, not deferred until \"things settle down.\" It is a fixed tool, not an occasional nicety.\n- **Announce it before I schedule it.** I tell the team, or the individual, that this conversation is coming and why, before the calendar invite lands. No one is surprised by an unlabeled 60-minute hold from their manager.\n- **The reminder goes out exactly one day before — not earlier.** Too early and people start over-preparing a stranger's job interview instead of a get-to-know-you conversation. One day out is enough to orient, not enough to rehearse.\n- **No prep required, résumé optional.** I say this explicitly in the reminder. The conversation works because it is a conversation, not a presentation the other person has to build.\n- **Walk me through your history, and ask why a lot.** I do not run a checklist of questions in order — I follow one instruction and stay curious: where they grew up, why they chose their school, what they did right after college and why, their favorite and least favorite jobs and how each was chosen, and what kind of work — not what title — they picture five years out.\n\n![Diagram of a five-step loop: every report gets one early, announce first, remind one day before, no prep required, then walk through their history.](assets/images/career-conversations/career-conversation-five-part-loop.jpeg)\n**Figure 1:** *The operating model is a five-part loop, not a one-time checklist: it runs the same way for every report.*\n\n## How to Read This\n\nThis journal is my people-management toolkit, grounded in the companion workbooks to Claire Hughes Johnson's *Scaling People: Tactics for Management and Company Building* (Stripe Press, 2023), read through a practitioner-executive lens. This record is grounded in the **Career Conversations** tool from Chapter 4 of the workbooks (pp. 89–92): a scripted pre-conversation announcement and reminder, a \"walk me through your history\" conversation structure, and a wrap-up that produces two or three development goals. The runnable version — scripts, question prompts, and the notes template — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**A performance cycle is too short a window to see a person's motivations.** Performance reviews tell me what someone accomplished against a set of goals over a few months. They do not tell me why that person chose this career, what they find energizing versus draining, or where they picture themselves in five years. Without that context, my coaching defaults to generic advice and my delegation decisions default to guesswork. The career conversation exists to fill exactly that gap, once, deliberately, rather than never.\n\n**The announcement is not a courtesy — it prevents a false read.** An unexplained 60-minute 1:1 from a manager reads as ominous to most people. Announcing the plan in a team meeting or an early 1:1, with the script framed as \"get-to-know-you\" rather than evaluative, changes what the person brings into the room. I say plainly that these are among my favorite conversations and that they help me understand a person's career narrative — because that framing is true, and because a report who expects curiosity behaves differently than one bracing for a verdict.\n\n**Timing the reminder is a deliberate design choice, not an afterthought.** The workbook is specific: send the reminder the day before, not earlier. I've found the same holds in practice — a reminder sent a week out invites over-preparation, turning a conversation into a rehearsed narrative instead of an honest one. A reminder sent the day before gives someone enough notice to mentally prepare without enough time to over-script. The reminder also restates, again, that no prep is required and a résumé is optional — repetition here is not redundant, it is what actually lowers anxiety.\n\n![Timeline showing three reminder-timing choices before a career conversation: a week before causes over-preparation, one day before is the right amount of notice, and no notice catches someone off guard.](assets/images/career-conversations/reminder-timing-gate.jpeg)\n**Figure 2:** *The reminder is timed on purpose: early enough to orient, late enough that no one over-prepares.*\n\n**\"Walk me through your history\" beats a fixed question list because the value is in the \"why,\" not the facts.** I ask about childhood and family only far enough to respect what someone wants to share — never prying, narrowing to plain facts about location and schooling if a person is reluctant. From there the questions move forward in time: why this school, why this first job out of college, what they expected versus what happened, which jobs they loved and hated and how each one was actually chosen. The facts are easy to get; the pattern only shows up when I keep asking why. Post-college decisions in particular expose early motivations that people tend to carry for the rest of their career, which is why I linger there rather than rushing to the present.\n\n**The five-years-out question is about type of work, not a title.** I deliberately steer away from \"what role do you want\" and toward \"what does your day-to-day look like\" — management, research, execution, leadership, communication, analytics, problem-solving. Nobody is held to this as a plan; I say so explicitly. Its value is as a reference point I can return to later, when the person is choosing between two projects or deciding what to delegate, so that choice gets weighed against a five-year direction instead of only this quarter's convenience.\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| Every report gets one 60-minute career conversation, early. | It replaces the weekly 1:1 or the performance review — it is a single, separate session that feeds both. |\n| The plan is announced before it is scheduled. | The conversation is a surprise evaluation dressed up as a chat. |\n| The goals reminder goes out exactly one day before. | Earlier is safer — earlier causes over-preparation, which defeats the point. |\n| No prep is required; a résumé is optional. | The person must arrive with a rehearsed career narrative. |\n| I ask \"why\" repeatedly and take notes to find patterns. | I run a fixed script of questions with no follow-up. |\n| The five-year answer is a reference point for future choices. | The five-year answer is a plan the person is held to. |\n\nConcretely: every new report on my team has a career conversation on the calendar within their first weeks, announced ahead of time, with a same-shape reminder sent exactly one day out. I leave every conversation with written notes and two or three development goals shared with the person, and I can point to a specific later moment — a project choice, a delegation decision — where I referenced those notes.\n\n![Diagram of a conversation arc moving from early career choices through favorite and least-favorite roles to a five-year projection by type of work, funneling into two or three written development goals.](assets/images/career-conversations/conversation-arc-to-goals.jpeg)\n**Figure 3:** *The conversation moves forward through a career, then funnels into a short, written wrap-up: two or three goals, referenced later.*\n\n## Anti-Patterns\n\n- **Skipping it because the person \"seems settled.\"** Tenure is not a substitute for ever having asked about motivation directly.\n- **The surprise 60-minute hold.** Scheduling the conversation without announcing it first, so the person spends the meeting guessing what it's for instead of talking about their history.\n- **The early reminder.** Sending the goals reminder a week out instead of one day out, which invites a rehearsed pitch instead of an honest conversation.\n- **Treating \"no prep required\" as a formality.** Saying it once in passing instead of stating it plainly in the reminder, so the person prepares anyway.\n- **Interrogating instead of listening.** Turning \"walk me through your history\" into a rapid-fire Q&A instead of following the person's own thread and asking why.\n- **Letting the notes evaporate.** Taking notes in the room and never opening them again — the conversation's value is in referencing it months later, not in having had it once.\n- **Treating the five-year answer as a commitment.** Holding someone to \"management\" or \"research\" as a locked-in plan instead of a reference point that can shift.\n\n## Related Records\n\n- [Performance Reviews](performance-reviews.html) — the recurring written evaluation of current performance; the career conversation supplies the motivational context that makes those reviews land as coaching rather than judgment.\n- [Manager Transitions](manager-transitions.html) — when a report gets a new manager, the career-conversation notes are part of what should transfer, so the new manager isn't starting from zero.\n- [Coaching](../grounded-product-management/coaching.html) (product journal) — the ongoing assessment-plan-1:1 loop; the career conversation is the single session that gives that loop its motivational grounding.\n- [Staffing](../grounded-product-management/staffing.html) (product journal) — how people arrive on a team; the career conversation is one of the first tools I run once they're staffed.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs how I run the one-off career conversation with every report: the pre-conversation announcement and reminder, the conversation structure, and the wrap-up that produces development goals. I revisit it whenever I notice I am referencing a report's five-year answer as a fixed plan rather than a reference point, whenever a reminder goes out earlier than one day before, or whenever I go a full onboarding cycle without holding this conversation with a new report.\n\n## Authoritative References\n\n- Claire Hughes Johnson, *Scaling People: Tactics for Management and Company Building* (Stripe Press, 2023) — the companion workbooks, Chapter 4: the Career Conversations tool this record distills.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "6 min read"}, "blocks": [{"type": "markdown", "content": "*The working tool behind this record. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Setup\n\n- [ ] Schedule a one-off 1:1 with each report: 60 minutes (30–45 minutes for someone early in their career)\n- [ ] Announce the plan before the invite lands — at a team meeting, or by email / in a 1:1 for a single new person\n- [ ] Frame it as a get-to-know-you conversation: their past career moves and a start on future development goals\n- [ ] State explicitly: no preparation required beyond being ready to talk through their history; a résumé is optional\n\n## 2. Reminder — exactly one day before\n\n- [ ] Send the goals reminder the day before the meeting, not earlier (earlier invites over-preparation)\n- [ ] Restate the goals: I mainly want to get to know you; we'll focus on the choices you made and what motivated them\n- [ ] Note that toward the end we'll project out five years — not a title, but what the general work and day-to-day might look like\n- [ ] Say plainly that no one is held to a five-year plan; it becomes a reference point for later choices\n\n## 3. The conversation — \"walk me through your history\"\n\nFollow the person's thread rather than a script. Actively listen, take notes for future reference, and ask \"why\" a lot. The aim: what motivates them, why they made their choices, what they think of those choices now, what they haven't explored or want to return to.\n\n- [ ] Early background — keep to what the person volunteers; if reluctant, narrow to plain facts: location, schooling, early interests\n- [ ] School — what interested them, why that school, why that course of study\n- [ ] Right after school — what they did and why; where they thought they'd end up, and whether they did (early motivations tend to persist — linger here)\n- [ ] Favorite and least favorite roles — how each role was actually chosen; what they learned about work they're good at and enjoy versus work they find hard\n- [ ] Work up to the present, dig into telling details, and surface patterns together\n- [ ] Five years out — type of work, not title: management, research, execution, leadership, communication, analytics, problem-solving, consulting; identify what exposure they still need\n\n## 4. Wrap-up\n\n- [ ] Recap what you heard and share your notes with the person\n- [ ] Jointly write down 2–3 development goals to track together\n- [ ] File the notes where you will actually re-read them\n\n## 5. Afterward\n\n- [ ] Reference the conversation in later 1:1s when the person faces choices — which project to take, what to delegate\n- [ ] Weigh those choices against the five-year direction, not only this quarter's needs\n- [ ] Feed the development goals into the coaching plan and the next performance conversation\n- [ ] On a manager change, hand the notes and goals over as part of the transition\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why one deliberate hour on a person's whole career beats a dozen status-shaped 1:1s — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. NOA: an earnest first-time people manager, short wavy hair, rolled-up shirt sleeves, carries a clipboard with a long checklist.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Noa stares at a thin performance-review folder while Vera taps it, looking skeptical.](assets/images/career-conversations/comic-01-thin-context.jpeg)\n**Panel 1:** *The hook: a performance cycle tells you what someone did, not why.*\n\n![Comic panel: Noa and a report hunched over a task tracker full of ticket statuses during a 1:1.](assets/images/career-conversations/comic-02-status-only-1-1s.jpeg)\n**Panel 2:** *The problem: the 1:1 turned into status theater, and development fell off the agenda.*\n\n![Comic panel: a report stares nervously at an unlabeled 60-minute calendar hold from their manager.](assets/images/career-conversations/comic-03-surprise-hold.jpeg)\n**Panel 3:** *The wrong way: a surprise 60-minute hold that reads like a verdict, not a conversation.*\n\n![Comic panel: Vera writes CAREER CONVERSATION on a whiteboard with the instruction 'Walk me through your history' circled below.](assets/images/career-conversations/comic-04-the-tool.jpeg)\n**Panel 4:** *The tool: a one-off, 60-minute career conversation with every report, early.*\n\n![Comic panel: Noa announces the plan to her team, then a reminder note pinned to a calendar the day before the meeting.](assets/images/career-conversations/comic-05-announce-then-remind.jpeg)\n**Panel 5:** *How it runs: announce the plan up front, then send the reminder exactly one day before, not earlier.*\n\n![Comic panel: Noa's clipboard shows a timeline from first job to favorite and least favorite roles to a five-year projection labeled type of work, not title.](assets/images/career-conversations/comic-06-five-years-by-type-of-work.jpeg)\n**Panel 6:** *The mechanic: walk the history forward, then project five years out by type of work, not title.*\n\n![Comic panel: Noa pauses mid-conversation, holding back a quick conclusion, pen ready over her clipboard.](assets/images/career-conversations/comic-07-ask-why-not-diagnose.jpeg)\n**Panel 7:** *The cost: it takes a whole patient hour of asking why, not a quick diagnosis.*\n\n![Comic panel: Noa references written career-conversation notes while discussing a project choice with a report, as Vera nods from the doorway.](assets/images/career-conversations/comic-08-referenced-months-later.jpeg)\n**Panel 8:** *The closer: one deliberate hour, referenced months later, pays back for years.*\n"}]}]}</script>

        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
