<script id="data" type="application/json">{"meta": {"id": "PPL-LEADERSHIP-TEAM-UPDATES", "status": "draft:gray", "title": "Leadership Team Updates", "date": "2026-07-28", "author": "Željko Obrenović", "permalink": "leadership-team-updates", "timetoread": "7 min", "excerpt": "I run my leadership team on a written pre-read with a hard deadline, not a meeting that discovers its own agenda live. Every member updates their snippet by Sunday night, actions carry a name and a due date, and the standing agenda spends its time deciding rather than reporting. Every meeting also explicitly decides what gets communicated down to the wider organization.", "tags": "people management, leadership team, meetings, cadence, communication, executive operating rhythm", "icon": "assets/icons/leadership-team-updates.png", "logo": "assets/images/leadership-team-updates/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["people management", "leadership team", "meetings", "cadence", "communication", "executive operating rhythm"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: My leadership team runs on a written pre-read — the Leadership Team Snippets and Updates — due by 10 p.m. the Sunday night before we meet, not on live status reporting. Actions carry a name and a due date and live in a tracking spreadsheet everyone can see before the meeting starts. The agenda is timed and structured so the room spends its scarce synchronous time deciding, not narrating, and every single meeting closes by explicitly deciding what gets communicated down to the wider leadership team and the company.\n\n## Statement\n\nMy operating model for leadership team updates has six parts:\n\n- **The pre-read has a hard deadline.** Every leadership team member updates their snippet by 10 p.m. the Sunday night before the meeting. No deadline means no pre-read, and no pre-read means the meeting reverts to live status theater.\n- **Actions have a name, an action, and a due date.** Every open action is tracked in a shared spreadsheet linked from the pre-read, not scattered across memory and side channels.\n- **The agenda is timed and mostly about deciding.** Actions get 5 minutes, a user guest gets 10. Metrics review gets 30, alternating weekly with a launch review. Recruiting, internal audit, and a CEO topic each get their fixed slot. The single largest block — 60 to 120 minutes — goes to reviewing top goals and strategic priorities, because that is the decision this team exists to make together.\n- **Four questions are asked every meeting, without exception.** QBR reflections from the past week; anything worth sharing wider or company-wide; anything anyone objects to passing down in staff meetings; and, explicitly, what decisions were made and what must be clearly communicated to the wider leadership team.\n- **Customer issues and wins are a standing item, and each one has an owner.** Every key customer issue names the action taken and who owns it; every key win names the contributors behind it — customers do not surface only when something has already gone wrong.\n- **Every executive writes their own snippet.** Action-item updates, whereabouts, potential discussion topics and why they matter, status and learnings on major initiatives, customer meeting notes, launch and PR plans in flight, and information on top talent — written by the person who owns it, not summarized secondhand by someone else.\n\n![Circular loop diagram showing the weekly cycle: snippet by deadline, tracked actions, timed decision meeting, downward communication, repeating.](assets/images/leadership-team-updates/leadership-updates-weekly-loop.jpeg)\n**Figure 1:** *The operating model is a weekly loop, not a single meeting: the pre-read and the agenda feed each other every cycle.*\n\n## How to Read This\n\nThis journal is my people-management toolkit, and this record is grounded in the **Leadership Team Snippets and Updates** template from the companion workbooks to Claire Hughes Johnson's *Scaling People: Tactics for Management and Company Building* (Stripe Press, 2023), read through a practitioner-executive lens: a fixed pre-read document and a timed standing agenda that turn a recurring leadership meeting into a decision-making instrument rather than a status ritual. The runnable tool — the pre-read fields, the agenda timing, and the standing questions — lives in the **Checklist** tab.\n\n## Rationale\n\n**A deadline is what makes a pre-read real.** A pre-read without an enforced due date is a suggestion, and suggestions get skipped under pressure — which is exactly when the leadership team most needs the discipline. Setting the deadline at 10 p.m. the Sunday night before the meeting gives every member a fixed, predictable window to write, gives everyone else time to actually read before walking in, and gives the facilitator a clean cutoff to notice who did not update. The deadline is not a courtesy; it is the mechanism that converts \"we should all be aligned\" into \"we are aligned because we all did the reading.\"\n\n![Split diagram contrasting a soft, unenforced due date against a hard 10pm Sunday deadline with a clean cutoff.](assets/images/leadership-team-updates/leadership-updates-deadline-vs-suggestion.jpeg)\n**Figure 2:** *A soft due date is a suggestion; a hard 10 p.m. Sunday cutoff is the mechanism that makes the pre-read real.*\n\n**Actions need a name and a date or they evaporate.** An action item that lives only in a meeting's memory dies the moment the meeting ends. Linking the pre-read to a tracking spreadsheet, and recording every action as name, action, and due date, means nothing open is anonymous and nothing open is timeless. The 5-minute actions slot at the top of the agenda is not for re-litigating each item — it is for surfacing the ones that slipped, because the spreadsheet already told everyone what is done.\n\n**A timed agenda is a budget, and budgets force priority.** Fixed minutes per topic — actions at 5, the user guest at 10, metrics or launch review at 30, recruiting at 10, quarterly internal audit at 10, a CEO topic at 10 — are not bureaucratic decoration. They are a forcing function: if a topic cannot be handled in its slot, it gets escalated to the largest block (60 to 120 minutes for top goals and strategic priorities) or taken offline, rather than quietly consuming everyone else's time. Alternating the metrics review with a launch review weekly keeps both current without doubling the agenda's length every week.\n\n![Proportional stacked bar diagram of the agenda's timed segments, with the top-goals block visually dominating all other segments combined.](assets/images/leadership-team-updates/leadership-updates-agenda-budget-map.jpeg)\n**Figure 3:** *The agenda is a budget: every fixed slot is small next to the one block reserved for strategic priorities.*\n\n**The standing questions are how culture gets audited on a schedule.** Four questions recur at every single meeting regardless of what else is on the agenda: reflections from the past week's QBRs, anything worth sharing wider or company-wide, anything anyone objects to passing down in staff meetings, and — the one I weight most heavily — what decisions were made and what must be clearly communicated to the wider leadership team. That last question is not optional color; it is the moment the leadership team takes explicit ownership of what the rest of the company will hear, and when, rather than leaving downstream communication to chance or to whoever happens to mention it first.\n\n**Snippets keep the team's peripheral vision intact.** Beyond actions and decisions, each executive's own snippet — potential discussion topics and why, status and learnings on major initiatives, customer meeting notes, launch and PR plans in flight, top-talent news, and simple whereabouts — is what keeps the team from surprising each other. A leadership team that only talks about the agenda's fixed items slowly loses track of what its own members are actually doing; the snippet is deliberately broader than the agenda so that context, not just decisions, keeps flowing.\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| The pre-read is due by 10 p.m. the Sunday before the meeting, without exception. | The deadline is a soft target that slides when someone is busy. |\n| Actions are tracked as name, action, and due date in a shared spreadsheet. | Actions live in the meeting notes or in someone's head until the next meeting. |\n| The agenda has fixed minutes per topic, including a large block for top goals and strategic priorities. | Every topic gets whatever time the room feels like giving it that week. |\n| Every meeting explicitly decides what gets communicated down to wider leadership. | Downward communication happens informally, if and when someone remembers. |\n| Each executive writes their own snippet — customer notes, initiative status, top talent. | A chief of staff or note-taker reconstructs everyone's updates after the fact. |\n| Metrics review and launch review alternate weekly so both stay current. | Metrics and launch status are reviewed only when there is spare time. |\n\nConcretely: I do not open a leadership meeting without having read every snippet first, and I do not let the meeting run past its timed agenda without naming the trade-off out loud. If the \"what must we communicate down\" question produces no answer some week, I treat that as a signal to ask harder, not as evidence there is nothing to say.\n\n## Anti-Patterns\n\n- **The pre-read as an afterthought.** Snippets written five minutes before the meeting starts, or not written at all, turn the meeting back into a status-reporting exercise the pre-read was supposed to replace.\n- **Actions with no owner or no date.** An action item recorded as \"we should look into this\" is not an action — it is a wish that will resurface unchanged in three months.\n- **An untimed agenda that always runs long on the easy topics.** Comfortable topics expand to fill available time; the strategic-priorities block gets squeezed to the last ten minutes of a two-hour meeting.\n- **Silence on downward communication.** The team discusses and decides, then nobody agrees on what the rest of the organization should hear — so three different versions of the decision circulate in staff meetings by Friday.\n- **Snippets ghost-written by an assistant.** A summary written by someone other than the executive loses the \"why this matters\" judgment only the owner can supply, and quietly removes their accountability for the update.\n- **Customer issues and wins that never surface.** Without a standing customer-issues and customer-wins section, the leadership team only hears about customers when something has already gone wrong enough to escalate.\n\n## Related Records\n\n- [Quarterly Business Reviews](quarterly-business-reviews.html) — the QBR is the deeper business-health review; the standing question \"QBR reflections from the past week\" is how its output feeds directly into this weekly cadence.\n- [Team Offsites](team-offsites.html) — offsites handle the strategic work too large for a weekly slot; leadership updates handle the weekly cadence that keeps the team aligned between offsites.\n- [Meetings](../grounded-engineering-executive/meetings.html) — the engineering-journal record on what makes a meeting worth holding; this record is the leadership-team-specific application: a pre-read deadline plus a timed agenda that spends its time deciding.\n- [Internal Communication](../grounded-engineering-executive/internal-communication.html) — the engineering-journal record on communicating deliberately across an organization; the standing \"what must be communicated down\" question is this template's concrete answer for the leadership team specifically.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs the leadership team's own recurring pre-read and meeting cadence — the deadline, the actions tracker, the timed agenda, the standing questions, and the per-executive snippet — not the broader quarterly or offsite cadences it links to. I will revise it if the team's size or structure changes the right agenda timing, if the deadline stops being honored and needs a different enforcement mechanism, or if the standing questions prove to miss something the team consistently needs to surface.\n\n## Authoritative References\n\n- Claire Hughes Johnson, *Scaling People: Tactics for Management and Company Building* (Stripe Press, 2023) — the companion workbooks, \"Leadership Team Snippets and Updates\" template (Chapter 4: Exercises and Templates).\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "6 min read"}, "blocks": [{"type": "markdown", "content": "*The working tool behind this record. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Deadline\n\n- [ ] Snippet and update pre-read is due by 10 p.m. the Sunday night before the meeting\n- [ ] No exceptions for a slipped deadline — a late snippet still gets sent, flagged as late\n- [ ] Facilitator confirms all snippets are in before the meeting starts\n- [ ] Date of the meeting is recorded on the pre-read\n\n## 2. Actions\n\n| Name | Action | Due date |\n| --- | --- | --- |\n| | | |\n\n- [ ] Every open action has an owner's name\n- [ ] Every open action has a due date\n- [ ] Actions list is kept in the linked spreadsheet, not re-typed each week\n\n## 3. Discussion topics (timed agenda)\n\n| Topic | Time |\n| --- | --- |\n| Actions | 5 mins |\n| User guest | 10 mins |\n| Metrics review (alternates weekly with launch review) | 30 mins |\n| Leadership recruiting update | 10 mins |\n| Internal audit update (quarterly) | 10 mins |\n| Topic from the CEO | 10 mins |\n| Review top goals and strategic priorities | 60–120 mins |\n\n- [ ] Metrics review and launch review alternate weekly — confirm which one is due this week\n- [ ] Launch review covers upcoming launches and overall roadmap status\n- [ ] Internal audit update runs quarterly, not every meeting\n- [ ] Top goals and strategic priorities gets the largest block on the agenda\n\n## 4. Standing questions (ask every meeting)\n\n- [ ] What are the QBR reflections from the past week?\n- [ ] Are there any snippets to share with the wider leadership team or company-wide?\n- [ ] Are there any topics discussed that anyone objects to being passed down in staff meetings?\n- [ ] What decisions were made, and what must be clearly communicated to the wider leadership team?\n\n## 5. Customer issues and wins\n\n- [ ] Short summary of each key customer issue, the action taken, and the owner\n- [ ] Short summary of key customer wins and the contributors behind them\n\n## 6. Per-executive snippet\n\nFor each leadership team member:\n\n- [ ] Executive team member name\n- [ ] Assigned action-item updates (cross-reference the tracking spreadsheet)\n- [ ] General updates — whereabouts, travel plans, offsites\n- [ ] Potential topics for discussion, and why they should be discussed\n- [ ] Status and learnings on a major company or product initiative, or on a customer-contract negotiation\n- [ ] Top-level notes from a customer meeting or external event\n- [ ] Launch, event, or PR plans currently in flight\n- [ ] Information on top talent\n\n## 7. Notes\n\n- [ ] Space reserved for free-form meeting notes captured live\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "A leadership meeting runs on a written pre-read with a deadline, not on live status reporting — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. NOA: an earnest first-time people manager, short wavy hair, rolled-up shirt sleeves, carries a clipboard with a long checklist.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Noa walks into a leadership meeting room with no shared pre-read document in sight.](assets/images/leadership-team-updates/comic-01-the-meeting-that-discovers-itself.jpeg)\n**Panel 1:** *The hook: a meeting that discovers its own agenda live has already gone wrong.*\n\n![Comic panel: executives narrate their own status around a table while others disengage and check phones.](assets/images/leadership-team-updates/comic-02-status-theater.jpeg)\n**Panel 2:** *The problem: without a pre-read, the meeting reverts to status theater.*\n\n![Comic panel: Noa types a late-night snippet at her desk beside a sticky note reading due whenever.](assets/images/leadership-team-updates/comic-03-the-soft-deadline.jpeg)\n**Panel 3:** *The wrong way: a pre-read with a soft deadline is just a suggestion.*\n\n![Comic panel: Vera points at a clock reading 10 PM beside a calendar with Sunday circled while Noa takes notes.](assets/images/leadership-team-updates/comic-04-ten-pm-sunday.jpeg)\n**Panel 4:** *The principle: a hard Sunday-night deadline, not live status reporting.*\n\n![Comic panel: Vera points at a wall agenda of timed blocks with a large one at the bottom while Noa checks her clipboard.](assets/images/leadership-team-updates/comic-05-the-timed-agenda.jpeg)\n**Panel 5:** *How it runs: a timed agenda where the biggest block is reserved for strategy.*\n\n![Comic panel: Noa compares a short list of small timed agenda items against one long 60-120 minute bracket on her clipboard.](assets/images/leadership-team-updates/comic-06-sixty-to-one-twenty.jpeg)\n**Panel 6:** *The mechanic: 60 to 120 minutes for top goals — the room's scarcest time, spent on purpose.*\n\n![Comic panel: Vera underlines a fourth standing question on a whiteboard about communicating decisions down while Noa pauses.](assets/images/leadership-team-updates/comic-07-the-fourth-question.jpeg)\n**Panel 7:** *The cost: naming what goes down to the wider team takes time every meeting — skipping it costs more later.*\n\n![Comic panel: the leadership team sits engaged with their snippets open as Noa checks the last box on her clipboard.](assets/images/leadership-team-updates/comic-08-everyone-did-the-reading.jpeg)\n**Panel 8:** *The closer: everyone did the reading, so the room is free to decide.*\n"}]}]}</script>

    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
