<script id="data" type="application/json">{"meta": {"id": "PPL-HIRING-WRITTEN-EXERCISES", "status": "draft:gray", "title": "Written Exercises", "date": "2026-07-28", "author": "Željko Obrenović", "permalink": "hiring-written-exercises", "timetoread": "7 min", "excerpt": "I test writing with a bounded, rubric-graded take-home, never with vibes. A well-built written exercise doubles as a signal of how a candidate works: whether they return a quality response on time tells me a great deal about how they'll operate once hired. I score it on a fixed 12-point rubric, and I let the rubric — not my impression — make the call.", "tags": "people management, hiring, interviewing, written exercise, rubric, product sense", "icon": "assets/icons/hiring-written-exercises.png", "logo": "assets/images/hiring-written-exercises/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["people management", "hiring", "interviewing", "written exercise", "rubric", "product sense"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: For writing-heavy roles I test writing with a bounded, rubric-graded exercise, never with vibes. I hand the candidate a real problem, a firm scope (about three hours, a few pages, treated as a pre-read I'd send before a meeting), and I score what comes back on a fixed 12-point rubric across written communication, data analysis, customer sense, and product sense. The exercise itself is a signal before I read a single word of the response: whether a candidate returns a quality deliverable on time tells me how much they value timeliness and diligence — the same things I expect from them once they're hired.\n\n## Statement\n\nMy operating model for the written exercise has five parts:\n\n- **I test the actual skill, not a proxy for it.** If the role lives and dies on written communication — a PM's narrative doc, a memo that has to survive without the author in the room — I test that skill directly, with a real writing sample, rather than inferring it from how articulate someone sounds in an interview.\n- **I bound the exercise tightly.** Roughly three hours of the candidate's time, an output capped at a few pages, and an explicit framing: treat the deliverable as a pre-read I would send before a meeting. An unbounded exercise tests free time, not skill.\n- **I give a real prompt with reasonable assumptions allowed.** The candidate gets an example dataset and a scenario — analyze churn, explain what's driving it, propose a prioritized retention roadmap — with all data definitions provided up front so the exercise tests thinking, not archaeology.\n- **I score against a fixed rubric before I trust my gut.** Every response gets 3 points each on written communication, data analysis, customer sense, and product sense — 12 points total — scored against poor/good/excellent anchors I wrote down before I read the first submission.\n- **The score, not the read, drives the call.** The 12-point total maps to a fixed decision band, set before I read a single submission, and I let the number constrain me even when a response reads well.\n\n![Diagram showing a five-step pipeline: real skill, bounded scope, real prompt, fixed rubric, score decides.](assets/images/hiring-written-exercises/written-exercise-operating-loop.jpeg)\n**Figure 1:** *The operating model runs as one pipeline: skill, scope, prompt, rubric, decision.*\n\n## How to Read This\n\nThis journal is my people-management toolkit — the concrete tools I run management with, not just the principles behind them. This record is grounded in the \"Written Exercise Example\" and its grading rubric from Claire Hughes Johnson's *Scaling People* companion workbooks, read through a practitioner-executive lens: the workbook hands me a ready-made product-manager exercise and a scoring system; I read it as the operating standard for testing writing in any hiring loop where writing is the job. The runnable tool — the prompt template, the scope guardrails, and the full rubric as tables — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**A well-built exercise is a signal before I read the response.** The workbook is explicit about this, and I hold onto it as a first-class reason to run the exercise at all: asking candidates to complete a decent, well-constructed written exercise — with clear instructions — is an opportunity to signal that my organization's work culture values timeliness and diligence. Whether a candidate returns a high-quality response on time tells me a great deal about how much they value those same qualities. I get this signal for free, before scoring a single sentence.\n\n**Scope is the control variable.** Three hours of effort and a few pages of output are not arbitrary — they are what keeps the exercise a test of judgment rather than a test of stamina. I frame the deliverable explicitly as a pre-read I would send before a meeting, because that framing forces the same discipline the job will actually demand: say the important thing first, support it with evidence, and don't pad. A candidate who turns in twenty pages has already told me something about how they'll write memos once hired.\n\n![Diagram contrasting an overflowing unbounded stack of pages against a short, bounded three-hour pre-read exercise.](assets/images/hiring-written-exercises/bounded-vs-unbounded-exercise.jpeg)\n**Figure 2:** *Scope is the control variable: bounded to three hours and a few pages, it tests judgment, not stamina.*\n\n**Reasonable assumptions are part of the test, not an escape hatch.** I hand over a real dataset with all data definitions provided, and I explicitly invite the candidate to make reasonable assumptions where the prompt is silent — because a real job never comes with perfectly specified inputs either. I judge how a candidate reasons under incomplete information, not whether they can find the one hidden trick in the prompt.\n\n**Four skills, three points each, no exceptions.** The rubric fixes exactly what I am scoring — written communication, data analysis and the ability to translate data into actions, customer sense, and product sense — at 3 points apiece for a clean 12-point total. I don't let a strong response on one axis quietly compensate for a weak one elsewhere in my head; I score each skill against its own anchors and let the total speak. \"Data analysis\" is not just running the numbers — it's whether the candidate parses insights into \"so-whats,\" and \"customer sense\" is not just naming a segment — it's whether that segment is carried through the whole exercise rather than mentioned once and dropped.\n\n**The 12-point scale removes my discretion where I don't want it.** 11–12 is a strong yes, 8–10 is a yes, 7 is a deliberate judgment call, and 6 or below is a no. I built the boundaries before I read anyone's submission, specifically so a response I find personally impressive but that scores low doesn't quietly override the rubric — and so a response I find unremarkable but that scores well doesn't get talked out of a yes.\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| Test writing directly with a real writing sample. | Every role needs a written exercise — only writing-heavy roles do. |\n| Bound the exercise to ~3 hours and a few pages. | Longer or more exhaustive output is better — the cap is the point. |\n| Frame the deliverable as a pre-read before a meeting. | The candidate should format it as a formal report or slide deck. |\n| Score 3 points each across communication, data, customer sense, product sense. | A brilliant answer on one skill offsets a weak one elsewhere. |\n| Let the 12-point rubric drive the decision. | The rubric replaces judgment — 7 is deliberately left as a judgment call. |\n| Give clear instructions and provided data definitions. | Ambiguity in the prompt itself is a valid test of the candidate. |\n\nIn practice, this table is what I hand a new interviewer before their first exercise to score — resume closed, rubric anchors already fixed.\n\n![Diagram of four 3-point skill boxes funneling into a 12-point scale divided into strong yes, yes, judgment call, and no bands.](assets/images/hiring-written-exercises/twelve-point-rubric-to-decision.jpeg)\n**Figure 3:** *Four skills at three points each feed a twelve-point scale with decision bands fixed before scoring begins.*\n\n## Anti-Patterns\n\n- **The unbounded take-home.** No stated time box, no page limit — the exercise quietly tests who has a free weekend, not who thinks well.\n- **Scoring from vibes.** \"I liked it\" or \"it felt thin\" standing in for a rubric I never wrote down before reading submissions.\n- **Rewarding volume.** Treating a fifteen-page response as more thorough rather than recognizing it as a communication failure the pre-read framing was built to catch.\n- **Single-segment customer sense.** A candidate names \"small business customers\" once in paragraph two and never returns to the distinction — scored as if customer sense were demonstrated throughout.\n- **Data without so-whats.** A response that presents every cut of the data with no argument for which slices matter, mistaken for rigor because it's exhaustive.\n- **Letting 7 become an automatic yes or no.** Treating the judgment-call band as a rounding rule instead of an actual decision the hiring team has to make and own.\n\n## Related Records\n\n- [The Interview Loop](interview-loop.html) — the exercise is one stage in the loop; this record covers how that specific stage is built and scored.\n- [Interview Question Bank](interview-question-bank.html) — the live-conversation counterpart; together they cover both what a candidate says and what a candidate produces unsupervised.\n- [Candidate Review](candidate-review.html) — where this exercise's 12-point score enters the broader hiring decision alongside interview signal.\n- [Hiring](../grounded-engineering-executive/hiring.html) — the engineering-journal record on hiring practice generally; this record is the writing-specific instrument inside that practice.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs how I build and score a written exercise for any role where writing is core to the job — most directly product management, but adaptable to any writing-heavy seat. I'll revise it when a role's rubric needs a fifth skill the current four don't cover, when the judgment-call band at 7 points proves too blunt in practice, or when I find a prompt shape that signals better than churn-and-retention for roles outside product management.\n\n## Authoritative References\n\n- Claire Hughes Johnson, *Scaling People: Tactics for Management and Company Building* (Stripe Press, 2023) — the companion workbooks, \"Written Exercise Example\" and its grading rubric (Chapter 3: Exercises and Templates).\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "6 min read"}, "blocks": [{"type": "markdown", "content": "*The working tool behind this record. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Design the exercise\n\n- [ ] Confirm the role is writing-heavy enough to justify a written exercise\n- [ ] Write clear, unambiguous instructions\n- [ ] Cap effort at about three hours\n- [ ] Cap output at no more than a few pages\n- [ ] Frame the deliverable explicitly: treat it as a pre-read you'd send before a meeting\n- [ ] Provide the full dataset (or link to it) up front\n- [ ] Provide all data definitions so the exercise tests thinking, not data archaeology\n- [ ] Tell candidates reasonable assumptions are expected and welcome\n- [ ] State plainly what the exercise will be used to assess\n\n## 2. Product manager written exercise (reference prompt)\n\n- [ ] Set the scenario: users love the product, but it churns; the org takes churn seriously\n- [ ] Ask the candidate to analyze the example churn data\n- [ ] Ask: what is leading to churn?\n- [ ] Ask: what are the most important takeaways from the data?\n- [ ] Ask the candidate to imagine building a retention roadmap\n- [ ] Ask: what projects and product changes would you prioritize to reduce churn?\n- [ ] Require the response to be specific enough to display product sense and technical thinking\n\n## 3. What the exercise assesses\n\n- [ ] Written communication\n- [ ] Data analysis and the ability to translate data into actions\n- [ ] Understanding the customer (customer sense)\n- [ ] Product sense\n\n## 4. Score the rubric — 12 points total\n\n| Points (out of 12) | Decision |\n| --- | --- |\n| 11–12 | Strong yes |\n| 8–10 | Yes |\n| 7 | Judgment call |\n| 6 or below | No |\n\n- [ ] Write down the rubric anchors before reading any submission\n- [ ] Score each of the four skills independently, 1–3 points each\n- [ ] Sum to a total out of 12\n- [ ] Do not let a strong score on one skill silently offset a weak score on another\n- [ ] Treat a score of 7 as a real decision, not a rounding rule\n- [ ] Record the score and rationale alongside the candidate's file\n\n## 5. Rubric — Written communication (3 pts)\n\n| Poor (1 pt) | Good (2 pts) | Excellent (3 pts) |\n| --- | --- | --- |\n| Hard to follow, long-winded, or sloppy. | Deliverable is easy to follow and conveys the main points. Structured, crisp, and clear. | You would feel comfortable sending this as a pre-read. Deliverable is coherently organized and well-articulated. |\n\n## 6. Rubric — Data analysis, ability to translate data into actions (3 pts)\n\n| Poor (1 pt) | Good (2 pts) | Excellent (3 pts) |\n| --- | --- | --- |\n| Only provides basic summary or is unable to pick a small number of cuts (e.g., presents a pivot table of every view of the data without a clear approach for which slices are most impactful). Data barely informs the recommended set of actions, or actions are contradictory to the data analysis. Obvious errors in the data. | Conclusions drawn from the data are strong and accurate. Clarifies which data is most important and why it's worth actioning; parses the insights into \"so-whats.\" | Picked a small number of important metrics to guide next steps and explained their impact on the business. Identifies why next steps clearly fix problems highlighted by the data. |\n\n- [ ] Check for a clear approach to which data cuts matter, not an exhaustive dump\n- [ ] Check that recommended actions are actually supported by the data\n- [ ] Check for obvious data errors\n- [ ] Check whether insights are parsed into explicit \"so-whats\"\n\n## 7. Rubric — Customer sense (3 pts)\n\n| Poor (1 pt) | Good (2 pts) | Excellent (3 pts) |\n| --- | --- | --- |\n| Doesn't identify customer segments and their needs; fails to differentiate recommendations by customer segment. Dismisses particular customer segments as non-addressable (e.g., suggests that companies being acquired should not be considered). | Understands customer needs and provides concrete suggestions that vary by customer segment. | Carries customer insights and needs throughout many sections of the exercise, not just one. |\n\n- [ ] Check whether segments are named and differentiated\n- [ ] Check whether segment thinking is carried through the whole response, not mentioned once\n- [ ] Watch for segments dismissed as non-addressable without justification\n\n## 8. Rubric — Product sense (3 pts)\n\n| Poor (1 pt) | Good (2 pts) | Excellent (3 pts) |\n| --- | --- | --- |\n| Unclear product ideas or inability to tie the product to user or business impact (e.g., recommends numerous \"investigate why\" steps but fails to articulate any product solutions). | Explains product gaps that need to be addressed. Makes a logical, balanced argument about why the company should consider these investments, but may lack a clear prioritization. | Provides creative, specific product ideas, highlighting users or strategy impact; clear prioritization of what is most important. Addresses something unique about their ideas (e.g., their go-to-market strategy would not just generically apply to any segment; calls out technical complexity or other risks associated with pursuing it, etc.). Recommendations are put in the context of the overall industry; discusses the implications for long-term business success. |\n\n- [ ] Check for concrete, prioritized ideas — not just diagnosis\n- [ ] Check for named risks (technical complexity, go-to-market, etc.)\n- [ ] Check for industry context and long-term business implications\n- [ ] Check that ideas are specific to this segment/product, not generic\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Testing writing with a rubric instead of a gut feeling — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. NOA: an earnest first-time people manager, short wavy hair, rolled-up shirt sleeves, carries a clipboard with a long checklist.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Noa shrugs beside a whiteboard that only says a candidate 'felt strong,' with Vera watching skeptically.](assets/images/hiring-written-exercises/comic-01-vibes-verdict.jpeg)\n**Panel 1:** *The hook: a hiring call made on vibes is a coin flip wearing a suit.*\n\n![Comic panel: Noa is charmed by a confident-sounding candidate while a thought bubble reveals messy actual writing.](assets/images/hiring-written-exercises/comic-02-articulate-trap.jpeg)\n**Panel 2:** *The problem: how someone talks in a room is not how they write for one.*\n\n![Comic panel: Noa hands over a huge unbounded take-home folder to an overwhelmed candidate buried in paper.](assets/images/hiring-written-exercises/comic-03-unbounded-take-home.jpeg)\n**Panel 3:** *The wrong way: no scope, no page limit — testing who has a free weekend.*\n\n![Comic panel: Vera hands Noa a card reading 'Test writing. Bound it. Score it.' next to Noa's checklist clipboard.](assets/images/hiring-written-exercises/comic-04-the-principle.jpeg)\n**Panel 4:** *The principle: test writing with a bounded, rubric-graded exercise, never with vibes.*\n\n![Comic panel: Noa hands a candidate a short packet framed as a pre-read, capped at three hours and a few pages, checking it off a clipboard.](assets/images/hiring-written-exercises/comic-05-the-pre-read-framing.jpeg)\n**Panel 5:** *How it runs: a real churn-and-retention prompt, capped at three hours and a few pages, framed as a pre-read.*\n\n![Comic panel: Vera and Noa examine a scorecard with four 3-point skill rows totaling 12 points and marked decision bands.](assets/images/hiring-written-exercises/comic-06-twelve-point-rubric.jpeg)\n**Panel 6:** *The mechanic: four skills at three points each, twelve total, anchored before anyone reads a submission.*\n\n![Comic panel: Noa looks torn over a submission while Vera points at a scorecard showing a 7 circled as a judgment call.](assets/images/hiring-written-exercises/comic-07-the-number-wins.jpeg)\n**Panel 7:** *The cost: the score constrains you even when a response reads well — that discipline is the trade-off.*\n\n![Comic panel: Vera and Noa compare an on-time polished submission against a late rough one, before either is scored.](assets/images/hiring-written-exercises/comic-08-the-signal-was-free.jpeg)\n**Panel 8:** *The closer: a well-built exercise signals diligence and timeliness before you score a single word.*\n"}]}]}</script>

                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
