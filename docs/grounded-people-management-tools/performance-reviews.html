<script id="data" type="application/json">{"meta": {"id": "PPL-PERFORMANCE-REVIEWS", "status": "draft:gray", "title": "Performance Reviews", "date": "2026-07-28", "author": "Željko Obrenović", "permalink": "performance-reviews", "timetoread": "9 min", "excerpt": "I write performance reviews to prepare for calibration, not just to summarize a half. Every review states a designation, a promotion call, and one sentence I could say out loud in the room — plus the one sentence I refuse to skip: why not the designation one notch up, and why not one notch down. If I cannot write those two sentences honestly, I do not yet know what I think.", "tags": "people management, performance reviews, calibration, promotion, feedback, career development", "icon": "assets/icons/performance-reviews.png", "logo": "assets/images/performance-reviews/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["people management", "performance reviews", "calibration", "promotion", "feedback", "career development"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: I write every performance review to do two jobs at once — tell the person the truth about their half, and prepare me to defend that truth in a calibration room full of other managers. The review states a proposed designation and a proposed promotion call, then forces two sentences I cannot dodge: why not the designation one notch higher, and why not one notch lower. It closes with the one sentence I actually want the person to remember. If I cannot write that sentence honestly before the meeting, I am not ready to have it.\n\n## Statement\n\nMy operating model for performance reviews has five parts:\n\n- **Header discipline before narrative.** Before I write a word of prose, I fix the facts: name, current level, start date in role, and how much of the review period the person was actually present, net of leave. A designation set against the wrong denominator is a designation I will have to retract in calibration.\n- **State the designation and the promotion call up front.** Every review carries a proposed designation and an explicit promotion yes/no. I do not bury these in the narrative — they are the two decisions the whole document exists to support.\n- **Justify the edges, not just the middle.** For every designation I write one sentence on why I did not choose the designation one notch higher, and one sentence on why I did not choose one notch lower. Two \"N/A\"s are allowed only at the true extremes — \"greatly exceeds\" has no higher edge to defend, \"does not meet\" has no lower one.\n- **Ground impact, strengths, and gaps in named work.** The 2–3 highest-impact projects, the 1–2 strengths, and the 1–2 development areas all get context, difficulty, duration, collaborators, expected role, and a result measured against that expectation — not adjectives.\n- **Write the takeaway before the meeting, not during it.** I write, in one sentence, the message I want this person to leave the review remembering. If I cannot write it cleanly, I write the review again until I can.\n\n![Diagram of five sequential steps: header facts, stated designation and promotion call, edge justification, evidence of impact, and the written takeaway.](assets/images/performance-reviews/review-five-part-loop.jpeg)\n**Figure 1:** *The five parts run in order — each one gates the next, ending in a sentence written before the meeting.*\n\n## How to Read This\n\nThis journal is my people-management toolkit, grounded in the companion workbooks to Claire Hughes Johnson's *Scaling People: Tactics for Management and Company Building* (Stripe Press, 2023), read through a practitioner-executive lens. This record is grounded in the workbook's Performance Review Template — the tool a manager fills in to draft a written review and to walk into calibration already knowing where they stand and why. The runnable tool — the exact header fields, impact prompts, strengths/gaps structure, and promotion-proposal branches — lives in the **Checklist** tab.\n\n## Rationale\n\n**A review is a calibration document before it is a conversation document.** The workbook is explicit that this template exists to help a manager draft the written review *and* prepare for the calibration conversation that follows it — two audiences, one document. A review written only for the person being reviewed reads well and collapses the moment a peer manager in calibration asks \"why not the level above?\" I write for both audiences from the first line, because the calibration room is where an unexamined designation gets found out.\n\n**The header is not paperwork — it is the frame the rest of the review has to fit inside.** Name, current level, start date in role, and time present during the period sound like fields a form generator could fill in, but the last one is a trap I do not skip: a half with substantial leave is not the same half as one worked in full, and a designation that does not account for that gap is comparing the person to a bar they did not have full time to clear. Fix the frame first; write the verdict second.\n\n**Why-not-higher and why-not-lower is the discipline that makes the designation honest.** A designation stated alone is an assertion. A designation defended on both edges is an argument — because the \"why not higher\" sentence forces me to name the ceiling I saw and hit, and the \"why not lower\" sentence forces me to name the floor the person cleared. The only exemptions are the true extremes: \"N/A for greatly exceeds\" and \"N/A for does not meet,\" because those bands have no edge above or below them to defend. Everywhere else, if I cannot write both sentences, I have not actually decided — I have guessed and dressed it as a rating.\n\n![Two side-by-side ladders of designation bands: one showing an isolated unsupported band, the other showing the same band defended with a ceiling line above and a floor line below.](assets/images/performance-reviews/assertion-vs-argument-edges.jpeg)\n**Figure 2:** *A designation stated alone is an assertion. Defended on both edges, it becomes an argument.*\n\n**Impact has to be named work, not a mood.** For each of the 2–3 highest-impact areas the workbook wants the project or area, its context and difficulty, the duration of the person's contribution, the key collaborators, their role and the expected impact for that role, and — the line that actually settles the question — the resulting impact against that expectation, with metrics where I have them. Company-building work counts on equal footing when it is substantial: mentorship, recruiting, and DEI contributions are not asterisks on \"real\" impact, they are impact, and a review that only credits roadmap delivery is measuring half the job.\n\n**Strengths and development areas get the same rigor as impact — designation, then evidence.** One or two strengths, one or two development areas, each with an approximate designation relative to the person's current level and one or two supporting examples — and for development areas, concrete ideas for how to improve, not just a diagnosis. For people managers, I read strengths and gaps against the manager ladder and the manager principles, not just the individual-contributor bar, because the standard the workbook expects for a manager's review is manager behavior.\n\n**The promotion call has its own logic, and \"not yet\" is not a verdict, it is a plan.** If the answer is no, I write when the person might plausibly be ready — this half, next half, or later — and what they concretely need to demonstrate to get there. If the answer is yes, I write how long they have already been demonstrating next-level capabilities and behaviors, with examples, and then the primary development area *at the next level*. The workbook is explicit that this last item is not meant to prevent upleveling or hold the promotion hostage — it is proactively identifying the person's next step, stated the same week I say yes, not held back as a hedge.\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| Fix the header facts — level, start date, time present net of leave — before writing the verdict. | The header is bureaucratic filler; only the narrative sections matter. |\n| State the proposed designation and the promotion yes/no explicitly. | Designation and promotion can stay implicit in the prose and be inferred later. |\n| Write one sentence each on why not higher and why not lower. | The edge sentences are optional commentary — most reviews still need both. |\n| Credit company-building work (mentorship, recruiting, DEI) as impact when it is substantial. | Only roadmap or ticket-shaped delivery counts as real impact. |\n| Ground strengths and development areas in an approximate designation plus 1–2 examples. | Adjectives (\"strong,\" \"needs work\") are sufficient without evidence. |\n| A \"no\" on promotion states a timeline and concrete next steps; a \"yes\" states the next-level development area as a proactive next step. | \"No\" is a closed door, or \"yes\" means the person has nothing left to develop. |\n\nConcretely: I do not start writing prose until the header fields are filled and accurate, including the leave adjustment. I do not submit a review to calibration without both edge sentences written for the proposed designation. And I write the one-sentence takeaway before the meeting, not while sitting across from the person — if I have to improvise it in the room, I have not finished the review.\n\n![Decision flow diagram from a Promote branch point to a No path ending in a timeline and checklist, and a Yes path ending in duration-with-examples and a forward-pointing next-step signpost.](assets/images/performance-reviews/promotion-branch-logic.jpeg)\n**Figure 3:** *\"Not yet\" is a plan with a date. \"Yes\" is a proactive next step, not a blocker.*\n\n## Anti-Patterns\n\n- **The vibes designation.** A rating chosen because it \"feels right,\" with no sentence defending why it is not one notch in either direction — indefensible the moment a peer manager in calibration pushes back.\n- **The header skip.** Level, start date, and time-present fields left blank or copied forward, so the designation is being compared against the wrong period or the wrong bar.\n- **Company-building erased.** Mentorship, recruiting, and DEI contributions left out of impact entirely because they don't look like the roadmap — punishing exactly the work that makes the organization better.\n- **The adjective strength.** \"Great communicator\" with no designation and no example — unfalsifiable, and useless as a coaching input for next half.\n- **The silent no.** A promotion declined with no stated timeline and no stated bar to clear — leaving the person guessing at what \"not yet\" actually requires.\n- **The unearned yes.** A promotion granted with no next-level development area named — signaling the person has nothing left to grow into, which is never true and undersells the next conversation.\n- **The improvised takeaway.** Walking into the review without having written the one sentence the person should leave with — so the actual message gets buried under whichever detail comes up first.\n\n## Related Records\n\n- [Career Conversations](career-conversations.html) — the review states where someone stands today; the career conversation is where we work the trajectory from here.\n- [Compensation Conversations](compensation-conversations.html) — the promotion and designation decided here are frequently the direct inputs to the compensation conversation that follows.\n- [Managing Underperformance](managing-underperformance.html) — when the designation trends toward \"does not meet,\" the review is the paper trail that record's process builds on.\n- [Careers, Hiring, and Performance](../grounded-engineering-executive/careers-and-performance.html) — the engineering-journal record on the level system and designation bands this review's proposed designation has to sit inside.\n- [Calibrating Your Standards](../grounded-engineering-executive/calibrating-your-standards.html) — the engineering-journal record on keeping the bar itself honest; this record is how one manager's review survives contact with that bar in calibration.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs how I draft a written performance review and prepare for the calibration conversation that follows — the header, the impact and strengths/gaps sections, and the promotion-proposal logic. It does not define the level ladder itself, the calibration process across managers, or compensation mechanics. I revisit it if my organization's designation bands change, if calibration surfaces a pattern of reviews failing the why-not-higher/why-not-lower test, or if the promotion-proposal structure stops matching how leveling actually works here.\n\n## Authoritative References\n\n- Claire Hughes Johnson, *Scaling People: Tactics for Management and Company Building* (Stripe Press, 2023) — the companion workbooks, Performance Review Template.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "7 min read"}, "blocks": [{"type": "markdown", "content": "*The working tool behind this record. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Header\n\n- [ ] Name\n- [ ] Current level\n- [ ] Start date in role\n- [ ] Time present during the review period, noting any leave and whether the period was less than a half-year\n- [ ] Proposed designation\n- [ ] Proposed promotion: yes or no\n- [ ] One sentence: why not a higher designation? (N/A only for \"greatly exceeds\")\n- [ ] One sentence: why not a lower designation? (N/A only for \"does not meet\")\n- [ ] One sentence: the takeaway I want this person to leave the review with — communicate it to them during the review\n\n## 2. Impact\n\nDescribe the 2–3 projects or areas of greatest impact this half. Company-building work — mentorship, recruiting, DEI — counts here if the contribution was significant.\n\n| Area for impact | Context and difficulty | Duration of contribution | Key collaborators/stakeholders | Role and expected impact | Resulting impact vs. expectations (metrics if possible) |\n| --- | --- | --- | --- | --- | --- |\n| 1 |  |  |  |  |  |\n| 2 |  |  |  |  |  |\n| 3 |  |  |  |  |  |\n\n- [ ] Area for impact 1 named and briefly described\n- [ ] Duration, collaborators, role/expectation, and resulting impact filled in for area 1\n- [ ] Area for impact 2 named and briefly described\n- [ ] Duration, collaborators, role/expectation, and resulting impact filled in for area 2\n- [ ] Area for impact 3 named and briefly described (if applicable)\n- [ ] Duration, collaborators, role/expectation, and resulting impact filled in for area 3\n- [ ] Company-building work (mentorship, recruiting, DEI) included as an impact area where significant\n\n## 3. Strengths\n\nIdentify 1–2 strengths demonstrated during the review period. Consider, but don't limit to, the core capabilities of the role; for people managers, weigh the manager ladder and manager principles too.\n\n- [ ] Strength 1 described briefly\n- [ ] Approximate designation for strength 1 (relative to current level)\n- [ ] Summary for strength 1, referencing 1–2 supporting examples\n- [ ] Strength 2 described briefly (if applicable)\n- [ ] Approximate designation for strength 2 (relative to current level)\n- [ ] Summary for strength 2, referencing 1–2 supporting examples\n\n## 4. Development areas\n\nIdentify 1–2 development areas demonstrated during the review period. If the person did well overall, these may still be rated \"successfully meets\" or higher; if not, they may be \"partially meets\" or \"does not meet\" relative to current level. Consider, but don't limit to, the core capabilities of the role.\n\n- [ ] Development area 1 described briefly\n- [ ] Approximate designation for development area 1 (relative to current level)\n- [ ] Summary for development area 1, referencing 1–2 supporting examples\n- [ ] Concrete ideas for how to improve, for development area 1\n- [ ] Development area 2 described briefly (if applicable)\n- [ ] Approximate designation for development area 2 (relative to current level)\n- [ ] Summary for development area 2, referencing 1–2 supporting examples\n- [ ] Concrete ideas for how to improve, for development area 2\n\n## 5. Promotion proposal: yes or no\n\n### If no\n\n- [ ] State when the person might be ready to uplevel: this half (H1), next half (H2), or later\n- [ ] Briefly state what they need to do for promotion in the future, or for higher levels, to grow in their career\n\n### If yes\n\n- [ ] State how long the person has been demonstrating next-level capabilities and behaviors\n- [ ] Give 1–2 examples of how the person has been demonstrating next-level capabilities and behaviors\n- [ ] In 1–2 sentences, name the primary development area at the next level — framed as proactively identifying the person's next step, not as a promotion blocker\n\n## 6. Before the review conversation\n\n- [ ] Header, impact, strengths, development areas, and promotion proposal are all complete\n- [ ] Both edge sentences (why not higher, why not lower) are written for the proposed designation\n- [ ] The one-sentence takeaway is written and ready to say out loud\n- [ ] The review is ready to defend in calibration, not only to deliver to the person\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "A performance review has to survive calibration, not just the meeting it was written for — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. NOA: an earnest first-time people manager, short wavy hair, rolled-up shirt sleeves, carries a clipboard with a long checklist.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Noa sits at a calibration table holding a sheet with only a circled star rating, surrounded by expectant peer managers.](assets/images/performance-reviews/comic-01-the-calibration-room.jpeg)\n**Panel 1:** *A review written for one reader collapses the moment it meets the calibration room.*\n\n![Comic panel: Vera points at a wall calendar with several months grayed out as LEAVE, while Noa holds a clipboard with a designation already written.](assets/images/performance-reviews/comic-02-wrong-denominator.jpeg)\n**Panel 2:** *A designation set against the wrong denominator is one I will retract in calibration.*\n\n![Comic panel: Noa stamps a designation on a form with no explanation, while Vera holds up two blank speech bubbles labeled Higher and Lower.](assets/images/performance-reviews/comic-03-the-vibes-designation.jpeg)\n**Panel 3:** *A designation asserted alone is a guess dressed as a rating.*\n\n![Comic panel: Vera draws a ladder of designation bands on a whiteboard with a sentence written above and below the circled middle band.](assets/images/performance-reviews/comic-04-edges-not-just-middle.jpeg)\n**Panel 4:** *Why not one notch higher, why not one notch lower — the two sentences that make a designation an argument.*\n\n![Comic panel: Noa fills in a table with columns Context, Duration, Collaborators, Role, Result, showing a mentorship icon sized equally to a roadmap icon.](assets/images/performance-reviews/comic-05-named-work-not-mood.jpeg)\n**Panel 5:** *Impact is named work — context, duration, collaborators, role, result — and mentorship counts on equal footing.*\n\n![Comic panel: Vera and Noa stand at a signpost with two paths, one labeled Not Yet with a dated milestone, one labeled Yes with a Next-Level Growth flag.](assets/images/performance-reviews/comic-06-not-yet-is-a-plan.jpeg)\n**Panel 6:** *\"Not yet\" states a date and a bar to clear. \"Yes\" states the next step, not a blocker.*\n\n![Comic panel: Noa sits late at her desk surrounded by crumpled drafts, still rewriting one sentence, tired but focused.](assets/images/performance-reviews/comic-07-the-cost-of-the-edges.jpeg)\n**Panel 7:** *Honesty at the edges is not free — it costs the rewrite you would rather skip.*\n\n![Comic panel: Noa walks into the calibration room holding an index card with one sentence written on it, meeting Vera's proud gaze.](assets/images/performance-reviews/comic-08-the-sentence-before-the-room.jpeg)\n**Panel 8:** *If I can write that sentence honestly before the meeting, I am ready for the room.*\n"}]}]}</script>

        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
