<script id="data" type="application/json">{"meta": {"id": "PPL-CANDIDATE-REVIEW", "status": "draft:gray", "title": "Candidate Review", "date": "2026-07-28", "author": "Željko Obrenović", "permalink": "candidate-review", "timetoread": "6 min", "excerpt": "I never let a single hiring manager give the final yes on a hire or a level. Candidate Review is a committee gate that reads the objective scorecard evidence before the narrative, checks leveling against years-of-experience guidance, and closes the loop with feedback to everyone who touched the process. It is both a hiring process and an equity process.", "tags": "people management, hiring, candidate review, leveling, hiring committee, decision making", "icon": "assets/icons/candidate-review.png", "logo": "assets/images/candidate-review/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["people management", "hiring", "candidate review", "leveling", "hiring committee", "decision making"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: I never let a single hiring manager give the final yes on a hire or a level. Every candidate clears Candidate Review (CR) — a committee that reads the objective scorecard evidence before the hiring manager's narrative, verifies the scorecards actually reflect the rubric, checks the suggested level against years-of-experience guidance, and closes the loop with feedback to interviewers, recruiters, and hiring managers. CR is both a hiring process and an equity process: it is how I keep one team's generous interviewer from becoming another team's inconsistent bar.\n\n## Statement\n\nMy operating model for Candidate Review has five commitments:\n\n- **No packet, no review.** CR only reviews candidates with a complete packet — résumé, completed individual interview scorecards, a completed hiring-committee scorecard, a suggested outcome, and a suggested level. An incomplete packet does not get a slot on the agenda.\n- **Objective evidence before narrative.** I read the rubric-mapped scorecard scores first, before the hiring manager's rationale. The rationale exists to explain *divergence* from the scorecards and to show that fear, uncertainty, and doubt (FUD) were named and resolved — not to substitute for the scores.\n- **Verify the scorecards, not just the outcome.** Before CR discusses a candidate, the panel confirms each scorecard actually reflects the rubric — not too lenient, not too strict, not grounded in subjective impressions dressed up as rubric items.\n- **Leveling gets checked, not rubber-stamped.** The suggested level is checked against the résumé and the org's years-of-experience leveling guidance before CR agrees to it. A suggested level is an input to the decision, not the decision.\n- **The loop closes.** Every CR outcome ships with feedback — to the interviewers, the recruiter, and the hiring manager — plus a feedback form so the process itself keeps improving. CR is not done when the decision is made; it is done when the feedback lands.\n\n![Diagram of a five-stage gate a candidate packet passes through: submission, scorecard and rationale review, verification, discussion and decision, and outcome with feedback.](assets/images/candidate-review/candidate-review-pipeline.jpeg)\n**Figure 1:** *Candidate Review is a five-stage gate, not a single meeting — every packet clears all five stages in order.*\n\n## How to Read This\n\nThis journal is my people-management toolkit, grounded in the companion workbooks to Claire Hughes Johnson's *Scaling People: Tactics for Management and Company Building* (Stripe Press, 2023). This record is grounded in the \"Candidate Review: Decision-Making Framework\" tool from those workbooks, read through a practitioner-executive lens: the workbook frames CR as a committee that reviews interview feedback, hire/no-hire recommendations, and leveling for every candidate, then gives final approval. I read it as the gate that makes hiring an organizational decision rather than a manager's private call. The runnable five-step tool lives in the **Checklist** tab.\n\n## Rationale\n\n**A hiring manager alone is a single point of bias, however well-intentioned.** I match many engineering hires to a team only after they have gone through the full hiring process, which means the person who most wants to hire someone — the hiring manager — is not the right person to also be the final, unchecked approver. CR exists to put a second set of eyes, structurally independent of that motivation, between \"the team wants this person\" and \"the offer goes out.\" That is why CR acts as both a hiring process and an equity process at once: the same committee that decides yes-or-no on this candidate is also the mechanism that keeps my org's hiring bar and leveling consistent across every team that uses it.\n\n**Objective before subjective is not a formality — it is the order of operations.** CR reads the hiring-committee scorecard first: a score of strong no, no, neutral, yes, or strong yes for each interview, represented as a symbol and mapped directly to the rubric. That gives the committee a reasonably objective, high-level read on the candidate before anyone's narrative enters the room. Only after that does CR read the hiring-manager rationale — the place for the more subjective observations, and the place where the hiring manager must explain how the committee reached its conclusion, especially when that conclusion diverges from what the scorecards alone would suggest. I do not treat divergence as automatically wrong; I treat an *unexplained* divergence as a problem. When the outcome is obvious, the rationale can be as short as \"clear no hire\" or \"clear hire.\" When it is not obvious, the rationale is where the hiring manager earns the committee's agreement.\n\n![Two-panel diagram contrasting reading the scorecard before the narrative against reading the narrative before the scorecard.](assets/images/candidate-review/objective-before-subjective-gate.jpeg)\n**Figure 2:** *Objective before subjective: read the scorecard first, or the scores become confirmation instead of evidence.*\n\n**FUD named early is FUD that does not send the packet back.** Fear, uncertainty, and doubt are normal residue of any hiring discussion — the mistake is letting them surface for the first time in the CR meeting. The scorecard's hiring-manager-rationale and resolved-FUD sections exist so those doubts get written down and addressed before CR convenes, which is precisely what reduces how often CR has to send a packet back for more information. A packet that surfaces fresh doubt in the room is a packet that was not ready.\n\n**Scorecard verification is a check on the checkers, not a rubber stamp.** Before CR trusts the aggregate scorecard, reviewers read the individual interview scorecards and confirm each one actually reflects the rubric — not a subjective impression relabeled as a rubric score, not systematically too lenient, not systematically too strict. This is the step that keeps \"strong yes\" meaning the same thing regardless of which interviewer wrote it. Skip this step and the aggregate scorecard is only as trustworthy as its least disciplined contributor.\n\n**Leveling is where equity becomes concrete.** After discussion resolves FUD and disagreement, CR reviews the candidate's résumé specifically to check that the suggested level roughly aligns with the org's years-of-experience leveling guidance. This is the moment CR stops being only a hire/no-hire gate and becomes a consistency mechanism: the same years of relevant experience should land at roughly the same level regardless of which team's hiring manager submitted the packet. A committee that skips this check will drift into level inflation team by team, quietly, until the leveling framework means nothing.\n\n![Diagram showing résumés from several different teams converging through one shared leveling-guidance checkpoint to land at a consistent level.](assets/images/candidate-review/leveling-consistency-map.jpeg)\n**Figure 3:** *Leveling is checked against one shared guidance, so the same experience lands at the same level regardless of team.*\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| CR only reviews complete packets — résumé, scorecards, suggested outcome and level. | An incomplete packet gets reviewed \"this once\" because the meeting is already scheduled. |\n| Scorecard scores are read before the hiring-manager rationale. | The rationale is optional filler — it is required, and it must address divergence and resolved FUD. |\n| CR verifies scorecards reflect the rubric, not vibes. | Verification means re-litigating the interview — it is a check on rubric fidelity, not a re-interview. |\n| Leveling is checked against years-of-experience guidance every time. | The suggested level is presumed correct because the hiring manager proposed it. |\n| \"Yes for company, no for my team\" is a legitimate, rare outcome with a clear rationale. | It is a routine escape hatch for a team that does not want to make a hard no-hire call. |\n| Every outcome closes the loop with feedback to interviewers, recruiters, and hiring managers. | Feedback is optional or only given when the outcome is a hire. |\n\nConcretely: no CR agenda item goes forward without a hiring-committee scorecard attached. Every rationale written by a hiring manager either says \"clear hire\" / \"clear no hire\" or explains the divergence and the FUD that was resolved. Every CR outcome is one of five: hire at suggested level, hire at a higher level, hire at a lower level, no hire (trope outcome overturned or confirmed), or sent back for more information. And every candidate, hired or not, generates feedback that closes back to the people who ran the process.\n\n## Anti-Patterns\n\n- **Reviewing an incomplete packet.** Skipping the scorecard because \"we're confident about this one\" is exactly how CR stops being a check.\n- **Reading the rationale before the scorecard.** Once the narrative anchors the committee, the objective scores become confirmation rather than evidence.\n- **A rationale that explains nothing.** \"We liked them\" is not a rationale — it does not address divergence, and it does not name the FUD that was resolved.\n- **Treating scorecard divergence as automatically suspicious.** Divergence is normal; an unexplained divergence is the actual problem.\n- **Skipping scorecard verification.** Trusting the aggregate without checking that each interview scorecard actually maps to the rubric lets one lenient or one harsh interviewer distort every decision downstream.\n- **Rubber-stamping the suggested level.** Approving the hiring manager's proposed level without a résumé check against years-of-experience guidance is how leveling drifts team by team.\n- **Using \"yes for company, no for my team\" as a routine outlet.** This outcome should be very rare and carry a clear rationale — treating it as an easy compromise erodes the no-hire discipline CR exists to protect.\n- **Silence after the decision.** Deciding without emailing feedback to interviewers, recruiters, and hiring managers breaks the loop that lets the process improve.\n\n## Related Records\n\n- [The Interview Loop](interview-loop.html) — the loop that produces the scorecards CR reviews; CR begins where the loop ends.\n- [Written Exercises](hiring-written-exercises.html) — a written exercise is one scorecard input CR verifies against its own rubric, not a separate approval step.\n- [Calibrating Your Standards](../grounded-engineering-executive/calibrating-your-standards.html) — the engineering-journal record on setting and holding a bar; CR is the per-candidate committee gate that enforces the bar, calibration is the ongoing practice of keeping it honest.\n- [Hiring](../grounded-engineering-executive/hiring.html) — the engineering-journal record on the hiring process end to end; CR is the decision-making committee inside that larger process.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs how I run Candidate Review for engineering hires in my organization: what a complete packet contains, the order in which CR reads evidence, how scorecards are verified, and how leveling and feedback close the loop. I will revise it if CR outcomes drift in practice — packets reviewed incomplete, rationales that stop explaining divergence, or leveling decisions that stop tracking the years-of-experience guidance — or once I have run enough CR cycles to name concrete failure modes beyond what the workbook anticipates.\n\n## Authoritative References\n\n- Claire Hughes Johnson, *Scaling People: Tactics for Management and Company Building* (Stripe Press, 2023) — the companion workbooks, \"Candidate Review: Decision-Making Framework\" (Chapter 3).\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "6 min read"}, "blocks": [{"type": "markdown", "content": "*The working tool behind this record. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Candidate submission\n\n- [ ] Recruiter assembles the candidate packet before CR\n- [ ] Packet includes the candidate's résumé\n- [ ] Packet includes a completed scorecard for every interview\n- [ ] Packet includes a completed hiring-committee scorecard\n- [ ] Packet includes a suggested outcome (pick one):\n\n| Suggested outcome | Notes |\n| --- | --- |\n| Yes for company, no for my team | Should be very rare; requires a clear rationale |\n| Company hire | Standard positive outcome |\n| Team hire | Standard positive outcome, scoped to the requesting team |\n| No hire | Standard negative outcome |\n\n- [ ] Packet includes a suggested level\n- [ ] Full packet is shared with every CR reviewer before the meeting\n- [ ] Do not schedule CR review for a packet missing any of the above\n\n## 2. Scorecard and hiring-manager rationale review\n\n**Hiring-committee scorecard review**\n\n- [ ] Read the hiring-committee scorecard first, before the rationale\n- [ ] Confirm each interview has a score mapped to this scale:\n\n| Score | Symbol meaning |\n| --- | --- |\n| Strong no | Clear negative signal |\n| No | Negative signal |\n| Neutral | No clear signal either way |\n| Yes | Positive signal |\n| Strong yes | Clear positive signal |\n\n- [ ] Confirm each score maps directly to that interview's rubric\n- [ ] Use this step to ground the review in the most objective evidence available\n- [ ] Do not review any packet missing a completed hiring-committee scorecard\n\n**Hiring-manager rationale review**\n\n- [ ] Read the rationale for the more subjective observations from interviews and the hiring committee\n- [ ] Check that the rationale explains how the committee reached its decision\n- [ ] Pay particular attention when the committee's decision diverges from what the objective scorecards alone would suggest\n- [ ] Confirm the rationale and/or the \"resolved FUD\" (fear, uncertainty, doubt) section calls out any such divergence early\n- [ ] Treat early-called-out divergence as the mechanism that reduces packets sent back for more information\n- [ ] Accept a brief rationale (\"clear no hire\" / \"clear hire\") when the outcome is obvious\n- [ ] Require a fuller rationale when the outcome is not obvious or does not match the objective scorecard outcome\n\n## 3. Scorecard verification\n\nFor each individual interview scorecard, confirm it:\n\n- [ ] Reflects and is related to the rubric\n- [ ] Is not based on subjective measures (subjective observations belong in the write-up and discussion, not the scorecard outcome)\n- [ ] Is not too lenient\n- [ ] Is not too strict\n- [ ] Is correct — it reflects the rubric accurately\n\n## 4. Discussion, decision, and résumé review\n\n**Before discussion, confirm the panel has:**\n\n- [ ] A sense of the expected CR outcome based on the objective interview outcomes in the hiring-committee scorecard and the rubric items from the individual scorecards\n- [ ] A sense of any relevant subjective information from the individual scorecard write-ups and hiring-manager rationale\n\n**Discussion**\n\n- [ ] CR lead opens a discussion to clarify any FUD or disagreement\n- [ ] CR lead identifies whether any feedback should go back to the hiring committee\n\n**Résumé and leveling check**\n\n- [ ] Group reviews the candidate's résumé\n- [ ] Verify the suggested outcome makes sense given the résumé\n- [ ] Verify the suggested level roughly aligns with the org's years-of-experience leveling guidance (engineering levels framework)\n\n**Panel agrees; CR lead selects one final outcome:**\n\n| Final outcome | Meaning |\n| --- | --- |\n| Hire at suggested level | Panel agrees with the submitted level |\n| Hire at higher level | Panel raises the level |\n| Hire at lower level | Panel lowers the level |\n| No hire: committee outcome overturned | Panel reverses the hiring committee's recommendation |\n| No hire: committee outcome confirmed | Panel confirms the hiring committee's recommendation |\n| TBD: sent back for additional information | Panel cannot decide without more information |\n\n## 5. Submit CR outcome with feedback\n\n- [ ] CR admin submits a scorecard for the CR review itself\n- [ ] CR admin emails feedback to interviewers\n- [ ] CR admin emails feedback to recruiters\n- [ ] CR admin emails feedback to hiring managers\n- [ ] Interviewers, recruiters, and hiring managers are invited to give feedback on CR via a feedback form\n- [ ] Treat the feedback form as closing the loop — its purpose is continual iteration and improvement of the CR process itself\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "A single hiring manager should never give the final yes alone — Candidate Review is the committee gate that reads evidence before narrative and checks the level before the offer goes out, in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. NOA: an earnest first-time people manager, short wavy hair, rolled-up shirt sleeves, carries a clipboard with a long checklist.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Noa about to sign a job offer alone at a desk while Vera appears in the doorway holding up a hand.](assets/images/candidate-review/comic-01-final-yes-alone.jpeg)\n**Panel 1:** *The hook: a hiring manager alone is a single point of bias, however well-intentioned.*\n\n![Comic panel: two differently-set bars, one low and easy, one high and strict, with Noa standing confused between them.](assets/images/candidate-review/comic-02-inconsistent-bar.jpeg)\n**Panel 2:** *The problem: without a shared gate, one team's leniency becomes another team's inconsistency.*\n\n![Comic panel: Noa absorbed in a glowing narrative document while a rubric scorecard sits ignored and dim on the table.](assets/images/candidate-review/comic-03-narrative-first.jpeg)\n**Panel 3:** *The wrong way: read the story first, and the scores become confirmation instead of evidence.*\n\n![Comic panel: Vera pointing to a glowing rubric scorecard placed in front of a narrative document, teaching Noa the order.](assets/images/candidate-review/comic-04-objective-before-subjective.jpeg)\n**Panel 4:** *The principle: objective scorecard evidence gets read before subjective narrative — always.*\n\n![Comic panel: Noa walking a five-step path on the floor, checking items off a clipboard, with Vera walking alongside.](assets/images/candidate-review/comic-05-five-step-checklist.jpeg)\n**Panel 5:** *How it runs: submission, scorecard review, verification, discussion, and outcome — in that order.*\n\n![Comic panel: close-up of a clipboard showing a five-symbol scale from strong no to strong yes with Vera tapping the middle symbol.](assets/images/candidate-review/comic-06-strong-no-to-strong-yes.jpeg)\n**Panel 6:** *The mechanic: strong no, no, neutral, yes, strong yes — each score mapped directly to the rubric.*\n\n![Comic panel: Vera and Noa checking a stack of scorecards against a rubric sheet, spotting one that glows a different color, both looking tired.](assets/images/candidate-review/comic-07-verification-catches-drift.jpeg)\n**Panel 7:** *The cost: verifying every scorecard against the rubric is real work — and it is what keeps the bar honest.*\n\n![Comic panel: Noa sending feedback envelopes to three figures representing interviewers, recruiters, and hiring managers, while Vera checks the last clipboard box.](assets/images/candidate-review/comic-08-loop-closes.jpeg)\n**Panel 8:** *The closer: the decision is not the finish line — the loop closes when feedback lands.*\n"}]}]}</script>

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
