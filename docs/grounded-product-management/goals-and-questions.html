**Accept that it is not all math.** Shaping the future is part measurement, part conviction, part storytelling. If everything were an A/B test and every pattern had already happened many times, we would be a phone company — a commodity.\n- **Ask better questions, at tempo.** The compounding loop is: work the lanes, ask good questions, get decent answers, sharpen the next question, re-check core assumptions. Answers exist to make the next question better.\n- **Mix goals; keep the habit.** Learning goals, shipping goals, outcome goals, goals on leading and lagging metrics, goals on practices — prescriptive and descriptive, near and long. The habit of goal-setting matters; the performance of it does not.\n- **Prefer powerful ideas imperfectly measured.** Over perfect measures of not-so-powerful ideas — and expect multi-horizon thinking at every level, not just from leaders.\n\n## How to Read This\n\nThis record is grounded in John Cutler's \"20 Unfiltered Operating Takes\" (TBM 435), read through the same practitioner-executive lens as the rest of this journal. It is the practice-side companion to [Outcomes](outcomes.html): that record defines what counts as an outcome and how metrics are chosen; this one is about what living by outcomes actually costs — a model, conviction, and habits — and why so much \"outputs to outcomes\" talk leaves teams feeling inadequate instead of equipped. The working checklist, derived from the essay, lives in the **Checklist** tab.\n\n## Rationale\n\n**Outcome-centricity has a price list, and \"mindset\" is not on it.** The transformation language — projects to products, outputs to outcomes — is too theoretical. It skips how uncertain the work is and what actually makes it function: building a causal model that starts with near-term things you can influence and links them to the long-term things that propel the company. Teams told to \"be outcome-oriented\" without that machinery end up feeling they are never doing enough, while the unglamorous practices that make it real — staring at input metrics, revising, discussing assumptions, monitoring, switching things up — get dismissed as not strategic enough. Those routines *are* outcome-centricity.\n\n![Node diagram linking near-term inputs through drivers to a long-term company outcome, with links marked as measured or conviction-backed.](assets/images/goals-and-questions/causal-model-anatomy.jpeg)\n**Figure 1:** *The causal model: near-term inputs linked to long-term outcomes, with honesty about which links are measured and which are conviction.*\n\n**Proximity to money is real; the causal chain is the equalizer.** The cart-optimization team at an e-commerce company gets more love than the design-systems team for one reason: it is closer to money. There is no free lunch here, and complaining about it changes nothing. The team far from money closes the gap by building the explicit chain — what we influence, what that improves, what that is worth — and by telling that story with conviction. That is not spin; it is the same model the cart team gets for free by standing next to the till.\n\n**Certainty is a commodity business.** If every decision could be A/B-tested, every customer's lifetime value were known, and every current pattern had happened many times before, product management would be arithmetic — and the company would be a phone company. The upside of uncertainty is that judgment, conviction, and narrative are exactly where differentiated value comes from. I fund leaps of faith knowingly, as leaps, with the model saying why the landing zone is plausible.\n\n**Questions compound; answers feed them.** What really matters is that a team is always asking better questions, not that it has all the answers. But the loop must close: answers are what sharpen the next question, and answers come from tempo — knocking out work on the lanes, checking assumptions, moving the needle, meeting again next week. Teams that make \"powerful questions\" a standalone activity produce one great workshop and then return to business as usual — often because someone branded them \"the type that only asks good questions.\" The fix is not fewer questions; it is attaching the questions to the weekly motion that generates answers.\n\n**Goals work when they are habitual and mixed.** Set goals — and refuse to be ruled by them. The failure modes are twin: going through the goal motions, where the numbers mean nothing; and goals as afterthought, where teams dream up everything they want to do and bolt on a \"success metric\" at the end. The countermeasure is variety with cadence: learning goals next to shipping goals next to outcome goals; goals on near-term input metrics and on lagging results; goals on practices and continuous improvement. Prescriptive where we know, descriptive where we are exploring. The habit of setting, revisiting, and retiring goals is the asset; any single goal is expendable.\n\n![Grid of varied goal tiles cycling through set, revisit, and retire, beside a crossed-out stack of identical quarterly goal forms.](assets/images/goals-and-questions/goal-mix-grid.jpeg)\n**Figure 2:** *Mix the goals and keep the loop: set, revisit, retire — the habit is the asset, any single goal is expendable.*\n\n**Imperfect measurement of the right thing beats precise measurement of the wrong thing.** Powerful ideas imperfectly measured are more important than perfect measures for not-so-powerful ideas. A measurement bar that only cheap, small, already-instrumented ideas can clear is a filter that selects for weakness. I hold the ambition fixed and let measurement fidelity be what improves over time — not the reverse.\n\n![2x2 matrix of idea power versus measurement fidelity, highlighting the powerful-imperfectly-measured quadrant and marking the weak-perfectly-dashboarded quadrant as a trap.](assets/images/goals-and-questions/power-vs-measurement-matrix.jpeg)\n**Figure 3:** *Hold ambition fixed and improve the measures — never let the dashboard decide which quadrant you live in.*\n\n**Horizons belong to everyone.** I am tired of \"leaders do the long-horizon thinking\" as an org-design axiom. Anyone at any level can reason across horizons; experience mostly improves the judgment of *when* long-horizon reasoning makes sense at all. Ideally the most experienced people are on the front line, where the work is — and if none are, that is a question about the organization, not about the ICs. There should be power ICs who love showing people how to do the thing — they are how horizon-thinking reaches the front line instead of staying upstairs.\n\n## What This Means in Practice\n\n| What this principle says | What it does **not** say |\n| --- | --- |\n| Every team can walk me through its causal model. | The model must be proven — it is a model we refine, not a theorem. |\n| Conviction and narrative are legitimate parts of the case. | Storytelling replaces measurement — the input metrics still get stared at. |\n| Goals are mixed across types and horizons, on a cadence. | Every goal fits one framework — the mix is deliberately looser than any OKR scheme. |\n| Ambitious ideas proceed with imperfect measures. | Measurement is optional — imperfect is a starting point, not a destination. |\n| Multi-horizon thinking is expected at every level. | Leaders stop doing long-horizon work — it is shared, not relocated. |\n\n## Anti-Patterns\n\n- **Outcome theater.** \"Be outcome-oriented\" proclaimed as a mindset shift, with no causal model, no input metrics, and no routine for revisiting either.\n- **The mindset tax.** Teams left feeling perpetually inadequate because the theory they were given has no machinery attached.\n- **The question workshop.** A brilliant afternoon of powerful questions, followed by ho-hum business as usual — the hat taken off before any answers arrive.\n- **Goal motions.** Numbers filled into the goal template each quarter that predict nothing, change nothing, and are mourned by no one.\n- **The afterthought metric.** A wishlist of things to build, with \"success metrics\" appended at the end to satisfy the format.\n- **The measurement veto.** A powerful idea killed because its metric would be imperfect, while a weak idea proceeds on the strength of its dashboard.\n- **Horizon gatekeeping.** Long-term thinking treated as a leadership perk, while the front line — where the work happens — is staffed to be purely tactical.\n\n## Related Records\n\n- [Outcomes](outcomes.html) — the definitional half: key customer and business outcomes, metrics discipline, outcome pyramids. This record is what practicing that costs.\n- [Team Objectives](team-objectives.html) — how goals get assigned to teams and committed to; the goal-mixing here is the palette that process draws from.\n- [EMPOWERED Product Strategy](empowered-product-strategy.html) — where the insight behind the causal model comes from.\n- [Lanes](lanes.html) — the durable lanes whose weekly motion generates the answers that sharpen the questions.\n- [Routines](routines.html) — the heartbeat that keeps question-asking and goal-revisiting habitual rather than performative.\n\n## Scope and Revisiting\n\nThis principle governs how teams justify their work, set goals, and hold ambition against measurement. I revisit it if the conviction half gets abused — leaps of faith invoked to dodge measurement that was cheaply available — at which point the record needs a sharper test for when narrative is doing legitimate work, and whenever goal-setting drifts back into quarterly theater despite the mixed palette.\n\n## Authoritative References\n\n- John Cutler, \"TBM 435: 20 Unfiltered Operating Takes\", *The Beautiful Mess*, August 2026 — the source essay; this record distills its Outcome-centricity (Misunderstood), Better Questions, and Good Goals sections and the imperfect-measurement and multi-horizon takes.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "3 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this principle — derived from John Cutler's \"20 Unfiltered Operating Takes\". The Article tab carries the rationale and anti-patterns.*\n\n## Build the Causal Model\n\n- [ ] The team can name the near-term things it directly influences.\n- [ ] Those inputs are linked, explicitly, to the long-term outcomes that propel the company.\n- [ ] The team can walk a skeptic through the chain — including where it rests on conviction rather than data.\n- [ ] Teams far from money have made their chain to money explicit, not assumed.\n- [ ] The model is treated as a model: refined as answers arrive, not defended as a theorem.\n\n## Balance Math and Conviction\n\n- [ ] Where measurement is cheap, it is used — no leaps of faith over available data.\n- [ ] Where measurement is impossible, conviction and narrative are used openly and labeled as such.\n- [ ] Leaps of faith are funded knowingly, with the model saying why the landing zone is plausible.\n- [ ] Input metrics get stared at on a rhythm: revised, discussed, monitored, switched up.\n\n## Run the Question Loop\n\n- [ ] The team asks sharp questions about its lanes as part of the weekly motion — not in standalone workshops.\n- [ ] Answers are harvested: last week's work visibly sharpens this week's questions.\n- [ ] Core assumptions are re-checked on a cadence.\n- [ ] Nobody needs the perfect answer to start moving; the loop tolerates \"we'll find out\".\n\n## Mix the Goals\n\n- **The goal palette is actually used — the current set includes several of:**\n  - [ ] Learning goals.\n  - [ ] Shipping goals.\n  - [ ] Outcome goals — near-term inputs and lagging results.\n  - [ ] Practice and continuous-improvement goals.\n- [ ] Prescriptive goals where the path is known; descriptive goals where exploring.\n- [ ] Goals are set, revisited, and retired on a rhythm — the habit, not the performance.\n- [ ] No goal is a bolted-on \"success metric\" added after the wishlist was written.\n- [ ] Goals inform decisions but do not rule them — a goal can be changed when it stops making sense.\n\n## Hold the Bar, Spread the Horizons\n\n- [ ] Powerful ideas proceed with imperfect measurement; fidelity improves over time.\n- [ ] No weak idea survives on the strength of its dashboard alone.\n- [ ] Multi-horizon thinking is expected from every level — and staffed for on the front line.\n- [ ] Experienced ICs are visibly showing others how to do the thing.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Goals and questions — what outcome-centricity actually costs, in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned product-minded executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. MILA: an energetic young product manager, dark hair in a ponytail, denim jacket over a striped shirt, carries a tablet covered in sticky notes.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: a team stares blankly at a poster reading Be Outcome-Oriented.](assets/images/goals-and-questions/comic-01-the-poster.jpeg)\n**Panel 1:** *The hook: everyone says be outcome-oriented — nobody says how.*\n\n![Comic panel: Vera draws a gear chain from a hand-crank to a distant mountain flag.](assets/images/goals-and-questions/comic-02-the-causal-chain.jpeg)\n**Panel 2:** *The principle: outcome-centricity is a built causal model, not a mindset.*\n\n![Comic panel: a spotlighted cart team by a cash register while a design-systems team builds a paper chain toward it from the shadows.](assets/images/goals-and-questions/comic-03-closer-to-money.jpeg)\n**Panel 3:** *The physics: closer to money gets love for free — everyone else builds the chain.*\n\n![Comic panel: Vera holds a half-blueprint half-storybook volume near a dusty phone labeled commodity.](assets/images/goals-and-questions/comic-04-not-all-math.jpeg)\n**Panel 4:** *The mix: math plus conviction plus storytelling — certainty is a commodity business.*\n\n![Comic panel: Mila pushes a flywheel loop of work, answers, and sharper questions.](assets/images/goals-and-questions/comic-05-question-loop.jpeg)\n**Panel 5:** *The loop: work the lanes, get answers, ask better questions — at tempo.*\n\n![Comic panel: Vera holds a palette of labeled goal types beside an abandoned quarterly-goals stamp.](assets/images/goals-and-questions/comic-06-goal-palette.jpeg)\n**Panel 6:** *The palette: mix your goals — the habit matters, the performance doesn't.*\n\n![Comic panel: a scale where a rough glowing gem with a cracked gauge outweighs a polished pebble on a perfect dashboard.](assets/images/goals-and-questions/comic-07-powerful-vs-perfect.jpeg)\n**Panel 7:** *The bar: powerful ideas imperfectly measured beat perfect measures of weak ideas.*\n\n![Comic panel: a ship crew of all levels scans the horizon with telescopes of different lengths.](assets/images/goals-and-questions/comic-08-horizons-for-everyone.jpeg)\n**Panel 8:** *The closer: anyone at any level can think in horizons — ideally right on the front line.*\n"}]}]}</script>

    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);

                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);

            // Status pill goes first, then a " / " separator before the existing

            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');

                if (sectionEl.firstChild) {

                sectionEl.appendChild(document.createTextNode(postId));

                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
