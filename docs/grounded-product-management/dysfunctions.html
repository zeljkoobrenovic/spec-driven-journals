<script id="data" type="application/json">{"meta": {"id": "PM-DYSFUNCTIONS", "status": "draft:gray", "title": "Product Dysfunctions", "date": "2026-07-27", "author": "Željko Obrenović", "permalink": "dysfunctions", "timetoread": "8 min", "excerpt": "I treat recurring product dysfunctions as diagnosable patterns, not personality problems. When the roadmap is driven by the loudest customer, the boldest opinion, or the fullest backlog, I name the dysfunction first — sales-led, visionary-led, consensus-driven, spreadsheet-led, or feature factory — and then I fix the operating system, not the people. The cure is always the same chain: target customer, key outcome, journey vision, strategy, roadmap.", "tags": "product management, dysfunctions, feature factory, vision-led, diagnosis", "icon": "assets/icons/dysfunctions.png", "logo": "assets/images/dysfunctions/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["product management", "dysfunctions", "feature factory", "vision-led", "diagnosis"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: I treat recurring product dysfunctions as diagnosable patterns, not personality problems. When product work is driven by the loudest customer, the boldest opinion, the fullest spreadsheet, or the busiest backlog instead of a vision and outcomes, I name the dysfunction first and fix the operating system, not the people. I score the organization honestly against the known patterns, pick the one or two doing the most harm, and replace them with the vision-led chain — target customer, key outcome, journey vision, strategy, roadmap.\n\n## Statement\n\nMy operating model for product dysfunctions has four parts:\n\n- **Diagnose before treating.** I run an honest self-assessment against the known dysfunction symptoms — features over outcomes, internal metrics over customer value, backlog-as-roadmap, spreadsheet prioritization, priority whiplash, leadership overrides. Three or four checked is meaningful dysfunction; five or more is an urgent leadership problem.\n- **Name the pattern, not the person.** The same five dysfunctions recur everywhere: *sales-led* (loud customers), *visionary-led* (founder override), *consensus-driven* (negotiated mediocrity), *spreadsheet-led* (theoretical ROI), and the *feature factory* (output over outcomes) — each described under Anti-Patterns below.\n- **Fix the system with the vision-led chain.** Define the target customer and key outcome, map the customer journey, write a future-state vision, build a strategy with measurable milestones, and rework the roadmap so every item links to an outcome.\n- **Hold the line.** Filter feedback through the target market, say no to misaligned requests, keep leadership aligned on the trade-offs, and review progress against outcomes, not output.\n\n![A ship headed toward a lighthouse labeled vision, pulled off course by five ropes labeled loudest customer, founder override, consensus, spreadsheet, and feature backlog.](assets/images/dysfunctions/dysfunction-forces-ship.jpeg)\n**Figure 1:** *Five dysfunctions, one ship: each pulls the roadmap in a different direction, and only the vision provides a heading.*\n\n## How to Read This\n\nThis journal is the product-management counterpart to my engineering-executive journal: the same first-person operating principles, applied to how product decisions get made. This record is grounded in Ben Foster and Rajesh Nerlikar's *Build What Matters*, read through a practitioner-executive lens — I keep their diagnosis vocabulary and their vision-led cure, and state how I apply both. If you work with me, this record explains why my first question about a struggling product is never \"who is underperforming?\" but \"which dysfunction is this?\" The working checklist lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**Dysfunctions are systems, so blaming people changes nothing.** Every dysfunction on the list is locally rational. The salesperson escalating a demand is doing their job; the founder overriding the roadmap genuinely sees something. Swapping the people while keeping the system reproduces the dysfunction with a new cast. So I name the pattern out loud — *this is a sales-led roadmap*, *this is a HiPPO decision* (the highest-paid person's opinion) — and then change what the decision is checked against, not who makes it.\n\n**A backlog is not a strategy, and shipping is not progress.** The feature factory is the most seductive dysfunction because it looks like health: velocity is up, releases are frequent, everyone is busy. But when success is judged by internal metrics and feature counts rather than customer value, the team can ship for a year and move the customer nowhere. The defense is to make outcomes the unit of progress: every roadmap item links to a customer outcome, and shipped work gets reviewed for whether it created customer value — not whether it went out on time.\n\n![Split illustration contrasting a feature-factory conveyor piling boxes beside an indifferent customer with an outcome loop connecting customer, rising gauge, and short roadmap.](assets/images/dysfunctions/feature-factory-vs-outcome-flow.jpeg)\n**Figure 2:** *The feature factory measures shipped boxes; the vision-led loop measures whether the customer's outcome actually improved.*\n\n**Serving everyone is the fastest way to serve no one.** The sales-led product grows one custom deal at a time until the roadmap is a pile of one-off promises; the consensus-driven product trades away its point of view to keep stakeholders comfortable. Both fail for the same reason: they never chose a target market. A product-driven company knows which customer segment it serves, which needs it should meet — and, just as deliberately, which requests it should intentionally ignore. Saying no is not a communication problem; it is the strategy working.\n\n**Feedback is data, not direction.** I do not ignore customers, executives, or spreadsheets — I filter them. For each major feedback item I ask: is it from the target market, used as designed, valuable to many customers, aligned with the long-term vision, and worth the opportunity cost? Then the decision is mechanical: **act** if it improves value for the target market, **investigate** if it reveals a broader unmet need, **defer** if it is useful but misaligned with current priorities, **decline** if it serves a one-off. The same filter disciplines the visionary: a founder's insight enters through the framework like everyone else's, making the override unnecessary.\n\n**Stability is a prerequisite for outcomes.** Priority whiplash is a dysfunction in its own right: initiatives need enough time to succeed before being declared failures, and teams need a strategy stable enough to execute. When leadership agrees on the target customer, the outcome, and the trade-offs — and product has real authority over prioritization — the roadmap stops being renegotiated every time someone senior has a strong week.\n\n## What This Means in Practice\n\n| What this principle says | What it does **not** say |\n| --- | --- |\n| Name the dysfunction before proposing a fix. | Naming is blaming — the pattern is at fault, not the people enacting it. |\n| The roadmap serves a chosen target market. | Customers outside the segment are treated badly — they are just not steering. |\n| Say no to misaligned requests, including executive ones. | Product ignores sales, leadership, or data — everything enters through the filter. |\n| Progress is reviewed against outcomes. | Shipping cadence doesn't matter — output is necessary, just not sufficient. |\n| The vision-led chain replaces the dysfunction. | One workshop fixes it — the chain must survive contact with the next loud request. |\n| Pick the top one or two dysfunctions to fix first. | Fix everything at once — sequencing is the treatment plan. |\n\nConcretely: I run the dysfunction self-assessment with leadership at least yearly and treat a score of three or more as a mandate to act. Roadmap reviews start from outcomes, not the request queue. Custom work for one customer must benefit many or advance the strategy. And when a decision is overridden from above, I ask for the framework behind it — not to win the argument, but to make the framework explicit and reusable.\n\n![A clipboard diagnosis chart mapping symptom icons to five dysfunction labels: sales-led, visionary-led, consensus, spreadsheet-led, feature factory.](assets/images/dysfunctions/symptom-dysfunction-diagnosis.jpeg)\n**Figure 3:** *Symptom to diagnosis: mapping what you observe to a named dysfunction is what turns frustration into a treatment plan.*\n\n## Anti-Patterns\n\n- **The sales-led product.** A roadmap of custom promises to individual customers; the target market never shouts, so it never gets a vote.\n- **The visionary-led product.** The founder or a senior leader frequently overrides product direction without a clear framework — brilliance as a bus factor. Its meeting-level symptom is the HiPPO decision: prioritization by the highest-paid person's opinion, with research and outcome data as decoration.\n- **The consensus-driven roadmap.** Product meetings become negotiations to keep every stakeholder happy; the output is the intersection of everyone's comfort.\n- **The spreadsheet-led product.** Theoretical ROI models and scoring formulas with invented precision — rigor theater replacing customer research.\n- **The feature factory.** Success judged by shipping, roadmap-as-backlog, no review of whether anything created customer value.\n- **Whiplash management.** Priorities change too quickly for anything to succeed, then the initiatives get blamed for failing.\n- **Blaming the cast.** Replacing the PM while leaving the decision system untouched — the dysfunction survives the reshuffle.\n\n## Related Records\n\n- [Customer Journey Vision](customer-journey-vision.html) — this record is the diagnosis; the journey vision is the treatment.\n- [Outcomes](outcomes.html) — the key-customer-outcome discipline; the feature factory's antidote.\n- [The Right Processes](right-processes.html) — the operating processes that keep the vision-led chain running after the fix.\n- [Measuring Engineering Organizations](../grounded-engineering-executive/measuring-engineering-organizations.html) — the engineering-side counterpart: measuring by outcomes rather than activity.\n\n## Scope and Revisiting\n\nThis principle governs how I diagnose and repair product decision-making in organizations I lead, join, or advise. I revisit it whenever the self-assessment score crosses three, whenever a roadmap review turns into a negotiation, and whenever I catch myself explaining a product problem as a person rather than a pattern. The self-assessment repeats at least yearly.\n\n## Authoritative References\n\n- Ben Foster and Rajesh Nerlikar, *Build What Matters: Delivering Key Outcomes with Vision-Led Product Management* (Lioncrest Publishing, 2020) — the dysfunction taxonomy and the vision-led cure this record's checklist distills.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "4 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this principle. The Article tab carries the rationale, implications, and anti-patterns.*\n\n## Dysfunction Self-Assessment\n\nCheck any that apply.\n\n- [ ] We focus more on **shipping features** than achieving customer or business outcomes.\n- [ ] Success is judged mainly by **internal metrics** rather than customer value.\n- [ ] Product decisions are made **without** enough **customer research**.\n- [ ] We spend too much time **optimizing small details** instead of creating meaningful innovation.\n- [ ] Our roadmap is **mostly a backlog** of requested features.\n- [ ] Prioritization depends too heavily on **spreadsheets**, **ROI** models, or **theoretical** scoring.\n- [ ] **Priorities change** too quickly, creating whiplash for the team.\n- [ ] Engineering is **overbuilding** for future scenarios that may never happen.\n- [ ] Product meetings become **negotiations** to keep every stakeholder happy.\n- [ ] The founder, CEO, or senior leader frequently **overrides** product direction without a clear framework.\n\n**Score:**<br>\n0 checked = strong product habits<br>\n1–2 checked = some warning signs<br>\n3–4 checked = meaningful product dysfunction<br>\n5+ checked = urgent product leadership problem\n\n## Product-Driven Company Checklist\n\n- [ ] We know exactly which **customer segment** we are serving.\n- [ ] We build for **a broader market**, not one customer at a time.\n- [ ] We understand which **customer needs** our product should meet.\n- [ ] We also understand which customer requests we should **intentionally ignore**.\n- [ ] **Product** and **UX** are closest to the customer.\n- [ ] **Customer-facing teams** regularly share insights with product.\n- [ ] Product decisions guide the priorities of **sales**, **marketing**, **engineering**, and **support**.\n- [ ] We are comfortable **saying \"no\"** to requests that do not serve the target market.\n- [ ] Our product strategy is based on **customer outcomes**, not stakeholder politics.\n- [ ] We **avoid custom work** unless it benefits many customers or advances the strategy.\n\n## Customer Feedback Checklist\n\nFor each major feedback item, ask:\n\n- [ ] Is this feedback from our target market?\n- [ ] Is this customer using the product for the purpose we designed it for?\n- [ ] Would solving this help many customers, not just one?\n- [ ] Would it improve retention, upsell, activation, or customer success?\n- [ ] Does it support our long-term product vision?\n- [ ] Is it worth the engineering and opportunity cost?\n- [ ] Are we reacting to pressure, or making a strategic decision?\n\n### Decision guide\n\n- [ ] **Act** if it improves value for the target market.\n- [ ] **Investigate** if it reveals a broader unmet need.\n- [ ] **Defer** if it is useful but not aligned with current priorities.\n- [ ] **Decline** if it only serves a one-off or off-market use case.\n\n## Vision-Led Product Management Checklist\n\n### Key Customer Outcome\n\n- [ ] We have identified the main customer outcome we want to improve.\n- [ ] We can measure whether customers are getting more value.\n- [ ] The outcome matters to customers and supports business success.\n- [ ] The team knows why this outcome matters.\n\n### Customer Journey Vision\n\n- [ ] We have mapped the customer journey from discovery to long-term retention.\n- [ ] We understand where customers struggle today.\n- [ ] We know what the ideal future journey should look like.\n- [ ] The vision explains value from the customer's perspective, not as a feature list.\n\n### Product Strategy\n\n- [ ] We know the gap between today's product and the future vision.\n- [ ] We have clear milestones toward the vision.\n- [ ] Our roadmap connects directly to those milestones.\n- [ ] We have defined what we will not do.\n- [ ] Engineering, design, sales, marketing, and leadership understand the strategy.\n\n## Roadmap Health Checklist\n\n- [ ] Every roadmap item links to a customer outcome.\n- [ ] Every roadmap item supports the target market.\n- [ ] We can explain why each item matters now.\n- [ ] We have removed low-value stakeholder requests.\n- [ ] We are not over-prioritizing the loudest customer or executive.\n- [ ] We balance short-term needs with long-term product direction.\n- [ ] We give initiatives enough time to succeed before pivoting.\n- [ ] We review whether shipped work actually created customer value.\n\n## Leadership Alignment Checklist\n\n- [ ] Leadership agrees on the target customer.\n- [ ] Leadership agrees on the customer outcome we are pursuing.\n- [ ] Leadership understands the trade-offs behind the roadmap.\n- [ ] Product has authority to make prioritization decisions.\n- [ ] Stakeholders understand why some requests are declined.\n- [ ] The company has a shared product vision that inspires teams.\n- [ ] Strategy is stable enough for teams to execute effectively.\n- [ ] Product leadership communicates the vision repeatedly and clearly.\n\n## Final Action Checklist\n\n- [ ] Identify which dysfunctions are present.\n- [ ] Pick the top 1–2 dysfunctions causing the most harm.\n- [ ] Define the target customer segment.\n- [ ] Define the key customer outcome.\n- [ ] Map the customer journey.\n- [ ] Create a future-state product vision.\n- [ ] Build a strategy with measurable milestones.\n- [ ] Rework the roadmap around customer value.\n- [ ] Say no to misaligned requests.\n- [ ] Review progress regularly against outcomes, not output.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Shipping more while mattering less — how to name the dysfunction steering your roadmap and fix the system, in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned product-minded executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. MILA: an energetic young product manager, dark hair in a ponytail, denim jacket over a striped shirt, carries a tablet covered in sticky notes.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Mila stands behind a teetering pile of request notes, showing her tablet to a calm Vera.](assets/images/dysfunctions/comic-01-pile-of-loud-requests.jpeg)\n**Panel 1:** *The hook: a roadmap made of whoever shouted last.*\n\n![Comic panel: Vera and Mila study a chart where shipped features rise but customer value stays flat, a toy ship pulled by ropes behind them.](assets/images/dysfunctions/comic-02-shipping-lots-moving-nowhere.jpeg)\n**Panel 2:** *The problem: shipping lots, moving nowhere — every force pulls a different way.*\n\n![Comic panel: Vera at a whiteboard drawing an arrow from a magnifying glass labeled pattern to a gear labeled system, Mila watching.](assets/images/dysfunctions/comic-03-name-the-dysfunction.jpeg)\n**Panel 3:** *The principle: diagnose the pattern, then repair the operating system.*\n\n![Comic panel: split scene of a salesperson dragging a roadmap toward a megaphone-wielding customer and a crowned executive stamping over a roadmap.](assets/images/dysfunctions/comic-04-sales-led-and-hippo.jpeg)\n**Panel 4:** *The tour, part one: the sales-led product and the visionary-led override.*\n\n![Comic panel: stakeholders assembling a bland roadmap from puzzle pieces beside Mila squinting at a spreadsheet with a falsely precise score.](assets/images/dysfunctions/comic-05-consensus-and-spreadsheets.jpeg)\n**Panel 5:** *The tour, part two: consensus-driven roadmaps and spreadsheet-led rigor theater.*\n\n![Comic panel: a factory conveyor piles identical feature boxes beside a shrugging customer under a proud shipped-count display.](assets/images/dysfunctions/comic-06-feature-factory.jpeg)\n**Panel 6:** *The tour, part three: the feature factory — busy, proud, and pointless.*\n\n![Comic panel: Vera and Mila at a whiteboard chain linking customer, outcome, journey, strategy, and roadmap to a lighthouse, Mila crossing out stray requests.](assets/images/dysfunctions/comic-07-vision-led-chain.jpeg)\n**Panel 7:** *The alternative: the vision-led chain, where every roadmap item earns its place.*\n\n![Comic panel: close-up of Mila proudly showing a short three-item roadmap with a rising value gauge while Vera nods approvingly.](assets/images/dysfunctions/comic-08-fewer-things-that-matter.jpeg)\n**Panel 8:** *The closer: fewer things, all of them mattering.*\n"}]}]}</script>

                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
