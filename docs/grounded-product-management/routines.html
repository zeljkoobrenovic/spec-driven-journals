<script id="data" type="application/json">{"meta": {"id": "PM-ROUTINES", "status": "draft:gray", "title": "Routines", "date": "2026-08-14", "author": "Željko Obrenović", "permalink": "routines", "timetoread": "8 min", "excerpt": "Great products are built on routines — the collective habits, explicit or implicit, that make good work happen weekly. I bootstrap new teams with a V1 way of working instead of letting them theorize, hold the weekly ritual through the week-four collapse, anchor the work in artifacts we revisit rather than reinvent — and treat AI as a turbocharger of whatever habits, good or bad, we already have.", "tags": "product management, routines, ways of working, habits, meetings, ai", "icon": "assets/icons/routines.png", "logo": "assets/images/routines/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["product management", "routines", "ways of working", "habits", "meetings", "ai"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: Great products are built on routines — the collective habits, explicit or implicit, that make good work happen week after week. I bootstrap every new team with a V1 way of working and get moving rather than letting smart people theorize; I hold the weekly ritual through the week-four moment where it would otherwise go zombie or die; I anchor the work in artifacts we write and revisit rather than reinvent; and I treat AI as a turbocharger of whatever habits — good or bad — we already have. Good product work is boring: it is in the doing, every day, every week.\n\n## Statement\n\nMy operating model for routines has five parts:\n\n- **Have routines — explicit or implicit, but real.** They can be fluid or strict; what matters is that they exist and that the team can reset them quickly when something changes.\n- **Bootstrap with V1, then adapt.** A new team gets a starting way of working — written collectively in one meeting, or delegated to one person to hammer out — that people generally agree with. Theorizing is left for later; the team adapts as it goes.\n- **Push through week four.** Every good weekly ritual meets the moment where it becomes a zombie meeting or quietly stops. Holding it through that moment — elephants named, priorities re-gathered — is the discipline that separates teams that keep the motion from teams that lose it.\n- **Lean on anchor artifacts.** Documents we write, revisit, and ask \"does this still make sense?\" — instead of perpetually reinventing the latest doc format for each initiative.\n- **Point AI at the good habits.** AI turbocharges whatever we already do. I use it to do the things we always knew we should — organize the research library, instrument the analytics — and I rely on expertise, not novelty, to judge what it should do next.\n\n## How to Read This\n\nThis record is grounded in John Cutler's \"20 Unfiltered Operating Takes\" (TBM 435), read through the same practitioner-executive lens as the rest of this journal. It answers the question behind most \"how much process do we need?\" debates: process is the wrong noun — the right one is *habits*. If you join a new team I have chartered, this record explains why a V1 working agreement exists before your first sprint does. The working checklist, derived from the essay, lives in the **Checklist** tab.\n\n## Rationale\n\n**Routines are the heartbeat, and both failure modes kill it.** Processified to the nth degree, a routine loses any chance of being effective; left implicit and loose, the team cannot reset when something changes. Experienced people can go far on \"meeting when it makes sense\" — but experience does not immunize anyone against the real traps: not raising risks because it is uncomfortable, avoiding the hard conversation, riding status-quo bias past the point where the direction deserved a challenge, and postponing the tough call \"one more week.\" The routine is where a coworker gets the standing chance to set you straight. We are creatures of habit; the agenda can vary, but getting people in a room, regularly, is what compounds.\n\n![Spectrum gauge from a chained processified routine to dissolving loose notes, with a glowing resettable heartbeat zone in the middle.](assets/images/routines/routine-health-spectrum.jpeg)\n**Figure 1:** *Both ends kill the heartbeat: routines must exist, and must be resettable when something changes.*\n\n**Experienced teams waste their best energy on an undecided game.** Put smart senior people together and half their time goes to reconciling work-style variations and quirks — politely, with gap-filling and back-channel influence. They do not lack the ability to figure it out; they lack someone willing to just *decide*. So I make the V1 move: define the game and the playbook well enough to start, by whatever legitimate route — a working-agreements session, or \"I hate to do this, but can you hammer out V1?\" This is not dictatorship; it is unblocking. Experienced people rarely need the t's crossed — they need the waffling ended.\n\n**The V1 trap is the showpiece OS.** The risk in bootstrapping is that whoever writes V1 oversimplifies it, deck-ifies it, or tunes it for the people who are not doing the work. Then the team has a starter operating system that reflects a slide, not reality — worse than no agreement, because it must now be worked around *and* maintained. V1 is written for the people in the work, in their terms, and it earns changes weekly.\n\n![Flow diagram of two routes into a V1 working agreement feeding a run-adapt loop, with a gray dead-end branch to a showpiece slide.](assets/images/routines/v1-bootstrap-loop.jpeg)\n**Figure 2:** *Either route to V1 is fine — decided together or delegated — as long as it enters the run-adapt loop instead of the pedestal.*\n\n**Week four is where teams are lost.** Everyone has seen it: the team starts with best intentions and a great weekly meeting, stays on the gas — then elephants accumulate, priorities fracture, leaders drift into other rooms to plan far-off things, and 1:1s become planning sessions for what comes after the collapse everyone privately expects. The meeting goes zombie or goes away.\n\nThis is not laziness; it is fear — of forward momentum under uncertainty, of picking wrong, of saying out loud \"a million things came up last week; should I have said no to them?\" Teams will invent whole workstreams — weeks of \"going back to the drawing board to build alignment\" — to avoid the raw act of doing and being accountable. Pushing through that moment is precisely the job, and no one is exempt from it: converging back onto the working vibe, over and over, is the work of ICs and leaders alike.\n\n![Line chart of meeting energy dipping at week four, with dashed zombie and stopped paths and a solid push-through recovery path.](assets/images/routines/week-four-survival-curve.jpeg)\n**Figure 3:** *Every good ritual meets week four: the elephants gather, and the only good path out is through the uncomfortable conversation.*\n\n**Anchor artifacts beat format novelty.** Every reinvented brief format resets the team's memory to zero. A small set of artifacts that we write, revisit, and re-ask \"does this still make sense?\" accumulates judgment instead of formatting effort — and gives the weekly routine something durable to run against.\n\n**AI multiplies the habits it finds.** My hunch matches the essay's: most principles survive; what changes is leverage. A team with good habits and no slack — the research team that never had time to organize its library, the team that always meant to instrument analytics — gets dramatically better, because AI does what they already knew was worth doing. A feature factory gets a *better* feature factory. And capabilities that were merely laborious become effortlessly seductive — synthetic personas were always possible, but now they are terribly persuasive, and only skill answers whether, where, and within what boundaries they are a good idea. The danger is people who have never seen truly high-leverage work letting AI set their bar. Practices will churn — one week it is one kind of engineering, next week another — but expertise still decides what is worth turbocharging.\n\n**You can hear when it is working.** Boring product is the goal state: moving things forward every day and week, thinking across horizons without dwelling in past or future, a collection of habits quietly compounding. Listen to a team for a week: do you hear motion, learning, the small being connected to the big? Or does it sound like a movie that never finds its footing? I trust that signal — it is the audible form of this entire record.\n\n## What This Means in Practice\n\n| What this principle says | What it does **not** say |\n| --- | --- |\n| Every team has real routines, explicit or implicit. | Every routine is documented process — implicit habits that reset well are fine. |\n| New teams start from a decided V1 and adapt weekly. | The first version is permanent, or beyond the team's power to change. |\n| The weekly ritual survives week four, with elephants named. | Meetings are sacred regardless of value — a routine that stops earning its slot gets changed, deliberately. |\n| Artifacts are revisited: \"does this still make sense?\" | Formats are frozen forever — anchors evolve; they just don't get reinvented per initiative. |\n| AI accelerates the habits we already trust. | AI adoption waits for perfect practices — we innovate on practice, with expertise setting the bar. |\n\n## Anti-Patterns\n\n- **The reconciliation swamp.** Months of senior people politely negotiating work-style preferences while no game gets defined and no work starts.\n- **The showpiece OS.** A way-of-working deck tuned for people who do not do the work — palatable, symmetrical, and unused.\n- **The zombie meeting.** The weekly ritual everyone sleepwalks through because the real conversations moved to back channels weeks ago.\n- **The silent cancellation.** The ritual that \"didn't make sense this week\" four weeks running, while 1:1s plan for the collapse.\n- **Alignment as avoidance.** Returning to the drawing board — again — because the raw act of doing, and being accountable for last week, is scarier than another framing exercise.\n- **Format churn.** A new brief template per initiative; institutional memory reset to zero each time.\n- **The turbocharged factory.** AI adopted enthusiastically by a team that never learned what good looks like — producing mediocrity faster than ever.\n\n## Related Records\n\n- [The Right Processes](right-processes.html) — the product-management processes themselves; this record is the habit layer that keeps any chosen process alive.\n- [The Right Team](right-team.html) and [Staffing](staffing.html) — who is in the room; routines start where staffing ends.\n- [Working Small](working-small.html) — the tempo the weekly heartbeat sustains; the two records describe one motion at two resolutions.\n- [Lanes](lanes.html) — what the weekly routine reviews: the lanes and their metrics.\n- [Meetings](../grounded-engineering-executive/meetings.html) — the engineering journal's meeting discipline; the week-four commitment here is its product-side counterpart.\n\n## Scope and Revisiting\n\nThis principle governs how teams I charter start working and how their rituals are kept alive. I revisit it if V1 bootstrapping repeatedly produces agreements teams feel unable to change — the adapt-as-you-go half is load-bearing — and I revisit the AI stance as practices churn: the habits claim should hold even as the specific leverage points change every quarter.\n\n## Authoritative References\n\n- John Cutler, \"TBM 435: 20 Unfiltered Operating Takes\", *The Beautiful Mess*, August 2026 — the source essay; this record distills its Deciding On How You Work, Routines, and AI sections, the anchor-artifacts take, and Boring Product.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "3 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this principle — derived from John Cutler's \"20 Unfiltered Operating Takes\". The Article tab carries the rationale and anti-patterns.*\n\n## Bootstrap a New Team (V1)\n\n- [ ] A V1 way of working exists before real work starts — written in one session or delegated to one person.\n- [ ] The route is legitimate: collective working agreements, or an explicit \"hammer out V1\" assignment.\n- [ ] V1 is written by and for the people doing the work — not deck-ified for observers.\n- [ ] V1 covers just enough to start: cadence, decision habits, how work is picked up and reviewed.\n- [ ] Theorizing about the perfect operating model is explicitly deferred.\n- [ ] The team knows V1 is theirs to adapt as they go.\n\n## Keep the Heartbeat\n\n- [ ] A regular ritual gets the team in a room (virtual or otherwise) to connect on the here and now.\n- [ ] The agenda can vary; the connection does not lapse.\n- [ ] Most of the energy goes to what was done and learned, not only what is planned.\n- [ ] Risks and elephants get named in the room, not in back channels.\n- [ ] Hard calls are made when due — not postponed \"one more week\".\n\n## Watch for the Week-Four Collapse\n\n- [ ] The ritual is watched for zombie signs: attendance without engagement, status without conversation.\n- [ ] The ritual is watched for silent death: \"didn't make sense this week\" twice running is the warning; four running is the collapse.\n- [ ] Leaders spend more time connecting on current work than planning far-off things in other rooms.\n- [ ] Accumulated elephants trigger an explicit reset of the routine, not its abandonment.\n- [ ] \"Going back to the drawing board for alignment\" is challenged when it is avoidance of doing.\n\n## Maintain Anchor Artifacts\n\n- [ ] A small set of anchor artifacts exists — documents the team writes and returns to.\n- [ ] Anchor artifacts are revisited on a rhythm: do they still make sense?\n- [ ] New initiatives reuse the anchors instead of inventing a new doc format.\n- [ ] Anchors evolve deliberately; format changes are decisions, not defaults.\n\n## Point AI at the Habits\n\n- [ ] AI leverage starts from things the team already knew it should do (research library, analytics instrumentation, documentation).\n- [ ] New AI-enabled practices are judged by people who know what good looks like.\n- [ ] Newly cheap capabilities (e.g. synthetic personas) get explicit \"for what, within what boundaries?\" scrutiny.\n- [ ] Practice changes are expected and revisited — expertise, not novelty, sets the bar.\n\n## Listen for the Motion\n\n- [ ] You can hear the team's motion: shipping, learning, small connected to big.\n- [ ] Progress is discussed daily and weekly, undramatically.\n- [ ] When the team sounds like a movie that never finds its footing, that instinct is acted on.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Routines — the heartbeat that survives week four, in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned product-minded executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. MILA: an energetic young product manager, dark hair in a ponytail, denim jacket over a striped shirt, carries a tablet covered in sticky notes.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: five senior people each hold a different way-of-working diagram while the clock spirals.](assets/images/routines/comic-01-the-reconciliation-swamp.jpeg)\n**Panel 1:** *The hook: smart people, no game — half the time goes to reconciling quirks.*\n\n![Comic panel: Vera places a one-page V1 working agreement on the table and the team relaxes.](assets/images/routines/comic-02-just-decide-v1.jpeg)\n**Panel 2:** *The move: bootstrap a V1 way of working and get moving — theorize later.*\n\n![Comic panel: a glossy framed operating-model poster in a lobby while the team behind works from sticky notes.](assets/images/routines/comic-03-the-showpiece-os.jpeg)\n**Panel 3:** *The trap: a starter OS written for observers is a showpiece, not a way of working.*\n\n![Comic panel: a weekly meeting with full Did and Learned columns and a small Plan column.](assets/images/routines/comic-04-the-heartbeat.jpeg)\n**Panel 4:** *The heartbeat: talk about what you did and learned — 80% on the here and now.*\n\n![Comic panel: a dim week-four meeting with sleepwalking attendees and small elephants in the corners.](assets/images/routines/comic-05-week-four.jpeg)\n**Panel 5:** *The danger: week four — the meeting goes zombie or quietly stops.*\n\n![Comic panel: Mila points at a startled small elephant as the room brightens.](assets/images/routines/comic-06-name-the-elephant.jpeg)\n**Panel 6:** *The discipline: push through — name the elephant, have the uncomfortable conversation.*\n\n![Comic panel: Vera holds a worn annotated document while a bin overflows with shiny unused templates.](assets/images/routines/comic-07-anchor-artifacts.jpeg)\n**Panel 7:** *The anchor: artifacts you write and revisit beat formats you reinvent.*\n\n![Comic panel: a robot turbocharger speeds up both a good-habits machine and a smoking bad-habits machine.](assets/images/routines/comic-08-turbocharged-habits.jpeg)\n**Panel 8:** *The closer: AI turbocharges good and bad habits alike — boring, steady doing is what's worth accelerating.*\n"}]}]}</script>

    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,

            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
