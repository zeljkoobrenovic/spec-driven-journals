<script id="data" type="application/json">{"meta": {"id": "PM-INTRODUCTION", "status": "draft:gray", "title": "Introduction", "date": "2026-07-27", "author": "Željko Obrenović", "permalink": "introduction", "timetoread": "5 min", "excerpt": "This journal is my product-management operating model, written down: 14 records describing how I believe product decisions should be made — vision-led, outcome-driven, and executed by empowered teams. Each record is grounded in a chapter checklist from Foster and Nerlikar's Build What Matters or Cagan and Jones's EMPOWERED, and each states a commitment I am prepared to be held to. Start here for the map.", "tags": "product management, operating principles, introduction, vision-led, empowered teams", "icon": "assets/icons/introduction.png", "logo": "assets/images/introduction/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["product management", "operating principles", "introduction", "vision-led", "empowered teams"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **KEY POINTS:**\n>\n> * **This journal is my product operating model, written down** — 14 records describing how I believe product management should work: vision-led and outcome-driven in its direction, empowered and team-shaped in its execution, grounded in *Build What Matters* and *EMPOWERED*.\n> * **Every record has the same anatomy** — a quotable principle up front, an argued body behind it, a working checklist in the **Checklist** tab, and an explainer comic in the **Comic** tab for the two-minute version.\n> * **Read it as a contract, not a book report** — the principle tells you what to expect from me at the product–engineering boundary; every record is a draft that gets revisited against practice, and discrepancies are legitimate things to raise with me.\n\n<br>\n\nIf you work with me — as my CEO, as a product leader, or on a product team — you should not have to guess what I believe about product management. This journal writes it down: how a product vision gets built, how strategy connects vision to roadmap, how outcomes replace output, how product teams get staffed, coached, shaped, and pointed at problems rather than features. Fourteen records, each one an operating principle I am prepared to be held to, each grounded in a chapter of one of two books I keep returning to.\n\n## Why an Engineering Executive Writes a Product Journal\n\nBecause product and engineering are not two functions that hand work to each other — they are one delivery system with two specializations. Every consequential engineering decision I make leans on a product assumption: what we staff, what we platform, what we make fast, what we let stay slow. An engineering executive who cannot articulate how product decisions *should* be made cannot do three parts of the job: partner with a head of product as a peer rather than a supplier, staff the product–engineering boundary deliberately, or arbitrate a roadmap conflict on anything better than volume.\n\n![Two interlocking gears representing product and engineering drive one delivery conveyor, with a shared written document connected to both.](assets/images/introduction/one-delivery-system.jpeg)\n**Figure 1:** *Figure 1: One delivery system, two specializations — and the journal as the written contract both halves can inspect.*\n\nThere is a second reason, inherited from this journal's sibling. My [engineering-executive journal](../grounded-engineering-executive/introduction.html) is built on the idea that a written operating model is inspectable — [Inspected Trust](../grounded-engineering-executive/inspected-trust.html) commits me to verifying my organization's work and making my own work inspectable in return. This journal extends that commitment across the boundary. What I expect from product management is no longer something to reverse-engineer from my questions in roadmap reviews; it is public, argued, and concrete enough to check me against. When my behavior and these pages disagree, one of them is wrong, and finding out which is a conversation I want.\n\n## What a Record Looks Like\n\nEvery record follows the same shape, so you always know where to look:\n\n| Part | What it gives you |\n| --- | --- |\n| **Status / Principle** blockquote | The whole principle in one quotable paragraph — read only this and you have the direction. |\n| **Statement → Rationale → Anti-Patterns** | The ADR-shaped body: what I commit to, why, what it does *not* say, and the failure modes it guards against. |\n| **Checklist** tab | The operational working checklist — grouped, checkable actions. The article is the argument; this is the part that gets run. |\n| **Comic** tab | An eight-panel explainer with a recurring cast — the two-minute version, built to be shared. |\n| **View spec** link | The authoring contract behind the post — intent, success criteria, and a decision log, versioned like everything else. |\n\nEvery record carries `status: draft`, deliberately. These principles are written from conviction and reading ahead of being fully tested against my own practice at this scope, and each record names the conditions under which I will revisit it.\n\n## Where the Material Comes From\n\nThe vision is mine; the grounding is borrowed openly, and credited per record. Seven records start from chapter checklists of Ben Foster and Rajesh Nerlikar's *Build What Matters* (Lioncrest, 2020) — the vision-led operating loop: name the dysfunctions, envision the customer journey, derive strategy, define outcomes, balance the roadmap, and build the team and processes to run it. The other seven start from Marty Cagan and Chris Jones's *EMPOWERED* (Wiley, 2020) — what product leadership owes empowered teams: coaching, staffing, vision and principles, strategy as focus and insight, topology, objectives, and collaboration with the business. The books describe what strong product organizations do; these records state what *I* will do, in first person, with the trade-offs I accept. Where my practice disagrees with either book, the record says so.\n\n![Streams from two open books merge through a funnel into a single signed volume held by a figure.](assets/images/introduction/two-books-one-model.jpeg)\n**Figure 2:** *Figure 2: Two books, one operating model — Foster & Nerlikar for the vision-led loop, Cagan & Jones for empowered teams, the signature mine.*\n\n## The Map\n\nThe two sections mirror the two books:\n\n- **Build What Matters** — the vision-led operating loop, from diagnosis to machinery: [Product Dysfunctions](dysfunctions.html), [Customer Journey Vision](customer-journey-vision.html), [Product Strategy](product-strategy.html), [Outcomes](outcomes.html), [Balanced Roadmap](balanced-roadmap.html), [The Right Team](right-team.html), [The Right Processes](right-processes.html).\n- **EMPOWERED** — what product leadership owes its teams: [Coaching](coaching.html), [Staffing](staffing.html), [Product Vision and Principles](product-vision-and-principles.html), [EMPOWERED Product Strategy](empowered-product-strategy.html), [Team Topology](team-topology.html), [Team Objectives](team-objectives.html), [Business Collaboration](business-collaboration.html).\n\nThe sections cross-link constantly, because the books describe the same system from two altitudes: the vision that [Customer Journey Vision](customer-journey-vision.html) builds is the one [Product Vision and Principles](product-vision-and-principles.html) asks leaders to evangelize; the outcomes in [Outcomes](outcomes.html) are what [Team Objectives](team-objectives.html) hands to teams. Follow the links rather than the section order if a thread pulls you.\n\n![Two shelves of seven tiles each, connected by many curved threads into a single web.](assets/images/introduction/journal-map.jpeg)\n**Figure 3:** *Figure 3: The map — two sections of seven records, cross-linked into one model rather than two reading lists.*\n\n## How to Read This Journal\n\n- **If you are my CEO or a peer executive** — read the Status/Principle blockquotes across both sections; that is the whole model in fifteen minutes, and it tells you what to expect from me whenever product direction is on the table. [Outcomes](outcomes.html) and [Business Collaboration](business-collaboration.html) are the two that most shape how I show up in your meetings.\n- **If you are a product manager working with me** — start with [Team Objectives](team-objectives.html) and [Balanced Roadmap](balanced-roadmap.html); they describe the operating rhythm you will actually experience, and the *How to Read This* section of each record is addressed to you.\n- **If you are an engineering leader building your own model** — take the checklists; they are the transferable part. The principles are deliberately personal, and disagreeing with them is a fine way to find your own.\n- **If you have two minutes** — open any record's Comic tab.\n\n## Status and Revisiting\n\nThis journal is a living document. Records move from `draft` to `accepted` as practice tests them, each on the revisiting conditions it declares for itself — and this introduction gets updated whenever the journal's shape changes.\n\n## Authoritative References\n\n- Ben Foster and Rajesh Nerlikar, *Build What Matters: Delivering Key Outcomes with Vision-Led Product Management* (Lioncrest Publishing, 2020) — grounds the seven Build What Matters records.\n- Marty Cagan with Chris Jones, *EMPOWERED: Ordinary People, Extraordinary Products* (Wiley, 2020) — grounds the seven EMPOWERED records.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "An engineering executive writes down what she believes about product — the front door to the journal, in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned product-minded executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. MILA: an energetic young product manager, dark hair in a ponytail, denim jacket over a striped shirt, carries a tablet covered in sticky notes.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Mila skeptically greets Vera in a doorway, eyeing her notebook.](assets/images/introduction/comic-01-skeptical-hello.jpeg)\n**Panel 1:** *Panel 1: The hook: an engineering executive with written opinions about product.*\n\n![Vera draws two gears driving one conveyor while two stick figures shrug across a gap.](assets/images/introduction/comic-02-one-delivery-system.jpeg)\n**Panel 2:** *Panel 2: The why: one delivery system — and two halves that too often guess at each other.*\n\n![Vera slides her open notebook with a numbered list across the desk to Mila.](assets/images/introduction/comic-03-written-down.jpeg)\n**Panel 3:** *Panel 3: The move: the product operating model, written down instead of guessed at.*\n\n![Vera presents an exploded diagram of a record with a quote box, document body, and two tabs.](assets/images/introduction/comic-04-record-anatomy.jpeg)\n**Panel 4:** *Panel 4: The anatomy tour: every record ships a principle, an argument, a Checklist tab, and a Comic tab.*\n\n![Vera rests her hands on two annotated open books while Mila photographs them.](assets/images/introduction/comic-05-two-books.jpeg)\n**Panel 5:** *Panel 5: The sources: two books on the desk — borrowed grounding, openly credited, the commitment her own.*\n\n![Vera shows Mila two shelves of seven binders each, connected by pinned threads.](assets/images/introduction/comic-06-two-shelves.jpeg)\n**Panel 6:** *Panel 6: The map: two shelves of seven — one system described from two altitudes.*\n\n![Vera taps her notebook while Mila holds up a tablet with a circled objection, both engaged.](assets/images/introduction/comic-07-hold-me-to-it.jpeg)\n**Panel 7:** *Panel 7: The contract: hold me to it — and arguing with it is a legitimate use.*\n\n![Mila reads the notebook intently with a sticky note in hand as Vera walks away smiling.](assets/images/introduction/comic-08-mila-reads.jpeg)\n**Panel 8:** *Panel 8: The closer: the skeptic starts reading.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
