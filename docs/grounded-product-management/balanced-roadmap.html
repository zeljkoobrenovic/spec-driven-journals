<script id="data" type="application/json">{"meta": {"id": "PM-BALANCED-ROADMAP", "status": "draft:gray", "title": "Balanced Roadmap", "date": "2026-07-27", "author": "Željko Obrenović", "permalink": "balanced-roadmap", "timetoread": "8 min", "excerpt": "I treat the roadmap as an allocation decision before it is a ranking decision. Every item is classified as innovation, iteration, or operation, and I set the split between the three categories top-down — before any individual project is ranked. That allocation is what protects the vision from being eaten by escalations, and operation from being eaten by the vision.", "tags": "product management, roadmap, allocation, vision progress, balance", "icon": "assets/icons/balanced-roadmap.png", "logo": "assets/images/balanced-roadmap/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["product management", "roadmap", "allocation", "vision progress", "balance"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: I treat the roadmap as an allocation decision first and a ranking decision second. Every roadmap item is classified as innovation (work that advances the vision), iteration (improvements that add value to the existing product), or operation (work needed to run, secure, scale, and maintain it). I decide the percentage split between those three categories before ranking a single project, I tune the split to the product's lifecycle stage, and I compare items only within their own category. The allocation is what lets me say no to loud stakeholders without a fight — and what keeps the vision from starving quietly while everything on the roadmap looks individually urgent.\n\n## Statement\n\nMy operating model for the roadmap has five parts:\n\n- **Know why the roadmap exists.** It connects near-term product changes to mid-term milestones and the long-term vision, lets marketing, sales, and other teams plan around product direction, and creates alignment around sequencing and trade-offs.\n- **Classify every item.** Innovation moves the product toward the vision. Iteration improves the existing product for customers or the business. Operation keeps it running, secure, scalable, and maintained. Nothing goes on the roadmap unclassified.\n- **Allocate top-down, then rank.** I decide the percentage of investment going to each category before ranking individual projects, make the trade-offs explicit to executives, and compare items only within the same category.\n- **Tune the allocation to the lifecycle.** A pre-alpha product is mostly innovation; a freshly launched product iterates further to address early feedback; a beta product hunting for product-market fit leans heavily on iteration; a scaling product needs more operation; a steady-state product balances operation with the next wave of innovation.\n- **Prioritize each category on its own terms.** Innovation is ranked by progress toward the next strategic milestone. Iteration is scored with RICE or similar — with the output reviewed, not accepted blindly. Operation gets a reserved slice of capacity and a documented bug policy.\n\n![A horizontal capacity bar split into innovation, iteration, and operation segments, with project cards sorted into each segment.](assets/images/balanced-roadmap/three-category-allocation-bar.jpeg)\n**Figure 1:** *The roadmap as an allocation bar: decide the split across innovation, iteration, and operation first, then rank items only within their own segment.*\n\n## How to Read This\n\nThis journal is the product-management counterpart to my engineering-executive journal: the same first-person operating-principle format, applied to how I believe product management should work. This record is grounded in Ben Foster and Rajesh Nerlikar's *Build What Matters*, read through a practitioner-executive lens — the book addresses the PM building the roadmap; I read it as the executive deciding what the roadmap is allowed to contain. The working checklist — all nine sections — lives in the **Checklist** tab of this post. One boundary to keep clear: annual planning mechanics live in the engineering journal's [Planning](../grounded-engineering-executive/planning.html) record; this record is about what the product roadmap contains.\n\n## Rationale\n\n**A ranked list of unlike things is not a roadmap.** The naive roadmap is a single stack-ranked backlog where a visionary bet, a customer-requested tweak, and a security patch compete head-to-head. They cannot: the tweak wins on confidence, the patch wins on urgency, and the bet always loses — until the product has no future. Classifying every item and comparing only within its category makes prioritization an honest exercise instead of a rigged one.\n\n**The allocation is the real decision; the ranking is bookkeeping.** Deciding that, say, this quarter is 40% innovation, 40% iteration, 20% operation is the trade-off that deserves executive attention. Made explicitly, it prevents loud stakeholders from dominating priorities — their request competes for the iteration slice, not the whole roadmap. Made implicitly, the allocation still happens; it is just decided by whoever escalated last.\n\n**Both failure modes are allocation failures.** The all-reactive roadmap — pure escalations, commitments, and firefighting — never advances the vision by a single milestone; product management becomes a ticket-routing function. The ivory-tower roadmap — all vision, no iteration or operation — ships a beautiful future on top of a product losing today's customers and accruing today's outages. The balanced middle is not a compromise between these; it is the only version in which each category's work compounds.\n\n![Triptych contrasting an all-reactive roadmap, a balanced three-category roadmap, and an ivory-tower vision-only roadmap.](assets/images/balanced-roadmap/reactive-vs-ivory-tower.jpeg)\n**Figure 2:** *The two failure modes flank the principle: all-reactive on one side, all-vision on the other — both are allocation failures, not prioritization failures.*\n\n**Each category needs its own prioritization method.** For innovation, I identify the strategic milestone needed to realize the vision and prioritize work that directly advances it — involving engineering early to reduce future technical debt, and starting the next innovation before the current product's growth flattens. For iteration, I use a RICE-style score — reach, impact, confidence, effort — with confidence validated by data, research, and competitive intelligence, and the output reviewed for bias, weak strategic fit, and missed themes rather than accepted blindly. For operation, I reserve a clear slice of capacity and name what it covers — SLAs, privacy, security, COGS, tooling, maintenance, technical debt, bug fixes. I also define the bug policy explicitly — zero-tolerance, SLA-based, severity-based, or quality-threshold-based — and document it, so stakeholders know what to expect.\n\n**Stakeholder requests deserve a process, not a reflex.** One-off requests go through a clear intake process. Requesters must understand the cost of consuming roadmap capacity; low-value requests get a no; for sales and customer-facing commitments, a capacity or token system makes the trade-off tangible to the people spending it. The point is not to wall the roadmap off — it is to keep reactive work from consuming innovation and operational capacity one reasonable-sounding exception at a time.\n\n![Flow diagram from vision through milestones into the innovation lane of a roadmap, with customer and operational inlets feeding the other two lanes.](assets/images/balanced-roadmap/strategy-to-roadmap-flow.jpeg)\n**Figure 3:** *The roadmap is derived, not collected: vision drives milestones, milestones drive innovation, and customer and operational streams fill their own lanes.*\n\n## What This Means in Practice\n\n| What this principle says | What it does **not** say |\n| --- | --- |\n| Decide the category allocation before ranking projects. | The allocation is a constant — it shifts with lifecycle stage and business context. |\n| Compare items only within their own category. | Categories are silos — the review still checks the whole roadmap against the vision. |\n| Innovation capacity is protected from reactive work. | Customer requests don't matter — they compete fairly inside the iteration slice. |\n| Operation gets a reserved slice and a documented bug policy. | Operational work fills whatever space is left over. |\n| Loud stakeholders get a process and a cost. | Stakeholders are the enemy — the intake process is how their requests win legitimately. |\n| The roadmap is derived from vision and strategy. | The roadmap is a delivery-date commitment device. |\n\nConcretely: before a roadmap review reaches me, every item carries its category; the first slide shows the allocation, not the list; and the final review asks the closing questions — does the roadmap reflect the vision, are all three categories represented, are the trade-offs defensible, are executives aligned on the allocation, and are stakeholders clear on what will **not** be done.\n\n## Anti-Patterns\n\n- **The single stack-rank.** Ranking a vision bet against a bug fix and calling the outcome objective — unlike work compared head-to-head always resolves in favor of the urgent.\n- **Allocation by escalation.** No explicit split, so the real allocation is decided by whoever shouted most recently.\n- **The vanishing vision slot.** Innovation always scheduled \"next quarter\" — technically vision-led, practically 100% reactive.\n- **The ivory tower.** All innovation, no iteration or operation — a future built on a product losing its present.\n- **Score worship.** Accepting RICE output blindly instead of reviewing it for bias, weak strategic fit, and missed themes.\n- **Operation as leftovers.** No reserved capacity and no bug policy, so maintenance happens only after an outage forces it.\n- **Free customer commitments.** Sales promises landing on the roadmap with no intake process and no visible cost to the promiser.\n\n## Related Records\n\n- [Outcomes](outcomes.html) — the roadmap decides what we build; that record decides how we know it worked.\n- [Product Strategy](product-strategy.html) — where the milestones come from; this record allocates capacity against them.\n- [Planning](../grounded-engineering-executive/planning.html) — the engineering journal's record on annual planning mechanics; this record governs what the product roadmap contains, not the planning calendar.\n\n## Scope and Revisiting\n\nThis principle governs how my product roadmaps are composed, allocated, and defended. I revisit the allocation quarterly or when the business context changes, and I revisit the principle itself at every lifecycle transition — and whenever I catch a roadmap review ranking unlike work against each other.\n\n## Authoritative References\n\n- Ben Foster & Rajesh Nerlikar, *Build What Matters: Delivering Key Outcomes with Vision-Led Product Management* (Lioncrest Publishing, 2020) — the balanced-roadmap chapter this record's checklist distills.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "3 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this principle. The Article tab carries the rationale, implications, and anti-patterns.*\n\n## Confirm Why the Roadmap Exists\n\n- [ ] Connect near-term product changes to mid-term milestones and the long-term vision.\n- [ ] Help marketing, sales, and other teams plan around product direction.\n- [ ] Communicate sequencing of priorities.\n- [ ] Create alignment around trade-offs.\n- [ ] Give product leadership and PMs a shared view of top-level priorities.\n\n## Classify Every Roadmap Item\n\n- [ ] **Innovation**: Work that moves the product toward the vision.\n- [ ] **Iteration**: Improvements to the existing product that add value for customers or businesses.\n- [ ] **Operation**: Work required to run, secure, scale, and maintain the product.\n\n## Make a Top-Down Allocation First\n\n- [ ] Decide the percentage of investment to allocate to innovation, iteration, and operations before ranking individual projects.\n- [ ] Make the trade-offs explicit to executives and stakeholders.\n- [ ] Use the allocation to prevent loud stakeholders from dominating priorities.\n- [ ] Compare items only within the same category, rather than ranking unlike work against each other.\n- [ ] Revisit the allocation quarterly or when business context changes.\n\n## Pick an Allocation Based on Product Lifecycle\n\n- [ ] **Pre-alpha / idea**: Mostly innovation.\n- [ ] **Post-alpha / launch**: Further iteration to address early feedback.\n- [ ] **Beta / approaching product-market fit**: Heavy iteration to find PMF.\n- [ ] **Scaling after PMF**: More operation to support growth.\n- [ ] **Steady state / maintaining**: Balance operation with the next wave of innovation.\n\n## Prioritize Innovation Work\n\n- [ ] Identify the strategic milestone needed to realize the product vision.\n- [ ] Prioritize work that directly advances that milestone.\n- [ ] Avoid \"improvements\" that do not meaningfully move the product forward.\n- [ ] Involve engineering early to reduce future technical debt.\n- [ ] Decide whether the product is still on the growth curve or reaching a plateau.\n- [ ] Start planning the next innovation before the current product flattens.\n\n## Prioritize Iteration Work\n\n- [ ] Focus on incremental value for customers, the business, or both.\n- [ ] Use RICE or a similar scoring model.\n- [ ] Score each item for **Reach**, **Impact**, **Confidence**, and **Effort**.\n- [ ] Validate confidence using quantitative data, qualitative research, and competitive intelligence.\n- [ ] Review the output instead of accepting scores blindly.\n- [ ] Check for bias, weak strategic fit, stakeholder impact, and missed themes.\n\n## Prioritize Operation Work\n\n- [ ] Reserve a clear portion of roadmap capacity for operational work.\n- [ ] Include SLAs, privacy requirements, security needs, COGS, tooling, maintenance, technical debt, and bug fixes.\n- [ ] Stack-rank operational work separately from innovation and iteration.\n- [ ] Define how bugs will be handled: zero-tolerance, SLA-based, severity-based, or quality-threshold-based.\n- [ ] Document the operational prioritization process so stakeholders know what to expect.\n\n## Manage Stakeholder Requests\n\n- [ ] Create a clear intake process for one-off requests.\n- [ ] Require requesters to understand the cost of using roadmap capacity.\n- [ ] Say no to low-value requests that do not justify the investment.\n- [ ] Consider a capacity/token system for sales or customer-facing commitments.\n- [ ] Protect innovation and operational capacity from being consumed by reactive work.\n\n## Review Before Finalizing the Roadmap\n\n- [ ] Does the roadmap reflect the product vision?\n- [ ] Are innovation, iteration, and operation all represented appropriately?\n- [ ] Are trade-offs clear and defensible?\n- [ ] Are executives aligned on the allocation?\n- [ ] Are stakeholders clear on what will not be done?\n- [ ] Is there a documented prioritization method for each category?\n- [ ] Is the roadmap balanced for the current stage of the product?\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Allocate before you rank — how a roadmap stays balanced between vision, customers, and keeping the lights on, in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned product-minded executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. MILA: an energetic young product manager, dark hair in a ponytail, denim jacket over a striped shirt, carries a tablet covered in sticky notes.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Mila proudly shows Vera a roadmap board covered entirely in urgent red escalation tickets.](assets/images/balanced-roadmap/comic-01-all-escalations.jpeg)\n**Panel 1:** *The hook: a roadmap where everything is urgent — and everything is reactive.*\n\n![Vera points at a dusty vision card stuck in a 'next quarter' tray while Mila looks embarrassed.](assets/images/balanced-roadmap/comic-02-vision-never-scheduled.jpeg)\n**Panel 2:** *The problem: the vision is always 'next quarter' — which means never.*\n\n![Thought bubble of a PM on an ivory tower with a vision scroll while customers and a smoking server are ignored below.](assets/images/balanced-roadmap/comic-03-ivory-tower.jpeg)\n**Panel 3:** *The mirror failure: all vision and no iteration or operation is just as unbalanced.*\n\n![Vera draws three columns labeled innovation, iteration, and operation while Mila sorts roadmap cards into them.](assets/images/balanced-roadmap/comic-04-three-categories.jpeg)\n**Panel 4:** *The principle: classify everything — vision work, customer improvements, and keep-the-lights-on work each get their own column.*\n\n![Vera and Mila adjust sliders on a three-segment allocation bar above still-empty ranked lists.](assets/images/balanced-roadmap/comic-05-set-the-allocation.jpeg)\n**Panel 5:** *Allocate before you rank: the split is the real decision, and items compete only within their own slice.*\n\n![Mila calmly holds up an intake form to a shouting stakeholder with a giant request card while Vera nods.](assets/images/balanced-roadmap/comic-06-defending-the-split.jpeg)\n**Panel 6:** *Defending the split: the loud request gets a process and a fair fight inside its slice — not the whole roadmap.*\n\n![Vera and Mila view a balanced three-lane roadmap leading to milestone flags climbing toward a mountain-peak vision.](assets/images/balanced-roadmap/comic-07-roadmap-advances-journey.jpeg)\n**Panel 7:** *The payoff: a roadmap that serves today's customers and systems while still planting the next milestone flag.*\n\n![Portrait close-up of Vera holding her notebook with a small three-segment allocation bar, Mila smiling beside her.](assets/images/balanced-roadmap/comic-08-balance-is-the-strategy.jpeg)\n**Panel 8:** *The closer: the allocation is the strategy, made visible.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
