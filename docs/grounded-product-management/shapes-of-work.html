<script id="data" type="application/json">{"meta": {"id": "PM-SHAPES-OF-WORK", "status": "draft:gray", "title": "Shapes of Work", "date": "2026-08-14", "author": "Željko Obrenović", "permalink": "shapes-of-work", "timetoread": "7 min", "excerpt": "Product work defies single templates: any honest shape exercise surfaces 5–8 distinct shapes of work — different risk profiles, experiment-friendliness, sizes, and blast radii. I read shape off each piece of work instead of flattening everything into one scheme, and I apply the same discipline to org design: a 'stable' team's durability is a claim to be re-earned, not a default — because the only unwind of a hardened org chart is layoffs.", "tags": "product management, shapes of work, templates, launch tiers, stable teams, org design", "icon": "assets/icons/shapes-of-work.png", "logo": "assets/images/shapes-of-work/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["product management", "shapes of work", "templates", "launch tiers", "stable teams", "org design"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: Work has shapes — different risk profiles, experiment-friendliness, sizes, and blast radii — and any honest shape exercise surfaces five to eight of them, never one. I refuse to flatten initiatives into a single template or categorization scheme; I look at the thing itself, write about it explicitly, and let the differences that matter surface. I apply the same discipline to org design: a \"stable\" team's durability is a claim to be re-earned, not a default — because once hierarchy hardens around it, the only unwind is layoffs.\n\n## Statement\n\nMy operating model for shapes has four parts:\n\n- **Expect 5–8 shapes, never one.** Every shape exercise I have seen lands there. This is not pedantic categorization — it is the refusal to treat initiatives, epics, and bets as apples to apples.\n- **Separate blast radius from launch tier.** How disruptive work is internally and how loudly marketing announces it are independent axes. Some of the most internally demanding work must make no external sound at all.\n- **Read the thing, don't template it.** Look at the actual piece of work. Write about it. Be explicit. Let people raise the nuances and surface the differences that matter. The slide deck may come later; it is never the reality.\n- **Re-earn team durability.** Durable teams are my default for ownership and flow — but \"we'll always need that\" is a claim, not a fact. I sunset teams and reassign people while that is still cheap, before directors and GMs stack up on products that never really existed.\n\n## How to Read This\n\nThis record is grounded in John Cutler's \"20 Unfiltered Operating Takes\" (TBM 435), read through the same practitioner-executive lens as the rest of this journal. It is addressed to whoever owns a template, a launch-tier scheme, or a new-team request — the three places where the flattening instinct does its quiet damage. The working checklist, derived from the essay, lives in the **Checklist** tab.\n\n## Rationale\n\n**One scheme cannot carry two meanings.** The canonical example: most companies have launch tiers, defined by product marketing to describe the *marketing* nature of a launch. Then the tier gets reused as the *coordination* tier — and it breaks, because some work is incredibly disruptive internally, demands enormous coordination, and must produce zero external noise; sometimes it is critical that customers hear nothing. I call this shape the *silent earthquake*: internally seismic, externally mute, and invisible to any scheme with one axis.\n\nThat one small distinction — internal blast radius versus external launch demands — has confused company after company. And the failure mode has a voice: \"yeah, but we need to keep it simple,\" after which the too-simple scheme propagates upward to executives and becomes the lens everything is judged through.\n\n![Quadrant chart of external noise versus internal blast radius, with the silent-earthquake quadrant highlighted.](assets/images/shapes-of-work/two-axis-launch-map.jpeg)\n**Figure 1:** *Two axes, not one tier: the silent earthquake — internally seismic, externally mute — is exactly what a single scheme loses.*\n\n**Simplicity for the reader is complexity for the doer.** Categorization schemes are mostly built to make work legible to people who are not doing it. That is a legitimate need — I make the slide when it is needed — but every flattening deletes exactly the nuances that determine whether the work succeeds: this bet tolerates experiments, that one does not; this one is reversible, that one is not; this one disrupts three teams' roadmaps, that one none. The remedy is not heavier taxonomy; it is reading. Look at the thing. Write about it explicitly. Nothing needs analyzing to death — but the differences that really matter must be allowed to surface before anyone files the work under a label.\n\n![Six shape-profile cards with differently filled meters for risk, experiment-friendliness, size, and blast radius, above a discarded single template.](assets/images/shapes-of-work/shape-profile-cards.jpeg)\n**Figure 2:** *Read each piece of work and its profile emerges — five to eight shapes, no two with the same meters.*\n\n**Stable teams are the same flattening, applied to people.** The kingdom-building sequence is always rational at every step: money is plentiful, everyone is busy, a short-term project needs doing — so a \"new team\" is spun up. The capability gets rationalized as durable (\"we'll always need that\" — logic that is irrefutable precisely because it is untestable). Then a director. Then a GM. Three layers of hierarchy now stand on \"products\" that never really existed. When the correction comes, it arrives as layoffs that damage real lives — not because the people could not be reassigned (they could), but because the physics of org charts and how layoffs work force a blind unravel of yesterday's structure. Leaders will not say this outright; they gesture at \"bureaucracy\" and \"the work around the work.\" The reality is over-scaling that nobody re-examined while re-examining was still cheap.\n\n**Durability is useful exactly until it is not — so test it while testing is cheap.** None of this argues against durable teams; [Team Topology](team-topology.html) keeps them as my default, because ownership and flow compound. The argument is against durability by *default*. A team formed for a project should carry its sunset assumption openly. A hierarchy layer should follow proven product reality, not anticipate it. And knowing when a durable idea has stopped being useful is hard — which is a reason to schedule the question, not to skip it.\n\n![Branching diagram from a new team through a still-needed checkpoint: an early-reassignment sunset path versus a hierarchy-stacking path ending in a blind unwind.](assets/images/shapes-of-work/durability-fork.jpeg)\n**Figure 3:** *Schedule the durability question: the early fork costs a bridge; the late one costs the cliff.*\n\n## What This Means in Practice\n\n| What this principle says | What it does **not** say |\n| --- | --- |\n| Every substantial piece of work gets read and written about explicitly. | Everything is analyzed to death — light-touch for genuinely routine work. |\n| Launch tier and internal coordination tier are assessed separately. | Launch tiers are useless — marketing's scheme is fine for marketing. |\n| Expect 5–8 shapes; resist the single template. | Templates are banned — a template for one well-understood shape is fine. |\n| New teams carry explicit durability assumptions and sunset checks. | Teams are disposable — durable ownership remains the default where the product is real. |\n| Hierarchy follows proven products. | No structure ever grows — it grows behind the evidence, not ahead of it. |\n\n## Anti-Patterns\n\n- **The single template.** One brief format, one intake form, one process for work of every shape — differences that decide outcomes erased at intake.\n- **The borrowed tier.** Marketing's launch tier reused as the coordination tier, so the internally seismic, externally silent project gets tier-3 attention.\n- **\"We need to keep it simple.\"** The line that flattens a load-bearing distinction — and then hands the flattened scheme to executives as reality.\n- **The irrefutable capability.** \"We'll always need that\" — durability asserted in a form no evidence could ever falsify.\n- **Title stacking.** Director, then GM, layered onto a product that has not yet proven it exists.\n- **The blind unravel.** Restructuring by layoff logic rather than by re-reading which work and which capabilities are actually still needed.\n\n## Related Records\n\n- [Team Topology](team-topology.html) — the durable-team default this record disciplines with a sunset test; the two records are one position, not a contradiction.\n- [Staffing](staffing.html) — growing people and teams deliberately; the antidote to spinning up teams because money is plentiful and everyone is busy.\n- [Working Small](working-small.html) — the size ladder; shape here is about *kind*, not magnitude, and the two assessments happen together.\n- [Balanced Roadmap](balanced-roadmap.html) — where differently shaped work coexists without being forced into one scheme.\n- [Product Dysfunctions](dysfunctions.html) — the failure catalog this record extends with the flattening and kingdom-building patterns.\n\n## Scope and Revisiting\n\nThis principle governs how work gets classified for coordination and how team durability gets asserted and reviewed. I revisit it if explicit shape-reading proves too heavy below a certain work size — the fix would be a floor, not a template — and whenever I hear \"we'll always need that\" in a headcount conversation, which is this record's cue, not its refutation.\n\n## Authoritative References\n\n- John Cutler, \"TBM 435: 20 Unfiltered Operating Takes\", *The Beautiful Mess*, August 2026 — the source essay; this record distills its Shapes Of Work and Stable Teams? sections.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "3 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this principle — derived from John Cutler's \"20 Unfiltered Operating Takes\". The Article tab carries the rationale and anti-patterns.*\n\n## Run the Shape Exercise\n\n- [ ] The team has mapped its shapes of work — expect 5–8, be suspicious of fewer.\n- **For each shape, its profile is named:**\n  - [ ] Risk profile — what kind of failure is possible, and how reversible.\n  - [ ] Experiment-friendliness — does this work tolerate iteration and pivots?\n  - [ ] Size — where it sits on the [Working Small](working-small.html) estimation ladder.\n  - [ ] Blast radius — who and what it disrupts internally.\n- [ ] Shapes inform coordination and review; they are not a bureaucratic filing scheme.\n\n## Read the Thing\n\n- [ ] Each substantial initiative gets read and written about explicitly — not just filed under a label.\n- [ ] The people close to the work get to raise the nuances before categorization locks in.\n- [ ] Differences that really matter are surfaced in writing, not flattened for the deck.\n- [ ] Slide-deck summaries are produced when needed — and treated as views, not reality.\n- [ ] \"We need to keep it simple\" is challenged when it would erase a load-bearing distinction.\n\n## Tier Launches on Two Axes\n\n- [ ] External launch tier (marketing volume) and internal coordination tier (blast radius) are assessed separately.\n- [ ] Internally disruptive but externally silent work gets full coordination attention.\n- [ ] Deliberately quiet or secret launches are planned for confidentiality, not treated as low-effort.\n- [ ] Marketing's tiering scheme is used for marketing decisions only.\n\n## Review Team Durability\n\n- [ ] Every new team carries an explicit durability assumption: project-scoped or durable, and why.\n- [ ] Project-scoped teams have a named sunset condition from day one.\n- [ ] \"We'll always need that\" claims are tested against evidence, not accepted as irrefutable.\n- [ ] Hierarchy (directors, GMs) is added only after the product underneath has proven real.\n- [ ] Team durability is revisited on a schedule — while reassignment is still cheap.\n- [ ] Teams past their sunset condition are unwound by reassignment now, not deferred to a future restructuring.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Shapes of work — why one template flattens what matters, in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned product-minded executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. MILA: an energetic young product manager, dark hair in a ponytail, denim jacket over a striped shirt, carries a tablet covered in sticky notes.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Mila holds one template form in front of a shelf of wildly different shaped objects.](assets/images/shapes-of-work/comic-01-one-template.jpeg)\n**Panel 1:** *The hook: one template, many shapes — what could go wrong?*\n\n![Comic panel: Vera and Mila sort different objects into seven labeled zones on a table.](assets/images/shapes-of-work/comic-02-five-to-eight-shapes.jpeg)\n**Panel 2:** *The reality: work comes in 5–8 shapes — never apples to apples.*\n\n![Comic panel: a quiet storefront with a tiny launch megaphone while the building interior is a massive construction site.](assets/images/shapes-of-work/comic-03-silent-earthquake.jpeg)\n**Panel 3:** *The confusion: marketing's launch tier says 'quiet' — the internal blast radius says 'earthquake'.*\n\n![Comic panel: a rolling pin labeled Keep It Simple flattens varied shapes into identical pancakes on a slide tray.](assets/images/shapes-of-work/comic-04-keep-it-simple.jpeg)\n**Panel 4:** *The damage: 'keep it simple' flattens the distinction — then the flat version becomes the executive lens.*\n\n![Comic panel: Vera studies an odd object with a magnifying glass while Mila takes notes.](assets/images/shapes-of-work/comic-05-read-the-thing.jpeg)\n**Panel 5:** *The remedy: read the thing, write about it, let the differences surface.*\n\n![Comic panel: tent, house, and castle stacked over a tiny cloud with a question mark labeled product.](assets/images/shapes-of-work/comic-06-kingdom-building.jpeg)\n**Panel 6:** *The dark side: money was plentiful, everyone was busy — and a kingdom grew on a question mark.*\n\n![Comic panel: a blindfolded figure cuts random ropes in a tangled org chart while small figures dangle.](assets/images/shapes-of-work/comic-07-the-blind-unravel.jpeg)\n**Panel 7:** *The bill: once the chart hardens, the only unwind is blind — and it lands on people.*\n\n![Comic panel: a team tent with a sunset flag as members cross a bridge to another camp.](assets/images/shapes-of-work/comic-08-sunset-flag.jpeg)\n**Panel 8:** *The closer: durability re-earned on schedule — and people move while moving is cheap.*\n"}]}]}</script>

    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
