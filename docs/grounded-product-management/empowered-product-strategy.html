<script id="data" type="application/json">{"meta": {"id": "PM-EMPOWERED-PRODUCT-STRATEGY", "status": "draft:gray", "title": "EMPOWERED Product Strategy", "date": "2026-07-27", "author": "Željko Obrenović", "permalink": "empowered-product-strategy", "timetoread": "8 min", "excerpt": "I run product strategy as a loop of focus, insight, and action. I choose the few problems that truly matter — and say out loud what will not be prioritized — then do the hard work of generating real insights from data, customers, technology, and the market. I convert those insights into team objectives, not task lists, and I manage progress actively without ever telling an empowered team how to solve its problem.", "tags": "product management, product strategy, focus, insights, empowered teams", "icon": "assets/icons/empowered-product-strategy.png", "logo": "assets/images/empowered-product-strategy/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["product management", "product strategy", "focus", "insights", "empowered teams"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: I run product strategy as focus, insight, and action: I choose the few problems that truly matter to the business — and make explicit what will not be prioritized — I do the hard work of generating real insights from data, customers, enabling technologies, and the industry, and I convert those insights into team objectives: problems to solve with expected outcomes, not features to ship. Then I get out of the way — managing progress actively, removing obstacles quickly, and never slipping into command-and-control.\n\n## Statement\n\nMy operating model for product strategy has four parts:\n\n- **Establish the context first.** Before any strategy work, the company's mission, objectives, and scorecard are clear; the product vision and principles are confirmed; team topology and ownership are settled. Strategy without context is guessing.\n- **Focus on the vital few.** A real strategy is a set of explicit choices: the few critical problems the business most needs to solve, and — just as explicitly — what will *not* be prioritized. It is the approach for achieving the goal, not a roadmap, a feature list, or a pile of tactics.\n- **Generate insights before choosing solutions.** I study product and business data — acquisition, retention, funnel, sales patterns — run regular user research for both evaluative and generative insights, explore enabling technologies, and track industry and competitive trends. Then I make sure those insights travel: aggregated regularly, shared with leaders and peers, connected across teams, and never left isolated where they were found.\n- **Turn insights into action — and manage actively.** Key insights become team objectives: problems to solve with expected business or customer outcomes, constraints, and context — not prescribed solutions. I review progress weekly or biweekly, surface blockers early, remove obstacles quickly, and stay adaptive when strategy meets reality.\n\n![Funnel with many candidate problem cards entering at the top and only three chosen priorities emerging at the bottom, the rest set aside in a tray labeled not now.](assets/images/empowered-product-strategy/focus-funnel.jpeg)\n**Figure 1:** *Strategy as narrowing: many candidate problems in, the vital few out — and an explicit 'not now' for everything else.*\n\n## How to Read This\n\nThis journal is the **product-management counterpart** to my engineering-executive journal: the same first-person operating principles, applied to how product management should work. This record belongs to the journal's EMPOWERED section and is grounded in Marty Cagan and Chris Jones's *EMPOWERED* — read here through a practitioner-executive lens: what I actually do, not a book summary.\n\nIt has a deliberate boundary with [Product Strategy](product-strategy.html), its Build-What-Matters sibling. Foster and Nerlikar treat strategy as the **bridge from vision to roadmap** — how a validated vision becomes a sequenced plan. Cagan treats it as a **focus–insight–action loop** that ends in team objectives, not a plan. The two lenses are complementary, which is why there are two records rather than one. The working checklist — all ten sections — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**A list of priorities is not a strategy.** The most common failure I see is a \"strategy\" document with fifteen or twenty top priorities. Twenty top priorities means none: teams spread thin, attention diffused, and every quarter producing activity instead of outcomes. A real strategy reflects choice, thinking, and effort — it names the few critical problems, and it names what will be left undone. If nothing was hard to leave out, no strategy was made.\n\n**Strategy is not the roadmap.** Roadmaps, features, and tactics are outputs that may eventually follow from a strategy; they are not the strategy itself. The strategy is the approach for achieving the goal. When I confuse the two, I end up defending a list of features instead of an argument about where the business is won or lost.\n\n**Insights are earned, not found.** Real insights rarely arrive from a dashboard alone. I have to study the data — acquisition, retention, funnel, and sales patterns — but also sit with customers regularly, looking for both evaluative insights (is this working?) and generative ones (what problem did we not know they had?). I explore enabling technologies that could unlock solutions that were impossible last year, and I track industry, competitive, and adjacent-market trends. And because insight favors the prepared mind, I invest in enough context that an important insight is recognizable when it appears.\n\n![Four streams labeled data, customers, technology, and industry converging into a lightbulb that feeds a single strategy document.](assets/images/empowered-product-strategy/insight-sources.jpeg)\n**Figure 2:** *Insight sources converging: data, customers, enabling technology, and industry trends — not a dashboard alone.*\n\n**Insights that stay local die local.** A team that learns something important and keeps it has wasted most of its value. I aggregate learnings from teams regularly, share the most important insights with leaders and peers, connect related learnings across teams, and make sure insights reach the people actually making strategic decisions. The organization's insight advantage is a function of how fast learning travels, not just how much learning happens.\n\n**Action means objectives, not orders.** Converting insight into action is where empowerment is won or lost. Teams get problems to solve — with expected business or customer outcomes, constraints, and context — not features to ship. OKRs or any similar method earn their keep only if they support empowered teams; the mechanism is secondary. The test I apply: are teams acting like owners, or like order-takers? If a team cannot explain why its objective matters, I have handed out an order with an objective's formatting.\n\n![Flow from an insight lightbulb to a problem-and-outcome objective card to a team choosing among several solution paths, with a prescriptive task list crossed out below.](assets/images/empowered-product-strategy/insight-to-action.jpeg)\n**Figure 3:** *Insight to action: objectives arrive as problems with expected outcomes — the solution path belongs to the team.*\n\n**Active management is not micromanagement — and neither is absence.** Empowering teams does not mean disappearing. I hold regular 1:1s and coaching sessions with product leaders, review progress weekly or biweekly, surface blockers, dependencies, and risks early, remove obstacles quickly, and help teams make stakeholder decisions when needed. What I do not do is prescribe solutions. The line is clear: I manage the *progress* and the *context* intensively; I never manage the *how*.\n\n**Strategy meets reality — plan for it.** Every strategy collides with missed dependencies, missing capabilities, and urgent issues. I expect that, reassess priorities when reality changes, and stay open to a vision pivot when a genuinely larger opportunity appears. But I do not abandon the vision merely because execution got hard — most \"strategy failures\" I have seen were actually stamina failures.\n\n## What This Means in Practice\n\n| What this principle says | What it does **not** say |\n| --- | --- |\n| Choose the few critical problems; name what will not be done. | Everything else is unimportant — its turn is deferred, not denied. |\n| Strategy is the approach for achieving the goal. | Strategy is a roadmap, feature list, or backlog. |\n| Insights come from data, customers, technology, and the industry. | Opinions and dashboards alone are enough to bet on. |\n| Teams get problems to solve with expected outcomes. | Teams get feature lists with deadlines and a solution attached. |\n| I review progress weekly and remove obstacles fast. | Empowerment means leaders step away until the demo. |\n| Reassess when reality changes; pivot for larger opportunities. | Abandon the vision the first time execution gets hard. |\n\nConcretely: strategy conversations in my organization start with \"which few problems, and what are we explicitly not doing?\" — not with a roadmap review. Objectives are written as problems with expected outcomes, and I ask teams to explain why their objective matters before they start. My weekly rhythm covers progress, blockers, and dependencies — never solution design.\n\n## Anti-Patterns\n\n- **The twenty-priority strategy.** A priority list long enough to offend no one, focusing no one.\n- **The roadmap in a strategy costume.** A sequenced feature list presented as strategy — output without choice.\n- **Opinion-driven bets.** Choosing problems by seniority of the loudest voice instead of earned insight.\n- **Dashboard-only insight.** Mistaking metrics monitoring for user research, technology exploration, and market awareness.\n- **Insights trapped in one team.** Learning that never reaches the people making strategic decisions.\n- **Objectives as task lists.** Problems-to-solve rewritten into features-to-ship the moment planning pressure arrives.\n- **Stakeholder-driven feature overload.** Serving the business by accepting every request, instead of serving customers in ways that work for the business.\n- **Management by absence.** Calling it empowerment when it is actually neglect — no progress reviews, no obstacle removal, no help with stakeholder decisions.\n- **The premature pivot.** Abandoning the vision because execution met its first real obstacle.\n\n## Related Records\n\n- [Product Strategy](product-strategy.html) — the Build-What-Matters sibling: vision-to-roadmap bridge; this record is the focus–insight–action loop.\n- [Team Objectives](team-objectives.html) — where the converted insights land; that record covers how objectives are assigned and pursued.\n- [Product Vision and Principles](product-vision-and-principles.html) — the strategic context this record assumes before any strategy work starts.\n- [Engineering Strategy](../grounded-engineering-executive/engineering-strategy.html) — the engineering-executive counterpart; the two strategies must name the same few problems.\n\n## Scope and Revisiting\n\nThis principle governs how I set product strategy and how I manage the teams executing it. I revisit it at every planning cycle, whenever the count of \"top priorities\" starts creeping upward, and whenever I catch an objective that is really a feature order in disguise. The final health check in the Checklist tab is the standing test: few real priorities, insights over opinions, problems over backlog items, active management, measurable outcomes — a strategy that reflects choice, thinking, and effort.\n\n## Authoritative References\n\n- Marty Cagan with Chris Jones, *EMPOWERED: Ordinary People, Extraordinary Products* (Wiley, 2020) — the product-strategy chapters this record's checklist distills.\n- Much of the book's thinking began as freely available essays by the authors at [svpg.com](https://www.svpg.com/), where the underlying material can still be read.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "4 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this principle. The Article tab carries the rationale, implications, and anti-patterns.*\n\n## Establish Strategic Context\n\n- [ ] Clarify the company's mission, objectives, and scorecard.\n- [ ] Define or confirm product vision and principles.\n- [ ] Ensure teams understand the broader business context.\n- [ ] Confirm that team topology and ownership are clear.\n\n## Create a Real Product Strategy\n\n- [ ] Define the few critical problems the business most needs to solve.\n- [ ] Make explicit choices about what matters most.\n- [ ] Identify what will **not** be prioritized.\n- [ ] Avoid confusing strategy with roadmaps, features, or tactics.\n- [ ] Frame strategy as the approach for achieving the goal.\n\n## Focus on the Vital Few\n\n- [ ] Reduce the number of active top priorities.\n- [ ] Limit major initiatives to a manageable number.\n- [ ] Check whether teams are spread too thin.\n- [ ] Ensure attention is concentrated on the highest-impact problems.\n- [ ] Revisit whether the current work is creating outcomes or just activity.\n\n## Generate Insights Before Choosing Solutions\n\n- [ ] Study product and business data.\n- [ ] Analyze acquisition, retention, funnel, and sales patterns.\n- [ ] Conduct regular user research.\n- [ ] Look for both evaluative and generative insights.\n- [ ] Explore enabling technologies that could unlock new solutions.\n- [ ] Track industry, competitive, and adjacent-market trends.\n- [ ] Gather insights from multiple sources, not just dashboards.\n- [ ] Prepare enough context so that important insights are recognizable.\n\n## Share Insights Across the Organization\n\n- [ ] Aggregate learnings from teams regularly.\n- [ ] Share the most important insights with leaders and peers.\n- [ ] Ensure insights reach the people making strategic decisions.\n- [ ] Connect related learnings across teams.\n- [ ] Avoid letting insights remain isolated within one team.\n\n## Turn Insights into Action\n\n- [ ] Convert key insights into clear team objectives.\n- [ ] Give teams problems to solve, not just features to ship.\n- [ ] Define expected business or customer outcomes.\n- [ ] Use OKRs or similar methods only if they support empowered teams.\n- [ ] Provide constraints and context without prescribing every solution.\n- [ ] Check whether teams are acting like owners, not order-takers.\n\n## Support Empowered Product Teams\n\n- [ ] Confirm each team understands the objective and why it matters.\n- [ ] Give teams room to discover and deliver the best solution.\n- [ ] Ensure teams have the right skills, people, and access.\n- [ ] Avoid stakeholder-driven feature overload.\n- [ ] Distinguish between serving the business and serving customers in ways that work for the business.\n\n## Practice Active Management\n\n- [ ] Hold regular 1:1s or coaching sessions with product leaders.\n- [ ] Review progress weekly or biweekly.\n- [ ] Surface blockers, dependencies, and risks early.\n- [ ] Remove obstacles and barriers quickly.\n- [ ] Help teams make stakeholder decisions when needed.\n- [ ] Provide help without slipping into command-and-control.\n- [ ] Track whether teams are actually moving objectives forward.\n\n## Stay Adaptive\n\n- [ ] Expect strategy to meet real-world obstacles.\n- [ ] Watch for missed dependencies, missing capabilities, or urgent issues.\n- [ ] Reassess priorities when reality changes.\n- [ ] Be open to vision pivots when a larger opportunity becomes clear.\n- [ ] Do not abandon the vision too quickly just because execution is hard.\n\n## Final Health Check\n\n- [ ] We have a small number of truly important priorities.\n- [ ] We are using insights, not opinions alone.\n- [ ] Teams are solving problems, not just delivering backlog items.\n- [ ] Leadership is actively managing progress and removing impediments.\n- [ ] Work is aligned to measurable outcomes.\n- [ ] Our strategy reflects choice, thinking, and effort.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Focus, insight, action — product strategy the EMPOWERED way, in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned product-minded executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. MILA: an energetic young product manager, dark hair in a ponytail, denim jacket over a striped shirt, carries a tablet covered in sticky notes.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Mila unrolls a scroll of twenty priorities that runs off the panel while Vera raises an eyebrow.](assets/images/empowered-product-strategy/comic-01-twenty-priorities.jpeg)\n**Panel 1:** *The hook: twenty priorities, zero strategy.*\n\n![Comic panel: tiny stretched teams pulled between many floating priority cards while a wall outcome dial reads zero.](assets/images/empowered-product-strategy/comic-02-spread-thin.jpeg)\n**Panel 2:** *The problem: twenty priorities means teams spread too thin for any outcome.*\n\n![Comic panel: Vera sweeps most priority cards into a drawer labeled NOT NOW, leaving three spotlit cards while Mila watches.](assets/images/empowered-product-strategy/comic-03-vital-few.jpeg)\n**Panel 3:** *The principle: the vital few — and an explicit, spoken no to the rest.*\n\n![Comic panel: Mila mines a rock face with seams labeled data, users, technology, and market, revealing a glowing gem.](assets/images/empowered-product-strategy/comic-04-dig-for-insights.jpeg)\n**Panel 4:** *Insights before solutions: dug from data, users, technology, and the market.*\n\n![Comic panel: Vera pins a glowing gem to a shared board of connected learnings as team members link threads.](assets/images/empowered-product-strategy/comic-05-share-the-map.jpeg)\n**Panel 5:** *Share the insight, connect the learnings — strategy is a team sport.*\n\n![Comic panel: Vera hands a team a mountain-and-dial objective card while a shredder eats an old feature instruction scroll.](assets/images/empowered-product-strategy/comic-06-problems-not-features.jpeg)\n**Panel 6:** *Insight into action: problems to solve, not features to ship.*\n\n![Comic panel: a team holding its own map climbs toward a summit while Vera clears a boulder from their path.](assets/images/empowered-product-strategy/comic-07-active-not-command.jpeg)\n**Panel 7:** *Active management: clear the obstacles, never grab the map.*\n\n![Comic panel: close-up of Vera's notebook page with three taped priority cards and an arrow from a gem to a summit.](assets/images/empowered-product-strategy/comic-08-strategy-is-choice.jpeg)\n**Panel 8:** *The closer: choice, thinking, and effort — that is the strategy.*\n"}]}]}</script>

    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);

        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing

            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
