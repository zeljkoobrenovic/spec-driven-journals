<script id="data" type="application/json">{"meta": {"id": "PM-COACHING", "status": "draft:gray", "title": "Coaching", "date": "2026-07-27", "author": "Željko Obrenović", "permalink": "coaching", "timetoread": "8 min", "excerpt": "I treat coaching as the first job of every product leader, including me. Ordinary people become extraordinary teams when someone develops them deliberately — with an honest skills assessment, a written coaching plan, and a weekly 1:1 spent on development rather than status. I coach for ownership of outcomes, not dependency on me, and I judge my own success by the growth of my people.", "tags": "product management, coaching, product leadership, development, one-on-ones", "icon": "assets/icons/coaching.png", "logo": "assets/images/coaching/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["product management", "coaching", "product leadership", "development", "one-on-ones"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: I treat coaching as the first job of every product leader, including me: ordinary people become extraordinary teams when someone invests in them deliberately. That investment has a fixed shape — an honest assessment of each person's capability against the role, a written coaching plan for the top three gaps, and a weekly 1:1 that develops the person rather than collecting status. I coach for ownership of outcomes, not dependency on me, and I judge my own success by the growth of my people.\n\n## Statement\n\nMy operating model for coaching has five parts:\n\n- **Coaching is job #1.** Developing people is the first responsibility of a product leader, ahead of roadmaps, reviews, and my own deliverables. Every person in my product organization has an explicit coach, and I judge my success by the growth of my people.\n- **Assess before you coach.** For each person I rate role expectations against current capability, skill area by skill area, identify the biggest gaps, and focus on the top 3 first. I reassess periodically — the assessment guides coaching; it never replaces it.\n- **Write the coaching plan.** Priority gaps get a written plan: concrete learning actions, stretch opportunities matched to readiness, and development of strengths, not only repair of weaknesses. Progress is reviewed weekly.\n- **The weekly 1:1 is development time.** I hold 1:1s at least weekly, protect them from casual cancellation, listen more than I talk, and use them primarily for development — sharing context, discussing growth, and giving specific, timely feedback — not for status.\n- **Teach context, coach for ownership.** I make the strategic context explicit — mission, scorecard, objectives, product vision and principles, team topology, product strategy — and coach people to think like owners: outcomes over outputs, obstacles owned rather than reported.\n\n![Circular loop with four stages: skills assessment clipboard, written coaching plan, weekly one-on-one conversation, and visible growth, with an arrow returning from growth to assessment.](assets/images/coaching/coaching-loop.jpeg)\n**Figure 1:** *The coaching loop: assess honestly, write the plan, work it in the weekly 1:1, and reassess as the person grows.*\n\n## How to Read This\n\nThis journal is the product-management counterpart to my engineering-executive journal — the same first-person record shape, applied to how product organizations should work. This record is grounded in Marty Cagan and Chris Jones's *EMPOWERED: Ordinary People, Extraordinary Products*, read through a practitioner-executive lens: the book speaks to the manager coaching product managers; I read it as the operating standard I hold every product leader in my organization to, starting with myself. If you report to me, this record explains why your 1:1 is about you and not about your Jira board. The working checklist — all sixty-one sections of it — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**Extraordinary teams are developed, not found.** The title of the book is the argument: ordinary people, extraordinary products. Strong product organizations are not assembled from rare pre-formed talent; they are grown from capable people whom someone took the time to develop. Throwing a new product manager into the deep end and calling it empowerment is not respect — it is abdication. Empowerment without coaching is just neglect with better branding.\n\n**Assessment turns coaching from vibes into a plan.** Without an honest assessment, coaching degenerates into generic advice. So I rate each person's current capability against what the role expects — product knowledge, process and execution skill, people skills — and let the gaps set the agenda. The top 3 gaps get the attention first; the assessment is redone periodically so the plan tracks the person, not my first impression. The point of the exercise is to guide development, never to substitute for it.\n\n**The 1:1 is the delivery mechanism.** A coaching plan that never meets a calendar is a wish. The weekly 1:1 is where the plan becomes real: protected from casual cancellation, used primarily for development rather than status, with me listening more than talking. It is where I share context and expectations, discuss progress on development, give specific and timely feedback, and help the person connect dots across teams and issues. When 1:1s decay into status meetings, coaching has stopped — whatever the calendar says.\n\n![Split illustration contrasting a one-on-one used for status reporting behind stacked reports with a one-on-one used for development around a shared growth sketch.](assets/images/coaching/one-on-one-two-ways.jpeg)\n**Figure 2:** *Same slot, opposite meetings: the 1:1 as status theater versus the 1:1 as development time.*\n\n**Context is what makes empowerment possible.** I cannot delegate decisions to someone who lacks the context to make them. So I teach the strategic context explicitly and check it took: the company mission, the scorecard of business health metrics, the current objectives, the product vision and principles, the team topology, and the product strategy. A product manager who can explain how their team's objectives ladder up to company goals can be trusted with real decisions; one who cannot will be micromanaged by circumstance even if I never intervene. For the biggest decisions I reach for the strongest coaching tool I have: the written narrative, which exposes weak logic and missing evidence faster than any slide deck.\n\n**Ownership is the endgame.** The purpose of all of this is not to make people better at following my direction — it is to make my direction unnecessary. I coach people to think like owners rather than employees: responsible for outcomes, not just activity; bringing context and proposals, not waiting to be told; taking responsibility when things go wrong and giving credit when they go well. Coaching that creates dependency on the coach has failed at its own job.\n\n![Diverging trajectories of one person: a flat sink-or-swim path through choppy water below, and a rising coached path with a coach appearing at intervals, ending in confident ownership.](assets/images/coaching/sink-or-swim-vs-coached.jpeg)\n**Figure 3:** *Ordinary to extraordinary is a coached trajectory — the sink-or-swim path stays flat.*\n\n## What This Means in Practice\n\n| What this principle says | What it does **not** say |\n| --- | --- |\n| Developing people is job #1 for every product leader. | Product leaders stop doing product work — coaching is the multiplier on it, not the replacement. |\n| Assess honestly and focus on the top 3 gaps first. | The assessment is a verdict — it is a development tool, redone as the person grows. |\n| The weekly 1:1 is protected development time. | Status has no home — it moves to async channels, not into the 1:1. |\n| Teach the strategic context until people can use it. | Context is a one-time onboarding lecture — it is revisited regularly. |\n| Coach strengths as well as weaknesses. | Coaching is remedial — the best people deserve the most deliberate development. |\n| Coach for ownership of outcomes. | Coaching means being needed — dependency on the coach is the failure mode. |\n\nConcretely: every product person in my organization knows who their coach is. Every coach maintains a current assessment and a written plan for each report, and can show me both. My own weekly self-audit asks the same questions I ask of my leaders: did I spend real time coaching this week, do my people know I care about their development, and am I fostering ownership rather than dependence?\n\n## Anti-Patterns\n\n- **Coaching as leftover work.** Development happens only when the roadmap allows — which is never. Coaching treated as secondary work is coaching abandoned.\n- **The status-meeting 1:1.** Weekly slots faithfully held, entirely consumed by project updates. The calendar shows coaching; the person gets none.\n- **The monologue coach.** The manager talks more than listens, prescribes before diagnosing, and calls it mentorship.\n- **Feedback saved for the review.** Problems noted in March, revealed in December. Delayed feedback is a decision to let someone fail slowly.\n- **Empowerment as absence.** No assessment, no plan, no context — just \"I trust you\" and a quarterly check on the numbers. Sink-or-swim with better branding.\n- **Micromanagement as coaching.** Task control dressed up as development; the opposite failure with the same result — no ownership.\n- **Tolerating weak performance too long.** Avoiding the difficult conversation is not kindness; it steals the time the person needed to improve.\n\n## Related Records\n\n- [Staffing](staffing.html) — how the people arrive; this record covers what I owe them once they are here.\n- [The Right Team](right-team.html) — the empowered product team this coaching is meant to produce.\n- [Calibrating Your Standards](../grounded-engineering-executive/calibrating-your-standards.html) — the engineering-journal record on what \"good\" looks like; coaching is how people reach a bar, calibration is how I keep the bar honest.\n- [Inspected Trust](../grounded-engineering-executive/inspected-trust.html) — the engineering-journal record on trust with verification; the coaching 1:1 is where inspection stays supportive rather than suspicious.\n\n## Scope and Revisiting\n\nThis principle governs how I and every product leader reporting to me develop the people in our product organization: assessments, coaching plans, 1:1s, and the strategic context we are obliged to teach. I revisit it whenever a leader's span of responsibility changes, whenever an assessment cycle shows gaps not closing, and whenever my own weekly self-audit answers \"no\" two weeks running.\n\n## Authoritative References\n\n- Marty Cagan with Chris Jones, *EMPOWERED: Ordinary People, Extraordinary Products* (Wiley, 2020) — the coaching chapters this record's checklist distills.\n- Many of the book's ideas began as freely available essays by the authors at [svpg.com](https://www.svpg.com), where the underlying material can still be read.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "12 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this principle. The Article tab carries the rationale, implications, and anti-patterns.*\n\n## 1. Coaching mindset\n\n- [ ] Treat developing people as job #1\n- [ ] Judge your success by the growth of your people\n- [ ] Focus on empowerment, not task control\n- [ ] Create ownership of outcomes, not dependency on you\n- [ ] Remove impediments, clarify context, and coach judgment\n- [ ] Watch for insecurity, ego, or need for recognition\n- [ ] Encourage diverse viewpoints and constructive disagreement\n- [ ] Build trust intentionally and continuously\n- [ ] Praise publicly and criticize privately\n- [ ] Address mistakes directly and promptly\n- [ ] Ensure every person has an explicit coach\n\n## 2. Skills assessment\n\n- [ ] Assess each person's current capability vs. role expectations\n- [ ] Rate both expectations and current capability by skill area\n- [ ] Identify the biggest gaps\n- [ ] Focus on the top 3 gaps first\n- [ ] Reassess periodically\n- [ ] Use assessment to guide development, not replace coaching\n\n## 3. Product knowledge coaching\n\n- [ ] Build user and customer knowledge\n- [ ] Build data fluency\n- [ ] Build industry and domain knowledge\n- [ ] Build business and company knowledge\n- [ ] Build product operational knowledge\n- [ ] Expect the person to become deeply credible in the product\n\n## 4. Process and execution coaching\n\n- [ ] Teach discovery methods\n- [ ] Teach optimization methods\n- [ ] Teach delivery methods and tradeoffs\n- [ ] Teach the product development process in your company\n- [ ] Teach risk framing: value, usability, feasibility, viability\n- [ ] Ensure they understand their role in discovery and delivery\n\n## 5. People skills coaching\n\n- [ ] Coach team collaboration\n- [ ] Coach stakeholder collaboration\n- [ ] Coach product evangelism and communication\n- [ ] Coach leadership and influence\n- [ ] Observe real interactions and coach from them\n- [ ] Reinforce trust, respect, and mutual accountability\n\n## 6. Coaching plan\n\n- [ ] Create a written coaching plan for priority gaps\n- [ ] Define learning actions: reading, coaching, training, exercises, exposure\n- [ ] Give stretch opportunities matched to readiness\n- [ ] Develop strengths, not only weaknesses\n- [ ] Connect development to future growth and promotion\n- [ ] Review progress weekly\n\n## 7. Run strong 1:1s\n\n- [ ] Hold 1:1s at least weekly\n- [ ] Protect the meeting from casual cancellation\n- [ ] Use it primarily for development, not status\n- [ ] Listen more than you talk\n- [ ] Build trust and candor\n- [ ] Share context and expectations\n- [ ] Discuss progress on learning and development\n- [ ] Give specific, timely, constructive feedback\n- [ ] Help the person think and act like a strong product leader\n- [ ] Use the 1:1 to connect dots across teams and issues\n\n## 8. Use stronger coaching tools\n\n- [ ] Use written narratives for major decisions\n- [ ] Require clear thinking before presentations\n- [ ] Use writing to expose weak logic and missing evidence\n- [ ] Review the narrative and FAQ together\n- [ ] Coach for clarity, logic, and persuasiveness\n\n## Strategic context\n\n### 9. Teach strategic context explicitly\n\n- [ ] Make strategic context part of onboarding\n- [ ] Ensure every PM understands the broader business context\n- [ ] Revisit context regularly, not only once\n- [ ] Verify the person can explain how their team contributes to company goals\n\n### 10. Ensure understanding of the six strategic context elements\n\n- [ ] Company mission\n- [ ] Company scorecard/health metrics / KPIs\n- [ ] Company objectives\n- [ ] Product vision\n- [ ] Product principles\n- [ ] Team topology\n- [ ] Product strategy\n\n### 11. Company mission\n\n- [ ] Ensure the person knows why the company exists\n- [ ] Ensure they can connect their work to the mission\n- [ ] Check whether they use the mission in judgment and prioritization\n\n### 12. Company scorecard\n\n- [ ] Teach the key business health metrics\n- [ ] Ensure they understand what healthy vs. unhealthy looks like\n- [ ] Ensure they understand key funnels and business dynamics\n- [ ] Confirm they know which metrics matter most\n\n### 13. Company objectives\n\n- [ ] Teach the current company objectives\n- [ ] Emphasize that objectives are outcomes, not outputs\n- [ ] Connect key results back to the company scorecard\n- [ ] Ensure the person can explain how the team objectives ladder up\n\n### 14. Product vision and principles\n\n- [ ] Ensure the PM understands the future the company is trying to create\n- [ ] Ensure they understand why that future matters to customers\n- [ ] Teach the product principles that guide tradeoffs\n- [ ] Check whether they actually use those principles in decisions\n\n### 15. Team topology and product strategy\n\n- [ ] Ensure the PM understands what each team is responsible for\n- [ ] Clarify where their team sits in the bigger picture\n- [ ] Teach the product strategy that connects company goals to team objectives\n- [ ] Check that the PM can explain why their objectives matter\n\n## Ownership mindset\n\n### 16. Coach's sense of ownership\n\n- [ ] Coach thinking like an owner, not an employee\n- [ ] Emphasize responsibility for outcomes, not just activity\n- [ ] Reinforce that customers care about results, not effort\n- [ ] Teach the PM to own obstacles, not just report them\n- [ ] Expect them to bring context, not wait to be told what to do\n- [ ] Reinforce taking responsibility when things go wrong\n- [ ] Reinforce giving credit when things go well\n\n### 17. Coach outcome orientation\n\n- [ ] Ask whether the PM is solving for output or outcome\n- [ ] Evaluate performance by business and customer results\n- [ ] Reinforce that ownership includes cross-functional relationships\n- [ ] Coach the PM to act with long-term company value in mind\n\n## Managing time\n\n### 18. Protect time for real product work\n\n- [ ] Ensure the PM has substantial time for discovery and problem-solving\n- [ ] Help them identify where their time is currently going\n- [ ] Distinguish product management work from project management work\n- [ ] Block recurring time for deep product work\n- [ ] Protect that time from routine meeting sprawl\n- [ ] Reduce unnecessary coordination work where possible\n- [ ] Consider delivery/project support if PM time is being consumed\n- [ ] Coach the PM to spend time ensuring what gets built is worth building\n\n### 19. Diagnose time misuse\n\n- [ ] Check whether the PM is overspending time on project tracking\n- [ ] Check whether they are choosing tangible admin work over ambiguous product work\n- [ ] Check whether the calendar makes quality thinking impossible\n- [ ] Address time management as an explicit coaching topic\n\n## Thinking and judgment\n\n### 20. Coach thinking, not just knowledge\n\n- [ ] Distinguish intelligence from actual thinking\n- [ ] Distinguish acquiring knowledge from applying knowledge\n- [ ] Expect the PM to think through problems before escalating\n- [ ] Teach structured problem solving\n- [ ] Check how the PM responds when they do not know the answer\n- [ ] Coach them to reason through value, usability, feasibility, and viability together\n- [ ] Use writing and discussion to build critical thinking\n- [ ] Reinforce that product work is fundamentally problem-solving\n\n## Team collaboration\n\n### 21. Coach true collaboration\n\n- [ ] Define collaboration as solving problems together\n- [ ] Clarify that collaboration is not consensus for its own sake\n- [ ] Clarify that collaboration is not artifact production\n- [ ] Clarify that collaboration is not a compromise that produces mediocre outcomes\n- [ ] Reinforce that collaboration aims at solutions that are valuable, usable, feasible, and viable\n\n### 22. Strengthen cross-functional collaboration\n\n- [ ] Build true collaboration between PM, design, and engineering\n- [ ] Encourage teams to work around prototypes and shared problem exploration\n- [ ] Ensure each discipline brings its expertise rather than deferring blindly\n- [ ] Reinforce that no one should try to do the other person's job\n- [ ] Expect each person to come prepared, having done the homework\n- [ ] Watch for arrogance or premature certainty from the PM\n- [ ] Watch for the PM reverting to requirement handoff behavior\n- [ ] Coach collaboration with customers and prospects when appropriate\n\n### 23. Diagnose collaboration failures\n\n- [ ] Check whether the PM has done the business and customer homework\n- [ ] Check whether arrogance is suppressing team contribution\n- [ ] Check whether artifacts are replacing collaborative work\n- [ ] Check whether the team is discussing solutions together early enough\n\n## Stakeholder collaboration\n\n### 24. Reframe stakeholder relationships\n\n- [ ] Teach that stakeholders are partners, not obstacles\n- [ ] Teach that the PM is not there merely to gather requirements\n- [ ] Teach that the PM is not there to dictate solutions to stakeholders\n- [ ] Ensure the PM understands each stakeholder's role and constraints\n- [ ] Teach how stakeholder input contributes to business viability\n\n### 25. Build trust with stakeholders\n\n- [ ] Identify the critical stakeholder relationships for each PM\n- [ ] Encourage relationship-building before moments of conflict\n- [ ] Encourage regular 1:1 relationship time with key stakeholders\n- [ ] Build rapport, not just transactional contact\n- [ ] Help the PM learn how to navigate different personalities\n- [ ] Reinforce that mutual trust makes disagreement productive\n\n### 26. Coach executive collaboration\n\n- [ ] Ensure the PM has done enough homework to talk credibly with executives\n- [ ] Coach careful listening to executive concerns and constraints\n- [ ] Teach the PM to bring solutions, not just problems\n- [ ] Prepare the PM for increasingly broad executive expectations\n\n## Imposter syndrome and preparedness\n\n### 27. Coach preparedness, not performative confidence\n\n- [ ] Normalize doubt as a signal to prepare better\n- [ ] Teach the PM to use anxiety as a trigger for homework and rehearsal\n- [ ] Require preparation for important presentations and reviews\n- [ ] Insist on draft reviews and honest feedback before high-stakes meetings\n- [ ] Provide progressive exposure for nervous presenters\n- [ ] Encourage training and rehearsal where needed\n- [ ] Reinforce that executive trust drops when a PM appears unprepared\n\n## Customer-centricity\n\n### 28. Define customer-centricity clearly\n\n- [ ] Protect the meaning of \"customer.\"\n- [ ] Distinguish real customers from stakeholders and internal partners\n- [ ] Reinforce that the role is to innovate on behalf of customers\n- [ ] Teach that product changes, outages, and support moments reveal true customer care\n\n### 29. Build customer contact into the role\n\n- [ ] Expect regular direct customer interaction\n- [ ] Encourage at least several meaningful customer conversations each week\n- [ ] Review what the PM learned from those conversations\n- [ ] Ask for stories, not just summaries\n- [ ] Encourage the PM to share customer insights across the company\n- [ ] Build their reputation as someone who deeply knows customers\n\n### 30. Coach customer judgment\n\n- [ ] Watch for contempt or dismissiveness toward customers\n- [ ] Watch for the PM assuming customers are not smart\n- [ ] Teach empathy and respect\n- [ ] Teach urgency and calm during customer pain moments\n- [ ] Reinforce that customer-centricity is shown in hard tradeoff situations\n\n## Integrity\n\n### 31. Coach integrity as a practical operating standard\n\n- [ ] Treat integrity as foundational to trust\n- [ ] Discuss pressures that challenge integrity in day-to-day work\n- [ ] Coach for difficult real-world situations, not abstract values only\n\n### 32. Dependability\n\n- [ ] Teach that commitments must be taken seriously\n- [ ] Ensure commitments are based on informed judgment\n- [ ] Ensure the PM does not overcommit before sufficient discovery\n- [ ] Ensure the PM relies on design and engineering expertise before committing\n- [ ] Reinforce that what ships must actually solve the problem\n- [ ] Coach the PM to build a reputation for dependable commitments\n\n### 33. Company's best interests\n\n- [ ] Teach the PM to act in the best interests of the company\n- [ ] Watch for local optimization for only their team\n- [ ] Encourage helping other teams when it benefits the company\n- [ ] Recognize visible acts of company-first behavior\n- [ ] Coach's decisions that may not maximize convenience for the team but are better for the business\n\n### 34. Accountability\n\n- [ ] Teach willingness to take responsibility for mistakes\n- [ ] Ask what the PM could have done better, even when others contributed\n- [ ] Reinforce that accountability is not blame-seeking\n- [ ] Reinforce that accountability means learning, adjusting, and improving\n- [ ] Ensure the PM does not hide behind cross-functional complexity\n\n## Decision making\n\n### 35. Build a strong foundation for decisions\n\n- [ ] Reinforce that good decisions rest on integrity\n- [ ] Reinforce that decisions must aim at customer and business outcomes\n- [ ] Help the PM bring leaders and stakeholders along through rationale and respect\n- [ ] Coach for decisions others can understand, even when they disagree\n\n### 36. Right-size decision analysis\n\n- [ ] Teach the PM to judge the level of risk\n- [ ] Teach the PM to judge the consequences if wrong\n- [ ] Match the depth of analysis to the importance of the decision\n- [ ] Identify what information is critical before deciding\n- [ ] Avoid over-analyzing low-consequence decisions\n- [ ] Avoid under-analyzing high-consequence decisions\n- [ ] Consider revenue, legal, stakeholder, and customer implications\n- [ ] Encourage a clear plan of attack for consequential choices\n\n### 37. Collaboration-based decision making\n\n- [ ] Clarify that decision-making is not consensus, voting, or benevolent dictatorship\n- [ ] Teach when to defer to the tech lead on enabling technology\n- [ ] Teach when to defer to product design on customer experience\n- [ ] Teach when the PM must work with stakeholders on business viability\n- [ ] Reinforce that the hardest choices often concern value tradeoffs\n\n### 38. Resolving disagreements\n\n- [ ] Normalize healthy disagreement\n- [ ] Teach when to run a test instead of arguing\n- [ ] Coach selection of the least expensive useful test\n- [ ] Use prototypes and evidence to resolve uncertainty\n- [ ] Escalate only when necessary after collaborative attempts\n\n### 39. Transparency\n\n- [ ] Require a clear rationale for important decisions\n- [ ] Use notes for smaller decisions\n- [ ] Use written narratives and FAQs for major decisions\n- [ ] Anticipate objections and address them explicitly\n- [ ] Make reasoning visible to leaders and stakeholders\n\n### 40. Disagree and commit\n\n- [ ] Teach the team to debate honestly\n- [ ] Teach them to accept a final decision once made\n- [ ] Prevent undermining decisions after the fact\n- [ ] Ensure the PM can explain the rationale even when it was not their preferred option\n- [ ] Expect the PM to help make the final decision successful\n\n## Warning signs and anti-patterns\n\n### 41. Coaching anti-patterns\n\n- [ ] Coaching is treated as secondary work\n- [ ] 1:1s become status meetings\n- [ ] The manager talks more than listens\n- [ ] Feedback is delayed until reviews\n- [ ] Manager micromanages\n- [ ] Manager avoids difficult conversations\n- [ ] Weak performance is tolerated for too long\n\n### 42. PM anti-patterns\n\n- [ ] PM focuses on activity over outcomes\n- [ ] PM acts like a project coordinator rather than a product leader\n- [ ] PM lacks strategic context\n- [ ] PM has weak customer contact\n- [ ] PM has not done the homework\n- [ ] PM dominates rather than collaborates\n- [ ] PM avoids ownership\n- [ ] PM overcommits\n- [ ] PM appears unprepared in important forums\n- [ ] PM makes opaque decisions\n- [ ] PM resists disagreement but fails to commit\n\n## Manager self-audit\n\n### 43. Weekly manager check\n\n- [ ] Did I spend real time coaching this week?\n- [ ] Do my people know I care about their development?\n- [ ] Have I clarified the strategic context recently?\n- [ ] Do I know each person's top development gaps?\n- [ ] Did I observe and coach real behavior this week?\n- [ ] Did I give honest, useful feedback this week?\n- [ ] Am I fostering ownership rather than dependence?\n- [ ] Am I protecting time for real product work?\n- [ ] Am I coaching thinking and judgment, not only execution?\n- [ ] Am I helping PMs become more customer-centric?\n- [ ] Am I coaching collaboration across teams and stakeholders?\n- [ ] Am I reinforcing integrity and accountability?\n- [ ] Am I helping my team make better decisions?\n\n### 44. Run effective meetings\n\n- [ ] Challenge whether a meeting is needed at all\n- [ ] Prefer asynchronous communication when it can serve the purpose\n- [ ] Remember, meetings are expensive because they are synchronous\n- [ ] Be aware that meetings shape how executives judge your team, especially the PM\n- [ ] Avoid poorly prepared, slow, low-value meetings\n\n### 45. Be clear on the type of meeting\n\n- [ ] Identify whether the meeting is for communication, decision-making, or problem-solving\n- [ ] Do not mix purposes carelessly\n- [ ] For communication meetings, verify that the content is too important or complex for async\n- [ ] For decision meetings, verify that a real decision is needed beyond what the team can decide alone\n- [ ] For problem-solving meetings, verify that the issue is genuinely hard enough to benefit from real-time group thinking\n\n### 46. Organize meetings well\n\n- [ ] State the purpose clearly\n- [ ] Decide who is essential vs. optional\n- [ ] Keep the attendee list tight\n- [ ] Postpone if essential people cannot attend\n- [ ] Prepare thoroughly before the meeting starts\n- [ ] Ensure the right content, medium, visuals, and data are ready\n- [ ] For decision meetings, prepare the written narrative\n- [ ] For problem-solving meetings, prepare context, framing, and relevant facts\n- [ ] Anticipate likely questions in advance\n\n### 47. Facilitate meetings well\n\n- [ ] Facilitate the needed decision or solution\n- [ ] Do not let the meeting drift aimlessly\n- [ ] Do not confuse facilitation with policing\n- [ ] Keep discussion tied to purpose\n- [ ] Make sure the room understands the decision, even if people disagree\n- [ ] Close the loop with explicit follow-up and next steps\n\n## Ethics\n\n### 48. Add ethics explicitly to product coaching\n\n- [ ] Teach the classic four product risks: value, usability, feasibility, viability\n- [ ] Add a fifth explicit question: Should we build it?\n- [ ] Treat ethics as a first-class consideration, not something buried inside viability\n- [ ] Make room for uncomfortable questions about consequences\n- [ ] Reinforce that product teams have special responsibility because they create and ship new things\n\n### 49. Teach ethical product judgment\n\n- [ ] Ask how the solution affects customers beyond revenue\n- [ ] Ask how the solution affects the broader stakeholder community\n- [ ] Ask about environmental, social, regulatory, and reputational consequences\n- [ ] Ask whether you would be proud to have the work publicly scrutinized\n- [ ] Ask whether the product choice could embarrass the company if exposed\n- [ ] Reinforce that good intentions can still create harmful unintended consequences\n\n### 50. Coach how to raise ethical concerns\n\n- [ ] Encourage people to raise concerns thoughtfully\n- [ ] Coach them to avoid moral grandstanding or accusatory framing\n- [ ] Frame concerns in terms of protecting the company's best interests\n- [ ] Ensure they understand enough of the business context to speak credibly\n- [ ] Help them involve their manager when the situation is sensitive\n- [ ] Create an environment where uncomfortable questions are acceptable\n\n### 51. Watch for company-level ethics signals\n\n- [ ] Check whether ethics is regularly discussed in product work\n- [ ] Check whether anybody is clearly responsible for ethical oversight\n- [ ] Watch whether leadership seems genuinely concerned with integrity and ethics\n- [ ] Take seriously the signs that the company consistently ignores ethical implications\n\n## Happiness and sustainability\n\n### 52. Treat team happiness as a management responsibility\n\n- [ ] Accept that managers strongly influence whether product people are fulfilled or miserable\n- [ ] Check regularly whether each person feels their work is meaningful\n- [ ] Check whether they are progressing in their career and capability\n- [ ] Check whether they are building the relationships needed to succeed\n- [ ] Learn what is personally meaningful to each person\n\n### 53. Reinforce meaningful work\n\n- [ ] Help people understand why their work matters\n- [ ] Connect team contributions to company and customer impact\n- [ ] Reinforce meaning both privately and publicly\n- [ ] Do not assume people automatically see the significance of their work\n\n### 54. Build personal relationships\n\n- [ ] Build trust through a real personal connection\n- [ ] Learn aspirations, motivations, and interests outside work\n- [ ] Let people know you are committed to helping them succeed professionally and personally\n- [ ] Create the kind of relationship that can sustain honest feedback\n- [ ] Aim to become a trusted and valued part of their career story\n\n### 55. Recognize people personally\n\n- [ ] Assume most people want to feel valued\n- [ ] Personalize recognition to the individual\n- [ ] Use frequent, human recognition beyond compensation and promotion\n- [ ] Notice whether someone dislikes public recognition but still values appreciation\n- [ ] Recognize effort, growth, and contribution in ways that feel genuine\n\n### 56. Coach healthy work habits\n\n- [ ] Distinguish between an occasional healthy push and chronic overwork\n- [ ] Watch for signs of burnout\n- [ ] Talk explicitly about sustainability and the long game\n- [ ] Reinforce that creative problem-solving requires recovery time\n- [ ] Make sure intense pushes do not become the normal operating mode\n- [ ] Coach people who cannot disengage from meaningful work\n\n### 57. Model healthy behavior\n\n- [ ] Remember, your actions speak louder than your words\n- [ ] Avoid creating pressure through your own unhealthy patterns\n- [ ] Be thoughtful about when you send messages and emails\n- [ ] Share how you recharge and manage your time\n- [ ] Model sustainable intensity rather than performative overwork\n\n### 58. Support career planning honestly\n\n- [ ] Help people think clearly about their career path\n- [ ] Acknowledge when someone may need a different role or career\n- [ ] Recognize the outsized influence managers have on employees' lives\n- [ ] Support long-term flourishing, not only near-term team needs\n\n## Additional manager self-audit items\n\n### 59. Meetings\n\n- [ ] Did I cancel or convert low-value meetings when async would work?\n- [ ] Did the meetings I ran have a clear purpose, preparation, and follow-up?\n- [ ] Did I use written narratives for important decisions?\n\n### 60. Ethics\n\n- [ ] Did I explicitly ask whether we should build this, not only whether we can?\n- [ ] Did I make space for ethical concerns without punishing people for raising them?\n- [ ] Did I help my team think through unintended consequences?\n\n### 61. Happiness\n\n- [ ] Do I know what makes each person feel fulfilled?\n- [ ] Am I reinforcing meaningful work frequently enough?\n- [ ] Am I modeling healthy habits?\n- [ ] Am I noticing burnout early?\n- [ ] Am I helping people build careers, not just complete tasks?\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Coaching is the first job — how ordinary people become extraordinary teams, in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned product-minded executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. MILA: an energetic young product manager, dark hair in a ponytail, denim jacket over a striped shirt, carries a tablet covered in sticky notes.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Mila treads water in the deep end holding her tablet up while a manager walks away looking at a phone.](assets/images/coaching/comic-01-deep-end.jpeg)\n**Panel 1:** *The hook: sink-or-swim is not a development plan.*\n\n![Comic panel: a manager reads status items from a dashboard while Mila's unasked development questions crumple in a thought bubble.](assets/images/coaching/comic-02-status-theater.jpeg)\n**Panel 2:** *The problem: the 1:1 became a status meeting, and growth fell off the agenda.*\n\n![Comic panel: Vera writes a whiteboard list with COACH as the large first item while Mila watches surprised.](assets/images/coaching/comic-03-first-job.jpeg)\n**Panel 3:** *The principle: coaching is the first job of product leadership.*\n\n![Comic panel: Vera and Mila review a radar skills chart with two short spokes circled in amber.](assets/images/coaching/comic-04-honest-assessment.jpeg)\n**Panel 4:** *Start honest: a real assessment, specific gaps, no judgment.*\n\n![Comic panel: a written coaching plan pinned above Mila's desk linking her two gaps to concrete actions as she adds a sticky note.](assets/images/coaching/comic-05-coaching-plan.jpeg)\n**Panel 5:** *The plan: written down, action by action, co-owned.*\n\n![Comic panel: Vera and Mila hold a warm weekly 1:1 over the coaching plan with the recurring slot circled on the wall calendar.](assets/images/coaching/comic-06-weekly-ritual.jpeg)\n**Panel 6:** *The ritual: a weekly hour that belongs to the person, not the sprint.*\n\n![Comic panel: Mila at a fork holding her own map while Vera's lantern lights both branches equally.](assets/images/coaching/comic-07-context-not-answers.jpeg)\n**Panel 7:** *Coach with context: light the field, keep the decision theirs.*\n\n![Comic panel: Mila coaches a newer teammate at the same table while Vera smiles in the background walking toward someone else.](assets/images/coaching/comic-08-extraordinary.jpeg)\n**Panel 8:** *The closer: the coached become coaches — and the team compounds.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
