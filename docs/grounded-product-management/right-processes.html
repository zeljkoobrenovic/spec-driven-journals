<script id="data" type="application/json">{"meta": {"id": "PM-RIGHT-PROCESSES", "status": "draft:gray", "title": "The Right Processes", "date": "2026-07-27", "author": "Željko Obrenović", "permalink": "right-processes", "timetoread": "8 min", "excerpt": "I run product management on a small set of processes that exist to serve outcomes, never as ceremony. Discovery and validation run continuously, prioritization derives from strategy rather than from the loudest voice, and every cadence is sized to the horizon it governs. When a process stops moving the outcome, I cut it.", "tags": "product management, process, discovery, prioritization, cadence", "icon": "assets/icons/right-processes.png", "logo": "assets/images/right-processes/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["product management", "process", "discovery", "prioritization", "cadence"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: I treat product processes as machinery in service of outcomes, never as ceremony. I ground the roadmap in a validated key customer outcome, keep discovery and validation running continuously — research before deciding what to build, not after — and derive prioritization from strategy through a transparent framework rather than from the loudest stakeholder. I size every cadence to the horizon it governs, match the development process to the type of work, and measure success by whether shipped work moved the outcome, not by how much we shipped. A process that stops serving the outcome gets cut.\n\n## Statement\n\nMy operating model for product processes has seven parts:\n\n- **Start from the outcome.** Executives answer one question together — *\"How do customers know this product is delivering value?\"* — and every answer stays a hypothesis until customer research and the 5 Whys confirm it. The result is a pair of outcome pyramids — customer and company — with usage metrics as leading indicators.\n- **Validate the vision outside the building.** The customer journey vision — trigger through retention — is tested with forward-thinking customers before I trust internal consensus, with input from every customer-facing team and from engineering.\n- **Keep discovery running.** Customer research informs what gets built, not just how it landed — at least four hours a week, multiple methods, even when there is no immediate project.\n- **Derive prioritization from strategy.** Inbound requests land in an idea bank and get scored with a consistent framework such as RICE; stakeholders name their top 1–2 priorities — with reasons — not a wish list. The roadmap balances innovation, iteration, and operation against explicit allocation targets.\n- **Size cadences to horizons.** The roadmap and vision are reassessed at the one-third or one-quarter mark of their horizon: quarterly for a one-year roadmap, at least yearly for a three-year vision. Outcome reviews happen at least quarterly.\n- **Match process to work.** Innovation sprints for bold, future-facing work; Scrum for build-measure-learn iteration; Kanban for bugs and urgent operational work. One method is never forced on everything.\n- **Measure outcomes, not output.** A simple dashboard tracks a few durable metrics tied to the outcome pyramid, and product managers show evidence after every release that the intended metric moved.\n\n![Circular loop of discovery, validation, prioritization, delivery, and learning feeding a roadmap document at its center.](assets/images/right-processes/discovery-delivery-learning-loop.jpeg)\n**Figure 1:** *The product engine is a loop, not a pipeline: discovery, validation, prioritization, delivery, and learning continuously feed the roadmap.*\n\n## How to Read This\n\nThis journal is the **product-management counterpart** to my engineering-executive journal: the same record shape, applied to how product management should work. This record is grounded in Ben Foster and Rajesh Nerlikar's *Build What Matters*, read through a practitioner-executive lens. One boundary matters: the engineering-side process machinery lives in the engineering journal's [Running Engineering Processes](../grounded-engineering-executive/run-engineering-processes.html); this record covers the product side — discovery, validation, prioritization, roadmap cadences, and the communication around them. The working checklist — all seventeen sections, with the numbers — lives in the **Checklist** tab of this post. Two of those sections — crafting the product strategy and communicating the outcome, vision, and strategy — overlap territory owned by the sibling records [Product Strategy](product-strategy.html) and [Outcomes](outcomes.html); they are reproduced in the checklist for completeness rather than restated here.\n\n## Rationale\n\n**Process is a means; the outcome is the point.** Product organizations accumulate ceremonies the way codebases accumulate dependencies: each arrived for a reason, and nobody remembers to remove it. So I apply one test to every recurring meeting, review, and ritual: does it move a customer or company outcome? A standup that surfaces no decisions or a roadmap review that changes no allocation is not process — it is ceremony wearing its costume.\n\n**Research before commitment beats validation after launch.** The cheapest moment to learn you are wrong is before the work is prioritized. So discovery is a standing habit — the weekly hours are protected, the methods varied, the conversations ongoing whether or not a project demands them — and every element of the vision stays a hypothesis until customers outside the building confirm it. Internal-only validation produces weak consensus and groupthink; forward-thinking customers are the antidote.\n\n**Prioritization without a framework is a volume contest.** Without a transparent process, the roadmap goes to whoever escalates loudest. The idea bank plus consistent scoring turns requests into comparable objects; asking stakeholders for their top 1–2 priorities — and *why* — turns lobbying into signal. The refusal matters just as much: I am transparent about what is *not* on the roadmap and why, because a silent no breeds shadow roadmaps.\n\n![Split illustration contrasting a self-referential loop of meetings with a small set of gears driving a rising outcome chart.](assets/images/right-processes/ceremony-vs-outcome.jpeg)\n**Figure 2:** *Ceremony circles back into itself; a right-sized process connects directly to an outcome it moves.*\n\n**Cadence follows horizon.** A roadmap reassessed too rarely calcifies into fiction; reassessed too often, it never accumulates evidence. The one-third/one-quarter rule sizes the cadence to the commitment: quarterly for a one-year roadmap, yearly for a three-year vision, and a strategy revisit after major milestones or visible market shifts. Changing direction on evidence is the cadence working, not the plan failing.\n\n**One method does not fit all work.** Innovation needs room to think; iteration needs tight build-measure-learn loops; operational work needs flow, not sprints. Forcing one method onto all three either suffocates the bold work or ritualizes the urgent work. The same logic balances the roadmap: innovation, iteration, and operation each get an explicit allocation and their own feeder, because a backlog does not appear automatically from strategy.\n\n**Shipping is not the finish line.** Story points measure motion, not progress. After a release, the question is whether the intended metric moved — and product managers bring the evidence. Sharing it with engineering makes delivery teams care about outcomes instead of throughput.\n\n**Communication is a process too.** The roadmap goes to executives first, then to each major group with a tailored message. Externally I share themes, not dates — buffers protect discovery, and overpromising is debt collected with interest.\n\n![Three interlocking gears of increasing size labeled sprint, quarterly roadmap review, and yearly vision review.](assets/images/right-processes/cadence-sized-to-horizon.jpeg)\n**Figure 3:** *Cadence follows horizon: sprints turn fast, the roadmap is reassessed quarterly, the vision at least yearly — one geared system, not competing clocks.*\n\n## What This Means in Practice\n\n| What this principle says | What it does **not** say |\n| --- | --- |\n| Every process must serve a customer or company outcome. | Process is bad — the absence of process just means prioritization by loudness. |\n| Research comes before deciding what to build. | Every decision waits for a study — the cadence keeps moving. |\n| Prioritization runs through a transparent framework. | The framework decides — it informs; an empowered leader decides. |\n| Reassess the roadmap at one-third to one-quarter of its horizon. | Rewrite the roadmap whenever anyone is nervous. |\n| Match the method — sprints, Scrum, Kanban — to the work. | Pick one methodology and enforce it everywhere. |\n| Product managers show post-release evidence of impact. | Shipping on time is the measure of success. |\n| Share themes externally, with buffers. | Hide the roadmap — internal transparency stays radical. |\n\nConcretely: recurring meetings carry a named outcome or come off the calendar. Discovery hours are scheduled like delivery work. Every inbound request gets an answer — including a reasoned no. And roadmap reviews start with evidence from the last cycle, not with new wishes.\n\n## Anti-Patterns\n\n- **The ceremony calendar.** A week so full of standups, reviews, and syncs that no discovery happens.\n- **Validation theater.** Customer research run *after* prioritization, to confirm a decision already made.\n- **The loudest-voice roadmap.** No idea bank, no framework — priorities go to whoever escalates hardest.\n- **The frozen roadmap.** A twelve-month plan never reassessed, defended after the evidence turned against it.\n- **Methodology monoculture.** Scrum forced onto firefighting and exploration alike, because \"we are a Scrum shop.\"\n- **Ship-and-forget.** Celebrating the launch and starting the next feature without checking whether the metric moved.\n- **The external date promise.** Sharing the internal roadmap with prospects, then paying for it in lost flexibility.\n\n## Related Records\n\n- [The Right Team](right-team.html) — the people and roles that run these processes; process cannot compensate for the wrong team.\n- [Balanced Roadmap](balanced-roadmap.html) — what the innovation/iteration/operation balance looks like on the roadmap itself; this record supplies the processes that produce and maintain it.\n- [Running Engineering Processes](../grounded-engineering-executive/run-engineering-processes.html) — the engineering-side counterpart in my engineering-executive journal; the two records meet at the sprint boundary.\n- [Meetings](../grounded-engineering-executive/meetings.html) — the engineering journal's discipline for meetings generally; the ceremony test here is the product-side application.\n\n## Scope and Revisiting\n\nThis principle governs the recurring processes of product management: outcome definition, discovery, prioritization, roadmap cadences, development-process selection, and roadmap communication. I revisit it when the company changes stage — the process weight that suits fifty people suffocates ten and underpowers five hundred — and whenever I catch a process surviving on habit rather than on the outcome it moves. The cadence rules self-enforce: the reassessment schedule is part of the record.\n\n## Authoritative References\n\n- Ben Foster and Rajesh Nerlikar, *Build What Matters: Delivering Key Outcomes with Vision-Led Product Management* (Lioncrest Publishing, 2020) — the process chapters this record's checklist distills.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "6 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this principle. The Article tab carries the rationale, implications, and anti-patterns.*\n\n## Identify the Key Customer Outcome\n\n- [ ] Bring executives together to define the key customer outcome.\n- [ ] Ask: **\"How do customers know this product is delivering value?\"**\n- [ ] Treat each answer as a hypothesis, not a decision.\n- [ ] Conduct customer research to validate or reject the hypotheses.\n- [ ] Use the **5 Whys** to uncover the real customer need.\n- [ ] Combine qualitative and quantitative data.\n- [ ] Consider future customers, prospects, and market trends.\n- [ ] Identify the final decision-maker.\n- [ ] Define different outcomes for different customer segments or personas.\n- [ ] Document the assumptions, options considered, and rationale.\n- [ ] Get alignment from the CEO/founder and executive team.\n- [ ] Create outcome pyramids from both the customer and company perspective.\n- [ ] Define usage metrics that act as leading indicators of success.\n\n## Craft the Customer Journey Vision\n\n- [ ] Validate the customer outcome with forward-thinking customers.\n- [ ] Seek external validation before relying on internal opinions.\n- [ ] Gather input from customer-facing teams:\n    - [ ] Sales\n    - [ ] Marketing\n    - [ ] Customer support\n    - [ ] Account management\n- [ ] Gather input from engineering leadership on feasibility, risks, and complexity.\n- [ ] Review third-party sources such as app reviews, communities, industry reports, and review sites.\n- [ ] Map the full customer journey:\n    - [ ] Trigger\n    - [ ] Discovery\n    - [ ] Evaluation\n    - [ ] Trial\n    - [ ] Engagement\n    - [ ] Retention\n- [ ] Draft the journey vision before asking everyone to create separate versions.\n- [ ] Share an early version with stakeholders, customers, and prospects.\n- [ ] Collect feedback and revise.\n- [ ] Watch for weak consensus or groupthink.\n- [ ] Strengthen the vision until it is clear, valuable, realistic, and inspiring.\n\n## Craft the Product Strategy\n\n- [ ] Hold a cross-functional strategy session.\n- [ ] Include product, design, engineering, marketing, sales, and customer success.\n- [ ] Share customer research before the meeting.\n- [ ] Ask participants to prepare ideas in advance.\n- [ ] Make the session a discussion, not a presentation.\n- [ ] Identify major disagreements or disconnects.\n- [ ] Clarify whether disagreements are about:\n    - [ ] Risk tolerance\n    - [ ] Market direction\n    - [ ] Competitive threats\n    - [ ] Technical feasibility\n    - [ ] Customer needs\n- [ ] Agree on the decision-making process before forcing agreement on the decision.\n- [ ] Treat stakeholders as advisors and contributors, not voters.\n- [ ] Make the CEO or empowered product leader the final decision-maker.\n- [ ] Use an offsite or neutral setting when possible.\n- [ ] Give the meeting enough time for real discussion.\n- [ ] Call out assumptions, risks, pivot points, and open questions.\n- [ ] Define success milestones and reassessment milestones.\n\n## Communicate the Outcome, Vision, and Strategy\n\n- [ ] Prepare a clear story, not just a presentation.\n- [ ] Practice the presentation before sharing broadly.\n- [ ] Anticipate likely questions and objections.\n- [ ] Use customer evidence to support the message.\n- [ ] Consider letting customers \"speak\" through recordings, quotes, or interview clips.\n- [ ] Explain the key outcome, customer journey, and strategy in plain language.\n- [ ] Make the vision exciting and credible.\n- [ ] Communicate that the strategy is a living document.\n- [ ] Set expectations that reassessment and adjustment will happen over time.\n\n## Maintain Ongoing Customer Validation\n\n- [ ] Build a regular customer discovery habit.\n- [ ] Continuously test assumptions in the vision and strategy.\n- [ ] Use customer research before deciding what to build, not only after work is prioritized.\n- [ ] Use multiple research methods:\n    - [ ] Market research\n    - [ ] Persona research\n    - [ ] Card sorting\n    - [ ] Diary studies\n    - [ ] Customer advisory boards\n    - [ ] Win/loss analysis\n    - [ ] Surveys\n    - [ ] Interviews\n    - [ ] Usability studies\n- [ ] Spend at least **four hours per week** on customer research when possible.\n- [ ] Hire a dedicated customer research specialist once the product team is large enough.\n- [ ] Regularly talk to customers even when there is no immediate project.\n\n## Track Iteration and Product Outcomes\n\n- [ ] Define metrics that show whether product changes are delivering value.\n- [ ] Track customer behavior, not just output.\n- [ ] Use quantitative feedback loops to guide iteration.\n- [ ] Choose durable metrics that reflect value for multiple stakeholders.\n- [ ] Run experiments or A/B tests where appropriate.\n- [ ] Use results to adjust product direction.\n\n## Reassess the Roadmap and Vision\n\n- [ ] Reassess the roadmap and vision at the **one-third or one-quarter mark** of the total time horizon.\n- [ ] For a one-year roadmap, update it quarterly.\n- [ ] For a three-year vision, update it at least once a year.\n- [ ] Revisit strategy after major milestones.\n- [ ] Watch for market changes, competitors, regulations, or customer shifts.\n- [ ] Change direction when evidence shows the current strategy is no longer correct.\n\n## Handle Inbound Product Requests\n\n- [ ] Create a process for managing feature requests and ideas.\n- [ ] Avoid saying yes to every stakeholder request.\n- [ ] Maintain an idea bank for suggestions, including ideas not on the roadmap.\n- [ ] Be transparent about what is on the roadmap and what is not.\n- [ ] Explain why certain ideas do not make the roadmap.\n- [ ] Use a consistent prioritization framework such as **RICE**.\n- [ ] Regularly review ideas, scores, and rankings.\n- [ ] Share updates with stakeholders who submitted ideas.\n- [ ] Ask stakeholders for their top **1–2 priorities**, not a long wish list.\n- [ ] Ask why they prioritized those items.\n\n## Collect Roadmap Input by Stakeholder Group\n\n- [ ] Ask founders/CEO about strategic milestones, market trends, and technical stability.\n- [ ] Ask finance about investment horizons, efficiency, and the trade-off between growth and profitability.\n- [ ] Ask sales about customer needs, deal blockers, and prospect concerns.\n- [ ] Ask marketing about market trends, pipeline growth, and automatable tasks.\n- [ ] Ask customer success about retention, customer outcomes, and support needs.\n- [ ] Ask engineering about technical opportunities, performance, tech debt, and scalability.\n- [ ] Ask design about UX issues, customer outcomes, and workflow constraints.\n\n## Balance the Roadmap\n\n- [ ] Categorize roadmap items into:\n    - [ ] Innovation\n    - [ ] Iteration\n    - [ ] Operation\n- [ ] Define an allocation target for each category.\n- [ ] Tag roadmap items by category.\n- [ ] Check whether investment is balanced appropriately.\n- [ ] Adjust allocation when one category is over- or underfunded.\n\n## Build and Execute the Product Backlog\n\n- [ ] Do not assume the product backlog appears automatically from strategy.\n- [ ] Use vision and strategic planning to feed innovation work.\n- [ ] Use customer feedback, new features, and A/B testing to feed iteration work.\n- [ ] Use bugs, internal tools, and technical improvements to feed operations work.\n- [ ] Prioritize each category intentionally.\n- [ ] Convert roadmap priorities into sprint-ready backlog items.\n- [ ] Work with engineering to plan delivery.\n\n## Create the Roadmap Document\n\n- [ ] Make clear which initiatives belong to innovation, iteration, or operation.\n- [ ] Show allocation targets when possible.\n- [ ] Paint a picture far enough into the future for other teams to plan.\n- [ ] Explain the rationale behind the work.\n- [ ] Focus on problems, value, and outcomes, not just features.\n- [ ] Leave room for plans to change.\n- [ ] Avoid false precision.\n- [ ] Avoid giving every roadmap item the same level of detail.\n- [ ] Avoid feature-date commitments unless there is a strong business reason.\n- [ ] Avoid forcing too many items into the roadmap.\n\n## Communicate the Roadmap Internally\n\n- [ ] Share the roadmap with executives first.\n- [ ] Present the roadmap to major groups separately:\n    - [ ] Engineering, QA, and architecture\n    - [ ] Sales and marketing\n    - [ ] Account management, customer success, and support\n    - [ ] HR, finance, and other teams\n- [ ] Tailor the message to each group's needs.\n- [ ] Give people space to ask questions.\n- [ ] Use surveys or anonymous feedback channels after presentations.\n\n## Communicate the Roadmap Externally Carefully\n\n- [ ] Avoid sharing the internal roadmap with customers or sales prospects.\n- [ ] Share broad themes rather than detailed commitments.\n- [ ] Avoid specific dates unless absolutely necessary.\n- [ ] Add buffers when discussing future plans.\n- [ ] Preserve flexibility for product discovery and Agile development.\n- [ ] Minimize detail and avoid overpromising.\n\n## Choose the Right Development Process\n\n- [ ] Use innovation sprints for bold, future-facing work.\n- [ ] Consider longer cycles for innovation work when teams need space to think deeply.\n- [ ] Use Scrum for iteration, experimentation, and build-measure-learn loops.\n- [ ] Use Kanban for operational issues, production problems, bugs, and urgent technical work.\n- [ ] Match the process to the type of work rather than forcing one method on everything.\n\n## Assess Product Development Efficiency\n\n- [ ] Measure progress against roadmap completion, not just story points.\n- [ ] Track whether shipped work produced the intended outcome.\n- [ ] Ask product managers to show evidence after releases.\n- [ ] Review whether launches moved the intended metric or created the desired value.\n- [ ] Share evidence with engineering so teams see the impact of their work.\n- [ ] Conduct this type of outcome review at least **quarterly**.\n\n## Create and Manage the Product Metrics Dashboard\n\n- [ ] Create a dashboard showing key customer and company outcome metrics.\n- [ ] Keep the dashboard simple.\n- [ ] Track only a few meaningful metrics tied to the outcome pyramid.\n- [ ] Update the dashboard daily where possible.\n- [ ] Add temporary launch metrics when needed.\n- [ ] Remove temporary metrics after their purpose is complete.\n- [ ] Expose the dashboard internally.\n- [ ] Review metrics regularly with the organization.\n- [ ] Connect team efforts to business and customer outcomes.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Processes exist to serve outcomes, not themselves — vision-led product process in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned product-minded executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. MILA: an energetic young product manager, dark hair in a ponytail, denim jacket over a striped shirt, carries a tablet covered in sticky notes.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Mila stands exhausted before a wall calendar packed solid with meetings while Vera watches calmly.](assets/images/right-processes/comic-01-wall-to-wall-ceremonies.jpeg)\n**Panel 1:** *The hook: a calendar full of process, and no discovery anywhere in it.*\n\n![Vera points at a hamster wheel built from calendar icons spinning in place as Mila watches.](assets/images/right-processes/comic-02-process-serving-itself.jpeg)\n**Panel 2:** *The problem: process running for its own sake — motion without progress.*\n\n![Vera draws a gear connected by an arrow to a customer figure and a rising outcome chart while Mila takes notes.](assets/images/right-processes/comic-03-processes-serve-outcomes.jpeg)\n**Panel 3:** *The principle: processes exist to serve outcomes — anything else comes off the calendar.*\n\n![Mila interviews a customer while sketching a discovery loop, as Vera holds a card reading four hours per week.](assets/images/right-processes/comic-04-discovery-loop.jpeg)\n**Panel 4:** *The loop: continuous discovery and validation — research before commitment, every single week.*\n\n![A funnel filters a cloud of requests into a short ranked list held by Mila while Vera waves off a giant megaphone.](assets/images/right-processes/comic-05-prioritization-from-strategy.jpeg)\n**Panel 5:** *Prioritization: an idea bank and one consistent framework — the roadmap is not a volume contest.*\n\n![Vera and Mila stand before three interlocking gears labeled sprint, quarterly, and yearly vision.](assets/images/right-processes/comic-06-cadence-sized-to-company.jpeg)\n**Panel 6:** *Cadence: reassessment sized to the horizon — sprints spin fast, the vision turns once a year.*\n\n![Mila shows Vera a dashboard where a metric line rises past a launch flag while engineers look on.](assets/images/right-processes/comic-07-evidence-after-launch.jpeg)\n**Panel 7:** *The learning loop closes: not 'we shipped it' but 'it moved the outcome' — with evidence.*\n\n![Vera and Mila stand before a mostly clear wall calendar with an open slot marked by a customer icon.](assets/images/right-processes/comic-08-lean-calendar.jpeg)\n**Panel 8:** *The closer: fewer ceremonies, every one earning its place — and room for the customer again.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
