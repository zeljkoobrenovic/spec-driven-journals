<script id="data" type="application/json">{"meta": {"id": "PM-PRODUCT-VISION-AND-PRINCIPLES", "status": "draft:gray", "title": "Product Vision and Principles", "date": "2026-07-27", "author": "Željko Obrenović", "permalink": "product-vision-and-principles", "timetoread": "8 min", "excerpt": "I maintain one shared product vision — a customer-centric picture of the future, 3–10 years out — and I use it as the north star that product strategy, architecture, and team topology all steer by. I pair it with explicit product principles that decide the countless small trade-offs without escalation, including the ethical ones. And I treat the vision as a recruiting and leadership tool: inspiring enough to sell, honest enough to admit it is a reasoned leap of faith.", "tags": "product management, product vision, product principles, north star, empowered teams", "icon": "assets/icons/product-vision-and-principles.png", "logo": "assets/images/product-vision-and-principles/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["product management", "product vision", "product principles", "north star", "empowered teams"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: I maintain exactly one product vision — a shared, customer-centric picture of the future we want to create, 3–10 years out, inspiring enough to recruit with. It is the north star that product strategy, architecture, and team topology all steer by, and it is emphatically not a feature roadmap. I pair it with explicit product principles that encode what our products stand for: the principles decide the small stuff so the vision can decide the big stuff — hundreds of trade-offs, including the ethical ones, settled consistently at team level without escalation. I validate the demand behind the vision while accepting that pursuing it remains a reasoned leap of faith. And I communicate it relentlessly, because one telling is never enough.\n\n## Statement\n\nMy operating model for product vision and principles has five parts:\n\n- **One vision, anchored in strategic context.** The vision supports the company's mission and objectives, connects explicitly to product strategy, and shapes team topology. No product team gets its own separate vision.\n- **A compelling picture of the future, not a plan.** Customer-centric, end state rather than implementation, a 3–10 year horizon, built on relevant industry trends rather than fads — customer value, not technology for its own sake.\n- **Actionable across the organization.** Strategy, architecture, and team structure are downstream of the vision, and engineering gets enough clarity about what is coming to make sound technical bets. Every team sees the bigger picture and its own contribution to it.\n- **Principles as decision-making machinery.** A clear set of product principles complements the vision: explicit enough to help with trade-offs, reasoning attached, priorities defined for when values conflict — with ethics discussed explicitly, not implicitly.\n- **A leadership tool, told and retold.** The head of product owns the vision's development, design and technology leadership shape it, the CEO genuinely owns it — and I use it to recruit, to create meaning, and to evangelize, retelling it far past the point where I am tired of hearing myself.\n\n![Three ships labeled strategy, architecture, and topology all steering toward a single north star labeled vision.](assets/images/product-vision-and-principles/vision-north-star.jpeg)\n**Figure 1:** *One shared vision as the north star: product strategy, architecture, and team topology all steer by the same point.*\n\n## How to Read This\n\nThis journal is the product-management counterpart to my engineering-executive journal: the same first-person, record-shaped format, applied to how I believe product management should work. This record belongs to the journal's EMPOWERED section and is grounded in Marty Cagan and Chris Jones's *EMPOWERED* — read here through a practitioner-executive lens rather than as a book summary. It has a deliberate boundary with its Build-What-Matters sibling [Customer Journey Vision](customer-journey-vision.html): that record covers the journey-story *format* for expressing a vision; this one covers Cagan's vision-and-principles *pairing* — the shared north star plus the guardrails. They are complementary lenses on the same artifact. The working checklist — all eleven sections, with the numbers — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**Without a shared vision, every team steers by its own map.** Empowered teams are given problems, not features — but autonomy without a common destination produces a fleet of well-run ships sailing in different directions. The vision is what makes team-level autonomy safe at the organizational level: every team can see the bigger picture and how its own work contributes to the larger whole. That is also why I refuse per-team visions. Ten small visions are not decentralization; they are fragmentation.\n\n**The 3–10 year horizon is what separates a vision from a roadmap.** A roadmap answers \"what are we shipping next quarter\"; a vision answers \"what future are we creating for customers.\" The moment the vision degrades into a feature list with dates, it loses both of its powers: it stops inspiring, and it stops absorbing change. So I keep the vision focused on the end state, not the implementation plan — stubborn on the vision, flexible on the details. In roadmap conversations I prefer sharing the vision over sharing detailed roadmaps and avoid locking into promises too early; when a forward-looking commitment to a customer is genuinely necessary, it is a high-integrity commitment or it is not made.\n\n![Split scene contrasting a short quarterly roadmap path ending at a wall with a long open road toward a 3-10 year horizon.](assets/images/product-vision-and-principles/horizon-vs-roadmap.jpeg)\n**Figure 2:** *A roadmap answers next quarter; a vision answers the next 3–10 years. The horizon is what lets it inspire and absorb change.*\n\n**The vision needs real owners, all the way to the top.** The head of product owns developing the vision, with design and technology leadership shaping it closely — but the CEO must feel genuine ownership, because a vision the top of the company merely tolerates will not survive its first hard trade-off.\n\n**A vision nobody sells is a document, not a tool.** Communication is a craft in its own right: I tell the story from the user's perspective, make it inspiring rather than merely informative, and invest in artifacts that make the future tangible — a visiontype or conceptual prototype, storyboards, sometimes a scripted video — showing how different user types experience the future product, with product designers heavily involved. And I re-communicate it constantly. The vision is also my best recruiting tool: strong product people join missions, not backlogs. When a candidate asks \"where is this going?\", the answer should be the most compelling thing they hear all week.\n\n**Validation is honest or it is theater.** I test whether the underlying customer problems are real, whether customers care enough about them, and whether they are open to new solutions. What I do not pretend is that the final solution can be validated upfront — it cannot. Pursuing a vision is a reasoned leap of faith: reasoned because demand is tested, a leap because the destination is years out. Saying this out loud protects the vision from both cynics (\"it's unproven\") and zealots (\"it's guaranteed\").\n\n**Principles decide the small stuff so the vision can decide the big stuff.** A vision alone answers \"where are we going\" but not \"how do we behave on the way.\" Product principles encode what the products stand for: explicit enough to actually help with trade-offs — ease of use versus security, growth versus trust — each with its reasoning attached, and with clear priority when values conflict. This includes ethics, discussed explicitly rather than implicitly: I want teams to have considered how the product could be misused, and to have principles that prevent harmful outcomes, before the incident forces the conversation. Good principles are a delegation mechanism — hundreds of decisions a year get made consistently at the team level, without escalation, because the trade-off was settled once, in writing, with reasons.\n\n![A road toward a distant star lined with guardrails labeled principles, with small decision tokens flowing between them and an unused escalation ladder set aside.](assets/images/product-vision-and-principles/principles-as-guardrails.jpeg)\n**Figure 3:** *Principles as guardrails: hundreds of small trade-offs decided consistently at team level, with the escalation ladder left unused.*\n\n## What This Means in Practice\n\n| What this principle says | What it does **not** say |\n| --- | --- |\n| One shared vision for the whole organization. | Every team writes its own inspiring mini-vision. |\n| The vision is a 3–10 year picture of the customer's future. | The vision is a feature roadmap with longer arrows. |\n| Strategy, architecture, and topology steer by the vision. | The vision dictates this quarter's backlog. |\n| Validate the demand; admit the leap of faith. | Refuse to move until the solution is proven upfront. |\n| Principles decide recurring trade-offs at team level. | Every hard call escalates to whoever shouts loudest. |\n| Ethics is discussed explicitly, in advance. | Ethics is handled implicitly, after the incident. |\n| Retell the vision until everyone can retell it too. | One good all-hands presentation is enough. |\n\nConcretely: strategy discussions open by re-anchoring on the vision, not on the backlog. Architecture and topology proposals are argued from where we are going, not just from where we are. Recruiting conversations lead with the vision. And when a team escalates a trade-off the principles should have decided, I treat that as a gap in the principles, not a failure of the team — and we fix the principle.\n\n## Anti-Patterns\n\n- **The roadmap in a gown.** A \"vision\" that is really a three-year feature list with dates — it neither inspires nor survives contact with change.\n- **Vision sprawl.** Each product team writing its own separate vision; the organization decomposes into fragments that no longer add up to anything.\n- **The framed poster.** A vision written once, presented once, and never mentioned again — assumed absorbed because it was announced.\n- **The orphaned vision.** A head of product developing the vision alone, without design and technology leadership shaping it and without genuine CEO ownership; it dies at the first executive conflict.\n- **Premature promises.** Locking into detailed roadmap commitments with customers years out, then serving the promise instead of the customer.\n- **Principles that decide nothing.** Value statements so generic (\"we care about users\") that no real trade-off is ever settled by them.\n- **Implicit ethics.** Discovering how the product can be misused from the press coverage rather than from the principles.\n\n## Related Records\n\n- [Customer Journey Vision](customer-journey-vision.html) — the Build-What-Matters sibling: the journey-story format for expressing a vision; complementary lens on the same artifact.\n- [EMPOWERED Product Strategy](empowered-product-strategy.html) — strategy chooses which problems to work on now; this record defines the destination that strategy serves.\n- [Team Topology](team-topology.html) — topology is downstream of the vision; this record supplies the north star that topology aligns to.\n- [Organizational Values](../grounded-engineering-executive/organizational-values.html) — the engineering-executive counterpart on values; product principles are the same mechanism aimed at the product.\n\n## Scope and Revisiting\n\nThis principle governs how I create, validate, communicate, and use the product vision, and how I define the product principles that accompany it. I revisit it when company objectives materially shift, when the industry trend the vision leverages turns out to be a fad, when teams start escalating trade-offs the principles should decide, and whenever I notice the vision quietly degrading into a roadmap. The final quality check in the Checklist tab is the recurring test: compelling, customer-centered, shared, informing strategy and architecture and team design — and explainable, simply and consistently, by the organization without me in the room.\n\n## Authoritative References\n\n- Marty Cagan with Chris Jones, *EMPOWERED: Ordinary People, Extraordinary Products* (Wiley, 2020) — the product-vision and product-principles chapters this record's checklist distills.\n- Much of the book's material began as freely available essays at [svpg.com](https://www.svpg.com/), where the authors' ongoing writing can be read.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "4 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this principle. The Article tab carries the rationale, implications, and anti-patterns.*\n\n## Establish the Strategic Context\n\n- [ ] Confirm that the company's mission, objectives, and scorecard are clear.\n- [ ] Ensure the product vision supports company objectives.\n- [ ] Define how the vision connects to product strategy.\n- [ ] Align team topology to the vision.\n\n## Create a Compelling Product Vision\n\n- [ ] Make the vision customer-centric.\n- [ ] Describe the future you want to create for customers.\n- [ ] Focus on the end state, not the implementation plan.\n- [ ] Make it ambitious and meaningful.\n- [ ] Ensure it provides a shared \"North Star\" for all teams.\n- [ ] Make the bigger picture understandable to every team.\n- [ ] Clarify how each team contributes to the larger whole.\n- [ ] Set a long-term horizon, typically **3–10 years**.\n- [ ] Leverage relevant industry trends, not fads.\n- [ ] Keep the emphasis on customer value, not technology for its own sake.\n\n## Make the Vision Actionable Across the Organization\n\n- [ ] Use the vision to guide product strategy.\n- [ ] Use the vision to shape architecture decisions.\n- [ ] Use the vision to inform team structure and topology.\n- [ ] Give engineering enough clarity about what is coming.\n- [ ] Avoid confusing the vision with a feature roadmap.\n- [ ] Avoid giving each product team its own separate vision.\n\n## Build the Right Ownership\n\n- [ ] Ensure the head of product owns the development of the vision.\n- [ ] Involve the design closely in shaping the vision.\n- [ ] Involve technology leadership closely in shaping the vision.\n- [ ] Ensure the CEO/GM feels genuine ownership of the vision.\n- [ ] Prepare leaders to repeatedly communicate and \"sell\" the vision internally and externally.\n\n## Communicate the Vision Effectively\n\n- [ ] Tell the story from the user's perspective.\n- [ ] Make the vision inspiring, not just informative.\n- [ ] Create a visiontype or conceptual prototype.\n- [ ] Consider a scripted video to communicate the vision.\n- [ ] Use storyboarding where helpful.\n- [ ] Show how different user types experience the future product.\n- [ ] Involve product designers heavily in crafting the experience and communication.\n\n## Validate the Vision Appropriately\n\n- [ ] Test whether the underlying customer problems are real.\n- [ ] Test whether customers care enough about those problems.\n- [ ] Test whether customers are open to new solutions.\n- [ ] Accept that you can validate demand, but not fully validate the final solution upfront.\n- [ ] Treat pursuing the vision as a reasoned leap of faith.\n\n## Use the Vision as a Leadership Tool\n\n- [ ] Use the vision to recruit strong product talent.\n- [ ] Use the vision to create meaning and purpose for teams.\n- [ ] Use the vision as an evangelism tool across the company.\n- [ ] Re-communicate the vision regularly; do not assume one telling is enough.\n- [ ] Engage executives, investors, sales, marketing, customer success, and other stakeholders.\n\n## Handle Roadmap Conversations Carefully\n\n- [ ] Prefer sharing the product vision over sharing detailed roadmaps.\n- [ ] Stay stubborn on vision but flexible on details.\n- [ ] Avoid locking into roadmap promises too early.\n- [ ] Be careful with forward-looking commitments to customers.\n- [ ] Share only high-integrity commitments when necessary.\n\n## Define Product Principles\n\n- [ ] Write a clear set of product principles that complement the vision.\n- [ ] Use principles to guide day-to-day decisions.\n- [ ] Make principles explicit enough to help with trade-offs.\n- [ ] Explain the reasoning behind each principle.\n- [ ] Ensure teams understand which values take priority in conflicts.\n\n## Address Ethics and Trade-Offs\n\n- [ ] Identify the major trade-offs teams are likely to face.\n- [ ] Clarify how to balance goals such as ease of use vs. security.\n- [ ] Discuss ethics explicitly, not implicitly.\n- [ ] Consider how the product could be misused.\n- [ ] Define principles for preventing harmful or unethical outcomes.\n- [ ] Give teams enough context to make good ethical decisions.\n\n## Final Quality Check\n\n- [ ] The vision is compelling.\n- [ ] The vision is customer-centered.\n- [ ] The vision is shared across teams.\n- [ ] The vision informs strategy, architecture, and team design.\n- [ ] The principles support real trade-off decisions.\n- [ ] The organization can explain the vision simply and consistently.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "One shared north star, 3–10 years out — why a vision and its principles beat a fleet of separate maps, in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned product-minded executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. MILA: an energetic young product manager, dark hair in a ponytail, denim jacket over a striped shirt, carries a tablet covered in sticky notes.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Mila proudly presents a wall of five different team maps pointing in five directions while Vera looks concerned.](assets/images/product-vision-and-principles/comic-01-separate-maps.jpeg)\n**Panel 1:** *The hook: five teams, five visions, five directions.*\n\n![Comic panel: a job candidate asks where the product is going while Mila freezes with an empty thought bubble.](assets/images/product-vision-and-principles/comic-02-where-is-this-going.jpeg)\n**Panel 2:** *The problem: the best candidates ask 'where is this going?' — and get silence.*\n\n![Comic panel: Vera replaces five separate maps with one large picture of a north star marked 3-10 years.](assets/images/product-vision-and-principles/comic-03-one-shared-vision.jpeg)\n**Panel 3:** *The principle: one shared vision, 3–10 years out, inspiring enough to recruit with.*\n\n![Comic panel: Vera pushes aside Mila's long scroll of dated feature boxes, pointing instead at the star picture.](assets/images/product-vision-and-principles/comic-04-not-a-roadmap.jpeg)\n**Panel 4:** *The boundary: a vision is the future you want to create — not a feature roadmap with longer arrows.*\n\n![Comic panel: Vera and Mila watch three ships labeled strategy, architecture, and topology steer toward one star.](assets/images/product-vision-and-principles/comic-05-north-star-steering.jpeg)\n**Panel 5:** *The north star: strategy, architecture, and topology all steer by the same vision.*\n\n![Comic panel: Mila uses a principles card to pick a path at a fork while an escalation ladder stands unused behind her.](assets/images/product-vision-and-principles/comic-06-principles-guardrails.jpeg)\n**Panel 6:** *The guardrails: principles decide hundreds of small trade-offs — including the ethical ones — so nothing needs to escalate.*\n\n![Comic panel: Vera presents the vision with a storyboard while Mila retells the same story to the candidate.](assets/images/product-vision-and-principles/comic-07-retell-it.jpeg)\n**Panel 7:** *The retelling: a vision nobody sells is a document — tell it until the whole organization can.*\n\n![Comic panel: close-up of Vera and Mila looking up at one bright star, Mila's tablet showing the same star.](assets/images/product-vision-and-principles/comic-08-shared-star.jpeg)\n**Panel 8:** *The closer: one star, one story — and everyone can finally answer 'where is this going?'*\n"}]}]}</script>

            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
