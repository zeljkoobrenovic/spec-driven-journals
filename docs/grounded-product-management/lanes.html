<script id="data" type="application/json">{"meta": {"id": "PM-LANES", "status": "draft:gray", "title": "Lanes", "date": "2026-08-14", "author": "Željko Obrenović", "permalink": "lanes", "timetoread": "8 min", "excerpt": "I operate strategy at the lane level: each team carries a handful of durable, outcome-oriented lanes — a couple of metrics, a directional sense of the opportunity — and cranks on them week after week. Vision-to-tactics pyramids and label taxonomies are reporting views, not the work; the work happens in exactly one place, the front-line team, and the lanes are where I go to pressure-test it.", "tags": "product management, strategy, lanes, north star, metrics, alignment", "icon": "assets/icons/lanes.png", "logo": "assets/images/lanes/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["product management", "strategy", "lanes", "north star", "metrics", "alignment"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: I operate strategy at the lane level. Each team carries a handful of durable, outcome-oriented lanes — a couple of metrics and a directional sense of the opportunity — and cranks on them week after week, revisiting them on a rhythm and pivoting when they stop making sense. Vision-to-tactics pyramids and label taxonomies are reporting views: fine as a slide to leave leaders feeling aligned, then set aside. The work happens in exactly one place — the front-line team — and the lanes are where I go to pressure-test it.\n\n## Statement\n\nMy operating model for lanes has five parts:\n\n- **The lane is the unit of strategy.** A lane is a durable, outcome-oriented swimlane of work — not a kanban column, not a value stream, not a project. \"For the next couple of months or quarters we keep these few things stable, measure them, let them guide the way — and when they stop making sense, we change them.\"\n- **A few per team, with metrics.** Each team carries a small number of lanes, each with a couple of metrics and a directional sense of the opportunity. That, plus a weekly rhythm of *what happened, what's next, what's working*, is what a humming team actually looks like.\n- **Pyramids are reporting views.** Vision-to-strategy-to-tactics trees, strategic pillars, and label taxonomies are roll-up mechanisms. I will make the slide when leaders need it — and then put it aside, because nobody does work inside a pyramid.\n- **Writing a good lane is the hard part.** Durable but revisitable, outcome-oriented but actionable, specific enough to guide work, not so bucket-ish it guides nothing. Getting that balance right *is* strategy work.\n- **At scale, admit the count.** A 150-team company has 450–600 lanes. I refuse the reflex to \"simplify\" that away; instead I use routines, rituals, and AI-assisted review to stay accountable to the lanes themselves.\n\n## How to Read This\n\nThis record opens the first section of this journal grounded not in a book but in a practitioner essay: John Cutler's \"20 Unfiltered Operating Takes\" (TBM 435), read through the same practitioner-executive lens as the rest of the journal. It answers the question I get whenever a new planning season starts: *\"Should we build the vision-to-tactics pyramid first?\"* My answer — no, write the lanes — is this record. The working checklist, derived from the essay rather than reproduced from a source PDF, lives in the **Checklist** tab.\n\n## Rationale\n\n**There is only one place the work happens.** Problem solving, creativity, hands on keyboards, contact with customers — all of it happens at the front-line team level. It may have arrived there through layers of the organization, but it does not happen *in* those layers. Real strategy is messy, non-hierarchical, spans days or years, and does not fit neat boxes. Any artifact that suggests otherwise is describing the org chart, not the work.\n\n![Diagram of faded vision, strategy, and tactics layers floating above one vivid front-line row where actual work happens.](assets/images/lanes/front-line-vs-roll-up-layers.jpeg)\n**Figure 1:** *The layers are reporting views; the work happens in exactly one place — the front line.*\n\n**Labels become imagined things.** There is nothing wrong with a label taxonomy — until people start believing the labels are real. Most roll-up buckets exist for two purposes: deckware, and a false sense of organizational symmetry. The moment a \"pillar\" starts absorbing prioritization decisions that should be made against a lane's metrics, the taxonomy has gone from reporting view to counterfeit strategy. The honest version of visibility is simpler: if someone owns something and people are working toward it, make that clear — ownership on an artifact should mean hands on the work, not a name on a slide.\n\n**The North Star Framework taught me this — by not surviving contact.** I treat NSF as a teaching tool, not an installable practice. What it teaches is durable: leading versus lagging metrics, actionable inputs, building and testing causal models, avoiding vanity metrics, crystallizing a strategy that is *yours* rather than a standard game. The follow-up evidence is consistent: teams that adapted the ideas (\"we have multiple KPIs, leading and lagging, some things aren't worked out\") got value; teams that installed it as a framework hit the edge cases and stalled. The lasting artifact of NSF is the discipline of tweaking actionable inputs until they hold together and still guide action — which is exactly the craft of writing a lane.\n\n**Good lanes are hard, and the difficulty is the point.** It is far easier to write hand-wavy strategic pillars, generic buckets that all work \"falls into,\" or a list of discrete little projects. A real lane has to balance durability, outcome-orientation, actionability, customer impact, and a causal model — all at once, in language a team can actually work with. When a team struggles to write its lanes, that struggle is the strategy conversation, and I want it happening at the team, not abstracted into a planning deck.\n\n![Annotated diagram of a single lane card with outcome flag, leading and lagging metric dials, direction arrow, causal link, and revisit date, beside faded pillar and project alternatives.](assets/images/lanes/anatomy-of-a-lane.jpeg)\n**Figure 2:** *The anatomy of a lane — outcome-oriented, measured, directional, causally argued, and dated for revisiting.*\n\n**At scale, the honest number wins.** A 150-team company carries 450–600 lanes once you count honestly — a few per team, plus lanes of their own for the big bets that cross teams rather than smearing those across everyone's. The leader's objection writes itself: \"There is no way I can discuss 600 things.\" But each stable lane represents high-six-figure to seven-figure annual investment. Refusing to engage with them at lane resolution means refusing to pressure-test million-dollar bets — and no roll-up review I have seen pressure-tests anything; it admires aggregates. So I admit the count, keep the taxonomy only for rolling things up, and build the accountability machinery — recurring lane reviews, rituals, and AI tooling that can hold 600 lanes even when no single human can.\n\n**This does not contradict my outcome pyramids — it disciplines them.** [Outcomes](outcomes.html) commits me to outcome pyramids: a key outcome broken into drivers and leading/lagging indicators. That pyramid is a *causal model* — it tells a team what to improve next, and every layer is checkable against reality. The pyramids this record rejects are *roll-up* pyramids: org-chart-shaped trees of labels whose only function is aggregation. The test is simple: if removing a node changes what some team does next week, it is a causal model; if it only changes a slide, it is deckware.\n\n![Split diagram contrasting a causal-model pyramid wired into team actions with a roll-up pyramid feeding only a presentation slide.](assets/images/lanes/causal-model-vs-roll-up-pyramid.jpeg)\n**Figure 3:** *The removal test: touch a node in a causal model and next week's work changes; touch a roll-up and only the slide changes.*\n\n## What This Means in Practice\n\n| What this principle says | What it does **not** say |\n| --- | --- |\n| Strategy is operated and reviewed at the lane level. | Leaders read 600 lanes every week unaided — routines and AI carry the volume. |\n| Pyramids and pillar slides are made when useful, then set aside. | Alignment artifacts are forbidden. |\n| Lanes stay stable for months or quarters. | Lanes are eternal — when one stops making sense, we pivot it. |\n| NSF ideas — actionable inputs, causal models — shape every lane. | We install the North Star Framework as our operating system. |\n| Big cross-team efforts get lanes of their own. | Every lane maps one-to-one onto one team. |\n\n## Anti-Patterns\n\n- **The deckware pyramid.** A vision-to-tactics tree built to \"align everyone,\" admired in one meeting, wrong within a quarter, never consulted by anyone doing work.\n- **Pillars as strategy.** Hand-wavy strategic pillars that every conceivable initiative fits under — which is precisely why they guide nothing.\n- **The roll-up review.** \"We'll pressure-test the work when we roll it up.\" No one ever has. Aggregates are admired, not tested.\n- **Kanban-lane confusion.** Treating workflow columns or a long project as \"the lanes.\" Lanes are outcome-oriented directions, not process stages.\n- **Lane churn.** Rewriting the lanes every sprint. A lane that changes weekly is a task list with ambitions.\n- **The eternal lane.** A lane kept alive because it is on the slide, long after its metrics went quiet and its opportunity closed.\n\n## Related Records\n\n- [Outcomes](outcomes.html) — the outcome pair and metrics discipline each lane's metrics inherit; the causal-model pyramid this record defends while rejecting roll-up pyramids.\n- [Product Strategy](product-strategy.html) and [EMPOWERED Product Strategy](empowered-product-strategy.html) — where the direction that lanes operationalize comes from; lanes are strategy deployed, not strategy invented.\n- [Team Objectives](team-objectives.html) — how teams commit to outcomes within their lanes.\n- [Balanced Roadmap](balanced-roadmap.html) — the roadmap view that coexists with lanes without replacing them.\n- [Working Small](working-small.html) — the tempo at which a team cranks on its lanes.\n- [Routines](routines.html) — the weekly heartbeat that lane reviews live inside.\n\n## Scope and Revisiting\n\nThis principle governs how ongoing product work is structured and reviewed between the vision (above) and the sprint (below). I revisit it if lane reviews at scale prove impossible even with AI assistance and honest rituals — the fallback would be fewer, larger lanes, not a return to pyramid governance — and whenever I catch myself asking for a roll-up before I have read a single lane.\n\n## Authoritative References\n\n- John Cutler, \"TBM 435: 20 Unfiltered Operating Takes\", *The Beautiful Mess*, August 2026 — the source essay; this record distills its North Star Framework, Trees/Pyramids, and both Lanes sections.\n- John Cutler and Jason Scherschligt, *The North Star Playbook* (Amplitude) — the framework this record repositions as a teaching tool.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "3 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this principle — derived from John Cutler's \"20 Unfiltered Operating Takes\". The Article tab carries the rationale and anti-patterns.*\n\n## Write the Lanes\n\n- [ ] Each team has a small number of lanes — durable, outcome-oriented directions, not projects or kanban columns.\n- [ ] Each lane carries a couple of metrics and a directional sense of the opportunity.\n- [ ] Each lane is written in language the team can actually work with — specific enough to guide action.\n- [ ] Each lane names its customer impact and the causal link to a business result.\n- [ ] Lanes are expected to stay stable for months to quarters, not weeks.\n- [ ] Big cross-team efforts get lanes of their own rather than being smeared across team lanes.\n\n## Test Lane Quality\n\n- [ ] The lane is not a hand-wavy pillar — you can name work it would rule out.\n- [ ] The lane is not a bucket — it guides what to do next, not just where to file things.\n- [ ] The lane would survive a product redesign — it is about the outcome, not a feature.\n- [ ] The team can say what \"moving the needle\" on this lane looked like last week.\n- [ ] The lane's inputs are actionable — the team can influence them directly (the North Star Framework lesson).\n- [ ] Removing this lane would change what someone does next week — if it only changes a slide, it is deckware.\n\n## Run the Lane Rhythm\n\n- [ ] The team reviews its lanes weekly: what happened, what's happening, what's working, what isn't.\n- [ ] Lane metrics are looked at in the review, not just reported upward.\n- [ ] Each lane is revisited on a schedule — and pivoted or retired when it stops making sense.\n- [ ] A lane whose metrics have gone quiet gets challenged, not carried.\n\n## Keep Roll-Ups in Their Place\n\n- [ ] Pyramid and pillar slides are made when leaders need them — then set aside.\n- [ ] Label taxonomies are used for roll-up reporting only, never for prioritization.\n- [ ] No decision is justified by pointing at a pillar; decisions point at lanes and their metrics.\n- [ ] Ownership shown on alignment artifacts matches people actually working on the thing.\n\n## Operate at Scale\n\n- [ ] The organization admits its true lane count instead of \"simplifying\" it away.\n- [ ] Each lane's approximate annual investment is known — and treated as a bet worth pressure-testing.\n- [ ] Routines, rituals, and AI-assisted review carry the lane volume no single leader can.\n- [ ] Leaders sample and read individual lanes regularly — not only the roll-up.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Lanes over pyramids — where the work actually happens, in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned product-minded executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. MILA: an energetic young product manager, dark hair in a ponytail, denim jacket over a striped shirt, carries a tablet covered in sticky notes.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Mila presents a large vision-strategy-tactics pyramid slide on a screen.](assets/images/lanes/comic-01-the-pyramid-slide.jpeg)\n**Panel 1:** *The hook: one pyramid to align them all.*\n\n![Comic panel: a busy front-line team works under a faded, disconnected pyramid poster.](assets/images/lanes/comic-02-work-happens-elsewhere.jpeg)\n**Panel 2:** *The problem: the work happens in exactly one place — and it isn't the slide.*\n\n![Comic panel: Vera and Mila inspect empty boxes labeled Pillar A, B, and C.](assets/images/lanes/comic-03-labels-become-things.jpeg)\n**Panel 3:** *The trap: people start imagining the labels are real.*\n\n![Comic panel: Vera shows a board with three lanes, each with a metric dial and arrow.](assets/images/lanes/comic-04-the-lane.jpeg)\n**Panel 4:** *The principle: a few durable, outcome-oriented lanes per team.*\n\n![Comic panel: Mila among crumpled drafts holds one finally crisp lane card.](assets/images/lanes/comic-05-hard-to-write.jpeg)\n**Panel 5:** *The craft: durable but revisitable, outcome-oriented but actionable — that balance is the work.*\n\n![Comic panel: the team reviews the lane board together as one dial ticks upward.](assets/images/lanes/comic-06-weekly-rhythm.jpeg)\n**Panel 6:** *The rhythm: what happened, what's next, what's working — every week.*\n\n![Comic panel: an executive recoils from a wall of hundreds of lane cards while Vera and a small robot review them.](assets/images/lanes/comic-07-six-hundred-lanes.jpeg)\n**Panel 7:** *The scale test: your lanes are costing you millions — so read them, with help.*\n\n![Comic panel: Mila files the pyramid slide into a drawer while the lane board buzzes behind her.](assets/images/lanes/comic-08-pyramid-in-the-drawer.jpeg)\n**Panel 8:** *The closer: the pyramid gets a drawer; the lanes get the week.*\n"}]}]}</script>

    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
