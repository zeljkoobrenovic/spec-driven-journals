<script id="data" type="application/json">{"meta": {"id": "PM-CUSTOMER-JOURNEY-VISION", "status": "draft:gray", "title": "Customer Journey Vision", "date": "2026-07-27", "author": "Željko Obrenović", "permalink": "customer-journey-vision", "timetoread": "8 min", "excerpt": "I anchor product direction in a customer journey vision: a written story of how a specific customer's life works roughly three years from now. The vision describes their journey — from the trigger that starts their search through discovery, evaluation, trial, engagement, and retention — not our feature list. Every roadmap conversation starts from that story, and I validate it by asking whether an outsider can understand it, whether it inspires, and whether it is believable.", "tags": "product management, product vision, customer journey, vision-led, direction", "icon": "assets/icons/customer-journey-vision.png", "logo": "assets/images/customer-journey-vision/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["product management", "product vision", "customer journey", "vision-led", "direction"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: I anchor product direction in a customer journey vision: a concrete story of how a specific customer's life works years from now, not a slogan about our product. The vision describes their journey — what triggers their search, how they discover and evaluate us, what makes trial convert into engagement, and why they stay — targeting a 10x customer outcome on a roughly three-year horizon. It is written down, bold enough to inspire, grounded enough to believe — and every roadmap conversation starts from it.\n\n## Statement\n\nMy operating model for product vision has five parts:\n\n- **Define the foundation first.** I identify the 10x customer outcome to enable, describe the customer journey that will generate it, and write the vision down as the single source of truth — teams align around the same vision, not just the same metric. The horizon is usually about three years, shorter or longer only when the market or business model demands it, and the vision must be ambitious yet achievable with our resources.\n- **Tell the full journey, not the product slice.** The vision starts the moment the customer realizes they may need a better solution and covers every major stage, not just onboarding or usage — capturing thoughts, emotions, objections, and decision points, detailed enough to be plausible without locking teams into one solution too early.\n- **Differentiate deliberately.** I study what competitors do poorly *and* what they are not doing at all, name our unfair advantage, and use the Kano model to separate must-haves, performance features, and delighters — knowing today's delighters become tomorrow's expectations.\n- **Communicate through artifacts, not speeches.** The vision lives in formats people can read, reference, discuss, and update — comic strips, vision mock-ups, customer diary entries — short enough to absorb quickly and covering the whole journey, not just product screens.\n- **Validate before the vision steers anything.** I run it through the final-validation questions — spelled out in the Rationale below — before it drives a single roadmap conversation.\n\n![Two parallel customer journey paths: a jagged, obstacle-filled path labeled today above a smooth milestone path labeled future leading to an outcome star.](assets/images/customer-journey-vision/two-journeys.jpeg)\n**Figure 1:** *The vision is the distance between two journeys: the customer's frustrating path today and their transformed path years from now.*\n\n## How to Read This\n\nThis journal is the **product-management counterpart** to my engineering-executive journal: the same first-person operating-principle format, applied to how I believe product management should work. This record is grounded in Ben Foster and Rajesh Nerlikar's *Build What Matters*, read through a practitioner-executive lens rather than as a book summary. If you build products with me, it explains why I reject vision slides that list features, and why roadmap conversations open with \"which part of the customer's future journey does this move us toward?\" The working checklist — all nine sections, foundation to final validation — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**A metric aligns spreadsheets; a journey aligns decisions.** Teams that share only a target number will happily pull in opposite directions, each move locally justified by the metric. A written journey — who the customer is, what triggers their search, what they experience at each stage — gives every team the same picture of the destination, so hundreds of small decisions cohere without me arbitrating each one.\n\n**Feature lists describe us; journeys describe the customer.** A \"vision\" that enumerates capabilities answers what we will build while dodging the question that matters: how does the customer's life change? The 10x customer outcome forces the leap to be meaningful rather than incremental, and the journey keeps the outcome honest — an outcome with no plausible journey behind it is a wish.\n\n**The journey is longer than the product.** Most product thinking starts at onboarding. But the customer's journey starts earlier — at the **trigger**, the moment their current solution stops being good enough — and runs through **discovery** (how they learn we exist), **evaluation** (what they must believe before trying), **trial** (the aha moment that earns commitment), **engagement** (the behaviors that deliver real value), and **retention** (the moments they decide whether to recommit, and whether they *notice* the value they receive). A vision that skips the early stages produces a product nobody finds; one that skips retention, a product nobody keeps.\n\n![A winding path with six waypoints labeled trigger, discovery, evaluation, trial, engagement, and retention leading toward a distant lighthouse with an amber beam.](assets/images/customer-journey-vision/journey-stages-lighthouse.jpeg)\n**Figure 2:** *The full journey — trigger to retention — steering toward the vision like a lighthouse: distant, fixed, and what every roadmap navigates by.*\n\n**Differentiation is designed into the journey, not bolted on.** Studying competitors' gaps, watching customer behavior around current solutions, and naming our unfair advantage tells me *where* in the journey we can be meaningfully different. The Kano model then disciplines the feature conversation: must-haves customers punish us for missing, performance features where more is better, delighters that create word-of-mouth — and we revisit the categories, because delighters decay into expectations.\n\n**A vision nobody absorbs steers nothing.** Verbal communication evaporates; a document nobody reads is a filing exercise. So the vision ships as artifacts built for absorption: a comic strip showing the end-to-end journey in a human way, vision mock-ups conveying what the future experience could feel like, customer diary entries in the customer's own voice. Mock-ups are concept direction, not engineering requirements — they align product, design, engineering, sales, and leadership around the same future without specifying it.\n\n**Validation is a test, not a ceremony.** Before the vision steers anything, I check it against the final-validation questions: can an outsider understand it quickly, does it explain start-continue-stay, does it capture the emotional as well as practical journey, does it help teams decide consistently, is it bold enough to inspire and grounded enough to believe, does it show how we deliver the 10x outcome? A vision that fails is rewritten, not defended.\n\n## What This Means in Practice\n\n| What this principle says | What it does **not** say |\n| --- | --- |\n| The vision is a story of the customer's future journey. | The vision is a list of features we plan to ship. |\n| Target a 10x customer outcome on a ~three-year horizon. | Three years is a law — market and business model can shift it. |\n| Map every stage, trigger through retention. | Specify every stage so precisely that teams lose solution freedom. |\n| Communicate through artifacts — comics, mock-ups, diary entries. | Mock-ups are engineering requirements. |\n| Delighters differentiate us today. | Delighters stay delighters — they decay into expectations. |\n| Validate the vision with outsiders before it steers work. | The vision is finished once leadership approves the slide. |\n\nConcretely: roadmap conversations open with the journey stage they advance, not the feature they add. Personas and product principles serve as supporting components — buyer personas separated from user personas where they differ, principles used to prevent feature creep. And when someone presents a \"vision,\" my first test is whether it names a customer and tells their story — or just names us.\n\n![Split illustration contrasting a gray bulleted feature-list slide with an open storybook showing a customer's journey as a short comic sequence.](assets/images/customer-journey-vision/story-vs-feature-list.jpeg)\n**Figure 3:** *The test of a vision: does it tell the customer's story, or just enumerate our features?*\n\n## Anti-Patterns\n\n- **The feature-list vision.** A slide of capabilities with no customer in it — our output, nobody's changed life.\n- **Metric-only alignment.** Teams sharing a number but not a picture, each optimizing their slice of the funnel against the others.\n- **The onboarding-only journey.** A vision that starts at signup — skipping the trigger, discovery, and evaluation stages where most customers are actually lost.\n- **The over-specified future.** Journey detail so deep it hard-codes one solution three years early, converting a vision into a premature spec.\n- **The verbal vision.** A direction living in the founder's talk track, mutating with each retelling because nothing was written down.\n- **The eternal delighter.** Treating a differentiator from two years ago as still special, while the market has quietly made it a must-have.\n- **The unvalidated vision.** A document leadership loves and no outsider can retell — inspiring in the room, useless as a decision tool.\n\n## Related Records\n\n- [Product Dysfunctions](dysfunctions.html) — the failure modes vision-led product management exists to escape; most trace back to missing or feature-shaped visions.\n- [Product Strategy](product-strategy.html) — the sequenced path toward this vision; strategy without a journey vision is motion without a destination.\n- [Product Vision and Principles](product-vision-and-principles.html) — the companion record on vision hygiene and the principles that guard the journey against feature creep.\n- [Engineering Strategy](../grounded-engineering-executive/engineering-strategy.html) — the engineering-side counterpart; the customer journey vision is the demand signal it supplies against.\n\n## Scope and Revisiting\n\nThis principle governs how I set and communicate product direction, and what I accept as a \"vision\" in any planning conversation. I revisit the vision on its own horizon — roughly every three years, or when the market shifts underneath it — and the Kano categories more often, because delighters decay. I revisit this record whenever I catch a roadmap conversation starting from features instead of the journey.\n\n## Authoritative References\n\n- Ben Foster & Rajesh Nerlikar, *Build What Matters: Delivering Key Outcomes with Vision-Led Product Management* (Lioncrest Publishing, 2020) — the customer-journey-vision chapter this record's checklist distills.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "4 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this principle. The Article tab carries the rationale, implications, and anti-patterns.*\n\n## Define the Foundation\n\n- [ ] Identify the **10x customer outcome** you want to enable.\n- [ ] Describe the **actual customer journey** that will generate that outcome.\n- [ ] Make sure teams are aligned around the same vision, not just the same metric.\n- [ ] Write the vision down so there is a single source of truth.\n- [ ] Make the vision bold enough to inspire a meaningful leap, not just a minor improvement.\n- [ ] Set a realistic time horizon, usually around **three years**, unless your market or business model requires a shorter or longer one.\n- [ ] Confirm that the vision is ambitious yet achievable with your resources.\n\n## Build the Full Customer Journey\n\n- [ ] Map the journey from the moment the customer realizes they may need a better solution.\n- [ ] Include all major stages, not just onboarding or product usage.\n- [ ] Describe each stage with enough detail to make the journey plausible.\n- [ ] Avoid going so deep that you lock teams into one specific solution too early.\n- [ ] Capture the customer's thoughts, emotions, objections, and decision points.\n\n## Cover Each Journey Stage\n\n### Trigger\n\n- [ ] Define what causes the customer to realize their current solution is not good enough.\n- [ ] Identify whether the trigger is internal, external, or both.\n- [ ] Clarify the customer's mental state at the start of the journey.\n- [ ] Decide whether your product can create, amplify, or respond to the trigger.\n\n### Discovery\n\n- [ ] Explain how the customer becomes aware your product exists.\n- [ ] Identify whether you are competing in a crowded market or creating a new category.\n- [ ] Decide what channels, moments, or behaviors will drive discovery.\n- [ ] Make sure the customer can connect your product to their desired outcome.\n\n### Evaluation\n\n- [ ] Identify what the customer needs to believe before trying the product.\n- [ ] List the questions, doubts, or objections they will have.\n- [ ] Define what evidence, positioning, or experience helps them continue.\n- [ ] Make the product easy to understand quickly.\n\n### Trial\n\n- [ ] Define what counts as the customer giving the product a fair shot.\n- [ ] Identify what they need to experience during trial to commit.\n- [ ] Clarify what \"aha moment\" or proof point moves them forward.\n- [ ] Determine what boxes they need to check before buying, upgrading, or fully adopting.\n\n### Engagement\n\n- [ ] Define what meaningful engagement looks like after commitment.\n- [ ] Identify the behaviors that help the customer get real value.\n- [ ] Make sure customers know which features or actions matter most.\n- [ ] Connect engagement behaviors to long-term success.\n\n### Retention\n\n- [ ] Identify the moments when customers decide whether to continue.\n- [ ] Define what makes customers want to recommit.\n- [ ] Confirm customers are actually receiving the expected value.\n- [ ] Confirm customers are aware they are receiving that value.\n- [ ] Identify events or disappointments that could cause them to switch.\n\n## Ensure Competitive Differentiation\n\n- [ ] Study competitors' products and identify weaknesses or gaps.\n- [ ] Look at what competitors are not doing, not just what they do poorly.\n- [ ] Explore ideas from rapidly changing industries.\n- [ ] Identify your unfair advantage and how it could create a superior experience.\n- [ ] Observe customer behavior before, during, and after using current solutions.\n- [ ] Use bold brainstorming prompts to push beyond obvious solutions.\n\n## Apply the Kano Model\n\n- [ ] Identify **must-haves**: features customers expect and will punish you for missing.\n- [ ] Identify **performance features**: areas where more or better directly increases satisfaction.\n- [ ] Identify **delighters**: unexpected features that create excitement and word-of-mouth.\n- [ ] Decide which features help you compete and which help you stand apart.\n- [ ] Revisit these categories over time, because today's delighters can become tomorrow's expectations.\n\n## Communicate the Vision Clearly\n\n- [ ] Choose a format people can quickly understand and remember.\n- [ ] Avoid relying only on verbal communication.\n- [ ] Create artifacts that teams can read, reference, discuss, and update.\n- [ ] Make the vision easy for product, design, engineering, sales, and leadership to align around.\n- [ ] Use visual or narrative formats when possible.\n\n## Choose Vision Artifacts\n\n- [ ] Create a **comic strip** to show the end-to-end customer journey in a simple, human way.\n- [ ] Create **vision mock-ups** to show what the future product experience could feel like.\n- [ ] Create **customer diary entries** that convey the journey from the customer's perspective.\n- [ ] Keep artifacts clear, accessible, and short enough for stakeholders to absorb quickly.\n- [ ] Make sure artifacts communicate the whole journey, not just product screens or features.\n- [ ] Treat mock-ups as concept direction, not final engineering requirements.\n\n## Add Optional Supporting Components\n\n- [ ] Define relevant personas.\n- [ ] Separate buyer personas from user personas when they are different.\n- [ ] Capture each persona's desired outcome, concerns, motivations, and decision criteria.\n- [ ] Define design or product principles that guide trade-offs.\n- [ ] Use principles to prevent feature creep and keep the product focused.\n- [ ] Make sure principles support the customer journey and the competitive differentiation.\n\n## Final Validation\n\n- [ ] Can someone outside the team quickly understand the vision?\n- [ ] Does the vision explain why the customer would start, continue, and stay?\n- [ ] Does it describe the customer's emotional and practical journey?\n- [ ] Does it help teams make consistent decisions?\n- [ ] Is it bold enough to inspire?\n- [ ] Is it grounded enough to be believable?\n- [ ] Does it show how the product will deliver the 10x outcome?\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "The vision is the customer's future journey, told as a story — how a journey beats a feature list in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned product-minded executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. MILA: an energetic young product manager, dark hair in a ponytail, denim jacket over a striped shirt, carries a tablet covered in sticky notes.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Mila proudly presents a slide crammed with bulleted features while Vera watches skeptically from the table.](assets/images/customer-journey-vision/comic-01-feature-list-vision.jpeg)\n**Panel 1:** *The hook: a feature list wearing a vision costume.*\n\n![Comic panel: Vera points at an empty picture frame with a question-mark silhouette while Mila looks deflated beside her feature slide.](assets/images/customer-journey-vision/comic-02-whose-life-changes.jpeg)\n**Panel 2:** *The problem: there is no customer anywhere in the vision.*\n\n![Comic panel: a glowing miniature journey path with a tiny customer and a lighthouse rises from Vera's open notebook as Mila leans in.](assets/images/customer-journey-vision/comic-03-vision-is-a-journey.jpeg)\n**Panel 3:** *The principle: the vision describes their journey, not our features.*\n\n![Comic panel: Vera and Mila trace a jagged path of a frustrated customer over obstacles on a whiteboard, a storm cloud sketched overhead.](assets/images/customer-journey-vision/comic-04-walk-todays-journey.jpeg)\n**Panel 4:** *First, see today's journey honestly — the frustration the vision has to answer.*\n\n![Comic panel: Mila draws a smooth amber journey with six milestone dots toward a star while Vera plants a small flag labeled 3 YRS.](assets/images/customer-journey-vision/comic-05-write-the-future-journey.jpeg)\n**Panel 5:** *Then write the future journey — bold, believable, about three years out.*\n\n![Comic panel: Mila pins a comic strip, a mock-up sketch, and a diary page to a corkboard while Vera and colleagues nod.](assets/images/customer-journey-vision/comic-06-tell-it-as-a-story.jpeg)\n**Panel 6:** *Ship the vision as artifacts people can absorb — and retell.*\n\n![Comic panel: Vera and Mila steer a small boat toward a lighthouse beam past buoys labeled Y1, Y2, and Y3.](assets/images/customer-journey-vision/comic-07-steering-the-roadmaps.jpeg)\n**Panel 7:** *Years of roadmaps steer by one fixed light: the customer's future journey.*\n\n![Comic panel: close-up of Mila holding a tablet showing one happy customer at the end of a path, with Vera's thumbs-up at the edge.](assets/images/customer-journey-vision/comic-08-name-the-customer.jpeg)\n**Panel 8:** *The closer: no customer in the story, no vision on the wall.*\n"}]}]}</script>

            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
