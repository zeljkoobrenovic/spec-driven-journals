<script id="data" type="application/json">{"meta": {"id": "PM-STAFFING", "status": "draft:gray", "title": "Staffing", "date": "2026-07-27", "author": "Željko Obrenović", "permalink": "staffing", "timetoread": "8 min", "excerpt": "I own staffing personally — recruiting, interviewing, onboarding, development, and promotion are my job as the hiring manager, not a req I file with HR. I hire competent people of character rather than waiting for unicorns, I close strong candidates within 24–48 hours, and I treat the first 90 days as a deliberate ramp toward earned autonomy. Extraordinary teams are built from ordinary people, staffed and coached seriously.", "tags": "product management, staffing, recruiting, onboarding, empowered teams", "icon": "assets/icons/staffing.png", "logo": "assets/images/staffing/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["product management", "staffing", "recruiting", "onboarding", "empowered teams"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: I treat staffing as one of my most important jobs as a hiring manager, and I never outsource its ownership to HR. I hire for competence and character — not pedigree, not vague \"cultural fit,\" not brilliant-but-toxic star power — because extraordinary teams are built from ordinary, competent people of character. I recruit continuously before openings exist, close strong candidates within 24–48 hours with references I check personally, onboard deliberately through the first 90 days, give feedback weekly rather than annually, and act quickly when performance or behavior threatens the team.\n\n## Statement\n\nMy operating model for staffing product teams has five parts:\n\n- **Own it personally.** Recruiting, interviewing, hiring, onboarding, development, and promotion are the hiring manager's job — mine. HR supports with process and compliance; ownership never transfers.\n- **Hire for competence and character.** I look for demonstrated competence, integrity, coachability, and people who think differently from the current team. I reject brilliant-but-toxic candidates, and I refuse to over-index on pedigree, domain experience, or vague \"cultural fit.\"\n- **Recruit continuously.** I build a network of candidates before openings exist — referrals, events, internal talent, long-term relationships — and I move fast when I find someone strong: an offer within 24–48 hours, references checked by me.\n- **Onboard intentionally.** The first 90 days are critical. I check in at deliberate milestones — first day, first week, first paycheck, first month, 60 days — run a real bootcamp beyond generic orientation, and build a coaching plan toward earned autonomy.\n- **Keep the team strong.** Weekly 1:1s are the feedback mechanism, not the annual review. I distinguish competence problems (coach, clarify, give time) from toxic behavior (act decisively), promote deliberately, and treat regrettable attrition as a signal about management, starting with me.\n\n![A manager holds a five-link chain labeled recruit, interview, onboard, develop, promote while an HR desk offers a supporting toolbox from the side.](assets/images/staffing/hiring-manager-owns-staffing.jpeg)\n**Figure 1:** *Staffing is the hiring manager's chain to hold end to end — HR supports, but ownership never transfers.*\n\n## How to Read This\n\nThis journal is the product-management counterpart to my engineering-executive journal: the same first-person operating records, applied to how product management should work. This record is grounded in Marty Cagan and Chris Jones's *EMPOWERED: Ordinary People, Extraordinary Products*, read through a practitioner-executive lens — I keep what survives contact with real organizations. Two boundaries matter: the cross-journal [Hiring](../grounded-engineering-executive/hiring.html) record covers my hiring role as an engineering executive — funnels, offers, executive recruiting — while this record covers staffing product teams as the product hiring manager; and the sibling [The Right Team](right-team.html) record covers the *shape* of the product team, while this one covers how I fill and grow it. The working checklist — all sixteen sections plus the manager operating rhythm — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**Outsourced staffing produces the teams you deserve, not the teams you need.** When staffing means filing a req and waiting for HR to source candidates, the manager has delegated the single decision with the highest leverage on the team's future. HR is an essential partner for process, compliance, and coordination — but the judgment about who joins, how they ramp, and whether they grow is leadership work. A manager who treats staffing as a continuous responsibility recruits before openings exist, knows the pipeline personally, and never discovers a vacancy and a cold start at the same time.\n\n**The unicorn myth is an excuse for not building.** Waiting for the perfect candidate — the brand-name employer, the exact domain background, the visible star — is how positions stay open for months while the team drowns. The *EMPOWERED* answer is the one I hold: extraordinary teams are built from ordinary people — competent, of good character, coachable — developed by managers who take coaching seriously. Pedigree predicts little; demonstrated competence and integrity predict a lot. And a candidate who thinks differently from the current team is a feature, not a fit problem.\n\n![A competence-versus-character grid with a checkmark in the high-high corner, an unreachable unicorn above it, and a cracked star falling off the low-character edge.](assets/images/staffing/competence-character-bar.jpeg)\n**Figure 2:** *The bar is competence and character — the unicorn is a myth and the brilliant-but-toxic star fails the test.*\n\n**Speed is respect, and slowness is a competitor's offer.** Once I identify a strong candidate, I aim to make an offer within 24–48 hours. I conduct reference checks personally and ask the question that cuts through polish: *would you hire this person again?* I listen for signs of disrespect or toxicity, and I personally communicate my commitment to coaching and developing the person I am asking to join. Strong candidates read hesitation accurately — a slow process signals a slow organization.\n\n**Onboarding is where hiring succeeds or quietly fails.** The first 90 days determine whether a good hire becomes a strong contributor. So I check in at deliberate milestones — end of first day, end of first week, after the first paycheck, after the first month, after 60 days — establish trust early, assess strengths and gaps, and build a coaching plan. A real bootcamp goes beyond generic orientation: how decisions are made here, what matters most now, how trust is built, customer understanding, the financial model, discovery, prioritization. The goal is not to tell smart people what to do; it is to equip them to solve problems well. Autonomy is the endpoint of the ramp, not the starting assumption.\n\n**Feedback is weekly; the annual review is administration.** If a performance issue first surfaces in an annual review, the manager has failed twice — once by not seeing it, once by not saying it. Weekly 1:1s carry honest, timely feedback; expectations stay unmistakably clear. When problems persist, I distinguish a hiring mistake — clear coaching, escalating clarity, a reasonable period to improve, help finding a better-fitting role — from toxic behavior, where I protect the team's trust and psychological safety and act decisively, no matter how strong the individual's skills. Retention closes the loop: people leave managers, not companies, and regrettable attrition is data about me.\n\n![A new hire climbs a ramp past milestone flags for day 1, week 1, first paycheck, month 1, and day 60, coached by a manager, reaching autonomy at the top.](assets/images/staffing/onboarding-ramp-milestones.jpeg)\n**Figure 3:** *The first 90 days as a deliberate ramp: milestone check-ins, a coaching plan, and earned autonomy at the top.*\n\n## What This Means in Practice\n\n| What this principle says | What it does **not** say |\n| --- | --- |\n| The hiring manager owns recruiting, interviewing, onboarding, and promotion. | HR is irrelevant — it owns process and compliance, and I rely on it. |\n| Hire competent people of character; coach them into an extraordinary team. | Lower the bar — competence and character *is* the bar, held high. |\n| Recruit continuously, before openings exist. | Every coffee chat is a covert interview; relationships are long-term and honest. |\n| Close strong candidates within 24–48 hours. | Skip the reference checks — I do them personally, and fast. |\n| Deliberate onboarding with milestone check-ins and a bootcamp. | New hires are fragile — the ramp exists to *earn* autonomy quickly. |\n| Act decisively on toxic behavior, whatever the person's skills. | Every performance problem is toxicity — hiring mistakes get coaching and time. |\n\nConcretely: no product role is opened without me knowing who might fill it; interview teams are curated, each interviewer knowing exactly what they evaluate; offers move in days, not weeks; every new product person gets milestone check-ins and a coaching plan; and my operating rhythm — weekly recruiting time and 1:1s, monthly pipeline and retention reviews, quarterly team-strength audits — keeps staffing continuous instead of episodic.\n\n## Anti-Patterns\n\n- **Staffing as req-filling.** Filing the opening, waiting passively for HR sourcing, and calling the result a team.\n- **The unicorn vigil.** Holding a role open for months waiting for the perfect résumé while the team absorbs the gap.\n- **Pedigree worship.** Optimizing for brand-name employers and domain trivia over demonstrated product competence and character.\n- **The brilliant jerk exemption.** Letting strong skills excuse behavior that corrodes the team's trust and psychological safety.\n- **\"Cultural fit\" as a veto.** Using vague fit language to reject people who merely think differently from the current team.\n- **Orientation-as-onboarding.** A laptop, a login, a generic HR deck — then surprise at a slow ramp and a struggling hire.\n- **The annual ambush.** Saving hard feedback for the review cycle instead of the weekly 1:1, then acting shocked by the reaction.\n- **Slow-motion closing.** Taking two weeks to decide on a strong candidate and losing them to an organization that took two days.\n\n## Related Records\n\n- [Coaching](coaching.html) — staffing hands every new hire into the coaching practice; the hiring commitment I make is a coaching commitment.\n- [The Right Team](right-team.html) — the shape and composition of the product team this record staffs.\n- [Hiring](../grounded-engineering-executive/hiring.html) — the engineering executive's hiring role; the same seriousness, a different chair.\n- [Engineering Onboarding](../grounded-engineering-executive/engineering-onboarding.html) — the engineering counterpart of the deliberate ramp; the milestone logic is shared.\n\n## Scope and Revisiting\n\nThis principle governs how I staff product teams: the hiring standard, recruiting, interviewing, closing, onboarding, feedback, performance action, promotion, and retention. I revisit it whenever a role stays open past a quarter, whenever a new hire is struggling at the 90-day mark, and whenever regrettable attrition clusters under one manager — including me. The operating rhythm self-enforces: weekly, monthly, and quarterly reviews are part of the checklist.\n\n## Authoritative References\n\n- Marty Cagan with Chris Jones, *EMPOWERED: Ordinary People, Extraordinary Products* (Wiley, 2020) — the staffing chapters this record's checklist distills.\n- Much of the book's material began as essays by the authors and their SVPG partners, freely available at [svpg.com](https://www.svpg.com/).\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "6 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this principle. The Article tab carries the rationale, implications, and anti-patterns.*\n\n## One-Line Principle\n\n- [ ] Hire competent people of character, onboard them deeply, coach them continuously, promote them thoughtfully, and act quickly when performance or behavior threatens the team.\n\n## 1. Define the Hiring Standard\n\n- [ ] Hire for **competence and character**.\n- [ ] Avoid over-indexing on vague \"cultural fit.\"\n- [ ] Look for people who think differently from the current team.\n- [ ] Reject brilliant-but-toxic candidates.\n- [ ] Value integrity, intent, humility, and trustworthiness.\n- [ ] Remember that strong teams are built from **competent people of character**.\n\n## 2. Own Staffing as a Manager Responsibility\n\n- [ ] Treat staffing as one of the manager's most important jobs.\n- [ ] Do not outsource ownership of staffing to HR.\n- [ ] Personally drive recruiting, interviewing, hiring, onboarding, development, and promotion.\n- [ ] Treat staffing as a continuous responsibility, not a one-time hiring event.\n\n## 3. Recruit Actively\n\n- [ ] Build a network of candidates before openings exist.\n- [ ] Recruit continuously through referrals, events, meetups, conferences, partners, and personal outreach.\n- [ ] Look for talent inside the company, not just outside.\n- [ ] Use recruiting as a way to improve diversity of thought and background.\n- [ ] Invest time in long-term candidate relationships.\n- [ ] Make recruiting a standing priority.\n\n## 4. Avoid Staffing Anti-Patterns\n\n- [ ] Do not equate staffing with just filling reqs.\n- [ ] Do not rely passively on HR sourcing.\n- [ ] Do not optimize for pedigree, prestige, or brand-name employers.\n- [ ] Do not overvalue domain experience at the expense of product ability.\n- [ ] Do not confuse individual star power with team effectiveness.\n- [ ] Do not outsource core product work that should remain a core competency.\n\n## 5. Prepare the Interview Process\n\n- [ ] Curate the interview team carefully.\n- [ ] Choose interviewers based on both competence and character.\n- [ ] Ensure each interviewer knows exactly what they are evaluating.\n- [ ] Keep the hiring bar high for product managers, designers, and tech leads.\n- [ ] Distinguish clearly between hiring for current competence and hiring for potential.\n- [ ] Make sure unresolved questions get answered before the process ends.\n\n## 6. Evaluate Candidates Well\n\n- [ ] Assess demonstrated competence.\n- [ ] Assess character, integrity, and trustworthiness.\n- [ ] Look for coachability and self-awareness.\n- [ ] Value diversity of perspective and experience.\n- [ ] Avoid using \"cultural fit\" as a catch-all rejection filter.\n- [ ] Be careful not to overvalue domain knowledge.\n- [ ] Watch for toxic behavior hidden behind strong credentials.\n\n## 7. Close Strong Candidates Quickly\n\n- [ ] Move quickly once you identify a strong candidate.\n- [ ] Try to make an offer within **24–48 hours**.\n- [ ] Conduct reference checks personally.\n- [ ] Ask references whether they would hire the person again.\n- [ ] Look for signs of disrespectful or toxic behavior.\n- [ ] Personally communicate your commitment to coaching and development.\n\n## 8. Set the Right Management Span\n\n- [ ] Keep the span of control realistic for coaching-heavy roles.\n- [ ] Reduce the span when employees are inexperienced.\n- [ ] Reduce the span when managers are inexperienced.\n- [ ] Account for operational load and organizational complexity.\n- [ ] Make sure managers have enough time to coach well.\n\n## 9. Support Remote Employees Deliberately\n\n- [ ] Protect discovery collaboration between PM, design, and tech.\n- [ ] Avoid replacing collaboration with waterfall-style artifacts.\n- [ ] Use prototypes as the primary discovery artifact.\n- [ ] Handle sensitive issues over video rather than chat.\n- [ ] Explicitly build and maintain trust.\n- [ ] Be flexible about people's time constraints and working situations.\n\n## 10. Onboard Intentionally\n\n- [ ] Treat the first **90 days** as critical.\n- [ ] Check in at key milestones:\n  - [ ] End of first day.\n  - [ ] End of first week.\n  - [ ] After the first paycheck.\n  - [ ] After the first month.\n  - [ ] After the first 60 days.\n- [ ] Establish trust early.\n- [ ] Assess strengths and gaps.\n- [ ] Create a coaching plan.\n- [ ] Build relationships with team, leaders, and stakeholders.\n- [ ] Expose the new hire to customers, business context, and key functions.\n- [ ] Monitor stakeholder feedback over the first several months.\n\n## 11. Run a Strong New Employee Bootcamp\n\n- [ ] Go beyond generic orientation.\n- [ ] Ensure new product people quickly learn:\n  - [ ] How decisions are made.\n  - [ ] What matters most to the company now.\n  - [ ] How trust is built in the organization.\n  - [ ] What are the most important priorities.\n- [ ] Consider a structured first-week bootcamp.\n- [ ] Include personal growth, communication, and self-awareness work.\n- [ ] Teach strategic context, not just process.\n- [ ] Cover core company-specific topics such as:\n  - [ ] Customer understanding.\n  - [ ] Company history and context.\n  - [ ] Vision.\n  - [ ] Financial model.\n  - [ ] Customer discovery.\n  - [ ] Validation.\n  - [ ] Prioritization.\n  - [ ] Measurement.\n  - [ ] Go-to-market.\n- [ ] Bring in experienced product people to share real stories and context.\n- [ ] Include practical workshops where new hires apply what they learned.\n- [ ] Create a safe space to practice with their future teammates.\n- [ ] Reinforce that the goal is not to tell smart people what to do, but to equip them to solve problems well.\n\n## 12. Use Performance Reviews Correctly\n\n- [ ] Treat annual reviews as compliance/admin, not your main feedback mechanism.\n- [ ] Use weekly 1:1s as the primary feedback tool.\n- [ ] Make sure there are no performance surprises in annual reviews.\n- [ ] Give honest, timely, constructive feedback throughout the year.\n- [ ] Do not avoid hard feedback because of discomfort or conflict aversion.\n- [ ] Make performance expectations unmistakably clear.\n- [ ] Hold managers accountable if they fail to surface issues early.\n- [ ] Remember that the primary purpose of the 1:1 is for the employee.\n\n## 13. Address Performance Problems Responsibly\n\n- [ ] Recognize that avoiding termination starts with better recruiting, hiring, onboarding, and coaching.\n- [ ] Balance compassion with responsibility and prompt action.\n- [ ] Consider the impact of poor performance on:\n  - [ ] The team.\n  - [ ] The product organization.\n  - [ ] Stakeholders.\n  - [ ] Company culture.\n- [ ] Work with HR on compliance, but own the judgment and leadership.\n- [ ] Distinguish between:\n  - [ ] A hiring mistake/competence issue.\n  - [ ] A toxic behavior issue.\n- [ ] For competence problems:\n  - [ ] Provide clear coaching.\n  - [ ] Share concerns with increasing clarity and urgency.\n  - [ ] Give a reasonable period to improve.\n  - [ ] Help the person find a better-fitting role when appropriate.\n- [ ] For toxic behavior problems:\n  - [ ] Protect the team's trust and psychological safety.\n  - [ ] Determine whether the issue is temporary or chronic.\n  - [ ] Do not let strong skills excuse damaging behavior.\n  - [ ] Act decisively if the behavior persists.\n\n## 14. Promote People Deliberately\n\n- [ ] Treat promotion as a major responsibility of management.\n- [ ] Understand each employee's career aspirations.\n- [ ] Discuss both individual contributor and leadership paths.\n- [ ] Assess current skills against the next role's requirements.\n- [ ] Identify gaps clearly.\n- [ ] Create a plan for learning and demonstrating those skills.\n- [ ] Use employee self-assessment alongside manager assessment.\n- [ ] Help people get ready before openings appear.\n- [ ] Advocate strongly once someone is genuinely ready.\n- [ ] Be explicit that promotions may require broader approval and timing.\n- [ ] Be especially careful when promoting an IC into management, since it is a different job, not just a senior version of the same one.\n\n## 15. Retain Strong People\n\n- [ ] Remember that people often leave managers, not companies.\n- [ ] Watch for regrettable attrition as a signal of management problems.\n- [ ] Run exit interviews, especially for strong people you did not want to lose.\n- [ ] Look for patterns in why strong people leave.\n- [ ] Build a reputation as a manager who coaches and develops people.\n- [ ] Recognize that great managers often attract internal transfers because people want to work for them.\n\n## 16. Develop Future Talent\n\n- [ ] Identify high-potential people early.\n- [ ] Consider an APM or similar development program.\n- [ ] Only run such a program if you have leaders capable of serious coaching.\n- [ ] Admit only genuinely high-potential candidates.\n- [ ] Create individualized development plans.\n- [ ] Use structured coaching over **1–2 years**.\n- [ ] Use talent development to strengthen long-term bench strength and diversity.\n\n## Manager Operating Rhythm\n\n### Weekly\n\n- [ ] Spend real time recruiting.\n- [ ] Run high-quality 1:1s.\n- [ ] Give direct feedback.\n- [ ] Check the progress of newer hires.\n- [ ] Watch for trust, morale, and team health issues.\n\n### Monthly\n\n- [ ] Review your recruiting pipeline.\n- [ ] Review top performers' development and promotion readiness.\n- [ ] Review struggling employees and coaching plans.\n- [ ] Check retention risks.\n- [ ] Reassess whether your org structure and span of control support coaching.\n\n### Quarterly\n\n- [ ] Review whether the team is getting stronger.\n- [ ] Evaluate whether onboarding is working.\n- [ ] Revisit succession and talent-development plans.\n- [ ] Identify any toxic behaviors or performance issues being tolerated too long.\n- [ ] Audit whether managers are actually giving timely feedback.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Extraordinary teams from ordinary people — why the hiring manager owns staffing, in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned product-minded executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. MILA: an energetic young product manager, dark hair in a ponytail, denim jacket over a striped shirt, carries a tablet covered in sticky notes.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Mila slumps at her desk beside a calendar with four crossed-out months and an empty chair labeled open role.](assets/images/staffing/comic-01-waiting-for-unicorn.jpeg)\n**Panel 1:** *The hook: four months of waiting for HR to deliver a unicorn.*\n\n![Vera and Mila look at a sparse HR conveyor belt of resumes next to an empty pedestal labeled the perfect candidate.](assets/images/staffing/comic-02-outsourced-funnel.jpeg)\n**Panel 2:** *The problem: staffing outsourced to a funnel, the bar turned into a myth.*\n\n![Vera hands Mila a clipboard listing recruit, interview, onboard, develop, promote.](assets/images/staffing/comic-03-manager-owns-staffing.jpeg)\n**Panel 3:** *The principle: the hiring manager owns staffing — ordinary people, extraordinary teams.*\n\n![Mila talks with people at a meetup while her tablet shows a growing list of candidate names.](assets/images/staffing/comic-04-always-recruiting.jpeg)\n**Panel 4:** *Recruiting as ongoing work: build the network before the opening exists.*\n\n![Mila interviews a candidate beside a scorecard with competence and character checked, a pedigree sheet crumpled in the bin.](assets/images/staffing/comic-05-competence-and-character.jpeg)\n**Panel 5:** *The bar: competence and character — pedigree goes in the bin.*\n\n![Mila welcomes a new hire in front of a 90-day milestone board, holding a coaching plan folder.](assets/images/staffing/comic-06-deliberate-onboarding.jpeg)\n**Panel 6:** *Deliberate onboarding: the first 90 days are planned, not improvised.*\n\n![A new hire presents confidently at the top of a ramp while Mila steps back and Vera nods from the doorway.](assets/images/staffing/comic-07-ramp-to-autonomy.jpeg)\n**Panel 7:** *The ramp to autonomy: coach deeply early, then step back.*\n\n![Vera and Mila stand in front of a smiling diverse product team as Vera closes her notebook.](assets/images/staffing/comic-08-extraordinary-team.jpeg)\n**Panel 8:** *The closer: no unicorns — ordinary people, staffed seriously.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
