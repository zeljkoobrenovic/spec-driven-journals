<script id="data" type="application/json">{"meta": {"id": "PM-BUSINESS-COLLABORATION", "status": "draft:gray", "title": "Business Collaboration", "date": "2026-07-27", "author": "Željko Obrenović", "permalink": "business-collaboration", "timetoread": "8 min", "excerpt": "I run product's relationship with the business as a partnership of equals — not a ticket-taking service to stakeholders, and not an ivory tower above them. Strong product leaders and empowered teams are necessary but not sufficient: product succeeds inside a company context where the CEO, executives, and peers matter. Partnership is earned — by understanding the business's constraints, sharing context openly, evangelizing the vision, and keeping the commitments we make.", "tags": "product management, stakeholders, collaboration, trust, evangelism", "icon": "assets/icons/business-collaboration.png", "logo": "assets/images/business-collaboration/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["product management", "stakeholders", "collaboration", "trust", "evangelism"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: I run product's relationship with the wider business as a partnership of equals: not a ticket-taking service to stakeholders, and not an ivory tower above them. Strong product leaders and empowered teams are necessary but not sufficient — product work happens inside a company context where the CEO, executives, and peers across sales, marketing, finance, and support genuinely matter. So product earns its empowerment: by understanding the business's constraints, sharing context openly, evangelizing the vision, and keeping the commitments it makes — and I lead the shift to this model as a company-wide transformation, not a team-level preference.\n\n## Statement\n\nFour commitments govern how my product organization works with the rest of the business:\n\n- **Context before posture.** Empowered teams alone do not make product succeed. The company around them — its executives, its go-to-market machinery, its constraints — decides whether product work lands. I never let the product organization pretend otherwise.\n- **Relationships, not \"stakeholder management.\"** I retire that term deliberately. Peers across the business are worked *with*, not managed around product. The relationships are built before they are needed, with sensitivity for what each function carries.\n- **Collaboration as the default.** The working model moves from subservient (tickets in, features out) to collaborative (shared problems, shared solutions). Feature-team dynamics are recognized and named as the thing we are moving away from.\n- **Transformation, led and reinforced.** Executives have to change how they see product teams — from an internal agency to teams of ordinary people doing extraordinary work. That is a significant company-wide change, and I treat it as one: discussed openly, guided deliberately, reinforced over time.\n\n![Three scenes comparing product postures toward the business: buried in tickets, isolated on an ivory tower, and jointly working at one table, with partnership highlighted.](assets/images/business-collaboration/three-postures.jpeg)\n**Figure 1:** *Three postures toward the business: servitude and arrogance both fail — partnership is the only durable one.*\n\n## How to Read This\n\nThis journal is the product-management counterpart to my engineering-executive journal, and this record is grounded in the business-collaboration material of Cagan and Jones's *EMPOWERED*, read through a practitioner-executive lens. It is the product side of a table I also sit at from the other seat — the engineering journal's [Working with Your CEO, Peers, and Engineering](../grounded-engineering-executive/working-with-your-ceo-peers-and-engineering.html) covers the executive's view of the same relationships. How objectives get negotiated inside this relationship is [Team Objectives](team-objectives.html)'s territory; this record is about the relationship itself. The working checklist lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**Necessary but not sufficient.** The empowered-team model concentrates on what happens inside product: real ownership, real discovery, real accountability. All of it can be in place and product can still fail — because the CEO does not trust the model, sales makes commitments nobody scoped, or finance sees product as a cost center. Product work happens within the broader company context, and pretending the context away is how strong product organizations get quietly dismantled.\n\n**\"Stakeholder management\" is the wrong frame, and the words matter.** The term casts peers as obstacles to be handled — people around product rather than people product works with. Vocabulary shapes posture: an organization that \"manages stakeholders\" drifts into either servitude (appease them) or arrogance (neutralize them). I use the language of partnership because I want the behavior of partnership: understanding what each function is carrying, and solving shared problems together.\n\n![Diagram of four deposit streams — understanding constraints, sharing context, evangelizing, keeping commitments — filling a trust ledger that pays out empowerment to a product team.](assets/images/business-collaboration/trust-ledger.jpeg)\n**Figure 2:** *Partnership is earned: four kinds of deposits fill the trust that empowerment draws on.*\n\n**The collaborative model has to be earned, not declared.** Moving from feature teams to empowered teams asks the business to give up a familiar control: the ticket queue. Nobody gives that up for a slide deck. They give it up when product demonstrably makes the four moves above — in practice, not on slides. Every kept commitment is a deposit; every surprise is a withdrawal. Empowerment is what the balance buys.\n\n**Executive confidence has to be built, and it matters most.** The deepest shift is in how senior leaders see product teams: not as an internal agency executing their ideas, but as teams of ordinary people doing extraordinary work on problems that matter. That confidence has to be built — with results, with transparency, and with leaders prepared for what the shift means for their own roles. Until it is built, every stumble reopens the case for command-and-control.\n\n**It is a transformation, and transformations are led.** A collaborative product model is a company-wide change in mindset and responsibilities — for product, for the functions around it, and for the executive team. I treat it accordingly: named as a change, discussed in terms of what it asks from the rest of the business, and reinforced long after the kickoff enthusiasm fades. A model reinforced only once is a model abandoned quietly.\n\n![Before-and-after diagram: a one-way ticket conveyor from business to product above, a two-way collaborative loop of problems and solutions below, bridged by executive mindset change.](assets/images/business-collaboration/subservient-to-collaborative.jpeg)\n**Figure 3:** *The model shift: from one-way ticket delivery to a two-way loop — crossed over the bridge of executive mindset.*\n\n## What This Means in Practice\n\n| What this principle says | What it does **not** say |\n| --- | --- |\n| Product works *with* peers across the business. | Product takes orders from them — the subservient model is explicitly retired. |\n| Empowered teams are necessary but not sufficient. | The company context excuses weak product work — both are required. |\n| Partnership includes sharing context and evangelizing. | Partnership means consensus — product still says no, with context. |\n| Commitments product makes are kept. | Product commits to everything asked — commitments are few and deliberate. |\n| The shift is led as a company-wide transformation. | The shift is a product-internal reorganization nobody else needs to notice. |\n\n## Anti-Patterns\n\n- **The ticket-taking service.** Product as an internal agency: requests in, features out, no discovery, no ownership — the servitude posture that feature teams normalize.\n- **The ivory tower.** Product so protective of its empowerment that it stops listening — treating every business request as an intrusion. Arrogance loses the same trust servitude never earns.\n- **\"Stakeholder management\" theater.** RACI grids and influence maps replacing actual relationships — managing around people instead of working with them.\n- **Declared empowerment.** Announcing the empowered-team model without earning it — no kept commitments, no shared context — and being surprised when the business quietly rebuilds the ticket queue.\n- **Kickoff-only transformation.** Launching the collaborative model once and never reinforcing it, so the organization reverts the first time a quarter goes badly.\n\n## Related Records\n\n- [Working with Your CEO, Peers, and Engineering](../grounded-engineering-executive/working-with-your-ceo-peers-and-engineering.html) — the same table, seen from the executive's seat in the engineering journal.\n- [Team Objectives](team-objectives.html) — how objectives are negotiated inside this relationship.\n- [The Right Processes](right-processes.html) — the product processes the collaboration plugs into.\n- [Internal Communication](../grounded-engineering-executive/internal-communication.html) — the communication discipline that sharing context depends on.\n- [Product Dysfunctions](dysfunctions.html) — the failure patterns that the subservient model breeds.\n\n## Scope and Revisiting\n\nThis principle governs how my product organization engages sales, marketing, finance, legal, support, and the executive team. I revisit it when the trust balance visibly drops — commitments missed, context hoarded, the ticket queue reappearing — and whenever a leadership change resets the executive mindset the model depends on.\n\n## Authoritative References\n\n- Marty Cagan with Chris Jones, *EMPOWERED: Ordinary People, Extraordinary Products* (Wiley, 2020) — the business-collaboration material this record's checklist distills.\n- The authors' companion essays at [svpg.com](https://www.svpg.com/).\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "2 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this principle. The Article tab carries the rationale, implications, and anti-patterns.*\n\n## Understand the Context\n\n- [ ] Recognize that strong product leaders and empowered product teams are necessary, but not sufficient.\n- [ ] Acknowledge that product work happens within the broader company context.\n- [ ] Understand that the CEO, executives, and other stakeholders matter to product success.\n\n## Build Cross-Business Relationships\n\n- [ ] Identify the key stakeholders outside the product.\n- [ ] Establish strong working relationships with the rest of the business.\n- [ ] Approach those relationships with sensitivity and nuance.\n  - [ ] Avoid using the term **\"stakeholder management.\"**\n  - [ ] Explain that this is not about *managing* people around product, but about working *with* peers across the business in a collaborative way.\n\n## Shift the Team Model\n\n- [ ] Recognize when the company is still operating with feature teams.\n- [ ] Help the organization transition toward empowered product teams.\n- [ ] Keep the focus on serving customers in ways that also work for the business.\n\n## Change How the Product Works with the Business\n\n- [ ] Move from a subservient model to a collaborative model.\n- [ ] Encourage shared problem-solving instead of top-down feature delivery.\n- [ ] Reinforce collaboration as the default way of working.\n\n## Support Executive Mindset Change\n\n- [ ] Help senior executives rethink how they view product teams.\n- [ ] Build confidence in teams made up of ordinary individuals doing extraordinary work together.\n- [ ] Prepare leaders for the organizational implications of this shift.\n\n## Lead the Transformation\n\n- [ ] Recognize that this is a significant company-wide change.\n- [ ] Discuss how the change affects the rest of the business.\n- [ ] Guide the company through changes in mindset and responsibilities.\n- [ ] Continue reinforcing the new collaborative model over time.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Partnership of equals — how product earns its seat beside the business, in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned product-minded executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. MILA: an energetic young product manager, dark hair in a ponytail, denim jacket over a striped shirt, carries a tablet covered in sticky notes.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Mila squeezed between business figures throwing tickets over a wall and her own team holding an 'ignore them' sign.](assets/images/business-collaboration/comic-01-caught-between.jpeg)\n**Panel 1:** *The hook: caught between taking every ticket and taking none.*\n\n![Comic panel: split scene of a product team buried in ticket crates and another isolated in an ivory tower as business figures walk away, Vera shaking her head.](assets/images/business-collaboration/comic-02-both-lose.jpeg)\n**Panel 2:** *The problem: servitude and arrogance both lose — just differently.*\n\n![Comic panel: Vera sets a round table where Mila and a business peer sit with one shared problem card between them.](assets/images/business-collaboration/comic-03-partnership.jpeg)\n**Panel 3:** *The principle: a partnership of equals — the term 'stakeholder management' gets retired.*\n\n![Comic panel: Mila listens at a salesperson's desk as they point to a quota chart and contract stack, taking notes.](assets/images/business-collaboration/comic-04-understand-constraints.jpeg)\n**Panel 4:** *First deposit: understand what each function is actually carrying.*\n\n![Comic panel: Mila presents an open vision board with a lighthouse motif to business colleagues who lean in and nod.](assets/images/business-collaboration/comic-05-share-and-evangelize.jpeg)\n**Panel 5:** *Second and third deposits: share the context, evangelize the destination.*\n\n![Comic panel: Mila delivers a finished box to a business peer on the circled calendar date while a wall trust-meter ticks upward.](assets/images/business-collaboration/comic-06-keep-commitments.jpeg)\n**Panel 6:** *Fourth deposit: rare commitments, always kept.*\n\n![Comic panel: Vera shows an executive Mila's team at work through glass while the executive drops ticket cards into a wastebasket.](assets/images/business-collaboration/comic-07-executives-shift.jpeg)\n**Panel 7:** *The hard part: executives trading the ticket queue for trust.*\n\n![Comic panel: close-up of Mila's and a business peer's hands jointly turning one gear made of two interlocking halves.](assets/images/business-collaboration/comic-08-one-system.jpeg)\n**Panel 8:** *The closer: one system, kept turning by both sides.*\n"}]}]}</script>

    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
