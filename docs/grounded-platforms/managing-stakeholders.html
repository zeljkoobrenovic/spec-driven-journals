<script id="data" type="application/json">{"meta": {"id": "PLT-MANAGING-STAKEHOLDERS", "status": "draft:gray", "title": "Managing Platform Stakeholders", "date": "2026-08-12", "author": "Željko Obrenović", "permalink": "managing-stakeholders", "timetoread": "7 min", "excerpt": "A platform's stakeholders decide its budget, its mandate, and its survival in a downturn, so I treat stakeholder management as first-order platform leadership work. I map stakeholders by power and interest and spend relationship time where it matters, build trust before any crisis, and communicate in business impact rather than engineering detail. Every commitment gets captured and closed out, every request gets a structured yes-with-compromises or a no that preserves the relationship, and I arrive at budget season with my own cut proposal rather than waiting for one to be chosen for me.", "tags": "platform engineering, stakeholder management, communication, prioritization, shadow platforms, budget, trust", "icon": "assets/icons/managing-stakeholders.png", "logo": "assets/images/managing-stakeholders/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["platform engineering", "stakeholder management", "communication", "prioritization", "shadow platforms", "budget", "trust"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: A platform lives or dies by its stakeholders — they set its budget, its mandate, and its odds of surviving a difficult quarter — so I manage those relationships as deliberately as I manage the platform itself. I map stakeholders by power and interest and invest relationship time accordingly; I build trust before a crisis, not during one. I communicate in outcomes, risks, and business impact rather than engineering detail, capture every commitment and close every loop, and answer requests with either a yes shaped by explicit compromises or a no that keeps the relationship intact. And I prepare for budget pressure in the calm: I can always say what I would protect, reduce, or stop — before anyone asks.\n\n## Statement\n\nMy operating model for stakeholder management as a platform leader has five disciplines.\n\n**Map before you invest:**\n\n- **Know who can affect your success.** I identify the stakeholders who materially affect the platform's fate and place them on a power–interest grid: manage closely (high/high), keep satisfied (high power, low interest), keep informed (low power, high interest), monitor (low/low).\n- **Read the informal map too.** Who has the ear of senior leadership, which teams are considered indispensable, who is loudest and most respected — and how much it would matter if any of them strongly disliked my team.\n- **Revisit the map.** Priorities and relationships shift; a stale map is a wrong map.\n\n![Two-by-two power–interest grid with four quadrants: manage closely, keep satisfied, keep informed, monitor.](assets/images/managing-stakeholders/power-interest-grid.jpeg)\n**Figure 1:** *The power–interest grid: four postures, one scarce resource — relationship time flows to the high-power, high-interest quadrant.*\n\n**Invest in relationships before you need them:**\n\n- **Spend the most time on high-power, high-interest stakeholders**, and build the relationship before a crisis or escalation — not during one.\n- **Understand their world.** Each stakeholder's goals, pressures, incentives, and concerns. Disagreement is usually a difference in perspective, not \"politics\"; they are optimizing for a different part of the business.\n- **React to patterns, not to every complaint.**\n\n**Communicate at the right altitude:**\n\n- **Decide the takeaway first**, then lead with outcomes, impact, risks, decisions, and next steps. Detail on request, adjusted to the audience.\n- **Make business impact visible** rather than assuming it is understood — and never rely on engineering detail to fix a trust problem.\n- **Scale the channel to the quadrant.** Roughly monthly 1:1s for manage-closely stakeholders, quarterly for keep-satisfied and keep-informed; an interlock forum or advisory board when individual 1:1s stop scaling. Turn communication up when reliability, delivery, cost, or confidence deteriorates — and keep it up until the rough patch has genuinely passed.\n\n**Track every commitment:**\n\n- **Capture agreements** in private notes and short written follow-ups that invite correction.\n- **Review outstanding commitments** regularly and close the loop when work completes, slips, or changes. No promise lives only in the air.\n\n**Answer requests and pressure with structure:**\n\n- **Yes, with compromises** — a smaller first version, limited scope, negotiated timing, contributed engineering effort, explicit boundaries of what is and is not included.\n- **No, without damage** — distinguish no from not yet, explain the constraint in the stakeholder's terms, offer alternatives, and escalate for backup when I lack the authority to hold the line.\n- **Shadow platforms get diagnosed, not fought** — they are signals of unmet need, urgency, or broken collaboration; sometimes partnership, sometimes absorption, sometimes cleanup.\n- **Budget pressure gets prepared for in advance** — work grouped into team-sized chunks, platform work connected to protected business outcomes, and my own cost-cutting proposal ready before executives make one for me.\n\n## How to Read This\n\nThis journal is my platform operating model, one record per source checklist. This record is grounded in the \"Managing Stakeholders\" chapter of Camille Fournier and Ian Nowland's *Platform Engineering: A Guide for Technical, Product, and People Leaders* (O'Reilly, 2024) — the chapter on how platform leaders build, maintain, and defend the relationships their platform depends on, distilled here into **the five disciplines I hold every platform leader to**. The runnable version — the mapping steps, the communication and commitment practices, and the relationship health check — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**Stakeholders decide things about the platform that the platform cannot decide for itself.** A platform team does not set its own budget, grant its own mandate, or vote on its own survival in a downturn. Those decisions are made by people outside the team, based on what they believe about it. Fournier and Nowland's blunt framing: it matters enormously whether your team is considered indispensable or \"nice to have,\" and whether a powerful stakeholder strongly dislikes you. Managing those beliefs deliberately is not a distraction from platform work — **it is the part of platform work that keeps the rest funded**.\n\n**The power–interest grid exists because relationship time is scarce.** An earnest leader tries to keep every stakeholder equally happy and ends up with a meeting cadence that cannot scale and no deep relationships anywhere. The grid is a prioritization tool: manage the high-power, high-interest stakeholders closely; keep the others satisfied, informed, or merely monitored. It also has to be redrawn — reorganizations and shifting priorities move people between quadrants, and **relationship time allocated by last year's map is misallocated**.\n\n**Trust is built in the calm and spent in the storm.** The moment you need a stakeholder's goodwill — an escalation, an incident, a budget review — is precisely the moment you can no longer build it. That asymmetry runs through the whole chapter: build relationships before the crisis, capture commitments before the misunderstanding, connect work to business outcomes before the downturn, know your own cuts before the CFO proposes theirs. Every discipline in this record is **cheap when things are calm and decisive when they are not**.\n\n![Timeline diagram showing trust deposits made during calm periods being drawn down during escalations, incidents, and budget reviews.](assets/images/managing-stakeholders/built-in-calm-spent-in-storm.jpeg)\n**Figure 2:** *The asymmetry behind every discipline in this record: deposits are only possible in the calm; withdrawals all happen in the storm.*\n\n**Business framing is the only framing that lands.** Stakeholders do not distrust a platform because they lack architecture diagrams, and no quantity of engineering detail repairs a relationship problem. What they need is the takeaway: outcomes, impact, risks, decisions, next steps — with detail available on request rather than delivered by default. Over-communication has the same failure mode as silence: **when everything is sent, the important signal is lost**, and a stakeholder drowning in operational detail is being invited to micromanage.\n\n**A structured no protects the relationship better than a soft yes.** The instinct under stakeholder pressure is to say yes to everything and become a feature factory, or to say no defensively and become a fortress. Both destroy trust. The chapter's alternative is structure: first understand the underlying business need — without assuming the existing roadmap is automatically right — then look for the compromise that serves it (smaller first version, later timing, contributed effort), and when the answer is genuinely no, say whether it is *no* or *not yet*, explain the constraint in the stakeholder's terms, and offer an alternative. A no delivered that way is a **disagreement about priorities, not a rejection of the person** — and it survives.\n\n![Decision-flow diagram: a request passes through understanding the business need, then branches into yes with compromises, not yet, or no with an alternative.](assets/images/managing-stakeholders/structured-request-flow.jpeg)\n**Figure 3:** *Every request takes the same path: understand the underlying need first, then a yes shaped by compromises, an honest not-yet, or a no with an alternative — never the vending machine, never the fortress.*\n\n**Shadow platforms are feedback, not treason.** When another team builds its own solution, something drove it: urgency my platform could not meet, novel demand, poor collaboration, cost disagreement, or engineers who simply want to build. Each driver has a different right response — partner, learn, absorb, or occasionally clean up — and none of them is reflexive suppression. A leader who treats every shadow platform as a turf violation **loses the early-warning signal and the relationship in one move**.\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| Map stakeholders by power and interest, and spend relationship time accordingly. | Treat every stakeholder identically — even-handedness is not the same as equal time. |\n| Build relationships before crises and escalations. | Relationship-building is politics — understanding another leader's incentives is the job, not a game. |\n| Lead with outcomes, impact, risks, and next steps; detail on request. | Hide problems behind a polished summary — during rough patches, transparency goes **up**, not down. |\n| Capture every commitment and close every loop. | Bureaucratize every conversation — a private note and a short follow-up are enough. |\n| Say yes with explicit compromises when the value justifies it. | Say yes to everything — a platform that never says no is a feature factory with no strategy. |\n| Say no (or not yet) with reasons in the stakeholder's terms, plus alternatives. | Dress a technical impossibility up as a prioritization choice — infeasible means saying so. |\n| Arrive at budget discussions with your own cut proposal. | Defend every project equally — that reads as not understanding the seriousness of the situation. |\n\nConcretely: for every important stakeholder I can name what they care about, when we last spoke, and what I currently owe them. Commitments live in writing, not in memory. And at any moment — not just in budget season — I can answer the question **\"what would you protect, reduce, or stop if the budget tightened tomorrow?\"**\n\n## Anti-Patterns\n\n- **The escalation-day introduction.** Meeting a powerful stakeholder for the first time in the meeting where they are already angry — the relationship needed to defuse the escalation was never built.\n- **The flat cadence.** Identical 1:1s with every stakeholder regardless of power or interest, until the calendar collapses and the important relationships get the same scraps as the unimportant ones.\n- **The firehose update.** Sending everything to everyone so that nobody can find the signal — and mistaking that volume for transparency.\n- **Engineering detail as trust repair.** Answering a confidence problem with an architecture deep-dive; the stakeholder needed outcomes and owners, not diagrams.\n- **The uncaptured promise.** A corridor \"we'll look into it\" that the stakeholder remembers as a commitment and the team never heard about.\n- **The soft yes.** Accepting every request to avoid conflict, then failing to deliver on the accumulated pile — converting short-term comfort into long-term distrust.\n- **The disguised no.** Framing a technically infeasible request as \"not prioritized this quarter,\" buying a fight that will simply return next quarter.\n- **Turf war with shadow platforms.** Fighting a competing system as insubordination instead of asking what unmet need created it.\n- **Budget-season passivity.** Walking into a cost review with a roadmap and hope, waiting for executives to choose the cuts — and losing the work that mattered most.\n\n## Related Records\n\n- [Platform as a Product](platform-as-a-product.html) — the product discipline that generates the roadmap this record defends and renegotiates with stakeholders.\n- [Planning and Delivery](planning-and-delivery.html) — the planning mechanics behind the commitments I capture and the trade-offs I explain in business terms.\n- [What Platform Success Looks Like](platform-success.html) — trusted is one of its four success dimensions; this record is the relationship work that earns and keeps that trust.\n- [Operating Platforms](operating-platforms.html) — operational rough patches are the moments this record's turn-up-the-communication discipline is written for.\n- [What Is Platform Engineering](what-is-platform-engineering.html) — why platforms exist at all; the business framing stakeholders need starts from that purpose.\n\n## Scope and Revisiting\n\nThis record is `draft`. It applies to every platform leader in my organization who owns stakeholder relationships — engineering and product alike — and to me in the stakeholder conversations I hold personally. I revisit it if an escalation reaches senior leadership from a stakeholder we had no active relationship with, if commitments keep surfacing that nobody captured, or if a budget cycle catches us without a defensible view of what to protect, reduce, or stop.\n\n## Authoritative References\n\n- Camille Fournier & Ian Nowland, *Platform Engineering: A Guide for Technical, Product, and People Leaders* (O'Reilly, 2024) — the \"Managing Stakeholders\" chapter, whose checklist this record distills.\n"}]}, {"key": "summary", "label": "TL;DR", "meta": {"timetoread": "2 min read"}, "blocks": [{"type": "markdown", "content": "A platform's stakeholders decide its budget, its mandate, and its survival in a downturn — so I treat stakeholder management as **first-order platform leadership work**, not politics and not something to start when the escalation arrives. The whole record rests on one asymmetry: relationships, commitments, and business framing are built in the calm so they hold in the storm.\n\n**What changes**\n\n* Every platform leader in my organization **maps stakeholders by power and interest** before spending relationship time: manage closely, keep satisfied, keep informed, monitor — and redraws the map as the organization changes, because relationship time allocated by last year's map is misallocated.\n* Communication moves to **business altitude**: takeaway decided first, outcomes, risks, and next steps leading, detail on request. 1:1 cadence scales with the quadrant — roughly monthly for manage-closely, quarterly for the rest — and communication turns **up** during rough patches, until they have genuinely passed.\n* **Every commitment gets captured**: private notes, short written follow-ups that invite correction, regular review of what is outstanding, and a closed loop when work completes, slips, or changes. No promise lives only in the air.\n* Requests get structure instead of reflexes: understand the underlying business need first, then a **yes with explicit compromises** (smaller first version, limited scope, negotiated timing) or a **no that preserves the relationship** — no distinguished from not yet, the constraint explained in the stakeholder's terms, alternatives offered, escalation when I lack the authority to hold the line.\n* Shadow platforms are **diagnosed as signals** of unmet need rather than fought as insubordination, and budget season arrives prepared: work grouped into team-sized chunks, tied to protected business outcomes, with my own cut proposal ready before executives make one for me.\n\n**What it costs**\n\n* Deliberate relationship work in calm periods, exactly when it feels least urgent — the grid exists because that time is scarce and must be spent unevenly.\n* Structured nos and honest not-yets cost short-term comfort; the soft yes is cheaper today and converts into long-term distrust.\n* Budget-defense preparation that may never be used — knowing what I would protect, reduce, or stop before anyone asks.\n\n**What we are not doing**\n\n* Not the product discipline — discovering what customers need and shaping the roadmap is [Platform as a Product](platform-as-a-product.html); this record covers the relationships and negotiations around that roadmap.\n* Not planning mechanics — those live in [Planning and Delivery](planning-and-delivery.html); this record governs how plans are communicated, defended, and renegotiated with the people who fund them.\n* Not a communication style guide — the postures and disciplines are fixed here; templates and update formats remain team choices.\n\n*The Article tab carries the rationale and anti-patterns; the Checklist tab is the runnable version — the mapping steps, the communication and commitment practices, and the relationship health check.*\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "6 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Map Your Stakeholders\n\n- [ ] Identify the stakeholders who can materially affect the team's success\n- [ ] Assess each stakeholder's power within the organization\n- [ ] Assess each stakeholder's interest in the team or platform\n- [ ] Place stakeholders on a power–interest grid:\n  - [ ] High power / high interest: manage closely\n  - [ ] High power / low interest: keep satisfied\n  - [ ] Low power / high interest: keep informed\n  - [ ] Low power / low interest: monitor with minimum effort\n- [ ] Identify who has the ear of the most senior leadership\n- [ ] Determine which teams are considered indispensable versus \"nice to have\"\n- [ ] Identify the loudest and most respected stakeholder groups\n- [ ] Consider how much it would matter if a stakeholder strongly disliked the team\n- [ ] Revisit the map as organizational priorities and relationships change\n\n## 2. Prioritize Relationship-Building\n\n- [ ] Spend the most relationship-management time on high-power, high-interest stakeholders\n- [ ] Build relationships before a crisis or escalation occurs\n- [ ] Understand each stakeholder's goals, pressures, incentives, and concerns\n- [ ] Treat stakeholder disagreements as differences in perspective rather than automatically as \"politics\"\n- [ ] Remember that stakeholders may be optimizing for a different part of the business\n- [ ] Look for patterns across stakeholder complaints instead of reacting to every complaint individually\n\n## 3. Communicate With the Right Level of Transparency\n\n- [ ] Decide the main message stakeholders should take away before communicating\n- [ ] Lead with outcomes, impact, risks, decisions, and next steps\n- [ ] Avoid overwhelming stakeholders with unnecessary technical or operational detail\n- [ ] Provide additional detail when a stakeholder specifically asks for it\n- [ ] Adjust the level of technical detail to the audience\n- [ ] Avoid inviting stakeholders to micromanage the team's day-to-day work\n- [ ] Avoid sending so much information that important signals get lost\n- [ ] Do not rely on engineering detail alone to resolve relationship or trust problems\n- [ ] Make business impact visible rather than assuming stakeholders understand it\n\n## 4. Use 1:1 Meetings Deliberately\n\n- [ ] Use early 1:1s to understand stakeholders' concerns, power, interest, and motivations\n- [ ] Use regular 1:1s primarily with the most important stakeholders\n- [ ] Avoid creating a meeting cadence that cannot scale\n- [ ] Reduce unnecessary 1:1s when the relationship is healthy and little discussion is needed\n- [ ] Consider roughly monthly 1:1s for \"manage closely\" stakeholders\n- [ ] Consider roughly quarterly 1:1s for \"keep satisfied\" or \"keep informed\" stakeholders\n- [ ] Use private conversations for sensitive issues rather than relying solely on broad updates\n\n## 5. Track Expectations and Commitments\n\n- [ ] Take private notes after stakeholder conversations\n- [ ] Record what was agreed to investigate, deliver, or follow up on\n- [ ] Record dates or expected timelines where relevant\n- [ ] Send a short written follow-up when an agreement could be misunderstood\n- [ ] Give stakeholders the opportunity to correct your understanding\n- [ ] Review outstanding commitments regularly\n- [ ] Close the loop when work is completed, delayed, or changed\n- [ ] Avoid making promises that are not captured anywhere\n\n## 6. Run Effective Interlock Meetings or Advisory Boards\n\n- [ ] Establish a regular forum for multiple stakeholders when individual 1:1s no longer scale\n- [ ] Determine the desired outcome for each meeting\n- [ ] Decide what information and decisions will be presented\n- [ ] Decide where stakeholder input is actually needed\n- [ ] Structure the meeting so stakeholders can participate without letting it devolve into an unbounded debate\n- [ ] Prepare the appropriate product, engineering, and operational owners\n- [ ] Use product leaders for roadmap and feature discussions\n- [ ] Include engineering leaders when operational or delivery matters require technical context\n- [ ] Surface disagreements between stakeholders where useful so the team is not caught between contradictory demands\n- [ ] Capture decisions, commitments, owners, and next steps\n\n## 7. Adjust Communication During Rough Patches\n\n- [ ] Keep communication lightweight when the platform is stable and stakeholders are satisfied\n- [ ] Increase communication when reliability, delivery, cost, or confidence deteriorates\n- [ ] Explain what is happening without hiding significant problems\n- [ ] State what is being done about the issue\n- [ ] Clarify owners, timelines, risks, and expected next updates\n- [ ] Supplement meetings with written updates when the situation changes quickly\n- [ ] Continue increased communication until the rough patch has genuinely passed\n\n## 8. Handle Disagreements and Requests\n\n- [ ] Make sure you understand the stakeholder's underlying business need\n- [ ] Gather enough information to understand the business impact\n- [ ] Avoid assuming the existing roadmap is automatically correct\n- [ ] Evaluate the value of current work against the stakeholder's request\n- [ ] Explain trade-offs in terms of business impact rather than internal preferences\n- [ ] Look for compromises involving scope, timing, ownership, or sequencing\n- [ ] Escalate, when necessary, to individuals with broader organizational responsibility\n- [ ] Avoid treating every disagreement as something that must have a single \"right\" answer\n\n## 9. Say \"Yes, With Compromises\" When Appropriate\n\n- [ ] Consider accommodating high-value requests that require little sacrifice\n- [ ] Look for a smaller first version that solves the most important need\n- [ ] Limit the scope rather than automatically rejecting the entire request\n- [ ] Negotiate timing if immediate delivery is unrealistic\n- [ ] Consider whether the requesting team can contribute engineering effort\n- [ ] Be explicit about what is and is not included\n- [ ] Explain the impact of reprioritization to other affected stakeholders\n- [ ] Avoid becoming a feature factory that says yes to everything\n\n## 10. Say \"No\" Without Damaging the Relationship\n\n- [ ] Determine whether the answer is truly no or merely not yet\n- [ ] If it is \"not yet,\" explain what must happen before the request can be prioritized\n- [ ] Offer a realistic future point for reconsideration where possible\n- [ ] If the blocker is technical, explain the technical constraint in understandable terms\n- [ ] If the request conflicts with product strategy, explain the platform's core mission and boundaries\n- [ ] If the request is technically infeasible, say so clearly rather than pretending it is simply a prioritization issue\n- [ ] Suggest alternatives, workarounds, or another appropriate system where possible\n- [ ] Keep the conversation focused on the problem rather than on ego or who is \"right\"\n- [ ] Ask your manager or another leader for help if you lack the authority to give a firm no\n\n## 11. Manage Shadow Platforms Constructively\n\n- [ ] Identify why another team wants to build its own solution\n- [ ] Determine whether the driver is urgency, novel demand, poor collaboration, disagreement over operating costs, or engineers simply wanting to build\n- [ ] Address \"us versus them\" dynamics early\n- [ ] Build relationships with teams before they begin creating competing systems\n- [ ] Partner with teams when they have a legitimate, urgent need the platform cannot yet satisfy\n- [ ] Learn from novel solutions rather than automatically trying to stop them\n- [ ] Set clear expectations about long-term ownership and support\n- [ ] Decide whether successful innovations should later be absorbed into the platform\n- [ ] Accept that occasionally the team may need to clean up or operationalize a useful solution built elsewhere\n\n## 12. Prepare for Budget and Cost Pressure\n\n- [ ] Assume that roadmaps alone will not justify the team during a downturn\n- [ ] Connect platform work directly to protected business outcomes\n- [ ] Identify which customers or initiatives will benefit from each major project\n- [ ] Review work outside essential operational or \"keep the lights on\" responsibilities\n- [ ] Pause speculative projects that are early, unclear, or expensive\n- [ ] Shrink projects when part of the investment can still deliver meaningful value\n- [ ] Build a clear business case for projects you strongly believe should continue\n- [ ] Seek senior sponsorship for important initiatives where appropriate\n\n## 13. Organize Work for Budget Discussions\n\n- [ ] Group work into meaningful project teams rather than presenting person-by-person activities\n- [ ] Use team-sized chunks that leadership can understand and evaluate\n- [ ] Avoid creating a false impression of precision about individual utilization\n- [ ] Identify whole initiatives that could be reduced, delayed, or removed\n- [ ] Protect the teams and work that contribute most directly to critical outcomes\n\n## 14. Arrive With Your Own Cost-Cutting Proposal\n\n- [ ] Decide in advance what could reasonably be reduced or eliminated\n- [ ] Base recommendations on customer feedback, stakeholder input, business value, and operational necessity\n- [ ] Be prepared to defend the work you believe is essential\n- [ ] Avoid defending every project equally\n- [ ] Show that you understand the seriousness of the financial situation\n- [ ] Offer concrete trade-offs rather than waiting for executives to choose cuts for you\n- [ ] Use established stakeholder trust to influence where cuts are made\n\n## 15. Final Relationship Health Check\n\n- [ ] Do stakeholders understand what the team does and why it matters?\n- [ ] Do the most powerful stakeholders trust my judgment?\n- [ ] Can I identify what each important stakeholder cares about?\n- [ ] Are commitments documented and followed through?\n- [ ] Are important disagreements surfaced early?\n- [ ] Are communication channels appropriate for each stakeholder group?\n- [ ] Can I say \"no\" without creating unnecessary hostility?\n- [ ] Can I make reasonable compromises without losing sight of the platform strategy?\n- [ ] Am I communicating more actively when circumstances deteriorate?\n- [ ] Can I explain the team's value in business terms?\n- [ ] Do I already know what I would protect, reduce, or stop if budgets tightened?\n- [ ] Are my stakeholder relationships strong enough to survive a difficult quarter?\n"}]}, {"key": "dialog", "label": "Conversation", "meta": {"timetoread": "8 min listen"}, "blocks": [{"type": "markdown", "content": "## Isn't This Just Politics?\n\n**Ben:** Give it to me straight. You've written a whole record about managing stakeholders. Isn't that a polite word for office politics — the thing good engineers are supposed to be too busy building for?\n\n**Ana:** That framing is exactly what the record exists to kill. A platform team does not set its own budget, grant its own mandate, or vote on its own survival in a downturn. Those decisions are made by people outside the team, based on what they believe about it. Managing those beliefs deliberately isn't a distraction from platform work — it's the part of platform work that keeps the rest funded.\n\n**Ben:** But \"managing beliefs\" sounds like spin. If the platform is good, won't the work speak for itself?\n\n**Ana:** It matters enormously whether your team is considered indispensable or \"nice to have,\" and whether a powerful stakeholder strongly dislikes you — that's Fournier and Nowland's blunt framing, and no amount of good engineering answers those questions by itself. And most of what looks like politics is just perspective. When a stakeholder disagrees with me, they're usually optimizing for a different part of the business, not playing games. Understanding their goals, pressures, and incentives is the job.\n\n**Ben:** Fine, but every leader already talks to stakeholders. What does this record actually change?\n\n**Ana:** It changes *when* the work happens. The load-bearing idea is an asymmetry: trust is built in the calm and spent in the storm. The moment you need a stakeholder's goodwill — an escalation, an incident, a budget review — is precisely the moment you can no longer build it. Every discipline in the record is cheap when things are calm and decisive when they're not.\n\n## The Grid\n\n**Ben:** You map people on a power–interest grid. That feels cold. Reducing colleagues to quadrants?\n\n**Ana:** It's the opposite of cold — it's honest about scarcity. An earnest leader tries to keep every stakeholder equally happy and ends up with a meeting cadence that cannot scale and no deep relationships anywhere. That's the flat-cadence anti-pattern: identical 1:1s with everyone until the calendar collapses and the important relationships get the same scraps as the unimportant ones.\n\n**Ben:** So who gets the time?\n\n**Ana:** High power, high interest — manage closely, roughly monthly 1:1s. High power, low interest — keep satisfied, quarterly. Low power, high interest — keep informed. Low power, low interest — monitor. And when individual 1:1s stop scaling, an interlock forum or advisory board. The point isn't the labels; it's that relationship time flows deliberately instead of to whoever shouts loudest.\n\n**Ben:** And the grid you drew last year?\n\n**Ana:** Is a wrong map. Reorganizations and shifting priorities move people between quadrants. Relationship time allocated by last year's map is misallocated — so the map gets revisited, including the informal one: who has the ear of senior leadership, which teams are considered indispensable, who's loudest and most respected.\n\n**Ben:** Here's my sharper objection. All this pre-crisis relationship-building — how do you know it pays off? It's cost now for a hypothetical later.\n\n**Ana:** Ask anyone who's lived the escalation-day introduction: meeting a powerful stakeholder for the first time in the meeting where they're already angry. The relationship needed to defuse that escalation was never built, and it cannot be built in that room. That's the whole asymmetry made concrete. The record's revisit condition even names it — if an escalation reaches senior leadership from a stakeholder we had no active relationship with, the model failed and gets rewritten.\n\n## Talking at the Right Altitude\n\n**Ben:** Let's talk communication. Engineers are told to be transparent. You seem to be saying — send less?\n\n**Ana:** Send the right altitude. Decide the takeaway first, then lead with outcomes, impact, risks, decisions, and next steps. Detail on request. Over-communication has the same failure mode as silence: when everything is sent, the important signal is lost. That's the firehose update — mistaking volume for transparency. And a stakeholder drowning in operational detail is being invited to micromanage.\n\n**Ben:** But when a stakeholder loses confidence, the instinct is to show them the architecture. Prove the system is sound.\n\n**Ana:** And it never works. Stakeholders don't distrust a platform because they lack diagrams, and no quantity of engineering detail repairs a relationship problem. A confidence problem needs outcomes and owners, not a deep-dive. Make the business impact visible rather than assuming it's understood — this connects straight to [What Is Platform Engineering](what-is-platform-engineering.html): the framing stakeholders need starts from why the platform exists at all.\n\n**Ben:** What about when things are going badly? The temptation is to go quiet until you have good news.\n\n**Ana:** The record says the opposite: turn communication up when reliability, delivery, cost, or confidence deteriorates — and keep it up until the rough patch has genuinely passed. What's happening, what's being done, owners, timelines, next update. Operational rough patches are exactly what [Operating Platforms](operating-platforms.html) deals with, and this discipline is written for those moments. Hiding problems behind a polished summary is how transparency dies precisely when it's worth most.\n\n## The Promise That Nobody Wrote Down\n\n**Ben:** Now the commitment tracking — private notes, written follow-ups, reviewing what's outstanding. Honestly, it sounds bureaucratic. Do I need a ledger to have a conversation?\n\n**Ana:** A private note and a short follow-up are enough — the record explicitly rejects bureaucratizing every conversation. But think about the uncaptured promise: a corridor \"we'll look into it\" that the stakeholder remembers as a commitment and the team never heard about. Six months later that's not a misunderstanding, it's evidence you don't keep your word. The written follow-up also invites correction — the stakeholder gets to fix your understanding before it hardens into a broken promise.\n\n**Ben:** And the loop-closing?\n\n**Ana:** Review outstanding commitments regularly, and close the loop when work completes, slips, or changes. Concretely: for every important stakeholder I can name what they care about, when we last spoke, and what I currently owe them. Commitments live in writing, not in memory.\n\n## Yes, No, and Not Yet\n\n**Ben:** Let's get to the hard part. A powerful stakeholder wants something that isn't on your roadmap. The realist in me says: you'll say yes. Everyone says yes to power.\n\n**Ana:** And that's the soft yes — accepting every request to avoid conflict, then failing to deliver on the accumulated pile. It converts short-term comfort into long-term distrust. A platform that never says no is a feature factory with no strategy. But the defensive no is just as destructive — that's the fortress. The record's alternative is structure.\n\n**Ben:** Which means what, mechanically?\n\n**Ana:** First, understand the underlying business need — without assuming the existing roadmap is automatically right. Then look for the yes with compromises: a smaller first version that solves the most important need, limited scope, negotiated timing, maybe contributed engineering effort from the requesting team, with explicit boundaries of what is and isn't included. The planning mechanics behind those trade-offs live in [Planning and Delivery](planning-and-delivery.html); this record governs how they're negotiated.\n\n**Ben:** And when the answer really is no?\n\n**Ana:** Then say whether it's *no* or *not yet*, explain the constraint in the stakeholder's terms, and offer an alternative. A no delivered that way is a disagreement about priorities, not a rejection of the person — and it survives. One more rule: if a request is technically infeasible, say so. Dressing an impossibility up as \"not prioritized this quarter\" — the disguised no — just buys the same fight next quarter.\n\n**Ben:** And if you don't have the authority to make the no stick?\n\n**Ana:** Escalate for backup. Asking your manager to help hold a line is not weakness; it's how the line holds without the relationship breaking.\n\n## Shadow Platforms and the Budget Storm\n\n**Ben:** Suppose you discover another team quietly building its own version of your platform. Turf violation? Most leaders would fight it.\n\n**Ana:** And lose the early-warning signal and the relationship in one move. A shadow platform is feedback, not treason. Something drove it — urgency my platform couldn't meet, novel demand, poor collaboration, cost disagreement, or engineers who simply want to build. Each driver has a different right response: partner, learn, absorb, occasionally clean up. None of them is reflexive suppression.\n\n**Ben:** Last storm, then: the budget review. The CFO wants cuts. What does prepared look like?\n\n**Ana:** Three things, all done in advance. Work grouped into team-sized chunks leadership can actually evaluate — not person-by-person activity lists with false precision. Platform work connected to protected business outcomes, because roadmaps alone won't justify the team in a downturn. And my own cut proposal, ready before executives make one for me. Budget-season passivity — walking in with a roadmap and hope — is how you lose the work that mattered most. Defending every project equally reads as not understanding the seriousness of the situation.\n\n**Ben:** That's a grim exercise to run when nothing's wrong.\n\n**Ana:** It's the cheapest insurance the record buys. At any moment — not just in budget season — I can answer: what would I protect, reduce, or stop if the budget tightened tomorrow?\n\n## What This Record Is Not\n\n**Ben:** Close it out. What are you explicitly not claiming?\n\n**Ana:** Three boundaries. This is not the product discipline — discovering what customers need and shaping the roadmap is [Platform as a Product](platform-as-a-product.html); this record covers the relationships and negotiations around that roadmap. It's not planning mechanics — those live in [Planning and Delivery](planning-and-delivery.html). And it's not a communication style guide — the postures and disciplines are fixed, but templates and update formats stay team choices.\n\n**Ben:** And when do you revisit it?\n\n**Ana:** If an escalation arrives from a stakeholder we had no relationship with, if uncaptured commitments keep surfacing, or if a budget cycle catches us without a defensible view of what to protect, reduce, or stop. Those are the three ways the calm work turns out not to have been done. The whole record in one line: build the relationships, capture the commitments, and know your own cuts — before the storm, because during it is too late.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why a platform's stakeholders decide its fate — and how to manage them before the storm — in nine panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. KAI: a hands-on platform engineering lead, short dark hair, gray zip-up hoodie with a small gear pin, laptop covered in infrastructure stickers under one arm, a coil of cable slung over the shoulder.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and teal accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Kai presents a platform diagram while Vera points at distant executives holding a money bag and an off switch.](assets/images/managing-stakeholders/comic-01-they-decide-your-fate.jpeg)\n**Panel 1:** *The hook: a platform does not set its own budget, grant its own mandate, or vote on its own survival — stakeholders do.*\n\n![Comic panel: Kai awkwardly introduces himself to an angry executive in an escalation meeting while Vera watches from the doorway.](assets/images/managing-stakeholders/comic-02-escalation-day-introduction.jpeg)\n**Panel 2:** *The problem: the trust you need in the storm can only be built in the calm — the escalation meeting is too late for introductions.*\n\n![Comic panel: Kai stamps yes on a conveyor of requests while a huge pile of accepted tickets teeters behind him.](assets/images/managing-stakeholders/comic-03-the-soft-yes.jpeg)\n**Panel 3:** *The wrong way: the soft yes — accept everything to avoid conflict, then fail to deliver the pile and convert comfort into distrust.*\n\n![Comic panel: Vera places stakeholder magnets on a power–interest grid while Kai allocates time tokens to the top quadrant.](assets/images/managing-stakeholders/comic-04-the-power-interest-grid.jpeg)\n**Panel 4:** *The principle: map stakeholders by power and interest — manage closely, keep satisfied, keep informed, monitor — and spend scarce relationship time accordingly.*\n\n![Comic panel: Vera offers a small outcome-risk-next-step card while Kai unrolls a huge architecture blueprint.](assets/images/managing-stakeholders/comic-05-the-right-altitude.jpeg)\n**Panel 5:** *How it plays out: decide the takeaway first — outcomes, risks, next steps — with detail on request; engineering detail never fixes a trust problem.*\n\n![Comic panel: Kai catches a floating verbal promise in a notebook and pins it to a board of tracked commitments.](assets/images/managing-stakeholders/comic-06-no-promise-in-the-air.jpeg)\n**Panel 6:** *How it plays out: capture every agreement in writing, review what is outstanding, and close every loop — no promise lives only in the air.*\n\n![Comic panel: Kai offers a stakeholder a not-yet card and an alternative card, with a crossed-out fortress and vending machine behind.](assets/images/managing-stakeholders/comic-07-a-structured-no.jpeg)\n**Panel 7:** *The trade-off: not every request gets a yes — but a no with reasons in the stakeholder's terms, plus an alternative, is a disagreement about priorities, not a rejection of the person.*\n\n![Comic panel: Vera lowers Kai's toy sword and examines a duct-taped shadow platform with a magnifying glass showing an unmet-need tag.](assets/images/managing-stakeholders/comic-08-shadow-platforms-are-feedback.jpeg)\n**Panel 8:** *Also this: a shadow platform is a signal — unmet urgency, novel demand, or broken collaboration — and the right response is diagnosis, not suppression.*\n\n![Comic panel: Kai holds a protect-reduce-stop list in a calm office while a storm cloud looms outside the window.](assets/images/managing-stakeholders/comic-09-ready-before-the-storm.jpeg)\n**Panel 9:** *The closer: arrive at budget season with your own cut proposal — what to protect, reduce, or stop — decided in the calm, before the storm asks.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
