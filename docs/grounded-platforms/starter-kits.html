<script id="data" type="application/json">{"meta": {"id": "PLT-REF-STARTER-KITS", "status": "draft:gray", "title": "Starter Kit Templates", "date": "2026-08-20", "author": "Željko Obrenović", "permalink": "starter-kits", "timetoread": "7 min", "excerpt": "When a platform team in my organization ships a starter kit, the bar is a single portal action that produces a working service: a repository with a complete skeleton, a CI/CD pipeline, an infrastructure claim, a namespace, and a catalog entry — no tickets, no wiki of copy-paste steps. The template itself is a versioned product: it carries metadata that records its name and version so every generated service can be traced and upgraded later. And it is tested like software: before anything is published, a test project is generated and made to build, test, lint, start, and answer its health check — then the whole path is proven end to end, from portal click to a green pipeline on a deployed service. An untested template makes every consuming team the test.", "tags": "starter kits, templates, scaffolding, paved paths, self-service, backstage, developer experience, service catalog, golden path", "icon": "assets/icons/starter-kits.png", "logo": "assets/images/starter-kits/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["starter kits", "templates", "scaffolding", "paved paths", "self-service", "backstage", "developer experience", "service catalog", "golden path"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: When my organization builds starter kit templates, the finished capability has one shape: **a single portal action produces a working service** — a repository generated from a complete skeleton, a CI/CD pipeline already wired in, an infrastructure claim for what the service needs, a namespace to run in, and a catalog entry that says who owns it. The template is a **versioned product**: it carries platform metadata recording its name and version, so every service it generates can be traced back and upgraded forward. It is **tested like software**: before publishing, a test project is generated and made to install, build, test, lint, start, and answer its health endpoint — every failure fixed first. And it is **proven end to end**: create a service through the portal, validate it locally, deploy it, push a change, and watch the pipeline complete. An untested template makes every consuming team the test.\n\n## Statement\n\nWhen a platform team in my organization ships a starter kit, this is the shape of the build I hold them to.\n\n**The kit is a complete skeleton, kept as code:**\n\n- **A dedicated templates repository.** Starter kits live in their own repository with a clear structure: one directory per template, each holding the template definition and a skeleton directory with all required starter files.\n- **Everything a real service needs on day one.** The skeleton includes the container build file, the CI/CD workflow, the package manifest, a README, and the required source and configuration files — a generated service is a working service, not a stub.\n- **Versioned for upgrade tracking.** The manifest carries platform metadata, and the template's name and version are recorded in every generated service — so we can always answer *which services came from which template version*, and drive upgrades later.\n\n**The portal template scaffolds the whole birth, not just the repository:**\n\n- **Parameters that capture real decisions.** Service information, owning team, database options, service port, repository location — the choices a team actually has to make, and nothing more.\n- **Steps that finish the job.** The template fetches the skeleton, applies conditional configuration (a database only if one was chosen), generates the infrastructure claim, publishes the repository, creates the runtime namespace, and registers the service in the catalog.\n- **A landing, not a dead end.** The run ends with useful output links and next steps — the team knows where their repository, pipeline, and catalog entry are.\n\n**The template is tested like software, before anyone consumes it:**\n\n- **Structural validation.** Template structure, required metadata, and required skeleton files are verified mechanically.\n- **A generated test project must actually work.** Dependencies install, the build passes, unit tests pass, linting passes, the application starts, and the health endpoint responds.\n- **No publish with known failures.** Every failure is fixed before the template is published — the template's consumers are never its test bed.\n\n**Publishing is controlled, and the proof is end to end:**\n\n- **A publishing pipeline, not a copy-paste.** Portal URL, token, and repository variables are configured; a publishing script runs; validation must succeed; the template is registered in the catalog and visible in the portal.\n- **The full path is demonstrated once, honestly.** Create a service through the portal; confirm the repository, namespace, and catalog entry exist; clone and validate the generated service locally — build, tests, lint, container build, infrastructure claim, catalog metadata, local development environment. Then deploy it to the platform cluster, push a code change, and observe the CI/CD pipeline complete. The capability is done when the whole workflow works from template creation through deployment.\n\n## How to Read This\n\nThis record is part of the **Reference Implementation** section of this journal — the how-it-concretely-looks companion to the Platform Engineering records. It is grounded in the Starter Kit Template chapter checklist of the *Platform Engineer's Handbook*, a build-it-end-to-end companion that constructs a concrete internal developer platform; this chapter builds the backend-service starter kit. Where [The Four Pillars of Platform Engineering](four-pillars.html) states that a platform offers paved paths, consumable self-service, this record is that claim made executable: the paved path for the most consequential recurring act — starting a new service. The runnable version is the **Checklist** tab; the **TL;DR** tab is the management summary; the **Conversation** tab talks it through.\n\n## Reference Stack\n\nThe reference build names concrete tools. My commitments are at the capability level — the right-hand column is what actually matters, and it survives a tool swap.\n\n| Role | Reference tool | The property that matters |\n| --- | --- | --- |\n| Portal and scaffolder | Backstage software templates | One parameterized action runs the whole scaffold; the result is registered in a catalog |\n| Repository hosting | GitHub | The generated repository is created and published by the template run, not by hand |\n| Infrastructure provisioning | Crossplane claims | The template generates a declarative claim; infrastructure follows the [Self-Service Infrastructure Management](self-service-infrastructure.html) model |\n| Runtime | Kubernetes namespaces | The service's runtime home is created at scaffold time |\n| CI/CD | Platform pipeline workflow | The generated repository carries a working pipeline from its first commit — the service defined in [CI/CD as a Platform Service](cicd-as-a-platform-service.html) |\n| Template versioning | `platformMetadata` in the package manifest | Every generated service records which template and version it came from |\n\n## Rationale\n\n**The first hour decides whether the paved path is real.** A team starting a new service makes its platform decision in the first hour, not in the architecture review. If the paved path is a wiki page of copy-paste steps, every service is hand-assembled, subtly different, and drifting from the platform from day one. A starter kit collapses that hour into one portal action — and because the generated service is complete (build file, pipeline, manifest, README, source files), the team's first commit lands on a service that already builds, deploys, and appears in the catalog. This is [The Four Pillars of Platform Engineering](four-pillars.html) pillar one and pillar three meeting in one artifact: a curated opinion, consumed self-service.\n\n**Scaffolding must finish the birth, or it just relocates the tickets.** A template that creates a repository but leaves the namespace, the infrastructure claim, the pipeline wiring, and the catalog registration to manual follow-up has not removed work — it has split one ticket into four. That is why the template's steps run every step of the birth, all the way through to the next-step links. The scaffold is done when the service exists everywhere it needs to exist, with ownership recorded from minute one.\n\n![Diagram of one portal action fanning out into repository, CI/CD pipeline, infrastructure claim, namespace, and catalog entry.](assets/images/starter-kits/one-action-fan-out.jpeg)\n**Figure 1:** *One portal action finishes the whole birth: repository, pipeline, infrastructure claim, namespace, and catalog entry from a single run.*\n\n**Templates are products, and version metadata is what keeps them products.** The moment a template generates its tenth service, the real question becomes: *what happens when the template improves?* Without recorded template name and version in each generated service, the answer is archaeology — nobody can say which services carry the old pipeline, the old base image, the vulnerable dependency. With platform metadata stamped at generation time, upgrades become a query and a campaign instead of a guess. A template without version tracking is a one-way door that looks like a product.\n\n**Testing the template means generating a project and making it live.** Validating the template's structure is necessary and nowhere near sufficient — a template can be syntactically perfect and generate a service that does not compile. The bar is behavioral: generate a test project, install its dependencies, build it, run its tests and linting, start it, and hit its health endpoint. Every failure gets fixed before publishing, because the alternative is worse than no template: **a broken template ships its defect to every team that trusts the paved path**, at the exact moment they were most willing to trust it. This bar has a cost I name and accept: it makes every template change slower to ship — the price of never using consuming teams as the test bed.\n\n![Diagram of a generated test project passing install, build, tests, lint, start, and health checkpoints before a publish gate opens to the catalog.](assets/images/starter-kits/test-before-publish-gate.jpeg)\n**Figure 2:** *The publish gate is behavioral: a generated test project must install, build, test, lint, start, and answer its health check before the template ships.*\n\n**The end-to-end proof is the only honest definition of done.** The final verification — create a service through the portal, validate it locally, deploy it to the cluster, push a change, watch the pipeline complete, see it in the catalog — is the difference between a template that demos and a capability that works. Every seam it crosses (portal to repository, repository to pipeline, claim to infrastructure, deployment to catalog) is a seam that breaks silently when only tested in isolation. I ask for this proof once per template, honestly, before the template is announced — and again whenever the template materially changes.\n\n![Diagram of one continuous proof path from portal through repository, local validation, deployment, pushed change, and green pipeline to the catalog.](assets/images/starter-kits/end-to-end-proof-path.jpeg)\n**Figure 3:** *The proof crosses every seam in one run: from portal click to a green pipeline on a deployed, cataloged service.*\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| One portal action produces a working service: repository, pipeline, claim, namespace, catalog entry. | Teams must never create services any other way — the paved path has exits; off-path services still register in the catalog. |\n| The generated skeleton is complete enough that the first commit lands on a service that builds and deploys. | The skeleton contains the team's business logic — it is a working start, not the application. |\n| Templates carry recorded name and version in every generated service. | Generated services are auto-upgraded — the metadata makes upgrade campaigns possible, not automatic. |\n| Templates are tested by generating a project and making it build, test, lint, start, and answer its health check. | Structural validation is enough — a syntactically valid template that generates a broken service fails the bar. |\n| Publishing runs through a script with validation; the template appears in the catalog and portal. | Templates are edited directly in the portal — the templates repository is the source of truth. |\n| The capability is proven end to end: portal click through deployed service through green pipeline on a pushed change. | The proof recurs on every scaffold — it is run per template, at creation and on material change. |\n| Template parameters capture real decisions: name, owner, description, database, port, repository location. | Every option belongs in the form — a template with dozens of parameters is an inventory wearing a form. |\n\nConcretely: the next time a team in my organization starts a backend service, I expect the elapsed time from portal click to a deployed service with a green pipeline to be measured in minutes — and I expect the platform team to be able to list, from metadata alone, every service generated from each template version. **If either claim fails, the starter kit is a demo, not a capability.**\n\n## Anti-Patterns\n\n- **The wiki scaffold.** The \"starter kit\" is a getting-started page of copy-paste steps. Every new service is hand-assembled, subtly unique, and off the paved path from its first day.\n- **Scaffold and vanish.** The template creates a repository and stops — namespace, infrastructure claim, pipeline wiring, and catalog registration become the team's four follow-up tickets. The scaffold relocated the work instead of removing it.\n- **The untested template.** Template changes are published on the strength of structural validation alone. The first team to scaffold a service discovers the build failure — and every team after them, until someone fixes it in production trust.\n- **The unversioned template.** No platform metadata, no recorded template version in generated services. Two years later, nobody can say which services carry the old pipeline or the vulnerable base image; every upgrade is archaeology.\n- **The demo-day template.** Verified to generate files, never to deploy. It works beautifully in the portal and dies at the cluster — the seams (claim, namespace, pipeline, catalog) were never crossed in one run.\n- **The kitchen-sink template.** One template, forty parameters, every framework option. Curation abdicated into a form — the team's first platform experience is a questionnaire it cannot answer.\n- **Fork-and-forget.** Teams copy last quarter's generated repository instead of running the template, because the template is stale or slow. The paved path exists but nobody rides it — a signal the template stopped being a product.\n\n## Related Records\n\n- [The Four Pillars of Platform Engineering](four-pillars.html) — the structural test; this record is pillar one's paved paths and pillar three's self-service made concrete in one artifact.\n- [Platform as a Product](platform-as-a-product.html) — the product operating mechanics that make a template versioned, maintained, and fed by user feedback.\n- [Self-Service Platform Onboarding](self-service-onboarding.html) — the sibling record that gets a team onto the platform; this one gets a service born once the team is on.\n- [CI/CD as a Platform Service](cicd-as-a-platform-service.html) — the pipeline capability the starter kit wires into every generated repository.\n- [Self-Service Infrastructure Management](self-service-infrastructure.html) — the claim-based infrastructure model the template's generated claim consumes.\n- [Platform Creation: Environments, GitOps, and the Mesh](platform-creation.html) — the environments, GitOps, and mesh foundation the generated service deploys onto.\n- [Developer Experience Evaluation](devex-evaluation.html) — how I measure whether the paved path is actually fast and actually used.\n\n## Scope and Revisiting\n\nThis record is `draft`. It applies to every starter kit a platform team in my organization publishes, everywhere I am the accountable executive. I revisit it if teams start forking old repositories instead of running templates (the product failing in public), if a template defect ships to multiple generated services (the testing bar failing), if the platform team cannot enumerate services per template version (the metadata failing), or if a new class of service — frontend, data pipeline, ML workload — becomes recurring enough that the single-template reference shape needs to become a governed template catalog.\n\n## Authoritative References\n\n- *Platform Engineer's Handbook* — the Starter Kit Template chapter, whose checklist this record distills; the reference build uses Backstage software templates, GitHub, Crossplane claims, and Kubernetes namespaces.\n- Camille Fournier and Ian Nowland, *Platform Engineering: A Guide for Technical, Product, and People Leaders* (O'Reilly, 2024) — the curated-product and self-service pillars this record makes concrete.\n"}]}, {"key": "summary", "label": "TL;DR", "meta": {"timetoread": "2 min read"}, "blocks": [{"type": "markdown", "content": "When a platform team in my organization ships a starter kit, the finished capability has one shape: **a single portal action produces a working service** — repository, CI/CD pipeline, infrastructure claim, namespace, and catalog entry, with ownership recorded from minute one. The template is a versioned product, it is tested like software before anyone consumes it, and it is proven end to end — because an untested template makes every consuming team the test.\n\n**What changes**\n\n* **The skeleton is complete, and kept as code.** Starter kits live in a dedicated templates repository; the skeleton carries everything a real service needs on day one — container build file, CI/CD workflow, package manifest, README, source and configuration files. A generated service builds and deploys before the team writes a line of business logic.\n* **The scaffold finishes the birth.** The portal template captures the real decisions (name, owner, database, port, repository location) and runs every step: fetch, conditional configuration, infrastructure-claim generation, repository publishing, namespace creation, catalog registration, and next-step links. No follow-up tickets.\n* **Templates carry version metadata.** Platform metadata records the template name and version in every generated service — so upgrades are a query and a campaign, not archaeology.\n* **Testing is behavioral, not structural.** Before publishing, a test project is generated and made to install, build, pass tests and linting, start, and answer its health endpoint. Every failure is fixed first; publishing runs through a validated script into the catalog.\n* **Done means proven end to end.** Create a service through the portal, validate it locally, deploy it to the cluster, push a change, and watch the pipeline complete — once per template, honestly, before it is announced and again on material change.\n\n**What it costs**\n\n* Template maintenance is a standing product obligation — a stale template teaches teams to fork old repositories instead of riding the paved path.\n* The behavioral test bar makes template changes slower to ship; that is the price of never using consuming teams as the test bed.\n* The reference build covers one backend-service template; each new recurring service class (frontend, data pipeline, ML) is its own build to this same bar.\n\n**What we are not doing**\n\n* Not team onboarding — getting a team onto the platform is [Self-Service Platform Onboarding](self-service-onboarding.html); this record starts a service once they are on.\n* Not defining the pipeline or the claim model — those live in [CI/CD as a Platform Service](cicd-as-a-platform-service.html) and [Self-Service Infrastructure Management](self-service-infrastructure.html); the template wires them in.\n* Not banning off-path services — the paved path has exits; off-path services still register in the catalog.\n\n*The Article tab carries the rationale, the reference stack, and the anti-patterns; the Checklist tab carries the full build-and-publish checklist. Grounded in the* Platform Engineer's Handbook *Starter Kit Template chapter.*\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "4 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record — run it when building and publishing a starter kit template. The Article tab carries the rationale and anti-patterns. Tool names (Backstage, GitHub) are the reference stack; substitute your own portal, repository host, and claim model.*\n\n## 1. Repository Setup\n\n- [ ] Set up the starter-kits repository structure\n- [ ] Create the backend-service template directory\n- [ ] Create the skeleton directory\n- [ ] Add all required starter files\n\n## 2. Template Files\n\n- [ ] Add the Dockerfile\n- [ ] Add the CI/CD workflow\n- [ ] Add the package manifest (`package.json`)\n- [ ] Add the README\n- [ ] Add the required source and configuration files\n- [ ] Add `platformMetadata` to the package manifest\n- [ ] Record the template name and version for upgrade tracking\n\n## 3. Portal Template\n\n- [ ] Create `template.yaml`\n- [ ] Define the parameters teams actually decide:\n  - [ ] Service information\n  - [ ] Team/owner selection\n  - [ ] Database options\n  - [ ] Service port\n  - [ ] Repository location\n- [ ] Add the template-fetching steps\n- [ ] Add conditional database configuration\n- [ ] Add infrastructure-claim generation\n- [ ] Add the GitHub publishing step\n- [ ] Add Kubernetes namespace creation\n- [ ] Add Backstage catalog registration\n- [ ] Configure useful output links and next steps\n\n## 4. Testing\n\n- [ ] Validate the template structure\n- [ ] Verify the required metadata exists\n- [ ] Verify the required skeleton files exist\n- [ ] Generate a test project\n- [ ] Run dependency installation\n- [ ] Run the project build\n- [ ] Run the unit tests\n- [ ] Run linting\n- [ ] Verify the application starts successfully\n- [ ] Verify the `/health` endpoint responds\n- [ ] Fix all failures before publishing\n\n## 5. Publish to the Portal\n\n- [ ] Configure `BACKSTAGE_URL`\n- [ ] Configure `BACKSTAGE_TOKEN`\n- [ ] Configure the required GitHub repository variables\n- [ ] Run the template publishing script\n- [ ] Confirm template validation succeeds\n- [ ] Confirm the template is registered in the Backstage catalog\n- [ ] Confirm the template appears in the portal\n\n## 6. Create a Service (the Consumer Path)\n\n- [ ] Open the portal Create page\n- [ ] Select the backend-service template\n- [ ] Enter the service name\n- [ ] Select the owning team\n- [ ] Add a service description\n- [ ] Select the required database\n- [ ] Choose the repository location\n- [ ] Run the scaffolder\n- [ ] Confirm the GitHub repository is created\n- [ ] Confirm the Kubernetes namespace is created\n- [ ] Confirm the service is registered in the catalog\n\n## 7. Validate the Generated Service\n\n- [ ] Clone the generated repository\n- [ ] Install dependencies\n- [ ] Build the service locally\n- [ ] Run the tests locally\n- [ ] Run linting locally\n- [ ] Verify the Docker/container build succeeds\n- [ ] Verify the infrastructure claim exists\n- [ ] Verify the catalog metadata is valid\n- [ ] Start the local development environment\n- [ ] Confirm local development works\n\n## 8. Final Verification\n\n- [ ] Deploy the service to the platform cluster\n- [ ] Push a code change\n- [ ] Observe the CI/CD pipeline execute\n- [ ] Confirm the pipeline completes successfully\n- [ ] Verify the service appears in the Backstage catalog\n- [ ] Confirm the full workflow works — from template creation through deployment\n\nThe test this record runs: **can a team go from portal click to a deployed service with a green pipeline — without a ticket, and without the platform team touching anything?**\n"}]}, {"key": "dialog", "label": "Conversation", "meta": {"timetoread": "8 min listen"}, "blocks": [{"type": "markdown", "content": "## The First Hour\n\n**Ben:** Blunt version first. Every portal demo I have ever seen ends with \"and now you scaffold a service from a template.\" It always works in the demo. Why does an operating model need a whole record for the easy part?\n\n**Ana:** Because the demo is precisely the problem this record exists to see through. The demo shows a template generating files. The record's bar is a template producing a *working service*: one portal action, and out comes a repository with a complete skeleton, a CI/CD pipeline already wired in, an infrastructure claim, a namespace to run in, and a catalog entry that says who owns it. Most \"starter kits\" in the wild fail somewhere between generating files and that sentence.\n\n**Ben:** And why does that gap matter so much? A team can wire the rest by hand in a day.\n\n**Ana:** Because a team starting a new service makes its platform decision in the first hour, not in the architecture review. If the paved path is a wiki page of copy-paste steps — the record calls that the wiki scaffold — every service is hand-assembled, subtly different, and drifting from the platform from day one. This is [The Four Pillars of Platform Engineering](four-pillars.html) pillar one and pillar three meeting in one artifact: a curated opinion, consumed self-service. The starter kit is where the paved-path claim either becomes real or gets quietly disproved.\n\n**Ben:** The record also insists the template does more than create the repository. Isn't namespace creation and catalog registration just ceremony?\n\n**Ana:** There is a named anti-pattern for skipping it: scaffold and vanish. The template creates a repository and stops — and namespace, infrastructure claim, pipeline wiring, and catalog registration become the team's four follow-up tickets. The scaffold relocated the work instead of removing it. That is why the template's steps run all the way through: fetch the skeleton, apply conditional configuration — a database only if one was chosen — generate the claim, publish the repository, create the namespace, register the service, and end with useful next-step links. The service exists everywhere it needs to exist, with ownership recorded from minute one.\n\n## The Template Is a Product\n\n**Ben:** The versioning obsession surprised me. Platform metadata in the manifest, template name and version recorded in every generated service. That smells like bureaucracy for a bunch of boilerplate.\n\n**Ana:** Run the clock forward. The template generates its tenth service, then its fortieth, and then the template improves — a new pipeline, a patched base image, a fixed vulnerable dependency. Now the only question that matters is: *which services carry the old one?* Without recorded template name and version, the answer is archaeology. With metadata stamped at generation time, upgrades become a query and a campaign. The record's phrase for the failure is the unversioned template — a one-way door that looks like a product.\n\n**Ben:** So the concrete executive test is —\n\n**Ana:** The platform team can list, from metadata alone, every service generated from each template version. If they cannot, the starter kit is a demo, not a capability.\n\n**Ben:** Let me push on parameters, then. If the template is a product, product thinking says give users choices. Framework, database, message broker, port, replicas —\n\n**Ana:** And the record pushes back with the kitchen-sink template: one template, forty parameters, every framework option — curation abdicated into a form. The team's first platform experience becomes a questionnaire it cannot answer. The reference template asks only what a team actually decides: service information, owning team, database options, service port, repository location. Everything else is the platform's opinion. That is what curation means.\n\n## Tested Like Software\n\n**Ben:** Now the testing section, which is where I think the record over-reaches. It demands a generated test project that installs, builds, passes unit tests, passes linting, starts up, and answers its health endpoint — before every publish. For a template. Isn't structural validation enough?\n\n**Ana:** Structural validation is necessary and nowhere near sufficient — a template can be syntactically perfect and generate a service that does not compile. The bar is behavioral because the template's output is software, so its test must be running software. Generate a test project and make it live: dependencies install, build passes, tests pass, linting passes, the application starts, the health endpoint responds. And fix all failures before publishing — that clause is in the source checklist verbatim.\n\n**Ben:** The cost is real, though. That makes every template change slower to ship.\n\n**Ana:** Accepted, and named as a cost. Because the alternative is worse than no template: the untested template ships its defect to every team that trusts the paved path, at the exact moment they were most willing to trust it. The first team to scaffold discovers the build failure, and every team after them. An untested template makes every consuming team the test — that is the record's most quotable line for a reason.\n\n**Ben:** Publishing is also scripted, I noticed. Portal URL, token, repository variables, a publishing script, validation gates.\n\n**Ana:** Because the templates repository is the source of truth, and the portal catalog is a publish target — not an editing surface. A publish is: script runs, validation succeeds, template registered in the catalog, visible in the portal. Same discipline as any other software release.\n\n## The End-to-End Proof\n\n**Ben:** The final verification reads almost ceremonial: create a service through the portal, clone it, build it locally, deploy it to the cluster, push a change, watch the pipeline go green. If every step was already tested, why prove the whole chain?\n\n**Ana:** Because the chain crosses seams that no isolated test touches — portal to repository, repository to pipeline, claim to infrastructure, deployment to catalog — and seams break silently. The record's name for skipping this is the demo-day template: verified to generate files, never to deploy. Works beautifully in the portal, dies at the cluster. The proof runs once per template, honestly, before it is announced — and again on material change. Not on every scaffold; the record is explicit about that.\n\n**Ben:** And the consumer-side validation — clone, install, build, test, lint, container build, claim exists, catalog metadata valid, local development works. That is a lot of confirming.\n\n**Ana:** It is an afternoon of confirming, once, versus every future team silently absorbing whichever step would have failed. The executive version of the whole record fits in one sentence: portal click to deployed service with a green pipeline, measured in minutes, without a ticket, without the platform team touching anything.\n\n**Ben:** One trap left. Teams that skip the portal entirely and copy last quarter's generated repo. I have watched that happen everywhere.\n\n**Ana:** Fork-and-forget — and the record treats it as a signal, not a crime. Teams fork old repositories when the template is stale or slow, which means the template stopped being a product. That is a named revisit trigger, and it is why template maintenance is a standing obligation under [Platform as a Product](platform-as-a-product.html), not a one-time build. The measurement side — whether the path is actually fast and actually used — lives in [Developer Experience Evaluation](devex-evaluation.html).\n\n## What This Record Is Not\n\n**Ben:** Close it out. What is this record explicitly not doing?\n\n**Ana:** Three fences. It is not team onboarding — getting a team onto the platform, with tenancy, access, and quotas, is [Self-Service Platform Onboarding](self-service-onboarding.html); this record starts a service once the team is already on. It is not the pipeline or the infrastructure model — those live in [CI/CD as a Platform Service](cicd-as-a-platform-service.html) and [Self-Service Infrastructure Management](self-service-infrastructure.html); the template wires them in and the final proof watches them run. And it is not a ban on off-path services — the paved path has exits, and off-path services still register in the catalog. Also worth saying: Backstage, GitHub, Crossplane are the reference stack, the worked example. The commitments hold at capability level and survive a tool swap.\n\n**Ben:** So the whole record in one breath.\n\n**Ana:** One portal action produces a working service — repository, pipeline, claim, namespace, catalog entry. The template is versioned, tested like software, and proven end to end before anyone consumes it.\n\n**Ben:** And if the template is not tested?\n\n**Ana:** Then it still gets tested — by every team that trusts it. The only choice is who pays.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why a starter kit is a tested, versioned product — and an untested template makes every consuming team the test — in nine panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. KAI: a hands-on platform engineering lead, short dark hair, gray zip-up hoodie with a small gear pin, laptop covered in infrastructure stickers under one arm, a coil of cable slung over the shoulder.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and teal accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: a developer chooses between a long trail of sticky-note signposts and a short paved lane to a portal arch labeled NEW SERVICE.](assets/images/starter-kits/comic-01-the-first-hour.jpeg)\n**Panel 1:** *The hook: a team makes its platform decision in the first hour of a new service — not in the architecture review.*\n\n![Comic panel: a developer builds a crooked machine from a huge wiki binder while three slightly different machines stand nearby.](assets/images/starter-kits/comic-02-the-wiki-scaffold.jpeg)\n**Panel 2:** *The problem: the wiki scaffold — every new service hand-assembled, subtly unique, and off the paved path from day one.*\n\n![Comic panel: a machine stamps out one repository box and departs while a developer holds four ticket slips labeled namespace, claim, pipeline, catalog.](assets/images/starter-kits/comic-03-scaffold-and-vanish.jpeg)\n**Panel 3:** *The wrong way: scaffold and vanish — a template that creates the repository and leaves namespace, claim, pipeline, and catalog as follow-up tickets.*\n\n![Comic panel: one button press dispenses a repository, a gear pipeline, a claim scroll, a namespace plot, and a catalog card.](assets/images/starter-kits/comic-04-one-action-whole-birth.jpeg)\n**Panel 4:** *The principle: one portal action produces a working service — repository, pipeline, infrastructure claim, namespace, and catalog entry, with ownership recorded from minute one.*\n\n![Comic panel: service boxes with version stamps are checked against a list held by Kai while Vera inspects with a magnifying glass.](assets/images/starter-kits/comic-05-versioned-product.jpeg)\n**Panel 5:** *The product: the template is a versioned product — metadata stamped at generation time turns upgrades into a query and a campaign instead of archaeology.*\n\n![Comic panel: a small robot service runs a treadmill gauntlet of install, build, test, lint, and health checkpoints while Kai checks a clipboard.](assets/images/starter-kits/comic-06-tested-like-software.jpeg)\n**Panel 6:** *The bar: tested like software — generate a test project and make it install, build, test, lint, start, and answer its health check; no publish with known failures.*\n\n![Comic panel: a cracked template machine stamps out cracked service boxes discovered by three alarmed developer teams downstream.](assets/images/starter-kits/comic-07-every-team-the-test.jpeg)\n**Panel 7:** *What it costs: an untested template makes every consuming team the test — the defect ships at the exact moment teams were most willing to trust the paved path.*\n\n![Comic panel: Kai walks one continuous path from portal arch through repository, local checks, and deployment to a green pipeline light while Vera stamps PROVEN.](assets/images/starter-kits/comic-08-the-end-to-end-proof.jpeg)\n**Panel 8:** *The proof: walk the whole path once, honestly — create through the portal, validate locally, deploy, push a change, watch the pipeline complete.*\n\n![Comic panel: Vera holds two cards, a spotlight labeled DEMO and a stopwatch with a deployed service labeled CAPABILITY.](assets/images/starter-kits/comic-09-demo-or-capability.jpeg)\n**Panel 9:** *The closer: portal click to deployed service in minutes, traceable by template version — anything less is a demo, not a capability.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
