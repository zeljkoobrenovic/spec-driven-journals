<script id="data" type="application/json">{"meta": {"id": "PLT-PLATFORM-SUCCESS", "status": "draft:gray", "title": "What Platform Success Looks Like", "date": "2026-08-12", "author": "Željko Obrenović", "permalink": "platform-success", "timetoread": "7 min", "excerpt": "I judge a platform organization on four dimensions at once: aligned, trusted, managing complexity, and loved. Adoption numbers and shipped roadmaps prove nothing on their own — a mandated migration inflates adoption while users quietly route around the platform. Success means the organization's technology gets easier to operate and evolve, and users become materially better at their jobs — ideally because the platform makes difficult things feel boring, reliable, and easy. Any platform that cannot answer yes on all four dimensions has work to do, whatever its dashboard says.", "tags": "platform engineering, success metrics, alignment, trust, complexity, developer experience, adoption", "icon": "assets/icons/platform-success.png", "logo": "assets/images/platform-success/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["platform engineering", "success metrics", "alignment", "trust", "complexity", "developer experience", "adoption"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: I judge a platform organization on four dimensions at once, and none of them is adoption for adoption's sake. **Aligned**: platform teams work toward a shared purpose, a coordinated product strategy, and jointly planned priorities. **Trusted**: customers believe the platform can operate reliably, make sound long-term investments, and deliver when they need it. **Managing complexity**: the platform makes the organization's technology easier to operate and evolve, rather than relocating complexity from machines into human coordination. **Loved**: the platform makes users materially better at their jobs — ideally by making difficult things feel boring, reliable, and easy. A platform that cannot answer yes to all four is not succeeding, whatever its dashboard says.\n\n## Statement\n\nMy success test for a platform organization has four dimensions.\n\n![Diagram of four cards labeled aligned, trusted, managing complexity, and loved joining through an AND junction into a single success node.](assets/images/platform-success/four-dimension-test.jpeg)\n**Figure 1:** *The four-dimensional test: aligned, trusted, managing complexity, loved — joined by an AND, not an OR.*\n\n**Aligned** — the platforms pull in one direction:\n\n- **Shared purpose, product mindset.** Teams tie their purpose to business and developer outcomes, provide curated abstractions rather than raw complexity, and serve a base broad enough to create leverage. Success is measured by customer outcomes and reduced pain.\n- **Coordinated strategy.** Strategies are coordinated across teams, overlapping platforms are differentiated or deliberately consolidated, and no team competes for customers just to justify headcount.\n- **Joint planning.** Major investments are planned together, dependencies made explicit, conflicts surfaced openly rather than approved-and-hoped, and teams can disagree and commit. Reorganization is a last resort, used only when the cost of misalignment clearly exceeds the disruption.\n\n**Trusted** — customers believe the platform will hold:\n\n- **Operationally**: reliability demonstrated at the customer's scale and risk level, operational excellence a measurable objective, adoption staged so confidence is earned before critical workloads move.\n- **In major investments**: rearchitectures with explicit stakeholder buy-in, business outcomes in every proposal, incremental checkpoints instead of a distant big bang, and legacy systems maintained while replacements mature.\n- **In delivery**: the platform is not a recurring bottleneck; repeated requests become self-service; customers can unblock themselves; capacity remains for the unplanned.\n- **Architecturally**: composable, incrementally replaceable building blocks with escape hatches — never stability sacrificed to make the happy path look effortless.\n\n**Managing complexity** — removed, not relocated:\n\n- **Less glue, both kinds.** Application teams need progressively less custom glue code *and* less human glue — meetings, manual coordination, tribal knowledge, escalation.\n- **Shadow platforms read as signals** of unmet need, learned from and sometimes absorbed — with a deliberate plan for the added complexity.\n- **Controlled growth.** Headcount is not the default answer; toil is reduced before teams grow; growth funds genuinely new areas, not poor abstractions.\n- **Product discovery** finds narrower abstractions that solve most customer problems, and platforms are rearchitected, consolidated, or sunset when complexity warrants it.\n\n**Loved** — users are materially better at their jobs:\n\n- **It just works.** Dependable enough that users rarely think about it; opinionated enough to make common cases easy; opinions **pierceable** through escape hatches.\n- **Friction disappears.** The team hunts recurring friction and removes it, and understands why users love an existing system before replacing it.\n- **Easy to embrace.** Users know it exists, understand what it solves, and migration is part of the product — not homework left to customers.\n- **Metrics reflect reality.** Voluntary adoption distinguished from mandated adoption, surveys that discover rather than validate, quantitative metrics paired with qualitative feedback — improvements in users' ability to do their jobs, not vanity numbers.\n\n## How to Read This\n\nThis journal is my platform operating model, one record per source checklist. This record is grounded in the \"What Success Looks Like\" chapter of Camille Fournier and Ian Nowland's *Platform Engineering: A Guide for Technical, Product, and People Leaders* (O'Reilly, 2024) — the chapter that defines success for a platform organization across alignment, trust, complexity management, and user value, distilled here into **the four-dimensional test I judge every platform by**. The runnable version — the full assessment across all four dimensions, the leadership check, and the overall success test — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**Success needs a definition because the default proxies all lie.** Adoption climbs when a migration is mandated, whatever users think. Roadmaps ship while customers quietly build shadow platforms. Surveys validate decisions already made when the questions are written that way. That is why this record insists on the distinction between voluntary and forced adoption, on representative survey populations, and on measuring **improvements in users' ability to do their jobs** rather than vanity metrics. Without a real definition of success, a platform organization optimizes its dashboard instead of its customers.\n\n**Four dimensions, because each one fails independently.** An aligned organization can build a platform nobody trusts; a beloved platform can be a complexity bomb held together by heroics; a reliable platform can serve so narrow a base that it creates no leverage. The four questions — aligned, trusted, managing complexity, loved — are separate axes, and **the test is conjunctive**: weakness on any one eventually drags down the others. That is also why the record resists collapsing them into a single score.\n\n**Trust is the slowest asset and the fastest liability.** It is earned in stages — less critical workloads first, capabilities demonstrated under realistic conditions before anyone is asked to depend on them — and spent in an instant when a big-bang migration slips or a neglected legacy system fails while its replacement is still a promise. The chapter's discipline of **incremental checkpoints and maintained legacy systems** exists because a platform that loses operational trust loses the argument for every future investment at the same time.\n\n![Concept chart of trust rising slowly through staged checkpoints and dropping off a sharp cliff when a big bang slips or legacy fails.](assets/images/platform-success/trust-asymmetry-curve.jpeg)\n**Figure 2:** *Trust is earned in slow, staged steps — and lost off a cliff. The checkpoints and the maintained legacy system are what keep the curve climbing.*\n\n**Relocated complexity is the failure mode that hides best.** A platform can genuinely reduce glue code while the coordination cost explodes — more meetings, more tribal knowledge, more escalations, more \"human glue.\" From the platform team's dashboard this looks like success; from the customer's calendar it is the opposite. The honest question is whether the *organization's total* cost of operating and evolving its technology went down, which is why I weigh human glue as heavily as custom code, and why **a single pane of glass is no substitute for coherent underlying APIs**.\n\n![Side-by-side diagram contrasting complexity relocated into meetings and coordination with complexity genuinely removed from the organization.](assets/images/platform-success/removed-vs-relocated-complexity.jpeg)\n**Figure 3:** *The hidden failure mode: less glue code is only success if the organization's total complexity went down — not if the tangle moved into calendars and escalations.*\n\n**Loved is a real requirement, not sentiment.** \"Loved\" has an engineering definition: the normal experience is boring, the primary workflow is hard to misuse, opinions are strong but pierceable, and migration tooling is part of the product. Users love platforms that **make difficult things feel boring** — and a team that cannot say why users love an existing system has no business deprecating it.\n\n**Headcount growth is where platform success quietly dies.** The default answer to every platform problem is another team, and every team then justifies its existence — which is how organizations end up with overlapping platforms competing for the same internal customers. Success includes restraint: toil reduced before growth is requested, growth reserved for genuinely new areas, and existing features **periodically re-justified against their maintenance cost**.\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| Success is judged on four dimensions at once: aligned, trusted, managing complexity, loved. | A strong score on one dimension compensates for the others — the test is conjunctive. |\n| Adoption is an input to product strategy. | Adoption is the definition of success — mandated migrations make it a vanity metric. |\n| Trust is earned in stages, with less critical workloads first. | Customers should trust capabilities not yet demonstrated under realistic conditions. |\n| The platform removes complexity from the organization as a whole. | Moving complexity from machines into meetings and tribal knowledge counts as removing it. |\n| Platforms are opinionated, with pierceable opinions and escape hatches. | Every use case deserves support — simplifying the product surface beats supporting every variation. |\n| Growth funds genuinely new areas after toil is reduced. | Headcount is the default answer to platform pain. |\n| Migration and adoption are part of the product. | Migration is homework left to customers once the new thing ships. |\n\nConcretely: every platform team in my organization can answer the four questions — aligned, trusted, managing complexity, loved — with evidence from the customer's side, not the team's dashboard. Reviews of platform investments ask for **business outcomes and incremental checkpoints**, surveys are designed to discover rather than confirm, and a request for headcount is expected to arrive **after** the toil-reduction work, not instead of it.\n\n## Anti-Patterns\n\n- **Adoption theater.** Reporting mandated-migration numbers as if they were customer enthusiasm — and discovering the difference only when the mandate lifts.\n- **Platform Darwinism.** Overlapping platforms competing for the same internal customers to justify their headcount, while product managers are trapped inside engineering silos.\n- **The big-bang bet.** A multi-year rearchitecture with no incremental checkpoints, sold on technology rather than business outcomes, while the legacy system it replaces rots from neglect.\n- **Complexity relocation.** Glue code goes down, meetings and escalations go up — the platform's dashboard improves while the organization's total cost of change grows.\n- **The single pane of glass.** A unifying UI presented as the fix for incoherent, undocumented, unstable underlying APIs.\n- **Effortless-happy-path worship.** Sacrificing operational stability and future flexibility so the demo looks magical — until an edge case meets a wall with no escape hatch.\n- **Deprecating what users love.** Replacing a \"hacky\" system without ever understanding the customer value that made people love it — then wondering why the elegant replacement fails.\n- **Survey confirmation.** Questions designed to validate decisions already made, answered by an unrepresentative sliver, filed without action.\n- **Headcount as first resort.** Growing the team to compensate indefinitely for poor abstractions instead of fixing them.\n\n## Related Records\n\n- [The Four Pillars of Platform Engineering](four-pillars.html) — the pillars define what a platform is; this record defines how I judge whether the platform organization built on them is succeeding.\n- [Managing Platform Stakeholders](managing-stakeholders.html) — the relationship work behind the trusted dimension; trust with stakeholders is earned there and measured here.\n- [Platform as a Product](platform-as-a-product.html) — the product discipline whose discovery loop produces the narrower abstractions this record's complexity dimension demands.\n- [Operating Platforms](operating-platforms.html) — the operational practice behind operational trust; reliability is demonstrated there, not claimed here.\n- [Rearchitecting Platforms](rearchitecting-platforms.html) — the record for the moments when this test says a platform must be rearchitected, consolidated, or sunset.\n\n## Scope and Revisiting\n\nThis record is `draft`. It applies to every platform organization I am accountable for, and it is the rubric I bring to platform reviews, investment decisions, and annual planning. I revisit it if the four dimensions stop discriminating — if every team scores well while customers still complain — if a platform passes the test yet loses its funding argument in a downturn, or if new practice (for example, AI-assisted development changing what \"developer pain\" means) shifts what any dimension should measure.\n\n## Authoritative References\n\n- Camille Fournier & Ian Nowland, *Platform Engineering: A Guide for Technical, Product, and People Leaders* (O'Reilly, 2024) — the \"What Success Looks Like\" chapter, whose checklist this record distills.\n"}]}, {"key": "summary", "label": "TL;DR", "meta": {"timetoread": "2 min read"}, "blocks": [{"type": "markdown", "content": "I judge a platform organization on **four dimensions at once — aligned, trusted, managing complexity, and loved** — and none of them is adoption for adoption's sake. A platform succeeds when it makes the organization's technology easier to operate and evolve and makes its users materially better at their jobs, ideally by making difficult things feel boring.\n\n**What changes**\n\n* Platform reviews start from a **conjunctive test**: are the teams aligned (shared purpose, coordinated product strategy, jointly planned investments with conflicts surfaced and disagree-and-commit), trusted, managing complexity, and loved? A strong score on one dimension does not compensate for the others — weakness on any one eventually drags down the rest.\n* **Trust is checked in three registers**: operationally (reliability demonstrated at the customer's scale, adoption staged so confidence is earned before critical workloads move), in major investments (stakeholder buy-in, business outcomes in every proposal, incremental checkpoints instead of a big bang, legacy maintained while replacements mature), and in delivery (self-service instead of a bottleneck, capacity for the unplanned) — backed by composable architecture with escape hatches.\n* **Complexity must be removed, not relocated.** Less glue code counts only if human glue — meetings, manual coordination, tribal knowledge, escalation — went down too. The honest question is whether the organization's *total* cost of operating and evolving its technology dropped, and headcount stops being the default answer: toil is reduced before teams grow.\n* **Loved gets an engineering definition**: it just works, opinionated but pierceable, recurring friction hunted down, migration part of the product rather than homework for customers.\n* **Metrics must reflect reality**: voluntary adoption distinguished from mandated adoption, surveys that discover rather than validate, quantitative metrics paired with qualitative feedback — improvements in users' ability to do their jobs, not vanity numbers.\n\n**What it costs**\n\n* The conjunctive test is deliberately unforgiving — no single score, no compensating dimension, and evidence has to come from the customer's side, which is more work than reading the team's dashboard.\n* Staged trust is slower than big-bang promises: incremental checkpoints, and legacy systems maintained while their replacements mature.\n* Growth restraint — headcount requests arrive after the toil-reduction work, and existing features are periodically re-justified against their maintenance cost.\n\n**What we are not doing**\n\n* Not redefining what a platform *is* — that is [The Four Pillars of Platform Engineering](four-pillars.html); this record defines how I judge whether the organization built on those pillars is succeeding.\n* Not the product-discovery mechanics — those live in [Platform as a Product](platform-as-a-product.html); discovery appears here only as one success signal among many.\n* Not a metrics catalog — no KPI definitions, dashboards, or survey templates; the record fixes the dimensions and the judgment, not the instrumentation.\n\n*The Article tab carries the rationale and anti-patterns; the Checklist tab is the runnable assessment — all four dimensions, the platform-leadership check, and the overall success test.*\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "6 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record. The Article tab carries the rationale and anti-patterns.*\n\nUse this checklist to assess whether the platform organization is succeeding across four dimensions — **aligned, trusted, managing complexity, and loved** — plus a leadership check and the overall test.\n\n## 1. Your Platforms Are Aligned\n\n### Purpose\n\n- [ ] Platform teams share a clear purpose tied to business and developer outcomes\n- [ ] Teams operate with a product mindset, not merely an infrastructure or technology mindset\n- [ ] Platforms provide curated, software-based abstractions rather than exposing raw underlying complexity\n- [ ] Platforms serve a broad enough customer base to create organizational leverage\n- [ ] Platform teams understand that their role is to provide foundations for the business, not to optimize only for their own technical area\n- [ ] Success is measured by customer outcomes and reduced pain — not adoption for adoption's sake\n\n### Product strategy\n\n- [ ] Platform strategies are coordinated across teams rather than created independently in silos\n- [ ] Overlapping platforms have clearly differentiated purposes or are deliberately consolidated\n- [ ] Teams are not competing for the same customers simply to justify their existence or headcount\n- [ ] Product managers can think across platform boundaries and are not constrained by individual engineering silos\n- [ ] Senior technical leaders actively identify and resolve cross-platform architectural misalignment\n- [ ] Customer feedback — including negative survey comments — is used to uncover problems that cross platform boundaries\n- [ ] Organizational restructuring is used only when the cost of misalignment clearly outweighs the disruption of reorganization\n\n### Planning\n\n- [ ] Major platform investments are planned jointly across teams\n- [ ] Dependencies between major initiatives are explicitly identified\n- [ ] Teams understand which initiatives matter most to the company as a whole, not just to their own roadmap\n- [ ] Planning focuses deeply on significant investments rather than attempting to centrally coordinate every small project\n- [ ] Leaders openly surface conflicts instead of approving incompatible plans and hoping they work out\n- [ ] Teams can disagree and commit after a decision is made\n- [ ] Major decisions have a clear rationale that affected teams understand\n- [ ] Bottom-up roadmaps are reconciled against organization-wide objectives\n- [ ] Peer engineering, product, and architecture reviews are used to expose hidden dependencies and unrealistic assumptions\n- [ ] The final portfolio allows for course correction as new information emerges\n\n## 2. Your Platforms Are Trusted\n\n### Operational trust\n\n- [ ] The platform has demonstrated that it can operate reliably at the scale and risk level expected by its customers\n- [ ] Operational excellence is treated as a measurable objective, not an afterthought\n- [ ] Experienced engineering leaders are empowered to improve reliability and operating practices\n- [ ] On-call burden, reliability, performance, and operational pain are improving over time\n- [ ] Adoption is staged so that less critical workloads can build confidence before more demanding workloads migrate\n- [ ] Platform teams do not ask customers to trust capabilities that have not yet been demonstrated under realistic conditions\n\n### Trust in major investments\n\n- [ ] Large rearchitectures and multi-year platform investments have explicit technical stakeholder buy-in\n- [ ] Senior engineers outside the platform team understand and can challenge the technical rationale\n- [ ] Major new products have executive sponsorship when significant organizational investment is required\n- [ ] Investment proposals explain the business outcome, not merely the technology being built\n- [ ] Existing systems continue to receive enough maintenance to preserve trust while replacements are being developed\n- [ ] Large migrations have incremental checkpoints rather than relying on a single distant \"big bang\" payoff\n- [ ] Leaders are willing to alter the proposed technical solution when stakeholder requirements reveal a better path\n\n### Trust in delivery\n\n- [ ] The platform is not a recurring bottleneck for application teams\n- [ ] Teams maintain enough capacity to respond to important unplanned business needs\n- [ ] Planning provides direction without making the organization incapable of moving quickly\n- [ ] Repeated customer requests are analyzed for opportunities to automate, standardize, document, or enable self-service capabilities\n- [ ] Platform engineers spend less time on recurring manual work for customers\n- [ ] Product scope is challenged when supporting every possible use case would create an unsustainable bottleneck\n- [ ] Customers can unblock themselves wherever practical\n- [ ] Extensibility exists for important edge cases instead of forcing the central platform team to implement everything\n\n### Architecture that preserves trust\n\n- [ ] Platforms provide stable, well-defined building blocks rather than tightly coupled end-to-end workflows everywhere\n- [ ] Components are composable\n- [ ] Platform components can be replaced or upgraded incrementally\n- [ ] Customers have appropriate escape hatches for legitimate specialized needs\n- [ ] The platform does not sacrifice operational stability and future flexibility merely to make the happy path appear effortless\n\n## 3. Your Platforms Manage Complexity\n\n### Accidental complexity\n\n- [ ] The platform removes complexity rather than moving it from machines into human coordination\n- [ ] Application teams need progressively less custom glue code, configuration, automation, and tooling\n- [ ] Application teams need less \"human glue\" — meetings, manual coordination, tribal knowledge, and escalation — to use the platform\n- [ ] Repetitive operational and migration processes are automated where possible\n- [ ] Humans are reserved for genuinely complex decisions rather than merely complicated, repetitive work\n- [ ] Platform APIs are coherent, documented, stable, and usable independently of any single UI\n- [ ] A \"single pane of glass\" is not treated as a substitute for well-designed underlying interfaces\n\n### Shadow platforms\n\n- [ ] Teams can identify where application teams are building their own platform-like solutions\n- [ ] Shadow platforms are treated as signals of unmet customer needs rather than automatically as bad behavior\n- [ ] Platform teams maintain enough customer trust to learn about these experiments early\n- [ ] Useful ideas from shadow platforms can be incorporated into the official platform\n- [ ] Taking ownership of a shadow platform requires a deliberate plan to manage the added complexity that comes with broader use\n- [ ] Local innovation is balanced with company-wide maintainability\n\n### Controlled growth\n\n- [ ] Adding headcount is not the default solution to every platform problem\n- [ ] Teams continually reduce toil, manual operations, and unnecessary support work before asking to grow\n- [ ] Most incremental work in established product areas can be funded with existing team capacity\n- [ ] Leaders know the minimum staffing needed for operational responsibilities and the remaining capacity available for product work\n- [ ] Growth is used deliberately for genuinely new areas rather than to compensate indefinitely for poor abstractions or excessive complexity\n- [ ] Teams periodically question whether existing features, products, and responsibilities still justify their maintenance cost\n\n### Product discovery\n\n- [ ] Platform teams investigate what customers actually need rather than simply accepting requested technologies or implementations\n- [ ] Product discovery is used to find narrower abstractions that solve a large share of customer problems\n- [ ] Standardization is driven by customer value and operational sustainability rather than ideology\n- [ ] Platform teams are willing to simplify the product surface rather than support every possible variation\n- [ ] Common customer requirements are separated from edge cases\n- [ ] Complementary primitives are combined where doing so creates a simpler, higher-value product\n- [ ] Teams expect multiple iterations before discovering the right abstraction\n- [ ] Platforms are periodically rearchitected, migrated, consolidated, or sunset when complexity warrants it\n\n## 4. Your Platforms Are Loved\n\n### \"It just works\"\n\n- [ ] The normal experience is dependable enough that users rarely need to think about the platform itself\n- [ ] The primary workflow is simple, predictable, and difficult to misuse\n- [ ] UI and API behavior accurately reflect the underlying system\n- [ ] Automation interfaces are first-class rather than bolted on afterward\n- [ ] The platform is opinionated enough to make common use cases easy\n- [ ] Those opinions are pierceable: advanced users have escape hatches when the default does not fit\n- [ ] Users are not forced to rebuild large amounts of platform glue themselves\n\n### Friction disappears\n\n- [ ] The team actively searches for recurring friction between development and production and removes it\n- [ ] Platform features eliminate problems customers would prefer not to think about\n- [ ] \"Hacky\" or inelegant existing solutions are evaluated based on the customer value they provide before being replaced\n- [ ] The team understands why users love an existing system before redesigning or deprecating it\n\n### The product is easy to embrace\n\n- [ ] Target users know the platform exists\n- [ ] Users understand what problems it solves and how to use it\n- [ ] The platform is compatible with important tools and workflows already used by its customers\n- [ ] Launch quality is high enough that early adoption strengthens rather than damages confidence\n- [ ] The team leverages existing ecosystem familiarity where appropriate, rather than unnecessarily reinventing interfaces\n- [ ] Time from product insight to usable delivery is short enough to maintain customer momentum\n\n### Users become more capable\n\n- [ ] The platform team has clearly defined user personas and jobs-to-be-done\n- [ ] Product decisions are grounded in a direct understanding of a small number of deeply representative users\n- [ ] The platform provides a strong paved or golden path for common workflows\n- [ ] Guardrails help users do the right thing and make dangerous mistakes harder\n- [ ] Advanced users can compose lower-level building blocks when necessary\n- [ ] Adoption and migration are treated as part of the product, not as work left entirely to customers\n- [ ] Migration tooling supports gradual, low-risk movement from existing systems\n- [ ] The organization can show meaningful improvements in outcomes such as lead time, reliability, or frequency of breaking changes\n\n### Metrics reflect reality\n\n- [ ] Adoption is used as an input to product strategy, not as an absolute definition of success\n- [ ] Teams distinguish voluntary adoption from adoption forced by mandates or migrations\n- [ ] Customer satisfaction surveys have representative response populations\n- [ ] Survey questions are designed to discover what customers actually think rather than validate predetermined decisions\n- [ ] Survey results lead to action\n- [ ] Quantitative metrics are paired with qualitative customer feedback\n- [ ] Success measures focus on improvements in users' ability to do their jobs rather than vanity metrics\n\n## 5. Platform Leadership Is Working\n\n- [ ] Teams contain an effective mix of software engineering, systems engineering, product, and operational expertise\n- [ ] Product, engineering, and operational perspectives jointly influence priorities\n- [ ] Leaders create shared context rather than relying on centralized command-and-control decision-making\n- [ ] Senior leaders intervene when necessary but do not become the sole source of trust or decision-making\n- [ ] Technical leaders can advocate across organizational boundaries\n- [ ] Leaders are willing to confront trade-offs and make difficult prioritization decisions\n- [ ] Decisions are transparent enough that teams can commit even when their preferred option loses\n- [ ] The organization combines agile delivery with rigorous planning where the size and risk of an initiative demand it\n- [ ] Teams spend meaningful effort improving, migrating, rearchitecting, and sunsetting existing systems — not only launching new ones\n- [ ] Friction, disagreement, and failed experiments are treated as inputs to learning rather than automatically as evidence that the platform strategy has failed\n\n## 6. Overall Success Test\n\nA successful platform organization can answer **yes** to these four questions:\n\n- [ ] **Aligned:** Are our platform teams working toward a shared purpose, product strategy, and set of priorities?\n- [ ] **Trusted:** Do customers believe we can operate reliably, make sound investments, and deliver when they need us?\n- [ ] **Managing complexity:** Are we making the organization's technology easier to operate and evolve rather than merely relocating complexity?\n- [ ] **Loved:** Does the platform make users materially better at their jobs — ideally by making difficult things feel boring, reliable, and easy?\n"}]}, {"key": "dialog", "label": "Conversation", "meta": {"timetoread": "8 min listen"}, "blocks": [{"type": "markdown", "content": "## The Dashboard Says We're Winning\n\n**Ben:** Straight question. My platform has ninety percent adoption and we shipped the whole roadmap this year. By any normal definition, that's success. Why do I need a four-part test?\n\n**Ana:** Because both of those numbers can be true while the platform is failing. Adoption climbs when a migration is mandated, whatever users think of it. Roadmaps ship while customers quietly build shadow platforms to route around you. The default proxies all lie — that's why success needs an actual definition. Without one, a platform organization optimizes its dashboard instead of its customers.\n\n**Ben:** So what's the definition?\n\n**Ana:** Four questions, answered from the customer's side. Aligned: are our platform teams working toward a shared purpose, product strategy, and set of priorities? Trusted: do customers believe we can operate reliably, make sound investments, and deliver when they need us? Managing complexity: are we making the organization's technology easier to operate and evolve, rather than merely relocating complexity? And loved: does the platform make users materially better at their jobs — ideally by making difficult things feel boring, reliable, and easy?\n\n**Ben:** Four separate questions. Why not roll them into one score? Executives like one number.\n\n**Ana:** Because each dimension fails independently, and a single score hides which one is failing. An aligned organization can build a platform nobody trusts. A beloved platform can be a complexity bomb held together by heroics. A reliable platform can serve so narrow a base it creates no leverage. The test is conjunctive — an AND, not an average. Weakness on any one dimension eventually drags down the others, so the record deliberately resists collapsing them.\n\n**Ben:** Did you invent this taxonomy?\n\n**Ana:** No — and that was a deliberate choice. It's the structure of the \"What Success Looks Like\" chapter in Fournier and Nowland's *Platform Engineering*, kept intact because the four closing questions are the strongest operational form of the chapter. The record ends on them rather than on a taxonomy of my own.\n\n## Aligned\n\n**Ben:** Take alignment first. Every org chart claims alignment. What does it look like when it's real?\n\n**Ana:** Teams tie their purpose to business and developer outcomes, provide curated abstractions rather than raw complexity, and serve a base broad enough to create leverage. Strategies are coordinated across teams — overlapping platforms get differentiated or deliberately consolidated, and no team competes for internal customers just to justify its headcount.\n\n**Ben:** That competing-platforms thing — is that actually common?\n\n**Ana:** Common enough to be an anti-pattern with a name: platform Darwinism. Overlapping platforms fighting for the same internal customers while product managers sit trapped inside engineering silos. The alignment cure isn't a reorg, either — reorganization is a last resort, used only when the cost of misalignment clearly exceeds the disruption. The everyday machinery is joint planning: major investments planned together, dependencies explicit, conflicts surfaced openly rather than approved-and-hoped, and teams able to disagree and commit.\n\n## Trusted\n\n**Ben:** Trust, then. My worry is that \"trusted\" is circular — customers trust you when you're good. What do you actually check?\n\n**Ana:** Three registers, separately. Operational trust: reliability demonstrated at the customer's scale and risk level, operational excellence as a measurable objective, and adoption staged — less critical workloads first, so confidence is earned before anything critical moves. Trust in major investments: rearchitectures with explicit stakeholder buy-in, business outcomes in every proposal, incremental checkpoints. And trust in delivery: the platform isn't a recurring bottleneck, repeated requests become self-service, and capacity remains for the unplanned.\n\n**Ben:** Incremental checkpoints sound slow. A bold rearchitecture needs a big bet, doesn't it?\n\n**Ana:** That's the big-bang bet, and it's how trust dies fastest. A multi-year rearchitecture with no checkpoints, sold on technology rather than business outcomes, while the legacy system it replaces rots from neglect. Trust is the slowest asset and the fastest liability — earned in stages, spent in an instant when the big bang slips or the neglected legacy fails while its replacement is still a promise. And a platform that loses operational trust loses the argument for every future investment at the same time. That's why the discipline is checkpoints *and* maintained legacy. The full playbook for those moments is [Rearchitecting Platforms](rearchitecting-platforms.html).\n\n**Ben:** Where does the day-to-day reliability work live?\n\n**Ana:** In [Operating Platforms](operating-platforms.html) — reliability is demonstrated there, not claimed here. And the relationship side of trust is [Managing Platform Stakeholders](managing-stakeholders.html): trust with stakeholders is earned there and measured here. There's an architectural check too — composable, incrementally replaceable building blocks with escape hatches. Never stability sacrificed to make the happy path look effortless; that demo magic works right up until an edge case meets a wall with no way through.\n\n## Managing Complexity\n\n**Ben:** Third dimension. Surely every platform reduces complexity — that's the pitch. Less glue code for application teams.\n\n**Ana:** Less glue code is only half the ledger. The failure mode that hides best is relocation: the platform genuinely reduces custom code while the coordination cost explodes — more meetings, more tribal knowledge, more escalations, more human glue. From the platform team's dashboard that looks like success. From the customer's calendar it's the opposite.\n\n**Ben:** How do you tell the difference?\n\n**Ana:** Ask whether the organization's *total* cost of operating and evolving its technology went down. That's why I weigh human glue as heavily as custom code, and why a single pane of glass is no substitute for coherent underlying APIs — a unifying UI over incoherent, undocumented, unstable APIs is decoration, not simplification.\n\n**Ben:** And when a team builds its own thing instead of using yours?\n\n**Ana:** A shadow platform is a signal of unmet need — something to learn from and sometimes absorb, with a deliberate plan for the added complexity. Not a turf war. The other quiet killer here is headcount: the default answer to every platform problem is another team, and every team then justifies its existence — which is exactly how you get those overlapping platforms from the alignment discussion. Success includes restraint. Toil reduced before growth is requested, growth reserved for genuinely new areas, existing features periodically re-justified against their maintenance cost. And product discovery keeps finding narrower abstractions that solve most customer problems — that loop lives in [Platform as a Product](platform-as-a-product.html).\n\n## Loved\n\n**Ben:** Now the one I have real trouble with. \"Loved.\" That's sentiment, not engineering. Are we measuring warm feelings?\n\n**Ana:** Loved has an engineering definition. The normal experience is boring — dependable enough that users rarely think about it. The primary workflow is hard to misuse. Opinions are strong enough to make common cases easy, but pierceable — escape hatches for the cases the opinion doesn't cover. The team hunts recurring friction and removes it. And migration is part of the product, with tooling for gradual, low-risk movement — not homework left to customers once the new thing ships.\n\n**Ben:** And when you replace some hacky old system nobody official likes?\n\n**Ana:** Then you'd better know why users love it first. A team that can't say why people love an existing system has no business deprecating it — that's how elegant replacements fail against hacky incumbents. Users love platforms that make difficult things feel boring, and sometimes the hacky thing already does.\n\n**Ben:** Okay, but \"loved\" still needs numbers eventually. And you've spent this whole conversation attacking metrics.\n\n**Ana:** Not attacking metrics — attacking vanity metrics. The rules: adoption is an input to product strategy, not the definition of success. Voluntary adoption is distinguished from mandated adoption, because they mean opposite things. Surveys have representative populations and questions designed to discover what customers think rather than validate decisions already made — and results lead to action. Quantitative metrics get paired with qualitative feedback. What you're measuring, in the end, is improvement in users' ability to do their jobs.\n\n## What This Record Is Not\n\n**Ben:** Bring it home. What is this record explicitly not doing?\n\n**Ana:** Three boundaries. It doesn't define what a platform *is* — that's [The Four Pillars of Platform Engineering](four-pillars.html); this record judges whether the organization built on those pillars is succeeding. It doesn't carry the product-discovery mechanics — those are [Platform as a Product](platform-as-a-product.html); discovery shows up here only as a success signal. And it's not a metrics catalog — no KPI definitions, no dashboards, no survey templates. It fixes the dimensions and the judgment, not the instrumentation.\n\n**Ben:** And there's a leadership angle you haven't mentioned.\n\n**Ana:** It's in the Checklist tab rather than as a fifth dimension: mixed expertise on teams, shared context over command-and-control, leaders willing to confront trade-offs, decisions transparent enough that teams commit even when their option loses, real effort spent on existing systems rather than only launches, and friction treated as learning rather than proof the strategy failed.\n\n**Ben:** When does the test itself get revisited?\n\n**Ana:** If the four dimensions stop discriminating — every team scores well while customers still complain. If a platform passes the test yet loses its funding argument in a downturn. Or if new practice, like AI-assisted development, shifts what any dimension should measure. Until then, the bar stands: aligned, trusted, managing complexity, loved — all four, judged from the customer's side. A platform that can't answer yes to all of them isn't succeeding, whatever its dashboard says.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why platform success is four questions answered at once — not an adoption dashboard — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. KAI: a hands-on platform engineering lead, short dark hair, gray zip-up hoodie with a small gear pin, laptop covered in infrastructure stickers under one arm, a coil of cable slung over the shoulder.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and teal accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Kai celebrates a 100 percent adoption dashboard while Vera points at a tag on the chart reading mandated.](assets/images/platform-success/comic-01-adoption-theater.jpeg)\n**Panel 1:** *The hook: adoption climbs when a migration is mandated, whatever users think — the dashboard proves nothing on its own.*\n\n![Comic panel: developers sneak parts along a back path to a duct-taped shadow system while Kai peeks over the platform wall.](assets/images/platform-success/comic-02-routing-around.jpeg)\n**Panel 2:** *The problem: roadmaps ship and surveys come back fine — while customers quietly build shadow platforms around you.*\n\n![Comic panel: glue code shrinks on one side while a conveyor dumps the tangle into an overcrowded meeting room.](assets/images/platform-success/comic-03-complexity-relocation.jpeg)\n**Panel 3:** *The wrong way: glue code goes down, meetings and escalations go up — the platform's dashboard improves while the organization's cost of change grows.*\n\n![Comic panel: Vera shows four gauges labeled aligned, trusted, managing complexity, loved wired to one gray unlit bulb that stays dark because one gauge is low.](assets/images/platform-success/comic-04-the-four-questions.jpeg)\n**Panel 4:** *The principle: success has four dimensions — aligned, trusted, managing complexity, loved — and the test is conjunctive: one weak axis keeps the light off.*\n\n![Comic panel: Kai pushes a low-risk workload cart up a checkpointed staircase past a crossed-out big-bang catapult while Vera tends a legacy plant.](assets/images/platform-success/comic-05-trust-in-stages.jpeg)\n**Panel 5:** *How it plays out, trust: earned in stages with incremental checkpoints and maintained legacy — never staked on a distant big bang.*\n\n![Comic panel: a developer sips coffee as a tiny tamed dragon labeled deploy naps on a self-running machine with a small escape hatch.](assets/images/platform-success/comic-06-boring-is-loved.jpeg)\n**Panel 6:** *How it plays out, loved: the platform makes difficult things feel boring — opinionated enough to be easy, pierceable enough to escape.*\n\n![Comic panel: Kai waves a hiring form while Vera points at a large toil pile with a broom leaning against it.](assets/images/platform-success/comic-07-toil-before-headcount.jpeg)\n**Panel 7:** *The cost: restraint — headcount is not the default answer; toil gets reduced first, and growth funds genuinely new areas, not poor abstractions.*\n\n![Comic panel: Vera and Kai look back at their platform from the customer's side as four lights glow green.](assets/images/platform-success/comic-08-the-customers-side.jpeg)\n**Panel 8:** *The closer: four yeses, judged from the customer's side of the platform — that is what success looks like, whatever the dashboard says.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
