<script id="data" type="application/json">{"meta": {"id": "PLT-INTRODUCTION", "status": "draft:gray", "title": "Introduction", "date": "2026-08-12", "author": "Željko Obrenović", "permalink": "introduction", "timetoread": "5 min", "excerpt": "This journal is my platform operating model, written down as records: what a platform is actually for, when platform engineering earns its keep, how platform teams are built, run, and judged, and the strategy that keeps a platform growing instead of calcifying. Sixteen records from two books — Fournier and Nowland's Platform Engineering and Hohpe's Platform Strategy — each shipping its working checklist. Start here for the map.", "tags": "platform engineering, platform strategy, internal platforms, operating model, introduction", "icon": "assets/icons/introduction.png", "logo": "assets/images/introduction/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["platform engineering", "platform strategy", "internal platforms", "operating model", "introduction"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **KEY POINTS:**\n>\n> * **This journal is my platform operating model, written down** — 16 records covering both how internal platforms are built and run (the four pillars, the team, the product mindset, operations, delivery, rearchitecting, stakeholders, success) and the strategy around them (what platforms really are, when they are the right move, how to design, organize for, implement, and grow them) — grounded in Camille Fournier and Ian Nowland's *Platform Engineering* and Gregor Hohpe's *Platform Strategy*.\n> * **Every record ships its working checklist, not just the argument** — the article states the principle I commit to and why; the **Checklist** tab carries the runnable self-assessment distilled from the source, ready to run against a real platform.\n> * **Read it as an operating manual, not a book report** — the material is adapted from books I trust through a practitioner-executive lens; where my practice differs from a source, the record says so, and every record names the conditions under which I would revise it.\n\n<br>\n\nIf you build, run, fund, or depend on an internal platform in my organization, you should **not have to guess** what I think a good platform looks like. This journal writes it down: why platforms exist at all, the pillars a real platform stands on, why the platform is a product with customers rather than a mandate with captives, and what success actually looks like — plus the strategic frame that decides whether a platform should exist and how it grows. The Map below carries the full inventory. Each record states the operating principle in the article; the runnable checklist lives in the record's **Checklist** tab.\n\n## Why an Executive Writes the Platform Model Down\n\nBecause a platform is **a promise other teams build on**, and promises that live in someone's head do not scale. Application teams bet their roadmaps on the platform being stable, self-service, and supported; finance bets real money on the platform being cheaper than every team solving the same problems alone; platform engineers bet their careers on the work being valued by something other than luck. Writing the model down does two things: it tells platform teams what I will hold them to — and it tells everyone else what they are entitled to expect from a platform, **including the right to hear \"no, that does not belong in the platform.\"**\n\n![Diagram of a foundation slab labeled Platform with roadmaps, budget, and careers resting on it as bets.](assets/images/introduction/platform-promise-web.jpeg)\n**Figure 1:** *A platform is a promise three parties bet on — application roadmaps, real budget, and platform engineers' careers — which is why the promise gets written down.*\n\nThe journal inherits its charter from its siblings: the [engineering-executive journal](../grounded-engineering-executive/introduction.html) commits me to an inspectable executive operating model, and the [engineering-management journal](../grounded-engineering-management/introduction.html) writes down the management ladder. This journal covers the platform: the discipline of building and running one, and the strategy that decides whether and where one should exist.\n\n## What a Record Looks Like\n\nEvery record follows the same shape, so you always know where to look:\n\n| Part | What it gives you |\n| --- | --- |\n| **Status / Principle** blockquote | The operating principle in one quotable paragraph. |\n| **Statement → Rationale → Anti-Patterns** | The ADR-shaped body: what I commit to, why it holds, what it does *not* say, and the failure modes it guards against. |\n| **Checklist** tab | The working self-assessment distilled from the source — the part you run against a real platform. |\n| **View spec** link | The authoring contract behind the post — intent, success criteria, and a decision log, versioned like everything else. |\n\nEvery record carries `status: draft`, deliberately: the material is adopted from sources I trust and adapted ahead of being fully worn in at my current scope, and each record **names its own revisiting conditions**.\n\n## Where the Material Comes From\n\nTwo books, credited openly and per record:\n\n- **Camille Fournier & Ian Nowland, *Platform Engineering: A Guide for Technical, Product, and People Leaders*** (O'Reilly, 2024) — the discipline of building and running internal platforms. The ten records in that section follow the book's chapters.\n- **Gregor Hohpe, *Platform Strategy: Innovation Through Harmonization*** (Leanpub, 2024) — the strategic frame: what platforms really are, and how to make them grow rather than be mandated.\n\nThe sources are chapter checklists distilled from these books; the records state **what *I* will run and hold platform work to**, in first person, with the adaptations I have made.\n\n## The Map\n\nTwo sections after this one:\n\n- **Platform Engineering** — building and running platforms: [What Is Platform Engineering](what-is-platform-engineering.html), [The Four Pillars of Platform Engineering](four-pillars.html), [Getting Started with Platform Engineering](getting-started.html), [Building Great Platform Teams](building-platform-teams.html), [Platform as a Product](platform-as-a-product.html), [Operating Platforms](operating-platforms.html), [Planning and Delivery](planning-and-delivery.html), [Rearchitecting Platforms](rearchitecting-platforms.html), [Managing Platform Stakeholders](managing-stakeholders.html), [What Platform Success Looks Like](platform-success.html).\n- **Platform Strategy** — the strategic frame: [Understanding Platforms](understanding-platforms.html), [Strategy for Platforms](platform-strategy.html), [Designing Platforms](designing-platforms.html), [Organizing for Platforms](organizing-for-platforms.html), [Implementing Platforms](implementing-platforms.html), [Growing Platforms](growing-platforms.html).\n\n**The two sections answer different questions about the same thing.** The strategy records decide *whether and why* a platform should exist — [Understanding Platforms](understanding-platforms.html) is the conceptual ground under [What Is Platform Engineering](what-is-platform-engineering.html), and [Growing Platforms](growing-platforms.html) is the demand-side view of the adoption that [What Platform Success Looks Like](platform-success.html) measures from the supply side. The engineering records decide *how* — [Organizing for Platforms](organizing-for-platforms.html) and [Building Great Platform Teams](building-platform-teams.html) are the same team seen from org design and from hiring. Follow the links rather than the section order if a thread pulls you.\n\n![Concept map of two linked regions: ten Platform Engineering records and six Platform Strategy records with bridge links across the seam.](assets/images/introduction/journal-map-two-sections.jpeg)\n**Figure 2:** *One journal, two regions: the engineering records answer how, the strategy records answer whether and why — and the seams between them are cross-linked record to record.*\n\n## How to Read This Journal\n\n- **If you lead or work on a platform team here** — run the [The Four Pillars of Platform Engineering](four-pillars.html) checklist against your platform first; then take your rung of the lifecycle ([Getting Started with Platform Engineering](getting-started.html), [Operating Platforms](operating-platforms.html), [Rearchitecting Platforms](rearchitecting-platforms.html)) and the product records ([Platform as a Product](platform-as-a-product.html), [What Platform Success Looks Like](platform-success.html)).\n- **If you lead an application team** — [The Four Pillars of Platform Engineering](four-pillars.html) and [Operating Platforms](operating-platforms.html) tell you what you are entitled to expect from a platform you depend on; [Managing Platform Stakeholders](managing-stakeholders.html) tells you how the platform team should be dealing with you.\n- **If you are my peer or my manager** — read the Status/Principle blockquotes across both sections; that is **the whole operating model in fifteen minutes**. The strategy section is where the investment arguments live.\n- **If you are building your own model** — take the checklists and adapt them; that is what I did. Both books are worth your time in full, and disagreeing with my adaptations is a fine way to find your own.\n\n## Status and Revisiting\n\nThis journal is **a living document**. Records move from `draft` to `accepted` **as practice wears them in**, each on the revisiting conditions it declares for itself — and this introduction gets updated whenever the journal's shape changes.\n\n## Authoritative References\n\n- Camille Fournier & Ian Nowland, *Platform Engineering: A Guide for Technical, Product, and People Leaders* (O'Reilly, 2024).\n- Gregor Hohpe, *Platform Strategy: Innovation Through Harmonization* (Leanpub, 2024).\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why a platform operating model gets written down instead of lived in one head — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. KAI: a hands-on platform engineering lead, short dark hair, gray zip-up hoodie with a small gear pin, laptop covered in infrastructure stickers under one arm, a coil of cable slung over the shoulder.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and teal accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: application-team buildings under construction on top of a slab labeled PLATFORM while Vera tells Kai they are building on his promise.](assets/images/introduction/comic-01-built-on-a-promise.jpeg)\n**Panel 1:** *The hook: a platform is a promise other teams build on — roadmaps, budgets, and careers all bet on it.*\n\n![Comic panel: Kai holds a locked blueprint inside a thought bubble while surrounding team leads show question marks and Vera points at the bubble.](assets/images/introduction/comic-02-living-in-one-head.jpeg)\n**Panel 2:** *The problem: when the model lives in someone's head, everyone who depends on the platform has to guess.*\n\n![Comic panel: three stakeholders pull a platform block in different directions while Kai is caught in the middle.](assets/images/introduction/comic-03-guessing-the-bar.jpeg)\n**Panel 3:** *The wrong way: leave the bar unwritten and every stakeholder invents their own — including 'the platform should do everything.'*\n\n![Comic panel: Vera presents a two-section shelf of sixteen labeled record binders to Kai.](assets/images/introduction/comic-04-write-it-down.jpeg)\n**Panel 4:** *The principle: write the operating model down — sixteen records anyone can read, cite, and hold the platform to.*\n\n![Comic panel: Kai holds two books labeled HOW and WHETHER while Vera points between them.](assets/images/introduction/comic-05-two-books-two-questions.jpeg)\n**Panel 5:** *How it is built: two books, two questions — engineering answers how to build and run; strategy answers whether and why.*\n\n![Comic panel: Vera reads a principle page while Kai runs a ticked checklist against a small platform of server racks.](assets/images/introduction/comic-06-article-plus-checklist.jpeg)\n**Panel 6:** *How it reads: every record states the principle in the article and ships the runnable self-assessment in its Checklist tab.*\n\n![Comic panel: Kai stamps a record binder DRAFT while Vera points at its revisit-conditions tag.](assets/images/introduction/comic-07-draft-on-purpose.jpeg)\n**Panel 7:** *The cost: the records start as drafts, adopted ahead of being worn in — and each one names when it must be revisited.*\n\n![Comic panel: Vera and Kai study an unrolled map of two linked regions of records.](assets/images/introduction/comic-08-read-the-map.jpeg)\n**Panel 8:** *The closer: this introduction is the map — stop guessing what the platform bar is, and read it.*\n"}]}]}</script>

    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
