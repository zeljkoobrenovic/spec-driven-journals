critical on-call and structured by defined levels, and operational signals — a handful of meaningful customer-facing SLOs, change management, synthetic monitoring, and regular operational reviews — close the loop back into engineering priorities. A platform whose operational load is unmeasured is a platform whose stability is unmanaged.\n\n## Statement\n\nMy operating model for operating platforms has three practices and one rule about limits.\n\n**On-call, sustainable by design:**\n\n- **The builders operate it.** On-call is a merged DevOps rotation providing 24×7 coverage where the business needs it — software developers and systems engineers in the same rotation, with enough platform expertise to diagnose issues across internal code, OSS, vendors, and integrations. No handing operations to a separate team that lacks deep platform context.\n- **Load has numbers.** Each engineer is on-call at most one week in four, ideally one in six to eight; pager load is tracked, and the target is fewer than five meaningful pages per engineer per week. More business-impacting pages than that is a **platform-stability problem** — stability work then outranks new features.\n- **Alerts earn their noise.** False alarms are hunted down, alerts stay tied to customer or business impact, and secondary rotations that merely forward pages are avoided. Fairness first: reduce unnecessary after-hours work before compensating for it — extra pay is never a substitute for fixing unsustainable load.\n\n**Support, structured and separated:**\n\n- **Engineers hear users directly.** Support work exposes usability problems, confusing abstractions, and missing capabilities; repeated questions are product and documentation signals, not noise to route away.\n- **Levels, not heroics.** Requests are categorized — production troubleshooting, bugs, help, feature requests, reviews, design questions — with defined service levels, a definition of what counts as a **critical incident**, and clarity on when users may page the team.\n- **Noncritical support is not on-call.** Critical after-hours incidents stay on the rotation; noncritical volume moves to a business-hours support rotation. Total operational load is tracked across both, and staffing is reassessed when operations consume roughly half of engineering capacity. Support specialists, distant time zones, and a Tier 1 support organization are deliberate scaling moves — never a way to shield engineers from users entirely.\n\n**Operational feedback, closing the loop:**\n\n- **Few, meaningful, customer-facing SLOs** — with broader internal SLOs for coverage; change management on every production change until safe automation is mature; synthetic monitoring that exercises end-to-end customer workflows so we detect failures before customers report them.\n- **Reviews that change priorities.** A lightweight weekly operational review per team and organization-level reviews of the highest-impact incidents — feeding postmortem remediation, recurring-page root causes, and support trends back into engineering priorities, with leaders in the room and engineers accountable for operating what they build.\n\n![Concept map of a platform with three connected practices — on-call, user support, operational feedback — above a single load gauge.](assets/images/operating-platforms/three-practices-one-limit.jpeg)\n**Figure 1:** *The operating model: three practices every platform team owns, governed by one measured load limit.*\n\n## How to Read This\n\nThis journal is my platform operating model, one record per source checklist. This record is grounded in the \"Operating Platforms\" chapter of Camille Fournier and Ian Nowland's *Platform Engineering* (O'Reilly, 2024) — the chapter on the operational disciplines a platform team owes its users, distilled here into **the operational bar and load limits I hold every platform team to**. The runnable version — the on-call limits, support levels, SLO discipline, review cadence, and the quick health check — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**A platform is a promise to be there, and operations is how the promise is kept.** Product teams can occasionally ship and move on; a platform team cannot, because other teams build on top of it and inherit every outage. That is why operational work is an ongoing responsibility rather than something addressed during incidents, and why Fournier and Nowland name three practices every platform team must own — on-call, user support, operational feedback — while favoring **essential practices over rigid processes**. The practices are non-negotiable; their exact shape adapts to the team.\n\n**The merged rotation exists because platform failures cross layers.** A platform incident might live in internal code, an OSS dependency, a vendor system, or the integration seams between them — and a separate operations team without deep platform context can only escalate, adding latency to every incident. Putting builders on the rotation shortens diagnosis and does something subtler: it makes the pain of operating bad software land on the people **best positioned to fix it**.\n\n![Layered stack of internal code, OSS, vendors, and integrations spanned by one merged rotation, contrasted with a crossed-out escalation loop.](assets/images/operating-platforms/incidents-cross-layers.jpeg)\n**Figure 2:** *Platform failures cross layers — a merged rotation spans them all, where a context-free ops team can only escalate.*\n\n\n**On-call limits are stability metrics in disguise.** The limits protect people, but their sharper function is diagnostic: a team that cannot meet them is not understaffed for on-call, it is **operating an unstable platform**. Treating the breach as a stability problem — pausing features for reliability work — is the whole discipline. Paying people more to absorb an unsustainable pager, or adding a forwarding layer of secondary on-call, treats the symptom and preserves the disease.\n\n**Support is a sensor, not a tax.** The instinct is to shield engineers from support so they can \"focus on real work\" — and it is exactly wrong. Support is where usability problems, confusing abstractions, and missing capabilities announce themselves; a repeated question is a documentation or product defect with a name and a frequency. The structure — categorized requests, defined levels, a crisp critical-incident definition — exists so the signal can be read and the noise reduced, not so engineers never hear a user again. Even a Tier 1 support organization, at scale, keeps feedback sessions flowing back to platform engineers.\n\n**Separating noncritical support from on-call keeps both honest.** When help requests and pages share a channel, either everything becomes urgent — burning the rotation — or nothing is, and real incidents drown in questions. Splitting them lets on-call defend the platform while a business-hours rotation serves users at a sustainable pace — and tracking total load across both is what surfaces the moment operational work consumes half of engineering capacity and staffing has to be rethought.\n\n**Feedback loops are what make operations engineering rather than firefighting.** A handful of meaningful customer-facing SLOs, synthetic monitoring that catches failures before customers do, change management on every production change, and a weekly review that is lightweight but rigorous — none of it matters if the loop stays open. The closing move is converting operational data into engineering priorities: postmortem actions tracked to completion, recurring pages investigated to root cause, and leaders with enough operational context to change investment decisions. Reviews that change nothing are **process theater**, and the chapter is explicit about refusing them.\n\n![Circular loop of four stations — signals, review, priorities, platform work — connected by clockwise arrows.](assets/images/operating-platforms/closing-the-feedback-loop.jpeg)\n**Figure 3:** *The closed loop: operational signals pass through review into priorities and platform work, then back into signals.*\n\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| Platform engineers build and operate their systems in a merged rotation. | A separate SRE/ops team absorbs operations — context-free operations just adds escalation latency. |\n| On-call load is bounded: at most 1 week in 4, fewer than five meaningful pages per week. | The numbers are aspirations — a sustained breach is a stability problem that outranks features. |\n| Noncritical support moves to a business-hours rotation with defined service levels. | Everything urgent to a user is urgent to the platform — urgency is tied to business impact. |\n| Engineers regularly hear directly from users through support. | Engineers handle all support forever — specialists and Tier 1 are legitimate scaling moves. |\n| Customer-facing SLOs are few and meaningful; internal SLOs are broader. | More SLOs mean more reliability — a noisy dashboard hides the platform's real health. |\n| Every production change is documented, reviewed, and tested until safe automation is mature. | Change management is permanent bureaucracy — it is scaffolding until automation earns trust. |\n| Operational reviews feed engineering priorities, with leaders present. | Reviews are a reporting ritual — a review that never changes a priority is process theater. |\n\nConcretely: every platform team here can state its current pages-per-engineer-per-week number, runs a weekly operational review that leaders actually attend, and **can point to an engineering priority that operational feedback changed this quarter**. When the on-call numbers breach, the next conversation is about platform stability — **never about who else could carry the pager**.\n\n## Anti-Patterns\n\n- **Operations as interruption.** Treating operational work as what happens between feature sprints — addressed only during incidents, resented the rest of the time.\n- **The context-free ops team.** Handing the pager to a separate SRE or operations team without deep platform knowledge, converting every incident into an escalation chain.\n- **Paying for the pager instead of fixing it.** Using compensation to make an unsustainable on-call load tolerable rather than treating the load as the stability defect it is.\n- **The forwarding secondary.** A secondary rotation that exists only to relay pages to the primary team — latency dressed up as coverage.\n- **The fully shielded engineer.** Routing all support away from engineers until nobody who builds the platform has heard a user question in months — and empathy, usability signals, and product insight quietly die.\n- **Answering instead of eliminating.** Handling the same support question week after week without ever converting it into documentation, diagnostics, or a product change.\n- **SLO sprawl.** Dozens of customer-facing SLOs, each individually defensible, collectively hiding whether the platform is healthy.\n- **Process theater.** Operational reviews that happen on schedule, review the same dashboards, and change no priorities — rigor's costume without its function.\n\n## Related Records\n\n- [Platform as a Product](platform-as-a-product.html) — reliability as part of the product experience; this record is the operational machinery that keeps that promise.\n- [The Four Pillars of Platform Engineering](four-pillars.html) — the pillar model where \"operated as a foundation\" sits; this record unpacks that pillar into daily practice.\n- [Building Great Platform Teams](building-platform-teams.html) — the staffing model behind the rotation and the support-specialist roles this record's scaling moves depend on.\n- [Planning and Delivery](planning-and-delivery.html) — the planning discipline that has to absorb the reliability work this record's feedback loops keep generating.\n- [What Platform Success Looks Like](platform-success.html) — what platform success looks like; sustainable operational load and trusted SLOs are among its leading indicators.\n\n## Scope and Revisiting\n\nThis record is `draft`. It applies to every platform team in my organization that runs production systems other teams depend on — including those whose \"production\" is the development infrastructure itself. I revisit it if **pager load stays above five meaningful pages per engineer per week for more than a quarter** despite stability work, if operational work consumes roughly half of a team's engineering capacity (the staffing-reassessment trigger), or if operational reviews stop producing changes to engineering priorities.\n\n## Authoritative References\n\n- Camille Fournier and Ian Nowland, *Platform Engineering: A Guide for Technical, Product, and People Leaders* (O'Reilly, 2024) — the \"Operating Platforms\" chapter, whose checklist this record distills.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "6 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Establish Core Operational Practices\n\n- [ ] Treat operational work as an ongoing responsibility, not something addressed only during incidents.\n- [ ] Ensure the platform team owns three core practices:\n  - [ ] On-call\n  - [ ] User support\n  - [ ] Operational feedback\n- [ ] Favor **essential practices over rigid processes**; adapt the process to the problem and team.\n\n## 2. Build a Sustainable On-Call Practice\n\n- [ ] Provide 24×7 coverage when the platform can affect critical business operations.\n- [ ] Use a **merged DevOps model** where software developers and systems/operations engineers participate in the same rotation.\n- [ ] Keep enough platform expertise on the rotation to diagnose issues across internal code, OSS, vendor systems, and integrations.\n- [ ] Avoid relying on a separate SRE/operations team that lacks deep platform context.\n- [ ] Exclude engineers from on-call only when they genuinely lack the necessary skills or willingness to operate the system.\n\n### Control On-Call Load\n\n- [ ] Aim for each engineer to be on-call **no more than 1 week in 4**.\n- [ ] Ideally, target **1 week in 6–8**.\n- [ ] Track pager load and after-hours interruptions.\n- [ ] Aim for **fewer than five meaningful pages per engineer per week**.\n- [ ] Treat more than five business-impacting pages per week as a platform-stability problem.\n- [ ] Prioritize platform stability before adding more features when operational load is excessive.\n\n### Improve Alert Quality\n\n- [ ] Identify and eliminate false alarms.\n- [ ] Review noisy alerts after deployments, batch jobs, and other predictable events.\n- [ ] Keep alerts tied to meaningful customer or business impact.\n- [ ] Provide other ways for engineers to see system activity without relying on pages.\n- [ ] Regularly tune alert thresholds and conditions.\n\n### Secondary On-Call\n\n- [ ] Avoid routine secondary rotations that merely forward incidents to the primary team.\n- [ ] Use another platform team as secondary only for rare, true emergencies.\n- [ ] Ensure secondary engineers have useful runbooks and escalation paths.\n\n### Compensation and Fairness\n\n- [ ] Focus first on reducing unnecessary after-hours work.\n- [ ] Make on-call expectations and compensation consistent and fair.\n- [ ] Avoid using extra pay as a substitute for fixing an unsustainable on-call load.\n\n## 3. Make Platform Engineers Participate in Support\n\n- [ ] Ensure platform engineers regularly hear directly from users.\n- [ ] Use support work to expose usability problems, confusing abstractions, and missing platform capabilities.\n- [ ] Avoid shielding engineers so completely that they lose empathy for users.\n- [ ] Treat repeated support questions as potential product or documentation problems.\n\n## 4. Formalize Support Levels\n\n- [ ] Categorize incoming requests before deciding staffing levels.\n- [ ] Separate common request types, such as:\n  - [ ] Production troubleshooting\n  - [ ] Noncritical platform bugs\n  - [ ] Help using the platform\n  - [ ] Feature requests submitted as bugs\n  - [ ] Pull-request reviews\n  - [ ] Complex architectural/design questions\n- [ ] Investigate categories that generate more than a few requests per week.\n- [ ] Reduce repeated requests through:\n  - [ ] Better documentation\n  - [ ] User training\n  - [ ] Improved diagnostics\n  - [ ] Platform/product changes\n- [ ] Define clear support service levels.\n- [ ] Specify what qualifies as a **critical incident**.\n- [ ] Define when users may page the platform team.\n- [ ] Define expected response times for noncritical issues.\n- [ ] Tie urgent engagement to concrete business impact, not merely user preference.\n- [ ] Build stakeholder trust so support rules are respected.\n\n## 5. Separate Noncritical Support from On-Call\n\n- [ ] Keep critical, after-hours incidents on the on-call rotation.\n- [ ] Move noncritical support work to a **business-hours support rotation** when volume becomes substantial.\n- [ ] Avoid assigning all support permanently to a product manager or engineering manager.\n- [ ] Track total operational load across both support and on-call duties.\n- [ ] Reassess staffing if operational work consumes roughly half or more of engineering capacity.\n\n## 6. Add Support Specialists When Needed\n\n- [ ] Hire a support specialist only after improving documentation, tooling, training, and platform usability.\n- [ ] Prefer versatile technical support engineers who can handle both basic and advanced cases.\n- [ ] Avoid creating a dead-end Tier 1 role with no growth path.\n- [ ] Consider hiring engineers with nontraditional backgrounds who can grow into platform engineering.\n- [ ] Give support specialists structured training and development opportunities.\n- [ ] Reassess whether support staffing needs are permanent or temporary.\n\n## 7. Support Far-Flung Time Zones Deliberately\n\n- [ ] Establish reliable **business-hours support** for new offices or acquisitions in distant time zones.\n- [ ] Consider temporarily relocating an experienced team member to train the new location.\n- [ ] Consider a \"reverse embed,\" bringing someone from the new location to the main team for several months.\n- [ ] Hire locally only when training and integration can be supported effectively.\n- [ ] Avoid indefinite off-hours \"best effort\" support from the existing team.\n\n## 8. Scale Support with an Engineering Support Organization\n\n- [ ] At a large scale, consider a centralized Tier 1 engineering support organization.\n- [ ] Keep platform teams responsible for Tier 2 and escalated cases.\n- [ ] Define different SLAs based on application/business criticality.\n- [ ] Require critical customer/application teams to maintain their own on-call coverage when appropriate.\n- [ ] Maintain a healthy mix of software development and systems expertise.\n- [ ] Build a network of domain experts for difficult Tier 2 cases.\n- [ ] Hold regular feedback sessions between support teams and platform on-call engineers.\n- [ ] Convert recurring support pain into documentation, tooling, and platform improvements.\n\n## 9. Define Useful SLOs and SLAs\n\n- [ ] Create SLOs that help engineers understand platform health.\n- [ ] Use SLOs to guide monitoring and on-call investigation.\n- [ ] Keep the number of **customer-facing SLOs small** — ideally only a handful.\n- [ ] Ensure customer-facing SLOs minimize false positives.\n- [ ] Prefer an occasional explainable false negative over constant noisy alarms.\n- [ ] Use more detailed internal SLOs for broad system coverage.\n- [ ] Internally, do **not** optimize solely to minimize false positives.\n- [ ] Investigate both false positives and false negatives.\n- [ ] Use failing-minute trends to communicate operational problems when useful.\n- [ ] Treat error budgets as optional rather than automatically required.\n- [ ] Use error budgets only when they clearly improve decision-making and justify their overhead.\n\n## 10. Implement Change Management\n\n- [ ] Document all production changes.\n- [ ] Review all production changes.\n- [ ] Test changes before they handle production traffic directly.\n- [ ] Maintain explicit change-management discipline until safe automation is mature.\n- [ ] Invest in release engineering when the risk of manual deployment remains high.\n- [ ] Use incidents caused by changes as feedback for better automation.\n- [ ] Avoid removing safeguards before reliable automated alternatives exist.\n- [ ] Keep release engineering proportional; do not turn the platform team into a massive deployment-tooling project.\n\n## 11. Build Synthetic Monitoring\n\n- [ ] Implement synthetic monitoring in addition to metrics, logs, and tracing.\n- [ ] Exercise the platform from the user/customer perspective.\n- [ ] Test important end-to-end workflows rather than only individual components.\n- [ ] Ensure synthetic tests can detect failures before customers report them.\n- [ ] Use synthetic monitoring to validate customer-facing SLOs.\n- [ ] Include realistic multi-component and multi-API scenarios.\n- [ ] Use synthetic failures to uncover confusing or flaky platform behavior.\n- [ ] Let engineers gain operational experience by troubleshooting synthetic failures.\n- [ ] Use synthetic tests to improve incident triangulation.\n- [ ] Budget ongoing engineering and infrastructure capacity for synthetic monitoring.\n\n## 12. Run Regular Operational Reviews\n\n- [ ] Hold a simple **30–60-minute weekly operational review** at the team level.\n- [ ] Review:\n  - [ ] Pages and lower-severity on-call issues\n  - [ ] Customer support issues\n  - [ ] Incident/outage postmortems\n  - [ ] Production changes\n  - [ ] Important SLIs and SLOs\n- [ ] Rotate meeting preparation and facilitation where practical.\n- [ ] Focus on patterns, outliers, trends, and actionable problems.\n- [ ] Keep the meeting lightweight but rigorous.\n- [ ] Avoid turning reviews into process theater.\n\n### Organization-Level Reviews\n\n- [ ] Review the highest-impact incidents and outages.\n- [ ] Review meaningful metric outliers across teams.\n- [ ] Use technically credible facilitators who can keep the discussion focused.\n- [ ] Avoid one-size-fits-all operational processes across every platform team.\n- [ ] Adapt actions to each platform's situation.\n\n## 13. Close the Feedback Loop\n\n- [ ] Convert operational data into engineering priorities.\n- [ ] Track remediation items from postmortems until completed.\n- [ ] Ensure recurring pages trigger investigation into their root causes.\n- [ ] Use support trends to improve documentation, tooling, and platform design.\n- [ ] Ensure engineering managers and platform leaders participate in operational reviews.\n- [ ] Give leaders enough operational context to make informed investment decisions.\n- [ ] Balance feature development with reliability and operational work.\n- [ ] Hold platform engineers accountable for operating the systems they build.\n\n## Quick Health Check\n\n- [ ] On-call load is sustainable.\n- [ ] False alarms are uncommon.\n- [ ] Engineers regularly interact with users.\n- [ ] Critical and noncritical support are handled differently.\n- [ ] Repeated support issues are being eliminated, not merely answered.\n- [ ] Customer-facing SLOs are few and meaningful.\n- [ ] Production changes are documented, reviewed, and tested.\n- [ ] Synthetic monitoring covers critical end-to-end paths.\n- [ ] Operational reviews happen regularly.\n- [ ] Postmortem and review actions are actually completed.\n- [ ] Leadership uses operational feedback to change priorities.\n- [ ] Operational work is treated as a core part of platform engineering — not as an interruption to it.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why the engineers who build a platform operate it — and why operational load gets real numbers — in nine panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. KAI: a hands-on platform engineering lead, short dark hair, gray zip-up hoodie with a small gear pin, laptop covered in infrastructure stickers under one arm, a coil of cable slung over the shoulder.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and teal accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: a platform slab with small team buildings stacked on top, all wobbling from a crack underneath.](assets/images/operating-platforms/comic-01-a-promise-to-be-there.jpeg)\n**Panel 1:** *The hook: a platform is a promise to be there — every team on top inherits every outage.*\n\n![Comic panel: Kai coding at his sticker-covered laptop while a buzzing pager and a heap of unread alert notes pile up unmeasured.](assets/images/operating-platforms/comic-02-ops-as-interruption.jpeg)\n**Panel 2:** *The problem: operations treated as an interruption — and an operational load nobody measures.*\n\n![Comic panel: an ops worker behind a wall shrugs and passes an escalation note straight back to Kai, while Vera looks on with her notebook.](assets/images/operating-platforms/comic-03-the-context-free-ops-team.jpeg)\n**Panel 3:** *The wrong way: hand the pager to a context-free ops team and every incident becomes an escalation chain.*\n\n![Comic panel: Vera points at three circles labeled on-call, support, and feedback while Kai clips on the pager himself.](assets/images/operating-platforms/comic-04-the-builders-operate-it.jpeg)\n**Panel 4:** *The principle: the engineers who build the platform operate it — on-call, support, and operational feedback are core work.*\n\n![Comic panel: Kai points at a wall gauge showing on-call limits of one week in four and fewer than five pages per week, needle nearing red, as Vera watches.](assets/images/operating-platforms/comic-05-load-has-numbers.jpeg)\n**Panel 5:** *How it plays out, on-call: load has numbers — at most one week in four, fewer than five meaningful pages — and a breach is a stability problem.*\n\n![Comic panel: Kai at a support desk holds up one of many identical question cards like a clue.](assets/images/operating-platforms/comic-06-support-is-a-sensor.jpeg)\n**Panel 6:** *How it plays out, support: engineers hear users directly — a repeated question is a product defect with a name and a frequency.*\n\n![Comic panel: a critical incident lane and a business-hours support lane feed a review table where Vera and Kai move a card onto a priorities board.](assets/images/operating-platforms/comic-07-two-lanes-one-review.jpeg)\n**Panel 7:** *How it plays out, feedback: noncritical support runs in its own lane, and the weekly review turns operational signals into engineering priorities.*\n\n![Comic panel: Kai sets aside a new-feature box to repair a cracked platform slab while Vera watches, ignoring a crossed-out offer of extra pay.](assets/images/operating-platforms/comic-08-stability-outranks-features.jpeg)\n**Panel 8:** *The cost: when the numbers breach, stability work outranks new features — extra pay is never the fix for an unsustainable pager.*\n\n![Comic panel close-up: Vera shows a notebook sketch of a healthy gauge while Kai stands with a quiet pager.](assets/images/operating-platforms/comic-09-unmeasured-is-unmanaged.jpeg)\n**Panel 9:** *The closer: a platform whose operational load is unmeasured is a platform whose stability is unmanaged.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
