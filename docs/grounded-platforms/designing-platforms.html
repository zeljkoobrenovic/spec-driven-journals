<script id="data" type="application/json">{"meta": {"id": "PLT-DESIGNING-PLATFORMS", "status": "draft:gray", "title": "Designing Platforms", "date": "2026-08-12", "author": "Željko Obrenović", "permalink": "designing-platforms", "timetoread": "6 min", "excerpt": "A platform earns its keep through design decisions, not a component list. I design platforms as fruit salads, not fruit baskets: integrated, opinionated, and valuable even when adopted only in part. Every abstraction must speak a higher-level vocabulary without becoming an illusion that hides essential complexity, every wrapper is a last resort, and the platform floats on its base by retiring what gets commoditized underneath it. And because abstractions break down hardest during failure, I design for the unhappy path from day one.", "tags": "platform strategy, platform design, abstractions, architecture, developer experience, cognitive load", "icon": "assets/icons/designing-platforms.png", "logo": "assets/images/designing-platforms/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["platform strategy", "platform design", "abstractions", "architecture", "developer experience", "cognitive load"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: I design platforms as fruit salads, not fruit baskets: the value must come from integration, defaults, automation, and reduced toil — not from cataloging tools that users could have installed themselves. The 7 Cs of platform quality are trade-off dimensions I weigh and document, not qualities to maximize. Every horizontal capability earns its existence through concrete user benefit; every wrapper is a last resort after configuration, hooks, and tracking; every abstraction speaks a higher-level domain vocabulary without becoming an illusion that hides essential complexity. The platform floats on its base by retiring what gets commoditized underneath it, and it is designed for failure, because an abstraction that hides essential complexity has not simplified anything — it has just moved the bill.\n\n## Statement\n\nMy operating model for platform design has six commitments.\n\n- **Weigh the 7 Cs; do not maximize them.** Cohesion, closure, completeness, consistency, commensurate value, connectedness, and captivity are dimensions for evaluating design trade-offs. I document which ones matter most for each platform and what we traded away — chasing all seven at once buys complexity, not quality.\n- **Build a fruit salad, not a fruit basket.** The platform must provide more value than installing or cataloging existing tools: shared identity and conventions, sensible defaults, automation that kills repetitive work, information flowing between components, and toil visibly reduced. Users can start small and still get value.\n- **Earn every horizontal capability.** The platform is vertical components joined by horizontal layers — and each horizontal layer exists only for a concrete reason: reuse, governance, or better operations. Standardization by architectural preference does not qualify.\n- **Float; do not sink.** The base platform underneath us keeps evolving. When it commoditizes something we built, we retire our version, give users a migration path, and redirect the freed capacity — no sunk-cost reasoning, no platform that only gains weight.\n- **No grim wrappers; abstractions, not illusions.** Before any new interface over an existing platform, I exhaust configuration, interception, and tracking. When we do abstract, the abstraction is a higher-level vocabulary grounded in a real domain — and essential characteristics such as failures, latency, and cost stay visible where users need them to make correct decisions.\n- **Design for failure, not only the happy path.** Platform errors trace back to their lower-level origin, experienced users can open the hood, failure modes are documented as part of the abstraction, and we keep people who understand the layers underneath well enough to diagnose problems that cross them.\n\n## How to Read This\n\nThis journal is my platform operating model, one record per source checklist. This record is grounded in the \"Designing Platform\" chapter checklist of Gregor Hohpe's *Platform Strategy: Innovation Through Harmonization* (Leanpub, 2024) — the chapter on what separates a platform that creates value from a bundle of tools with a portal in front. The runnable version — the 7 Cs assessment, the fruit-salad test, the wrapper interrogation, and the final go/no-go review — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**The fruit-salad test is the whole game.** Anyone can assemble a fruit basket: buy the tools, install them, publish a catalog page. Hohpe's point is that a basket adds almost nothing — users could have done the assembly themselves, and now they carry our version's quirks on top. A fruit salad is different: components are meaningfully integrated, defaults get people started quickly, automation removes manual glue, and information flows across the pieces — operational metrics linked to deployments linked to source changes. That integration work is invisible in an architecture diagram and decisive in daily use, which is why I measure platform features by user value delivered, never by how hard they were to build.\n\n**Trade-off discipline beats quality maximization.** The 7 Cs give me a vocabulary for what \"good\" means — but a platform maximizing all seven collapses under its own ambition. Completeness fights simplicity; consistency fights the autonomy of individual components; low captivity fights deep integration. The chapter's framing is that these are dimensions to *evaluate trade-offs*, and the discipline I take from it is documentation: for each platform, we write down which Cs matter most and which we consciously sacrificed. A trade-off nobody wrote down gets relitigated in every design review.\n\n**Horizontal layers are where platforms quietly rot.** Every architect is tempted to add shared layers — a common portal, a unified API, one identity for everything. Some of that is exactly what makes the salad a salad. But a horizontal capability that exists because of architectural preference rather than user benefit is pure coupling: it slows every vertical component's evolution and delivers nothing anyone asked for. So each horizontal layer must answer for itself — does it increase reuse, support necessary governance, or improve operations across components? If none of the three, it goes.\n\n![Architecture diagram: vertical components crossed by horizontal layers badged reuse, governance, and operations, with an unbadged gray layer sliding out.](assets/images/designing-platforms/vertical-components-horizontal-capabilities.jpeg)\n**Figure 1:** *Vertical components, horizontal capabilities: every horizontal layer earns its place through reuse, governance, or operations — an unjustified one goes.*\n\n\n**Floating is a survival posture, not a nice-to-have.** Our platform sits on cloud and vendor platforms that ship features continuously. Every year, some of what we built becomes a commodity underneath us. A sinking platform keeps its duplicated functionality out of sunk-cost pride and pays twice: the maintenance cost of the redundant layer and the opportunity cost of the differentiated capability we did not build. A floating platform periodically compares itself against the base, retires what has been commoditized — with a migration path, not an ambush — and reinvests the freed capacity. This only works if components are modular enough to be replaced without cascading changes, which is itself a design requirement, not an afterthought.\n\n![Two timelines: a platform that keeps every block gets swallowed by the rising base, while one that retires overlapping blocks stays thin on top.](assets/images/designing-platforms/float-on-the-rising-base.jpeg)\n**Figure 2:** *Float, do not sink: as the base platform commoditizes functionality, a floating platform retires its overlapping blocks and reinvests the capacity.*\n\n\n**Wrappers and illusions are the two ways abstraction goes wrong.** The grim wrapper reduces the number of API operations while increasing cognitive load: it lags the fast-moving platform underneath, cuts users off from external documentation and community knowledge, flattens different technologies into a lowest common denominator, and adds one more component we must run, secure, and upgrade. The illusion is subtler: an interface that looks beautifully simple but hides retries, backpressure, timeouts, latency, and cost — exactly the things users need to reason about to build correct systems. A genuine abstraction does neither; it gives users a higher-level vocabulary rooted in a real domain and keeps the essential characteristics of the underlying system represented. If a \"simple\" interface needs extensive documentation to explain its hidden behavior, the model is wrong.\n\n![Side-by-side diagram: an illusion facade sealing away failure, latency, and cost icons versus an abstraction surface exposing them as small gauges.](assets/images/designing-platforms/abstraction-vs-illusion.jpeg)\n**Figure 3:** *Abstraction versus illusion: a genuine abstraction speaks a higher-level vocabulary while keeping failures, latency, and cost visible where users need them.*\n\n\n**Failure is where the design is actually tested.** Abstractions are judged on the happy path and broken on the unhappy one. When a platform-level operation fails, the user's first question is *which underlying component did this* — and a platform without an equivalent of a stack trace turns every incident into archaeology. So I require error messages that preserve context, observability into the underlying components, documented failure modes, a recovery path, and open-the-hood access for specialists. And I keep people on the team who understand the underlying technology deeply, because someone has to diagnose the failures that cross abstraction boundaries.\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| Platform value comes from integration, defaults, and automation. | Bundling tools behind a catalog page is a platform — that is a fruit basket. |\n| The 7 Cs are weighed, and the trade-offs are written down. | Every quality dimension gets maximized — that is how platforms drown in complexity. |\n| Horizontal capabilities exist for reuse, governance, or operations. | Shared layers are justified by architectural elegance — preference is not a user benefit. |\n| Commoditized functionality is retired, with a migration path. | We defend what we built because we built it — sunk cost is not a strategy. |\n| Configuration, hooks, and tracking come before any new wrapper. | Every underlying tool gets hidden behind our universal interface. |\n| Abstractions keep failures, latency, and cost visible where they matter. | A good abstraction makes complexity disappear — hiding essential complexity makes an illusion, not an abstraction. |\n| Errors trace to their origin and specialists can open the hood. | The happy path is the design; failure handling is an operational detail. |\n\nConcretely: every platform we run has a written statement of which Cs it optimizes and what it traded away, every proposed wrapper has survived the configuration-hooks-tracking interrogation first, and every platform-level error a user sees can be traced to the component that caused it. Once a year, at minimum, we list what the base platform commoditized and what we are therefore retiring — **a platform roadmap that only ever adds is a platform that is sinking**.\n\n## Anti-Patterns\n\n- **The fruit basket.** A catalog of installed tools presented as a platform — no shared identity, no defaults, no automation, no information flow. Users carry the integration burden themselves, plus our quirks.\n- **The seven-C maximizer.** A design that tries to score top marks on every quality dimension and delivers complexity nobody can operate or evolve.\n- **The org-chart horizontal.** A shared layer that exists because a team wanted a mandate, not because it increases reuse, governance, or operational quality.\n- **The sinking platform.** Redundant functionality defended long after the base platform commoditized it — gaining weight every year, shedding nothing, funding maintenance instead of differentiation.\n- **The grim wrapper.** A new interface over a fast-moving platform that lags its innovations, severs users from community knowledge, and adds an operational burden — while claiming to reduce cognitive load because it has fewer API calls.\n- **The illusion.** An abstraction that pretends a distributed system is simple — hiding retries, partial failures, latency, and cost until the first serious incident reveals everything at once.\n- **The opaque failure.** A platform-level error with no trace to the underlying cause, no hood to open, and no one left who understands the layers below.\n\n## Related Records\n\n- [Understanding Platforms](understanding-platforms.html) — what platforms are and why harmonization beats standardization; this record applies that philosophy to concrete design decisions.\n- [Strategy for Platforms](platform-strategy.html) — the strategic frame that decides what the platform should be; this record governs the quality of what gets designed inside that frame.\n- [Implementing Platforms](implementing-platforms.html) — the build, buy, and sizing decisions that turn a design into a running platform; this record is the design bar those implementations must meet.\n- [Rearchitecting Platforms](rearchitecting-platforms.html) — the discipline of evolving a platform that already exists; the float-or-sink commitment here is what makes that evolution survivable.\n- [The Four Pillars of Platform Engineering](four-pillars.html) — the platform-engineering pillar view of curated products and software abstractions; this record is the design doctrine behind the abstractions pillar.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs the design of every internal platform where I am the accountable executive — developer platforms, data platforms, and shared service layers alike. I revisit it if a platform's adoption stalls while its component count grows (the fruit-basket signal), if incident reviews keep showing failures that cannot be traced across abstraction boundaries, or if the base platforms underneath us commoditize faster than our retirement discipline can keep up.\n\n## Authoritative References\n\n- Gregor Hohpe, *Platform Strategy: Innovation Through Harmonization* (Leanpub, 2024) — the \"Designing Platform\" chapter, whose checklist this record distills.\n"}]}, {"key": "summary", "label": "TL;DR", "meta": {"timetoread": "2 min read"}, "blocks": [{"type": "markdown", "content": "I design platforms as **fruit salads, not fruit baskets**: the value must come from integration, defaults, automation, and reduced toil — not from cataloging tools users could have installed themselves. Every abstraction must speak a higher-level vocabulary without becoming an **illusion** that hides essential complexity, because an abstraction that hides essential complexity has not simplified anything — it has just moved the bill.\n\n**What changes**\n\n* The **7 Cs** — cohesion, closure, completeness, consistency, commensurate value, connectedness, captivity — are used as trade-off dimensions, never as a maximization recipe. Each platform gets a written statement of which Cs it optimizes and what it consciously traded away; an undocumented trade-off gets relitigated in every design review.\n* Every **horizontal capability earns its existence** through a concrete answer: does it increase reuse, support necessary governance, or improve operations across components? Architectural preference does not qualify — an unjustified shared layer is pure coupling, and it goes.\n* The platform **floats on its evolving base**: at least once a year we list what the base platform has commoditized, retire our overlapping functionality with a migration path, and reinvest the freed capacity. A roadmap that only ever adds is a platform that is sinking.\n* **Wrappers become a last resort.** Before any new interface over an existing platform, we exhaust configuration, interception hooks, and tracking — because the grim wrapper lags the platform underneath, severs users from community knowledge, and adds an operational burden while claiming to reduce cognitive load.\n* **Failure is designed for from day one**: platform errors trace to their lower-level origin, failure modes are documented as part of the abstraction, specialists can open the hood, and we keep people who understand the layers underneath.\n\n**What it costs**\n\n* Integration work is invisible in architecture diagrams and expensive in practice — we measure platform features by user value delivered, never by how hard they were to build.\n* Retiring commoditized functionality means abandoning things we are proud of, and keeping components modular enough to be replaceable is itself a standing design requirement.\n* Keeping failures, latency, and cost visible makes interfaces look less \"clean\" than a sealed facade — that honesty is the point.\n\n**What we are not doing**\n\n* Not re-arguing what a platform is or why harmonization beats standardization — that is [Understanding Platforms](understanding-platforms.html).\n* Not build/buy, sizing, or delivery mechanics — [Implementing Platforms](implementing-platforms.html) owns those; this record is the design bar they must meet. Team shape and engagement models stay in [Organizing for Platforms](organizing-for-platforms.html).\n* Not a technology catalog — no positions on specific IDPs, clouds, or orchestrators.\n\n*The Article tab carries the rationale and anti-patterns; the Checklist tab holds the 7 Cs assessment, the fruit-salad test, the wrapper interrogation, and the go/no-go review.*\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "4 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Assess the 7 \"C\"s of Platform Quality\n\n- [ ] **Cohesion:** Does the platform feel like one meaningful whole rather than a collection of unrelated tools?\n- [ ] **Closure:** Within the platform's chosen scope, are all necessary supporting pieces present or integrated?\n- [ ] **Completeness:** Does the platform provide a complete user experience, including self-service, automation, debugging, documentation, training, and support where needed?\n- [ ] **Consistency:** Are security, error handling, terminology, workflows, and other shared functions consistent across services?\n- [ ] **Commensurate Value:** Can users gain useful value from adopting only part of the platform?\n- [ ] **Connectedness:** Does the platform integrate effectively with surrounding systems such as identity, monitoring, and enterprise tooling?\n- [ ] **Captivity:** Can users leave or replace the platform without redesigning their entire solution?\n- [ ] Have we explicitly documented which of the 7 Cs matter most for our platform?\n- [ ] Have we documented the trade-offs between them?\n- [ ] Are we avoiding excessive complexity in the pursuit of maximizing every quality?\n\n*The source presents the 7 Cs as dimensions for evaluating design trade-offs rather than as a recipe in which every dimension must be maximized.*\n\n## 2. Build a \"Fruit Salad,\" Not Just a \"Fruit Basket\"\n\n- [ ] Does the platform provide more value than simply installing or cataloging existing tools?\n- [ ] Are individual platform components meaningfully integrated?\n- [ ] Do users have shared account settings, identity, conventions, or workflows where appropriate?\n- [ ] Are sensible defaults provided so users can get started quickly?\n- [ ] Does automation eliminate repetitive work or manual integration?\n- [ ] Can information flow between components — for example, linking operational metrics to deployments and source-code changes?\n- [ ] Does the combined platform support useful scenarios that individual components cannot support as easily?\n- [ ] Does the platform reduce user toil?\n- [ ] Can users start small rather than having to adopt the entire platform before receiving value?\n- [ ] Are platform constraints sufficiently opinionated to create a smooth experience without becoming unnecessarily restrictive?\n- [ ] Are we measuring features by user value, rather than by how difficult they were to build?\n- [ ] Are we resisting the temptation to hide every underlying tool behind a universal abstraction?\n\n*The text contrasts a \"fruit basket\" of loosely bundled tools with a \"fruit salad\" whose integration, defaults, automation, usability, and reduced toil create additional value.*\n\n## 3. Check the Horizontal and Vertical Architecture\n\n- [ ] Have we identified the platform's independent vertical components or services?\n- [ ] Have we identified the shared horizontal capabilities that tie those components together?\n- [ ] Does each horizontal capability have a clear reason to exist?\n  - [ ] Does it increase reuse?\n  - [ ] Does it support necessary governance?\n  - [ ] Does it improve operations across components?\n- [ ] Have we clearly separated the data plane, control plane, and management/user-facing layers where relevant?\n- [ ] Do users encounter unnecessary duplicate portals, consoles, or identities?\n- [ ] Can independent platform components evolve without breaking the overall user experience?\n- [ ] Where we want stronger horizontal standardization, is there a concrete user benefit rather than merely an architectural preference?\n\n*The \"cantilevered platform\" model treats platforms as vertical services joined by horizontal capabilities, with reuse, governance, and operational improvement given as major reasons for introducing those shared layers.*\n\n## 4. Decide Whether the Platform Will \"Float\" or \"Sink\"\n\n- [ ] Have we explicitly defined what happens when the underlying cloud/base platform introduces functionality that duplicates ours?\n- [ ] Do we periodically compare our platform capabilities with new capabilities from the base platform?\n- [ ] Can redundant internal functionality be retired?\n- [ ] Do we have a migration path for users when functionality is retired?\n- [ ] Can the capacity freed by retirement be redirected toward higher-value capabilities?\n- [ ] Are we avoiding sunk-cost reasoning when deciding whether to retain an internal feature?\n- [ ] Are we evaluating the opportunity cost of maintaining duplicated functionality?\n- [ ] Are platform components modular enough that individual capabilities can be replaced without changes cascading through the entire platform?\n- [ ] Are we preventing the platform from continually gaining \"weight\" without shedding obsolete functionality?\n- [ ] Are we prepared for the continuous evolution of the underlying platform?\n\n*A \"floating\" platform retires functionality that the base platform has commoditized and redirects effort toward new differentiated capabilities; keeping duplicated functionality can create maintenance and opportunity costs.*\n\n## 5. Avoid the \"Grim Wrapper\"\n\nBefore creating a new interface over an existing platform:\n\n- [ ] Can our requirement be satisfied through configuration instead?\n- [ ] Could we use interception/hooks to apply defaults or controls while retaining the original interface?\n- [ ] Could tracking and feedback provide adequate governance without restricting the underlying API?\n- [ ] Is a completely new wrapper genuinely necessary?\n- [ ] If an operation is rejected, does the user receive a detailed explanation?\n- [ ] Can our wrapper keep pace with changes and innovations in the underlying platform?\n- [ ] Does the wrapper actually reduce cognitive load rather than merely reduce the number of API operations?\n- [ ] Are users still able to benefit from external documentation, community knowledge, and skills?\n- [ ] Are we avoiding a lowest-common-denominator abstraction across different technologies?\n- [ ] Are important physical realities such as latency, cost, or service characteristics still visible where necessary?\n- [ ] Have we accounted for the operational burden of running, securing, upgrading, and supporting our new abstraction?\n- [ ] Have we considered whether the wrapper targets the control plane or runtime/data plane, and whether that distinction changes the trade-off?\n\n*The book warns that wrappers can lag behind rapidly evolving base platforms, create additional cognitive load, disconnect users from external expertise, conceal important characteristics, and introduce another component that must be operated.*\n\n## 6. Build Abstractions, Not Illusions\n\n- [ ] Does each abstraction provide a higher-level vocabulary rather than merely rename underlying products?\n- [ ] Are concepts named according to user intent or purpose instead of implementation details?\n- [ ] Is the abstraction based on a real user or business domain?\n- [ ] Does it form a coherent domain model rather than a collection of unrelated convenience APIs?\n- [ ] Have we distinguished simple composition from genuine abstraction?\n- [ ] Are the essential characteristics of the underlying system still represented?\n- [ ] Have we avoided hiding inherent distributed-system concepts such as retries, backpressure, batching, timeouts, or ordering when users need to reason about them?\n- [ ] Are important concepts represented explicitly rather than buried inside generic strings or numeric configuration fields?\n- [ ] Does the abstraction make it easier to work with a complex problem, rather than pretending it's simple?\n- [ ] Do we periodically reconsider what information is \"essential,\" recognizing that concerns such as cost, resource usage, and sustainability can change over time?\n- [ ] If the interface looks extremely simple but requires extensive documentation to explain hidden behavior, have we reconsidered the model?\n\n*The text defines meaningful abstraction as a higher-level vocabulary based on domain understanding and warns that abstractions become \"illusions\" when they conceal essential complexity.*\n\n## 7. Design for Failure, Not Only the Happy Path\n\n- [ ] Have we tested what happens when underlying components fail?\n- [ ] Can users determine which underlying component caused a platform-level error?\n- [ ] Do error messages preserve enough context to diagnose the root cause?\n- [ ] Is there an equivalent of a stack trace linking high-level platform failures to their lower-level origin?\n- [ ] Can experienced users or operators \"open the hood\" and inspect lower layers when necessary?\n- [ ] Do we provide observability into the platform's underlying components?\n- [ ] Are failure modes documented as part of the abstraction?\n- [ ] Does the platform provide users with a clear recovery path when something goes wrong?\n- [ ] Have we considered partial failures rather than assuming an operation either succeeds completely or fails completely?\n- [ ] Is the abstraction optimized for debuggability as well as ease of use?\n- [ ] Is the learning curve gentle enough for normal users while still allowing specialists to investigate deeper problems?\n- [ ] Do we have people who understand the underlying technology deeply enough to diagnose failures that cross abstraction boundaries?\n\n*The final chapter emphasizes that abstractions often break down during failure and recommends linking high-level errors back to their origin, designing abstractions for error scenarios, and retaining enough understanding of lower layers to diagnose unusual problems.*\n\n## Final Go/No-Go Review\n\n- [ ] The platform provides clear value beyond its individual components.\n- [ ] The most important 7 Cs and their trade-offs are explicitly defined.\n- [ ] Users can obtain value without adopting everything at once.\n- [ ] Shared horizontal capabilities exist because they provide measurable value.\n- [ ] The platform has a defined strategy for base-platform evolution.\n- [ ] Redundant functionality can be removed without destabilizing the entire platform.\n- [ ] Custom wrappers are used only where their benefits outweigh their long-term costs.\n- [ ] Abstractions expose a meaningful domain rather than creating an illusion of simplicity.\n- [ ] Failure scenarios are observable, diagnosable, and recoverable.\n- [ ] The platform reduces cognitive load without hiding information users need to make correct decisions.\n- [ ] The overall design remains simple enough to evolve over time.\n"}]}, {"key": "dialog", "label": "Conversation", "meta": {"timetoread": "8 min listen"}, "blocks": [{"type": "markdown", "content": "## Fruit Salad, Fruit Basket\n\n**Ben:** I have to start with the metaphor, because it is doing a lot of work in this record. Fruit salad versus fruit basket — is that really a design doctrine, or just a memorable line?\n\n**Ana:** It is the sharpest test I know for internal platforms. Anyone can assemble a fruit basket: buy the tools, install them, publish a catalog page, call it a platform. A basket adds almost nothing — users could have done the assembly themselves, and now they carry our version's quirks on top of the tools. A fruit salad is different: the components are meaningfully integrated, defaults get people started quickly, automation removes the manual glue, and information flows across the pieces — operational metrics linked to deployments linked to source changes.\n\n**Ben:** But plenty of platform teams would say they *are* integrated. There is a portal, single sign-on, a consistent look.\n\n**Ana:** A portal in front of unconnected tools is a basket with a nice handle. The test is whether toil visibly went down and whether information actually crosses component boundaries. That integration work is invisible in an architecture diagram and decisive in daily use — which is why the record measures platform features by user value delivered, never by how hard they were to build.\n\n**Ben:** And the users who only want one piece of the salad?\n\n**Ana:** They should get value anyway — users can start small and still benefit. A platform that is only useful if you adopt all of it has confused completeness with value.\n\n## Seven Dials You Cannot All Turn Up\n\n**Ben:** The record leans on the 7 Cs — cohesion, closure, completeness, consistency, commensurate value, connectedness, captivity. My allergy to frameworks says: seven words starting with C is marketing, not engineering.\n\n**Ana:** It would be, if the record used them as a scorecard. The commitment is the opposite: they are trade-off dimensions, not qualities to maximize. A platform chasing top marks on all seven collapses under its own ambition — completeness fights simplicity, consistency fights component autonomy, low captivity fights deep integration. You physically cannot turn all the dials up.\n\n**Ben:** So what do you actually do with them?\n\n**Ana:** Write the trade-off down. For each platform: which Cs matter most here, and which did we consciously sacrifice. That document is the deliverable. A trade-off nobody wrote down gets relitigated in every design review — the same argument, every quarter, with whoever showed up that day.\n\n**Ben:** Let me push on the architecture then. Every platform architect I know loves horizontal layers — one portal, one API gateway, one identity everywhere. Your record sounds suspicious of them.\n\n**Ana:** Suspicious is the right word. Some horizontal capability is exactly what makes the salad a salad. But each horizontal layer must answer for itself: does it increase reuse, support necessary governance, or improve operations across components? If none of the three, it goes. A horizontal layer that exists because of architectural preference is pure coupling — it slows every vertical component's evolution and delivers nothing anyone asked for. The anti-pattern has a name: the org-chart horizontal, a shared layer that exists because a team wanted a mandate.\n\n## Float or Sink\n\n**Ben:** Now the part I suspect is hardest in practice. You commit to retiring platform functionality when the base underneath commoditizes it. Teams hate deleting things they built. Why is this a design issue and not just portfolio hygiene?\n\n**Ana:** Because the platform sits on cloud and vendor platforms that ship features continuously — every year, some of what we built becomes a commodity underneath us. A sinking platform keeps its duplicated functionality out of sunk-cost pride and pays twice: maintenance on the redundant layer, plus the opportunity cost of the differentiated capability we did not build. A floating platform periodically compares itself against the base, retires what has been commoditized, and reinvests the freed capacity.\n\n**Ben:** \"Retire\" is doing gentle work there. For the teams using that functionality it reads as \"we broke you.\"\n\n**Ana:** Which is why the commitment says migration path, not ambush. And there is a design prerequisite hiding in it: floating only works if components are modular enough to be replaced without cascading changes. That is a design requirement from day one, not an afterthought. The record's operational tell is simple — at minimum once a year, we list what the base commoditized and what we are therefore retiring. A platform roadmap that only ever adds is a platform that is sinking.\n\n**Ben:** Related temptation: when the base platform feels too complex, teams build their own simpler interface over it. Your record calls that a \"grim wrapper,\" which is strong language for what most people call good developer experience.\n\n**Ana:** Because the wrapper's ledger is usually grim once you write it out. It lags the fast-moving platform underneath, so users wait on us for features the vendor already shipped. It cuts them off from external documentation and community knowledge — every Stack Overflow answer is now wrong for them. It flattens different technologies into a lowest common denominator. And it is one more component we must run, secure, and upgrade. All while claiming victory because it has fewer API operations. Fewer calls is not less cognitive load.\n\n**Ben:** So never wrap anything?\n\n**Ana:** Last resort, not never. Before any new interface, exhaust three alternatives: configuration, interception hooks, and tracking. If those genuinely cannot deliver the benefit, then we talk about a wrapper — knowingly, with the costs on the table.\n\n## Abstractions, Illusions, and the Unhappy Path\n\n**Ben:** Here is where I want to press hardest. The record says abstractions must keep failures, latency, and cost visible. Isn't hiding complexity the entire job description of an abstraction?\n\n**Ana:** Hiding *accidental* complexity, yes. The illusion is what you get when an interface hides *essential* complexity — retries, backpressure, timeouts, latency, cost — exactly the things users need to reason about to build correct systems. It looks beautifully simple in the demo, and then the first serious incident reveals everything at once. An abstraction that hides essential complexity has not simplified anything; it has just moved the bill. A genuine abstraction gives users a higher-level vocabulary grounded in a real domain, and keeps the essential characteristics of the underlying system represented.\n\n**Ben:** How do you tell which one you have built, before the incident does it for you?\n\n**Ana:** One tell from the record: if a \"simple\" interface needs extensive documentation to explain its hidden behavior, the model is wrong. The simplicity is cosmetic — the complexity did not go away, it moved into a PDF.\n\n**Ben:** And when things break anyway?\n\n**Ana:** That is where the design is actually tested. Abstractions are judged on the happy path and broken on the unhappy one. When a platform-level operation fails, the user's first question is: which underlying component did this? A platform without the equivalent of a stack trace turns every incident into archaeology. So the requirements are concrete: errors that preserve context back to their origin, observability into the underlying components, documented failure modes as part of the abstraction, a recovery path, and open-the-hood access for specialists. Plus one staffing consequence — we keep people who understand the underlying technology deeply, because someone has to diagnose the failures that cross abstraction boundaries.\n\n## What This Record Does Not Do\n\n**Ben:** Close with the boundaries. What is deliberately out of scope?\n\n**Ana:** Four things. It does not re-argue what a platform is or why harmonization beats standardization — that is [Understanding Platforms](understanding-platforms.html); this record assumes the platform is justified and governs how it is designed. It does not do build-versus-buy, sizing, or delivery — [Implementing Platforms](implementing-platforms.html) owns those, with this record as the quality bar. Team shape and engagement models belong to [Organizing for Platforms](organizing-for-platforms.html) — people appear here only as the specialists who diagnose cross-layer failures. And it takes no positions on specific IDPs, clouds, or orchestrators — it is a doctrine, not a technology catalog.\n\n**Ben:** And what reopens it?\n\n**Ana:** Three signals. Adoption stalling while the component count grows — the fruit-basket signal. Incident reviews that keep finding failures nobody can trace across abstraction boundaries. Or the base platforms commoditizing faster than our retirement discipline keeps up. The evolution story continues in [Rearchitecting Platforms](rearchitecting-platforms.html) — the float-or-sink commitment here is what makes that evolution survivable.\n\n**Ben:** One line to take away?\n\n**Ana:** If your platform's value would survive being replaced by a well-organized list of links, it was never a platform — it was a fruit basket with a roadmap.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why a platform is a fruit salad, not a fruit basket — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. KAI: a hands-on platform engineering lead, short dark hair, gray zip-up hoodie with a small gear pin, laptop covered in infrastructure stickers under one arm, a coil of cable slung over the shoulder.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and teal accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Kai unveils a shelf packed with separate boxed tools like a gift basket while Vera looks unconvinced.](assets/images/designing-platforms/comic-01-the-tool-catalog.jpeg)\n**Panel 1:** *The hook: anyone can assemble a fruit basket — buy the tools, install them, publish a catalog page.*\n\n![Comic panel: a tired developer tapes and strings separate tools together while the untouched platform shelf stands behind.](assets/images/designing-platforms/comic-02-the-integration-burden.jpeg)\n**Panel 2:** *The problem: a basket adds almost nothing — users could have assembled it themselves, and now they carry our quirks on top.*\n\n![Comic panel: a dull gray one-button box covers a vibrant machine sprouting new features, with a chained-off DOCS bookshelf nearby.](assets/images/designing-platforms/comic-03-the-grim-wrapper.jpeg)\n**Panel 3:** *The wrong way: the grim wrapper — fewer API calls, more cognitive load, lagging the platform it hides and severing users from its community.*\n\n![Comic panel: Vera presents a fruit salad bowl with connecting lines between pieces, next to a dull basket of separate whole fruits.](assets/images/designing-platforms/comic-04-the-fruit-salad.jpeg)\n**Panel 4:** *The principle: a fruit salad, not a fruit basket — integration, defaults, automation, and information flowing between components.*\n\n![Comic panel: Kai places some lettered weights on a balance scale while others stay on the table and Vera takes notes.](assets/images/designing-platforms/comic-05-weigh-the-seven-cs.jpeg)\n**Panel 5:** *How it plays out: the 7 Cs are trade-off dimensions — pick which matter most, document what you traded away.*\n\n![Comic panel: an overloaded sinking boat versus a boat where Kai offloads a crate and rides high on the rising sea.](assets/images/designing-platforms/comic-06-float-do-not-sink.jpeg)\n**Panel 6:** *How it survives: the base platform keeps rising — a floating platform retires what got commoditized underneath it; a sinking one only gains weight.*\n\n![Comic panel: Kai opens a hood on a platform machine and traces a glowing dotted line from an error flag to one inner component.](assets/images/designing-platforms/comic-07-open-the-hood.jpeg)\n**Panel 7:** *The cost of honesty: design for the unhappy path — errors trace to their origin, the hood opens, and someone still understands the layers below.*\n\n![Comic panel: behind a simple one-button facade, Vera pulls out a long unrolling receipt with clock, coin, and broken-link icons.](assets/images/designing-platforms/comic-08-it-just-moved-the-bill.jpeg)\n**Panel 8:** *The closer: an abstraction that hides essential complexity has not simplified anything — it has just moved the bill.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
