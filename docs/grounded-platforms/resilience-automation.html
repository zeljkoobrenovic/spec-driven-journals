<script id="data" type="application/json">{"meta": {"id": "PLT-REF-RESILIENCE", "status": "draft:gray", "title": "Resilience Automation", "date": "2026-08-20", "author": "Željko Obrenović", "permalink": "resilience-automation", "timetoread": "8 min", "excerpt": "When a platform team in my organization tells me the platform is resilient, my first question is: what proved it? This record holds the resilience build to one closed loop — SLOs with error budgets as the reliability contract, backups proven by scheduled restores, chaos experiments run deliberately against explicit expectations, and disaster recovery rehearsed against RTO and RPO targets. A backup that has never been restored is a hypothesis; a failover that has never been run is a hope. The reference stack is OpenSLO, Sloth, Prometheus, Grafana, and Chaos Mesh — but the commitment is the loop, not the tools.", "tags": "resilience, slo, error budgets, chaos engineering, backup and restore, disaster recovery, chaos mesh, kubernetes, reference implementation", "icon": "assets/icons/resilience-automation.png", "logo": "assets/images/resilience-automation/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["resilience", "slo", "error budgets", "chaos engineering", "backup and restore", "disaster recovery", "chaos mesh", "kubernetes", "reference implementation"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: Resilience is **proven, never assumed**. When a platform team in my organization builds the resilience capability, the build closes one loop: **define objectives** — SLOs with error budgets, RTO and RPO per service, tiered by business criticality; **inject failure deliberately** — pods, networks, resources, and managed dependencies, under explicit scope, expected behavior, and abort conditions; **measure against the objectives** — did the SLO hold, did recovery beat the RTO, did the restore preserve the data; **remediate and retest** — every gap becomes work, every fix is verified by running the experiment again. Backups exist only when restores are exercised. Disaster recovery exists only when failover is rehearsed. **A backup that has never been restored is a hypothesis; a failover that has never been run is a hope.**\n\n## Statement\n\nMy operating model holds the resilience capability of every internal platform to four proven practices, closed by one loop.\n\n![Diagram of a closed five-stage resilience loop — define objectives, inject failure, measure, remediate, retest — with SLOs, backup and restore, chaos experiments, and disaster recovery attached around it.](assets/images/resilience-automation/resilience-proof-loop.jpeg)\n**Figure 1:** *One loop, four practices: each practice — SLOs, backups, chaos, DR — is only real when the objectives–failure–measurement–remediation–retest loop closes on it.*\n\n**Objectives before automation:**\n\n- **SLOs as the reliability contract.** The most critical services are identified; each has SLIs (availability, error rate, request success rate, latency), a target over a defined window (typically rolling 30 days), and a calculated error budget. Targets are **tiered by business criticality** — one uniform number for everything is a vanity metric.\n- **Budgets with consequences.** What happens when the error budget nears exhaustion is written down before it happens, including deployment-freeze criteria where appropriate.\n- **Definitions as code.** SLO definitions are version-controlled configuration in a vendor-neutral form; alerting and recording rules are generated from them, not hand-written; SLO status — compliance, budget remaining, burn rate, remaining allowable downtime — is published on dashboards, with alerts on violations and excessive burn.\n- **RTO and RPO per important service.** Recovery time and data-loss tolerances are explicit, tiered by business impact — and they drive the automation: backup frequency is tuned to the RPO, recovery automation to the RTO, never the reverse.\n\n**Backups proven by restores:**\n\n- **Automated, complete, durable.** Kubernetes resources — CRDs, Secrets, ConfigMaps, persistent volumes — are backed up automatically, with CSI snapshots where applicable, stored in durable object storage with defined retention and cross-region replication where DR requires it. Scheduled and on-demand.\n- **Restore is the product.** Restoration of resources and volumes is automated; every restore validates application health, logs, and data integrity. Restore tests run regularly in isolated clusters, with functional and performance tests against the restored environment.\n- **Self-service.** Development teams configure their own backups; resources opt in through labels or configuration — the platform provides the capability, not a ticket queue.\n\n**Failure injected deliberately:**\n\n- **Designed experiments.** Every chaos experiment has a meaningful failure scenario, a scope, a target workload, a duration, a schedule, an expected steady state established before the run, and abort conditions with safety boundaries. Controlled injection — pod failures, network latency, packet loss, CPU and memory stress, dependency failures — never uncontrolled breakage; and the run verifies that failed pods are replaced and measures recovery time against the SLO.\n- **Predictable and humane scheduling.** Schedules are communicated to affected teams, prefer business hours when engineers are available to respond, and avoid peak traffic unless peak-load resilience is the explicit objective. Aggressive experiments are reserved for dedicated DR drills and low-traffic windows.\n- **Managed services are not exempt.** Slow queries, connection-limit exhaustion, database failover, cross-region latency, graceful degradation, retry and backoff, circuit breakers — all tested before the real outage arrives.\n\n**Recovery rehearsed, loop closed:**\n\n- **DR as a rehearsed procedure.** Systems that must survive catastrophe are identified with recovery priorities; the multi-region decision is explicit; replication (databases, object storage, caches), standby environments, DNS health checks, failover and replica-promotion procedures are configured and documented — and monitoring keeps operating through the failover.\n- **Drills against the numbers.** Regular DR drills measure actual recovery time against RTO/RPO targets, and procedures are updated from the results.\n- **Continuous improvement.** Every test captures metrics, logs, and observations; discovered failure modes are documented; weaknesses are remediated; experiments repeat after fixes. Recovery is practiced before incidents, not during them.\n\n## Reference Stack\n\nThis record is grounded in a build-it-end-to-end reference implementation. The tools are the worked example, not the mandate — the commitment is the property in the right-hand column.\n\n| Role | Reference tool | The property that matters |\n| --- | --- | --- |\n| SLO specification | OpenSLO | Vendor-neutral, version-controlled SLO definitions — reliability targets live in git, not in someone's head |\n| SLO rule generation | Sloth | Prometheus recording and alerting rules generated from the definitions — no hand-written burn-rate math |\n| Measurement and alerting | Prometheus | SLO compliance, burn rates, and recovery failures measured and alerted on continuously |\n| Dashboards | Grafana | Compliance, budget remaining, burn rate, and remaining allowable downtime visible to everyone |\n| Backup and restore | CSI volume snapshots + S3/GCS object storage | Automated, durable, cross-region replicable — and exercised by actual restores |\n| Failure injection | Chaos Mesh | Kubernetes-native, controlled, abortable experiments with observable `chaos_mesh_` metrics |\n\n## How to Read This\n\nThis record is part of the **Reference Implementation** section of this journal — the how-it-concretely-looks companion to the Platform Engineering records. It is grounded in the Resilience Automation chapter checklist of the *Platform Engineer's Handbook* (the source PDF's filename says \"Cost, Performance, and Scalability\"; its title page says Resilience Automation — the title page is right). Where [Operating Platforms](operating-platforms.html) argues the operating discipline and [The Four Pillars of Platform Engineering](four-pillars.html) demands that a platform be operated as a foundation, this record is that pillar made executable: the automation and rehearsal that make the foundation claim testable. The full working checklist — all ten sections, including the hands-on Chaos Mesh validation exercise — lives in the **Checklist** tab. The **TL;DR** tab carries the management summary; the **Conversation** tab talks it through.\n\n## Rationale\n\n**An SLO without a consequence is a dashboard.** Defining targets is the easy half; the chapter's discipline is in the other half — the error budget, the written policy for what happens when it nears exhaustion, and deployment-freeze criteria agreed before anyone is angry. A burn-rate alert that interrupts a release conversation is the SLO doing its job. And tiering matters: giving an internal batch tool the same target as the payment path makes the budget meaningless for one and extortionate for the other.\n\n**A backup that has never been restored is a hypothesis.** Backup jobs succeed silently for years while producing archives that cannot actually rebuild a cluster. That is why the record puts the weight on the restore side: automated restoration, health and data-integrity validation, regular restore tests in an isolated cluster, functional tests against the restored environment. The scheduled restore test is the only evidence that the backup capability exists at all — everything before it is a job that writes to object storage.\n\n![Diagram contrasting an unproven backup flow into object storage with a proving restore flow into an isolated cluster through health, log, and data-integrity validation gates.](assets/images/resilience-automation/backup-restore-evidence-pipeline.jpeg)\n**Figure 2:** *The restore side carries the burden of proof: a backup is a hypothesis until a scheduled restore into an isolated cluster validates health, logs, and data integrity.*\n\n**Chaos engineering is controlled science, not vandalism.** The difference is the protocol: an expected steady state stated before the run, explicit scope and abort conditions, schedules that are communicated and land in business hours — because the point of injecting failure is to have engineers watching when it happens, not to reproduce a 3 a.m. page voluntarily. The monitoring during the experiment is as designed as the experiment itself: latency percentiles, restart counts, success rates, connection-pool behavior, burn-rate alerts — correlated, where possible, with users and revenue impacted, so the result reads in business terms as well as technical ones.\n\n![Timeline diagram of a designed chaos experiment: steady state, a scoped injection window under an abort threshold, continuous monitoring, and a review step looping back to remediate and retest.](assets/images/resilience-automation/chaos-experiment-anatomy.jpeg)\n**Figure 3:** *A designed experiment, not vandalism: steady state stated before the run, a scoped and abortable injection window, monitoring as designed as the failure — and a review that feeds the loop.*\n\n**Managed does not mean immune.** The dependencies most teams never test are the ones they pay a cloud provider to run. But slow queries, connection-limit exhaustion, failovers, and cross-region latency happen to managed services too — and when they do, what is actually being tested is *your* retry logic, *your* backoff, *your* circuit breakers, *your* graceful-degradation path. The provider's SLA is a refund policy, not a resilience strategy. Test the degradation before an outage tests it for you.\n\n**A failover that has never been run is a hope.** DR documents age instantly: the replica-promotion command that changed, the DNS record nobody updated, the monitoring that goes dark exactly when the region does. Only drills that measure actual recovery time against the stated RTO and RPO turn the document into a capability — and a drill that misses its target is a successful drill, because it found the gap on a Tuesday instead of during the incident.\n\n![Timeline diagram of a disaster-recovery drill: an RPO data-loss window before a primary-region failure, then DNS health check, replica promotion, and standby serving, with measured recovery compared to the RTO target line.](assets/images/resilience-automation/dr-drill-against-rto-rpo.jpeg)\n**Figure 4:** *Drills against the numbers: the rehearsal measures actual recovery and data loss against the stated RTO and RPO — the two targets the automation is tuned to.*\n\n**The loop is the capability.** Every practice above ends the same way: review the results, identify the gaps, create the remediation work, and retest after the fix. A discovered weakness that is fixed but never retested is a gap that reopens silently. Resilience testing is an ongoing engineering practice with a schedule — error-budget reviews, restore validations, chaos runs, DR drills — not a milestone the platform passed once.\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| Every critical service has an SLO, an error budget, and a written exhaustion policy. | Every service gets the same aggressive target — targets are tiered by business criticality. |\n| Backups are automated and proven by scheduled restore tests in isolated clusters. | The platform backs up everything by default — resources opt in via labels, and teams configure their own backups self-service. |\n| Chaos experiments run on a predictable, communicated schedule with abort conditions. | Break production at random — every experiment has scope, an expected steady state, and safety boundaries. |\n| Prefer business hours, when engineers can respond. | Never touch peak traffic — peak runs are fine when peak-load resilience is the explicit objective, and aggressive runs belong in DR drills. |\n| Test managed cloud services for degradation, failover, and limits. | Trust the provider's SLA as your resilience strategy. |\n| DR drills measure actual recovery against RTO/RPO, and procedures update from results. | A documented DR plan counts as DR. |\n| Every finding becomes remediation work, and the experiment repeats after the fix. | A passed experiment closes the topic — the schedule continues. |\n\nConcretely: for every platform my organization runs, the platform lead can show me the date and outcome of the last error-budget review, the date and result of the last restore test, the date and findings of the last chaos run, and the last DR drill's measured recovery time against its RTO. **Four dates and four results — that is what \"resilient\" means here.**\n\n## Anti-Patterns\n\n- **The Schrödinger backup.** Backups scheduled, jobs green, restore never attempted — simultaneously working and broken until the day you need it collapses the wave function.\n- **The decorative SLO.** Targets defined and dashboarded, budget burning, and no consequence ever triggered — a reliability contract nobody enforces is wall art.\n- **The uniform nine.** One ambitious target for every service regardless of criticality — meaningless for the payment path, extortionate for the batch job, and evidence that nobody made a decision.\n- **Chaos theater.** A one-off game day with slides and applause, no remediation backlog, no retest — failure injected for the story, not the loop.\n- **Midnight chaos.** Experiments scheduled when no engineer is around to respond, voluntarily reproducing the worst conditions of a real incident — or run at peak without peak-load being the stated objective.\n- **The trusted dependency.** Managed services exempted from testing because \"that's the provider's problem\" — until their slow queries exhaust your connection pool and the untested degradation path is the outage.\n- **The paper failover.** Replica promotion documented, DNS failover configured, nothing ever executed — a DR plan whose first rehearsal is the disaster.\n- **Fix and forget.** A discovered weakness remediated but never retested — the loop left open, the gap free to return.\n\n## Related Records\n\n- [The Four Pillars of Platform Engineering](four-pillars.html) — pillar 4, operated as a foundation; this record is the automated proof of the foundation claim.\n- [Operating Platforms](operating-platforms.html) — the conceptual operating discipline (incidents, on-call, support); this is its self-testing counterpart on the reference stack.\n- [Observability Implementation](observability-implementation.html) — builds the telemetry pipeline this record consumes; SLO dashboards and burn-rate alerts assume it exists.\n- [Cost, Performance, and Scalability](cost-performance-scalability.html) — the sibling chapter: that record injects load and watches cost; this one injects failure and watches recovery.\n- [Platform Creation: Environments, GitOps, and the Mesh](platform-creation.html) — the clusters, GitOps flow, and mesh whose resilience is being proven here.\n- [CI/CD as a Platform Service](cicd-as-a-platform-service.html) — where error-budget deployment freezes actually land: in the delivery pipelines.\n- [Self-Service Infrastructure Management](self-service-infrastructure.html) — the self-service pattern the backup opt-in follows.\n\n## Scope and Revisiting\n\nThis record is `draft`. It applies to every platform team in my organization building or operating a resilience capability, on this reference stack or any other. I revisit it if a real incident exceeds an RTO or RPO that drills claimed we could meet, if restore validation quietly lapses while backup jobs stay green, if error budgets burn repeatedly without a freeze ever triggering, or if the chaos and drill schedule stalls because remediation work is piling up unretested — each of those is the loop breaking in a different place.\n\n## Authoritative References\n\n- *Platform Engineer's Handbook* — the Resilience Automation chapter, whose checklist this record distills (source PDF filed under \"Cost, Performance, and Scalability\"; the checklist's own title page reads Resilience Automation).\n"}]}, {"key": "summary", "label": "TL;DR", "meta": {"timetoread": "2 min read"}, "blocks": [{"type": "markdown", "content": "Resilience is **proven, never assumed**. When a platform team builds the resilience capability, the build closes one loop: define objectives (SLOs with error budgets, RTO/RPO per service), inject failure deliberately, measure the system against the objectives, remediate, and retest. A backup that has never been restored is a hypothesis; a failover that has never been run is a hope. The reference stack — OpenSLO, Sloth, Prometheus, Grafana, CSI snapshots with object storage, Chaos Mesh — is the worked example; the commitment is the loop.\n\n**What changes**\n\n* **SLOs become contracts with consequences.** Critical services get SLIs, targets tiered by business criticality, error budgets over a defined window, and a written policy — including deployment-freeze criteria — for budget exhaustion. Definitions live in version control; alerting rules are generated from them; compliance, budget, and burn rate are on dashboards.\n* **Backups are proven by restores.** Automated backups of cluster resources and volumes land in durable, replicated object storage — and restore tests run on a schedule in isolated clusters, validating application health, logs, and data integrity. Teams configure backups self-service; resources opt in via labels.\n* **Failure is injected deliberately.** Chaos experiments have scope, target, duration, expected steady state, and abort conditions; they run on communicated schedules in business hours, off peak unless peak resilience is the objective. Pods, networks, resources, and managed cloud dependencies — slow queries, connection exhaustion, failover, degradation paths — are all tested before an outage tests them for us.\n* **DR is rehearsed against numbers.** Recovery priorities, replication, standby environments, and failover procedures exist — and regular drills measure actual recovery time against RTO/RPO, updating procedures from the results.\n* **Every finding closes the loop.** Gaps become remediation work, and experiments repeat after fixes. The standing evidence: four dates and four results — last error-budget review, last restore test, last chaos run, last DR drill.\n\n**What it costs**\n\n* Scheduled restore tests, chaos runs, and DR drills are recurring engineering time, not a one-off milestone — and remediation from them takes roadmap capacity.\n* Error budgets bite: when the budget exhausts, the freeze policy interrupts real releases.\n* Testing managed services and multi-region DR carries real infrastructure spend where business impact justifies it.\n\n**What we are not doing**\n\n* Not building the telemetry pipeline — that is [Observability Implementation](observability-implementation.html); this record consumes it.\n* Not load testing, autoscaling, or cost discipline — [Cost, Performance, and Scalability](cost-performance-scalability.html) injects load; this record injects failure.\n* Not the conceptual operating discipline of incidents and on-call — that is [Operating Platforms](operating-platforms.html); nor adversarial testing, which lives in [End-to-End Platform Security](platform-security.html).\n\n*The Article tab carries the rationale and anti-patterns; the Checklist tab carries all ten sections, including the hands-on Chaos Mesh validation exercise. Grounded in the Resilience Automation chapter of the* Platform Engineer's Handbook*.*\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "7 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record. The Article tab carries the rationale and anti-patterns. Section 9 is the hands-on validation exercise from the reference implementation.*\n\n## 1. Define Service Level Objectives (SLOs)\n\n- [ ] We have identified the most critical services\n- [ ] Each service has appropriate Service Level Indicators (SLIs), such as:\n  - [ ] Availability\n  - [ ] Error rate\n  - [ ] Request success rate\n  - [ ] Latency\n- [ ] Each service has an SLO target\n- [ ] The measurement window is defined (e.g. a rolling 30-day period)\n- [ ] The corresponding error budget is calculated\n- [ ] We have defined what happens when the error budget is nearly exhausted\n- [ ] Deployment-freeze criteria are established where appropriate\n- [ ] Services with different business criticality have different SLO targets\n- [ ] SLO definitions are stored as version-controlled configuration\n- [ ] We have considered a vendor-neutral specification such as OpenSLO\n- [ ] Prometheus SLO rules are generated with a tool such as Sloth\n- [ ] SLO status is published through Grafana dashboards, displaying:\n  - [ ] Current SLO compliance\n  - [ ] Error-budget remaining\n  - [ ] Error-budget burn rate\n  - [ ] Remaining allowable downtime\n- [ ] Alerts fire on SLO violations and excessive burn rates\n\n## 2. Automate Backup and Restore\n\n- [ ] Kubernetes backups are automated, not manual procedures\n- [ ] Backups cover Kubernetes resources, including:\n  - [ ] CRDs\n  - [ ] Secrets\n  - [ ] ConfigMaps\n  - [ ] Persistent volumes\n- [ ] CSI volume snapshots are configured where applicable\n- [ ] Backups are stored in durable object storage such as S3 or GCS\n- [ ] Backup retention periods are defined\n- [ ] Cross-region backup replication is enabled where DR requires it\n- [ ] Recurring backups are scheduled\n- [ ] On-demand backups are supported when needed\n- [ ] A restore procedure is defined\n- [ ] Restoration of Kubernetes resources is automated\n- [ ] Restoration of persistent volumes is automated\n- [ ] Application health is validated after restoration\n- [ ] Logs are checked after restoration\n- [ ] Restored data integrity is verified\n- [ ] Restore tests run in an isolated test cluster\n- [ ] Restore validation is scheduled regularly (e.g. weekly)\n- [ ] Functional tests run against restored environments\n- [ ] Performance tests run where appropriate\n- [ ] Development teams have self-service backup configuration\n- [ ] Resources can opt in to backups through labels or configuration\n\n## 3. Define Recovery Objectives\n\n- [ ] Every important service has a defined RTO\n- [ ] The RTO represents the maximum acceptable restoration time\n- [ ] Every important service has a defined RPO\n- [ ] The RPO represents the maximum acceptable amount of data loss\n- [ ] Backup frequency is adjusted to meet RPO requirements\n- [ ] Recovery automation is adjusted to meet RTO requirements\n- [ ] RTO/RPO targets differ based on business impact\n\n## 4. Establish Chaos Engineering\n\n- [ ] We identify meaningful failure scenarios\n- [ ] Each chaos experiment has a defined scope\n- [ ] Each experiment has a defined target workload\n- [ ] Each experiment has a defined duration\n- [ ] Each experiment has defined scheduling\n- [ ] Expected system behavior is established before running the experiment\n- [ ] Abort conditions and safety boundaries are established\n- [ ] We use controlled failure injection rather than uncontrolled testing\n- [ ] We test:\n  - [ ] Pod failures\n  - [ ] Network latency\n  - [ ] Packet loss\n  - [ ] CPU stress\n  - [ ] Memory stress\n  - [ ] Service dependency failures where appropriate\n- [ ] We use Chaos Mesh for Kubernetes-native experiments where suitable\n- [ ] Experiments are scheduled predictably\n- [ ] Experiment schedules are communicated to affected teams\n- [ ] We prefer business hours, when engineers are available to respond\n- [ ] We avoid peak traffic unless peak-load resilience is the explicit objective\n- [ ] More aggressive experiments run during dedicated DR drills or low-traffic periods\n\n## 5. Monitor Chaos Experiments\n\n- [ ] Prometheus metrics are monitored during experiments\n- [ ] Grafana dashboards are monitored\n- [ ] Application logs are reviewed\n- [ ] We track:\n  - [ ] CPU and memory errors\n  - [ ] Latency percentiles\n  - [ ] Pod restart counts\n  - [ ] Request success rates\n  - [ ] Database connection-pool behavior\n  - [ ] SLO burn-rate alerts\n  - [ ] Recovery-failure alerts\n- [ ] Technical failures are correlated with business metrics\n- [ ] Users impacted are recorded where possible\n- [ ] Revenue or other business impact is recorded where relevant\n- [ ] Experiment results are reviewed after completion\n- [ ] Resilience gaps are identified\n- [ ] Remediation work is created\n- [ ] We retest after remediation\n\n## 6. Test Managed Cloud Services\n\n- [ ] We test slow-query scenarios\n- [ ] We test connection-limit exhaustion\n- [ ] We test managed database failover procedures\n- [ ] We test cross-region latency\n- [ ] We verify application behavior when managed dependencies degrade\n- [ ] Graceful degradation paths are validated\n- [ ] Retry and backoff behavior is verified\n- [ ] Circuit breakers are tested under realistic conditions\n- [ ] Managed-service recovery procedures are tested before an actual outage occurs\n\n## 7. Test Kubernetes Workloads\n\n- [ ] We kill individual pods\n- [ ] We kill multiple pods simultaneously\n- [ ] We inject sustained pod failures\n- [ ] We induce network failures\n- [ ] We introduce latency and packet loss\n- [ ] We stress CPU resources\n- [ ] We stress memory resources\n- [ ] We verify ReplicaSets replace failed pods\n- [ ] We measure recovery time\n- [ ] We monitor restart counts\n- [ ] We check whether application availability remains within its SLO\n\n## 8. Prepare Disaster Recovery\n\n- [ ] We have identified which systems must survive catastrophic failures\n- [ ] Recovery priorities are defined\n- [ ] We have determined whether multi-region architecture is required\n- [ ] A primary region is configured\n- [ ] A secondary or standby region is configured where required\n- [ ] Databases are replicated across regions\n- [ ] Object-storage backups are replicated across regions\n- [ ] Cache/data services are replicated where necessary\n- [ ] A standby Kubernetes environment is maintained where appropriate\n- [ ] DNS health checks are configured\n- [ ] A documented failover mechanism is configured\n- [ ] Replica-promotion procedures are defined\n- [ ] Application-restoration procedures are defined\n- [ ] Monitoring operates during failover\n- [ ] The architecture can meet required RTO targets — verified\n- [ ] Replication can meet required RPO targets — verified\n- [ ] Regular DR drills are run\n- [ ] Actual recovery time is measured during drills\n- [ ] Actual recovery performance is compared against RTO/RPO targets\n- [ ] Procedures are updated based on test results\n\n## 9. Chaos Mesh Exercise Validation\n\nThe hands-on validation run from the reference implementation:\n\n- [ ] Install the Chaos Mesh Helm repository\n- [ ] Update the Helm repository index\n- [ ] Install Chaos Mesh in the `chaos-mesh` namespace\n- [ ] Confirm `chaos-controller-manager` is running\n- [ ] Confirm `chaos-dashboard` is running\n- [ ] Create the `chaos-testing` namespace\n- [ ] Deploy a three-replica `nginx:alpine` application named `demo-app`\n- [ ] Confirm all three pods are running\n- [ ] Apply `chaos-mesh-pod-failure.yaml`\n- [ ] Confirm Chaos Mesh accepts the first experiment\n- [ ] Observe pod events in real time\n- [ ] Monitor pod restart counts\n- [ ] Review namespace events by timestamp\n- [ ] Measure how quickly replacement pods are created\n- [ ] Check `chaos_mesh_` metrics in Prometheus/Grafana\n- [ ] Compare chaos metrics with observed pod churn\n- [ ] Delete experiment resources after testing\n- [ ] Remove the `chaos-testing` namespace\n\n## 10. Continuous Resilience Improvement\n\n- [ ] Resilience testing is treated as an ongoing engineering practice\n- [ ] SLO definitions stay version-controlled\n- [ ] Error-budget consumption is reviewed regularly\n- [ ] Restores are tested regularly rather than assuming backups work\n- [ ] Chaos experiments run on a schedule\n- [ ] Disaster-recovery drills run on a schedule\n- [ ] Metrics, logs, and observations are captured from every test\n- [ ] Discovered failure modes are documented\n- [ ] Weaknesses found during testing are remediated\n- [ ] Experiments are repeated after fixes\n- [ ] Recovery procedures are practiced before real incidents occur\n- [ ] We promote continuous learning and improvement across teams\n\nThe test running through the chapter: **for every practice — SLOs, backups, chaos, DR — can you show the date and result of the last time it was actually exercised?**\n"}]}, {"key": "dialog", "label": "Conversation", "meta": {"timetoread": "8 min listen"}, "blocks": [{"type": "markdown", "content": "## Proven, Not Assumed\n\n**Ben:** Blunt version first. Every platform team I know already claims resilience — replicas, multi-AZ, backups running nightly. Why does this need a record?\n\n**Ana:** Because every one of those claims is an assumption until something proves it. That's the whole record in one line: resilience is proven, never assumed. When a platform team in this organization builds the resilience capability, the build closes one loop — define objectives, inject failure deliberately, measure the system against the objectives, remediate what you find, retest after the fix. The two signature lines do most of the work: a backup that has never been restored is a hypothesis, and a failover that has never been run is a hope.\n\n**Ben:** And the evidence that the loop is actually closing? Because \"we do chaos engineering\" is exactly the kind of claim that goes stale.\n\n**Ana:** Four dates and four results. The platform lead can show me the date and outcome of the last error-budget review, the date and result of the last restore test, the last chaos run, and the last DR drill's measured recovery time against its RTO. That is what \"resilient\" means here — not an architecture diagram.\n\n## Budgets with Teeth\n\n**Ben:** Start with the SLOs, then. Everybody has SLOs. Most of them are wall art.\n\n**Ana:** The record names that anti-pattern — the decorative SLO. Targets defined, dashboarded, budget burning, and no consequence ever triggered. The chapter's discipline is in the other half: every critical service gets SLIs — availability, error rate, request success, latency — a target over a defined window, a calculated error budget, and a written policy for what happens when the budget nears exhaustion, including deployment-freeze criteria where appropriate. Written before anyone is angry.\n\n**Ben:** There's the fight. A freeze policy means the platform team can stop a product team's release. That's a political weapon, not an engineering practice.\n\n**Ana:** It's only a weapon if it's discretionary. The point of writing the criteria down in advance is that nobody decides anything in the moment — the budget was agreed, the burn rate is measured, the freeze triggers itself. A burn-rate alert interrupting a release conversation is the SLO doing its job. And the targets are tiered by business criticality, which is what keeps it fair. The record calls the failure mode the uniform nine: one ambitious target for everything — meaningless for the payment path, extortionate for the batch job, and evidence that nobody made a decision.\n\n**Ben:** Where do the definitions live? Because I've watched SLO spreadsheets rot.\n\n**Ana:** In version control, as configuration — the reference stack uses OpenSLO for vendor-neutral definitions and Sloth to generate the Prometheus rules, so nobody hand-writes burn-rate math. Grafana shows compliance, budget remaining, burn rate, and remaining allowable downtime. But the commitment is capability-level: definitions in git, rules generated, status visible, alerts on burn. The tools are the worked example, not the mandate.\n\n## The Schrödinger Backup\n\n**Ben:** Backups. Ours run nightly and the jobs are green. What more do you want?\n\n**Ana:** That's the Schrödinger backup — scheduled, green, and never restored. Simultaneously working and broken until the day you need it collapses the wave function. Backup jobs succeed silently for years while producing archives that can't actually rebuild a cluster. So the record puts the weight on the restore side: automated restoration of resources and volumes, validation of application health, logs, and data integrity after every restore, and restore tests on a schedule — weekly, say — in an isolated test cluster, with functional tests against the restored environment.\n\n**Ben:** Weekly restore tests are real engineering time. Who pays for that?\n\n**Ana:** The platform does, and the record is honest that this is recurring cost, not a milestone. But the scheduled restore test is the only evidence the backup capability exists at all. Everything before it is a job that writes to object storage. And note what's covered — not just volumes but the cluster's state itself: CRDs, Secrets, ConfigMaps — all landing in durable storage that replicates cross-region where DR requires it. Plus the RPO connection: backup frequency is tuned to the RPO, recovery automation to the RTO — the objectives drive the automation, never the reverse.\n\n**Ben:** Does the platform team back up everything for everyone?\n\n**Ana:** No — self-service, like everything else in this section of the journal. Teams configure their own backups; resources opt in through labels or configuration. The platform provides the capability, not a ticket queue. Same pattern as [Self-Service Infrastructure Management](self-service-infrastructure.html).\n\n## Breaking Things on Purpose, Politely\n\n**Ben:** Now the part where you break production during business hours. Deliberately. Sell me that.\n\n**Ana:** The scheduling rule surprises people, but it's the sane one: prefer business hours, when engineers are available to respond. The alternative is midnight chaos — experiments scheduled when nobody's around, which voluntarily reproduces the worst conditions of a real incident. The point of injecting failure is to have people watching when it happens.\n\n**Ben:** Still — \"controlled\" is doing a lot of work in that sentence.\n\n**Ana:** It's doing all the work, and the record spells it out. Every experiment has a meaningful failure scenario, a scope, a target workload, a duration, an expected steady state established before the run, and abort conditions with safety boundaries. Schedules are predictable and communicated to affected teams. You avoid peak traffic unless peak-load resilience is the explicit objective, and the aggressive stuff runs in dedicated DR drills or low-traffic windows. That's the difference between controlled science and vandalism. On the reference stack it's Chaos Mesh — Kubernetes-native, abortable, and it exports its own metrics so you can compare what the tool claims it injected with the pod churn you actually observed.\n\n**Ben:** And you're watching what, exactly, while it runs?\n\n**Ana:** Everything the objectives are written in: latency percentiles, restart counts, request success rates, connection-pool behavior, SLO burn-rate alerts, recovery-failure alerts — and, where possible, the correlation to business metrics: users impacted, revenue impact. A chaos result should read in business terms, not just kubectl output. Then the loop: review, identify gaps, create remediation work, retest after the fix. Without that last step it's chaos theater — a game day with slides and applause and no backlog.\n\n**Ben:** One objection you haven't touched: our riskiest dependencies are managed. RDS, managed Kafka. That's the provider's problem.\n\n**Ana:** The record calls that the trusted dependency, and it's the anti-pattern I'd bet finds the most gaps. Managed doesn't mean immune — slow queries, connection-limit exhaustion, failovers, cross-region latency all happen to managed services. And when they do, what's actually under test is your retry logic, your backoff, your circuit breakers, your graceful-degradation path. The provider's SLA is a refund policy, not a resilience strategy. So you test the degradation before an outage tests it for you — including the managed database failover procedure itself.\n\n## The Drill Is the Document\n\n**Ben:** Disaster recovery. Every org I've seen has a DR document. Most have never opened it under pressure.\n\n**Ana:** The paper failover — replica promotion documented, DNS failover configured, nothing ever executed. A DR plan whose first rehearsal is the disaster. DR documents age instantly: the promotion command that changed, the DNS record nobody updated, the monitoring that goes dark exactly when the region does — which is why the record explicitly requires monitoring to keep operating during failover. The build itself is what you'd expect: recovery priorities for what must survive catastrophe, an explicit multi-region decision with the replication and standby environments to back it, and documented failover and promotion procedures. But none of that is DR yet.\n\n**Ben:** What makes it DR?\n\n**Ana:** Drills against the numbers. Regular drills that measure actual recovery time and compare it to the stated RTO and RPO, with procedures updated from results. And here's the reframe worth keeping: a drill that misses its target is a successful drill — it found the gap on a Tuesday instead of during the incident.\n\n**Ben:** Alright. Close it out — what is this record explicitly not doing?\n\n**Ana:** It doesn't build the telemetry it rides on — that's [Observability Implementation](observability-implementation.html). It doesn't inject load — [Cost, Performance, and Scalability](cost-performance-scalability.html) does load, autoscaling, and cost; this record injects failure. The conceptual operating discipline — incidents, on-call, support — is [Operating Platforms](operating-platforms.html); this is that discipline made self-testing, which is also why it's pillar four of [The Four Pillars of Platform Engineering](four-pillars.html) in executable form. And it's not adversarial — attack-shaped testing lives in [End-to-End Platform Security](platform-security.html).\n\n**Ben:** And the revisit triggers?\n\n**Ana:** Each one is the loop breaking somewhere. A real incident exceeds an RTO the drills claimed we could meet. Restore validation lapses while backup jobs stay green. Budgets burn repeatedly and no freeze ever triggers. Or the chaos schedule stalls because remediation piles up unretested — the record calls that one fix and forget.\n\n**Ben:** So the one-line test, for the exec who reads nothing else?\n\n**Ana:** For every resilience claim your platform makes — show me the date and result of the last time you exercised it. If the answer is \"never,\" you don't have resilience. You have hope with a dashboard.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why resilience is proven, never assumed — the closed loop, in nine panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. KAI: a hands-on platform engineering lead, short dark hair, gray zip-up hoodie with a small gear pin, laptop covered in infrastructure stickers under one arm, a coil of cable slung over the shoulder.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and teal accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Kai points at an all-green dashboard while Vera asks what proved the resilience claim.](assets/images/resilience-automation/comic-01-what-proved-it.jpeg)\n**Panel 1:** *The hook: 'resilient' is a claim — the first question is always what proved it.*\n\n![Comic panel: a dusty vault labeled BACKUPS holds a glowing question mark while a calendar shows years of green check marks.](assets/images/resilience-automation/comic-02-the-schroedinger-backup.jpeg)\n**Panel 2:** *The problem: the Schrödinger backup — jobs green for years, restore never attempted, simultaneously working and broken.*\n\n![Comic panel: Kai bows on a Game Day stage with a trophy while a bin of ignored findings overflows behind the stage.](assets/images/resilience-automation/comic-03-chaos-theater.jpeg)\n**Panel 3:** *The wrong way: chaos theater — failure injected for the story, findings binned, nothing remediated, nothing retested.*\n\n![Comic panel: Vera draws a five-station circular loop on a whiteboard — objectives, inject failure, measure, remediate, retest.](assets/images/resilience-automation/comic-04-the-closed-loop.jpeg)\n**Panel 4:** *The principle: one closed loop — objectives, controlled failure, measurement, remediation, retest — and it closes on every practice.*\n\n![Comic panel: Kai pulls a deploy-freeze lever as an error-budget gauge sits in the red and a developer holds a paused release.](assets/images/resilience-automation/comic-05-budget-with-consequences.jpeg)\n**Panel 5:** *How it plays out: budgets with consequences — the exhaustion policy is written before anyone is angry, and the freeze is the SLO doing its job.*\n\n![Comic panel: a restore test inside an isolated glass cluster passes health, logs, and data checks while Vera stamps the result.](assets/images/resilience-automation/comic-06-restore-is-the-product.jpeg)\n**Panel 6:** *How it plays out: restore is the product — regular restore tests in an isolated cluster, validated for health, logs, and data integrity.*\n\n![Comic panel: Kai runs a scoped chaos experiment from a console with an abort button in daylight while Vera times it against steady monitors.](assets/images/resilience-automation/comic-07-controlled-science.jpeg)\n**Panel 7:** *How it plays out: controlled science, not vandalism — expected steady state, scope, abort conditions, and a communicated business-hours schedule.*\n\n![Comic panel: a DR drill stopwatch overshoots the RTO line while Vera calmly notes the gap and Kai winces.](assets/images/resilience-automation/comic-08-drill-against-the-numbers.jpeg)\n**Panel 8:** *What it costs: drills against the numbers — a missed RTO in a rehearsal is a win, because the gap surfaced on a Tuesday, not during the incident.*\n\n![Comic panel: pedestals labeled hypothesis and hope flank Kai holding a card of four dates and four results.](assets/images/resilience-automation/comic-09-hypothesis-and-hope.jpeg)\n**Panel 9:** *The closer: a backup never restored is a hypothesis; a failover never run is a hope — 'resilient' means four dates and four results.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
