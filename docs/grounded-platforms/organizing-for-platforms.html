<script id="data" type="application/json">{"meta": {"id": "PLT-ORGANIZING-FOR-PLATFORMS", "status": "draft:gray", "title": "Organizing for Platforms", "date": "2026-08-12", "author": "Željko Obrenović", "permalink": "organizing-for-platforms", "timetoread": "6 min", "excerpt": "A platform team is a small product company inside the organization, and I staff and run it that way: an accountable leader plus named ownership of technology strategy, roadmap, delivery, marketing, and support — even when one person wears several hats. It aligns east–west so infrastructure seams never reach the user, and north–south so adoption is earned continuously rather than announced once. And before any of that, I confirm a platform is actually needed — sometimes enablement and a thinner platform beat building one.", "tags": "platform strategy, platform teams, organization design, internal product, adoption, cognitive load, enablement", "icon": "assets/icons/organizing-for-platforms.png", "logo": "assets/images/organizing-for-platforms/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["platform strategy", "platform teams", "organization design", "internal product", "adoption", "cognitive load", "enablement"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: I organize for platforms the way one runs a small product company inside the organization: a cross-functional team with an accountable leader and named ownership of technology strategy, product roadmap, engineering delivery, marketing and adoption, and support — roles that may share people but must never go unowned. The team aligns east–west across infrastructure silos so the org chart never ships in the platform experience, and north–south with its consumers so adoption is an ongoing relationship earned through value, not a mandate rolled out once. And the whole apparatus is subject to one standing question: do we actually need this platform — or would enablement, skills, and a thinner platform serve better? Platforms fail organizationally before they fail technically.\n\n## Statement\n\nMy operating model for organizing around platforms has six commitments.\n\n- **The platform is a product, and the team is a small product company.** A cross-functional platform team — not a technical silo, not a one-time project — owns the platform's vision, value proposition, and continuous evolution, and enables development teams rather than processing their tickets.\n- **Every role is owned, even when heads are shared.** One accountable platform leader, plus named ownership of technology strategy, product roadmap, engineering delivery, marketing and adoption, and support. In a small team one person covers several roles; as the team grows, responsibilities get revisited and split. What is never acceptable is a role nobody holds.\n- **Align east–west: no org chart in the platform.** Infrastructure, operations, networking, security, storage, and compute work toward common outcomes behind one cohesive interface. Discussions start from the outcome needed, not the implementation preferred — and where collaboration is impossible, we explicitly decide to fix, wrap, or work around the dependency.\n- **Align north–south: adoption is a relationship.** Platform builders and platform consumers communicate transparently. We understand developers' need for speed and operations' need for stability, refuse us-versus-them framing, and treat adoption as ongoing — never a one-time rollout.\n- **Know the customers; balance the engagement model.** Real customer needs come before solutions — observed workflows, investigated bottlenecks, distinct personas — developers, administrators, operators, and end users. Engagement is deliberately balanced across self-service, setup, consulting, community, and co-creation — and consulting never quietly turns the team into a professional-services shop.\n- **Confirm the platform is needed at all.** Before building: does the base platform already suffice? Would enablement and skills development solve the problem? Would a Thinnest Viable Platform do? We build only what is genuinely unique or valuable to us — and we invest in skills and cognitive-load reduction either way.\n\n![Diagram of a platform team at the intersection of an east-west axis across infrastructure functions and a north-south axis to development teams.](assets/images/organizing-for-platforms/two-alignment-axes.jpeg)\n**Figure 1:** *Two alignment axes: east–west joins infrastructure functions behind one interface; north–south keeps builders and consumers in a two-way relationship.*\n\n## How to Read This\n\nThis journal is my platform operating model, one record per source checklist. This record is grounded in the \"Platform Team Organization\" chapter checklist of Gregor Hohpe's *Platform Strategy: Innovation Through Harmonization* (Leanpub, 2024) — the chapter on the people side of platforms: leadership roles, team alignment, customer engagement, and the discipline of asking whether a platform is warranted at all. The runnable version — the role assignments, both alignment axes, the engagement-model balance, and the final platform health check — lives in the **Checklist** tab of this post. The checklist also reproduces the chapter's recruiting-and-retention section; as an operating concern, hiring and growing platform engineers belongs to [Building Great Platform Teams](building-platform-teams.html).\n\n## Rationale\n\n**The small-product-company metaphor is a staffing instruction, not a slogan.** Hohpe frames the platform team's responsibilities like the functions of a small company: someone accountable for value and direction (CEO-style), someone owning technology strategy (CTO-style), plus product, engineering, marketing, and support functions. The point is not to hire six executives for a five-person team — one person can cover several roles. The point is that **an unowned role does not disappear; it just fails silently**. Platforms without a marketing owner get no adoption; platforms without a support owner burn their engineers; platforms without a product owner become whatever the loudest customer demands.\n\n**Ticket queues are how platform teams die.** The founding stance — platform as product, team as enabler — exists because the gravitational pull goes the other way: toward a ticket-processing function that does things *for* development teams instead of making them capable themselves. Every organizational choice in this record pushes against that pull: a roadmap built from vision plus customer input rather than accepted requests, self-service as the default engagement mode, enablement that increases team autonomy rather than permanent staff augmentation, and recurring support requests treated as product defects to automate away.\n\n**East–west alignment decides what users experience.** A platform assembled from infrastructure, networking, security, and storage teams that never aligned will faithfully reproduce those boundaries: duplicate portals, inconsistent terminology, hand-offs mid-workflow. That is shipping the org chart. The fix is organizational before it is technical — common outcomes across the participating teams, outcome-first discussions, preserved autonomy where possible — and an honest escape hatch: where collaboration genuinely cannot be had, we consciously choose whether to fix, wrap, or work around the dependency rather than letting the seam show.\n\n**North–south alignment is why mandates fail.** Developers want speed and flexibility; operations wants stability, security, and compliance. A platform team that picks one side inherits an us-versus-them relationship with the other, and a mandated platform gets malicious compliance at best. So I prefer earning voluntary adoption through value — a recognizable identity, a clear value proposition, regular updates, real feedback channels, internal events — while still protecting the product vision from being dictated by any single customer. Adoption is a two-way conversation that never ends, which is precisely why it needs owners.\n\n**The engagement model is a portfolio that drifts if unmanaged.** Self-service scales best but cannot cover the unusual cases; consulting covers them but eats the team if unchecked; community scales support and surfaces design weaknesses through repeated questions; co-creation builds the best features and the deepest buy-in. The discipline is periodic rebalancing — deliberately deciding how much effort goes to self-service, setup, consulting, community, and co-creation — rather than discovering after a year that the platform team has become a professional-services organization with a roadmap it never touches.\n\n![Diagram of five platform engagement modes as a portfolio on a scale-to-depth spectrum, with self-service largest and consulting flagged for drift.](assets/images/organizing-for-platforms/engagement-model-portfolio.jpeg)\n**Figure 2:** *The engagement model is a portfolio: self-service scales, co-creation deepens — and consulting drifts into professional services unless deliberately rebalanced.*\n\n**The strongest organizational move can be not building the platform.** The chapter's most countercultural checklist item sits near the end: confirm a platform is necessary before creating one. Sometimes the base platform already suffices; sometimes enablement and skills development reduce cognitive load better than another abstraction layer; sometimes a Thinnest Viable Platform beats the grand custom build. Observing development teams before committing, and keeping expert teams free enough to respond to paradigm shifts, protects me from the most expensive failure mode in this space: **a beautifully organized team building a platform nobody needed**.\n\n![Decision-flow diagram with three exit gates - base platform suffices, enablement and skills, thinnest viable platform - before a small final build step.](assets/images/organizing-for-platforms/do-we-need-a-platform-gate.jpeg)\n**Figure 3:** *The gate before building: three cheaper answers get a chance first — and a full custom platform is the last resort, not the default.*\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| The platform team runs like a small product company with an accountable leader. | Every role needs a dedicated head — **roles can share people; they cannot go unowned**. |\n| The team enables development teams toward autonomy. | The team does the work for them — that is a ticket queue with better branding. |\n| Infrastructure functions align on common outcomes behind one interface. | Internal team boundaries may show through the platform — users never navigate our org chart. |\n| Adoption is earned through value and treated as an ongoing relationship. | Adoption is mandated and rolled out once — mandates buy compliance, not commitment. |\n| The roadmap blends customer input with the platform vision. | The loudest customer sets the direction — **listening is not obeying**. |\n| Consulting, community, and co-creation complement self-service, in managed balance. | High-touch help scales — unmanaged consulting turns the team into professional services. |\n| A platform is built only after confirming it is needed. | Every organization needs a custom platform — sometimes enablement or a thinner platform wins. |\n\nConcretely: for every platform we run, I can name the accountable leader and the owner of each of the five functions — strategy, roadmap, delivery, marketing, support — even where two hats sit on one head. Platform users complete common tasks through self-service and cannot tell from the experience which internal team owns which layer. And once a year we re-ask the founding question — **is this platform still the simplest, most valuable solution to the problem?** — with retirement as an acceptable answer.\n\n## Anti-Patterns\n\n- **The ticket queue with a logo.** A \"platform team\" that processes requests for development teams instead of making them autonomous — measured by throughput, drowning in backlog, enabling nothing.\n- **The unowned role.** No one owns marketing, so adoption never happens; no one owns support, so engineers burn out covering it invisibly; no one owns the roadmap, so the platform becomes a wish-list archive.\n- **The shipped org chart.** Duplicate portals, one identity per subsystem, and terminology that changes at every internal team boundary — the organization's seams faithfully reproduced in the user experience.\n- **The mandate rollout.** Adoption by decree, announced once, followed by malicious compliance, shadow tooling, and a platform team confused about why nobody loves them.\n- **The professional-services drift.** Consulting engagements quietly consuming the team until there is no capacity left for the product — high-touch help everywhere, platform progress nowhere.\n- **The copied platform.** Rebuilding another company's stack because it worked there, without observing our own teams' workflows or validating against our actual needs.\n- **The platform nobody needed.** A well-staffed, well-organized team building an abstraction layer the base platform already provides — when enablement and skills would have solved the real problem.\n\n## Related Records\n\n- [Building Great Platform Teams](building-platform-teams.html) — hiring and growing the platform engineers themselves; this record defines the team shape and role structure those people fill.\n- [Platform as a Product](platform-as-a-product.html) — the full product-management discipline for platforms; this record installs the organizational stance that makes that discipline possible.\n- [Managing Platform Stakeholders](managing-stakeholders.html) — the platform leader's stakeholder tactics; the east–west and north–south axes here are the map those tactics navigate.\n- [Understanding Platforms](understanding-platforms.html) — what platforms are and the harmonization philosophy; this record is how I arrange people to deliver on it.\n- [Getting Started with Platform Engineering](getting-started.html) — when and how to start platform engineering; the confirm-you-need-a-platform gate here is the question that record's timing decisions depend on.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs how platform teams are structured, led, and connected to the rest of the organization wherever I am the accountable executive — from a five-person team wearing all the hats to a platform organization with dedicated functions. I revisit it if the platform team's support and consulting load crowds out product work for more than a quarter (the professional-services signal), if adoption stalls while the mandate pressure rises (the north–south signal), or if the annual health check cannot confirm the platform is still the simplest and most valuable solution to the problem.\n\n## Authoritative References\n\n- Gregor Hohpe, *Platform Strategy: Innovation Through Harmonization* (Leanpub, 2024) — the \"Platform Team Organization\" chapter, whose checklist this record distills.\n"}]}, {"key": "summary", "label": "TL;DR", "meta": {"timetoread": "2 min read"}, "blocks": [{"type": "markdown", "content": "I organize for platforms the way one runs a small product company inside the organization: a cross-functional team with an accountable leader and named ownership of technology strategy, product roadmap, engineering delivery, marketing and adoption, and support — roles that may share people but must never go unowned. Platforms fail organizationally before they fail technically, so the relationships matter as much as the boxes.\n\n**What changes**\n\n* Every platform we run has a named accountable leader plus an owner for each of the five functions — strategy, roadmap, delivery, marketing, support — even when two hats sit on one head. An unowned role does not disappear; it fails silently: no marketing owner means no adoption, no support owner means burned-out engineers.\n* We align **east–west**: infrastructure, operations, networking, security, storage, and compute work toward common outcomes behind one cohesive interface. Users never navigate our org chart — and where collaboration is genuinely impossible, we explicitly decide to fix, wrap, or work around the dependency.\n* We align **north–south**: adoption is an ongoing relationship earned through value — a recognizable identity, a clear value proposition, regular updates, real feedback channels — never a mandate rolled out once.\n* Customer needs come before solutions: observed workflows, investigated bottlenecks, and distinct personas — developers, administrators, operators, end users. The engagement model is deliberately balanced across self-service, setup, consulting, community, and co-creation.\n* Before any of that, we confirm a platform is needed at all. Sometimes the base platform already suffices, sometimes enablement and skills development beat another abstraction layer, and sometimes a Thinnest Viable Platform wins over the grand custom build.\n\n**What it costs**\n\n* Keeping the engagement portfolio in balance is deliberate, recurring work — unmanaged consulting quietly turns the platform team into a professional-services shop with a roadmap it never touches.\n* Earning voluntary adoption is slower than mandating it: marketing, internal events, and feedback channels all need owners and ongoing effort.\n* Once a year we re-ask the founding question — is this platform still the simplest, most valuable solution? — with retirement as an acceptable answer.\n\n**What we are not doing**\n\n* Not hiring and growing platform engineers as individuals — that lives in [Building Great Platform Teams](building-platform-teams.html).\n* Not the full product-management discipline for platforms — that is [Platform as a Product](platform-as-a-product.html); here it appears only as the founding stance. Stakeholder tactics live in [Managing Platform Stakeholders](managing-stakeholders.html).\n* Not prescribing team sizes or reporting lines — this is an operating model, not an org-chart template.\n\n*The Article tab carries the rationale and anti-patterns; the Checklist tab holds the runnable role assignments, both alignment checks, and the final platform health check.*\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "5 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Platform Team Foundation\n\n- [ ] Treat the platform as a product, not a one-time IT project\n- [ ] Define the platform's vision and value proposition\n- [ ] Identify the internal customers the platform serves\n- [ ] Create a cross-functional platform team rather than organizing purely around technical silos\n- [ ] Make the team responsible for continuously evolving the platform\n- [ ] Ensure the platform team enables development teams rather than becoming another ticket-processing function\n\n## 2. Leadership & Roles\n\n- [ ] Assign an accountable platform leader responsible for value, resources, stakeholders, and overall direction\n- [ ] Establish ownership of the technology strategy\n- [ ] Establish ownership of the product roadmap\n- [ ] Establish ownership of engineering delivery\n- [ ] Establish ownership of marketing, communication, and platform adoption\n- [ ] Establish responsibility for support and professional services\n- [ ] Remember that roles do not have to be filled by individual people; one person may cover several roles in a small team\n- [ ] Revisit and split responsibilities as the platform team grows\n\n*The book frames these responsibilities similarly to running a small product company, with CEO-, CTO-, product-, engineering-, marketing-, and support-style functions.*\n\n## 3. Technology Strategy\n\n- [ ] Decide which base technologies the platform will use\n- [ ] Determine whether portability across base platforms is required\n- [ ] Plan how the platform can evolve without creating large migration efforts\n- [ ] Decide where open-source components fit\n- [ ] Decide what should be built internally versus what should be purchased, outsourced, or assembled\n- [ ] Document important technical decisions\n- [ ] Make the engineering team's quality and expertise visible to help attract talent\n\n## 4. Product & Delivery\n\n- [ ] Build the roadmap from both customer input and the overall platform vision\n- [ ] Prioritize work rather than accepting every feature request\n- [ ] Coordinate product priorities with engineering capacity and delivery timelines\n- [ ] Account for technical complexity and available skills when planning delivery\n- [ ] Maintain a balanced roadmap rather than letting individual customers dictate the platform's direction\n\n## 5. Internal Marketing & Adoption\n\n- [ ] Give the platform a recognizable name and identity\n- [ ] Clearly communicate its value proposition\n- [ ] Publish regular updates\n- [ ] Maintain an internal online presence\n- [ ] Hold tech talks, community meetings, hackathons, or other internal events\n- [ ] Create channels where users can ask questions and provide feedback\n- [ ] Prefer earning voluntary adoption through value rather than relying only on mandates\n- [ ] Continuously listen to users and respond to changing needs\n\n*Platform adoption is presented as a two-way conversation: teams should listen to customers while still protecting the product vision and roadmap.*\n\n## 6. East–West Team Alignment\n\n- [ ] Break down silos between infrastructure, operations, networking, security, storage, compute, and related functions\n- [ ] Establish common outcomes across participating teams\n- [ ] Avoid exposing internal organizational boundaries through the platform experience\n- [ ] Provide users with cohesive interfaces rather than forcing them to navigate across multiple teams\n- [ ] Focus discussions on what outcome is needed before debating how it should be implemented\n- [ ] Preserve team autonomy where possible\n- [ ] Where collaboration is impossible, decide whether to fix, wrap, or work around the dependency\n\n*The goal is to avoid \"shipping the org chart\" into the platform and instead create aligned goals and fluid communication across infrastructure and operations.*\n\n## 7. North–South Team Alignment\n\n- [ ] Establish transparent communication between platform builders and platform consumers\n- [ ] Understand development teams' desire for speed and flexibility\n- [ ] Understand operations teams' concerns about stability, security, and compliance\n- [ ] Avoid \"us versus them\" relationships\n- [ ] Focus discussions on customer outcomes and organizational value\n- [ ] Treat platform adoption as an ongoing relationship rather than a one-time rollout\n\n## 8. Customer Needs\n\n- [ ] Identify problems before jumping to solutions\n- [ ] Observe actual developer workflows\n- [ ] Investigate bottlenecks and impediments\n- [ ] Use techniques such as the 5 Whys or value stream mapping to identify root causes\n- [ ] Avoid blindly copying platforms or tools used by other organizations\n- [ ] Validate proposed features against actual organizational needs\n- [ ] Treat recurring user difficulties as possible platform-design problems\n\n## 9. Customer Personas\n\n- [ ] Identify developers as a primary customer group\n- [ ] Identify the project or account administrators\n- [ ] Identify system administrators and operational users\n- [ ] Consider the end users of applications running on the platform\n- [ ] Determine the different support needs of each persona\n- [ ] Design platform interfaces and services with these distinct personas in mind\n\n## 10. Customer Engagement Model\n\n- [ ] Provide effective self-service capabilities\n- [ ] Make APIs and interfaces consistent and predictable\n- [ ] Provide onboarding and setup assistance where needed\n- [ ] Automate repetitive setup tasks rather than performing them manually every time\n- [ ] Offer consulting for unusual or complex problems when appropriate\n- [ ] Avoid allowing consulting work to consume so much capacity that the platform team becomes a professional-services organization\n- [ ] Create and support a user community\n- [ ] Use co-creation with customers for suitable platform features\n- [ ] Periodically rebalance the effort spent on self-service, setup, consulting, community, and co-creation\n\n*Communities can both scale support and provide valuable feedback; repeated questions can reveal weaknesses in platform design.*\n\n## 11. Support & Enablement\n\n- [ ] Provide users with documentation and a knowledge base\n- [ ] Provide training and onboarding where required\n- [ ] Ensure support work is recognized when engineers perform it\n- [ ] Track how much engineering time is consumed by support\n- [ ] Automate or redesign areas generating repetitive support requests\n- [ ] Consider creating a network of internal architects, champions, or ambassadors\n- [ ] Use enablement to increase teams' autonomy rather than providing permanent staff augmentation\n\n## 12. Skills & Cognitive Load\n\n- [ ] Regularly assess the engineering skills available across teams\n- [ ] Develop a broad population of capable senior engineers rather than depending on a small number of experts\n- [ ] Continuously evolve skills as technologies and methodologies change\n- [ ] Identify outdated mental models that make new technologies harder to understand\n- [ ] Teach principles and new ways of thinking — not only APIs and tools\n- [ ] Help development teams handle the cognitive load that remains after platform abstractions are introduced\n\n*Enabling teams should increase the autonomy of development teams, while platform teams reduce the complexity of underlying systems.*\n\n## 13. Decide Whether You Actually Need a Platform\n\n- [ ] Confirm that building a platform is necessary before creating one\n- [ ] Determine whether existing base platforms already provide sufficient capabilities\n- [ ] Consider whether enablement and skills development could solve the problem instead\n- [ ] Consider a Thinnest Viable Platform rather than a large custom platform\n- [ ] Build only capabilities that are genuinely unique or valuable to the organization\n- [ ] Spend time observing development teams before committing to major platform investments\n- [ ] Keep expert teams free enough to respond to emerging technologies and paradigm shifts\n\n*A team can sometimes reduce cognitive load and improve engineering capability without building or maintaining a platform.*\n\n## 14. Recruiting & Retention\n\n- [ ] Make recruiting a leadership responsibility\n- [ ] Use senior leaders for important candidate outreach where useful\n- [ ] Promote the organization's genuine strengths rather than copying perks from technology companies\n- [ ] Make interesting technical work visible internally and externally\n- [ ] Pay people sufficiently that compensation is not a persistent concern\n- [ ] Provide learning and career-development opportunities\n- [ ] Give team members visibility through conferences, talks, articles, or leadership interactions\n- [ ] Build strong professional relationships that can outlast individual roles or employment\n\n## Final Platform Health Check\n\n- [ ] Are customers choosing the platform because it provides value?\n- [ ] Does the platform reduce developer cognitive load?\n- [ ] Can developers complete common tasks through self-service?\n- [ ] Do infrastructure and operations teams collaborate effectively?\n- [ ] Is customer feedback regularly influencing the roadmap?\n- [ ] Are recurring support problems being turned into product improvements?\n- [ ] Is the platform team operating like a product organization rather than a ticket queue?\n- [ ] Are responsibilities clear even when individuals perform multiple roles?\n- [ ] Are the organization's engineering skills improving?\n- [ ] Is the platform still the simplest and most valuable solution to the problem?\n"}]}, {"key": "dialog", "label": "Conversation", "meta": {"timetoread": "8 min listen"}, "blocks": [{"type": "markdown", "content": "## A Small Product Company\n\n**Ben:** Give me the bluntest version. Why does a platform team need an operating model at all? Put good engineers on it, give them a backlog, done.\n\n**Ana:** Because that setup has a default trajectory, and it ends in a ticket queue. The gravitational pull on every platform team is toward doing things *for* development teams instead of making them capable themselves. This record's founding stance pushes the other way: the platform is a product, and the team is a small product company inside the organization — with a vision, a value proposition, and customers it has to win.\n\n**Ben:** \"Small product company\" sounds like a slogan. What does it actually change on Monday?\n\n**Ana:** It's a staffing instruction. Hohpe frames the responsibilities like the functions of a small company: someone accountable for value and direction, someone owning technology strategy, plus product, engineering, marketing, and support functions. On Monday it means I can name the accountable leader and the owner of each of those five functions for every platform we run.\n\n**Ben:** Six executive-shaped roles for a five-person team? That's org theater.\n\n**Ana:** Nobody's hiring six executives. One person covers several roles in a small team — that's fine and expected. The rule is narrower and harder: roles can share people, but they can never go unowned. Because an unowned role doesn't disappear. It fails silently.\n\n**Ben:** Silently how?\n\n**Ana:** Platforms without a marketing owner get no adoption — nobody's job was telling anyone it exists. Platforms without a support owner burn their engineers, who cover it invisibly. Platforms without a product owner become whatever the loudest customer demands. Each of those failures looks like bad luck from the outside. They're all the same failure: a role nobody held.\n\n## Shipping the Org Chart\n\n**Ben:** Okay, roles. But most platforms I've seen fail for a different reason — they're stitched together from infrastructure, networking, security, and storage teams that all pull in their own direction.\n\n**Ana:** That's the east–west axis, and the record treats it as a first-class alignment problem. A platform assembled from teams that never aligned will faithfully reproduce their boundaries: duplicate portals, terminology that changes at every internal seam, hand-offs in the middle of a workflow. That's shipping the org chart. Users should never be able to tell from the experience which internal team owns which layer.\n\n**Ben:** Nice ambition. Some of those teams won't cooperate no matter what outcomes you write down.\n\n**Ana:** The record has an honest escape hatch for exactly that. First you try the real fix — common outcomes, discussions that start from what's needed rather than which implementation someone prefers, autonomy preserved where possible. But where collaboration genuinely cannot be had, we consciously choose: fix the dependency, wrap it, or work around it. What's not acceptable is the fourth option everyone defaults to — letting the seam show and making users navigate it.\n\n**Ben:** So east–west is about the teams behind the platform. What's north–south?\n\n**Ana:** Builders and consumers. Developers want speed and flexibility; operations wants stability, security, compliance. A platform team that picks one side inherits an us-versus-them relationship with the other. North–south alignment means refusing that framing and treating adoption as a two-way conversation that never ends.\n\n## Earning Adoption\n\n**Ben:** Here's where I push back hard. You have executive authority. Mandate the platform. Adoption solved in one memo, and all this marketing machinery — internal events, newsletters, feedback channels — becomes unnecessary.\n\n**Ana:** A mandated platform gets malicious compliance at best. People will technically use it, route around it where it hurts, build shadow tooling, and tell you nothing about why. What I want is voluntary adoption earned through value — because that's the only version where usage tells you the platform is actually good.\n\n**Ben:** But the marketing apparatus feels heavy for an internal tool. A recognizable name? Tech talks? Really?\n\n**Ana:** It feels heavy until you notice it's the cheapest part of the system. A recognizable identity, a clear value proposition, regular updates, channels where users can actually reach you — that's a fraction of one role's time, and it's the difference between a platform teams discover and a platform teams are ambushed by. Remember, this is the role that fails silently when unowned.\n\n**Ben:** Doesn't listening to customers that much just hand the roadmap to whoever shouts loudest?\n\n**Ana:** Listening is not obeying. The roadmap blends customer input with the platform vision — that's the product-owner role earning its keep. You take the feedback seriously, and you still protect the direction from being dictated by any single customer. The full discipline of running that roadmap is [Platform as a Product](platform-as-a-product.html); this record just makes sure someone owns it.\n\n## The Engagement Portfolio\n\n**Ben:** Let's talk about how the team actually engages users. My worry: \"balanced engagement model\" is a euphemism for doing a bit of everything badly.\n\n**Ana:** It's a portfolio, and portfolios drift if unmanaged — that's the point of naming it. Self-service scales best but can't cover the unusual cases. Consulting covers them but eats the team if unchecked. Community scales support and surfaces design weaknesses through repeated questions. Co-creation builds the best features and the deepest buy-in. The discipline is periodically rebalancing effort across self-service, setup, consulting, community, and co-creation — deliberately.\n\n**Ben:** What happens without the rebalancing?\n\n**Ana:** The most common death I've seen: professional-services drift. Consulting engagements quietly consume the team — each one individually justified, each one helping a real customer — until a year later there's no capacity left for the product. High-touch help everywhere, platform progress nowhere. The consulting was never wrong; the absence of a rebalancing decision was.\n\n**Ben:** And how do you know what to self-serve in the first place?\n\n**Ana:** By starting from needs, not solutions. Observe actual developer workflows, investigate bottlenecks, and treat the personas as genuinely distinct — developers, administrators, operators, end users have different jobs and different support needs. The anti-pattern is copying another company's platform stack because it worked there, without ever watching your own teams work.\n\n## Do You Even Need a Platform?\n\n**Ben:** Now the question that undercuts the whole episode. All this machinery assumes the platform should exist. Should it?\n\n**Ana:** That's the most countercultural item in the source chapter, and the record keeps it as a standing gate: confirm a platform is necessary before creating one. Sometimes the base platform already provides enough. Sometimes enablement and skills development reduce cognitive load better than another abstraction layer. Sometimes a Thinnest Viable Platform beats the grand custom build. We build only what's genuinely unique or valuable to us.\n\n**Ben:** A platform team asking whether it should exist — that's a turkey voting for Christmas.\n\n**Ana:** Which is exactly why it's an explicit annual question with an accountable owner, not a mood. Once a year: is this platform still the simplest, most valuable solution to the problem? Retirement is an acceptable answer. The most expensive failure mode in this whole space is a beautifully organized team building a platform nobody needed — and the only defense is asking the question before pride accumulates. The timing side of that question, when to start at all, is [Getting Started with Platform Engineering](getting-started.html) territory.\n\n**Ben:** And either way, whether you build or not?\n\n**Ana:** Either way, we invest in skills and cognitive-load reduction. The goal was never the platform. The goal is capable development teams; the platform is one means.\n\n## What This Record Doesn't Cover\n\n**Ben:** Close it out. What are you explicitly not claiming?\n\n**Ana:** Four fences. This isn't about hiring and growing platform engineers as individuals — that's [Building Great Platform Teams](building-platform-teams.html); this record defines the team shape those people fill. It's not the full product-management discipline — [Platform as a Product](platform-as-a-product.html) carries that; here product thinking is just the founding stance. It's not stakeholder tactics — [Managing Platform Stakeholders](managing-stakeholders.html) covers those; the two alignment axes here are the map those tactics navigate. And it's not an org-chart template — no team sizes, no reporting lines.\n\n**Ben:** And what makes you reopen it?\n\n**Ana:** Three signals. Support and consulting load crowding out product work for more than a quarter — professional-services drift. Adoption stalling while pressure to mandate rises — the north–south relationship failing. Or the annual health check unable to confirm the platform is still the simplest, most valuable answer. Any of those, and I'm back in this record before I'm back in the org chart.\n\n**Ben:** One sentence.\n\n**Ana:** Platforms fail organizationally before they fail technically — so organize first: an accountable leader, five owned roles, two aligned axes, and the honesty to ask whether you need the platform at all.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why a platform team is a small product company, not a ticket queue — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. KAI: a hands-on platform engineering lead, short dark hair, gray zip-up hoodie with a small gear pin, laptop covered in infrastructure stickers under one arm, a coil of cable slung over the shoulder.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and teal accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: a polished platform tower stands on a cracking org-chart foundation while an executive points at the cracks.](assets/images/organizing-for-platforms/comic-01-fails-organizationally-first.jpeg)\n**Panel 1:** *The hook: platforms fail organizationally before they fail technically.*\n\n![Comic panel: a platform engineer buried behind a service counter with an endless spool of tickets and a queue of developers.](assets/images/organizing-for-platforms/comic-02-the-ticket-queue.jpeg)\n**Panel 2:** *The problem: the gravitational pull is toward a ticket queue with a logo — doing work for teams instead of enabling them.*\n\n![Comic panel: a developer faces four mismatched portal doors labeled network, storage, security, and compute under org-chart lines.](assets/images/organizing-for-platforms/comic-03-the-shipped-org-chart.jpeg)\n**Panel 3:** *The wrong way: ship the org chart, and users navigate your internal seams instead of one platform.*\n\n![Comic panel: an executive shows a small-company chart with five named roles while an engineer wears two stacked hats.](assets/images/organizing-for-platforms/comic-04-a-small-product-company.jpeg)\n**Panel 4:** *The principle: run the platform team as a small product company — every role owned, even when one person wears several hats.*\n\n![Comic panel: an engineer slides one clean facade with a single door in front of mismatched infrastructure machines.](assets/images/organizing-for-platforms/comic-05-east-west-one-interface.jpeg)\n**Panel 5:** *East–west: infrastructure functions align on common outcomes behind one interface — and the seams stay inside.*\n\n![Comic panel: a two-way footbridge where a platform leader and a developer exchange notes while a torn mandate poster lies discarded.](assets/images/organizing-for-platforms/comic-06-north-south-relationship.jpeg)\n**Panel 6:** *North–south: adoption is a relationship earned through value — mandates buy compliance, not commitment.*\n\n![Comic panel: teams pull an engineer toward hands-on help while the roadmap gathers cobwebs and an executive holds a balance scale.](assets/images/organizing-for-platforms/comic-07-the-consulting-drift.jpeg)\n**Panel 7:** *The cost: high-touch help eats the team — the engagement portfolio needs deliberate rebalancing, or consulting wins by default.*\n\n![Comic panel: two figures at a signpost choosing between building a platform and enabling teams with skills.](assets/images/organizing-for-platforms/comic-08-do-we-need-it.jpeg)\n**Panel 8:** *The closer: confirm the platform is needed at all — sometimes enablement and a thinner platform win.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
