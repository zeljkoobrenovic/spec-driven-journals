a product and cultural discipline, not a collection of new infrastructure technologies.\n\n## Statement\n\nMy operating model for starting platform engineering follows the coordination cost, not the calendar.\n\nEarly stage — stay lightweight:\n\n- **Optimize for fast feedback and deployment, not future scale.** Source control for everything, continuous deployment automated as early as practical, and simple off-the-shelf deployment platforms. No Kubernetes or similarly complex infrastructure before we actually need it.\n- **Evaluate tooling on complexity, cost, expected scale, and lifespan.** Outsource capabilities that are not core business differentiators; automate only where it removes repetitive work.\n- **Keep platform work a shared responsibility.** No dedicated platform team while informal cooperation still works — but track whether support and technical-debt work is starting to crowd out feature work, and document engineering decisions and their reasoning from day one.\n\nGrowing — introduce structure:\n\n- **Standardize the paved road.** Automated local development environments, test coverage gated into the merge process, branch-based and ephemeral environments, feature flags, build and deployment monitoring, and automated infrastructure provisioning.\n- **Introduce a lightweight decision process.** RFCs or ADRs reviewed for technical tradeoffs, operational impact, security, licensing, and cost — with affected engineers included, so individual preferences stop determining organization-wide tooling.\n\nForming the first team — only when it earns its keep:\n\n- **Watch for the ownership signals.** Recurring friction around shared code and tooling, failures caused by unclear ownership, capabilities reinvented team by team, and a group too large for everyone to maintain working relationships.\n- **Apply the centralization test.** Centralize only where one implementation can serve many teams without extensive per-team customization, and where the leverage is substantially greater than the cost of another coordination point. If every application needs substantial custom logic, do not centralize it.\n- **Start with problems, not architecture.** The first team makes ownership boundaries explicit, treats platform-consuming engineers as customers, fixes the messiest shared code and workflows first, and builds trust before attempting any major redesign.\n- **Hire for the organization we have.** People who reason from first principles at our scale and constraints — not people who can only reproduce how platforms worked at much larger companies. Product managers come after the team has built direct customer relationships; project managers come later still.\n\nTransforming a traditional infrastructure organization is a **culture transformation, not a technology migration**: start where platform practices are closest, introduce real product thinking, fix support, change hiring and incentives, own migrations, and spend more engineering time with customers.\n\n![Diagram of three stages of platform investment — shared responsibility, paved road, platform team — driven by a rising coordination-cost curve.](assets/images/getting-started/stages-of-platform-investment.jpeg)\n**Figure 1:** *Structure follows coordination cost: shared responsibility while informal cooperation works, a paved road as the organization grows, a formal team only when explicit ownership creates real leverage.*\n\n## How to Read This\n\nThis journal is my platform operating model, one record per source checklist. This record is grounded in the \"Getting Started\" chapter of Camille Fournier and Ian Nowland's *Platform Engineering: A Guide for Technical, Product, and People Leaders* (O'Reilly, 2024) — the chapter about when to introduce platform engineering and what to build first, distilled here into **the readiness rules I hold platform investment to**. The runnable version — the stage-by-stage checklist, the team-formation test, and the transformation program — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**A premature platform team is a tax on product experimentation.** While a startup is still finding product-market fit, developer needs change too fast for any platform to stabilize around them. Fournier and Nowland are blunt: if a handful of engineers can still coordinate informally, shared tooling rarely causes friction, and ownership is obvious, a dedicated platform team **slows the company down** — it adds a coordination point and an opinionated layer exactly when the product needs neither. Staying lightweight is not neglect; it is the correct platform strategy for that stage.\n\n**Coordination cost is the signal, not company size.** The moment to add structure is not a headcount milestone but the moment informal cooperation stops scaling: shared systems failing because \"everyone owns it\" has become \"nobody owns it\", teams reinventing the same capabilities, tooling chosen by one developer breaking at team scale. These are observable facts, which means the decision to form a platform team can be **evidence-based rather than fashionable** — I can point at the friction I am buying my way out of.\n\n![Concept map of three friction signals — unclear ownership, reinvented capabilities, tooling breaking at scale — converging on the decision to make ownership explicit.](assets/images/getting-started/ownership-drift-signals.jpeg)\n**Figure 2:** *The readiness signals are observable facts, not milestones: when these frictions accumulate, the decision to add structure becomes evidence-based rather than fashionable.*\n\n**The centralization test protects against apparent efficiency.** Centralizing a capability always looks efficient on a slide — one team, one system, no duplication. The chapter's discipline is to demand **leverage, not merely apparent efficiency**: one implementation that genuinely serves many teams without extensive per-team customization, worth more than the coordination point it adds. When every consumer needs substantial custom configuration, centralization manufactures a bottleneck and calls it a platform.\n\n**Trust is built by fixing today's pain, not by shipping tomorrow's architecture.** A new platform team that opens with a grand redesign asks its customers for faith it has not earned, while the messy shared libraries and broken workflows that justified its existence keep hurting. Fixing the most painful existing problems first delivers **visible value quickly**, and that credibility is the currency the team will later spend on larger architectural change. Replacing a working platform simply because newer technology exists is not a strategy; it is a hobby.\n\n**Hiring for someone else's scale imports someone else's problems.** People who only know how platforms worked at much larger companies will faithfully rebuild that machinery — the complexity, the process, the cost — regardless of whether we need it. At formation time I test for **first-principles reasoning at our current scale**, comfort with immature processes, and customer empathy alongside technical ability. For the same reason, product managers arrive only after engineers have built direct customer relationships: a PM added too early becomes a substitute for engineers talking to customers, which is the exact culture I am trying to prevent.\n\n**Transforming an infrastructure organization is won or lost on culture, not migration plans.** Ticket queues, \"us versus them\" attitudes, and incentives that reward heroic complexity over usability do not disappear because the technology changed. The transformation has to change what is rewarded — usability work, listening to customers, reducing customer effort — change how support and hiring work, and make the platform team **own migration pain instead of exporting it** to its customers. Start with the teams closest to platform practices, and let their success argue for the rest.\n\n![Before-and-after comparison of an infrastructure organization: a ticket-queue wall versus an open counter with direct customer conversations and owned migrations.](assets/images/getting-started/transformation-before-after.jpeg)\n**Figure 3:** *The transformation is cultural: the ticket wall comes down, engineers talk to customers directly, the platform team owns migration pain, and usability becomes what gets rewarded.*\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| Early on, platform work is a shared engineering responsibility. | The early team ignores platform hygiene — source control, automated deployment, and decision records start on day one. |\n| Structure arrives as coordination costs rise. | Structure arrives on a calendar, at a headcount milestone, or because platform engineering is fashionable. |\n| A formal team forms when centralizing creates real leverage. | Every shared annoyance justifies a central team — capabilities needing heavy per-team customization stay decentralized. |\n| The first team fixes the most painful existing problems first. | The first team's mandate is a greenfield redesign — big-bang replatforms come, if ever, after trust is earned. |\n| Engineers build direct customer relationships before PMs arrive. | Product managers are a substitute for engineers talking to customers. |\n| Transforming an infrastructure org means changing incentives, support, and hiring. | A platform transformation is a technology migration with a new team name. |\n| The platform team owns migration pain as part of its value proposition. | Customers absorb the cost of every platform change. |\n\nConcretely: before I approve a platform team, someone can show me the friction — the outages with unclear ownership, the reinvented capabilities, the coordination cost — and can name **a concrete group of customers and the problems the team will solve first**. And six months in, I expect the team to be measured on whether those customers work more effectively, not on how much new architecture it has produced.\n\n## Anti-Patterns\n\n- **Kubernetes on day one.** Adopting the infrastructure of a thousand-engineer company at ten engineers, then spending the seed round operating it.\n- **The calendar-driven platform team.** Forming a team because \"we're at fifty engineers now\" rather than because specific, observable friction demands explicit ownership.\n- **Centralizing the uncentralizable.** Pulling a capability into a platform team when every consumer needs substantial customization — creating a bottleneck with a platform's name tag.\n- **The big-bang replatform.** A new team whose first act is replacing the entire existing platform because newer technology is available, burning trust it never built.\n- **The BigCo import.** Hiring people who can only reproduce large-company platform machinery, and getting large-company complexity without large-company scale.\n- **PM as proxy.** Adding a product manager so engineers can stop talking to customers — inverting the customer-facing culture the team exists to build.\n- **The ticket black hole.** Running platform support as an untracked queue that customers learn to route around, then wondering why shadow platforms appear.\n- **Migration dumped on customers.** Shipping platform changes and expecting application teams to absorb all migration costs, teaching them that the platform is a source of work rather than leverage.\n\n## Related Records\n\n- [What Is Platform Engineering](what-is-platform-engineering.html) — why platform engineering exists at all; this record covers when to actually start it.\n- [The Four Pillars of Platform Engineering](four-pillars.html) — what a real platform must be; this record covers how to get there from zero without overbuilding.\n- [Building Great Platform Teams](building-platform-teams.html) — who the first team is made of once it is justified; this record only sets the formation-time hiring cautions.\n- [Platform as a Product](platform-as-a-product.html) — the full product operating mode the first team grows into; this record establishes the customer framing at formation.\n- [Organizing for Platforms](organizing-for-platforms.html) — Hohpe's organizational view of the same question: how team setup follows platform intent.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs platform-engineering investment decisions everywhere I am the accountable executive: when a platform team may form, what it does first, and how an existing infrastructure organization transforms. I revisit it if a platform team forms without a nameable set of customers and current problems (the signal that fashion has replaced evidence), if support and technical-debt load is measurably crowding out feature work while I am still resisting structure, or if a transformation stalls with new technology in place but old ticket-queue culture intact.\n\n## Authoritative References\n\n- Camille Fournier and Ian Nowland, *Platform Engineering: A Guide for Technical, Product, and People Leaders* (O'Reilly, 2024) — the \"Getting Started\" chapter, whose checklist this record distills.\n"}]}, {"key": "summary", "label": "TL;DR", "meta": {"timetoread": "2 min read"}, "blocks": [{"type": "markdown", "content": "I introduce platform engineering when coordination costs demand it, not before. While a handful of engineers can cooperate informally, platform work stays a shared responsibility with simple, off-the-shelf tooling; when shared systems start failing because \"everyone owns it\" has become \"nobody owns it\", I make ownership explicit and form a team — and that team earns trust by fixing today's most painful problems, not by designing an architecture for a scale we do not have.\n\n**What changes**\n\n* Structure follows **coordination cost, not the calendar**. Early stage means source control, fast feedback, automated deployment, off-the-shelf platforms, no Kubernetes before we need it, and outsourcing non-differentiators. Growth means a standardized paved road — local environments, tested merges, ephemeral environments, feature flags, observability, infrastructure automation — plus a lightweight RFC/ADR decision process.\n* Forming a platform team requires **observable friction signals**: failures with unclear ownership, recurring tooling friction, capabilities reinvented team by team. The decision becomes evidence-based rather than fashionable — someone can point at the friction we are buying our way out of.\n* Every candidate capability passes the **centralization test**: one implementation must serve many teams without extensive per-team customization, and the leverage must substantially exceed the cost of a new coordination point. If every consumer needs heavy custom logic, it stays decentralized.\n* The first team **starts with problems, not architecture** — explicit ownership boundaries, platform-consuming engineers treated as customers, the messiest shared code and workflows fixed first, and trust built before any major redesign.\n* We **hire for the organization we have**: first-principles reasoning at our scale, not people who can only reproduce BigCo platform machinery. Product managers arrive only after engineers have built direct customer relationships; project managers later still.\n* Transforming a traditional infrastructure organization is treated as a **culture transformation, not a technology migration** — changed incentives, real product thinking, fixed support, the platform team owning migration pain, and more engineering time spent with customers.\n\n**What it costs**\n\n* Resisting an early platform team means tolerating some shared-responsibility messiness — and honestly tracking whether support and technical-debt work is crowding out feature work.\n* Fixing today's pain first delays the satisfying big redesign; credibility is earned before it is spent on architectural change.\n* Owning migrations and customer support is real, ongoing platform-team work, not something exported to application teams.\n\n**What we are not doing**\n\n* Not the full staffing and team-shaping model — that is [Building Great Platform Teams](building-platform-teams.html); this record covers only the formation-time hiring cautions.\n* Not defining what a real platform must be ([The Four Pillars of Platform Engineering](four-pillars.html)) or the full product operating mode ([Platform as a Product](platform-as-a-product.html)) — this record establishes only when to start and the customer framing at formation.\n* Not a technology-selection guide — specific tooling choices stay with the teams that live with them.\n\n*The Article tab carries the rationale and anti-patterns; the Checklist tab holds the runnable stage-by-stage program, the team-formation test, and the transformation plan.*\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "6 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Early-stage startup — stay lightweight\n\n- [ ] Use source control for all code\n- [ ] Optimize for fast feedback and deployment, not future scale\n- [ ] Automate continuous deployment as early as practical\n- [ ] Prefer simple, off-the-shelf deployment platforms and services\n- [ ] Avoid introducing Kubernetes or similarly complex infrastructure before we actually need it\n- [ ] When choosing tooling, evaluate:\n  - [ ] Complexity\n  - [ ] Cost\n  - [ ] Expected scale\n  - [ ] Lifespan\n- [ ] Automate infrastructure/configuration where it reduces repetitive work\n- [ ] Outsource capabilities that are not core business differentiators\n- [ ] Keep work tracking lightweight\n- [ ] Use a simple ticket-based process for work tracking\n- [ ] Track whether support/technical-debt work is beginning to crowd out new feature work\n- [ ] Document basic engineering decisions and the reasoning behind them\n- [ ] Keep platform-related work a shared engineering responsibility rather than forming a dedicated platform team too early\n\n## 2. Growing startup — introduce structure\n\nAs the engineering team and product grow:\n\n- [ ] Identify the small group already spending significant time on infrastructure and automation\n- [ ] Keep platform responsibility shared while the organization is still small enough for cooperation to work\n- [ ] Revisit tools selected by individual developers that no longer work at team scale\n- [ ] Replace bespoke tooling where managed services/platforms can provide better leverage\n- [ ] Continue asking: \"Is this capability core to our business?\"\n\n**Local development**\n\n- [ ] Standardize and automate the local development environment\n- [ ] Move beyond fragile developer-specific shell scripts\n- [ ] Keep development-environment setup alongside application source code\n- [ ] Use containers/images where they make environments reproducible\n- [ ] Automate environment setup and updates\n- [ ] Integrate updates into developers' normal workflow where possible\n\n**Testing and deployment**\n\n- [ ] Increase automated test coverage\n- [ ] Make passing tests part of the merge process\n- [ ] Identify high-risk areas and prioritize testing there\n- [ ] Support branch-based deployments\n- [ ] Consider temporary/ephemeral environments for development and testing\n- [ ] Introduce feature flags for risky or incomplete functionality\n- [ ] Prefer an existing feature-flag service over building our own unless it is genuinely core to the business\n\n**Observability**\n\n- [ ] Monitor whether builds and deployments succeed\n- [ ] Alert on failures\n- [ ] Add infrastructure/platform metrics\n- [ ] Add exception and application logging\n- [ ] Reuse existing product observability tooling where possible\n\n**Infrastructure**\n\n- [ ] Automate infrastructure provisioning\n- [ ] Build toward a fully managed production environment\n- [ ] Use automation as the foundation for CI/CD and temporary environments\n\n**Engineering decisions**\n\n- [ ] Introduce a lightweight process for architecture and technology changes\n- [ ] Use RFCs, ADRs, or a similar mechanism\n- [ ] Review decisions for:\n  - [ ] Technical tradeoffs\n  - [ ] Operational impact\n  - [ ] Security\n  - [ ] Licensing\n  - [ ] Cost/budget impact\n- [ ] Include affected engineers in decisions rather than allowing individual preferences to determine organization-wide tooling\n\n## 3. Decide when a formal platform team is justified\n\nA formal platform team becomes more appropriate when informal cooperation stops scaling.\n\n- [ ] Look for recurring friction around shared code, tooling, deployments, or infrastructure\n- [ ] Look for failures caused by unclear ownership\n- [ ] Look for shared systems where \"everyone owns it\" has effectively become \"nobody owns it\"\n- [ ] Consider whether the group has grown beyond the point where everyone can maintain effective working relationships\n- [ ] Determine whether ownership and accountability now need to be explicitly assigned\n- [ ] Confirm that centralizing the capability creates meaningful leverage, not merely apparent efficiency\n\nBefore centralizing something, ask:\n\n- [ ] Will standardization produce meaningful value for many teams?\n- [ ] Can one implementation support many teams without extensive per-team customization?\n- [ ] Is the value of having one solution substantially greater than the cost of adding another coordination point?\n- [ ] Is this capability difficult or wasteful for every application team to build independently?\n\nIf every application needs substantial custom configuration or logic:\n\n- [ ] Reconsider whether it should be centralized\n\n## 4. When creating the first platform team\n\n- [ ] Accept that the old informal cooperation model is changing\n- [ ] Make platform ownership explicit\n- [ ] Clearly define what the platform team owns\n- [ ] Clearly define what application teams still own\n- [ ] Preserve collaboration instead of creating a \"platform team vs. developers\" relationship\n- [ ] Treat engineers consuming the platform as customers\n- [ ] Measure success by whether those customers can work more effectively\n\n**Start with problems, not architecture**\n\n- [ ] Identify the most painful existing problems\n- [ ] Fix messy shared code, libraries, tooling, and workflows first\n- [ ] Deliver visible value quickly\n- [ ] Build trust before attempting a major architectural redesign\n- [ ] Avoid replacing the entire existing platform simply because a newer technology is available\n- [ ] Prefer incremental improvement where possible\n\n**Hiring**\n\n- [ ] Be cautious about hiring people who only know how platforms worked at much larger companies\n- [ ] Evaluate candidates against the scale and constraints of our current organization\n- [ ] Test whether candidates can reason from first principles rather than defaulting to \"BigCo technology\"\n- [ ] Hire people comfortable working without mature processes and guardrails\n- [ ] Prioritize customer empathy alongside technical ability\n\n## 5. Product and project management\n\n**Product managers**\n\n- [ ] Establish a functioning platform engineering team before adding PMs in most internal-platform situations\n- [ ] Let engineers develop direct customer relationships first\n- [ ] Ensure senior engineers and engineering managers establish the team's customer-facing culture\n- [ ] Add product management when product discovery, prioritization, coordination, and customer needs genuinely require it\n- [ ] Avoid using PMs as substitutes for engineers talking to customers\n\n**Project managers**\n\n- [ ] Add project managers later than product managers\n- [ ] Avoid replacing engineering ownership with project coordination\n- [ ] Make engineers responsible for designing migration experiences and automation\n- [ ] Keep project-management overhead proportional to actual coordination complexity\n\n## 6. Shared / integration platform checklist\n\nFor platforms supporting multiple products — such as billing, identity, mobile/web platforms, revenue systems, notifications, search, analytics, or messaging:\n\n- [ ] Clearly define the platform's mandate\n- [ ] Decide how the team will work with external/product-facing product managers\n- [ ] Consider introducing a platform PM earlier than for a purely developer-facing platform\n- [ ] Choose PMs who understand that reliability and developer productivity can matter even when customers cannot directly see them\n- [ ] Make the offering easy to discover internally\n- [ ] Give services clear, understandable names\n- [ ] Maintain searchable documentation\n- [ ] Announce and teach teams about available capabilities\n- [ ] Build awareness through internal communication and engineering communities\n- [ ] Prevent teams from unknowingly rebuilding capabilities that already exist\n- [ ] Keep integration platform teams aligned with underlying infrastructure/core platform teams\n- [ ] Reduce conflicts between platform layers by encouraging engineers to collaborate directly\n\n## 7. Transforming a traditional infrastructure organization\n\nTreat this as a culture transformation, not merely a technology migration.\n\n**Choose where to start**\n\n- [ ] Do not attempt to transform the entire organization simultaneously\n- [ ] Identify teams already closest to platform-engineering practices\n- [ ] Prefer areas with:\n  - [ ] Significant software engineering\n  - [ ] Frequent change\n  - [ ] Modern delivery practices\n  - [ ] High demand for modernization\n  - [ ] Engineers comfortable building software rather than only operating packaged systems\n- [ ] Use successful early teams as examples for the rest of the organization\n\n**Introduce product thinking**\n\n- [ ] Give engineering teams real ownership of customer outcomes\n- [ ] Do not assume adding product managers alone creates a product culture\n- [ ] Make engineers interact directly with users\n- [ ] Shift from queue/backlog thinking toward solving customer problems\n\n**Change support**\n\n- [ ] Avoid turning support into a ticket-system black hole\n- [ ] Track response times\n- [ ] Track how requests are triaged\n- [ ] Have engineers answer customer questions\n- [ ] Use support interactions to identify usability problems\n- [ ] Treat repeated support requests as product feedback\n\n**Change hiring**\n\n- [ ] Add customer-empathy assessment to interviews\n- [ ] Ask candidates how they make code understandable to other engineers\n- [ ] Ask how they respond to questions about systems they built\n- [ ] Look for willingness to understand how other people will use the platform\n\n**Change incentives**\n\n- [ ] Reward usability work, not only technically difficult projects\n- [ ] Reward listening to customers\n- [ ] Reward improvements that reduce customer effort\n- [ ] Adjust engineering career ladders to reflect these expectations\n- [ ] Align promotions and recognition with the behaviors required by the new culture\n\n**Own migrations**\n\n- [ ] Do not expect customers to absorb all migration costs\n- [ ] Make reducing migration pain part of the platform's value proposition\n- [ ] Have engineers automate migration work where possible\n- [ ] Build compatibility tooling, migration libraries, or abstractions where useful\n- [ ] Treat successful customer migration as part of the platform team's responsibility\n\n**Spend more time with customers**\n\n- [ ] Expect less engineering time to be spent purely writing code\n- [ ] Allocate time to customer conversations\n- [ ] Allocate time to product and architecture planning\n- [ ] Measure outcomes such as:\n  - [ ] Customer satisfaction\n  - [ ] Platform adoption\n  - [ ] Migration speed\n  - [ ] Developer productivity\n\n**Organizational change**\n\n- [ ] Identify leaders who actively support the new operating model\n- [ ] Address leaders who repeatedly block the transition\n- [ ] Restructure teams where necessary to make the new model viable\n- [ ] Reduce \"us versus them\" attitudes between platform/infrastructure and application teams\n- [ ] Celebrate customer wins and improvements in developer experience\n- [ ] Include platform teams in broader engineering successes\n\n## 8. \"Are we ready for platform engineering?\" final check\n\nYou are probably **too early** if:\n\n- [ ] A handful of engineers can still coordinate effectively through informal collaboration\n- [ ] Shared tooling rarely causes friction\n- [ ] Ownership is obvious\n- [ ] Developer needs change rapidly while finding product-market fit\n- [ ] A dedicated platform team would slow product experimentation\n\nYou are probably **ready to move toward a formal platform team** if:\n\n- [ ] Shared systems repeatedly fail because ownership is unclear\n- [ ] Coordination around common tooling has become expensive\n- [ ] Teams repeatedly reinvent the same capabilities\n- [ ] Developer productivity is being materially affected\n- [ ] Platform work consumes substantial engineering effort\n- [ ] Standardization would create significant leverage across teams\n- [ ] We can define a concrete group of customers and problems for the platform team\n- [ ] We can start by solving current pain rather than designing for hypothetical future scale\n\n**Core principle:** build for the problems you have today, introduce structure as coordination costs rise, and treat platform engineering as a product and cultural discipline — not simply a collection of new infrastructure technologies.\n"}]}, {"key": "dialog", "label": "Conversation", "meta": {"timetoread": "8 min listen"}, "blocks": [{"type": "markdown", "content": "## Why Not Just Start Now\n\n**Ben:** Give it to me straight. Platform engineering is everywhere — conference talks, job titles, vendor decks. Why shouldn't I just stand up a platform team today and get ahead of it?\n\n**Ana:** Because a premature platform team is a tax on product experimentation. While you're still finding product-market fit, developer needs change too fast for any platform to stabilize around them. Fournier and Nowland are blunt about this: if a handful of engineers can still coordinate informally, shared tooling rarely causes friction, and ownership is obvious, a dedicated platform team slows the company down. You've added a coordination point and an opinionated layer at exactly the moment the product needs neither.\n\n**Ben:** So what's the trigger, then? Fifty engineers? A hundred?\n\n**Ana:** That's the trap — there is no headcount milestone. The trigger is coordination cost. The moment informal cooperation stops scaling: shared systems failing because \"everyone owns it\" has quietly become \"nobody owns it\", teams reinventing the same capabilities, tooling one developer picked that breaks at team scale. Those are observable facts. Which means the decision to form a platform team can be evidence-based instead of fashionable — I can point at the friction I'm buying my way out of.\n\n**Ben:** \"Calendar-driven platform team\" — that's one of your anti-patterns, right? Forming one because \"we're at fifty engineers now\"?\n\n**Ana:** Exactly. Structure follows coordination cost, not the calendar and not the fashion cycle.\n\n## Staying Lightweight Without Being Negligent\n\n**Ben:** Okay, but \"stay lightweight\" sounds like an excuse for chaos. No platform team, no standards, everyone YOLO-deploying from laptops?\n\n**Ana:** No — staying lightweight is a deliberate platform strategy, not neglect. Even at the earliest stage: source control for everything, continuous deployment automated as early as practical, simple off-the-shelf deployment platforms, and decisions documented with their reasoning from day one. What you don't do is adopt the infrastructure of a thousand-engineer company at ten engineers.\n\n**Ben:** You're going to say Kubernetes.\n\n**Ana:** I'm going to say Kubernetes. Kubernetes on day one, then spending the seed round operating it. The early rule is: evaluate tooling on complexity, cost, expected scale, and lifespan; outsource anything that isn't a core business differentiator; and optimize for fast feedback, not future scale.\n\n**Ben:** And as you grow? There has to be a middle stage between \"shared responsibility\" and \"formal team\".\n\n**Ana:** There is, and it's the paved road. Standardized, automated local development environments instead of fragile personal shell scripts. Test coverage gated into the merge process. Branch-based and ephemeral environments, feature flags, build and deployment monitoring, automated infrastructure provisioning. And one thing people skip: a lightweight decision process — RFCs or ADRs reviewed for tradeoffs, operational impact, security, licensing, and cost, with affected engineers in the room. That's what stops one person's preferences from becoming organization-wide tooling by accident.\n\n## The Centralization Test\n\n**Ben:** Let me push on the team-formation moment. Say the friction is real — outages with unclear ownership, three teams building the same thing. Isn't the answer obvious? Centralize it all.\n\n**Ana:** Not all of it. Centralizing always looks efficient on a slide — one team, one system, no duplication. The chapter's discipline is to demand leverage, not merely apparent efficiency. Before centralizing anything, ask: will standardization produce meaningful value for many teams? Can one implementation serve them without extensive per-team customization? Is having one solution worth substantially more than the cost of another coordination point?\n\n**Ben:** And if the answer is no?\n\n**Ana:** Then don't. If every application needs substantial custom logic, centralization doesn't build a platform — it manufactures a bottleneck and puts a platform's name tag on it. That capability stays with the teams.\n\n**Ben:** Fair. So the test passes, the team forms. First order of business: the grand replatform, surely. New team, clean slate, modern stack.\n\n**Ana:** That's the fastest way to burn trust the team never built. A new platform team that opens with a big redesign is asking its customers for faith it hasn't earned, while the messy shared libraries and broken workflows that justified its existence keep hurting. Start with problems, not architecture: make ownership boundaries explicit, treat the engineers who consume the platform as customers, fix the most painful existing problems first. Visible value quickly. That credibility is the currency the team later spends on larger architectural change.\n\n**Ben:** And replacing a working platform because newer technology exists?\n\n**Ana:** Is not a strategy. It's a hobby.\n\n## Who You Hire, and When PMs Arrive\n\n**Ben:** Staffing question. The obvious move is hiring someone who ran platforms at Google or Netflix. They've seen the endgame — why wouldn't I want that?\n\n**Ana:** Because people who only know how platforms worked at much larger companies will faithfully rebuild that machinery — the complexity, the process, the cost — whether or not you need it. You get large-company complexity without large-company scale. At formation time I test for first-principles reasoning at our current scale, comfort with immature processes, and customer empathy alongside technical ability.\n\n**Ben:** What about product managers? Everyone says platform-as-product; product needs PMs.\n\n**Ana:** Later than you think. Product managers come after the team has built direct customer relationships. A PM added too early becomes a substitute for engineers talking to customers — which inverts the exact customer-facing culture the team exists to build. Senior engineers and engineering managers establish that culture first. Project managers come later still. The deeper staffing model is its own record — [Building Great Platform Teams](building-platform-teams.html) — but those are the formation-time cautions.\n\n## Transforming an Existing Infrastructure Org\n\n**Ben:** All of this assumes a startup growing into it. What about the other direction — a traditional infrastructure organization that's told it's \"doing platform engineering now\"? New name, same ticket queue?\n\n**Ana:** That's the failure mode, and the record's answer is that this is a culture transformation, not a technology migration. Ticket black holes, \"us versus them\" attitudes, incentives that reward heroic complexity over usability — none of that disappears because the technology changed. You have to change what's rewarded: usability work, listening to customers, reducing customer effort. Change how support works — engineers answering customer questions, repeated requests treated as product feedback. Change hiring to test for customer empathy.\n\n**Ben:** Where do you even start with something that big?\n\n**Ana:** Not everywhere at once. Start with the teams already closest to platform practices — significant software engineering, frequent change, engineers comfortable building software rather than only operating packaged systems — and let their success argue for the rest.\n\n**Ben:** One more: migrations. Every platform change I've lived through meant weeks of forced work for application teams.\n\n**Ana:** And that teaches customers the platform is a source of work rather than leverage. The transformed team owns migration pain as part of its value proposition — automation, compatibility tooling, migration libraries. Successful customer migration is the platform team's responsibility, not something dumped on its customers.\n\n## What This Record Doesn't Claim\n\n**Ben:** Close it out. What are you explicitly not saying here?\n\n**Ana:** Four things. This isn't the full staffing and team-shaping model — that's [Building Great Platform Teams](building-platform-teams.html); here I only set the formation-time hiring cautions. It doesn't define what a real platform must be — that's [The Four Pillars of Platform Engineering](four-pillars.html) — or the full product operating mode, which is [Platform as a Product](platform-as-a-product.html); this record just establishes the customer framing at the start. And it's not a technology-selection guide. Specific tooling choices stay with the teams that live with them.\n\n**Ben:** And when do you revisit it?\n\n**Ana:** Three signals. If a platform team forms without a nameable set of customers and current problems — that's fashion replacing evidence. If support and technical-debt load is measurably crowding out feature work while I'm still resisting structure — I've held out too long. Or if a transformation stalls with new technology in place but the old ticket-queue culture intact. Six months in, the test is simple: is the team measured on whether its customers work more effectively — not on how much new architecture it has produced.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why platform engineering starts when coordination costs demand it — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. KAI: a hands-on platform engineering lead, short dark hair, gray zip-up hoodie with a small gear pin, laptop covered in infrastructure stickers under one arm, a coil of cable slung over the shoulder.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and teal accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Kai wheels a huge machine labeled K8S into a tiny startup office while Vera asks if ten engineers need it.](assets/images/getting-started/comic-01-day-one-kubernetes.jpeg)\n**Panel 1:** *The hook: the temptation to start with big-company infrastructure long before anything demands it.*\n\n![Comic panel: Vera points at a shelf of simple tooling boxes while Kai launches a paper boat labeled FEATURE down a stream.](assets/images/getting-started/comic-02-stay-lightweight.jpeg)\n**Panel 2:** *Early stage: fast feedback and boring off-the-shelf tooling — platform work stays a shared responsibility.*\n\n![Comic panel: a smoking server rack labeled SHARED while engineers all point at each other and Kai holds an extinguisher.](assets/images/getting-started/comic-03-nobody-owns-it.jpeg)\n**Panel 3:** *The signal: 'everyone owns it' has quietly become 'nobody owns it' — coordination costs are now visible.*\n\n![Comic panel: Kai celebrates a headcount milestone with a ribbon while Vera holds up a chart of rising friction.](assets/images/getting-started/comic-04-the-calendar-team.jpeg)\n**Panel 4:** *The wrong way: forming a platform team on a calendar or headcount milestone instead of observable friction.*\n\n![Comic panel: a balance scale weighing one shared gear serving many teams against a knot of custom adapters.](assets/images/getting-started/comic-05-the-centralization-test.jpeg)\n**Panel 5:** *The test: centralize only where one implementation serves many teams — leverage, not apparent efficiency.*\n\n![Comic panel: Kai repairs a cracked pipe labeled SHARED LIBS while a grand blueprint labeled FUTURE sits ignored.](assets/images/getting-started/comic-06-fix-todays-pain.jpeg)\n**Panel 6:** *The first team: fix the most painful existing problems first — trust is the currency for any later redesign.*\n\n![Comic panel: a job candidate unpacks a giant crate labeled BIGCO full of heavy machinery while Vera and Kai look on.](assets/images/getting-started/comic-07-the-bigco-import.jpeg)\n**Panel 7:** *The cost: hire first-principles thinkers for the organization you have — not importers of big-company machinery.*\n\n![Comic panel: Kai hands a mug labeled FOR OUR ENGINEERS to a developer while Vera watches approvingly.](assets/images/getting-started/comic-08-a-discipline-not-a-tech.jpeg)\n**Panel 8:** *The closer: platform engineering is a product and cultural discipline — the customers are engineers, not the technology.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
