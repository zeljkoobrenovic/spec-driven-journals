<script id="data" type="application/json">{"meta": {"id": "PLT-FOUR-PILLARS", "status": "draft:gray", "title": "The Four Pillars of Platform Engineering", "date": "2026-08-12", "author": "Željko Obrenović", "permalink": "four-pillars", "timetoread": "7 min", "excerpt": "Before I call anything in my organization a platform, it has to stand on four pillars: it is a curated product with paved paths, it is built on software abstractions that genuinely manage complexity, it serves a broad base of application developers through self-service, and it is operated as a reliable foundation for the business. Miss a pillar and what you have is tooling, provisioning, or infrastructure enablement wearing a platform badge. The test I keep running: does this platform actually manage complexity for application developers, or does it merely move that complexity somewhere else?", "tags": "platform engineering, paved paths, abstractions, self-service, developer experience, operations, internal platforms", "icon": "assets/icons/four-pillars.png", "logo": "assets/images/four-pillars/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["platform engineering", "paved paths", "abstractions", "self-service", "developer experience", "operations", "internal platforms"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: I call something a platform only when it stands on four pillars at once. It is a **curated product** — an opinionated offering with paved paths, shaped by customer needs rather than technical preference. It is built on **software abstractions** — real software by real engineers that genuinely manages complexity, not documentation stapled to configuration. It serves a **broad base of application developers** — self-service, multiple interfaces, guardrails, and multitenancy that makes it cheaper as adoption grows. And it is **operated as a foundation** — the platform team owns the operational experience of the complete offering, down through the cloud, OSS, and vendor layers beneath it. Miss a pillar and it is tooling, provisioning, or enablement wearing a platform badge. The test I keep running: does this manage complexity for application developers, or merely move it somewhere else?\n\n## Statement\n\nMy operating model holds every internal platform to four pillars.\n\n**Pillar 1 — Curated product approach:**\n\n- **Known customers, real problems.** The platform's application developers are identified, their recurring problems understood, and priorities follow customer needs rather than purely technical preferences.\n- **An opinion about scope.** What is in and what is out is explicit. Technologies and workflows exposed to developers are intentionally curated.\n- **Paved paths, with exits.** Paved paths cover most recurring needs without chasing every edge case — and developers can leave the path when necessary. Common capability gaps justify new \"railway\" platforms, reusable across multiple teams.\n- **Customer-outcome success.** Feedback is collected regularly; success is measured by developer outcomes, not only platform delivery metrics.\n\n**Pillar 2 — Software-based abstractions:**\n\n- **Real software, real engineers.** The platform contains software built by platform engineers with strong software skills — not just documentation and infrastructure configuration.\n- **Abstractions that earn their keep.** APIs simplify interactions with underlying OSS, cloud, vendor, and internal systems — but nothing is hidden unless the abstraction genuinely improves productivity, and primitives stay reachable where the abstraction would add friction.\n- **Owned lifecycle.** Thick clients come with a plan for versioning, observability, and upgrades; OSS is customized when needed rather than treated as untouchable.\n- **Metadata as a first-class capability.** The platform can answer who owns a resource, who uses it, what access it has, who pays for it, what depends on it, and what a change would break — collected automatically, not hand-curated.\n\n**Pillar 3 — A broad base of application developers:**\n\n- **Many teams, many skill levels, self-service.** Common workflows are self-service with easy interfaces (UI, CLI, APIs, SDKs, configuration-as-code); new users onboard without manual platform-team work; advanced users still reach lower-level building blocks.\n- **Observable and guarded.** Developers can diagnose their own problems, tell platform issues from application issues, and are protected by guardrails with safe defaults that do not needlessly block them.\n- **Economics that improve with scale.** Shared components are deliberately multitenant where that pays; the platform gets cheaper and easier to operate as adoption grows.\n\n**Pillar 4 — Operated as a foundation:**\n\n- **Dependable for production.** Application teams can put important workloads on it; the platform team owns the operational experience of the complete offering — platform software, cloud services, OSS, vendor systems, internal dependencies.\n- **Full operational discipline.** Clear incident ownership, monitoring, SLOs, capacity management, runbooks, and platform engineers on call — more than provisioning and handing over, more than thin frameworks that leave operations to developers.\n- **Support as product feedback.** Teams know how to get support, and support questions feed the roadmap.\n\n## How to Read This\n\nThis journal is my platform operating model, one record per source checklist. This record is grounded in the four-pillars chapter of Camille Fournier and Ian Nowland's *Platform Engineering: A Guide for Technical, Product, and People Leaders* (O'Reilly, 2024) — the chapter that defines what a real platform is made of, distilled here into **the qualification test I apply before anything gets called, funded, or staffed as a platform**. The runnable version — all four pillars, the supporting quality dimensions, and the quick scorecard — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**The pillars are a conjunction, not a menu.** Most failed platforms I have seen were strong on one pillar and absent on the others: a beautifully curated catalog nobody could self-serve, a powerful abstraction operated by nobody, a widely adopted toolset with no product opinion. The chapter's sharpest claim is that **all four must hold at once** — product, software, breadth, operations — or the offering degrades into something else: tooling, provisioning, or enablement. Naming that honestly matters, because each of those is funded and staffed differently than a platform.\n\n![Diagram of a platform deck carrying application squares on four labeled pillars, with a small inset showing the deck tilting when one pillar is missing.](assets/images/four-pillars/four-pillars-structure.jpeg)\n**Figure 1:** *The structural test: all four pillars carry the deck at once — remove any one and the offering degrades into tooling, provisioning, or enablement.*\n\n\n**Curation is what makes the product a product.** A platform that exposes every option is an inventory, not an offering. The paved path is the product: an opinionated route through the recurring cases, with the explicit freedom to step off when a real need demands it. That last clause is load-bearing — **a paved path without an exit is a cage**, and teams in cages dig tunnels. Equally, the platform must know when a common gap justifies a new \"railway\" — a capability worth building precisely because many teams will ride it.\n\n**Software is the difference between managing complexity and documenting it.** Wikis, templates, and configuration repositories relocate complexity; only software absorbs it. That is why platform teams need genuine software engineers, and why the abstraction bar cuts both ways: **do not hide a system unless hiding it genuinely improves productivity**, and keep the primitives reachable when the abstraction would add friction. An abstraction that merely renames what lies beneath adds a layer of indirection to learn on top of everything it failed to hide. Metadata is part of this pillar for a reason — ownership, usage, dependencies, and migration impact are what make every future change cheap, and they only stay true when collected automatically.\n\n**Breadth is what turns a platform into leverage.** A system built for one or two teams is a shared dependency, not a platform. Serving a broad base forces the disciplines that create leverage: self-service (or the platform team becomes the bottleneck it was meant to remove), user observability (or every developer question becomes a support ticket), guardrails with safe defaults (or every team relearns the same security and cost mistakes), and deliberate multitenancy (or costs scale linearly with adoption). The economic signature of a real platform is that **each new adopting team costs the platform team less than the last**.\n\n![Line chart contrasting rising hand-held cost per team with a self-service platform curve that bends downward as adoption grows.](assets/images/four-pillars/breadth-economics.jpeg)\n**Figure 2:** *The economic signature of breadth: with self-service, guardrails, and deliberate multitenancy, each new adopting team costs the platform team less than the last.*\n\n\n**Operations is the pillar that makes the other three credible.** Application teams bet production workloads on the platform only if someone demonstrably owns what happens when it breaks — all the way down through cloud, OSS, and vendor layers, because **an outage in a dependency you chose is still your outage** as far as your customers are concerned. Provision-and-hand-over teams and thin-framework teams both fail this pillar the same way: operational reality lands on application teams, who conclude, correctly, that the platform is decorative. And support belongs inside this pillar — every support question is product feedback about where the platform is confusing, incomplete, or wrong.\n\n**The scorecard keeps the assessment honest.** Four questions, scored 0–2, resist both grade inflation and platform-washing: it takes 7–8 to claim strong platform-engineering characteristics, and 0–3 means the honest name is tooling or provisioning. I use it less as a maturity model than as **a periodic truth serum** — cheap to run, hard to argue with.\n\n![Diagram of four pillar rows scored zero to two feeding a zero-to-eight gauge with bands labeled tooling, partial, and platform.](assets/images/four-pillars/scorecard-bands.jpeg)\n**Figure 3:** *The truth serum: four questions scored 0–2 — a total of 7–8 supports the platform claim, and 0–3 means the honest name is tooling or provisioning.*\n\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| A platform must stand on all four pillars at once. | Scoring high on one pillar earns the name — one strong pillar with three missing is tooling. |\n| Curate paved paths that cover most recurring needs. | Cover every edge case — and never let anyone off the path. Developers can leave when there is a real need. |\n| Build software abstractions with strong engineers. | Wrap everything in an API — nothing is hidden unless hiding it genuinely improves productivity. |\n| Serve many teams through self-service and guardrails. | Every capability must be shared and multitenant — shared versus per-application is a deliberate choice, made case by case. |\n| The platform team owns operations of the complete offering, vendors and OSS included. | Application teams are off the hook — they still run their own applications on top of it. |\n| Build an internal developer portal if it solves a validated problem. | An IDP is mandatory — a portal built for fashion is another interface to maintain, not a platform. |\n| Score the four pillars periodically and name the result honestly. | The scorecard is a one-time gate — it is a recurring truth check as the platform and organization evolve. |\n\nConcretely: every offering my organization calls a platform has a current four-pillar score its lead can defend; anything scoring 0–3 gets renamed to what it is — tooling, provisioning, or enablement — and either funded as what it is or given an explicit plan to earn the missing pillars. **Names are cheap; pillars are not.**\n\n## Anti-Patterns\n\n- **The platform badge.** Renaming an infrastructure or tooling team \"platform\" without changing what it builds, how it is operated, or who it serves — the name changes, the pillars do not.\n- **The inventory platform.** Exposing every technology and option with no scope opinion — an offering with no curation is a catalog of the swamp.\n- **The paved path with no exit.** Treating any departure from the golden path as a violation, until teams stop asking and start tunneling.\n- **The documentation platform.** Wikis, templates, and config repos presented as a platform — complexity relocated and annotated, never absorbed.\n- **The abstraction tax.** Forcing every dependency through a platform API without clear benefit, coupling teams to a wrapper that hides nothing and slows everything.\n- **The single-tenant \"platform\".** Built for one or two teams, unable to onboard anyone without hand-holding — a shared dependency drawing a platform budget.\n- **Provision and vanish.** Handing over infrastructure, thin frameworks, or UIs while operational reality lands on application teams — pillar four missing, and with it the trust that makes the rest matter.\n- **The fashionable portal.** Standing up an IDP because it is standard, producing a disconnected catalog that adds an interface instead of removing work.\n\n## Related Records\n\n- [What Is Platform Engineering](what-is-platform-engineering.html) — why platform engineering exists at all; this record defines what qualifies once you build it.\n- [Platform as a Product](platform-as-a-product.html) — pillar 1 expanded into the full product operating mechanics.\n- [Operating Platforms](operating-platforms.html) — pillar 4 expanded into the full operating discipline: reliability, on-call, and support.\n- [Building Great Platform Teams](building-platform-teams.html) — the staffing model that makes pillar 2's software-engineering bar achievable.\n- [What Platform Success Looks Like](platform-success.html) — what success looks like once all four pillars stand; the outcome side of this record's structural test.\n\n## Scope and Revisiting\n\nThis record is `draft`. It applies to every internal offering my organization funds or labels as a platform, everywhere I am the accountable executive. I revisit it if a four-pillar scorecard round shows scores drifting down while the platform label persists, if platform-team cost starts scaling linearly with adopting teams (the breadth pillar failing economically), or if application teams begin routinely operating around the platform — running their own copies of what the platform claims to own — which is the operations pillar failing in public.\n\n## Authoritative References\n\n- Camille Fournier and Ian Nowland, *Platform Engineering: A Guide for Technical, Product, and People Leaders* (O'Reilly, 2024) — the four-pillars chapter, whose checklist and scorecard this record distills.\n"}]}, {"key": "summary", "label": "TL;DR", "meta": {"timetoread": "2 min read"}, "blocks": [{"type": "markdown", "content": "Before I call anything in my organization a platform, it has to stand on **four pillars at once**: a curated product with paved paths, software abstractions that genuinely manage complexity, self-service breadth across many application teams, and operation as a reliable foundation. Miss a pillar and what you have is tooling, provisioning, or enablement wearing a platform badge — and the running test is whether the offering manages complexity for application developers or merely moves it somewhere else.\n\n**What changes**\n\n* **Pillar 1 — curated product.** The platform has identified customers, priorities driven by their needs, an explicit opinion about scope, and paved paths covering most recurring needs — with the freedom to leave the path, and new \"railway\" capabilities built where common gaps justify them. Success is measured by customer outcomes, not platform delivery metrics.\n* **Pillar 2 — software-based abstractions.** Real software built by real engineers, not documentation stapled to configuration. APIs simplify underlying systems, but nothing is hidden unless the abstraction genuinely improves productivity; thick clients come with a lifecycle plan, and metadata — ownership, usage, access, cost, dependencies, migration impact — is collected automatically.\n* **Pillar 3 — a broad developer base.** Many teams and skill levels served through self-service onboarding, multiple interfaces (UI, CLI, API, SDK, config-as-code), user-facing observability, guardrails with safe defaults, and deliberate multitenancy — so each new adopting team costs the platform team less than the last.\n* **Pillar 4 — operated as a foundation.** The platform team owns the operational experience of the complete offering, down through cloud, OSS, and vendor layers: incident ownership, SLOs, capacity, runbooks, on-call — and support treated as product feedback.\n* **A standing truth check.** Every offering we call a platform carries a current four-pillar score (0–2 per pillar): 7–8 supports the platform claim; 0–3 means the honest name is tooling or provisioning — and it gets renamed, refunded as what it is, or given a plan to earn the missing pillars.\n\n**What it costs**\n\n* Honest naming has consequences: things we have been calling platforms may turn out to be tooling or enablement, which are funded and staffed differently.\n* Pillar 4 is expensive — owning the operational experience of dependencies you chose, not just the software you wrote.\n* The scorecard recurs; it is a periodic truth serum, not a one-time gate.\n\n**What we are not doing**\n\n* Not the case for platform engineering itself — that is [What Is Platform Engineering](what-is-platform-engineering.html).\n* Not the full product or operating mechanics — pillar 1 expands in [Platform as a Product](platform-as-a-product.html), pillar 4 in [Operating Platforms](operating-platforms.html), and staffing lives in [Building Great Platform Teams](building-platform-teams.html).\n* Not mandating an internal developer portal — an IDP is built only if it solves a validated problem.\n\n*The Article tab carries the rationale and anti-patterns; the Checklist tab carries all four pillars, the supporting quality dimensions, and the scorecard. Grounded in Fournier and Nowland's* Platform Engineering *(O'Reilly, 2024).*\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "6 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Curated Product Approach\n\n- [ ] We treat the platform as a product, not just a collection of infrastructure/tools\n- [ ] We have clearly identified the platform's customers/application developers\n- [ ] We understand the recurring problems those customers need solved\n- [ ] Platform priorities are based on customer needs rather than purely technical preferences\n- [ ] We have an opinion about what is in scope and what is not\n- [ ] We intentionally curate the technologies and workflows exposed to developers\n- [ ] We provide paved paths for common use cases\n- [ ] Paved paths cover most recurring developer needs without trying to address every edge case\n- [ ] Developers can leave the paved path when necessary\n- [ ] We identify common capability gaps that justify building new \"railway\" platforms\n- [ ] New platform capabilities are reusable across multiple application teams\n- [ ] We regularly collect developer feedback and adjust the platform accordingly\n- [ ] Success is measured by developer/customer outcomes, not only platform delivery metrics\n\n## 2. Software-Based Abstractions\n\n- [ ] The platform contains software built by platform engineers, not just documentation and infrastructure configuration\n- [ ] Platform engineers include people with strong software engineering skills\n- [ ] We build abstractions over underlying OSS, cloud, vendor, and internal systems\n- [ ] The platform has a service/API layer where appropriate\n- [ ] APIs simplify interactions between application teams and underlying systems\n- [ ] We do not hide underlying systems unless the abstraction genuinely improves developer productivity\n- [ ] Developers can access underlying primitives when the abstraction would create unnecessary friction\n- [ ] We use thick clients/libraries when client-side logic provides meaningful value\n- [ ] Client libraries have a plan for versioning, observability, debugging, and upgrades\n- [ ] We customize OSS where necessary rather than treating upstream products as untouchable\n- [ ] We maintain integrations and extensions required to provide a cohesive platform experience\n- [ ] We maintain metadata describing platform resources and their usage\n- [ ] Metadata can answer questions such as:\n  - [ ] Who owns this resource/service?\n  - [ ] Who is using it?\n  - [ ] What access does it have?\n  - [ ] Which team should be charged for its usage?\n  - [ ] What dependencies does it have?\n  - [ ] What migration impact would changing it create?\n- [ ] We have an appropriate metadata mechanism, such as:\n  - [ ] Cloud/resource tags\n  - [ ] API/schema registry\n  - [ ] Service catalog\n  - [ ] Internal developer portal\n- [ ] Metadata collection is automated wherever possible rather than relying on engineers to manually curate it\n\n## 3. Serve a Broad Base of Application Developers\n\n- [ ] The platform is intended for many application teams, not only one or two teams\n- [ ] We design for different developer skill levels and use cases\n- [ ] Common workflows are self-service\n- [ ] New users can onboard without routine manual work from the platform team\n- [ ] Users can provision and configure platform capabilities themselves\n- [ ] Common workflows have easy-to-use interfaces\n- [ ] Advanced users can still access lower-level building blocks when necessary\n- [ ] We provide appropriate interfaces such as:\n  - [ ] UI\n  - [ ] CLI\n  - [ ] APIs\n  - [ ] Libraries/SDKs\n  - [ ] Configuration-as-code\n- [ ] Developers have enough user observability to diagnose their own problems\n- [ ] Developers can tell when they are using the platform incorrectly\n- [ ] Developers can distinguish application problems from platform problems\n- [ ] Guardrails prevent common security, compliance, reliability, and cost mistakes\n- [ ] Guardrails provide safe defaults without unnecessarily blocking developers\n- [ ] The platform supports multiple applications efficiently\n- [ ] Shared components are multitenant which creates meaningful efficiency\n- [ ] We deliberately choose between shared and per-application components rather than forcing everything into one model\n- [ ] Tenant isolation, reliability, capacity, and security have been considered\n- [ ] The platform becomes cheaper/easier to operate as adoption grows rather than requiring proportional increases in platform-team effort\n\n## 4. Operate the Platform as a Foundation\n\n- [ ] Application teams can depend on the platform for important production workloads\n- [ ] The platform is stable enough to function as a foundation for the business\n- [ ] The platform team owns the operational experience of the complete offering\n- [ ] We do not push unnecessary operational complexity onto application teams\n- [ ] The platform team takes responsibility for the underlying:\n  - [ ] Platform software\n  - [ ] Cloud services\n  - [ ] OSS systems\n  - [ ] Vendor systems\n  - [ ] Internal dependencies\n- [ ] The team does more than provision infrastructure and hand it over\n- [ ] The team does more than provide thin frameworks or UIs while leaving all operations to developers\n- [ ] Production incidents have clear ownership\n- [ ] Monitoring and alerting exist for critical platform components\n- [ ] SLOs/SLIs or equivalent reliability expectations are defined\n- [ ] Capacity and scalability are actively managed\n- [ ] Backup/recovery requirements are understood where applicable\n- [ ] Operational runbooks exist for important failure modes\n- [ ] Platform engineers participate in operational/on-call responsibilities where appropriate\n- [ ] We routinely test or review operational procedures\n- [ ] We actively investigate anomalies and \"unknown unknowns\"\n- [ ] User support is treated as part of platform engineering\n- [ ] Application teams know how to obtain platform support\n- [ ] Support questions are used as product feedback\n- [ ] The team maintains strong customer empathy while handling incidents and support requests\n\n## 5. Architecture Quality\n\n- [ ] Applications interact with a coherent platform rather than integrating with every underlying system independently\n- [ ] Platform abstractions remove meaningful complexity rather than merely relocating it\n- [ ] The architecture does not force every dependency through a platform API without a clear benefit\n- [ ] The architecture avoids unnecessary coupling between application teams and underlying vendors/OSS\n- [ ] Platform dependencies can be upgraded or migrated without requiring every application team to become an expert\n- [ ] Common functionality is centralized when that improves reliability or efficiency\n- [ ] Application-specific functionality remains outside the platform when centralizing it provides little benefit\n\n## 6. Developer Experience\n\n- [ ] Developers have a clear starting point for using the platform\n- [ ] Documentation is easy to discover\n- [ ] Common tasks can be completed without contacting the platform team\n- [ ] Error messages provide users with enough information to resolve problems\n- [ ] Platform workflows fit naturally into developers' existing working environment\n- [ ] The platform minimizes context switching\n- [ ] Developers do not need deep knowledge of every underlying system\n- [ ] The platform reduces cognitive load\n- [ ] The developer experience is tested with actual platform users\n- [ ] We track adoption, friction, abandonment, or other indicators of developer experience\n\n## 7. Internal Developer Portal — Only If Needed\n\n- [ ] We have validated that developers need a centralized portal/catalog\n- [ ] An IDP solves an actual discovery, ownership, self-service, or documentation problem\n- [ ] We are not creating an IDP simply because it is considered fashionable or standard\n- [ ] If we have an IDP, it integrates platform capabilities rather than becoming a disconnected catalog\n- [ ] Platform teams can plug their offerings into a consistent user experience\n- [ ] The portal reduces work rather than adding another interface users must maintain\n\n## 8. Cost, Security, and Governance\n\n- [ ] Platform resource ownership is identifiable\n- [ ] Platform usage can be attributed to the appropriate team/product\n- [ ] Access is limited to what services actually require\n- [ ] Default configurations meet organizational security requirements\n- [ ] Compliance requirements are embedded into paved paths where practical\n- [ ] Cost-efficient defaults are provided\n- [ ] Developers can understand the cost implications of major platform choices\n- [ ] Platform-level controls prevent high-impact mistakes without creating unnecessary bureaucracy\n\n## 9. AI / ML Platform Considerations\n\nIf the platform supports AI workloads:\n\n- [ ] Model-development tooling fits into users' normal working environment\n- [ ] We support the lifecycle of building, training, deploying, and operating models where needed\n- [ ] Compute and storage efficiency are actively optimized\n- [ ] Workload placement helps control infrastructure cost\n- [ ] Model/data access controls are clearly defined\n- [ ] Data provenance is available\n- [ ] We can determine who has access to which data\n- [ ] Model outcomes can be explained to the extent required by the business/regulators\n- [ ] Platform telemetry provides enough data to apply AI/ML to operations\n- [ ] LLM tooling is curated rather than exposing every provider/tool independently\n- [ ] Failure handling, orchestration, debugging, and efficiency are considered part of the AI platform\n\n## 10. Quick Four-Pillar Scorecard\n\nFor a fast assessment, score each statement 0 = No, 1 = Partly, 2 = Yes:\n\n| Pillar | Question | Score |\n| --- | --- | --- |\n| **Product** | Are we deliberately curating an offering around developer/customer needs? | 0 / 1 / 2 |\n| **Development** *(software abstractions)* | Are we building software abstractions that genuinely manage complexity? | 0 / 1 / 2 |\n| **Breadth** | Can a broad range of application teams consume it effectively through self-service? | 0 / 1 / 2 |\n| **Operations** | Do we operate and support it as a reliable foundation for the business? | 0 / 1 / 2 |\n\n**Interpretation:** **7–8:** strong platform-engineering characteristics; **4–6:** meaningful platform capability, but with important gaps; **0–3:** likely closer to tooling, provisioning, or infrastructure enablement than a mature platform.\n\nThe key test running through the chapter is: **Does the platform actually manage complexity for application developers, or does it merely move that complexity somewhere else?**\n"}]}, {"key": "dialog", "label": "Conversation", "meta": {"timetoread": "8 min listen"}, "blocks": [{"type": "markdown", "content": "## The Name Everyone Wants\n\n**Ben:** Blunt version first. Every infrastructure team I know renamed itself \"platform\" in the last few years. Why does an operating model need a record policing a word?\n\n**Ana:** Because the word carries a budget. Tooling, provisioning, and platform are funded and staffed differently — a platform claim buys headcount, product roadmap, on-call investment. The record names that anti-pattern first: the platform badge. Rename the team without changing what it builds, how it's operated, or who it serves, and the name changes while the pillars don't. So before anything gets called, funded, or staffed as a platform, it has to pass a structural test: four pillars, all at once.\n\n**Ben:** Give me the four in one breath.\n\n**Ana:** A curated product with paved paths, shaped by customer needs. Software abstractions — real software by real engineers — that genuinely manage complexity. A broad base of application developers served self-service. And operation as a reliable foundation, with the platform team owning the operational experience all the way down. Miss one, and what you have is tooling, provisioning, or enablement wearing a platform badge.\n\n**Ben:** Why the all-four insistence? A maturity ladder would be kinder — \"you're a level-two platform, keep climbing.\"\n\n**Ana:** Kinder and wrong — that framing was explicitly considered and rejected. The chapter's sharpest claim is that the pillars are a conjunction, not a menu. Most failed platforms were strong on one pillar and absent on the others: a beautifully curated catalog nobody could self-serve, a powerful abstraction operated by nobody, a widely adopted toolset with no product opinion. A ladder tells that team they're partway up. The truth is they're something else entirely — and each something-else is funded differently than a platform.\n\n## Curation and the Paved Path\n\n**Ben:** Start with pillar one. \"Curated product\" — in practice, doesn't curation mean the platform team imposing its taste?\n\n**Ana:** Not if the customers are real. Pillar one starts with identified customers and their recurring problems, and priorities follow customer needs rather than technical preferences. The curation is an opinion about scope — what's in, what's out, stated explicitly. A platform that exposes every option is an inventory, not an offering. The record calls that the inventory platform: a catalog of the swamp.\n\n**Ben:** And the paved path. Here's the practitioner objection: golden paths become golden cages. The moment my use case is unusual, I'm negotiating with a committee.\n\n**Ana:** The record agrees with you, which surprises people. The clause is load-bearing: paved paths cover most recurring needs without chasing every edge case — and developers can leave the path when necessary. A paved path without an exit is a cage, and teams in cages dig tunnels. The other half of the pillar is knowing when a common gap justifies a new \"railway\" — a capability worth building precisely because many teams will ride it.\n\n**Ben:** How do you score whether pillar one is actually holding?\n\n**Ana:** Customer outcomes, not platform delivery metrics. Feedback collected regularly, success measured by what developers achieved — not by how many features the platform shipped.\n\n## Software, Not Documentation\n\n**Ben:** Pillar two. Plenty of \"platforms\" are a wiki, some templates, and a Terraform repo. Why isn't that enough?\n\n**Ana:** Because wikis, templates, and configuration repositories relocate complexity; only software absorbs it. That's the documentation platform anti-pattern — complexity relocated and annotated, never absorbed. Pillar two demands real software built by platform engineers with strong software skills, with APIs that simplify the underlying OSS, cloud, and vendor systems.\n\n**Ben:** But the counter-burn is real too. I've used platforms where every dependency was forced through a platform API that hid nothing and slowed everything.\n\n**Ana:** The abstraction tax — also on the anti-pattern list. The bar cuts both ways: do not hide a system unless hiding it genuinely improves productivity, and keep primitives reachable where the abstraction would add friction. An abstraction that merely renames what lies beneath adds a layer of indirection on top of everything it failed to hide. And the pillar includes the unglamorous parts: thick clients need a plan for versioning, observability, and upgrades; OSS gets customized when needed rather than treated as untouchable.\n\n**Ben:** Metadata is in this pillar too, which seems oddly bureaucratic next to \"real software.\"\n\n**Ana:** It's there for a reason. Who owns this resource, who uses it, what access it has, who pays, what depends on it, what a change would break — that's what makes every future change cheap. And it only stays true when collected automatically. Hand-curated metadata is fiction with a schema.\n\n## Breadth and the Foundation\n\n**Ben:** Pillar three. Why does breadth matter structurally? A great system serving two teams is still a great system.\n\n**Ana:** A great system serving two teams is a shared dependency, not a platform — the record calls the failure the single-tenant \"platform\": unable to onboard anyone without hand-holding, drawing a platform budget. Breadth forces the disciplines that create leverage. Self-service, or the platform team becomes the bottleneck it was meant to remove. User observability, so developers can tell platform issues from application issues — or every question becomes a support ticket. Guardrails with safe defaults, or every team relearns the same security and cost mistakes. And deliberate multitenancy where it pays.\n\n**Ben:** \"Where it pays\" — so not everything shared?\n\n**Ana:** Case by case, deliberately. But the economic signature is non-negotiable: each new adopting team costs the platform team less than the last. If cost scales linearly with adoption, the breadth pillar is failing economically — that's one of the record's named revisit triggers.\n\n**Ben:** Pillar four, then. Teams already do \"you build it, you run it.\" Why does the platform team own operations at all?\n\n**Ana:** Application teams still run their own applications — the record is explicit about that. What the platform team owns is the operational experience of the complete offering: platform software, cloud services, OSS, vendor systems. An outage in a dependency you chose is still your outage as far as your customers are concerned. And it's the pillar that makes the other three credible — nobody bets production workloads on a foundation where it's unclear who owns the breakage. Incident ownership, SLOs, capacity, runbooks, engineers on call. Provision-and-vanish teams and thin-framework teams fail it the same way: operational reality lands on application teams, who conclude, correctly, that the platform is decorative.\n\n**Ben:** And support?\n\n**Ana:** Inside the pillar, deliberately. Every support question is product feedback about where the platform is confusing, incomplete, or wrong.\n\n## The Scorecard, and What This Isn't\n\n**Ben:** The scorecard. Four questions, zero to two each. Isn't self-assessment exactly where grade inflation lives?\n\n**Ana:** The bands are what resist it. It takes 7–8 out of 8 to claim strong platform-engineering characteristics; 0–3 means the honest name is tooling or provisioning. That's hard to argue with, and it's cheap to run — which is why the record uses it as a periodic truth serum, not a one-time gate or a maturity model. Scores drifting down while the platform label persists is a named revisit condition. The concrete commitment: every offering we call a platform has a current score its lead can defend, and anything at 0–3 gets renamed to what it is — then funded as what it is, or given an explicit plan to earn the missing pillars. Names are cheap; pillars are not.\n\n**Ben:** One more practitioner trap: does passing the test require an internal developer portal? Because the industry default is \"buy a portal, call it a platform.\"\n\n**Ana:** No — and the record flags the fashionable portal as an anti-pattern. Build an IDP if it solves a validated problem; a portal built for fashion is another interface to maintain, a disconnected catalog that adds an interface instead of removing work. The checklist carries the supporting quality dimensions too — architecture quality, developer experience, cost, security, governance, AI/ML considerations — but none of them substitute for the four pillars.\n\n**Ben:** Close it out. What is this record explicitly not doing?\n\n**Ana:** It's the qualification test, not the whole model. Why platform engineering exists at all is [What Is Platform Engineering](what-is-platform-engineering.html). Pillar one expands into full product mechanics in [Platform as a Product](platform-as-a-product.html); pillar four into operating discipline in [Operating Platforms](operating-platforms.html); the staffing that makes pillar two's engineering bar achievable is [Building Great Platform Teams](building-platform-teams.html); and the outcome side — what success looks like once all four stand — is [What Platform Success Looks Like](platform-success.html). This record answers one question: does the thing you're about to call a platform actually manage complexity for application developers, or merely move it somewhere else?\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why nothing gets called a platform until it stands on all four pillars — in nine panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. KAI: a hands-on platform engineering lead, short dark hair, gray zip-up hoodie with a small gear pin, laptop covered in infrastructure stickers under one arm, a coil of cable slung over the shoulder.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and teal accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Kai nails a Platform sign onto a rickety tool shed while Vera asks if it is the same shed.](assets/images/four-pillars/comic-01-the-platform-badge.jpeg)\n**Panel 1:** *The hook: the platform badge — renaming a tooling team 'platform' changes the sign, not what it builds, runs, or serves.*\n\n![Comic panel: a slab teeters on one pillar next to three broken stumps while Kai strains to hold it and developers slide off.](assets/images/four-pillars/comic-02-one-pillar-teeters.jpeg)\n**Panel 2:** *The problem: most failed platforms are strong on one pillar and absent on the rest — a curated catalog nobody can self-serve, an abstraction nobody operates.*\n\n![Comic panel: a huge stack of wiki binders and config folders with a bow while a developer drowns in pages and Vera shakes her head.](assets/images/four-pillars/comic-03-the-documentation-platform.jpeg)\n**Panel 3:** *The wrong way: the documentation platform — wikis, templates, and config repos relocate and annotate complexity; only real software absorbs it.*\n\n![Comic panel: Vera presents a slab standing on four pillars labeled Product, Software, Breadth, Operations while Kai takes notes.](assets/images/four-pillars/comic-04-four-pillars-at-once.jpeg)\n**Panel 4:** *The principle: curated product, software abstractions, a broad developer base, operated as a foundation — a conjunction, not a menu.*\n\n![Comic panel: developers ride a paved road while one takes a marked exit ramp onto a dirt trail, waved on by Kai.](assets/images/four-pillars/comic-05-paved-path-with-exits.jpeg)\n**Panel 5:** *Pillar one in action: the paved path is the product — and a paved path without an exit is a cage, so the exit is marked, not forbidden.*\n\n![Comic panel: developer teams onboard through self-service kiosks labeled UI, CLI, API while Kai holds a chart with a declining cost line.](assets/images/four-pillars/comic-06-self-service-scale.jpeg)\n**Panel 6:** *Pillar three in action: self-service onboarding, multiple interfaces, guardrails — and economics where each new adopting team costs less than the last.*\n\n![Comic panel: cutaway of developers working on a deck while Kai with an on-call headset fixes a sparking machine among layers labeled Cloud, OSS, Vendor.](assets/images/four-pillars/comic-07-owning-the-basement.jpeg)\n**Panel 7:** *Pillar four in action: the platform team owns what breaks, all the way down through cloud, OSS, and vendor layers — that ownership is what makes the other pillars credible.*\n\n![Comic panel: Vera shows Kai a four-row scorecard with the total circled while a sign behind them is repainted from Platform to Tooling.](assets/images/four-pillars/comic-08-the-truth-serum.jpeg)\n**Panel 8:** *The cost: the scorecard is a truth serum — four questions, scored 0–2; score low and the honest move is to rename the offering and fund it as what it is.*\n\n![Comic panel: a balance scale contrasts complexity absorbed into a platform block versus dumped on a developer's back; Vera points at the first.](assets/images/four-pillars/comic-09-the-running-test.jpeg)\n**Panel 9:** *The closer: the test that never stops running — does the platform manage complexity for application developers, or merely move it somewhere else?*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
