<script id="data" type="application/json">{"meta": {"id": "PLT-REF-GROUNDWORK", "status": "draft:gray", "title": "Groundwork: Repositories, Secrets, and Releases", "date": "2026-08-20", "author": "Željko Obrenović", "permalink": "groundwork", "timetoread": "8 min", "excerpt": "Before a platform team in my organization builds anything for anyone else, it lays its own foundation — and that foundation is code. Repositories are provisioned by infrastructure-as-code from one configuration file that is the source of truth; secrets live in a vault and never touch source control; onboarding and offboarding are reviewed configuration diffs; commits are conventional, signed, and enforced on administrators too; and delivery is trunk-based, with pushes triggering validation and annotated tags triggering a gated release. The test I hold the groundwork to: a second platform engineer can reproduce the entire foundation from the repository alone.", "tags": "platform engineering, infrastructure as code, secrets management, repositories, trunk-based development, release engineering, signed commits, onboarding, reference implementation", "icon": "assets/icons/groundwork.png", "logo": "assets/images/groundwork/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["platform engineering", "infrastructure as code", "secrets management", "repositories", "trunk-based development", "release engineering", "signed commits", "onboarding", "reference implementation"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: Before my platform builds anything for anyone else, it lays its own groundwork — and the groundwork is code. **Repositories are provisioned by infrastructure-as-code from one configuration file** that is the source of truth; **secrets live in a vault and never touch source control**; **team onboarding and offboarding are reviewed configuration diffs**, not favors; **commits are conventional and signed**, validated by hooks and branch protection that binds administrators, with signed commits required on every branch; and **delivery is trunk-based** — pushes trigger validation, annotated tags trigger a release workflow that runs tests, validates configuration, and waits for an approval gate before anything is applied. The test I hold the build to: **a second platform engineer can reproduce the entire foundation from the repository alone** — and an accidental destroy cannot take it down.\n\n## Statement\n\nWhen a platform team in my organization starts a platform build, this is the groundwork I hold it to, end to end.\n\n**The foundation is a product from day zero.**\n\n- **Known stakeholders, short loops.** The developers, SREs, security and compliance teams, and product managers who will use or influence the platform are identified before the first line of IaC, and feedback loops with them are short.\n- **Metrics before machinery.** Adoption, reliability, delivery performance, and developer satisfaction have defined metrics from the start.\n- **Golden paths and embedded guardrails.** Supported golden paths and sensible defaults exist from the beginning, and security, governance, testing, and compliance are embedded — not scheduled for later.\n\n**The tooling baseline is deliberate.**\n\n- Infrastructure-as-code in a general-purpose language, a secrets vault with a CLI, API-driven source control, CI/CD with a local runner, local Kubernetes tooling ready for the next stage — and a quality toolchain (tests, linting, type checking, security scanning) that holds platform code to the same bar as product code.\n\n**Repository architecture is decided, not accreted.**\n\n- **Monorepo versus polyrepo is an explicit decision**, made against the platform's identified domain boundaries; repositories or pipelines are separated by domain where that pays.\n- **Conventions are set once**: repository naming, branch naming, access roles, repository policies and governance controls — with security and compliance guardrails spanning all platform domains.\n- **The administration project is reproducible.** One platform-administration project with a standard structure — configuration, modules, scripts, secrets setup, tests — that another platform engineer can reproduce.\n\n**Secrets never touch source control.**\n\n- Example files are committed; real values are gitignored. Credentials live in the vault, put there by a scripted, idempotent flow — authenticate, unlock, upsert, sync, lock — and verified there.\n\n**Repositories and membership are configuration.**\n\n- **One configuration file is the source of truth** for managed repositories; repositories are created programmatically through preview → review → apply, with visibility set by configuration and delete protection proven against an accidental destroy.\n- **Onboarding is a diff; offboarding is a diff.** Organization members are defined in configuration — name, username, role, email — and joining, leaving, and role changes are applied and verified through the same pipeline. Administrative access goes through a platform service account or group, not individual engineers.\n\n![Diagram of one configuration file flowing through preview, review, and apply stages into provisioned repositories and team membership.](assets/images/groundwork/config-source-of-truth-pipeline.jpeg)\n**Figure 1:** *One configuration file is the source of truth: repositories and membership are provisioned through preview, review, and apply — never by hand.*\n\n**Commits are conventional, signed, and enforced.**\n\n- Commit-message structure and allowed types are defined and validated by a distributed commit-msg hook; pre-commit checks catch fast failures; changelog and version automation is planned in from the start.\n- Branch protection and merge requirements are enforced through IaC; **signed commits are required on every branch, administrators included**, and both the rejection of unsigned commits and the success of signed ones are verified.\n\n**Delivery is trunk-based; releases are tags behind a gate.**\n\n- Changes integrate through main. Pushes trigger validation; annotated tags trigger the release workflow — preview, automated tests, configuration validation, an approval gate, and only then apply. Rollback triggers are considered, and rollback mechanisms are tested regularly, not assumed. The groundwork ends with a first tagged release, verified end to end.\n\n## How to Read This\n\nThis record opens the **Reference Implementation** section of the journal — the how-it-concretely-looks companion to the conceptual records. Where [The Four Pillars of Platform Engineering](four-pillars.html) defines what qualifies as a platform, these records fix the shape of the build when a team in my organization constructs one capability end to end. This one is grounded in the Groundwork chapter of *The Platform Engineer's Handbook*, the first chapter of a build that ends with a working internal developer platform. **The named tools are the handbook's reference stack, not a mandate** — my commitments are stated at the capability level, and the Reference Stack table below names the property each tool stands for. The full working checklist — every step, exercise, and the completion check — lives in the **Checklist** tab; the **TL;DR** tab carries the management summary and the **Conversation** tab the dialog.\n\n## The Reference Stack\n\n| Role | Reference tool | The property that matters |\n| --- | --- | --- |\n| Infrastructure-as-code | Pulumi with Python and `uv` | Infrastructure declared in a general-purpose language, testable with the same toolchain as any other code |\n| Secrets vault | Bitwarden + CLI | Secrets scripted in and out of a vault; source control never sees a real value |\n| Source control | GitHub | Repositories, membership, and policies manageable through an API — so IaC can own them |\n| CI/CD | CircleCI + local runner | Push and tag filters, shared secret contexts, approval gates |\n| Local Kubernetes | Kind + Helm | Ready for [Platform Creation: Environments, GitOps, and the Mesh](platform-creation.html); nothing cluster-shaped is needed yet |\n| Quality toolchain | pytest, ruff, mypy, bandit | Platform code held to the same test, lint, type, and security bar as product code |\n\n## Rationale\n\n**The platform team is its own first customer.** The groundwork chapter starts with product discipline — stakeholders, feedback loops, metrics, golden paths — before a single tool is installed, and that ordering is the point. The first paved path a platform ships is the one its own engineers walk every day. A team that cannot make its own administration project reproducible will not make a starter kit reproducible for anyone else; treating the foundation as the first product run keeps [Platform as a Product](platform-as-a-product.html) from being something the team preaches but does not practice.\n\n**Day zero decides the culture.** Whatever is done manually \"just this once\" in week one becomes the permanent exception. Anything clicked into existence in a web console is invisible to review, unrevertable, and unauditable; a repository created from a configuration file is a diff someone approved. The configuration file as source of truth converts the platform's most sensitive operations — creating repositories, granting access, changing roles — into ordinary, reviewable engineering changes.\n\n**Secrets hygiene is binary.** A credential is either never in source control or it is leaked; there is no mostly-clean history. That is why the record insists on the full mechanical discipline — committed example files, gitignored real values, a scripted vault flow that authenticates, unlocks, upserts, syncs, and locks — rather than on good intentions. The scripted path makes the safe way the easy way, which is the only way a rule about secrets survives contact with a deadline.\n\n![Diagram showing source control holding only example files while real credentials reach the vault through a five-step scripted flow.](assets/images/groundwork/vault-flow-boundary.jpeg)\n**Figure 2:** *Secrets hygiene is binary: source control sees only example files, and real credentials reach the vault through one scripted, idempotent flow.*\n\n**Onboarding as configuration is really an offboarding guarantee.** The day someone joins, a config diff is convenient. The day someone leaves, it is the difference between one reviewed change — applied, then verified — and an archaeology project across consoles. The same logic drives the service-account preference: administrative power attaches to a role the organization controls, not to individuals who may be on holiday, or gone.\n\n**A policy that exempts administrators is theater.** The trust you can place in a repository's history equals the protection on its weakest branch and its most privileged user. Hence the record's insistence that branch protection binds administrators, that signed commits are required on all branches — not only main — and that both failure modes are actually verified: unsigned commits rejected, signed commits accepted. Every commit traceable to an authorized developer is a property [End-to-End Platform Security](platform-security.html) will later build on.\n\n**Validation and release are different events.** Pushes prove the change; tags ship it. Separating the two — push-triggered preview versus tag-triggered release through tests, configuration validation, and a human approval gate — gives continuous integration without accidental deployment, and makes every release an explicit, named, auditable act. And because the gate exists, the rollback path must too: **a rollback that has never been tested is a hope**, which is why the record requires rollback mechanisms to be exercised regularly, not documented and trusted.\n\n![Diagram of trunk-based delivery where pushes only validate and annotated tags run a gated release workflow with a tested rollback loop.](assets/images/groundwork/push-validates-tag-releases.jpeg)\n**Figure 3:** *Pushes prove the change; tags ship it — through preview, tests, configuration validation, and a human approval gate, with a rollback path that is exercised, not assumed.*\n\n**Reproducibility is the completion test.** The chapter's completion check is the record's finish line: repository structure repeatable, secrets out of source control, provisioning automated, onboarding and offboarding configuration-driven, commit conventions validated, signed-commit policies enforced, trunk-based development with release tagging established, pushes validating, tags releasing, and a first stable release created and verified. Everything on that list is checkable by a second engineer with no tribal knowledge — which is exactly the standard.\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| Repositories are provisioned by IaC from one configuration file. | You must use Pulumi and GitHub — the stack is the reference; the capability is the commitment. |\n| Secrets live in a vault and never in source control. | Secrets never exist locally — `.env` files exist on machines; they are templated and gitignored. |\n| Onboarding, offboarding, and role changes are configuration diffs. | The platform team grants access by hand when it is urgent — urgency is what the pipeline is for. |\n| Branch protection binds administrators; signed commits are required on all branches. | Signed commits apply to main only, or seniority earns an exemption. |\n| Pushes validate; annotated tags release, behind tests, validation, and an approval gate. | Every push applies infrastructure changes, or releases ship without a human approval. |\n| Managed repositories carry delete protection, proven against accidental destroy. | Destroy operations are forbidden — they must be deliberate and non-catastrophic. |\n| Platform code passes tests, linting, type checks, and security scans. | The quality bar is for application teams only. |\n\nConcretely: every platform build in my organization starts with this groundwork, and the first review question on the administration project is *\"could a second platform engineer reproduce this from the repository alone?\"* The first release is a tag, not a push — and the tag goes through the gate.\n\n## Anti-Patterns\n\n- **The ClickOps foundation.** Repositories, teams, and policies created in the web console by whoever had admin that day — invisible to review, impossible to reproduce, drifting from day one.\n- **The credential that made it in.** One real secret committed \"temporarily\" — history is forever, and the clean-up costs more than the vault discipline ever would.\n- **The admin exemption.** Branch protection for everyone except the people most capable of doing damage; the policy becomes decoration precisely where it matters most.\n- **Onboarding by DM.** Access granted as a favor in a chat thread — nobody reviews it, nobody records it, and nobody remembers to revoke it when the person leaves.\n- **The tag that means nothing.** Tags applied as decoration while releases actually ship from pushes — no gate, no approval, no audit line between \"validated\" and \"live\".\n- **The untested rollback.** A rollback mechanism that exists in a runbook and has never been run — a hope with documentation.\n- **The snowflake admin project.** An administration project whose structure only its author can navigate — the reproducibility test failed at the very first repository.\n- **Cobbler's children.** A platform team that enforces tests, linting, and security scanning on application teams while its own IaC has none.\n\n## Related Records\n\n- [Platform Creation: Environments, GitOps, and the Mesh](platform-creation.html) — the next record in the build: environments, GitOps, and the mesh, erected on this groundwork.\n- [CI/CD as a Platform Service](cicd-as-a-platform-service.html) — the pipelines here serve the platform team's own repositories; that record turns CI/CD into a product for application teams.\n- [Policy as Code Implementation](policy-as-code.html) — repository policies here are IaC-enforced at the source-control layer; cluster admission policy and general policy-as-code live there.\n- [Self-Service Platform Onboarding](self-service-onboarding.html) — membership automation here covers the platform team itself; onboarding application teams at scale lives there.\n- [The Four Pillars of Platform Engineering](four-pillars.html) — pillar 2 (software-based abstractions) and pillar 4 (operated as a foundation) practiced first on the platform's own foundation.\n- [Platform as a Product](platform-as-a-product.html) — the product discipline the groundwork chapter opens with, in full operating form.\n- [Getting Started with Platform Engineering](getting-started.html) — choosing where a platform effort starts; this record is what the start looks like once chosen.\n\n## Scope and Revisiting\n\nThis record is `draft`. It applies to every new platform build my organization undertakes, and as the audit bar for existing platform foundations. I revisit it if the reference stack changes materially (a tool swap must preserve every capability commitment, or the record is amended honestly), if an audit finds repositories or members existing outside the configuration file (the source-of-truth claim failing in practice), or if teams begin routing around the tag-and-gate release path because it is too slow — friction in the gate is a defect to fix, not a rule to waive.\n\n## Authoritative References\n\n- *The Platform Engineer's Handbook* — the Groundwork chapter, whose checklist (including its exercises and completion check) this record distills.\n"}]}, {"key": "summary", "label": "TL;DR", "meta": {"timetoread": "2 min read"}, "blocks": [{"type": "markdown", "content": "Before a platform team in my organization builds anything for anyone else, it lays its own foundation — **and the foundation is code**. Repositories provisioned by IaC from one configuration file, secrets in a vault and never in source control, onboarding and offboarding as reviewed configuration diffs, conventional signed commits enforced on administrators too, and trunk-based delivery where pushes validate and annotated tags release through an approval gate. The test the build is held to: a second platform engineer can reproduce the entire foundation from the repository alone.\n\n**What changes**\n\n* **The foundation is a product from day zero.** Stakeholders identified, feedback loops short, metrics defined for adoption, reliability, delivery, and satisfaction, golden paths and sensible defaults established, and security, governance, testing, and compliance embedded from the beginning — the platform team is its own first customer.\n* **Repositories and membership become configuration.** One file is the source of truth; repositories are created programmatically through preview → review → apply, with visibility set by configuration and delete protection proven against an accidental destroy. Joining, leaving, and role changes are applied-and-verified diffs, and admin access goes through a service account or group, not individuals.\n* **Secrets discipline becomes mechanical.** Example files committed, real values gitignored, credentials pushed to the vault by a scripted authenticate–unlock–upsert–sync–lock flow and verified there. A credential is either never in source control or it is leaked; there is no mostly-clean history.\n* **Commit and policy discipline is enforced, not requested.** Conventional commit messages validated by distributed hooks, branch protection and merge requirements applied through IaC, and signed commits required on every branch — administrators included — with both rejection and success verified.\n* **Validation and release become different events.** Pushes trigger validation; annotated tags trigger the release workflow — tests, configuration validation, an approval gate, then apply — and rollback mechanisms are tested regularly, not documented and trusted. The groundwork ends with a first tagged, verified release.\n\n**What it costs**\n\n* Gates, signing, and vault discipline add friction on day one — accepted deliberately, because whatever is done manually \"just this once\" in week one becomes the permanent exception.\n* Rollback testing recurs; it is standing work, not a one-time setup.\n* The reference stack (Pulumi, Bitwarden, GitHub, CircleCI) must be learned even though the commitments are stack-agnostic.\n\n**What we are not doing**\n\n* Not mandating the reference stack — the tools are the worked example; the commitments hold under any stack with the same properties.\n* Not building clusters, environments, GitOps, or the mesh yet — that is [Platform Creation: Environments, GitOps, and the Mesh](platform-creation.html).\n* Not yet offering CI/CD or onboarding as products to application teams — those are [CI/CD as a Platform Service](cicd-as-a-platform-service.html) and [Self-Service Platform Onboarding](self-service-onboarding.html).\n\n*The Article tab carries the rationale and anti-patterns; the Checklist tab carries the full build sequence, exercises, and completion check. Grounded in the Groundwork chapter of* The Platform Engineer's Handbook*.*\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "7 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record — the Groundwork build sequence, from empty organization to first tagged release, following the handbook's reference stack. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Establish the Platform Foundation\n\n- [ ] Treat the engineering platform as a product focused on developer experience (DevEx)\n- [ ] Identify the developers, SREs, security/compliance teams, product managers, and other stakeholders who will use or influence the platform\n- [ ] Establish short feedback loops with platform users\n- [ ] Define metrics for adoption, reliability, delivery performance, and developer satisfaction\n- [ ] Establish supported golden paths and sensible defaults for developers\n- [ ] Embed security, governance, testing, and compliance into the platform from the beginning\n\n## 2. Prepare the Core Tooling\n\n- [ ] Install and configure Pulumi with Python and `uv` for infrastructure-as-code\n- [ ] Configure Bitwarden for secrets management\n- [ ] Configure GitHub for source control and repository management\n- [ ] Configure CircleCI and a local runner for CI/CD\n- [ ] Have Kind and Helm available for later Kubernetes work\n- [ ] Prepare the Python quality toolchain: `pytest`, `ruff`, `mypy`, and `bandit`\n\n## 3. Define Repository Architecture\n\n- [ ] Decide deliberately between a monorepo and polyrepo approach\n- [ ] Identify the platform's domain boundaries\n- [ ] Separate repositories or deployment pipelines by platform domain where appropriate\n- [ ] Establish consistent repository naming conventions\n- [ ] Establish branch naming conventions\n- [ ] Define repository access roles\n- [ ] Define repository policies and governance controls\n- [ ] Ensure security and compliance guardrails span all platform domains\n\n## 4. Create the Platform Administration Project\n\n- [ ] Create the `platform-team-administration` directory\n- [ ] Run `pulumi new python`\n- [ ] Select `uv` for package management\n- [ ] Create the standard project folders: configuration, modules, scripts, secrets setup, and tests\n- [ ] Ensure the project structure can be reproduced by another platform engineer\n\n## 5. Configure Secrets Management\n\n- **Local environment files**\n  - [ ] Create `.env_example`\n  - [ ] Add placeholders for `BW_CLIENTID`, `BW_CLIENTSECRET`, and `BW_PASSWORD`\n  - [ ] Copy `.env_example` to `.env`\n  - [ ] Insert the actual Bitwarden credentials into `.env`\n  - [ ] Add `.env` to `.gitignore`\n- **GitHub secrets**\n  - [ ] Create `github_secrets.json_example`\n  - [ ] Create the local `github_secrets.json` containing the actual values\n  - [ ] Add the real secrets JSON file to `.gitignore`\n  - [ ] Store the GitHub personal access token in Bitwarden\n  - [ ] Store the GitHub organization/owner information required by Pulumi\n- **The inject script**\n  - [ ] Create `inject_secrets.sh` and make it executable\n  - [ ] Authenticate with the Bitwarden CLI\n  - [ ] Unlock the vault and obtain a session\n  - [ ] Make the script update an existing Bitwarden item or create it when absent\n  - [ ] Sync Bitwarden after injecting secrets\n  - [ ] Lock the vault after the operation completes\n- [ ] Verify that the secrets appear correctly in Bitwarden\n\n**Exercise — Pulumi secret**\n\n- [ ] Create a Bitwarden-compatible JSON template for the Pulumi API key\n- [ ] Name the secret `Pulumi Secrets`\n- [ ] Create the field `pulumi-api-key`\n- [ ] Store the Pulumi API key in that field\n\n## 6. Automate Repository Creation\n\n- [ ] Create `config/platform_team_values.yaml`\n- [ ] Make the configuration file the source of truth for managed repositories\n- [ ] Define `platform-team-admin`\n- [ ] Define `platform-core`\n- [ ] Define `platform-demo-apps`\n- [ ] Configure the Pulumi GitHub provider\n- [ ] Retrieve the required GitHub credentials from the secrets configuration\n- [ ] Load repository definitions from the YAML configuration\n- [ ] Create repositories programmatically with Pulumi\n- [ ] Support repository visibility through configuration\n- [ ] Run `pulumi preview` and review the proposed changes\n- [ ] Run `pulumi up`\n- [ ] Verify that the repositories were created in GitHub\n\n**Exercise — repository delete protection**\n\n- [ ] Add delete protection to the Pulumi-managed repositories\n- [ ] Confirm that accidental `pulumi destroy` operations cannot delete protected repositories\n- [ ] Add a new repository named `platform-extensions`\n- [ ] Deploy `platform-extensions` to GitHub\n\n## 7. Automate Platform-Team Onboarding\n\n- [ ] Create a second GitHub user for testing onboarding\n- [ ] Add `github_organization_members` to `platform_team_values.yaml`\n- [ ] Define each member's name\n- [ ] Define their GitHub username\n- [ ] Define their GitHub role\n- [ ] Define their email where required\n- [ ] Update the Pulumi code to process organization members\n- [ ] Run `pulumi up`\n- [ ] Verify that the new team member receives the organization invitation\n- [ ] Prefer administrative access through a platform service account or group rather than individual engineers\n\n**Exercise — offboarding**\n\n- [ ] Remove the test team member from the IaC configuration\n- [ ] Apply the configuration\n- [ ] Verify that the user can no longer access the organization's repositories\n- [ ] Change a test user's role from admin to member\n- [ ] Verify how the user's permissions change\n\n## 8. Establish Commit Conventions\n\n- [ ] Define the required commit-message structure\n- [ ] Define allowed commit types such as `feat`, `fix`, `docs`, `test`, `refactor`, and others\n- [ ] Define how commit scopes will be used\n- [ ] Establish tagging/versioning conventions\n- [ ] Create a `.git-hooks/commit-msg` hook\n- [ ] Validate commit messages against the Conventional-Commits-style format\n- [ ] Create `scripts/install-githooks.sh`\n- [ ] Have the installation script copy the hook into `.git/hooks/commit-msg`\n- [ ] Add pre-commit checks for linting, formatting, or other fast validations where appropriate\n- [ ] Plan to automate changelog generation and version bumps\n\n## 9. Enforce Repository Policies\n\n- [ ] Agree on repository standards with the team\n- [ ] Establish branch-protection requirements\n- [ ] Establish merge/pull-request requirements\n- [ ] Configure GitHub policy enforcement through IaC\n- [ ] Require cryptographically signed commits\n- [ ] Apply the protection policy to the repository\n- [ ] Ensure administrators are also subject to the appropriate protection rules\n- [ ] Create/configure an SSH or GPG signing certificate for GitHub\n- [ ] Verify that unsigned commits are rejected\n- [ ] Verify that properly signed commits succeed\n\n**Exercise 1.1 — expand repository policy**\n\n- [ ] Modify the signed-commit policy so it applies to all branches, not only main\n- [ ] Verify that commits on every branch can be traced to an authorized developer\n\n## 10. Establish the Branching and Release Strategy\n\n- [ ] Adopt a deliberate branching strategy\n- [ ] Use trunk-based development\n- [ ] Have changes integrate through main\n- [ ] Trigger validation/deployment processes from commits to main\n- [ ] Establish a release-tagging convention\n- [ ] Separate validation on push from release on tag\n\n## 11. Configure CircleCI\n\n- [ ] Create `.circleci/config.yml`\n- [ ] Configure CircleCI version 2.1\n- [ ] Add the Pulumi orb\n- [ ] Add the Python orb\n- [ ] Configure filters for pushes to main\n- [ ] Configure separate filters for tags\n- [ ] Configure the local CircleCI runner\n- [ ] Create the `PLATFORM_ADMIN` CircleCI context\n- [ ] Make required Bitwarden/environment values available through the context\n\n## 12. Build the Release Workflows\n\n- [ ] Create a preview workflow for pushes\n- [ ] Run `pulumi-preview` on qualifying pushes\n- [ ] Create an update/release workflow for tags\n- [ ] Run `pulumi-preview` before a tagged deployment\n- [ ] Add an approval gate before infrastructure changes are applied\n- [ ] Run `pulumi-update` only after approval\n- [ ] Include automated testing before deployment\n- [ ] Include configuration validation before deployment\n- [ ] Consider automated rollback triggers based on health checks\n- [ ] Establish a process for regularly testing rollback mechanisms\n\n## 13. Create the First Release (Exercise 1.2)\n\n- [ ] Ensure all changes are committed\n- [ ] Ensure the local branch is up to date\n- [ ] Create the annotated tag: `git tag -a v0.1.0 -m \"First stable release of platform setup\"`\n- [ ] Push the tag: `git push origin v0.1.0`\n- [ ] Verify that the tag appears in GitHub under Releases\n- [ ] Verify that the tag-triggered CircleCI workflow runs as expected\n\n## Groundwork Completion Check\n\n- [ ] Repository structure is defined and repeatable\n- [ ] Secrets are kept out of source control\n- [ ] Repository provisioning is automated\n- [ ] Developer onboarding/offboarding is configuration-driven\n- [ ] Commit conventions are defined and validated\n- [ ] Signed-commit policies are enforced\n- [ ] Trunk-based development and release tagging are established\n- [ ] Pushes trigger validation\n- [ ] Tags trigger the controlled release workflow\n- [ ] The first stable release tag has been created and verified\n\nWith the completion check green, the platform has the repository structure, commit conventions, policy automation, and release-tagging foundation the next stage — [Platform Creation: Environments, GitOps, and the Mesh](platform-creation.html) — builds on. The test running through the whole sequence: **could a second platform engineer reproduce the entire foundation from the repository alone?**\n"}]}, {"key": "dialog", "label": "Conversation", "meta": {"timetoread": "8 min listen"}, "blocks": [{"type": "markdown", "content": "## Why the Foundation Is Code\n\n**Ben:** Blunt version first. This record is about creating repositories, gitignoring secrets, and tagging releases. Why does an executive operating model need a record about repo hygiene?\n\n**Ana:** Because it isn't hygiene — it's the first product the platform ever ships, and the customer is the platform team itself. This is the opening record of the Reference Implementation section: [The Four Pillars of Platform Engineering](four-pillars.html) says what a platform is; this section says what the build concretely looks like, chapter by chapter. And the groundwork chapter makes a claim I think is right: day zero decides the culture. Whatever the team does manually \"just this once\" in week one becomes the permanent exception. So before any cluster exists, the foundation itself is code — repositories provisioned by IaC from one configuration file, secrets in a vault, membership as configuration, releases as gated tags.\n\n**Ben:** Come on. A five-person platform team, an empty GitHub org. Clicking \"New repository\" takes ten seconds. Writing Pulumi code to do it takes a day. Why is the day worth it?\n\n**Ana:** Because the ten-second click is invisible. Nobody reviewed it, nobody can revert it, and in a year nobody knows why the repo is configured the way it is. The configuration file turns the platform's most sensitive operations — creating repositories, granting access, changing roles — into ordinary reviewable diffs. And there's a second reason: a team that can't make its own administration project reproducible will never make a starter kit reproducible for application teams. The record's finish-line test is exactly that — a second platform engineer can reproduce the entire foundation from the repository alone.\n\n**Ben:** You called the foundation the first product the platform ships. Does the product part actually show up in week one, or is that a slogan?\n\n**Ana:** It shows up before the first line of IaC. The chapter opens with product discipline, not tooling: identify the developers, SREs, security and compliance teams, and product managers who will use or influence the platform; set up short feedback loops with them; define metrics for adoption, reliability, delivery performance, and developer satisfaction; and lay down golden paths and sensible defaults from the start. And the same standard points inward — the platform's own code passes tests, linting, type checks, and security scans, the same bar application teams are held to. The anti-pattern list has a name for the alternative: cobbler's children.\n\n**Ben:** And the tools? The record names Pulumi, Bitwarden, GitHub, CircleCI. Is that a mandate now?\n\n**Ana:** No — that's stated flat out. The stack is the handbook's worked example, and the record keeps it because a reference implementation without concrete tools is just another abstraction. But the commitments sit at the capability level: IaC in a general-purpose language you can test like any other code, a vault you can script, source control with an API so IaC can own it, CI with tag filters and approval gates. Swap any tool that preserves the property and the record still holds.\n\n## Secrets and the Binary Rule\n\n**Ben:** The secrets section is strangely detailed for this journal. Example env files, gitignore entries, a shell script that unlocks and locks a vault. Why does that level of mechanics belong in a record?\n\n**Ana:** Because secrets hygiene is binary. A credential is either never in source control or it is leaked — there is no mostly-clean history. Rules at that level of consequence don't survive on good intentions; they survive on mechanics. So the record insists on the full flow: committed example files with placeholders, real values gitignored, and a scripted path into the vault — authenticate, unlock, upsert, sync, lock — then verify the secret actually landed. The scripted path makes the safe way the easy way, and that's the only version of a secrets rule that survives a deadline.\n\n**Ben:** The anti-pattern being the credential that made it in \"temporarily\".\n\n**Ana:** Right. History is forever, and the clean-up — rotating the credential, rewriting history, auditing exposure — costs more than the vault discipline ever would.\n\n## Access as a Diff, Policies Without Exemptions\n\n**Ben:** Onboarding as configuration. Adding a teammate's GitHub username to a YAML file and running a pipeline feels like ceremony compared to clicking \"Invite\".\n\n**Ana:** Onboarding as configuration is really an offboarding guarantee — that's the part the click skips. The day someone joins, a config diff is merely convenient. The day someone leaves, it's the difference between one reviewed change, applied and then verified, and an archaeology project across consoles wondering what they still have access to. The checklist even makes you rehearse it: remove a test user, apply, verify access is gone; change a role from admin to member, verify what changed. And the record prefers administrative access through a service account or group — admin power attaches to a role the organization controls, not to an individual who might be on holiday, or gone.\n\n**Ben:** Then the policy section. Signed commits on every branch, administrators included. Here's the practitioner objection: signing setup is friction, and admins are exactly the people you trust. Why bind them?\n\n**Ana:** Because a policy that exempts administrators is theater. The trust you can place in a repository's history equals the protection on its weakest branch and its most privileged user — and admins are the most capable of doing damage, which is precisely why the exemption is backwards. The record also refuses to take the policy on faith: you verify that unsigned commits are rejected *and* that signed ones succeed. An unverified control is a belief. And this isn't paranoia for its own sake — every commit traceable to an authorized developer is a property [End-to-End Platform Security](platform-security.html) builds on later.\n\n**Ben:** Enforced how? Someone toggling settings in the GitHub UI?\n\n**Ana:** Through IaC, like everything else in this record — branch protection, merge requirements, signed-commit rules, all applied from code. That's the source-control layer. Cluster admission policy is a different record, [Policy as Code Implementation](policy-as-code.html) — this one deliberately stops at the repository.\n\n## Tags, Gates, and Rollback\n\n**Ben:** Release flow. Trunk-based development, fine. But then an approval gate before infrastructure changes apply. Isn't a human gate exactly what continuous deployment was supposed to kill?\n\n**Ana:** For application code, often yes. This is the platform's own foundation — the repositories, access, and policies everything else stands on. The record's move is to separate two events people usually blur: pushes prove the change, tags ship it. Every push to main runs validation — preview, tests, configuration checks. Nothing applies. A release is an annotated tag, and the tag-triggered workflow runs preview again, tests again, validates configuration, and then waits for a human before applying. You get continuous integration without accidental deployment, and every release is an explicit, named, auditable act.\n\n**Ben:** The anti-pattern list calls out \"the tag that means nothing\".\n\n**Ana:** Tags applied as decoration while releases actually ship from pushes — no gate, no approval, no audit line between validated and live. The inverse discipline matters too: because there's a gate, there must be a way back. The record requires rollback mechanisms to be tested regularly, not documented and trusted. A rollback that has never been run is a hope with documentation.\n\n**Ben:** And delete protection — the exercise where you prove `pulumi destroy` can't take down the managed repositories. Isn't that admitting your own tooling is dangerous?\n\n**Ana:** It's admitting that everything-as-code cuts both ways. The same automation that creates your foundation in one command can destroy it in one command. The record doesn't forbid destroy operations — it requires that they be deliberate and non-catastrophic. You prove the protection works by trying.\n\n## What This Record Is Not\n\n**Ben:** Close it out. The team finishes the checklist, tags v0.1.0, the gated workflow runs, the release verifies. What do they *not* have?\n\n**Ana:** Almost everything, honestly — and that's by design. No clusters, no environments, no GitOps, no mesh; that's [Platform Creation: Environments, GitOps, and the Mesh](platform-creation.html), the next record, built on this groundwork. The CI/CD here serves the platform team's own repositories — turning pipelines into a product for application teams is [CI/CD as a Platform Service](cicd-as-a-platform-service.html). And the membership automation covers the platform team itself; onboarding application teams at scale is [Self-Service Platform Onboarding](self-service-onboarding.html).\n\n**Ben:** So the honest summary is: before the platform manages anyone else's complexity, it proves it can manage its own.\n\n**Ana:** That's the record in one line. The first thing a platform ships is its own foundation — and the test never changes: could a second platform engineer reproduce all of it from the repository alone? If yes, build the platform on it. If no, you haven't finished the groundwork.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why the platform's own foundation is code — repositories, secrets, membership, and releases — in nine panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. KAI: a hands-on platform engineering lead, short dark hair, gray zip-up hoodie with a small gear pin, laptop covered in infrastructure stickers under one arm, a coil of cable slung over the shoulder.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and teal accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: an engineer unrolls a grand platform blueprint while an executive points at the bare ground beneath them.](assets/images/groundwork/comic-01-groundwork-first.jpeg)\n**Panel 1:** *The hook: before my platform builds anything for anyone else, it lays its own groundwork — and the groundwork is code.*\n\n![Comic panel: repositories float away as untethered balloons while an engineer clicks a giant web console.](assets/images/groundwork/comic-02-the-clickops-foundation.jpeg)\n**Panel 2:** *The problem: the ClickOps foundation — repositories and policies clicked into existence by whoever had admin that day, invisible to review, drifting from day one.*\n\n![Comic panel: an engineer drops a golden key into a commit box while a copier labeled History prints endless copies of the key.](assets/images/groundwork/comic-03-the-credential-that-made-it-in.jpeg)\n**Panel 3:** *The wrong way: the credential that made it in 'temporarily' — history is forever, and there is no mostly-clean history.*\n\n![Comic panel: a single config file feeds a conveyor through preview, review, and apply arches, producing shielded repository buildings.](assets/images/groundwork/comic-04-one-file-is-the-truth.jpeg)\n**Panel 4:** *The principle: one configuration file is the source of truth — repositories are provisioned by IaC through preview, review, apply, with delete protection proven.*\n\n![Comic panel: an engineer runs a scripted loop feeding real keys into a vault while a framed cardboard example key hangs nearby.](assets/images/groundwork/comic-05-the-vault-flow.jpeg)\n**Panel 5:** *How it plays out: example files are committed, real values are gitignored, and credentials enter the vault through a scripted flow — authenticate, unlock, upsert, sync, lock.*\n\n![Comic panel: a new engineer enters through a green diff doorway while a leaver's badge dissolves under a stamped red diff.](assets/images/groundwork/comic-06-onboarding-is-a-diff.jpeg)\n**Panel 6:** *How it plays out: onboarding is a diff, offboarding is a diff — membership lives in configuration, applied and verified through the same pipeline.*\n\n![Comic panel: an admin's unsigned commit bounces off a branch gate while a wax-sealed signed commit passes through.](assets/images/groundwork/comic-07-administrators-included.jpeg)\n**Panel 7:** *How it plays out: branch protection binds administrators, and signed commits are required on every branch — both the rejection and the success are verified.*\n\n![Comic panel: pushes flow through a validation checkpoint while a tagged cart waits at an approval gate and a rollback lever is tested.](assets/images/groundwork/comic-08-the-tag-and-the-gate.jpeg)\n**Panel 8:** *What it costs: every release is a named, gated, auditable act — and the rollback lever gets pulled regularly, because an untested rollback is a hope.*\n\n![Comic panel: a second engineer rebuilds the entire foundation pop-up-book style from a single repository box.](assets/images/groundwork/comic-09-the-second-engineer-test.jpeg)\n**Panel 9:** *The closer: the groundwork test — a second platform engineer can reproduce the entire foundation from the repository alone.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
