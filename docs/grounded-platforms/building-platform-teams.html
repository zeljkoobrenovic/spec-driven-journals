<script id="data" type="application/json">{"meta": {"id": "PLT-BUILDING-PLATFORM-TEAMS", "status": "draft:gray", "title": "Building Great Platform Teams", "date": "2026-08-12", "author": "Željko Obrenović", "permalink": "building-platform-teams", "timetoread": "6 min", "excerpt": "A great platform team is a deliberately mixed team: people who can write substantial production code alongside people with broad systems and operational expertise, treated as equally valuable. I staff against the two cultural failure modes — the 'too much systems' team that automates instead of engineering problems away, and the 'too much development' team that chases new architecture while production burns. Roles beyond that core earn their place when the need is demonstrated, and customer empathy is a hiring bar, not a nice-to-have.", "tags": "platform engineering, platform teams, hiring, team composition, engineering culture, career ladders, customer empathy", "icon": "assets/icons/building-platform-teams.png", "logo": "assets/images/building-platform-teams/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["platform engineering", "platform teams", "hiring", "team composition", "engineering culture", "career ladders", "customer empathy"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: A great platform team is a deliberately mixed team: people who can write substantial production code alongside people with broad systems and operational expertise, with both kinds of work treated as equally valuable. I staff against the two cultural failure modes that kill platform teams — the \"too much systems\" culture that piles up automation, templates, and manual process where engineering could remove the problem, and the \"too much development\" culture that chases new architecture while treating maintenance as someone else's code. Roles beyond that core — reliability engineers, specialists, product managers, TPMs — earn their place when a demonstrated need exists, not before. And customer empathy is a hiring bar, not a nice-to-have: internal users are customers of the platform, and I do not hire engineers who treat users as the problem.\n\n## Statement\n\nMy operating model for staffing platform teams:\n\nComposition and balance:\n\n- **Mix software and systems expertise by design.** The team has people who can write substantial production code and people with broad systems and operational expertise — never only one kind — with reliability expertise added where reliability is a real organizational need, and both kinds of work rewarded equally.\n- **Guard against the \"too much systems\" culture.** The test is whether the team builds platform abstractions that permanently reduce operational complexity, or just automation, templates, and one-off tools backed by rules and manual process — and whether it improves the platform rather than blaming its users.\n- **Guard against the \"too much development\" culture.** Maintenance is valuable engineering work, technical debt is not \"someone else's code\", new architecture does not outrank reliability without a business reason, and every engineer understands how their systems run in production.\n- **Add specialists only against demonstrated need.** Reliability engineering is a specialized role with a clear mandate — not a catch-all label for systems work. Deep specialists (networking, kernels, performance, storage) stay few, stay close to the systems that need them, and contribute beyond their specialty.\n\nHiring and careers:\n\n- **Hire engineers curious about the whole environment.** Software engineers who want to understand what their code runs on and will operate business-critical systems; systems generalists who solve problems across the codebase and get a career path that lets them stay broad.\n- **Interview for the actual work.** Platform design rather than only application design, plus an inverted design interview on a real system the candidate built. Coding opens up testing, error handling, and operational constraints; a behavioral round covers incidents and ambiguity; and customer empathy is assessed explicitly.\n- **Evaluate outcomes, not code volume.** Title, level matrix, and interview process are separate decisions; ladders stay shared where practical; promotion evidence counts adopted tools, support quality, incident response, and reduced operational burden.\n\nLeadership and culture:\n\n- **Hire managers who respect operational complexity** — leaders who have operated business-critical systems, defend a deliberate delivery pace with business criticality and risk, and know when to inspect and when to trust.\n- **Add product roles at scale, deliberately.** Platform-aware PMs when the platform is big enough; product-minded and staff engineers filling the gap before that; TPMs only when coordination complexity genuinely requires them — and the same need bar applies to supporting roles: developer advocates, technical writers, and support engineers.\n- **Treat balanced culture as a leadership responsibility.** One shared roadmap, consolidated prioritization across development and operational work, no \"software vs. operations\" split — and partner teams appreciated publicly, never blamed.\n\n![Diagram of a core platform team mixing software and systems expertise, with reliability, specialist, PM, and TPM roles connected through gates labeled need.](assets/images/building-platform-teams/core-and-earned-roles.jpeg)\n**Figure 1:** *Composition by design: a core that mixes software and systems expertise as equal halves, with every additional role admitted only through a demonstrated need.*\n\n## How to Read This\n\nThis journal is my platform operating model, one record per source checklist. This record is grounded in the chapter on building great platform teams from Camille Fournier and Ian Nowland's *Platform Engineering: A Guide for Technical, Product, and People Leaders* (O'Reilly, 2024) — the chapter about who a platform team is made of and how it stays healthy, distilled here into **the staffing rules I hold platform organizations to**. The runnable version — composition checks, role expectations, interview design, promotion evidence, and the final health check — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**Platform teams fail from imbalance more often than from lack of talent.** Fournier and Nowland's central observation is that the two ingredients of platform work — building software and operating systems — come with different instincts, and a team dominated by either instinct develops a characteristic pathology. That is why composition is the first decision, not an emergent property of whoever applied: I staff the mix deliberately, and I treat **software and systems work as equally valuable** because the moment one becomes the prestige track, the team starts losing the other.\n\n**The \"too much systems\" failure is glue that never becomes a platform.** A team of pure systems instincts produces automation, templates, one-off tools, and an ever-growing rulebook of manual process — busy work that manages complexity without ever removing it. The tell is what happens when something breaks: a platform team improves the platform; a glue team blames the user. Engineering that **permanently reduces operational complexity** requires people who can build substantial software, which is why hiring filters that quietly exclude strong software engineers are a composition bug, not a sourcing detail.\n\n**The \"too much development\" failure is architecture nobody can operate.** The opposite pathology treats maintenance as beneath the team, technical debt as someone else's code, and reliability as a tax on the interesting work. A platform is a promise that other teams can build on; a team that prioritizes new architecture over keeping that promise is **spending its customers' trust to entertain itself**. So operational responsibility is part of engineering expectations here: engineers understand how their systems behave in production, respond to incidents, and balance experimentation against long-term support.\n\n![Seesaw diagram balancing the 'too much systems' glue pile against the 'too much development' rewrite tower, with a balanced mixed pair at the fulcrum.](assets/images/building-platform-teams/two-failure-modes.jpeg)\n**Figure 2:** *The two cultural failure modes: glue that never becomes a platform on one side, architecture nobody can operate on the other — the mixed team holds the fulcrum.*\n\n**Standard interviews select for the wrong job.** An interview loop borrowed from application engineering — abstract coding plus application design — will happily pass candidates who cannot do platform work and fail candidates who excel at it. So the loop mirrors the job: **platform design, not only application design**; an inverted interview where the candidate walks through a real system they built and defends its tradeoffs; coding exercises that open conversations about testing, error handling, observability, and scaling; and behavioral evidence of staying effective during incidents and ambiguity. Interviewers are trained and calibrated before the format ships, because a bespoke loop run inconsistently is worse than a generic one.\n\n![Diagram of a five-station platform interview loop: platform design, the candidate's own system, operations-aware coding, incidents, and customer empathy, with a crossed-out puzzle piece outside.](assets/images/building-platform-teams/interview-loop-map.jpeg)\n**Figure 3:** *The loop mirrors the job: platform design, an inverted interview on a real system, operations-aware coding, incident behavior, and explicit customer empathy — generic puzzles stay outside.*\n\n**Careers must reward what the platform needs, or the team will stop doing it.** If promotion evidence is lines of code and launches, engineers will rationally abandon support, operations, and usability — the exact work the platform's customers feel most. So I keep ladders shared where practical, refuse a separate matrix for every specialty, and make promotion cases out of **adopted tools, high-quality customer interactions, incident leadership, and reduced operational burden**. Broad systems engineers get a path that lets them stay broad; impact is not measured in code produced.\n\n**Customer empathy is the trait that makes everything else land.** A platform team's users are engineers, which tempts platform engineers to treat them as peers who should simply read the code. I screen for the opposite: candidates who have helped users understand a system, changed what they built because of feedback, and can absorb a frustrated user without turning dismissive. A culture that **labels users as the problem** will lose those users to shadow platforms no matter how good its technology is — internal users are customers, full stop.\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| Platform teams mix software and systems expertise by design. | One hiring profile fits all — a team of only developers or only operators is a platform team. |\n| Reliability engineering is a specialized role with a clear mandate. | \"Reliability engineer\" is a relabeling of whoever does systems work. |\n| Specialists arrive when deep expertise is demonstrably needed. | Specialists are collected speculatively, or parked as evangelists disconnected from delivery. |\n| Interviews test platform design, operations, and real systems the candidate built. | A borrowed application-engineering loop is good enough for platform hiring. |\n| Promotion evidence counts operations, support, and customer impact. | Impact is measured in lines of code and feature launches. |\n| Ladders stay shared, with at most one systems-oriented addition if truly needed. | Every specialty gets its own level matrix and hiring standard. |\n| Balanced culture is an explicit leadership responsibility. | Culture will emerge automatically from hiring good people. |\n\nConcretely: for any platform team I am accountable for, I can point at people who write substantial production code, people who can operate and debug complex systems, and evidence that both get promoted. The team runs **one shared roadmap** covering development and operational work, its interview loop looks like its job, and when a user struggles, the default response is a platform improvement — not a lecture.\n\n## Anti-Patterns\n\n- **The automation team that never builds a platform.** Years of scripts, templates, and runbooks; operational complexity fully preserved and now lovingly documented.\n- **The rewrite factory.** A team that ships new architecture every quarter while existing systems decay, because maintenance is \"someone else's code\" and reliability has no sponsor.\n- **The specialist zoo.** Deep experts hired speculatively, far from the systems that need them, unable to contribute outside their specialty — headcount spent on depth nobody asked for.\n- **The disconnected evangelist.** An \"internal advocate\" role with no delivery responsibility, whose influence evaporates because it costs nothing.\n- **A ladder per specialty.** A separate level matrix for every flavor of engineer, fragmenting evaluation until no one can compare impact across the team.\n- **The borrowed interview loop.** Testing platform candidates with generic algorithm puzzles and application design, then wondering why new hires cannot operate anything.\n- **Users-are-the-problem culture.** A team that answers every support ticket with condescension and every incident with blame — and then loses its customers to shadow platforms.\n- **Prestige-track drift.** Quietly rewarding feature development over operational work until every systems engineer either converts or leaves.\n\n## Related Records\n\n- [Getting Started with Platform Engineering](getting-started.html) — when the first platform team is justified and what it does first; this record is who that team is made of.\n- [The Four Pillars of Platform Engineering](four-pillars.html) — the four pillars a platform must stand on; the mixed team here is what makes the \"operated as a foundation\" pillar sustainable.\n- [Platform as a Product](platform-as-a-product.html) — the product operating mode; the product roles and customer-empathy bar in this record are its staffing preconditions.\n- [Operating Platforms](operating-platforms.html) — the operational discipline this team carries; staffing for operations is what makes that record executable.\n- [Organizing for Platforms](organizing-for-platforms.html) — Hohpe's organizational view: how platform team setup fits the wider organization.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs staffing, hiring, and culture for platform teams everywhere I am the accountable executive — composition, interview design, promotion evidence, and the roles added around the engineering core. I revisit it if a platform team's output drifts toward scripts and glue rather than a real platform product (the \"too much systems\" signal), if operational work stops appearing in promotion cases (the \"too much development\" signal reaching the ladder), or if support interactions show a team blaming its users rather than improving the platform.\n\n## Authoritative References\n\n- Camille Fournier and Ian Nowland, *Platform Engineering: A Guide for Technical, Product, and People Leaders* (O'Reilly, 2024) — the chapter on building great platform teams, whose checklist this record distills.\n"}]}, {"key": "summary", "label": "TL;DR", "meta": {"timetoread": "2 min read"}, "blocks": [{"type": "markdown", "content": "A great platform team is a deliberately mixed team: people who can write substantial production code alongside people with broad systems and operational expertise, with both kinds of work treated as equally valuable. I staff explicitly against the two cultural failure modes that kill platform teams — the \"too much systems\" culture that piles up automation and manual process where engineering could remove the problem, and the \"too much development\" culture that chases new architecture while production burns.\n\n**What changes**\n\n* **Composition is a decision, not an accident.** Every platform team mixes software and systems expertise by design, reliability expertise is added where reliability is a real organizational need, and deep specialists stay few, stay close to the systems that need them, and contribute beyond their specialty.\n* **Both failure modes get named tests.** \"Too much systems\": does the team build abstractions that permanently reduce operational complexity, or glue backed by rules — and does it improve the platform or blame the user when something breaks? \"Too much development\": maintenance counts as valuable engineering, technical debt is not \"someone else's code\", and every engineer understands their systems in production.\n* **Interviews mirror the actual job**: platform design rather than only application design, an inverted design interview on a real system the candidate built, coding that opens up testing and operational constraints, behavioral evidence from incidents and ambiguity — and customer empathy assessed explicitly, because internal users are customers of the platform.\n* **Careers reward what the platform needs.** Ladders stay shared where practical, and promotion evidence counts adopted tools, support quality, incident leadership, and reduced operational burden — not lines of code or launch counts.\n* **Leadership carries the balance**: managers who have operated business-critical systems and defend a deliberate delivery pace; platform-aware PMs added at scale; TPMs and supporting roles only when genuinely required; one shared roadmap across development and operational work.\n\n**What it costs**\n\n* Deliberate composition is slower and harder than hiring whoever applies — and a bespoke, calibrated interview loop is real ongoing investment.\n* Rewarding operational and support work equally means some traditional prestige signals (launches, new architecture) carry less promotion weight.\n* Holding roles to a demonstrated-need bar means living with gaps — no speculative specialists, PMs, or TPMs before the need is shown.\n\n**What we are not doing**\n\n* Not deciding when a platform team is justified or what it does first — that is [Getting Started with Platform Engineering](getting-started.html).\n* Not the operational discipline itself ([Operating Platforms](operating-platforms.html)) or the full product operating mode ([Platform as a Product](platform-as-a-product.html)) — this record staffs the team so it can carry both.\n* Not a compensation or leveling policy — ladders and pay bands stay with the wider organization; this record constrains only how platform work is evaluated within them.\n\n*The Article tab carries the rationale and anti-patterns; the Checklist tab holds the composition checks, interview design, promotion evidence, and team health check.*\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "6 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Team composition\n\n- [ ] Build a mixed team rather than staffing only software engineers or only systems engineers\n- [ ] Ensure the team has people who can write substantial production code\n- [ ] Ensure the team has people with broad systems and operational expertise\n- [ ] Include reliability expertise where reliability is a significant organizational need\n- [ ] Add systems specialists only where deep expertise is genuinely required\n- [ ] Avoid overloading the team with specialists at the expense of broad systems engineers\n- [ ] Make sure specialists can contribute beyond their specialty when needed\n- [ ] Treat software and systems work as equally valuable to the platform's success\n\n## 2. Avoid a \"too much systems\" culture\n\n- [ ] Check that the team is building platform abstractions, not just automation, templates, and one-off tools\n- [ ] Invest in architecture that permanently reduces operational complexity\n- [ ] Avoid relying on rules, documentation, and manual processes when engineering could remove the problem\n- [ ] Do not use technical hiring filters that unintentionally exclude strong software engineers\n- [ ] Make sure experienced systems engineers can mentor engineers who are newer to infrastructure\n- [ ] Watch for a culture that blames users or developers rather than improving the platform\n\n## 3. Avoid a \"too much development\" culture\n\n- [ ] Treat maintenance and improvement of existing systems as valuable engineering work\n- [ ] Avoid assuming technical debt is simply \"someone else's code\"\n- [ ] Do not prioritize new architecture over reliability without a clear business reason\n- [ ] Require engineers to understand how their systems operate in production\n- [ ] Make operational responsibility part of engineering expectations\n- [ ] Ensure engineers can respond effectively to incidents and production problems\n- [ ] Balance experimentation and new development with stability and long-term support\n\n## 4. Software engineer expectations\n\n- [ ] Hire software engineers who are curious about systems, not only application code\n- [ ] Look for engineers who want to understand the full environment their code runs in\n- [ ] Confirm candidates are comfortable investigating operating systems, networking, storage, databases, distributed systems, or related layers when necessary\n- [ ] Expect platform software engineers to participate in operating business-critical systems\n- [ ] Confirm engineers are willing and able to participate in on-call responsibilities when appropriate\n- [ ] Look for evidence that candidates have meaningfully helped resolve incidents\n- [ ] Prefer engineers comfortable shipping at a deliberate, reliability-conscious pace\n- [ ] Reward work on operations, integrations, experimentation, and support — not only feature code\n\n## 5. Systems engineer expectations\n\n- [ ] Hire broad systems generalists who understand how multiple parts of the platform interact\n- [ ] Look for experience in areas such as infrastructure integration, scaling, reliability, and observability\n- [ ] Expect systems engineers to use their knowledge to solve problems across the platform codebase\n- [ ] Avoid treating them only as operational debuggers\n- [ ] Create a career path that allows broad systems engineers to remain broad rather than forcing specialization\n- [ ] Recognize systems engineers for their impact even when that impact produces less new code\n\n## 6. Reliability engineers\n\n- [ ] Use reliability engineering as a specialized role, not a catch-all label for all systems work\n- [ ] Hire people motivated by improving reliability across teams and systems\n- [ ] Look for experience in incident management, SLOs, capacity, production readiness, and operational improvement\n- [ ] Ensure reliability engineers have enough technical depth to implement solutions, not only recommend them\n- [ ] Give reliability engineers a clear mandate and sufficient organizational reach\n- [ ] Avoid isolating reliability engineers in ways that cause their work to lose credibility with platform teams\n- [ ] Consider rotating reliability specialists into and out of platform teams to keep their skills current\n\n## 7. Systems specialists\n\n- [ ] Hire specialists only when the organization has a clear need for deep expertise (possible specialties include networking, kernels, performance, and storage)\n- [ ] Limit the number of specialists until their value is demonstrated\n- [ ] Keep specialists close to the teams and systems where their expertise is actually useful\n- [ ] Expect specialists to understand the broader platform context\n- [ ] Avoid overspecialization that causes engineers to ignore the larger customer or business need\n- [ ] Do not create \"internal evangelist\" roles that are disconnected from practical delivery\n\n## 8. Job titles and career levels\n\n- [ ] Allow role-specific titles when they accurately describe meaningful differences in work\n- [ ] Do not force everyone into the same title merely for administrative consistency\n- [ ] Separate job title, level matrix, and interview process decisions\n- [ ] Avoid creating a separate level matrix for every engineering specialty\n- [ ] Keep software-development roles on a shared ladder where practical\n- [ ] Create no more than one additional systems-oriented level matrix if the existing ladder cannot fairly evaluate systems work\n- [ ] Evaluate impact based on outcomes rather than lines of code produced\n- [ ] Ensure promotion criteria recognize operational, reliability, systems, and customer impact\n- [ ] Use reviewers outside the immediate platform team when useful to demonstrate company-wide impact\n\n## 9. Evidence for promotion and recognition\n\n- [ ] Document tools, dashboards, or internal documentation that are widely adopted\n- [ ] Capture evidence of high-quality customer interactions\n- [ ] Track effective handling and resolution of support tickets\n- [ ] Record meaningful participation in incident response and postmortems\n- [ ] Capture examples of coaching other teams during incidents\n- [ ] Document improvements in reliability, operability, scalability, or usability\n- [ ] Ensure performance reviews recognize work that reduces future operational burden\n\n## 10. Platform engineering interviews\n\n- [ ] Customize interviews to evaluate the actual work platform engineers perform\n- [ ] Include a coding exercise that tests practical implementation ability\n- [ ] Use coding questions that allow discussion of testing, error handling, observability, scaling, and operational constraints\n- [ ] Include a systems-oriented coding or technical exercise\n- [ ] Include a platform design interview rather than only an application design interview\n- [ ] Include an \"inverted\" design interview where the candidate explains a real system they designed\n- [ ] Ask candidates to explain technical tradeoffs in their previous work\n- [ ] Include a behavioral interview focused on operational experience\n- [ ] Assess whether candidates can remain effective during incidents and ambiguity\n- [ ] Evaluate customer empathy as part of the process\n- [ ] Train and calibrate interviewers before rolling out a new interview format\n- [ ] Collect interviewer feedback and improve the process after early rounds\n\n## 11. Interviews for systems roles\n\n- [ ] Keep the core interview process similar to the platform software engineering process\n- [ ] Allow more flexibility in design questions based on the candidate's specialty\n- [ ] Use the inverted design interview to explore deep systems knowledge\n- [ ] Continue evaluating coding ability rather than eliminating coding entirely\n- [ ] Consider a time-boxed take-home coding exercise when live coding creates an unrealistic evaluation environment\n- [ ] Review the take-home solution during the interview to explore implementation choices and systems thinking\n- [ ] Adjust technical depth to the role without creating completely separate hiring standards\n\n## 12. Customer empathy\n\n- [ ] Screen candidates for their ability to understand and respect platform users\n- [ ] Ask for examples of helping users understand a system\n- [ ] Ask for examples where customer feedback changed what the candidate built\n- [ ] Ask how candidates learn what users actually need\n- [ ] Look for engineers who can handle frustrated users without becoming dismissive\n- [ ] Reject cultures that label users as the problem instead of learning from their experience\n- [ ] Reinforce that internal users are still customers of the platform\n- [ ] Reward engineers for making the platform easier for other people to use\n\n## 13. Platform engineering managers\n\n- [ ] Hire managers with experience operating complex or business-critical systems\n- [ ] Confirm they understand that platform problems often have ambiguous boundaries and causes\n- [ ] Look for leaders who solve operational problems rather than dismissing them as temporary noise\n- [ ] Avoid leaders who assume every problem can be solved with a simple software rewrite\n- [ ] Prefer managers with experience leading large, long-running projects\n- [ ] Make sure managers are comfortable with a slower, more deliberate delivery pace when reliability requires it\n- [ ] Look for leaders who can defend the team's delivery choices using business criticality, complexity, and risk\n- [ ] Evaluate candidates for strong attention to detail\n- [ ] Look for managers who enjoy project and process management rather than avoiding it\n- [ ] Ensure managers know when to inspect details and when to trust the team\n\n## 14. Product management\n\n- [ ] Treat the platform as a product, with customers whose needs must shape priorities\n- [ ] Add dedicated product management when the platform reaches sufficient scale\n- [ ] Hire PMs who understand internal platforms and engineering customers\n- [ ] Avoid PMs who apply external-product assumptions without adapting to platform work\n- [ ] Balance short-term business pressure with the long-term health of the platform\n- [ ] Recruit product-minded engineers when formal PM hiring is not possible\n- [ ] Empower staff engineers with strong customer communication skills to help fill product gaps\n- [ ] Pair inexperienced platform PMs with experienced product leaders for coaching\n- [ ] Keep strategic product decisions and technical execution clearly coordinated\n\n## 15. Product owners and TPMs\n\n- [ ] Avoid splitting product manager and product owner responsibilities unless there is a clear benefit\n- [ ] Make sure someone owns both strategy and execution mechanics\n- [ ] Use technical program managers when coordination complexity genuinely requires them\n- [ ] Do not use TPMs as a substitute for product strategy or engineering leadership\n- [ ] Prefer smaller projects to be run by engineering managers and technical leads where practical\n- [ ] Hire TPMs who can succeed within the organization's existing working model\n- [ ] Look for TPMs who can build influence without formal authority\n- [ ] At larger companies, value TPMs who can communicate effectively with senior leadership\n\n## 16. Supporting roles\n\n- [ ] Add developer advocates when developer communication becomes a full-time need\n- [ ] Add technical writers when documentation demands justify specialization\n- [ ] Add support engineers when support volume requires dedicated ownership\n- [ ] Avoid creating specialist roles prematurely\n- [ ] Ensure engineers continue to contribute to documentation, support, and customer communication even when specialists exist\n- [ ] Recognize and reward these activities in performance evaluations\n\n## 17. Creating a balanced platform culture\n\n- [ ] Explicitly combine software-building and systems-operating mindsets\n- [ ] Balance people who enjoy creating new things with people who enjoy scaling and improving existing things\n- [ ] Ensure some team members are strongly oriented toward customer collaboration\n- [ ] Maintain room for experimentation without sacrificing stability\n- [ ] Make reliability, scalability, and usability team-wide responsibilities\n- [ ] Use a shared roadmap rather than allowing every engineer to independently choose features\n- [ ] Consolidate prioritization across development and operational work\n- [ ] Avoid \"software vs. operations\" or \"us vs. them\" thinking\n- [ ] Make technical leads responsible for reinforcing collaboration across disciplines\n- [ ] Reinforce the platform engineering culture during organizational changes\n\n## 18. Culture and recognition\n\n- [ ] Identify cultural differences between platform teams and surrounding engineering teams\n- [ ] Preserve useful company values such as innovation and collaboration\n- [ ] Add platform-specific emphasis on stability, reliability, usability, and scale\n- [ ] Recognize and reward different engineering skill sets equally\n- [ ] Publicly appreciate partner teams rather than blaming them for platform problems\n- [ ] Watch for cultural drift that creates contempt between platform and application teams\n- [ ] Encourage engineers to see partner teams as customers and collaborators\n- [ ] Make culture an explicit leadership responsibility rather than assuming it will emerge automatically\n\n## 19. Final health check\n\n- [ ] Can the team build substantial software, not just configure infrastructure?\n- [ ] Can the team operate and debug complex systems?\n- [ ] Does the team understand what its customers need?\n- [ ] Are reliability and usability treated as product requirements?\n- [ ] Are both software and systems contributions rewarded?\n- [ ] Can engineers advance their careers without becoming feature-focused developers?\n- [ ] Are interview processes aligned with actual platform work?\n- [ ] Do managers understand operational complexity?\n- [ ] Is product management influencing priorities and customer outcomes?\n- [ ] Is the team avoiding both \"build everything new\" and \"just keep it running\" extremes?\n- [ ] Does the organization reward collaborative behavior across engineering disciplines?\n- [ ] Is the platform team staffed to build a real platform product, rather than a collection of scripts and glue?\n"}]}, {"key": "dialog", "label": "Conversation", "meta": {"timetoread": "8 min listen"}, "blocks": [{"type": "markdown", "content": "## Why Composition Comes First\n\n**Ben:** Straight question. I need a platform team; there are strong engineers on the market. Why isn't this just \"hire good people and get out of the way\"?\n\n**Ana:** Because platform teams fail from imbalance more often than from lack of talent. That's the central observation in Fournier and Nowland's chapter. Platform work has two ingredients — building software and operating systems — and they come with different instincts. A team dominated by either instinct develops a characteristic pathology. So composition is the first decision, not an emergent property of whoever happened to apply.\n\n**Ben:** \"Characteristic pathology\" — go on. What does a team of pure operations instincts actually look like?\n\n**Ana:** The \"too much systems\" culture. Years of automation, templates, one-off tools, and an ever-growing rulebook of manual process. Busy work that manages complexity without ever removing it. Glue that never becomes a platform. And there's a sharp tell: watch what happens when something breaks. A platform team improves the platform. A glue team blames the user.\n\n**Ben:** And the mirror image?\n\n**Ana:** The \"too much development\" culture — architecture nobody can operate. Maintenance is beneath the team, technical debt is \"someone else's code\", reliability is a tax on the interesting work. A platform is a promise that other teams can build on, and a team that prioritizes new architecture over keeping that promise is spending its customers' trust to entertain itself.\n\n**Ben:** So the fix is a fifty-fifty org chart? That sounds mechanical.\n\n**Ana:** The fix is a deliberate mix — people who can write substantial production code alongside people with broad systems and operational expertise — plus one cultural rule that does most of the work: both kinds of work are treated as equally valuable. The moment one becomes the prestige track, the team starts losing the other. That's prestige-track drift: quietly reward feature development over operational work and every systems engineer either converts or leaves.\n\n## Specialists, Reliability, and the Need Bar\n\n**Ben:** What about depth? Real platforms hit networking, storage, performance problems. Shouldn't I stock up on specialists while I can get them?\n\n**Ana:** That's the specialist zoo — deep experts hired speculatively, far from the systems that need them, unable to contribute outside their specialty. Headcount spent on depth nobody asked for. The rule is demonstrated need: specialists stay few, stay close to the systems that need them, and contribute beyond their specialty.\n\n**Ben:** Same for reliability? Everyone slaps \"SRE\" on the job ads now.\n\n**Ana:** And that's the failure — \"reliability engineer\" as a relabeling of whoever does systems work. In this record, reliability engineering is a specialized role with a clear mandate and real reach, added where reliability is a genuine organizational need. Not a catch-all label.\n\n**Ben:** And the need bar applies beyond engineers, I take it.\n\n**Ana:** All the way up. Platform-aware PMs when the platform is big enough — product-minded and staff engineers fill the gap before that. TPMs only when coordination complexity genuinely requires them. Developer advocates, technical writers, support engineers — same bar. The anti-pattern there is the disconnected evangelist: an internal advocate role with no delivery responsibility, whose influence evaporates because it costs nothing.\n\n## Interviewing for the Actual Job\n\n**Ben:** Let me push on hiring. We have a calibrated interview loop that works — algorithms, application design, behavioral. Why can't platform candidates go through the same pipeline?\n\n**Ana:** Because a standard loop selects for the wrong job. Borrow application engineering's loop — abstract coding plus application design — and it will happily pass candidates who can't do platform work and fail candidates who excel at it. Then you wonder why the new hires can't operate anything.\n\n**Ben:** So what does the platform loop look like?\n\n**Ana:** It mirrors the job. Platform design, not only application design. An inverted design interview — the candidate walks through a real system they built and defends its tradeoffs, which you can't fake with rehearsed patterns. Coding exercises that open conversations about testing, error handling, observability, scaling. A behavioral round on incidents and ambiguity — staying effective when things are on fire. And customer empathy assessed explicitly.\n\n**Ben:** Empathy in an interview loop sounds soft. How do you actually test it?\n\n**Ana:** With evidence, not vibes. Has the candidate helped users understand a system? Changed what they built because of feedback? Can they absorb a frustrated user without turning dismissive? It matters because a platform team's users are engineers, which tempts platform engineers to treat them as peers who should simply read the code. A users-are-the-problem culture loses its customers to shadow platforms no matter how good its technology is. Internal users are customers, full stop.\n\n**Ben:** One caution on bespoke loops, though — doesn't customization make interviews inconsistent?\n\n**Ana:** If you skip the discipline, yes. That's why interviewers are trained and calibrated before the format ships. A bespoke loop run inconsistently is worse than a generic one.\n\n## Ladders, Promotion, and What Gets Rewarded\n\n**Ben:** Now the part nobody wants to touch: careers. If systems generalists are so valuable, don't they need their own ladder? Their own level matrix, their own hiring standard?\n\n**Ana:** Tempting, and mostly wrong. A ladder per specialty fragments evaluation until no one can compare impact across the team. Ladders stay shared where practical — with at most one systems-oriented addition if truly needed. What changes is the evidence, not the ladder: promotion cases built from adopted tools, high-quality customer interactions, incident leadership, reduced operational burden.\n\n**Ben:** Because if the evidence is lines of code and launches —\n\n**Ana:** — engineers rationally abandon support, operations, and usability. Which is exactly the work the platform's customers feel most. Careers must reward what the platform needs, or the team will stop doing it. And broad systems engineers get a path that lets them stay broad — no forced specialization to earn a promotion.\n\n**Ben:** What about the managers running all this?\n\n**Ana:** Same logic one level up. Managers who have operated business-critical systems, who defend a deliberate delivery pace with business criticality and risk rather than apologizing for it, and who know when to inspect and when to trust. And balance itself is an explicit leadership responsibility: one shared roadmap, consolidated prioritization across development and operational work, no \"software versus operations\" split inside the team — and partner teams appreciated publicly, never blamed.\n\n## What This Record Doesn't Cover\n\n**Ben:** Close it out. What is this record explicitly not doing?\n\n**Ana:** Four boundaries. It doesn't decide when a platform team is justified or what it does first — that's [Getting Started with Platform Engineering](getting-started.html). It doesn't define the operational discipline itself — that's [Operating Platforms](operating-platforms.html); this record staffs the team so it can carry that discipline. It's not the full product operating mode — that's [Platform as a Product](platform-as-a-product.html); here I only cover the product roles and product-minded staffing that support it. And it's not a compensation or leveling policy — ladders and pay bands stay with the wider organization; this record only constrains how platform work is evaluated within them.\n\n**Ben:** And the revisit conditions? What tells you the staffing model is drifting?\n\n**Ana:** Three signals, one per failure mode. If the team's output drifts toward scripts and glue rather than a real platform product — the \"too much systems\" signal. If operational work stops appearing in promotion cases — that's \"too much development\" reaching the ladder. And if support interactions show a team blaming its users instead of improving the platform. The concrete test for any team I'm accountable for: I can point at people who write substantial production code, people who can operate and debug complex systems, and evidence that both get promoted. When a user struggles, the default response is a platform improvement — not a lecture.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why great platform teams are deliberately mixed — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. KAI: a hands-on platform engineering lead, short dark hair, gray zip-up hoodie with a small gear pin, laptop covered in infrastructure stickers under one arm, a coil of cable slung over the shoulder.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and teal accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Kai presents a row of five identical engineers while Vera warns that sameness is the failure mode.](assets/images/building-platform-teams/comic-01-a-team-of-clones.jpeg)\n**Panel 1:** *The hook: platform teams fail from imbalance more often than from lack of talent — a single hiring profile is the failure mode.*\n\n![Comic panel: a desk buried in scripts and a giant rulebook while an engineer blames a confused user holding a broken gear.](assets/images/building-platform-teams/comic-02-too-much-systems.jpeg)\n**Panel 2:** *Failure mode one, 'too much systems': automation, templates, and rulebooks that manage complexity without removing it — and a team that blames its users.*\n\n![Comic panel: an engineer admires blueprints labeled NEW ARCH while a server room burns behind them and a pager buzzes ignored.](assets/images/building-platform-teams/comic-03-too-much-development.jpeg)\n**Panel 3:** *Failure mode two, 'too much development': new architecture outranks reliability, and the platform spends its customers' trust to entertain itself.*\n\n![Comic panel: Vera stands between a coder and a systems engineer shaking hands under two equal medals.](assets/images/building-platform-teams/comic-04-the-mixed-team.jpeg)\n**Panel 4:** *The principle: mix people who write substantial production code with broad systems and operational expertise — and reward both equally.*\n\n![Comic panel: a candidate whiteboards a real system they built while Kai listens and generic puzzles sit in the wastebasket.](assets/images/building-platform-teams/comic-05-interview-for-the-job.jpeg)\n**Panel 5:** *How it plays out: the loop mirrors the job — platform design, an inverted interview on a real system, operations and incidents, not borrowed puzzles.*\n\n![Comic panel: a small folder of adoption and incident-response evidence outweighs a huge stack labeled 10,000 LINES on a scale.](assets/images/building-platform-teams/comic-06-promotion-evidence.jpeg)\n**Panel 6:** *Careers reward what the platform needs: adopted tools, support quality, incident leadership — or the team rationally stops doing that work.*\n\n![Comic panel: Kai admits one specialist whose expertise matches a real need while other roles wait outside the team door.](assets/images/building-platform-teams/comic-07-earned-not-collected.jpeg)\n**Panel 7:** *The trade-off: reliability engineers, deep specialists, PMs, and TPMs join when a demonstrated need exists — not before, and never as a collection.*\n\n![Comic panel: Kai listens to a frustrated developer and hands over an improved gear while Vera nods approvingly.](assets/images/building-platform-teams/comic-08-users-are-customers.jpeg)\n**Panel 8:** *The closer: customer empathy is a hiring bar, not a nice-to-have — when a user struggles, the platform improves, nobody lectures.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
