weeks in wins and challenges written for the people who read them, not in ticket counts.\n\n## Statement\n\nMy operating model for planning and delivering platform work makes three commitments: what happens before a long project starts, how the roadmap is built, and how delivery is run and narrated.\n\nBefore a long project starts:\n\n- **A written proposal, problem first.** The current situation, constraints, the problem being solved, the realistic options with their trade-offs, the chosen solution and why — and a definition of \"done\" with measurable success criteria and early milestones.\n- **Buy-in before implementation.** The proposal is reviewed with engineering leads, product management, and stakeholders; major disagreements are resolved before the first commit, not discovered at launch.\n- **An action plan that counts everything.** Technical design, an owned testing strategy, acceptance criteria, dependencies confirmed with the teams behind them — and customer migration treated as a first-class project dependency, staffed like one. Project managers join when coordination risk becomes substantial, never to compensate for unclear technical planning.\n\nHow the roadmap is built:\n\n- **Bottom-up, from four categories.** Features, KTLO (keep the lights on), mandates from leadership, and system improvements — all four are real consumers of capacity and all four appear in the plan.\n- **KTLO capped near 40%.** Estimated from historical data with one-time events removed; when it exceeds that level, work that reduces operational burden jumps the queue.\n- **Mandates listed and costed.** Migrations, compliance, expansion, integration work — each with its actual engineering cost, with trade-offs surfaced and early escalation when the mandate load exceeds realistic capacity.\n- **Heuristics, not entitlements.** Roughly 70/20/10 across core work, adjacent innovation, and transformation — as a discussion tool; system-improvement projects kept to about three developer-months; slack left for the unplanned.\n\nHow delivery is run and narrated:\n\n- **Milestones that deliver value.** Long projects are broken into increments that a customer or the business can see — monthly in the first year, quarterly later — with migration, testing, adoption, and operational readiness inside the milestone plan, not after it.\n- **Adoption as project work.** Early adopters identified and actually talked to, documentation and enablement planned, adoption metrics defined — launch is a milestone, not the goal.\n- **Biweekly wins and challenges.** Each one a short bold summary plus situation, action, result — rewritten so the intended audience understands it, focused on outcomes and impact, with challenges treated as useful information rather than confessions.\n\n## How to Read This\n\nThis journal is my platform operating model, one record per source checklist. This record is grounded in the \"Planning & Delivery\" chapter of Camille Fournier and Ian Nowland's *Platform Engineering: A Guide for Technical, Product, and People Leaders* (O'Reilly, 2024) — the chapter on how platform teams plan a year of work and prove they delivered it, distilled here into **the planning contract I hold every platform team to**. The runnable version — proposal review, roadmap construction, KTLO estimation, and the wins-and-challenges process — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**Long platform projects die of unclear problems, not hard ones.** The expensive failures I have seen were not defeated by technical difficulty; they drifted because nobody could state crisply what problem was being solved and what \"done\" meant. Writing the proposal first — problem, options, trade-offs, success criteria — is cheap insurance against the most expensive failure mode there is: **a multi-year project that was never quite about anything**. If the problem is not clear enough to write a concrete proposal, it is not clear enough to staff.\n\n![Diagram of a proposal page divided into six labeled blocks, with a buy-in gate before an arrow reaches the build stage.](assets/images/planning-and-delivery/anatomy-of-a-proposal.jpeg)\n**Figure 1:** *The proposal is cheap insurance: problem before solution, options with trade-offs, a measurable 'done' — and buy-in gates the build.*\n\n\n**A plan that only lists features is fiction.** Platform teams carry four kinds of work whether the plan admits it or not: features, KTLO, mandates, and system improvements. A plan that budgets only for features does not make the other three disappear — it makes them **invisible, unfunded, and late**, and then makes the team look slow when reality collects its tax. Building the roadmap bottom-up from all four categories is what makes the plan a forecast instead of a wish.\n\n**KTLO grows silently until it is measured.** On-call, support, and remediation expand to fill whatever space nobody is watching. Estimating KTLO from historical data — and holding it near 40% of capacity — turns a slow suffocation into a visible number with a rule attached: **when the number is breached, reducing operational burden becomes the roadmap**, not a lament in retrospectives.\n\n![Horizontal capacity bar split into features, KTLO, mandates, improvements, and slack, with a dashed 40% ceiling over KTLO.](assets/images/planning-and-delivery/four-consumers-of-capacity.jpeg)\n**Figure 2:** *Honest capacity accounting: all four consumers of capacity appear in the plan, slack is real, and KTLO carries an explicit ceiling.*\n\n\n**Launch is the middle of a platform project, not the end.** A platform nobody migrates to is a cost, not an asset. That is why adoption work — naming, early adopters, documentation, enablement, internal marketing, adoption metrics — belongs inside the project plan, and why customer migration is a first-class dependency rather than \"the users' problem.\" The chapter's sharpest planning question is not \"when do we ship?\" but **\"who moves, when, and who does the work of moving them?\"**\n\n![Timeline with milestone flags where launch sits at the midpoint and migration and adoption continue to a final adoption target.](assets/images/planning-and-delivery/launch-is-the-middle-timeline.jpeg)\n**Figure 3:** *Launch is the middle of the project: value-bearing milestones run before it, and staffed migration and adoption run after it, ending at an adoption target.*\n\n\n**Value-bearing milestones keep long projects honest.** A multi-year effort measured only by technical completion can be \"on track\" for two years and still deliver nothing. Milestones that put something in a customer's hands — monthly in the first year, while trust is still being earned — create regular moments where **reality gets a vote**: scope creep becomes visible, dead ends surface early, and projects that have become open-ended slogs can be stopped or reshaped instead of quietly renewed.\n\n**Platform work is invisible when it works, so narration is part of delivery.** Nobody notices the infrastructure that did not fail. The biweekly wins-and-challenges rhythm — short, situation–action–result, rewritten for the audience — is how platform work stays legible to the people who fund it. And challenges are half of the value: **surfacing a blocking dependency early is delivery work**, provided the partner team hears it from us before they read it in a report.\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| Long-running projects start with a written proposal and secured buy-in. | Every task needs a document — this is for long-running commitments, not bug fixes. |\n| The roadmap includes features, KTLO, mandates, and system improvements. | All four get equal share — they get **honest** share, measured and traded off explicitly. |\n| KTLO stays near or under 40% of capacity, measured from history. | 40% is an entitlement — it is a ceiling that triggers burden-reduction work when breached. |\n| Migration and adoption are planned, staffed project work. | Adoption can be mandated — people are talked to before we assume they will come. |\n| Milestones deliver customer or business value on a regular cadence. | Every milestone ships a feature — a completed migration or retired system is value too. |\n| Delivery is narrated biweekly in wins and challenges, situation–action–result. | Reporting is theater — when the process stops producing useful information, the format changes. |\n| Project managers join when coordination risk is substantial. | A PM can compensate for unclear technical planning — nobody can. |\n\nConcretely: every long-running platform project here can show its proposal and who signed off; every team's plan shows all four work categories with KTLO as a number, not a feeling; every active project can name its next value-bearing milestone and its adoption metric; and every stakeholder gets a biweekly update they can actually understand — **\"I did not know that was happening\" is a planning failure**, and I treat it as one.\n\n## Anti-Patterns\n\n- **Launch as the finish line.** Declaring victory when the platform ships, then watching adoption flatline because migration was \"the customers' problem\" and nobody was staffed to help them move.\n- **The feature-only plan.** A roadmap that budgets 100% of capacity for features, then delivers 60% of it — because KTLO, mandates, and improvements were real all along.\n- **The silent mandate tax.** Absorbing compliance work, migrations, and executive initiatives without costing them or surfacing the trade-off, then being held to the original roadmap anyway.\n- **The two-year dark period.** A rearchitecture with no value-bearing milestone in sight — \"on track\" by its own reckoning, invisible by everyone else's, and unprotectable when budgets tighten.\n- **Scope creep by accretion.** Nice-to-have goals and every-customer generality bolted onto a project until the original problem is a minority of the work.\n- **Innersourcing as an escape hatch.** Assuming consumer teams will build the features we deprioritized — forgetting the platform team still owns every contributed line, and that contributions are not a substitute for prioritization conversations.\n- **Story-point status.** Updates that report ticket counts and velocity to executives who needed to hear what changed for customers and why it matters.\n- **Planning as headcount competition.** Teams inflating estimates and hoarding requests because the planning process rewards the biggest ask instead of the most honest one.\n\n## Related Records\n\n- [Platform as a Product](platform-as-a-product.html) — how the platform decides what to build; this record governs how that direction becomes a plan that survives contact with capacity.\n- [Operating Platforms](operating-platforms.html) — the operating model behind the KTLO line: on-call, support, and incident response that this record only budgets for.\n- [Rearchitecting Platforms](rearchitecting-platforms.html) — the special case of a long project that rebuilds the foundations; it inherits this record's milestone and migration discipline and adds its own guardrails.\n- [Managing Platform Stakeholders](managing-stakeholders.html) — the relationship work that the wins-and-challenges rhythm feeds; updates are an input to stakeholder trust, not a substitute for it.\n- [What Platform Success Looks Like](platform-success.html) — what the adoption metrics and milestone outcomes in this record ultimately add up to.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs planning and delivery for every platform team where I am the accountable executive: annual deep planning, quarterly refreshes, long-project proposals, and the delivery-communication rhythm. I revisit it if plans keep missing because KTLO or mandates were underestimated (the signal that the capacity accounting has gone soft), if a launched platform shows flat adoption two quarters running, or if the wins-and-challenges process degrades into low-value bureaucracy that nobody reads.\n\n## Authoritative References\n\n- Camille Fournier and Ian Nowland, *Platform Engineering: A Guide for Technical, Product, and People Leaders* (O'Reilly, 2024) — the \"Planning & Delivery\" chapter, whose checklist this record distills.\n"}]}, {"key": "summary", "label": "TL;DR", "meta": {"timetoread": "2 min read"}, "blocks": [{"type": "markdown", "content": "Platform planning is honest capacity accounting, and platform delivery is honest communication about what that capacity produced. In my organization no long-running project starts without a written proposal that nails the problem, the options, and what \"done\" looks like; the roadmap is built bottom-up from all four real consumers of capacity; and launch is not the finish line — adoption is.\n\n**What changes**\n\n* **Proposals gate long projects.** Before a long-running project starts: current situation, constraints, the problem being solved, realistic options with trade-offs, the chosen solution and why, a measurable definition of \"done\" — and buy-in from engineering leads, product, and stakeholders secured before the first commit, not discovered at launch.\n* **The roadmap admits all four kinds of work.** Features, KTLO (keep the lights on), mandates from leadership, and system improvements all appear in the plan, because a plan that only lists features is a plan to disappoint. KTLO is estimated from historical data and capped near 40% of capacity — breach the cap and burden-reduction work jumps the queue. Mandates are listed and costed separately, with early escalation when the load exceeds realistic capacity.\n* **Heuristics keep the plan honest, not entitled.** Roughly 70/20/10 across core work, adjacent innovation, and transformation — as a discussion tool; system-improvement projects near three developer-months; real slack for the unplanned.\n* **Adoption is project work.** Long projects break into value-bearing milestones — monthly in the first year, quarterly later — with migration, testing, enablement, and adoption metrics inside the milestone plan. Launch is a milestone, not the goal.\n* **Delivery is narrated.** Biweekly wins and challenges — short bold summary, then situation, action, result — rewritten for the audience that reads them, focused on outcomes rather than ticket counts, with challenges treated as useful information rather than confessions.\n\n**What it costs**\n\n* Writing and reviewing proposals slows the start of long projects — deliberately; that friction is cheap insurance against multi-year projects that were never quite about anything.\n* Honest accounting means telling stakeholders that features get only the capacity left after KTLO, mandates, and improvements — a smaller, truer number than a feature-only plan promises.\n* The wins-and-challenges rhythm is real recurring work for managers, and it is retired or reshaped the moment it degrades into bureaucracy nobody reads.\n\n**What we are not doing**\n\n* Not deciding what to build — direction comes from [Platform as a Product](platform-as-a-product.html); this record turns direction into a plan that survives contact with capacity.\n* Not the operating model behind the KTLO line — on-call, support, and incident response live in [Operating Platforms](operating-platforms.html).\n* Not the special case of foundational rewrites — [Rearchitecting Platforms](rearchitecting-platforms.html) inherits this discipline and adds its own gates. And not a project-management methodology: no sprint mechanics, no estimation poker, no tooling prescriptions.\n\n*The Article tab carries the rationale and anti-patterns; the Checklist tab is the runnable version — proposal review, roadmap construction, KTLO estimation, and the wins-and-challenges process.*\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "8 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Clarify the Project Before Starting\n\n- [ ] Write a proposal or requirements document before committing to a long-running project\n- [ ] Document the current situation, background, constraints, and key principles\n- [ ] Clearly define the problem being solved\n- [ ] Confirm that the team understands the problem before discussing solutions\n- [ ] Describe the realistic solution options considered\n- [ ] Record the trade-offs, costs, and risks of each option\n- [ ] State the chosen solution and why it was selected\n- [ ] Identify major constraints such as time, staffing, dependencies, and migration effort\n- [ ] Define what \"done\" looks like\n- [ ] Identify early and medium-term milestones\n- [ ] Define measurable success criteria\n- [ ] Review the proposal with engineering leads, product management, and relevant stakeholders\n- [ ] Resolve major disagreements and obtain buy-in before implementation begins\n\n## 2. Turn the Proposal Into an Action Plan\n\n- [ ] Create or begin a technical design document\n- [ ] Assign someone to own the testing strategy\n- [ ] Define baseline acceptance criteria\n- [ ] Identify integration points and external dependencies\n- [ ] Confirm that dependent teams have agreed to participate\n- [ ] Treat customer migration work as a first-class project dependency\n- [ ] Estimate the engineering headcount required\n- [ ] Account for testing, integration, migration, and operational work — not only feature development\n- [ ] Identify likely staffing conflicts with other team priorities\n\n## 3. Plan for Adoption\n\n- [ ] Define the product or feature name\n- [ ] Identify potential early adopters\n- [ ] Talk directly with target users before assuming they will adopt the solution\n- [ ] Determine what documentation users will need\n- [ ] Decide whether training or enablement is required\n- [ ] Plan internal communication or \"marketing\" where useful\n- [ ] Decide how the launch will be announced\n- [ ] Define adoption metrics\n- [ ] Include adoption work in the project plan rather than treating launch as the finish line\n\n## 4. Break Long Projects Into Milestones\n\n- [ ] Break large projects into incremental deliverables\n- [ ] Make milestones concrete enough to demonstrate progress\n- [ ] Prefer milestones that deliver customer or business value, not only technical completion\n- [ ] For the first 12 months, consider monthly milestones\n- [ ] For later phases, consider quarterly milestones\n- [ ] Attach measurable outcomes to milestones where possible\n- [ ] Include migration, testing, adoption, and operational readiness in milestone planning\n- [ ] Revisit milestones as unknowns become known\n\n## 5. Avoid Common Long-Project Failure Modes\n\n- [ ] Check whether the project scope is expanding beyond the original problem\n- [ ] Remove \"nice-to-have\" goals that do not materially improve the outcome\n- [ ] Avoid attempting a revolutionary redesign when an incremental improvement would work\n- [ ] Avoid designing a highly complex platform from scratch without a proven simpler version\n- [ ] Make sure the problem is sufficiently clear to write a concrete proposal\n- [ ] Do not build a generic platform intended to satisfy every possible customer\n- [ ] Validate that target users actually need the proposed solution\n- [ ] Watch for project turnover, burnout, and loss of institutional knowledge\n- [ ] Keep documentation current enough that new team members can understand why decisions were made\n- [ ] Stop or reshape projects that have become open-ended slogs\n\n## 6. Use Project Management at the Right Time\n\n- [ ] Keep engineering and product leadership directly involved in early planning\n- [ ] Do not assume a project manager can compensate for unclear technical planning\n- [ ] Bring in project-management support when coordination risk becomes substantial\n- [ ] Consider stronger PM involvement when deadlines are firm\n- [ ] Consider stronger PM involvement when there are many tasks or team dependencies\n- [ ] Consider stronger PM involvement when organizational scheduling bureaucracy is a major risk in itself\n\n## 7. Build a Bottom-Up Roadmap\n\n- [ ] Include **Features / product roadmap** work\n- [ ] Include **KTLO — Keep the Lights On** work\n- [ ] Include **Mandates** from executive or organizational leadership\n- [ ] Include **System Improvements**\n- [ ] Treat all four categories as real consumers of engineering capacity\n\n## 8. Estimate KTLO Work\n\n- [ ] Estimate on-call and incident-response staffing\n- [ ] Estimate customer or user support work\n- [ ] Estimate remediation work from incidents and postmortems\n- [ ] Review historical data from the previous planning period\n- [ ] Remove unusual one-time events when using history to forecast future KTLO\n- [ ] Aim for KTLO to consume **no more than roughly 40% of team capacity**\n- [ ] If KTLO exceeds that level, prioritize work that reduces the operational burden\n\n## 9. Account for Mandates\n\n- [ ] List executive or organization-wide mandates separately from normal roadmap work\n- [ ] Include required platform and infrastructure migrations\n- [ ] Include cloud/provider or geographic expansion initiatives\n- [ ] Include acquisition or integration work\n- [ ] Include compliance and security requirements\n- [ ] Include strategic company-wide initiatives\n- [ ] Estimate the actual engineering cost of every mandate\n- [ ] Surface trade-offs when mandates would displace higher-value work\n- [ ] Escalate early when the mandate load exceeds the team's realistic capacity\n- [ ] Work with leadership to remove, delay, or reduce lower-value mandates where possible\n\n## 10. Plan System Improvements\n\n### Reliability & Operability\n\n- [ ] Identify manual operational work that can be automated\n- [ ] Improve testing to prevent recurring defects from reaching production\n- [ ] Evaluate load testing, fuzz testing, or flaky-test reduction where appropriate\n- [ ] Improve deployment and release-engineering capabilities\n- [ ] Improve observability and monitoring\n- [ ] Reduce unnecessary differences between environments, APIs, configurations, or versions\n- [ ] Address system-level reliability weaknesses\n- [ ] Review postmortem action items for recurring improvement opportunities\n- [ ] Review customer incidents to identify platform guardrails that could prevent future failures\n\n### Efficiency & Performance\n\n- [ ] Identify the systems with the highest cost or the greatest potential for performance improvement\n- [ ] Assign clear ownership for FinOps or cost-efficiency work\n- [ ] Tag cloud and infrastructure resources for ownership\n- [ ] Create useful spend reports for engineering and finance\n- [ ] Review reservation and commitment strategies\n- [ ] Right-size infrastructure and eliminate unused resources\n- [ ] Negotiate vendor discounts where appropriate\n- [ ] Improve forecasting of future infrastructure costs\n- [ ] Give system engineers time to investigate and implement performance improvements\n\n### Security & Compliance\n\n- [ ] Identify high-value security improvements\n- [ ] Include security and compliance work in normal planning rather than waiting for incidents\n- [ ] Prioritize improvements based on probability and impact\n- [ ] Include architectural security changes in larger redesigns where required\n- [ ] Include incremental security improvements alongside reliability and feature work\n\n## 11. Rank and Merge the Work\n\n- [ ] Maintain separate ranked lists for reliability, efficiency/performance, and security/compliance\n- [ ] Compare projects within each category before comparing across categories\n- [ ] Combine the product roadmap, KTLO, mandates, and system-improvement lists into one realistic capacity plan\n- [ ] Make trade-offs explicit\n- [ ] Avoid planning as though every request can be delivered\n- [ ] Preserve local team details before rolling plans up to higher organizational levels\n- [ ] Avoid turning the planning process into a headcount competition between teams\n\n## 12. Apply Planning Heuristics\n\n- [ ] Conduct a deep planning exercise approximately once per year\n- [ ] Refresh the plan more lightly during the other quarters\n- [ ] Keep individual system-improvement projects to roughly **three developer-months or less** when possible\n- [ ] Reframe larger improvements as part of a broader project instead of letting them become endless maintenance efforts\n- [ ] Consider the **70/20/10 model** for non-KTLO work:\n  - [ ] ~70% core initiatives and incremental improvements\n  - [ ] ~20% adjacent innovation or re-architecture\n  - [ ] ~10% transformational innovation or entirely new platforms\n- [ ] Treat 70/20/10 as a discussion tool — not a guaranteed budget entitlement\n- [ ] Leave capacity for important unplanned work\n\n## 13. Be Careful With Innersourcing\n\n- [ ] Do not assume other teams will routinely contribute code to the platform they consume\n- [ ] Remember that the platform team remains responsible for maintaining contributed code\n- [ ] Establish contribution rules, review standards, ownership, and support expectations\n- [ ] Avoid using innersourcing as a substitute for customer prioritization discussions\n- [ ] Use contribution models selectively rather than as the platform's default operating model\n- [ ] If external contributions become frequent, investigate whether the platform itself is missing important capabilities or ownership\n\n## 14. Track Delivery With Biweekly Wins & Challenges\n\n- [ ] Collect updates approximately every two weeks\n- [ ] Ask teams for a small number of meaningful **Wins**\n- [ ] Ask teams for a small number of meaningful **Challenges**\n- [ ] Roll updates upward through the management hierarchy\n- [ ] Select only the most important items for broader audiences\n- [ ] Rewrite technical details so the intended audience can understand them quickly\n- [ ] Focus on outcomes and impact rather than ticket counts or story points\n\n### For Each Win or Challenge\n\n- [ ] Start with a short, bold summary\n- [ ] Describe the **Situation**: What was happening?\n- [ ] Describe the **Action**: What did the team do?\n- [ ] Describe the **Result**: What changed?\n- [ ] Use numbers or metrics when they improve understanding\n- [ ] Remove unnecessary technical detail\n- [ ] Explain why the update matters to customers, stakeholders, or the business\n\n## 15. Include the Right Types of Updates\n\n- [ ] Major project milestones\n- [ ] Delays or delivery risks\n- [ ] Important staffing or organizational changes\n- [ ] Significant incidents or unusually strong operational periods\n- [ ] Changes in engineering or business metrics\n- [ ] Performance improvements\n- [ ] Cost savings\n- [ ] Adoption milestones\n- [ ] Customer satisfaction changes\n- [ ] Important customer feedback\n\n## 16. Treat Challenges as Useful Information\n\n- [ ] Share challenges that require management visibility\n- [ ] Surface recurring collaboration problems\n- [ ] Call out any dependencies blocking delivery\n- [ ] Use recurring challenges as evidence for escalation or process improvement\n- [ ] Share externally relevant challenges to build trust and enable help\n- [ ] Avoid publicly surprising or blaming a partner team\n- [ ] Discuss cross-team issues with the relevant team before broadly publishing them\n\n## 17. Operationalize the Wins & Challenges Process\n\n- [ ] Define exactly who must submit updates\n- [ ] Establish a consistent submission deadline\n- [ ] Provide a standard template\n- [ ] Provide a central place to submit or store updates\n- [ ] Make engineering managers responsible for the final quality of their teams' updates\n- [ ] Allow product managers and other team members to help draft them\n- [ ] Have skip-level managers review and select the most important items\n- [ ] Make important highlights visible to senior leadership\n- [ ] Share notable achievements with peers and stakeholders\n- [ ] Periodically review whether the process is producing useful information\n- [ ] Adjust the format or cadence when it becomes low-value bureaucracy\n\n## 18. Final Planning Review\n\n- [ ] Is the problem clear?\n- [ ] Is the proposed solution justified?\n- [ ] Are the scope and requirements realistic?\n- [ ] Are dependencies visible?\n- [ ] Is migration work included?\n- [ ] Is adoption planned?\n- [ ] Are testing and acceptance criteria defined?\n- [ ] Are milestones incremental and measurable?\n- [ ] Is staffing realistic?\n- [ ] Is KTLO explicitly accounted for?\n- [ ] Are mandates explicitly accounted for?\n- [ ] Are reliability, efficiency, and security improvements represented?\n- [ ] Have you intentionally prioritized what **will not** be done?\n- [ ] Is there slack for unexpected work?\n- [ ] Can stakeholders understand what the team is delivering and why it matters?\n- [ ] Is there a regular mechanism for communicating both wins and challenges?\n"}]}, {"key": "dialog", "label": "Conversation", "meta": {"timetoread": "8 min listen"}, "blocks": [{"type": "markdown", "content": "## The Plan That Only Lists Features\n\n**Ben:** Blunt question to start. Planning records are usually where good intentions go to die — every team says \"we plan honestly.\" What does this record actually forbid?\n\n**Ana:** It forbids the most popular platform plan in existence: the one that budgets 100% of capacity for features and then delivers 60% of it. Platform teams carry four kinds of work whether the plan admits it or not — features, keep-the-lights-on work, mandates from leadership, and system improvements. A plan that only lists features doesn't make the other three disappear; it makes them invisible, unfunded, and late. And then the team looks slow when reality collects its tax.\n\n**Ben:** So the fix is a spreadsheet with four rows? That seems thin for a whole record.\n\n**Ana:** The four categories are the visible part. The discipline is that the roadmap is built bottom-up from all four, with numbers attached. KTLO gets estimated from historical data — last period's on-call, support, and remediation load, with one-time events stripped out — and it's held near 40% of capacity. Mandates get listed separately and costed at their actual engineering price. What's left is what features and improvements can honestly claim.\n\n**Ben:** Forty percent for keeping the lights on sounds enormous. If my team told me KTLO was eating 40%, I'd say they have a quality problem, not a planning problem.\n\n**Ana:** You might be right — and the cap is what tells you. Forty is a ceiling, not an entitlement. When KTLO breaches it, the record's rule kicks in: work that reduces operational burden jumps the queue. The number turns a slow suffocation into a visible trigger. Without measuring it, KTLO just grows silently in the space nobody is watching, and the plan is fiction from day one.\n\n**Ben:** And mandates — compliance, migrations, the CEO's integration project. Teams usually just absorb those. Why make a ceremony of costing them?\n\n**Ana:** Because the silent mandate tax is one of the classic failure modes: the team absorbs the compliance work and the migration without surfacing the cost, and then gets held to the original roadmap anyway. Costing mandates explicitly does two things — it makes the trade-off visible to the people issuing the mandates, and it gives you grounds to escalate early when the mandate load exceeds realistic capacity. Sometimes the mandate gets removed or delayed. That conversation can only happen if there's a number on the table.\n\n## Proposals Before Projects\n\n**Ben:** Let's talk about the proposal requirement, because \"write a document before you start\" is where engineers roll their eyes. Isn't this just process for its own sake?\n\n**Ana:** The expensive platform failures I've seen were not defeated by technical difficulty. They drifted — because nobody could state crisply what problem was being solved and what \"done\" meant. A multi-year project that was never quite about anything is the most expensive failure mode there is. The proposal — problem before solution, options with trade-offs, measurable success criteria, early milestones — is cheap insurance against exactly that. And there's a diagnostic in it: if the problem isn't clear enough to write a concrete proposal, it isn't clear enough to staff.\n\n**Ben:** Every bug fix needs a signed document now?\n\n**Ana:** No — long-running projects only. That's an explicit boundary in the record. This is the gate for multi-quarter commitments, not for tasks.\n\n**Ben:** Fine. But the buy-in part worries me. \"Resolve major disagreements before implementation\" sounds like a recipe for endless pre-alignment meetings while nothing ships.\n\n**Ana:** The alternative is worse: discovering the disagreement at launch, after the money is spent. The review is with a specific set of people — engineering leads, product management, the stakeholders who'll live with the result — and it ends. What it buys you is a project that doesn't get relitigated every quarter, because the argument happened once, on paper, before the first commit.\n\n**Ben:** And then the classic move: hire a project manager to keep the thing on rails.\n\n**Ana:** At the right moment, yes — PMs join when coordination risk becomes substantial: firm deadlines, many dependencies, real scheduling bureaucracy. What a PM can never do is compensate for unclear technical planning. Nobody can. If the technical plan is mush, adding a project manager gives you well-organized mush.\n\n## Launch Is the Middle\n\n**Ben:** Now the claim I most want to poke: \"launch is not the finish line — adoption is.\" Isn't adoption the customers' job? We build the platform, we announce it, teams migrate when they're ready.\n\n**Ana:** That's the anti-pattern the record names first: launch as the finish line. You declare victory when the platform ships, and then adoption flatlines — because migration was \"the customers' problem\" and nobody was staffed to help them move. A platform nobody migrates to is a cost, not an asset. So adoption work is inside the project plan: early adopters identified and actually talked to before we assume they'll come, documentation and enablement planned, adoption metrics defined, customer migration treated as a first-class dependency and staffed like one. The sharpest planning question isn't \"when do we ship?\" — it's \"who moves, when, and who does the work of moving them?\"\n\n**Ben:** You also want monthly milestones in year one. For platform work? Some of this is foundational — there's genuinely nothing to show for months.\n\n**Ana:** \"Nothing to show for months\" is precisely the condition the record refuses, because it's unfalsifiable. A multi-year effort measured only by technical completion can be \"on track\" for two years and deliver nothing — that's the two-year dark period, and it's unprotectable when budgets tighten. Monthly milestones in year one, quarterly later, and each one delivers something a customer or the business can see. And value is defined broadly — a completed migration or a retired system is value, not just shipped features. Milestones are where reality gets a vote: scope creep becomes visible, dead ends surface early, and open-ended slogs can be stopped instead of quietly renewed.\n\n**Ben:** One escape hatch teams love: innersourcing. \"We deprioritized your feature, but feel free to contribute it.\" Doesn't that square the capacity circle?\n\n**Ana:** It's an escape hatch, and the record is cautious about it for a reason: the platform team still owns every contributed line — review, maintenance, support, forever. Contribution models are fine selectively, with clear rules. What they can never be is a substitute for the honest prioritization conversation with the customer. \"Build it yourself\" is not a roadmap answer.\n\n## Narrating the Invisible\n\n**Ben:** Last piece — the biweekly wins and challenges. Status reporting is the most theater-prone ritual in engineering. Why is yours different?\n\n**Ana:** Because platform work is invisible when it works — nobody notices the infrastructure that didn't fail. Narration is part of delivery, not decoration on it. The format keeps it honest: each win or challenge is a short bold summary, then situation, action, result — rewritten so the intended audience actually understands it, focused on outcomes and impact. Story-point status is the named anti-pattern: reporting ticket counts and velocity to executives who needed to hear what changed for customers and why it matters.\n\n**Ben:** And challenges? In most orgs, reporting a challenge upward is reporting a confession.\n\n**Ana:** Here it's information. Surfacing a blocking dependency early is delivery work — with one rule of decency attached: the partner team hears it from us before they read it in a report. No public ambushes. And the process itself is on notice: when wins-and-challenges stops producing useful information, the format changes. The record's own revisit conditions say so — if it degrades into bureaucracy nobody reads, it goes.\n\n**Ben:** Close it out. What is this record explicitly not?\n\n**Ana:** Four boundaries. It doesn't decide what to build — that's [Platform as a Product](platform-as-a-product.html); this record turns direction into a plan that survives contact with capacity. It doesn't define the operating model behind the KTLO line — on-call and support live in [Operating Platforms](operating-platforms.html). It doesn't govern foundational rewrites — [Rearchitecting Platforms](rearchitecting-platforms.html) inherits the milestone and migration discipline and adds its own gates. And it's not a project-management methodology — no sprint mechanics, no estimation poker, no tool mandates.\n\n**Ben:** And the one-sentence test of whether a team is living it?\n\n**Ana:** Every stakeholder gets a biweekly update they can actually understand, and every plan shows all four kinds of work with KTLO as a number — because \"I did not know that was happening\" is a planning failure, and we treat it as one.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why a plan that only lists features is a plan to disappoint — and why launch is not the finish line — in nine panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. KAI: a hands-on platform engineering lead, short dark hair, gray zip-up hoodie with a small gear pin, laptop covered in infrastructure stickers under one arm, a coil of cable slung over the shoulder.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and teal accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: an engineer unrolls a features-only roadmap while an executive lifts a rug hiding lumps of other work.](assets/images/planning-and-delivery/comic-01-the-feature-only-plan.jpeg)\n**Panel 1:** *The hook: a plan that only lists features is a plan to disappoint — the other work exists whether the plan admits it or not.*\n\n![Comic panel: toll collectors labeled KTLO, mandates, and improvements take slices of a capacity pie, leaving a sliver for features.](assets/images/planning-and-delivery/comic-02-reality-collects-its-tax.jpeg)\n**Panel 2:** *The problem: KTLO, mandates, and system improvements are real all along — a feature-only budget just makes them invisible, unfunded, and late.*\n\n![Comic panel: engineers row a boat labeled year two through fog with a blank flag and oars pointing different ways.](assets/images/planning-and-delivery/comic-03-never-quite-about-anything.jpeg)\n**Panel 3:** *The wrong way: the multi-year project that was never quite about anything — no written problem, no definition of done, just drift.*\n\n![Comic panel: Vera holds a one-page proposal with problem, options, and done sections while two people sign it.](assets/images/planning-and-delivery/comic-04-proposal-before-project.jpeg)\n**Panel 4:** *The principle, part one: no long-running project starts without a written proposal — problem first, options with trade-offs, a measurable 'done', and buy-in before the first commit.*\n\n![Comic panel: four labeled pipes fill one capacity tank while an engineer holds a valve with a gauge marked forty percent.](assets/images/planning-and-delivery/comic-05-four-categories-one-budget.jpeg)\n**Panel 5:** *The principle, part two: the roadmap is built bottom-up from all four work categories — with KTLO measured from history and capped near 40%.*\n\n![Comic panel: a bridge built span by span with customers already walking on finished spans as an engineer places the next one.](assets/images/planning-and-delivery/comic-06-milestones-reality-votes.jpeg)\n**Panel 6:** *How it plays out: value-bearing milestones — monthly in year one — give reality a regular vote, so scope creep and dead ends surface early.*\n\n![Comic panel: Kai helps a team carry moving boxes through a launch ribbon at the midpoint of a road while Vera points toward an adoption signpost.](assets/images/planning-and-delivery/comic-07-launch-is-the-middle.jpeg)\n**Panel 7:** *How it plays out: launch is a milestone, not the goal — migration and adoption are first-class, staffed project work.*\n\n![Comic panel: an engineer hands over a short wins-and-challenges note while a messy ticket chart sits in a wastebasket.](assets/images/planning-and-delivery/comic-08-wins-and-challenges.jpeg)\n**Panel 8:** *The cost worth paying: narration is part of delivery — biweekly wins and challenges, situation–action–result, written for the people who read them.*\n\n![Comic panel close-up: Vera shows a notebook sketch of a balanced capacity pie while Kai holds the signed proposal.](assets/images/planning-and-delivery/comic-09-forecast-not-a-wish.jpeg)\n**Panel 9:** *The closer: honest capacity accounting turns the plan from a wish into a forecast — and honest narration proves what it produced.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
