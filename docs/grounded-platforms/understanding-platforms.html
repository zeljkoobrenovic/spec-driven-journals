<script id="data" type="application/json">{"meta": {"id": "PLT-UNDERSTANDING-PLATFORMS", "status": "draft:gray", "title": "Understanding Platforms", "date": "2026-08-12", "author": "Željko Obrenović", "permalink": "understanding-platforms", "timetoread": "6 min", "excerpt": "Before anything in my organization earns the name platform, it has to pass a test. A platform elevates participants — it lets them build on existing capabilities instead of starting from scratch — and it generates value through interaction, which means a platform without participants is worth little and a product relabeled as a platform is worth nothing extra. The line I hold every platform to comes from the automotive industry: harmonize the expensive, undifferentiated engineering underneath, and use it to increase — not suppress — the diversity built on top.", "tags": "platform strategy, platforms, harmonization, developer platforms, marketplaces, business capabilities", "icon": "assets/icons/understanding-platforms.png", "logo": "assets/images/understanding-platforms/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["platform strategy", "platforms", "harmonization", "developer platforms", "marketplaces", "business capabilities"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: I use the word platform for exactly one thing: something that elevates participants by letting them build on existing capabilities rather than starting from scratch, and that generates its value through the interaction of those participants. A platform without participants is worth little; a product relabeled \"platform\" is worth nothing extra. The test I hold every platform to is the automotive lesson: harmonize the expensive, undifferentiated engineering underneath so that diversity *increases* on top. When standardization suppresses differentiation instead of enabling it, we have not built a platform — we have built a constraint with a fashionable name.\n\n## Statement\n\nMy operating model for understanding platforms has four parts.\n\nWhat makes something a platform:\n\n- **It elevates participants.** People build on existing capabilities rather than starting from scratch — the platform raises the floor they stand on.\n- **Its value comes from interaction.** Platforms generate value through participants benefiting from the presence of other participants and of shared, reusable capabilities. A platform without participants provides little or no value.\n- **It is engineered, not relabeled.** Renaming an existing product or service \"platform\" changes nothing. The question is whether the thing exhibits platform characteristics, not what the slide calls it.\n\nWhat platforms are for — the five benefits I expect a real one to show:\n\n- **Enable** — make interactions or transactions easier.\n- **Democratize** — lower barriers to participation.\n- **Self-perpetuate** — create positive feedback loops as participation grows.\n- **Accelerate** — remove common or repetitive work so users can focus on differentiation.\n- **Avoid unnecessary constraints** — provide reusable capabilities without forcing every participant into the same solution.\n\nThe line that makes or breaks a platform — the automotive lesson:\n\n- **Harmonize below, vary above.** Automotive platforms reuse expensive underlying engineering across many vehicle models; done right, standardization *increases* product diversity. The design decision that matters is what gets harmonized in the platform versus what remains variable on top.\n- **Beware badge engineering.** Near-identical products with superficial differences are the failure mode: the platform ate the differentiation. Both the platform *and* the differentiated products built on top have to matter.\n\n![Layered diagram: a single harmonized platform layer below a dividing line supports many visibly different product shapes above it.](assets/images/understanding-platforms/harmonize-below-differentiate-above.jpeg)\n**Figure 1:** *The automotive lesson as a design rule: harmonize the expensive, undifferentiated engineering below the line so that diversity increases above it.*\n\nThe four technology platform types — combinable, not mutually exclusive:\n\n| Type | Purpose | Typical interaction |\n| --- | --- | --- |\n| **Marketplace** | Facilitate transactions between participant groups | Browser, mobile app, APIs |\n| **Base platform** | Rapidly provision technical/IT resources | Console, CLI, APIs, automation |\n| **Developer platform** | Increase development speed, reuse, and governance | Portals, command line, APIs |\n| **Business capability platform** | Expose business-domain capabilities and enable an ecosystem | APIs and custom integrations |\n\nMarketplaces run on base platforms; developer platforms run on clouds; internal platforms get externalized; business capability platforms help customers build their own marketplaces. Platform ecosystems are layered and fractal, and I treat the types as lenses, not boxes.\n\n![Stacked-terrace diagram of a layered platform ecosystem: marketplaces running on base platforms and developer platforms running on clouds, with the pattern repeating at every scale.](assets/images/understanding-platforms/layered-platform-ecosystem.jpeg)\n**Figure 2:** *Platform ecosystems are layered and fractal: marketplaces run on base platforms, developer platforms run on clouds, and the pattern repeats at every scale.*\n\n## How to Read This\n\nThis journal is my platform operating model, one record per source checklist. This record is grounded in the \"Understanding Platforms\" chapter of Gregor Hohpe's *Platform Strategy: Innovation Through Harmonization* (Leanpub, 2024) — the chapter that supplies the vocabulary everything else in this journal builds on: **what a platform is, what it is for, and the harmonize-below / differentiate-above line that separates real platforms from relabeled products**. The runnable version — the definition test, the benefits list, the four types, and the is-it-really-a-platform evaluation — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**The word \"platform\" needs a defended definition because it is the most inflated word in the building.** Every product pitch, every reorg, every budget request eventually reaches for it. Hohpe's starting move is to make the word earn its keep: a platform elevates participants and generates value through their interaction. That definition has teeth — it immediately disqualifies the shared library nobody adopted, the mandatory tool with one captive user, and the product that got a new name but no new participants. **A platform without participants is not a small platform; it is not a platform.**\n\n**The benefits list is a diagnostic, not a brochure.** Enable, democratize, self-perpetuate, accelerate, avoid unnecessary constraints — I read these as five questions to ask of any platform investment. The last one does the most work in an internal setting: it is easy to build something reusable that *forces* every team into the same solution, and the chapter is explicit that this is not a benefit but a defect. A platform that removes choice without removing work has confused its own convenience with its users' productivity.\n\n**The automotive lesson is the deepest idea in the chapter: standardization done right increases diversity.** Car makers did not standardize chassis engineering to make every car identical; they did it so the expensive, invisible engineering could be reused while the visible product line *diversified*. That inverts the intuition most engineers carry — that standardization and innovation trade off against each other. The design question is never \"standardize: yes or no\" but **\"what belongs in the harmonized platform, and what must remain variable on top?\"** Get that line wrong in one direction and nothing is reused; wrong in the other and you get badge engineering — near-identical products with superficial differences, the platform world's way of shipping the org chart.\n\n**Access is a first-class capability, not an afterthought.** Cloud platforms teach the second lesson: their value depends not only on what is inside but on how easily users can get at it — console, CLI, APIs, infrastructure-as-code. Reducing friction and cognitive load is what turns capabilities into adoption, and **how users access the platform can be as important as its capabilities**. An internal platform with powerful internals and a ticket queue for a front door fails this test daily.\n\n**The four types keep strategy conversations honest.** Marketplace, base, developer, and business capability platforms have different purposes, different participants, and different economics. The marketplace flywheel (more buyers attract more sellers, more sellers increase selection, greater selection attracts more buyers) and its chicken-or-egg problem simply do not apply to a base platform, and a developer platform's risk profile — the restrictive cloud wrapper that reduces choice — is its own. Naming the type we are building prevents us from importing the wrong success model. And because the types combine and layer, one organization will usually run several at once — which is exactly why the vocabulary matters.\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| A platform elevates participants and generates value through their interaction. | Anything reusable is a platform — a library, a shared service, or a renamed product does not qualify by default. |\n| Harmonize the expensive, undifferentiated engineering underneath. | Standardize everything — the point of harmonizing below is to *increase* variety on top. |\n| Reusable capabilities must leave room for differentiation. | Uniformity is the goal — badge engineering is the failure mode, not the target. |\n| How users access the platform matters as much as what is inside it. | Capability wins on its own — a powerful platform behind a ticket queue is a weak platform. |\n| Name which of the four types you are building, and use its economics. | The types are silos — they combine and layer, and one organization runs several. |\n| Internal platforms can later be externalized into ecosystems and revenue. | Every internal platform should be productized — externalizing adds public APIs, multi-tenancy, scale, security, and legal weight. |\n| Evaluate \"platform\" claims against the characteristics, not the label. | The word on the slide settles the question. |\n\nConcretely: any initiative in my organization that calls itself a platform can answer four questions — **who are the participants, what interaction creates the value, what is harmonized underneath, and what stays variable on top**. If the answers are \"one team, none, everything, nothing\", we rename it back to what it is and fund it honestly as a product or a shared service.\n\n![Gate-sequence diagram: a platform claim passes through four gates — participants, interaction, harmonized, variable — with a fail path looping back to product.](assets/images/understanding-platforms/four-question-platform-test.jpeg)\n**Figure 3:** *The four-question test every platform claim must pass; fail it, and the initiative goes back to being funded as a product.*\n\n## Anti-Patterns\n\n- **The relabeled product.** An existing product or service renamed \"platform\" for the budget cycle — no new participants, no new interaction, no new value.\n- **The participant-free platform.** Built to completion before anyone was elevated by it; a platform without participants provides little or no value, however elegant the internals.\n- **Badge engineering.** Standardizing so much that the \"differentiated\" products on top are near-identical with superficial differences — the platform consumed the diversity it was supposed to enable.\n- **The restrictive cloud wrapper.** A developer platform that reduces developer choice instead of increasing productivity — governance dressed up as enablement.\n- **The powerful platform behind a ticket queue.** Rich capabilities, miserable access; forgetting that reducing friction and cognitive load is platform work, not a user problem.\n- **One success model for four types.** Chasing a marketplace flywheel for a base platform, or judging a business capability platform by developer-productivity metrics.\n- **Solving the chicken-or-egg problem by decree.** Mandating adoption on both sides of a marketplace instead of making one side genuinely attractive first.\n\n## Related Records\n\n- [Strategy for Platforms](platform-strategy.html) — the strategy discipline this vocabulary feeds: once we agree what a platform is, that record governs how we decide why and where to build one.\n- [What Is Platform Engineering](what-is-platform-engineering.html) — the Fournier/Nowland case for platform engineering as a discipline; this record supplies the Hohpe-side definition it operates on.\n- [Designing Platforms](designing-platforms.html) — where the harmonized-vs-variable line drawn here becomes concrete interface and boundary decisions.\n- [Growing Platforms](growing-platforms.html) — the adoption side: how participants actually arrive, which is where the flywheel and chicken-or-egg dynamics play out.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs how the word \"platform\" is used everywhere I am the accountable executive: any initiative claiming the name is evaluated against the participant, interaction, and harmonization tests here. I revisit it if **portfolio reviews keep surfacing \"platforms\" with one consumer** (the signal that the definition has stopped being enforced), if a platform's product teams start shipping near-identical results (badge engineering showing up internally), or if a new platform type emerges in our landscape that the four-type taxonomy cannot name.\n\n## Authoritative References\n\n- Gregor Hohpe, *Platform Strategy: Innovation Through Harmonization* (Leanpub, 2024) — the \"Understanding Platforms\" chapter, whose checklist this record distills.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "4 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Understand What Makes a Platform\n\n- [ ] Explain how a platform elevates participants by letting them build on existing capabilities rather than starting from scratch\n- [ ] Remember that platforms generate value through interaction between participants\n- [ ] Explain why a platform without participants provides little or no value\n- [ ] Distinguish a true platform from something that has merely been relabeled as one\n- [ ] Explain why platform strategy is about enabling participants to benefit from the presence of others\n\n## 2. Know the Main Benefits of Platforms\n\n- [ ] Enable: make interactions or transactions easier\n- [ ] Democratize: lower barriers to participation\n- [ ] Self-perpetuate: create positive feedback loops as participation grows\n- [ ] Accelerate: remove common or repetitive work so users can focus on differentiation\n- [ ] Avoid unnecessary constraints: provide reusable capabilities without forcing every participant into the same solution\n\n## 3. Learn the Automotive Platform Lesson\n\n- [ ] Explain how automotive platforms reuse expensive underlying engineering across multiple vehicle models\n- [ ] Understand how standardization can increase — not necessarily reduce — product diversity\n- [ ] Identify what should be harmonized in the platform versus what should remain variable on top\n- [ ] Remember the danger of \"badge engineering\": near-identical products with superficial differences are not effective platform engineering\n- [ ] Explain why both the platform and the differentiated products built on top matter\n\n## 4. Understand Marketplace Platforms\n\n- [ ] Define a marketplace as a platform that connects two or more customer groups to facilitate transactions\n- [ ] Distinguish the farmer's market model from the supermarket model\n- [ ] Explain why a marketplace usually does not own the inventory being exchanged\n- [ ] Identify possible revenue sources: buyer fees, seller/listing fees, transaction fees, membership fees, advertising, or third parties\n- [ ] Explain the marketplace flywheel: more buyers attract more sellers, more sellers increase selection, and greater selection attracts more buyers\n- [ ] Recognize the chicken-or-egg problem of attracting both sides of a marketplace\n\n## 5. Understand Cloud and Base Platforms\n\n- [ ] Explain how cloud platforms remove infrastructure \"heavy lifting\"\n- [ ] Recognize that developers consume reusable infrastructure and services rather than building everything themselves\n- [ ] Understand that platform value depends not only on what is inside, but also on how easily users can access it\n- [ ] Know the main interaction methods:\n  - [ ] Web console\n  - [ ] CLI\n  - [ ] APIs\n  - [ ] Infrastructure-as-Code / automation\n- [ ] Explain why reducing user friction and cognitive load is important\n- [ ] Remember: how users access the platform can be as important as its capabilities\n\n## 6. Know the Four Technology Platform Types\n\n- [ ] Marketplace\n  - [ ] Purpose: facilitate transactions between participant groups\n  - [ ] Typical interaction: browser, mobile app, APIs\n- [ ] Base Platform\n  - [ ] Purpose: rapidly provision technical/IT resources\n  - [ ] Typical interaction: console, CLI, APIs, automation\n- [ ] Developer Platform\n  - [ ] Purpose: increase development speed, reuse, and governance\n  - [ ] Typical interaction: portals, command line, APIs\n- [ ] Business Capability Platform\n  - [ ] Purpose: expose business-domain capabilities and enable an ecosystem\n  - [ ] Typical interaction: APIs and custom integrations\n\n## 7. Understand Developer Platforms\n\n- [ ] Explain why organizations create internal developer platforms\n- [ ] Know the main goals:\n  - [ ] Reuse common IT services\n  - [ ] Improve developer productivity\n  - [ ] Support governance and operational guidelines\n  - [ ] Support the software development lifecycle\n- [ ] Recognize examples such as software delivery, runtime, and data analytics platforms\n- [ ] Understand the risk of building a restrictive cloud wrapper that reduces developer choice rather than increases productivity\n- [ ] Consider the need for internal marketing, consulting, and support for platform users\n\n## 8. Understand Business Capability Platforms\n\n- [ ] Distinguish business capabilities from general technical/developer capabilities\n- [ ] Recognize that business capability platforms reflect the organization's specific domain\n- [ ] Explain why APIs are central to exposing business capabilities\n- [ ] Understand how an internal capability can be externalized to partners or ecosystem participants\n- [ ] Consider additional requirements such as:\n  - [ ] Public APIs\n  - [ ] Multi-tenancy\n  - [ ] Scalability\n  - [ ] Data security\n  - [ ] Legal considerations\n- [ ] Explain how exposing business capabilities can create new revenue streams and market opportunities\n\n## 9. Evaluate Whether Something Is Really a Platform\n\n- [ ] Does it enable participants to gain value from one another or from reusable shared capabilities?\n- [ ] Does it reduce friction for users?\n- [ ] Does it provide meaningful choice rather than unnecessary restrictions?\n- [ ] Are users able to access its capabilities easily?\n- [ ] Does it encourage reuse while leaving room for differentiation?\n- [ ] Is the organization actually engineering a platform rather than simply renaming an existing product or service?\n- [ ] Is the balance between standardized platform capabilities and variable capabilities built on top appropriate?\n\n## 10. Remember That Platform Types Can Be Combined\n\n- [ ] Do not treat the four types as mutually exclusive\n- [ ] Recognize that marketplaces can run on base platforms\n- [ ] Recognize that developer platforms can run on cloud/base platforms\n- [ ] Recognize that internal platforms can later be externalized\n- [ ] Recognize that business capability platforms can help customers build their own marketplaces\n- [ ] Understand the layered/fractal nature of platform ecosystems\n\n## Final Review\n\n- [ ] I can define a platform in my own words\n- [ ] I can explain why participant interaction matters\n- [ ] I can describe the major benefits of platforms\n- [ ] I can explain the marketplace flywheel\n- [ ] I can distinguish marketplace, base, developer, and business capability platforms\n- [ ] I can give an example of each platform type\n- [ ] I can explain why access and user experience matter as much as platform functionality\n- [ ] I can explain the dangers of over-standardization and restrictive platforms\n- [ ] I can identify what belongs inside the platform versus what should remain variable on top\n- [ ] I can evaluate whether a proposed \"platform\" actually exhibits platform characteristics\n"}]}, {"key": "summary", "label": "Summary", "meta": {"timetoread": "2 min read"}, "blocks": [{"type": "markdown", "content": "Before anything in my organization earns the name **platform**, it passes a test: a platform **elevates participants** by letting them build on existing capabilities instead of starting from scratch, and it **generates value through interaction** — a platform without participants is worth little, and a product relabeled \"platform\" is worth nothing extra. The bar comes from the automotive industry: **harmonize the expensive, undifferentiated engineering underneath so that diversity *increases* on top** — when standardization suppresses differentiation, we have built a constraint with a fashionable name.\n\n**What changes**\n\n* Every initiative claiming the name answers four questions: **who are the participants, what interaction creates the value, what is harmonized underneath, and what stays variable on top**. If the answers are \"one team, none, everything, nothing\", it gets renamed back and funded honestly as a product or shared service.\n* The five platform benefits — **enable, democratize, self-perpetuate, accelerate, avoid unnecessary constraints** — become a diagnostic, not a brochure. The last one bites hardest internally: something reusable that forces every team into the same solution is a defect, not a benefit.\n* The harmonized-vs-variable line is the design decision that matters. Get it wrong one way and nothing is reused; wrong the other way and you get **badge engineering** — near-identical products with superficial differences, the platform eating the diversity it was meant to enable.\n* The four technology platform types — **marketplace, base, developer, business capability** — are named explicitly so each is judged by its own economics: no marketplace flywheel expectations on a base platform, no developer-productivity metrics on a business capability platform. They combine and layer; ecosystems are fractal.\n* **Access is a first-class capability.** Console, CLI, APIs, automation — how users reach the platform matters as much as what is inside it. A powerful platform behind a ticket queue is a weak platform.\n\n**What it costs**\n\n* Enforcing the definition costs comfortable labels: some current \"platforms\" lose the name, the halo, and the budget framing that came with it.\n* Holding the harmonization line is ongoing design work — deciding what belongs underneath versus on top, and re-deciding as the landscape shifts, rather than standardizing by default.\n\n**What we are not doing**\n\n* Not writing the strategy or the design mechanics — [Strategy for Platforms](platform-strategy.html) governs why and where we build platforms, [Designing Platforms](designing-platforms.html) governs interfaces and abstractions.\n* Not restating the platform-engineering discipline case — that is [What Is Platform Engineering](what-is-platform-engineering.html); this record is Hohpe's vocabulary-and-taxonomy foundation.\n* Not cataloging our internal platforms — this is the test they must pass, not the inventory.\n\n*The Article tab carries the rationale and anti-patterns; the Checklist tab holds the runnable definition test, benefits list, and is-it-really-a-platform evaluation.*\n"}]}, {"key": "dialog", "label": "Conversation", "meta": {"timetoread": "8 min listen"}, "blocks": [{"type": "markdown", "content": "## The Most Inflated Word in the Building\n\n**Ben:** Let me start with the obvious objection. Every pitch deck I have seen this year says \"platform\" somewhere on slide two. Why do you care enough about a word to write a record about it?\n\n**Ana:** Because budget follows the word. \"Platform\" is the most inflated term in the building — every product pitch, every reorg, every funding request eventually reaches for it. So this record makes the word earn its keep: a platform elevates participants by letting them build on existing capabilities instead of starting from scratch, and it generates its value through the interaction of those participants. That definition has teeth.\n\n**Ben:** Teeth how? It sounds like a definition anyone could nod along to.\n\n**Ana:** Try applying it. The shared library nobody adopted — no participants, no platform. The mandatory tool with one captive user — no interaction generating value, no platform. The product that got a new name for the budget cycle — nothing changed, so nothing extra is worth anything. A platform without participants is not a small platform; it is not a platform.\n\n**Ben:** Okay, but isn't this just semantics? A team renames its product \"platform,\" so what? The thing still does what it did yesterday.\n\n**Ana:** That is exactly the point — it still does what it did yesterday. Renaming is not platform engineering. The harm is in the funding and the expectations: platforms get evaluated on ecosystem economics, long horizons, network effects. If we grant that framing to a relabeled product, we misprice it. So the record ends in a concrete move: any initiative claiming the name answers four questions — who are the participants, what interaction creates the value, what is harmonized underneath, and what stays variable on top. Answers like \"one team, none, everything, nothing\" mean we rename it back and fund it honestly as a product or a shared service.\n\n**Ben:** Doesn't that make you the word police?\n\n**Ana:** It makes the portfolio honest. Nothing is killed by failing the test — it just gets funded as what it actually is.\n\n## Standardization That Increases Diversity\n\n**Ben:** Here is my deeper worry. Platforms mean standardization, and standardization means everything ends up looking the same. Engineers hate that, and honestly, customers do too.\n\n**Ana:** That intuition — that standardization and diversity trade off — is precisely what the automotive lesson inverts, and it is the deepest idea in the record. Car makers did not standardize chassis engineering to make every car identical. They harmonized the expensive, invisible engineering underneath so that the visible product line could *diversify*. Done right, standardization increases diversity.\n\n**Ben:** \"Done right\" is carrying a lot of weight in that sentence.\n\n**Ana:** It is, and the record names the failure mode when it goes wrong: badge engineering. Near-identical products with superficial differences — same car, different logo. That is what happens when the platform eats the differentiation it was supposed to enable. So the design question is never \"standardize: yes or no.\" It is \"what belongs in the harmonized platform, and what must remain variable on top?\" Get the line wrong in one direction and nothing is reused; wrong in the other and you have shipped uniformity with a fashionable name.\n\n**Ben:** And you would treat an internal developer platform the same way? Because most of the ones I have seen feel like constraint delivery vehicles.\n\n**Ana:** That is one of the five benefits doing diagnostic work. Enable, democratize, self-perpetuate, accelerate — and the fifth, avoid unnecessary constraints. That last one bites hardest internally. It is easy to build something reusable that forces every team into the same solution, and the record is explicit that this is not a benefit but a defect. A platform that removes choice without removing work has confused its own convenience with its users' productivity. The restrictive cloud wrapper — governance dressed up as enablement — is the canonical anti-pattern.\n\n**Ben:** So a real platform has to leave room for things you did not anticipate.\n\n**Ana:** Yes. Both layers have to matter: the platform *and* the differentiated products on top. If only the platform matters, you built a mandate. If only the products matter, you built nothing.\n\n## Four Types, Four Economics\n\n**Ben:** You also insist on a taxonomy — marketplace, base, developer, business capability. Taxonomies are where conference talks go to die. Why does naming the type matter?\n\n**Ana:** Because each type has different participants, different interactions, and different economics — and importing the wrong success model is how platform investments get judged into the ground. The marketplace flywheel — more buyers attract more sellers, more sellers increase selection, greater selection attracts more buyers — simply does not apply to a base platform that provisions infrastructure. And judging a business capability platform by developer-productivity metrics misses what it exists for.\n\n**Ben:** Give me the failure that framing prevents.\n\n**Ana:** Two, actually. One: chasing a marketplace flywheel for an internal developer platform, then declaring failure when no flywheel spins. Two: the decree — mandating adoption on both sides of a marketplace instead of making one side genuinely attractive first. The chicken-or-egg problem is real for marketplaces; solving it by mandate just produces two captive, resentful sides. Knowing which type you are building tells you which problems are actually yours.\n\n**Ben:** But real systems will not sit in one box.\n\n**Ana:** They do not, and the record says so: the types are lenses, not boxes. Marketplaces run on base platforms, developer platforms run on clouds, internal platforms get externalized, business capability platforms help customers build their own marketplaces. Platform ecosystems are layered and fractal — one organization usually runs several types at once, which is exactly why the vocabulary matters.\n\n**Ben:** One thing in the record surprised me: you spend real ink on access — consoles, CLIs, APIs. That feels like implementation detail for a definitions record.\n\n**Ana:** It is the cloud platforms' second lesson, and it is first-class: platform value depends not only on what is inside but on how easily users can get at it. Reducing friction and cognitive load is what turns capabilities into adoption. The anti-pattern is the powerful platform behind a ticket queue — rich internals, miserable front door. It fails the elevation test daily, no matter how good the engineering is.\n\n## What This Record Does Not Do\n\n**Ben:** Close it out. What is this record explicitly *not* claiming? Because \"everything must pass my test\" can read as empire building.\n\n**Ana:** Four boundaries. It is not the strategy — why and where we build platforms is [Strategy for Platforms](platform-strategy.html), which sits directly on this vocabulary. It is not the design mechanics — interfaces, boundaries, and abstractions live in [Designing Platforms](designing-platforms.html); this record only draws the harmonized-versus-variable line. It is not the case for platform engineering as a discipline — that is [What Is Platform Engineering](what-is-platform-engineering.html), the Fournier and Nowland side; this is Hohpe's foundation. And it is not an inventory of our internal platforms — it is the test they must pass, not the catalog.\n\n**Ben:** And what would make you reopen it?\n\n**Ana:** Three signals. Portfolio reviews that keep surfacing \"platforms\" with one consumer — that means the definition has stopped being enforced. Product teams on top of a platform shipping near-identical results — badge engineering showing up internally. Or a platform type in our landscape the four-type taxonomy cannot name. Until then, the test stands: participants, interaction, harmonized underneath, variable on top. How they actually arrive — the flywheel, the adoption dynamics — that story continues in [Growing Platforms](growing-platforms.html).\n\n**Ben:** So the one-sentence version?\n\n**Ana:** Harmonize below the line, differentiate above it — and no initiative gets to call itself a platform until it shows me the participants.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why \"platform\" is a test to pass, not a label to claim — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. KAI: a hands-on platform engineering lead, short dark hair, gray zip-up hoodie with a small gear pin, laptop covered in infrastructure stickers under one arm, a coil of cable slung over the shoulder.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and teal accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Vera and Kai look at a wall of pitch slides all stamped PLATFORM while Vera taps one skeptically.](assets/images/understanding-platforms/comic-01-the-inflated-word.jpeg)\n**Panel 1:** *The hook: every pitch, reorg, and budget request eventually reaches for the word 'platform'.*\n\n![Comic panel: Kai sticks a PLATFORM sticker over a PRODUCT label on a lone box in an empty room.](assets/images/understanding-platforms/comic-02-the-relabeled-product.jpeg)\n**Panel 2:** *The problem: a product relabeled 'platform' is worth nothing extra — and a platform without participants is not a platform.*\n\n![Comic panel: an assembly line of identical cars distinguished only by tiny badges, inspected by Vera with a magnifying glass.](assets/images/understanding-platforms/comic-03-badge-engineering.jpeg)\n**Panel 3:** *The wrong way: badge engineering — standardize so much that the 'differentiated' products on top are near-identical.*\n\n![Comic panel: Vera shows one shared chassis layer supporting many visibly different vehicles while Kai looks on.](assets/images/understanding-platforms/comic-04-harmonize-below-vary-above.jpeg)\n**Panel 4:** *The principle: harmonize the expensive, undifferentiated engineering underneath so diversity increases on top.*\n\n![Comic panel: Kai at a whiteboard with four simple icons while Vera holds up four fingers.](assets/images/understanding-platforms/comic-05-the-four-questions.jpeg)\n**Panel 5:** *How it plays out: who are the participants, what interaction creates the value, what is harmonized underneath, what stays variable on top.*\n\n![Comic panel: a powerful machine room behind glass, reachable only through a tiny TICKETS window with a long queue of developers.](assets/images/understanding-platforms/comic-06-the-ticket-queue-door.jpeg)\n**Panel 6:** *The access test: a powerful platform behind a ticket queue is a weak platform — reducing friction and cognitive load is platform work, not a user problem.*\n\n![Comic panel: Kai adjusts a wall slider between scattered parts on one end and identical clone cars on the other while Vera watches.](assets/images/understanding-platforms/comic-07-where-the-line-goes.jpeg)\n**Panel 7:** *The trade-off: get the harmonization line wrong one way and nothing is reused; wrong the other way and you get badge engineering.*\n\n![Comic panel: Vera peels the PLATFORM sticker off the box to reveal PRODUCT and hands Kai a budget folder.](assets/images/understanding-platforms/comic-08-fund-it-honestly.jpeg)\n**Panel 8:** *The closer: if the answers are 'one team, none, everything, nothing' — rename it back and fund it honestly as a product.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
