ion, HTTPS remediation,\n      checks before production) (§5); production-ready defaults enabled\n      rather than hidden as optional features (§13).\n- [x] **Environments survive** — preview environments with auto-generated\n      PR URLs; full-stack local development with debugging; local/preview\n      parity (env-var names, service discovery, sample data); documented\n      when and how to use each; local setup a first-class capability;\n      preview TTLs to control cost (§7).\n- [x] **Observability by default survives** — metrics, logs, and traces via\n      vendor-neutral instrumentation (OpenTelemetry); automatic collection;\n      trace and metric export verified visible; HTTP and database\n      telemetry; custom spans/metrics; span attributes and recorded\n      exceptions; cross-service propagation (§8); structured logs with\n      timestamps, levels, meaningful messages, injected trace/span IDs, and\n      verified log-to-trace navigation (§9).\n- [x] **Access and HTTPS survive** — declarative public access hiding\n      ingress, gateway, and routing complexity; auto-provisioned ingress,\n      DNS, and routing rules; team-chosen subdomains (§10); HTTPS as the\n      path of least resistance: automated certificate provisioning,\n      management (e.g. cert-manager), ACME integration, renewal, secure\n      storage, expiry monitoring, never a developer-facing incident (§11).\n- [x] **The failure experience survives** — realistic failures triggered;\n      errors understandable without deep Kubernetes knowledge; infrastructure\n      errors translated with remediation guidance at the point of failure —\n      error messages as documentation at the point of need (§12); rollback\n      self-service, discoverable, tested, and ticket-free; autoscaling\n      verified under significant traffic (§13).\n- [x] **Paved paths are validated** — service templates with pre-configured\n      CI/CD, health checks, metrics endpoints, and security scanning;\n      organizational best practices encoded; no manual recreation of common\n      patterns; templates used to accelerate new-developer onboarding (§14).\n- [x] **The fresh-eyes test survives** — a developer unfamiliar with the\n      platform completes the workflow without handholding; delight,\n      confusion, and friction recorded; steps requiring infrastructure\n      knowledge, another team, or manual configuration identified; secure\n      defaults, immediate observability value, and safe recovery from\n      mistakes verified (§15).\n- [x] **The final bar survives** — the source's closing success criteria\n      (code to production with minimal manual effort, velocity balanced with\n      governance, security built in, observability by default, automatic\n      HTTPS and safe networking, supported local and preview environments,\n      self-served failure recovery, complexity behind declarative\n      interfaces, DevEx measured not assumed, continuously falling cognitive\n      load) are reproduced in the checklist.\n- [x] **Tools are the worked example, not the mandate** — the reference\n      stack (CircleCI, Flux, Backstage, OpenTelemetry, Prometheus/Grafana,\n      cert-manager, Istio) is named honestly, but every commitment is stated\n      at the capability level.\n- [x] **Credit is explicit** — References name the *Platform Engineer's\n      Handbook* and its Developer Experience Evaluation chapter checklist.\n\n## Non-goals\n\n- Not [CI/CD as a Platform Service](cicd-as-a-platform-service.html) — that record builds the pipeline as a\n  platform service; this one evaluates the developer's experience of the\n  journey the pipeline enables, end to end.\n- Not [Observability Implementation](observability-implementation.html) — the platform observability stack is\n  built there; here observability appears only as what every deployed\n  application must get by default, and as one lens of the evaluation.\n- Not [End-to-End Platform Security](platform-security.html) — end-to-end platform hardening lives there;\n  here security appears as the checks a developer's deployment passes\n  through without noticing.\n- Not [Starter Kit Templates](starter-kits.html) — template mechanics and contents live there; here\n  templates are validated from the developer's seat as paved paths that\n  actually pave.\n- Not [Self-Service Platform Onboarding](self-service-onboarding.html) — the day-zero onboarding flow is its own\n  record; the fresh-eyes evaluation here tests the workflow, not the\n  sign-up.\n- Not [What Platform Success Looks Like](platform-success.html) — organization-level success measures live\n  there; this record is the hands-on evaluation loop for one platform\n  build.\n\n## Modalities\n\nThe working tool ships as the checklist modality (`checklist.md`, rendered\nas the Checklist tab).\n\n- [x] `checklist.md` — operational checklist\n- [x] `summary.md` — management summary\n- [x] `dialog.md` — two-host dialog\n- [x] `comics.md` — explainer comic\n\n## Open questions\n\n- None.\n\n## Decision log\n\n- **2026-08-20** — Grounded in the Developer Experience Evaluation chapter\n  checklist of the *Platform Engineer's Handbook* — the build-it-end-to-end\n  companion whose reference stack (Pulumi, CircleCI, Flux, Istio, Backstage,\n  OpenTelemetry, cert-manager) this journal's Reference Implementation\n  section follows — read through a practitioner-executive lens, as with\n  every record in this journal.\n- **2026-08-20** — Framed as an evaluation loop rather than a feature list:\n  the chapter's distinctive move is baseline → improve → re-measure with a\n  fresh developer as the final examiner, so the record commits to the loop\n  and to capability-level outcomes; the named tools stay a worked example,\n  never a mandate. A pure capability-inventory framing was rejected — it\n  would duplicate the sibling build records and lose the measurement\n  discipline that makes this chapter distinct.\n\n## Sources\n\n- **Internal**\n  - `so         // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);

            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {

                        i++;
                    }
                    i++;

                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                }

                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {

                        i++;

                    });
                    html += '</tr></thead><tbody>';

                        r.forEach(c => {

                    const isOrdered = ordered.test(line);

                    while (i < lines.length) {

                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;

                        const mOrd = cur.match(ordered);

                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
