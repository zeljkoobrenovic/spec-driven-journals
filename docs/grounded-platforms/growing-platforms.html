<script id="data" type="application/json">{"meta": {"id": "PLT-GROWING-PLATFORMS", "status": "draft:gray", "title": "Growing Platforms", "date": "2026-08-12", "author": "Željko Obrenović", "permalink": "growing-platforms", "timetoread": "6 min", "excerpt": "I measure platform growth in adoption, not in features. A platform grows along three dimensions — reach, breadth, and depth — and I balance them instead of maxing one; it moves through a product lifecycle of Explore, Expand, and Extract; and its fate is set in a new user's first hour. The roadmap protects cohesion by triaging every request on business impact and strategy fit, and tiers and slices give smaller customers an appropriately sized way in — because an internal platform nobody is forced to use lives or dies on voluntary adoption.", "tags": "platform strategy, platform adoption, product lifecycle, developer experience, roadmap, platform growth, tiering", "icon": "assets/icons/growing-platforms.png", "logo": "assets/images/growing-platforms/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["platform strategy", "platform adoption", "product lifecycle", "developer experience", "roadmap", "platform growth", "tiering"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: A platform grows **adoption**, not merely functionality. It grows along three dimensions — reach, breadth, and depth — and I balance them rather than maxing one, because the perfect platform for one customer is a failed platform for everyone else. Growth follows a product lifecycle — Explore, Expand, Extract — and is decided in the new user's first hour: minimize the initial cliff, and keep simple tasks easy and complex tasks possible. The roadmap protects cohesion by triaging every request on business impact and strategy fit, and the platform scales **down** through tiers and slices as deliberately as it scales up. An internal platform nobody is forced to use lives or dies on voluntary adoption — so growth is a product discipline, not a feature race.\n\n## Statement\n\nMy operating model for growing platforms:\n\n- **Adoption is the growth metric.** We identify the target users and addressable market, grow iteratively on real user feedback, prefer cohesion over accumulating features, and make trade-offs and priorities visible to users. Feature count is an input; adoption is the result.\n- **Three dimensions, kept in balance.** Market reach (which user groups, geographies, and business units adopt), platform breadth (does it cover the right portions of the problem space), and platform depth (are key capabilities complete, integrated, automated, and polished). Optimizing any one dimension while the others starve is how platforms fail — including building the \"perfect\" platform for one customer before gaining broader adoption.\n- **The lifecycle sets the mode.** **Explore**: test hypotheses with inexpensive experiments and validate that users actually *value* the platform, not merely that the technology works. **Expand**: remove adoption obstacles — better self-service, less manual support, high-quality documentation. **Extract**: with adoption established, improve the economics and benefit from scale. Between phases, we reassess whether the team, skills, or leadership need to change.\n- **The on-ramp is a first-class feature.** We evaluate the platform from a new user's perspective, measure the initial learning effort, minimize the cliff, build on familiar concepts, default the complicated parameters, and give useful feedback on failure. Simple tasks stay easy, complex tasks stay possible, gear-shifts between them are painless, and escape hatches exist when platform constraints are reached.\n- **The roadmap is a triage function.** Every request is evaluated on **business impact** and **roadmap fit**: prioritize high-impact fits, investigate high-impact challenges to the strategy, backlog low-impact fits by capacity, and decline low-impact misfits — explaining the principles behind the decline. We publish a credible roadmap, approach users with hypotheses rather than feature polls, and remember that existing users are a biased sample.\n- **Scale down as deliberately as up.** Vertical tiers for different operational-quality levels and horizontal slices for customers who do not need the whole platform — each defined around a clear use case, with trade-offs communicated and the underlying assets kept shared.\n\n![Three-axis diagram of platform growth - reach, breadth, depth - comparing a balanced growth triangle with a lopsided one-axis spike.](assets/images/growing-platforms/three-growth-dimensions.jpeg)\n**Figure 1:** *Three growth dimensions: reach, breadth, and depth grow together — a spike on one axis while the others starve is how platforms fail.*\n\n## How to Read This\n\nThis journal is my platform operating model, one record per source checklist. This record is grounded in the \"Growing Platforms\" chapter of Gregor Hohpe's *Platform Strategy: Innovation Through Harmonization* (Leanpub, 2024) — the chapter about evolving a platform from first users to established scale, distilled here into **the adoption-first growth discipline I hold platform roadmaps to**. The runnable version — growth dimensions, lifecycle, on-ramp, visualization, roadmap triage, metrics, tiering, and the final review — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**Voluntary adoption is the only honest signal a platform gets.** An internal platform can usually be mandated, but a mandated platform learns nothing: usage numbers say \"compliance,\" not \"value.\" Hohpe's Explore-phase test is the one I insist on — validate whether users actually *value* the platform, not merely whether the technology works. That is also why the growth metric is adoption rather than functionality: **features are what we spend; adoption is what we earn**, and a roadmap that celebrates shipped capabilities while usage stays flat is a platform in denial.\n\n**Reach, breadth, and depth starve each other when one is maximized.** Every platform team feels the pull of its loudest customer: add the sophisticated depth that one segment demands, and the platform becomes expensive and confusing for everyone else; chase breadth, and quality and cohesion dilute; chase reach with a shallow product, and early adopters churn. The failure Hohpe names — building the perfect platform for one customer before gaining broader adoption — is the most common one I have seen, because it feels like customer obsession while it quietly converts a platform team into **a professional-services team for one account**.\n\n**The first hour decides more than the feature list.** A prospective user who hits a wall of unfamiliar concepts, long parameter lists, and silent failures does not file a feature request — they go back to what they know. So the on-ramp is engineering work, not marketing: minimize the initial cliff, build on concepts users already know, default what can be defaulted, template the common cases, and give useful feedback when actions fail. And the curve must stay smooth after the first hour: a **hockey-stick experience** — simple tasks easy, slightly advanced needs dramatically harder — loses users precisely when they were becoming committed. Programmatic interfaces, painless gear-shifts, and escape hatches are what keep the growth curve from snapping at the first advanced use case.\n\n**Saying no is how the roadmap protects the product.** A platform that accepts every request stops being a product and becomes an accumulation. The impact-times-fit triage gives me a defensible way to decline: low-impact requests that do not align with the platform's direction are refused, **with the principles explained** — because an unexplained \"no\" spends trust, while a principled one builds it. High-impact requests that challenge the strategy get investigated rather than reflexively accepted or refused; extensions and plug-ins carry needs that should not enter the core; and requests are reviewed across the whole platform before functionality is duplicated. A published, credible roadmap turns all of this from private judgment into a visible contract.\n\n![Two-by-two triage matrix of business impact versus roadmap fit with quadrants labeled prioritize, investigate, backlog, and decline with explanation.](assets/images/growing-platforms/impact-fit-triage-matrix.jpeg)\n**Figure 2:** *Roadmap triage: every request lands in an impact × fit quadrant — prioritize, investigate, backlog, or decline with the principle explained.*\n\n**Existing users are a biased sample.** The people already on the platform are, by definition, the people the platform already fits. Optimizing purely on their feedback deepens the platform for the converted while the unconverted — the actual growth frontier — stay invisible. That is why we approach users with hypotheses and options rather than asking what features they want, measure outcomes and customer experience rather than platform activity, and deliberately study the needs of **non-users** before declaring the roadmap demand-driven.\n\n**Scaling down is a growth strategy.** Not every customer needs — or can afford — the full platform, and forcing the whole offering on small workloads is an adoption tax. Vertical tiers let performance, security, and scalability vary independently for different budgets; horizontal slices serve customers who need only part of the platform; and keeping the underlying assets shared prevents the tiers from becoming forks. Done well, tiering and slicing create **a smoother entry point for customers who may grow later** — which is exactly what an adoption-first strategy wants.\n\n![Diagram of one platform rectangle on a shared-assets foundation, divided into tiers and slices, with small, medium, and large customers taking differently sized portions.](assets/images/growing-platforms/tiers-and-slices.jpeg)\n**Figure 3:** *Scaling down deliberately: vertical tiers and horizontal slices on shared assets — every customer gets an appropriately sized offering, and nobody gets a fork.*\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| Growth is measured in adoption and user outcomes. | Growth is measured in shipped features — activity metrics flatter the team while the platform stalls. |\n| Reach, breadth, and depth are balanced deliberately. | Depth for the most demanding customer comes first — that is the professional-services trap. |\n| The Explore phase validates that users value the platform. | A working prototype proves the platform — technology working and users caring are different tests. |\n| The new-user on-ramp is engineered: low cliff, defaults, templates, useful errors. | Onboarding pain is acceptable because the platform is powerful — the powerful platform nobody starts using grows nothing. |\n| Requests are triaged on business impact and roadmap fit, and declines are explained. | The platform team builds what the loudest customer asks — every request accepted is cohesion spent. |\n| Existing users inform the roadmap; non-users define the frontier. | User feedback alone steers growth — the sample is biased toward the already-converted. |\n| Tiers and slices give smaller customers an appropriately sized offering on shared assets. | Every customer gets the full platform or nothing — and duplicated per-tier stacks are fine. |\n\nConcretely: our platform roadmap is published and names its trade-offs; every request in the intake queue carries an impact and fit assessment, and declined requests reference the principle that declined them; we measure time-to-first-useful-result for new users and treat regressions as bugs; and each lifecycle phase transition triggers an explicit conversation about whether the team and its leadership still match the phase.\n\n## Anti-Patterns\n\n- **The feature-count victory lap.** Reporting platform growth in shipped capabilities while adoption stays flat — spending without earning.\n- **The perfect platform for one customer.** Deep, polished, and adored by a single team — and irrelevant, expensive, or intimidating to every other potential adopter.\n- **The professional-services drift.** The platform team gradually becomes a bespoke delivery arm for its biggest customer, one accepted request at a time.\n- **The hockey-stick on-ramp.** Demos beautifully, handles the tutorial case in minutes — then the first slightly advanced need requires a week and an expert.\n- **The feature poll.** Roadmapping by asking existing users what they want, which optimizes for the converted and never discovers why non-users stay away.\n- **The unexplained no.** Declining requests without stating the principle, converting a defensible product decision into perceived arrogance.\n- **The everything-or-nothing offering.** No tiers, no slices — small teams must swallow the full platform's cost and complexity, so they never start.\n- **Big-bang completeness.** Attempting to finish the entire platform before real users touch it, forfeiting the feedback that iterations exist to capture.\n\n## Related Records\n\n- [Platform as a Product](platform-as-a-product.html) — the product operating mode for platform teams; this record is the growth discipline that mode makes possible.\n- [Strategy for Platforms](platform-strategy.html) — the strategy the roadmap-fit test evaluates requests against; without it, triage collapses into taste.\n- [Implementing Platforms](implementing-platforms.html) — the machinery behind self-service and low cognitive load; the on-ramp this record demands is built there.\n- [What Platform Success Looks Like](platform-success.html) — what success looks like once growth works; the adoption and outcome measures here feed that definition.\n- [Understanding Platforms](understanding-platforms.html) — the harmonization-over-standardization frame; voluntary adoption is that frame applied to growth.\n\n## Scope and Revisiting\n\nThis record is `draft`. It governs how we grow internal platforms everywhere I am the accountable executive — the roadmap process, the adoption metrics, and the lifecycle-phase reviews for every platform we run. I revisit it if adoption plateaus while the feature list keeps growing (the signal we are optimizing the wrong dimension), if the platform team's calendar shows it operating as a delivery arm for a single customer, or if new-user time-to-first-useful-result trends up across two consecutive quarters.\n\n## Authoritative References\n\n- Gregor Hohpe, *Platform Strategy: Innovation Through Harmonization* (Leanpub, 2024) — the \"Growing Platforms\" chapter, whose checklist this record distills.\n"}]}, {"key": "summary", "label": "TL;DR", "meta": {"timetoread": "2 min read"}, "blocks": [{"type": "markdown", "content": "A platform grows **adoption**, not merely functionality — and an internal platform nobody is forced to use lives or dies on voluntary adoption, so growth is a product discipline, not a feature race. Growth runs along three balanced dimensions — reach, breadth, and depth — through a product lifecycle of Explore, Expand, and Extract, and it is largely decided in the new user's first hour.\n\n**What changes**\n\n* Adoption becomes the growth metric. Features are what we spend; adoption is what we earn — a roadmap celebrating shipped capabilities while usage stays flat is a platform in denial.\n* Reach (who adopts), breadth (how much of the problem space is covered), and depth (how complete and polished the key capabilities are) are balanced deliberately. Building the perfect platform for one customer before broader adoption is the named failure mode.\n* Each lifecycle phase gets its own test: Explore validates that users *value* the platform, not merely that the technology works; Expand removes adoption obstacles through self-service and documentation; Extract improves the economics at scale. Phase transitions trigger an explicit check on whether team, skills, and leadership still fit.\n* The on-ramp is engineered as a first-class feature: minimize the initial cliff, build on familiar concepts, default the complicated parameters, give useful feedback on failure — and avoid the hockey-stick experience where simple tasks are easy but the first advanced need takes a week and an expert.\n* Every request is triaged on business impact × roadmap fit: prioritize, investigate, backlog, or decline — with the principles behind a decline explained, because an unexplained \"no\" spends trust. The roadmap is published and credible.\n* We scale **down** as deliberately as up: vertical tiers and horizontal slices on shared assets give smaller customers an appropriately sized way in without forking the platform.\n\n**What it costs**\n\n* Saying no to real customers, repeatedly and in writing — cohesion is bought with declined requests.\n* Studying non-users, not just the biased sample of existing users, before calling the roadmap demand-driven.\n* Measuring time-to-first-useful-result and treating regressions as bugs — on-ramp work that never shows up in a feature list.\n\n**What we are not doing**\n\n* Not the product operating mode itself — that is [Platform as a Product](platform-as-a-product.html); this record is the growth discipline inside it.\n* Not the self-service machinery — the on-ramp this record demands is built in [Implementing Platforms](implementing-platforms.html); what success ultimately looks like lives in [What Platform Success Looks Like](platform-success.html).\n* Not a mandate policy — the record's whole premise is voluntary adoption; forcing adoption by decree is out of scope.\n\n*The Article tab carries the rationale and anti-patterns; the Checklist tab holds the runnable growth-dimension, lifecycle, on-ramp, and roadmap-triage checks.*\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "4 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Platform Evolution\n\n- [ ] Identify the platform's target users and addressable market\n- [ ] Assess market reach: which user groups, geographies, or business units should adopt the platform?\n- [ ] Assess platform breadth: does the platform cover the right portions of the problem space?\n- [ ] Assess platform depth: are key capabilities sufficiently complete, integrated, automated, and polished?\n- [ ] Balance reach, breadth, and depth rather than optimizing only one\n- [ ] Avoid building the \"perfect\" platform for one customer before gaining broader adoption\n- [ ] Grow the platform iteratively using real user feedback\n- [ ] Prefer cohesion over simply accumulating more features\n- [ ] Make platform trade-offs and priorities visible to users\n\n## 2. Product Lifecycle\n\n- [ ] **Explore:** test hypotheses with inexpensive experiments\n- [ ] Validate whether users actually value the platform — not merely whether the technology works\n- [ ] **Expand:** remove obstacles preventing more users from adopting the platform\n- [ ] Improve self-service capabilities\n- [ ] Reduce dependence on manual or in-person support\n- [ ] Provide high-quality documentation\n- [ ] **Extract:** once adoption is established, improve the platform's economics and benefit from economies of scale\n- [ ] Reassess whether the team, skills, or leadership need to change between lifecycle phases\n\n## 3. Avoid Growth Pitfalls\n\n- [ ] Avoid excessive up-front development before users interact with the platform\n- [ ] Get real users involved early enough to generate useful feedback\n- [ ] Avoid adding every feature requested by prospective users\n- [ ] Check whether expanding breadth will dilute quality or cohesion\n- [ ] Avoid adding sophisticated depth that benefits only a narrow customer segment\n- [ ] Consider the cognitive load that advanced features create for everyone else\n- [ ] Develop in iterations rather than attempting to complete the entire platform at once\n\n## 4. User Experience & On-Ramp\n\n- [ ] Evaluate the platform from a new user's perspective\n- [ ] Measure the initial learning effort required to achieve something useful\n- [ ] Minimize the initial cliff that can discourage new adopters\n- [ ] Build on concepts and tools that are already familiar to potential users, where practical\n- [ ] Supply sensible defaults for complicated or rarely used parameters\n- [ ] Provide templates for common use cases\n- [ ] Provide documentation and self-guided training\n- [ ] Give users useful feedback when their actions fail\n- [ ] Make simple tasks easy while keeping complex tasks possible\n- [ ] Check for a hockey-stick experience where simple tasks are easy but slightly more advanced needs become dramatically harder\n- [ ] Provide programmatic interfaces when graphical interfaces will not scale to advanced development needs\n- [ ] Where users must \"shift gears,\" make transitions between approaches as painless as possible\n- [ ] Provide migration or escape-hatch mechanisms when platform constraints are reached\n\n## 5. Platform Visualization\n\n- [ ] Clearly show what the platform provides versus what the user/project must provide\n- [ ] Visualize the onboarding process and responsibilities when several teams are involved\n- [ ] Use capability maps to communicate scope, but do not rely on them alone\n- [ ] Use lifecycle maps when capabilities need to be understood across development, build, test, deployment, and operations\n- [ ] Show dependencies between platform components\n- [ ] Show mandatory, replaceable, and extensible components\n- [ ] Clarify ownership, provisioning, and operational responsibilities\n- [ ] Show connectivity and data flows where they are important\n- [ ] Make extension points visible\n- [ ] Use visual differences only where meaningful differences actually exist\n- [ ] Design diagrams so the overall message is obvious first and details emerge afterward\n- [ ] Explain the architecture before introducing individual products or vendor services\n\n## 6. Platform Roadmap\n\n- [ ] Maintain a clear product vision\n- [ ] Evaluate requests against both business impact and roadmap fit\n- [ ] Prioritize high-impact requests that already fit the strategy\n- [ ] Investigate high-impact requests that challenge the current strategy\n- [ ] Add lower-impact, strategy-aligned requests to the backlog according to capacity\n- [ ] Decline low-impact requests that do not align with the platform's direction\n- [ ] Explain the principles behind declined requests\n- [ ] Avoid turning the platform team into a professional services team for one customer\n- [ ] Consider extensions, plug-ins, or separate projects for needs that should not enter the platform core\n- [ ] Review requests across the whole platform before duplicating functionality\n- [ ] Approach users with hypotheses and options rather than simply asking what features they want\n- [ ] Remember that existing users are a biased sample; consider the needs of non-users too\n- [ ] Publish a credible roadmap so users understand the platform's direction and trade-offs\n\n## 7. Metrics & Adaptation\n\n- [ ] Track adoption and usage patterns\n- [ ] Measure outcomes and customer experience — not only platform activity\n- [ ] Use telemetry to understand platform reliability and stability\n- [ ] Look for shifts in user behavior that may create new platform needs\n- [ ] Monitor relevant external technology changes\n- [ ] Evaluate trends against the platform strategy before reacting to them\n- [ ] Avoid chasing every new technology trend\n- [ ] Revisit the roadmap regularly as technology, users, and organizational needs evolve\n\n## 8. Tiering & Slicing\n\n- [ ] Identify customer groups with different budgets, scale, security, or performance requirements\n- [ ] Check whether the platform can scale down, not merely scale up\n- [ ] Support experiments and development environments where full production capabilities are unnecessary\n- [ ] Support small or gradually growing applications as well as large workloads\n- [ ] Create vertical tiers for different levels of operational qualities where useful\n- [ ] Allow dimensions such as performance, security, and scalability to vary independently when appropriate\n- [ ] Create horizontal slices/modules when customers do not need the whole platform\n- [ ] Consider offering both individual services and preconfigured integrated packages\n- [ ] Keep the underlying platform assets shared to avoid unnecessary duplication\n- [ ] Define each tier or slice around a clear use case\n- [ ] Communicate the trade-offs between tiers clearly\n- [ ] Use tiering and slicing to create a smoother entry point for customers who may grow later\n\n## Final Review\n\n- [ ] Are we growing adoption, not merely functionality?\n- [ ] Are real users shaping platform evolution?\n- [ ] Is the platform easy enough to start with?\n- [ ] Can it continue supporting users as their needs become more complex?\n- [ ] Are platform and user responsibilities clear?\n- [ ] Does the roadmap protect product cohesion while remaining responsive?\n- [ ] Can different customer segments consume an appropriately sized offering?\n- [ ] Are our decisions and trade-offs transparent?\n"}]}, {"key": "dialog", "label": "Conversation", "meta": {"timetoread": "8 min listen"}, "blocks": [{"type": "markdown", "content": "## Features Are Spend, Adoption Is Earnings\n\n**Ben:** Blunt version first. Our platform team shipped forty capabilities this year. That's growth, right? Why do I need a \"growth model\" beyond a healthy release cadence?\n\n**Ana:** Because a platform grows adoption, not functionality — and those forty capabilities tell me nothing until you show me the usage curve. Features are what we spend; adoption is what we earn. A roadmap that celebrates shipped capabilities while usage stays flat is a platform in denial. That's the feature-count victory lap, and it's the first anti-pattern in the record.\n\n**Ben:** Harsh. But internal platforms aren't consumer apps — you can just mandate usage and skip the whole adoption game.\n\n**Ana:** You can, and then you've blinded yourself. A mandated platform learns nothing: the usage numbers say \"compliance,\" not \"value.\" Voluntary adoption is the only honest signal a platform gets — which is why the record's premise is voluntary adoption throughout, and why mandate policy is explicitly out of scope. It's [Understanding Platforms](understanding-platforms.html)' harmonization-over-standardization frame, applied to growth.\n\n**Ben:** So if adoption is the metric, what are the levers?\n\n**Ana:** Three dimensions, kept in balance. Reach — which user groups, business units, geographies actually adopt. Breadth — whether the platform covers the right portions of the problem space. Depth — whether the key capabilities are complete, integrated, automated, polished. The discipline is balancing them, because maximizing any one while the others starve is how platforms fail.\n\n## The Perfect Platform for One Customer\n\n**Ben:** Let me defend the depth-first strategy, because every platform team I know runs it. Your biggest customer has sophisticated needs. Serve them brilliantly, and the reference case sells the platform to everyone else.\n\n**Ana:** That's the most seductive failure in the chapter, and the most common one I've seen: building the perfect platform for one customer before gaining broader adoption. It feels like customer obsession. What it actually does is quietly convert the platform team into a professional-services team for one account — and make the platform expensive, confusing, or intimidating for every other potential adopter.\n\n**Ben:** So you'd tell that big customer no?\n\n**Ana:** I'd tell them a principled no or a scoped yes, through triage — we'll get there. But first the lifecycle, because \"which dimension gets investment\" depends on the phase. Explore: cheap experiments testing whether users actually *value* the platform — not whether the technology works; those are different tests, and passing the second while failing the first is how prototypes get promoted into failures. Expand: remove adoption obstacles — better self-service, less manual support, high-quality documentation. Extract: adoption is established, improve the economics, benefit from scale.\n\n**Ben:** And the team just rides along through all three phases?\n\n**Ana:** No — that's the overlooked item. Between phases we explicitly reassess whether the team, its skills, and its leadership still match the phase. The people who excel at exploring are not automatically the people who excel at extracting. Skipping that conversation is how a platform outgrows its own leadership without anyone deciding anything.\n\n## The First Hour\n\n**Ben:** You claim a platform's fate is set in the new user's first hour. That's marketing-speak for \"make a nice tutorial,\" no?\n\n**Ana:** It's engineering work, not marketing. A prospective user who hits a wall of unfamiliar concepts, long parameter lists, and silent failures doesn't file a feature request — they go back to what they know, and you never hear about it. So the on-ramp is a first-class feature: measure the initial learning effort, minimize the cliff, build on concepts users already know, default the complicated parameters, template the common cases, and give useful feedback when things fail.\n\n**Ben:** Fine, but powerful tools have learning curves. Some onboarding pain is the price of capability.\n\n**Ana:** The powerful platform nobody starts using grows nothing — that's the direct answer. And the record's sharper point is about what happens *after* the first hour: the hockey-stick experience. Demos beautifully, tutorial case works in minutes — then the first slightly advanced need requires a week and an expert. That curve loses users at the worst possible moment, precisely when they were becoming committed.\n\n**Ben:** What flattens the hockey stick?\n\n**Ana:** Simple tasks easy, complex tasks possible, and painless gear-shifts between them — plus escape hatches for when platform constraints are genuinely reached. Most of that machinery — the defaults, the templates, the abstractions that actually reduce cognitive load — is built in [Implementing Platforms](implementing-platforms.html). This record is what makes that machinery a growth strategy: we measure time-to-first-useful-result for new users and treat regressions as bugs.\n\n## Triage, and the Biased Sample\n\n**Ben:** Now the roadmap. \"Triage function\" sounds like a bureaucratic way of ignoring customers.\n\n**Ana:** It's the opposite of ignoring — it's evaluating every request on two axes: business impact and roadmap fit. High-impact requests that fit get prioritized. Low-impact fits go to the backlog by capacity. And here's the interesting quadrant: high-impact requests that *challenge* the strategy get investigated — neither reflexively accepted nor reflexively refused, because they might be telling you the strategy is wrong. That fit test only works because there's a [Strategy for Platforms](platform-strategy.html) to test against — without it, triage collapses into taste.\n\n**Ben:** And the low-impact misfits?\n\n**Ana:** Declined — with the principles explained. That clause carries the whole system. An unexplained no spends trust; a principled no builds it, because the customer learns how the platform decides, not just what it decided. Do that against a published, credible roadmap and the whole thing turns from private judgment into a visible contract.\n\n**Ben:** Still, \"listen to your users\" is product management 101. Why all the hedging about feedback?\n\n**Ana:** Because existing users are a biased sample — that's the trap in 101. The people already on the platform are, by definition, the people the platform already fits. Roadmap by feature poll optimizes for the converted and never discovers why non-users stay away — and the non-users are the actual growth frontier. So we approach users with hypotheses and options rather than polls, measure outcomes rather than platform activity, and deliberately study the people who *didn't* adopt.\n\n## Scaling Down\n\n**Ben:** Last objection. Tiers and slices — different offerings for different customers — sounds like fragmentation with a strategy name. One platform, one offering, keep it simple.\n\n**Ana:** Everything-or-nothing is an adoption tax. Small teams that must swallow the full platform's cost and complexity never start — and never grow into the customers who'd want the whole thing. Vertical tiers let operational qualities like performance, security, and scalability vary for different budgets; horizontal slices serve customers who need only part of the platform. Each is defined around a clear use case with the trade-offs communicated.\n\n**Ben:** And the fork risk?\n\n**Ana:** Handled by the one hard constraint: the underlying assets stay shared. Tiers and slices are differently sized portions of one platform, not per-tier stacks. Duplicated stacks are exactly the anti-pattern; done right, scaling down is a growth strategy — a smoother entry for customers who may grow later, which is what adoption-first wants.\n\n## What We're Not Saying\n\n**Ben:** Close it out. Fences?\n\n**Ana:** Four. This isn't the product operating mode itself — [Platform as a Product](platform-as-a-product.html) establishes that; this is the growth discipline inside it. It isn't the self-service machinery — that's [Implementing Platforms](implementing-platforms.html). It isn't the definition of success — [What Platform Success Looks Like](platform-success.html) owns that; this is the path there. And it isn't a mandate policy — voluntary adoption is the premise, not a fallback.\n\n**Ben:** Revisit conditions?\n\n**Ana:** Three tripwires. Adoption plateaus while the feature list keeps growing — we're optimizing the wrong dimension. The team's calendar shows it operating as a delivery arm for one customer — professional-services drift. Or new-user time-to-first-useful-result trends up for two consecutive quarters — the on-ramp is eroding.\n\n**Ben:** One sentence.\n\n**Ana:** Nobody has to use an internal platform — so grow it like a product: balance reach, breadth, and depth, win the first hour, say principled nos, and give every customer an appropriately sized way in.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why platforms grow adoption, not features — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. KAI: a hands-on platform engineering lead, short dark hair, gray zip-up hoodie with a small gear pin, laptop covered in infrastructure stickers under one arm, a coil of cable slung over the shoulder.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and teal accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: a gleaming platform pavilion with an open banner and an empty walkway while developers walk past toward other tools.](assets/images/growing-platforms/comic-01-nobody-has-to-use-it.jpeg)\n**Panel 1:** *The hook: an internal platform nobody is forced to use lives or dies on voluntary adoption.*\n\n![Comic panel: an engineer celebrates a board full of shipped feature cards next to a users chart with a flat line.](assets/images/growing-platforms/comic-02-feature-victory-lap.jpeg)\n**Panel 2:** *The problem: the feature-count victory lap — a roadmap celebrating shipped capabilities while adoption stays flat is a platform in denial.*\n\n![Comic panel: one happy customer on a custom throne of platform parts while other developers shrug and walk away.](assets/images/growing-platforms/comic-03-perfect-for-one-customer.jpeg)\n**Panel 3:** *The wrong way: the perfect platform for one customer — customer obsession that quietly becomes a professional-services team for one account.*\n\n![Comic panel: a tree with branches labeled reach, canopy labeled breadth, and roots labeled depth, tended by two characters.](assets/images/growing-platforms/comic-04-reach-breadth-depth.jpeg)\n**Panel 4:** *The principle: platforms grow along three dimensions — reach, breadth, and depth — and starving two to max one is how platforms fail.*\n\n![Comic panel: a path through explore, expand, and extract stages with a checkpoint gate where two characters pause.](assets/images/growing-platforms/comic-05-explore-expand-extract.jpeg)\n**Panel 5:** *The lifecycle: Explore validates that users value the platform, Expand removes adoption obstacles, Extract improves the economics — and between phases the team itself gets reassessed.*\n\n![Comic panel: a smooth on-ramp with handrails beside a path that bends into an unclimbable hockey-stick wall.](assets/images/growing-platforms/comic-06-the-hockey-stick-onramp.jpeg)\n**Panel 6:** *The first hour decides: minimize the cliff, keep simple tasks easy and complex tasks possible — a hockey-stick experience loses users just as they commit.*\n\n![Comic panel: an executive at a sorting desk with an impact-fit board hands a developer a declined card with an explanation sheet.](assets/images/growing-platforms/comic-07-the-principled-no.jpeg)\n**Panel 7:** *The discipline: saying no is how the roadmap protects the product — every request accepted is cohesion spent, so triage on impact and fit and explain the principle behind the no.*\n\n![Comic panel: an engineer hands a developer one slice of a layered platform cake while a users chart curves upward behind them.](assets/images/growing-platforms/comic-08-slices-that-grow.jpeg)\n**Panel 8:** *The closer: scale down as deliberately as up — tiers and slices on shared assets give small customers a way in, and adoption does the growing.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
