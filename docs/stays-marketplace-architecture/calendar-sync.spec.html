<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "# Spec: One Home, Many Calendars: iCal, APIs and Multichannel Hosts\n\n## Intent\n\nShow architects why a home sold on several platforms gets double-booked, and what a hosted-stays marketplace can and cannot do about it. The chapter defines the **conflict window** as a two-directional quantity, of which the marketplace controls only one half (its own import interval and processing). It argues that conflict risk scales with the window times the product of demand on the two channels, so conflicts cluster on peak nights. It recommends modeling a calendar as a set of **claims with provenance** rather than per-night booleans, so that imports withdraw only their own claims, failed fetches release nothing, conflicts are detected on import, and hosts can migrate from iCal to API connections cleanly. Its design combines adaptive polling, a pre-booking re-check for instant book, conflict detection with a recovery flow, feed-health states with listing-level protection, and a migration path to PMS and channel-manager APIs. It also holds that iCal is a supported fallback, not a strategy. The chapter owns iCal sync, conflict window and multichannel host.\n\nProductscape domains covered: TAM `cald` (partially: calendar controls for homes on the OTA side); HSM `cala` (calendar and availability), `apix` (partner APIs and channel connectivity). **[ADDED]** channel management for hosts (external calendars and channel managers), which the digest identifies as a gap in HSM (\"nothing in the model talks to an external calendar or channel manager\").\n\n## Audience\n\nChief architects, principal engineers and engineering leads of hosted-stays marketplaces, vacation-rental PMS and channel-manager vendors, and OTA teams that sell homes. They know HTTP, polling, webhooks and transactional databases. They need the hosted-stays specifics: what iCal carries, who owns which half of the window, why conflicts concentrate on peak dates, and which controls are worth building.\n\n## Success criteria\n\n- [ ] Reader can classify a host set-up (single-channel, iCal mesh, hub, mixed) by where the system of record lives, and explain the n × (n − 1) link count of the mesh.\n- [ ] Reader can state what RFC 5545 gives an importer (all-day dates, exclusive `DTEND`, `UID`, required `DTSTAMP`) and what it does not (prices, restrictions, guest data, polling, acknowledgement).\n- [ ] Reader can define the conflict window in both directions, say which terms the marketplace controls, and use the demand-product model to explain why conflicts cluster on peak nights.\n- [ ] Reader can sketch the claims model and the components around it (scheduler, fetcher, parser, differ, claims store, exporter, conflict detector, health monitor) with their contracts, including the request-forgery and capability-URL rules (Figures 2 and 3).\n- [ ] Reader can explain, with the Seville replay (Figure 4), why faster import improves detection but not prevention for outbound conflicts.\n- [ ] Reader can compare connection options and polling strategies in trade-off tables, and justify fail-open at booking with protection at listing level.\n- [ ] Reader can name the main failure modes (failed fetch read as empty, off-by-one, echo loops and ghost blocks, link rot, two writers, automatic reopening).\n- [ ] The Hotels and Homes section compares the two marketplaces specifically and recommends sharing measurement and operations, not protocols.\n\n## Non-goals\n\n- Hotel connectivity, OpenTravel messages, channel managers for hotels and certification: owned by [Plugging Into the Hotel Stack: Connectivity, Channel Managers and Standards](connectivity-and-channel-managers.html).\n- The nightly calendar data model and pricing fields: owned by [Rooms, Rates and Restrictions: The ARI Data Model](rates-and-availability-model.html).\n- Concurrency control inside one platform, holds, overbooking and relocation: owned by [Never Sell the Same Night Twice: Overbooking, Allotments and Concurrency](inventory-integrity.html).\n- The availability read path for search: owned by [Is It Still Available? Availability Search, Caching and Price Accuracy](availability-engine.html).\n- Host tools, co-hosts and booking-request operations: owned by [Running the Supply Side: Extranets, Host Tools and Operations](extranets-and-host-tools.html).\n- Host cancellation penalties and policy: owned by [When Plans Change: Modifications, Cancellations and Policies](changes-and-cancellations.html); guest guarantee and protection: [Damage, Parties and Emergencies: Protection and Incident Response](protection-and-incidents.html).\n- Night caps and registration law: owned by [Rules of the Stay: Short-Term Rental Regulation, DSA and Consumer Law](stays-regulation.html).\n\n## Modalities\n\n- [ ] `checklist.md` — operational checklist\n- [ ] `summary.md` — management summary\n- [ ] `dialog.md` — two-host dialog\n- [ ] `comics.md` — explainer comic\n\n## Open questions\n\n- Airbnb's iCal import interval has changed before (a snippet showed 2 hours; the live page says 3 hours as of October 2026). Recheck before print.\n- Vrbo's iCal import interval comes only from third-party PMS vendors (2024). Vrbo's own documentation was not found.\n- The \"iCal or API but not both\" rule for Airbnb listings is a 2024 vendor report; not verified against Airbnb's current terms.\n- No platform documents conflict detection on import, adaptive polling or echo suppression. The chapter presents them as recommendation and labels the cross-platform pattern as inference.\n- The echo-loop mechanism depends on whether a producer re-exports imported blocks; no producer documents this explicitly.\n\n## Decision log\n\n- **2026-10-21** — Built the chapter around the conflict window as a measurable, two-directional quantity, rather than around protocols. Without it, \"poll faster\" looks like the answer, and the Seville case shows that it is not.\n- **2026-10-21** — Used a simple demand-product model (my judgement, labeled) to justify adaptive polling and to explain why conflicts cluster on peak dates.\n- **2026-10-21** — Recommended a claims-with-provenance model behind Almanac's existing read interface, so the change is a migration that does not touch search.\n- **2026-10-21** — Kept the Seville case faithful to the ledger and replayed it under the new design to show detection (75 minutes earlier) rather than prevention. Reused the 2026 conflict baseline from [Never Sell the Same Night Twice: Overbooking, Allotments and Concurrency](inventory-integrity.html) (about 3,100, 78% iCal-only) and appended the direction split, the fetch volumes, Calendar Sync v2 and a Roomstead iCal fact to the ledger.\n\n## Sources\n\n- **Internal**\n  - `_research/brief-supply-connectivity.md` Parts 3–5 and 7 — iCal standard and platform behavior, VR PMS APIs, certification.\n  - `_research/brief-airbnb.md` 1.6 and Part 4 — API-connected hosts, iCal sync, undocumented calendar internals.\n  - `_research/brief-expedia-agoda-tripcom.md` 2.3 and the Hostaway API — iCal and API channels side by side; Vrbo gaps.\n  - `_research/brief-booking-reservations.md` 3.3, 5.1, Part 9 — Vrbo integrated accounts, iCal lag, end-to-end window.\n  - `_research/brief-availability-pricing.md` 5.2, 10.2–10.3 — iCal pull, auto-replenishment, one-unit zero tolerance.\n  - `_research/productscape-digest.md` — `cala`, `apix`, `cald`; the external-calendar gap.\n  - [Plugging Into the Hotel Stack: Connectivity, Channel Managers and Standards](connectivity-and-channel-managers.html), [Hotels and Homes: Modeling What Is Being Sold](property-and-listing-model.html), [Never Sell the Same Night Twice: Overbooking, Allotments and Concurrency](inventory-integrity.html), [Running the Supply Side: Extranets, Host Tools and Operations](extranets-and-host-tools.html), [One Platform or Two? Converging Hotels and Homes](converging-two-marketplaces.html).\n- **External**\n  - RFC 5545 (IETF, 2009).\n  - Airbnb Help Center articles 99, 2348 and 2965 (live October 2026); Airbnb Newsroom (2024).\n  - Vrbo connectivity program and integrated-accounts help (live 2026); Booking.com overbooking troubleshooting (live 2026).\n  - Hostaway API (2026), Hostfully (2026), Hospitable (2026), Beds24 wiki (2024), Cloudbeds myallocator (2019).\n\n## Changelog\n\n- **2026-10-21** — Initial spec and article. *(AI-mediated session)*\n- **2026-10-21** — Editorial review pass: acronyms expanded on first use (OTA, PMS, CRS, ARI), American spelling, hedged two unverified/old claims, added a hand-off section to extranets-and-host-tools, timetoread 35 min. *(AI-mediated session)*\n- **2026-10-21** — Visual layer: converted 4 mermaid diagrams to illustrations and added 2 conceptual figures (article-illustrator). *(AI-mediated session)*\n- **2026-10-21** — Figure fixes: aligned the Seville replay alt text with the image (alert to Carmen only). *(AI-mediated session)*\n- **2026-10-22** — Sharpening pass: 6,604 → 6,587 prose words; opening now ties the chapter to Part II's \"copy of someone else's truth\" rule; two paragraphs merged; filler and announcing sentences cut; no headings changed, no facts removed. *(AI-mediated session)*\n- **2026-10-22** — Second sharpening pass: 6,604 → 6,166 prose words since HEAD (−6.6%); Failure Modes compressed to one-line pointers to the sections that handle each failure (unique facts kept); Seville re-tellings in the claims and replay sections, the double-booking/overbooking contrast, the Feria-week guarantee point and the request-to-book protection repeated across three sections cut back; Chief Architect's view tightened; no headings, figures or facts removed. *(AI-mediated session)*\n"}]}]}</script>

                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
