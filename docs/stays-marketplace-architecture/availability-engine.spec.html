<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "# Spec: Is It Still Available? Availability Search, Caching and Price Accuracy\n\n## Intent\n\nShow chief architects how a stays marketplace answers \"what can I book, and for how much\" at look-to-book scale without lying to the guest. The chapter treats the availability engine as a **read model of supply truth with an explicit staleness budget**. One versioned offer-computation kernel is shared by every path that shows a price, a divergence sampler measures accuracy, and a price check at commitment turns staleness into a designed outcome. After reading, the reader can name the cell and key of their grid, separate staleness errors from arithmetic errors, and set freshness budgets and accuracy metrics with owners.\n\nProductscape domains covered: TAM `srch` (Inventory Update Feed worker), `invt` (Rate and Availability Core as source of truth), `room` (Room Offer API); HSM `cala` (Availability engine, availability accuracy). Adds the gap the digest names: **availability/price cache for search**.\n\n## Audience\n\nChief and principal architects, search and pricing leads, and engineering directors of OTAs and hosted-stays platforms who own search latency, metasearch performance or checkout conversion. They know caches and event streams; they need the stays-specific shape (stay-level restrictions, look-to-book, metasearch accuracy policies, consumer-law limits on price changes).\n\n## Success criteria\n\n- [ ] Defines availability engine, offer computation, price accuracy and cache staleness (age-based vs divergence-based) precisely.\n- [ ] Explains why look-to-book forces cached answers, with Corvane's 1,400 requests per reservation and 21,000/64,000 lookups per second reconciled.\n- [ ] Gives an architecture with component contracts (fan-out, grid builder, grid, offer API, on-demand path, kernel, price check, sampler), a cell-key design table and a freshness-strategy table.\n- [ ] Uses dated, sourced public evidence (Agoda 2026 and 2023 posts and 2020 paper, Expedia Rapid, Expedia Group 2021, Airbnb 2026, Vrbo calendar, Google Hotel Center, Hotelbeds), with an explicit inference callout for Booking.com and Expedia internals.\n- [ ] Works a Corvane example with ledger-consistent numbers: the May 2027 accuracy audit (9 points: 5.7 staleness, 2.8 arithmetic, 0.5 other), the Hotel Miradouro cell fan-out, and the pilot result.\n- [ ] Covers price checks within the EU 2021 UCPD guidance and the FTC fees rule, with four contract rules.\n- [ ] Includes the \"Hotels and Homes\" table and judges what to share (contract and kernel composition, not the engine).\n- [ ] Includes trade-offs, failure modes, Chief Architect's view, 6–10 questions and a hand-off to [Never Sell the Same Night Twice: Overbooking, Allotments and Concurrency](inventory-integrity.html).\n\n## Non-goals\n\n- The ARI data model, rate plans and restriction semantics in depth ([Rooms, Rates and Restrictions: The ARI Data Model](rates-and-availability-model.html)).\n- Holds, concurrency control, overbooking and double booking ([Never Sell the Same Night Twice: Overbooking, Allotments and Concurrency](inventory-integrity.html)).\n- Retrieval, index design and ranking ([Searching Dates, Not Documents: Search Architecture for Stays](stays-search-architecture.html), [Ordering the Results: Ranking for Guests, Partners and the Marketplace](stays-ranking.html)).\n- Total-price display and room comparison UI ([The Moment of Decision: Property Pages, Room Selection and Total Price](property-page-and-room-selection.html)).\n- The checkout saga and idempotency ([Turning an Offer Into a Booking: Checkout Orchestration](checkout-orchestration.html)).\n- Black Friday capacity engineering ([Peaks, Regions and Languages: Global Scale and Reliability](global-scale-and-reliability.html)); iCal mechanics ([One Home, Many Calendars: iCal, APIs and Multichannel Hosts](calendar-sync.html)); tax determination ([The Tax Patchwork: VAT, Tourist Taxes and Platform Reporting](taxes-on-stays.html)).\n\n## Modalities\n\n- [ ] `checklist.md` — operational checklist\n- [ ] `summary.md` — management summary\n- [ ] `dialog.md` — two-host dialog\n- [ ] `comics.md` — explainer comic\n\n## Open questions\n\n- No first-party source describes how Booking.com, Expedia or Trip.com join availability into consumer search; the chapter labels its reference architecture as inference. Revisit if one is published.\n- Google's Hotel Center mismatch-reason list is from search-index excerpts (2026), not a fetched page.\n- The Agoda SmartTTL detail is reported from search excerpts of 2020 blog posts.\n\n## Decision log\n\n- **2026-10-21** — Framed the incident as a metasearch accuracy downgrade with a cause breakdown, rather than a single outage, so the chapter could separate staleness from arithmetic. The split (5.7 vs 2.8 points) carries the \"one kernel\" key point.\n- **2026-10-21** — Reconciled the ledger's two look-to-book figures by defining 1,400 as shopping requests per gross reservation and 21,000/s as Pricegrid property-level reads (about ten per request); appended to the ledger.\n- **2026-10-21** — Recommended keeping audience and currency out of the grid key and storing pre-composition offers, against the faster-read alternative of storing finished offers, because Corvane's audit errors came from duplicated composition.\n- **2026-10-21** — Kept Black Friday 2027 as a short forward reference; its capacity story belongs to [Peaks, Regions and Languages: Global Scale and Reliability](global-scale-and-reliability.html).\n\n## Sources\n\n- **Internal**\n  - [Rooms, Rates and Restrictions: The ARI Data Model](rates-and-availability-model.html), [Liquidity, Take Rates and Look-to-Book: The Economics of Stays Marketplaces](stays-marketplace-economics.html), [Plugging Into the Hotel Stack: Connectivity, Channel Managers and Standards](connectivity-and-channel-managers.html) (the €12 rate), [One Home, Many Calendars: iCal, APIs and Multichannel Hosts](calendar-sync.html) (iCal confidence), [One Platform or Two? Converging Hotels and Homes](converging-two-marketplaces.html) (One Stay sharing).\n  - `_research/brief-availability-pricing.md`, `brief-expedia-agoda-tripcom.md`, `brief-booking-com.md`, `brief-search-discovery.md`, `brief-platform-data-ml.md`, `brief-supply-connectivity.md`; `productscape-digest.md`; `scenario-ledger.md`.\n- **External**\n  - Agoda Engineering, \"How Agoda Scaled Its Price Cache with DragonflyDB\" (2026) — write-heavy price cache, tiering, hit-ratio failover.\n  - Zhang et al., \"PriceAggregator\" (Agoda, 2020) — QPS-budgeted supplier pulls.\n  - Expedia Group Rapid documentation (n.d.) — shop, price check, book; rate limits by traffic vs revenue; Vrbo calendar without caching.\n  - Abdool et al., \"Applying Embedding-Based Retrieval to Airbnb Search\" (2026) — precomputed availability and pricing with post-filter.\n  - Google Hotel Center Price Accuracy Policy (n.d.) and delivery modes (2025).\n  - European Commission UCPD guidance (2021); FTC fees rule FAQ (2025).\n\n## Changelog\n\n- **2026-10-21** — Initial spec and article. *(AI-mediated session)*\n- **2026-10-21** — Editorial review pass: lightly trimmed (8,939 → 8,683 words), aligned search volumes with the ledger (1,400 shopping requests, ~10 Pricegrid reads each), corrected the metasearch traffic share, replaced the \"41,000 mapped bedbank properties\" claim with the Brightwell Beds reference, removed an unsourced SmartTTL claim and flagged old evidence. *(AI-mediated session)*\n- **2026-10-21** — Visual layer: converted 3 mermaid diagrams to illustrations and added 2 conceptual figures (article-illustrator). *(AI-mediated session)*\n- **2026-10-22** — Sharpening pass: 7,082 → 6,947 prose words; opening now places the chapter as the read side of Part III; \"Warming for peaks and event dates\" moved from Measuring into Architecture; Booking.com latency subsection deleted (told in several other chapters) and its inference callout moved into the In Practice lead; sentence-level tightening. *(AI-mediated session)*\n- **2026-10-22** — Second sharpening pass (needless test): 6,947 → 6,476 prose words (7,082 → 6,476 since HEAD, −9%); Failure Modes compressed to one-line bullets pointing to the sections that handle each failure; Chief Architect's view, look-to-book, cell-key, trade-offs and Hotels and Homes paragraphs trimmed where they restated earlier sections; Expedia \"ladder\" paragraph and the affiliate/scraper aside deleted; questions 8 and 9 merged; figure captions shortened. No headings renamed; spec criteria unchanged. *(AI-mediated session)*\n- **2026-10-22** — Corrected the price-mismatch claim to match the chapter's audit (staleness 5.7 points, arithmetic 2.8): arithmetic is a large share, not most. *(AI-mediated session)*\n"}]}]}</script>

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');

                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');

                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');

                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
