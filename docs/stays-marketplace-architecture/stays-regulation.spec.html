<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "# Spec: Rules of the Stay: Short-Term Rental Regulation, DSA and Consumer Law\n\n## Intent\n\nShow architects which regulations shape a stays marketplace and how each becomes a system requirement, and argue for **compliance by design**: rules held as versioned data with a legal source, effective period and owner in one **market policy registry**, evaluated at a few fixed enforcement points (publish, book, sweep, report), with every decision stored with its rule version and reason code so it can be explained to a host, a guest or an authority, and reversed when a court changes the law. The chapter maps the EU Short-Term Rental Regulation (EU) 2024/1028, national and city rules, the DSA, DMA, P2B, consumer law, GDPR, guest registration, PSD2, the European Accessibility Act and the AI Act (as amended by the 2026 AI Omnibus) onto system requirements, and uses Spain's 2026 registry annulment to show why rule provenance matters. After reading, the reader can design the registry, evaluator, evidence store and regulator gateway, and decide what a multi-brand group shares.\n\nProductscape domains covered: HSM `comp` (Local Compliance & Policy Controls: market policy registry, listing eligibility, audit state); TAM `cont` (policy authoring workspace); residuality stressor `licn` (eligibility per unit, operator, jurisdiction and stay date).\n\nOwns: STR registration, market policy registry, compliance by design (stays).\n\n## Audience\n\nChief architects, platform and trust leads, and engineering directors of OTAs and hosted-stays marketplaces who must answer to regulatory affairs and legal teams, plus the regulatory leads who need to know what to ask engineering for. They should leave with a component model, a rule schema, the enforcement-point table and a governance split.\n\n## Success criteria\n\n- [ ] Reader can state what Regulation (EU) 2024/1028 requires of platforms (Articles 6–9, 13), its scope excluding hotels, and its dates.\n- [ ] Reader can map each instrument in the regulatory table to a system requirement and an owning chapter.\n- [ ] Reader can name the rule primitives and explain why night caps cannot be certified by one platform.\n- [ ] Reader can describe the obligation register, authoring workspace, registry, resolver, evaluator, evidence store and regulator gateway, and the fields of a rule version (including transition policy and retroactive end date).\n- [ ] Reader can explain the four enforcement points and their fail behavior.\n- [ ] The Corvane worked example matches the ledger (6,900 listings; 2,900 honored; 8,300 canceled; purge February–April 2026 before the May 2026 ruling) and shows the replay that reason codes make possible.\n- [ ] Spain's Supreme Court annulment is described from official sources (CGPJ note; BOE consolidated text), with regional numbers still applying; company claims carry dated sources and inferences are labeled.\n- [ ] Chapter contains a trade-off table, the Hotels and Homes section and table, three mermaid diagrams, the Chief Architect's view and questions to ask.\n\n## Non-goals\n\n- Trader verification (KYC/KYB) and the readiness service ([From Sign-Up to First Booking: Partner and Host Onboarding](partner-onboarding.html)).\n- Unit identity and the place registry ([Hotels and Homes: Modeling What Is Being Sold](property-and-listing-model.html)); jurisdiction geometry ([Where Exactly? Destinations, Geo and Map Search](destinations-and-maps.html)).\n- Total-price display rules and the display policy service ([The Moment of Decision: Property Pages, Room Selection and Total Price](property-page-and-room-selection.html)).\n- Ranking transparency, P2B Article 5 and DMA parity in ranking ([Ordering the Results: Ranking for Guests, Partners and the Marketplace](stays-ranking.html)).\n- Trust policy, enforcement actions and statements of reasons as a moderation workflow ([Trust as a Platform: Trust and Safety for Stays](stays-trust-and-safety.html)); review law ([Trustworthy Reviews: Collection, Integrity and Quality Operations](reviews-and-reputation.html)).\n- Tax, DAC7 and ViDA ([The Tax Patchwork: VAT, Tourist Taxes and Platform Reporting](taxes-on-stays.html)); payment licensing ([Who Takes the Money? Merchant, Agency and Facilitator Models](merchant-and-agency-models.html)).\n- Legal advice on any jurisdiction.\n\n## Modalities\n\n- [ ] `checklist.md` — operational checklist\n- [ ] `summary.md` — management summary\n- [ ] `dialog.md` — two-host dialog\n- [ ] `comics.md` — explainer comic\n\nArticle only for now.\n\n## Open questions\n\n- Which Supreme Court judgment number corresponds to which date: the CGPJ note (21 May 2026) names judgment 620/2026; the BOE consolidated text cites judgments of 19 May, 21 May and 1 June 2026. The chapter says \"announced on 21 May 2026\" and cites both.\n- How Spain's digital single window now validates numbers after Article 10 of Royal Decree 1312/2024 was annulled, and which regional registers offer machine lookups.\n- Which Member States had live single digital entry points and published Article 13 lists by mid-2027; the Commission's technical API specification was not reviewed.\n- Paris 90-night cap rests on a secondary source; Amsterdam rules rest on Airbnb's undated help page.\n- Whether Article 32 DSA (right to information) applies to homes sold without a required registration number is the author's reading, flagged as such (\"may count\").\n\n## Decision log\n\n- **2026-10-21** — Framed regulation as an obligation → control → rule → evidence chain rather than a law-by-law survey, because the reusable architecture is the same across instruments; the survey is compressed into one table with short subsections.\n- **2026-10-21** — Used the Spanish purge and the later annulment as the scene and the replay, per the editor's ledger line: purge February–April 2026 under the then-valid national registry, annulment as a real event, Corvane's removals fictional, regional numbers still applying. The lesson is reason codes and rule provenance, not Spanish law.\n- **2026-10-21** — Recommended fixed rule primitives over a general rules language, and a shared registry/evaluator/evidence/gateway with per-brand enforcement points and classification.\n- **2026-10-21** — Treated the AI Act briefly with the AI Omnibus dates (Annex III from 2 December 2027) verified on the Commission's page, because most stays systems are not high-risk.\n\n## Sources\n\nInternal: [From Sign-Up to First Booking: Partner and Host Onboarding](partner-onboarding.html), [Hotels and Homes: Modeling What Is Being Sold](property-and-listing-model.html), [Where Exactly? Destinations, Geo and Map Search](destinations-and-maps.html), [One Home, Many Calendars: iCal, APIs and Multichannel Hosts](calendar-sync.html), [The Moment of Decision: Property Pages, Room Selection and Total Price](property-page-and-room-selection.html), [Ordering the Results: Ranking for Guests, Partners and the Marketplace](stays-ranking.html), [Trust as a Platform: Trust and Safety for Stays](stays-trust-and-safety.html), [The Tax Patchwork: VAT, Tourist Taxes and Platform Reporting](taxes-on-stays.html), [When Plans Change: Modifications, Cancellations and Policies](changes-and-cancellations.html), [Streams of Nights: Event-Driven Architecture for Stays](event-driven-stays.html).\n\nExternal: Regulation (EU) 2024/1028 (CELEX 32024R1028); Real Decreto 1312/2024 (BOE-A-2024-26931, consolidated text); CGPJ note on judgment 620/2026; Real Decreto 933/2021; DSA (32022R2065); DMA (32022R1925); P2B (32019R1150); Omnibus Directive (32019L2161); GDPR (32016R0679); PSD2 (32015L2366); EAA (32019L0882); AI Act (32024R1689) and the Commission's AI Omnibus note (2026); Airbnb and Booking Holdings 10-Ks for 2025; Airbnb City Portal (2021) and Amsterdam help page; Booking.com DSA page and connectivity docs; Expedia lodging supply hub; NYC Local Law 18; Service-Public.fr; Catalan News, TechCrunch, Hosteltur and Houst as secondary sources.\n\n## Changelog\n\n- **2026-10-21** — Initial spec and article. *(AI-mediated session)*\n- **2026-10-21** — Editorial review pass: American spelling (license, program), timetoread 37→34; purge timing and Supreme Court judgments verified against the BOE consolidated text; AI Omnibus dates verified; unverified Article 3(12) pin-cite replaced by a reference to the activity-data definition. *(AI-mediated session)*\n- **2026-10-21** — Visual layer: converted 3 mermaid diagrams to illustrations and added 2 conceptual figures (article-illustrator). *(AI-mediated session)*\n- **2026-10-21** — Figure fixes: dropped the authoring workspace from the compliance-chain caption to match the diagram. *(AI-mediated session)*\n"}]}]}</script>

    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);

        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';

                const statusName = parts[0].trim();

                sectionEl.appendChild(document.createTextNode(postId));

        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');

            span.textContent = t;

        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
