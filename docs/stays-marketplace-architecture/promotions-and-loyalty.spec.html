<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "# Spec: Deals, Members and Programs: Promotions and Loyalty\n\n## Intent\n\nShow architects that promotions, member pricing, loyalty and partner programs are a pricing, ledger and governance problem, not a merchandising feature. The chapter must leave the reader with three design commitments: one price-composition service that every surface calls, with a single versioned combination policy; a named funder on every discount line, carried from the offer through the reservation to settlement, with the payment model (agency, merchant, hosted stays) deciding how that funding becomes money; and measurement against holdouts, with partner programs kept out of the relevance model and their ranking effect logged and describable. It closes Part III (INVENTORY) and hands off to Part IV.\n\nProductscape domains covered: TAM `deal` (Deals and Member Merchandising), TAM `prom` (Partner Merchandising and Programs); HSM `pric` (host discount programs, partially). **[ADDED]** loyalty and member programs, a gap in both models (benefit ledger, tiers, funding).\n\n## Audience\n\nChief architects, principal engineers, pricing, payments and growth engineering leads at OTAs and hosted-stays marketplaces, plus product and finance leaders who approve campaigns and partner programs. They know rate plans and caching; they need the model for audience-scoped prices, funded discounts and loyalty liabilities, and the regulatory context for parity and paid programs.\n\n## Success criteria\n\n- [ ] Defines promotion, funder (partner, marketplace, co-funded, third-party), closed user group, conditional rate, loyalty currency, partner program, and wide and narrow rate parity.\n- [ ] Explains promotions as overlays vs derived rate plans, with a trade-off table and a rule for when each is right.\n- [ ] Shows a composition order and a stacking-policy table, and argues for one service applying one policy.\n- [ ] Shows with a diagram how funding settles differently in merchant, agency and hosted-stays models, and why marketplace-funded discounts need an invoice credit in agency.\n- [ ] Describes the loyalty-credit lifecycle as ledger states (stay-based accrual, reversal, restoration, expiry) and cites IFRS 15 material rights.\n- [ ] Cites dated public evidence: Booking.com Promotions API, Airbnb discounts and promotions, Genius (labeled as third-party reported), One Key, Preferred, Accelerator, AGP, CNMC 2024, AGCM 2026, DMA Art. 5(3), CJEU C-264/23, P2B Art. 10, Booking.com's 2026 voluntary-adoption post.\n- [ ] Works the Corvane Autumn Cities coupon example (funding and stacking defects) with ledger-consistent numbers and an incrementality calculation.\n- [ ] Includes the Hotels and Homes comparison table with a specific judgement on what to share.\n\n## Non-goals\n\n- How program membership and commission enter the ranking function in detail ([Ordering the Results: Ranking for Guests, Partners and the Marketplace](stays-ranking.html)).\n- Total price display and drip-pricing rules ([The Moment of Decision: Property Pages, Room Selection and Total Price](property-page-and-room-selection.html)).\n- Base-price setting, revenue management and smart pricing ([Setting the Price of a Night: Revenue Management and Smart Pricing](dynamic-pricing.html)).\n- Rate plan and restriction modeling from first principles ([Rooms, Rates and Restrictions: The ARI Data Model](rates-and-availability-model.html)); price caching ([Is It Still Available? Availability Search, Caching and Price Accuracy](availability-engine.html)).\n- Ledger design, payouts and commission invoicing mechanics ([Paying the Supply Side: Payouts, Commissions and Settlement](payouts-and-settlement.html), [Never Update, Only Append: Designing Custom Ledgers](../finance-systems-architecture/designing-financial-ledgers.html)); experiment design methods ([Testing Everything: Experimentation Platforms for Stays](stays-experimentation.html)); the full regulatory map ([Rules of the Stay: Short-Term Rental Regulation, DSA and Consumer Law](stays-regulation.html)).\n\n## Modalities\n\n- [ ] `checklist.md` — operational checklist\n- [ ] `summary.md` — management summary\n- [ ] `dialog.md` — two-host dialog\n- [ ] `comics.md` — explainer comic\n\n## Open questions\n\n- Booking.com Genius partner terms (discount levels, review floor, commission base) are reported only by third parties; re-check if partner pages become readable.\n- Whether the EU Price Indication Directive's 30-day prior-price rule applies to accommodation strike-through prices is unresolved; the chapter relies on UCPD guidance instead.\n- Outcome of the AGCM Preferred investigation (opened 22 April 2026) and the CNMC appeal.\n\n## Decision log\n\n- **2026-10-21** — Framed the chapter around the funder of each discount rather than around promotion types, because funding is what connects pricing, settlement and measurement; promotion catalogs differ between hotels and homes, funding logic does not.\n- **2026-10-21** — Made Roomstead Circle a hybrid (partner-funded Circle rates plus Roomstead-funded Circle credit) so Corvane does not mirror Genius or One Key, and so the chapter can show both architectures.\n- **2026-10-21** — Built the Corvane incident around the agency model's lack of a marketplace-funded discount field, tying to the \"merchant growth on legacy rails\" problem in the ledger, rather than a pure pricing bug.\n- **2026-10-21** — Kept ranking effects of programs to a summary and a failure mode, leaving the policy layer to [Ordering the Results: Ranking for Guests, Partners and the Marketplace](stays-ranking.html).\n\n## Sources\n\n- **Internal**\n  - [Rooms, Rates and Restrictions: The ARI Data Model](rates-and-availability-model.html), [Is It Still Available? Availability Search, Caching and Price Accuracy](availability-engine.html), [Setting the Price of a Night: Revenue Management and Smart Pricing](dynamic-pricing.html) — the base model this chapter layers on.\n  - [Who Takes the Money? Merchant, Agency and Facilitator Models](merchant-and-agency-models.html), [Paying the Supply Side: Payouts, Commissions and Settlement](payouts-and-settlement.html), [Closing the Books: Refunds, Chargebacks and Reconciliation](refunds-and-reconciliation.html) — settlement paths for funded discounts.\n  - [Ordering the Results: Ranking for Guests, Partners and the Marketplace](stays-ranking.html), [Testing Everything: Experimentation Platforms for Stays](stays-experimentation.html), [Running the Supply Side: Extranets, Host Tools and Operations](extranets-and-host-tools.html) — program visibility, measurement, partner reporting.\n  - `_research/brief-availability-pricing.md` (Parts 8, 9, 12, 13), `brief-host-partner-guest-service.md` (Parts 2, 3, 6.4), `brief-booking-com.md`, `productscape-digest.md` (`deal`, `prom`).\n- **External**\n  - Booking.com Developers, *Managing promotions* and *Promotions FAQ* (n.d.) — promotion types, targeting, best-of overlap.\n  - Airbnb, *Using Airbnb pricing tools* (2025) — host discounts and promotions.\n  - Expedia Group 10-K 2025 and One Key launch release (2023) — marketplace-funded loyalty across brands.\n  - Lin Jia and Kexin Fei, *The Causality Gap* (Booking.com, 2026) — measuring opt-in features.\n  - DMA (2022), CJEU C-264/23 (2024), P2B Regulation (2019), AGCM PS13115 (2026), CNMC fine (2024, reported) — parity and program scrutiny.\n  - IFRS 15 (2014) — loyalty credit as a material right.\n\n## Changelog\n\n- **2026-10-21** — Initial spec and article. *(AI-mediated session)*\n- **2026-10-21** — Editorial review pass: lightly trimmed (8,695 → 8,563 words), renamed Visibility Plus to Front Row to match stays-ranking, corrected \"architecture advice forum\", fixed the Black Friday cache claim, removed an unused source and an unsourced commission-base claim, verified the AGCM PS13115 date. *(AI-mediated session)*\n- **2026-10-21** — Visual layer: converted 4 mermaid diagrams to illustrations and added 2 conceptual figures (article-illustrator). *(AI-mediated session)*\n- **2026-10-21** — Figure fixes: regenerated the loyalty-credit lifecycle diagram with a star icon in place of the \"$\" coin. *(AI-mediated session)*\n- **2026-10-22** — Sharpening pass: 7,065 → 7,021 prose words; opening now ties the chapter to Part III's composition path and to Part IV and settlement; deleted the \"Loyalty design choices\" subsection (repeated the Genius vs One Key contrast), an unsourced \"Preferred partners collect up to 20% more bookings\" quote and an unsupported \"partners buy these programs because they work\"; no spec criteria changed. *(AI-mediated session)*\n- **2026-10-22** — Second sharpening pass (needless test): 7,065 → 6,544 prose words cumulative from HEAD (7,021 → 6,544 this pass); Failure Modes compressed to one-line pointers (UCPD and 2019/2020 commitments kept); Chief Architect's view no longer re-argues one composition service, audience budget or the CNMC/AGCM point; removed repeats of the agency-settlement mechanics, the Genius/One Key ledger contrast, the Nookaway coupon point and the illustrative \"joined partners got 20% more bookings\"; Trade-offs heading renamed to \"Stacking and Funding\" after the loyalty subsection's earlier deletion; no spec criteria changed. *(AI-mediated session)*\n"}]}]}</script>

        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped

                // Stray ampersands still get fixed up.

                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
