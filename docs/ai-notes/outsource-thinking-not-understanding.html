<script id="data" type="application/json">{"meta": {"title": "You Can Outsource Thinking. You Cannot Outsource Understanding.", "date": "2026-07-05", "author": "by Željko Obrenović (obren.io)", "permalink": "outsource-thinking-not-understanding", "timetoread": "18 min", "excerpt": "AI keeps improving. You stay mostly the same. That difference doesn't take you out of the process — it shifts the whole process to the one thing you still have to do and can't give away: understand. You can let others do the thinking — the writing, the creating, the making. But understanding is where a product meets real life, real systems, and real people, and that final human step does not get shorter as the models get better. This is a note about what you must keep when you let others handle everything else.", "tags": "generative ai, understanding, cognitive offloading, comprehension debt, judgment, software design, human-in-the-loop", "icon": "assets/icons/outsource-thinking-not-understanding.png", "logo": "assets/images/outsource-thinking-not-understanding/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["generative ai", "understanding", "cognitive offloading", "comprehension debt", "judgment", "software design", "human-in-the-loop"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **KEY POINTS:**\n>\n> * **Thinking and understanding are not the same.** Thinking — creating, making options, code, and analysis — is exactly what AI does now, cheaply and well, and passing it on is the main goal. Understanding — knowing how something was made and if it has value — is where the product meets real life, and it remains yours.\n> * **AI keeps getting better; people stay about the same.** The model’s ability grows steadily; your focus, memory, and how fast you truly understand something stay almost the same. That difference does not remove the human — it moves the main challenge to understanding, the one thing AI cannot provide for you.\n> * **So the work left is the final human step.** Value happens only when the product connects with a real problem and real people — and that connection stays human even if everything before it is automated. Code you don’t understand is outdated from the start; a solution for which no one knows the reason can’t be trusted, fixed, or supported. The goal is to build understanding on purpose — recreate the work instead of just using it, rather than consume it.\n\n<br>\nThere is a line that has been going around, and it is sharper than most of what gets said about AI: **you can outsource your thinking, but you cannot outsource your understanding.** Andrej Karpathy has been repeating it — and he keeps thinking about it. I keep thinking about it too, so this note is my attempt to work out *why* it is true, and what follows from it if it is.\n\nIt sounds strange at first. If AI can do the thinking — and more and more it can, faster and often better than we can — then surely understanding comes with it? You asked a question, you got an answer, and the answer is correct. What else is there to understand?\n\nActually, there is a lot. Because \"thinking\" and \"understanding\" are not just two words for the same thing. Thinking means making something — a draft, a diagram, a function, an argument, a plan. Understanding means a person truly grasping how creation fits together, why it looks the way it does, and whether it works for what you need. The first can be done by a machine. The second is where you deal with the real world, and the real world does not accept a substitute.\n\n## The Line We Keep Blurring\n\nWatch what happens when the two collapse into one.\n\nYou ask an AI to design a service, and it quickly creates a clear, believable plan. You ask it to write the migration, and it's ready. You ask for the risk analysis, and it appears well organized, with the risks listed by importance. At every step, a result was *created* and it is easy to think that at every step, understanding was *gained*. The organization now \"has\" a design, \"has\" a migration, \"has\" a risk analysis.\n\nBut having the result and truly understanding it are different things, and the gap between them is where problems with AI often happen. You can have a correct architecture diagram but not know why it chose a queue over a direct call, what will fail if traffic triples, or which assumption is the critical mistake. You can deliver a migration you did not write and cannot now fix. You can show a risk analysis in which the biggest risk you would not recognize if it came up to you.\n\nThe result shows *thinking happened here.* It does not show *understanding is here.* The main point of this note is that these are different ideas — the first is now easy and can be handed off, but the second is not, and mixing them up is the common mistake of this time.\n\n## AI Improves. You Stay the Same.\n\nStart with the asymmetry that makes all of this urgent, because it is easy to miss and it changes everything.\n\n**AI is improving on a set schedule.** This is not just a feeling; it can be measured. METR, a testing group, tracks how long a task an AI can do on its own, and finds that the length of task a top AI can handle with a 50% success rate has been **doubling about every seven months** since 2019. The reason is the scaling laws — the observed fact, from Kaplan and then DeepMind's \"Chinchilla\" study, that AI gets better in a predictable way as you add more parameters, more data, and more computing power. No matter what else is true, the machine's progress has been going upward, and it has been doing that for years.\n\n**You are not improving on a set schedule.** Your working memory stays the same. You read about as fast as you did ten years ago. The speed at which you can truly learn a new system — follow it, question it, sense where it is weak — is fixed by biology, not by any update plan. Hans Moravec noticed this back in 1988: the things that are hard for machines but easy for us (like a one-year-old's perception and common sense) are the deep, old, unchangeable parts of our minds, while the things that are easy for machines (like formal reasoning and searching) are the newer, thinner layer. The parts of human thinking that matter most for *understanding* are exactly the parts that do not improve with scale.\n\n![Two side-by-side charts. Left: 'Computing capabilities' curving steeply upward over a horizontal axis running from minus fifty years to now. Right: 'Human capabilities' a dead-flat horizontal line over an axis running from minus ten thousand years to Now.](assets/images/outsource-thinking-not-understanding/computing-vs-human-capabilities.png)\n**Figure 1:** *The asymmetry, drawn to scale. Computing capability has curved steeply upward over decades; human capability is a flat line over ten thousand years. Note the axes — the machine's whole story fits in fifty years; ours barely moves across a hundred centuries.*\n\nPut the two curves on the same chart and the simple conclusion is despair: the machine is moving ahead, so the human is being left behind. But that is the wrong way to see it. The gap does not make the human *unimportant*. It makes the human the *bottleneck* — which is a very different, and much more interesting, outcome.\n\nKarpathy, watching AI agents write code faster than he could keep up with, described the feeling exactly: **\"I am becoming the bottleneck,\"** he said — \"even in knowing what we are trying to build, why it matters, and how to guide my agents.\" Notice *where* the bottleneck happened. Not in creating the code — the machine handled that. It happened in *knowing what we are building and why it matters.* It happened in understanding.\n\nThis is the pattern that runs through everything below. When you speed up one part of a process and leave the others the same, the pressure moves to what you did not speed up — the same idea explored in [AI Is an Amplifier, Not an Accelerator](ai-is-an-amplifier-not-an-accelerator.html). Speed up *thinking* but keep *understanding* human, and understanding becomes the limit. The rare resource in the AI era is not creation. It is understanding. And understanding does not come from the model — it has to come from you.\n\n## Thinking Is Not Understanding\n\nWhy can't the model just give you understanding along with the output? Because of a difference that existed long before AI and that AI has only made clearer.\n\nIn 1980, the philosopher John Searle asked you to imagine a person locked in a room, following an elaborate rulebook for manipulating Chinese characters. Symbols come in through a slot; the person looks them up, applies the rules, and passes symbols back out. To a Chinese speaker outside, the answers are perfect — the room \"passes the test.\" But the person inside understands **not one word of Chinese.** They are manipulating shapes according to syntax, with no access to meaning. Searle's conclusion, which has survived four decades of argument: **\"syntax is neither constitutive of nor sufficient for semantics.\"** Producing the right symbols is not the same as understanding them.\n\nThat is the clearest description of what a language model does, and — importantly — what happens when you accept its output without thinking. The model produces the right symbols. If you take them and pass them on without understanding them, *you have become the room.* The output is right; the understanding is missing. The structure moved through the system; the meaning never appeared.\n\nUnderstanding, it turns out, is a special and demanding thing. Michael Polanyi gave us the other side of the idea in 1966 with one sentence: **\"we can know more than we can tell.\"** Real understanding has an *unspoken* core — the feeling of how a system will act, the pattern-recognition that tells an experienced engineer \"this will break under load\" before they can explain why. That unspoken part is exactly what cannot be written down and given to someone. It has to be *developed*, in a person, by working with the thing.\n\nPhilosophers who study understanding as its own subject — different from just knowledge — agree on one thing: to understand something is to **see how it all fits together**, the network of connections and reasons, not just to know a true fact about it. You can *know that* the design uses a queue. You *understand* it only when you see what the queue is protecting against, what it costs, and what would go wrong without it. The first is a simple fact. The second is a mental framework. AI is great at giving the first. The second: it cannot be given, because it is not something that can be handed over — it has to be developed.\n\n| Thinking (outsourceable) | Understanding (not outsourceable) |\n| --- | --- |\n| **Producing** an artifact — a draft, a design, code, an analysis. | **Grasping** the artifact — how it works, why it's shaped this way. |\n| *Syntactic*: the right symbols, correctly arranged. | *Semantic*: the meaning behind the symbols, and their dependencies. |\n| Can be **stated and handed over** — it's in the output. | Has a **tacit core** — \"we know more than we can tell.\" |\n| Gets **cheaper and faster** every model release. | Runs at **human speed**; the model can't do it for you. |\n| The machine is now very good at this. | The machine cannot do this *for* you — only *with* you. |\n\n## Understanding Is Where the Artifact Meets Reality\n\nHere is why the difference matters. **An artifact has no value until it connects with reality — and that connection is a human action.**\n\nTheodore Levitt taught generations of managers a line he borrowed from an ad man named Leo McGivena: *people don't want a quarter-inch drill, they want a quarter-inch hole.* Clayton Christensen built an entire theory — \"jobs to be done\" — on the same insight: nobody wants your product; they want the progress it makes in their life. The value was never in the thing produced. It was in the thing the produced thing *does*, for a real person, in a real situation.\n\nAI is an amazing drill. It creates artifacts — holes waiting to be used — faster than ever before. But the value of any of them is still decided when they meet the real world: does this design work with *our* traffic, *our* old system, *our* rules? Does this analysis deal with the risk *this* customer really faces? Does this code do the job *this* team needs, in a way *this* team can keep using? These questions can’t be answered in theory or by the model ahead of time. They are answered where the artifact meets reality — and someone has to be there, understanding both sides, to answer them.\n\nThis is the **last human mile.** The term comes from telecom: the network can be incredibly fast across the country, but the last part to each home — the \"local loop\" — is slow, costly, and unexciting because it can’t be mass-produced; it has to be connected to each specific door. AI has built an amazing long-distance network for thinking. But the last mile — linking a general artifact to a specific situation and person — still has to be done by hand, for each door. Harvard's Karim Lakhani and colleagues, writing in *Harvard Business Review*, explain it clearly: the challenge to AI’s value \"is rarely model quality or data availability, but rather the last mile of transformation where technical capability must meet organizational design.\" The models are ready. The mile is not.\n\n![A pipeline diagram: a wide fast lane labeled 'AI: thinking / generation' feeds a stream of artifacts toward a narrow final segment labeled 'the last human mile'; at that segment a human figure connects the artifact to icons of a real system and real people, and only past that point does the label read 'value'.](assets/images/outsource-thinking-not-understanding/last-human-mile.jpeg)\n**Figure 2:** *Thinking can be mass-produced; value cannot. The last human mile — where a generic artifact is connected to a specific reality and specific people — stays human, and it doesn't get shorter as the models get better.*\n\nAnd notice: the last mile does not get shorter as the models get better. A better model makes a better artifact, faster — which means *more* artifacts reaching the last mile, each still needing a human to link it to reality. Improving the long-distance network does nothing for the local loop. If anything, it overwhelms it.\n\n## Two Things You Have to Understand: How, and Whether\n\nWhen an AI hands you something, there are two distinct questions you cannot delegate, and it is worth separating them because they fail in different ways.\n\n**How was it built?** You need to understand how the artifact works inside well enough to take full control — to change it, fix it, defend it, and predict what it will do in situations its creator never thought of. In software, we have known how important this is for forty years, but almost no one talks about it. In 1985, Peter Naur wrote an important paper called *Programming as Theory Building.* He said: **the real thing a programmer creates is not the code — it is a *theory* in their mind**, \"the knowledge a person must have not only to do things smartly but also to explain them, answer questions about them, and discuss them.\" The code is just a copy of that theory. And here is the part that should stop you in the age of AI: Naur said this theory **cannot be rebuilt from the documentation alone.** \"A program dies,\" he wrote, \"when the programmer team that understands it is gone.\" Bringing the theory back from the artifact alone is, in his words, *\"impossible.\"*\n\nThink about what it means when the \"programmer team\" that understood the theory was an AI model that has already forgotten the conversation. **AI-generated code you don't understand is not a benefit. It is broken from the start** — code with no real understanding behind it, exactly the problem Naur said kills programs. Addy Osmani, a Google engineering leader, calls this **comprehension debt**, \"the growing gap between how much code is in your system and how much any person truly understands.\" Simon Willison, a strong AI supporter, has a clear rule: he won't add AI-written code to his project \"if I can't explain exactly what it does to someone else.\" This rule follows Naur's idea. If you can't explain it, you don't understand it, and you're adding a dead program to a working system.\n\n**Is it any good?** The second question is not about how it works but about its value — and it is a judgment that needs you to stand where the artifact meets the real world. Is this the right thing to have made? Does it meet the real need, respect the real limits, avoid harm that no one mentioned? A model can generate many options and rank them according to a given goal. It cannot tell you if the goal was the right one, because that needs understanding of a context — this organization, these people, this history, these values — that is outside the prompt. This is the human responsibility that [AI Will Do the Heavy Lifting. You Still Need to Lead](prepare-for-ai-future.html) says becomes *more* important, not less, as generation gets easier: AI can widen the range of ideas, but \"direction, accountability, and consent stay human-led.\" You can be given the answer. You cannot be held responsible for whether it was the right question.\n\n| You cannot outsource understanding *how*... | ...nor understanding *whether*. |\n| --- | --- |\n| Grasp the artifact's internal logic well enough to **own, change, and debug** it. | Judge whether it's the **right thing** — serves the real need, respects the real constraints. |\n| Naur: the value is the **theory in your head**, not the code; it can't be revived from documentation. | The worth is decided at **contact with reality** — this org, these people, this context. |\n| Fail here and you have **comprehension debt** — legacy on arrival, a dead program in a live system. | Fail here and you ship a **confident answer to the wrong question**, with no one accountable. |\n| The question is **correctness and maintainability**. | The question is **value and judgment**. |\n\n## The Cost of Outsourcing Understanding\n\nYou might accept all this and still think: fine, but in real life, using the tool *creates* understanding. I work with the AI, so I understand what we made together. Unfortunately, the evidence shows the opposite — and it shows this often enough to take seriously, even if each study has flaws.\n\nThe oldest warning is the clearest. In 1983, Lisanne Bainbridge wrote a paper on industrial automation called *Ironies of Automation*, and its main point fits AI perfectly. When you automate the routine parts of a task and leave the human to handle only the exceptions, you create a problem: the human's skill **weakens** because they no longer practice the routine — and yet the exceptions, when they come, need *more* skill than ever, because they are the hardest cases, coming without preparation. Automating the easy 90% doesn't leave a human ready for the hard 10%. It leaves a rusty human facing the hard 10% unprepared. Replace \"AI writes the straightforward code\" and \"the human fixes the subtle failure,\" and you have described many engineering teams today.\n\nRecent studies agree. A 2025 study from Microsoft and Carnegie Mellon surveyed 319 knowledge workers about their real AI use and found a clear, worrying link: **\"higher confidence in GenAI is linked to less critical thinking.\"** The more you trust the tool, the less you check its output — which is the opposite of what understanding needs. An Anthropic trial in 2026 gave engineers a task with and without AI help, then tested their understanding: the AI-assisted group scored **17% lower on understanding** — and importantly, the problem came from *passive* use, not from active, question-driven use. (A well-known 2025 MIT Media Lab study went further, using EEG to show less brain activity in people who wrote essays with ChatGPT, and called this \"cognitive debt\" — though that study is small and not peer-reviewed, so treat it as a warning, not proof.) All these studies point the same way: **passively handing off thinking quietly weakens understanding** — and it happens while your *confidence* stays high, which is the risky part. You feel like you understand. The feeling of understanding and the real understanding have separated, just like the feeling of speed and the real speed did in the amplifier studies.\n\nNone of this argues against using AI. It argues against using it *passively* — against confusing \"the output showed up\" with \"I now understand.\" The tool is not the problem. Thinking that generation replaces understanding is the problem.\n\n## Manufacturing Understanding: Re-derive, Don't Consume\n\nSo if understanding doesn't come automatically with the artifact — and using the tool passively actually reduces it — how do you get it? You have to *create* it on purpose. And the best way we have is old, and it has nothing to do with reading the finished product more carefully. **You understand a design by re-creating it — not by just accepting the answer, but by following the steps that make it.**\n\nThis is one of the most reliable findings in the history of systems. John Gall gave it a law in 1975: *\"A complex system that works is invariably found to have evolved from a simple system that worked. A complex system designed from scratch never works.\"* Christopher Alexander, the architect whose ideas seeded much of software design, described the same move as building through \"structure-preserving transformations… introducing differentiations one after the other\" — you start with a whole, simple thing, and you refine it one decision at a time, each step growing out of the last. And it rhymes with the deepest version of the whole idea, the line found on Richard Feynman's blackboard when he died: **\"What I cannot create, I do not understand.\"** Understanding and re-creation are the same act. To understand a design is to be able to *rebuild* it — to see why each piece is there because you watched the problem that put it there.\n\nThis is exactly the \"last human mile\" problem I have been trying to solve in a small side project — [a step-by-step system-design explorer](https://zeljkoobrenovic.github.io/spec-driven-system-design-interviews/). The problem it attacks is precise: how do you make a human genuinely *understand* a system design — possibly one an AI generated — rather than just nod at a finished diagram? A finished architecture, handed over whole, is a Chinese Room: all the right boxes, none of the theory. So the explorer refuses to hand it over whole. Instead, it teaches every design as an **emergent human path**:\n\n- **Start naive.** A URL shortener begins as one client talking to one server. That's it. Anyone can hold that in their head.\n- **Expose one problem.** The server can't keep its mappings in memory — they'd vanish on restart. *Now* you need a database. The database is not asserted; it is *motivated*, by a problem you just felt.\n- **Make one decision.** Add the database. Then: if one server fails and stops everything — add a load balancer. Then: redirects happen much more than creations and focus on a few popular links — add a cache. Then the data is too large for one machine — split it up. Then delays between regions cause problems — move closer to users.\n\nEach step brings exactly one problem and solves it with exactly one choice. By the end you see a split-up, cached, multi-region, edge-boosted system — the same complex diagram an AI would have produced all at once — but now **you understand every part, because you saw the problem that created it.** You did not just accept the design. You *re-created* it, and by doing that you built the knowledge in your mind that Naur says is the real value. The final diagram is the same. The understanding is what matters.\n\n![A staircase diagram rising left to right: each step is a small architecture (client-server, then +database, then +load balancer, then +cache, then sharded, then multi-region), and each riser between steps is labeled with the single problem that motivates the next step ('survives restart?', 'single point of failure', 'hot links', 'too big for one box', 'cross-region latency'). The naive design sits at the bottom, the full system at the top.](assets/images/outsource-thinking-not-understanding/naive-to-evolved-staircase.jpeg)\n**Figure 3:** *Understanding is re-derived, not consumed. Start naive; let each problem motivate exactly one decision. The design at the top is the same one an AI would generate in a single shot — but now every box has a reason you personally watched arrive.*\n\nThis idea goes far beyond system design interviews and is the main point of this note. When an AI gives you something you need to own — a design, a proof, a plan, a diagnosis — **do not take it as a finished product. Rebuild it as a process.** Ask: what is the simplest version that would work? What causes the next part? Make the AI show its work not as *how the model made it* — that is not important and often made up — but as *how a person would get there,* starting simple and improving one choice at a time. That rebuilding is how you create understanding. It is the last human step, done carefully, one step at a time. It is also, not by chance, the way to keep the amplifier's effect positive — better design, not more force, the approach [Breaking Up the Vibe Monolith: Architecting AI-Built Systems to Keep Their Cool](breaking-vibe-monolith.html) supports, and the trust-first idea behind [Can RISC-Inspired Platforms Make AI Less Risky?](risc-for-ai-software-development.html).\n\n## What to Do on Monday\n\nA difference matters only if it changes how you act. Here is what happens when you take \"outsource thinking, not understanding\" seriously.\n\n| Move | What it looks like | What it buys you |\n| --- | --- | --- |\n| **Name the two acts separately** | For every AI task, ask yourself: am I outsourcing the *thinking* or the *understanding*? Outsourcing thinking is okay. Outsourcing understanding is the problem. | You avoid falling into the trap of \"the output showed up, so we're finished\" — a common AI-era error. |\n| **Re-derive, don't consume** | Before accepting a generated design or solution, rebuild it step by step: start with the simplest version, then handle one problem and one decision at a time. | You understand Naur's theory yourself. The diagram stays the same; now it belongs to you. |\n| **Apply the Willison rule** | Don't deliver code, a plan, or an analysis unless you can clearly explain it out loud to a coworker right now. | You avoid hidden misunderstandings early instead of facing bigger problems later during production. |\n| **Use AI actively, not passively** | Question the output. Make it explain its choices, show other options, and reveal assumptions. Using AI with questions builds understanding; just accepting its answers weakens it. | You achieve the study's *good* result, not the one with 17% less understanding. |\n| **Staff and budget the last mile** | Prepare for the human effort needed to link general results to your specific situation — this work does not get smaller as models get better; it actually grows. | The \"it's almost finished\" demo won't turn into a situation where many people don't understand what you delivered. |\n| **Watch your confidence** | When your trust in the tool grows, use it as a sign to check things *more*, not less. Feeling like you understand and actually understanding can be very different. | You avoid moving forward, sure but mistaken, beyond the point where you stopped truly understanding. |\n\nNone of these is about getting a better model. They are about the thing the better model cannot do for you — which is where the leverage was the whole time.\n\n## Closing Thought\n\nYou can give your thinking to others because thinking creates a product, and products can be made by anything that handles symbols well enough — which machines now do very well. You cannot give your understanding to others because understanding is not a product. It is a structure that exists only in a mind, built only through direct experience with the thing, and it is what separates a correct result from a trustworthy one, a design from a design you can stand behind, a solution from a solution that truly solves a real person's real problem.\n\nAI keeps improving at thinking. It will keep getting better. And you will stay about the same — which sounds like losing, until you realize what it means. It means the rare thing, the key thing, the thing the whole system now depends on, is the one thing that was always yours: the understanding. The models gave us an amazing tool for making products. The work left — the steady, unexciting, completely human work — is understanding them well enough to decide what they are worth, why, and whether to trust them when they finally face the world.\n\nThinking was never the hard part. Understanding always was. AI just made it impossible to keep pretending otherwise.\n\n## To Probe Further\n\n* Andrej Karpathy, [Sequoia Ascent 2026 notes](https://karpathy.bearblog.dev/sequoia-ascent-2026/) — the source of the line this note elaborates (\"you can outsource your thinking, but you can't outsource your understanding\") and the companion admission, \"I am becoming the bottleneck of even knowing what we are trying to build, why it is worth doing, and how to direct my agents.\" Karpathy popularized it, crediting an earlier tweet; the original author is uncertain.\n* Peter Naur, [*Programming as Theory Building*](https://pages.cs.wisc.edu/~remzi/Naur.pdf) (1985) — the keystone: what a programmer builds is a *theory* in the head, not the code; \"the death of a program happens when the programmer team possessing its theory is dissolved,\" and reviving the theory from documentation alone is \"strictly impossible.\" The rigorous case that AI-generated code you don't understand is legacy on arrival.\n* John Searle, [*Minds, Brains, and Programs*](https://plato.stanford.edu/entries/chinese-room/) (1980) — the Chinese Room; \"syntax is neither constitutive of nor sufficient for semantics.\" Producing the right symbols is not understanding them; consume AI output uncritically and *you* become the room.\n* Michael Polanyi, *The Tacit Dimension* (1966) — \"we can know more than we can tell.\" Understanding has a tacit core that cannot be written down and handed over; it has to be built in a person.\n* Lisanne Bainbridge, [*Ironies of Automation*](https://www.sciencedirect.com/science/article/abs/pii/0005109883900468) (1983) — automating the routine erodes the skill needed for the exceptions, which are the hardest cases and now arrive cold. The seminal warning, transferring directly to AI.\n* Hao-Ping (Hank) Lee et al. (Microsoft Research / Carnegie Mellon), [*The Impact of Generative AI on Critical Thinking*](https://www.microsoft.com/en-us/research/publication/the-impact-of-generative-ai-on-critical-thinking-self-reported-reductions-in-cognitive-effort-and-confidence-effects-from-a-survey-of-knowledge-workers/) (CHI 2025) — across 319 knowledge workers, \"higher confidence in GenAI is associated with less critical thinking.\" Peer-reviewed; self-reported.\n* Judy Hanwen Shen & Alex Tamkin (Anthropic), [*How AI Impacts Skill Formation*](https://www.anthropic.com/research/AI-assistance-coding-skills) (2026) — a randomized trial: AI-assisted engineers scored ~17% lower on a comprehension quiz, with the damage concentrated in *passive* delegation. Preprint; strong design.\n* Nataliya Kosmyna et al. (MIT Media Lab), [*Your Brain on ChatGPT*](https://arxiv.org/abs/2506.08872) (2025) — EEG evidence of reduced neural engagement and lower essay \"ownership\" among LLM users; coins \"cognitive debt.\" **A small, non-peer-reviewed preprint — directional, not conclusive.**\n* Addy Osmani, [*Comprehension Debt*](https://addyosmani.com/blog/comprehension-debt/) (2026) — \"the growing gap between how much code exists in your system and how much of it any human being genuinely understands.\" The modern name for outsourced understanding coming due.\n* Simon Willison, [*Not all AI-assisted programming is vibe coding*](https://simonwillison.net/2025/Mar/19/vibe-coding/) (2025) — the working rule from a pro-AI programmer: don't commit code \"if I couldn't explain exactly what it does to somebody else.\" Naur's theory-building as a one-line commit policy.\n* METR, [*Measuring AI Ability to Complete Long Tasks*](https://metr.org/blog/2025-03-19-measuring-ai-ability-to-complete-long-tasks/) (Kwa et al., 2025) — the length of task AI can complete has doubled roughly every seven months. The quantitative \"AI accelerates while humans stay flat\" contrast. Preprint.\n* Hans Moravec, *Mind Children* (1988) — Moravec's paradox: adult-level test performance is easy for machines; a one-year-old's perception is \"difficult or impossible.\" Why the parts of us that do the understanding are the parts that don't scale.\n* Karim Lakhani, Jared Spataro & Jen Stave, [*The \"Last Mile\" Problem Slowing AI Transformation*](https://hbr.org/2026/03/the-last-mile-problem-slowing-ai-transformation) (*HBR*, 2026) — the obstacle \"is rarely model quality… but rather the last mile of transformation where technical capability must meet organizational design.\"\n* Theodore Levitt / Clayton Christensen — \"people don't want a quarter-inch drill, they want a quarter-inch hole\" (Levitt credited Leo McGivena); extended by Christensen's [*jobs to be done*](https://hbr.org/2005/12/marketing-malpractice-the-cause-and-the-cure). Value lives at the point of use, not production.\n* John Gall, *Systemantics* (1975) — Gall's Law: \"a complex system that works is invariably found to have evolved from a simple system that worked.\" The case for re-deriving from naive.\n* Christopher Alexander, [*The Origins of Pattern Theory*](https://www.patternlanguage.com/archive/ieee.html) (OOPSLA 1996 / *IEEE Software* 1999) — building through \"structure-preserving transformations… introducing differentiations one after the other.\" Design as one-decision-at-a-time emergence.\n* [AI Is the Reactor, Not the Plant](ai-is-the-reactor-not-the-plant.html) — value and work live in the plant around the model. This note: the plant's most human part is understanding.\n* [AI Is an Amplifier, Not an Accelerator](ai-is-an-amplifier-not-an-accelerator.html) — amplify one stage and the strain moves to the one you didn't. Multiply thinking and understanding becomes the bottleneck.\n* [AI Will Do the Heavy Lifting. You Still Need to Lead](prepare-for-ai-future.html) — as generation gets cheap, judgment, agency, and accountability become the scarce, human inputs. They all rest on understanding.\n* [Can RISC-Inspired Platforms Make AI Less Risky?](risc-for-ai-software-development.html) — trust and inspectability as the adoption bottleneck; understanding is what makes output inspectable.\n* [Breaking Up the Vibe Monolith: Architecting AI-Built Systems to Keep Their Cool](breaking-vibe-monolith.html) — the way out of brute-force AI development is better structure, not more force — the same move as re-deriving a design one decision at a time.\n\n## Questions to Consider\n\nUse these if your team is leaning on AI to produce things you'll have to stand behind.\n\n* For the last thing AI produced for you, did you *understand* it — could you explain it, defend it, and debug it — or did you just *have* it? Be honest about which.\n* Which parts of your work are you outsourcing the *thinking* on (fine), and which are you quietly outsourcing the *understanding* on (not fine)?\n* If the AI that wrote your critical code \"left the team\" tomorrow — forgot the conversation, which it did — does the theory of that code live in any human head? Or is it legacy on arrival?\n* Would your AI-assisted work pass the Willison test: could you explain exactly what it does to a colleague, right now, without looking?\n* Is your confidence in a tool making you scrutinize its output *more*, or *less*? Which way should it be pushing you?\n* When you accept a generated design, do you consume it whole — or do you re-derive it, naive version first, one decision at a time, until you own every box?\n* Where is *your* last human mile — the point where a generic artifact has to meet your specific reality and your specific people? Who is walking it, and are they staffed to?\n* Your team is producing more than ever. Is it *understanding* more than ever — or has the gap between what exists and what anyone grasps started to grow?\n"}]}, {"key": "summary", "label": "Summary", "meta": {"timetoread": "2 min read"}, "blocks": [{"type": "markdown", "content": "You can let AI handle your thinking — the drafting, creating, and producing that AI now does cheaply and well. You cannot let AI handle your understanding — the human sense of how something was made and whether it has value. Thinking creates something; understanding is where that thing connects to real life, and it remains yours.\n\nThis matters now because of a difference: AI keeps getting better on a set schedule; humans stay mostly the same. AI's ability doubles regularly (the length of tasks AI can do has doubled about every seven months); human focus, memory, and understanding speed stay almost fixed. This gap does not remove humans — it moves the main challenge to understanding, the one thing AI cannot provide for you. As Andrej Karpathy said, \"I am becoming the bottleneck of even knowing what we are trying to build, why it is worth doing, and how to direct my agents.\"\n\n**What changes**\n\n- See \"the output appeared\" and \"we understand it\" as different situations. Having a correct design, migration, or analysis is not the same as truly understanding it — and only understanding lets you take ownership, protect, or fix it.\n- Build understanding by figuring it out yourself, not just accepting it. Don't take a generated design as is; break it down step by step — start with the simplest version, then handle one problem and one decision at a time — until you fully understand every part. (The system-design-interview format is an example.)\n- Use AI actively, not just passively. Asking questions helps build understanding; just handing off tasks weakens it — even when you still feel confident.\n\n**What it costs**\n\n- The \"last human mile\" — linking a general product to your specific situation and people — does not get smaller as AI improves; it gets bigger, and needs people and money to handle it.\n- Understanding happens at human speed. Figuring things out yourself instead of just accepting them is slower at first — but cheaper than dealing with problems later.\n\n**What we are not doing**\n\n- Not arguing against AI or against outsourcing thinking — outsourcing thinking is the point. This is about what you must *keep* when you do.\n- Not claiming AI \"makes us stupid.\" The cognitive-offloading evidence is a caution about *passive* use, not a verdict against the tool.\n\nThe Article tab covers the philosophy (Searle, Polanyi, Naur), the evidence on cognitive offloading, and the re-derivation method in full.\n"}]}, {"key": "dialog", "label": "Conversation", "meta": {"timetoread": "10 min listen"}, "blocks": [{"type": "markdown", "content": "## The Line\n\n**Ben:** Alright, blunt version. \"You can outsource your thinking, but you can't outsource your understanding.\" That's a nice tweet. But if the AI does the thinking and gets the right answer, what exactly am I missing? I have the answer. Isn't the understanding kind of… included?\n\n**Ana:** That's the whole trap, and it's worth slowing down on. \"Thinking\" and \"understanding\" feel like the same thing, but they're two different acts. Thinking *produces an artifact* — a draft, a design, a function. Understanding is *your grasp of that artifact* — how it holds together, why it's shaped that way, whether it's any good for what you actually need. The first can be handed to a machine. The second is a structure in your head, and nobody can build it for you.\n\n**Ben:** Give me the version that isn't abstract.\n\n**Ana:** You ask an AI to design a service. Ten seconds later, clean architecture, plausible, well-organized. Now — do you know why it chose a queue instead of a synchronous call? What breaks if traffic triples? Which of its assumptions is the one load-bearing lie? You *have* the design. Whether you *understand* it is a completely separate question, and most of the time the honest answer is no.\n\n**Ben:** And I only find that out when it's on fire in production.\n\n**Ana:** Which is the most expensive possible moment to discover you never understood it.\n\n## AI Improves, You Don't\n\n**Ben:** Okay, but why is this suddenly a big deal? People have shipped code they half-understood forever.\n\n**Ana:** Because of an asymmetry that's getting worse fast. AI is improving on a *clock*. METR measures the length of task an AI can complete on its own, and it's been doubling roughly every seven months. The machine's curve points steeply up. Your curve — your reading speed, your working memory, how fast you can genuinely absorb a new system — is flat. It's the same as it was ten years ago. It's biology.\n\n**Ben:** So the machine pulls away and I get left behind. Cheerful.\n\n**Ana:** No — that's the wrong reading, and it's the important part. The gap doesn't make you *irrelevant*. It makes you the *bottleneck*. Karpathy said it exactly: \"I am becoming the bottleneck — of even knowing what we are trying to build, why it is worth doing, and how to direct my agents.\" Look at where the bottleneck landed. Not on generating the code. On *understanding what we're building and why it's worth it.* Multiply one stage of a process and the strain moves to whatever you didn't speed up. We multiplied thinking. Understanding is now the constraint.\n\n**Ben:** That's the amplifier point from your other note.\n\n**Ana:** Same physics. [AI Is an Amplifier, Not an Accelerator](ai-is-an-amplifier-not-an-accelerator.html) — speed up one stage of an unbalanced pipeline and you just pile work in front of the slow one. Here the slow stage is the human grasp, and it doesn't get faster no matter how good the model gets.\n\n## Why the Model Can't Just Hand It Over\n\n**Ben:** Fine, but here's my real pushback. Why can't the AI just *give* me the understanding along with the answer? Explain its reasoning, and now I understand.\n\n**Ana:** Because understanding isn't a thing that can be handed over — and there's a forty-year-old thought experiment that nails why. John Searle: imagine a person in a room with a rulebook for manipulating Chinese characters. Symbols come in, they follow the rules, correct Chinese goes out. To someone outside, the room \"speaks Chinese.\" But the person inside understands *not one word.* They're shuffling shapes by syntax, with zero access to meaning. Searle's line: \"syntax is neither constitutive of nor sufficient for semantics.\"\n\n**Ben:** And the AI is the room.\n\n**Ana:** The AI is the room — and here's the sharp bit — *so are you*, if you take its output and pass it along without grasping it. The output is correct. The understanding is nowhere. Syntax moved through the system; meaning never showed up. And there's a second half, from Polanyi: \"we can know more than we can tell.\" Real understanding has a tacit core — the felt sense that \"this will break under load\" before you can say why. That can't be written into a document and emailed to you. It has to be grown, in a person, through contact with the thing.\n\n**Ben:** So when someone says \"read the docs, then you'll understand it\" —\n\n**Ana:** They're describing something Peter Naur said is literally impossible. That's the software version, and it's the strongest source in the whole note.\n\n## Legacy on Arrival\n\n**Ben:** Go on, what did Naur say.\n\n**Ana:** 1985, a paper called *Programming as Theory Building.* His claim: the real thing a programmer builds is *not the code.* It's a *theory* in their head — the knowledge you need not just to make the thing work, but to explain it, argue about it, answer questions about it. The code is a shadow of that theory. And — this is the part that should stop you cold — the theory *cannot be reconstructed from the documentation.* \"The death of a program,\" he wrote, \"happens when the programmer team possessing its theory is dissolved.\" Reviving it from the artifact alone is \"strictly impossible.\"\n\n**Ben:** Now say that in the age of AI.\n\n**Ana:** The \"team that possessed the theory\" was a language model that has already forgotten the conversation. So the theory *never existed in any human head, and can't be recovered.* Which means AI-generated code you don't understand isn't an asset. It's *legacy on arrival* — a dead program in a live system, exactly the condition Naur said kills software. Addy Osmani gave it a name: comprehension debt — \"the gap between how much code exists and how much of it any human genuinely understands.\"\n\n**Ben:** So what's the rule? Never use AI to write code?\n\n**Ana:** No. Simon Willison's rule — and he's about as pro-AI as programmers get — is: don't commit code \"if I couldn't explain exactly what it does to somebody else.\" That's Naur as a one-line commit policy. Use the AI all you want. Just don't ship what you can't explain.\n\n## But Doesn't Using It Build Understanding?\n\n**Ben:** Here's where I push hardest. When I work *with* the AI — back and forth, iterating — surely I understand what we built together. I was there.\n\n**Ana:** I wish that were true, and the evidence says it usually isn't — not if you're passive about it. Start with Bainbridge, 1983, *Ironies of Automation.* Automate the routine parts and leave the human the exceptions, and you get a trap: the human's skill *erodes* because they never practice — but the exceptions, when they come, need *more* skill, because they're the hardest cases arriving cold. Automating the easy 90% doesn't leave you ready for the hard 10%. It leaves you rusty, facing the hard 10% with no warm-up.\n\n**Ben:** That's forty years old and about factories.\n\n**Ana:** And it transfers perfectly. \"AI writes the straightforward code, human debugs the subtle failure\" — that's most engineering teams right now. And the new measurements agree. Microsoft and Carnegie Mellon, 2025, surveyed 319 knowledge workers: \"higher confidence in GenAI is associated with less critical thinking.\" The more you trust it, the less you scrutinize — backwards from what understanding needs. An Anthropic trial in 2026 quizzed engineers afterward: the AI-assisted group scored 17% lower on comprehension, and the damage was concentrated in *passive* delegation.\n\n**Ben:** You're going to tell me there's a brain-scan study too, aren't you.\n\n**Ana:** *(laughs)* There is — MIT, EEG, \"cognitive debt,\" reduced neural engagement in people who wrote with ChatGPT. But it's a small, non-peer-reviewed preprint, so I'm calling it a flare, not a proof. The *direction* across all of them is what matters, and it's consistent: passive outsourcing hollows out the understanding — while your confidence stays high. That's the dangerous part. You feel like you understand. The feeling and the reality have come apart.\n\n## How You Actually Get Understanding\n\n**Ben:** So if reading the artifact doesn't do it, and passively using the tool doesn't do it — how do I actually understand something an AI made?\n\n**Ana:** You re-derive it. You don't consume the answer; you walk the path that produces it. Feynman had it on his blackboard when he died: \"What I cannot create, I do not understand.\" Understanding and re-creation are the same act. And Gall's Law says the same thing about systems: \"a complex system that works is invariably found to have evolved from a simple system that worked.\"\n\n**Ben:** Concretely. What does \"re-derive\" look like on a Tuesday?\n\n**Ana:** It's the thing I've been building a little system-design explorer around, actually — it's aimed at exactly this last-mile problem. Take a URL shortener. The AI would hand you the full diagram in one shot: sharded, cached, multi-region, edge-accelerated. Intimidating, and you'd understand none of it. Instead, you start naive — one client, one server. Then you expose *one* problem: the server loses its mappings on restart. *Now* you need a database — and notice, it's not asserted, it's *motivated* by a problem you just felt. Then one server is a single point of failure — add a load balancer. Redirects cluster on hot links — add a cache. Too big for one box — shard it. Cross-region latency — push to the edge.\n\n**Ben:** And at the end I've got the same scary diagram.\n\n**Ana:** Identical. Except now you understand every box, because you watched the problem that summoned it. You didn't consume the design — you re-derived it, and in doing that you built the theory in your head that Naur says is the actual asset. The final artifact is the same. The understanding is the entire difference. And the trick generalizes: when an AI hands you anything you have to own, don't accept it whole — reconstruct it as a path. Simplest version, one problem, one decision, repeat.\n\n## What This Isn't\n\n**Ben:** Before you wrap up — steelman the objection. This sounds like it could tip into \"AI makes us stupid, don't use it.\"\n\n**Ana:** Let me be clear it's not that. Outsourcing your thinking is *fine* — it's the point. The whole value of the tool is that it does the producing. This note is about what you have to *keep* when you do that, not an argument to stop. And the cognitive-offloading evidence isn't a verdict against AI — it's a caution about using it *passively.* Active, question-driven use builds understanding. Passive delegation erodes it. Same tool, opposite outcomes.\n\n**Ben:** And it's not \"humans are still special, don't worry.\"\n\n**Ana:** No comfort blanket. The point is harder and more useful than that: AI keeps getting better, you stay the same, and *that's exactly why* the understanding becomes the scarce, decisive thing. It's not that you're safe. It's that the one job that's left — being the person who says what an artifact is worth, and why, and whether to trust it where it meets the real world — is the one job that was always yours. The thinking was never the hard part. The understanding always was.\n\n**Ben:** AI just made that impossible to keep pretending otherwise.\n\n**Ana:** That's the note.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "<!-- comic-style\n{\n  \"cast\": \"MAYA: a pragmatic staff engineer / architect, short dark hair, glasses, rolled-up sleeves, calm and slightly amused, often holding a marker. REX: an over-eager boxy robot AI assistant, one bent antenna, glowing rectangular eyes, perpetually excited; here he is a tireless artifact-printer — he cheerfully spits out finished diagrams, code, and documents like a printer spitting pages, but never carries any of them.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with blue/teal accents on a light cream background, generous white space, hand-lettered speech bubbles with SHORT readable text (max 8 words per bubble). Recurring motif: finished ARTIFACTS (rolled blueprints, code pages, doc sheets) are printed effortlessly by Rex in blue/teal, but UNDERSTANDING is a glowing warm-amber lightbulb that only ever appears above a HUMAN head, never above Rex. Simple geometric office and whiteboard settings mixing people with software symbols, no photorealism, no dense text, no title text.\"\n}\n-->\n\nAn eight-panel walk through the whole idea: you can hand Rex the thinking, but the understanding has to stay in a human head.\n\n![Comic panel: an eager robot prints a fountain of finished blueprints and hands one to an engineer who looks at it uncertainly.](assets/images/outsource-thinking-not-understanding/comic-01-the-printer.jpeg)\n**Panel 1:** *AI produces the artifact in seconds. Having it and understanding it are not the same thing.*\n\n![Comic panel split into THINKING (robot printing) and UNDERSTANDING (engineer with a lightbulb over her head).](assets/images/outsource-thinking-not-understanding/comic-02-two-acts.jpeg)\n**Panel 2:** *Thinking produces the artifact. Understanding is grasping it — and only one of the two is outsourceable.*\n\n![Comic panel: the robot rises on a steep upward arrow while the engineer stands unchanged on flat ground.](assets/images/outsource-thinking-not-understanding/comic-03-ai-improves-you-dont.jpeg)\n**Panel 3:** *AI keeps improving. You stay roughly the same — which is exactly why the next panel matters.*\n\n![Comic panel: the robot fire-hoses a pile of artifacts at the engineer, who is overwhelmed at a narrow doorway labeled bottleneck: understanding.](assets/images/outsource-thinking-not-understanding/comic-04-the-bottleneck.jpeg)\n**Panel 4:** *Multiply the thinking and the strain moves to the one thing left human: understanding. 'I am becoming the bottleneck.'*\n\n![Comic panel: the robot in a booth pushes correct symbol-cards through a slot but has an empty thought bubble; the engineer peers in unimpressed.](assets/images/outsource-thinking-not-understanding/comic-05-symbols-not-meaning.jpeg)\n**Panel 5:** *Producing the right symbols is not understanding them. Consume the output blindly and you become the booth too.*\n\n![Comic panel: the robot has vanished in a puff of smoke; the engineer holds cobwebbed code pages tagged legacy on arrival.](assets/images/outsource-thinking-not-understanding/comic-06-legacy-on-arrival.jpeg)\n**Panel 6:** *The real asset was the theory in a head. If the author was a model that forgot the chat, the code is legacy on arrival.*\n\n![Comic panel: the engineer climbs a staircase of growing architecture sketches, a lightbulb lighting at each step, past a discarded finished diagram.](assets/images/outsource-thinking-not-understanding/comic-07-re-derive-staircase.jpeg)\n**Panel 7:** *You understand a design by re-deriving it — naive version first, one decision at a time — not by nodding at the finished thing.*\n\n![Comic panel: the engineer at a doorway labeled the real world connects an artifact to a person and a system, a bright lightbulb over her head, the robot printing behind.](assets/images/outsource-thinking-not-understanding/comic-08-the-last-mile.jpeg)\n**Panel 8:** *Outsource the thinking. Keep the understanding — it's what stands at the door where the artifact finally meets the world.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        let liHtml = inline(itemBuf.join('\n'));
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push('<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : '<ul>') + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
