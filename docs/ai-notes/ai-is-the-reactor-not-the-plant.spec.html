istinction. Reversing the control and hazard paragraphs would introduce the failure before the reader knows the useful operating goal.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | definition | A reactor core is the plant’s heat source. | quotation: The NRC describes the reactor as the heat source for the power plant, just like the boiler is for a coal plant; the paragraph identifies the self-sustaining fission chain reaction as how that heat is produced. |  |\n| p06 | explanation | Controlling the chain reaction makes its heat usable for predictable electricity generation. | quotation: The existing NRC quotation connects consistent and constant heat energy with predictable and controllable steam generation and electricity. | `cause_effect`: The core provides heat. → Why that heat must be steady to serve the plant. |\n| p07 | explanation | An unchecked reaction illustrates why control is essential to making the heat source usable. | reasoning: The baseline explains an unchecked reaction producing energy faster than surrounding systems can use or absorb it, and the inability to run a grid on an unsteady source. | `contrast`: Controlled heat supports predictable generation. → The unusable and dangerous result described for an unchecked reaction. |\n| p08 | synthesis | The core can matter enormously while still requiring the surrounding plant to fulfill its purpose. | reasoning: The existing core-matters conclusion follows the heat-source and control explanation. | `conclusion_summary`: The contrast between steady output and an unchecked reaction. → The distinction between an essential core and a complete usable system. |\n\n### Most of the Plant Is Not the Core\n\n**Controlling idea** (`evidence`, id `plant-cost`): The attributed nuclear estimates show substantial cost outside the reactor without establishing a universal ratio.\n\n**Advances the thesis** (S1, S5): Grounds the surrounding-work claim in exis bine conversion map to evaluations, structured outputs, schemas and workflows; fuel cladding, coolant system and containment building map to sandboxes, output filters, human review, rate limits and rollback.; figure: Unchanged Figure 2 and control-channel-contain-mapping.jpeg repeat the three rows with reactor mechanisms and AI counterparts. |  |\n| p13 | analysis | The three jobs improve the surrounding product system rather than increasing core power. | reasoning: None of the mapped jobs is make the core hotter; the baseline contrasts these trust-building activities with model training. | `conclusion_summary`: The table and figure show three jobs around the core. → Their shared focus on useful, trustworthy operation rather than more raw power. |\n| p14 | explanation | The surrounding controls create trust by making generated work inspectable and testable. | source: Keep the existing cross-link to risc-for-ai-software-development and its explicit summary: the adoption bottleneck is whether output can be inspected, tested and trusted. | `similarity`: The mapped jobs make the product trustworthy. → The same inspectability-and-trust principle in the related RISC essay. |\n\n### Defense in Depth: No Single Guardrail\n\n**Controlling idea** (`explanation`, id `defense-in-depth`): A safeguard must be backed by independent layers that can hold when it fails.\n\n**Advances the thesis** (S3): Develops containment and control from a list of measures into a design principle about failure.\n\n**Transition in:** `elaboration`: The surrounding controls are where trustworthy operation is built. → Why those controls cannot depend on a single guardrail.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): State the failure question, explain the existing nuclear evidence, map it to AI controls, and interpret the map as a test of independence. The AI list before that evidence would look like an arbitrary checklist rather than a response to failure.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p15 | transition | Trust in the surrounding controls requires a plan for a safeguard failing. | reasoning: The existing transition introduces one more nuclear idea; make its connection to the preceding trust claim explicit without adding another unit. |  |\n| p16 | evidence | Nuclear defense in depth assumes failures and supplies successive independent protections. | source: Preserve the IAEA’s five levels from prevention through limiting consequences, the NRC phrase successive compensatory measures, and at least two diverse and independent shutdown systems where one alone can hold the reaction in check. | `elaboration`: A safeguard may fail. → The nuclear philosophy of independent layers designed around that possibility. |\n| p17 | example (list) | AI systems can apply the layered principle across prevention, detection, damage control, mitigation and consequences. | example: Keep all five existing AI list items: prevent with constrained tools, least privilege and scope; catch early with validation, evaluation gates and anomaly detection; stop damage with sandboxes and human review; mitigate with limits, circuit breakers and rollback; limit consequences with logs, monitoring and incident response. | `similarity`: Independent nuclear safeguards back one another up. → Concrete AI safeguards organized by the same failure-aware principle. |\n| p18 | analysis | Defense in depth means designing the next layer to hold, rather than merely adding more filters. | figure: Unchanged Figure 3 and defense-in-depth-layers.jpeg show a crack in one inner ring while the next ring holds, retaining all five defense labels and the caption. | `conclusion_summary`: The list gives five different safeguard roles. → The design test that makes those roles a layered system. |\n\n### Widening Out: Organizations and Society Are Plants Too\n\n**Controlling idea** (`comparison`, id `widening-out`): Accountable operating structures play the surrounding-plant role at organizational and societal scales.\n\n**Advances the thesis** (S4, S5): Extends the engineering model to the people and institutions that govern its use while preserving the structural-only comparison.\n\n**Transition in:** `similarity`: Technical systems require safeguards and review around capability. → The same pattern in organizational and societal operation.\n\n**Order of paragraphs** (`small_to_large`): Signal the move beyond engineering, describe organizational operation, widen to society, then constrain what the scale comparison means. Society first would skip the familiar organizational responsibilities that ground the larger claim; removing the final caution would invite an equivalence the article rejects.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p19 | transition | The surrounding-work pattern extends beyond engineering to larger operating systems. | reasoning: The baseline explicitly moves one level up from the engineering argument with a caution about the comparison. |  |\n| p20 | comparison | An organization gets dependable value through accountable decisions, review and recovery around model access. | example: The existing organizational questions ask who is accountable, which decisions remain human, how work is reviewed, and how failures are caught and fixed.; source: Preserve breaking-vibe-monolith for the better-structure argument and prepare-for-ai-future for judgment, accountability and deciding; preserve the existing concluding contrast between the cheap reactor and costly plant. | `example`: The engineering pattern can recur at a larger scale. → The organization’s operating model around AI. |\n| p21 | comparison | Society’s surrounding institutions shape whether powerful capability is channeled toward a net benefit. | analogy: Keep the existing comparison to institutions, norms, laws and accountability; retain the hedge It is fair to say before the historical nuclear statement and the list of regulation, operating discipline, liability, oversight and public trust. | `similarity`: Organizations need operating structures around capability. → Society’s institutions and accountability structures serve a comparable wider role. |\n| p22 | analysis | The wider comparison concerns surrounding structure, not equivalence between AI danger and fission. | reasoning: Preserve the explicit structure-not-danger caution and the bounded lesson about channeling capability toward what people want. | `contrast`: The analogy now extends to society. → The constraint that this extension is structural rather than a hazard equivalence. |\n\n### Where the Analogy Breaks\n\n**Controlling idea** (`comparison`, id `analogy-limits`): The analogy remains useful only when its differences from AI stay explicit.\n\n**Advances the thesis** (S5): Prevents the surrounding-work claim being read as a universal equivalence of physics, risks, standards or model usefulness.\n\n**Transition in:** `elaboration`: The wider analogy is about structure rather than equal danger. → Four explicit limits on how the comparison may be used.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p23 | comparison | Four differences bound the useful reactor analogy. | table: Keep the four where-it-holds/where-it-breaks rows: heat and radiation versus wrong outputs, misuse and over-trust; fixed reactor physics versus statistical, changing model behavior; mature nuclear standards and operating data versus an unsettled AI rulebook; an unusable bare reactor core versus a raw model’s real chat-box value. |  |\n| p24 | analysis | The useful conclusion is the work around capability, not literal nuclear imagery applied to AI. | example: Retain the rejected phrases AI will melt down and containment dome for GPUs as examples of abusing the analogy. | `conclusion_summary`: The table has separated valid similarities from the four differences. → The narrow core-versus-surrounding-work inference that survives. |\n\n### What to Do on Monday\n\n**Controlling idea** (`recommendation`, id `monday`): Teams can turn the bounded analogy into explicit choices about budgets, permissions, safeguards, measurement and ownership.\n\n**Advances the thesis** (S6): Makes the surrounding-work thesis usable when planning and reviewing an AI project.\n\n**Transition in:** `cause_effect`: The analogy’s surviving lesson is where useful production work sits. → Concrete changes to where teams spend effort.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p25 | recommendation | An AI project plan should treat the surrounding plant as deliberate engineering work. | table: Preserve all five moves and their existing descriptions: budget for the plant, build the throttle first, layer safeguards, measure conversion, and name who owns the reaction. Preserve the existing 90% done demo and six months of plant-building wording as the author’s planning illustration, not a measured industry statistic. |  |\n| p26 | analysis | These moves invest in the surrounding system that turns capability into usable value. | reasoning: The baseline explains that none of the five moves requires getting a better model. | `conclusion_summary`: The table specifies five planning moves and their benefits. → Their common purpose of building the plant. |\n\n### Questions to Consider\n\n**Controlling idea** (`recommendation`, id `questions`): A team can use the plant model to identify missing work in an AI project moving toward production.\n\n**Advances the thesis** (S6): Turns the Monday moves into a review of the reader’s own budget, safeguards, control, measurement and accountability.\n\n**Transition in:** `elaboration`: The Monday table names the planning moves. → The unchanged questions ask whether those moves are present in the team’s own project.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p27 | recommendation (list) | Reviewing the project’s budget, backup safeguards, throttle, result measures and accountable owner reveals what the plant still needs. | reasoning: Preserve the complete existing Questions to Consider lead-in and all six questions, including the second guardrail, kill switch, incident review and comparison between core and plant investments. |  |\n\n## Conclusion: Closing Thought\n\n**Synthesis:** The cost evidence, three engineering jobs and accountable operating model together make the surrounding plant part of the product itself: the investment that turns capability into a service people can rely on.\n\n**So what:** A team should plan, fund and own that surrounding work from the start instead of treating a convincing model demonstration as almost-finished production delivery.\n\n**Callback:** The opening attraction to the core and questions about which model is most capable. The reader can still admire the core while judging the complete system by whether it turns output into dependable results.\n\n**Takeaway** (`course_of_action`): Treat evaluation, controls, layered safeguards and accountable operation as the work of building the AI product; use the team questions to identify what is missing.\n\n**Hand-off** to [AI Is an Amplifier, Not an Accelerator](ai-is-an-amplifier-not-an-accelerator.html): `cause_effect`: A model becomes useful through the engineering and operating system around it. → How that system determines whether more generation improves results or increases downstream strain.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p28 | synthesis | A complete production service comes from the surrounding engineering and accountable operation, so that work belongs in the product plan from the start. | reasoning: Return to the original contrast between a genuine marvel and a power station, connecting the earlier cost, safeguard and ownership arguments without adding new evidence. |  |\n| p29 | recommendation | The work ahead is building the plant that makes raw AI capability trustworthy and useful in production. | reasoning: Preserve the original closing paragraph’s Generative AI handed us a reactor core and control, channeling, and containment synthesis, including its emphasis on the work ahead. | `cause_effect`: The surrounding work belongs in the product plan. → The author’s call to invest in that work. |\n| p30 | transition | The surrounding system determines whether increasing generation improves results or creates more work downstream. | source: A short new hand-off links to ai-is-an-amplifier-not-an-accelerator as the next inquiry into the effects of increasing generation inside a real delivery system. | `cause_effect`: Capability becomes useful through the surrounding plant. → The next question of whether more generation improves results or adds downstream strain. |\n\n## Non-goals\n\n- A nuclear engineering tutorial or a safety-record debate about nuclear power.\n- A claim that AI is as physically dangerous as fission, or that it can melt down or detonate in any literal sense.\n- A specific evals/guardrails/orchestration toolchain recommendation.\n- An AI-safety / x-risk policy argument. The control-plane point is about engineering and operating reality, not existential risk.\n- A precise, universal cost percentage for the reactor: figures remain attributed and support only the directional claim.\n\n## Modalities\n\nArticle, summary, dialog, comics\n\n## Open questions\n\n- Sibling summary.md, dialog.md and comics.md were not revised in this pass. Their shared facts and central argument remain intact, but they do not carry the expanded roadmap, reordered question section or new amplifier hand-off; review editorial navigation if those modalities are refreshed.\n\n## Decision log\n\n- **2026-06-25** — Chose the title AI Is the Reactor, Not the Plant to put the rsus plant/total cost bases, their lack of strict comparability, and the directional-not-decimal interpretation. Add only the interpretive statement that the evidence is not a universal reactor ratio or AI budget formula. Rejected: Correcting or updating cost figures in this outcome pass.; Dropping historical-estimate caveats, comparing unlike denominators, or inferring an AI cost percentage.\n- **2026-11-12** — Proceed from draft specifications under the author’s auto-mode instruction, keep status draft, and stop at no more than two total draft-check invocations. Parent owns fresh isolated readers, migration staging and the final build. Rejected: Changing status to accepted.; A third draft-check round or an independent build or commit from this post pass.\n- **2026-11-12** — A fresh isolated reader reviewed only flow.txt and returned sound with no actionable notes. Retain the planned order and all transitions; proceed to the authorized local prose revision. The review is saved in scratch flow-review-1.txt. Rejected: Moving, merging or cutting a unit without a demonstrated reader benefit.\n- **2026-11-12** — Implemented the sound-reviewed contract through seven local prose-unit edits, the unchanged Questions to Consider section moved before Closing Thought, and one new final amplifier hand-off. The protected-material audit confirms exact front matter, KEY POINTS, tables, image/caption lines, question text, reference text, cost list and numeric tokens; every existing link is preserved. No real name, figure, date, factual claim or heading text was changed or added. Sibling modalities remain outside this pass.\n- **2026-06-25** — The legacy spec recorded no questions blocking its first draft. Preserved here as historical record rather than an unresolved question.\n- **2026-11-12** — Independent draft-check round 1 returned REVISE with 53 passed results, 2 failed results and 0 waivers; all three copied acceptance criteria passed. Both failures concern the same Introduction p02-to-p03 boundary: the pronoun Both could appear to reject the intended-behavior question rather than the preceding capability questions. Replaced that pronoun sentence with explicit core-temperature and model-capability referents. No unit, order, controlling idea, transition contract or protected material changed. One round has completed; round 2 is the final authorized check. The previous unchecked-readers workflow placeholder is now historical and has been removed from open_questions.\n\n## Sources\n\n- **Internal**\n  - risc-for-ai-software-development — Legacy source: trust and inspectability as the adoption bottleneck; the platform surface around the model.\n  - breaking-vibe-monolith — Legacy source: the way out of the burn is structure, not more force; freezing high-blast-radius seams.\n  - prepare-for-ai-future — Legacy source: judgment, accountability, and the shift from artifact to decision.\n  - _journals/ai-notes/posts/ai-is-the-reactor-not-the-plant/index.md — Primary source for existing wording, all figures and qualifications, paragraph units, front matter, callouts, links, tables, images, captions, references and questions.\n  - _journals/ai-notes/posts/ai-is-the-reactor-not-the-plant/spec.md — Legacy intent, outcomes, non-goals, modalities, open questions, six decision entries, source list and both changelog entries; preserved before its parent-managed migration.\n  - _journals/ai-notes/journal-spec.json — Copied intent, thesis and role; exact previous/next relationship; source of the production-use scope and fixed acceptance criteria.\n  - from-structure-to-behavior — Preceding essay establishes cheap generated structure, intended behavior and outcomes; the opening bridge elaborates that need through surrounding controls.\n  - ai-is-an-amplifier-not-an-accelerator — Next essay asks how the surrounding delivery system determines whether more generation improves results or increases downstream strain.\n- **External**\n  - U.S. NRC, Reactor Concepts Manual (R-100). Legacy research verification dated 2026-06-25. https://www.nrc.gov/cdn/legacy/reading-rm/training/reactor-concepts-training-course.pdf — The reactor as the heat source for the power plant, just like the boiler is for a coal plant; consistent and constant, predictable and controllable output; the three barriers to fission-product escape. Carried from the legacy spec, not reverified in this pass.\n  - World Nuclear Association, Nuclear Power Reactors and Safety of Nuclear Power Reactors. Legacy research verification dated 2026-06-25. — Control rods (boron/cadmium/hafnium), moderator, coolant; three barriers; defense in depth; the three basic safety functions. Carried from the legacy spec.\n  - IAEA, SSR-2/1, Safety of Nuclear Power Plants: Design. Legacy research verification dated 2026-06-25. https://www-pub.iaea.org/MTCD/publications/PDF/Pub1534_web.pdf — Five levels of defense in depth; three fundamental safety functions (control reactivity, remove heat, confine material); at least two diverse, independent shutdown systems. The author’s triad is a qualified analogy, not an identical taxonomy.\n  - U.S. DOE, Nuclear 101: How Does a Nuclear Reactor Work? Legacy research verification dated 2026-06-25. — Control rods, moderator, coolant; carried over from the legacy source list even though the published reference list is shorter.\n  - World Nuclear Association, Economics of Nuclear Power (2020 World Nuclear Supply Chain report). Legacy research verification dated 2026-06-25. https://world-nuclear.org/information-library/economic-aspects/economics-of-nuclear-power — Cost by activity: nuclear island about 28%, conventional island 15%, balance of plant 18%, civil works 20%, instrumentation and control about 8%; retain the original bases and nuclear-island definition.\n  - IFP, Why Does Nuclear Power Plant Construction Cost So Much? Legacy research verification dated 2026-06-25. https://ifp.org/nuclear-power-plant-construction-costs/ — The 1980 DOE hypothetical-plant breakdown: reactor, turbine and structures each about 15–20% of direct cost; engineering about reactor cost; roughly one third of total cost indirect. Attributed as one historical estimate, with a denominator different from WNA’s.\n\n## Changelog\n\n- **2026-11-12** — After round 1 returned REVISE (53 pass, 2 fail, 0 waived), replaced the ambiguous opening sentence of introduction p03 with explicit capability-question referents. Both failures addressed the same boundary. Moved workflow and legacy no-blocking-question notes into dated history; unchanged order requires no new flow rubric. Preparing the final authorized round 2; status remains draft.\n- **2026-11-12** — Implemented Phase B from the sound-reviewed draft spec: added the intended-behavior bridge, production qualifier, complete roadmap, bounded cost interpretation, control-plane gloss, failure transition, closing synthesis and separate amplifier hand-off; moved unchanged questions before the conclusion. Resolved the Phase A reconstruction gaps. Kept all protected material exact and all specs draft; independent draft checks pending.\n- **2026-11-12** — Fresh independent flow rubric returned sound with no actionable notes before prose revision. Retained the complete proposed sequence and all journal fields; status remains draft.\n- **2026-11-12** — Reconstructed a full paragraph-level outcome spec before prose revision, copying the final journal contract; preserved all legacy records and factual qualifications. Planned the questions move, complete roadmap, local bridges, production-scope clarification, closing synthesis and a separate next-post hand-off. Status draft under authorized auto mode; no prose edited in Phase A.\n- **2026-06-25** — Applied post-review minor fixes across index, summary, and dialog: softened the IAEA three functions mapping (it rhymes with, does not equal, the control/channel/contain triad), added the direct cost base qualifier to the 1980 DOE figure so it is not read     (function () {
        const data = JSON.parse(document.getElementById('data').textContent);

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');

                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }

                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {

                        rows.push(splitRow(lines[i]));

                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
