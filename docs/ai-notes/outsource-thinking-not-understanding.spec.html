    <meta name="description" content="AI keeps improving. You stay mostly the same. That difference doesn't take you out of the process — it shifts the whole process to the one thing you still have to do and can't give away: understand. You can let others do the thinking — the writing, the creating, the making. But understanding is where a product meets real life, real systems, and real people, and that final human step does not get shorter as the models get better. This is a note about what you must keep when you let others handle everything else.">

rk.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader distinguishes outsourced production from understanding how an artifact works and whether it serves its context. *Probe:* An AI produces a correct-looking design. What two kinds of understanding must its human owner still develop, and why? | `custom` | cold_reader | major |\n| AC-2 | A reader explains why faster generation can increase comprehension debt and separates passive delegation from active AI use. *Probe:* Why can improving models leave humans more constrained, and what kind of AI use does the article caution against? | `custom` | cold_reader | major |\n| AC-3 | A reader can describe the reconstruction method as a human learning path rather than a claim to reveal the model's internal reasoning. *Probe:* How would you use the article's method to understand a generated design before owning it? | `custom` | cold_reader | major |\n\n## Thesis\n\n**Question:** What must people retain when AI can produce the designs, code, and analyses they need?\n\n> **Claim:** People can delegate artifact production to AI, but must build their own understanding of how the result works and whether it serves a real need, using active questioning and stepwise reconstruction before taking ownership.\n\n**Disputed by:** The view that a correct generated artifact, accompanied by a fluent explanation, gives its recipient enough understanding to own it without further learning.\n\n**So what:** Teams need time and practices for comprehension, or the volume of generated work can grow beyond their ability to explain, maintain, and judge it.\n\n**How and why:** Understanding connects causes, trade-offs, and local context in a person; generation increases artifact supply faster than human attention, while reconstruction makes each design choice answer a problem the learner has encountered.\n\n**Supporting claims**\n\n- **S1** — Producing an artifact does not give its recipient the personal grasp of causes and reasons needed to understand it.\n- **S2** — Faster generation can increase the volume awaiting human comprehension without supplying that comprehension.\n- **S3** — Owning generated work requires understanding both how it functions and whether it serves the particular people and constraints it meets.\n- **S4** — Passive acceptance can leave comprehension debt, while active use keeps learning and scrutiny in the work.\n- **S5** — Reconstructing a design from a simple version, one motivated decision at a time, gives people a practical path to understanding it.\n- **S6** — Teams should make explanation, active questioning, and time for contextual judgment part of accepting generated work.\n\n## Role in the part\n\nLocates the human comprehension constraint that remains after teams improve generation and delivery mechanics. Supports S4 of part `ai-software-development`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in the-line through how-and-whether; `assertion_evidence_reasoning` in the-cost; `chronological` in re-derive p35: the worked design path)\n\nBegin with the familiar mistake of equating possession of output with understanding, then show why increasing supply makes that mistake consequential. Explain the distinction before grounding it in real use, and ground real use before separating how from whether. The costs of passive acceptance motivate the stepwise reconstruction method; the method makes the Monday practices and self-assessment questions usable. Questions move before Closing Thought so reflection leads into the synthesis and the next-post hand-off rather than reopening the essay after references. Moving the method before the explanation of personal understanding would make it look like a prompting trick; moving the studies before the ownership problem would invite an anti-AI reading. The introduction already defines the basic terms, so the asymmetry section can use them before their deeper philosophical explanation.\n\n## Introduction\n\n**Hook** (`provocative_quotation`): You can outsource your thinking, but you cannot outsource your understanding.\n\n**Bridge:** The reader has received a fluent, correct-looking AI answer, design, code change or analysis and feels the work may be finished. → Ask what that possession proves about the reader’s own grasp, connecting the preceding essay’s relocated bottleneck to the comprehension that generated artifacts cannot acquire for their recipients.\n\n**Thesis statement** (The preserved KEY POINTS bullets establish the claim; introduction p03 states it in prose after defining the two acts.): Let AI produce the artifact, but build your own understanding of how it works and whether it meets the real need by questioning and reconstructing it before taking ownership.\n\n**Roadmap** (New final introduction paragraph p04, after the existing three introduction paragraphs.):\n\n- Show the familiar mistake of equating a produced result with understanding and why faster generation puts pressure on it. *Kept in:* the-line, the-asymmetry.\n- Use the philosophical distinction and the last human mile to explain why understanding concerns both workings and contextual value. *Kept in:* the-distinction, meets-reality, how-and-whether.\n- Use the automation warning and qualified studies to examine the cost of passive acceptance. *Kept in:* the-cost.\n- Work through a design one motivated choice at a time, then turn that method into Monday practices and questions for the reader’s team. *Kept in:* re-derive, monday, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | The line popularized by Karpathy names a practical distinction between delegating production and acquiring understanding. | quotation: The title line, repeated by Andrej Karpathy, in the existing opening; retain the intact three-bullet KEY POINTS callout before it. | `elaboration`: A faster production stage can move the constraint to a slower stage that still needs attention. → Human understanding as the constraint that artifact generation cannot remove on its recipient's behalf. |\n| p02 | counterargument | A correct answer can tempt its recipient to assume that understanding came with it. | reasoning: If AI answers correctly, what remains to understand? | `elaboration`: The claim that thinking can be delegated while understanding cannot. → The reader’s plausible objection that a correct answer should be enough. |\n| p03 | definition | Thinking here means producing an artifact, while understanding is the recipient’s grasp of its workings and fit to need. | example: A draft, diagram, function, argument, or plan can be produced by a machine; the person still has to grasp how it fits together and whether it serves the need.; reasoning: The previous essay’s point that faster production can move the constraint downstream applies here to human comprehension. | `contrast`: The assumption that receiving the answer gives the recipient understanding. → The operational distinction and the responsibility to build understanding actively. |\n| p04 | transition | The essay follows the production–understanding gap from its growing pressure and conceptual basis to contextual ownership, passive-use risks, reconstruction, and practical checks. | reasoning: Preview the familiar confusion, the asymmetry, the philosophical distinction, the last human mile, how and whether, qualified studies, the stepwise system-design example, Monday moves and team questions. | `elaboration`: The distinction between an artifact and the recipient’s grasp of it. → The path by which the essay will turn the distinction into a working practice. |\n\n## Sections\n\n### The Line We Keep Blurring\n\n**Controlling idea** (`example`, id `the-line`): Possessing a generated result can conceal the absence of anyone able to explain or repair it.\n\n**Advances the thesis** (S1): Makes the receiving-artifact versus acquiring-understanding distinction visible in familiar engineering work.\n\n**Transition in:** `example`: The introduction distinguishes artifact production from personal understanding. → A service design, migration and risk analysis make the confusion concrete.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The brief invitation introduces the mistaken inference, the examples let the reader recognize it, their missing understanding exposes the failure, and the final distinction names what the examples establish. Putting the conclusion first would remove the recognition the examples provide.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | transition | The confusion becomes visible when we watch generated artifacts arrive in everyday work. |  |  |\n| p06 | example | A team can mistake receiving designs, migrations and analyses for gaining the understanding those artifacts seem to represent. | scenario: The illustrative sequence: ask for a service design, then a migration, then a risk analysis; the organization now “has” each. | `example`: The invitation to watch production and understanding collapse into one. → A sequence of familiar generated outputs. |\n| p07 | analysis | The same artifacts may leave their recipients unable to explain a design choice, fix a migration, or recognize a risk. | example: A queue rather than a direct call; traffic tripling; an unrepairable migration; an unrecognized risk. | `contrast`: The organization now possesses the design, migration and risk analysis. → What those artifacts do not establish about the recipient’s understanding. |\n| p08 | synthesis | The artifact shows that production happened, not that understanding exists in its owner. |  | `conclusion_summary`: The gap between possessing outputs and being able to reason about them. → The distinction the following sections explain. |\n\n### AI Improves. You Stay the Same.\n\n**Contro mprehension as a bottleneck rather than making the human irrelevant. |  | `cause_effect`: The two different rates just compared. → The practical interpretation of the gap. |\n| p13 | example | Karpathy’s account locates the bottleneck in knowing what is being built and why it matters. | quotation: Preserve the existing “I am becoming the bottleneck” quotation and its account of knowing what to build, why it matters, and how to guide agents. | `example`: The claim that human comprehension becomes the limiting work. → Karpathy’s experience of that limit. |\n| p14 | synthesis | Accelerating production moves the limit to understanding when understanding remains at human speed. | reasoning: Keep the [AI Is an Amplifier, Not an Accelerator](ai-is-an-amplifier-not-an-accelerator.html) cross-link and explain the local generation gain versus downstream pressure in the sentence itself. | `conclusion_summary`: Karpathy’s example of comprehending less quickly than agents produce. → The general bottleneck relationship developed by the preceding essay. |\n\n### Thinking Is Not Understanding\n\n**Controlling idea** (`explanation`, id `the-distinction`): Understanding requires grasping meaning and relationships rather than merely receiving correctly arranged symbols.\n\n**Advances the thesis** (S1): Explains the personal knowledge the recipient must develop before ownership is possible.\n\n**Transition in:** `elaboration`: Understanding remains the bottleneck despite better generated answers. → Why an answer cannot simply carry its recipient’s understanding with it.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): Pose the gap, illustrate syntax without meaning through Searle, apply that distinction to passive receipt, add Polanyi’s tacit dimension, then make relational understanding concrete through a queue. The queue example depends on the meaning-versus-symbol distinction; putting it first would make the section look like a design checklist.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p15 | transition | The production bottleneck raises the question of why the model cannot give the recipient understanding along with its answer. |  |  |\n| p16 | evidence | Searle’s Chinese Room separates successful symbol manipulation from the operator’s understanding of those symbols. | source: John Searle, Minds, Brains, and Programs (1980): a person manipulates Chinese symbols by a rulebook without knowing Chinese; preserve the syntax/semantics quotation. | `example`: The question of how correct output differs from understanding. → The Chinese Room thought experiment. |\n| p17 | analysis | Passing along fluent output without grasping it reproduces the Chinese Room problem for the recipient. | analogy: The article’s “you have become the room” application. | `similarity`: The Chinese Room operator can return correct symbols without grasping their meaning. → The same risk for a person who forwards AI output uncritically. |\n| p18 | evidence | Polanyi’s tacit knowledge names the part of understanding that people develop through experience rather than receive as written output. | quotation: Michael Polanyi, The Tacit Dimension (1966): “we can know more than we can tell.”; example: The experienced engineer who senses that a system will break under load before fully explaining why. | `elaboration`: The recipient needs meaning beyond the delivered symbols. → The tacit dimension of that personal grasp. |\n| p19 | definition | Understanding a design means seeing why its parts exist, what they cost, and how they depend on one another. | example: Knowing the design uses a queue versus seeing what it protects against, what it costs and what breaks without it.; table: Preserve the five-row Thinking (outsourceable) / Understanding (not outsourceable) table. | `elaboration`: The personal grasp includes more than facts that can be handed over. → The contrast between knowing that a queue exists and understanding its reasons. |\n\n### Understanding Is Where the Artifact Meets Reality\n\n**Controlling idea** (`explanation`, id `meets-reality`): An artifact’s value depends on someone connecting its behavior to a particular need and context.\n\n**Advances the thesis** (S2, S3): Connects personal comprehension to the real-world value the owner must assess.\n\n**Transition in:** `cause_effect`: Understanding means seeing causes, costs and relationships rather than receiving facts. → Why those relationships matter where the artifact will be used.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): State value at the point of use, ground it in the existing drill/hole analogy, apply it to local engineering questions, name the last human mile, and show the capacity consequence. The last-mile metaphor would remain abstract without the local questions; the volume consequence depends on seeing what the human must connect.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p20 | claim | The distinction matters because the artifact must connect with reality before it serves anyone. |  |  |\n| p21 | evidence | The drill-and-hole example locates value in the progress a product makes for a person. | quotation: Theodore Levitt’s quarter-inch drill/hole line, credited to Leo McGivena; Clayton Christensen’s jobs-to-be-done account. | `example`: The claim that an artifact’s worth is decided at use. → The existing value-at-use analogy. |\n| p22 | example | A generated artifact must still be assessed against the traffic, systems, rules and people of its intended use. | example: The existing questions about our traffic, old system, rules, customer risk and team’s ability to keep using the code. | `elaboration`: Value depends on the progress the artifact makes in someone’s situation. → The concrete context questions generated work must answer. |\n| p23 | definition | The last human mile names the work of connecting a generic artifact to a specific situation and person. | analogy: The existing telecom/local-loop analogy: the fast long-distance network still needs a connection to each door.; quotation: Karim Lakhani and colleagues in Harvard Business Review: technical capability must meet organizational design.; figure: Preserve last-human-mile.jpeg, its full alt text and Figure 2 caption. | `elaboration`: The artifact needs a connection to specific context. → The last human mile and its organizational meaning. |\n| p24 | cause_effect | More rapidly produced artifacts can increase the load on that remaining human connection. |  | `cause_effect`: Each artifact still needs to be connected to a particular reality. → The volume pressure on the last human mile. |\n\n### Two Things You Have to Understand: How, and Whether\n\n**Controlling idea** (`comparison`, id `how-and-whether`): Ownership requires both an internal explanation of how the artifact works and a contextual judgment of whether it is worth using.\n\n**Advances the thesis** (S3, S4): Makes the two kinds of personal understanding explicit and distinguishes their failure modes.\n\n**Transition in:** `elaboration`: The last human mile connects an artifact with its actual context. → The two questions its owner must be able to answer.\n\n**Order of paragraphs** (`comparison`): Separate the two questions, develop how through Naur, explain the debt that appears when that theory is missing, then contrast whether and collect both in the table. Putting the debt before Naur would introduce its name without the missing knowledge it describes; putting value first would obscure the two distinct failure modes.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p25 | transition | The human owner needs to distinguish understanding how the work functions from judging whether it serves the need. |  |  |\n| p26 | evidence | Naur’s theory-building account explains why owning code requires a model of its workings in the programmer’s mind. | source: Peter Naur, Programming as Theory Building (1985); preserve the existing theory-building, team-dissolution and documentation quotations. | `elaboration`: The first question asks how the artifact works. → The theory that allows an owner to explain, change and debug it. |\n| p27 | analysis | Generated code without a human grasp of its workings creates comprehension debt. | source: Addy Osmani’s existing comprehension-debt definition and Google engineering-leader description.; quotation: Simon Willison’s existing rule against committing code he cannot explain to another person.; reasoning: State the absence of human understanding when generated code arrives, without crediting the model as a programmer team that possessed the theory. | `cause_effect`: The code alone does not supply the programmer’s theory. → The ownership debt when nobody can explain the generated code. |\n| p28 | comparison | The owner must also judge whether the artifact answers the right question in its real context. | reasoning: The existing checks of real need, limits, unmentioned harms, organization, people, history and values; retain [AI Will Do the Heavy Lifting. You Still Need to Lead](prepare-for-ai-future.html) and its direction/accountability/consent quotation.; table: Preserve the four-row how / whether comparison. | `contrast`: Explaining and maintaining the artifact addresses how it works. → Judging whether its goal and consequences are appropriate addresses its value. |\n\n### The Cost of Outsourcing Understanding\n\n**Controlling idea** (`cause_effect`, id `the-cost`): Passive AI use can leave people confident in work they have not learned to understand.\n\n**Advances the thesis** (S4): Supplies the automation warning and qualified existing studies for distinguishing passive delegation from active learning.\n\n**Transition in:** `contrast`: Ownership requires personal understanding of how and whether. → The tempting assumption that using the tool automatically creates that understanding.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): State the objection that use creates understanding, show the automation mechanism, present the newer studies with their qualifications, and limit the conclusion to passive acceptance. The pro-AI boundary must follow the evidence so the reader does not confuse a caution about use with a verdict against the tool; moving the studies first would hide the objection they answer.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p29 | counterargument | Working with an AI does not by itself establish that the user has understood the resulting work. | reasoning: Qualify the initial warning as evidence about passive acceptance before discussing the distinction from active, question-driven use. |  |\n| p30 | evidence | Bainbridge’s automation warning explains how losing routine practice can leave people less prepared for difficult exceptions. | source: Lisanne Bainbridge, Ironies of Automation (1983); preserve the existing 90%/10% illustrative framing as an example, not a new study statistic. | `example`: The claim that tool use alone need not build understanding. → The mechanism by which automated routine work can erode the skill needed later. |\n| p31 | evidence | The cited studies give qualified reasons to distinguish passive acceptance from active, questioning AI use. | statistic: Microsoft/Carnegie Mellon’s 2025 survey of 319 knowledge workers and the existing confidence/critical-thinking association.; statistic: Anthropic’s 2026 trial and the existing 17% lower comprehension result, with the passive-versus-active distinction.; source: MIT Media Lab’s 2025 EEG essay study and “cognitive debt”; retain the small, not-peer-reviewed warning, not-proof caveat.; reasoning: Locally explain the existing amplifier comparison: developers can feel faster with AI while taking longer to complete work. Link the related essay and distinguish this analogy about unreliable confidence from studies of understanding. | `additional_support`: Bainbridge’s warning about losing the practice needed for judgment. → Recent evidence concerning confidence, learning and passive delegation. |\n| p32 | refutation | The warning concerns passive acceptance rather than using AI to help with thinking. |  | `conclusion_summary`: The evidence distinguishes tool use from the learning a user actually performs. → The pro-AI boundary that motivates active reconstruction. |\n\n### Manufacturing Understanding: Re-derive, Don't Consume\n\n**Controlling idea** (`process`, id `re-derive`): A person can build understanding by reconstructing a design from a simple working version through one motivated choice at a time.\n\n**Advances the thesis** (S5): Shows the practical learning path that turns a received result into personal grasp without pretending to reveal the model’s internal reasoning.\n\n**Transition in:** `problem_solution`: Passive receipt does not reliably create understanding. → A deliberate reconstruction practice that keeps the recipient engaged.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): State the reconstruction method, connect it to the existing design principles, work through the URL-shortener path, explain why the unchanged final diagram is now understood, then generalize the prompt as a human learning path. The outcome of the example needs the steps before it; generalizing before the example would leave “re-derive” abstract.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p33 | recommendation | The recipient must deliberately build understanding by following the steps that produce the design. |  |  |\n| p34 | evidence | The existing design quotations frame reconstruction as a sequence of motivated refinements from a simple whole. | quotation: John Gall, Systemantics (1975), on a complex working system evolving from a simple working system; preserve the complete existing quotation.; quotation: Christopher Alexander on structure-preserving transformations and differentiations one after another.; quotation: Richard Feynman’s existing blackboard line, “What I cannot create, I do not understand.” | `additional_support`: The recommendation to rebuild a design through its steps. → The source principles behind that reconstruction method. |\n| p35 | example (list) | The system-design explorer builds a URL-shortener design by making each new component answer a problem the learner has just encountered. | case: Preserve the project link and the three-item list: start with a client and server; expose lost mappings on restart; add a database, load balancing, caching, splitting, and regional proximity as their problems emerge. Make the existing edge-boosted result traceable by explaining nearby caching as part of the already-described response to delay between users and services. | `example`: The design principle of motivated refinement from a simple whole. → The worked human learning path. |\n| p36 | analysis | The same final architecture becomes understandable when the learner can explain why each component arrived. | reasoning: The existing contrast between a diagram accepted whole and the same diagram reconstructed, connected to Naur’s theory. Define edge-boosted at first use as serving frequent redirects from the nearby cache introduced in the prior step.; figure: Preserve naive-to-evolved-staircase.jpeg, its complete alt text and Figure 3 caption. | `cause_effect`: The learner has encountered each problem and the decision that responds to it. → Why reconstructing the path changes understanding without changing the final diagram. |\n| p37 | recommendation | Ask AI for a plausible human reconstruction of the work, not a story presented as the model’s hidden reasoning. | reasoning: Retain the existing design/proof/plan/diagnosis examples, the simplest-working-version questions, the explicit caveat about model explanations being made up, and [Breaking Up the Vibe Monolith: Architecting AI-Built Systems to Keep Their Cool](breaking-vibe-monolith.html) / [Can RISC-Inspired Platforms Make AI Less Risky?](risc-for-ai-software-development.html). | `elaboration`: The design example made each choice answer a problem the learner understood. → The same reconstruction practice for any generated work the reader needs to own. |\n\n### What to Do on Monday\n\n**Controlling idea** (`recommendation`, id `monday`): Teams can make active understanding a visible condition of accepting generated work.\n\n**Advances the thesis** (S6): Turns the distinction and reconstruction method into repeatable acceptance practices.\n\n**Transition in:** `elaboration`: The reconstruction method gives a person a path to understanding generated work. → The everyday practices that keep that learning and judgment in the workflow.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): Introduce the need for changed behavior, supply the preserved moves table as the paragraph’s evidence, then explain what unites those moves. The unifying observation depends on seeing the actions first.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p38 | recommendation | Use explicit checks and time for comprehension when deciding whether generated work is ready to accept. | table: Preserve the six Monday moves: name the acts, re-derive, apply the Willison rule, use AI actively, staff and budget the last mile, watch confidence. |  |\n| p39 | synthesis | These practices address the understanding a better model cannot acquire on its recipient’s behalf. |  | `conclusion_summary`: The six actions keep explanation, questioning and contextual judgment in the work. → Their common purpose beyond buying a stronger model. |\n\n### Questions to Consider\n\n**Controlling idea** (`recommendation`, id `questions`): Readers can use their recent AI-assisted work to locate missing he need, rebuilding the path from a simple version wherever understanding is missing.\n\n**Hand-off** to [Breaking Up the Vibe Monolith: Architecting AI-Built Systems to Keep Their Cool](breaking-vibe-monolith.html): `problem_solution`: People must understand generated work well enough to maintain it and judge its value. → Stable architectural seams that make such understanding and ownership possible across a growing team.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p41 | synthesis | The opening distinction separates a delivered artifact from the personal understanding needed to stand behind it. | reasoning: Return to the existing opening line through the original contrast between a product that can be made externally and the grasp of how and why that its owner must develop. |  |\n| p42 | cause_effect | The growth of generated work makes time for understanding a practical limit on the work a team can responsibly own. | reasoning: Connect the existing asymmetry and last-human-mile argument to the time needed for explanation and contextual judgment. | `cause_effect`: The owner needs personal grasp of how the artifact works and whether it fits. → The capacity consequence when generation rises faster than comprehension. |\n| p43 | recommendation | The work left by cheap production is to understand the next artifact well enough to explain it and judge its worth. | reasoning: Preserve the original “Thinking was never the hard part” closing thought as the author’s emphasis, while connecting it to the existing explanation/reconstruction test. | `conclusion_summary`: Understanding limits the amount of generated work the team can own. → A concrete takeaway anchored in the original closing emphasis on understanding. |\n| p44 | transition | The next question is how stable architectural seams let a growing team share and preserve that understanding. | reasoning: Link [Breaking Up the Vibe Monolith: Architecting AI-Built Systems to Keep Their Cool](breaking-vibe-monolith.html) in this final paragraph, framing stable boundaries as the next essay’s subject rather than introducing a new argument here. | `problem_solution`: People must understand generated work well enough to maintain it and judge its value. → The next essay’s architectural response to keeping understanding and ownership possible across a team. |\n\n## Non-goals\n\n- Not an AI-doom / \"AI makes us stupid\" piece. Cognitive-offloading evidence is a caution about *how* to use AI, not a verdict against it.\n- Not a re-run of [AI Is the Reactor, Not the Plant](ai-is-the-reactor-not-the-plant.html) (where the work is) or [AI Is an Amplifier, Not an Accelerator](ai-is-an-amplifier-not-an-accelerator.html) (the input sets the sign). This is the *epistemic* companion: what the human must still hold in their head. See [AI Is the Reactor, Not the Plant](ai-is-the-reactor-not-the-plant.html), [AI Is an Amplifier, Not an Accelerator](ai-is-an-amplifier-not-an-accelerator.html).\n- Not a philosophy paper. Searle/Polanyi/Naur serve the practical distinction; the distinction does not serve them. Keep it readable for a broad audience.\n- Not a pitch for the system-design-interview project. It is used as one worked example of the method, not as the point.\n- Not a precise-numbers argument. Offloading/atrophy figures are attributed and directional, never load-bearing.\n\n## Modalities\n\nArticle, summary, dialog, comics\n\n## Open questions\n\n- The original author of the title quotation remains uncertain. The existing attribution decision is to say Andrej Karpathy popularized it, crediting an earlier tweet; do not call him its originator without further author-supplied evidence.\n- Final round 2 returned ESCALATE for undefined “edge-boosted,” with four uncorroborated minor flow notes. Closing edits explain the nearby-cache step and term, qualify the passive-use warning at its opening, explain the two related-article links, and clarify the Naur table cell. These are local repairs after the final permitted reader check; their readability is not independently rechecked, and the report is stale for both draft and spec. Review these closing edits before treating the article as checked; no third round was run.\n\n## Decision log\n\n- **2026-11-12** — At the two-round limit, apply only cheap local fixes named by the final readers: explain edge caching within the existing delay-reduction example, narrow the opening evidence warning to passive use, connect the reconstruction method to the linked boundary/trust arguments, and clarify the Naur benefit cell. Keep all 44 units and their order, source claims, figures, dates, names and copied criteria. Record that the closing edits leave the ESCALATE report stale; do not claim a pass or run a third check.\n- **2026-11-12** — Round 1 found four corroborated local reasoning gaps plus two minor ambiguities. Keep all 44 units and their order; narrow the Moravec inference, keep drill/hole roles consistent, describe the missing human theory directly, introduce the amplifier comparison locally, bridge incremental system design to reconstruction as learning, and state the redundant-server prerequisite for load balancing. Preserve all quotations, source claims, figures, dates and names; add no verified feature claim about the linked project.\n- **2026-07-05** — Built the whole post on the **thinking vs. understanding** split rather than the softer \"AI can't replace humans.\" Chosen because the distinction is falsifiable and actionable: thinking *is* outsourceable (that's the point), understanding is where the artifact meets reality. Rejected: a generic \"human-in-the-loop\" framing (too vague) and a \"jobs at risk\" framing (wrong altitude — this is epistemic, not economic).\n- **2026-07-05** — Anchored \"understand how it was built\" on **Naur's Programming as Theory Building** as the load-bearing idea, with Searle and Polanyi as the philosophical scaffolding. Chosen b <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
