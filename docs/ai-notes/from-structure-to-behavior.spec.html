    <meta name="description" content="For fifty years, software engineering optimized structure — coupling, boundaries, topology — because structure was expensive and behavior was hard to specify. Users never saw any of it; they only ever see behavior. Now that AI makes structure cheap to produce, the scarce work shifts to specifying behavior and outcomes — the same correction product management made when it moved from output to outcome. And when every discipline's scarce work becomes the same activity, the borders between product management, design, architecture, and engineering start to collapse into one spec-shaped conversation.">

<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published 2026-07-24 index.md and accepted legacy spec.md, using check_draft.py units and outcome_specs.parse_draft to map all 36 existing prose/list units. This contract precedes the revised prose. It retains the argument and adds one opening-question unit, one Monday-table lead-in and one closing handoff unit (39 units total); moves the existing Questions to Consider unit before Closing Thought; and specifies the concise opening and roadmap duties the published essay does not yet carry. Four figures, all captions, tables, references, links, front matter and the three-bullet KEY POINTS remain intact. No journal research ledger exists.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Why structural design served as an early proxy for behavior, and how cheaper generation changes that trade-off.\n- **Know:** How the move from structure to behavior parallels the product-management move from output to outcome.\n- **Believe:** Product, design, architecture, and engineering can co-author intended outcomes and behavior while retaining distinct expertise.\n- **Believe:** Cheaper structural production increases the need for behavioral and structural judgment.\n- **Be able to:** State an intended behavior and its outcome before asking an agent to generate a design.\n- **Be able to:** Identify a handoff where one shared specification would preserve intent.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader explains the shared pattern behind structure-to-behavior and output-to-outcome, including why the old proxies were useful. *Probe:* Why did engineers focus on structure, and how is the change described here related to product management moving from output to outcome? | `custom` | cold_reader | major |\n| AC-2 | A reader explains how one shared specification can connect disciplines without making their expertise interchangeable. *Probe:* What could product managers, designers, architects, and engineers share, and what would remain different about their contributions? | `custom` | cold_reader | major |\n| AC-3 | A reader can choose a practical change to review or specification work while preserving the need to judge generated structure. *Probe:* What would you change in a design review after reading this, and why would generated architecture still need human attention? | `custom` | cold_reader | major |\n\n## Thesis\n\n**Question:** What should become the central work of software disciplines when AI makes structure cheaper to produce?\n\n> **Claim:** As AI makes structure cheaper to produce and behavior faster to observe, product, design, architecture, and engineering should co-author specifications of intended outcomes and behavior while retaining their distinct expertise.\n\n**Disputed by:** The view that AI mainly accelerates each existing craft, so separate artifact ownership and sequential handoffs should remain the organizing model.\n\n**So what:** Teams should spend review effort on the behavior users need and preserve intent across disciplines instead of treating a completed diagram, feature, or codebase as evidence of value.\n\n**How and why:** Structure was an inspectable proxy when construction delayed feedback; cheaper construction exposes the harder questions of what should happen and why, which every discipline must answer together.\n\n**Supporting claims**\n\n- **S1** — Structure was a rational proxy for quality while it was inspectable early and behavior was costly to observe.\n- **S2** — Cheaper generation and regeneration shorten behavioral feedback, making precise behavioral intent the scarce work.\n- **S3** — Engineering's structure-to-behavior shift and product management's output-to-outcome shift correct the same substitution of a controllable artifact for its intended effect.\n- **S4** — A shared specification can connect outcome, interaction, constraint and implementation decisions without making disciplinary expertise interchangeable.\n- **S5** — The product-domain model demonstrates how structured, validated intent can become a shared artifact that humans and agents can work against.\n- **S6** — Teams must redirect effort toward specifying, exercising and agreeing on behavior while continuing to judge generated structure.\n\n## Role in the part\n\nEstablishes what generated software must serve before the part addresses how teams can trust and maintain it. Supports S1 of part `ai-software-development`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `comparison` in product-management-already-made-this-trip; `assertion_evidence_reasoning` in what-the-shared-artifact-looks-like)\n\nFirst justify the old structural proxy so its correction does not dismiss the craft. Explain the generation and feedback change before comparing it with product outcomes; establish the causal behavior-outcome link before deriving shared authorship. The worked artifact then makes that claim concrete, the warning limits it, and role moves plus reflection questions let readers apply it before the final synthesis and handoff. Moving the convergence claim before the comparison would leave its shared subject unexplained; moving the questions after the closing or references would make the essay end on a disconnected exercise.\n\n## Introduction\n\n**Hook** (`thought_provoking_question`): When AI makes the artifact easy to produce, what work still determines the outcome? In software, that question begins with what users need the system to do.\n\n**Bridge:** Engineers and adjacent disciplines know the effort of designing, reviewing and handing off code, diagrams, mockups and requirement documents. → Separate the effort of producing those artifacts from the behavior and outcome they are meant to cause; Hohpe's observation makes that distinction concrete for software.\n\n**Thesis statement** (The preserved KEY POINTS callout, especially bullet 3, and introduction p3, with its explicit qualification about distinct expertise.): As AI makes structure cheaper to produce and behavior faster to observe, product, design, architecture, and engineering should co-author specifications of intended outcomes and behavior while retaining their distinct expertise.\n\n**Roadmap** (Introduction p4: expand the current roadmap in its current position; add one short sentence tracing the journal from intended behavior through controls, delivery constraints, understanding and maintainable architecture to model-dependent product value and responsible leadership.):\n\n- Explain why structural proxies were rational and what AI changes about their cost and feedback. *Kept in:* why-we-were-structuralists, what-ai-changed.\n- Compare the shift with product management's outcome correction and derive the shared work between disciplines. *Kept in:* product-management-already-made-this-trip, the-borders-collapse.\n- Show one concrete shared artifact and explain why specifying behavior is still harder. *Kept in:* what-the-shared-artifact-looks-like, the-warning-behavior-is-harder.\n- Offer role-specific Monday moves and questions for choosing where to start. *Kept in:* what-to-do-on-monday, questions-to-consider.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p1 | context | When AI makes an artifact easier to produce, the remaining question is what work makes its intended effect happen. | reasoning: Journal opening question: When AI makes the artifact easy to produce, what work still determines the outcome? In software this asks what still determines whether the system serves its users.; reasoning: Preserve the existing three-bullet KEY POINTS callout verbatim before the prose. |  |\n| p2 | evidence | Hohpe's observation directs software work toward behavior because users experience the effect of structure rather than its design. | source: Gregor Hohpe's linked LinkedIn observation, short quotation about end users seeing behavior, warning that behavior is harder, and Barry O'Reilly postscript; retain the published compressed paraphrase. | `example`: The opening asks what determines the outcome once production is easier. → Hohpe's software example locates that remaining work in behavior. |\n| p3 | claim | The shift toward behavior joins the software disciplines around the same intended effects that product management calls outcomes. | reasoning: The published comparison between software's current shift and product management's earlier output-to-outcome correction. | `elaboration`: Hohpe identifies a change in what software work is about. → The author extends that observation through the output-to-outcome analogy to shared specification with distinct expertise. |\n| p4 | transition | The essay establishes why work converges on behavior before making that shift practical and opening the journal's wider questions of dependable software, product value and leadership. | reasoning: Keep the local roadmap complete; explicitly say this article establishes what generated software should serve, then connect the later journal itinerary to delivering that intention. Keep both scopes in the existing roadmap unit. | `sequence`: The introduction has stated the shared-work thesis. → A concise roadmap names every local body section and the wider journal path. |\n\n## Sections\n\n### Why We Were Structuralists\n\n**Controlling idea** (`explanation`, id `why-we-were-structuralists`): Structure became a rational proxy for quality because it could be inspected long before behavior could be observed.\n\n**Advances the thesis** (S1): Explains why the old focus made sense before arguing for its correction.\n\n**Transition in:** `elaboration`: The introduction promises to explain the old proxy before changing it. → The timing and cost constraints that made structural judgment useful.\n\n**Order of paragraphs** (`prerequisite_order`): The reader needs the delay in observing behavior before the contrast with early structure makes sense. The table then makes the proxy explicit, its professional consequences explain its persistence, and only then can its failure be criticized fairly. Moving the criticism first would make the old craft look irrational.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p5 | context | The shift away from structural production does not make the profession's earlier structural judgment a mistake. |  |  |\n| p6 | explanation | Behavior was difficult to judge early because it became fully observable only when an expensive system was running. | reasoning: Behavior defined as what the system does for a real user in a real situation; late observation in production under real load; prose specifications difficult to execute, verify or synchronize. | `elaboration`: The opening asks readers to judge structure fairly under its original constraints. → The delayed feedback and prose specifications that limited early behavioral review. |\n| p7 | comparison | Early structural review offered a useful way to estimate the cost of changing a system. | example: Module diagrams, coupling, dependencies and domain boundaries examined before code; a wrong boundary requiring months of manual rework.; figure: Figure 1 and assets/images/from-structure-to-behavior/structure-early-behavior-late.jpeg, with its existing caption. | `contrast`: Behavior could be judged only after costly construction. → Module diagrams, coupling and boundaries could be inspected before construction. |\n| p8 | comparison | Teams optimized visible structural properties as proxies for the user behavior they could not yet observe. | table: What we could inspect early / What actually mattered: boundaries and the user's job; dependencies and stress behavior; domain models and safe change; deployment topology and failure experience. | `cause_effect`: Structure provided early evidence of likely change costs. → The contrast table pairs inspectable structural concerns with the effects they were meant to serve. |\n| p9 | cause_effect | Review and career practices reinforced the structural proxy because it answered the period's real construction constraint. | example: Design reviews, architecture boards and career ladders rewarding structural fluency. | `elaboration`: The table identifies the structural properties teams could inspect. → Professional review and reward systems grew around those properties. |\n| p10 | analysis | The proxy became harmful when structural quality was treated as the goal rather than a means to user behavior. | example: The system responding, a payment clearing, an answer being right and a failure being handled gracefully, contrasted with hexagonal architecture. | `contrast`: The structural focus was a rational adaptation to earlier constraints. → Its limitation appears when teams lose the connection to experienced behavior. |\n\n### What AI Changed\n\n**Controlling idea** (`cause_effect`, id `what-ai-changed`): Cheaper structural generation shifts scarce work toward precise intended behavior by reducing both rework costs and feedback delay.\n\n**Advances the thesis** (S2): Explains the mechanism that changes the old structural trade-off.\n\n**Transition in:** `cause_effect`: Structure was a proxy whose justification depended on expensive construction and delayed behavior. → AI changes those production costs and the time to observe the intended effect.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): State the changed constraint, show lower rework cost and faster feedback, then locate the remaining risk and explain why attention moves there. The final scarcity statement generalizes that mechanism. Stating the conclusion before showing both effects would obscure why generation changes more than speed.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p11 | claim | AI changes the structural proxy's central constraint by making structure cheaper to produce. |  |  |\n| p12 | explanation | Cheap regeneration reduces the value of committing to the right structure before anything can be tried. | example: Agents scaffolding a service, splitting a module, introducing a queue and rearranging boundaries; the published contrast between months of manual rework and an afternoon of agent time plus review. | `elaboration`: The section claims that producing structure is no longer expensive. → Regeneration makes changing a structural decision cheaper as well. |\n| p13 | cause_effect | Fast end-to-end assembly lets observed behavior improve the specification much earlier. | reasoning: The published months-to-days contrast: put a working system before real users, observe it and sharpen the specification.; figure: Figure 2 and assets/images/from-structure-to-behavior/shortened-feedback-loop.jpeg, with its existing caption. | `additional_support`: Generation and regeneration reduce the cost of structural construction. → The same reduction also shortens the wait for a working system to reveal behavior. |\n| p14 | analysis | The remaining risk is whether anyone can state precisely what the generated system should do. | example: A modular and decoupled result with the wrong behavior; specification questions about users, conditions, edges and conflicting goals. | `contrast`: Teams can build and observe behavior sooner. → A vague intention can still produce plausible structure for the wrong behavior. |\n| p15 | explanation | Removing the construction bottleneck makes the behavioral question immediate instead of indefinitely deferrable. | source: The existing behavior-driven-development reference, 2006 date and contrast between the answers \"we're building\" and \"what does it do?\". | `elaboration`: Precise behavior is the remaining constraint. → The author explains why AI forces attention to that constraint when earlier invitations did not. |\n| p16 | synthesis | The economic pattern is a shift of effort from abundant structural production toward scarce behavioral specification. | source: Existing [AI Is the Reactor, Not the Plant](ai-is-the-reactor-not-the-plant.html) cross-link and the claim that value migrates to stages that stay scarce. | `conclusion_summary`: Construction can no longer absorb the effort that behavioral questions require. → The scarcity principle links the mechanism to the next post without requiring that post to have been read. |\n\n### Product Management Already Made This Trip\n\n**Controlling idea** (`comparison`, id `product-management-already-made-this-trip`): Product management's move from output to outcome reveals the same correction from controllable artifacts to intended effects.\n\n**Advances the thesis** (S3): Establishes the analogy and then connects system behavior causally to customer outcomes.\n\n**Transition in:** `similarity`: Software work moves toward the scarce task of specifying behavior once construction becomes easier. → Product management has already confronted an analogous move from outputs to outcomes.\n\n**Order of paragraphs** (`comparison`): The reader must learn the product-side meaning of outcome before the comparison table can be read, then hear what the table shows before the stronger causal connection between system behavior and customer outcomes is made. Putting the connection first would assume the term the analogy exists to explain.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p17 | claim | Product management supplies a second instance of the shift from produced artifact to intended effect. |  |  |\n| p18 | definition | Product management's outcome correction judged shipped work by the customer behavior it changed. | source: Melissa Perri's build trap and Josh Seiden's quoted definition: \"a change in customer behavior that drives business results.\" Preserve names, attribution and wording. | `example`: The section claims that product management lived through the same correction. → The build trap and Seiden's definition explain what the correction changed. |\n| p19 | comparison | The engineering and product shifts share corresponding proxies, constraints, effects and failure modes. | table: Six-row Software engineering / Product management table: what was optimized, why it was rational, experienced effect, what broke the proxy, scarce work and named failure mode. | `similarity`: The product-side output and outcome terms are now defined. → The existing side-by-side table aligns them with the engineering mechanism. |\n| p20 | analysis | Both disciplines are forced to face their intended effect when the controllable artifact stops being scarce. | reasoning: Visible artifacts are easier to control than effects are to specify and measure; cheaper artifacts remove the reason to use them as the main proxy. | `conclusion_summary`: The table aligns the same changes across both disciplines. → The author states the general pattern that explains the parallel. |\n| p21 | cause_effect | Customer outcomes constrain the system behavior that must cause them. | reasoning: Specify the outcome to constrain the behavior; justify the behavior by the outcome; what should happen in the world and what the system should do to cause it. | `elaboration`: The two disciplines share a pattern of returning attention to effects. → Their destinations also connect: system behavior is meant to produce the customer behavior that defines an outcome. |\n\n### The Borders Collapse\n\n**Controlling idea** (`cause_effect`, id `the-borders-collapse`): Shared intended effects make disciplinary artifact boundaries less useful without erasing the different judgments each discipline contributes.\n\n**Advances the thesis** (S4): Derives co-authorship from the causal connection between outcomes and behavior while bounding the claim.\n\n**Transition in:** `cause_effect`: The product outcome and the engineering behavior describe connected parts of one intended effect. → The same connection changes how disciplines divide their artifacts and handoffs.\n\n**Order of paragraphs** (`prerequisite_order`): Establish what the old borders separated before contrasting the remaining decisions, then infer the shared artifact and immediately limit the claim. Moving the expertise qualification earlier would qualify an unspecified change; omitting it would invite a role-elimination reading.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p22 | transition | The connection between outcomes and behavior has a consequence for how disciplines work together. |  |  |\n| p23 | context | Discipline boundaries were organized around artifacts whose creation and translation required separate craft. | example: Product requirement documents, design mockups, business capability maps, enterprise landscape diagrams and engineering code, plus the handoffs between them. | `elaboration`: The section promises a consequence for disciplinary boundaries. → The old artifact-based division of labor explains what those boundaries were doing. |\n| p24 | comparison | As artifact generation becomes easier, each discipline's remaining judgment concerns an aspect of intended outcomes and behavior. | table: The five-discipline Old scarce artifact / Residual scarce work table, retained in full. | `contrast`: Separate artifacts required separate craft and costly translation. → The role table identifies the specification decisions that remain when production is generated. |\n| p25 | analysis | Those contributions can form adjacent layers of one specification instead of a sequence of separate artifacts. | figure: Figure 3 and assets/images/from-structure-to-behavior/five-artifacts-one-spec.jpeg, with its existing caption.; reasoning: The right-hand table column can be read as one document drafted at different altitudes. | `conclusion_summary`: The role table maps each remaining decision to outcomes, behavior or constraints. → Reading those decisions together reveals one layered artifact that people can co-author. |\n| p26 | explanation | Collapsing artifact boundaries preserves disciplinary expertise while reducing the loss of intent at handoffs. | example: Design judgment about interaction, architecture judgment about systemic risk and product judgment about evidence and markets; the strategy-to-code translation chain. | `contrast`: One layered specification can replace separate artifacts. → The qualification distinguishes shared authorship from interchangeable expertise. |\n\n### What the Shared Artifact Looks Like\n\n**Controlling idea** (`example`, id `what-the-shared-artifact-looks-like`): The product-domain model makes the shared specification concrete as structured, validated intent that connects outcomes to implementation.\n\n**Advances the thesis** (S5): Shows one constructive shape for the common artifact without turning the essay into a methodology tutorial.\n\n**Transition in:** `example`: Disciplines can co-author one layered specification without losing expertise. → The author's product-domain model provides a worked example of that artifact.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): Name the example and its limits, describe its actual shape, explain the properties that make it usable, then derive the inversion. Leading with the inversion would use an abstract slogan before the reader has seen the artifact it describes.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p27 | example | The author's spec-driven product architecture work is one worked example of the proposed shared artifact. | source: Existing [What Is Spec-Driven Product Architecture?](../spec-driven-product-architecture/what-is-spec-driven-product-architecture.html) cross-link and the explicit qualification that it is one possible shape. |  |\n| p28 | description | The product-domain model connects the layers previously divided among disciplines in one set of structured files. | case: Customer groups and jobs, strategy and KPIs, capabilities, implementation-facing product bricks, teams, roadmaps and evidence, authored and validated together in a repository.; source: The already linked local record defines a product brick as an implementation-facing unit that can be built, owned and evolved, connected to product value; it can include user-facing components, services and data dependencies. Use this definition immediately after its first mention in the existing model-description paragraph. | `elaboration`: The prior paragraph names the worked example. → Its connected layers and human-agent authoring explain what the shared artifact actually contains. |\n| p29 | explanation (list) | The model works as a shared artifact because its traceable outcomes and validation rules let humans and agents check each contribution. | reasoning: Preserve the two-property list: outcomes trace down to capabilities and bricks, while identifiers, schema and references constrain checkable agent contributions. | `elaboration`: The model connects the disciplines' layers in structured files. → Two properties explain why that connection is useful to authors and reviewers. |\n| p30 | synthesis | Structural discipline shifts toward the enduring specification when code can be regenerated from it. | figure: Figure 4 and assets/images/from-structure-to-behavior/intent-structured-code-fluid.jpeg, with its existing caption. | `conclusion_summary`: The shared model requires explicit structure and validation. → The inversion places durable structure around intent while code becomes more fluid. |\n\n### The Warning: Behavior Is Harder\n\n**Controlling idea** (`counterargument`, id `the-warning-behavior-is-harder`): Behavioral specification demands more judgment even when its structured artifact is easier to generate.\n\n**Advances the thesis** (S6): Explains the skill and review duties that qualify the shift toward generated structure.\n\n**Transition in:** `contrast`: The worked example makes structured intent and generated code look achievable. → Hohpe's warning identifies the work that becomes harder rather than disappearing.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): Return to the initial warning, explain its three forms, then state the structural review duty that prevents overreading the thesis. Placing the practical moves ahead of these constraints would invite readers to act as if shared specification removes the hard work.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p31 | claim | Hohpe's warning that behavior is harder is a condition of the argument rather than an optional caution. | quotation: The existing short phrase \"while highly valuable, this is also harder\" attributed to Hohpe. |  |\n| p32 | explanation (list) | Behavior is harder because its possible situations, evidence and cross-discipline decisions resist complete advance specification. | reasoning: Preserve the three-part list on specifying completely, verifying by exercise, and agreeing across disciplines.; source: Barry O'Reilly's residuality theory, explained in the published verification item as stressing naive designs to learn what survives. | `elaboration`: The opening states that behavior remains harder. → The existing list explains the completeness, verification and agreement burdens. |\n| p33 | explanation | Generated structure still requires human judgment because it can undermine the behavior teams must own. | source: Preserve [Breaking Up the Vibe Monolith: Architecting AI-Built Systems to Keep Their Cool](breaking-vibe-monolith.html) and [You Can Outsource Thinking. You Cannot Outsource Understanding.](outsource-thinking-not-understanding.html) with their self-contained claims about congealing structure and human ownership. | `additional_support`: Specifying, verifying and agreeing on behavior remain difficult. → The associated duty to review generated structure also remains. |\n\n### What to Do on Monday\n\n**Controlling idea** (`recommendation`, id `what-to-do-on-monday`): Each role can redirect effort toward checkable intended behavior while preserving the judgment its discipline contributes.\n\n**Advances the thesis** (S4, S6): Turns the shared-work thesis and its cautions into concrete changes in review and authorship.\n\n**Transition in:** `problem_solution`: Behavior requires explicit judgment and generated structure still needs review. → The role-specific moves show where to put that judgment in ordinary work.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p34 | recommendation | Put each role's judgment into the intended outcomes, behavior and constraints that generated work must satisfy. | table: Preserve the entire Role / Move / What it buys you table for Engineer, Architect, Product manager, Designer / business architect and Leader. Add only a short lead-in linking the table to the harder work just established. |  |\n\n### Questions to Consider\n\n**Controlling idea** (`recommendation`, id `questions-to-consider`): Readers can locate where their own review habits and artifact handoffs still substitute structure for intended effects.\n\n**Advances the thesis** (S4, S6): Lets readers apply the proposed moves to a concrete review or handoff before the closing synthesis.\n\n**Transition in:** `elaboration`: The Monday table offers a change for each role. → The existing questions help readers identify where to apply one in their own organization.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p35 | recommendation (list) | Use the questions to choose where review attention or a shared specification would preserve behavioral intent in your organization. | reasoning: Preserve the existing lead-in and all seven questions on design review, checkable behavior, translation loss, customer change, scarce judgment, who joins outcome decisions, and expertise versus artifact borders. |  |\n\n## Conclusion: Closing Thought\n\n**Synthesis:** The two formerly separate proxy problems become one shared responsibility: when artifacts are easier to produce, the disciplines must preserve intended effects across their decisions instead of treating artifact completion as value. Their expertise remains distinct because the behavioral judgments are harder, not interchangeable.\n\n**So what:** Choose a real review or handoff where people can state a checkable behavior and the outcome it serves, then judge generated work against that intention instead of treating its completion as success.\n\n**Callback:** The opening question about what determines outcomes when artifacts become easier to produce, made concrete by Hohpe's observation that users only see behavior. The reader can now answer with shared specification and judgment: the user's experienced behavior links disciplines whose artifacts once separated their work.\n\n**Takeaway** (`course_of_action`): Write and review the intended outcome and behavior together, preserve each discipline's judgment, and examine the surrounding controls that make generated capability serve the intention.\n\n**Hand-off** to [AI Is the Reactor, Not the Plant](ai-is-the-reactor-not-the-plant.html): `elaboration`: Generating structure cheaply shifts attention to the behavior and outcomes it must serve. → The surrounding controls and evaluation that make generated capability serve those intentions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p36 | synthesis | The shared duty to cause an intended effect becomes clearer when producing a professional artifact no longer justifies the old division of attention. | reasoning: The published closing comparison of engineering's structural proxy and product management's output proxy, both rational under their old constraints. |  |\n| p37 | analysis | Teams must now answer what the system should do and for whom because construction can no longer defer those decisions. | reasoning: Preserve the closing questions: What should this system do? For whom? What should change in the world because it exists? | `cause_effect`: The old artifact proxies no longer settle whether intended effects are achieved. → The reader's responsibility is to answer the behavioral and outcome questions directly. |\n| p38 | synthesis | The disciplines' shared conversation returns attention to the behavior users have experienced all along. | reasoning: The existing callback that users never saw structure and only saw behavior. | `conclusion_summary`: The unavoidable questions concern the system's effect on users. → The callback shows why different disciplines now need to answer those questions together. |\n| p39 | transition | Start with a shared, checkable intention, then ask what controls and evaluation make generated capability serve it. | reasoning: End with a brief action and [AI Is the Reactor, Not the Plant](ai-is-the-reactor-not-the-plant.html) handoff, explicitly treating the shared specification as the starting point for dependable operation. | `elaboration`: The reader has a shared specification of the behavior and outcomes generated work should serve. → The next post examines the surrounding controls and evaluation that make capability fulfill those intentions. |\n\n## Non-goals\n\n- Not an obituary for software architecture or architects. The claim is that structural *production* is commoditized; structural *judgment* (operability, cost, failure modes) survives — and behavior specification needs it.\n- Not a role-elimination or org-design piece. Borders blur; expertise does not become interchangeable, and the post does not predict job losses or propose a new org chart.\n- Not a full pitch for spec-driven product architecture — it appears as one worked example of the converged artifact, roughly one section, with pointers to the dedicated journal. See [What Is Spec-Driven Product Architecture?](../spec-driven-product-architecture/what-is-spec-driven-product-architecture.html).\n- Not a methodology tutorial (no BDD/TDD how-to, no spec-format prescriptions).\n- Not a re-run of [You Can Outsource Thinking. You Cannot Outsource Understanding.](outsource-thinking-not-understanding.html) — that note says understanding stays human; this one says *which work* the disciplines converge on. Cross-link, don't repeat. See [You Can Outsource Thinking. You Cannot Outsource Understanding.](outsource-thinking-not-understanding.html).\n\n## Modalities\n\nArticle, summary, dialog, comics\n\n## Open questions\n\n- ~~Exact primary URL for the Hohpe LinkedIn post.~~ **Resolved:** pinned by the author — https://www.linkedin.com/posts/ghohpe_structure-behavior-activity-7486322897817538561-Bc1T — now linked in the quote attribution and To Probe Further.\n- Whether section 5 (border collapse) needs a named external witness (e.g. team-topology / fusion-team commentary) or stands on the argument alone.\n- Preserve the published Seiden quotation using \"customer behavior\"; the legacy source note below says \"human behavior\". This pass carries both records without adjudicating or changing the attributed quotation, because new factual research is outside scope.\n\n## Decision log\n\n- **2026-11-12** — Round 1 returned REVISE: 207 passed, five failed (three major, two minor), all fault draft. Revise only p4 (article-to-journal connection), p14 (explicit risk antecedent), p28 (readable model description and sourced first-use brick definition) and the verification item in p32 (direct stress-testing thread with the Barry O'Reilly attribution and existing time references retained). Keep all 39 units, their order, their controlling ideas, journal fields and acceptance criteria unchanged. No new flow rubric is needed because no idea order changes. Prepare the second and final authorized draft check after preservation and structure checks. Rejected: Moving the journal roadmap out of the required introduction.; Moving or splitting the warning list.; Inventing a company or product example for a brick.\n- **2026-11-12** — Resolved the Phase A reconstruction gaps in Phase B: inserted the opening question, completed the compact roadmap, stated the distinct-expertise qualification in the introduction, added the Monday lead-in and next-post handoff, and moved the original Questions block before the closing synthesis. Replaced the journal-position phrase \"earlier notes\" with \"related notes\" and expanded SDLC on first prose use. Preserved the existing Hohpe paraphrase otherwise. No names, dates, figures, numerical tokens or heading text changed; no real-world factual claims were added.\n- **2026-11-12** — Fresh isolated flow reader returned sound with notes in flow-review-1.txt, with no moves, merges or cuts. Adopted its only note: narrow the post-level assertion_evidence_reasoning label to what-the-shared-artifact-looks-like, leaving The Borders Collapse under its existing prerequisite_order pattern. No idea order or transition changes; no unadopted flow notes. The opening question uses one direct software bridge rather than repeating the same question. Rejected: Changing the already sound argument order.; Leaving contradictory pattern labels in the post and section declarations.\n- **2026-11-12** — Reconstructed the published essay at full paragraph level before editing prose. Retain every existing body paragraph, list, table, figure, caption, source and question; attach visual material to its controlling paragraph. The legacy Structure item \"The Quote\" is realized in the existing unheaded introduction rather than invented as a new section. No canonical research ledger exists; use the published article and legacy e two shifts and a skeptical border-collapse discussion, and comics for the proxy-to-shared-spec arc and journal convention. Their existing content is outside this revision pass.\n- **2026-11-12** — The legacy spec contains no numeric word limit; do not derive one from front matter or invent one. Keep status draft under the user's authorized auto run, with no more than two draft-check rounds and no commit or push.\n- **2026-07-24** — Framed the post as **one pattern seen twice** (structure → behavior in engineering; output → outcome in product) rather than as a commentary on the Hohpe quote alone. Chosen because the analogy is the author's core addition and carries the border-collapse thesis. Rejected: quote-plus-riff essay (too thin); leading with spec-driven product architecture (reads as a pitch, buries the general argument).\n- **2026-07-24** — Placed the **border-collapse thesis as the payoff** (section 5) rather than the headline. Chosen because it only lands after the two shifts are established as the same pattern. Rejected: \"the end of the PM/ engineer split\" as the title claim (overclaims; invites org-chart readings the Non-goals fence off).\n- **2026-07-24** — Used [What Is Spec-Driven Product Architecture?](../spec-driven-product-architecture/what-is-spec-driven-product-architecture.html) as the single worked example of the converged artifact, one section only. Rejected: spreading it through the post (turns the essay into a project pitch).\n- **2026-07-24** — Slug `from-structure-to-behavior`; placed in the **AI Software Development** section of `config.yaml` — the anchor quote and the argument start in the SDLC even though the thesis reaches product. Rejected: AI Product Development section (the output→outcome material is the analogy, not the subject).\n- **2026-07-24** — Modalities deferred to after the article (author default in this journal is to add summary/dialog/comics incrementally). Resolved same day after the article was reviewed: all three added, matching every other post in the journal.\n\n## Sources\n\n- **Internal**\n  - [What Is Spec-Driven Product Architecture?](../spec-driven-product-architecture/what-is-spec-driven-product-architecture.html) — the worked example: the product-domain model as the shared, validated spec connecting customer outcomes to implementation structure.\n  - [You Can Outsource Thinking. You Cannot Outsource Understanding.](outsource-thinking-not-understanding.html) — generated structure still has to be understood by a human; the last human mile applies to generated architecture too.\n  - [AI Is the Reactor, Not the Plant](ai-is-the-reactor-not-the-plant.html) — value lives in what surrounds generation; here, the surrounding work is behavior specification.\n  - [Breaking Up the Vibe Monolith: Architecting AI-Built Systems to Keep Their Cool](breaking-vibe-monolith.html) — structure quietly returns as the thing that keeps generated systems manageable; the counterweight to \"structure is cheap now.\"\n  - _journals/ai-notes/posts/from-structure-to-behavior/index.md — Authoritative published prose, facts, attribution, front matter, links, four figures and captions, tables, KEY POINTS callout, references and seven reflection questions for this reconstruction.\n  - _journals/ai-notes/posts/from-structure-to-behavior/spec.md (baseline archived in /private/tmp/ai-notes-outcome-revision-20261112/original/from-structure-to-behavior/spec.md) — Legacy intent, outcomes, non-goals, modality decisions, open questions, sources and full decision/changelog history.\n  - _journals/ai-notes/journal-spec.json — Exact copied intent, thesis and role; journal and part opening duties; the next post's elaboration relationship.\n  - _journals/spec-driven-product-architecture/posts/what-is-spec-driven-product-architecture/index.md:123 — Existing linked record supplies the first-use product-brick definition for the round-one known-before-new finding: a buildable, ownable, evolvable implementation unit, with user-facing components, services and data dependencies as possible contents. No company-specific example or product claim added.\n- **External**\n  - **Gregor Hohpe, [LinkedIn post](https://www.linkedin.com/posts/ghohpe_structure-behavior-activity-7486322897817538561-Bc1T) (2026)** — the anchor quote: AI-led SDLC forces the move from structure to behavior; users only see behavior; \"while highly valuable, this is also harder.\"\n  - **Gregor Hohpe, *The Software Architect Elevator*** — the same author's frame for architects connecting business intent (\"penthouse\") to technical reality (\"engine room\") — the border-crossing move the post generalizes.\n  - **Barry O'Reilly, *Residues: Time, Change, and Uncertainty in Software Architecture* / residuality theory** — the explicit critique of structuralism in architecture the quote's postscript nods to: the world as processes, not static structures.\n  - **Josh Seiden, *Outcomes Over Output* (2019)** — the canonical statement of the product-side shift; outcome as \"a change in human behavior that drives business results\" — note the word *behavior* on both sides of the analogy.\n  - **Melissa Perri, *Escaping the Build Trap* (2018)** — output-optimizing organizations mistake shipping features for creating value; the product twin of structure-worship.\n  - **Marty Cagan (SVPG), *Inspired* / *Empowered*** — teams given outcomes to achieve rather than outputs to ship; the operating model the border collapse points toward.\n  - **Dan North, *Introducing BDD* (2006)** — historical precedent: renaming tests to behavior changed what engineers specified; evidence the industry has tried to face behavior before, ahead of the tooling that now makes it cheap.\n\n## Changelog\n\n- **2026-11-12** — Before round-two prose revision, recorded the five draft findings and the four affected units; added the definition source already linked by the essay. Unit order, count and controlling ideas stay unchanged. Round-one report becomes s             }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
