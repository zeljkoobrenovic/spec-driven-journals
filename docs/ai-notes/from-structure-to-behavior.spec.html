<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "# Spec: From Structure to Behavior, From Output to Outcome\n\n> Working doc for the post in this folder. The spec drives the post; the post\n> is the artifact. Keep it short — if the spec is longer than the post, trim it.\n\n## Intent\n\nName the deep shift an AI-led SDLC forces on software work: **from defining\nstructure to defining behavior**. For decades the profession's center of\ngravity was structure — separation of concerns, loose coupling, modularity,\ndomain boundaries, deployment topology — because structure was expensive to\nbuild and behavior was hard to specify, so structure became our proxy for\nquality. Gregor Hohpe's observation is the anchor: end users never see the\nstructure; they only see the behavior — and **now that creating structure has\nbecome cheap, we can finally focus on behavior**, which is more valuable *and*\nharder. The post then shows this is not a new pattern but the software twin of\na shift product management already went through: **from output to outcome**\n(Seiden, Perri, Cagan) — in both cases a discipline optimized what it could\nproduce and control instead of the effect it exists to cause, because the\neffect was harder to specify and measure. The payoff thesis: when structure is\ncheap to generate, the scarce shared work across product management, design,\nenterprise architecture, business architecture, and software engineering\nbecomes the same activity — **specifying intended behavior and outcomes** —\nand the borders between those disciplines start to collapse into one\nspec-shaped conversation. The author's [What Is Spec-Driven Product Architecture?](../spec-driven-product-architecture/what-is-spec-driven-product-architecture.html)\nwork is the constructive worked example: a structured, validated model that\nconnects customer outcomes to implementation, authored by humans and AI agents\nin one shared language. Close with Hohpe's warning taken seriously: behavior\nis harder than structure, and the shift raises the bar rather than lowering it.\n\n## Audience\n\n- Software engineers and architects who feel their structural skills (patterns,\n  boundaries, topology) being commoditized by AI agents and want to know where\n  the craft moves next.\n- Product managers, designers, and business/enterprise architects who sense\n  that AI is pulling their work and engineering's work toward the same\n  artifact — the specification of behavior and outcomes.\n- Readers of the ai-notes spine who want the *disciplinary* consequence of the\n  earlier notes: if thinking is outsourceable and structure is cheap, what do\n  the traditional roles converge on?\n\n## Success criteria\n\n- [ ] Reader can state the core shift in one line — **AI moves the scarce work\n      from defining structure to defining behavior** — and say why (users only\n      ever experience behavior; structure was a proxy that made sense while it\n      was expensive).\n- [ ] Reader sees the **structure : behavior :: output : outcome** analogy as\n      one pattern, not two — both disciplines optimized the controllable\n      artifact over the intended effect, and in both cases the correction came\n      when producing the artifact stopped being the bottleneck.\n- [ ] Reader can explain *why* structure dominated for fifty years without the\n      post dismissing it — structure was the honest proxy when construction was\n      expensive and specs could not be executed or verified.\n- [ ] Reader gets the **border-collapse thesis** concretely: PM, design,\n      enterprise architecture, business architecture, and software engineering\n      converge on specifying behavior/outcomes, with at least one worked\n      example of what the shared artifact looks like\n      ([What Is Spec-Driven Product Architecture?](../spec-driven-product-architecture/what-is-spec-driven-product-architecture.html)'s product-domain model).\n- [ ] Reader sees the **shortened feedback loop**: cheap structure lets\n      end-to-end systems be assembled fast, so behavior can be *observed*\n      early in a running system rather than only specified in advance —\n      cheap structure both forces attention to behavior and supplies the\n      instrument for studying it.\n- [ ] Reader takes Hohpe's **warning** seriously: behavior is harder than\n      structure — harder to specify completely, verify, and agree on — so the\n      shift raises the skill bar; it does not \"democratize away\" the work.\n- [ ] Reader does **not** conclude that structure/architecture is dead:\n      structure still matters for operability, cost, and evolution — it becomes\n      cheap to *produce* and increasingly generated, not irrelevant.\n- [ ] Hohpe's post is **summarized faithfully, not quoted in full** — a\n      compressed paraphrase with a link back to the original, direct quotes\n      limited to short key phrases — and the Barry O'Reilly structuralism\n      postscript is explained, not left as an in-joke.\n\n## Non-goals\n\n- Not an obituary for software architecture or architects. The claim is that\n  structural *production* is commoditized; structural *judgment* (operability,\n  cost, failure modes) survives — and behavior specification needs it.\n- Not a role-elimination or org-design piece. Borders blur; expertise does not\n  become interchangeable, and the post does not predict job losses or propose\n  a new org chart.\n- Not a full pitch for spec-driven product architecture — it appears as one\n  worked example of the converged artifact, roughly one section, with pointers\n  to the dedicated journal.\n- Not a methodology tutorial (no BDD/TDD how-to, no spec-format prescriptions).\n- Not a re-run of [You Can Outsource Thinking. You Cannot Outsource Understanding.](outsource-thinking-not-understanding.html) — that note says\n  understanding stays human; this one says *which work* the disciplines\n  converge on. Cross-link, don't repeat.\n\n## Modalities\n\n- [x] `summary.md` — management summary. Warranted: the border-collapse\n      thesis and the staffing consequence (\"stop funding the translation\n      chain\") are leadership messages.\n- [x] `dialog.md` — two-host dialog. Warranted: the structure-vs-behavior and\n      output-vs-outcome parallels play well as back-and-forth, and the\n      border-collapse claim benefits from a skeptical co-host.\n- [x] `comics.md` — explainer comic. Warranted: journal convention (all posts\n      carry one), and the proxy-worship → cheap-structure → converging-desks\n      arc is visual.\n\n## Structure\n\nHouse style (KEY POINTS block → essay body → contrast tables → Monday moves →\nClosing → To Probe Further → Questions). Working section order:\n\n1. **The Quote** — Hohpe's observation, summarized with a link back to the\n   original (not reproduced verbatim); what \"enamored with structure\" looked\n   like in practice (the checklist: concerns, coupling, boundaries, topology).\n2. **Why We Were Structuralists** — structure as the honest proxy: construction\n   was expensive, behavior was unverifiable in advance, so we reviewed what we\n   could see. Not a mistake; an adaptation to old constraints.\n3. **What AI Changed** — agents make structure cheap to produce and regenerate;\n   the constraint that justified the proxy is gone; attention snaps to the\n   thing users actually experience. Second effect: cheap structure means whole\n   end-to-end systems come together fast, collapsing the feedback loop on\n   behavior itself — behavior stops being a lagging, production-only signal\n   and becomes observable in a working system within days.\n4. **Product Management Already Made This Trip** — output → outcome (Seiden,\n   Perri, Cagan): same pattern, one discipline earlier. Contrast table:\n   structure/behavior vs output/outcome.\n5. **The Borders Collapse** — when every discipline's scarce work is specifying\n   intended behavior and outcomes, PM, design, EA, business architecture, and\n   engineering are drafting sections of the same spec. What each border looked\n   like; what the shared conversation looks like.\n6. **What the Shared Artifact Looks Like** — spec-driven product architecture\n   as the worked example: a structured product-domain model (customers →\n   strategy → capabilities → bricks → teams → roadmap → evidence) that humans\n   and agents co-author and validate.\n7. **The Warning: Behavior Is Harder** — completeness, verification, and\n   agreement are harder for behavior than structure; the O'Reilly/structuralism\n   note (residuality theory: the world is processes, not still pictures);\n   structure returns as a *generated* concern you still must understand\n   ([You Can Outsource Thinking. You Cannot Outsource Understanding.](outsource-thinking-not-understanding.html)).\n8. **What to Do on Monday** — moves table (per role: engineer, architect, PM).\n9. **Closing Thought** — we optimized the artifact we could control; AI forces\n   us to face the effect we exist to cause.\n\n## Open questions\n\n- ~~Exact primary URL for the Hohpe LinkedIn post.~~ **Resolved:** pinned by\n  the author — https://www.linkedin.com/posts/ghohpe_structure-behavior-activity-7486322897817538561-Bc1T\n  — now linked in the quote attribution and To Probe Further.\n- Whether section 5 (border collapse) needs a named external witness (e.g.\n  team-topology / fusion-team commentary) or stands on the argument alone.\n\n## Decision log\n\n- **2026-07-24** — Framed the post as **one pattern seen twice** (structure →\n  behavior in engineering; output → outcome in product) rather than as a\n  commentary on the Hohpe quote alone. Chosen because the analogy is the\n  author's core addition and carries the border-collapse thesis. Rejected:\n  quote-plus-riff essay (too thin); leading with spec-driven product\n  architecture (reads as a pitch, buries the general argument).\n- **2026-07-24** — Placed the **border-collapse thesis as the payoff** (section\n  5) rather than the headline. Chosen because it only lands after the two\n  shifts are established as the same pattern. Rejected: \"the end of the PM/\n  engineer split\" as the title claim (overclaims; invites org-chart readings\n  the Non-goals fence off).\n- **2026-07-24** — Used [What Is Spec-Driven Product Architecture?](../spec-driven-product-architecture/what-is-spec-driven-product-architecture.html) as the\n  single worked example of the converged artifact, one section only. Rejected:\n  spreading it through the post (turns the essay into a project pitch).\n- **2026-07-24** — Slug `from-structure-to-behavior`; placed in the **AI\n  Software Development** section of `config.yaml` — the anchor quote and the\n  argument start in the SDLC even though the thesis reaches product. Rejected:\n  AI Product Development section (the output→outcome material is the analogy,\n  not the subject).\n- **2026-07-24** — Modalities deferred to after the article (author default in\n  this journal is to add summary/dialog/comics incrementally). Resolved same\n  day after the article was reviewed: all three added, matching every other\n  post in the journal.\n\n## Sources\n\n- **Internal**\n  - [What Is Spec-Driven Product Architecture?](../spec-driven-product-architecture/what-is-spec-driven-product-architecture.html) — the worked example: the\n    product-domain model as the shared, validated spec connecting customer\n    outcomes to implementation structure.\n  - [You Can Outsource Thinking. You Cannot Outsource Understanding.](outsource-thinking-not-understanding.html) — generated structure still has to\n    be understood by a human; the last human mile applies to generated\n    architecture too.\n  - [AI Is the Reactor, Not the Plant](ai-is-the-reactor-not-the-plant.html) — value lives in what surrounds\n    generation; here, the surrounding work is behavior specification.\n  - [Break                 return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
