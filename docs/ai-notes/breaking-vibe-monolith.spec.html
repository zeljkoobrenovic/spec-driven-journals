2 | A reader connects moving boundaries to cognitive load, concentrated ownership, burnout, and the difficulty of scaling beyond a small team. *Probe:* How does architectural instability create a human cost, especially for people fluent with AI? | `custom` | cold_reader | major |\n| AC-3 | A reader names a concrete way to stabilize high-impact seams while allowing changes within them. *Probe:* What should a team hold stable, and what first action follows from the article? | `custom` | cold_reader | major |\n\n## Thesis\n\n**Question:** How can teams sustain AI-assisted development when the architecture changes faster than people can understand and own it?\n\n> **Claim:** Teams should stabilize domain boundaries, API contracts, and data models while allowing fast changes within them, because continuous re-architecting destroys shared ownership and concentrates validation work on a few engineers.\n\n**Disputed by:** The view that repeated end-to-end regeneration and enough after-the-fact testing can sustain rapid development without deliberately holding architectural boundaries stable.\n\n**So what:** Architecture decisions determine whether increased output can scale across teams without exhausting the people who understand the system.\n\n**How and why:** When boundaries keep moving, local reasoning and durable ownership fail; the few people able to follow the whole system inherit the coordination and validation burden, while stable seams make that work divisible.\n\n**Supporting claims**\n\n- **C1** — Generated changes can outrun shared understanding, and brute-force generation plus after-the-fact verification consumes finite technical and human capacity.\n- **C2** — Continuous re-architecting produces a distinct temporal failure: a system can look modular today while its moving foundations prevent safe local reasoning over time.\n- **C3** — Moving boundaries create avoidable cognitive load and concentrate ownership and validation on the few engineers who can still understand the whole system.\n- **C4** — Whole-system understanding can sustain a small team's speed, but it cannot replace the durable boundaries a larger organization needs to coordinate.\n- **C5** — Deliberately controlling changes to domain boundaries, API contracts and data models makes ownership divisible while preserving fast change within those seams.\n\n## Role in the part\n\nShows how architecture can protect and distribute the understanding that the preceding essay says people must retain. Supports S5 of part `ai-software-development`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `small_to_large` in trust-gap; `assertion_evidence_reasoning` in brute-force and continuous-rearchitecting; `comparison` in monolith-taxonomy; `small_to_large` in best-people and scaling; `large_to_small` in cooling-down through monday)\n\nBegin with an unreviewable change and the trust gap, then show why more generation and verification effort is unsustainable. Name continuous re-architecting and distinguish the temporal monolith before deriving cognitive load, concentrated ownership and the scaling limit. Only then can stable seams answer a specific failure rather than become generic governance advice. Put Monday actions and the preserved reflection questions before the final synthesis and platform hand-off. Moving the human cost after the solution would turn a co-equal part of the thesis into an aside; moving the taxonomy after it would leave the causal mechanism undefined.\n\n## Introduction\n\n**Hook** (`direct_statement`): Software now grows faster than our trust in it.\n\n**Bridge:** People must understand generated work well enough to maintain it and judge its value, even when AI produces it quickly. → A growing team needs architectural stability that lets people share that understanding instead of requiring each person to hold the whole system in mind.\n\n**Thesis statement** (The preserved KEY POINTS bullets 2 and 3 state the diagnosis and response; introduction p02 connects them to shared human understanding.): Hold domain boundaries, API contracts, and the data model stable deliberately, so AI can change their internals quickly without dissolving ownership or concentrating validation on a few engineers.\n\n**Roadmap** (New introduction p03, after the original trust-and-sustainability opening and a short bridge from understanding to shared ownership. Use a concrete article roadmap with the anecdote, comparisons, human costs and first actions; do not add an abrupt itinerary of the journal.):\n\n- Begin with the 17,000-line pull request to show why generating code and verifying it by brute force opens a trust gap and spends finite resources. *Kept in:* trust-gap, brute-force, resource-cost.\n- Distinguish continuous re-architecting from under-refactoring, then locate the Vibe Monolith among four kinds of monolith. *Kept in:* continuous-rearchitecting, monolith-taxonomy.\n- Trace moving boundaries into cognitive load, concentrated ownership and burnout, then explain why small-team speed does not remove the coordination limit. *Kept in:* cognitive-load, best-people, scaling.\n- Identify the seams to hold stable, turn that principle into Monday actions, and use reflection questions to choose where to start. *Kept in:* cooling-down, monday, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | claim | Trust and sustainability are the scarce resources that frame the architecture problem in AI-assisted development. | quotation: > **KEY POINTS:** > > * **Software now grows faster than our trust in it.** AI lets us generate code by brute force and verify it by brute force — and brute force burns hardware, money, tokens, and, most of all, the engineers who are *best* at AI. That gap, not raw capability, is the problem. > * The architectural symptom is **continuous re-architecting**, and its product is the **Vibe Monolith**: a system that is modular on paper yet behaves as one rigid entity, because its foundations never hold still long enough for anyone to own or reason about a single part. > * Architecture's job now is to **cool the system down** — freeze the highest-blast-radius seams (**domain boundaries, API contracts, the data model**) and let AI move fast inside them. **The way out of the burn is not more force; it is better structure.** |  |\n| p02 | transition | Human understanding can be shared across a growing team only when people have stable architectural boundaries around the work they own. | reasoning: The preceding essay requires people to understand generated work before owning it; this essay asks how architecture keeps that responsibility divisible. | `problem_solution`: Trust and sustainability depend on people understanding what they accept. → Stable boundaries allow a team to divide that understanding and ownership. |\n| p03 | transition | The essay follows the trust gap through architectural churn and human burden before choosing stable seams and practical first moves. | reasoning: A 17,000-line PR; generation and verification costs; continuous re-architecting and monolith comparisons; cognitive load and burnout; small-team scaling; frozen seams; Monday actions and reflection questions. | `elaboration`: The architectural task is to make human understanding and ownership sustainable. → The article will diagnose the obstacles before proposing seam-level controls. |\n\n## Sections\n\n### Software Is Growing Faster Than Our Trust\n\n**Controlling idea** (`analysis`, id `trust-gap`): A development process loses its trust-building function when generated changes arrive faster than people can understand them.\n\n**Advances the thesis** (C1): Makes the comprehension gap concrete before diagnosing its costs.\n\n**Transition in:** `example`: The roadmap starts with the widening gap between software output and trust. → A CTO's reported 17,000-line PR makes that gap concrete.\n\n**Order of paragraphs** (`small_to_large`): The reported PR gives the reader a concrete scale, its review purpose explains the failure, and the broader lifecycle contrast shows why the case matters. Putting the general claim first would weaken the evidence-to-stakes progression.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p04 | example | A CTO's reported 17,000-line pull request compresses an enormous amount of work into one review event. | case: A startup CTO in Amsterdam reported merging one pull request of 17,000 lines of code, described as one to two person-years of work. |  |\n| p05 | analysis | A review ceremony cannot manufacture trust when the change is too large for a reviewer to understand. | reasoning: A pull request is the checkpoint at which a person should understand a change well enough to vouch for it; the reported 17,000-line PR still went through approval. | `cause_effect`: The 17,000-line change reaches one review checkpoint. → The scale undermines the understanding that checkpoint is meant to establish. |\n| p06 | explanation | AI-driven growth can outrun the time people need to understand its implications. | reasoning: The existing essay identifies AI use across the software development lifecycle and in new product capabilities, with new integrations arriving before earlier implications are understood. | `elaboration`: The single PR shows output arriving without matching comprehension. → The same gap can appear across lifecycle changes and product integrations. |\n| p07 | comparison | Incremental development builds trust alongside code, while a large generated change can collapse those checkpoints into one. | example: Short iterations, working software, continuous feedback and retrospectives in the author's account of agile development.; figure: Figure 1, trust-gap.jpeg: a steep CODE curve and flatter TRUST curve with a shaded gap; preserve image, alt text and caption exactly. | `contrast`: AI-driven change can outpace understanding. → Earlier incremental checkpoints show what is lost when that pacing disappears. |\n\n### We Are Using Brute Force — for Both Building and Believing\n\n**Controlling idea** (`comparison`, id `brute-force`): Increasing generation and after-the-fact verification effort does not by itself supply shared understanding or a clear standard of quality.\n\n**Advances the thesis** (C1): Explains why simply adding more work on both sides does not close the trust gap.\n\n**Transition in:** `cause_effect`: Trust no longer grows in step with generated code. → Teams try to close the gap by applying more effort to generation and verification.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): Set out the two sides together before explaining the verification limit; discussing the limit first would leave the reader without the mechanism being judged.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | comparison | Both building AI-generated systems and trying to trust them can become exercises in brute force. | table: The existing Building/Believing table contrasts rapid black-box generation with extensive after-the-fact testing and evaluation. |  |\n| p09 | analysis | Verification effort escalates when the quality standard is unclear and the volume exceeds human review capacity. | reasoning: Testing against a standard not fully defined and reviewing more material than people can meaningfully examine. | `elaboration`: The Building/Believing contrast shows weaknesses on both sides. → The trust side combines unclear criteria with excessive review volume. |\n\n### Brute Force Does Not Scale — Everything and Everyone Is Burning\n\n**Controlling idea** (`cause_effect`, id `resource-cost`): Brute-force production and verification spend finite technical and human capacity, including the future supply of experienced maintainers.\n\n**Advances the thesis** (C1): Establishes why an architectural response must reduce the burden rather than merely add effort.\n\n**Transition in:** `cause_effect`: Verification has become an escalating cost. → The combined production and verification load consumes scarce resources.\n\n**Order of paragraphs** (`large_to_small`): Start with the full resource burden and then examine its longer-lived human consequence. The career-pipeline point would be a detour without the resource constraint first.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | explanation (list) | Brute force consumes hardware, inference, verification capacity and human attention at the same time. | example: The preserved four-item list: hardware competition; overloaded and expensive inference; compute for verification; engineers absorbing the rate of change. |  |\n| p11 | cause_effect | The burden also falls on future maintenance capacity when the junior-to-senior career pipeline is weakened. | reasoning: The existing essay observes that newly generated technical debt needs senior judgment while junior roles that develop future seniors are being cut in many places. | `cause_effect`: The resource list ends with current engineers under pressure. → The same reliance on human judgment creates a longer-term capacity problem. |\n\n### The Architectural Symptom: Continuous Re-Architecting\n\n**Controlling idea** (`definition`, id `continuous-rearchitecting`): The author's observed agentic failure mode is repeated foundation change, which must be distinguished from published under-refactoring findings.\n\n**Advances the thesis** (C2): Names the mechanism that stable-seam governance must address without treating different evidence as proof of one cause.\n\n**Transition in:** `elaboration`: Brute force consumes resources because the resulting work still needs human judgment. → Continuous re-architecting is the architectural pattern the author observes within that workload.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): Name continuous re-architecting, make churn observable, distinguish two mechanisms, then isolate the moving-foundation problem. The taxonomy that follows needs this distinction; putting the term after the evidence would leave the reader guessing what the figures explain.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p12 | definition | Continuous re-architecting is the author's name for the repeated rebuilding of foundations in an AI-powered software development lifecycle. | reasoning: The author's observation of AI-powered SDLC work; expand SDLC as software development lifecycle at this occurrence. |  |\n| p13 | evidence | Churn makes rapid reworking visible, while the interpretation of that churn remains distinct from the published measurements. | statistic: GitClear's analysis of roughly 211 million changed lines projected code churn, defined as lines reverted or rewritten within two weeks, to double across the AI-adoption period while the share of moved code fell.; case: The author observes more commits and higher churn in fully agentic projects and labels the continuous re-architecting explanation as an intuition. | `example`: Continuous re-architecting repeatedly changes foundations. → Churn is a visible signal, but its cause needs to be separated from the measurement. |\n| p14 | comparison | Autocomplete under-refactoring and agentic re-architecting are different mechanisms despite both producing churn. | table: The preserved autocomplete/agentic table compares eras, failure modes and traps: duplication and missed reuse versus repeated changes to data structures, APIs, domain boundaries and core concepts. | `contrast`: Both the reported measurements and the author's projects involve churn. → The comparison separates under-refactoring from repeated end-to-end foundation changes. |\n| p15 | analysis | End-to-end agentic development can keep reopening foundations whose implications require deliberate human judgment. | reasoning: The existing paragraph contrasts duplicated additions with repeated rewrites of the foundations and retains the author's distinction between autocomplete and agentic work. | `elaboration`: The comparison identifies foundations as the agentic failure point. → Those rapid foundational rewrites undermine deliberate long-term planning. |\n| p16 | transition | Repeated foundation changes can make even an elegant design behave like a Vibe Monolith. | reasoning: The author introduces a failure mode beyond obvious technical debt and visibly poor structure. | `cause_effect`: Foundations can change too quickly for their implications to be understood. → The resulting failure can persist even when the current design looks elegant. |\n\n### A Taxonomy of Monoliths — and Why the Vibe Monolith Is Different\n\n**Controlling idea** (`definition`, id `monolith-taxonomy`): The Vibe Monolith differs from static or release coupling because architecture that looks modular today does not stay stable enough for local reasoning over time.\n\n**Advances the thesis** (C2): Distinguishes the coined failure mode from familiar monolith categories before tracing its human consequences.\n\n**Transition in:** `elaboration`: The previous section names a Vibe Monolith despite an elegant current design. → A comparison of where coupling lives explains the distinction.\n\n**Order of paragraphs** (`comparison`): Locate each kind of coupling, identify the temporal kind, then explain how a modular snapshot can still lose local changeability across successive rewrites. Without the comparison first, the Vibe Monolith could be mistaken for ordinary distributed coupling.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p17 | comparison | Monolith categories differ in where changes become dependent on one another. | table: The preserved four-row taxonomy: classic monolith (application and database), distributed monolith (interdependent services), release monolith (release coordination), and Vibe Monolith (moving architecture). |  |\n| p18 | definition | The author uses Vibe Monolith to identify the temporal coupling observed in AI-driven end-to-end development. | figure: Figure 2, monolith-taxonomy.jpeg: the four kinds of monolith; preserve image, alt text and caption exactly. | `elaboration`: The taxonomy distinguishes four locations of coupling. → The author singles out instability over time in AI-driven development. |\n| p19 | explanation | A modular architecture at one moment does not guarantee that a team can keep changing each part independently. | reasoning: The existing essay describes genuine modularity and decoupling in a snapshot of an agent-generated system. | `elaboration`: The Vibe Monolith's distinguishing trait is architectural motion over time. → A modular snapshot can coexist with the loss of durable local reasoning. |\n| p20 | cause_effect | End-to-end rewrites spread change across components by repeatedly changing the dependencies between them. | reasoning: The preserved account of rigid interactions and unforeseen ripples from one part to another, made explicit as dependencies shifting across repeated rewrites. | `cause_effect`: A current diagram does not show whether component boundaries will remain reliable. → Changing those dependencies across agent runs makes local changes ripple through the system. |\n| p21 | analysis | Local reasoning becomes unsafe when the boundaries that contain a person's attention keep moving. | reasoning: The architecture can look well designed now but different next week, leaving no durable boundary around the part someone owns. | `conclusion_summary`: Repeated rewrites make dependencies unreliable across time. → People cannot safely reason about just one part while its boundaries keep moving. |\n\n### The Real Cost: Cognitive Load and the Collapse of Clear Ownership\n\n**Controlling idea** (`cause_effect`, id `cognitive-load`): Unstable architecture removes the boundaries that let individuals limit cognitive load and teams hold durable responsibilities.\n\n**Advances the thesis** (C3): Connects temporal instability to human and organizational costs rather than treating modularity as a diagram property.\n\n**Transition in:** `cause_effect`: Moving boundaries prevent safe reasoning about a local part. → The same failure burdens individuals and disrupts how teams divide responsibility.\n\n**Order of paragraphs** (`grouping`): Establish the team-and-architecture relationship, then group its consequences by individual attention and team ownership. The two costs need the shared boundary principle first; mixing their examples would blur personal cognitive load with responsibility across teams.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p22 | explanation | Stable architecture enables teams to divide work along boundaries they can understand and own. | source: Team Topologies treats the team as the unit of delivery and cognitive load as a design concern; the essay invokes Conway's Law to connect organizational and service boundaries. |  |\n| p23 | definition | Shifting structure creates avoidable cognitive load beyond the intrinsic difficulty of the problem domain. | reasoning: The existing contrast between intrinsic domain difficulty and extraneous load from weak boundaries requires people to hold more of the system in mind. | `elaboration`: Stable boundaries let humans divide and contain their work. → At the individual level, moving boundaries enlarge the mental model a person must maintain. |\n| p24 | cause_effect | Moving seams prevent teams from establishing durable ownership and accountability. | source: Team Topologies' phrase \"hidden monoliths and coupling in the software-delivery chain\" and the author's qualified comparison of the Vibe Monolith as its AI-native cousin. | `cause_effect`: Individuals cannot safely limit their attention to one stable part. → Teams likewise lose the stable seams needed for lasting responsibilities. |\n\n### The Burden Lands on Your Best People\n\n**Controlling idea** (`cause_effect`, id `best-people`): Architectural instability concentrates validation and ownership on the people most able to follow the whole system, hiding their depletion behind high output.\n\n**Advances the thesis** (C3): Shows the feedback between moving foundations and concentrated human burden while retaining the productivity caveat.\n\n**Transition in:** `example`: Unstable seams dissolve durable team ownership. → A CTO reports that the people most fluent with AI carry the heaviest burden.\n\n**Order of paragraphs** (`small_to_large`): Begin with one CTO's observation and its contrast with the expected benefit of AI, then broaden to the shift in validation work, hidden depletion, review telemetry and missing cost measures before synthesizing the architectural feedback loop. The section moves from a concrete report to a wider structural explanation; moving the observation after that explanation would remove the reader's concrete reason to examine the mechanism.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p25 | example | A CTO reports that the engineers most fluent with AI feel the greatest burden from its use. | case: Another CTO at a startup scaling up reports that the team members who are really good at AI in the SDLC feel an incredible burden. |  |\n| p26 | comparison | The reported burden reverses the expectation that the people strongest with AI must have the lightest workload. | table: The preserved assumptions/observations table: strong versus weak users, who burns out, and authoring versus validating. | `contrast`: The CTO locates the burden among capable AI users. → The accompanying table contrasts that observation with the naive expectation of less work. |\n| p27 | explanation | The shift from authoring to validating replaces manual execution with interpretation, verification and decisions. | reasoning: The existing account contrasts less boilerplate and faster iteration with the interpretation and judgment needed to accept generated work. | `cause_effect`: The comparison shows fluent AI users carrying more burden despite less manual coding. → Their work has shifted into validation and decision-making. |\n| p28 | definition | High output can hide the depletion that the essay calls high-functioning burnout. | reasoning: The existing paragraph describes sustained performance while mental reserves erode under cognitive load, and asks at what cost that speed is sustainable. | `cause_effect`: Validation work is cognitively demanding even when execution becomes cheap. → Maintained output can hide the accumulating personal cost. |\n| p29 | evidence | The reported telemetry describes AI-era review work as becoming structurally harder as changes grow. | source: Faros AI and The AI Engineering Report: PR size, files touched per PR and bugs per PR climb with adoption; human review time rises despite agent review because people adjudicate flagged issues.; example: White-box review is glossed as a human reading every line; the author connects thousands of generated lines an hour and the 17k-line PR with the burden on the senior reviewer. | `additional_support`: Depletion can remain hidden behind maintained delivery. → Review telemetry illustrates the growing difficulty of the work producing that burden. |\n| p30 | analysis | Standard productivity measures can miss the human cost of maintaining high output. | reasoning: The final sentences of the original telemetry paragraph say validation time, technical debt and burnout sit outside standard productivity metrics and managers report rosier conditions than workers. | `contrast`: Telemetry reveals growing review difficulty. → The full validation and human cost can nevertheless remain outside standard productivity measures. |\n| p31 | synthesis | Moving architecture concentrates responsibility on the few people who still understand the whole, reinforcing their burden. | reasoning: Unstable seams prevent distributing ownership; drive-by contributions leave maintenance and refactoring with the few who retain the system model. Explain the return step as the article’s reasoning: depleted maintainers have less capacity to review boundary changes, document decisions and restore structure, so instability can grow and concentrate the burden again.; figure: Figure 3, burnout-loop.jpeg: unstable architecture, no stable seams, ownership falls on the few, the few burn out; preserve image, alt text and caption exactly.; quotation: Preserve the complete \"One honest caveat\" blockquote on uneven and idiosyncratic productivity gains, personal workflow fit, and experienced developers becoming slower while feeling faster. | `cause_effect`: The cost can remain invisible despite high measured output. → Without stable seams, ownership and validation keep returning to those who can follow the whole system. |\n\n### Why Small Teams Fly and Scaling Stalls\n\n**Controlling idea** (`cause_effect`, id `scaling`): Individual speed does not remove the coordination constraint that appears when ownership must be shared across a larger organization.\n\n**Advances the thesis** (C4): Explains why architecture that a few people can carry mentally becomes a scaling limit.\n\n**Transition in:** `cause_effect`: The architecture depends on the few people able to hold the whole system in mind; individual productivity gains remain uneven. → The same reliance on a small shared mental model helps explain the scaling limit.\n\n**Order of paragraphs** (`small_to_large`): Connect concentrated understanding to coordination, state the role of stable responsibility, then contrast a small group with a larger organization. Reversing the size comparison would obscure why the same approach changes character as ownership must be divided.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p32 | transition | The reliance on a few people's whole-system understanding also explains a limit on team growth. | reasoning: Replace the vague backward pointer \"This framing\" with an explicit reference to concentrated ownership, while retaining the author's practice-based observation. |  |\n| p33 | claim | Stable architecture makes work divisible into durable team responsibilities. | reasoning: The original paragraph defines good architecture functionally as stability that supports splitting work and defining teams. | `elaboration`: A handful of people cannot indefinitely carry all system understanding. → Stable structure provides the means to divide that responsibility. |\n| p34 | example | A small team can move quickly while the whole system still fits in a handful of people's heads. | case: The author observes startups of up to ten people moving quickly and describes new product MVPs built this way; gloss MVPs as minimum viable products. | `contrast`: Durable boundaries are needed to divide work. → A small group may defer that division because a few people still understand everything. |\n| p35 | analysis | The same end-to-end work style becomes a coordination limit when a larger organization needs durable boundaries. | example: The existing contrast between \"works on my machine\" and \"works for 10,000 users\", and the author's statement that many AI-built applications do not reach production.; reasoning: AI can reduce individual execution constraints while leaving the need for coordination intact. | `contrast`: The small group can rely on shared whole-system knowledge. → Larger organizations need divided ownership that continuous re-architecting prevents. |\n\n### The Role of Architecture: Cooling the System Down\n\n**Controlling idea** (`recommendation`, id `cooling-down`): Architecture should hold high-impact seams stable deliberately so fast changes inside them remain understandable and governable.\n\n**Advances the thesis** (C5): Answers the architectural and human problem with a concrete division between controlled boundary change and fast local change.\n\n**Transition in:** `problem_solution`: Individual speed does not resolve the coordination limit created by unstable ownership. → Architecture can make change divisible by deliberately holding the important boundaries stable.\n\n**Order of paragraphs** (`large_to_small`): Name the stabilizing role, explain why it enables oversight, identify the three seams, then show supporting practices and related applications. The seam table must precede the practices because otherwise the practices have no stated boundary to protect.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p36 | recommendation | Cooling the system down means introducing enough stability to make its rate of change sustainable. | reasoning: The existing response uses architecture to keep the system and its people from being consumed by repeated brute-force change. |  |\n| p37 | explanation | Governance that matches generation speed makes human oversight tractable as model capability grows. | reasoning: The existing essay connects faster generation with the need for governance and the increasing value of human oversight. | `elaboration`: The proposed response is stability within fast development. → The purpose of that stability is sustainable human oversight. |\n| p38 | recommendation | Domain boundaries, API contracts and the data model deserve deliberate change control because their changes affect the most other work. | table: The preserved table of three seams: domain boundaries and ownership, API contracts and independent internal changes, shared data-model structures and instability.; figure: Figure 4, frozen-seams-stack.jpeg: fluid AI change above three stable foundation bars; preserve image, alt text and caption exactly. | `elaboration`: Human oversight needs a tractable focus. → Choose the seams with the greatest effect on other teams and parts of the system. |\n| p39 | process (list) | Focused architectural practices keep boundary changes deliberate while allowing work inside them to move quickly. | example: The preserved list: a lightweight architecture forum on contracts and guardrails; cognitive-load checks and team boundaries; golden paths and a platform layer. | `problem_solution`: The high-impact seams have been named. → Practices keep those seams stable without freezing local implementation work. |\n| p40 | synthesis | The same stable-core principle connects architectural seams with inspectable platforms and deliberate product change. | source: Preserve [Can RISC-Inspired Platforms Make AI Less Risky?](risc-for-ai-software-development.html) and [Software Has Seasons Now: Fashion-Driven Development for Generative AI Products](fashion-driven-software-development.html) in their original paragraph. | `conclusion_summary`: The practices protect boundaries and absorb avoidable load. → Their common purpose is a system that a larger group can sustainably build on. |\n| p41 | example | The author uses the existing DeepSeek example to illustrate the principle that better structure can replace more brute-force expenditure. | example: The published paragraph cites DeepSeek as an example of strong results without simply spending ever more compute and money. | `similarity`: The related practices reduce the surface and burden people must manage. → The existing model-layer analogy reinforces the preference for structural choices over additional force. |\n\n### What to Do on Monday\n\n**Controlling idea** (`process`, id `monday`): Teams can start stabilizing their architecture by recording and reviewing boundary changes while making hidden review and ownership costs visible.\n\n**Advances the thesis** (C5): Turns the stable-seam response into actions a reader can begin without designing a new operating model.\n\n**Transition in:** `elaboration`: The previous section defines stable seams and supporting practices. → Five small moves make the principle actionable.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): Introduce the operational translation, provide the complete five-move table, then explain its shared purpose. The actions follow the three seams so their review focus is already meaningful.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p42 | process | Five concrete first moves turn stable seams into a routine of explicit boundaries, targeted review and visible human cost. | table: Preserve the five Monday moves and their full explanations: name the frozen seams; gate the seams, not the code; measure the unmeasured; find who holds the whole system; run a lightweight architecture forum. |  |\n| p43 | analysis | These controls aim to make governance keep pace with generation by focusing it where consequences spread furthest. | reasoning: The original closing sentence describes governance that matches the speed rather than changing generation itself. | `conclusion_summary`: The five moves place review at boundaries and expose hidden load. → Their shared goal is governance that can support the speed of generation. |\n\n### Questions to Consider\n\n**Controlling idea** (`recommendation`, id `questions`): A team can use the essay's questions to locate its own trust gap, moving seams and concentrated burden before choosing a first action.\n\n**Advances the thesis** (C1, C2, C3, C4, C5): Asks the reader to apply the diagnosis and actions to a real organization before the closing synthesis.\n\n**Transition in:** `elaboration`: The Monday moves provide a set of possible first actions. → The preserved questions help the reader decide which problem and seam to address locally.\n\n**Order of paragraphs** (`grouping`): Keep the existing reflection questions together after the practical actions and before the closing. Earlier placement would ask about frozen seams before explaining the response; placement after references would interrupt the ending and leave the units outside the conclusion boundary.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p44 | recommendation (list) | The reflection questions test whether the reader's organization is gaining trust or accumulating unstable ownership as AI output grows. | example: Preserve the existing introductory sentence and all eight questions, from the review ceremony through churn, temporal coupling, frozen seams, whole-system owners, quiet depletion, structural response and choosing three seams on Monday. |  |\n\n## Conclusion: Closing Thought\n\n**Synthesis:** Trust, maintainability and human sustainability meet in the same architectural decision: a team can sustain generated output only when the boundaries make understanding and responsibility shareable.\n\n**So what:** Choosing what must remain stable limits how much validation falls on the few people who understand the whole system, allowing speed to persist beyond a small group.\n\n**Callback:** The opening trust-and-sustainability frame, grounded by the reported 17,000-line pull request in the first body section. The reader can now see the unreviewable PR as a failure to make understanding and responsibility divisible, rather than only an unusually large change.\n\n**Takeaway** (`course_of_action`): Choose the domain boundaries, API contracts and data-model decisions whose changes spread furthest; record them and make changes to them deliberate while allowing local implementation to move quickly.\n\n**Hand-off** to [Can RISC-Inspired Platforms Make AI Less Risky?](risc-for-ai-software-development.html): `elaboration`: Stable seams let teams reason locally and share ownership of an AI-built system. → How to keep the platform inside those seams inspectable without discarding expertise or operational safeguards.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p45 | synthesis | Architecture makes rapid output sustainable when it creates stable structures through which people can share understanding and responsibility. | reasoning: Retain the existing Closing Thought's trust-and-sustainability language, callback to a year of work in an unreviewable PR, resource costs and concentration on fluent AI users. |  |\n| p46 | recommendation | The next practical step is to record the highest-impact seams and require deliberate review when those seams change. | reasoning: Apply the already-developed Monday moves to the domain boundaries, API contracts and data-model decisions that carry the widest consequences. | `problem_solution`: Shared understanding needs architecture stable enough to divide responsibility. → Choose and record the seams whose changes must be deliberate. |\n| p47 | transition | With stable seams in place, the next design question is how to keep the platform within them inspectable without losing needed expertise or safeguards. | source: [Can RISC-Inspired Platforms Make AI Less Risky?](risc-for-ai-software-development.html) develops the inspectability of the platform that humans and AI share. | `elaboration`: Stable seams allow teams to reason locally and share ownership. → The next essay examines the platform inside those seams and the expertise and safeguards it must retain. |\n\n## Non-goals\n\n- Not a verdict that AI-assisted development is bad or should be slowed; the fix is governance that matches the speed, not slower generation.\n- Not a tools comparison or a how-to for any specific agent, framework, or platform.\n- Not a microservices-vs-monolith debate; the Vibe Monolith can occur *inside* a clean microservice architecture.\n- Not a burnout self-help piece; the burnout is framed as a structural consequence of architectural instability, not an individual failing.\n- The people cost does not get reduced to a mere symptom of the architecture problem, nor the architecture problem to a mere cause of burnout — the two halves close a loop; keep both first-class.\n\n## Modalities\n\nArticle, summary, dialog, comics\n\n## Open questions\n\n- For author review outside this editorial pass: the source uses broad claims about a clinical name for high-functioning burnout, the proportion of AI-built applications reaching production, and industry/model examples with unevenly precise attribution. No research ledger or new verification supports changing them here; the original wording, scope and existing caveats remain the source of truth.\n\n## Decision log\n\n- **2026-11-12** — Round 1 readers corroborated missing feedback-loop and scaling explanations; one reader lost the architectural thread during the workload discussion. Revise p27, p31 and p35 only: remind readers why shifting boundaries increase validation work, state the burnout-to-instability return mechanism as reasoning, and distinguish user/production scale from team growth while connecting their ownership demands. Preserve 47 units, order, inherited criteria and all protected quotations, images, captions, names and figures.\n- **2026-06-21** — Titled the post around the **Vibe Monolith** rather than \"trust and sustainability.\" The coined term is the memorable, ownable idea; trust/sustainability is the framing, not the hook. Rejected \"IT Architecture in the Age of AI\" (the INPUT's working title) as too generic for an AI Notes piece.\n- **2026-06-21** — Placed in the **AI Software Development** section next to [Can RISC-Inspired Platforms Make AI Less Risky?](risc-for-ai-software-development.html), not Leadership. The burnout material is strong but secondary to the architecture thesis; the two share a journal thread on trust as the AI-development bottleneck.\n- **2026-06-21** — Kept the burnout half as a co-equal beat rather than a closing aside. The post's distinctive claim is that system-level instability *manufactures* the human cost; cutting it would reduce th <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
