rk section interprets the career implications and supplies Hohpe’s support in the body. Reflection questions personalize the task before the final synthesis connects explicit intent and evaluation to accountable action. Starting with the exercise would presuppose the skills it trains; placing future possibilities before immediate practice would blur what can be done now; leaving questions after references would reopen the argument after its ending.\n\n## Introduction\n\n**Hook** (`thought_provoking_question`): What if the next architecture diagram, decision memo, roadmap brief, or risk analysis you would normally spend hours preparing could be drafted in seconds?\n\n**Bridge:** Technology leaders spend time producing diagrams, plans, memos, and analyses whose drafting can increasingly be assisted by AI. → Making intent, boundaries, and review explicit gives the work a target, but someone still has to initiate the change, choose in context, and earn the understanding needed to act.\n\n**Thesis statement** (Preserved KEY POINTS callout and introduction p02.): Technology leaders should practice agency, contextual judgment, and persuasion because AI-generated options do not initiate responsible change, choose legitimate trade-offs, or earn the trust needed to act.\n\n**Roadmap** (Introduction p04, explicitly framed as this essay’s sequence.):\n\n- Attribute and explain agency, judgment, and persuasion, then distinguish model support from the responsibilities people retain. *Kept in:* reskilling, delegation-boundary.\n- Use illustrative scenarios, contrast tables, and self-assessments to examine initiating, choosing, and aligning people in that order. *Kept in:* agency, judgment, persuasion.\n- Turn those skills into a weekly practice while keeping technical fundamentals and adapting the methods as AI changes. *Kept in:* immediate-practices, mindset-shifts.\n- Interpret what changing work means for expertise and use reflection questions to identify a decision on which to on covers principal and staff engineers; engineering managers; directors, VPs, and CTOs; and architects.; figure: ![Diagram showing technology leadership shifting from manual artifact production to accountable decisions using AI-generated inputs.](assets/images/prepare-for-ai-future/artifact-to-decision-shift.jpeg) **Figure 1:** *As AI produces more artifacts, leadership value shifts toward deciding what should happen next.* | `example`: Leadership value lies in accountable decisions rather than artifact production alone. → How that shared shift appears in the reader’s own technical or management role. |\n| p04 | transition | This essay uses a sourced skills frame, an accountability boundary, illustrative leadership choices, and a weekly exercise to turn the changing role into practice. | reasoning: The roadmap names the skills frame; why it cannot be delegated; agency, judgment, and persuasion scenarios with contrast tables; immediate practice; longer-term mindset shifts; changing expertise; and reflection questions before a closing synthesis. | `sequence`: The shared decision responsibility across roles. → The particular argument and practice sequence this essay will follow. |\n\n## Sections\n\n### Reskilling: Agency + Judgment + Persuasion\n\n**Controlling idea** (`definition`, id `reskilling`): Nielsen’s agency, judgment, and persuasion frame gives technology leaders a way to assess their contribution beyond drafting artifacts.\n\n**Advances the thesis** (S1, S2, S3, S4): Names the capabilities whose distinct responsibilities the following sections establish.\n\n**Transition in:** `elaboration`: The introduction’s promise to explain the human capabilities behind accountable decisions. → The source and meaning of the three-capability frame.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): Attribute and define the frame before applying it to work and showing why the skills combine. Qualify the upcoming scenarios before readers encounter them; moving that qualification later would leave examples open to being mistaken for observed cases.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | definition | The essay adapts Nielsen’s agency, judgment, and persuasion frame from user experience to technology leadership. | source: Jakob Nielsen’s linked 2025 essay proposes agency, judgment, and persuasion in the AI career transition; the author applies that frame beyond UX.; reasoning: Briefly explain agency as initiating action, judgment as choosing in context, persuasion as earning support, and UX as user experience. |  |\n| p06 | explanation | As AI prepares more candidate artifacts, leaders contribute by evaluating those artifacts and turning them into workable decisions. | example: The existing examples are architecture diagrams, RFCs, migration plans, and stakeholder summaries; expand RFCs as requests for comments at first use. | `elaboration`: The three capabilities named in the source frame. → The work those capabilities do when artifacts become easier to prepare. |\n| p07 | claim | The three capabilities work together, so strength in only some of them can still leave a leader ineffective. | reasoning: The article calls the combination AI-savvy expertise and describes the risks of becoming marginalized, sidelined, or trapped in hype when one capability is missing.; figure: ![Diagram showing agency, judgment, and persuasion as overlapping skills that create AI-savvy expertise](assets/images/prepare-for-ai-future/ai-future.png) **Figure 2:** *To thrive in the AI era, experts must combine agency, judgment, and persuasion—without all three, they risk becoming marginalized, sidelined, or lost in hype.* | `cause_effect`: Evaluating and applying artifacts draws on the three capabilities. → Why leaders need the combination rather than an isolated skill. |\n| p08 | explanation | The scenarios that follow illustrate the skills rather than proving that named organizatio nd exposing blind spots. \\| Deciding what matters here, now, with these people, constraints, politics, customers, risks, and values. \\| \\| Persuasion \\| Drafting narratives, adapting language for audiences, preparing objections, and improving clarity. \\| Earning trust, reading the room, handling resistance, and making a decision feel legitimate to the people who must live with it. \\| |  |\n| p10 | analysis | More AI assistance makes the boundary around human direction, accountability, and consent more important. | reasoning: The table’s shared pattern is that AI expands the available thinking while leaders retain ownership of the resulting action.; figure: ![Diagram showing AI support artifacts separated from human ownership of direction, accountability, consent, and trust.](assets/images/prepare-for-ai-future/ai-support-human-ownership.jpeg) **Figure 3:** *AI can expand thinking, but direction, accountability, and consent remain human-led.* | `conclusion_summary`: The table’s distinct human responsibility for each skill. → The common boundary between thinking assistance and accountable leadership. |\n\n### 1. Agency: The Era of Waiting is Over\n\n**Controlling idea** (`explanation`, id `agency`): Agency means starting a responsible experiment or conversation before a formal mandate supplies the initiative.\n\n**Advances the thesis** (S2): Shows how human initiative turns AI’s low starting cost into a bounded, shared decision.\n\n**Transition in:** `elaboration`: Leaders retain direction and responsibility even when AI prepares the inputs. → The first responsibility in practice: initiating a bounded change.\n\n**Order of paragraphs** (`problem_solution`): Show the cost of waiting before defining initiative, then demonstrate it and compare its absence. The self-assessment follows the concrete example and table so readers have a standard; the synthesis names what those acts change.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p11 | context | Waiting for requirements or escalation leaves leaders reacting to AI-shaped change rather than helping shape it. | reasoning: The author contrasts the familiar pattern of waiting for requirements, producing a reference model, reviewing a plan, or escalating a decision with the need to initiate. |  |\n| p12 | definition | Taking initiative creates momentum within the permissions and review a consequential change requires. | reasoning: The article urges leaders to begin leading change instead of waiting; the delegated-work boundary requires distinguishing a bounded investigation from unapproved changes affecting others. | `problem_solution`: The limitation of waiting for requirements or a mandate. → Starting a responsible experiment while retaining the established accountability boundary. |\n| p13 | example | A principal engineer can create evidence for a decision by prototyping a concrete improvement and bringing the affected teams into it. | scenario: The existing mid-size logistics-company composite has a principal engineer use AI to inspect microservices, latency, duplication, and poor observability, build a small event-driven prototype, then bring the engineering manager and platform team into the conversation. | `example`: Agency as starting a bounded investigation with shared responsibility. → The logistics prototype as a concrete instance of that initiative. |\n| p14 | comparison | Without agency, private experiments and abstract arguments leave the pace of AI adoption to others. | reasoning: The principal engineer’s example makes adoption something leaders can shape deliberately.; table: \\| Without agency \\| With agency \\| \\| --- \\| --- \\| \\| Teams wait for a formal mandate, experiment in private, duplicate effort, and argue about AI in the abstract. \\| A leader starts a bounded experiment, shares what worked and failed, and creates enough evidence for a real decision. \\| \\| Risk-averse stakeholders define the pace by default because nobody has shown a responsible path forward. \\| The leader brings security, delivery, and product concerns into the experiment early, making responsible adoption easier to support. \\| | `contrast`: The initiative created by the logistics prototype. → The missed opportunities and fragmented response when nobody takes that initiative. |\n| p15 | recommendation (list) | Readers can assess their agency by looking for conversations, experiments, and needed changes they have initiated. | reasoning: Preserve the three self-assessment questions about reshaping the tech stack or delivery model, testing tools on repetitive work, and advocating changes aligned to business needs. | `elaboration`: The concrete difference between waiting and responsible initiative. → Questions that let readers identify the same difference in their own work. |\n| p16 | synthesis | Agency shifts a leader’s role from responding to supplied problems toward initiating responsible strategic change. | reasoning: The original contrast is solution provider or escalation handler versus strategic instigator as AI absorbs more routine work. | `conclusion_summary`: The self-assessment of what the reader starts. → The larger role change those acts of initiative represent. |\n\n### 2. Judgment: When AI Gives You 10 Options, Can You Choose the Right One?\n\n**Controlling idea** (`explanation`, id `judgment`): Contextual judgment selects a workable course from plausible AI options by weighing the people, constraints, and consequences that matter here.\n\n**Advances the thesis** (S3): Shows why plausible generated options still require human choice and rejection in context.\n\n**Transition in:** `sequence`: Agency has created options and momentum for change. → Choosing which proposed change the organization can responsibly carry out.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): State the selection problem before the VP scenario, extract the general rule, then contrast its absence and invite self-assessment. Reversing the table and case would give a catalogue of decisions before the reader sees why context changes the answer.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p17 | claim | A large supply of plausible AI options still leaves the contextual choice with an accountable leader. | reasoning: The existing opening contrasts many designs, plans, trade-off summaries, and metrics with fit for particular teams, constraints, and organizational history. |  |\n| p18 | example | A staged adoption plan can fit an organization better than any unqualified AI-generated rollout proposal. | scenario: The existing VP-of-Engineering composite compares three plans: centralized platform expertise, champions in every product group, or broad access with lightweight guardrails. Two product groups face delivery pressure, security needs auditable usage, and managers need time; the VP chooses an enablement team, policy, visible pilots, and coaching before broad rollout. | `example`: The need to test plausible plans against local context. → A VP’s adoption choice under capacity, audit, and learning constraints. |\n| p19 | definition | Judgment evaluates technical, organizational, and human constraints together. | reasoning: The VP example combines delivery capacity, security requirements, manager learning, and technical enablement.; table: \\| AI can suggest... \\| Leaders must decide... \\| \\| --- \\| --- \\| \\| Several plausible architecture options \\| Which option fits the team's skills, risk tolerance, and operating model \\| \\| A rollout plan for a new tool or practice \\| Whether the organization has the capacity, trust, and governance to absorb it \\| \\| A policy draft or decision memo \\| What trade-offs are acceptable, who must be consulted, and where accountability sits \\| \\| A list of risks and mitigations \\| Which risks matter in this context and which ones are noise \\| \\| A polished stakeholder summary \\| Whether the story is honest, useful, and tied to outcomes people care about \\| | `elaboration`: The contextual choices inside the VP’s staged plan. → A general distinction between suggested options and accountable decisions. |\n| p20 | comparison | Accepting polished or fashionable output without testing local feasibility creates false confidence. | reasoning: The danger described is accepting a plausible or fashionable option without understanding whether the organization can execute it.; table: \\| Without judgment \\| With judgment \\| \\| --- \\| --- \\| \\| A leader forwards an AI-generated rollout plan because it looks complete or matches the latest hype cycle. Teams are overloaded, security pauses the rollout, and managers lose trust in the initiative. \\| A leader treats the AI plan as input, tests it against team capacity and governance constraints, and stages adoption through pilots. \\| \\| The loudest metric wins because the recommendation sounds data-driven. \\| The leader asks what the metric hides: operational load, migration risk, learning cost, customer impact, or reversibility. \\| | `contrast`: The combined constraint assessment needed for judgment. → The false confidence created when a leader substitutes polish or fashion for that assessment. |\n| p21 | recommendation (list) | Readers can assess judgment by checking whether they reject unsuitable options and account for delivery and maintenance constraints. | reasoning: Preserve the self-assessment questions about eliminating unsuitable options from five viable proposals, connecting choices to business and team readiness, and balancing optimization with delivery and maintainability. | `elaboration`: The difference between unexamined output and context-tested choices. → A practical self-assessment of whether the reader makes that distinction. |\n| p22 | synthesis | Judgment connects generated outputs to outcomes instead of merely increasing the stock of artifacts. | reasoning: The source’s closing contrasts outputs converted into outcomes with more generated artifacts. | `conclusion_summary`: The reader’s tests for selecting what fits their context. → Why contextual selection changes what the organization gets from generated work. |\n\n### 3. Persuasion: Influence Is the New Essential Skill\n\n**Controlling idea** (`explanation`, id `persuasion`): Persuasion makes a technically sound choice understandable and legitimate to the people whose support it needs.\n\n**Advances the thesis** (S4): Shows why choosing an option does not itself secure the shared action needed for an outcome.\n\n**Transition in:** `sequence`: Judgment has identified a course that fits the organization. → Helping affected people understand, evaluate, and support that course.\n\n**Order of paragraphs** (`problem_solution`): Begin with a sound proposal that cannot gain support, explain why cross-functional influence matters, then show and name persuasion. Contrast its absence before giving practice, and use the loop diagram to close the three-skill sequence before moving to a weekly routine.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p23 | claim | A technically sound proposal can still fail if it earns no support. | reasoning: The author’s opening says that being right is not enough because sound proposals may never gain support. |  |\n| p24 | explanation | Technology decisions often need influence across functions rather than a simple handoff. | example: The original functions are engineering, legal, finance, operations, and sometimes marketing in flatter, faster-moving organizations. | `elaboration`: The need for support beyond technical correctness. → The organizational boundaries across which that support must be earned. |\n| p25 | example | Explaining a platform proposal through release friction, customer commitments, and compliance makes the trade-off easier for stakeholders to evaluate. | scenario: The existing staff-engineer composite at a SaaS company proposes a modular platform using containers and service meshes, then explains reduced release friction, premium-customer SLAs, and simpler compliance reporting. Expand SaaS and SLAs, and briefly identify the infrastructure terms without changing the proposal or claiming an achieved result. | `example`: The need to make a choice understandable across functions. → A platform proposal reframed in terms stakeholders can evaluate. |\n| p26 | definition | Persuasion makes the reasoning for a decision legible and compelling to other people. | reasoning: The scenario reframes the proposed change so non-technical stakeholders can evaluate it. | `elaboration`: The staff engineer’s shift from implementation language to consequences. → The leadership capability that the shift demonstrates. |\n| p27 | comparison | Without persuasion, useful technical direction remains a private conviction instead of becoming a shared decision. | reasoning: The source distinguishes a correct private proposal from a decision people can support.; table: \\| Without persuasion \\| With persuasion \\| \\| --- \\| --- \\| \\| A staff engineer explains the migration in terms of containers, meshes, and platform purity. Finance hears cost, product hears delay, and leadership shelves the proposal. \\| The same engineer explains how the change reduces release friction, protects premium SLAs, and simplifies compliance reporting. Stakeholders can now evaluate the trade-off. \\| \\| A manager tells teams to \"use AI more\" without a story about why, where, and how quality will be protected. \\| The manager connects AI use to a concrete workflow, explains guardrails, and shows how the team will review AI-assisted work. \\| | `contrast`: Persuasion makes the proposal accessible to its stakeholders. → What prevents action when that explanation and alignment are missing. |\n| p28 | recommendation (list) | Readers can practice persuasion by translating technical claims into consequences their audience can assess. | example: Preserve the Kubernetes / two weeks faster example, the tech-debt / developer-time translation, visual storytelling or simulations, and the sentence about selling the story behind artifacts. | `problem_solution`: The lack of support caused by jargon or abstract demands. → A short practice sequence: illustrative translations, a communication technique, and the reminder that an artifact’s use depends on conveying its meaning. |\n| p29 | synthesis | Agency, judgment, and persuasion form a repeatable loop of initiating, choosing, and aligning people. | reasoning: The original closing says tools change but the need to influence does not.; figure: ![Loop diagram connecting agency, judgment, and persuasion in AI-assisted technology leadership.](assets/images/prepare-for-ai-future/agency-judgment-persuasion-loop.jpeg) **Figure 4:** *Agency, judgment, and persuasion work as a loop: initiate, choose, and align.* | `conclusion_summary`: Practical ways to make a choice understandable to others. → The completed initiate–choose–align loop that the next section turns into practice. |\n\n### Immediate Practices: What to Do This Week\n\n**Controlling idea** (`recommendation`, id `immediate-practices`): A small weekly exercise can develop the three capabilities while preserving the technical fundamentals that sound decisions need.\n\n**Advances the thesis** (S5): Makes the human skills actionable through supervised AI work, contextual review, stakeholder explanation, and peer feedback.\n\n**Transition in:** `problem_solution`: The initiate–choose–align loop identifies the capabilities to exercise. → Habits and one real decision through which the reader can practice them now.\n\n**Order of paragraphs** (`grouping`): Set the short-term purpose, group the four habits needed for a credible decision, then combine them into a single six-step loop. The loop would be less intelligible before the reader has seen what drafting, judgment, persuasion, and technical grounding each contribute.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p30 | recommendation | Nielsen’s transition framing calls for habits technology leaders can practice now in their own work. | source: Nielsen frames the current period as a short transition toward AI-native work; explain AI-native here as work designed around AI assistance rather than assume familiarity. |  |\n| p31 | recommendation | Automating low-risk first drafts creates room for leadership practice while keeping supervision and accountability visible. | example: The existing examples are manual diagramming, dependency documentation, status writing, templates, pattern comparison, constraints, and first-pass governance text. | `example`: Habits that can start in the reader’s current work. → Using supervised AI assistance on low-risk first drafts. |\n| p32 | recommendation | Critical review of real AI recommendations develops judgment about what would fail in context. | example: Retain collecting generated designs and plans, asking what is missing, unscalable, or politically impossible, building decision trees, and tabletop exercises with peers; gloss tabletop exercises as walking through hypothetical decisions. | `sequence`: AI produces supervised draft options. → Reviewing those options critically as deliberate judgment practice. |\n| p33 | recommendation | Everyday explanations to non-technical colleagues give leaders frequent opportunities to practice persuasion. | example: Preserve the examples of sales, the CFO, hallway chats, and Slack threads; expand CFO as chief financial officer if needed. | `sequence`: Review has produced a reasoned technical choice. → Explaining the choice in terms another function understands. |\n| p34 | recommendation | Leaders need technical fundamentals alongside a wider understanding of the organization and its decisions. | example: Keep cloud, security, and scalability together with AI governance, ethics, team dynamics, product strategy, and operating models. | `additional_support`: Practice combines sound technical reasoning with explanations people can use. → The technical and organizational knowledge that makes both credible. |\n| p35 | process (list) | A one-week loop develops accountable decisions by stating intent, comparing options, testing risks, explaining the choice, and seeking feedback. | example: Preserve the six steps: pick one real decision; ask for three different options; reject at least one with contextual reasons; compare generated risks with actual concerns; rewrite for a non-technical stakeholder; seek one peer’s feedback. Add intended outcome, limits, and an evaluation question within the first step, keeping the six-step sequence.; figure: ![Six-step practice loop for using AI to develop leadership judgment and persuasion.](assets/images/prepare-for-ai-future/one-week-practice-loop.jpeg) **Figure 5:** *A small weekly loop turns AI use into practice for judgment, persuasion, and accountable decision-making.* | `conclusion_summary`: The four habits supply drafting, review, communication, and foundational knowledge. → A single sequence in which the reader can exercise them together. |\n\n### Mindset Shifts for the AI Transition Era\n\n**Controlling idea** (`explanation`, id `mindset-shifts`): The three capabilities remain useful even as AI changes how leaders practice them over time.\n\n**Advances the thesis** (S5): Preserves the difference between durable responsibilities and changeable methods without treating speculative practices as settled facts.\n\n**Transition in:** `time`: The immediate practices establish what to do this week. → How to keep adapting those practices over the next few years.\n\n**Order of paragraphs** (`grouping`): After changing the time horizon, group the adaptation habits: rethink routines, expect changing methods, experiment amid uncertainty, assess the environment, keep useful expertise, and guide across teams. The explanation of durable skills precedes future possibilities so those examples cannot be read as abandoning the frame.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p36 | transition | Weekly habits sit inside a longer-term change in how technology leaders approach analysis, drafting, and experimentation. | source: The existing transition explicitly separates this week’s practices from the orientation over the next few years and attributes the broader prompt to Nielsen. |  |\n| p37 | recommendation | Leaders should experiment with changing routines rather than only accelerating existing routines. | reasoning: AI can draft, compare, critique, and simulate options; retain the qualification that some uses are available now and some remain frontier work. | `elaboration`: The longer-term orientation toward cheaper analysis and experimentation. → Experimenting with which routines should change. |\n| p38 | explanation | Agency, judgment, and persuasion are durable capabilities whose practical expression can change as AI improves. | example: Preserve today/tomorrow contrasts: careful pilots versus agents across product, security, and operations; reviewing plans versus autonomy decisions; explaining to finance versus helping people trust, contest, and improve AI-assisted decisions. | `example`: Experimentation can change how leadership work is performed. → Possible changing practices for each of the three durable capabilities. |\n| p39 | recommendation | Testing practices before consensus forms gives leaders a way to learn while the operating model is still unsettled. | reasoning: The source says nobody knows exactly what AI-native engineering leadership looks like yet and recommends inventing and testing now. | `cause_effect`: Future practices are possible but unsettled. → Learning through bounded action before a consensus playbook exists. |\n| p40 | recommendation | The reader’s working environment affects experimentation, so caution should be judged against real governance concerns. | reasoning: Preserve the distinction between an environment blocking responsible experimentation and a cautious culture with genuine governance concerns; disciplined adoption beats denial and hype. | `elaboration`: Responsible experimentation enables learning before consensus. → The environmental conditions that support or constrain that learning. |\n| p41 | recommendation | Leaders should retire low-value habits while retaining legacy expertise that the business still depends on. | reasoning: The original contrasts legacy frameworks that still run the business with outdated governance models and technical prestige. | `elaboration`: Judgment distinguishes useful caution from a blockage to learning. → The same discrimination between necessary legacy knowledge and outdated habits. |\n| p42 | recommendation | Where teams operate more autonomously, guiding and influencing them becomes central to leadership impact. | reasoning: Retain the author’s guide-versus-gatekeeper framing and the need to influence across autonomous teams. | `additional_support`: Changing habits shifts leadership away from prestige and rigid control. → Guidance and influence as a way to work across autonomous teams. |\n\n### You Are Not Being Replaced, But the Work Is Changing\n\n**Controlling idea** (`synthesis`, id `changing-work`): Changing artifact production alters the value of expertise without removing the need to connect technology, people, and accountable decisions.\n\n**Advances the thesis** (S6): Connects the career implications to collective understanding rather than a claim that all previous skills or technical roles disappear.\n\n**Transition in:** `conclusion_summary`: The mindset section distinguishes durable capabilities from practices and habits that change. → What that distinction means for the value of expertise itself.\n\n**Order of paragraphs** (`small_to_large`): Start with the risk that individual skills lose relevance, then show enduring local context, widen to the leader’s connecting role, and support that role with Hohpe. Keeping the source in the body avoids introducing new evidence in the final synthesis.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p43 | evidence | Nielsen’s mammoth-hunter analogy warns that a skill can lose value when its surrounding work changes. | analogy: Preserve Nielsen’s attributed analogy: around 2030, old skills may be equivalent to \"being an experienced mammoth hunter\"; also preserve the explanation that not every old skill disappears overnight. |  |\n| p44 | explanation | AI’s growing assistance still leaves local human constraints that someone must understand and bring into the decision. | scenario: Preserve the hypothetical burned-out customer ops team, a sales lead needing a feature by next quarter, and quiet resistance to a platform shift alongside the possible AI drafting and analysis capabilities. | `contrast`: The analogy raises the possibility that the value of old skills will change. → Human and organizational context that still matters as technical drafting and analysis expand. |\n| p45 | analysis | The leader’s contribution increasingly lies in bringing people together around a technical choice. | analogy: Retain the author’s drawing-boxes versus drawing-people-together line. | `cause_effect`: Local capacity, demands, and resistance still affect whether work can succeed. → The leadership contribution of connecting the affected people. |\n| p46 | synthesis | Connecting technology to people, outcomes, and change remains a human leadership responsibility. | reasoning: The original says that AI is a powerful tool while leadership still connects technology with people, outcomes, and change. | `elaboration`: Bringing people together around a technical choice. → The enduring purpose of that human leadership work. |\n| p47 | evidence | Hohpe’s advice to make others smarter supports a broader view of technology leadership as improving collective understanding. | source: Move the existing linked paraphrase of Gregor Hohpe’s advice from Final Thoughts into the body, retaining its application to principal engineers, staff engineers, engineering managers, directors, VPs, and CTOs. | `additional_support`: The leadership purpose of connecting technology, people, and outcomes. → A clearly attributed source for helping others reason more effectively. |\n\n### Questions to Consider\n\n**Controlling idea** (`recommendation`, id `reflection-questions`): Reflection on the reader’s own workflow and stakeholder conversations identifies a leadership capability to practice.\n\n**Advances the thesis** (S5): Makes the career frame personal before the closing synthesis gives a concrete next action.\n\n**Transition in:** `elaboration`: Leadership remains a contribution to contextual decisions and other people’s understanding. → Questions that locate that contribution in the reader’s current work.\n\n**Order of paragraphs** (`grouping`): Keep the original questions together as one reflection unit after the argument and before the final synthesis. Leaving them after the references would reopen the essay after its conclusion and leave an argument unit outside the checked conclusion.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p48 | recommendation (list) | The reader can identify a useful practice target by asking what AI can prepare, what context is still needed, and how they explain a technical choice. | reasoning: Preserve the entire Questions to Consider lead-in and its four questions about workflow automation, human context, convincing a non-technical stakeholder, and reframing a decision in business terms. |  |\n\n## Conclusion: Final Thoughts\n\n**Synthesis:** Explicit intent and evaluation connect generated artifacts to their intended effects only when people understand the work, initiate responsible change, choose in context, and bring others into the decision.\n\n**So what:** The value of generated plans becomes durable only through people willing and able to own their consequences and turn them into shared action, rather than an accumulating stock of artifacts.\n\n**Callback:** The introduction’s question about diagrams, decision memos, roadmap briefs, and risk analyses drafted in seconds. The reader can now distinguish the cheap artifact from the still-needed understanding, legitimate choice, and shared commitment that make it useful.\n\n**Takeaway** (`course_of_action`): Choose one real AI-assisted decision, make its intended outcome and limits explicit, test the options, and explain the chosen course to the people who must live with it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p49 | synthesis | Explicit intent and evaluation become useful through people who understand the work and carry its decisions into shared action. | reasoning: Combine the existing Final Thoughts points about tools, guidance, context, and collective intelligence with the explicit-intent bridge and the weekly loop’s tests of options and risks. | `conclusion_summary`: The reflection questions locate a decision and the human contribution it needs. → How explicit intent, evaluation, and the three leadership capabilities work together. |\n| p50 | analysis | When diagrams, memos, and briefs can be drafted quickly, their value still depends on accountable decisions that people understand and can act on. | reasoning: Return explicitly to the artifacts in the opening question, retaining the original conclusion’s agency, contextual judgment, alignment, and accountable-leadership point. | `cause_effect`: Intent and evaluation work only when people carry decisions into action. → Why cheap drafting does not by itself supply the valuable outcome promised by the opening. |\n| p51 | recommendation | Practice the whole leadership loop on one real AI-assisted decision by making intent and limits explicit, testing options, and explaining the choice to affected people. | reasoning: Return to the already established weekly exercise: one real decision, a stated intended outcome and limits, contextual comparison and rejection, and a recommendation the affected people can assess. | `problem_solution`: The value of AI drafting depends on accountable decisions and shared understanding. → One decision through which the reader can practice producing that value. |\n\n## Non-goals\n\n- A catalog of AI architecture tools.\n- A prediction piece about exact AI capabilities in 2030.\n- A policy for AI governance, security, or model selection.\n- A claim that all legacy architecture skills should be abandoned immediately.\n- A proof that the illustrative scenarios happened in named organizations.\n\n## Modalities\n\nArticle, summary, dialog, comics\n\n## Open questions\n\n- Should this post later link to more concrete internal records about AI governance, AI engineering standards, or architecture operating models?\n- Should AI Notes adopt the same source-density expectations as decision journals, or stay lighter and essay-like?\n- Author review: keep or drop the added minor AC-4, which preserves the legacy source-fidelity and illustrative-scenario outcomes without changing any journal criterion.\n- Flow-review options not taken: the reviewer suggested optionally moving the durable-capability paragraph before the experimentation paragraph, and merging the concrete convening-role paragraph with the general leadership-responsibility paragraph if they repeated one another. The reviewed order remains sound: the first pair makes the changed time horizon concrete before qualifying it, and the second pair gives a concrete role followed by the broader responsibility. The author may revisit that economy; no move or merge was required by the flow review.\n\n## Decision log\n\n- <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
