inspectable agreement about the intended outcome and permitted action. *Probe:* What would you add to \"review this plan\" to make it an intent-based collaboration, and when would you write a spec? | `custom` | cold_reader | major |\n| AC-3 | A reader preserves human accountability while applying the leadership analogy and scaling guardrails. *Probe:* What cannot be transferred to AI when moving up the ladder, and what controls must increase? | `custom` | cold_reader | major |\n\n## Thesis\n\n**Question:** How should leaders change their interaction with AI as it moves from narrow tasks to longer and more consequential workflows?\n\n> **Claim:** Leaders should move from commands to explicit intent, bounded delegation, and evidence-based autonomy as work demands it, while retaining human accountability and increasing review and control with each increase in autonomy.\n\n**Disputed by:** The view that more capable agents chiefly need better prompts and broader permissions, and that polished output is sufficient evidence that the underlying judgment has been delegated.\n\n**So what:** Consequential AI work needs an inspectable agreement about goals, constraints, evaluation, and escalation before execution, so leaders can use agent capability without hiding the human decision.\n\n**How and why:** Commands omit context and legitimate trade-offs; intent statements and specs expose those choices, while competence evidence, boundaries, and review keep execution proportional to what the organization can verify.\n\n**Supporting claims**\n\n- **C1** — Commands can produce plausible artifacts while leaving the context, legitimate trade-offs, and accountability of consequential work unresolved.\n- **C2** — Marquet's language of intent, competence, and control helps human-AI collaboration only when responsibility remains human.\n- **C3** — The appropriate ladder level follows the task's ambiguity, consequences, and verifiable capability rather than a preference for more autonomy.\n- **C4** — Intent statements and written specs turn hidden assumptions into a decision frame that both AI and humans can inspect.\n- **C5** — Greater autonomy needs stronger observable controls so polished language or execution cannot hide an unowned decision.\n- **C6** — Technology leaders can practice the required discipline by making one real interaction's intent, limits, and review explicit before generation.\n\n## Role in the part\n\nMakes the journal's requirement for human responsibility operational through language, specifications, and bounded autonomy. Supports L1, L2 of part `leadership`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in leadership-problem through analogy-boundary; `comparison` in language-shift, architecture-example, delivery-example; `grouping` in failure-modes and role-implications; `chronological` in weekly-practice)\n\nThe command problem establishes why leadership language matters; the source model and its accountability boundary must precede the ladder so levels cannot be read as personhood or a mandate to maximize autonomy. The ladder supplies the numbers used by the language and spec examples. The two decision reviews show the contract at work before guardrails govern higher autonomy and failure modes expose misuse. Role implications and a weekly practice turn the model into action, followed by the existing self-assessment and a synthesis/hand-off. Moving examples before definitions would require unexplained levels; moving controls after the practice would invite action before its limits; leaving questions after references would reopen the essay after its conclusion.\n\n## Introduction\n\n**Hook** (`thought_provoking_question`): When AI can do more than a small task, what intent, boundaries, and review does the work require?\n\n**Bridge:** Technology leaders use familiar command prompts while making decisions about changing products, preserving value, and earning trust. → Consequential product and engineering decisions need a visible agreement about intent and permitted action because a generated artifact cannot receive the leader's judgment or accountability.\n\n**Thesis statement** (Preserved KEY POINTS bullets 1–3 and introduction paragraphs p02–p05.): As the work demands more than a command, leaders need explicit intent, bounded delegation, and evidence for autonomy, with stronger review and control while accountability remains human.\n\n**Roadmap** (Added introduction paragraph p07, after Figure 1, states the body order and the part-level move to the next essay.):\n\n- Start with the limits of command-style prompting and what Marquet's model contributes within its human-AI boundary. *Kept in:* leadership-problem, marquet-contribution, analogy-boundary.\n- Use the seven-level ladder to choose an interaction that fits the work. *Kept in:* collaboration-ladder.\n- Compare command and intent language, then make the agreement inspectable as a spec. *Kept in:* language-shift, written-intent.\n- Apply the pattern through contrasting architecture and delivery-risk review examples. *Kept in:* architecture-example, delivery-example.\n- Govern autonomy with guardrails and recognize the failure modes that hide accountability. *Kept in:* autonomy-guardrails, failure-modes.\n- Translate the ladder by leadership role, try one weekly practice, and assess current interactions before the final synthesis. *Kept in:* role-implications, weekly-practice, self-assessment.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Deciding what AI-enabled work should change still requires people to lead, so better prompting alone is insufficient. | source: The preceding essay treats product change as a decision about customer value, trust, and what should remain stable.; quotation: > **KEY POINTS:** > > * **Better prompts are not the real transition.** As AI moves from small tasks to architecture reviews, planning, and multi-step work, the leadership question shifts from \"What should I ask AI to do?\" to **what intent, boundaries, and review discipline the work requires** — the move from prompting to intent-based collaboration. > * **David Marquet's Leader-Leader model is the practical analogy**: replace \"do what I say\" with clear intent, competence, and control boundaries — and **spec-driven development is how you do it**, turning intent into a reviewable contract before AI produces anything. But the analogy has a limit: AI can act on intent, yet it **cannot own consequences** — leaders still own purpose, trade-offs, and trust. > * **Guardrails must scale with autonomy.** The more autonomy an AI system receives, the stronger its scope, evidence, logging, review points, stop conditions, and human ownership must become. |  |\n| p02 | claim | When AI work grows beyond small tasks, the leadership question becomes what intent, context, boundaries, and review it requires. | example: Summaries and emails versus architecture reviews, delivery planning, incident analysis, policy drafting, research, code changes, and multi-step workflows. | `elaboration`: Better prompts alone do not settle how people lead consequential work. → When AI work grows beyond small tasks, the leadership question becomes what intent, context, boundaries, and review it requires. |\n| p03 | context | Marquet's human leadership model offers useful language for AI collaboration without giving AI human standing or accountability. | source: David Marquet's Leader-Leader and Intent-Based Leadership models apply to human organizations. | `problem_solution`: Consequential work needs language for intent and review. → Marquet's human leadership model offers useful language for AI collaboration without giving AI human standing or accountability. |\n| p04 | comparison | Intent-based language makes the purpose and permitted action explicit rather than giving an isolated command. | quotation: Command: do this. Intent: here is wha ent and accountability that consequential leadership work requires.\n\n**Transition in:** `elaboration`: The introduction distinguishes prompting from explicit intent and control. → Polished AI output does not transfer the judgment and accountability that consequential leadership work requires.\n\n**Order of paragraphs** (`problem_solution`): Familiar commands come before their limits, false delegation, and the human responsibilities they leave unresolved. Starting with the remedy would hide why a polished artifact is insufficient.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | example (list) | AI adoption often begins with commands that name an output. | quotation: Summarize this document; write a strategy memo; create a rollout plan; review this architecture; tell me which option is best. |  |\n| p09 | comparison | Commands suit simple verified tasks but leave the ambiguity of leadership work unresolved. |  | `contrast`: The familiar commands identify the desired output. → Commands suit simple verified tasks but leave the ambiguity of leadership work unresolved. |\n| p10 | cause_effect | A command can produce polished advice while omitting the local constraints that determine whether it fits. |  | `cause_effect`: Leadership tasks contain ambiguity, conflicting constraints, and consequences. → A command can produce polished advice while omitting the local constraints that determine whether it fits. |\n| p11 | definition | False delegation is treating generated artifacts as if they carried judgment, ownership, and legitimacy. |  | `cause_effect`: Polished advice can conceal missing local constraints. → False delegation is treating generated artifacts as if they carried judgment, ownership, and legitimacy. |\n| p12 | refutation | Generated artifacts do not carry the human accountability their polish can imply. | figure: Figure 2: assets/images/leadership-ladder/false-delegation-boundary.jpeg. Caption: AI can produce artifacts, but leaders still own judgment, legitimacy, and consequences. | `emphasis`: False delegation mistakes an artifact for accountable judgment. → Generated artifacts do not carry the human accountability their polish can imply. |\n| p13 | comparison | AI can support thinking while leaders retain the choices and consequences. | table: \\| AI can help with... \\| Leaders still own... \\| \\| --- \\| --- \\| \\| Generating options \\| Deciding what matters in this context \\| \\| Drafting plans \\| Choosing an accountable path \\| \\| Comparing trade-offs \\| Naming which trade-offs are legitimate \\| \\| Finding risks \\| Deciding which risks are acceptable \\| \\| Rewriting messages \\| Earning trust with real people \\| \\| Executing bounded tasks \\| Setting boundaries, review points, and escalation paths \\| | `contrast`: Artifacts cannot own judgment, legitimacy, or consequences. → AI can support thinking while leaders retain the choices and consequences. |\n| p14 | recommendation | Explicit intent avoids both underusing AI and overtrusting its outputs. |  | `conclusion_summary`: AI assistance leaves legitimate trade-offs, trust, boundaries, and ownership with people. → Explicit intent avoids both underusing AI and overtrusting its outputs. |\n\n### What Marquet's Model Contributes\n\n**Controlling idea** (`explanation`, id `marquet-contribution`): Marquet's language of intent, competence, clarity, and control offers a practical way to expose the human choices around AI work.\n\n**Advances the thesis** (C2): Marquet's language of intent, competence, clarity, and control offers a practical way to expose the human choices around AI work.\n\n**Transition in:** `problem_solution`: The leadership problem is how to make intent explicit without assuming accountability has moved to AI. → Marquet's language of intent, competence, clarity, and control offers a practical way to expose the human choices around AI work.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): Introduce the human source before extracting its useful principles, then state the accountability limit before showing what AI can still do. Reversing that order would invite a literal human-AI equivalence.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p15 | evidence | Marquet's books describe how leadership language enables people to think and act with intent. | source: Turn the Ship Around! and Leadership Is Language describe leader-leader ownership and the words and habits that shape contribution. |  |\n| p16 | explanation (list) | Intent, competence, clarity, and visible ownership are the model principles relevant to AI collaboration. |  | `elaboration`: Marquet's model ties leadership language to active thinking and ownership. → Intent, competence, clarity, and visible ownership are the model principles relevant to AI collaboration. |\n| p17 | refutation | Applying those principles to AI requires retaining moral accountability with humans. |  | `contrast`: The principles permit distributed ownership in human organizations. → Applying those principles to AI requires retaining moral accountability with humans. |\n| p18 | explanation | AI can nevertheless use richer intent and feedback to contribute more usefully. |  | `contrast`: AI does not own the consequences of its work. → AI can nevertheless use richer intent and feedback to contribute more usefully. |\n| p19 | synthesis | The leader makes the work explicit enough for AI to assist without becoming the hidden decision-maker. |  | `conclusion_summary`: AI can use context and feedback while humans remain accountable. → The leader makes the work explicit enough for AI to assist without becoming the hidden decision-maker. |\n\n### The Boundary of the Analogy\n\n**Controlling idea** (`comparison`, id `analogy-boundary`): The analogy supports bounded AI assistance only if human responsibility remains distinct from configured system behavior.\n\n**Advances the thesis** (C2): The analogy supports bounded AI assistance only if human responsibility remains distinct from configured system behavior.\n\n**Transition in:** `elaboration`: AI can use richer intent without becoming the hidden decision-maker. → The analogy supports bounded AI assistance only if human responsibility remains distinct from configured system behavior.\n\n**Order of paragraphs** (`comparison`): Clarify responsibility before comparing the two systems, then use the comparison to reject both clerk-only use and naive autonomy. The extremes would be unexplained without the distinction.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p20 | analysis | Calling AI a teammate can conceal the difference between modeling human concerns and living with consequences. |  |  |\n| p21 | comparison | Human leadership concepts must become explicit configuration, evaluation, and permission boundaries in AI work. | table: \\| In human Leader-Leader systems \\| In human-AI collaboration \\| \\| --- \\| --- \\| \\| People are developed to think, decide, and own outcomes. \\| AI systems are configured, prompted, evaluated, and bounded. \\| \\| Control can move closer to people doing the work. \\| Permissions can move closer to the workflow only with guardrails. \\| \\| Competence includes skill, judgment, and professional responsibility. \\| Competence must be demonstrated through tests, examples, evaluations, and observed behavior. \\| \\| Clarity includes shared purpose and organizational context. \\| Clarity must be supplied through prompts, context windows, policies, memory, tools, and review. \\| \\| Accountability can be distributed across humans. \\| Accountability remains with humans and organizations. \\| | `cause_effect`: AI does not accept responsibility as a person can. → Human leadership concepts must become explicit configuration, evaluation, and permission boundaries in AI work. |\n| p22 | claim | The responsibility boundary rules out both command-only use and unchecked autonomy. |  | `cause_effect`: AI accountability remains human even when workflow permissions increase. → The responsibility boundary rules out both command-only use and unchecked autonomy. |\n| p23 | analysis | Both extremes fail because the interaction model is a leadership system rather than a tooling detail. |  | `elaboration`: The responsibility boundary rules out two extremes. → Both extremes fail because the interaction model is a leadership system rather than a tooling detail. |\n\n### The Human-AI Leadership Ladder\n\n**Controlling idea** (`recommendation`, id `collaboration-ladder`): Choose the interaction level that the task and evidence can support rather than treating higher autonomy as a goal.\n\n**Advances the thesis** (C3): Choose the interaction level that the task and evidence can support rather than treating higher autonomy as a goal.\n\n**Transition in:** `problem_solution`: Command-only use and naive autonomy both ignore the leadership system around the work. → Choose the interaction level that the task and evidence can support rather than treating higher autonomy as a goal.\n\n**Order of paragraphs** (`prerequisite_order`): State that levels are choices rather than moral ranks, define their conditions and modes, then apply them to work examples. Examples before the ladder would depend on unexplained level numbers.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p24 | explanation | The ladder ranks interaction modes rather than the moral worth of lower or higher levels. |  |  |\n| p25 | description | The seven modes require progressively clearer intent, proven competence, bounded control, and review as autonomy rises. | table: \\| Level \\| Mode \\| Typical language \\| Good for \\| Failure mode \\| \\| --- \\| --- \\| --- \\| --- \\| --- \\| \\| 1 \\| Command \\| \"Do this exact task.\" \\| Formatting, extraction, conversion, simple transformations. \\| Brittle outputs; no shared context. \\| \\| 2 \\| Prompt/request \\| \"Draft a proposal for...\" \\| First drafts, summaries, quick alternatives. \\| Polished but generic artifacts. \\| \\| 3 \\| Critique/reflection \\| \"Here is my thinking; challenge it.\" \\| Finding gaps, assumptions, contradictions, blind spots. \\| AI stays trapped inside the frame you gave it. \\| \\| 4 \\| Recommendation \\| \"Compare options and recommend one.\" \\| Trade-off exploration and decision preparation. \\| Recommendations hide assumptions or overfit to incomplete context. \\| \\| 5 \\| Intent \\| \"I intend to achieve X under constraints Y; help design the path.\" \\| Ambiguous leadership work where context matters. \\| Requires human clarity, judgment, and review discipline. \\| \\| 6 \\| Bounded delegation \\| \"Execute these steps within these limits; escalate if...\" \\| Repeatable multi-step work with known boundaries. \\| Silent scope creep, missed exceptions, weak observability. \\| \\| 7 \\| Monitored autonomy \\| \"Operate within this policy and report exceptions.\" \\| Mature, well-instrumented workflows with strong controls. \\| Dangerous without auditability, rollback, and accountable ownership. \\| | `elaboration`: The appropriate level depends on the work rather than a desire to climb. → The seven modes require progressively clearer intent, proven competence, bounded control, and review as autonomy rises. |\n| p26 | recommendation | Leaders make the ladder useful by identifying the level their work actually requires. |  | `cause_effect`: The seven modes have different uses and failure modes. → Leaders make the ladder useful by identifying the level their work actually requires. |\n| p27 | example | The same level choice ranges from formatting notes to continuously operating production workflows. | example: Level 1 reformats notes; Level 3 challenges a migration plan; Levels 4 or 5 compare adoption options; Level 6 opens issues, changes files, runs checks, and proposes a pull request; Level 7 operates continuously in production. | `example`: Leaders need to identify the level a task requires. → The same level choice ranges from formatting notes to continuously operating production workflows. |\n| p28 | claim | High-autonomy tools paired with low-maturity language create leadership failure. |  | `cause_effect`: Higher-level workflows impose a larger governance burden. → High-autonomy tools paired with low-maturity language create leadership failure. |\n| p29 | recommendation | A lightweight spec exposes the intent and review expectations that autonomous tools would otherwise infer. |  | `problem_solution`: Autonomy can outrun the maturity of the language around the work. → A lightweight spec exposes the intent and review expectations that autonomous tools would otherwise infer. |\n\n### The Shift Is in the Language\n\n**Controlling idea** (`comparison`, id `language-shift`): The shift from command to intent adds the decision structure required to judge an output, not merely a longer prompt.\n\n**Advances the thesis** (C4): The shift from command to intent adds the decision structure required to judge an output, not merely a longer prompt.\n\n**Transition in:** `example`: Written intent exposes the context and review expectations that an autonomous workflow needs. → The shift from command to intent adds the decision structure required to judge an output, not merely a longer prompt.\n\n**Order of paragraphs** (`comparison`): Show a bare command and explain what it lacks before presenting the intent version and interpreting each added element. Reversing the pair would make prompt length look like the lesson.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p30 | context | An adoption-strategy prompt illustrates how a command becomes an intent statement. |  |  |\n| p31 | example | A bare adoption-strategy command requests a document without the decision context. | quotation: > Write a strategy for adopting AI-assisted development across engineering. | `example`: The comparison concerns an AI-assisted-development adoption decision. → A bare adoption-strategy command requests a document without the decision context. |\n| p32 | analysis | The command can generate a plausible draft but leaves the leadership context unspecified. |  | `cause_effect`: The command asks only for an adoption strategy. → The command can generate a plausible draft but leaves the leadership context unspecified. |\n| p33 | example | The intent prompt makes the adoption decision and its evaluation boundaries inspectable. | quotation: > I intend to help our engineering leadership team decide how to introduce AI-assisted development over the next two quarters without reducing code quality, weakening security review, or overwhelming managers. We have 180 engineers across eight product groups, uneven AI experience, strong security concerns, and pressure to improve delivery speed.   > > Help me compare three adoption paths: a central enablement team, embedded champions, and broad access with lightweight guardrails. For each path, identify prerequisites, risks, manager workload, security implications, early signals of success, and reasons to stop. Ask clarifying questions before recommending a path. | `problem_solution`: The bare command omitted purpose, constraints, organizational readiness, and criteria. → The intent prompt makes the adoption decision and its evaluation boundaries inspectable. |\n| p34 | analysis | The added prompt elements perform leadership functions rather than merely increasing length. | table: \\| Prompt element \\| Leadership function \\| \\| --- \\| --- \\| \\| \"I intend to...\" \\| States purpose and ownership. \\| \\| \"over the next two quarters\" \\| Defines time horizon. \\| \\| \"without reducing...\" \\| Names constraints and non-negotiables. \\| \\| \"180 engineers...\" \\| Supplies operating context. \\| \\| \"compare three paths\" \\| Defines the decision space. \\| \\| \"prerequisites, risks...\" \\| Makes evaluation criteria explicit. \\| \\| \"reasons to stop\" \\| Builds in escalation and safety. \\| \\| \"Ask clarifying questions\" \\| Prevents premature confidence. \\| | `elaboration`: The intent prompt supplies the decision context and boundaries. → The added prompt elements perform leadership functions rather than merely increasing length. |\n| p35 | synthesis | Intent-based collaboration makes output reviewable by clarifying work, boundaries, and accountability. | figure: Figure 3: assets/images/leadership-ladder/command-to-intent-language-shift.jpeg. Caption: Intent-based language turns a request into a reviewable boundary for AI-assisted work. | `conclusion_summary`: Each prompt element supplies a leadership function. → Intent-based collaboration makes output reviewable by clarifying work, boundaries, and accountability. |\n\n### Spec-Driven Development Is Intent Written Down\n\n**Controlling idea** (`explanation`, id `written-intent`): A written spec gives both AI and humans an inspectable contract before execution and during review.\n\n**Advances the thesis** (C4): A written spec gives both AI and humans an inspectable contract before execution and during review.\n\n**Transition in:** `elaboration`: Intent-based language creates a reviewable boundary around the work. → A written spec gives both AI and humans an inspectable contract before execution and during review.\n\n**Order of paragraphs** (`prerequisite_order`): Define the wider purpose of a spec before contrasting implicit and explicit agreements, then give internal examples, map fields to the ladder, and state the practical rule. The field mapping relies on the earlier ladder and examples.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p36 | context | Spec-driven delivery provides a useful implementation-and-review loop whose leadership purpose extends beyond software. |  |  |\n| p37 | claim | A spec makes intent inspectable. |  | `elaboration`: The implementation-and-review loop has a broader leadership purpose. → A spec makes intent inspectable. |\n| p38 | cause_effect | Without a written contract the leader and AI can operate from different implicit understandings. |  | `contrast`: Inspectable intent gives both sides something explicit to examine. → Without a written contract the leader and AI can operate from different implicit understandings. |\n| p39 | explanation | A spec supplies a shared target and review criteria before and after work. | figure: Figure 4: assets/images/leadership-ladder/spec-as-intent-contract.jpeg. Caption: A spec makes intent inspectable before AI acts and reviewable after it produces work. | `problem_solution`: Implicit agreements let coherent output miss the actual intent. → A spec supplies a shared target and review criteria before and after work. |\n| p40 | example | The sibling outcome spec is the writing contract while the article is the published artifact. | source: The existing spec-driven-authoring cross-link and the post contract covering intent, audience, criteria, non-goals, uncertainty, decisions, sources, and history. | `example`: A written contract lets humans inspect intent before and after work. → The sibling outcome spec is the writing contract while the article is the published artifact. |\n| p41 | example | The same contract pattern can connect product intent to wider delivery and organizational decisions. | source: The existing product-architecture cross-link connects product value, delivery, implementation, teams, roadmap, and evidence. | `similarity`: Authoring uses a visible contract rather than treating the article as its own intent. → The same contract pattern can connect product intent to wider delivery and organizational decisions. |\n| p42 | analysis | Spec fields provide the leadership functions needed to move from requests toward intent and bounded delegation. | table: \\| Spec element \\| Leadership function \\| Ladder effect \\| \\| --- \\| --- \\| --- \\| \\| Intent \\| Names the outcome and accountable purpose. \\| Moves from task execution to outcome orientation. \\| \\| Audience or users \\| Identifies who the work must serve. \\| Prevents generic output. \\| \\| Success criteria \\| Defines how the result will be judged. \\| Turns review into a checkable activity. \\| \\| Non-goals \\| Sets boundaries and prevents scope creep. \\| Makes delegation safer. \\| \\| Open questions \\| Makes uncertainty visible. \\| Creates escalation triggers. \\| \\| Sources and context \\| Grounds the work in existing knowledge. \\| Reduces invention and context loss. \\| \\| Decision log \\| Records why the path was chosen. \\| Keeps accountability visible. \\| \\| Tests, validation, or review checklist \\| Checks whether the result matches intent. \\| Demonstrates competence before more autonomy is granted. \\| | `elaboration`: The contract pattern applies across writing, software, and product architecture. → Spec fields provide the leadership functions needed to move from requests toward intent and bounded delegation. |\n| p43 | analysis | A spec concentrates human judgment at the moments when direction and trade-offs must be decided. |  | `cause_effect`: Spec fields expose purpose, uncertainty, boundaries, and validation. → A spec concentrates human judgment at the moments when direction and trade-offs must be decided. |\n| p44 | recommendation | Consequential work deserves intent written as a spec rather than a prompt alone. |  | `conclusion_summary`: A spec preserves human judgment before work, at reviews, and when trade-offs appear. → Consequential work deserves intent written as a spec rather than a prompt alone. |\n\n### Example 1: Architecture Trade-Off Review\n\n**Controlling idea** (`example`, id `architecture-example`): Architecture review becomes useful when the AI tests a visible intent against operational context while the engineer keeps the decision.\n\n**Advances the thesis** (C4): Architecture review becomes useful when the AI tests a visible intent against operational context while the engineer keeps the decision.\n\n**Transition in:** `example`: Consequential work needs a written decision frame before AI contributes. → Architecture review becomes useful when the AI tests a visible intent against operational context while the engineer keeps the decision.\n\n**Order of paragraphs** (`comparison`): Name the illustrative decision, show the weak request and its missing context, then the intent version and its meaning. Keeping the diagnosis between the two prompts makes the improvement visible.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p45 | context | A principal engineer has to decide whether selected services should use event-driven architecture. | scenario: The existing illustrative order-platform review, with event-driven architecture introduced as services responding to events. |  |\n| p46 | example | A general question about event-driven architecture invites a pattern comparison rather than a local decision. | quotation: > Should we use event-driven architecture for our order platform? | `example`: The principal engineer needs a decision about selected services. → A general question about event-driven architecture invites a pattern comparison rather than a local decision. |\n| p47 | analysis | Generic architectural trade-offs do not establish whether the pattern fits this team and migration. |  | `cause_effect`: The weak question supplies neither the local goal nor operational constraints. → Generic architectural trade-offs do not establish whether the pattern fits this team and migration. |\n| p48 | example | The intent version names the migration goal, constraints, current capability, and questions the engineer needs to decide. | quotation: > I intend to decide whether our order platform should move selected workflows toward event-driven architecture in the next six months. The goal is to reduce coupling between inventory, payments, and fulfillment without increasing incident response time or making debugging harder for on-call teams.   > > Context: we have six services, two teams, uneven eventing experience, a growing number of cross-service incidents, and limited observability. Payments must remain strongly auditable. Fulfillment can tolerate some delay, but customer communication cannot be inconsistent.   > > Help me evaluate where event-driven architecture is appropriate, where request/response should remain, what capabilities we must build first, and what migration sequence would reduce risk. State assumptions, ask clarifying questions, and separate \"do now\" from \"defer.\" | `problem_solution`: The generic comparison lacks the operational context needed for a decision. → The intent version names the migration goal, constraints, current capability, and questions the engineer needs to decide. |\n| p49 | analysis | Context-rich AI review improves the conditions for architecture judgment without taking the decision from the engineer. | table: \\| Without intent \\| With intent \\| \\| --- \\| --- \\| \\| AI gives a generic pattern comparison. \\| AI evaluates the pattern against operational maturity, service boundaries, auditability, and migration risk. \\| \\| The leader receives plausible advice but must reconstruct the context afterward. \\| The leader uses AI to stress-test a context-rich decision. \\| \\| The output may sound confident while hiding assumptions. \\| The interaction requires assumptions and clarifying questions to be surfaced. \\| | `conclusion_summary`: The stronger prompt makes assumptions, constraints, and evaluation visible. → Context-rich AI review improves the conditions for architecture judgment without taking the decision from the engineer. |\n\n### Example 2: Delivery Risk Review\n\n**Controlling idea** (`example`, id `delivery-example`): Delivery-risk review becomes useful when AI evaluates the actual commitment against capacity and constraints while the director keeps approval.\n\n**Advances the thesis** (C4): Delivery-risk review becomes useful when AI evaluates the actual commitment against capacity and constraints while the director keeps approval.\n\n**Transition in:** `similarity`: The architecture example exposes context so AI can aid an accountable decision. → Delivery-risk review becomes useful when AI evaluates the actual commitment against capacity and constraints while the director keeps approval.\n\n**Order of paragraphs** (`comparison`): Repeat the architecture example structure for a different leadership decision, so the reader can transfer the pattern without learning a new comparison format.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p50 | context | An engineering director needs to decide whether a product group can commit to its quarterly plan. | scenario: The existing illustrative delivery-risk review concerns a quarterly product-group commitment. |  |\n| p51 | example | A generic request to review roadmap realism omits the conditions that make a commitment possible. | quotation: > Review this roadmap and tell me if it is realistic. | `example`: The director needs to judge whether a quarterly commitment is feasible. → A generic request to review roadmap realism omits the conditions that make a commitment possible. |\n| p52 | analysis | Roadmap realism depends on operating conditions that the document alone may not contain. |  | `cause_effect`: The weak request asks for realism without explaining the organization. → Roadmap realism depends on operating conditions that the document alone may not contain. |\n| p53 | example | The intent version directs AI toward the capacity and risk evidence needed for approval. | quotation: > I intend to decide whether this product group can commit to the Q3 roadmap without creating hidden delivery risk. I do not want a generic risk list. I want help identifying where the plan is likely to break.   > > Context: the team has 22 engineers, two new managers, one unresolved reliability program, and three customer commitments already in flight. Last quarter, the team delivered 70% of planned scope and carried over two platform dependencies.   > > Review the roadmap against capacity, dependency risk, operational load, manager attention, and reversibility. Produce three outputs: risks that require leadership action, risks the team can manage locally, and questions I should ask before approving the plan. | `problem_solution`: The roadmap alone omits capacity, unfinished work, and the credibility of estimates. → The intent version directs AI toward the capacity and risk evidence needed for approval. |\n| p54 | analysis | The director uses AI as a reasoning aid while retaining the decision to commit, change scope, or pause. | table: \\| Without intent \\| With intent \\| \\| --- \\| --- \\| \\| The director receives a polished risk summary that may miss the organization's real failure modes. \\| The director asks AI to evaluate the plan against specific capacity, dependency, and operational constraints. \\| \\| The AI may optimize for completeness. \\| The AI is directed toward decision usefulness. \\| \\| Approval pressure remains hidden. \\| The prompt makes the leadership decision explicit: whether to commit, change scope, or pause. \\| | `conclusion_summary`: The intent prompt exposes constraints and separates risks by the action they require. → The director uses AI as a reasoning aid while retaining the decision to commit, change scope, or pause. |\n\n### Guardrails Scale With Autonomy\n\n**Controlling idea** (`recommendation`, id `autonomy-guardrails`): Higher autonomy is warranted only when intent, competence evidence, and bounded control can be checked.\n\n**Advances the thesis** (C5): Higher autonomy is warranted only when intent, competence evidence, and bounded control can be checked.\n\n**Transition in:** `elaboration`: The examples keep consequential judgment and approval with humans. → Higher autonomy is warranted only when intent, competence evidence, and bounded control can be checked.\n\n**Order of paragraphs** (`prerequisite_order`): Explain why prompts alone are insufficient, establish the three prerequisites, show how a failed prerequisite changes the level choice, and synthesize the observability rule. A list of controls before the decision rule would encourage a checklist without a gate.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p55 | claim | At Levels 5 through 7, prompt quality must be supported by an operating model. |  |  |\n| p56 | recommendation (list) | Clear intent, demonstrated competence, and bounded control are the three gates for more autonomy. |  | `elaboration`: Higher ladder levels need an operating model. → Clear intent, demonstrated competence, and bounded control are the three gates for more autonomy. |\n| p57 | recommendation | When any autonomy gate is missing, strengthen the controls or keep the work at a lower level. | table: \\| Guardrail \\| Why it matters \\| Practical test \\| \\| --- \\| --- \\| --- \\| \\| Scope \\| Prevents the AI from expanding the task silently. \\| Can you state what the system may and may not touch? \\| \\| Competence evidence \\| Prevents trust from being based on demos or confidence. \\| Have you seen reliable performance on representative work? \\| \\| Observability \\| Makes AI-assisted work inspectable. \\| Can a human reconstruct what happened and why? \\| \\| Review checkpoints \\| Keeps judgment in the loop. \\| Does the workflow stop before consequential decisions? \\| \\| Stop conditions \\| Defines when the system must pause. \\| Are uncertainty, errors, missing context, or policy conflicts explicit escalation triggers? \\| \\| Rollback \\| Reduces the cost of mistakes. \\| Can you undo or contain the action quickly? \\| \\| Ownership \\| Keeps accountability human. \\| Is one person or team accountable for the outcome? \\| | `cause_effect`: More autonomy requires all three gates to be satisfied. → When any autonomy gate is missing, strengthen the controls or keep the work at a lower level. |\n| p58 | synthesis | Autonomy without observability permits drift because people cannot inspect or contain delegated work. | figure: Figure 5: assets/images/leadership-ladder/guardrails-scale-with-autonomy.jpeg. Caption: As AI autonomy increases, guardrails must scale with it; otherwise delegation becomes drift. | `conclusion_summary`: Scope, evidence, observability, review, stopping, rollback, and ownership make the gates practical. → Autonomy without observability permits drift because people cannot inspect or contain delegated work. |\n\n### Common Failure Modes\n\n**Controlling idea** (`analysis`, id `failure-modes`): Collaboration fails when language, output fluency, or autonomy conceals the human decisions and controls the work still needs.\n\n**Advances the thesis** (C5): Collaboration fails when language, output fluency, or autonomy conceals the human decisions and controls the work still needs.\n\n**Transition in:** `contrast`: Guardrails make more autonomous work inspectable and accountable. → Collaboration fails when language, output fluency, or autonomy conceals the human decisions and controls the work still needs.\n\n**Order of paragraphs** (`grouping`): Move from misleading signals in prompts and outputs to failures in judgment, autonomous workflow boundaries, and ownership. This groups symptoms by what they conceal rather than scattering warnings through the instruction sequence.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p59 | context | Intent-based collaboration has recognizable traps in daily practice. |  |  |\n| p60 | analysis | Long prompts can conceal that the leader has not decided what matters. |  | `example`: Intent-based collaboration can fail despite apparent agreement. → Long prompts can conceal that the leader has not decided what matters. |\n| p61 | analysis | Fluent artifact production is not the same as carrying work into a decision or commitment. |  | `additional_support`: Surface signals such as prompt length can be mistaken for clarity. → Fluent artifact production is not the same as carrying work into a decision or commitment. |\n| p62 | analysis | Accepting an untested AI recommendation transfers judgment through an unexamined assumption. |  | `cause_effect`: Polished generated work does not itself constitute leadership. → Accepting an untested AI recommendation transfers judgment through an unexamined assumption. |\n| p63 | definition | Agentic work requires boundaries and an audit trail around its planning, actions, and feedback. |  | `additional_support`: Judgment can be hidden inside an unchecked recommendation. → Agentic work requires boundaries and an audit trail around its planning, actions, and feedback. |\n| p64 | analysis | A cooperative tone does not give AI an understanding of responsibility. |  | `additional_support`: Agentic language can conceal absent controls. → A cooperative tone does not give AI an understanding of responsibility. |\n| p65 | recommendation | A plan must name the human approver and reasoning so accountability remains visible. |  | `conclusion_summary`: Neither autonomous behavior nor human-like tone confers responsibility. → A plan must name the human approver and reasoning so accountability remains visible. |\n\n### What This Means for Technology Leaders\n\n**Controlling idea** (`recommendation`, id `role-implications`): Every technology-leadership role must make the AI-assisted work explicit in the decisions and reviews it owns.\n\n**Advances the thesis** (C6): Every technology-leadership role must make the AI-assisted work explicit in the decisions and reviews it owns.\n\n**Transition in:** `problem_solution`: Failure modes conceal human decisions unless an approver and reasoning remain visible. → Every technology-leadership role must make the AI-assisted work explicit in the decisions and reviews it owns.\n\n**Order of paragraphs** (`grouping`): Define the shared leadership capabilities before translating the operational ladder by role, then state the common responsibility. Role advice before the shared framing could sound like separate unrelated AI practices.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p66 | explanation | The ladder is a daily expression of agency, judgment, and persuasion: initiating action, choosing in context, and bringing people into a decision. | source: The existing link to prepare-for-ai-future offers the fuller treatment of agency, judgment, and persuasion. |  |\n| p67 | recommendation | Principal and staff engineers use AI to deepen technical reasoning while keeping judgment human. |  | `example`: The ladder translates shared leadership capabilities into daily work. → Principal and staff engineers use AI to deepen technical reasoning while keeping judgment human. |\n| p68 | recommendation | Engineering managers make AI use and review visible so teams can learn and protect quality. |  | `additional_support`: Technical leaders retain judgment over AI-assisted reasoning. → Engineering managers make AI use and review visible so teams can learn and protect quality. |\n| p69 | recommendation | Directors, VPs, and CTOs match AI autonomy to the organization's readiness. |  | `additional_support`: Managers need visible review and quality expectations. → Directors, VPs, and CTOs match AI autonomy to the organization's readiness. |\n| p70 | recommendation | Architects connect generated artifacts to the conditions that make decisions sustainable. |  | `additional_support`: Organizational readiness determines what autonomy can be absorbed. → Architects connect generated artifacts to the conditions that make decisions sustainable. |\n| p71 | synthesis | Across roles, greater AI capability requires leaders to become more explicit about the work. |  | `conclusion_summary`: Each leadership role supplies judgment or context that artifacts cannot own. → Across roles, greater AI capability requires leaders to become more explicit about the work. |\n\n### A Practice for This Week\n\n**Controlling idea** (`process`, id `weekly-practice`): A leader can practice accountable AI collaboration by making one real interaction's intent, boundaries, and review explicit before generation.\n\n**Advances the thesis** (C6): A leader can practice accountable AI collaboration by making one real interaction's intent, boundaries, and review explicit before generation.\n\n**Transition in:** `example`: All leadership roles must become more explicit about the work. → A leader can practice accountable AI collaboration by making one real interaction's intent, boundaries, and review explicit before generation.\n\n**Order of paragraphs** (`chronological`): Choose a real interaction, decide whether it needs a spec, write its frame and evidence requirements, ask AI to check the frame, then assess why the sequence works. Producing the artifact first would defeat the practice.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p72 | recommendation | Choose one consequential AI interaction and rewrite it as an intent statement. |  |  |\n| p73 | recommendation | Use a small spec when a mistaken result would matter. |  | `elaboration`: The practice starts with one real AI interaction. → Use a small spec when a mistaken result would matter. |\n| p74 | process (list) | An intent statement makes the outcome, context, decision space, limits, and review explicit. |  | `elaboration`: The spec is a reviewable boundary between intent and execution. → An intent statement makes the outcome, context, decision space, limits, and review explicit. |\n| p75 | process (list) | A spec also records the inputs, validation, and change history needed to inspect the work. |  | `additional_support`: The intent frame states the outcome and decision boundaries. → A spec also records the inputs, validation, and change history needed to inspect the work. |\n| p76 | process (list) | AI should clarify and test the decision frame before producing the artifact. |  | `sequence`: The human has supplied the frame, inputs, and validation expectations. → AI should clarify and test the decision frame before producing the artifact. |\n| p77 | analysis | Checking the frame first slows work where confidence could otherwise outrun clarity. |  | `cause_effect`: AI restates intent, exposes assumptions, asks questions, and proposes an approach before generation. → Checking the frame first slows work where confidence could otherwise outrun clarity. |\n| p78 | explanation | The same written-intent habit scales from a few prompt bullets to a tracked outcome contract. | example: A small task uses prompt bullets; a feature uses a tracked specification and acceptance tests; product architecture uses a structured source model; this article uses its sibling spec.json. | `elaboration`: Clarifying the frame before generation is the central habit. → The same written-intent habit scales from a few prompt bullets to a tracked outcome contract. |\n\n### Questions to Consider\n\n**Controlling idea** (`recommendation`, id `self-assessment`): Readers can use their current AI interactions to locate missing intent or review before increasing autonomy.\n\n**Advances the thesis** (C3, C5, C6): Readers can use their current AI interactions to locate missing intent or review before increasing autonomy.\n\n**Transition in:** `example`: The weekly practice scales explicit intent to the size and consequences of the task. → Readers can use their current AI interactions to locate missing intent or review before increasing autonomy.\n\n**Order of paragraphs** (`grouping`): Keep the existing questions together after the practice so readers can apply it before the final synthesis; putting them after the references would reopen the argument after its ending.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p79 | recommendation (list) | The questions help readers distinguish appropriate commands from consequential work that lacks context, a spec, review, or stopping rules. |  |  |\n\n## Conclusion: Final Thought\n\n**Synthesis:** The ladder selects how much work to delegate, the spec makes the decision frame inspectable, and guardrails keep that delegation observable; together they make increased capability usable without hiding human responsibility.\n\n**So what:** Leaders can use AI to reach better decisions with people who understand the reasoning instead of accumulating polished artifacts whose intent and approval are unclear.\n\n**Callback:** The opening shift from better prompting to asking what intent, boundaries, and review consequential AI work requires. The command-to-intent ladder now gives a practical answer: select one real interaction and expose its decision frame, boundaries, and review before generation.\n\n**Takeaway** (`course_of_action`): Rewrite one real AI interaction as intent with explicit limits and review, using a spec when the consequences merit it.\n\n**Hand-off** to [AI Will Do the Heavy Lifting. You Still Need to Lead](prepare-for-ai-future.html): `elaboration`: Intent-based collaboration defines the boundaries and evidence needed for AI-assisted work. → The agency, contextual judgment, and persuasion people must practice to set those boundaries and turn outputs into shared decisions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p80 | synthesis | The ladder, written intent, and guardrails together turn growing AI capability into work people can understand, judge, and own. |  |  |\n| p81 | analysis | The value of AI assistance is better decisions with people who understand the reasoning, rather than more artifacts alone. |  | `cause_effect`: Intent and controls connect generated work to accountable decisions. → The value of AI assistance is better decisions with people who understand the reasoning, rather than more artifacts alone. |\n| p82 | recommendation | The practical climb from command to intent begins by making one real interaction's boundaries and review visible. |  | `conclusion_summary`: AI assistance matters when people can use its reasoning to make decisions. → The practical climb from command to intent begins by making one real interaction's boundaries and review visible. |\n| p83 | transition | The next essay develops the agency, contextual judgment, and persuasion people need to set these boundaries and turn output into shared action. | source: [AI Will Do the Heavy Lifting. You Still Need to Lead](prepare-for-ai-future.html) follows this operational ladder with the practice of agency, judgment, and persuasion. | `elaboration`: Intent-based collaboration defines the boundaries and evidence needed for AI-assisted work. → The human capabilities required to initiate action, choose in context, and bring others into the decision. |\n\n## Non-goals\n\n- A full summary of *Turn the Ship Around!* or *Leadership Is Language*.\n- A general article about leadership in the AI era; [AI Will Do the Heavy Lifting. You Still Need to Lead](prepare-for-ai-future.html) already covers agency, judgment, and persuasion at that level. See [AI Will Do the Heavy Lifting. You Still Need to Lead](prepare-for-ai-future.html).\n- A generic prompt-engineering guide.\n- A governance policy for autonomous AI agents.\n- A claim that AI genuinely has intent, ownership, commitment, or moral agency.\n- A claim that organizations should grant broad autonomy to AI systems without competence evidence, auditability, and human override.\n\n## Modalities\n\nArticle, summary, dialog, comics\n\n## Decision log\n\n- **2026-05-28** — Recommended developing the article as an\n**intent-based human-AI collaboration ladder**. This gives the rough draft a\ndistinct purpose and avoids overlapping too much with\n[AI Will Do the Heavy Lifting. You Still Need to Lead](prepare-for-ai-future.html).\n- **2026-05-28** — Chose Marquet's Intent-Based Leadership as the primary\nsource frame because it contributes a useful language shift: from permission\nand command toward intent, clarity, competence, and distributed decision\nmaking.\n- **2026-05-28** — Rejected a broad \"AI leadership future\" direction because it\nwould repeat the already-developed post on agency, judgment, and persuasion.\n- **2026-05-28** — Rejected a literal \"AI as leader/teammate\" framing because it\nrisks anthropomorphizing AI and weakening the article's accountability\nargument.\n- **2026-05-28** — Recommended changing the title because the current title\nsignals the source model but not the article's practical promise.\n- **2026-05-28** — Accepted the title\n`From Prompting to Intent: The Leadership Ladder for Working with AI` because\nit names both the practical transition and the article mechanism.\n- **2026-05-28** — Chose architecture trade-off review and delivery-risk review\nas the main examples because they are recognizable technology-leadership\nscenarios and make the distinction between output generation and accountable\njudgment concrete.\n- **2026-05-28** — Added spec-driven development as the concrete operating\npattern for the ladder: specs make intent, constraints, success criteria,\nvalidation, and review boundaries inspectable before AI acts.\n- **2026-05-28** — Recommended a future article structure:\n1. Open with the problem: command-style prompting does not scale to agentic\n   AI.\n2. Introduce Marquet: Leader-Leader, Intent-Based Leadership, and why\n   language matters.\n3. Explain the adaptation boundary: AI can act capability. It also makes\nthe article distinct from [AI Will Do the Heavy Lifting. You Still Need to Lead](prepare-for-ai-future.html), which already covers\nagency, judgment, and persuasion at a broader leadership level.\n\nDo not make the article about \"AI becoming a leader.\" Make it about people\nlearning to lead work in which AI systems can increasingly propose, critique,\nexecute, and monitor within boundaries.\n- **2026-05-28** — Legacy title alternatives (preserved):\nRecommended:\n\n- `From Prompting to Intent: The Leadership Ladder for Working with AI`\n\nGood alternatives:\n\n- `Intent-Based Leadership for Human-AI Collaboration`\n- `Leading with AI Without Delegating Leadership`\n- `From Commands to Intent: How Technology Leaders Should Work with AI`\n\nAvoid titles that are too broad, such as the current\n`Leading into the AI Future: Applying the Leader-Leader Model`. It is accurate,\nbut it does not tell the reader what practical problem the post solves.\n- **2026-05-28** — Legacy proposed article shape (preserved):\n1. **Open with the problem**: command-style prompting works for small tasks, but\n   breaks down when AI systems are asked to explore options, make trade-offs, or\n   operate over longer workflows.\n2. **Introduce Marquet briefly**: Leader-Leader replaces \"do what I say\" with\n   intent, clarity, competence, and distributed decision-making.\n3. **Set the adaptation boundary**: AI can work from stated intent, but it does\n   not own consequences. Humans remain accountable for purpose, trade-offs,\n   consent, risk, and escalation.\n4. **Present the Human-AI Leadership Ladder** with levels, example language,\n   appropriate use, and failure modes.\n5. **Show examples**: rewrite weak command prompts into stronger intent-based\n   collaborations, preferably using engineering leadership scenarios.\n6. **Connect to spec-driven development**: show that a spec is the written\n   boundary between human intent and AI execution.\n7. **Define guardrails for higher autonomy**: scope, evidence of competence,\n   logging, review checkpoints, stop conditions, rollback, and human ownership.\n8. **Close with practices**: one or two rituals leaders can try this week, such\n   as writing prompts as intent statements or asking AI to state assumptions and\n   escalation conditions before proceeding.\n- **2026-05-28** — Legacy drafting guidance (preserved):\n- Use Marquet's model as an analogy and source of leadership language, not as a\n  claim that AI systems are people.\n- Prefer \"AI systems\", \"AI agents\", or \"AI-assisted workflows\" over \"AI\n  teammate\" unless the sentence explicitly keeps human accountability clear.\n- Keep \"agentic AI\" grounded. Use it when discussing workflows that can plan,\n  act, observe results, and continue within constraints; do not use it as a\n  hype label.\n- When describing higher ladder levels, pair every increase in autonomy with a\n  corresponding increase in clarity, competence evidence, observability, and\n  human review.\n- Make the current diagram earn its place. If it remains, relabel it for the\n  AI-specific ladder. Otherwise replace it with a simpler ladder table and a\n  cleaner generated diagram later.\n- **2026-05-28** — Legacy open-question resolutions (preserved; no unresolved question in that draft):\nNone for the current draft.\n\nResolved in the 2026-05-28 rewrite:\n\n- Adopted `From Prompting to Intent: The Leadership Ladder for Working with AI`\n  as the article title.\n- Focused the ladder on individual and team human-AI interaction, with a short\n  role-specific implications section for technology leaders.\n- Adapted Marquet's model rather than reproducing the original ladder\n  mechanically.\n- Avoided \"AI teammate\" as the core frame and kept human accountability\n  explicit.\n- Removed the broken leadership-section link.\n- Used architecture trade-off review and delivery-risk review as the two main\n  examples.\n- Kept the existing ladder image for g to events, agentic workflows as planning/acting/observing within boundaries, observability as reconstructing what happened, and agency/judgment/persuasion as initiating/choosing in context/bringing people into a decision. Keep the existing examples and their figures unchanged. Rejected: Assuming the reader has already read the later leadership essay.; Adding new evidence or new company/product claims.\n- **2026-11-12** — Update only the two article references to its sibling spec.md to spec.json because this authorized migration makes that the local contract. Retain legacy references in historical decisions and source descriptions. Rejected: Leaving the article to point at a removed local contract.; Changing the historical records to imply outcome specs existed in May 2026.\n- **2026-11-12** — Legacy success criteria 1–3, 5, 7–9 are covered as reader outcomes by copied AC-1 through AC-3. The inventory aspects of criteria 4 (a ladder with language examples) and 6 (positive/negative examples) are retained as specified evidence supporting AC-1/AC-2 rather than added criteria. Criterion 10 (excerpt, key-points block, and questions) remains a preservation requirement rather than a reader-outcome criterion. Original criteria, preserved for migration traceability:\n- [x] Reader can explain, in two or three sentences, what the Leader-Leader\n      / Intent-Based Leadership model contributes to AI-era leadership.\n- [x] Reader understands that the article is adapting Marquet's model as an\n      analogy, not treating AI as a person or moral agent.\n- [x] Reader can distinguish command-style prompting from intent-based\n      collaboration.\n- [x] Reader sees a practical ladder of human-AI interaction levels, with\n      examples of language at each level.\n- [x] Reader understands that increased AI autonomy requires clarity,\n      competence checks, bounded control, review points, and escalation paths.\n- [x] Reader sees at least one negative and one positive example of human-AI\n      interaction at different maturity levels.\n- [x] Reader can apply one immediate practice, such as rewriting a command\n      prompt into an intent statement with context, constraints, success\n      criteria, and review expectations.\n- [x] Reader understands spec-driven development as a concrete way to turn\n      intent, constraints, validation, and review expectations into an\n      inspectable contract before AI acts.\n- [x] Reader will not leave with the impression that leadership can be\n      delegated to AI or that \"agentic AI\" removes human responsibility.\n- [x] The article has a non-empty excerpt, key-points block, and closing\n      questions that match the recommended direction. Rejected: Turning the preserved content inventories into new blocking acceptance criteria.\n- **2026-11-12** — The existing published article and legacy spec are the factual authority for this pass; no journal research ledger is present. All names, quantities, dates, qualifications, links, illustrations, and captions remain. The illustrative adoption, architecture, and delivery prompts retain their exact figures and are explicitly presented as examples; no external claim is newly researched or corrected.\n- **2026-11-12** — Fresh flow review 1 returned sound. Adopt all four drafting notes within existing units: distinguish the definition of false delegation from why artifacts cannot carry accountability; keep Marquet's preliminary boundary statement short before the practical analogy comparison; retain operational/migration constraints in the architecture example and capacity/commitment evidence in the delivery example; keep Questions to Consider a brief diagnostic after the practice. No order, heading, paragraph count, copied intent, thesis, role, or criterion changes.\n- **2026-11-12** — Add the required <br> after the existing three-bullet KEY POINTS callout, as specified by CLAUDE.md and the detailed-article house style. This is markup only: all words, callout lines, front matter, paragraph units, and reading order remain unchanged. No draft readers or finalization have run; regenerate the initial round-1 preparation after this correction.\n\n## Sources\n\n- **Internal**\n  - _journals/ai-notes/posts/leadership-ladder/index.md — Published wording, claims, examples, all quantities, links, tables, illustrations, captions, and the three-bullet KEY POINTS; primary factual authority for this reconstruction.\n  - _journals/ai-notes/posts/leadership-ladder/spec.md (legacy; migrated here) — Accepted intent, source framing, non-goals, modalities, resolved questions, decision history, drafting constraints, sources, and changelog; history retained in this contract.\n  - _journals/ai-notes/journal-spec.json — The exact full post intent, thesis, role, and acceptance criteria; the leadership-part opening and next-post elaboration hand-off.\n  - fashion-driven-software-development — The incoming responsibility for deliberate product decisions about value, trust, and what should remain stable.\n  - prepare-for-ai-future — Companion post defining agency, judgment, and persuasion as durable technology-leadership capabilities in the AI transition; the next post in the reading order.\n  - spec-driven-authoring — Foundation record defining sibling spec.md files as lightweight contracts for AI-mediated authoring and review (legacy source description preserved); the pattern supplies the writing-contract example.\n  - what-is-spec-driven-product-architecture — Broader product architecture example where structured specifications become the durable interface between product intent, implementation, delivery, and AI agents.\n- **External**\n  - David Marquet, Turn the Ship Around! — https://davidmarquet.com/books/turn-the-ship-around-book/ — Source for the Leader-Leader model and the shift from command-and-control toward leadership at every level; inherited from the published article and legacy spec.\n  - David Marquet, Leadership Is Language — https://davidmarquet.com/books/leadership-is-language/ — Source for the claim that leadership language shapes whether people comply, contribute, or think; inherited from the published article and legacy spec.\n  - David Marquet, Intent-Based Leadership overview — https://davidmarquet.com/ — Source for the I intend to language, the Ladder of Leadership, and the distinction between permission and intent; inherited from the legacy spec.\n  - Intent-Based Leadership — https://www.intentbasedleadership.com/about-us — Supporting source for the broader model: moving away from command-and-control toward leader-leader cultures with clarity, accountability, and distributed decision-making; inherited from the published article and legacy spec.\n\n## Changelog\n\n- **2026-11-12** — Added the house-style <br> between KEY POINTS and the introduction before initial reader review; wording, units, metadata, and order unchanged.\n- **2026-11-12** — Recorded fresh flow-review verdict sound and adopted its four drafting notes before revising prose; no order changes. Drafting will distinguish definition from accountability explanation, keep the initial boundary brief, preserve the examples' different constraints, and retain the questions as a diagnostic.\n- **2026-11-12** — Reconstructed full outcome spec from the published article and legacy spec before prose revision. Copied the finalized journal contract exactly; preserved all historical records. Specified an explicit product-to-leadership bridge and roadmap, the Questions move before Final Thought, an accountable-work synthesis and next-post hand-off, targeted term explanations, and two local spec.json filename updates. Status draft; auto mode permits subsequent drafting. No numeric word limit or extra acceptance criteria added.\n- **2026-06-12** — Added Modalities section; the spec now drives `summary.md`,\n`dialog.md`, and `comics.md` alongside the article. Status `accepted`.\n*(Zeljko, AI-mediated session)*\n- **2026-05-28** — Connected the article more explicitly to spec-driven\ndevelopment, adding a dedicated section and practice guidance that treats\nspecs as written intent boundaries for AI-assisted work. Status `accepted`.\n*(Zeljko, AI-mediated session)*\n- **2026-05-28** — Rewrote the post to match the spec: new title, excerpt,\nkey points, practical ladder, examples, guardrails, failure modes, role\nimplications, and closing practice. Status `accepted`. *(Zeljko,\nAI-mediated session)*\n- **2026-05-28** — Initial spec for the rough `leadership-ladder` article.\nRecommended the intent-based human-AI collaboration direction and captured\nalternatives, non-goals, sources, and a proposed article structure.\n*(Zeljko, AI-mediated session)*\n"}]}]}</script>

    (function () {

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');

                const h = line.match(/^(#{1,6})\s+(.*)$/);
