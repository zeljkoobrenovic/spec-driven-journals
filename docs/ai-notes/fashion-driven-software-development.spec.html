<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published index.md and accepted legacy spec.md (revised 2026-06-11), with the final ai-notes journal-spec.json as the outcome contract. Baseline parse: 124 argumentative units, a preserved three-bullet opening callout, tables and figures attached as evidence, and reference apparatus. The new spec retains all existing units, moves Questions to Consider before The Real Shift, and specifies an opening bridge/hook, complete roadmap, clarified existing synthesis/action, and final leadership hand-off before any prose revision. At reconstruction the baseline lacked these elements; the spec recorded them before prose changes rather than describing them as already present.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The difference between using AI to develop software and building a product whose value depends on models.\n- **Know:** Why model changes can require seasonal product reinterpretation and can regress local fit despite higher general capability.\n- **Believe:** Outcome-focused product management needs explicit model assumptions, repeated evaluation, and a stable customer promise.\n- **Believe:** Model novelty and benchmarks do not establish customer or business value.\n- **Be able to:** Frame a model-driven change as a testable bet with a value hypothesis, preserved promise, regression checks, and a ship, delay, retire, or revert decision.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader distinguishes AI-assisted delivery from model-powered products and explains what seasonal change adds to outcome-focused product management. *Probe:* Why does a new model create a different problem for an AI-powered product than for a team using AI to write code? | `custom` | cold_reader | major |\n| AC-2 | A reader explains why a stronger model is not automatically an upgrade for a particular product. *Probe:* A new model scores higher on general benchmarks. What could still make switching to it wrong for this product? | `custom` | cold_reader | major |\n| AC-3 | A reader describes an evaluation-led seasonal decision that preserves the customer promise and separates exploration from commitment. *Probe:* How should a team decide what to preserve, rebuild, retire, or test after a model changes? | `custom` | cold_reader | major |\n\n## Thesis\n\n**Question:** How should product teams plan when generative models are part of the product and keep changing?\n\n> **Claim:** Model-powered product teams should plan recurring, evaluation-led reinterpretations of workflows around changing models while preserving a stable customer promise, because a new model can enable previously infeasible workflows while breaking behavior that an existing customer job depends on.\n\n**Disputed by:** The view that model releases are chiefly component upgrades within a stable feature roadmap, so benchmark improvements justify adoption without reconsidering workflows and customer fit.\n\n**So what:** Roadmaps, discovery, briefs, and release decisions need explicit model assumptions and customer evidence so that repeated rebuilds protect value rather than follow novelty.\n\n**How and why:** A model change can remove workflow constraints and introduce new failure modes at once; only comparison on real user jobs, controls, trust boundaries, cost, and business outcomes shows which changes deserve commitment.\n\n**Supporting claims**\n\n- **S1** — A model used in the customer product changes product possibilities and assumptions in a way that a development assistant does not.\n- **S2** — Externally changing models can regress local fit, so seasonal planning extends outcome-focused management rather than assuming monotonic upgrades.\n- **S3** — Comparative evaluation and direct customer evidence determine whether a model-driven change creates product and business value.\n- **S4** — A stable customer promise and trust boundary let teams reinterpret model-dependent workflows without losing product identity.\n- **S5** — A repeatable scouting, specification, evaluation, and selective-release loop separates exploration from commitment and retains learning.\n\n## Role in the part\n\nExtends the journal's outcome and evaluation discipline to products whose own behavior changes with the model material. Supports P1, P2 of part `ai-product-development`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in two-conversations through product-management establish the problem and vocabulary.; `large_to_small` in operating-model through stable-core move from the loop to the decisions and evidence that govern it.; `grouping` in team-work through questions translate the model into routines, rules, failure patterns, and a self-check.)\n\nFirst distinguish the product problem from faster delivery, then explain the fashion analogy, external model change, short seasons, and the addition to modern product management. Only then introduce the operating loop and its fad-driven failure, followed by evaluation infrastructure, customer evidence, and stable commitments. Team routines, principles, anti-patterns, and self-questions apply those criteria before the final synthesis and leadership hand-off. Putting the loop before the model-material distinction would resemble generic speed advice; putting the practical rules before evaluation and the stable promise would leave their decision criteria unexplained. Moving the questions before the close lets the essay finish by joining stable purpose to evaluated change.\n\n## Introduction\n\n**Hook** (`thought_provoking_question`): When a new model arrives, does it merely help the team build, or does it change what the product should be?\n\n**Bridge:** Engineering leaders know that faster code generation still requires inspectable platforms, tests, and review; [Can RISC-Inspired Platforms Make AI Less Risky?](risc-for-ai-software-development.html) develops that point. → If the model itself supplies customer-facing capability, its release can change the product assumptions that implementation is supposed to serve. Introduce this contrast explicitly, then define both uses of AI within the essay.\n\n**Thesis statement** (Original KEY POINTS bullets 1–3 and introduction p02–p03; p02 keeps the existing thesis-led opening and makes preservation/evaluation explicit.): Model-powered products may need frequent reinterpretation around new materials. The aim is to preserve the customer promise while evaluating which workflow changes create value, because a stronger model can also break existing jobs.\n\n**Roadmap** (New final introduction paragraph p10; announce the article's own route in reading order, with comparative tables, conditional examples, and practical guidance rather than a researched company case study.):\n\n- Separate faster delivery from model-powered product change, then explain the fashion analogy and what changing material does to planning and modern product management. *Kept in:* two-conversations, fashion-metaphor, model-material, short-seasons, product-management.\n- Turn the diagnosis into a seasonal operating rhythm and distinguish it from fad chasing. *Kept in:* operating-model, fad-driven.\n- Use evaluation, customer evidence, and a stable product promise to decide which changes deserve commitment. *Kept in:* evaluation-fitting-room, evaluation-suite, customer-value, stable-core.\n- Translate those criteria into team routines, practical principles, anti-patterns, and questions to apply to the reader's own product. *Kept in:* team-work, practical-principles, anti-patterns, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | transition | Inspectable AI-assisted building does not settle what a model-powered customer product should become after its model changes. | reasoning: Link [Can RISC-Inspired Platforms Make AI Less Risky?](risc-for-ai-software-development.html) to its established question of inspectable building, then ask: When a new model arrives, does it merely help the team build, or does it change what the product should be?; reasoning: Preserve the original KEY POINTS callout verbatim, including exactly three bullets, its bold emphasis, and the following <br>. | `contrast`: The software part establishes inspectable platforms, intended behavior, and evaluation for AI-assisted building. → When the model is in the customer product, the behavior and product assumptions themselves can change between model releases. |\n| p02 | claim | Model-powered products need recurring reinterpretation around new materials while protecting customer value through evaluation. | reasoning: The published opening contrasts using AI as a development tool with depending on it for workflow, interface, quality, unit economics, promise, and positioning. | `elaboration`: Inspectable AI-assisted building does not settle what a model-powered customer product should become after its model changes. → Model-powered products need recurring reinterpretation around new materials while protecting customer value through evaluation. |\n| p03 | counterargument | General model improvement does not guarantee improvement for a specific product. | reasoning: Benchmarks can improve while workflow, tone, latency, safety, expert control, or unit economics worsen. | `contrast`: Model-powered products need recurring reinterpretation around new materials while protecting customer value through evaluation. → General model improvement does not guarantee improvement for a specific product. |\n| p04 | context | Samuel Beek's account of generative-model change at VEED inspired the fashion metaphor. | source: Preserve the published account of Samuel Beek, founder and CEO of Schematik and formerly CPO at VEED, speaking at an Engineering Excellence meetup in Amsterdam; his description of VEED prompted the fashion comparison. | `example`: General model improvement does not guarantee improvement for a specific product. → Samuel Beek's account of generative-model change at VEED inspired the fashion metaphor. |\n| p05 | transition | The talk raises a distinction that applies beyond its originating company. |  | `elaboration`: Samuel Beek's account of generative-model change at VEED inspired the fashion metaphor. → The talk raises a distinction that applies beyond its originating company. |\n| p06 | definition | AI-assisted development changes how the team produces software. | reasoning: The existing examples are code writing, pull-request review, tests, incident summaries, and documentation. | `elaboration`: The talk raises a distinction that applies beyond its originating company. → AI-assisted development changes how the team produces software. |\n| p07 | definition | AI-powered product development changes the capabilities from which customer value is made. | reasoning: Customer value depends directly on the model capabilities. | `contrast`: AI-assisted development changes how the team produces software. → AI-powered product development changes the capabilities from which customer value is made. |\n| p08 | claim | The two uses of AI require different operating models. |  | `conclusion_summary`: AI-powered product development changes the capabilities from which customer value is made. → The two uses of AI require different operating models. |\n| p09 | analysis | The product-material question calls for a different planning discipline from faster software delivery. |  | `elaboration`: The two uses of AI require different operating models. → The product-material question calls for a different planning discipline from faster software delivery. |\n| p10 | transition | The article moves from the AI distinction and changing-material problem to a seasonal operating model, Primary risk \\| Low-quality generated work entering the codebase. \\| A product experience becoming obsolete, generic, unsafe, regressed, or misaligned with customer value. \\| \\| Core discipline \\| Engineering review, tests, architecture, security, developer workflow. \\| Product judgment, model evaluation, customer evidence, quality control, business-value validation. \\| |  |\n| p12 | cause_effect | Faster delivery can conceal a product falling behind new model possibilities. | reasoning: A team can ship more artifacts while new model possibilities make the existing product less appropriate. | `cause_effect`: The two uses of AI differ in their location, expected benefits, risks, and governing disciplines. → Faster delivery can conceal a product falling behind new model possibilities. |\n| p13 | recommendation | A model-powered team must ask whether the existing product shape still serves its purpose after a model changes. |  | `cause_effect`: Faster delivery can conceal a product falling behind new model possibilities. → A model-powered team must ask whether the existing product shape still serves its purpose after a model changes. |\n| p14 | transition | Reconsidering product shape calls for the kind of judgment captured by the fashion analogy. | figure: Preserve assets/images/fashion-driven-software-development/two-ai-conversations.jpeg and its original caption: Figure 1: AI-assisted development changes delivery speed; AI-powered products can change shape when the model material changes. | `elaboration`: A model-powered team must ask whether the existing product shape still serves its purpose after a model changes. → Reconsidering product shape calls for the kind of judgment captured by the fashion analogy. |\n\n### Why Fashion Is Not a Superficial Metaphor\n\n**Controlling idea** (`explanation`, id `fashion-metaphor`): Fashion offers a discipline for changing material and uncertain demand while preserving identity.\n\n**Advances the thesis** (S1, S2): Fashion offers a discipline for changing material and uncertain demand while preserving identity.\n\n**Transition in:** `elaboration`: AI-assisted delivery and model-powered product development require different decisions. → Fashion offers a discipline for changing material and uncertain demand while preserving identity.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): Reject the fad reading, explain the useful industry pattern, then transfer the material analogy to AI; the analogy needs these limits before its product implications.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p15 | definition | Fashion here means more than a shallow or irrational fad. |  |  |\n| p16 | explanation | Fashion turns changing materials and demand into products with a recognizable identity. | reasoning: Changing materials, culture, taste, production constraints, and demand must become a recognizable designed product. | `elaboration`: Fashion here means more than a shallow or irrational fad. → Fashion turns changing materials and demand into products with a recognizable identity. |\n| p17 | explanation | Fashion cannot predict customer taste solely from technical and commercial analysis. | reasoning: Materials, cost, past sales, and segments do not determine timing, social proof, identity, surprise, fatigue, or context. | `additional_support`: Fashion turns changing materials and demand into products with a recognizable identity. → Fashion cannot predict customer taste solely from technical and commercial analysis. |\n| p18 | transition | That combination of changing materials and limited predictability also describes AI product work. |  | `similarity`: Fashion cannot predict customer taste solely from technical and commercial analysis. → That combination of changing materials and limited predictability also describes AI product work. |\n| p19 | analysis | Generative AI extends the design-material framing by making the material itself change between seasons. | source: Lars Holmquist's Intelligence on tap frames AI as a design material; the article extends that framing to changes in quality, cost, latency, modalities, controllability, and expectations.; table: \\| Fashion concept \\| AI product parallel \\| \\| --- \\| --- \\| \\| Fabric and materials \\| Foundation models, APIs, model costs, latency, context windows, modalities, tool use. \\| \\| Season \\| Model release cycles, platform shifts, user expectation changes, new creative patterns. \\| \\| Collection \\| A coherent product release built around what the new model makes possible. \\| \\| Silhouette \\| The dominant product shape: workflow, interface, interaction model, output form. \\| \\| Fit \\| Whether the product actually works for the user's job, context, and taste. \\| \\| Craft \\| Prompting, data flows, UX, editing controls, guardrails, retrieval, orchestration, evaluation. \\| \\| Brand identity \\| The durable promise customers trust, even as features and models change. \\| \\| Runway \\| Prototype, demo, launch video, internal model showcase. \\| \\| Retail performance \\| Adoption, retention, willingness to pay, expansion, production usage. \\| \\| Archive \\| What the team learns from past releases, failures, prompts, examples, and evaluations. \\| | `elaboration`: That combination of changing materials and limited predictability also describes AI product work. → Generative AI extends the design-material framing by making the material itself change between seasons. |\n| p20 | claim | AI products move because their underlying model capabilities move. |  | `conclusion_summary`: Generative AI extends the design-material framing by making the material itself change between seasons. → AI products move because their underlying model capabilities move. |\n| p21 | comparison | An AI product team must respond to changes in model capability and customer expectations. | reasoning: The published comparison places fabric and manufacturing changes beside model quality, multimodality, reasoning, speed, cost, and expectations. | `elaboration`: AI products move because their underlying model capabilities move. → An AI product team must respond to changes in model capability and customer expectations. |\n| p22 | synthesis | The useful lesson from fashion is disciplined change. | figure: Preserve assets/images/fashion-driven-software-development/model-as-changing-material.jpeg and its original caption: Figure 2: When the model is part of the product material, each major model release can force a reinterpretation of the product. | `conclusion_summary`: An AI product team must respond to changes in model capability and customer expectations. → The useful lesson from fashion is disciplined change. |\n\n### What Changes When the Model Is the Core Material\n\n**Controlling idea** (`cause_effect`, id `model-material`): Externally changing model behavior can force product reinterpretation while introducing regressions.\n\n**Advances the thesis** (S1, S2): Externally changing model behavior can force product reinterpretation while introducing regressions.\n\n**Transition in:** `elaboration`: Fashion offers a discipline for changing material and uncertain demand while preserving identity. → Externally changing model behavior can force product reinterpretation while introducing regressions.\n\n**Order of paragraphs** (`problem_solution`): Start from stable-material planning, show simultaneous model effects, then derive the product decisions and upgrade risk; recommendations would be unmotivated before the changes are concrete.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p23 | context | Traditional software planning often assumes that the team can control core product behavior while its tools evolve. | reasoning: Languages, databases, cloud platforms, and UI frameworks evolve while teams usually control core product behavior. |  |\n| p24 | comparison | Model-powered products expose core behavior to material changes originating outside the team. |  | `contrast`: Traditional software planning often assumes that the team can control core product behavior while its tools evolve. → Model-powered products expose core behavior to material changes originating outside the team. |\n| p25 | example (list) | A model release can simultaneously remove workflow constraints and create product regressions. | example: Preserve the ten existing possibilities, including five steps becoming one call, unnecessary prompt chains, changed interfaces, new outputs, obsolete workarounds, new failures, and a failing golden workflow. | `elaboration`: Model-powered products expose core behavior to material changes originating outside the team. → A model release can simultaneously remove workflow constraints and create product regressions. |\n| p26 | cause_effect | Those simultaneous changes require product decisions about what to preserve, rebuild, retire, or explore. |  | `cause_effect`: A model release can simultaneously remove workflow constraints and create product regressions. → Those simultaneous changes require product decisions about what to preserve, rebuild, retire, or explore. |\n| p27 | example | A changed generation model can require a different video or image workflow. | example: Keep the conditional video/image examples: less need for an old editing flow, intent replacing manual layers, or new controls for less predictable output. | `example`: Those simultaneous changes require product decisions about what to preserve, rebuild, retire, or explore. → A changed generation model can require a different video or image workflow. |\n| p28 | analysis | Model upgrades can invalidate assumptions already embedded in customer behavior and product safeguards. | reasoning: Customers, prompts, and guardrails may depend on the previous model's quirks. | `elaboration`: A changed generation model can require a different video or image workflow. → Model upgrades can invalidate assumptions already embedded in customer behavior and product safeguards. |\n| p29 | transition | Repeated reinterpretation gives product development a rhythm resembling collections. |  | `conclusion_summary`: Model upgrades can invalidate assumptions already embedded in customer behavior and product safeguards. → Repeated reinterpretation gives product development a rhythm resembling collections. |\n\n### Short Seasons and Unstable Materials\n\n**Controlling idea** (`analysis`, id `short-seasons`): Short model cycles require a stable promise rather than certainty about implementation or customer response.\n\n**Advances the thesis** (S2, S4): Short model cycles require a stable promise rather than certainty about implementation or customer response.\n\n**Transition in:** `cause_effect`: Externally changing model behavior can force product reinterpretation while introducing regressions. → Short model cycles require a stable promise rather than certainty about implementation or customer response.\n\n**Order of paragraphs** (`problem_solution`): Contrast long planning assumptions with short model cycles before separating stable and changeable layers; the planning question follows from that separation.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p30 | context | Long planning horizons rely on the product's underlying material remaining stable enough for investment to pay back. | reasoning: Preserve the three-year platform bet, twelve-month roadmap, and multi-quarter architecture-plan examples. |  |\n| p31 | claim | Model-powered products weaken that stability assumption. |  | `contrast`: Long planning horizons rely on the product's underlying material remaining stable enough for investment to pay back. → Model-powered products weaken that stability assumption. |\n| p32 | explanation | Model capabilities and the expectations they enable can shift on shorter, uneven cycles. | reasoning: Preserve the article's existing weeks-scale changes in capability, competitors, and user expectations. | `elaboration`: Model-powered products weaken that stability assumption. → Model capabilities and the expectations they enable can shift on shorter, uneven cycles. |\n| p33 | recommendation | Teams can respond to instability by separating a stable promise from changeable product choices. | reasoning: The stable examples are promise, trust boundary, evaluation, identity, and architecture for swapping material; unstable examples include models, workflows, controls, and pricing assumptions. | `problem_solution`: Model capabilities and the expectations they enable can shift on shorter, uneven cycles. → Teams can respond to instability by separating a stable promise from changeable product choices. |\n| p34 | analysis | Capability becomes commercially relevant through customer fit and timing rather than technical improvement alone. |  | `elaboration`: Teams can respond to instability by separating a stable promise from changeable product choices. → Capability becomes commercially relevant through customer fit and timing rather than technical improvement alone. |\n| p35 | comparison | Model-powered planning must allow for uncertainty in both capability and customer response. | table: \\| Planning assumption \\| What changes in model-powered products \\| \\| --- \\| --- \\| \\| Capability improvements can be mapped directly to product value. \\| Better models create possibilities, but customer value depends on workflow fit, trust, control, timing, and willingness to change behavior. \\| \\| New model versions are straightforward upgrades. \\| They can improve general capability while regressing your golden scenarios, expert workflows, safety assumptions, latency, or cost profile. \\| \\| A product interface can stay stable while the underlying engine improves. \\| Sometimes the new model makes the old interface feel wrong, over-specified, or unnecessarily constrained. \\| \\| Benchmarks tell us which model should win. \\| Benchmarks help, but they do not predict taste, brand fit, expert workflows, or production adoption. \\| \\| Long-term roadmap certainty is a sign of maturity. \\| For model-powered products, maturity may mean short-cycle sensing, fast evaluation, and stable principles rather than fixed feature plans. \\| \\| Rebuilds are exceptional events. \\| Reinterpretation may become seasonal: expected, budgeted, evaluated, and archived. \\| | `elaboration`: Capability becomes commercially relevant through customer fit and timing rather than technical improvement alone. → Model-powered planning must allow for uncertainty in both capability and customer response. |\n| p36 | transition | The planning task is to decide what must stay stable and what should be easy to reinterpret. |  | `conclusion_summary`: Model-powered planning must allow for uncertainty in both capability and customer response. → The planning task is to decide what must stay stable and what should be easy to reinterpret. |\n\n### What This Adds to Modern Product Management\n\n**Controlling idea** (`explanation`, id `product-management`): Seasonal model work extends outcome-focused product management by making solution-material assumptions explicit.\n\n**Advances the thesis** (S2, S5): Seasonal model work extends outcome-focused product management by making solution-material assumptions explicit.\n\n**Transition in:** `elaboration`: Short model cycles require a stable promise rather than certainty about implementation or customer response. → Seasonal model work extends outcome-focused product management by making solution-material assumptions explicit.\n\n**Order of paragraphs** (`prerequisite_order`): Establish existing outcome discipline before adding model instability, then derive the editor role and product brief; reversing this would imply that good product management is a feature factory.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p37 | claim | Good product management already rejects feature-factory behavior. |  |  |\n| p38 | explanation | Outcome-focused product management measures customer and business value rather than feature output. | reasoning: The build-trap critique rejects feature output as success and emphasizes customer problems, business outcomes, discovery, and tested assumptions. | `elaboration`: Good product management already rejects feature-factory behavior. → Outcome-focused product management measures customer and business value rather than feature output. |\n| p39 | claim | Seasonal product work depends on that outcome discipline. |  | `conclusion_summary`: Outcome-focused product management measures customer and business value rather than feature output. → Seasonal product work depends on that outcome discipline. |\n| p40 | analysis | Model-powered products add instability in the solution material to uncertainty about customer problems. | reasoning: Both customer problems and the model material used to solve them can move. | `contrast`: Seasonal product work depends on that outcome discipline. → Model-powered products add instability in the solution material to uncertainty about customer problems. |\n| p41 | cause_effect | Product managers must manage the fit between changing capability and a coherent product promise. |  | `cause_effect`: Model-powered products add instability in the solution material to uncertainty about customer problems. → Product managers must manage the fit between changing capability and a coherent product promise. |\n| p42 | comparison | Existing product-management practices need explicit model assumptions and repeated evaluation. | table: \\| Modern product-management practice \\| Fashion-driven extension \\| \\| --- \\| --- \\| \\| Outcome orientation \\| Keep outcomes central, but make model assumptions explicit. A desired outcome may become easier, harder, cheaper, riskier, or obsolete when the model changes. \\| \\| Continuous discovery \\| Continue customer discovery, but add material discovery: model scouting, capability probes, cost/latency checks, failure-mode exploration, and competitor pattern watching. \\| \\| Product strategy \\| Preserve the product promise, but treat some workflows, interfaces, and value propositions as seasonal interpretations of that promise. \\| \\| Roadmapping \\| Use the roadmap as a portfolio of stable commitments, seasonal bets, learning goals, and assumptions that may expire when the model changes. \\| \\| Product briefs and specs \\| Describe value hypotheses, evaluation criteria, stop conditions, customer evidence, model assumptions, and what must be preserved, rebuilt, retired, or explored. \\| \\| Prioritization \\| Go beyond impact and effort. Ask what the new material makes obsolete, what creates customer value now, what should be delayed until the material stabilizes, and what must be tested before commitment. \\| \\| Launch and measurement \\| Treat launch as one fitting session in a longer seasonal cycle. Evaluate before, during, and after release: model quality, customer value, business value, trust, safety, and brand fit. \\| | `elaboration`: Product managers must manage the fit between changing capability and a coherent product promise. → Existing product-management practices need explicit model assumptions and repeated evaluation. |\n| p43 | synthesis | The product manager becomes an editor of both outcomes and changing material. |  | `conclusion_summary`: Existing product-management practices need explicit model assumptions and repeated evaluation. → The product manager becomes an editor of both outcomes and changing material. |\n| p44 | explanation | Editing means selecting coherent capability changes rather than shipping every possibility. | reasoning: The existing questions select among promise, confusing capability, obsolete workflow, expert control, weak commercial demos, and newly possible outcomes. | `elaboration`: The product manager becomes an editor of both outcomes and changing material. → Editing means selecting coherent capability changes rather than shipping every possibility. |\n| p45 | recommendation (list) | A seasonal product brief makes a model-driven change a testable customer-value bet. | reasoning: Preserve the eight brief elements: material change, customer behavior, obsolete assumption, preserved promise, evaluation set, stopping failures, business metric, and preserve/rebuild/retire/explore decision. | `example`: Editing means selecting coherent capability changes rather than shipping every possibility. → A seasonal product brief makes a model-driven change a testable customer-value bet. |\n| p46 | synthesis | A spec connects outcome-focused management with disciplined rebuilding. |  | `conclusion_summary`: A seasonal product brief makes a model-driven change a testable customer-value bet. → A spec connects outcome-focused management with disciplined rebuilding. |\n\n### What Fashion-Driven Software Development Means\n\n**Controlling idea** (`process`, id `operating-model`): A repeated scouting, evaluation, and selective-release loop allows model reinterpretation without surrendering product identity.\n\n**Advances the thesis** (S4, S5): A repeated scouting, evaluation, and selective-release loop allows model reinterpretation without surrendering product identity.\n\n**Transition in:** `elaboration`: Seasonal model work extends outcome-focused product management by making solution-material assumptions explicit. → A repeated scouting, evaluation, and selective-release loop allows model reinterpretation without surrendering product identity.\n\n**Order of paragraphs** (`large_to_small`): Define the operating model and its limits before giving its concrete loop; the sequence would otherwise look like an instruction to chase releases.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p47 | definition | Fashion-driven development is an operating model for products built on fast-moving AI capability. | reasoning: Carry the preceding product-management extensions and seasonal product brief into a repeatable operating rhythm, retaining the operating-model claim. |  |\n| p48 | refutation | The operating model does not require chasing every trend. |  | `contrast`: Fashion-driven development is an operating model for products built on fast-moving AI capability. → The operating model does not require chasing every trend. |\n| p49 | refutation | The operating model does not justify rebuilding out of boredom. |  | `additional_support`: The operating model does not require chasing every trend. → The operating model does not justify rebuilding out of boredom. |\n| p50 | refutation | The operating model retains reliability, architecture, and customer trust. |  | `additional_support`: The operating model does not justify rebuilding out of boredom. → The operating model retains reliability, architecture, and customer trust. |\n| p51 | explanation | Frequent reinterpretation must preserve a durable product identity. | reasoning: Workflows, interfaces, evaluations, and value propositions may be redesigned around model changes while identity endures. | `conclusion_summary`: The operating model retains reliability, architecture, and customer trust. → Frequent reinterpretation must preserve a durable product identity. |\n| p52 | explanation | Seasonal timing follows unstable material rather than a borrowed fashion calendar. |  | `elaboration`: Frequent reinterpretation must preserve a durable product identity. → Seasonal timing follows unstable material rather than a borrowed fashion calendar. |\n| p53 | process (list) | The seasonal loop moves from scouting through customer evaluation to selective release and archived learning. | reasoning: Preserve all eight ordered steps: Scout the material; Read the culture; Design a collection; Prototype the silhouette; Fit on real users; lishing fit. | example: Keep the five quoted fad-driven rationalizations about immediate adoption, competitors, impressive demos, assumed user understanding, and evaluation after launch. | `example`: Confusing seasonal change with novelty produces an unhealthy operating model. → Novelty-driven teams commit to new models before establishing fit. |\n| p57 | analysis | Those commitments amount to hype chasing. |  | `conclusion_summary`: Novelty-driven teams commit to new models before establishing fit. → Those commitments amount to hype chasing. |\n| p58 | explanation | Disciplined fashion selects within customer, identity, and production constraints. | reasoning: A fashion house edits within customer, brand, fit, and production constraints. | `contrast`: Those commitments amount to hype chasing. → Disciplined fashion selects within customer, identity, and production constraints. |\n| p59 | comparison | AI teams can distinguish seasonal product judgment from fad chasing through the decisions they make. | table: \\| Fad-driven AI product work \\| Fashion-driven AI product work \\| \\| --- \\| --- \\| \\| Integrates every new model because it is new. \\| Studies whether the model changes the product's material possibilities. \\| \\| Ships demos as product. \\| Uses demos to discover possible new silhouettes, then tests fit. \\| \\| Optimizes for announcement value. \\| Optimizes for customer value and business value. \\| \\| Rebuilds without preserving product identity. \\| Changes the garment while preserving the promise customers trust. \\| \\| Treats evaluation as cleanup. \\| Treats evaluation as design infrastructure. \\| \\| Measures \"AI usage\". \\| Measures whether users achieve better outcomes. \\| | `similarity`: Disciplined fashion selects within customer, identity, and production constraints. → AI teams can distinguish seasonal product judgment from fad chasing through the decisions they make. |\n| p60 | synthesis | Judgment separates the two operating models. |  | `conclusion_summary`: AI teams can distinguish seasonal product judgment from fad chasing through the decisions they make. → Judgment separates the two operating models. |\n\n### Evaluation Is the Fitting Room\n\n**Controlling idea** (`explanation`, id `evaluation-fitting-room`): Evaluation must establish contextual customer and business value as well as correct model behavior.\n\n**Advances the thesis** (S3): Evaluation must establish contextual customer and business value as well as correct model behavior.\n\n**Transition in:** `problem_solution`: Novelty becomes useful product change only when judgment imposes customer and identity constraints. → Evaluation must establish contextual customer and business value as well as correct model behavior.\n\n**Order of paragraphs** (`large_to_small`): Expand the testing question before explaining why evaluation gains importance and naming its layers; a layer inventory without the product question would read as technical cleanup.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p61 | context | Traditional tests often check whether the system satisfies its specification. |  |  |\n| p62 | explanation (list) | AI product evaluation must also establish contextual quality, regressions, trust, and value. | reasoning: Preserve the eleven evaluation questions, including old workflow breakage, control, consistency, safety, promise, and business value. | `contrast`: Traditional tests often check whether the system satisfies its specification. → AI product evaluation must also establish contextual quality, regressions, trust, and value. |\n| p63 | cause_effect | Faster rebuilding makes deciding whether the new experience deserves to exist more important. | reasoning: Cheaper implementation and faster model change increase the number of possible rebuilds. | `cause_effect`: AI product evaluation must also establish contextual quality, regressions, trust, and value. → Faster rebuilding makes deciding whether the new experience deserves to exist more important. |\n| p64 | comparison | Fashion's fitting and commercial feedback illustrate why an impressive demonstration is insufficient. | analogy: Fitting room, quality control, buyer feedback, sales, returns, and brand review all test the garment beyond its runway appearance. | `example`: Faster rebuilding makes deciding whether the new experience deserves to exist more important. → Fashion's fitting and commercial feedback illustrate why an impressive demonstration is insufficient. |\n| p65 | comparison | AI products need complementary technical, customer, commercial, and trust evaluations. | table: \\| Evaluation layer \\| What it checks \\| \\| --- \\| --- \\| \\| Technical correctness \\| Does the workflow run, return outputs, preserve data, handle errors, and meet latency/cost constraints? \\| \\| Model quality \\| Are generated outputs accurate, coherent, useful, controllable, and consistent enough? \\| \\| Regression \\| Did the new model break important old use cases? \\| \\| Comparative quality \\| Is the new model or workflow materially better than the current one? \\| \\| Customer value \\| Does it help users complete a real job faster, better, cheaper, or with more creative range? \\| \\| Business value \\| Does it improve conversion, retention, expansion, margin, differentiation, or strategic positioning? \\| \\| Trust and safety \\| Does it create unacceptable risk, ambiguity, surprise, or misuse? \\| \\| Brand fit \\| Does the experience still feel like the product customers chose? \\|; figure: Preserve assets/images/fashion-driven-software-development/evaluation-fitting-room.jpeg and its original caption: Figure 4: Evaluation is the fitting room where model novelty is tested against customer value, business value, trust, and brand fit. | `similarity`: Fashion's fitting and commercial feedback illustrate why an impressive demonstration is insufficient. → AI products need complementary technical, customer, commercial, and trust evaluations. |\n| p66 | recommendation | A rebuild should have explicit conditions under which it is worth making. |  | `conclusion_summary`: AI products need complementary technical, customer, commercial, and trust evaluations. → A rebuild should have explicit conditions under which it is worth making. |\n\n### The Evaluation Suite Becomes a Strategic Asset\n\n**Controlling idea** (`recommendation`, id `evaluation-suite`): A shared evaluation suite preserves the evidence needed to govern repeated model changes.\n\n**Advances the thesis** (S3, S5): A shared evaluation suite preserves the evidence needed to govern repeated model changes.\n\n**Transition in:** `elaboration`: Evaluation must establish contextual customer and business value as well as correct model behavior. → A shared evaluation suite preserves the evidence needed to govern repeated model changes.\n\n**Order of paragraphs** (`large_to_small`): Move from evaluation as infrastructure to ownership, artifacts, and the spec that fixes a decision; the artifact list needs the shared product purpose first.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p67 | claim | Evaluation suites become enduring product infrastructure when the implementation changes repeatedly. |  |  |\n| p68 | recommendation | The evidence needed for evaluation requires ownership beyond engineering alone. | reasoning: Product, design, engineering, data, support, and sometimes legal or trust teams contribute metrics, review, customer evidence, and business signals. | `elaboration`: Evaluation suites become enduring product infrastructure when the implementation changes repeatedly. → The evidence needed for evaluation requires ownership beyond engineering alone. |\n| p69 | example (list) | An evaluation suite preserves representative jobs, known failures, comparisons, and decision evidence. | example: Preserve all nine evaluation artifacts and their definitions, especially golden scenarios as representative user jobs and comparisons between old and new models/workflows. | `example`: The evidence needed for evaluation requires ownership beyond engineering alone. → An evaluation suite preserves representative jobs, known failures, comparisons, and decision evidence. |\n| p70 | explanation | A spec states the value and stop conditions before a rebuild begins. | reasoning: The spec fixes intent, expected customer value, non-goals, evaluation criteria, and stop conditions before rebuilding. | `elaboration`: An evaluation suite preserves representative jobs, known failures, comparisons, and decision evidence. → A spec states the value and stop conditions before a rebuild begins. |\n| p71 | synthesis | Evaluation distinguishes disciplined reinterpretation from mood-driven development. |  | `conclusion_summary`: A spec states the value and stop conditions before a rebuild begins. → Evaluation distinguishes disciplined reinterpretation from mood-driven development. |\n\n### Customer Value Beats Model Novelty\n\n**Controlling idea** (`analysis`, id `customer-value`): Customer observation determines whether apparent model gains improve this product.\n\n**Advances the thesis** (S2, S3): Customer observation determines whether apparent model gains improve this product.\n\n**Transition in:** `elaboration`: A shared evaluation suite preserves the evidence needed to govern repeated model changes. → Customer observation determines whether apparent model gains improve this product.\n\n**Order of paragraphs** (`problem_solution`): Question the unqualified word better, show concrete regressions, replace model questions with product questions, then prescribe observation; the corrective action needs the demonstrated gap.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p72 | counterargument | Calling a model better is an incomplete product judgment. |  |  |\n| p73 xcellent model can be unsuitable for a particular product just as a fabric can be wrong for a garment. |\n| p80 | comparison | Product-value questions test whether model gains improve a customer's actual work. | table: \\| Model question \\| Product-value question \\| \\| --- \\| --- \\| \\| Is the model more capable? \\| Does it improve the user's job to be done? \\| \\| Is the output more impressive? \\| Does the user trust, control, and use it? \\| \\| Is the demo better? \\| Does production usage improve? \\| \\| Can we remove steps? \\| Did we remove useful control or only friction? \\| \\| Can we generate more? \\| Did we help the user decide, edit, publish, or sell better? \\| \\| Is the model cheaper? \\| Does the unit economics improvement create a better product or only better margin? \\| | `elaboration`: An excellent model can be unsuitable for a particular product just as a fabric can be wrong for a garment. → Product-value questions test whether model gains improve a customer's actual work. |\n| p81 | cause_effect | Fast model progress makes direct customer evidence necessary to correct internal fascination with capability. | reasoning: Teams can admire model capabilities while losing contact with what customers need. | `cause_effect`: Product-value questions test whether model gains improve a customer's actual work. → Fast model progress makes direct customer evidence necessary to correct internal fascination with capability. |\n| p82 | recommendation | Observing customers complements analytics by exposing what users actually keep, reject, and use. | reasoning: Observe what heavy users kept, edited, rejected, exported, paid for, shared, or abandoned; retain analytics as a complement. | `problem_solution`: Fast model progress makes direct customer evidence necessary to correct internal fascination with capability. → Observing customers complements analytics by exposing what users actually keep, reject, and use. |\n\n### What Should Stay Stable\n\n**Controlling idea** (`recommendation`, id `stable-core`): A stable customer promise lets a team reinterpret model-dependent workflows without losing product identity.\n\n**Advances the thesis** (S4): A stable customer promise lets a team reinterpret model-dependent workflows without losing product identity.\n\n**Transition in:** `contrast`: Customer observation determines whether apparent model gains improve this product. → A stable customer promise lets a team reinterpret model-dependent workflows without losing product identity.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): Use the continuity analogy to identify invariants before explaining how leaders preserve them; the prescription depends on knowing what continuity means.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p83 | claim | Seasonal change does not require every part of a product to change. |  |  |\n| p84 | comparison | Recognizable continuity explains why customers trust products across changing collections. | analogy: Customers can value trust, aspiration, fit, taste, status, utility, and meaning despite changing collections. | `example`: Seasonal change does not require every part of a product to change. → Recognizable continuity explains why customers trust products across changing collections. |\n| p85 | claim | AI products likewise need a stable core. |  | `similarity`: Recognizable continuity explains why customers trust products across changing collections. → AI products likewise need a stable core. |\n| p86 | recommendation (list) | The stable core includes the customer's job, product promise, quality, trust, commitments, economics, and retained learning. | reasoning: Preserve all nine stable-core commitments, from customer job and promise through privacy, safety, economics, and learning archive. | `elaboration`: AI products likewise need a stable core. → The stable core includes the customer's job, product promise, quality, trust, commitments, economics, and retained learning. |\n| p87 | cause_effect | A stable core makes rapid reinterpretation possible without losing product identity. |  | `cause_effect`: The stable core includes the customer's job, product promise, quality, trust, commitments, economics, and retained learning. → A stable core makes rapid reinterpretation possible without losing product identity. |\n| p88 | analysis | Agency, judgment, and persuasion help leaders explore change while preserving the product's purpose. | reasoning: Keep [AI Will Do the Heavy Lifting. You Still Need to Lead](prepare-for-ai-future.html) and the existing explanation: agency explores, judgment selects, and persuasion aligns teams around valuable rebuilding. | `elaboration`: A stable core makes rapid reinterpretation possible without losing product identity. → Agency, judgment, and persuasion help leaders explore change while preserving the product's purpose. |\n\n### How Teams Should Work\n\n**Controlling idea** (`process`, id `team-work`): Team routines must connect model scouting to evaluated, coherent product changes and retained learning.\n\n**Advances the thesis** (S5): Team routines must connect model scouting to evaluated, coherent product changes and retained learning.\n\n**Transition in:** `cause_effect`: A stable customer promise lets a team reinterpret model-dependent workflows without losing product identity. → Team routines must connect model scouting to evaluated, coherent product changes and retained learning.\n\n**Order of paragraphs** (`chronological`): Follow the work from sensing to planning, specification, coordinated rebuilding, evaluation, and archived learning, then explain the judgment used throughout; reshuffling would obscure where evidence enters decisions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p89 | claim | A seasonal operating model needs corresponding team routines. |  |  |\n| p90 | recommendation | A ted changes into a coherent customer experience. → Fast rebuild paths make controlled experiments and retirement feasible. |\n| p95 | recommendation | Evaluation before commitment disciplines enthusiasm for a new model. |  | `sequence`: Fast rebuild paths make controlled experiments and retirement feasible. → Evaluation before commitment disciplines enthusiasm for a new model. |\n| p96 | recommendation | Archives preserve the learning needed for the next cycle. | reasoning: Prompts, outputs, failures, feedback, decisions, and benchmarks remain in the archive. | `sequence`: Evaluation before commitment disciplines enthusiasm for a new model. → Archives preserve the learning needed for the next cycle. |\n| p97 | recommendation | Taste helps teams decide what qualitative evidence to collect and which trade-offs matter. | reasoning: Language, images, video, recommendations, workflows, and decisions have qualitative effects on users. | `additional_support`: Archives preserve the learning needed for the next cycle. → Taste helps teams decide what qualitative evidence to collect and which trade-offs matter. |\n\n### Practical Principles\n\n**Controlling idea** (`recommendation`, id `practical-principles`): Decision rules keep exploration, commitment, evaluation, and retirement aligned with customer value.\n\n**Advances the thesis** (S3, S4, S5): Decision rules keep exploration, commitment, evaluation, and retirement aligned with customer value.\n\n**Transition in:** `elaboration`: Team routines must connect model scouting to evaluated, coherent product changes and retained learning. → Decision rules keep exploration, commitment, evaluation, and retirement aligned with customer value.\n\n**Order of paragraphs** (`grouping`): Group exploration and planning rules before assurance and accountability, ending with retirement; these are reminders applied to the earlier routine, not another claimed chronological process.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p98 | transition | The team routines can be expressed as practical decision rules for AI-powered products. |  |  |\n| p99 | recommendation | Scouting a model must remain separate from committing the product to it. |  | `elaboration`: The team routines can be expressed as practical decision rules for AI-powered products. → Scouting a model must remain separate from committing the product to it. |\n| p100 | recommendation | The value hypothesis should precede implementation. | reasoning: The original questions concern customer behavior, business metrics, removed pain, and new risk. | `sequence`: Scouting a model must remain separate from committing the product to it. → The value hypothesis should precede implementation. |\n| p101 | recommendation | A seasonal bet contract fixes the outcome, preserved promise, evaluation, and release decision criteria. | reasoning: The contract names material change, outcome, preserved promise, suite, and criteria to ship, delay, retire, or revert. | `elaboration`: The value hypothesis should precede implementation. → A seasonal bet contract fixes the outcome, preserved promise, evaluation, and release decision criteria. |\n| p102 | recommendation | Planning should label stable assumptions and seasonal bets. |  | `additional_support`: A seasonal bet contract fixes the outcome, preserved promise, evaluation, and release decision criteria. → Planning should label stable assumptions and seasonal bets. |\n| p103 | recommendation | A stable product promise prevents repeated releases from becoming strategic drift. |  | `emphasis`: Planning should label stable assumptions and seasonal bets. → A stable product promise prevents repeated releases from becoming strategic drift. |\n| p104 | recommendation | Evaluation artifacts should be deliberately versioned as product assets. |  | `additional_support`: A stable product promise prevents repeated releases from becoming strategic drift. → Evaluation artifacts should be deliberately versioned as product assets. |\n| p105 | recommendation | Old user jobs must be tested against new model behavior. |  | `elaboration`: Evaluation artifacts should be deliberately versioned as product assets. → Old user jobs must be tested against new model behavior. |\n| p106 | recommendation | Switching models should be treated as a migration with regression checks. | reasoning: Golden scenarios, expert workflows, safety, latency, cost, and visible behavior are checked before switching. | `elaboration`: Old user jobs must be tested against new model behavior. → Switching models should be treated as a migration with regression checks. |\n| p107 | recommendation | Business and customer outcomes provide more meaningful measures than the amount of AI used. | reasoning: Retain activation, retention, margin, trust, and customer outcomes as meaningful measures. | `additional_support`: Switching models should be treated as a migration with regression checks. → Business and customer outcomes provide more meaningful measures than the amount of AI used. |\n| p108 | recommendation | People retain accountability for what the product stands for. |  | `additional_support`: Business and customer outcomes provide more meaningful measures than the amount of AI used. → People retain accountability for what the product stands for. |\n| p109 | recommendation | Retiring a workflow requires care for customers and explicit communication about changed trade-offs. |  | `sequence`: People retain accountability for what the product stands for. → Retiring a workflow requires care for customers and explicit communication about changed trade-offs. |\n\n### Anti-Patterns\n\n**Controlling idea** (`example`, id `anti-patterns`): Recurring failure patterns reveal when seasonal work loses its value and evidence discipline.\n\n**Advances the thesis** (S2, S3, S4, S5): Recurring failure patterns reveal when seasonal work loses its value and evidence discipline.\n\n**Transition in:** `contrast`: Decision rules keep exploration, commitment, evaluation, and retirement aligned with customer value. → Recurring failure patterns reveal when seasonal work loses its value and evidence discipline.\n\n**Order of paragraphs** (`grouping`): Contrast the preceding rules with demo, planning, validation, identity, and outcome failures; placing warnings before the positive model would force readers to infer the missing standard.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p110 | transition | The practical rules have recognizable failure patterns teams can watch for. |  |  |\n| p111 | example | Optimizing for demonstrations leaves real users with unfinished or unsuitable workflows. | example: Demos and launch excitement can conceal incomplete, uncontrollable, or commercially weak production workflows. | `example`: The practical rules have recognizable failure patterns teams can watch for. → Optimizing for demonstrations leaves real users with unfinished or unsuitable workflows. |\n| p112 | example | Treating every model release as urgent erodes the roadmap and product identity. | example: Every model release triggers urgent rewrites and a reactive roadmap. | `additional_support`: Optimizing for demonstrations leaves real users with unfinished or unsuitable workflows. → Treating every model release as urgent erodes the roadmap and product identity. |\n| p113 | example | Feature-factory relapse substitutes more output for reconsidered customer outcomes. | example: More roadmap items, tickets, and launches replace reconsideration of outcomes and promises. | `additional_support`: Treating every model release as urgent erodes the roadmap and product identity. → Feature-factory relapse substitutes more output for reconsidered customer outcomes. |\n| p114 | example | False stability makes the product depend on model assumptions that can expire. | example: Preserve the Six months later example of expired model-behavior, cost, workflow, or expectation assumptions. | `additional_support`: Feature-factory relapse substitutes more output for reconsidered customer outcomes. → False stability makes the product depend on model assumptions that can expire. |\n| p115 | example | Benchmark blindness misses regressions in the specific product. | example: The upgraded model performs worse on important product prompts, customers, workflows, or economics. | `additional_support`: False stability makes the product depend on model assumptions that can expire. → Benchmark blindness misses regressions in the specific product. |\n| p116 | example | Evaluation theater selects flattering examples instead of testing failures and value. | example: A few flattering examples omit failures, edge cases, old workflows, and business impact. | `additional_support`: Benchmark blindness misses regressions in the specific product. → Evaluation theater selects flattering examples instead of testing failures and value. |\n| p117 | example | Fashionable architecture cannot compensate for weak product value. | example: The latest model or agent framework makes the architecture look modern while product value remains weak. | `additional_support`: Evaluation theater selects flattering examples instead of testing failures and value. → Fashionable architecture cannot compensate for weak product value. |\n| p118 | example | Customer amnesia discards useful controls that existing users value. | example: Useful controls are replaced with magical automation and the loss is presented as simplicity. | `additional_support`: Fashionable architecture cannot compensate for weak product value. → Customer amnesia discards useful controls that existing users value. |\n| p119 | example | Implementation pride mistakes rebuilding speed for meaningful impact. | example: The team celebrates rebuild speed without asking whether the rebuild mattered. | `additional_support`: Customer amnesia discards useful controls that existing users value. → Implementation pride mistakes rebuilding speed for meaningful impact. |\n\n### Questions to Consider\n\n**Controlling idea** (`recommendation`, id `questions`): Readers can test whether their own model-driven decisions preserve customer value.\n\n**Advances the thesis** (S3, S4, S5): Readers can test whether their own model-driven decisions preserve customer value.\n\n**Transition in:** `example`: Recurring failure patterns reveal when seasonal work loses its value and evidence discipline. → Readers can test whether their own model-driven decisions preserve customer value.\n\n**Order of paragraphs** (`grouping`): Apply the preceding principles and failure patterns before the final synthesis; leaving the questions after references would break the close and hide their role in applying the argument.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p120 | recommendation (list) | Teams can use the questions to examine their own product's changing assumptions, evaluation, and stable promise. | reasoning: Preserve the complete twelve-question list and its lead-in without changing its wording. |  |\n\n## Conclusion: The Real Shift\n\n**Synthesis:** A stable promise and a changing implementation can coexist when each model-driven change is evaluated as a customer-value bet.\n\n**So what:** Fast rebuilding matters only when teams can tell whether the resulting product still serves its users.\n\n**Callback:** The opening question distinguishing a better development tool from changed product material. Return first to faster software production, then show how repeated evaluation allows the customer promise to survive changing workflows; the product change question now has a decision discipline.\n\n**Takeaway** (`course_of_action`): Treat model upgrades as evaluated product changes, preserving user jobs and trust while testing which new workflows deserve release.\n\n**Hand-off** to [From Prompting to Intent: The Leadership Ladder for Working with AI](leadership-ladder.html): `cause_effect`: Product change needs deliberate decisions about value, trust, and what should remain stable. → The leadership language, delegation boundaries, and personal capabilities required to make and carry those decisions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p121 | synthesis | Faster software production is only one consequence of generative AI. |  |  |\n| p122 | synthesis | Changing model material extends outcome-focused management across the product lifecycle. | reasoning: The body combines model instability, outcome-focused planning, customer evidence, and a stable promise. | `contrast`: Faster software production is only one consequence of generative AI. → Changing model material extends outcome-focused management across the product lifecycle. |\n| p123 | synthesis | Fashion supplies a vocabulary for judging fit under unstable material and limited predictability. | reasoning: Preserve the existing cadence of speed, novelty, stability, prediction, taste, fit, timing, quality, archive, and commercial response. | `elaboration`: Changing model material extends outcome-focused management across the product lifecycle. → Fashion supplies a vocabulary for judging fit under unstable material and limited predictability. |\n| p124 | synthesis | Evaluation connects a stable customer promise to changing implementation. |  | `emphasis`: Fashion supplies a vocabulary for judging fit under unstable material and limited predictability. → Evaluation connects a stable customer promise to changing implementation. |\n| p125 | analysis | The scarce capability is deciding whether a rebuilt experience creates value for its users. | reasoning: Repeated rebuilding reduces implementation scarcity without answering whether users benefit. | `cause_effect`: Evaluation connects a stable customer promise to changing implementation. → The scarce capability is deciding whether a rebuilt experience creates value for its users. |\n| p126 | recommendation | Teams should treat model upgrades as evaluated product changes that preserve customer jobs and trust. |  | `conclusion_summary`: The scarce capability is deciding whether a rebuilt experience creates value for its users. → Teams should treat model upgrades as evaluated product changes that preserve customer jobs and trust. |\n| p127 | transition | Deciding what to change and what to preserve requires explicit human intent, delegation boundaries, and accountable leadership. | reasoning: Use [From Prompting to Intent: The Leadership Ladder for Working with AI](leadership-ladder.html) as the next step: making the intent, permitted action, review, and human responsibility behind these product decisions explicit. | `cause_effect`: Teams should treat model upgrades as evaluated product changes that preserve customer jobs and trust. → Deciding what to change and what to preserve requires explicit human intent, delegation boundaries, and accountable leadership. |\n\n## Non-goals\n\n- A biographical article about Samuel Beek, VEED, or Schematik.\n- A detailed recap of the Engineering Excellence meetup.\n- A fashion-industry history lesson.\n- A technical tutorial for model evaluation frameworks.\n- A claim that every software team should rebuild continuously.\n- A claim that fashion-driven development replaces durable architecture, testing, reliability, or product strategy.\n\n## Modalities\n\nArticle, summary, dialog, comics\n\n## Decision log\n\n- **2026-11-12** — Round 1 identified one corroborated restart at the operating-model opening and one minor repeated baseline at the seasons opening. Revise p47 to carry the product-management extensions into their repeatable rhythm, and p30 to foreground the planning consequence. Retain all 127 units, section headings and order, copied criteria, named sources, figures and planning durations.\n- **2026-11-12** — Implemented the flow
