    <meta name="description" content="We keep calling AI an accelerator — a thing that makes everything faster. But an accelerator only adds speed. AI multiplies. It takes whatever you already have — a skill, a process, a codebase, a goal — and makes it bigger. And a multiplier works on whatever sign you feed it. Point it at strength and it compounds the strength. Point it at a mess and it compounds the mess, faster and more expensively. The work is never the multiplier. It is the number you feed it.">

mprove or worsen task speed and correctness while increasing downstream review and maintenance work, so teams should measure those effects and address delivery bottlenecks before scaling generation.\n\n**Disputed by:** The view that wider access to a more capable coding model will translate individual speed gains into broadly similar delivery and cost gains across teams.\n\n**So what:** Leaders need measured task and system outcomes to decide where to invest; otherwise they can expand review queues and maintenance bills while celebrating faster generation.\n\n**How and why:** Capability varies across tasks, ownership costs sit downstream of generation, and a faster non-bottleneck cannot increase throughput beyond the stage that limits the delivery chain.\n\n**Supporting claims**\n\n- **S1** — The amplifier image is useful for asking how context changes an AI outcome, but it is not a universal arithmetic law.\n- **S2** — Task studies show why actual time, output, and correctness must be measured separately from the feeling of speed.\n- **S3** — Faster generation can add ownership and coordination work at the stages that constrain delivery.\n- **S4** — Standards and organizational foundations shape whether more generation becomes reliable work.\n- **S5** — Teams should strengthen inputs and measure the limiting stages before expanding AI use.\n\n## Role in the part\n\nExplains why adding generation to the surrounding system can increase strain unless teams address its inputs and limiting stages. Supports S3 of part `ai-software-development`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in wrong-word, multiplier, metaphor-limits: establish the image and bound it before applying it; `small_to_large` in speed, cost, bottleneck, team-gap, quality, organizations: task results lead into lifecycle, delivery, team, and organizational conditions; `assertion_evidence_reasoning` in speed, cost, bottleneck, team-gap: claims, existing evidence, interpre -gap.\n- Explain how standards and the operating model shape the result. *Kept in:* quality, organizations.\n- Turn the argument into Monday moves and questions for a real team initiative. *Kept in:* monday, questions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | The familiar promise that buying AI tools makes all work faster is the assumption this essay tests. | quotation: > **KEY POINTS:** > > * **\"Accelerator\" is the wrong word.** An accelerator only adds speed, always in the same direction. AI doesn't add — it *multiplies*. It takes whatever you already have and makes it bigger: a skill, a process, a codebase, a goal. > * **A multiplier keeps the sign of its input.** Point AI at strength and it compounds the strength. Point it at a mess — a brittle process, a confused goal, no standards — and it compounds the mess, faster and more expensively. In separate studies, junior developers completed up to 39% more tasks with AI, while experienced developers on familiar codebases took measurably *longer*. > * **So the leverage is never in the AI — it is in what, and which part, you amplify.** An amplifier acts on one part, not the whole: speed up the fast stage of an unbalanced system and you just jam the bottleneck behind it. That is why individuals feel faster while their teams often don't. The durable work isn't a bigger multiplier; it's fixing the input and widening the slowest part.; scenario: Buy AI tools, hand them out, and expect the whole organization to speed up. |  |\n| p02 | analysis | The accelerator story makes AI strategy look like a purchasing decision. | analogy: An accelerator pedal whose only decision is how hard to press. | `cause_effect`: The familiar promise that buying AI tools makes all work faster is the assumption this essay tests. → The accelerator story makes AI strategy look like a purchasing decision. |\n| p03 | claim | AI can improve or worsen work through the syste hat a human-plus-tool system brings to the work.\n\n**Advances the thesis** (S1): The gain-times-input mnemonic directs attention to what a human-plus-tool system brings to the work.\n\n**Transition in:** `elaboration`: The accelerator promise hides the possibility that the same class of tool can worsen results in a different context. → The gain-times-input mnemonic directs attention to what a human-plus-tool system brings to the work.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): Introduce the mnemonic, explain its restricted arithmetic, show what to inspect, and use Engelbart and Jobs as lineage before turning to limits. Removing the restriction before the equation would invite readers to treat it as a quantitative law.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | explanation | A short arithmetic mnemonic can make the amplifier image memorable without making it a performance formula. |  |  |\n| p11 | definition | The mnemonic represents output as gain multiplied by input. | analogy: output = gain × input | `elaboration`: A short arithmetic mnemonic can make the amplifier image memorable without making it a performance formula. → The mnemonic represents output as gain multiplied by input. |\n| p12 | explanation | Within that simplified image, a positive gain scales either a positive or a negative input. | analogy: The existing contrast between output = input + speed and output = gain × input. | `elaboration`: The mnemonic represents output as gain multiplied by input. → Within that simplified image, a positive gain scales either a positive or a negative input. |\n| p13 | analysis | The useful prompt is to inspect whether the supplied skill, process, codebase, or goal is worth increasing. | example: Existing examples of strong skills, clear processes, clean codebases, confused goals, and brittle processes.; figure: Figure 1: multiplier-diagram.jpeg; preserve image, alt text, and caption e e work. → AI can add new capability and its effects vary by task, so the amplifier image is a bounded guide rather than a constant multiplier.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p17 | comparison | The amplifier image helps examine inputs, but AI can add new capability and its task effects cannot be inferred from positive or negative input labels. |  |  |\n| p18 | synthesis | The image's question about inputs becomes an empirical comparison of time, completed output, and correctness with versus without AI. |  | `conclusion_summary`: The amplifier image helps examine inputs, but AI can add new capability and its task effects cannot be inferred from positive or negative input labels. → The image's question about inputs becomes an empirical comparison of time, completed output, and correctness with versus without AI. |\n\n### It Amplifies Speed (in Both Directions)\n\n**Controlling idea** (`evidence`, id `speed`): Studies of different users and tasks show that perceived speed, measured time, task output, and correctness must be distinguished.\n\n**Advances the thesis** (S2): Studies of different users and tasks show that perceived speed, measured time, task output, and correctness must be distinguished.\n\n**Transition in:** `example`: The limits of the image leave an empirical question: how do time, completed output, and correctness differ with versus without AI? → Studies of different users and tasks show that perceived speed, measured time, task output, and correctness must be distinguished.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): Start with the speed promise, show a measured slowdown despite a perceived speedup, contrast reported gains, then explain task fit and draw a measurement lesson. The limits section establishes the empirical comparison; the studies show why perception alone is unreliable. Treating them as one scale or as verification of input-sign preservation would defeat the bounded image.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p19 | claim | Whether AI makes work faster must be measured in the setting where it is used; the studies do not verify the multiplication mnemonic. |  |  |\n| p20 | evidence | The METR result shows why a felt speedup cannot substitute for measuring task completion. | statistic: Mid-2025 randomized controlled trial: sixteen experienced open-source developers on their own large, mature repositories were 19% slower with AI while estimating about 20% faster. | `example`: Whether AI makes work faster must be measured in the setting where it is used; the studies do not verify the multiplication mnemonic. → The METR result shows why a felt speedup cannot substitute for measuring task completion. |\n| p21 | evidence | The cited Copilot field experiments show that benefits can differ between junior and senior developers. | statistic: GitHub Copilot field experiments at Microsoft and Accenture: juniors and recent hires completed 27–39% more tasks; the most senior developers gained on the order of 8–13%. | `contrast`: The METR result shows why a felt speedup cannot substitute for measuring task completion. → The cited Copilot field experiments show that benefits can differ between junior and senior developers. |\n| p22 | evidence | The jagged frontier describes task-dependent competence, including cases where AI lowers correctness. | statistic: Harvard and Boston Consulting Group, 2023: on eighteen inside-frontier tasks, AI users completed 12.2% more tasks, 25.1% faster, at higher quality; on an outside-frontier task they were 19% less likely to reach the correct answer.; table: Preserve the accelerator-story / studies table and every reported percentage, while labeling the Copilot result as completed tasks, METR as 19% slower in a separate study rather than an unlabeled −19%, and the frontier results as completed tasks versus likelihood of a correct answer.; table: Figure 2: replace the displayed speed-spectrum.jpeg with an independent-study table headed Study and setting / Measure / Reported result. Use only the existing results: METR experienced developers on familiar repositories, task completion 19% slower despite an estimated speedup of about 20%; Copilot, 27–39% more completed tasks for juniors/recent hires and on the order of 8–13% more for seniors; Harvard / BCG inside the frontier, 12.2% more tasks, 25.1% faster, higher quality; Harvard / BCG outside the frontier, 19% less likely to reach the correct answer. Keep the Figure 2 label and a concise caption explaining how to read unlike outcomes. Retain the original image file unchanged on disk, but remove its image reference and alt text from this article. | `elaboration`: The cited Copilot field experiments show that benefits can differ between junior and senior developers. → The jagged frontier describes task-dependent competence, including cases where AI lowers correctness. |\n| p23 | recommendation | The practical response to varied study outcomes is to measure the particular user-task combination rather than infer speed from the tool or the feeling. | reasoning: Apply the distinction made in the study prose and labeled summaries: elapsed time, completed tasks, and correctness require task-specific measurement. | `conclusion_summary`: The jagged frontier describes task-dependent competence, including cases where AI lowers correctness. → The practical response to varied study outcomes is to measure the particular user-task combination rather than infer speed from the tool or the feeling. |\n\n### It Amplifies Cost\n\n**Controlling idea** (`cause_effect`, id `cost`): Cheaper generation can increase downstream ownership costs by producing more work to review, maintain, and understand.\n\n**Advances the thesis** (S3): Cheaper generation can increase downstream ownership costs by producing more work to review, maintain, and understand.\n\n**Transition in:** `elaboration`: Task-level speed cannot by itself establish the value of AI use. → Cheaper generation can increase downstream ownership costs by producing more work to review, maintain, and understand.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): Define the cost distinction before presenting hedged debt figures, then interpret the table and lifecycle illustration and separate the two savings claims. Moving the figures ahead of the distinction would invite a precise-cost argument the source deliberately avoids.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p24 | claim | A lower generation cost does not establish a lower cost for the full software lifecycle. |  |  |\n| p25 | explanation | The extra volume generated cheaply still has to be reviewed, tested, debugged, understood, and changed safely. | reasoning: Preserve the distinction between generating code and owning it, including the six-month understanding example. | `cause_effect`: A lower generation cost does not establish a lower cost for the full software lifecycle. → The extra volume generated cheaply still has to be reviewed, tested, debugged, understood, and changed safely. |\n| p26 | evidence | The cited code-debt analyses provide directional warnings about ownership burden rather than settled cost constants. | statistic: Preserve roughly 1.7× more issues per pull request, about 23.5% more incidents per pull request, 211 million lines, roughly eightfold duplication in 2024, and maintenance projections toward 4× by the second year. | `additional_support`: The extra volume generated cheaply still has to be reviewed, tested, debugged, understood, and changed safely. → The cited code-debt analyses provide directional warnings about ownership burden rather than settled cost constants. |\n| p27 | analysis | Increasing production while leaving ownership capacity unchanged relocates cost downstream. | table: Preserve the What gets cheaper / What can get more expensive table.; figure: Figure 3: cheap-to-generate-expensive-to-own.jpeg; preserve image, alt text, and caption exactly. | `cause_effect`: The cited code-debt analyses provide directional warnings about ownership burden rather than settled cost constants. → Increasing production while leaving ownership capacity unchanged relocates cost downstream. |\n| p28 | synthesis | Generation savings and ownership savings are different claims whose bills can appear at different times. |  | `conclusion_summary`: Increasing production while leaving ownership capacity unchanged relocates cost downstream. → Generation savings and ownership savings are different claims whose bills can appear at different times. |\n\n### It Amplifies the Bottleneck\n\n**Controlling idea** (`cause_effect`, id `bottleneck`): Increasing work at a non-bottleneck can enlarge queues and strain the stage that limits delivery.\n\n**Advances the thesis** (S3): Increasing work at a non-bottleneck can enlarge queues and strain the stage that limits delivery.\n\n**Transition in:** `elaboration`: Cheaper generation can increase downstream ownership costs by producing more work to review, maintain, and understand. → Increasing work at a non-bottleneck can enlarge queues and strain the stage that limits delivery.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): Introduce the chain before naming its constraint, show the downstream examples, then choose where effort belongs. The recommendation would be arbitrary before the reader can distinguish a local gain from throughput.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p29 | explanation | A delivery chain contains several stages, so a local improvement need not improve its total throughput. |  |  |\n| p30 | definition | The Theory of Constraints explains why extra non-bottleneck output can accumulate before the limiting stage. | quotation: Eliyahu Goldratt / Theory of Constraints: ter code generation can push more work onto code review, integration, and fragile legacy systems. → Investment should target the actual limiting stage rather than assume the fastest production stage deserves more capacity. |\n\n### Why Your Team Didn't Get Faster (Even Though You Did)\n\n**Controlling idea** (`analysis`, id `team-gap`): Local gains and reported speedups can coexist with constrained team delivery because work and coordination still pass through shared stages.\n\n**Advances the thesis** (S2, S3): Local gains and reported speedups can coexist with constrained team delivery because work and coordination still pass through shared stages.\n\n**Transition in:** `example`: Increasing work at a non-bottleneck can enlarge queues and strain the stage that limits delivery. → Local gains and reported speedups can coexist with constrained team delivery because work and coordination still pass through shared stages.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): State the observed individual/team gap, distinguish perceived from measured evidence, add the coordination mechanism, and conclude with a conditional local-to-system claim. Without the distinction the section would contradict METR by assuming every individual became faster.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p33 | claim | The constraint model helps explain why individuals can report faster work without their team shipping faster. |  |  |\n| p34 | evidence | DORA 2024 places positive individual perceptions alongside negative team-level associations without proving that every perceived gain was real. | statistic: DORA 2024: around three-quarters used AI, most felt more productive, while adoption was associated with a negative effect on delivery throughput and stability. | `example`: The constraint model helps explain why individuals can report faster work without their team shipping faster. → DORA 2024 places positive individual perceptions alongside negative team-level associations without proving that every perceived gain was real. |\n| p35 | cause_effect | Higher output from individuals can add coordination work at already constrained shared stages. | source: Fred Brooks: communication paths grow roughly with the square of team size; integration, architectural decisions, and difficult debugging have work that does not parallelize.; table: Preserve the Individual / Team-system table, but replace the Individual net-effect cell's unqualified \"Reliably positive\" claim with a measured gain for this person and task. Keep a brief conditional-case lead-in; remove the repeated explanation needed only to qualify the old protected cell. | `additional_support`: DORA 2024 places positive individual perceptions alongside negative team-level associations without proving that every perceived gain was real. → Higher output from individuals can add coordination work at already constrained shared stages. |\n| p36 | synthesis | Even a measured local gain becomes a system gain only when the shared constraint allows it through. | reasoning: Draw the system-level lesson from the conditional local-gain comparison already framed before the table. | `conclusion_summary`: Higher output from individuals can add coordination work at already constrained shared stages. → Even a measured local gain becomes a system gain only when the shared constraint allows it through. |\n\n### It Amplifies Quality — and Slop\n\n**Controlling idea** (`cause_effect`, id `quality`): Standards and review shape whether increased generation becomes usable quality or more unchecked material.\n\n**Advances the thesis** (S4): Standards and review shape whether increased generation becomes usable quality or more unchecked material.\n\n**Transition in:** `elaboration`: The team gap shows that faster production still depends on shared review and coordination. → Standards and review shape whether increased generation becomes usable quality or nclusion_summary`: Low reported trust makes the need for foundations to channel AI output visible. → Better engineering structure and accountable human direction are concrete organizational inputs to improve. |\n\n### What to Do on Monday\n\n**Controlling idea** (`recommendation`, id `monday`): A useful adoption plan measures actual results and strengthens the inputs and limiting stages before scaling.\n\n**Advances the thesis** (S5): A useful adoption plan measures actual results and strengthens the inputs and limiting stages before scaling.\n\n**Transition in:** `problem_solution`: Organizational foundations condition what widespread AI use can deliver. → A useful adoption plan measures actual results and strengthens the inputs and limiting stages before scaling.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p44 | recommendation | The preceding evidence becomes a set of moves for improving input quality and addressing real constraints. | table: Preserve the Monday actions table except three narrowly specified rows. In the standards row, define criteria and arrange evaluations, tests, and review before generation, then apply the checks to the resulting output before accepting it; replace the conflicting \"in front ... not after\" shorthand. In the measurement row, spell out METR's estimated about 20% faster versus measured 19% slower rather than leaving +20% and −19% as unlabeled shorthand. In the frontier row, label +12% as more completed tasks and −19% as lower likelihood of a correct answer, using only the existing rounded figures. Remove the now-redundant preparation-versus-checking explanation before the table. |  |\n| p45 | synthesis | These moves improve what the tool works on and what the system can absorb. |  | `conclusion_summary`: The preceding evidence becomes a set of moves for improving input quality and addressing real constraints. → These moves improve what the tool works on and what the system can absorb. |\n\n### Questions to Consider\n\n**Controlling idea** (`process`, id `questions`): A team can use the model to question its own measurements, ownership budget, standards, bottleneck, and operating conditions.\n\n**Advances the thesis** (S5): A team can use the model to question its own measurements, ownership budget, standards, bottleneck, and operating conditions.\n\n**Transition in:** `example`: A useful adoption plan measures actual results and strengthens the inputs and limiting stages before scaling. → A team can use the model to question its own measurements, ownership budget, standards, bottleneck, and operating conditions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p46 | process (list) | The existing team questions turn the Monday moves into a review of a concrete AI initiative. |  |  |\n\n## Conclusion: Closing Thought\n\n**Synthesis:** Task fit and input quality decide whether a local change helps, while the limiting stage decides whether that help reaches delivery; investment must address both rather than assume more generation creates more value.\n\n**So what:** Teams can direct budget and attention toward measured delivery and ownership capacity instead of expanding queues and maintenance while celebrating output.\n\n**Callback:** The opening purchasing story and accelerator pedal. The closing amplify what and amplify which part questions turn a supposed purchasing decision into a choice about inputs, constraints, and measured results.\n\n**Takeaway** (`course_of_action`): Measure the work, improve the input, and widen the real constraint before scaling generation.\n\n**Hand-off** to [You Can Outsource Thinking. You Cannot Outsource Understanding.](outsource-thinking-not-understanding.html): `elaboration`: A faster production stage can move the constraint to a slower stage that still needs attention. → Human understanding as the constraint that artifact generation cannot remove on its recipient's behalf.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p47 | synthesis | The question amplify what replaces the opening assumption that buying tools is enough. | analogy: Return to the opening pedal and amplifier contrast with the existing amplify what question. |  |\n| p48 | synthesis | The evidence makes input quality a practical investment decision rather than a guarantee that every AI effect has one sign. | reasoning: Recall the existing contrasts between skills and confusion, sound processes and brittle ones, without adding examples or evidence. | `elaboration`: The question amplify what replaces the opening assumption that buying tools is enough. → The evidence makes input quality a practical investment decision rather than a guarantee that every AI effect has one sign. |\n| p49 | synthesis | Choosing which stage to improve matters as much as the quality of what is supplied to it. | reasoning: Recall review queues, integration, legacy, and coordination already explained in the body. | `additional_support`: The evidence makes input quality a practical investment decision rather than a guarantee that every AI effect has one sign. → Choosing which stage to improve matters as much as the quality of what is supplied to it. |\n| p50 | recommendation | The durable work is improving the inputs and constraints that let measured gains reach the people relying on the system. | reasoning: Synthesize task fit, ownership, quality standards, bottlenecks, and direction without repeating their full inventories. | `conclusion_summary`: Choosing which stage to improve matters as much as the quality of what is supplied to it. → The durable work is improving the inputs and constraints that let measured gains reach the people relying on the system. |\n| p51 | transition | Human understanding is a remaining constraint that more artifact production cannot remove for the recipient. | source: Link to [You Can Outsource Thinking. You Cannot Outsource Understanding.](outsource-thinking-not-understanding.html) in this final unit, building on understanding as an ownership cost and the Monday ownership move. | `elaboration`: The durable work is improving the inputs and constraints that let measured gains reach the people relying on the system. → Human understanding is a remaining constraint that more artifact production cannot remove for the recipient. |\n\n## Non-goals\n\n- Not an AI-hype or AI-doom piece, and not a verdict on whether AI is \"worth it.\" It is a mental-model correction with a pragmatic angle.\n- Not a literature review. Studies serve the idea; the idea does not serve the studies.\n- Not a claim that AI is *only* a multiplier — the limits section concedes it also adds genuinely new capability and that gain varies task to task.\n- Not a re-run of [AI Is the Reactor, Not the Plant](ai-is-the-reactor-not-the-plant.html). Reactor = *where the work is* (static). Amplifier = *which direction the work goes* (dynamic, signed). Reference it; don't duplicate it. See [AI Is the Reactor, Not the Plant](ai-is-the-reactor-not-the-plant.html).\n- Not a precise-numbers argument. Cost/debt figures are attributed and used directionally, never as settled constants.\n\n## Modalities\n\nArticle, summary, dialog, comics\n\n## Open questions\n\n- The legacy source list calls the principal studies peer-reviewed / first-party and includes directional vendor/industry cost figures. Those historical labels and figures are carried over, not freshly verified; source verification and factual corrections are outside this pass.\n- The summary, dialog, and comics retain their published framing and order. Their unqualified arithmetic, individual-gain language, and later metaphor limits may now need a separate consistency pass; updating those modalities is outside this article-only pass.\n\n## Decision log\n\n- **2026-11-12** — Adopt the concrete FLOW-1 repair from the limited independent round-4                     out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
