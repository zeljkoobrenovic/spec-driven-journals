<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "# Spec: Payments for Finance Architects: The Lifecycle of Money Movement\n\n## Intent\n\nGive finance architects the payments knowledge they need before they connect payments to the ledger. The chapter treats a payment as a chain of separately timed events (authorization, authentication, capture, clearing, settlement, payout, refund, dispute) performed by parties who hold different money and bear different risks. It separates merchant of record from principal-versus-agent. It shows how pricing, payment methods, tokens, FX, marketplace models and regulation each change what the ledger must explain. It ends with eleven concrete reasons why provider payouts and bookings do not reconcile on their own, which is the bridge to Part III. After reading it, an architect should see that the reconciliation problem is designed upstream in payments choices and should know which of those choices to govern.\n\n## Audience\n\nChief and enterprise architects, finance-systems and integration architects, and finance-transformation leaders. They know systems well but meet payments mainly as a settlement file. Secondary readers are controllers and payments product leads who need a shared vocabulary.\n\n## Success criteria\n\n- [ ] Reader can name each party in a card payment and say who holds the money, who bears which risk, and who is merchant of record (party table and Northmere flow table).\n- [ ] Reader can trace the Lisbon €600 booking through every lifecycle step with dates, canonical events and the €1.74 fee (step table and sequence diagram), using ledger-consistent figures.\n- [ ] Reader can explain the €420 chargeback lifecycle, including its timing across periods and the recovery from the partner, consistent with the accounting chapter's canonical dates.\n- [ ] Reader can explain IC++ versus blended pricing, the EU interchange caps and their exclusions, and why fees need an accrual and a true-up.\n- [ ] Reader can contrast APM semantics (capture, finality, disputes, settlement) and PSP versus network tokens, including portability.\n- [ ] Reader knows the regulatory status as of October 2026: PSD2 SCA exemptions, PSD3/PSR not yet adopted, PCI DSS v4.0.1 scope logic, PSD2 Art. 10 and EMD Art. 7 safeguarding, the Instant Payments date for EMIs, and DORA.\n- [ ] Reader can weigh single PSP, direct multi-PSP, third-party orchestrator and PSP-native orchestration (trade-off table), and knows that orchestration does not unify settlement.\n- [ ] The \"Eleven reasons payments do not reconcile themselves\" section maps each reason to a documented mechanism and hands off to [Payments-to-Ledger: Connecting Providers, Brand Platforms and the ERP](payments-to-ledger.html).\n\n## Non-goals\n\n- Journal entries and the revenue-recognition judgment: owned by [Accounting for Architects: Ledgers, Journals and Revenue](accounting-for-architects.html).\n- Adyen's account structure, reports and journal types in depth: owned by [Adyen: Single-Platform Acquiring and Platform Payments](adyen.html).\n- Stripe's object model, Connect charge types and Billing: owned by [Stripe: Programmable Payments, Billing and Connected Accounts](stripe.html).\n- Clearing-account design, the three-way match and the suspense remediation: owned by [Payments-to-Ledger: Connecting Providers, Brand Platforms and the ERP](payments-to-ledger.html).\n- Vendor tiering and exit planning: owned by [Vendor Strategy and Avoiding Excessive Dependency](vendor-portfolio-strategy.html). DORA operations: owned by [Resilience, Observability, Security and Recovery for Finance Systems](resilience-and-security.html).\n\n## Modalities\n\n- [ ] `checklist.md` — operational checklist\n- [ ] `summary.md` — management summary\n- [ ] `dialog.md` — two-host dialog\n- [ ] `comics.md` — explainer comic\n\n## Open questions\n\n- PSD3/PSR: recheck adoption and Official Journal publication before print. The chapter states that it is not in force as of October 2026.\n- The 14 March 2027 payout date in the ledger falls on a Sunday, two days after a Friday sale. The chapter labels it illustrative and notes the calendar effect. A ledger owner should decide whether to keep it.\n- The dispute and return rules for Pix and UPI were not verified, so the chapter flags them as \"verify per market\".\n- UK CASS 15 is cited from a secondary source, so confirm it against FCA PS25/12 before print.\n- The PCI SAQ A eligibility wording has changed since v4.0.1; recheck it before print.\n\n## Decision log\n\n- **2026-10-18** — Built the chapter around two traced transactions (the €600 booking and the €420 chargeback) rather than a catalog of concepts, because timing and netting only become clear with dates. A generic \"card payment\" walkthrough was rejected.\n- **2026-10-18** — Made \"holds the money / bears the risk / merchant of record\" the organizing frame for parties. The frame shows explicitly why Northmere is merchant of record yet an agent for revenue, in line with the editor's canonical policy note.\n- **2026-10-18** — Aligned the €420 chargeback with the dates the accounting chapter recorded in the ledger (booked 2 Apr, stay 1–4 May, payout 7 May, chargeback 13 Jun, resolved 26 Jul), and chose the \"lost\" outcome. An earlier draft with different dates was discarded.\n- **2026-10-18** — Named orchestration vendors only by their own self-descriptions, with Stripe Orchestration's documented limits. CellPoint Digital (unverified) and any vendor ranking were left out.\n\n## Sources\n\n- **Internal**\n  - `_research/brief-payments.md` Parts 1 and 4, misconceptions and cautions — primary factual base.\n  - `_research/productscape-digest.md` §1.2 and §6 — money-movement capabilities, \"ledger-ready before launch\", the settlement and chargeback concept.\n  - `_research/brief-accounting-controls-regulation.md` §2.4, §4.7–4.9 — safeguarding, DORA, PSD3 themes.\n  - [Meet Northmere: The Running Example](meet-northmere.html), [Accounting for Architects: Ledgers, Journals and Revenue](accounting-for-architects.html) — scenario and accounting alignment.\n- **External**\n  - Adyen and Stripe documentation (settlement and payout reports, capture, disputes, balance transactions, Connect, Orchestration).\n  - EUR-Lex: Delegated Regulation 2018/389, Regulation 2015/751, Directive 2015/2366, Directive 2009/110/EC (Art. 7 fetched this session), Regulation 2024/886.\n  - European Parliament Legislative Train and Matheson (April 2026) on PSD3/PSR status.\n  - PCI SSC on v4.0.1 dates.\n\n## Changelog\n\n- **2026-10-18** — Initial spec and article. Status `accepted`. *(Željko Obrenović, AI-mediated session)*\n- **2026-10-18** — Consistency pass: aligned Lisbon settlement and payout dates (and batch id) with the scenario ledger. *(AI-mediated session)*\n- **2026-10-18** — Added a one-sentence cross-reference to the new Part V case study [Uber's Payments Platform: A Ledger at the Center of Money Movement](case-uber-payments.html). *(AI-mediated session)*\n- **2026-10-18** — Editorial review pass: split the €0.33 markup into €0.23 line-level and €0.10 batch-level fee (canonical €1.74 breakdown), corrected the settlement-report label in Figure 3, expanded NPCI, American spelling of license. *(AI-mediated session)*\n- **2026-10-18** — Added 2 inline illustrations (article-illustrator); figures renumbered. *(AI-mediated session)*\n"}]}]}</script>

        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');

            const bullet = /^(\s*)([-*])\s+(.*)$/;

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped

                // Stray ampersands still get fixed up.

                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');

                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');

            while (i < lines.length) {

                    const cellOpen = function (tag, idx) {

                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
