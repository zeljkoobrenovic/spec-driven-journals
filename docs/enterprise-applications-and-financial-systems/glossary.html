wrong.html):**\n>\n> * **The Doppelgänger Record** — one word mastered with different meanings in different systems (\"revenue\" in a provider report, in the billing engine and in the ledger) is this pattern in its semantic form; an owned definition is the first step out of it.\n> * **Spreadsheet Glue** — when nobody has agreed what the words mean, the translations between systems' vocabularies end up in mapping spreadsheets that the close depends on.\n\n<br>\n\n## How to Use This Glossary\n\nLook up a term or abbreviation in the alphabetical index below; each entry links to the section that defines it. The sections follow the book's structure: **accounting and finance** and **enterprise architecture** for Part I, **integration and data** for the flows that Parts I and III follow across platform boundaries, **platforms and vendors** and **payments** for Part II, **controls, resilience and regulation** for the obligations that run through every part, and **strategy and governance** for Part IV. The definitions are short teaching descriptions in plain language, not accounting standards, legal text or vendor documentation; the chapter in the last column gives the full treatment, the sources and the Northmere worked example. Northmere, the group named in some rows, is the fictional enterprise this book follows ([Meet Northmere: Five Brands, One Set of Books](meet-northmere.html)). Rows that combine two terms with a slash define both, because the difference between them is the point.\n\n## Alphabetical Index\n\n- **A** — [Account reconciliation](#platforms) · [Accounting Center](#platforms) · [Accounting engine](#platforms) · [Accounting hub](#platforms) · [Accounting source (Workday)](#platforms) · [Accounting-hub coexistence](#architecture) · [Accrual](#accounting) · [ACL](#architecture) · [Acquirer](#payments) · [ADR](#strategy) · [Advice process](#strategy) · [Agency model](#accounting) · [Agent (revenue)](#accounting) · [Agent control card](#strategy) · [Alternative #strategy) · [Transitional architecture](#architecture) · [Translation](#accounting) · [Treasury management system (TMS)](#platforms) · [Trial balance](#accounting) · [Two-tier ERP](#architecture) · [Type I / Type II report](#controls)\n- **U** — [Ubiquitous language](#architecture) · [Unallocated spend](#strategy) · [Unit cost](#strategy) · [Universal Journal](#platforms)\n- **V** — [Value stream](#architecture) · [Variation budget](#strategy) · [Variation point](#architecture) · [VAT in the Digital Age (ViDA)](#controls) · [Vendor tier](#strategy) · [ViDA](#controls) · [Void](#payments) · [Volume gradient](#architecture)\n- **W** — [Waiver](#strategy) · [Webhook](#payments) · [Workday Financial Management](#platforms) · [Worktag](#platforms) · [Wrap](#architecture)\n\n\n## <a id=\"accounting\"><\/a>Accounting and Finance\n\nThe accounting vocabulary an architect needs to read a posting design, a close calendar or an audit finding. [Accounting for Architects: Ledgers, Journals and Revenue](accounting-for-architects.html) teaches the model with worked journal entries; [Order to Cash, Procure to Pay, Record to Report](finance-processes.html) owns the end-to-end processes; [Global by Design: Entities, Currencies, Jurisdictions and Brands](global-scale.html) owns entities, currencies and intercompany; [OneStream: Consolidating Actuals, Planning the Future](onestream.html) owns consolidation. These are teaching definitions, not accounting standards: where a definition and IFRS, US GAAP or a regulator differ, the standard wins.\n\n| Term | Definition | Chapter |\n| --- | --- | --- |\n| Double-entry bookkeeping | Recording every transaction as equal debits and credits, so that assets always equal liabilities plus equity. The balance is an invariant the ledger enforces, not a report that checks it afterwards. | [Accounting for Architects: Ledgers, Journals and Revenue](accounting-for-architects.html) |\n| Journal entry | A dated, balanced set of debit and credit lines posted to accounts in one legal entity and period. Once posted it is never edited; it is corrected by another entry. | [Accounting for Architects: Ledgers, Journals and Revenue](accounting-for-architects.html) |\n| General ledger (GL) | The complete set of accounts and balances of a legal entity, from which its financial statements are produced. | [Accounting for Architects: Ledgers, Journals and Revenue](accounting-for-architects.html) |\n| Book of record | The legally authoritative accounting record of a legal entity: its balanced entries and balances by account, dimension, ledger and period. It is the special case of a system of record for accounting balances; each entity has one per accounting basis. | [Anatomy of a Finance Estate: Layers, Planes and Boundaries](finance-landscape.html) |\n| Subledger | A detailed ledger for one kind of item (receivables, payables, partner balances, assets) whose total is carried in the general ledger as a single control account. | [Accounting for Architects: Ledgers, Journals and Revenue](accounting-for-architects.html) |\n| Control account | The general-ledger account whose balance must equal the sum of the open items in a subledger, such as `Partner payables`. | [Accounting for Architects: Ledgers, Journals and Revenue](accounting-for-architects.html) |\n| Subledger-to-GL reconciliation | The periodic proof that each subledger's total equals its control account in the general ledger. One of the most important key controls in a finance estate; Northmere runs it daily. | [Accounting for Architects: Ledgers, Journals and Revenue](accounting-for-architects.html) |\n| Summarization key | The attributes on a summarized ledger line (date, entity, account combination, batch) that let the subledger list every line behind it. A summary without one is where traceability is lost. | [Anatomy of a Finance Estate: Layers, Planes and Boundaries](finance-landscape.html) |\n| Drill-back key | The identifier on a posted entry that leads from the ledger back to the source transaction or subledger lines that produced it. | [Never Update, Only Append: Designing Custom Ledgers](designing-financial-ledgers.html) |\n| Chart of accounts | The list of accounts a legal entity posts to, with their structure and hierarchy. A group chart is mapped to local and operational charts by rule. | [Accounting for Architects: Ledgers, Journals and Revenue](accounting-for-architects.html) |\n| Natural account | The part of the account combination that says *what* an amount is: cash at bank, trade receivables, commission revenue. Kept few and stable. | [Accounting for Architects: Ledgers, Journals and Revenue](accounting-for-architects.html) |\n| Dimension (segment) | An attribute on a ledger line that says *where, for whom and why*: entity, brand, business model, market, cost center, intercompany counterparty. Analytical variety belongs in dimensions, not in new accounts. | [Accounting for Architects: Ledgers, Journals and Revenue](accounting-for-architects.html) |\n| Cost of revenue / R&D / G&A (technology cost) | The income-statement lines a technology cost can land in. No standard prescribes the split; common practice puts customer-serving production in cost of revenue, development and test in research and development, and corporate systems in general and administrative expense, so the environment tag becomes a gross-margin control. | [FinOps Meets the Ledger: Technology Spend as Financial Data](finops.html) |\n| Trial balance | A list of every account's balance at a date, with total debits equal to total credits. A balanced trial balance proves the double-entry invariant held, not that the books are complete or right. | [Accounting for Architects: Ledgers, Journals and Revenue](accounting-for-architects.html) |\n| Accrual | An entry that recognizes revenue earned or an expense incurred before it is billed or paid: accrued revenue (an unbilled receivable) or an accrued expense. | [Accounting for Architects: Ledgers, Journals and Revenue](accounting-for-architects.html) |\n| Reversing entry | An entry that exactly negates an earlier one, linked to its original. Corrections in a book of record are reversals plus new entries, never edits. | [Accounting for Architects: Ledgers, Journals and Revenue](accounting-for-architects.html) |\n| Commitment discount (prepaid cloud commitment) | A discount bought by committing to a level of cloud spend or capacity for one or three years, such as an AWS Savings Plan, a reserved instance or a Google Cloud committed use discount. An upfront payment is usually a prepaid expense amortized over the term, not a software asset; unused commitment is still expense in the period. | [FinOps Meets the Ledger: Technology Spend as Financial Data](finops.html) |\n| Revenue recognition | Deciding when and how much revenue to record. Under ASC 606 and IFRS 15, revenue is recognized as the entity satisfies its performance obligations to a customer. | [Accounting for Architects: Ledgers, Journals and Revenue](accounting-for-architects.html) |\n| Principal (revenue) | An entity that controls a good or service before it is transferred to the customer. It reports revenue **gross**, with the supplier's share as a cost. Collecting the cash does not make you the principal; control is the test. | [Accounting for Architects: Ledgers, Journals and Revenue](accounting-for-architects.html) |\n| Agent (revenue) | An entity that arranges for another party to provide the good or service. It reports revenue **net**: its commission or margin. Contrast principal, and contrast merchant of record, which is a payments role, not an accounting one. | [Accounting for Architects: Ledgers, Journals and Revenue](accounting-for-architects.html) |\n| Agency model / merchant model | Stayloft's two ways of selling stays. In the agency model the property collects the traveler's money and Northmere invoices its commission; in the merchant model Stayloft collects at booking, holds the funds and pays the property net of commission. Holding the cash changes payments and safeguarding, not necessarily the revenue answer: both are commonly agent. | [Accounting for Architects: Ledgers, Journals and Revenue](accounting-for-architects.html) |\n| Deferred revenue / contract liability | Consideration received or due before the entity has performed, recognized as revenue as the obligation is satisfied, such as a subscription billed in advance. | [Accounting for Architects: Ledgers, Journals and Revenue](accounting-for-architects.html) |\n| Funds held for customers | Cash collected from customers for services not yet delivered that will mostly be paid on to suppliers or refunded, not earned. Travel filings often call it deferred merchant bookings; Northmere's account is `Traveler funds held`. It is not deferred revenue. | [Accounting for Architects: Ledgers, Journals and Revenue](accounting-for-architects.html) |\n| Clearing account | A balance-sheet account where money waits between two known events, such as a provider's settlement and the bank credit. It should return to zero when the second event happens, and every item in it has an identity and an expected zero date. | [Payments-to-Ledger: Draining the Suspense Swamp](payments-to-ledger.html) |\n| Suspense account | An account holding amounts already posted whose destination is not yet known. An accountant must clear it. Contrast clearing account (destination known, waiting) and dead letter (a technical failure that never reached the books). | [Payments-to-Ledger: Draining the Suspense Swamp](payments-to-ledger.html) |\n| Event date / posting date | The event date says when something happened; the posting date says which period it belongs to in the books. A late event posts in the open period with its event date preserved. | [Accounting for Architects: Ledgers, Journals and Revenue](accounting-for-architects.html) |\n| Period close | The work of completing, checking and locking one accounting period's books so that statements can be produced. Northmere's 2027 group close takes nine working days. | [Order to Cash, Procure to Pay, Record to Report](finance-processes.html) |\n| Cut-off | The rule that decides which period a transaction belongs to, including time zone and the moment of the period boundary. A design decision, not a moment. | [Order to Cash, Procure to Pay, Record to Report](finance-processes.html) |\n| Functional currency | The currency of the primary economic environment in which an entity operates; its books are kept in it. | [Accounting for Architects: Ledgers, Journals and Revenue](accounting-for-architects.html) |\n| Transaction currency | The currency in which a transaction is denominated, such as the price a traveler paid. | [Accounting for Architects: Ledgers, Journals and Revenue](accounting-for-architects.html) |\n| Revaluation (remeasurement) | Restating monetary items held in a foreign currency at the current rate, with the difference in profit or loss. | [Accounting for Architects: Ledgers, Journals and Revenue](accounting-for-architects.html) |\n| Translation | Converting an entity's statements from its functional currency into the group's presentation currency (US dollars at Northmere) for consolidation. Contrast revaluation, which happens inside the entity's own books. | [Accounting for Architects: Ledgers, Journals and Revenue](accounting-for-architects.html) |\n| Cumulative translation adjustment (CTA) | The accumulated difference produced by translating entities at different rates, held in other comprehensive income (OCI), the part of equity outside profit or loss. | [OneStream: Consolidating Actuals, Planning the Future](onestream.html) |\n| Legal entity model | The register of legal entities and how each platform represents them (SAP company code, Oracle ledger and balancing segment, Workday company). The legal entity is the balancing unit for books, tax and regulation. | [Global by Design: Entities, Currencies, Jurisdictions and Brands](global-scale.html) |\n| Multi-GAAP | Keeping books under more than one accounting basis, such as US GAAP for the group and local GAAP for statutory filings, through parallel ledgers or book-specific entries. | [Global by Design: Entities, Currencies, Jurisdictions and Brands](global-scale.html) |\n| Intercompany | Transactions between legal entities of the same group, such as recharges, royalties and payment-service fees. Both sides must agree, and they are eliminated in consolidation. The cure for disagreement is an intercompany originator: one component that creates both halves from one calculation with a shared identifier. | [Global by Design: Entities, Currencies, Jurisdictions and Brands](global-scale.html) |\n| Transfer pricing | Setting the prices of intercompany transactions; tax authorities require them to follow the arm's length principle: prices unrelated parties would agree in comparable circumstances. | [Global by Design: Entities, Currencies, Jurisdictions and Brands](global-scale.html) |\n| Intercompany recharge | An intercompany service charge that passes a cost paid by one legal entity to the entity that consumed it, with invoices on both sides, matching and elimination. At Northmere cloud hosting is recharged at cost on its own agreement, carrying its natural account and environment to the receiving entity. | [FinOps Meets the Ledger: Technology Spend as Financial Data](finops.html) |\n| Consolidation | Combining the books of a parent and its subsidiaries into group statements: translating currencies, eliminating intercompany balances and attributing outside owners' shares. | [OneStream: Consolidating Actuals, Planning the Future](onestream.html) |\n| Elimination | A consolidation entry that removes intercompany balances and transactions, so the group does not report trade with itself. | [OneStream: Consolidating Actuals, Planning the Future](onestream.html) |\n| Non-controlling interest (NCI) | The share of a consolidated subsidiary's equity and profit owned by outside shareholders, shown separately in group equity. | [OneStream: Consolidating Actuals, Planning the Future](onestream.html) |\n| Top-side journal | An adjustment booked in the consolidation system rather than in any entity ledger, such as a purchase-accounting adjustment. Each one needs an owner and a decision on whether it flows back to the entity books. | [OneStream: Consolidating Actuals, Planning the Future](onestream.html) |\n| Record-to-Report (R2R) | The process from recording transactions through close, consolidation and reporting. | [Order to Cash, Procure to Pay, Record to Report](finance-processes.html) |\n| Procure-to-Pay (P2P) | The process from purchase request and order through supplier invoice, approval and payment. | [Order to Cash, Procure to Pay, Record to Report](finance-processes.html) |\n| Order-to-Cash (O2C) | The process from customer order through invoice, collection and cash application. Northmere specializes it into Book-to-Settle, Commission-to-Cash and Subscribe/Usage-to-Cash. | [Order to Cash, Procure to Pay, Record to Report](finance-processes.html) |\n| Book-to-Settle / Commission-to-Cash | Northmere's two travel variants of order-to-cash. In Book-to-Settle (merchant model) Northmere holds the customer's money from booking until it pays the partner out, net of commission; in Commission-to-Cash (agency model) the partner collects from the customer and Northmere invoices and collects its commission. | [Order to Cash, Procure to Pay, Record to Report](finance-processes.html) |\n| Hand-off (process) | The point where a financial document leaves one system, owner or identifier and continues under another. Most losses, duplicates and delays happen there, so each hand-off needs a carried identifier, an owner on each side and a check. | [Order to Cash, Procure to Pay, Record to Report](finance-processes.html) |\n\n## <a id=\"architecture\"><\/a>Enterprise Architecture\n\nThe terms of the architecture practice itself: the function, its maps and inventories, the reference model of the finance estate, sourcing and modernization, and how teams are organized. Start with [The Chief Architect's Job: Making Many Systems Tell One Story](chief-architect-role.html), then [Map What Finance Does Before What Runs It](capability-mapping.html), [Manage the Application Portfolio as an Investment](application-portfolio.html) and [Anatomy of a Finance Estate: Layers, Planes and Boundaries](finance-landscape.html).\n\n| Term | Definition | Chapter |\n| --- | --- | --- |\n| Enterprise architecture | The discipline that treats an enterprise's many locally sensible systems and decisions as one system, accountable for its coherence, the quality and speed of decisions, and the options it keeps open. | [The Chief Architect's Job: Making Many Systems Tell One Story](chief-architect-role.html) |\n| Operating model (architecture) | Where architects sit, who decides what, and how decisions are made across team boundaries. Three models recur, usually blended: centralized, federated and advisory. | [The Chief Architect's Job: Making Many Systems Tell One Story](chief-architect-role.html) |\n| Decision rights | Who may take which decision, who must be consulted, who can block a specific aspect of it, and who is only informed. | [The Chief Architect's Job: Making Many Systems Tell One Story](chief-architect-role.html) |\n| Business capability | What an organization is able to do, independent of how, where, by whom or with which system it does it, such as Partner Payout Management. | [Map What Finance Does Before What Runs It](capability-mapping.html) |\n| Capability map | The structured, stable list of an enterprise's business capabilities, usually in two or three levels; Northmere's finance map has ten level-1 groups and 45 level-2 capabilities. | [Map What Finance Does Before What Runs It](capability-mapping.html) |\n| Capability owner | The business leader accountable for how well a capability is performed, across every system and team that implements it. | [Map What Finance Does Before What Runs It](capability-mapping.html) |\n| Value stream | The end-to-end sequence of stages by which value reaches a stakeholder, such as \"settle a merchant-model property\". It answers *how value flows*; a capability answers *what we can do*. | [Map What Finance Does Before What Runs It](capability-mapping.html) |\n| Bounded context | In domain-driven design, the boundary within which one model and its language apply consistently. Inside it every term has one meaning, the ubiquitous language. Capability maps say where to invest; bounded contexts say where one model stops and a translation begins. | [Map What Finance Does Before What Runs It](capability-mapping.html) |\n| Anticorruption layer (ACL) | A translation layer that keeps an upstream model, often a vendor's, from leaking into a downstream model. The most important ones in finance sit at the ERP boundary and the PSP boundary. | [Map What Finance Does Before What Runs It](capability-mapping.html) |\n| Application portfolio management | Keeping a fact base of every application, its owners, costs, contracts, fitness and lifecycle, and using it to decide what to invest in, migrate, tolerate or retire. Not to be confused with APM, an alternative payment method. | [Manage the Application Portfolio as an Investment](application-portfolio.html) |\n| TIME model | Sorting applications into Tolerate, Invest, Migrate or Eliminate on business and technical fitness. A time-bound disposition, not a plan. | [Manage the Application Portfolio as an Investment](application-portfolio.html) |\n| Pace layering | Gartner's classification of applications into Systems of Record, Systems of Differentiation and Systems of Innovation by how fast they change and how distinctive they are. Its \"systems of record\" is a layer, not the data-authority role of the same name. | [Manage the Application Portfolio as an Investment](application-portfolio.html) |\n| Total cost of ownership (TCO) | The full cost of an application over its life: licenses, hosting, run team, integration upkeep, change and audit effort, not licenses alone. | [Manage the Application Portfolio as an Investment](application-portfolio.html) |\n| Finance reference model | The book's layered model of a finance estate: eight layers (operational systems; financial event and subledger; accounting core; close and consolidation; planning; reporting; satellite services; finance data platform) and two cross-cutting planes (integration and control). | [Anatomy of a Finance Estate: Layers, Planes and Boundaries](finance-landscape.html) |\n| Volume gradient | The way data shrinks as it moves up the layers (billions of events, millions of subledger lines, thousands of ledger lines). It explains why layers exist and where detail must live. | [Anatomy of a Finance Estate: Layers, Planes and Boundaries](finance-landscape.html) |\n| Fit-to-standard | Designing an implementation by demonstrating the vendor's standard processes and recording only genuine gaps, instead of collecting requirements and building to them. | [The Technology Is the Easy Part: Leading a Finance Transformation](finance-transformation.html) |\n| Knock-out criterion | A selection criterion whose failure excludes a vendor regardless of score, such as a SOC 1 Type 2 report. Few, testable and set before any vendor is seen. | [Build, Buy or Compose: Choosing What to Own](build-versus-buy.html) |\n| Data exit test | Asking a vendor to export a complete period (journals, open items, master data with history, audit trail, configuration) and loading it elsewhere to prove it is complete and usable. | [Build, Buy or Compose: Choosing What to Own](build-versus-buy.html) |\n| Wrap | Keeping an acquired system temporarily but surrounding it with group standards (canonical events, group chart by rule, group identity, close calendar) under a dated plan. | [Build, Buy or Compose: Choosing What to Own](build-versus-buy.html) |\n| Custom finance platform | A system an enterprise builds itself that performs finance work (billing, payouts, a merchant subledger), usually because of volume, product coupling or a novel business model. Its boundary rules are mandatory standards: it never posts to arbitrary GL accounts, every posting carries drill-back keys and control totals, its subledgers reconcile daily, and corrections are reversals. | [When the ERP Isn't Enough: Custom Finance Platforms](custom-finance-platforms.html) |\n| Operational financial fact | A statement about one transaction in business terms (\"booking 4471 owes the partner €510 after commission\"). Contrast accounting entry, the same reality expressed as debits and credits. | [When the ERP Isn't Enough: Custom Finance Platforms](custom-finance-platforms.html) |\n| Explicit retirement test | The questions that decide, component by component, whether a custom finance platform is kept, converged or retired, starting with \"would we build this today?\" | [When the ERP Isn't Enough: Custom Finance Platforms](custom-finance-platforms.html) |\n| Rehost, replatform, refactor, replace, retire, retain | The usual dispositions for a system being modernized. \"Replace the system\" is an outcome, not a pattern; choose the pattern by what must change. | [Changing the Engine in Flight: Modernization Patterns for Finance](modernization-patterns.html) |\n| Brownfield conversion / greenfield / selective data transition | The three ERP migration approaches: convert the existing system in place, implement a new one, or move selected data and configuration into a new system. | [Changing the Engine in Flight: Modernization Patterns for Finance](modernization-patterns.html) |\n| Event interception | Routing a slice of state changes (one entity, one business model) to a new component while the rest still go to the legacy one. Every event must go to exactly one book. | [Changing the Engine in Flight: Modernization Patterns for Finance](modernization-patterns.html) |\n| Transitional architecture | Components installed only to ease the displacement of a legacy system (interceptors, mimics, temporary mappings, migration clearing accounts), each needing an owner and an end date. | [Changing the Engine in Flight: Modernization Patterns for Finance](modernization-patterns.html) |\n| Parallel run | Running old and new systems on the same inputs for one or more periods and reconciling their outputs before cutting over. Finance depends on it more than other domains. | [Changing the Engine in Flight: Modernization Patterns for Finance](modernization-patterns.html) |\n| Cut-over | The switch of a process or data object from the old system to the new one. In finance it belongs on a period boundary, away from quarter-end and year-end. | [Changing the Engine in Flight: Modernization Patterns for Finance](modernization-patterns.html) |\n| Migration stage-gate design | Moving authority for a book in time-boxed stages, each moving one or more cohorts and ending at a gate: a decision point with written criteria, evidence and named approvers. | [Modernizing Without Stopping the Close](incremental-modernization.html) |\n| Cohort | A slice of the business (entities, business-model variants, markets) that changes authority together; at any moment exactly one system holds it. | [Modernizing Without Stopping the Close](incremental-modernization.html) |\n| Dual running | Both systems process the same live events for a period, so the new book can be reconciled against the old before the old one is retired. | [Modernizing Without Stopping the Close](incremental-modernization.html) |\n| Reverse shadow / point of no return | After cut-over the old system keeps computing without posting, so the new book can be reconciled against it and authority can go back; the point of no return is the last moment authority can return without restating anything already signed. | [Modernizing Without Stopping the Close](incremental-modernization.html) |\n| Run-off | Sending new transactions to the new book while old ones complete in the old book: no open-item migration, but two books per entity for the longest transaction horizon. | [Modernizing Without Stopping the Close](incremental-modernization.html) |\n| Two-tier ERP | Running a group ERP and one or more second-tier ERPs for subsidiaries under explicit contracts for chart mapping, calendars, rates and evidence. | [Converge or Coexist: Living with More Than One ERP](multiple-erps.html) |\n| Accounting-hub coexistence | Several operational systems publish financial events into one accounting hub that applies the group's posting rules, while their own ERPs keep running. | [Converge or Coexist: Living with More Than One ERP](multiple-erps.html) |\n| Convergence criteria | The factors that decide whether an acquired ERP is converged, tiered or federated: business-model divergence, volume, statutory needs, ownership horizon and economics. | [Converge or Coexist: Living with More Than One ERP](multiple-erps.html) |\n| Redundancy | Several implementations of one capability for comparable scope. Duplication is a decision, not a defect, but it needs to be recorded. | [Duplicates and Dependencies: The Hidden Costs of a Grown Estate](redundancy-and-coupling.html) |\n| Overlap register | The record of every duplicated capability with its scope, cost, control impact, decision, owner and date. | [Duplicates and Dependencies: The Hidden Costs of a Grown Estate](redundancy-and-coupling.html) |\n| Coupling | The degree to which a change in one system forces a change, a delay or a failure in another. In finance it comes in data, semantic, temporal, deployment, organizational and contractual forms. | [Duplicates and Dependencies: The Hidden Costs of a Grown Estate](redundancy-and-coupling.html) |\n| Shadow balance | A balance kept by an operational system (such as a payout engine) that is not reconciled to the book of record. | [Duplicates and Dependencies: The Hidden Costs of a Grown Estate](redundancy-and-coupling.html) |\n| Business-model template | A versioned bundle of canonical event types, posting-rule families, reconciliations and controls for one way of making money (agency, merchant, subscription). Brands bind to it and supply parameters. | [The Next Brand Should Be Boring: Onboarding as Configuration](brands-entities-markets.html) |\n| Variation point | A place where a shared design expects legitimate difference and exposes a parameter for it, such as a commission basis or a payout schedule. | [The Next Brand Should Be Boring: Onboarding as Configuration](brands-entities-markets.html) |\n| Market launch kit | The checklist-backed set of configuration items, templates, owners, lead times and gates needed to start trading in a new market or entity, run as a product. | [The Next Brand Should Be Boring: Onboarding as Configuration](brands-entities-markets.html) |\n| Fork | A separate copy of a shared capability maintained for one brand, market or entity. Legitimate only as a recorded, time-boxed decision with exit criteria. | [The Next Brand Should Be Boring: Onboarding as Configuration](brands-entities-markets.html) |\n| Ledger-ready | The state in which a payment method, provider or market produces settlement that is matched automatically at an agreed rate. As a launch criterion, nothing goes live until it is; time to ledger-ready measures how long a launch takes to get there. | [The Next Brand Should Be Boring: Onboarding as Configuration](brands-entities-markets.html) |\n| Team Topologies team types | Skelton and Pais's four types: stream-aligned (one flow of work, such as a brand's bookings-to-statements flow), platform (an internal product such as the ledger and posting platform), complicated-subsystem (specialist parts such as the ERP or tax engine) and enabling (helping others, such as architecture). Team cognitive load limits what each can own. | [Who Owns What: Organizing Architecture Across Finance and Technology](organizing-for-architecture.html) |\n\n## <a id=\"integration\"><\/a>Integration and Data\n\nHow money and data move between platforms, who is authoritative for what, and how a number is traced and reconciled. [Files, Events and APIs: How Finance Systems Talk](integration-architecture.html) owns the guarantees; [Finance Data Architecture: Who Owns the Truth](finance-data-architecture.html) owns master data; [Systems of Record: Ending the Doppelgänger Record](systems-of-record.html) owns authority; [Canonical Events: A Common Language for Money](loosely-coupled-domains.html) owns canonical events; [One Number, Many Views: Finance Data from Operations to Analytics](finance-data-flows.html) owns the data platform; [Reconciled by Design: Traceability and Audit Across Boundaries](traceability-and-reconciliation.html) owns traceability.\n\n| Term | Definition | Chapter |\n| --- | --- | --- |\n| Integration style | The basic way two systems exchange data: synchronous API, asynchronous events and messaging, files and batch, change data capture, or data pipelines. Choose by the job, not by the platform you own. | [Files, Events and APIs: How Finance Systems Talk](integration-architecture.html) |\n| At-least-once delivery | A delivery guarantee under which nothing is lost but a message may arrive more than once. | [Files, Events and APIs: How Finance Systems Talk](integration-architecture.html) |\n| Idempotency | The property that processing the same request twice has the same effect as processing it once. | [Files, Events and APIs: How Finance Systems Talk](integration-architecture.html) |\n| Idempotency key | An identifier of the business operation a request represents, derived from business identity, so the receiver can detect a repeat. The same key with different content is an error, not an update. | [Files, Events and APIs: How Finance Systems Talk](integration-architecture.html) |\n| Exactly-once effect | Each business fact changes the books once, however many times it is delivered: at-least-once delivery plus idempotent processing plus reconciliation. No middleware delivers exactly-once postings by itself. | [Files, Events and APIs: How Finance Systems Talk](integration-architecture.html) |\n| Transactional outbox | Writing the business change and an outbox row in the same database transaction, then relaying the row as an event. It removes the dual-write gap, where a crash between updating a database and publishing an event leaves one without the other. | [Files, Events and APIs: How Finance Systems Talk](integration-architecture.html) |\n| Control total | A count or sum (records, amount per currency, debits and credits) that sender and receiver compute independently and compare to prove a transfer is complete and accurate. | [Files, Events and APIs: How Finance Systems Talk](integration-architecture.html) |\n| Batch manifest | The sender's declaration of a batch: identifier, scope, record count, control totals and a digest of the content, checked by the receiver before it accepts the batch. | [Files, Events and APIs: How Finance Systems Talk](integration-architecture.html) |\n| Replay / backfill | Replay re-delivers records already sent, to recover from a defect or outage; backfill sends records for a past period that were never sent. | [Files, Events and APIs: How Finance Systems Talk](integration-architecture.html) |\n| Dead letter | A message the integration layer could not deliver or process. It is a technical failure an engineer must fix and replay. Contrast suspense account, money posted but not yet explained, which an accountant must clear. | [Files, Events and APIs: How Finance Systems Talk](integration-architecture.html) |\n| Delivery ledger | The record of every financial message accepted, rejected, delivered, replayed and pending; it makes \"money in flight\" a measurable metric with an owner. | [Files, Events and APIs: How Finance Systems Talk](integration-architecture.html) |\n| Data contract | The agreed schema, semantics, quality rules, owner and change process of a dataset or interface. | [Files, Events and APIs: How Finance Systems Talk](integration-architecture.html) |\n| Financial event | An immutable record that something with financial consequences happened (a booking confirmed, a payment captured), written by the system that owns the fact, in business terms, with no debits, credits or accounts. | [Never Update, Only Append: Designing Custom Ledgers](designing-financial-ledgers.html) |\n| Canonical financial event | An immutable, versioned record of one business fact with financial consequences, in the enterprise's published language and owned by the domain where the fact originates. It states facts, not accounting. | [Canonical Events: A Common Language for Money](loosely-coupled-domains.html) |\n| Event notification / event-carried state transfer | An event notification says something changed and consumers call back for details; event-carried state transfer puts the needed data in the event. Canonical financial events are the second kind, so they can be replayed years later. | [Canonical Events: A Common Language for Money](loosely-coupled-domains.html) |\n| Brand adapter kit | The libraries, mappings, tests and guides a producing team uses to publish canonical events correctly without designing its own integration. | [Canonical Events: A Common Language for Money](loosely-coupled-domains.html) |\n| Integration hub | The governed transport and control layer between producers and finance consumers: it validates, enriches with reference keys, counts, routes, quarantines and replays. It holds no accounting logic. | [Canonical Events: A Common Language for Money](loosely-coupled-domains.html) |\n| Master data | The shared business objects that transactions reference: legal entities, chart of accounts, partners, bank accounts, products, tax codes. | [Finance Data Architecture: Who Owns the Truth](finance-data-architecture.html) |\n| Master data management (MDM) | The governance, process and tooling that keep master data authored once, correct and distributed. Its four styles are registry, consolidation, coexistence and centralized. | [Finance Data Architecture: Who Owns the Truth](finance-data-architecture.html) |\n| Registry / consolidation / coexistence / centralized (MDM styles) | Registry cross-references records in place; consolidation builds a golden record downstream for reporting; coexistence matches, merges and synchronizes back to sources; centralized authors records in the hub before any source can use them. | [Finance Data Architecture: Who Owns the Truth](finance-data-architecture.html) |\n| Data owner / data steward | The data owner is the business leader accountable for a domain and its rules; owners are business people, not platform teams. The data steward handles daily requests, triage, duplicate resolution and quality exceptions; the technical steward runs the platform. | [Finance Data Architecture: Who Owns the Truth](finance-data-architecture.html) |\n| Data lineage | Metadata showing which datasets and jobs a dataset is built from. It covers the data strand (records) and should also cover the rule strand (the mapping, hierarchy, rate and rule versions that shaped a number). | [Finance Data Architecture: Who Owns the Truth](finance-data-architecture.html) |\n| Golden source | The place where the authoritative version of a master record or attribute is created and maintained. [Systems of Record: Ending the Doppelgänger Record](systems-of-record.html) refines it into the system of record per lifecycle stage. | [Finance Data Architecture: Who Owns the Truth](finance-data-architecture.html) |\n| System of record (SoR) | The system whose value for a data element, at a given lifecycle stage, is authoritative: where it is created and changed, where its history is kept, and what the auditor tests. If another system disagrees, the other system must explain itself. | [Systems of Record: Ending the Doppelgänger Record](systems-of-record.html) |\n| System of reference | A system that holds a copy of data authored elsewhere for local use. It never corrects the source; a wrong copy is fixed at the source and redistributed. | [Systems of Record: Ending the Doppelgänger Record](systems-of-record.html) |\n| System of engagement | The system where a person or counterparty sees and acts on data, such as a partner portal. A term from Geoffrey Moore's 2011 paper. | [Systems of Record: Ending the Doppelgänger Record](systems-of-record.html) |\n| Golden copy (golden record) | The best consolidated version of a record, assembled by matching and merging sources. It becomes a system of record only if the estate declares and enforces that. | [Systems of Record: Ending the Doppelgänger Record](systems-of-record.html) |\n| Derived store | A store computed from systems of record and recomputable from them, such as a data warehouse or cache. Authoritative for its own outputs, never for its inputs. | [Systems of Record: Ending the Doppelgänger Record](systems-of-record.html) |\n| Attribute group | A set of attributes of one object that share an authority; the true unit of authority, since one partner record can have several authoritative systems. | [Systems of Record: Ending the Doppelgänger Record](systems-of-record.html) |\n| System-of-record matrix | The register naming, per object, attribute group and lifecycle stage, the authoritative system, consumers, propagation, reconciliation and retention. | [Systems of Record: Ending the Doppelgänger Record](systems-of-record.html) |\n| Authority hand-off | The designed moment when authority for a data element moves from one system to another, with a reconciliation proving nothing was lost. | [Systems of Record: Ending the Doppelgänger Record](systems-of-record.html) |\n| End-to-end financial event chain | The full path of one transaction across platforms, from customer event to disclosed figure, with the record, key, invariant and control at every hop. | [The Life of a Booking: From €600 Payment to $97.38 of Revenue](transaction-to-report.html) |\n| Hop | A step at which a record is created in, or moved into, a system with a different owner, data model or granularity; usually a change of authority. | [The Life of a Booking: From €600 Payment to $97.38 of Revenue](transaction-to-report.html) |\n| Correlation key | An identifier that travels with a business item across systems so that related records can be joined, such as a booking ID. | [Reconciled by Design: Traceability and Audit Across Boundaries](traceability-and-reconciliation.html) |\n| Traceability | The ability to follow one item across hops in both directions using stored keys: from a reported number down to its transactions and from a transaction forward to every number it contributed to. Lineage is not traceability. | [Reconciled by Design: Traceability and Audit Across Boundaries](traceability-and-reconciliation.html) |\n| Reconciliation | Comparing two independent records to prove they agree, or that their differences are known, explained and owned. | [Reconciled by Design: Traceability and Audit Across Boundaries](traceability-and-reconciliation.html) |\n| Reconciliation catalog | The register of every recurring comparison the estate relies on to prove its records agree, each with sources, keys, tolerance, cadence, owners and where the evidence goes. | [Reconciled by Design: Traceability and Audit Across Boundaries](traceability-and-reconciliation.html) |\n| Finance data platform | The analytical store that joins operational, subledger and ledger data (FinDB, on Snowflake, at Northmere). It is the book for nothing: it masters metrics, not financial facts. | [One Number, Many Views: Finance Data from Operations to Analytics](finance-data-flows.html) |\n| Governed metric | A number with one approved definition, one owner, one implementation, a source of truth, a tie-out control and a certification status. | [One Number, Many Views: Finance Data from Operations to Analytics](finance-data-flows.html) |\n| Tie-out | The check that a dataset or metric agrees with the ledger or source it came from, within a stated tolerance, every period. | [One Number, Many Views: Finance Data from Operations to Analytics](finance-data-flows.html) |\n| Gross transaction value (GTV) | The total value of transactions processed through the platform, an operational measure. Contrast net revenue, the accounting figure; GTV has an anchor in the books, not a tie-out. | [One Number, Many Views: Finance Data from Operations to Analytics](finance-data-flows.html) |\n| FOCUS (FinOps Open Cost and Usage Specification) | The FinOps Foundation's open specification that normalizes billing data across cloud, SaaS, AI and other technology vendors: a canonical data model for vendor billing. Version 1.4 is current in 2026; most providers emit 1.2, so every delivery needs a conformance check. | [FinOps Meets the Ledger: Technology Spend as Financial Data](finops.html) |\n| BilledCost / EffectiveCost | The two FOCUS cost measures a ledger needs. BilledCost is what the invoice says (the payables view); EffectiveCost is the cost recognized in the charge period, with commitment purchases amortized into the covered usage (the expense view). There is no separate amortized-cost column. | [FinOps Meets the Ledger: Technology Spend as Financial Data](finops.html) |\n| ChargeCategory / ChargeClass | FOCUS columns that tell the posting logic how to treat a billing row. ChargeCategory separates Usage, Purchase, Tax, Credit and Adjustment; ChargeClass = Correction marks a row that corrects an already invoiced billing period. | [FinOps Meets the Ledger: Technology Spend as Financial Data](finops.html) |\n| Cut-off snapshot | A stored, unchanged copy of the billing data taken at a defined cut-off time, from which the month-end accrual, amortization and recharge journals and the tie-out are all produced, so an auditor can reperform them. Daily feeds restate earlier days until the billing period is final. | [FinOps Meets the Ledger: Technology Spend as Financial Data](finops.html) |\n\n## <a id=\"platforms\"><\/a>Platforms and Vendors\n\nLedger design and the vendor platforms of Part II. Vendor names, editions and dates change; they are given as of 2026 and follow each vendor's documentation as cited in the chapters. Start with [PLATFORMS: What Each Is For, and What It Costs to Depend On](part-2.html).\n\n| Term | Definition | Chapter |\n| --- | --- | --- |\n| Accounting engine | The component that selects the applicable posting-rule version for an event, evaluates it and writes the entry. | [Never Update, Only Append: Designing Custom Ledgers](designing-financial-ledgers.html) |\n| Posting rule | A versioned mapping from an event type, under stated conditions, to the lines of an entry: which accounts, which side, which amount, which dimensions. Held in a rule store as approved data with effective dates, not as code. A pattern named in Martin Fowler's *Analysis Patterns*. | [Never Update, Only Append: Designing Custom Ledgers](designing-financial-ledgers.html) |\n| Ledger invariant | A property that must hold after every write: entries balance per currency, storage is append-only, one effect per event, no posting into a closed period. Enforced in the write path, not by a nightly report. | [Never Update, Only Append: Designing Custom Ledgers](designing-financial-ledgers.html) |\n| Accounting hub | A component that applies posting rules to events produced by other systems and posts the result to a general ledger, keeping detail below the ledger and summaries in it. Oracle Accounting Hub and Workday Accounting Center are vendor examples. | [Never Update, Only Append: Designing Custom Ledgers](designing-financial-ledgers.html) |\n| Reversal / difference / replacement adjustment | Fowler's three correction patterns: post the exact negative then the right entry; post only the delta; or overwrite. Reversal is what a book of record uses; replacement destroys evidence. | [Never Update, Only Append: Designing Custom Ledgers](designing-financial-ledgers.html) |\n| Minor units | Storing amounts as integers in the currency's smallest unit (cents), with an ISO 4217 code, never as binary floating point. Minor-unit exponents vary by currency. | [Never Update, Only Append: Designing Custom Ledgers](designing-financial-ledgers.html) |\n| SAP S/4HANA | SAP's ERP suite, Northmere's group finance core. As of 2026 its cloud editions are marketed as SAP Cloud ERP (Public Edition) and SAP Cloud ERP Private (formerly S/4HANA Cloud Private Edition). | [SAP S/4HANA: One Journal, Clean Core](sap-s4hana.html) |\n| Universal Journal | S/4HANA's single line-item store for accounting: each line carries the GL account, several currencies, the ledger and account assignments (cost center, profit center, segment) that used to live in separate modules. | [SAP S/4HANA: One Journal, Clean Core](sap-s4hana.html) |\n| Document splitting | SAP's enrichment of every line of a journal entry, including payables, receivables and tax, with characteristics such as profit center and segment, so a complete balance sheet can be produced per characteristic. Cheapest to configure at implementation. | [SAP S/4HANA: One Journal, Clean Core](sap-s4hana.html) |\n| SAP Central Finance (CFIN) | A central S/4HANA system that replicates financial postings from several source ERPs, maps them to a harmonized model and posts them into its own Universal Journal while the sources keep running. It centralizes accounting already done; it is not convergence. | [SAP S/4HANA: One Journal, Clean Core](sap-s4hana.html) |\n| Clean core | SAP's principle of keeping the ERP core upgradable by extending it only through released, stable interfaces. In Private Edition it is a governance discipline, not a technical guarantee. | [SAP S/4HANA: One Journal, Clean Core](sap-s4hana.html) |\n| Clean-core levels A–D | SAP's 2025 rating of extensions by the riskiest technique they use, from A (released interfaces only) to D (modifications and unreleased objects with the highest upgrade risk). | [SAP S/4HANA: One Journal, Clean Core](sap-s4hana.html) |\n| RISE with SAP | A commercial bundle, not a product: the Private Edition subscription, SAP-operated infrastructure on a hyperscaler, platform credits and transformation tooling. | [SAP S/4HANA: One Journal, Clean Core](sap-s4hana.html) |\n| FI-CA (Contract Accounts Receivable and Payable) | SAP's subledger for business-partner receivables and payables at mass volume, built around contract accounts. Northmere runs Stayloft's partner accounts on it. | [SAP S/4HANA: One Journal, Clean Core](sap-s4hana.html) |\n| Workday Financial Management | Workday's cloud financials product, Tablekin's ledger at Northmere. Configured, not customized; there is no database access. | [Workday: The Org Chart Behind the Ledger](workday.html) |\n| Worktag | A Workday attribute on a transaction or line that records its business purpose, ownership or funding (company, cost center, project, region). Workday derives ledger accounts from worktags and spend or revenue categories. | [Workday: The Org Chart Behind the Ledger](workday.html) |\n| Foundation Data Model (FDM) | Workday's design of organizations, worktags and the chart of accounts that underlies a tenant. A good FDM is designed from both ends: what feeders can supply and what group consolidation needs. | [Workday: The Org Chart Behind the Ledger](workday.html) |\n| Accounting Center | Workday's accounting hub: accounting sources ingest external transactions, apply posting rules and worktag mapping, and post summarized journals with drill-back to the detail. | [Workday: The Org Chart Behind the Ledger](workday.html) |\n| HCM-as-master pattern | Using Workday HCM as the authoritative source of people and organization data (workers, cost centers, supervisory organizations) for every other platform. | [Workday: The Org Chart Behind the Ledger](workday.html) |\n| Oracle Fusion Cloud ERP | Oracle's SaaS ERP, Wayfare's ledger at Northmere. Updated quarterly; updates cannot be skipped. | [Oracle Fusion: An Accounting Hub for High-Volume Events](oracle-fusion.html) |\n| Primary ledger / secondary ledger | In Fusion, a primary ledger combines a chart of accounts, calendar, currency and accounting method and is the main record of its legal entities; a secondary ledger is a linked ledger that can differ in any of those four. A balancing segment is a chart-of-accounts segment for which Fusion keeps every journal in balance; Oracle recommends the primary balancing segment represent the legal entity. | [Oracle Fusion: An Accounting Hub for High-Volume Events](oracle-fusion.html) |\n| Subledger Accounting (SLA) | Fusion's rules engine that generates detailed journal entries for subledger transactions and posts them to the GL with configurable summarization. | [Oracle Fusion: An Accounting Hub for High-Volume Events](oracle-fusion.html) |\n| Oracle Accounting Hub | Oracle's component that applies SLA to transactions from non-Oracle sources; historically Fusion Accounting Hub (FAH) or Accounting Hub Cloud Service. | [Oracle Fusion: An Accounting Hub for High-Volume Events](oracle-fusion.html) |\n| Quarterly update | Oracle's mandatory four-times-a-year Fusion release. The discipline is to treat each one as a regression event with a standing test suite. | [Oracle Fusion: An Accounting Hub for High-Volume Events](oracle-fusion.html) |\n| BlackLine | A close and controls platform for account reconciliation, transaction matching, task management, journal entry and intercompany. | [BlackLine: Matching, Certifying and Closing](blackline.html) |\n| Account reconciliation | Substantiating a balance-sheet account's balance at period end against independent evidence, with preparer, reviewer and sign-off. Northmere's group has about 6,800. | [BlackLine: Matching, Certifying and Closing](blackline.html) |\n| Transaction matching | Pairing individual records from two or more sources (settlement lines, bank lines, subledger items) by keys and rules, one-to-one or many-to-one. Matching produces the detail an account reconciliation relies on; it is not the reconciliation itself. | [BlackLine: Matching, Certifying and Closing](blackline.html) |\n| Auto-certification | Certifying a reconciliation without manual preparation when defined conditions hold, such as a zero balance with no activity. It is itself a control and needs a look-back review. | [BlackLine: Matching, Certifying and Closing](blackline.html) |\n| Risk-based reconciliation | Rating each account on size, volatility, volume, judgment and error history, and letting the rating set template, frequency, review levels and eligibility for auto-certification. | [BlackLine: Matching, Certifying and Closing](blackline.html) |\n| Continuous accounting | Moving period-end work (reconciliation, matching, journal review) into the period so the close confirms rather than discovers. An architecture, not a tool purchase. | [BlackLine: Matching, Certifying and Closing](blackline.html) |\n| OneStream | A unified enterprise performance management (EPM) platform for consolidation, planning and reporting; taken private by Hg in April 2026. | [OneStream: Consolidating Actuals, Planning the Future](onestream.html) |\n| Enterprise performance management (EPM / CPM) | Software for consolidation, close, planning, forecasting and management reporting; also called corporate performance management. | [OneStream: Consolidating Actuals, Planning the Future](onestream.html) |\n| Group reporting mapping | The rules that map every source account, segment and worktag to the group chart before numbers reach consolidation. They are master data and need an owner, change control, tests and a single home, not a spreadsheet. | [OneStream: Consolidating Actuals, Planning the Future](onestream.html) |\n| Extensible dimensionality | OneStream's metadata design in two forms: vertical (more or less detail at different levels of the entity hierarchy, so a brand keeps detail the group sees summarized) and horizontal (different hierarchy levels for different purposes, such as budget versus actuals). | [OneStream: Consolidating Actuals, Planning the Future](onestream.html) |\n| Satellite platform | A specialized platform beside the ERP (tax engine, treasury management system, e-invoicing gateway, close tool) that owns one capability and returns results to the book of record. | [Around the Core: Where Specialist Platforms Earn Their Place](satellite-platforms.html) |\n| Treasury management system (TMS) | The satellite for cash positions, bank connectivity, bank statements and payments; Kyriba at Northmere. | [Around the Core: Where Specialist Platforms Earn Their Place](satellite-platforms.html) |\n\n## <a id=\"payments\"><\/a>Payments\n\nThe vocabulary of card and alternative payments, payment providers and the reconciliation of money with records. [Payments for Finance Architects: Eleven Reasons the Numbers Disagree](payments-fundamentals.html) owns the lifecycle and roles; [Adyen: One Platform from Checkout to Settlement](adyen.html) and [Stripe: Every Movement Is a Balance Transaction](stripe.html) own their account structures; [Payments-to-Ledger: Draining the Suspense Swamp](payments-to-ledger.html) owns clearing design and the three-way match.\n\n| Term | Definition | Chapter |\n| --- | --- | --- |\n| Authorization | The first money step of the payment lifecycle (authorization, capture, clearing, settlement, payout, then possibly refunds and chargebacks): the issuer approves an amount and holds it on the cardholder's funds. No money moves, and authorizations expire. | [Payments for Finance Architects: Eleven Reasons the Numbers Disagree](payments-fundamentals.html) |\n| Capture | The merchant's instruction to collect all or part of an authorized amount. | [Payments for Finance Architects: Eleven Reasons the Numbers Disagree](payments-fundamentals.html) |\n| Clearing (payments) | The exchange of transaction details between acquirer and issuer through the scheme that fixes the obligation, including interchange and scheme fees. Not the same as a clearing account. | [Payments for Finance Architects: Eleven Reasons the Numbers Disagree](payments-fundamentals.html) |\n| Settlement | The scheme nets positions between issuers and acquirers, and funds move from issuer to acquirer. | [Payments for Finance Architects: Eleven Reasons the Numbers Disagree](payments-fundamentals.html) |\n| Payout | The acquirer or PSP pays the merchant in batches, net of fees, refunds, chargebacks and reserve movements. | [Payments for Finance Architects: Eleven Reasons the Numbers Disagree](payments-fundamentals.html) |\n| Refund / void | A void cancels an authorization before capture and moves no money; a refund returns captured money and can settle in a later batch or fail weeks later. | [Payments for Finance Architects: Eleven Reasons the Numbers Disagree](payments-fundamentals.html) |\n| Dispute / chargeback | A dispute is the cardholder's challenge through their issuer; a chargeback is the forced reversal that follows, debited from the merchant through the acquirer. Chargebacks can arrive months after the sale; the merchant contests one by representment, submitting evidence. | [Payments for Finance Architects: Eleven Reasons the Numbers Disagree](payments-fundamentals.html) |\n| Issuer | The bank that issued the card: it approves payments, bills the cardholder, receives interchange and raises chargebacks. | [Payments for Finance Architects: Eleven Reasons the Numbers Disagree](payments-fundamentals.html) |\n| Acquirer | The licensed institution that contracts the merchant, receives funds from the scheme and pays the merchant. It carries merchant credit risk. | [Payments for Finance Architects: Eleven Reasons the Numbers Disagree](payments-fundamentals.html) |\n| Card scheme | A card network such as Visa or Mastercard that sets rules, routes authorization and clearing, and charges scheme fees. | [Payments for Finance Architects: Eleven Reasons the Numbers Disagree](payments-fundamentals.html) |\n| Payment service provider (PSP) | A provider that packages acquiring (its own or partners'), gateway, risk and reporting into one service for merchants, such as Adyen or Stripe. | [Payments for Finance Architects: Eleven Reasons the Numbers Disagree](payments-fundamentals.html) |\n| Payment orchestrator | A layer over several PSPs for routing, retries, normalized data and sometimes a card vault. It never holds funds unless it also acquires. | [Payments for Finance Architects: Eleven Reasons the Numbers Disagree](payments-fundamentals.html) |\n| Payment facilitator (PayFac) | A master merchant that onboards sub-merchants under its own acquiring contract and carries their losses and know-your-customer duties. | [Payments for Finance Architects: Eleven Reasons the Numbers Disagree](payments-fundamentals.html) |\n| Merchant of record (MoR) | The entity whose name is on the cardholder's statement and that carries the payment side of the sale: refunds and chargebacks. A payments role; whether the entity is principal or agent for revenue is a separate accounting test. | [Payments for Finance Architects: Eleven Reasons the Numbers Disagree](payments-fundamentals.html) |\n| Interchange++ (IC++) / blended pricing | Interchange is the fee the acquirer pays the issuer per card transaction, set by the scheme. IC++ passes interchange and scheme fees through at cost plus an explicit markup; blended pricing charges one rate that hides the cost drivers. | [Payments for Finance Architects: Eleven Reasons the Numbers Disagree](payments-fundamentals.html) |\n| Alternative payment method (APM) | Any non-card payment method, such as a wallet, bank transfer or local scheme. Each needs its own cash-recognition and aging rules. | [Payments for Finance Architects: Eleven Reasons the Numbers Disagree](payments-fundamentals.html) |\n| PSP token / network token | A PSP token stands in for a card inside one provider's vault and works only there; a network token is issued by the card scheme and updated when the card is reissued. Portability is the architect's concern. | [Payments for Finance Architects: Eleven Reasons the Numbers Disagree](payments-fundamentals.html) |\n| Rolling reserve | A percentage of a merchant's funds held back by the provider for a rolling period to cover risk. Reserved funds belong to the merchant but cannot be used. | [Payments for Finance Architects: Eleven Reasons the Numbers Disagree](payments-fundamentals.html) |\n| Presentment currency / settlement currency | The currency the customer is charged in and the currency the merchant is paid in. Foreign exchange can occur at several moments between them. | [Payments for Finance Architects: Eleven Reasons the Numbers Disagree](payments-fundamentals.html) |\n| Company account / merchant account (Adyen) | Adyen's company account represents the business and holds merchant accounts; a merchant account is where payments are processed and paid out, and where reconciliation starts. | [Adyen: One Platform from Checkout to Settlement](adyen.html) |\n| Balance Platform (Adyen) | The structure behind Adyen for Platforms: account holders (with legal entities and KYC data), balance accounts holding funds, transfer instruments for payouts, and split instructions that divide each payment. | [Adyen: One Platform from Checkout to Settlement](adyen.html) |\n| Payable batch (Adyen) | The unit Adyen pays out in: if a batch's payable balance is positive when it closes, Adyen instructs a net payout. | [Adyen: One Platform from Checkout to Settlement](adyen.html) |\n| Settlement details report (Adyen) | Adyen's transaction-level report of every credit and debit in a payable batch, with fees; the primary input for settlement matching. | [Adyen: One Platform from Checkout to Settlement](adyen.html) |\n| PSP reference / merchant reference | The provider's key for a payment and the merchant's own key sent in the payment request. Matching depends on both traveling end to end. | [Adyen: One Platform from Checkout to Settlement](adyen.html) |\n| In-flight receivable / batch receivable / cash in transit | Northmere's three clearing accounts for provider money: captured but unsettled; settled into a batch but not paid out; paid out but not yet credited by the bank. | [Adyen: One Platform from Checkout to Settlement](adyen.html) |\n| Balance transaction (Stripe) | Stripe's record of the effect of any charge, refund, fee, transfer or payout on a Stripe balance, with gross, fee, net and availability date. The reconciliation unit for Stripe. | [Stripe: Every Movement Is a Balance Transaction](stripe.html) |\n| Stripe Connect charge types | Stripe Connect's three ways to charge for a platform: a direct charge on the connected account, a destination charge on the platform with an immediate transfer, or separate charges and transfers. The choice moves fees, refunds and loss exposure. | [Stripe: Every Movement Is a Balance Transaction](stripe.html) |\n| Webhook | A provider's HTTP notification of an event. Treat it as early, not final: verify signatures, expect duplicates, tolerate disorder and confirm against reports. | [Stripe: Every Movement Is a Balance Transaction](stripe.html) |\n| Payments-to-ledger | The design that turns provider records, bank statements and the enterprise's own payment records into complete, matched ledger entries, with clearing accounts that go to zero. | [Payments-to-Ledger: Draining the Suspense Swamp](payments-to-ledger.html) |\n| Three-way match | Proving one payment complete across three independent records (the enterprise's sale record, the provider's settlement line and the bank's statement line) through three joins, each with its own key. | [Payments-to-Ledger: Draining the Suspense Swamp](payments-to-ledger.html) |\n| Expected receivable | The open item created when a payment is captured: what the provider should pay, when, with the keys to match it and an expected settlement date. | [Payments-to-Ledger: Draining the Suspense Swamp](payments-to-ledger.html) |\n| Reconciling item | A known difference on a reconciliation with an explanation, an amount and a date by which it will clear. | [Payments-to-Ledger: Draining the Suspense Swamp](payments-to-ledger.html) |\n| Break | A reconciling item whose expected date has passed without the matching event; an exception someone must investigate. | [Payments-to-Ledger: Draining the Suspense Swamp](payments-to-ledger.html) |\n| Minimum settlement data standard | The settlement-line data Northmere requires payment providers to return so that every line can be matched, written into its provider contracts in 2027. | [Payments-to-Ledger: Draining the Suspense Swamp](payments-to-ledger.html) |\n| Payment factory | A central service that executes outgoing payments: the ERPs decide what to pay and when, the factory decides how. It screens, deduplicates, approves, formats and routes payment instructions to banks and returns status. | [Around the Core: Where Specialist Platforms Earn Their Place](satellite-platforms.html) |\n\n## <a id=\"controls\"><\/a>Controls, Resilience and Regulation\n\nInternal control over financial reporting, audit evidence, operational resilience and the regulations that shape finance data. [Controls by Design, Not by Audit Season](controls-and-auditability.html) owns the control vocabulary; [Recover Before the Close: Resilience and Security for Finance](resilience-and-security.html) owns financial incidents; regulatory specifics sit in the chapters named in each row. Regulatory status is as of 2026.\n\n| Term | Definition | Chapter |\n| --- | --- | --- |\n| Internal control over financial reporting (ICFR) | The processes that give reasonable assurance that financial statements are reliable. Under SOX section 404, management assesses it and, for larger public companies, the auditor attests to it. | [Controls by Design, Not by Audit Season](controls-and-auditability.html) |\n| Sarbanes-Oxley Act (SOX) | The 2002 US law that requires certification of financial reports (section 302) and assessment of internal control (section 404). | [Controls by Design, Not by Audit Season](controls-and-auditability.html) |\n| Key control | A control the company relies on to prevent or detect a material misstatement, and that the auditor tests. | [Controls by Design, Not by Audit Season](controls-and-auditability.html) |\n| Preventive / detective control | A preventive control stops an error before it is recorded; a detective control finds it afterwards. | [Controls by Design, Not by Audit Season](controls-and-auditability.html) |\n| Application control | A control performed automatically by a system, such as a three-way match or a posting validation. | [Controls by Design, Not by Audit Season](controls-and-auditability.html) |\n| IT general controls (ITGCs) | Controls over access, change management, operations and development that let the auditor rely on application controls and reports. | [Controls by Design, Not by Audit Season](controls-and-auditability.html) |\n| Segregation of duties (SoD) | Ensuring no one person can both initiate and approve, or record and conceal, a transaction. Cross-system SoD checks conflicts across platforms, not only within one. | [Controls by Design, Not by Audit Season](controls-and-auditability.html) |\n| Information produced by the entity (IPE) | Any report, query, extract or spreadsheet the company produces and uses to perform a control or as audit evidence. The auditor must be satisfied it is complete and accurate. A key report is IPE that a key control depends on. | [Controls by Design, Not by Audit Season](controls-and-auditability.html) |\n| Evidence by design | Building systems so the evidence that a control operated is produced automatically, completely and immutably as a by-product of operating it. | [Controls by Design, Not by Audit Season](controls-and-auditability.html) |\n| Continuous control monitoring (CCM) | Automated, ongoing testing of control operation across the full population rather than a sample. | [Controls by Design, Not by Audit Season](controls-and-auditability.html) |\n| SOC 1 / SOC 2 | Service auditor reports: SOC 1 covers a vendor's controls relevant to customers' financial reporting (ISAE 3402 internationally); SOC 2 covers security and availability. SOC 2 is not a substitute for SOC 1. A Type I report covers design at a date; Type II covers operation over a period. | [Controls by Design, Not by Audit Season](controls-and-auditability.html) |\n| Complementary user entity controls (CUECs) | Controls the customer must operate for a vendor's controls to achieve their objectives, listed in the vendor's SOC 1 report. | [Controls by Design, Not by Audit Season](controls-and-auditability.html) |\n| Bridge letter | A vendor's statement that no significant changes or failures occurred between the end of its SOC 1 period and a later date. | [Controls by Design, Not by Audit Season](controls-and-auditability.html) |\n| Material weakness / significant deficiency | Under PCAOB AS 2201, a material weakness is a reasonable possibility that a material misstatement will not be prevented or detected in time, and leads to an adverse ICFR opinion; a significant deficiency is less severe but merits governance attention. | [Controls by Design, Not by Audit Season](controls-and-auditability.html) |\n| Compensating control | An additional control that addresses a risk while the normal control is absent or deficient, such as during a waiver. | [Architecture Governance That Speeds Decisions](architecture-governance.html) |\n| Control impact assessment | The record of which key controls a change adds, alters or retires and what evidence each will produce, completed with Internal Controls before the decision. | [Controls by Design, Not by Audit Season](controls-and-auditability.html) |\n| Financial incident | An event in which records or money movements are, or may be, wrong, incomplete, late or unauthorized, whether or not any system is down. Resolved by accounting entries with an approver. | [Recover Before the Close: Resilience and Security for Finance](resilience-and-security.html) |\n| Business observability | Monitoring the correctness of financial outcomes (balances, completeness, aging, invariants) as metrics, not only system health. | [Recover Before the Close: Resilience and Security for Finance](resilience-and-security.html) |\n| Recovery time objective (RTO) / recovery point objective (RPO) | How long a function may be unavailable, and how much recently written data may be lost, before the consequences are unacceptable. Set per function; DORA requires financial entities to determine them. | [Recover Before the Close: Resilience and Security for Finance](resilience-and-security.html) |\n| Point-in-time restore | Returning a database to an earlier moment. For a ledger it is the last resort: it erases good work and evidence; correction by entries is the default. | [Recover Before the Close: Resilience and Security for Finance](resilience-and-security.html) |\n| Safeguarding | The obligation on e-money institutions (such as Northmere Payments B.V.) and payment institutions to protect customer funds, typically in segregated accounts protected from other creditors, under the E-Money Directive. | [Accounting for Architects: Ledgers, Journals and Revenue](accounting-for-architects.html) |\n| PSD2 / PSD3 and PSR | The EU's second Payment Services Directive, in force, which introduced strong customer authentication (SCA), two-factor authentication for most electronic payments; and its proposed successors, the third directive and the Payment Services Regulation, not yet in force as of 2026. | [Payments for Finance Architects: Eleven Reasons the Numbers Disagree](payments-fundamentals.html) |\n| PCI DSS | The Payment Card Industry Data Security Standard for storing, processing and transmitting card data. Tokenization reduces the scope. | [Payments for Finance Architects: Eleven Reasons the Numbers Disagree](payments-fundamentals.html) |\n| Digital Operational Resilience Act (DORA) | Regulation (EU) 2022/2554, applying since 17 January 2025, on ICT risk, incident reporting, resilience testing and third-party risk for financial entities, including payment and e-money institutions. At Northmere it reaches Northmere Payments B.V., not the whole group. | [Recover Before the Close: Resilience and Security for Finance](resilience-and-security.html) |\n| Continuous transaction controls (CTC) | Regimes in which invoice data reaches the tax authority at or near the time of the transaction. Under clearance, a document is not legally an invoice until a government platform accepts it, which puts the invoice on the critical path. | [Around the Core: Where Specialist Platforms Earn Their Place](satellite-platforms.html) |\n| Peppol / four-corner model | An international e-invoicing network in which seller and buyer each connect through an accredited service provider and the providers exchange the document. | [Around the Core: Where Specialist Platforms Earn Their Place](satellite-platforms.html) |\n| VAT in the Digital Age (ViDA) | The EU VAT package in force since 14 April 2025 that phases in digital reporting, e-invoicing and, from 1 July 2028, deemed-supplier status for platforms facilitating short-term accommodation rental and passenger road transport. Deemed-supplier status for VAT does not make a platform the principal for revenue. | [Global by Design: Entities, Currencies, Jurisdictions and Brands](global-scale.html) |\n| Pillar Two | The OECD global minimum tax of 15% per jurisdiction for large groups, which needs an effective-tax-rate dataset per entity and jurisdiction reconciled to consolidation. | [Global by Design: Entities, Currencies, Jurisdictions and Brands](global-scale.html) |\n| EU AI Act | The EU regulation classifying AI systems by risk; most finance-process agents are likely not high-risk, while credit scoring of natural persons is. | [Automate the Work, Not the Accountability](ai-in-finance.html) |\n| Retention | The period for which records and their traceability must stay readable, set by law per record type, such as ten years for German books. Modernization ends at retrievability, not at go-live. | [Changing the Engine in Flight: Modernization Patterns for Finance](modernization-patterns.html) |\n\n## <a id=\"strategy\"><\/a>Strategy and Governance\n\nThe Chief Architect's strategic vocabulary: how decisions are made and recorded, how the target is planned, how vendors, debt and technology spend are managed, and how AI and long-term change are governed. Start with [LEADERSHIP: The Chief Architect's Agenda](part-4.html).\n\n| Term | Definition | Chapter |\n| --- | --- | --- |\n| Architecture governance | The decision system that sets standards, grants waivers and records decisions, sized so that most decisions are taken quickly by teams and only a few go to a board. | [Architecture Governance That Speeds Decisions](architecture-governance.html) |\n| Architecture decision record (ADR) | A short record of one architecture decision: context, options, decision, consequences and status. Proposed by Michael Nygard in 2011; an accepted record is never edited, only superseded. | [Architecture Governance That Speeds Decisions](architecture-governance.html) |\n| Architecture review board | A standing group with authority to approve, reject or condition architecture decisions. It can say no and make it stick, but concentrates decisions in a few calendars. | [Architecture Governance That Speeds Decisions](architecture-governance.html) |\n| Advice process | Andrew Harmel-Law's model in which anyone may take an architecture decision after seeking advice from everyone affected and from relevant experts, and recording that advice. Harmel-Law pairs it with a weekly, open Architecture Advisory Forum. | [Architecture Governance That Speeds Decisions](architecture-governance.html) |\n| Waiver | A recorded, time-limited exception from a mandatory standard, with an owner, a funded exit plan and, where in ICFR scope, a compensating control. At Northmere it expires within 12 months and may be renewed once. | [Architecture Governance That Speeds Decisions](architecture-governance.html) |\n| Design authority | The standing body that holds decision rights over a program's design: target data model, system boundaries, the global template and every deviation from it. Narrower in scope and faster in tempo than a review board. | [The Technology Is the Easy Part: Leading a Finance Transformation](finance-transformation.html) |\n| Architecture principle | A durable statement of how the enterprise intends to build and change its systems, with a name, statement, rationale and implications, used where no standard applies. | [Principles That Decide Things](principles-standards-reference.html) |\n| Standard (architecture) | A specific, mandatory requirement with a scope, owner, version, effective date, conformance checks and a waiver process; how a principle becomes enforceable. | [Principles That Decide Things](principles-standards-reference.html) |\n| Reference architecture | A solution template for a recurring problem in this enterprise: components, responsibilities, interfaces, variation points and the checks that prove conformance. | [Principles That Decide Things](principles-standards-reference.html) |\n| Target state | The described future state of the estate; closer to a hypothesis than a blueprint, resting on assumptions the roadmap tests. | [The Middle Matters: Transition States and the Roadmap](target-and-transition-states.html) |\n| Transition architecture | A formal description of the architecture at an architecturally significant point between baseline and target. | [The Middle Matters: Transition States and the Roadmap](target-and-transition-states.html) |\n| Plateau | A relatively
