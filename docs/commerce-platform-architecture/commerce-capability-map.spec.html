<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/03-commerce-capability-map/index.md) and its former spec.md, whose Non-goals, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter. It is a contract, not a description: the places where the chapter does not yet do what the spec asks are listed under open_questions.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** About two dozen capabilities in six layers and the kind of business fact each one owns.\n- **Know:** The three ways vendors cover the map: suite, platform plus apps, best-of-breed assembly.\n- **Believe:** A capability is a job the business needs done, not a product; drawing jobs first makes gaps and overlaps visible.\n- **Be able to:** Place any system or vendor product on the map and say which capabilities it claims.\n\n**Audience:** Readers new to commerce architecture; most of all the engineer, product manager or analyst who has just joined a merchant and needs to understand what all the software is for, and the consultant or leader who must judge a vendor's proposal.\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side.\n- Roughly what an API, a database and a queue are.\n- Kestrel & Pine, its people and its 2026 incidents, in outline (meet-kestrel-and-pine), and the names of the failure patterns (where-commerce-platforms-go-wrong).\n- From journey-of-an-order: the thirteen steps of an order, promise and handoff, the three status lines, what a system is, 'the shop platform' for the hosted product and 'commerce platform' for the whole set of systems, the seven systems in the order walk at Kestrel & Pine and the thirteen in its full landscape, and PSP, WMS, ERP, iPaaS, EDI, webhook, API call, SKU, channel, marketplace connector, 3PL, order hub and availability service.\n- From commerce-business-models: the business models (D2C, B2B, wholesale, marketplace selling), and the four scale stages (Starting, Growing, Omnichannel, Group).\n\n**Does not yet know:**\n\n- The map's own vocabulary: capability, layer, business fact, flow, natural home, copy, derived fact, writer, write audit.\n- PIM, OMS, POS, ATP (available-to-promise), GTIN, Peppol, BI, GMV.\n- Freshness, consistency (exact or eventual), reconciliation.\n- Suite, hosted SaaS platform, app, best-of-breed, composable, MACH, headless, ERP-centered commerce, specialist group.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a vendor's product description, the reader names the capabilities it covers and one it does not. *Probe:* A vendor says its product 'unifies orders across channels and routes them to the best location'. Which capabilities on the map is that, and which neighbouring capability is not included? | `custom` | cold_reader | major |\n| AC-2 | Given a company that describes its landscape as a list of systems, the reader says why gaps and overlaps cannot be seen in that list and what to draw to see them. *Probe:* A company lists its software: a shop platform, an ERP and a warehouse system, each with a stock field. Using only this chapter: why can the company not tell from that list whether it has a gap or an overlap, and what should it draw to find out? | `custom` | cold_reader | minor |\n| AC-3 | Given a value that is computed from other facts, the reader says that it is derived, what it is computed from, and why editing the result by hand does harm. *Probe:* A support agent wants to type a higher 'available' number for a jacket into the shop's admin screen, because the web page shows fewer than the warehouse has. Using only this chapter: what kind of fact is that number, how is it produced, and what goes wrong if it is edited by hand? | `custom` | cold_reader | minor |\n| AC-4 | The reader names the flows that must be exact in near real time and says what the other flows need instead. *Probe:* Using only this chapter: which movements of facts between systems must be exact almost immediately, and what do the other movements need instead? | `custom` | cold_reader | minor |\n| AC-5 | Given a merchant that is not a vendor, the reader states the author's rule for covering the map and the work that stays with the merchant whichever vendor it picks. *Probe:* A merchant with a web shop, stores, a marketplace channel and its own warehouse asks how it should cover the map with products. Using only this chapter: what is the author's rule, and what work stays with the merchant whichever vendor it chooses? | `custom` | cold_reader | minor |\n| AC-6 | A reader new to commerce meets no term in this chapter before it is explained, and every acronym is expanded on first use. | `known_before_new` | rubric | minor |\n\n## Thesis\n\n**Question:** What are all the parts of a commerce platform, what does each do, and how do they usually connect?\n\n> **Claim:** A commerce platform is best mapped as capabilities, the jobs the business needs done, each owning one kind of business fact; systems are placed on that map afterwards, and no vendor covers all of it.\n\n**Disputed by:** The habit of describing a platform as a list of products or vendors, which hides both the jobs nobody does and the jobs two systems both claim.\n\n**So what:** Where two systems both believe they own a fact is where money leaks; the map is the tool that finds those places before an incident does.\n\n**How and why:** Products bundle and split jobs differently per vendor, so only the jobs are stable enough to compare one landscape with another.\n\n**Supporting claims**\n\n- **S1** — Drawing the jobs first and placing the systems afterwards shows the gaps and overlaps that a list of systems hides.\n- **S2** — The jobs fall into about two dozen capabilities in six layers, and each capability is the natural home of one kind of business fact, recorded or derived, while every other holder keeps a copy.\n- **S3** — A small number of flows join the capabilities, each with its own need for freshness and exactness, and the joins are where copies arrive late, get lost or get duplicated.\n- **S4** — Vendors cover the map in three ways, none covers all of it, and the joins between what they cover stay with the merchant.\n- **S5** — The map stays the same as a merchant grows; what changes is how many boxes need their own system.\n- **S6** — Read against the map, a product page, a landscape or an incident shows which boxes are claimed, empty, written by several systems or held by the wrong one, before the business feels it.\n\n## Role in the part\n\nTurns the journey and the business models into a stable map of jobs, which the ownership chapter then assigns facts on. Supports P1-3 of part `part-1`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `large_to_small` in map: layers, then capabilities, then notes on the table, then the derived facts; `grouping` in three-ways and when-it-goes-wrong: parallel options and parallel failures)\n\nThe chapter builds the map, then uses it twice. Building: the scene shows the method working once, so the reader wants the terms; the definitions come before the map because the map is drawn in them, and placed after it the table's 'fact' column would have no meaning; the flows follow the boxes because an arrow needs two boxes. First use, vendors: the three ways come only after boxes and flows because coverage is measured in boxes and joins, and reading one product page follows directly because it asks of a single product what the three ways asked of a kind of product; with the stages between them, as published, the two vendor sections were split by a section about the merchant. The vendors come before the merchant's own landscape because that landscape is made of bought products: the stage table and the failures speak of shop platforms, apps and suites, which would be unexplained if the order were reversed. Second use, the merchant's own landscape: the stages come first because they say how many boxes should be filled at all; the four failures follow because one of them (the giant's map) is the stage test broken and the others need the 'home', 'copy' and 'writer' of the map; Kestrel & Pine's landscape comes last because its table shows three of the failures at once and its plan uses the repair the failures section names (a single writer per fact). Told before the failures, as published, the plan applied repairs the reader had not met; and ending the body on the whiteboard returns to the scene the chapter started from.\n\n## Introduction\n\n**Hook** (`intriguing_example`): A merchant asks for store pickup. Checkout, the store and the stock system all have to cooperate, and buying a pickup app helps only if the app can get stock reserved and tell store staff what to prepare.\n\n**Bridge:** Anyone who has joined a merchant has heard a request like 'add store pickup' answered with 'there is an app for that'. → The request is a change to several business jobs at once, so the first question is which jobs, and which systems do them today: that is a map of capabilities.\n\n**Thesis statement** (KEY POINTS callout, all three bullets; paragraph p01 defines a capability in prose): A capability is a job the business needs done, not a product; every capability owns one kind of business fact; draw the map in capabilities first and place systems on it, and no vendor covers all of it.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p03, the last paragraph of the introduction):\n\n- Start from the whiteboard on which Kestrel & Pine drew its jobs before its systems. *Kept in:* scene.\n- Define the terms, then lay out about two dozen capabilities in six layers with the fact each one owns. *Kept in:* capability, map.\n- Add the flows that connect the capabilities. *Kept in:* flows.\n- Place vendors on the finished map: the three ways products cover it, and how to read one product page against it. *Kept in:* three-ways, reading.\n- End with a merchant's own landscape: how many boxes need their own system at each scale stage, the four ways a landscape goes wrong on the map, and Kestrel & Pine's thirteen systems placed box by box. *Kept in:* stages, when-it-goes-wrong, in-practice.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A request such as store pickup needs several systems to cooperate, so working out what must change starts from the business jobs involved; a capability is one such job, and several systems may contribute to it. | scenario: A merchant asks for store pickup: checkout, the store and the stock system must cooperate, and a pickup app helps only if it can get stock reserved and tell store staff what to prepare. |  |\n| p02 | claim | Without a shared view of which capability must change, which system handles it and who depends on its answer, teams buy overlapping tools and leave the handoff between them unowned. | scenario: Kestrel & Pine reached 34 integrations and 41 apps through individually reasonable decisions. | `similarity`: Starting from the business jobs involved. → Two further requests, the three questions the approach asks, and what happens without a shared view. |\n| p04 | context | Each step Eva's jacket passed through in the previous chapter is a capability on the map this chapter draws, and each handoff is a connection that someone must build and own. |  | `example`: Capabilities, the systems that handle them and the handoffs between them. → The order from journey-of-an-order, whose steps are capabilities and whose handoffs are connections. |\n| p03 | transition | The chapter draws the shared view as a map: it starts from Kestrel & Pine's whiteboard, defines the terms, lays out the capabilities in six layers with the fact each owns, adds the flows, places vendors on the finished map (the three ways products cover it, and how to read a product page), and ends with a merchant's own landscape (how many boxes need their own system at each stage, the four ways a landscape goes wrong, and Kestrel & Pine's systems placed box by box). |  | `sequence`: The need for a shared view of capabilities and connections, now tied to the order the reader already followed. → The map as the shared view, the order in which the chapter builds and uses it, and the two chapters that take over from it. |\n\n## Sections\n\n### Setting the Scene at Kestrel & Pine: A Whiteboard in February 2027\n\n**Controlling idea** (`example`, id `scene`): Drawing the jobs needed to sell a jacket before placing the thirteen systems showed Kestrel & Pine, within an hour, the gaps and overlaps that five years of buying systems one at a time had hidden.\n\n**Advances the thesis** (S1): Shows the method working once, at one company, before any term is defined.\n\n**Transition in:** `example`: The claim that a shared view of the jobs must come before the systems. → The morning one company drew that view, and what it showed.\n\n**Order of paragraphs** (`chronological`): January's scattered knowledge, February's whiteboard, what it showed within the hour, March's program: told in any other order the findings would come before the method that produced them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | context | In January 2027 Kestrel & Pine had thirteen systems and no shared picture of them: the integrations, the apps and what reached the ERP were each known to a different person. | scenario: Ruben Alves tracked the 34 integrations, Milan Petrov knew the 41 apps, Sanne de Wit knew what reached the ERP. |  |\n| p06 | example | Noor drew the jobs needed to sell a jacket first and placed the thirteen systems into those boxes only afterwards, and starting with the jobs made the gaps visible. | scenario: The jobs on the whiteboard: show the jacket, price it, check stock, take the order and payment, pick, ship, accept a return, invoice and count the sale. | `time`: Thirteen systems and no shared picture. → The whiteboard, drawn jobs first. |\n| p07 | evidence (list) | Within an hour the whiteboard showed four empty boxes (product information and order management, then customer identity and availability, which had no owner either, with the delivery promise unowned in a smaller way) and one box with six writers (warehouse stock), a writer being any system, app or person that can change a fact. | scenario: No PIM and no OMS; warehouse stock written by the WMS feed, by hand in the ERP, by hand in the platform and by three apps, with the POS writing store stock separately; the Black Friday Oversell of November 2026 (1,340 units oversold, 1,120 orders canceled or delayed, about €96,000) and the App That Wrote Stock of March 2026 (phantom reservations on 600 variants) both on that box. | `cause_effect`: Jobs drawn first, systems placed afterwards. → What became visible: empty boxes, a box with six writers, boxes with no owner. |\n| p08 | transition | The whiteboard became the first working document of the Waypoint program approved in March, and the rest of the chapter is that whiteboard, generalized. |  | `sequence`: What the whiteboard showed. → What it became, and that the chapter now generalizes it. |\n\n### What a Capability Is, and Why It Comes Before the Systems\n\n**Controlling idea** (`definition`, id `capability`): A capability is a job named without reference to who does it, and because systems overlap while jobs do not, only a map drawn in capabilities shows overlaps and gaps.\n\n**Advances the thesis** (S1): Gives the whiteboard's boxes and arrows exact names and says why the jobs are drawn first.\n\n**Transition in:** `elaboration`: The whiteboard's boxes, drawn before the systems. → Exact terms for what was drawn: capability, system, vendor product, business fact, flow.\n\n**Order of paragraphs** (`prerequisite_order`): The reason for drawing capabilities first needs the capability and system definitions; facts and flows are defined last because a fact is what a capability keeps and a flow runs between two capabilities.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | definition | A capability is a job the business needs done, named without reference to who does it; a system is software that does one or more such jobs, and a vendor product is a system someone sells, usually claiming several capabilities at once. |  |  |\n| p10 | explanation | The distinction matters because systems and vendor products overlap and capabilities do not: drawn in capabilities, an overlap shows as one box with two names and a gap as an empty box, while drawn in systems both are invisible. | example: The ERP, the WMS and the shop platform all have a stock field, yet there is one job called 'know what is physically on the shelf'.; figure: Figure 1: three systems that each look complete beside a grid of capability boxes where one box has three names and another is empty. | `cause_effect`: Capability, system and vendor product as three different things. → Why the map is drawn in capabilities. |\n| p11 | definition | A business fact is something the business needs to be true about the world and a flow is the movement of a fact, or a request about it, from one capability to another, so the map is boxes and arrows. |  | `additional_support`: Capabilities as the boxes of the map. → The two remaining terms: business fact and flow. |\n\n### The Map: Six Layers\n\n**Controlling idea** (`description`, id `map`): About two dozen capabilities fall into six layers, and each capability is the natural home of one kind of business fact, recorded or derived, while some capabilities hold copies by design.\n\n**Advances the thesis** (S2): Lays out the map itself: the layers, the capabilities and the fact each one is the home for.\n\n**Transition in:** `sequence`: The vocabulary of boxes, facts and arrows. → The boxes themselves, in six layers.\n\n**Order of paragraphs** (`large_to_small`): After a paragraph on where the map comes from: layers, then the capabilities in them, then three notes on reading the table (two rows, one column, the entries marked as copies), then the derived facts; the notes cannot come before the table they explain, the notes on home and copy sit next to the derived facts because all three are about where a fact lives, and the derived facts come last because they are the exception to the table's rule that a fact is recorded in its home.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p12 | context | The map is the author's synthesis from the specialist vendors' own product descriptions and several product families' capability inventories; it is a teaching map, not a standard. |  |  |\n| p13 | description | A layer is a group of capabilities that share a purpose and a rhythm, and from the shopper inward the six layers are experience, offer, transaction, operations, partners and back office, and foundations. | figure: Figure 2: six layers of a commerce platform and the directions in which they feed each other. | `elaboration`: The six-layer map. → What a layer is and what each of the six is for. |\n| p14 | description | For each capability the table gives the job in plain words, the business fact it is the natural home for and the chapter that works it out, and the one-line jobs are enough to place a system. | table: Twenty-four capabilities in six layers: layer, capability, the job in plain words, the fact it is the natural home for, the chapter that owns it. | `elaboration`: The six layers. → The twenty-four capabilities inside them, one row each. |\n| p15b | explanation | Business-to-business ordering has two rows of its own in the table, the B2B buyer experience and EDI and e-invoicing, because it is a capability in its own right and not an add-on to the web shop. | statistic: Eurostat's 2024 figures put EDI-type sales at 11.07% of EU enterprise turnover against 8.39% for web sales, as commerce-business-models showed. | `elaboration`: The table of capabilities. → The first of three notes on reading it: why business-to-business ordering has its own rows. |\n| p15 | explanation | The 'natural home' column says which system should hold a fact when two systems both hold it: the home is the one system that should write the fact; how to make that decision stick is the next chapter's subject. |  | `additional_support`: A note on two of the table's rows. → A note on its 'natural home' column. |\n| p15a | explanation | Several capabilities (the search index, the service view, the marketplace listing, the data warehouse) hold copies by design, which is safe as long as everyone knows they are copies and they are rebuilt from the home, never edited in place. | figure: Figure 3: the capability map as a poster, twenty-four boxes in six bands, with search, service, marketplaces and analytics dashed as copies. | `contrast`: The natural home of a fact and its writer. → The entries marked 'a copy' and the rule that makes a copy safe. |\n| p16 | definition | Some capabilities own a calculation, not a record: availability is computed as available-to-promise, stock on hand minus commitments to unshipped orders minus any buffer held back. |  | `contrast`: Facts that are recorded in a home and copied elsewhere. → Facts that are computed from other facts. |\n| p17 | explanation | A derived fact needs one owner for its calculation whichever product runs it, because editing the result by hand bypasses the calculation and lets the storefront promise what the warehouse cannot deliver. | example: The delivery promise combines cut-off times, carrier lead times and location in the same way.; figure: Figure 4: on hand minus already promised minus buffer equals what a channel may sell. | `cause_effect`: Availability as a calculation. → Who owns a calculation, and what a hand edit does to it. |\n\n### How the Pieces Talk: The Typical Flows\n\n**Controlling idea** (`analysis`, id `flows`): Eight typical flows carry facts between capabilities, each with its own need for freshness and exactness, and the joins they form are where commerce platforms fail.\n\n**Advances the thesis** (S3): Adds the arrows to the boxes and says which of them must be exact and fast.\n\n**Transition in:** `additional_support`: The boxes of the map. → The arrows between them and what each must guarantee.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The opening sentence asserts that the arrows differ in rhythm, the table is the evidence, the two patterns are read from it, and the closing claim about the joins needs all three; stated first, that claim would have nothing under it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | description | The arrows carry a small number of fact types, each with its own rhythm: eight flows almost every merchant above the first stage runs, each with a direction, a freshness need, a consistency need and a consequence when it is slow or down. | table: Eight flows (product content, prices, stock and availability, orders, payments, shipments and tracking, returns and refunds, finance) with from and to, freshness needed, consistency, what happens if slow and if down. |  |\n| p19 | analysis | Two patterns stand out in the table: only prices, orders and payments need exactness in near real time while everything else tolerates lag if a reconciliation stands behind it, and finance works in periods, not seconds. | figure: Figure 5: product, price and availability flow outward to the channels; orders flow inward and down to the warehouse; stock, shipments and returns flow back; finance receives a daily batch. | `conclusion_summary`: The eight flows and their requirements. → The two patterns in them. |\n| p20 | claim | Every arrow is a place where one system's fact becomes another system's copy, and a copy can be late, lost or duplicated, which is why the joins, not the boxes, are where commerce platforms fail. |  | `cause_effect`: The flows and their different requirements. → The joins as the place where failures happen. |\n\n### Three Ways to Cover the Map\n\n**Controlling idea** (`comparison`, id `three-ways`): No vendor sells the whole map: a suite, a platform plus apps and a best-of-breed assembly each cover part of it, and each leaves joins to the merchant.\n\n**Advances the thesis** (S4): Places vendors' products on the map and shows what each way of buying leaves uncovered.\n\n**Transition in:** `sequence`: The whole map, boxes and arrows. → How products that can be bought cover it.\n\n**Order of paragraphs** (`grouping`): The three ways in parallel, from most covered by one vendor to least, then the two variants, then the comparison of the three ways and the specialist group on one table, then the rule; the rule comes last because it is read off the comparison, and the comparison needs its four options described first.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p21 | claim | No merchant builds the whole map and no vendor sells all of it; in practice it is covered in one of three ways, often mixed. |  |  |\n| p22 | description | A suite supplies most of the experience, offer and transaction layers in one vendor's data model, so the joins inside the covered boxes are the vendor's problem, while the warehouse, the carriers, the PSP, the marketplaces, the EDI partners and the ERP stay outside. | source: Salesforce described its Agentforce Commerce release of 6 July 2026 as one platform across B2C, B2B, point of sale and order management.; source: Adobe's October 2026 information center lists three ways to run Adobe Commerce and a separate SaaS, Commerce Optimizer, that can work alongside a third-party commerce backend. | `example`: Three ways to cover the map. → The first: a suite. |\n| p23 | description | A platform plus apps covers the center of the map (storefront to basic order handling) cheaply and well and rents the rest from many small vendors, each writing into the merchant's data, and leaves the operations and partner layers for the merchant to assemble. | source: Shopify's pricing page in November 2026 lists plans from €28 to a Plus tier 'from €2,100' a month, with lower card rates on higher tiers.; statistic: Lightspeed's fiscal 2026 transaction-based revenue was $815.1 million against subscription revenue of $370.7 million.; fact: Shopify completed the sale of most of Shopify Logistics to Flexport on 6 June 2023.; scenario: Kestrel & Pine's 41 apps, three of them writing stock. | `contrast`: One vendor covering many boxes. → A platform that covers the center and rents the edges as apps. |\n| p24 | description | Best-of-breed, or composable, buys one product per box, each best in its class and replaceable, and its cost is the joins. | fact: The MACH Alliance was founded in June 2020 by commercetools, Contentstack, EPAM and Valtech.; quotation: Manhattan: an OMS is a platform 'designed to track and manage the lifecycle of an order from start to finish'; Akeneo: a PIM is a system 'to centralize, manage, enrich, and distribute product information for commerce'.; statistic: The Alliance's February 2026 survey of 600 enterprise technology leaders found 37% naming integration complexity as a primary concern.; figure: Figure 6: the same grid covered by one suite block, by a platform block with app tiles, and by one product per box joined by many lines. | `contrast`: A platform that covers the center. → One product per box, joined by APIs and an integration platform. |\n| p25 | description | Two variants are worth naming: ERP-centered commerce, which makes the ERP the center and the storefront a front end, and a specialist group, which pre-integrates several best-of-breed products under one owner. | source: Microsoft's documentation of 22 September 2026 says its Business Central Shopify Connector 'is preinstalled for all new sign-ups and trials'.; case: Katapull, a Dutch group: five companies joined forces on 31 March 2025; on 7 October 2026 a WMS vendor became its eighth label. | `additional_support`: The three main ways. → Two variants of them. |\n| p26 | comparison | Set side by side, the three ways and the specialist group differ in which boxes one vendor covers, where the joins live, who defines 'order' and 'product', the shape of the cost, the time to a first sale, whom each fits and where each limits; ERP-centered commerce has no column because it combines a hosted storefront with an ERP and is not a separate way of buying. | table: Trade-offs of suite, platform plus apps, best-of-breed and specialist group: boxes covered by one vendor, where the joins live, who defines 'order' and 'product', cost shape, time to first sale, fits, limits. | `conclusion_summary`: The three ways and the two variants, described one by one. → The same options compared on the same seven rows. |\n| p26a | recommendation | The author's rule for a merchant that is not a vendor is to cover the center with one product it does not customize, cover operations with products built for operations, and own the joins itself. | scenario: Kestrel & Pine's Waypoint decision W4: stay on the SaaS shop platform and surround it with an OMS, a PIM and an availability service. | `cause_effect`: The trade-offs, where every column leaves joins to the merchant. → The author's rule, and Kestrel & Pine's decision as that rule applied. |\n\n### Reading a Vendor's Product Page Against the Map\n\n**Controlling idea** (`process`, id `reading`): The map turns a vendor's feature list into three questions: which boxes the product claims, which facts it owns or copies, and what unit is behind its numbers.\n\n**Advances the thesis** (S6): Gives the reader the procedure for placing a vendor product on the map.\n\n**Transition in:** `cause_effect`: No vendor covers the whole map, so every product is a claim on some of its boxes. → A procedure for reading one product's page: which boxes, which facts, which unit.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p29 | process (list) | A product page lists features, and the map turns the list into three questions: which boxes the product claims, which fact it owns and which it copies, and what unit is behind its numbers. | example: A channel-integration product that claims 'order management' usually imports marketplace orders and pushes status back; a platform that claims 'inventory' usually holds a stock number per location.; quotation: Fluent Commerce, an OMS vendor: 'your ERP stays the system of record'.; statistic: '1,300 marketplaces' (ChannelEngine, November 2026); '4,500+ customers' and '27,500+ users' (Katapull); Shopify's 2025 GMV of about $378 billion against revenue of about $11.6 billion.; figure: Figure 7: a brochure read through a magnifying glass that leads to three question cards. |  |\n| p30 | transition | The same three questions apply to the systems a company already has, and the remaining sections turn from vendors to a merchant's own landscape. |  | `similarity`: Three questions for a vendor's page. → The same questions for one's own systems, which the rest of the chapter takes up. |\n\n### Across Scale Stages: When It Fits and When It Limits\n\n**Controlling idea** (`analysis`, id `stages`): The map does not change with scale; what changes is how many boxes have their own system, and a box deserves one when its capability has more than one producer and more than one consumer and its present holder cannot carry the workflow.\n\n**Advances the thesis** (S5): Says when a box needs its own system, so the map is not read as a shopping list.\n\n**Transition in:** `contrast`: Vendors' products, read against the map. → The merchant's own landscape, and the first thing to ask of it: how many boxes should have their own system at its stage.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p27 | description | The map stays the same across the four scale stages while the number of boxes with their own system grows, from three or four at Starting to twelve or more at Omnichannel, with some boxes shared across brands at Group. | table: Four stages: boxes with their own system, typical shape, warning sign that the shape is ending. |  |\n| p28 | recommendation | The producer-and-consumer test: a box should get a dedicated system when its capability has more than one producer and more than one consumer and the system that holds it today cannot carry the workflow. | scenario: Kestrel & Pine is at stage 3 with four boxes still empty.; example: A PIM is unnecessary at stage 1 and overdue at stage 3 with four channels; an OMS is overkill with one channel and one warehouse and overdue the day a second order source appears.; figure: Figure 8: four copies of the same map on rising steps, with more boxes filled at each. | `example`: Boxes filled per stage. → Kestrel & Pine's stage and the test for filling a box. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`analysis`, id `when-it-goes-wrong`): A landscape goes wrong on the map in four ways (an overlap, a gap, a box held by a system bought for another box, and a map copied from a giant), and each is visible on the map before it shows in the business.\n\n**Advances the thesis** (S5, S6): Generalizes Kestrel & Pine's marks into four failures a reader can look for, each with how to detect it.\n\n**Transition in:** `contrast`: How many boxes a landscape should fill at its stage. → The four ways a landscape gets the filling wrong, each with how it is detected on the map.\n\n**Order of paragraphs** (`grouping`): Four parallel failures: the two about ownership first (too many owners, none), then the two about fit (a system in the wrong box, a map for the wrong size).\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p33 | claim | The map fails in four ways, and each shows up on the map before it shows up in the business. | figure: Figure 9: four small maps labeled Overlap, Gap, Wrong box and Giant's map. |  |\n| p34 | example | An overlap is two systems owning one fact; it is found by a write audit that lists every system, app, script and person that can change the fact, and repaired by naming a single writer and re-publishing the fact from it. | scenario: The App That Wrote Stock: a pre-order app adjusted inventory in the platform while the WMS feed also wrote it; 600 variants carried phantom reservations for two weeks. The first weekly reconciliation in May 2027 found 2.3% of active variants with a different quantity between the WMS and the platform (illustrative). | `example`: Four failures. → The first: an overlap. |\n| p35 | example | A gap is a fact nobody owns; it fills itself with spreadsheets and copies that start acting as records, shows as the empty box, and is repaired by naming a home before buying a system for it. | scenario: Kestrel & Pine's product content lived in four places and its order status in four. | `contrast`: A fact with two owners. → A fact with none. |\n| p36 | example | A box held by a system that was bought for a different box works at the stage it was bought in and becomes the bottleneck later; it is found by comparing the box the system was bought for with the boxes it now holds, and repaired by giving the box to a system built for it. | scenario: Kestrel & Pine's ERP holds purchasing, the ledger, the item master, manual wholesale orders and the stock master: five jobs, two of them badly. | `additional_support`: Facts with too many owners or none. → A fact owned by a system bought for something else. |\n| p37 | example | A map copied from a far larger company gives a stage-2 merchant a system per box and a platform team to run them; the boxes are the same, the number of systems that should fill them is not, and a box that fails the producer-and-consumer test stays inside the shop platform. | example: A merchant at stage 2 that draws a stage-4 map has bought the Giant's Boots; below the producer-and-consumer test the box stays inside the platform. | `contrast`: Boxes held badly. → Boxes filled that did not need filling. |\n\n### In Practice: Kestrel & Pine's Systems on the Map\n\n**Controlling idea** (`example`, id `in-practice`): Placed on the map, Kestrel & Pine's thirteen systems leave four boxes empty and several with more than one writer, and the Waypoint decisions are a plan to fill the first and thin the second.\n\n**Advances the thesis** (S1, S6): Applies the map to one landscape and shows every 2026 incident on an empty or over-written box.\n\n**Transition in:** `example`: The four failures and how each shows on the map. → One whole landscape, Kestrel & Pine's thirteen systems placed box by box, where the first three failures are all found.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p31 | evidence | Noor's February whiteboard as a table, reduced to the boxes that were not simply covered, shows the four empty boxes, the boxes with several writers and the systems doing jobs they were not bought for, each with what it cost. | table: Thirteen rows: capability, system in January 2027, status on the map; product information, order management, availability and identity are empty; pricing has three writers (the Price Drift, €179 for nine days, about €8,200 lost); refunds issued by hand in the PSP console (the Double Refund, €19,400); the ERP does five jobs; 62% of wholesale orders through the portal and 38% keyed by hand; 34 integrations.; figure: Figure 10: Kestrel & Pine's thirteen systems fill most of the map, but four boxes have no system. |  |\n| p32 | analysis | The Waypoint decisions read as a plan to fill the empty boxes and thin the overlaps: a PIM, an OMS with an availability service as one of its modules, the WMS as the single writer of physical stock, and integration standards for the arrows, with identity still open. | scenario: W3 (PIM, Q3 2027), W1 and W2 (OMS with an availability service, Q4 2027; the WMS as single writer of physical stock), W5 (integration standards). | `cause_effect`: Empty boxes and overlaps. → The decisions that answer them. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The boxes, the arrows and the vendors' coverage are one argument made three times: a fact has one natural home, every other holder is a copy fed by a flow, and a product is a claim on some boxes that leaves the flows between them to the merchant. So three marks on the map (an empty box, a box with more than one writer, a box whose fact is derived) say both where a landscape will fail and what no purchase will fix.\n\n**So what:** A reader who draws the jobs first finds the places where two systems both believe they own a fact, or none does, before an incident finds them, and reads a vendor's page for what it leaves to the merchant.\n\n**Callback:** The store-pickup request of the opening, where a pickup app helps only if it can get stock reserved and tell store staff what to prepare. The reader can now say why in the chapter's terms: pickup is several boxes (cart and checkout, inventory and availability, store operations) and the flows between them, and an app is a claim on one box at most.\n\n**Takeaway** (`course_of_action`): Draw the map in capabilities before systems, mark the empty boxes, the boxes with more than one writer and the boxes whose fact is derived, and take the nine questions to a design review, a vendor demo or the first week in a new company.\n\n**Hand-off** to [Who Owns the Truth: Boundaries, Bounded Contexts and Systems of Record](boundaries-and-systems-of-record.html): `contrast`: The capability map, which says what the parts are and what each should own. → What happens when two parts hold the same fact and disagree, which the map alone cannot settle.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p37a | synthesis | The store-pickup request of the opening is several boxes and the flows between them, so a pickup app is a claim on one box at most; the same holds for the whole map (a fact has one natural home, every other holder is a copy fed by a flow, and a product covers boxes and leaves the flows between them to the merchant), which is why the map is worth drawing before anything is bought. | reasoning: The opening's request set against the map: pickup needs checkout to take the order, availability to reserve the stock and store operations to tell the staff, and the flows between them. |  |\n| p38 | synthesis (list) | Established: a commerce platform is a set of capabilities spread over several systems, no vendor covers the whole map, and business-to-business ordering is a first-class capability. | statistic: By Eurostat's 2024 figures, EDI-type sales are a larger share of EU enterprise turnover than web sales (the figures are in the map section). | `elaboration`: The chapter's answer in one paragraph. → The points it rests on, sorted by how settled they are, starting with what the public record establishes. |\n| p39 | synthesis (list) | Depends on context: how many boxes get a dedicated system, which of the three ways fits the team, and whether a specialist group is a good deal. |  | `contrast`: What the public record settles. → What changes with the merchant's stage, shape and team. |\n| p40 | recommendation (list) | The author's synthesis: draw the map in capabilities before systems and mark empty boxes, boxes with more than one writer and boxes whose fact is derived; for a merchant that is not a vendor the durable shape is a center it does not customize, operations products built for operations, and joins it owns. |  | `contrast`: What is established and what depends on context. → The author's own judgement, labelled as such. |\n| p41 | recommendation (list) | Nine questions let the reader apply the map in a design review, a vendor demo or a first week. |  | `cause_effect`: The take-aways. → Questions that apply them. |\n| p42 | transition | The map says what the parts are and what each should own; it does not yet say what happens when two parts hold the same fact and disagree, which is the subject of the next chapter. |  | `contrast`: The capability map, which says what the parts are and what each should own. → What happens when two parts hold the same fact and disagree, which the map alone cannot settle. |\n\n## Non-goals\n\n- Deciding which system is the record when several hold a fact. See [Who Owns the Truth: Boundaries, Bounded Contexts and Systems of Record](boundaries-and-systems-of-record.html).\n- Vendor categories, pricing models and the market timeline. See [Suites, SaaS, Open Source and Composable: The Platform Landscape in 2026](commerce-platform-landscape.html).\n- The economics of suite versus assembly; the stages as a model. See [Build, Buy or Assemble: Choosing and Changing Platforms](build-buy-or-assemble.html), [What Changes at Each Scale: From First Store to Group](commerce-scaling-stages.html).\n- The internals of any single capability; each row of the capability table links to the chapter that owns it.\n- Integration styles and reliability. See [Part VI — INTEGRATION: Making Separate Systems Behave Like One](part-6.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- The six-layer grouping is the author's; the Domain Coverage page may want to reconcile it with the Productscape model families' own groupings.\n- 'Store operations' and 'point of sale' are listed as two capabilities that share one fact (store stock); a reviewer may prefer to merge them.\n- The flows table's freshness figures are judgement; inventory-and-availability and pricing-architecture may tighten them.\n- Thesis rubric (a reader given only the thesis object, 2026-11-12): FAIL on 'answers the question'. The question has three parts (what the parts are, what each does, how they connect) and the claim says nothing about how they connect; it is also a claim about how to map a platform where the question asks for an inventory. The reader's other remarks: disputed_by is worded against the view it states ('habit', 'which hides'), and 'best mapped' is the claim's one evaluative word. The thesis is copied from the journal spec and was not changed here; the author decides there whether to add the flows to the claim or reword the question.\n- Flow rubric note not taken: the author's-synthesis list (p40) holds two ideas and its second bullet repeats the rule of p26a. Kept, because the three-tier take-away (established, depends on context, the author's synthesis) is the book's house format and the rule is the chapter's recommendation.\n- Flow rubric note not taken: the layer definition's 'a purpose and a rhythm' is only half paid when the layers are listed (each gets a purpose; rhythm gets content in the flows section). The definition moved to the layers paragraph (p13) and the author's wording is kept.\n- Second flow run (sound with notes), note not taken: work the store-pickup request through in the body, for instance as a pickup app's product page read with the three questions, so that the conclusion's 'one box at most' is earned there. Not done because it would add a worked example the author did not write; the conclusion places the request on the map in two sentences.\n- Round 1 of the draft check, for the author to confirm: both flow readers asked why ERP-centered commerce has no column in the trade-off table. The chapter now says it has none because it combines a hosted storefront with an ERP and is not a separate way of buying; that reason is inferred from the Microsoft lows are synthesis, and the chapter says so rather than borrowing authority from a reference that does not describe this map. Rejected: Citing a reference model that does not describe this map.\n\n## Sources\n\n- **Internal**\n  - _research/scenario-ledger.md — Systems landscape, incidents, Waypoint decisions.\n  - _research/brief-platform-landscape.md — Platform categories, specialist layers, MACH, pricing, vendor-claim units, Katapull public facts.\n  - _research/brief-commerce-business-models.md — Eurostat EDI figure, when OMS, PIM and WMS are introduced.\n  - _research/productscape-digest.md — Cross-model capability inventory, used as a checklist of capabilities only.\n  - meet-kestrel-and-pine, journey-of-an-order, commerce-business-models, boundaries-and-systems-of-record, commerce-platform-landscape — Neighbors: what the reader already knows and what is left to later chapters.\n- **External**\n  - Salesforce press release (2026-07-06); Adobe Commerce platform and services page (2026-10-21) — The suite's coverage in the vendors' own words.\n  - Shopify pricing (accessed 2026-11); Shopify Logistics sale (2023-06-06); Shopify Q4 2025 results (2026-02-11); Lightspeed FY2026 results (2026-05-21) — Hosted-platform pricing, the retreat from logistics, payments revenue, GMV against revenue.\n  - Microsoft Business Central Shopify Connector documentation (2026-09-22) — ERP-centered commerce as a mainstream small-merchant shape.\n  - Manhattan Associates, 'What is an OMS'; Akeneo; Fluent Commerce; ChannelEngine (all n.d., accessed 2026-11) — Specialist vendors' definitions of their own boxes; a stated system-of-record boundary; a connector-count claim.\n  - Katapull pages (accessed 2026-11) and Dutch IT Channel (2025) — The specialist-group shape, from public pages only.\n  - EPAM MACH founding release (2020-06-24); MACH Alliance Enterprise Technology Report (2026-02-18) — The MACH Alliance's founding and the 37% integration-complexity figure.\n  - Eurostat, E-commerce <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
