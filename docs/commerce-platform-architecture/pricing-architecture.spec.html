<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/07-pricing-architecture/index.md) and its former spec.md, whose Non-goals, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter. It is a contract, not a description: the places where the chapter did not do what the spec asks are listed under open_questions and decision_log.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** What a price is made of: price lists and the dimensions (market, currency, customer group, channel, quantity, validity, tax basis) on which candidates differ.\n- **Know:** The selection rule, the moment of selection, and the difference between the engine that selects a price and the copies that show it.\n- **Know:** The two EU rules that make price history a legal record: tax-inclusive consumer prices and the lowest price of the previous 30 days.\n- **Believe:** A price is the result of a rule applied at a moment, not a number stored on a product.\n- **Believe:** A copy of a price is a promise made on the source's behalf, so it needs a source, an effective date and a comparison.\n- **Be able to:** For one product at their own company, list every system that holds a price and name the source for each kind of price.\n- **Be able to:** Say, for a given channel, whether it can call the pricing engine or must receive a copy, and what the copy then needs.\n\n**Audience:** Readers new to commerce architecture; most of all the engineer or product manager who owns a storefront, a marketplace connector or an ERP integration and has to say where a price comes from, and the finance or merchandising lead who has to answer for a campaign price or an announced reduction.\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side, and roughly what an API, a database and a file export are.\n- From Part I: the thirteen steps of an order, promise and handoff, what a system is, 'the shop platform' for the hosted product and 'commerce platform' for the whole set of systems, Kestrel & Pine's systems, people and ten incidents in outline, the business models and the four scale stages, the capability map, system of record, single writer, events, idempotency and reconciliation, the Waypoint decisions W1 to W8 and the sixteen failure-pattern names.\n- Glosses already given: PSP, WMS, ERP, iPaaS, EDI, webhook, API call, SKU, channel, marketplace connector, 3PL, order hub and order management system, availability service, D2C, B2B, PIM, POS.\n- From product-information: a product, its variants and its two identifiers, one owner per attribute, and syndication of product data to channels.\n\n**Does not yet know:**\n\n- Price list, base price, customer-specific price, contract price, tiered price, quote.\n- The price selection rule, the moment of selection, and the difference between the pricing engine and the copies of a price.\n- Tax-inclusive and tax-exclusive prices, the One Stop Shop, converted and fixed prices per market.\n- The EU prior-price (30-day) rule, price parity, price control mechanisms, the Buy Box, a repricer, a price event, a price floor.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a channel that still shows an ended campaign price, the reader names a lost or dropped update to a copy as the failure and a scheduled comparison of copy against source as what detects it. *Probe:* A campaign price ended yesterday, but one country's storefront still shows it. Using only this chapter: what failed, and what would have caught it the next morning? | `custom` | cold_reader | major |\n| AC-2 | The reader can say at which moment the charged price is selected and what the invoice and a later refund use. *Probe:* A shopper puts a jacket in the cart during a campaign and checks out after the campaign has ended. Using only this chapter: which price is charged, and which price does the invoice show? | `custom` | cold_reader | major |\n| AC-3 | The reader can say what a pricing system must be able to answer before a price reduction is announced in the EU. *Probe:* A merchant in the Netherlands plans to announce '20% off' next week. Using only this chapter: what must its pricing system be able to answer first, and why? | `custom` | cold_reader | minor |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict the chapter's sections and the kind of evidence it uses. *Probe:* After reading only the introduction: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as sections[].paragraphs[]. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-6 | A reader new to commerce meets no term in this chapter before it is explained, and every acronym is expanded on first use. | `known_before_new` | rubric | minor |\n| AC-7 | Given a merchant with consumer and wholesale prices, the reader names the arrangement the chapter recommends, the assumptions it rests on and when a separate pricing service is the better answer. *Probe:* A merchant sells to consumers in three euro countries through its own web shop, six stores and three marketplaces, and to wholesale customers on contract prices that its ERP invoices. Using only this chapter: where does the author say each kind of price should live, what does that recommendation assume, and when would a separate pricing service be the better answer? | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** Where should a price be computed, and how do you keep it consistent across storefronts, stores, marketplaces and wholesale?\n\n> **Claim:** A price should be computed by one written, deterministic rule that selects it from the valid candidates, and each kind of price (consumer, wholesale) should have one source system, the system in which the team that sets that kind of price works; the price is selected once, at order placement, and frozen on the order for the invoice and any refund to copy. A channel that can call the rule at the moment of sale, such as the merchant's own storefront, calls it; a channel that cannot (a marketplace listing, a store till that must work offline, a wholesale customer's electronic order) receives a copy, and the copies stay consistent only if each carries its source and an effective date and is compared with that source every day, with each difference listed for a person to correct.\n\n**Disputed by:** The view that a price is a number stored on the product, so that keeping channels consistent means typing or pushing the same number into every system, and pushing it more often when they disagree.\n\n**So what:** Kestrel & Pine's German storefront sold at €179 instead of €199 for nine days, on 410 orders, at a cost of about €8,200, because the update that should have restored the price failed and nothing compared the channels. With a dated campaign row and a daily comparison the difference is on a list the next morning; and a merchant that keeps dated prices can answer the EU's question about the lowest price of the last 30 days.\n\n**How and why:** One SKU has several valid prices that differ by market, customer group, channel, quantity and validity, so only a rule can pick one; two systems that apply different rules, or the same rule at different moments, charge different amounts for the same sale. A pushed price change can be lost without an error in the sender or the receiver, so a missing update is found only by comparing the copy with the source.\n\n**Supporting claims**\n\n- **S1** — One SKU has several valid prices that differ by market, customer group, channel, quantity, validity and tax basis, so the price of a sale is the result of a written, deterministic selection rule, not a number stored on the product.\n- **S2** — The price that counts is selected once, at order placement, by the rule and data the storefront used, and frozen on the order; the invoice and any refund copy it and never select again.\n- **S3** — In the EU a consumer price must be shown including tax and an announced reduction must name the lowest price of the previous 30 days, so prices must be stored with their tax basis and kept as a history with effective dates.\n- **S4** — A channel that can call the pricing engine at the moment of sale needs no copy; a channel that cannot receives a copy, and because a lost update raises no error, a copy stays right only with a named source, an effective date and a daily comparison that gives a person a list of differences.\n- **S5** — Each kind of price should have one source system, the one in which the team that sets it works: for a merchant with consumer and wholesale sales that is the shop platform for consumer prices and the ERP for wholesale and contract prices, and a separate pricing service is warranted only by many markets, currencies, customer groups or storefronts.\n\n## Role in the part\n\nShows that a catalog fact can be the result of a rule and a moment, not a stored value, and introduces the engine-against-copies distinction that the promotions, search and inventory chapters reuse. Supports P2-2, P2-6 of part `part-2`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in scene, then pieces to in-practice: the Price Drift, then the design under which it lasts one day; `comparison` in choices and trade-offs: four arrangements on the same criteria; `grouping` in goes-wrong: parallel failures)\n\nThe Price Drift comes first because it gives the reader a failure to explain: one channel at the wrong price for nine days and nobody told. What a price is made of follows because the incident cannot be explained until the reader knows that one product has several valid prices and that a rule and a moment select one. Tax, markets and currencies follow as the dimensions that need more than a table row, and they introduce the first European rule, the tax-inclusive price; the two further European constraints come next because they add the last two requirements, a dated history and configurable channel rules, and put before the tax section they would cite the 1998 directive they amend before the reader has met it. Only then can the components be named, since each component holds one of the requirements gathered so far; put before them, 'price history' and 'channel price rules' would be boxes with no reason. The engine-against-copies distinction sits with the components because a copy is defined against the engine. The four arrangements come after the components, and after the change event and its authors, because an arrangement is a placement of the price data and the engine in systems and 'fed by price events' in the fourth arrangement needs the event defined; the trade-offs and the recommendation need all four described; the stages follow the recommendation because it is made for one stage, and a reader at another stage would otherwise apply it where a single price list or a shared pricing service fits better. The platform documentation and Kestrel & Pine's 2027 design come after the recommendation: the documentation tests the recommendation's first assumption (what a shop platform can hold), so it follows the recommendation, and the design is the recommended arrangement applied, and its last paragraph returns to the Price Drift with everything needed to say why it would now last one day. The failures come last because each names a detection the earlier sections introduced (the comparison, the floor, the moment, the history, the check of an EDI price on receipt); told first they would be a list of remedies the reader could not yet read.\n\n## Introduction\n\n**Hook** (`intriguing_example`): At Kestrel & Pine the Ridgewalker jacket costs consumers €199, including VAT, and wholesale buyers €95, excluding VAT. Both are legitimate prices for different sales; the difficulty is ensuring that each channel selects the right one.\n\n**Bridge:** Anyone expects one product to have one price, and has seen a shop charge a different price from the one on the shelf label. → One product legitimately has several prices, so the question becomes which rule selects one for a given sale, which system owns that rule, and how every other system that shows a price is kept in step with it.\n\n**Thesis statement** (KEY POINTS callout, first and second bullets; paragraph p02 states the premise in prose): A price is selected from several valid candidates by one written rule at one moment and frozen on the order; each kind of price has one source, and every channel that cannot call that source holds a copy that needs a source, an effective date and a daily comparison.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p04):\n\n- Start from the Price Drift, in which one channel kept a campaign price for nine days. *Kept in:* scene.\n- Explain what a price is made of and the rule that selects one. *Kept in:* made-of.\n- Show what tax, markets and currencies do to one shelf price, and what European rules require a merchant to keep. *Kept in:* tax, eu-rules.\n- Separate the engine that selects a price from the copies that show it, and say who may change a price. *Kept in:* pieces.\n- Compare four arrangements for where prices live, weigh their trade-offs and follow them through the four scale stages. *Kept in:* choices, trade-offs, stages.\n- Check the argument against platform documentation and Kestrel & Pine's 2027 design. *Kept in:* in-practice.\n- List how pricing fails and what detects each failure. *Kept in:* goes-wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | The same jacket legitimately costs a consumer €199 including VAT and a wholesale buyer €95 excluding VAT, so the difficulty is not having two prices but making each channel select the right one. | scenario: Kestrel & Pine's Ridgewalker jacket: €199 including VAT for consumers, €95 excluding VAT for wholesale buyers before negotiated terms. |  |\n| p02 | claim | Because several prices are valid, a price comes from a rule with explicit inputs (buyer, country, channel, quantity, date) that needs an owner, and prices typed separately into each system drift as soon as one changes. |  | `cause_effect`: The two legitimate prices and the need for each channel to select the right one. → The rule, its inputs and its owner, against prices typed into each system. |\n| p03 | context | The previous chapter gave every product attribute one owner and left the price out, because the price changes more often than a description, carries legal weight in Europe and is copied into more systems than any other fact about the product. |  | `contrast`: The product described once and owned per attribute, with price left out of the ownership table. → The price as a fact with a different cadence, legal weight and more copies. |\n| p03a | context | In Eva's order the price is the €199 she sees on the product page, pays at checkout and has frozen on order #1072455, which the invoice and any later refund must use. | scenario: Eva's order #1072455 of 13 April 2027: €199 on the product page, at checkout, on the order, on the invoice. | `example`: The price as a fact copied into many systems. → Its place in the order the book follows. |\n| p04 | transition | The chapter starts from the Price Drift, explains what a price is made of and the rule that selects one, then tax, markets and currencies and the European price rules, separates the engine from the copies and says who may change a price, compares four arrangements with their trade-offs and scale stages, checks them against platform documentation and Kestrel & Pine's 2027 design, and ends with how pricing fails. |  | `sequence`: The price as a rule-selected fact with many copies. → The order of the chapter's sections and the kinds of evidence used: an incident, platform documentation, EU directives. |\n\n## Sections\n\n### Setting the Scene at Kestrel & Pine: The Price Drift\n\n**Controlling idea** (`example`, id `scene`): The Price Drift was one copy of a price whose restoring update failed without an error, in a landscape where one jacket had eleven prices in seven places and no rule said which was the source of which.\n\n**Advances the thesis** (S4): Shows a lost update to a copy running for nine days because nothing compared the copy with its source.\n\n**Transition in:** `example`: Prices typed separately into each system drift as soon as one changes. → The incident in which that happened at Kestrel & Pine.\n\n**Order of paragraphs** (`chronological`): The outcome first, then the mechanism in the order it happened, then the inventory that showed the incident was one case of a wider condition.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | example | In October 2026 the German storefront sold the Ridgewalker at €179 for nine days while the marketplaces and stores charged €199, on 410 orders and at a cost of about €8,200 of margin, because a price-list sync failed silently. | case: The Price Drift: €179 against €199 for nine days, 410 orders, about €8,200 of margin, one marketplace price-parity warning. |  |\n| p06 | context | In the reconstruction, a German autumn campaign at €179 ran from 25 September to 4 October, and in 2026 the German consumer price list lived in the ERP, from which a connector copied it to the shop platform every hour. | scenario: Campaign 25 September to 4 October 2026 at €179; DE consumer list in the ERP; hourly connector to the shop platform. | `elaboration`: The incident and the statement that what follows is a reconstruction. → Where the campaign price lived and how it reached the storefront. |\n| p07 | context | The marketplace connector held the same campaign dates, entered separately by the storefront team, and the stores did not run the campaign at all. |  | `additional_support`: Where the storefront's campaign price came from. → Where the other channels' prices came from. |\n| p08 | cause_effect | On 5 October the update restoring €199 failed, the connector reported success, and because it sent only changes later runs never retried, so only the German storefront stayed at €179. | scenario: The connector logged an error but reported success and sent only changes since the last run; the marketplace connector restored €199 from its own calendar. | `time`: The campaign's end date and the two separate paths to the channels. → The failed restore and why no later run repaired it. |\n| p09 | cause_effect | Nothing compared the prices, so the drift was found nine days later by a marketplace warning and the finance director's margin report, after 410 orders had each lost €20. | figure: Figure 1: three channels selling the same jacket, the storefront at €179 behind a broken sync marked OK, the others at €199. | `cause_effect`: One storefront left at €179 with no error reported. → How it was found, by whom and how late. |\n| p10 | evidence | Noor Visser's April 2027 inventory found the Ridgewalker's price in seven places as eleven prices, with no rule saying which was the source of which, which is the failure pattern the Price Nobody Can Explain. | scenario: Three market lists and four B2B lists in the shop platform; wholesale, contract and consumer lists in the ERP; a channel price per marketplace in the connector; dates in a spreadsheet. | `time`: The drift as one failed copy, repaired in October 2026. → Six months later, the count of all places that held the jacket's price, which showed the cause was wider than one connector. |\n\n### What a Price Is Made Of\n\n**Controlling idea** (`definition`, id `made-of`): A price is a number selected from several valid candidates by a deterministic, written rule at a defined moment, and the moment that counts is order placement.\n\n**Advances the thesis** (S1, S2): Defines the candidates, the rule and the moment that the thesis says a price is computed from.\n\n**Transition in:** `elaboration`: Eleven prices for one jacket and no rule among them. → Why one product has many prices, and the rule and moment that make one of them the price of a sale.\n\n**Order of paragraphs** (`prerequisite_order`): Dimensions before the kinds of price built from them, the rule before its two required properties, and the moment last because it needs the rule; the author's rule closes because it uses all of them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p11 | definition | Having many prices for one jacket is not the fault: a price is a number selected from many by a rule, and the candidates differ along eight dimensions. | table: Eight dimensions (SKU, market, currency, customer group, channel, quantity tier, validity window, tax basis), each with a plain meaning and a Kestrel & Pine example. |  |\n| p12 | definition | A price list is a named set of prices for a group of customers or a market, and base, customer-specific, contract and tiered prices and quotes are the kinds of price such lists hold. | example: Bergzicht Outdoor, the largest wholesale customer, buys on a contract price list negotiated each season. | `elaboration`: The dimensions of a price. → The vocabulary for sets and kinds of prices. |\n| p13 | definition | Because several prices can match one purchase, a platform needs a price selection rule that says in which order the dimensions are tried and what happens when more than one price still matches. | source: commercetools: prices scoped by currency, country, customer group and channel, an eight-step fallback, 'the cheapest is selected'; Adobe Commerce tier scopes; SAP Commerce price rows.; figure: Figure 2: the rule tries the most specific price first, falls back to the base price and freezes the result on the order. | `cause_effect`: The dimensions and kinds of price. → The selection rule, as three platforms document it. |\n| p14 | claim | The rule must be deterministic and written down where the people who type prices can read it, because 'cheapest wins' and 'most specific wins' give different answers when a campaign price and a contract price overlap. |  | `additional_support`: The selection rule. → The two properties it must have. |\n| p15 | claim | A price is also selected at a moment, and if the page, the cart, the checkout, the order and the invoice select at different moments with different rules, the shopper sees one price and pays another. |  | `additional_support`: The rule that selects. → The moment at which it selects. |\n| p16 | evidence | Platform documentation records the same behaviour as a fault and as a rule: a campaign price that outlives its end date because validity is checked against the cart's creation date, and a purchase order that correctly keeps its original price. | source: SAP KBA 2267117: a price that 'does NOT expire after the validity end date has passed'; Adobe Commerce purchase orders keep the original price. | `example`: The moment of selection. → Two documented cases. |\n| p17 | recommendation | The author's rule: display prices may change, the price that counts is selected once at order placement from the same rule and data the storefront used and frozen on the order, quotes and purchase orders freeze earlier, and the invoice copies. |  | `cause_effect`: The two documented cases. → One rule for the moment of selection. |\n\n### Tax, Markets and Currencies: Why €199 Is Three Different Prices\n\n**Controlling idea** (`explanation`, id `tax`): A stored price must say whether it includes tax and in which currency policy it was set, because the same shelf price yields different net amounts by country.\n\n**Advances the thesis** (S1, S3): Shows that tax basis and currency are dimensions a stored number must carry, and introduces the first EU rule.\n\n**Transition in:** `elaboration`: The tax basis and the currency, two rows of the dimension table. → What they do to one shelf price and what the law says about the first.\n\n**Order of paragraphs** (`large_to_small`): The definition, the law, the worked case at Kestrel & Pine, then the two special questions (which country's VAT, which currency).\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | definition | The tax basis changes what a stored number means: a tax-inclusive price is what the consumer pays and a tax-exclusive price has tax added later, so a stored price must say which it is. |  |  |\n| p19 | evidence | In Europe a consumer price includes tax by law, under Directive 98/6/EC of 1998, while in the United States sales tax is added at checkout. | quotation: Directive 98/6/EC of 16 February 1998: the selling price is 'the final price for a unit of the product ... including VAT and all other taxes'.; source: Google Merchant Center: prices for the US and Canada 'shouldn't include tax'; elsewhere include VAT or GST. | `additional_support`: Tax-inclusive and tax-exclusive prices. → Which of the two the law requires where. |\n| p20 | example | Kestrel & Pine charges €199 including VAT in all three countries, so its net revenue differs by country, and either that policy or one net price is defensible while a price stored without its tax basis is not. | scenario: €199 at 21% VAT (NL, BE) nets €164.46; at 19% (DE) nets €167.23; one net price would give €199.00 and €195.71. | `example`: The legal duty to show tax-inclusive prices. → What one gross price means in three countries with two VAT rates. |\n| p21 | explanation | Which country's VAT applies belongs to the tax chapter; a pricing design needs only the fact that under the One Stop Shop a consumer sale carries the VAT of the country of delivery and a business sale with a valid VAT number carries none. | fact: The EU One Stop Shop since 1 July 2021, above €10,000 of cross-border consumer sales a year. | `additional_support`: VAT rates that differ by country. → The rule for which country's rate is inside the price. |\n| p22 | comparison | A merchant that sells in several currencies must choose between converted prices and fixed prices per market, and rounding matters because marketplaces, and the price rules of the next section, compare prices to the cent. | source: Shopify converts at the current exchange rate by default and rounds automatically, with fixed per-market prices as the alternative. | `additional_support`: Tax as one axis on which the same price differs. → Currency as a second axis. |\n\n### The Price Rules Europe Writes Into the System\n\n**Controlling idea** (`explanation`, id `eu-rules`): The EU's prior-price rule makes an effective-dated price history a legal record, and European decisions on marketplace price comparison make channel price rules a matter of configuration.\n\n**Advances the thesis** (S3, S4): Derives two requirements of the pricing system from dated European law: the price history and configurable channel price rules.\n\n**Transition in:** `additional_support`: The tax-inclusive consumer price required by the 1998 directive. → Two further European constraints: the rule on announced reductions and the decisions on marketplace price comparison.\n\n**Order of paragraphs** (`grouping`): Two constraints, each as the rule with its evidence and then its architectural reading; the prior-price rule first because it creates the history the rest of the chapter relies on.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p23 | claim | Besides the tax-inclusive price, Europe writes two more things into the pricing system, a rule on announced reductions and competition decisions on marketplace prices, and their dates matter because not knowing them is the failure pattern the Long Fuse. |  |  |\n| p25 | evidence | A displayed discount compares today's price with an earlier one, and Directive (EU) 2019/2161 fixes that earlier price as the lowest of the previous 30 days, applies from 28 May 2022 and has been enforced with published fines. | quotation: Article 6a: the prior price is 'the lowest price applied by the trader during a period of time not shorter than 30 days prior to the application of the price reduction'.; case: ACM's example of €50 raised to €70 and cut by 35% after 25 days, a 9% discount on the reference; fines against five web shops published 11 June 2024. | `elaboration`: The first of the two, the rule on announced reductions. → What the rule says, its dates and its enforcement. |\n| p26 | analysis | The pricing system must therefore keep an effective-dated price history per SKU, market and channel and answer the 30-day question when a reduction is published, which a merchant with prices in seven places cannot do reliably. |  | `cause_effect`: The legal text and its enforcement. → What it requires of the system. |\n| p27 | evidence | Marketplaces compare a merchant's listing with its own shop and with other sellers continuously, and the legal limits on what they may do with the result have moved in 2013 and again in 2026. | fact: Amazon dropped its price parity clauses in November 2013; the Bundeskartellamt prohibited its price control mechanisms on 5 February 2026 (finality not stated); the PRICING_HEALTH notification reports an offer ineligible for the Buy Box. | `additional_support`: The first constraint and its architectural reading. → The second constraint, marketplace price comparison. |\n| p28 | analysis | Channel price rules, which derive a channel's price from the base price within bounds, must therefore be configuration and not code, and a marketplace's price-state events (Buy Box lost, offer suppressed, parity warning) are signals the pricing system should receive. |  | `cause_effect`: Marketplace comparison and its moving legal limits. → What that requires of the system. |\n\n### How the Pieces Fit Together\n\n**Controlling idea** (`explanation`, id `pieces`): A pricing architecture has four components that feed copies, and the organizing distinction is between the engine a channel can call and the copy a channel must receive, each copy needing a source, an effective date and a reconciler.\n\n**Advances the thesis** (S4): States the engine-against-copies distinction and what a copy needs, per channel and per author of a change.\n\n**Transition in:** `cause_effect`: The requirements gathered so far: a rule, a moment, a tax basis, an effective-dated history and configurable channel rules. → The components that hold them and the copies they feed.\n\n**Order of paragraphs** (`large_to_small`): The components, the distinction between them, the flows it produces, then the single change event and its three kinds of author.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p29 | description | The rule, the moment, the history and the channel rules live in four components (price data, the pricing engine, the price history and channel price rules), and what they feed is the copies each channel shows; the table's examples come from the design Kestrel & Pine adopted in 2027, which the following sections argue for. | table: Five rows: price data, pricing engine, price history, channel price rules and copies, each with what it is, what it owns and its place in Kestrel & Pine's 2027 design. |  |\n| p30 | claim | A channel that can call the engine at the moment of sale needs no copy, and one that cannot receives a copy that can drift, so the design question per channel is whether it calls or receives and, if it receives, from which source, with what effective date and reconciled by whom; a table states this per flow. | table: Requirements per flow: storefront display, checkout selection, marketplace listings, point of sale, EDI orders and invoice, each with how fresh, how consistent, how fast and how it fails. | `emphasis`: The five rows of the table. → The one distinction among them that organizes the design: the engine against the copies. |\n| p31 | analysis | Three rows of the per-flow table carry the design: a marketplace copy is closed only by the channel's acknowledgement, the till's copy is deliberately a day old, which is acceptable because it is effective-dated and reconciled, and an EDI partner sends the price it holds, which is checked against the contract list on receipt. |  | `elaboration`: The per-flow table introduced at the end of the previous paragraph. → The three rows, one per channel that cannot call the engine, that show what a copy needs. |\n| p32 | definition | A price change should be an event that carries the SKU, the scope, the old and new values, the effective date, the author and the reason, published once by the source, and three kinds of author need rules: people, file imports and automated repricers. |  | `sequence`: Copies and what they need from the source. → The change itself as an event, and who may make one. |\n| p33 | recommendation | People change prices by role (merchandising, wholesale, and finance for any price below the cost floor, the lowest price that still covers the product's cost), with rights given in the source system and copies read-only, so a channel cannot override an approved price. |  | `elaboration`: The three kinds of author. → The first: people and their rights. |\n| p34 | recommendation | A spreadsheet import can overwrite prices as an application can, so it is validated for floors, dates and restoring rows and then reviewed. |  | `additional_support`: People as authors. → The second kind of author: file imports. |\n| p35 | recommendation | An automated repricer, a program that changes a channel's price by itself, needs an identity, an owner, a log and limits, and it bounds the channel price from costs and fees without writing the base price. | source: ChannelEngine describes 'margin guardrails' as a connector feature. | `additional_support`: File imports as authors. → The third kind of author: automated repricers, and software agents after them. |\n\n### The Choices\n\n**Controlling idea** (`comparison`, id `choices`): Merchants keep their prices in one of four arrangements (the shop platform, the ERP, a separate pricing service, or split by kind of price with events), and per-channel pricing is something they drift into, not a fifth choice.\n\n**Advances the thesis** (S5): Sets out the candidate source systems the thesis chooses among.\n\n**Transition in:** `problem_solution`: The components, which say what must exist but not which system holds the price data and the engine. → Four arrangements that answer where they live.\n\n**Order of paragraphs** (`comparison`): The two single-system arrangements with opposite limits, the dedicated service that removes both at a cost, the split that keeps both systems, then the non-choice.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p36 | transition | The components do not say which system holds the price data, and four arrangements cover what merchants actually do. |  |  |\n| p37 | comparison | With the shop platform as the price source, consumer prices are well served and wholesale is the limit, because contract prices, quantity breaks and per-account invoice prices are forced into a shape built for consumers. |  | `sequence`: Four arrangements. → The first. |\n| p38 | comparison | With the ERP as the price source, wholesale and contract prices are at home and the consumer side is the limit, because campaigns need a cadence the ERP does not have and the copy to the shop platform is slowest when it matters most. |  | `contrast`: The shop platform as source, strong for consumers and weak for wholesale. → The ERP as source, with the opposite strengths. |\n| p39 | comparison | A pricing service beside the shop platform is the cleanest and the most expensive answer, right for many markets, currencies, customer groups or storefronts and the failure pattern the Giant's Boots for a merchant with three markets and one currency. |  | `contrast`: Two arrangements that each put all prices in a system built for one side. → A dedicated system for all prices. |\n| p40 | comparison | Splitting by kind of price, with consumer prices in the shop platform, wholesale and contract prices in the ERP and every other system fed by dated price events and compared daily, puts each kind of price in the system where the team that sets it works, gives two sources but one rule and one history per kind, and is what Kestrel & Pine chose in 2027. |  | `contrast`: One dedicated system for all prices. → Two existing systems, each the source for one kind. |\n| p41 | refutation | Per-channel pricing, where each channel owns its price, is what merchants drift into and survives as a design only as derived channel prices under the fourth arrangement. |  | `contrast`: Four arrangements a merchant can choose. → A fifth state that is not a choice. |\n\n### Trade-offs\n\n**Controlling idea** (`recommendation`, id `trade-offs`): Compared on the same criteria, the split by kind of price is the author's recommendation for a merchant like Kestrel & Pine on three stated assumptions, and a pricing service is the answer when one of them fails.\n\n**Advances the thesis** (S5): Gives the thesis's answer on source systems with its conditions.\n\n**Transition in:** `elaboration`: The four arrangements described one by one. → The same four on shared criteria, and the author's recommendation.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p42 | recommendation | On the seven criteria of the comparison table the author recommends the split by kind of price for a merchant like Kestrel & Pine on three assumptions: the shop platform holds per-market and per-group price lists with validity windows and a history, the ERP invoices wholesale, and every copy is fed by dated events and compared daily; without any one of them a pricing service is the honest answer. | table: Seven criteria (right when, consumer campaigns, contract and tiered prices, price history for the 30-day rule, copies to reconcile, cost, warning sign of outgrowing it) across the four arrangements. |  |\n\n### Across Scale Stages: When It Fits and When It Limits\n\n**Controlling idea** (`analysis`, id `stages`): The tax basis and the 30-day history are needed at every scale stage, while the number of sources and copies grows, and the source decision changes at the Growing stage and again only at the Group stage.\n\n**Advances the thesis** (S5, S3): Shows when the source decision arises and that the legal requirements do not wait for scale.\n\n**Transition in:** `elaboration`: A recommendation made for a merchant at Kestrel & Pine's stage. → What fits at the stages before and after it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p43 | description | The recommendation fits Kestrel & Pine's stage, and the table shows for each of the book's four stages what is typical, what becomes necessary and the signs of having outgrown it. | table: Four stages (Starting, Growing, Omnichannel, Group), each with what is typical, what becomes necessary and warning signs. |  |\n| p44 | analysis | The tax basis and the 30-day history do not change with scale while the number of sources and copies does, and the source decision changes at the Growing stage, when the ERP arrives, and again only at the Group stage, if several brands share a pricing service. |  | `conclusion_summary`: The four rows of the stage table. → What is constant across them and the one point where the source decision changes. |\n\n### In Practice\n\n**Controlling idea** (`evidence`, id `in-practice`): Platform documentation shows price counts growing multiplicatively and prices moved out of the product, and Kestrel & Pine's April 2027 design applies the split by kind to one jacket, the 30-day rule and the Price Drift.\n\n**Advances the thesis** (S1, S2, S3, S4, S5): Checks the argument against vendors' documentation and works the recommended design through one day's prices.\n\n**Transition in:** `example`: The recommendation and its three assumptions. → The first assumption checked against what platform vendors document, then the recommended design as Kestrel & Pine decided it and as it works on one day.\n\n**Order of paragraphs** (`grouping`): The vendors' documentation first because it tests the assumption the design rests on, then Kestrel & Pine's decision in the order owner, path, comparison, and three applications: one day's prices, the 30-day rule, the Price Drift.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p45 | claim | The recommendation's first assumption, that the shop platform can hold the price lists the merchant needs, has to be checked against the vendor's documentation, because one variant needs prices for several markets, groups and quantities and a platform's limits decide which combinations a merchant can represent. |  |  |\n| p46 | evidence | Shopify and commercetools publish limits on price lists and on prices per variant. | source: Shopify B2B catalogs with 'up to 3 active catalog assignments' below Plus; commercetools 100 embedded or 50,000 standalone prices per variant. | `example`: Platform limits as a constraint. → Two vendors' documented limits. |\n| p47 | analysis | The number of prices grows multiplicatively, so every platform moves prices out of the product into a separate store and documents a selection rule. |  | `conclusion_summary`: The documented limits. → The pattern behind them. |\n| p48 | example | In April 2027 Kestrel & Pine agreed the owners: the shop platform's market price lists own consumer prices and campaign dates, and the ERP keeps wholesale list and contract prices. | scenario: The April 2027 ownership decision by Noor Visser, Milan Petrov, Lea Moreau and Sanne de Wit.; figure: Figure 3: two sources, one per kind of price, with every other system receiving effective-dated price events and compared back to its source daily. | `sequence`: What the vendors document about the first assumption. → The recommended arrangement as Kestrel & Pine decided it. |\n| p49 | process | Price changes travel as events with effective dates through the integration platform, as Waypoint decision W5 requires: the ERP publishes wholesale changes to the business catalogs and the order management system, and the shop platform publishes consumer changes to the tills and the marketplace connector. | scenario: Price events through the iPaaS; connector floors from the ERP's landed costs; storefronts do not read the ERP. | `sequence`: Who owns which kind of price. → How a change reaches the systems that hold copies. |\n| p50 | description | A daily comparison of all price copies starts in May 2027 and the old connector's price flow is retired. |  | `additional_support`: The paths of price events. → The comparison that checks them and the retirement of the path that failed. |\n| p51 | example | On the day of Eva's order the same jacket is priced in seven places, each with a stated tax basis, source and path. | table: Seven rows: NL storefront checkout, DE storefront, three marketplaces, six stores, B2B portal, Bergzicht by EDI, Eva's invoice; each with price, basis, source and how it got there. | `example`: The owners, paths and comparison. → The design applied to one jacket on 13 April 2027. |\n| p52 | analysis | Because the invoice copies the price frozen on the order, Eva's exchange on 19 April reuses €199 whatever the list price is that day. |  | `elaboration`: The table's last row. → What the frozen price makes possible six days later. |\n| p53 | example | In a hypothetical autumn 2027 campaign at €179, the 30-day rule makes €179 the prior price for a Black Friday reduction, so a price of €159 is an 11% reduction and not 20%, and the price history answers this when the reduction is scheduled. | scenario: Campaign 20 October to 3 November 2027 at €179 (illustrative); reduction announced 26 November; window 27 October to 26 November.; figure: Figure 4: a price timeline where the 30-day window before the Black Friday price catches the €179 campaign. | `additional_support`: The design applied to one day's prices. → The design applied to the 30-day rule. |\n| p54 | analysis | Under the 2027 design the German campaign is one row with a start and an end, so no push has to carry the restore, and the daily comparison would have shown the difference on the first morning, cutting the margin at risk from nine days to one. |  | `additional_support`: The design applied to the 30-day rule. → The design applied to the incident the chapter opened with. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`analysis`, id `goes-wrong`): Pricing fails in five recurring ways, each with a means of detection, and most are found by comparing a price a channel holds with the record it should match.\n\n**Advances the thesis** (S4, S2, S3): Lists the failures the thesis's rule, moment, history and comparison are there to catch.\n\n**Transition in:** `contrast`: A design under which the Price Drift lasts one day. → The failures that still occur under any design, and how each is detected and recovered.\n\n**Order of paragraphs** (`grouping`): Four failures in which a price differs from a record (copy, automation, history, wholesale), then the one a comparison cannot find, then what most of them share.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p55 | transition | The 2027 design does not stop pricing from failing; it makes a failure visible sooner, and five failures recur, each with a way to detect it. |  |  |\n| p56 | cause_effect | The silent restore, a campaign's end price that never arrives or is dropped, is detected by a daily reconciliation, an expected-price check at campaign end and channel acknowledgement, and recovered by republishing the current price. |  | `sequence`: Five recurring failures. → The first, which is the Price Drift's. |\n| p57 | cause_effect | A repricer that undercuts the storefront is detected by a floor from cost and fees and an alert below the base price, and recovered by bounding channel rules in configuration. |  | `additional_support`: A copy left behind. → An automation that moves a channel price too far. |\n| p59 | cause_effect | A reference price nobody kept, a reduction announced against a list price when a cheaper campaign ran within 30 days, is prevented when the pricing system computes the reference from history and blocks a higher one. |  | `additional_support`: Failures of a copy and of an automation. → A failure of the history. |\n| p60 | cause_effect | An EDI price that differs from the contract list becomes a deduction on payment unless the price is validated when the order message is received. |  | `additional_support`: Failures on consumer channels. → The wholesale case. |\n| p58 | cause_effect | Two moments of selection, where cart and checkout disagree, are detected by a test across a campaign boundary and recovered by one rule at one moment, at order placement. |  | `contrast`: Four failures in which a price differs from the record it should match. → A failure of a different kind, in the moment of selection, that only a test finds. |\n| p61 | synthesis | Most of the failures are found the same way, by something that compares a price a channel holds with the record it should match and gives a person a list; that component is a reconciliation, which a later chapter builds for every kind of copy. |  | `conclusion_summary`: Five failures with their detections. → What the detections have in common. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The legal duty and the operational remedy need the same record. A price kept once per kind with the dates it applies from and until ends a campaign without a restoring message, gives the daily comparison something to compare each copy against, and answers the 30-day question; so the history the law asks for, the comparison that would have caught the Price Drift and the frozen price on the order are three uses of one dated record, not three projects.\n\n**So what:** A merchant that keeps that record can explain every price it shows, to a customer, a marketplace or a regulator, and can add channels as further copies; one that types prices into each system can do neither, and finds out from a marketplace warning or a margin report.\n\n**Callback:** The Ridgewalker at €199 for a consumer and €95 for a wholesale buyer, both legitimate. The reader can now say why both are right (each has a source and a rule that selects it) and that what failed in the Price Drift was not a price but a copy nothing compared with its source.\n\n**Takeaway** (`course_of_action`): For one product, count the systems that hold a price, name the source per kind, fix the moment of selection, ask whether the system can answer the 30-day question, and take the eight questions to the people who own each system.\n\n**Hand-off** to [Discounts, Coupons and Loyalty: Promotions Without Chaos](commerce-promotions.html): `sequence`: The price selected by rule and frozen on the order. → What may be subtracted from that price at checkout, in which order, and how the discount reaches the invoice and the refund.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p62 | synthesis | The two prices the chapter opened with are both right because each has a source and a rule, the Price Drift was a copy nothing compared with its source, and the remedy and the legal duty need the same record: a price kept once per kind with its dates. | reasoning: The opening's two prices and the Price Drift set against the 2027 design. |  |\n| p63 | synthesis (list) | Established: a price is selected by a documented rule from several candidates, EU law requires tax-inclusive consumer prices and the 30-day prior price, and marketplaces compare prices continuously and act on the result. |  | `elaboration`: The chapter's answer in one paragraph. → The points it rests on, starting with what documentation and law establish. |\n| p64 | synthesis (list) | Depends on context: which system is the source of a kind of price, whether a dedicated pricing service is warranted, and whether to hold one gross price or one net price across markets. |  | `contrast`: What is established. → What changes with the merchant's situation. |\n| p65 | recommendation (list) | The author's synthesis: treat every copy of a price as a promise made on the source's behalf, and fix the moment of selection at order placement so that the invoice copies. |  | `contrast`: What is established and what depends on context. → The author's own judgement, labelled as such. |\n| p66 | recommendation (list) | Eight questions let the reader apply the take-aways to the prices of one product at their own company. |  | `cause_effect`: The take-aways. → Questions that apply them, introduced by one sentence. |\n| p67 | transition | The price on the product page is only the start of what the shopper pays; the next chapter takes the frozen price and shows what may be subtracted from it at checkout, in which order, and how the discount reaches the invoice and the refund. |  | `sequence`: The price selected by rule and frozen on the order. → What may be subtracted from that price at checkout, in which order, and how the discount reaches the invoice and the refund. |\n\n## Non-goals\n\n- Discounts, coupons, stacking rules, gift cards and discount allocation. See [Discounts, Coupons and Loyalty: Promotions Without Chaos](commerce-promotions.html).\n- VAT rates, the One Stop Shop mechanics, reverse charge, tax engines and the invoice as a legal document. See [Tax, Invoices and the Books: From Order to Ledger](tax-invoicing-and-ledger.html).\n- Company accounts, quotes, approvals and credit limits as B2B objects. See [Selling to Businesses: Accounts, Contract Prices, Quotes and Approvals](b2b-commerce.html).\n- Marketplace listing operations, fee schedules and Buy Box management as a channel practice. See [Selling on Someone Else's Platform: Marketplaces and Channel Integration](marketplaces-and-channel-integration.html).\n- EDI ORDERS and INVOIC document handling and price mismatches as chargebacks. See [Documents Between Companies: EDI, Punchout and E-Invoicing](edi-and-e-invoicing.html).\n- The event, idempotency and reconciliation mechanics that the price event relies on. See [Built to Disagree and Recover: Events, Eventual Consistency and Reconciliation](events-consistency-and-reconciliation.html).\n- Consumer-law requirements beyond price indication, and the regulatory calendar. See [Rules Turned Into Requirements: Consumer, Payment, Invoicing and Platform Regulation](commerce-regulation.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- The ledger gives no per-unit contract price for Bergzicht Outdoor, and the spring reorder's €19,860 for 240 units does not divide into list prices; the chapter states only that Bergzicht buys on a seasonal contract price list. journey-wholesale-order should set the per-SKU contract prices and append them to the ledger.\n- The German VAT rate (19%) is stated from general knowledge as of November 2026, not from a fetched official page; a reviewer may wish to add a citation to the Commission's VAT rates page.\n- The Bundeskartellamt's 5 February 2026 prohibition is under appeal; if it is overturned or confirmed, the sentence that says its finality is not stated must change.\n- Whether the shop platform keeps a queryable price history or only exports change events is left as an assumption; the chapter says both are acceptable if something keeps the history.\n- Consistency ruling 3 settles the direction of the wholesale price flow (the ERP owns wholesale and contract prices and publishes them by event to the OMS and the B2B catalogs; no storefront reads the ERP). The chapter follows it; the earlier open question about erp-and-back-office-integration is kept here only as a pointer to that ruling.\n- Flow rubric note not taken: the recommendation's first assumption (the shop platform holds price lists per market and customer group with validity windows and a history) is made in 'Trade-offs' and the vendors' documented limits come two sections later in 'In Practice'. Moving them earlier would contradict the order AC-4 expects; the author may prefer a pointer or a change to AC-4 in the journal spec.\n- Flow rubric note not taken: 'Trade-offs' is a section of one paragraph and a table; the rubric suggested folding it into 'The Choices'. Kept as published.\n- The published closing of 'When It Goes Wrong' said every failure ends in a reconciliation of copies against their source; the section's own detections for the undercutting repricer (a floor) and two moments of selection (a test) do not. The spec and chapter now say four of five; the author should confirm the count and wording.\n- Flow rubric notes not taken (second run): merge p46 into p45 in 'In Practice'; name the comparison criteria before the arrangements are described, or split the recommendation paragraph (p42) from the table.\n- Flow rubric, third run (sound with notes), not taken: give the daily comparison its own paragraph in 'How the Pieces Fit Together' (it is in the thesis but is first described in the failure section); split 'Who may change a price' into its own section; merge 'Trade-offs' with the stages section.\n- Both flow readers of round 1 could not reproduce 'One jacket, eleven prices, seven places' from the lists in the same paragraph (three market lists and four B2B lists in the shop platform, the ERP's lists, a channel price per marketplace, a spreadsheet of dates). The ledger does not give the breakdown. The author should either give the count's breakdown or change the count; the same 'seven places' is used in the European-rules section and the stage table.\n- Both flow readers of round 1 looked for a third price under the heading 'Why €199 Is Three Different Prices' and found two net amounts (€164.46 at 21% in the Netherlands and Belgium, €167.23 at 19% in Germany). The heading is the author's and was not changed.\n- Both flow readers of round 1 proposed moving 'What the platforms document' next to the selection rule in 'What a Price Is Made Of'. AC-4's expected answer in the journal spec places platform documentation after the choices, so the subsection stays and is reframed as the test of the recommendation's first assumption. If the author prefers the move, AC-4 changes first.\n\n## Decision log\n\n- **2026-11-12** — Round 1 of the draft check escalated on spec faults (12 passed, 26 failed, 10 of them blocking; auto mode, changes to order, paragraph ideas and transitions pre-approved, intent, thesis, role and acceptance criteria untouched). Spec changes: the bridge paragraph held two ideas and is two units (p03 the contrast with the product chapter, p03a Eva's order); Figure 3, the two-source picture, moves from the engine-and-copies paragraph (p30) to the April 2027 decision (p48), and p29 says its examples come from the design the following sections argue for, because both flow readers found the chosen arrangement shown before the choices; 'What the platforms document' (p45) is now the test of the recommendation's first assumption and no longer a general check, because both readers could not say why it stood there; p55 and the section idea no longer promise a recovery for every failure; p61 says most failures are found by a comparison, not four of five; p44 says the source decision changes at the Growing stage and again only at the Group stage, which the stage table shows; p16 calls the SAP and Adobe cases the same behaviour, not opposites; p10's transition carries the six-month step to the April 2027 inventory. 67 paragraphs. Rejected: Moving 'What the platforms document' next to the selection rule, as both readers proposed: AC-4's expected answer (journal spec) puts platform documentation after the choices.; Changing the heading 'Why €199 Is Three Different Prices' or the 'eleven prices, seven places' count: both are the author's.\n- **2026-11-12** — Flow rubric, second run: sound with notes. Taken (auto mode): in 'When It Goes Wrong' the two-moments failure (p58) moves after the EDI price (p60), so the closing paragraph reads as four failures of one kind and then the exception; p28 says what a channel price rule is before the components table uses the term; p40 carries the thesis clause that a kind of price lives in the system where the team that sets it works; the flow rationale says why the change event precedes the arrangements; p19 names the 1998 directive. Rejected: Merging the vendors' limits (p46) into the claim they support (p45).; Naming the comparison criteria at the start of 'The Choices' or splitting p42 into criteria and recommendation.\n- **2026-11-12** — Flow rubric, first run: sound with notes. The author asked for the rubric's notes to be taken without review (auto mode). Taken: the currency paragraph (p22) no longer names the 30-day rule before it is stated; the plain statement of the prior-price rule (old p24) is merged into the paragraph that gives the directive (p25), since it and p26 both said the system must keep a history; the per-flow table is announced at the end of p30 and p31 reads three rows, adding the EDI copy, so every receiving channel in the thesis is treated before the failure section relies on it; 'cost floor' is glossed in p33; p42 names the comparison's criteria; the closing of 'When It Goes Wrong' (p61) no longer says every failure ends in a reconciliation, which the section's own detections contradict, and says four of five do; the flow rationale says what breaks if tax and the European rules swap, why the stages follow the recommendation and why the vendor documentation sits in 'In Practice'. 66 paragraphs. Rejected: Moving the vendor documentation (p45 to p47) before the first arrangement so that the recommendation's first assumption is supported when it is made: AC-4's expected answer places platform documentation after the choices.; Folding the 'Trade-offs' section into 'The Choices'.; Cutting the two-moments failure (p58) to avoid repeating p15 and p16.\n- **2026-11-12** — Converted spec.md to spec.json from the published chapter, one paragraph per unit (auto mode: the author asked for the pass to run without questions). Intent outcome, acceptance criteria AC-1 to AC-5, thesis and role are copied unchanged from the journal spec. Success criteria of spec.md: 'every term defined' is kept as AC-6 (known_before_new, minor); 'four arrangements compared, the recommendation names its three assumptions' is rewritten as the outcome AC-7 (cold reader, minor); both are additions for the author to keep or drop. Dropped as inventories or structure the checks already cover: 'business problem first', 'dimensions in a table, rule illustrated and sourced', 'EU rules cited with dates' (AC-3 tests the outcome), 'the scale-stage table', 'numbers match the ledger' (a rule of the pass, not a reader outcome), and 'three take-away tiers, eight questions, hand-off, two diagrams'. The 6,500-word limit is carried over as length.max_words. The four modality check-boxes were all unticked, so modalities is empty. Rejected: Keeping the eight success criteria as written.; Making the added criteria major.\n- **2026-11-12** — Units the published chapter lacked and the contract asks for are added to the Directive (EU) 2019/2161 (2019) — The tax-inclusive selling price and the 30-day prior price, with dates of application.\n  - § 11 PAngV (2022); ACM publications of 2022-12-06 and 2024-06-11 — National transposition and enforcement.\n  - Bundeskartellamt (2013; case overview 2026) and European Commission IP/22/7777 (2022) — The marketplace price-parity and price-control decisions.\n  - Shopify, commercetools, Adobe Commerce and SAP Commerce documentation (2018–2026) — Price lists, selection rules, tier precedence, rounding and tax-inclusive display.\n  - Amazon SP-API notification documentation and ChannelEngine (accessed 2026-11) — Price-state signals and repricing with guardrails.\n\n## Changelog\n\n- **2026-11-12** — Round 1 (escalate: 12 passed, 26 failed, of which 16 minor). Spec faults fixed in the spec (see decision_log), draft faults fixed in the chapter: the intro's second paragraph, the bridge to the April 2027 inventory, the publisher of consumer price events, the ChannelEngine citation explained, a sentence before the eight questions, glosses for floor, effective date, repricer, price list, price-parity warning, reference price, net and gross, purchase order.\n- **2026-11-12** — Flow rubric run three times (sound with notes each time); notes taken and not taken are in decision_log and open_questions. Chapter revised to match the spec: roadmap paragraph, conclusion paragraph with synthesis and callback, opening paragraph of 'When It Goes Wrong', 'the shop platform' for the hosted product.\n- **2026-11-12** — Converted from spec.md to spec.json (outcome spec), reconstructed from the published chapter; spec.md removed. Status draft.\n- **2026-11-07** — Visual layer: redrew 2 mermaid diagrams as illustrations and added 2 conceptual figures (article-illustrator). (AI-mediated session)\n- **2026-11-07** — Editorial review pass: applied consistency ruling 3 (ERP feeds no channel directly; wholesale and contract prices by event to B2B catalogs and the OMS), corrected the derived DE gross price and the Omnibus fine wording, hedged the 2026 Bundeskartellamt decision, expanded acronyms, trimmed from 7,006 to 6,496 words, timetoread 28. (AI-mediated session)\n- **2026-11-07** — Initial spec and article. (AI-mediated session)\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
