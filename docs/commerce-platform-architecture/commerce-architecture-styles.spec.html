<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/29-commerce-architecture-styles/index.md, including the author's polishing of 11 November 2026) and its former spec.md, whose Non-goals, Modalities, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter, plus the units the contract asks for that the published chapter did not have: a roadmap p05, a lead sentence for the style comparison table p41, and a conclusion paragraph p65 that answers the opening; the author's two-clarification paragraph is split into p11 and p12, and p49 states the line between the vendor's inside and the merchant's own layer; see decision_log.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The three ideas that separate the four styles (deployment unit, data ownership, boundary enforcement) and what monolith, modular monolith, microservices and composable mean in those terms.\n- **Know:** What the dated accounts show and do not show: Amazon (2001–2007), Zalando (2015–2025), Shopify (2019–2024), the Segment (2018) and Prime Video (2023) consolidations, and composable and MACH (2020–2026).\n- **Know:** The costs of splitting (distribution, eventual consistency, operational complexity, and the people cost) and where each lands in Eva's order.\n- **Believe:** A style is a choice about deployment units and boundaries, not about quality.\n- **Believe:** Every famous account is dated and describes a company with thousands of engineers; it gives reasons and costs, not a recipe.\n- **Believe:** For a merchant on a hosted platform the style is mostly the vendor's; what is its own is the integration layer, and its boundaries come from who owns each fact.\n- **Be able to:** Answer a rebuild or 'are we behind?' question with the reference company's size, trigger and cost, and with the incidents the rebuild would have prevented.\n- **Be able to:** Set the number of deployment units for their own code from the teams that must release independently, and enforce the boundaries inside one unit with a build check.\n\n**Audience:** Readers new to commerce architecture; most of all the engineer or engineering lead who has inherited a merchant's platform and is being pitched a composable or microservices rebuild (Noor Visser at Kestrel & Pine); next, the product manager or executive who must judge that pitch (Mara Lindqvist).\n\n**Already knows:**\n\n- Roughly what an API, a database and a queue are.\n- Kestrel & Pine, its people, its 2026 and January 2027 incidents in outline, the sixteen failure-pattern names and the Waypoint decisions W1 to W8.\n- From Part I: the thirteen steps of an order, promise and handoff, the three status lines, 'system', 'the shop platform' for the hosted product and 'commerce platform' for the whole set of systems, business models and the four scale stages (Starting, Growing, Omnichannel, Group), the capability map, bounded context, system of record, single writer, events, idempotency and reconciliation.\n- Glosses already given: PSP, WMS, ERP, iPaaS, EDI, webhook, API call, SKU, channel, marketplace connector, 3PL, order hub and order management system, availability service, D2C, B2B, PIM, POS.\n- From Parts II to V: one owner per product attribute; prices frozen at order placement; available-to-promise; checkout creating the order once; payment stages; one order record with three status lines; invoices, payouts and the monthly match.\n- From Part VI: an integration style per flow with an owner, a reconciliation job, pinned API versions and sunset dates, one master per entity, one owned definition per metric; eventual consistency.\n\n**Does not yet know:**\n\n- Architecture style, deployment unit, data ownership, boundary enforcement.\n- Monolith, modular monolith, microservices, composable commerce and MACH.\n- Packwerk, the strangler approach, Conway's observation, two-pizza teams, stream-aligned teams, serverless, hot path and verifier.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given an 'are we behind?' question, the reader answers from team size, trigger and cost and sizes the merchant's own code, rather than recommending a split. *Probe:* A board member forwards an article about a fashion retailer with about three thousand technology staff that left its monolith for microservices, and asks whether a brand with nine engineers on a hosted platform is behind. Using only this chapter: what is the answer, and how is it argued? | `custom` | cold_reader | major |\n| AC-2 | The reader can say what splitting costs in a commerce order and which boundaries exist whatever the style. *Probe:* Using only this chapter: what does splitting a commerce system into separately deployed pieces cost, where does each cost show up in an order, and which boundaries exist whatever style a merchant chooses? | `custom` | cold_reader | major |\n| AC-3 | The reader can say what Shopify's own accounts show. *Probe:* Using only this chapter: what do Shopify's 2019–2024 accounts of its monolith show? | `custom` | cold_reader | minor |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict the chapter's sections and the kind of evidence it uses. *Probe:* After reading only the introduction: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as sections[].paragraphs[]. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** How should a commerce system be structured internally, and what do the famous examples really show?\n\n> **Claim:** A style is a choice of deployment units, data ownership and boundary enforcement. The famous accounts show splits made when one program could not carry the traffic (Amazon, 2001) or when too many teams shared one program (Zalando, 2015), each taking years, and a thousand developers kept on one deployment unit (Shopify, 2019–2024). A merchant's own code gets one deployment unit per team that must release independently, with boundaries drawn around systems of record.\n\n**Disputed by:** The view that microservices or composable commerce is the modern architecture every growing merchant should move to, as Amazon and Zalando did, so a merchant still on one platform with one codebase of its own is behind.\n\n**So what:** A merchant that accepts the claim answers a rebuild proposal by asking how many of its teams must release independently, which of its incidents the rebuild would have prevented and by when, and what the reference company's size, trigger and cost were. Kestrel & Pine's February 2027 review costed a consultancy's composable rebuild at about €3.2M over eighteen months: it would have rebuilt the platform that had held 2,300 orders in the peak hour and left the joins that failed to 'phase two'. Waypoint chose stay and surround (W4). Asked in April 2027 whether that left the company behind, Noor Visser's May 2027 memo counted nine engineers in three groups that write code, none waiting on another, and set the rule: one storefront codebase and one integration service with a module per flow (stock, orders, prices, products, returns), a build check that blocks new cross-module imports, and a measured latency problem as the only reason to split.\n\n**How and why:** Each split turns a local call into a network call that can fail or arrive late, a transaction into eventual consistency and one pipeline into several to operate, and boundaries are hard to place before the domain is known. Systems copy the communication structure of the teams that build them, so a split pays when many teams block each other in one codebase, which nine engineers do not. On a hosted platform the vendor deploys the core, so the merchant's distribution cost lands in its own integration layer, and the boundaries that decide its promises (the WMS, the PSP, the carriers) exist whatever style it picks; what places them well is who owns each fact.\n\n**Supporting claims**\n\n- **S1** — An architecture style is a choice of deployment units, data ownership and boundary enforcement, not of quality; composable is a way of buying, in which the merchant writes the joins.\n- **S2** — The famous accounts are dated and describe large companies: Amazon split at a traffic wall (2001) and Zalando when too many teams shared one program (2015), each over years and with sprawl; Shopify kept a thousand developers on one deployment unit and learned its boundaries did not match runtime (2019–2024); the consolidations right-sized one subsystem; composable's own alliance ranks integration complexity first.\n- **S3** — Every split costs distribution, eventual consistency, operational complexity and people; in a commerce order these land on the price, the last unit and the handoff to the warehouse, and boundaries to the WMS, PSP and carriers exist whatever the style.\n- **S4** — A merchant's own code gets one deployment unit per team that must release independently, with boundaries drawn around systems of record, enforced cheaply inside one unit and split only on measured evidence; on a hosted platform the core and its style are the vendor's, and the merchant's distribution cost lands in its own layer.\n- **S5** — Applied to Kestrel & Pine and to the scale stages, the rule answers 'are we behind?': one or two units through Omnichannel, one integration service for nine engineers, and a rebuild that would have prevented none of the incidents.\n\n## Role in the part\n\nSeparates the vendor's internal structure from the merchant's own code: the three ideas behind the four styles, the dated accounts read for size, trigger and cost, and the rule of one deployment unit per team that must release independently, with boundaries around systems of record. Supports P7-1 of part `part-7`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in scene to in-practice: the board's question, then Noor's answer)\n\nThe introduction runs from the hook to the two terms it needs, to Eva's order crossing the vendor's code and the merchant's integrations, to how a separation is judged and where the merchant's layer begins, and then the roadmap, so the claim about where crossings belong comes after the reader has seen a crossing. The board's question comes first in the body so every later section answers part of it. The four styles come next because the accounts are read in their terms; the dated accounts before the costs because the costs section quotes their figures and adds the people cost that Netflix, Uber and Segment recorded; the costs before the team rule because the rule sizes how many costs a team can carry; the line between the vendor's inside and the merchant's layer is drawn in Four Styles, right after composable is defined as buying, so the accounts, the costs and the rule are all read knowing whose architecture each describes; the stage table follows as its own house section because it applies the rule by size, and Noor's memo applies it to Kestrel & Pine at stage 3; the failures come after the memo, in the book's fixed order, because each is read against a style, a cost and the rule. Putting the accounts before the styles would leave 'modular monolith' and 'composable' undefined; putting the rule before the costs would give a number without its reason; putting the memo before the rule would show the answer before the reader can check it.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): A commerce team wants to release checkout changes without waiting for a catalog release. Separating the programs may help, but each new connection must carry data and handle failures, and a large company's successful redesign cannot say whether that extra work is worth it for this team.\n\n**Bridge:** Anyone who has waited for another team's release, or read about a famous company leaving its monolith, has met the pull towards splitting a system. → The step from that pull to the chapter's question: on a hosted platform, which separations are the vendor's and which are the merchant's, and when does a split in the merchant's own layer earn its cost?\n\n**Thesis statement** (KEY POINTS callout and paragraph p02 (the fourth paragraph of the introduction)): A style is a choice of deployment units, data ownership and boundary enforcement, not of quality. The famous accounts are dated: Amazon split when its front end could no longer scale (2001), Zalando when too many teams shared one program (2015), each over years; Shopify kept a thousand developers on one deployment unit (2019–2024). On a hosted platform the core is the vendor's, and the merchant's own code gets one deployment unit per team that must release independently, with boundaries drawn around who owns each fact.\n\n**Roadmap** (Paragraph p05, the last paragraph of the introduction (with the IN THIS CHAPTER callout)):\n\n- Start from the board's 'are we behind?' question after Kestrel & Pine's rebuild proposal. *Kept in:* scene.\n- Define the four styles. *Kept in:* styles.\n- Read the dated accounts of Amazon, Zalando, Shopify, two consolidations, Netflix and Uber, and composable commerce. *Kept in:* examples.\n- Set out what each split costs in an order. *Kept in:* costs.\n- Size the merchant's own code to its teams and its scale stage. *Kept in:* team, stages.\n- End with Noor's memo and the ways the choice goes wrong. *Kept in:* in-practice, wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A team that wants to release checkout changes without waiting for a catalog release may gain from separate programs, but every new connection must carry data and handle failures, so whether the split is worth it depends on that team, and a large company's successful redesign cannot answer the question for it. | scenario: A commerce team that wants to release checkout changes without waiting for a catalog release. |  |\n| p03 | definition | An architecture style describes how a system's running programs divide work and data, and a deployment unit is a program built, tested and released as one piece; splitting one creates another program to operate and another boundary, and the work of carrying data and failures across it is the split's distribution cost. |  | `elaboration`: The hook's separate programs and the work each new connection adds. → The two terms the chapter measures separations in: architecture style and deployment unit. |\n| p04 | context | Eva's jacket order at Kestrel & Pine crosses deployment units run by two parties, the vendor's platform code and the merchant's own integrations, where every network crossing can add delay or fail on its own, so the chapter asks which separations earn that cost. |  | `example`: Deployment units and the boundaries between them. → Eva's order crossing deployment units of both kinds, the vendor's and the merchant's. |\n| p02 | claim | To judge whether a separation earns that cost, the reader reads the account of the company it is copied from for its date, scale, problem and limits and checks that the part to be split is its own; a separation pays only when programs need different release schedules or operating capacity. |  | `cause_effect`: Which separations in Eva's order earn their cost. → How to judge one: read the account for date, scale, problem and limits, and check the part to be split is the merchant's own. |\n| p05 | transition | The chapter starts from the board's 'are we behind?' question after Kestrel & Pine's €3.2 million rebuild proposal for a platform that had held on Black Friday, defines the four styles, reads the dated accounts of Amazon, Zalando, Shopify, two consolidations, Netflix and Uber, and composable commerce, sets out what each split costs in an order, sizes the merchant's own code to its teams and its scale stage, and ends with Noor's memo, the ways the choice goes wrong and what to take away. |  | `sequence`: How to judge a separation and where the merchant's own layer begins. → The order of the chapter's sections and its evidence. |\n\n## Sections\n\n### \"Are We Behind?\" at Kestrel & Pine\n\n**Controlling idea** (`context`, id `scene`): Kestrel & Pine declined a €3.2M composable rebuild in favor of stay and surround (W4), and when a board member asked whether that left it behind, the team-size difference and the Black Friday record framed the answer.\n\n**Advances the thesis** (S5): Sets the case the rule is applied to: nine engineers, a platform that held and joins that failed.\n\n**Transition in:** `example`: The roadmap's first promise: the board's question after the rebuild proposal. → Kestrel & Pine's February 2027 review.\n\n**Order of paragraphs** (`chronological`): The February review, the March decision, the April question and the facts Noor brings to it, in the order they happened, so the question arrives after the reader knows what was decided.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | context | In February 2027 Kestrel & Pine reviewed two proposals, a consultancy's composable rebuild for about €3.2 million over eighteen months and the agency's separate storefront on the existing platform, and Noor declined both. | fact: Consultancy's composable rebuild, about €3.2M over 18 months; the agency's headless storefront. |  |\n| p07 | context | The review also costed an enterprise suite and stay and surround, and chose stay and surround as Waypoint's decision W4, inside a €1.1 million budget for 2027–2028. | fact: W4, stay and surround; Waypoint launched March 2027 with €1.1M over 2027–2028. | `additional_support`: The two proposals. → The other options the review weighed and the decision it took. |\n| p08 | context | In April 2027 a board member forwarded an article about a fashion retailer with about three thousand technology staff that had left its monolith, and Mara asked Noor whether Kestrel & Pine had chosen correctly; the question was fair, but it compared companies of very different sizes. |  | `time`: The decision of March. → The question asked about it in April. |\n| p09 | evidence | Noor had nine engineers among fourteen in technology, and on Black Friday 2026 the platform held 2,300 orders in the peak hour while the chain of connectors failed, so the rebuild would have rebuilt what worked and left the joins that failed to 'phase two'; her answer, a memo to the board, comes near the end of the chapter, after the terms and evidence it uses. | statistic: 14 in technology, 9 engineers; 2,300 orders in the peak hour; the connector chain let the Ridgewalker sell for two hours after the warehouse ran out.; figure: Figure 1: nine engineers climbing into a giant's boots. | `contrast`: A retailer with about three thousand technology staff. → Kestrel & Pine's nine engineers and its Black Friday record. |\n\n### Four Styles in Plain Words\n\n**Controlling idea** (`definition`, id `styles`): The four styles differ in deployment units, data ownership and boundary enforcement; a monolith is a shape, not a fault, composable describes how a merchant buys, and on a hosted platform the core is the vendor's while the merchant's own layer is the code around it.\n\n**Advances the thesis** (S1, S4): Defines the styles in the three terms the chapter uses and draws the line between the vendor's inside and the merchant's own layer, which the rule and the next chapter rely on.\n\n**Transition in:** `sequence`: The board's question, Kestrel & Pine's size, and the note that Noor's memo comes after the terms and evidence it uses. → The first of those terms: the three ideas behind the four styles.\n\n**Order of paragraphs** (`large_to_small`): The three ideas and the table first, then the two misreadings the table invites; the composable clarification leads straight to the line between the vendor's inside and the merchant's own layer, so the accounts and costs are read knowing whose architecture each describes (the move both flow readers of round 2, and readers of round 1, asked for); the two recurring terms close the section.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | definition | Three ideas separate the styles (the deployment unit, data ownership and the boundary with its enforcement); a table compares the four styles on them with a dated example of each, and MACH, the industry label for composable, is glossed. | table: The four styles by what is deployed, who owns the data, how boundaries are enforced and a dated example.; figure: Figure 2: the four styles and who owns the joins. |  |\n| p11 | explanation | A monolith is not an insult: one program with one database is also the shape in which every transaction is cheapest and every fact is consistent. |  | `elaboration`: The table's first row. → The first misreading to correct. |\n| p12 | explanation | Composable is a different kind of thing from the other three: it describes how a merchant buys API-first products behind a storefront, so the merchant writes the joins, and the distribution costs the big companies document for microservices move to its integration layer. |  | `contrast`: Three styles that describe how one organization structures its own code. → A style that describes buying. |\n| p49 | comparison | The same split between building and buying applies to any merchant on a hosted platform: the platform's core sits outside the merchant's code, as the WMS, the PSP and the carriers do, the vendor builds and runs it and pays its distribution costs, and the merchant's costs land in the connectors, apps, themes and pipelines it builds around it. | table: Platform vendor against merchant on a hosted platform: who must be modular, the unit of change, where distribution cost lands, what microservices and composable buy. | `cause_effect`: Composable as buying, with the merchant writing the joins. → The line between the vendor's inside and the merchant's own layer, set out in a table. |\n| p50 | analysis | A merchant cannot verify a vendor's internal style, so a claim such as 'built on microservices' says nothing about uptime, release cadence or the API contract, which are what to ask about. | example: Manhattan's WMS page says 'built on microservices' (November 2026). | `cause_effect`: The platform's core is the vendor's. → Why the merchant cannot check the vendor's style and what it should ask instead. |\n| p13 | definition | Whoever owns them, the joins between deployment units rely on two terms from earlier chapters: a system of record is the one system allowed to be right about a fact, and every style with more than one deployment unit lives with eventual consistency and needs idempotent handling. |  | `sequence`: The joins on both sides of the line between what the merchant owns and rents. → The two terms every join between deployment units relies on. |\n\n### What the Famous Examples Actually Show\n\n**Controlling idea** (`evidence`, id `examples`): The famous accounts, read for date, size, trigger and cost, show splits at a traffic wall or at too many teams in one program, each taking years; a refusal to split at a thousand developers; consolidations of subsystems cut too fine; and a composable style whose costs land on the merchant.\n\n**Advances the thesis** (S2): Supplies the dated evidence behind the claim that the famous accounts give reasons and costs, not a recipe.\n\n**Transition in:** `sequence`: The four styles and the terms they rest on. → The dated accounts behind them.\n\n**Order of paragraphs** (`chronological`): The accounts run from Amazon (2001) to composable (2020–2026): Zalando's autonomy split after Amazon's traffic split, Shopify's refusal against both (its renderer before its 2024 retrospective, in date order), the consolidations as corrections of splits cut too fine, Netflix and Uber as the record of what many services cost to run, and composable last because it moves the same costs to the merchant. Each account ends with what it shows, and a one-sentence close (p35a) sets every account against a fourteen-person technology team before the costs.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | claim | Each famous account is dated and describes architecture that has changed since, so it is evidence that a pattern existed and worked at that date in that company, not a description of today's systems. |  |  |\n| p15 | evidence | Amazon's front end was a two-tier monolith that could no longer scale in 2001, and it moved to a services platform of hundreds of services owned by small teams that ran what they built. | source: Jim Gray's 2006 ACM Queue conversation with Werner Vogels as digested by High Scalability (2007): 'two-tier monolith', 'in 2001 it became clear that the front-end application couldn't scale anymore', 100–150 services per page; 'you build it, you run it' (AWS, 2006); two-pizza teams; Dynamo (2007): 'well over 3 million checkouts in a single day'. | `example`: How to read a dated account. → The first account, Amazon. |\n| p16 | analysis | The Amazon account shows a split forced by traffic and organized around team ownership, but not a timeline a smaller company could copy nor anything about Amazon's retail architecture today; the evidence is two decades old. |  | `conclusion_summary`: The Amazon account. → What it shows and does not show. |\n| p17 | evidence | Zalando moved to microservices in 2015 not because of traffic but because too many teams shared one program, 'Jimmy', and could not move quickly. | source: Henning Jacobs (2020): Magento PHP, Java rewrite in 2010, own order and payment services 2012, 'Radical Agility' and AWS in March 2015; Zalando Engineering (2015): 'all of the Shop teams shared the same code base', slow startup and complicated deployments. | `contrast`: A split at a traffic wall. → A split made for team autonomy. |\n| p18 | evidence | By 2020 Zalando's autonomy had produced more than 260 teams, 1,300 developers and 4,000 applications, and its costs: similar services in six languages, monoliths from 2010 still running, functionality built twice and principles marked as no longer current. | statistic: More than 260 teams, 1,300 developers, 4,000 applications; 'similar CRUD REST services written in six languages'; 'still dealt with monoliths from 2010'; the deprecated principles repository. | `cause_effect`: The 2015 split for autonomy. → What autonomy produced and cost by 2020. |\n| p19 | evidence | From 2020 to 2025 Zalando narrowed its choices step by step: a smaller technology radar, one developer portal and, in one critical path, a synchronous read API replacing an event pipeline that fell up to 30 minutes behind at peak. | fact: 2020 radar dropping Clojure, Haskell and Rust; 2023 portal replacing more than 100 interfaces; 2025 price-and-stock pipeline (>90% unchanged payloads, delays up to 30 minutes, 'competing sources of truth') replaced by a read API; about 3,000 technology employees (2025 annual report). | `time`: The costs Zalando listed in 2020. → The discipline that followed. |\n| p20 | analysis | Zalando shows that microservices gave team autonomy at hundreds of teams and billed it as technology sprawl, tooling sprawl and a boundary that had to be redrawn, not that microservices failed: no later fix reversed the architecture. |  | `conclusion_summary`: The Zalando record from 2015 to 2025. → What it shows and does not show. |\n| p21 | evidence | Shopify is the counter-example: in 2019, with over a thousand developers on one Rails codebase, it rejected microservices and regrouped the code into business components with public interfaces and data ownership. | source: Shopify Engineering (2019): 'the downsides of the monolith were outweighing the benefits'; microservices rejected for per-service pipelines, network latency and coordinated deploys; 'more modularity without more deployment units'; components with 'exclusive ownership of its associated data'; Wedge; the tax-engine payoff. | `contrast`: Two companies that split. → A company that refused to split. |\n| p22 | evidence | By 2020 the components existed but every one depended on more than half of the others, and Shopify built Packwerk, a static check that blocks new boundary violations while recording the existing ones. | statistic: Over 2.8 million lines of Ruby, 37 components, an Architecture Guild of about 400; services split 'only for good reasons'; 'every component depended on over half of all the other components'. | `time`: The 2019 intent. → The state of the components in 2020 and the tool built to enforce them. |\n| p26 | evidence | The one documented hot path Shopify carved out, the Storefront Renderer, was split for a measured latency need behind a verifier that compared old and new responses on live traffic, not for team autonomy. | fact: Rewrite from 2019; storefront code 'has much stricter performance requirements'; four to six times faster responses by August 2020; a verifier on live traffic. | `contrast`: Boundaries inside one deployment unit and the tool built to enforce them. → The one piece carved out of it, and why. |\n| p23 | evidence | The 2024 Packwerk retrospective reports that the tool's privacy checks were removed, that common ways of loading code were invisible to it, that isolating one base package took many months, and that the tool found problems faster than teams could fix them, so Shopify discussed removing it but kept it for holding the line at the base layer. | quotation: 'were removed from Packwerk with the release of version 3.0'; 'untracked and invisible to the tool'; 'a package can show zero violations and still fail at runtime'; 'took many months of hard work'.; quotation: 'vastly outpaced'; 'we have discussed removing Packwerk from our monolith'; 'has provided value in holding the line against new dependencies at the base layer'. | `time`: Packwerk introduced in 2020 and the renderer carved out by then. → What the 2024 retrospective found. |\n| p25 | analysis | The retrospective's most important finding is that Shopify's domains and their boundaries did not reflect how its code actually ran, so components became organizational groupings rather than enforced units. | quotation: 'domains and the boundaries between them do not reflect the way Shopify's code actually functions in practice'; 'Packwerk is a sharp knife'; 'running code, more than any metric, will always be the best indicator of real progress'. | `emphasis`: The tool's costs and its one benefit. → The finding that matters most. |\n| p27 | analysis | Shopify shows a thousand developers kept on one deployment unit who gained from ownership and one cheap gate and learned that enforced domain boundaries did not match runtime coupling, the seven years to 2024 spent learning which modularity was worth paying for; its FY2025 annual report confirms the broad shape today. | fact: FY2025 10-K: multi-tenant, Rails, 'single branch', about 7,600 employees. | `conclusion_summary`: The Shopify record from 2019 to 2024. → What it shows. |\n| p28 | evidence | Segment in 2018 consolidated more than 140 services, which three engineers spent most of their time keeping alive, into one service, and listed the trade-offs of doing so. | fact: Over 140 services each with its own queue; three full-time engineers; diverging shared-library versions; 'the solution for us was a monolith'; weaker fault isolation as the trade-off. | `contrast`: A company that never split. → Two that merged a split back together. |\n| p29 | evidence | In 2023 Prime Video's video-quality team replaced a serverless pipeline that carried only about 5% of the expected load with a single process and cut operating cost by 90%. | fact: 'supported only around 5% of the expected load'; operating cost cut by 90%; the original post removed, InfoQ's summary the surviving source. | `additional_support`: Segment's consolidation. → The second consolidation. |\n| p30 | analysis | Both consolidations merged one subsystem that had been cut too fine, so the transferable claim is to size the unit of deployment to the data flow across it, not to reverse the architecture. |  | `conclusion_summary`: Segment and Prime Video. → What the two have in common. |\n| p30a | evidence | Netflix's and Uber's own accounts record what running many services costs in people and time: a seven-year migration, and 2,200 services that blurred into 'networked monoliths' until Uber regrouped them into about 70 domains. | statistic: Netflix August 2008 to January 2016; Uber (2020): about 2,200 critical services, root causes through about 50 services and 12 teams, 10 touchpoints, a half-life of about 1.5 years, about 70 domains behind gateways. | `additional_support`: Two consolidations of subsystems cut too fine. → Two accounts of what many services cost to run. |\n| p31 | definition | Composable, already defined as a way of buying, is promoted by an alliance that has changed its definition several times, while the work it leaves with the merchant has stayed the same. |  | `contrast`: Accounts of companies structuring and running their own code. → A style that is bought. |\n| p32 | evidence | The MACH Alliance's definition moved: founded in 2020 with an acronym that named microservices and headless, by November 2026 its principles page states three principles and defines neither. | fact: June 2020 founding by commercetools, Contentstack, EPAM and Valtech, 'Microservices, API-first, Cloud-Native, and Headless'; 100 members in December 2023; five principles in August 2025; three (Open, Composable, Connected) as of November 2026. | `example`: A label whose meaning is set by an alliance. → How that definition changed from 2020 to 2026. |\n| p33 | evidence | The alliance's own February 2026 survey reports that 37% of enterprise technology decision-makers cite integration complexity as a primary concern, a finding against its own interest. | statistic: 600 respondents; 37% cite integration complexity as a primary concern. | `additional_support`: The alliance's moving definition. → Its own survey. |\n| p34 | evidence | In the same period the alliance's flagship vendor cut about 10% of staff and launched a product that layers on top of an existing commerce solution, so the composable champions now sell composable incrementally. | fact: commercetools cut about 10% of staff in February 2025 (widely reported); January 2026 product 'on top of your existing commerce solution'. | `additional_support`: The alliance's survey. → Its flagship vendor's moves. |\n| p35 | evidence | A composable vendor's documentation shows what it sells as a unit and where its distribution cost lands: an API Extension that fails or slows makes the merchant's whole API call fail or slow. | quotation: commercetools Project as 'the top-level container'; 25 API Extensions per Project (November 2026); 'if it fails or takes a second longer to return a result, the whole API call fails or takes a second longer.' | `example`: Composable sold incrementally. → What one composable vendor's documentation says it sells and where the failure lands. |\n| p35a | transition | Across all the accounts, from Amazon to commercetools, none describes a company with fourteen people in technology. |  | `conclusion_summary`: The composable vendor's failure rule, the last of the dated accounts. → What every account has in common against Kestrel & Pine's size, which the costs and the rule then take up. |\n\n### What Each Style Costs\n\n**Controlling idea** (`cause_effect`, id `costs`): Every split costs distribution, eventual consistency, operational complexity and people; in a commerce order these land on the price, the last unit and the handoff to the warehouse, and some boundaries exist whatever the style.\n\n**Advances the thesis** (S3): Names the costs and where they land in Eva's order.\n\n**Transition in:** `cause_effect`: The accounts' costs: sprawl, consolidations, the composable vendor's failure rule. → The costs of splitting stated in general and placed in an order.\n\n**Order of paragraphs** (`large_to_small`): The general trade-off and Fowler's three costs first, then the costs on three promises of Eva's order, then the boundaries no style removes, then the people cost gathered from the accounts, and finally the four styles side by side, which needs every cost already named.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p36 | claim | Splitting a system lets teams change and deploy parts independently, but it turns some local calls into network requests that can fail or arrive late and leaves the merchant to coordinate records across systems. |  |  |\n| p37 | evidence | Fowler named the three costs of microservices (distribution, eventual consistency and operational complexity) and warned that boundaries are hard to get right at the start, so the premium is not worth paying early. | quotation: Fowler, 'Microservice Trade-Offs' (2015): distribution, eventual consistency, operational complexity; 'MonolithFirst' (2015): 'even experienced architects working in familiar domains have great difficulty getting boundaries right at the beginning'. | `elaboration`: Splitting's benefit and cost in one sentence. → The costs as Fowler named them. |\n| p38 | analysis | In commerce those costs land on specific promises: the price at checkout, the last unit and the order's handoff to the warehouse each change when the pieces sit across deployment units. | table: Three promises of Eva's order inside one deployment unit and across several, with who pays; the Price Drift and the Black Friday Oversell as examples. | `example`: Fowler's general costs. → Where they land in three steps of Eva's order. |\n| p39 | analysis | Some boundaries exist whatever style a merchant chooses, because the WMS, the PSP and the carriers are other companies' systems, so a style decides only how many more such boundaries the merchant creates in its own code. |  | `emphasis`: The table's third row. → The boundaries no style removes. |\n| p40 | analysis | The people cost, which rebuild proposals usually leave out, is recorded in the accounts above: Netflix's seven-year migration, Uber's 'networked monoliths' and Segment's three engineers on 140 services. | reasoning: Back-references to the Netflix, Uber and Segment accounts. | `additional_support`: The costs on promises. → The cost in people and time, as the accounts recorded it. |\n| p41 | comparison | Set side by side, each style serves a different number of teams, gives price, stock and order a different consistency, and fails in its own typical way. | table: The four styles by teams served, consistency, release independence, operating cost, typical failure and when each is right. | `conclusion_summary`: The costs named one by one. → The four styles compared on all of them. |\n\n### Modularity Sized to the Team\n\n**Controlling idea** (`recommendation`, id `team`): A merchant's own code gets one deployment unit per team that must release independently, kept workable by ownership first, a cheap boundary gate and splits only on measured evidence.\n\n**Advances the thesis** (S4): States the rule for the merchant's own code.\n\n**Transition in:** `cause_effect`: The costs of every split, including the people cost. → How many boundaries a merchant's own team can carry.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): A premise is asserted (p42: a team can carry only the boundaries it can operate), Conway and Team Topologies are the evidence (p43), and the rule follows (p44); then the three disciplines that keep one unit healthy and decide when to split. The line between the vendor and the merchant now sits in Four Styles, so the rule is read already knowing it sizes the merchant's own code. Putting the rule before Conway would state a number without its reason.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p42 | claim | Given the costs, the question is how many boundaries a merchant's own team can understand and operate, since separate services still need coordination when their owners cannot change them independently. |  |  |\n| p43 | evidence | Every account above follows Conway's observation that systems copy the communication structure of the organizations that build them, and Team Topologies adds that teams can carry only so much complexity. | quotation: Conway (1968): 'are constrained to produce designs which are copies of the communication structures of these organizations'; Amazon's two-pizza teams, Zalando's 260 teams and 4,000 applications, Shopify's one release train; Skelton and Pais (2019): 'teams can only handle so much complexity before breaking down'. | `additional_support`: The question of how many boundaries a team can carry. → Two observations that bear on it: Conway and Team Topologies. |\n| p44 | recommendation | The rule is one deployment unit per team that must release without waiting for another team, not per domain, flow or capability, and a second unit only when two teams that share a deployable block each other's releases. | figure: Figure 3: one deployable with modules for a small team. | `cause_effect`: Structure follows teams. → The rule that follows. |\n| p45 | transition | Three disciplines from the public record keep a single deployment unit healthy for years and decide when to split it. |  | `elaboration`: One unit per team. → What keeps one unit healthy. |\n| p46 | recommendation | Decide who owns each fact before splitting anything, because in commerce the boundaries that matter are the systems of record, as Kestrel & Pine's W1 to W3 decided before any custom code moved. | reasoning: Fowler's boundary warning and Shopify's finding that domains did not match how code ran.; fact: W1 stock ownership, W2 one order record, W3 product information. | `sequence`: The three disciplines announced. → The first. |\n| p47 | recommendation | Enforce boundaries cheaply by blocking new violations rather than chasing zero, as Packwerk did where it earned its keep, with a dependency check in the build of the merchant's integration code. |  | `sequence`: Ownership first. → The second discipline. |\n| p48 | recommendation | Split a hot path only on measured evidence and behind a verifier, as Shopify did with the Storefront Renderer; without a named measurement there is no evidence for the split. |  | `sequence`: A cheap gate. → The third discipline. |\n\n### Across Scale Stages: When It Fits and When It Limits\n\n**Controlling idea** (`comparison`, id `stages`): Through the Omnichannel stage a merchant's own code needs one deployment unit, perhaps two, with boundaries around systems of record; microservices become a real question only at Group stage, and composable fits stage 3 only as one capability at a time around a kept core.\n\n**Advances the thesis** (S4, S5): Applies the rule to each scale stage.\n\n**Transition in:** `elaboration`: The rule and the line between vendor and merchant. → The rule applied to each scale stage.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p51 | analysis | Applied stage by stage, the rule gives one judgement: through stage 3 a merchant's own code needs one deployment unit, perhaps two, with boundaries around systems of record; microservices become a real question only at stage 4; composable fits stage 3 only as one capability at a time; Kestrel & Pine is at stage 3. | table: The four scale stages with what is typical, what becomes necessary and the warning signs of outgrowing it. |  |\n\n### In Practice: Noor's Memo\n\n**Controlling idea** (`example`, id `in-practice`): Noor's May 2027 memo applied the rule to nine engineers, set the rebuild against the incidents, and answered 'are we behind?' with no.\n\n**Advances the thesis** (S5): Shows the rule, the costs and the dated accounts answering the board's question.\n\n**Transition in:** `example`: The stage table's judgement and Kestrel & Pine's place at stage 3. → Noor's memo applying it.\n\n**Order of paragraphs** (`small_to_large`): The facts first (the memo's frame, the headcount, the incidents against the rebuild), then the answer they add up to: the handbook rule and 'no'. Giving the answer first would ask the board to accept it before seeing the count.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p52 | context | Noor's May 2027 memo applied the stage-3 judgement to Kestrel & Pine in two pages, and its numbers are Kestrel & Pine illustrations. |  |  |\n| p53 | example | By the rule, nine engineers whose groups do not yet wait on each other need one storefront codebase for the Buy team, which the platform runs as the theme and its apps, and one integration service shared by the other two code-writing groups, the one deployable the team runs itself, against the rebuild's dozen services. | fact: From April 2027: Buy (3), Fulfil and Return (2), the integration pair under Ruben Alves, a data pair; three groups write code. | `sequence`: The memo. → Its first argument, the headcount. |\n| p54 | evidence | The incidents were failures of ownership and of the joins that an API-only engine would have recreated in new code, and the table shows stay and surround costing well under half as much and addressing them in 2027, while the rebuild addresses none until 'phase two'. | table: Composable rebuild (about €3.2M, 18 months) against stay and surround (about €1.33M; the €1.1M Waypoint budget): what is rebuilt, bought, run, addressed in 2027 and reversed. | `sequence`: The headcount. → The second argument, the incidents. |\n| p55 | synthesis | The memo ended with a rule and an answer: a handbook rule for Kestrel & Pine's own code (one repository, one deployable, a module per flow, a build check, a measured latency problem as the only reason to split), and 'no' to 'are we behind?', because Kestrel & Pine stood where every documented company stood before it split, without their reasons. | fact: The integration service rule recorded in the engineering handbook.; figure: Figure 4: Kestrel & Pine's own code in 2027 as one deployment unit with a module per flow, surrounded by bought systems. | `conclusion_summary`: The headcount and the incidents. → The rule written down and the answer to the board. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`cause_effect`, id `wrong`): Splits go wrong as distributed monoliths, half-finished migrations, boundaries in the wrong place, over-decomposed integration layers and composable without a team to own the joins, each with a sign to detect and a documented recovery.\n\n**Advances the thesis** (S3, S4): Shows the costs of splitting as failures a merchant can detect, and the rule's remedies as recoveries.\n\n**Transition in:** `contrast`: The memo's rule applied well. → The ways the choice goes wrong and how they map to the chapter's failure patterns.\n\n**Order of paragraphs** (`grouping`): Five failures, each named and defined, then its documented case with detection and recovery; from failures inside a company's own services to the merchant's integration layer and composable, where the chapter's reader most often meets them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p55b | transition | Five failures show how the choice goes wrong, and several match the chapter's failure patterns: The Giant's Boots in a small team, The Spaghetti Junction, and never The Burned Bridge as a recovery. |  |  |\n| p56 | cause_effect | A distributed monolith is services that must be deployed and rolled back together, as Uber's 'networked monoliths' were in 2020, detected by releases needing several teams and recovered by merging the pair or redrawing the boundary around the data that flows, as Uber's domains did. | example: Uber's 'networked monoliths' (2020) and its domains. | `sequence`: The five failures announced and their link to the chapter's failure patterns. → The first failure, the distributed monolith. |\n| p57 | definition | A half-finished migration leaves old and new implementations active, with duplicate behavior and unclear ownership. |  | `additional_support`: The first failure. → The second failure, named and defined. |\n| p58 | example | Zalando's 2010 monoliths still running in 2020 show the half-finished migration, detected by two systems claiming one fact and recovered by the strangler approach, one capability at a time with a retirement date. | quotation: 'still dealt with monoliths from 2010'; functionality implemented twice. | `example`: The half-finished migration defined. → Its documented case, detection and recovery. |\n| p59 | definition | A boundary in the wrong place separates steps that need the same data, adding delays and synchronization work to each change. |  | `additional_support`: The second failure. → The third failure, named and defined. |\n| p60 | example | Zalando's price-and-stock pipeline and Prime Video's pipeline show the wrong boundary, detected by consumers falling behind at peak and copies that disagree, and recovered by a read API beside the events and a merged boundary. | statistic: Payloads more than 90% unchanged; up to 30 minutes behind during Cyber Week; competing sources of truth. | `example`: The wrong boundary defined. → Its documented cases, detection and recovery. |\n| p61 | definition | An over-decomposed integration layer makes each connector a separately operated service, multiplying deployments and support work. |  | `additional_support`: The third failure. → The fourth failure, named and defined. |\n| p62 | example | Segment's 140 services are the shape Kestrel & Pine's 34 integrations would take as separate deployables, detected by engineers spending their weeks keeping connectors alive and recovered by one integration service with a module per flow. | fact: Segment's 140 services for 140 destinations; Kestrel & Pine's 34 integrations. | `example`: The over-decomposed layer defined. → Its documented case, applied to Kestrel & Pine's 34 integrations. |\n| p63 | definition | Composable without a platform team means buying separate components without assigning a team to maintain their joins. |  | `additional_support`: The fourth failure. → The fifth failure, named and defined. |\n| p64 | example | The MACH Alliance's own survey puts integration complexity first, detected by vendor pairs joined by different scripts and owners and recovered by an integration inventory and a contract per join (W5). | statistic: 37% cite integration complexity (2026). | `example`: Composable without a team defined. → Its evidence, detection and recovery. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The dated accounts, the costs and the team rule meet on one line. Every split the famous companies made was paid for by teams that needed to release apart, and every cost it brought lands wherever the joins are. On a hosted platform the joins inside the core are the vendor's; the joins a merchant writes (connectors, apps, pipelines) are its own, so the style question a merchant actually faces is how many deployment units its own teams need, and the boundaries come from who owns each fact.\n\n**So what:** A merchant can answer a rebuild proposal or an 'are we behind?' question by counting its teams that must release independently, naming the incidents the rebuild would prevent, and asking the reference company's size, trigger and cost; Kestrel & Pine's answer was one integration service and no rebuild.\n\n**Callback:** The opening's checkout team that wants to release without waiting for a catalog release, and the board's 'are we behind?' question. p65 answers both: a split pays when a team must release apart, and nine engineers whose groups have not blocked each other are not behind.\n\n**Takeaway** (`course_of_action`): Count the teams that must release without waiting for another; give the merchant's own code that many deployment units, with a module per flow and a build check; decide who owns each fact first; split only on a named measurement; and read every famous account for size, trigger and cost.\n\n**Hand-off** to [Many Merchants, One Platform: Multi-Tenancy, Pods and Isolation](multi-tenancy-and-isolation.html): `contrast`: The previous chapter's conclusion that on a hosted platform the internal structure is the vendor's problem. → What the merchant does share with the vendor and its other tenants, the platform's capacity, and the rate limits through which a merchant meets it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p65 | synthesis | The opening's checkout team and the board's question get one answer: a split pays only when teams must release apart, its costs land wherever the joins are, and on a hosted platform the joins inside the core are the vendor's while those the merchant writes are its own, so Kestrel & Pine's nine engineers needed one shared integration service with clear owners for each fact, not a rebuild. | reasoning: The opening case and Mara's question set against the accounts, the costs and the rule. |  |\n| p66 | synthesis (list) | Established: splitting costs distribution, eventual consistency and operational complexity and boundaries are hard to place early; the documented splits followed a traffic wall or too many teams and took years; structure follows teams; composable is a buying style. | source: Fowler 2015; Amazon 2001; Zalando 2015; Shopify 2019–2024; Conway 1968; Skelton and Pais 2019; MACH Alliance 2026. | `elaboration`: The chapter's answer in one paragraph. → What is established, with its sources. |\n| p67 | synthesis (list) | Depends on context: one deployment unit through Omnichannel and a second only when teams measurably block each other; composable per capability only for a merchant that can staff the joins; a hot-path split only on a measured need behind a verifier. |  | `contrast`: What is established. → What depends on the merchant's context. |\n| p68 | recommendation (list) | The author's synthesis: the number of deployment units in a merchant's own code equals its teams that must release independently, usually one below Group stage, and every famous account is read for size, trigger and cost. |  | `sequence`: What depends on context. → The author's own judgement, labelled as such. |\n| p69 | recommendation (list) | Eight questions turn the chapter into a review of the merchant's own proposals: teams, systems of record, measured problems, incidents prevented, the reference company, where distribution costs land, composable joins and rollback. |  | `cause_effect`: The author's synthesis. → The questions a reader asks of its own proposals. |\n| p70 | transition | On a hosted platform the internal structure is the vendor's problem, but what a merchant shares with the vendor every day, and above all on its peak day, is the platform itself, which the next chapter takes up. |  | `contrast`: Questions about the merchant's own code. → What the merchant shares with the vendor. |\n\n## Non-goals\n\n- The platform landscape and what each vendor sells. See [Suites, SaaS, Open Source and Composable: The Platform Landscape in 2026](commerce-platform-landscape.html).\n- The composable movement as a case. See [Case: commercetools, Shopware and the Composable Movement](case-composable-movement.html).\n- Shopify, Amazon and Zalando as full cases; this chapter uses only the architecture-style evidence. See [Case: Shopify, the Modular Monolith That Serves Millions of Merchants](case-shopify.html), [Case: Amazon, From Monolith to Services to the Everything Store](case-amazon.html), [Case: Zalando, Microservices, Platform Strategy and the Return to Discipline](case-zalando.html).\n- Integration styles, events, idempotency and reconciliation in depth. See [APIs, Events, Files and Middleware: How Commerce Systems Talk](integration-styles.html), [Built to Disagree and Recover: Events, Eventual Consistency and Reconciliation](events-consistency-and-reconciliation.html).\n- Build, buy or assemble decision criteria and TCO; replatforming mechanics. See [Build, Buy or Assemble: Choosing and Changing Platforms](build-buy-or-assemble.html), [Moving Without Burning the Bridge: Replatforming and Migration](replatforming-and-migration.html).\n- Team design in depth. See [Who Builds and Who Owns: Teams, Vendors, Agencies and Governance](organizing-commerce-engineering.html).\n- Multi-tenancy, which the next chapter owns. See [Many Merchants, One Platform: Multi-Tenancy, Pods and Isolation](multi-tenancy-and-isolation.html).\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-11-12** — Converted spec.md to spec.json. The old success criteria were inventories and are not carried over as criteria: term definitions are covered by the standard known_before_new check; the dated company accounts and the Shopify record by AC-1 and AC-3; the costs tied to promises by AC-2; the scale table, the three take-away tiers, two diagrams, eight questions and the ledger agreement are contents, not reader outcomes, and are dropped (the ledger agreement stays a rule of the pass, not a criterion); the 6,500-word limit becomes length.max_words. No criteria were added beyond the journal spec's AC-1 to AC-5. Rejected: Keeping the success criteria as custom rubric criteria (they list contents).\n- **             const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
