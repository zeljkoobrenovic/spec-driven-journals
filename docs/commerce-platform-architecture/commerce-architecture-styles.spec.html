<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "# Spec: Monolith, Modular Monolith, Microservices, Composable: What the Evidence Says\n\n## Intent\n\nGive a reader new to commerce architecture a plain-language map of the four internal architecture styles (monolith, modular monolith, microservices, composable) and an honest reading of the famous examples behind them, so that they can judge a rebuild proposal instead of being carried by its vocabulary. The chapter's position is that a style is a choice about deployment units and boundaries, that the documented splits (Amazon 2001, Zalando 2015) and the documented refusal to split (Shopify 2019–2024) describe companies with thousands of engineers and carry dated costs, and that a merchant's own code should be split into exactly as many pieces as it has teams that must release independently. After reading, Noor Visser can answer a board member's \"are we behind?\" with evidence rather than reassurance.\n\n## Audience\n\nNewcomers to commerce architecture. The engineer or engineering lead who has just inherited a merchant's platform and is being pitched a composable or microservices rebuild benefits most; the product manager or executive who must judge that pitch benefits next. The chapter assumes the reader knows roughly what an API, a database and a queue are, and defines deployment unit, boundary, data ownership, system of record, eventual consistency, monolith, modular monolith, microservices, composable, MACH, strangler migration, PIM, OMS, WMS, PSP and iPaaS where they first appear.\n\n## Success criteria\n\n- [x] A reader new to the field can define every term the chapter uses from the chapter alone; every acronym is expanded on first use.\n- [x] The four styles are defined by deployment unit, data ownership and boundary enforcement, in a table and a diagram, before any company example.\n- [x] Each company account (Amazon, Zalando, Shopify, Segment, Prime Video, MACH) carries its publication year, its evidence age, what it shows and what it does not show; no inferred internals are presented as fact.\n- [x] The two-sided Shopify record is reported honestly: the 2019 componentization intent and the 2024 Packwerk retrospective's findings (removed privacy checks, runtime blind spots, boundaries not matching runtime, \"discussed removing Packwerk\").\n- [x] The costs of microservices (distribution, eventual consistency, operational complexity) are tied to three concrete promises in Eva's order in a requirements table, and the people cost is quantified from public sources (Netflix, Uber, Segment, Zalando).\n- [x] The \"Across Scale Stages: When It Fits and When It Limits\" table is specific per stage, and the \"What to Take Away\" section has the three tiers.\n- [x] The Kestrel & Pine thread agrees with the ledger: the February 2027 review's composable rebuild option (about €3.2M, 18 months) versus stay-and-surround (about €1.33M; Waypoint €1.1M), 14 in technology, 9 engineers, the Black Friday figures; The Giant's Boots is named as the pattern.\n- [x] Two mermaid diagrams with captions; \"When it goes wrong\" with detection and recovery; eight Questions to ask; a hand-off to [Many Merchants, One Platform: Multi-Tenancy, Pods and Isolation](multi-tenancy-and-isolation.html); article at or under 6,500 words including tables.\n\n## Non-goals\n\n- The platform landscape and what each vendor sells — [Suites, SaaS, Open Source and Composable: The Platform Landscape in 2026](commerce-platform-landscape.html); the composable movement as a case — [Case: commercetools, Shopware and the Composable Movement](case-composable-movement.html).\n- Shopify, Amazon and Zalando as full cases — [Case: Shopify, the Modular Monolith That Serves Millions of Merchants](case-shopify.html), [Case: Amazon, From Monolith to Services to the Everything Store](case-amazon.html), [Case: Zalando, Microservices, Platform Strategy and the Return to Discipline](case-zalando.html); this chapter uses only the architecture-style evidence.\n- Integration styles, events, idempotency and reconciliation in depth — [APIs, Events, Files and Middleware: How Commerce Systems Talk](integration-styles.html), [Built to Disagree and Recover: Events, Eventual Consistency and Reconciliation](events-consistency-and-reconciliation.html).\n- Build, buy or assemble decision criteria and TCO — [Build, Buy or Assemble: Choosing and Changing Platforms](build-buy-or-assemble.html); replatforming mechanics — [Moving Without Burning the Bridge: Replatforming and Migration](replatforming-and-migration.html).\n- Team design in depth — [Who Builds and Who Owns: Teams, Vendors, Agencies and Governance](organizing-commerce-engineering.html); multi-tenancy, which the next chapter owns.\n\n## Modalities\n\n- [ ] `checklist.md` — operational checklist\n- [ ] `summary.md` — management summary\n- [ ] `dialog.md` — two-host dialog\n- [ ] `comics.md` — explainer comic\n\n## Open questions\n\n- Shopify's component and package counts after 2024, and whether the modular-monolith program continued, are undocumented; a reviewer should check whether a newer first-party retrospective has appeared.\n- The primary text of the 2006 Vogels interview could not be fetched; the chapter relies on the 2007 High Scalability digest and AWS's 2006 relay. If the primary becomes fetchable, quote it directly.\n- The MACH Alliance's principles page may change again; the chapter dates the three-principle formulation to November 2026.\n\n## Decision log\n\n- **2026-11-07** — Treated composable as a style alongside the three internal styles, but framed it explicitly as a buying style whose distribution costs land on the merchant's integration layer, rather than leaving it to the landscape chapter; this is what makes The Giant's Boots apply to composable as well as to a microservices rebuild.\n- **2026-11-07** — Reported Shopify through the 2024 Packwerk retrospective rather than the 2019 announcement, so that the modular monolith appears as a seven-year learning rather than a slogan; rejected the alternative of presenting Shopify simply as \"the modular monolith that worked\".\n- **2026-11-07** — Set the Kestrel & Pine scene as a board question after the February 2027 platform review (ledger addition by `build-buy-or-assemble`) rather than inventing a second rebuild proposal, so that the €3.2M rebuild figure and W4 stay canonical.\n- **2026-11-07** — Expressed the chapter's rule as \"one deployment unit per team that must release independently\" and added three disciplines (ownership first, cheap boundary gate, split only on measured evidence), each anchored in a public source, instead of a generic \"start with a monolith\".\n\n## Sources\n\n- **Internal**\n  - [Meet Kestrel & Pine](meet-kestrel-and-pine.html) and `_research/scenario-ledger.md` — the cast, Waypoint W4, the Black Friday figures and the February 2027 review's cost figures.\n  - [Who Owns the Truth: Boundaries, Bounded Contexts and Systems of Record](boundaries-and-systems-of-record.html) — the ownership-first argument the chapter leans on.\n  - `_research/brief-platform-engineering-scale.md` (Part 1), `_research/brief-shopify.md` (Part 2), `_research/brief-cases-amazon-zalando.md` (A1, A7, B1, B4), `_research/brief-platform-landscape.md` (Part 3) — the dated company evidence.\n- **External**\n  - Shopify Engineering, *Deconstructing the Monolith* (2019), *Under Deconstruction* (2020), *A Packwerk Retrospective* (2024), *How Shopify Reduced Storefront Response Times with a Rewrite* (2020) — the modular-monolith record.\n  - Henning Jacobs, *One Decade in Zalando Tech* (2020); Zalando Engineering posts of 2015, 2020, 2023 and 2025 — the microservices split and the later discipline.\n  - High Scalability, *Amazon Architecture* (2007); AWS News Blog (2006); the Dynamo paper (2007) — Amazon's move to services.\n  - Martin Fowler, *Microservice Trade-Offs* and *MonolithFirst* (2015); Lewis and Fowler, *Microservices* (2014) — the costs and the boundary warning.\n  - Uber Engineering (2020), Segment (2018), InfoQ on Prime Video (2023), Netflix (2016) — the people and operations costs and the consolidations.\n  - MACH Alliance documents (2020, 2023, 2025, 2026) and commercetools documentation (accessed 2026-11) — composable as a style and its stated costs.\n  - Melvin Conway (1968); Team Topologies key concepts (accessed 2026-11) — team-sized modularity.\n\n## Changelog\n\n- **2026-11-07** — Initial spec and article. *(AI-mediated session)*\n- **2026-11-07** — Editorial review pass: applied the item 13 ruling (consultancy composable pitch, agency headless pitch, suite as a costed option), expanded MACH, ERP, WMS, PIM, iPaaS, AWS on first use, defined idempotent handling, corrected two Zalando and Shopify quotations against the sources, fixed the incidents row (Price Drift and Double Refund under W5), nine engineers in the key points, American spelling. *(AI-mediated session)*\n- **2026-11-07** — Visual layer: redrew 2 mermaid diagrams as illustrations and added 2 conceptual figures (article-illustrator). *(AI-mediated session)*\n"}]}]}</script>

                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
