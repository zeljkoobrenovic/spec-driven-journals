<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "# Spec: From Cart to Confirmation: Checkout Orchestration\n\n## Intent\n\nTeach a reader new to commerce what happens between \"add to cart\" and \"order confirmed\", and why checkout is the most protected part of a commerce platform. The chapter separates three things newcomers blur (the cart as a draft, the checkout as a clocked orchestration, the order as the resulting record), lists what checkout must call and how fresh each answer must be, explains the two rules that keep orders from being lost or duplicated when the shopper leaves for the bank's app (create the order exactly once with an idempotency key; treat the PSP's webhook as external truth), compares four ways to run a checkout, and reads Shopify's 2023–2026 withdrawal of editable checkout templates and scripts as the dated case for why platforms sandbox checkout. Eva's checkout at Kestrel & Pine, step by step with every system called, is the worked example. After reading, the reader can draw their own checkout's call sequence, say which answers come from copies, and judge an agency's proposal to customize checkout.\n\n## Audience\n\nReaders new to commerce architecture. The engineer or product manager who has just inherited a checkout (Noor Visser's position) benefits most; the ecommerce manager who asks for checkout changes and the finance lead who sees unpaid orders at month-end are the secondary readers. Terms explained on first use: cart, checkout, order, orchestration, PSP, webhook, idempotency key, 3-D Secure and strong customer authentication, express wallet, abandoned cart, conversion, PCI DSS and the self-assessment questionnaire, extension point, time budget, company account, contract price list, reverse charge, payment terms.\n\n## Success criteria\n\n- [x] The opener is one sentence under \"IN THIS CHAPTER, YOU WILL\", followed immediately by exactly three KEY POINTS, then the business and architect callouts and three failure patterns (The Phantom Stock, The Message in a Bottle, The Forked Platform) with chapter-specific reasons.\n- [x] A reader new to the field can define every term the chapter uses from the chapter alone; every acronym is expanded on first use.\n- [x] The business problem (abandonment, oversell, unpaid orders, card testing) comes before any component; every component is tied to a business consequence.\n- [x] Contains: a cart/checkout/order contrast table, a step table of what checkout calls, a requirements table (freshness, consistency, latency, availability), a four-option trade-off table, the \"Across Scale Stages: When It Fits and When It Limits\" table with a judgement, three mermaid diagrams with captions (orchestration flowchart, order payment state diagram, Eva's checkout sequence), a \"When It Goes Wrong\" section with detection and recovery, \"What to Take Away\" in three tiers, Questions to Ask, and grouped Sources and Evidence.\n- [x] Eva's checkout uses ledger facts only: 13 April 2027, 21:14, jacket €199 plus two pairs of socks at €18, €235 total, free shipping, iDEAL, order #1072455, delivery Thursday 15 April; the VAT split (€194.21 net, €40.79 VAT) is arithmetic on ledger prices at the NL 21% rate. The Black Friday Oversell (1,340 units, €96,000) and the Card-Testing Night (48,000 attempts, €2,900, 40 minutes) match the ledger.\n- [x] Every company-specific claim is dated and sourced (Shopify changelog 2023-02-13, Shopify docs and help center accessed 2026-11, Shopify BFCM 2025 release, commercetools, Stripe and Mollie documentation accessed 2026-11, Baymard 2026 and 2024, PCI SSC 2025, Visa 2025); the one inference about Shopify's reasons is labeled \"INFERENCE, NOT DOCUMENTED\"; illustrative latencies, the conversion-point value and timings inside the checkout window are labeled as assumptions or illustrations.\n- [x] Payments internals (authorization, capture, settlement, refunds, SCA detail) are left to [Taking the Money: Payment Providers, Authorization, Capture and Refunds](commerce-payments.html); the order lifecycle to [The Order Record: Lifecycle, State and the Order Management System](order-management.html); availability computation to [Is It in Stock? Inventory, Availability and the Promise You Can Keep](inventory-and-availability.html); B2B objects to [Selling to Businesses: Accounts, Contract Prices, Quotes and Approvals](b2b-commerce.html).\n- [x] Length within the 6,500-word cap including tables; the three take-away tiers are present and honest.\n\n## Non-goals\n\n- How the PSP moves money, authorization windows in depth, 3-D Secure flows, refunds and disputes — [Taking the Money: Payment Providers, Authorization, Capture and Refunds](commerce-payments.html).\n- The order state machine, order edits and the OMS — [The Order Record: Lifecycle, State and the Order Management System](order-management.html).\n- Available-to-promise, reservations and the availability service — [Is It in Stock? Inventory, Availability and the Promise You Can Keep](inventory-and-availability.html).\n- Promotion stacking and discount allocation — [Discounts, Coupons and Loyalty: Promotions Without Chaos](commerce-promotions.html); tax determination rules — [Tax, Invoices and the Books: From Order to Ledger](tax-invoicing-and-ledger.html).\n- The delivery promise's data sources — [Getting It There: Carriers, Labels, Tracking and the Delivery Promise](shipping-and-delivery.html).\n- Company accounts, quotes, approvals, credit limits — [Selling to Businesses: Accounts, Contract Prices, Quotes and Approvals](b2b-commerce.html).\n- Extension mechanisms as a taxonomy and app governance — [Apps, Plugins and Functions: Extensibility and Ecosystem Governance](extensibility-and-app-ecosystems.html); API versioning — [Promises Between Systems: API Contracts, Webhooks and Versioning](api-contracts-and-versioning.html).\n- Card testing, skimming and PCI scope in depth — [Protecting the Shop: Card Data, Account Takeover, Bots and Skimmers](commerce-security.html).\n\n## Modalities\n\n- [ ] `checklist.md` — operational checklist\n- [ ] `summary.md` — management summary\n- [ ] `dialog.md` — two-host dialog\n- [ ] `comics.md` — explainer comic\n\n## Open questions\n\n- Shopify's 13 August 2024 date comes from the February 2023 changelog; the current developer page says only that in-checkout `checkout.liquid` is unsupported. A reviewer should confirm no later Shopify post changed the date.\n- The chapter states (as an illustration) that Kestrel & Pine added two sanctioned checkout extensions in 2027; the ledger addition records this so [Apps, Plugins and Functions: Extensibility and Ecosystem Governance](extensibility-and-app-ecosystems.html) and [Journey 1: Eva's Jacket, From Search to Doorstep](journey-consumer-order.html) can reuse it.\n- Whether Kestrel & Pine's platform creates the order before or after the iDEAL result is a reference-architecture choice the chapter makes for the example; it is recorded in the ledger addition so the journeys agree.\n\n## Decision log\n\n- **2026-11-07** — Used Shopify's checkout.liquid timeline rather than a survey of several vendors' extension models, because it is the only publicly dated sequence that shows a platform withdrawing checkout freedom step by step; other vendors appear only where their documentation states a mechanism (commercetools' two-second timeout).\n- **2026-11-07** — Chose \"create the order before the PSP's final answer, settle by webhook\" as the recommended pattern, citing commercetools and Stripe, rather than presenting it as one option among equals, because iDEAL, Bancontact and 3-D Secure redirects make the asynchronous outcome the normal case for a European merchant; the take-aways say when the alternative is acceptable.\n- **2026-11-07** — Kept the four checkout options at the level of \"who runs the orchestration\" rather than listing vendor products, to stay platform-neutral and to map the options onto the scale stages.\n- **2026-11-07** — Treated B2B checkout in one section with four differences and a hand-off, rather than a parallel walkthrough of Bergzicht's order, which belongs to [Journey 3: A Chain Reorders by EDI, From Order to Invoice](journey-wholesale-order.html).\n\n## Sources\n\n- **Internal**\n  - `_research/scenario-ledger.md` — Eva's order, the Oversell, the Card-Testing Night, the systems landscape, Waypoint W1, W2 and W4.\n  - `_research/brief-checkout-payments-tax.md` — Part 1 (checkout as orchestration, Baymard, guest and wallets, the Shopify timeline), Part 4 (idempotency, webhooks, status models), Part 5 (PCI scope), Part 6 (card testing).\n  - `_research/brief-shopify.md` — Part 4.1 (the checkout.liquid timeline table), 4.2 (Shop Pay), 4.5 (B2B payment terms), Part 5.2 (Functions limits).\n  - `_research/brief-platform-engineering-scale.md` — Part 3.4 (extension points as named moments with time budgets), 5.4 (degradation).\n  - `_research/brief-b2b-edi-erp.md` — Part 1 (company accounts, payment terms), Part 4.2 (Business Central connector ownership advice).\n  - [Meet Kestrel & Pine](meet-kestrel-and-pine.html) — cast, systems and incidents; [Taking the Money: Payment Providers, Authorization, Capture and Refunds](commerce-payments.html), [The Order Record: Lifecycle, State and the Order Management System](order-management.html), [Is It in Stock? Inventory, Availability and the Promise You Can Keep](inventory-and-availability.html) — neighbouring contracts.\n- **External**\n  - Shopify changelog (2023), developer documentation and help center (accessed 2026-11) — the checkout extensibility timeline, Functions limits, plan gating, Shop Pay share.\n  - commercetools, Stripe and Mollie documentation (accessed 2026-11) — order-before-outcome flow, webhook guarantees, idempotency, session expiry.\n  - Baymard Institute (2026, 2024) — abandonment rate and reasons, form-field             while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
