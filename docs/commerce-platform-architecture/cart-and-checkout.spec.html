<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/11-cart-and-checkout/index.md) and its former spec.md, whose Non-goals, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter. It is a contract, not a description: where the published chapter did not do what the spec asks, the gap is listed under open_questions and the prose was revised to match.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The difference between a cart (a draft that reserves and promises nothing), checkout (a clocked sequence that asks for final answers) and the order (the record the rest of the platform must keep).\n- **Know:** What checkout calls, in what order, and how fresh each answer must be.\n- **Know:** The four ways to run a checkout, and the mechanisms through which platforms let merchants change it.\n- **Believe:** Checkout should own none of the facts it writes into the order.\n- **Believe:** The payment provider's signed message, not the thank-you page, decides that a payment succeeded.\n- **Be able to:** Draw their own checkout's call sequence and say which answers come from copies.\n- **Be able to:** Judge a proposal to customize checkout by its mechanism and by the vendor's support date for that mechanism.\n\n**Audience:** Readers new to commerce architecture; most of all the engineer or product manager who has just inherited a checkout (Noor Visser's position). The e-commerce manager who asks for checkout changes and the finance lead who sees unpaid orders at month-end are the secondary readers.\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side.\n- Roughly what an API, a database and a queue are.\n- Kestrel & Pine, its people (Noor Visser, Milan Petrov, Daniel Okafor, Sanne de Wit), its 2026 incidents in outline and the names of the failure patterns (meet-kestrel-and-pine, where-commerce-platforms-go-wrong).\n- From Part I: the thirteen steps of an order, promise and handoff, the three status lines (money, goods, returns), what a 'system' is, 'the shop platform' for the hosted product and 'commerce platform' for the whole set of systems, the business models and the four scale stages (Starting, Growing, Omnichannel, Group), the capability map, bounded context, system of record, single writer, events, idempotency and reconciliation, and the Waypoint decisions W1 to W8.\n- Glosses already given: PSP, WMS, ERP, iPaaS, EDI, webhook, API call, SKU, channel, marketplace connector, 3PL, order hub and order management system, availability service, D2C, B2B, PIM, POS.\n- From Part II: one written price rule with prices selected once at order placement and frozen; promotions as data with an evaluation order; available-to-promise with one writer each for on hand and committed and an exact commit at checkout; the Black Friday Oversell, where the platform's stock copy was up to two hours old.\n- From the Part III introduction: one order passes through four owners (checkout, the payment provider, the order record, the ledger), and Eva's order #1072455 is created at 21:14 on 13 April 2027 with its payment pending.\n\n**Does not yet know:**\n\n- Cart, checkout and order as three different things; orchestration; reserve-on-add.\n- Freshness of an answer at the moment of commitment; the payment session and its expiry.\n- The detour to the bank's app, 3-D Secure and strong customer authentication, the idempotency key on order creation, the payment outcome as external truth.\n- Guest checkout, express wallet and payment token; conversion and abandoned cart.\n- Company account, contract price list, reverse charge, payment terms, credit check.\n- Hosted checkout, extension point, time budget, headless checkout, PCI DSS and its self-assessment questionnaire, sandboxed function.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a shopper who pays in her bank's app and never returns, and a payment notification delivered twice, the reader says when the order is created, what marks it paid and why the repeat changes nothing. *Probe:* A shopper pays by iDEAL in her bank's app and never returns to the shop; the payment provider's notification then arrives twice. Using only this chapter: when should the order have been created, what marks it paid, and what does the second notification do? | `custom` | cold_reader | major |\n| AC-2 | Given a checkout that kept selling a product the warehouse no longer had, the reader places the fault in the system that answered the availability call, not in checkout. *Probe:* On a peak evening the checkout kept selling a jacket for up to two hours after the warehouse ran out. Using only this chapter: where was the fault, and is the fix in the checkout? | `custom` | cold_reader | major |\n| AC-3 | Given an agency's proposal to inject a script into the checkout, the reader names the sanctioned alternative and the two risks of the script. *Probe:* An agency proposes to add a gift-wrap option by injecting a script into the checkout's payment page. Using only this chapter: what should the merchant do instead, and why? | `custom` | cold_reader | minor |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict the chapter's sections and the kind of evidence it uses. *Probe:* After reading only the introduction: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as sections[].paragraphs[]. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-6 | A reader new to commerce meets no term in this chapter before it is explained, and every acronym is expanded on first use. | `known_before_new` | rubric | minor |\n\n## Thesis\n\n**Question:** What happens between \"add to cart\" and \"order confirmed\", and why do platforms restrict what merchants may change in checkout?\n\n> **Claim:** Between 'add to cart' and 'order confirmed', checkout asks each system that owns a fact for a final answer (price, tax, availability, delivery promise, payment), writes those answers into the order and creates the order exactly once, keyed on the cart and the payment rather than on a page load, leaving the payment provider's signed message, not the thank-you page, to mark it paid. Platforms restrict merchant changes to named extension points with time limits because every order passes through checkout: merchant code there can delay or fail order creation at peak, a script on the payment page can read the card numbers typed into it, and a template the merchant edits cannot follow the platform's upgrades.\n\n**Disputed by:** The view that checkout is the storefront's last few pages, which a merchant or its agency may edit like any other page, and that the order exists, paid, once the shopper reaches the thank-you page.\n\n**So what:** Kestrel & Pine's checkout kept selling the Ridgewalker jacket for up to two hours after Duiven ran out on Black Friday 2026 because checkout wrote the answer of an out-of-date stock copy into each order and the warehouse could not keep those orders; the fix is to have a current availability service answer that call, not to change checkout. A merchant that accepts the claim lists what its checkout calls and which answers come from copies, creates orders keyed on the cart and the payment and settles them by webhook and a daily job, and customizes checkout only through sanctioned extension points listed with the vendor's support date; Shopify withdrew editable checkout templates and scripts on dated deadlines between August 2024 and August 2026.\n\n**How and why:** The warehouse, finance and the customer all act on what checkout writes into the order, so a stale price or stock figure written there becomes their error. The shopper leaves for her bank's app or a 3-D Secure challenge and may not come back, and the provider's webhook arrives late, out of order or twice, so an order created on the thank-you page can be lost and one created per request without a key can be duplicated. Checkout carries every order at peak load and its payment page falls under the card industry's script rules, so code the platform cannot limit in time or isolate puts every order at risk; and the platform ships its own checkout changes (new payment methods, compliance fixes) into its template, so a merchant's edited copy misses them. Webhooks can also stop arriving, so a daily job asks the provider about every order still pending.\n\n**Supporting claims**\n\n- **S1** — A cart is a draft that reserves and promises nothing, checkout is a short, clocked sequence that asks for final answers, and the order is the record every later system must keep, so whatever checkout writes into the order every later system inherits.\n- **S2** — Checkout owns none of the facts it writes: each answer comes from the system that owns it and must be fresh enough at the moment of commitment, so a stale answer (the Phantom Stock) is fixed in the system that answers the call, not in checkout.\n- **S3** — Because the shopper leaves for her bank or a 3-D Secure challenge and the payment provider reports by webhook, late, out of order, twice or never, the order is created once, keyed on the cart and the payment, the provider's signed message marks it paid, and a daily job asks the provider about every order still pending.\n- **S4** — Guest checkout, express wallets, abandoned-cart recovery and business buyers change which steps the shopper sees and when the calls are made, not the calls themselves.\n- **S5** — The four ways to run checkout trade the merchant's freedom to change it against the orchestration, card-security and upgrade work the merchant takes on, so most merchants should take the most restricted option that still gives them the two or three changes they need through sanctioned extension points.\n- **S6** — Platforms restrict merchant code in checkout to named extension points with time limits, on dated deadlines, because merchant code there can delay order creation at peak, a script on the payment page can read card numbers, and an edited template cannot follow the platform's upgrades; the merchant's defence is an inventory of each customization with its mechanism and the vendor's support date.\n\n## Role in the part\n\nShows the moment the catalog's answers become an order and introduces the two mechanisms the rest of the part relies on: the payment provider's message as the only source of the payment's outcome, and the key that makes a repeated request harmless. Supports P3-1, P3-2 of part `part-3`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in scene to wrong: three requests, then the calls, rules and worked example that answer Daniel's and Sanne's; `comparison` in abandoned to stages: Milan's requests; four options on the same criteria, the dated case for the restriction, then the fit by stage)\n\nThe three requests come first so every term arrives as part of an answer. Cart, checkout and order are defined before the calls because the calls fill the order. The calls come before the clocks because the clocks limit how long the orchestration may hold its state, and the detour in the payment step is where the two rules come from. Guest checkout, wallets and business buyers follow the rules because they change the steps the calls sit in, and each is read against the call table. Eva's checkout comes after all of these because it uses every call and both rules on one order, and it answers Daniel's request; the failures follow it because each failure is a broken call or rule just seen working. The last four sections answer Milan's requests: abandoned carts first, because they use the shopper's clock, the calls made on the cart and the degradation ladder from the failures; then the four ways to run checkout, then Shopify's dated withdrawal, which explains why the author's rule picks sanctioned extensions, and then the stage table, which uses the options and the warning signs from the failures and places Kestrel & Pine. Putting the options before the failures (the published order) split the orchestration half in two and asked the reader to judge extension points before seeing what they must not break; putting Eva's checkout before the calls would show answers without their owners.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): While a shopper checks out, a price can change, another customer can buy the last item and the payment response can arrive late; a successful-looking purchase can still leave the customer with unavailable goods, an unexpected total or a second order after a retry.\n\n**Bridge:** Every reader has clicked 'pay' and seen a thank-you page, and assumes the order then exists and is paid. → Behind that page several systems each supply one answer, and the shopper may leave for her bank's app and never come back; the question is how those answers become one order, created once, and why platforms limit what merchants may change there.\n\n**Thesis statement** (KEY POINTS callout (all three bullets) and paragraph p02): Checkout asks the owner of each fact (price, tax, availability, delivery promise, payment state) for a final answer, creates the order once however often a request is repeated, and leaves the payment provider's message to mark it paid; because every order passes through it, platforms limit where merchants may add their own code.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p03):\n\n- Start from three requests Kestrel & Pine's architect receives about its checkout. *Kept in:* scene.\n- Separate the cart, the checkout and the order, and list what checkout calls and how fresh each answer must be. *Kept in:* cart-draft, calls.\n- Follow the two clocks and the detour to the bank that decide how the order is created once and marked paid. *Kept in:* clock.\n- Look at guest checkout, express wallets and business buyers, which change the steps but not the calls. *Kept in:* guest-wallets, b2b.\n- Work Eva's checkout through step by step, then the five ways checkout fails. *Kept in:* eva, wrong.\n- End with Milan's requests: what the architecture can do about abandoned carts, then who may change checkout: four ways to run it, Shopify's dated withdrawal of editable checkout from 2023 to 2026, and which way fits which scale stage. *Kept in:* abandoned, choices, shopify, stages.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | While a shopper checks out, a price can change, another customer can buy the last item and the payment answer can arrive late, so checkout must combine several systems' answers into one order the merchant can fulfil, or a successful-looking purchase ends in unavailable goods, an unexpected total or a second order. | scenario: A price change, a competing buyer and a late payment answer during one checkout. |  |\n| p02 | claim | Each owning system supplies one answer and checkout coordinates them: it checks availability before committing stock, recognizes a repeated request so a retry creates no second order or charge, lets only the payment provider's message say that money moved, and, because every order passes through it, is the place where platforms limit merchant code. |  | `cause_effect`: The need to combine several changing answers into one order. → Who supplies each answer, what checkout itself must do with them, and why platforms guard where merchant code may run. |\n| p04 | context | Checkout is the first of the four owners Part III follows: at 21:14 on Tuesday 13 April 2027 it turns Eva's jacket and socks into order #1072455 with the payment pending, and the payment's result arrives separately. | scenario: Eva Janssen's order #1072455 at Kestrel & Pine, 21:14 on 13 April 2027, payment pending. | `example`: Checkout creating the order once and the provider's message marking it paid. → Where that happens in Eva's order and in the part's relay of one order through four owners. |\n| p03 | transition | The chapter starts from three requests about Kestrel & Pine's checkout, separates cart, checkout and order, lists what checkout calls and how fresh each answer must be, follows the clocks and the detour to the bank that decide how the order is created once, looks at guest checkout, wallets and business buyers, works Eva's checkout through, lists the ways checkout fails, and ends with abandoned carts, four ways to run checkout, Shopify's dated withdrawal of editable checkout and the fit by scale stage; its evidence is Kestrel & Pine's incidents, vendor documentation, Baymard's research and Shopify's changelog. |  | `sequence`: Eva's order created at 21:14 with the payment pending. → The order in which the chapter explains how that happens and who may change it, and the kinds of evidence it uses. |\n\n## Sections\n\n### Setting the Scene at Kestrel & Pine: Three Requests for the Checkout\n\n**Controlling idea** (`context`, id `scene`): Three requests about one page (a delivery date and gift wrap, an oversold jacket, unpaid orders and card-testing fees) all turn on one question nobody asked: what does checkout call, and in what order?\n\n**Advances the thesis** (S2, S5): Sets up the two halves of the chapter: Daniel's and Sanne's requests are answered by what checkout calls and how it creates the order; Milan's script proposal by who may change checkout.\n\n**Transition in:** `sequence`: The roadmap's first item, three requests about the checkout. → Noor Visser and the three owners who ask.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | transition | In her second month Noor Visser gets three requests about the same page. |  |  |\n| p06 | example | Milan Petrov wants a delivery date and a gift-wrap option in checkout, for which the agency proposes an app and an injected script, and he wants fewer abandoned carts. | scenario: A delivery-date line instead of 'ordered before 22:00, delivered tomorrow'; a gift-wrap option by injected script; about seven in ten carts abandoned (illustrative, in line with Baymard's average). | `sequence`: Three requests. → The first: the storefront owner's, made through the agency Kestrel & Pine retains. |\n| p07 | example | Daniel Okafor wants to know why checkout kept selling the Ridgewalker jacket for two hours after Duiven ran out on Black Friday 2026. | figure: Figure 1: the empty shelf while the storefront shows the jacket in stock from an hours-old figure. | `sequence`: The storefront owner's request. → The second: the warehouse owner's. |\n| p08 | example | Sanne de Wit wants checkout to stop creating orders the payment provider later reports as unpaid, and asks why the Card-Testing Night of August 2026 cost €2,900 in fees for payments that were all declined. | case: Unpaid orders explained at month-end; the Card-Testing Night, €2,900 in fees. | `sequence`: The warehouse owner's request. → The third: finance's. |\n| p09 | transition | Noor answers all three with one question, what checkout calls and in what order, which most of the chapter answers, while Milan's requests and the agency's script proposal are the subject of its last four sections. |  | `conclusion_summary`: The three requests. → The single question behind them and how the chapter divides its answer. |\n\n### The Cart Is a Draft, the Checkout Is a Commitment\n\n**Controlling idea** (`definition`, id `cart-draft`): A cart is a draft that reserves and promises nothing, checkout is the short, clocked sequence that asks for final answers, and the order is the record every later system keeps, so a stale answer written at checkout becomes everyone's error.\n\n**Advances the thesis** (S1): Defines the three terms the rest of the chapter depends on and states why what checkout writes matters.\n\n**Transition in:** `elaboration`: Noor's question about what checkout calls. → The three words the answer depends on: cart, checkout and order.\n\n**Order of paragraphs** (`chronological`): Cart, checkout and order in the order a purchase meets them, then why the last one matters.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | transition | Answering Noor's question starts with three words that are easy to blur: cart, checkout and order. |  |  |\n| p11 | definition | A cart is a draft the shopper can still change: it reserves no stock and promises no price, and whether to reserve stock when an item is added is the first business decision about checkout, which most platforms answer no. | figure: Figure 2: an editable pencilled cart becomes a stamped, locked order. | `sequence`: The three words. → The first, the cart. |\n| p12 | definition | A checkout is the short, clocked sequence that turns the cart into an order and is the first moment the platform asks every other capability for a final answer rather than an estimate. |  | `sequence`: The cart as a draft. → The second word, checkout. |\n| p13 | definition | An order is the record that exists when checkout succeeds, which belongs to order management from that moment, and the three differ in lifetime, who may change them, stock, price and owner. | table: Cart, checkout and order compared on lifetime, change, stock reservation, price and tax, and owner. | `sequence`: The checkout. → The third word, the order, and a comparison of all three. |\n| p14 | cause_effect | The distinction matters because every later system treats the order as a promise, so a stale price or stock figure written into it becomes the error of the warehouse, finance and the customer. |  | `cause_effect`: The order as the record that results. → Why what checkout writes into it matters. |\n\n### What Checkout Must Call\n\n**Controlling idea** (`description`, id `calls`): Each checkout step calls a system that owns a fact, checkout owns none of them, and each answer has its own freshness need, so checkout is an orchestration, a coordinator and not an owner.\n\n**Advances the thesis** (S2): Lists the calls, states that checkout owns none of the facts and gives each call's freshness, which is where a stale answer enters.\n\n**Transition in:** `cause_effect`: The order as a promise every later system inherits. → What checkout calls to fill that promise.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The step table first, then what it shows (no owned facts, different freshness), then the name for that shape.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p15 | description | Each checkout step is a call to a system that owns a fact, and each makes a promise to the shopper. | table: Six steps (identity, address, shipping options, price review, payment, confirmation) with what each calls and the promise it makes.; statistic: Baymard 2024: 5.1 steps and 11.3 form fields on average; eight fields suffice. |  |\n| p16 | claim | Checkout owns none of the facts it writes: price, tax, stock, delivery promise and payment state each live in another system, and tax, for example, is computed from three facts the shop holds (the ship-to address, the product's tax category and whether the buyer is a business). |  | `cause_effect`: The calls in the step table. → What they reveal: checkout only consumes the facts. |\n| p16a | analysis | The calls also differ in how fresh their answer must be: a description may be hours old, a price minutes, and availability must be current at the moment of commitment or the order is a Phantom Stock waiting to happen. | table: Price and promotions, tax, availability, shipping and payment against freshness, consistency, illustrative latency targets and behaviour when down. | `additional_support`: Checkout owns none of the facts. → The second thing the calls reveal: each answer has its own freshness need, and what to do when a call is down. |\n| p17 | definition | That is why checkout is called an orchestration: a coordinator that calls several services in sequence, holds a short-lived state and completes or abandons the whole. | figure: Figure 3: checkout asks six systems for a final answer and creates the order once. | `conclusion_summary`: Several owners, each with its own freshness need. → The name for the thing that coordinates them. |\n\n### The Clock and the Detour\n\n**Controlling idea** (`cause_effect`, id `clock`): Checkout runs against the shopper's patience and the payment provider's session, and inside the payment step the shopper leaves for her bank, so the order must be created once, keyed on the cart and the payment, and the provider's message must decide that it is paid.\n\n**Advances the thesis** (S3): Derives the two rules (one order despite retries; the payment outcome as external truth) from the clocks and the detour.\n\n**Transition in:** `elaboration`: Checkout as an orchestration with a short-lived state. → The clocks that limit how long that state may live, and the detour where checkout loses sight of the shopper.\n\n**Order of paragraphs** (`problem_solution`): The two clocks and the detour are the problem; the two rules are the answer, each followed by its evidence.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | transition | Checkout runs against two clocks it does not control. |  |  |\n| p19 | evidence | The first clock is the shopper's patience, and three of the five leading reasons for abandonment are architecture: showing total cost early, a credible delivery date and not forcing an account. | statistic: Baymard 2026: extra costs 40%, delivery too slow 20%, card trust 19%, forced account 18%, too long 17% (multi-select, US adults who abandoned). | `sequence`: Two clocks. → The first, the shopper's patience. |\n| p20 | evidence | The second clock is the payment provider's: a payment session expires in minutes to days by method, so checkout must finish inside the session while capturing the money can wait. | fact: Mollie: iDEAL 15 minutes, cards 30 minutes, PayPal 6 hours, Klarna 48 hours; wait for the webhook. Stripe and Adyen: card authorizations valid 5 to 7 days. | `sequence`: The shopper's clock. → The second clock, the payment provider's. |\n| p21 | cause_effect | Inside the payment step the shopper leaves for her bank's app or a 3-D Secure challenge and may never return, and the platform learns the outcome only from webhooks that arrive late, out of order and sometimes twice, from which two rules follow. | quotation: Stripe: 'You can't rely on triggering fulfillment only from your checkout landing page, because it's not guaranteed customers visit that page.' | `elaboration`: The payment session. → What happens inside it: the detour and the webhook. |\n| p22 | definition | The first rule: create the order once despite retries, with an idempotency key derived from the cart and the payment rather than from each page load. |  | `sequence`: Two rules follow. → The first rule and the idempotency key. |\n| p23 | evidence | Vendors document the key on order creation: Stripe requires fulfilment to tolerate repeated calls for the same checkout session, and commercetools creates the order once with the payment pending so that later notifications update it rather than create another. | source: commercetools checkout payments lifecycle; Stripe fulfilment guide. | `example`: The idempotency key on order creation. → Two vendors that build checkout this way. |\n| p24 | claim | The second rule: treat the payment outcome as external truth, decided by the provider's signed webhook, with a daily job asking the provider about every order still pending because webhooks stop retrying. | fact: Mollie stops after ten attempts over 26 hours, Stripe after three days.; figure: Figure 4: the order exists before the payment outcome is known; the webhook moves it to paid or failed and a repeat changes nothing. | `sequence`: The first rule. → The second rule. |\n\n### Guest, Account and the Express Wallets\n\n**Controlling idea** (`description`, id `guest-wallets`): Guest checkout and express wallets remove steps the shopper sees, but every call behind them is still made, now under a stricter clock.\n\n**Advances the thesis** (S4): Shows two variants that change the visible steps and leave the orchestration in place.\n\n**Transition in:** `elaboration`: The forced account as one of the shopper's reasons to leave. → Two ways to remove steps: guest checkout and express wallets.\n\n**Order of paragraphs** (`grouping`): Two step-removing variants side by side, then what neither removes.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p25 | definition | Guest checkout lets a shopper buy without an account while the order still holds the details needed to fulfil it, and linking a later account to the guest order is an identity-matching problem. | statistic: Forced account creation is the fourth-largest stated reason for abandonment (Baymard 2026). |  |\n| p26 | definition | An express wallet reuses the shopper's saved payment and address details, so she confirms instead of typing, and gives the merchant a payment token in place of the card details. |  | `sequence`: Guest checkout as one way to remove a step. → A second way: the express wallet. |\n| p27 | evidence | Wallets shorten the visible steps (Apple Pay, Google Pay, Shop Pay's 32% of Shopify's Black Friday weekend orders), but pricing, tax, availability and shipping are still called, now from inside the wallet's callback. | source: Apple Pay developer overview; Google Pay web documentation; Shopify's BFCM 2025 report, Shop Pay 32% of orders (vendor-defined). | `example`: What a wallet is. → Three wallets and what they leave in place. |\n\n### What Changes When the Buyer Is a Company\n\n**Controlling idea** (`comparison`, id `b2b`): A business buyer changes four steps and removes one: a company account, contract prices excluding VAT, a VAT number that can switch the tax treatment, payment terms instead of a payment, and a credit check against the ERP.\n\n**Advances the thesis** (S4): Shows the largest variant: the same orchestration with different owners for identity, price, tax and payment.\n\n**Transition in:** `contrast`: Two variants of the consumer checkout: guest checkout and express wallets. → The buyer that changes the most steps: a company.\n\n**Order of paragraphs** (`grouping`): The steps that change, the step that disappears, the call that is added, then the example.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p45 | comparison | A business customer changes three steps, removes one and adds one call; the three are the identity, price and address steps: a company account with roles and approvers, a contract price list shown excluding VAT, and a VAT identification number that can switch the tax treatment to reverse charge. |  |  |\n| p46 | comparison | The payment step often disappears into payment terms, a receivable in the ERP rather than a PSP event, so the merchant must decide which system owns the terms and the credit limit. | source: Shopify Admin API 2026-10 payment-term types; Microsoft's Business Central–Shopify connector guidance (14 October 2026) on owning terms and credit limits. | `additional_support`: Three steps that change. → The step that often disappears: payment. |\n| p47 | comparison | A credit check against the ERP is the one call a consumer checkout never makes. |  | `additional_support`: Payment terms as a receivable in the ERP. → The extra call that terms require. |\n| p48 | example | Kestrel & Pine's B2B portal runs on the shop platform's company accounts, price lists and net terms and takes 62% of wholesale orders. | fact: 62% of wholesale orders arrive through the B2B portal. | `example`: The four changes and the extra call. → Kestrel & Pine's own business checkout. |\n\n### Eva's Checkout, Step by Step\n\n**Controlling idea** (`example`, id `eva`): Eva's checkout shows every call with its answer, creates the order before the bank's answer and lets the webhook mark it paid, and exposes two weaknesses, the stock copy and the static delivery date, whose fix lies in the systems that answer.\n\n**Advances the thesis** (S2, S3): Applies the calls and the two rules to the running order and answers Daniel's question.\n\n**Transition in:** `contrast`: The business buyer's checkout. → Back to the consumer: Eva's checkout with every system it calls.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The full call sequence, then the three details that carry the design, then the opening question answered.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p50 | example | Eva's checkout, from add to cart at 21:09 to confirmation at 21:14, calls pricing, promotions, tax, the address book, the delivery-date extension and the payment provider, and each answer is written into the order. | table: Seven steps from 21:09 to 21:14 with what checkout calls and what it writes: €199 and 2 × €18, €235, free shipping, net €194.21, VAT €40.79, iDEAL, order #1072455. |  |\n| p51 | analysis | The order exists before the payment confirmation arrives, and a repeated notification creates no second order or payment. |  | `elaboration`: The step table. → The first of three details that carry the design. |\n| p52 | analysis | Stock is still a weakness in April 2027: checkout reads the platform's hourly copy fed from the ERP and the WMS, the chain that oversold 1,340 jackets on Black Friday. | case: The Black Friday Oversell, 1,340 units. | `additional_support`: The first detail. → The second: where the availability answer comes from. |\n| p53 | analysis | The delivery date is also a static rule: Eva is promised Wednesday 14 April and receives the parcel on Thursday 15 April. | figure: Figure 5: Eva's checkout creates the order once before the bank's answer and lets the webhook move it to paid.; fact: Promised 14 April, delivered 15 April. | `additional_support`: The second detail. → The third: where the delivery date comes from. |\n| p54 | analysis | Daniel's question is answered: checkout trusted the availability answer from the platform's copy, so the fix is in who answers that call, the availability service of Waypoint decision W1, not in checkout. | case: 27 November 2026 at 19:40 the WMS knew the Ridgewalker was gone; the platform's copy was up to two hours old. | `cause_effect`: The stale stock answer in Eva's order. → The answer to Daniel's request from the opening. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`process`, id `wrong`): Checkout failures fall into five kinds (duplicate order, lost outcome, stale answer, slow or failed dependency, attack), each with its own detection, recovery and prevention.\n\n**Advances the thesis** (S2, S3): Turns the two rules and the freshness table into detection and recovery, and answers Sanne's question about the card-testing night.\n\n**Transition in:** `cause_effect`: The two weaknesses Eva's checkout exposed. → The full set of ways checkout fails.\n\n**Order of paragraphs** (`grouping`): Five kinds, in the order of the two rules (duplicates, lost outcomes), the freshness table (stale answers, slow dependencies) and then the attack.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p55 | transition | Checkout failures cluster into five kinds. |  |  |\n| p56 | process | A duplicate order comes from a double click, a retry or a repeated webhook and is prevented by the idempotency key and a handler that records every event id. |  | `sequence`: Five kinds. → The first, the duplicate order. |\n| p57 | process | A lost outcome leaves the order pending while the money sits authorized, and is found and settled by a daily query to the provider, which with the two rules answers Sanne's first request: an order the provider has not confirmed stays pending and is not fulfilled. | source: Mollie's fetch-the-status pattern and id-only webhook. | `sequence`: The duplicate order. → The second, the lost outcome. |\n| p58 | process | A stale answer for stock, price or tax comes from a copy that was behind, and is prevented by a current call at commitment. | case: Most of Kestrel & Pine's €96,000 Black Friday cost. | `sequence`: The lost outcome. → The third, the stale answer. |\n| p59 | process | A slow or failed dependency is met with a degradation ladder decided in advance, on which payment and order creation never appear. |  | `sequence`: The stale answer. → The fourth, the slow or failed dependency. |\n| p60 | process | An attack such as the Card-Testing Night is met with rate limits, velocity rules, a CAPTCHA on guest checkout and a kill switch for guest card payments that needs no deploy, which answers Sanne's question about the card-testing fees. | case: 48,000 bot attempts, €2,900 in fees, a 40-minute account pause.; source: Stripe on card testing; Visa's May 2025 monitoring fact sheet. | `sequence`: The slow dependency. → The fifth, the attack, which answers Sanne's question about the card-testing fees. |\n\n### Abandoned Carts and the Business Metric\n\n**Controlling idea** (`analysis`, id `abandoned`): Conversion is checkout's one business metric, and the architecture decides both whether an abandoned cart can be recovered and whether fewer carts are abandoned.\n\n**Advances the thesis** (S4): Ties conversion to calls made early (tax, shipping, delivery promise) and to a cart persisted with an identity.\n\n**Transition in:** `sequence`: The five ways checkout fails, the last of which answers Sanne's question. → Milan's first request, fewer abandoned carts, and the business measure behind it.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The metric and how far its figures can be trusted first, then what the architecture can do about it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p28 | evidence | Checkout's one business metric is conversion, and the abandonment rate behind it is a direction, not a benchmark, because studies define cart and abandonment differently. | statistic: Baymard: 70.22% average across fifty studies, 2006 to 2025, range 55% to 84%; its 35% uplift claim is its own estimate. |  |\n| p29 | analysis | Recovering an abandoned cart needs a cart stored on the server and tied to an identity the merchant may contact. | reasoning: Two preconditions for recovery: a server-side cart and a consented identity. | `elaboration`: Conversion and abandonment. → What it takes to win an abandoned cart back. |\n| p29a | recommendation | The architecture can lower abandonment in three ways no button colour can: show the full price before checkout, show a delivery date the warehouse can keep, and never fail payment because an internal call was slow. | reasoning: Tax and shipping called on the cart page; a computed delivery promise; payment and order creation kept off the degradation ladder. | `contrast`: Recovering carts after they are abandoned. → Preventing abandonment in the first place, with three levers taken from the calls, the shopper's clock and the degradation ladder. |\n\n### The Choices: Four Ways to Run a Checkout\n\n**Controlling idea** (`comparison`, id `choices`): A merchant can run the hosted checkout as is, add sanctioned extensions, build a custom checkout on the platform's APIs or run its own checkout service, and each step away from the first adds orchestration, card-security and upgrade work.\n\n**Advances the thesis** (S5): Sets the four options side by side on the same criteria and gives the author's rule.\n\n**Transition in:** `sequence`: What the architecture can do for conversion, Milan's first request. → His second: changes to checkout itself, and who runs and may change it.\n\n**Order of paragraphs** (`comparison`): Four options in order of increasing merchant responsibility on the same criteria, then the rule.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p30 | transition | Milan's delivery date and gift wrap raise who runs the checkout and who may change it, which is the merchant's choice among four options that map closely to the scale stages. |  |  |\n| p31 | comparison | The hosted checkout as is gives the smallest card-security scope and nothing to build or break. |  | `sequence`: Four options. → The first, the hosted checkout as is, and PCI DSS scope. |\n| p32 | comparison | The hosted checkout with sanctioned extensions lets apps add blocks and run logic at named places with fixed inputs, outputs and a time budget, so the merchant gets its changes without owning the page. | source: Shopify checkout extensibility; commercetools API Extensions with a two-second default timeout. | `sequence`: The first option. → The second, extensions at named places. |\n| p33 | comparison | A custom or headless checkout on the platform's APIs gives full control and full responsibility for the orchestration, the payment-page scripts and API versions. |  | `sequence`: The second option. → The third, a custom checkout. |\n| p34 | comparison | An own checkout service over separate capabilities fits when one checkout must serve several storefronts, an app, a point of sale and a B2B portal, and it costs a team. | table: The four options against who runs the orchestration, customization, PCI DSS scope, upgrade risk, team needed and the stages they fit. | `sequence`: The third option. → The fourth, an own service, and the four compared. |\n| p35 | recommendation | The author's rule: take the most restricted option that still gives the two or three changes the business needs, through sanctioned extension points, because every freedom taken is a page kept working at peak, under card rules and through every release. |  | `conclusion_summary`: The four options compared. → The author's rule for choosing among them. |\n\n### How Protected Checkout Is: Shopify's Timeline, 2023–2026\n\n**Controlling idea** (`evidence`, id `shopify`): Shopify's withdrawal of editable checkout templates and scripts on dated deadlines from 2023 to 2026 shows why platforms restrict merchant code in checkout: time budgets, the card industry's payment-page rules, and extension points that are withdrawn on announced dates.\n\n**Advances the thesis** (S6): Gives the dated case and draws the three lessons that answer the agency's script proposal.\n\n**Transition in:** `cause_effect`: The rule to customize only through sanctioned extension points. → Why platforms make that the only way, shown by the clearest dated record.\n\n**Order of paragraphs** (`chronological`): The dates in order, then the three lessons the dates teach.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p36 | claim | A hosted platform can restrict where merchants put checkout code, and Shopify's dated changes are the clearest public record of that boundary moving. |  |  |\n| p38 | evidence | In February 2023 Shopify announced that checkout.liquid would stop working for the in-checkout pages on 13 August 2024, replaced by checkout extensibility. | source: Shopify changelog, 13 February 2023. | `time`: Shopify's record as a sequence of dates. → The first date. |\n| p39 | evidence | The thank-you and order-status pages followed in 2025 and 2026, and Shopify Scripts were retired on 30 June 2026. | source: Shopify developer documentation and help center: 28 August 2025 (Plus), 26 August 2026 (non-Plus), Scripts 30 June 2026. | `time`: The in-checkout pages. → The later dates. |\n| p40 | evidence | As of November 2026 advanced checkout customization is limited to Shopify Plus and to UI extensions, Shopify Functions with an instruction limit, web pixels and a branding API. | source: Shopify Functions API 2026-10: 11 million instructions per run for carts up to 200 lines.; reasoning: INFERENCE, NOT DOCUMENTED callout: the arc is consistent with a platform that wants one checkout it can change under every merchant, keep inside card rules and keep fast at peak. | `time`: The withdrawals. → What remains in November 2026. |\n| p41 | transition | The timeline teaches three things that apply to any platform. |  | `conclusion_summary`: The dated sequence. → Its lessons for any platform. |\n| p42 | analysis | A time budget is how a platform protects checkout from the merchant's own code. |  | `sequence`: Three lessons. → The first, time budgets. |\n| p43 | analysis | The payment page is where the card industry looks: PCI DSS v4.0.1 requires an inventory of payment-page scripts and tamper detection, and the agency's gift-wrap script is exactly what that rule exists for. | source: PCI DSS 6.4.3 and 11.6.1, effective 31 March 2025, PCI SSC blog of 30 January 2025. | `sequence`: Time budgets. → The second, the payment page. |\n| p44 | recommendation | A platform will withdraw an extension point and announce the date, so the merchant keeps an inventory of every checkout customization, its mechanism and the vendor's support date. |  | `sequence`: The payment page. → The third, withdrawal on a date, and the remedy. |\n\n### Across Scale Stages: When It Fits and When It Limits\n\n**Controlling idea** (`comparison`, id `stages`): The stage table maps the four options, what becomes necessary and the warning signs (several of them the failures above) to the scale stages, and Kestrel & Pine, a stage-3 merchant on a stage-2 checkout, keeps its checkout and changes what it calls.\n\n**Advances the thesis** (S5): Maps the options to the scale stages and places Kestrel & Pine: a stage-3 merchant running a stage-2 checkout whose calls Waypoint changes.\n\n**Transition in:** `elaboration`: The options and the lessons from Shopify. → The same advice laid out by scale stage, with Kestrel & Pine's place in it and the answer to Milan's two requests.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p49 | analysis | Kestrel & Pine is a stage-3 merchant running a stage-2 checkout, whose delivery date and gift wrap come as two sanctioned extensions rather than a script, and Waypoint keeps that checkout but changes what it calls: the availability service answers at order creation (W1) and the OMS receives every order (W2). | table: Four stages against what is typical, what becomes necessary and the warning signs.; fact: W4 stay and surround; W1 availability service from Q4 2027; W2 OMS from 13 October 2027.; fact: Two extensions added in 2027: a delivery-date block and a gift-wrap option. |  |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The two halves of the chapter are one argument: checkout matters because every later system inherits what it writes into the order, and that is also why platforms limit merchant code there; the page that must create each order exactly once from fresh answers at peak is the page a slow extension or a skimming script would break. So the merchant's decision is not which page to edit but which owner answers each call and which sanctioned mechanism carries each change.\n\n**So what:** A reader can draw their checkout's call sequence, mark the answers that come from copies, check that the order is keyed on the cart and the payment and settled by webhook and a daily job, and judge an agency's proposal by its mechanism and the vendor's support date, before buying anything.\n\n**Callback:** The introduction's shopper during whose checkout a price changes, the last item sells and the payment answer arrives late. The first conclusion paragraph says what keeps each of those three from breaking the order.\n\n**Takeaway** (`course_of_action`): List what your checkout calls and which answers come from copies; key order creation on the cart and the payment and settle it by webhook and a daily job; inventory every checkout customization with its mechanism and the vendor's support date; take the nine questions to your own company.\n\n**Hand-off** to [Taking the Money: Payment Providers, Authorization, Capture and Refunds](commerce-payments.html): `elaboration`: The order created with its payment pending, and the payment provider's webhook as the only source of the payment's outcome. → The money's own life after checkout: the four stages, the methods that change them, and refunds and chargebacks as payments flowing back.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p61a | synthesis | A price change, a sold-out item and a late payment answer break the order only when checkout writes a stale answer or trusts a page load; asked at commitment, keyed on the cart and the payment and settled by the provider's message, they do not, and the same need, a checkout that creates every order once at peak, is why platforms keep merchant code to sanctioned, time-limited places; Noor's three requests get the same answer, Daniel's and Sanne's in who answers each call and how the order is created, Milan's in sanctioned extensions. | reasoning: The opening's three changes during checkout set against the two rules and the platform's limits. |  |\n| p61 | synthesis (list) | Established: cart, checkout and order differ in lifetime, owner and rules; the payment outcome arrives by webhook and the order is created once and settled by webhook or a reconciliation job; platforms protect checkout with time-boxed extension points (Shopify 2023 to 2026); surprise costs and slow delivery lead the reasons for abandonment, and calling tax, shipping and the delivery promise on the cart answers both. |  | `elaboration`: The chapter's answer in one paragraph. → The points it rests on, starting with what is established. |\n| p62 | synthesis (list) | Depends on context: hosted with or without extensions fits most merchants and a custom checkout needs shared channels and a team; guest checkout is right for consumers while for business customers the account is the checkout; order-before-outcome is the robust pattern where redirects dominate. |  | `contrast`: What is established. → What changes with the merchant's situation. |\n| p63 | recommendation (list) | The author's synthesis: treat checkout as a conductor that owns no fact, and keep an inventory of every checkout customization with its mechanism and the vendor's support date. |  | `contrast`: What is established and what depends on context. → The author's own judgement, labelled as such. |\n| p64 | recommendation (list) | Nine questions let the reader find, in their own company, what checkout calls and which answers are copies, how old availability can be, what settles an unreturned payment or a repeated webhook, which customizations and payment-page scripts run and when their support ends, whether tax and shipping show on the cart, what can be switched off without a deploy, and who answers for business customers. |  | `cause_effect`: The take-aways. → Questions that apply them to the reader's own company. |\n| p65 | transition | Checkout hands the order to two systems at once, the order record to order management and the payment request to the payment provider, and the next chapter follows the money through its own stages. |  | `sequence`: The questions about the reader's own checkout. → The handoff of the order with its payment pending to the next chapter. |\n\n## Non-goals\n\n- How the PSP moves money, authorization windows in depth, 3-D Secure flows, refunds and disputes. See [Taking the Money: Payment Providers, Authorization, Capture and Refunds](commerce-payments.html).\n- The order state machine, order edits and the OMS. See [The Order Record: Lifecycle, State and the Order Management System](order-management.html).\n- Available-to-promise, reservations and the availability service. See [Is It in Stock? Inventory, Availability and the Promise You Can Keep](inventory-and-availability.html).\n- Promotion stacking and discount allocation; tax determination rules. See [Discounts, Coupons and Loyalty: Promotions Without Chaos](commerce-promotions.html), [Tax, Invoices and the Books: From Order to Ledger](tax-invoicing-and-ledger.html).\n- The delivery promise's data sources. See [Getting It There: Carriers, Labels, Tracking and the Delivery Promise](shipping-and-delivery.html).\n- Company accounts, quotes, approvals, credit limits. See [Selling to Businesses: Accounts, Contract Prices, Quotes and Approvals](b2b-commerce.html).\n- Extension mechanisms as a taxonomy and app governance; API versioning. See [Apps, Plugins and Functions: Extensibility and Ecosystem Governance](extensibility-and-app-ecosystems.html), [Promises Between Systems: API Contracts, Webhooks and Versioning](api-contracts-and-versioning.html).\n- Card testing, skimming and PCI scope in depth. See [Protecting the Shop: Card Data, Account Takeover, Bots and Skimmers](commerce-security.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Draft check stopped after round 2 (escalate), as the brief allows when the blocking failures are mostly order questions for the author. Two corroborated flow findings are at fault in the spec's order and need the author's decision: (a) the author's rule (p35) comes before its evidence, Shopify's timeline (p36 to p44); both round-2 flow readers would put the timeline before the four options or before the rule; (b) guest checkout, wallets and the business buyer sit between the clocks and Eva's worked example, which both readers would move up to follow the clocks directly, with the variants after it. Neither was changed here: (a) reverses the published argument (options, rule, then why), and (b) undoes the variant-then-example order the chapter rubric accepted twice.\n- Remaining after the closing fixes (the check report is stale against them): the stage section still opens on its table, with the sentence that carries over the options after it, because a lead sentence before the table would be a second unit (p49); the known_before_new terms reported once only (card schemes, Klarna, receivable, purchase-order number, Admin API, price-parity warnings, the 40-minute account pause, disputes, composable, Shopify Plus, additional scripts, WebAssembly, web pixels, Bancontact, synchronously, the platform's rate table, reference-architecture view) are left for a sharpen pass within the word limit; the abandonment reasons appear in the shopper's clock (p19) and again in the abandoned-carts section (p29a). Waypoint and W1, W2 and W4 are glossed only by name: both flow readers in both rounds stumbled on them, although the audience knows them from Part I; the author may want a one-clause gloss at first mention.\n- Flow rubric, second run, notes not taken: the option paragraphs (p31, p33) use card-security scope before the PCI DSS payment-page rule is explained (p43), though p31 glosses PCI DSS; the 'Established' list (p61) does not repeat the freshness point; the abandonment reasons appear in the shopper's clock (p19) and are used again in the abandoned-carts section (p29).\n- Flow rubric, first run, notes not taken: (a) the author's rule (p35) cites 'card rules' before the PCI DSS payment-page requirement is explained in the Shopify section (p43); kept, since the option table already names PCI DSS scope and the Shopify section is the rule's evidence. (b) 'Phantom Stock' (p16a) is used as a name; it is one of the failure patterns the reader knows from Part I and is listed in the chapter's opening callout.\n- Shopify's 13 August 2024 date comes from the February 2023 changelog; the current developer page says only that in-checkout `checkout.liquid` is unsupported. A reviewer should confirm no later Shopify post changed the date.\n- The chapter states (as an illustration) that Kestrel & Pine added two sanctioned checkout extensions in 2027; the ledger records this (cart-and-checkout line) so extensibility-and-app-ecosystems and journey-consumer-order can reuse it.\n- Whether Kestrel & Pine's platform creates the order before or after the iDEAL result is a reference-architecture choice the chapter makes for the example; it is recorded in the ledger (cart-and-checkout line) so the journeys agree.\n- The journal spec no longer calls checkout 'the most protected part' of a commerce platform. The front-matter excerpt still asked that question; it was changed to the journal spec's question. The section heading 'How Protected Checkout Is' was kept (it does not claim a superlative); the author may want a plainer heading.\n\n## Decision log\n\n- **2026-11-12** — Round 2 (escalate) closed without a third round: of the blocking failures, two are order questions for the author (open_questions) and the rest were cheap draft fixes applied after the round: the calls section opens from the order as a promise; the Baymard step count says what it shows; the clocks open from the orchestration's short-lived state; the roadmap's last sentence is split; the extensions in Eva's checkout are named as the 2027 answer to Milan's requests; the long card-testing sentence is split; 'the second table', the orchestration lead-in, 'signed webhook', Business Central as an ERP, Shopify as a platform, 'Customer records' and 'Ridgewalker' made explicit. Five sentences were cut to stay within 6,500 words: a remark on what restriction gives the vendor (p36), the registration-step sentence (p25), 'the chapter's advice holds at every stage' (p49), and two lead-in phrases. Rejected:  closes Milan's delivery date and gift wrap with the two sanctioned extensions (ledger, cart-and-checkout line); the stage section's controlling idea is narrowed to what its one paragraph does; the abandoned-carts section has a declared order. Rejected: Folding the abandoned-carts section into the shopper's clock (p19): it would change a section heading and lose the conversion metric's own section.; Adding paragraphs to the stage section: the table carries the per-stage content, and the word limit is better spent elsewhere.\n- **2026-11-12** — The author asked for the flow rubric's notes to be taken without review (auto mode). Before the chapter's own rubric run, two notes from the part's flow rubric were taken: the three tax inputs (ship-to address, product tax category, buyer status) are named where the chapter says checkout owns none of the facts (p16), with a pointer to tax-invoicing-and-ledger; and the extension-points thread (choices, Shopify's timeline, scale stages) moves to the end of the chapter, after the failures, so the orchestration half (calls, clocks, variants, Eva's checkout, failures) is read in one run and the scene's 'second half' is literally the last three sections. Also: the roadmap (p03) now announces every section; 'Where we are' (p04) comes before it and picks up the part's relay of one order through four owners, as this chapter's transition_in asks; the thesis paragraph (p02) states both halves of the thesis; 'Two things stand out' is split into two units (p16, p16a), one idea each; the two opening paragraphs of the Shopify section are one unit (p36), since both said the same thing; a synthesis paragraph that returns to the hook (p61a) opens the conclusion. Rejected: Keeping the options and the Shopify section in the middle of the chapter, as published.; Moving only the Shopify section to the end and leaving the options before Eva's checkout.; Putting the business buyer after the failures.\n- **2026-11-12** — Success criteria of the former Testing Night, the systems landscape, Waypoint W1, W2 and W4, the cart-and-checkout line (two extensions, order before the iDEAL result).\n  - _research/brief-checkout-payments-tax.md — Part 1 (checkout as orchestration, Baymard, guest and wallets, the Shopify timeline), Part 4 (idempotency, webhooks, status models), Part 5 (PCI scope), Part 6 (card testing).\n  - _research/brief-shopify.md — Part 4.1 (the checkout.liquid timeline), 4.2 (Shop Pay), 4.5 (B2B payment terms), Part 5.2 (Functions limits).\n  - _research/brief-platform-engineering-scale.md — Part 3.4 (extension points as named moments with time budgets), 5.4 (degradation).\n  - _research/brief-b2b-edi-erp.md — Part 1 (company accounts, payment terms), Part 4.2 (Business Central connector ownership advice).\n  - journal-spec.json (part-3; cart-and-checkout; commerce-payments transition_in) — Intent, thesis, role, acceptance criteria, the transition from the part introduction and the hand-off.\n  - meet-kestrel-and-pine; commerce-payments; order-management; inventory-and-availability — Cast, systems and incidents; neighbouring contracts.\n- **External**\n  - Shopify changelog (2023), developer documentation and help center (accessed 2026-11) — The checkout extensibility timeline, Functions limits, plan gating, Shop Pay share.\n  - commercetools, Stripe and Mollie documentation (accessed 2026-11) — Order-before-outcome flow, webhook guarantees, idempotency, session expiry.\n  - Baymard Institute (2026, 2024) — Abandonment rate and reasons, form-field benchmark.\n  - PCI Security Standards Council (2025), Visa (2025), Regulation (EU) 2018/389 — Payment-page scripts, enumeration monitoring, strong customer authentication.\n  - Apple and Google developer documentation (accessed 2026-11) — Express wallet flows.\n\n## Changelog\n\n- **2026-11-12** — Round 2 (escalate: 19 passed, 32 failed after aggregation; 6 corroborated flow findings, 2 of them spec order, plus 4 draft majors; AC-1 to AC-5 pass) and closing fixes without a third round; 6,489 words. The check report is stale. Round 1 (escalate: 103 passed, 33 failed, 12 of them minor; two spec faults) resolved: p57/p60 ideas, p29 split into p29 and p29a, p23, p45 and p61 ideas revised; transitions into the Introduction thesis, the wallets, the abandoned carts, the Shopify section and the stage section written into the prose; roadmap matches the order; draft faults fixed. 67 paragraphs. Flow rubric run 2 (sound with notes): p61a returns to the three requests; stage idea names its table. Prose revised to match the spec unit for unit (6,220 words). Flow rubric run 1 (sound with notes) taken: abandoned carts moved after the failures; W1 reminder in p54; Sanne's and Milan's requests closed in p60 and p49; stage section narrowed. Converted from spec.md to an outcome spec: intent, thesis and role copied from the journal spec; supporting claims, sections, paragraphs, transitions, introduction and conclusion reconstructed from the published chapter; record-keeping sections carried over. The part rubric's notes taken: tax inputs named (p16); choices, Shopify's timeline and scale stages moved after the failures; roadmap, 'Where we are', thesis paragraph and conclusion synthesis revised or added; p16a split out; p36 and p37 merged. Status draft.\n- **2026-11-07** — Visual layer: redrew 3 mermaid diagrams as illustrations and added 2 conceptual figures (article-illustrator).\n- **2026-11-07** — Editorial review pass: Eva's delivery promise corrected to the static Wednesday 14 April (delivered a day late); VAT, iDEAL and ERP defined at first use; OMS seam date 13 October 2027.\n- **2026-11-07** — Initial spec and article.\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);

            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
