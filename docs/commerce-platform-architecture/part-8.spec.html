<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published page (posts/part-8-intro/index.md, 386 words, eight units: the KEY POINTS callout, three lead paragraphs, three chapter paragraphs and 'Begin with') and its former spec.md, then reordered the same day (see decision_log); the page was revised to match. One spec paragraph per unit of the revised page; the KEY POINTS callout and Figure 3 (three things reach a shop from outside) are evidence of the claim paragraph (p05), Figure 1 of the hook (p01) and Figure 2 of Eva's order (p03).\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Part VIII answers three questions in order: which doors are open to a script and who holds the key to each (card testing, account takeover, checkout scripts and integration credentials); which systems hold a person's data, for what purpose and for how long, and what a request requires of each; and how an applicable rule becomes owned work with a scope, a required behavior, an authoritative system, a test and a deadline.\n- **Know:** Kestrel & Pine's three examples: 48,000 abusive checkout attempts in August 2026; a customer's May 2027 deletion request that found her in nine systems; and regulatory changes that reached engineering through unrelated channels.\n- **Know:** That the response to all three begins with one map of systems, integrations and owners, extended with credentials, data purposes and retention, and applicable requirements and deadlines.\n- **Be able to:** Pick the Part VIII chapter that answers the trust question in front of them.\n\n**Audience:** Readers new to commerce architecture (engineers, product managers and leaders) who have read Parts I to VII and are about to start the trust chapters, especially those who assume the hosted platform 'handles security and GDPR', or who arrive with one security, privacy or regulatory demand in hand and want the chapter that answers it.\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side.\n- Roughly what an API, a database and a queue are.\n- Part I: the thirteen steps of an order, promise and handoff, the three status lines, the capability map, system of record, single writer, events, idempotency and reconciliation; the glosses for PSP, WMS, ERP, iPaaS, webhook, SKU, channel, marketplace connector and 3PL.\n- Parts II to VI: one owning system per fact (product, price, stock), the order record, invoices and the monthly match, and the inventory of integrations between the merchant's systems.\n- Part VII: the vendor's inside reaches the merchant as limits (API budgets, extension points with retirement dates, a checkout it cannot replace), and the merchant's promises are kept or broken in what it owns around the platform.\n- Kestrel & Pine in outline: a fictional outdoor brand, its systems, its incidents and the Waypoint program; Eva's jacket order as the book's worked order.\n\n**Does not yet know:**\n\n- Card testing, credential stuffing, account takeover and skimming as attacks (owned by commerce-security; card testing is glossed here as attempts with stolen cards, the others only named).\n- Legal role (controller and processor), retention clocks and data-subject requests (owned by privacy-and-customer-data; legal role is given here in plain words as who decides a system's use of the data).\n- The regulatory calendar and the specific rules it holds (owned by commerce-regulation; only named here).\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader of this page alone can name the three chapters' subjects in reading order. *Probe:* After reading only this page: what will each of the next three chapters tell you, in order? | `intro_predicts_content` | cold_reader | major |\n| AC-2 | A reader of this page alone can say why the part treats security, privacy and regulation as lists with owners on one map rather than as three separate disciplines. *Probe:* Using only this page: what do the part's three subjects have in common, and where does the response to each begin? | `custom` | cold_reader | minor |\n| AC-3 | Given three trust demands, the reader names the Part VIII chapter that answers each. *Probe:* Three things happen to an online shop in one month: (a) its payment provider charges fees for thousands of declined card payments made overnight; (b) a customer asks for all her data to be deleted; (c) a marketplace starts rejecting product listings that lack data a new rule requires. Using only this page: which chapter of this part do you open for each, and why? | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** What must a merchant that rents its platform do about attackers, privacy law and commerce regulation, and where does that work land?\n\n> **Claim:** Attackers, privacy law and commerce regulation act on the systems the merchant already runs and the integrations between them, while the hosted platform covers only its own service, checkout and defaults. So the merchant's work lands in lists on its map of systems, integrations and owners: every identity and key with an owner; every system holding personal data with its legal role, what a deletion request does there and how long it keeps records; every applicable rule with its data, system of record, test, date and owner.\n\n**Disputed by:** The view that security, privacy and compliance are specialist disciplines apart from the commerce architecture: covered by the platform's certifications and privacy tools, by buying a bot-management, consent or compliance product, or by the legal department when a rule comes up.\n\n**So what:** A merchant that accepts the claim answers 'are we secure?', 'are we GDPR compliant?' and 'are we ready for this rule?' by extending the system-of-record map of Part I and the integration inventory of Part VI with three columns, and buys a product only for a list it already keeps. Kestrel & Pine met each demand without a list in 2026 and 2027: 48,000 card-testing attempts on 18 to 19 August 2026 cost €2,900 in fees and a 40-minute pause of the PSP account; a deletion request of 10 May 2027 found the customer in nine of thirteen systems and took seventeen working days; four rules reached engineering through a marketplace's error log, an agency audit, a Belgian customer and an auditor's newsletter. Its answers were lists with owners: the April 2027 security baseline (MFA enforced, one identity and restricted key per integration, a decline-rate alert and a tested kill switch), the October 2027 request orchestrator (the second request took two working days) and the March 2027 regulatory calendar with an owner per row.\n\n**How and why:** Card testing and credential stuffing send normal requests to the checkout and the login, and an admin login or a leaked key bypasses every other control, so the controls sit on endpoints and identities, and a key without an owner cannot be rotated, scoped or traced. Every integration copies personal data into another system with its own legal role, and the law gives a request one month and keeps invoices for years, so a request must reach every copy with a decided action. Rules ask for fields, histories, dated events and records that only a system of record can hold, are published years before they apply and are often enforced first by partners. Vendors' shared-responsibility statements and processor roles end at their service, so whatever the merchant added is outside them, and each Kestrel & Pine incident in this part began with something nobody had on a list.\n\n**Supporting claims**\n\n- **P8-1** — Card testing, credential stuffing, policy abuse and skimming need no break-in: they send ordinary requests through the payment form, the login and the admin as designed. A hosted checkout or hosted fields keeps card numbers out of the merchant's systems, and the vendor secures its service, while the merchant secures every identity, key, app, script and endpoint it adds, each with an owner, least privilege, an alert and a rehearsed response.\n- **P8-2** — Every integration is also a data flow with a legal role: the merchant, as controller, knows for each system that holds a person its role, the action a request requires and its retention clock, keeps consent with its evidence on the customer master, splits the person from the transaction, and answers requests through an identity index and an orchestrator.\n- **P8-3** — The consumer, product-safety, invoicing and sustainability rules this part examines are data requirements with a date (a price history, dated refund events, product-safety fields, a structured invoice, a disposition record) that belong in a system of record; they are public years before they apply and are often enforced first by partners, so each needs a calendar row with scope, system, test, date and an owner who owns the fact.\n\n## Role in the part\n\nPerforms the part's opening: states the part thesis in its three key points, places the part on Eva's order (checkout and payment, price and product page, every system her name reaches), recalls Kestrel & Pine's three trust examples, and gives the reading order.\n\n## Flow\n\n**Pattern:** `small_to_large` (also `prerequisite_order` in chapters: the three chapter paragraphs, in the part's reading order)\n\nThe lead moves from the concrete to the general and then to the route: the three demands as everyday cases, the book's company meeting all three, Eva's order meeting the same three, why they land on the merchant (Part VII's layer around the rented platform, which the vendor's coverage does not reach), and the general response (one map with three added columns, one per chapter, which is also the roadmap) directly before the chapter list; the closing returns to the opening checkout and says where to begin. The cases and Eva's order follow the hook because they are its instances, so the concrete material sits together; the bridge then explains why all three land on the merchant, and the claim follows it directly because it answers that problem and announces the chapters it stands before. Put the claim first and the three columns answer demands the reader has not met; put Eva's order between the bridge and the claim and it interrupts the problem and its answer (both round 1 flow readers); put it after the claim and it reads as a third listing of the three, out of place (both round 3 readers); put the chapters before the claim and they read as three separate disciplines.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): The checkout that accepts a real purchase can also receive automated payment attacks; the address used for delivery can remain in a forgotten export; a pricing rule can require data the shop has never collected.\n\n**Bridge:** Part VII's finding that a merchant renting its platform keeps or breaks its promises in what it owns around the platform (the previous page's hand-off: the platform's structure and limits). → Promises the merchant does not choose, imposed on that same layer from outside by attackers, by people with rights over their data and by rules with a date, while the vendor covers only its own service, checkout and defaults; and Eva's jacket order, whose systems, data and transaction they all reach.\n\n**Thesis statement** (KEY POINTS bullets 1 to 3, paragraph p04 (the bridge) and paragraph p05 (the map and its three columns)): Attackers, people with rights over their data and rules with a date reach the layer the merchant owns around its rented platform, while the vendor covers only its own service, checkout and defaults; so the response to all three begins with the map of systems, integrations and owners, to which each chapter adds a column: credentials with their owners; personal data with its legal role, purpose and retention; requirements with their system, deadline and owner.\n\n**Roadmap** (paragraph p05):\n\n- Three chapters, each adding one column to the map, in order: credentials with their owners (security); personal data with its legal role, purpose and retention (privacy); requirements with their system, deadline and owner (regulation). *Kept in:* chapters.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | A shop's own functions bring demands from outside: the checkout that accepts a real purchase also receives automated payment attacks, a delivery address can remain in a forgotten export, and a pricing rule can require data the shop never collected. | example: The checkout, the delivery address in an export, the pricing rule that needs uncollected data.; figure: Figure 1: the attacker's way in: a shop front with three intact doors (payment form, login, admin) and a robot walking in through them as built; none has to be broken to be abused. |  |\n| p02 | example | Kestrel & Pine, the fictional outdoor brand, met all three: 48,000 abusive checkout attempts with stolen cards one August 2026 night, a customer's May 2027 request to delete her data, and four rules that reached engineering through unrelated channels, such as listings a marketplace rejected. | scenario: 48,000 checkout attempts with stolen cards on the night of 18 to 19 August 2026; the deletion request of 10 May 2027; four rules through four doors (fictional company, real rules). | `example`: The three demands of the hook, none needing a break-in. → Kestrel & Pine's real cases of each, labelled fictional. |\n| p03 | context | Eva's jacket, the order the book follows, meets all three demands: security at its checkout and payment, privacy in every system her name reaches, and regulation at its price, product page, invoice and return. | figure: Figure 2: where Part VIII meets Eva's jacket: security at the checkout and the payment, privacy in every system her name reaches and in the request that one day asks for it back, regulation at the price, the order button, the product page and the refund clocks. | `example`: The three demands Kestrel & Pine met. → Where the same three meet Eva's order, in the order security, privacy, regulation. |\n| p04 | context | Part VII found that a merchant renting its platform keeps or breaks its promises in the layer it owns around the platform; Part VIII adds demands made on that layer by attackers, people with rights over their data and rules with a date, which the vendor's coverage of its own service, checkout and defaults does not reach: the accounts, keys and scripts the merchant adds. | reasoning: Part VII's finding (the previous page's hand-off); the vendor's coverage ending at its own service, checkout and defaults. | `cause_effect`: The three demands, met by the company and reaching Eva's order, and Part VII's finding about the layer the merchant owns around the platform. → Why they land on the merchant: demands made on that layer, which the vendor's coverage does not reach. |\n| p05 | claim | The response to these demands begins with the earlier parts' map of systems, integrations and owners, to which each chapter adds a column (credentials with their owners; personal data with who decides its use, its purpose and retention; requirements with their system, deadline and owner); the map makes responsibilities actionable, though each topic still needs its own controls. | reasoning: KEY POINTS callout: attackers use the shop as built and the merchant secures every identity, key, app and script it adds; the order and the person are different things in law; most rules are data requirements with a date, each in a system of record with a test and an owner.; figure: Figure 3: three things reach a shop from outside (an attacker's script, a person with rights, a rule with a date), each answered by a list with owners; the three lists are columns of the same ownership map. | `problem_solution`                     const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
