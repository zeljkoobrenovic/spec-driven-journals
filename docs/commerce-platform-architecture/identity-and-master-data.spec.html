<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/27-identity-and-master-data/index.md) and its former spec.md, whose Non-goals, Modalities, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter, plus the units the contract asks for and the published chapter did not have (a thesis paragraph p05, a roadmap p06 and a conclusion paragraph that answers the opening, p52); see decision_log.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The identifiers a commerce estate uses for customers (customer id, e-mail, phone, loyalty number, company plus person) and for products (SKU, GTIN, platform, ERP, WMS and marketplace ids), who assigns each and how stable it is.\n- **Know:** The responsibilities that make up identity (the master, the cross-reference and merge log, matching, survivorship, consent, the customer data platform) and the vocabulary of matching: deterministic and probabilistic rules, normalization, blocking, the review band.\n- **Know:** The ownership options (the platform as master, the ERP or a CRM, a cross-reference and matching service, a customer data platform, an MDM platform at the Group stage) and where each fits.\n- **Believe:** Duplicates are the normal state of a commerce estate, and identity is a decision before it is software.\n- **Believe:** A customer data platform's profile is a copy for marketing; the record that drives orders, refunds, invoices and deletion requests must be exact and owned.\n- **Believe:** A merge that joins two different people is a privacy incident, not a data-quality blemish, so every merge must be reversible.\n- **Be able to:** Name the master for each entity at their own company and say where the cross-reference lives and who works the review queue.\n- **Be able to:** Write matching and survivorship rules that link automatically only on exact normalized keys and send partial matches to a person.\n\n**Audience:** Readers new to commerce architecture; most of all the engineer, analyst or product manager asked how many customers there are or whether the store customer is the online customer, and next the marketing or service lead choosing between a customer data platform, a loyalty program and fixing the data first.\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side; roughly what a database and an API are.\n- Kestrel & Pine, its people, its thirteen systems, its incidents in outline and the names of the sixteen failure patterns, including the Familiar Stranger and the Spaghetti Junction.\n- From Part I: the thirteen steps of an order, 'system', 'the shop platform' and 'commerce platform', the four scale stages, the capability map, system of record, single writer, events, idempotency and reconciliation, the Waypoint decisions W1 to W8.\n- Glosses already given: PSP, WMS, ERP, iPaaS, EDI, webhook, SKU, channel, marketplace connector, order management system, D2C, B2B, PIM, POS; from Part II, product, variant, SKU and GTIN with one owning system per attribute.\n- From Part VI so far: integration styles and the flow inventory with owners (chapter 24); late, duplicated and out-of-order messages, idempotency keys, outbox, dead-letter queue and the reconciliation job (chapter 25); written contracts, pinned versions and sunset dates (chapter 26).\n\n**Does not yet know:**\n\n- Identifier, customer identity, master data, master, cross-reference, merge log, golden record.\n- Matching (record linkage), deterministic and probabilistic matching, normalization, blocking, thresholds and the review band, survivorship.\n- Customer data platform (CDP), master data management (MDM), CRM, GLN, consent as demonstrable evidence.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given four customer lists that cannot be linked, the reader says what must be decided before a loyalty program and how the records should be linked, not which customer data platform to buy. *Probe:* A brand wants to launch an online loyalty program. Its platform holds customer accounts keyed by e-mail, its store tills a loyalty list keyed by phone number, its newsletter tool subscribers keyed by e-mail, and its returns portal contacts keyed by e-mail plus order number; the four lists add up to far more records than anyone believes are customers. Using only this chapter: what must be decided first, and how should the records be linked? | `custom` | cold_reader | major |\n| AC-2 | The reader can state the objection to making a customer data platform the master, and the role it should have instead. *Probe:* Marketing proposes that its customer data platform become the single customer record that service agents, the order system and finance read. Using only this chapter: what is the objection, and what role should the platform have? | `custom` | cold_reader | major |\n| AC-3 | The reader can say what happens to a product without a shared identifier and where the product cross-reference belongs. *Probe:* Using only this chapter: a marketplace listing carries no GTIN that matches the warehouse item. What happens, and where should the product cross-reference live? | `custom` | cold_reader | minor |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict the chapter's sections and the kind of evidence it uses. *Probe:* After reading only the introduction: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as sections[].paragraphs[]. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** How do you know that records in different systems are the same customer or product, and who should own the answer?\n\n> **Claim:** Records are the same only where the merchant decided so per entity: name its master (the shop platform for consumers, the ERP for business customers, the PIM or the ERP item master for products); keep an owned cross-reference of every system's identifier with a reversible merge log; link automatically only on exact normalized e-mail, phone or product codes, sending scored partial matches to a named reviewer. A customer data platform is a marketing copy.\n\n**Disputed by:** The view that identity is a software purchase: a customer data platform or an MDM tool finds the duplicates and becomes the single customer view, or the platform's own merge is run across every list, so the merchant need not choose a master per entity or review merges.\n\n**So what:** A merchant that accepts the claim names a master per entity, an owner for the cross-reference and a person for the review queue before it buys a customer data platform or launches a loyalty program. In March 2027 Kestrel & Pine held about 410,000 platform customer records, 38,000 POS loyalty entries, 165,000 newsletter subscribers and 61,000 returns contacts, about 674,000 records, and nobody could say how many customers it had; one customer, Eva Janssen, was four records with no field shared by all four, and online loyalty was deferred. The June 2027 identity rule names the platform as master for consumers and the ERP for business customers and keeps the cross-reference in the data warehouse under Hanna Berg; its first run, in July 2027, linked about 21,000 loyalty entries and 96,000 subscribers and queued about 4,100 for review, and Eva became one master with three links.\n\n**How and why:** Each system was bought for one job and keys people and products by what that job has: e-mail online, phone or loyalty card in the store, company plus person in wholesale, an internal stock code in the warehouse, the GTIN on a marketplace. Duplicates are therefore the default, and a link exists only where someone builds it. Exact keys written two ways are caught by normalization; partial agreement needs scoring, which makes errors, so a middle band goes to a person. A merge that joins two people sends one person's orders, refunds or consent to the other, so it must be logged and reversible, and a profile tuned to find audiences tolerates matches that an invoice or a deletion request cannot.\n\n**Supporting claims**\n\n- **S1** — Each system keys people and products by what its own job has (e-mail online, phone or loyalty card in the store, company plus person in wholesale, SKU and GTIN for products), so duplicates are the normal state of an estate and nothing links them unless someone builds the link; undecided identity costs marketing, service, loyalty, returns, analytics and privacy.\n- **S2** — Identity is a set of responsibilities, not one system: a named master per entity, a cross-reference and merge log, matching, survivorship and consent; the master owns the record, the cross-reference owns the links, and every other system keeps its record but carries the master's id once matched.\n- **S3** — Matching links automatically only on exact normalized keys, scores partial agreement and sends the middle band to a person, never runs in a customer-facing flow, and keeps every merge reversible, because a wrong merge is a privacy incident; survivorship is written per field and consent travels with its evidence.\n- **S4** — The master is chosen per entity: the platform for consumers, the ERP or a CRM for business customers, a cross-reference and matching service when several systems hold customers, the ERP item master or the PIM for products, MDM only at the Group stage; a customer data platform is a marketing copy fed by the master, not the master.\n- **S5** — Kestrel & Pine's June 2027 identity rule applies the design without moving any data: the shop platform as master for consumers, the ERP for business customers, the cross-reference in the data warehouse, weekly matching with review; its July run turned Eva's four records into one master with three links.\n\n## Role in the part\n\nGives the part shared identity: a named master per entity, the cross-reference and merge log that make several records one, written matching and survivorship rules, and the line between the exact operational master and the marketing profile. Supports P6-4 of part `part-6`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in why, pieces and matching: the vocabulary and identifiers, then the responsibilities that use them, then the matching mechanism the responsibilities name; `comparison` in choices, trade-offs and stages: the options, then compared on the same criteria, then by scale stage)\n\nThe scene comes first so that every term arrives as part of the answer to why nobody can count Kestrel & Pine's customers. The costs and identifiers follow, because they explain why duplicates are the default. The responsibilities come next, because they name what has to be decided; matching and merging follow, because the responsibilities table and the per-flow table name matching, survivorship and consent before explaining them. Only then are the ownership options compared, because each option is judged by how it handles matching, merges and consent; the trade-offs and stages follow at once as the rule for choosing. Kestrel & Pine's decision applies the chosen option, and the failures come last because each is read against the rules that detect and recover from it. Putting the options before matching would compare them on properties the reader cannot yet judge; putting the decision before the options would apply a choice not yet argued.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): A customer buys online, joins a store loyalty scheme and later contacts the returns portal, and each system may create its own record for that person; at Kestrel & Pine nobody can say how many customers there are.\n\n**Bridge:** Anyone who has been asked 'how many customers do we have' or been sent a newsletter offer for a first order after buying three times knows the symptom. → The contracts of the previous chapter fix how systems speak, not whether their records describe the same customer or product; that needs a decision per entity about the master, the links and the matching rules.\n\n**Thesis statement** (KEY POINTS callout and paragraph p05): Records are the same only where the merchant has decided so, entity by entity: a named master for each (the shop platform for consumers, the ERP for business customers, the PIM or the ERP's item master for products), an owned cross-reference of every system's identifier with a reversible merge log, automatic links only on exact normalized e-mail, phone or product codes and scored partial matches sent to a named reviewer; a customer data platform is a copy for marketing.\n\n**Roadmap** (Paragraph p06):\n\n- Start with Kestrel & Pine's four customer lists and Eva's four records. *Kept in:* scene.\n- Say what undecided identity costs and which identifiers customers and products carry. *Kept in:* why.\n- Lay out the responsibilities that make up identity. *Kept in:* pieces.\n- Explain matching, merging and consent. *Kept in:* matching.\n- Compare the ways to own customer and product identity by trade-off and scale stage. *Kept in:* choices, trade-offs, stages.\n- Follow Kestrel & Pine's 2027 decision and end with what goes wrong. *Kept in:* in-practice, wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | The previous chapter's contracts fix how two systems speak, but not whether the records on both sides are the same customer: a shopper who buys online, joins a store loyalty scheme and contacts the returns portal can become a separate record in each system, and at Kestrel & Pine those lists overlap, so support misses history and reports count one buyer several times. | scenario: One customer buying online, in a store and through the returns portal, each system creating its own record. |  |\n| p02 | example | Products have the same problem: one Ridgewalker women's M in moss is a variant on the shop platform, an item in the ERP and in the WMS and several marketplace offers, each with a local identifier, and if only the connectors know how they match, replacing a connector loses the relationship. | example: The Ridgewalker women's M moss as a platform variant, an ERP item, a WMS item and marketplace offers. | `similarity`: One customer as several records. → One product as several records. |\n| p03 | definition | The chapter's terms are master data (the shared records transactions refer to), matching (deciding that two records describe the same entity) and the golden record (the maintained authoritative view assembled from them); ownership in general, personal-data rules, the product model and which record is the order are other chapters' subjects. |  | `elaboration`: Customers and products held as several records. → The three terms the chapter uses for the remedy, and what it leaves to other chapters. |\n| p04 | context | In the order's journey, Eva buys her jacket online on 13 April 2027 after earlier buying socks through the Nijmegen store's loyalty account, and her exchange request creates a returns contact on 19 April; the question is whether those systems can tell that their records describe one customer. | scenario: Eva's order #1072455 of 13 April 2027, her store loyalty account and the returns contact of 19 April. | `example`: The general problem and its terms. → The recurring order and its customer as the chapter's case. |\n| p05 | claim | The chapter's answer: records are the same only where the merchant has decided so, entity by entity; it names a master for each (the shop platform for consumers, the ERP for business customers, the PIM or the ERP's item master for products), keeps an owned cross-reference of every system's identifier with a reversible merge log, links automatically only on exact normalized e-mail, phone or product codes and sends scored partial matches to a named reviewer, and treats a customer data platform as a copy for marketing. |  | `problem_solution`: Eva as several records in several systems. → The chapter's answer, stated before the evidence for it. |\n| p06 | transition | The chapter starts with Kestrel & Pine's four customer lists and Eva's four records, says what undecided identity costs and which identifiers customers and products carry, lays out the responsibilities that make up identity, explains matching, merging and consent, compares the ways to own customer and product identity by trade-off and scale stage, follows Kestrel & Pine's 2027 decision and ends with what goes wrong; the evidence is the scenario, vendor documentation and the record-linkage literature. |  | `sequence`: The answer in one paragraph. → The order in which the sections argue it and the kind of evidence they use. |\n\n## Sections\n\n### Setting the Scene at Kestrel & Pine: Four Evas\n\n**Controlling idea** (`context`, id `scene`): In March 2027 Kestrel & Pine could not say how many customers it had: four lists keyed differently added up to about 674,000 records, Eva Janssen was four of them with no shared field, and online loyalty was deferred.\n\n**Advances the thesis** (S1): Shows duplicates as the normal state of an estate where each system keys people by what its job has, and the cost of no decision.\n\n**Transition in:** `example`: The roadmap's first item: the four lists and Eva's four records. → The March 2027 loyalty proposal that exposed them.\n\n**Order of paragraphs** (`problem_solution`): The loyalty question first, because it is why anyone counted; then the counts, then the total nobody believes, then one person inside the total, then the name and the consequence. The name of the problem cannot come before the reader has seen it in one person.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | context | In March 2027 Milan Petrov's proposal for an autumn online loyalty program ran into Noor Visser's question of how it would recognize a store customer online, and nobody could count eligible customers or connect the accounts. | scenario: Milan's autumn loyalty proposal and Noor's question, March 2027. |  |\n| p08 | evidence | Ruben Alves's counts, labelled illustrative, show four lists in four systems, each keyed by what that system has: customer id and e-mail on the shop platform, phone and loyalty number in the POS, e-mail in the newsletter tool, e-mail plus order number in the returns portal. | table: About 410,000 platform records including guest checkouts, 38,000 POS loyalty entries, 165,000 newsletter subscribers, 61,000 returns contacts, with the key each uses. | `cause_effect`: Nobody could count customers. → The counts Ruben pulled. |\n| p09 | analysis | The four lists add up to about 674,000 records, which nobody believes is the number of customers and nobody can replace with the right one. | statistic: About 674,000 records in total. | `conclusion_summary`: The four counts. → Their total and why it answers nothing. |\n| p10 | example | Eva Janssen shows why: one person in Nijmegen is four records, an online account, a POS loyalty entry, an older newsletter subscription and a returns contact, each missing what the others know. | table: Eva's four records: the platform account from 2024 with order #1072455, a Nijmegen address and her mobile number, the loyalty entry from 2023 with her mobile number, the newsletter subscription from 2022 under an older e-mail with her name and street address, the returns contact of 19 April 2027 with her personal e-mail. | `example`: The total nobody can explain. → One person inside it. |\n| p11 | analysis | No field is shared by all four, which is the book's Familiar Stranger, and Milan and Noor defer online loyalty until the relationship can be maintained. | case: The Familiar Stranger (incident 9) and the deferred loyalty program.; figure: Figure 1: one shopper with four disconnected record cards keyed by different identifiers. | `conclusion_summary`: Eva's four records. → The name of the pattern and the decision it forced. |\n\n### Why One Customer and One Product Matter\n\n**Controlling idea** (`explanation`, id `why`): Undecided identity costs a merchant in marketing, service, loyalty, returns, analytics and privacy, and the identifiers customers and products carry are assigned by different parties with different stability, so nothing links them by itself.\n\n**Advances the thesis** (S1): Defines the vocabulary, gives the costs, and shows from the identifiers themselves why duplicates are the default.\n\n**Transition in:** `cause_effect`: Eva as four records and the deferred loyalty program. → What undecided identity costs in general.\n\n**Order of paragraphs** (`prerequisite_order`): The losses first, because the heading and the scene promise the cost; then the few terms the identifier tables need; customer identifiers before product identifiers, following the scene; the source and policy of the product table last, because it comments on the table. Opening with definitions (the round-1 and round-2 order) made both round-2 flow readers look for the cost the heading promised; putting the tables first would show identifiers before the reader knows why they matter.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p13 | explanation (list) | Eva's four records are one case of a wider cost: undecided identity loses money or trust in six places: marketing, service, loyalty and promotions, returns and refunds, analytics and privacy. | example: Eva's new-subscriber offer at her older e-mail; an agent who cannot see her store purchases; once-per-customer promotions; store credit raised against the wrong record; undefined repeat rate; a deletion request due within one month. |  |\n| p14 | example | Products have their own version of each loss: a marketplace listing without the GTIN (the global barcode number) of the warehouse item becomes a second product, and an ERP item whose variant code maps to no platform variant is a sale the ERP cannot cost. | example: A marketplace listing without the GTIN; an ERP variant code with no platform variant. | `similarity`: The customer losses. → The product losses. |\n| p12 | definition | Naming the fix needs a few words: an identifier tells one record from another, customer identity is the set of identifiers different systems use for one person plus the rules that link them, and the system of record for master data (the term from the start of the chapter) is called the master. |  | `elaboration`: The losses, all from records nothing links. → The words for what has to be linked and who holds the true version. |\n| p15 | description | Customers carry six kinds of identifier, from a system's own customer id to company plus contact, and each is assigned by a different party, with different stability and uniqueness, so e-mail is the usual match key but never a perfect one. | table: Customer id, e-mail, phone, loyalty number, postal address, company id plus contact: who assigns each, how stable, how unique, who else understands it. | `cause_effect`: The definition of an identifier. → The identifiers that would have to be linked, customers first. |\n| p16 | description | For products, the SKU and the GTIN are assigned once and never change (though connectors can overload the SKU field with other codes), but each identifier serves a different scope: the GTIN outside the company, the SKU inside it, internal ids inside one system and marketplace ids inside one channel. | table: GTIN, SKU, internal id and marketplace id: who assigns, scope, what each is good for and what it is not. | `similarity`: Customer identifiers. → Product identifiers. |\n| p17 | analysis | The product table synthesizes GS1's GTIN definition and Microsoft's Business Central connector documentation, whose rule of matching on SKU or barcode and linking rather than creating is a product-identity policy: match on governed identifiers, link, never duplicate. | source: GS1 US, 'What is a GTIN?' (n.d.); Microsoft Learn, Synchronize items with Shopify (October 2026). | `elaboration`: The product identifier table. → Its sources and the policy one of them states. |\n\n### How the Pieces Fit Together\n\n**Controlling idea** (`explanation`, id `pieces`): Identity is a set of responsibilities spread across existing systems (the customer and product masters, the cross-reference and merge log, matching, survivorship, consent and the CDP), and the design rule is that the master owns the record, the cross-reference owns the links and every other system carries the master's id once matched.\n\n**Advances the thesis** (S2): Names the responsibilities a merchant must assign and the rule for assigning them.\n\n**Transition in:** `problem_solution`: Identifiers that nothing links by itself. → The responsibilities that build and keep the links.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | description | Identity is not one system but responsibilities spread across the systems a merchant already has, and at the time of the scene Kestrel & Pine had assigned none of them. | table: Customer master, product master, cross-reference and merge log, matching, survivorship, consent, CDP: what each does, where it usually lives, and Kestrel & Pine in March 2027. |  |\n| p19 | claim | The design rule: the master owns the record, the cross-reference owns the links, and every other system keeps its own record but carries the master's id once matched, so the master knows where its copies are. | figure: Figure 2: four systems keep their own records of Eva, linked through a cross-reference to one master. | `conclusion_summary`: The responsibilities and their homes. → The rule that assigns them. |\n\n### Matching and Merging\n\n**Controlling idea** (`explanation`, id `matching`): Matching decides that records without a shared identifier are one entity, by exact rules or scored partial agreement after normalization and blocking; survivorship decides which values win in a merge; and because a wrong merge is a privacy incident, automatic links are kept to exact keys, the middle band goes to a person, every merge is reversible and consent travels with its evidence; a new store record and the requirements per flow show the rules at work.\n\n**Advances the thesis** (S3, S2): Gives the mechanism of matching and merging and the rules that keep it safe, then shows them applied to one new record and to each identity flow.\n\n**Transition in:** `elaboration`: The design rule: the cross-reference owns the links. → How a link is decided: what matching is and how it works.\n\n**Order of paragraphs** (`prerequisite_order`): Definition and history, then the preparation every comparison needs (normalization, blocking), then the two rule families, then the scoring model of the probabilistic family, then the rules that use all of them, in the order a matching run performs them (both round-3 flow readers had to rebuild the process order when scoring came first); survivorship after matching, because it acts on the merge matching decides; consent straight after survivorship, because it is the field a merge must not get wrong and survivorship already names the strictest consent; the walk-through of one new record and the per-flow requirements next, because they use normalization, exact and probabilistic matching and consent (readers in round 1 found them used before they were explained when the walk-through sat in the previous section); products last, as the simpler case, so the customer thread runs unbroken (both round-2 flow readers lost it when products sat between consent and the walk-through). The rules cannot precede the terms they use.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p24 | definition | Matching is deciding that two records that do not already point to each other are the same real-world thing, and the field, record linkage, is older than commerce computing: Dunn in 1946, Newcombe in 1959, and the scoring model Fellegi and Sunter gave in 1969, explained below. | source: Wikipedia, 'Record linkage' (secondary source for Dunn 1946, Newcombe 1959, Fellegi and Sunter 1969). |  |\n| p27 | process | Before any comparison, normalization writes e-mails, phone numbers and postal codes one way, which removes most apparent duplicates, and for larger estates blocking compares only pairs that already agree on something, because comparing every pair grows with the square of the count. |  | `sequence`: Matching defined. → The preparation every comparison needs: normalization, and blocking for larger estates. |\n| p26 | comparison | Not every pair needs a score: deterministic matching links on exact rules and is cheap, explainable and safe but misses people with two e-mail addresses; probabilistic matching scores partial agreement, finds more and errs more, so it needs thresholds and a review queue. |  | `sequence`: Normalized keys and blocked pairs. → The two families of rule that compare them and what each costs. |\n| p25 | explanation | The probabilistic family's scoring model, in plain words: each candidate pair's evidence is added up field by field and compared with two thresholds: above the upper one a match, below the lower one not, and between them a person decides. |  | `elaboration`: Probabilistic matching, which needs thresholds and a review queue. → How its Fellegi–Sunter scoring works in plain words. |\n| p28 | recommendation (list) | The author's five rules for customer matching: normalize and link exact e-mail or phone automatically; score name, address and postal code with a review band and never link on name plus city alone; never merge in a customer-facing flow; keep every merge reversible in a log; treat a wrong merge as a privacy incident and rehearse the unmerge. | figure: Figure 3: normalization, exact links, scored pairs split into auto-link, review queue and keep-apart, every link written to a reversible log. | `conclusion_summary`: Normalization, the two rule families and the scoring thresholds. → The rules that combine them for a merchant. |\n| p29 | definition | Survivorship decides which value wins per field when merging records disagree, by source priority, recency or completeness: the newest address, the strictest consent, the earliest created-date. | source: Profisee, 'What Is a Golden Record in MDM?' (August 2025). | `sequence`: The decision that two records are one. → Which of their values survives the merge. |\n| p30 | evidence | Shopify's customerMerge documentation is the clearest dated example of a platform's own survivorship, and because each system merges by its own rules, the customer master must be named or two systems' versions of one customer drift apart. | quotation: customerMerge (API 2026-10): the ids 'don't guarantee which customer is kept'; e-mail, enabled account, then consent state; a job whose resulting id is 'authoritative'; a preview. | `example`: Survivorship rule types. → A platform that publishes its own. |\n| p32 | explanation | A merge must preserve what the person agreed to, because the GDPR requires consent to be demonstrable: consent is a record of when, where and to what the person agreed, which a merge carries forward with its source instead of recomputing it from the surviving record, so a delivery address never becomes permission to market. | source: GDPR Articles 4(11) and 7(1); Shopify's consent mutation recording 'when and where'. | `emphasis`: Survivorship per field, including the strictest consent, and a platform's own merge rules. → The field a merge must never get wrong: consent, with the legal reason. |\n| p20 | example | A store purchase like Eva's socks in February 2027, replayed as it would run under the design rule and these matching rules (no such rule existed then), shows how a new record should find its master. | figure: Figure 4: a store purchase matched on a normalized phone number, linked to the master, consent read from the master. | `example`: The matching rules, survivorship and consent. → One new customer record finding its master under them. |\n| p21 | analysis | Three things carry that design: the POS keeps its entry and gains a master id, the match is on an exact key written one standard way (normalized) so no person is needed, and consent is read from the master rather than recreated. |  | `elaboration`: The store purchase sequence. → What in it does the work. |\n| p22 | description | The store purchase is one identity flow; identity flows differ in how fresh, consistent, fast and available they must be, from checkout, which must never wait, to a new product variant created weeks before launch. | table: Checkout logged in, guest checkout, store sign-up or purchase, newsletter sign-up, returns-portal contact, new product variant: freshness, consistency, speed and availability for each. | `elaboration`: One flow, the store purchase. → All identity flows side by side. |\n| p23 | analysis | The pattern is that customer-facing flows are exact or deferred, never fuzzy: nothing in checkout waits for a matching job, and probabilistic matching (scoring partial agreement) runs in the background and sends uncertain cases to a person, so the rules just explained never slow a customer down. |  | `conclusion_summary`: The per-flow requirements. → The rule they share, and the matching it points to. |\n| p31 | comparison | For products, matching is simpler and stricter: the GTIN across companies, the SKU inside one, never-reused GTINs, and a product cross-reference that belongs to the PIM where there is one and the ERP's item master where there is not. | figure: Figure 5: one product with two governed identifiers and four internal ones, cross-referenced in the PIM. | `contrast`: Customer matching, merging, consent and the customer flows. → Product matching, which rests on governed codes. |\n\n### The Choices\n\n**Controlling idea** (`comparison`, id `choices`): A merchant has four realistic ways to own customer identity (the platform, the ERP or a CRM, a cross-reference and matching service, a CDP) and two for products (the ERP item master or the PIM), plus an MDM platform at the Group stage; a CDP should not be the master that operations read.\n\n**Advances the thesis** (S4): Sets out the ownership options and where each fits, including the author's position on the CDP.\n\n**Transition in:** `sequence`: How matching, survivorship and consent work. → Who should own them.\n\n**Order of paragraphs** (`comparison`): The count of options first, then the customer options from the most common to the most contested, then MDM as the Group-stage fifth, then the product options (readers in round 1 lost count when the product options sat between the CDP and MDM); the CDP judgement follows the CDP's own definition, so the reader sees the claim before the objection. Putting MDM among the customer options would present a Group-stage purchase as an everyday choice; putting the objection before the definition would argue against a claim not yet stated.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p34 | transition | With matching, survivorship and consent explained, the question is who owns them: a merchant has four realistic ways to own customer identity, a fifth for the Group stage, and two for products. |  |  |\n| p35 | description | The platform's customer record as master, with periodic deduplication, fits a consumer merchant whose platform already holds most customers, which is most merchants below the Group stage. |  | `sequence`: The four ways announced. → The first and most common. |\n| p36 | description | The ERP or a CRM as master fits wholesale-heavy businesses whose customers are companies with terms and credit, and usually fails for consumers because the ERP's record was designed for invoicing. |  | `contrast`: The platform as master for consumers. → The finance or sales system as master for business customers. |\n| p37 | description | A cross-reference and matching service beside the existing systems moves nothing, holds the master id, links and merge log, and is the lightest way to make several masters behave as one; Kestrel & Pine later combines it with the shop platform as master for consumers, though it is 'just tables' until a wrong merge happens. |  | `sequence`: Two options that pick one system as master. → An option that links several. |\n| p38 | description | A customer data platform, as the CDP Institute and Twilio Segment describe it, builds a persistent unified profile through an identity graph and claims primary responsibility for customer identity. | quotation: CDP Institute (2026): 'creates and maintains a persistent, unified customer record' and 'assumes primary responsibility for defining and maintaining customer identity'; Twilio Segment identity resolution (June 2026). | `sequence`: Three options built from existing systems. → The option that is a separate product. |\n| p39 | counterargument | The author's labelled judgement: a CDP is a strong marketing tool but should not be the master that service agents, the OMS and the ERP read, because its profile may be fuzzier than a record that drives invoices, refunds and deletion requests; the exact master feeds it and its matches return as suggestions. |  | `contrast`: The CDP's claim to be the master. → The author's objection and the role it should have instead. |\n| p41 | description | A master data management platform builds a golden record per customer or product by matching and merging across systems with an audit trail, and is a Group-stage purchase driven by several brands, acquisitions or countries; below that stage MDM is a decision per entity, not a product. | quotation: Informatica: MDM creates 'a single master record for each person, place, or thing', 'also known as a golden record'. | `sequence`: Four ways to own customer identity below the Group stage. → The fifth, for the Group stage. |\n| p40 | description | For products, the ERP item master with a SKU and a GTIN per variant is enough until content needs enrichment, translation and syndication; from then the PIM is the product master and the ERP keeps costs and purchasing, as Waypoint's W3 decided. |  | `contrast`: The five customer options. → The two product options. |\n\n### Trade-offs\n\n**Controlling idea** (`comparison`, id `trade-offs`): Set side by side, the five options differ in when they fit, what they cost and the warning sign that one is misused, and the product side has the same shape in miniature.\n\n**Advances the thesis** (S4): Turns the options into a rule for choosing.\n\n**Transition in:** `conclusion_summary`: The five options described one by one. → The same options compared on the same criteria.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p42 | comparison | Introduced before it, the trade-off table shows each of the five options (four ways to own customer identity plus MDM) fitting one situation and carrying its own warning sign, and the product side has the same shape in miniature, with never two masters for one identifier. | table: Platform, ERP or CRM, cross-reference service, CDP and MDM: fits when, strengths, costs and limits, warning sign. |  |\n\n### Across Scale Stages: When It Fits and When It Limits\n\n**Controlling idea** (`analysis`, id `stages`): The identifiers do not change with scale but the number of systems holding copies does, so the cheapest identity decisions are the earliest, and Kestrel & Pine is a stage-3 merchant that skipped the stage-2 decision.\n\n**Advances the thesis** (S4): Places the choice of master on the book's four stages and says when each becomes necessary.\n\n**Transition in:** `elaboration`: The options compared by situation. → The same choice placed on the book's four scale stages.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p43 | description | Across the book's four stages, what is typical, what becomes necessary and the warning signs of outgrowing it change from one platform record to an MDM function across brands. | table: Starting, Growing, Omnichannel, Group: typical, necessary, warning signs. |  |\n| p44 | analysis | The judgement: the identifiers stay the same and the cheapest decisions are the earliest (one SKU and GTIN per variant, one e-mail per account, a named customer master before the first store); Kestrel & Pine skipped the stage-2 decision and so has four lists and no answer. |  | `conclusion_summary`: The stage table. → What it shows, applied to Kestrel & Pine. |\n\n### In Practice\n\n**Controlling idea** (`evidence`, id `in-practice`): The public evidence is vendor documentation rather than case studies, and Kestrel & Pine's June 2027 identity rule applies the chapter's design: the shop platform as master for consumers, the ERP for business customers, the cross-reference in the data warehouse, weekly matching with review, and consent read from the master.\n\n**Advances the thesis** (S4, S5): Shows what vendors document and one merchant's decision and first results under the chapter's rules.\n\n**Transition in:** `example`: Kestrel & Pine as a stage-3 merchant without a decision. → What vendors document and the decision Kestrel & Pine took.\n\n**Order of paragraphs** (`chronological`): Public evidence first, then the June decision, its July first run, Eva's links, the product side and what it bought, in the order they happened; what the decision bought comes last because it needs the results.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p45 | evidence (list) | The public evidence is documentation, not case studies: Shopify documents merge and consent features that work only on its own records and a suite POS as its answer to the Familiar Stranger; Microsoft's connector shows how two settings make two cross-references; the CDP category and the MDM vocabulary have dated definitions. | source: Shopify (2026), Microsoft Business Central connector (October 2026), the CDP category (2013–2026), Informatica, Profisee and DAMA DMBOK (2024). |  |\n| p46 | example (list) | In June 2027 Noor Visser, Milan Petrov and Ruben Alves adopted a customer-identity rule as an addition to Waypoint: the shop platform as master for consumers, the ERP for business customers, the cross-reference and merge log in the data warehouse under Hanna Berg, weekly matching with a review queue, and consent read from the master with the strictest state winning. | scenario: The June 2027 identity rule, illustrative. | `example`: Public documentation. → Kestrel & Pine's own decision. |\n| p47 | evidence | The first run, in July 2027, linked about 21,000 of the 38,000 loyalty entries by exact phone or e-mail, sent about 4,100 to review, and matched about 96,000 of the 165,000 newsletter subscribers. | statistic: 21,000 of 38,000 loyalty entries linked; 4,100 queued; 96,000 of 165,000 subscribers matched. | `time`: The rule adopted in June. → Its first run in July. |\n| p48 | example | Eva's four records became one master with three links: her loyalty entry by phone, her returns contact by its e-mail address, and her older newsletter address by a reviewer who saw the same name, street and postal code. | scenario: Eva's master with three links. | `example`: The run's totals. → One customer inside them. |\n| p49 | evidence | The product side waited for the PIM, whose July 2027 load found 1,900 variants with conflicting attributes, and the product cross-reference, the Ridgewalker women's M moss among its rows, was built in the PIM at the same time (W3). | statistic: 1,900 conflicting variants at the PIM load, July 2027. | `contrast`: Customer identity settled in July. → Product identity, which waited for the PIM. |\n| p50 | analysis | The decision bought one answer to how many customers, a loyalty program that could start in 2028 on one list, a service screen that could show store and online purchases together once the OMS arrived, and an index of where every person's data lives. |  | `conclusion_summary`: The decision and its first results. → What it made possible. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`analysis`, id `wrong`): Identity fails through wrong merges, guest-checkout duplicates, consent lost in a merge, overloaded SKUs, missing GTINs and connectors that owned the mapping; the wrong merge is the dangerous one, and its safeguard is a reversible log and a person in the middle band.\n\n**Advances the thesis** (S3): Shows each failure with its detection and recovery, read against the rules.\n\n**Transition in:** `contrast`: What the decision bought. → What goes wrong when identity is handled badly.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p51 | analysis | The decision's gains hold only while its rules do; of the six failures the table then lists, the wrong merge makes matching dangerous and is guarded by a reversible log and a person in the middle band, not a better algorithm, and the overloaded SKU is the product-side Spaghetti Junction: the identifier policy hidden in one connector's settings. | table: Six failures with how each shows, detection and recovery. |  |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The opening's shopper and jacket variant are one customer and one product only because someone decided so: a named master per entity, an owned cross-reference, exact automatic links and reviewed partial ones; the marketing profile is fed from that record and never replaces it.\n\n**So what:** A merchant that decides identity before it buys a CDP or launches loyalty can count its customers, serve them across channels and find every copy of a person when asked to delete it; one that does not is left with four lists and no answer.\n\n**Callback:** The introduction's shopper who becomes a record in each system and the Ridgewalker variant held by four systems, and Eva's four records. p52 answers both with the design the sections built, and names what it gave Kestrel & Pine.\n\n**Takeaway** (`course_of_action`): For each master entity, name its master, the home and owner of its cross-reference, the matching rules, who works the review queue, and how an unmerge is done.\n\n**Hand-off** to [Counting the Same Thing Everywhere: Data Platforms, Definitions and Analytics](commerce-data-and-analytics.html): `cause_effect`: The master per entity and the cross-reference, which let a merchant say who its customers are and where their records live. → Counting: why three reports still show three order counts, and how one owned definition per metric and a published bridge make analytics the business trusts.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p52 | synthesis | The opening's question now has an answer: the shopper and the jacket variant are one customer and one product because the merchant named a master for each, keeps the links in an owned cross-reference and links automatically only on exact keys, and Eva became one master with three links that way, while the CDP stays a copy fed from that record. | reasoning: The opening's shopper, the Ridgewalker variant and Eva set against the design. |  |\n| p53 | synthesis (list) | Established: record linkage is mature, platforms and connectors implement survivorship and cross-reference policies their own way, the GTIN and SKU are assigned once and never reused, and consent must be demonstrable. |  | `elaboration`: The answer in one paragraph. → What it rests on, starting with what is established. |\n| p54 | synthesis (list) | Depends on context: the platform or the ERP as master by customer type, the CDP's place in marketing, probabilistic matching from the Omnichannel stage, MDM at the Group stage. |  | `contrast`: What is established. → What depends on the merchant's situation. |\n| p55 | recommendation (list) | The author's synthesis: identity is the box the capability map leaves blank longest, so decide it before the first store or decide it as Kestrel & Pine did, and keep the exact record apart from the fuzzy profile. |  | `contrast`: Established and context-dependent points. → The author's own judgement, labelled as such. |\n| p56 | recommendation (list) | Eight questions let the reader check, at their own company, the master per entity, the cross-reference, matching rules and review queue, merge reversibility, survivorship and consent, the duplicate rate, the product identifiers and where each person's data is held. |  | `cause_effect`: The take-aways. → Questions that apply them to the reader's own company. |\n| p57 | transition | Once a merchant can say who its customers are and where their records live, it can count them, and the next chapter takes the master and cross-reference to the question of why three reports still show three order counts; what the merchant may do with the records waits for the privacy chapter. |  | `cause_effect`: The last question: where every person's data is held. → Counting, handed to the next chapter. |\n\n## Non-goals\n\n- The product model, variants, attributes, enrichment and syndication. See [What Are We Selling? Products, Variants and the Catalog](product-information.html).\n- Which record is the order and the order's identity across channels (a pointer only). See [The Order Record: Lifecycle, State and the Order Management System](order-management.html).\n- The legal treatment of personal data: controller and processor, lawful bases, consent management, retention and deletion. See [Whose Data Is It? Privacy, Consent and Retention](privacy-and-customer-data.html).\n- Metric definitions, the data warehouse and analytics on top of the master. See [Counting the Same Thing Everywhere: Data Platforms, Definitions and Analytics](commerce-data-and-analytics.html).\n- Integration styles and the mechanics of copying records between systems. See [APIs, Events, Files and Middleware: How Commerce Systems Talk](integration-styles.html), [Built to Disagree and Recover: Events, Eventual Consistency and Reconciliation](events-consistency-and-reconciliation.html).\n- Loyalty program design; business-customer accounts and terms. See [Discounts, Coupons and Loyalty: Promotions Without Chaos](commerce-promotions.html), [Selling to Businesses: Accounts, Contract Prices, Quotes and Approvals](b2b-commerce.html).\n- Full record-linkage theory and marketplace-scale entity resolution (LISTED's entity-resolution chapter).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Remaining after round 3 (report stale after closing fixes): the golden record is defined in the introduction and used again only in The Choices; In Practice repeats Shopify and Business Central evidence and sits between the stages and Kestrel & Pine's decision; both are kept by rules 10 and 2 and are the author's to revisit (needs the author: whether to move In Practice's public-evidence list into The Choices).\n- The four list sizes (410,000 platform records, 38,000 loyalty entries, 165,000 subscribers, 61,000 returns contacts) and the first-run results (21,000 and 96,000 linked, 4,100 reviewed) are illustrative facts in the ledger; commerce-data-and-analytics and privacy-and-customer-data should reuse them.\n- The June 2027 identity rule is recorded as an addition to Waypoint, not a new W-decision, so as not to change the canonical W1–W8; a reviewer may prefer it named as a ninth ADR in organizing-commerce-engineering's KP series (needs the author).\n- Fellegi and Sunter (1969) is cited through a secondary source because the paper is paywalled; a reviewer with access could add the primary citation.\n- Salesforce Data Cloud's identity resolution rested on search summaries in the brief and is therefore not cited.\n- Needs the author: to make Eva's links traceable, an earlier pass added details the ledger does not state (her mobile number on the platform account and the POS loyalty entry; her name and street address on the newsletter record; Eva table and p49 linking). The ledger says only that her four records became one master with three links. Settle by adding these details to the ledger or by naming another basis for each link.\n\n## Decision log\n\n- **2026-11-07** — Made the Familiar Stranger the spine (scene, Figure 1, worked example, take-away) and taught product identity as the same problem in miniature, rather than giving customers and products equal weight, because the contract's thread is Eva and because the product side is largely owned by product-information.\n- **2026-11-07** — Recommended the cross-reference-and-matching-service option for Kestrel & Pine (nothing moves, links owned, merges reversible) over making the platform the sole master, because the POS, the newsletter tool and the returns portal are from other vendors and W4 rules out replatforming; labeled as the author's judgement.\n- **2026-11-07** — Took the explicit position that a CDP is a copy for marketing, not the master for operations, against the CDP Institute's definition, with the reasoning stated; kept MDM to a Group-stage purchase.\n- **2026-11-07** — Kept consent to one subsection (demonstrable consent travels with the identity) and deferred lawful bases and deletion to privacy-and-customer-data.\n- **2026-11-12** — Converted spec.md to spec.json from the published chapter. Intent, thesis (question, claim, disputed_by, so_ he scoring model of the probabilistic family, with transitions rewritten, which also puts 'normalized' after its definition; p22 opens from the store purchase; p42's sentence now precedes the trade-off table; the introduction's thesis paragraph glosses 'master' at first use; p37 says Kestrel & Pine later combines the service with the shop platform as consumer master; the scene's 'that relationship' named as the link between her records; the paywalled-paper aside simplified. Rejected: Moving the golden-record definition out of the introduction (corroborated in rounds 2 and 3): AC-4's expected answer puts it in the introduction (rule 10).; Moving In Practice or trimming its vendor bullets and the Microsoft staff-id aside (corroborated in rounds 1 and 3): rule 2 keeps statements their cited sources support, and the house chapter shape keeps In Practice after the stages.; A fourth round (the brief allows one confirming round).\n- **2026-11-12** — Fact fixes against the ledger and the chapter's own rule: Eva's returns contact is linked by its e-mail address, not by order number, because the chapter's rule links automatically only on exact e-mail or phone and the contact carries her personal e-mail (Eva table; ledger: 'Eva Janssen's four records became one master with three links'); the requirements-table row for returns-portal contacts says the same. Kestrel & Pine's hosted product is 'the shop platform' at first use and wherever the text means it (rule 11); W-decisions glossed by content at first use (rule 6).\n- **2026-11-13** — Auto-resolved in the cleanup pass, 2026-11-13: the front-matter excerpt asks whether two records are 'the same customer or product', dropping 'or order', to match the journal spec's question (rule 1 by analogy: the page follows the canonical question; the one front-matter change this pass allows). Eva's returns contact was already linked by e-mail (no change). The fictional linking details not in the ledger stay and are recorded in open_questions for the author (rule 12). Check report is stale and no new round was run. Rejected: Keeping 'or order' in the excerpt.; Removing the mobile number and newsletter address without the author (the walk-through's three links rest on them).\n\n## Sources\n\n- **Internal**\n  - _research/scenario-ledger.md (identity-and-master-data, commerce-promotions, replatforming-and-migration lines; incident 9) and _research/consistency-issues.md — The four list sizes, Eva's records, the June 2027 identity rule, the July 2027 first run, the 1,900 conflicting variants, the deferred loyalty program.\n  - journal-spec.json (identity-and-master-data; commerce-data-and-analytics transition_in) — Intent, thesis, role, acceptance criteria and the hand-off.\n  - meet-kestrel-and-pine, boundaries-and-systems-of-record, commerce-capability-map — The Familiar Stranger, the systems table, W3 and W4; the system-of-record idea and the empty customer-identity box.\n  - product-information, commerce-promotions, customer-service-and-notifications, b2b-commerce, replatforming-and-migration — Neighbouring chapters whose facts this chapter reuses.\n  - _research/brief-integration-and-data.md Part 4 and _research/brief-security-privacy-regulation.md Part 2 — The evidence base.\n- **External**\n  - Shopify developer documentation: customerMerge (API 2026-10), customerEmailMarketingConsentUpdate, customer accounts (accessed 2026-11) — Survivorship and consent evidence.\n  - Microsoft Learn, Business Central Shopify connector: synchronize items (2026-10-16), synchronize orders (2026-10-14) — SKU and barcode matching, link rather than create.\n  - CDP Institute, 'What is a CDP?' (2026); Twilio Segment, Identity Resolution (2026-06-04) — The CDP and identity-graph definitions.\n  - Informatica, 'What is master data management?' (n.d.); Profisee, 'What Is a Golden Record in MDM?' (2025-08-26); DAMA DMBOK (2024 revision) — Golden record and survivorship vocabulary.\n  - GS1 US, 'What is a GTIN?' (n.d.); GDPR
