<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/41-build-buy-or-assemble/index.md) and its former spec.md, whose Non-goals, Modalities, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter, plus the units the contract asks for and the published chapter did not have (a thesis paragraph, a roadmap, the reason the headless pitch was declined, and a conclusion paragraph that answers the opening); these are recorded in decision_log.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The four shapes for covering the commerce capability map (a suite, a hosted platform plus apps, a composable assembly, a custom build), the two mixed shapes (ERP-centered commerce and the specialist group) and stay and surround, with their trade-offs in time, integration and upgrade burden, cost shape and exit.\n- **Know:** The total-cost lines and who forgets them (subscription, GMV share and transaction fees, payment processing, apps, agency, integration, people, migration including revenue at risk, exit), and Kestrel & Pine's three options over 2027–2029: the consultancy's composable rebuild (about €3.2M, about 18 months), an enterprise suite Noor costed herself (about €3.2M, about 12 months, not a pitch) and stay and surround (about €1.33M), with the agency's headless storefront pitch (about €240,000, nine months) declined separately.\n- **Know:** Lock-in and exit: the exit questions to ask before signing, the EU Data Act's switching rules (applicable from 12 September 2025, no switching charges from 12 January 2027) and the open question whether they reach hosted commerce platforms; W4 recorded as a decision record with a 2029 review.\n- **Believe:** The subscription is usually the smallest line of total cost; people, agency, revenue at risk and exit decide the total.\n- **Believe:** Stay and surround is an architecture, not a failure to decide.\n- **Believe:** The time to replatform is rarely the time the problems appear, because the problems appear in the joins.\n- **Be able to:** Apply the differentiation test capability by capability: build only what customers choose the merchant for and nobody sells, buy the rest, own the joins.\n- **Be able to:** Price platform options over three years with the people, agency, migration, revenue-at-risk and exit lines, and ask the exit questions before signing.\n\n**Audience:** Readers new to commerce architecture; most of all the engineering lead or architect asked, like Noor Visser, to recommend on a platform they did not choose; next, the product managers and finance partners who must read a vendor quote and a total-cost comparison.\n\n**Already knows:**\n\n- Roughly what an API, a database and a hosted (rented) software service are.\n- Kestrel & Pine, its people, its 2026 and January 2027 incidents in outline (the Black Friday Oversell among them), the sixteen failure-pattern names and the Waypoint decisions W1 to W8.\n- From Part I: the thirteen steps of an order, promise and handoff, the three status lines, 'system', 'the shop platform' for the hosted product and 'commerce platform' for the whole set of systems, business models and the four scale stages (Starting, Growing, Omnichannel, Group), the capability map, bounded context, system of record, single writer, events, idempotency and reconciliation.\n- Glosses already given: PSP, WMS, ERP, iPaaS, EDI, webhook, API call, SKU, channel, marketplace connector, 3PL, order hub and order management system, availability service, D2C, B2B, PIM, POS.\n- From Parts II to VIII: one owner per product attribute, prices frozen at order placement, available-to-promise and per-channel buffers, checkout and payment, one order record, integration styles and reconciliation jobs, apps and app governance (Kestrel & Pine's 41 apps), the agency's headless storefront proposal (chapter 32), peak load and reliability.\n- From Part IX: the four journeys through the late-2027 design; from the Part X introduction: the five decisions of 2027 and the instruction to begin with the platform review.\n\n**Does not yet know:**\n\n- Suite, composable assembly, MACH, SaaS, GMV, headless storefront.\n- Total cost of ownership (TCO), revenue at risk, vendor lock-in, exit cost.\n- The EU Data Act's switching rules.\n- Architecture decision record (ADR); Core Web Vitals and INP.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a replatforming pitch argued on subscription savings, the reader rejects the comparison and names what to compare instead, rather than choosing on licence price. *Probe:* A €40M brand's hosted platform held on its peak day, but stock was wrong across channels and support could not find orders. A consultancy pitches a composable rebuild whose new subscriptions cost less a year than the current platform plan. Using only this chapter: is the comparison sound, and what should the brand compare instead? | `custom` | cold_reader | major |\n| AC-2 | The reader can apply the differentiation rule to a merchant's capabilities and name the two traps on either side of it. *Probe:* Using only this chapter: for a mid-sized outdoor brand, which of these should it build, buy or own, and why: the checkout, available-to-promise per channel, one order record across channels, product content, integration contracts and reconciliation? What are the two traps? | `custom` | cold_reader | major |\n| AC-3 | The reader can say what to establish about leaving a platform before signing for it, and what EU law does and does not settle. *Probe:* Before a merchant signs a three-year platform contract, what does this chapter say it should establish about leaving, and what does the EU Data Act settle? | `custom` | cold_reader | major |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict the chapter's sections and the kind of evidence it uses. *Probe:* After reading only the introduction: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as sections[].paragraphs[]. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** How do you choose between a suite, a SaaS platform with apps, a composable assembly and custom build, and how do you compare their real costs?\n\n> **Claim:** Choose capability by capability, not by platform shape: build only what customers choose the merchant for and no vendor sells, buy what competitors also buy, and own the joins (the stock, order and product-data flows between systems). Compare three-year staff, agency-fee, migration, revenue-at-risk and exit costs before subscription price; when failures sit in the joins, keeping the hosted platform and adding order and product-information systems beside it costs and risks less than replacing it.\n\n**Disputed by:** The view that a platform is chosen by shape and features: a merchant that has outgrown its hosted platform moves to a composable assembly or an enterprise suite, compares vendors on subscription and feature lists, and treats staying as indecision.\n\n**So what:** A merchant that accepts the claim prices every option on staff, agency fees and exit cost before the subscription, checks each pitch against the failures it has measured, and records the decision with a review date. In February 2027 Kestrel & Pine received two pitches, an outside consultancy's composable rebuild (about €3.2M over 2027–2029, about 18 months) and the agency's headless storefront rebuild (about €240,000, nine months, plus a second runtime to operate); Noor Visser, who leads engineering, also costed an enterprise suite (about €3.2M over the same three years, about 12 months), which nobody had pitched. The headless rebuild was declined after she measured field Core Web Vitals on the NL storefront's product pages (INP, interaction to next paint, 310 ms at the 75th percentile on mobile, illustrative) and traced the INP problem to scripts from eleven apps; the agency's retainer went to a theme performance pass and an app-script audit instead. Stay and surround came to about €1.33M over 2027–2029, about €1.9M less than the composable rebuild or the suite (one-time OMS €320,000, PIM €110,000 and integration standards €150,000, plus subscriptions, two integration engineers and about €50,000 of revenue at risk); W4 (stay and surround) was recorded as a decision record to be revisited in 2029. The platform's €2,300 a month is about 1% of the €2.6M yearly technology spend.\n\n**How and why:** A capability that every vendor sells gives no shopper a reason to choose the merchant, so building it spends engineers on parity; shoppers choose a brand for its products, stores and service, not its cart. And on Black Friday 2026 Kestrel & Pine's checkout held at 38 orders a minute while stock propagation, order ownership and product data failed. Those are joins, and a new platform leaves them to be rebuilt: a rebuild rewires 34 integrations, adds people and agency costs that continue after go-live, and puts revenue at risk at cutover, while GMV pricing turns a suite's subscription into its largest line and bespoke joins raise exit cost. A layer bought beside a running platform is introduced in reversible phases.\n\n**Supporting claims**\n\n- **S1** — When the failures are measured first, a platform pitch can be judged against them: at Kestrel & Pine the checkout held while stock, order and product data failed, so neither the composable rebuild nor the headless storefront addressed what had failed, and the review chose stay and surround.\n- **S2** — A merchant covers the capability map with four shapes (suite, hosted platform plus apps, composable assembly, custom build) and two mixes, and keeping a hosted platform surrounded by specialist layers is a fifth, deliberate shape that the replacement vendors themselves now sell toward.\n- **S3** — Build only what customers choose the merchant for and nobody sells, buy what every merchant needs and own the joins; building a commodity (the Giant's Boots) and customizing a bought core into a build (the Forked Platform) are the two traps.\n- **S4** — Over three years the subscription is a small share of total cost (except under GMV pricing); people, agency, migration with revenue at risk and exit decide the total, so stay and surround at Kestrel & Pine costs about €1.33M against about €3.2M for a rebuild or a suite.\n- **S5** — Exit cost is designed in at purchase or never: the exit questions are asked before signing, the Data Act's switching rules may or may not reach hosted commerce platforms, and the decision is recorded with the conditions and date for revisiting it.\n- **S6** — The right answer depends on business model, scale stage, team, differentiation and timing: stay and surround fits until the core itself limits the business, which usually happens at the Group stage, not when the incidents appear.\n\n## Role in the part\n\nGives the part its first decision, what to build, buy or assemble and how to price it over three years, through Kestrel & Pine's February 2027 review and W4. Supports P10-1 of part `part-10`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `large_to_small` in shapes to lock-in: the options, the rule that chooses among them, the cost lines, then the exit line in detail; `comparison` in criteria, trade-offs and stages)\n\nKestrel & Pine's review comes first because it states the problem (pitches answering failures that live in the joins) and the three options every later section prices. The shapes follow because the build rule and the cost table need their names. The build rule precedes the cost lines because it decides which capabilities are on the table to price. Lock-in follows the cost table because the table only rates the exit line, which lock-in then explains. The criteria, the trade-offs and the stages come after the reader has every line, since they combine them; the stages table relies on the four shapes and on the finding that the problems live in the joins. The W4 decision record follows the stages because it writes down the conditions under which the answer stops being right. In Practice comes late because its evidence (the vendors' turn, a vendor claim, Target's build) is read against the shapes and costs already given. When It Goes Wrong closes the body because each failure names a trap or a forgotten line from earlier sections. Putting the cost table before the review would price options the reader has not met; putting lock-in before the cost table would explain an exit line nobody has yet seen rated.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): A merchant has late stock updates, missing orders and a proposal for a new platform; the replacement may help, but the same problems can survive it if their causes sit in warehouse feeds or connectors that stay in place.\n\n**Bridge:** Anyone who has received a vendor proposal knows it prices what the vendor sells and says little about what the buyer will keep paying for. → So the question becomes which work is failing, what each option fixes, and what each costs over several years once payment fees, apps, agency work, integration maintenance and exit are counted.\n\n**Thesis statement** (KEY POINTS callout and paragraph p05): Choose capability by capability, not by platform shape: build only what customers choose the merchant for and no vendor sells, buy what competitors also buy, and own the joins; compare staff, agency fees, migration, revenue at risk and exit over three years before the subscription; when the failures sit in the joins, keeping the shop platform and adding order and product-information systems beside it costs and risks less than replacing it.\n\n**Roadmap** (Paragraph p06):\n\n- Start from Kestrel & Pine's February 2027 review and the options it weighed. *Kept in:* review.\n- Set out the four shapes for covering the capability map and the mixes most merchants run. *Kept in:* shapes.\n- Give the rule for what to build. *Kept in:* build.\n- Price the cost lines vendors leave out and the three options over 2027–2029. *Kept in:* tco.\n- Treat lock-in and the cost of leaving. *Kept in:* lock-in.\n- Give the decision criteria, the trade-offs, how the answer changes with scale stage, and the decision record for W4. *Kept in:* criteria, trade-offs, stages, recording.\n- Show public evidence from vendors and one retailer, and the ways a platform decision goes wrong. *Kept in:* practice, wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A merchant with late stock updates, missing orders and a proposal for a new platform must first find which work is failing, because causes in warehouse feeds or connectors survive a replacement; that is the basis for choosing what to keep, what to buy as one bundle, what to connect as separate products and what to build. | scenario: Late stock updates, missing orders and a replacement proposal. |  |\n| p02 | claim | Each option is then compared on what it fixes against its cost over several years, including subscription, payment fees, apps, agency work, integration maintenance and exit; a lower subscription can need more engineering work than a small team has. |  | `sequence`: Finding which work is failing. → Comparing what each option fixes with its cost over several years. |\n| p04 | context | In the order's journey, a jacket purchase depends on checkout, warehouse, payment, returns and finance systems, and this decision assigns those jobs to products and teams and sets the cost of changing them later. |  | `elaboration`: Comparing options on what they fix and what they cost over several years. → What the decision assigns in the order's journey. |\n| p03 | context | Kestrel & Pine, the fictional outdoor brand, makes that review in early 2027 and chooses stay and surround, keeping the shop platform and adding the missing capabilities, which becomes W4 of its Waypoint program. | scenario: The early-2027 review; stay and surround as W4. | `example`: A decision that assigns the order's work to products and teams. → Kestrel & Pine's 2027 review and its answer. |\n| p05 | claim | Kestrel & Pine's choice applies the chapter's general rule: choose capability by capability, build only what customers choose the merchant for and no vendor sells, buy what competitors also buy, own the joins, price people, agency fees, migration, revenue at risk and exit before the subscription, and keep the core when the failures sit in the joins. |  | `cause_effect`: Kestrel & Pine's choice of stay and surround. → The general rule the chapter argues for, which that choice applies. |\n| p06 | transition | The chapter follows Kestrel & Pine's review: the review and its options, the four shapes, the rule for what to build, the cost lines and the three options priced, lock-in and exit, the criteria, trade-offs, scale stages and the decision record, then public evidence and the ways the decision goes wrong. |  | `sequence`: The chapter's answer. → The order in which it is argued. |\n\n## Sections\n\n### The 2027 Platform Review at Kestrel & Pine\n\n**Controlling idea** (`example`, id `review`): In February 2027 Noor Visser judges two rebuild pitches and a suite she costs herself against what actually failed, and the March decision keeps the shop platform and adds an OMS and a PIM beside it.\n\n**Advances the thesis** (S1): Gives the case the rest of the chapter prices and generalizes: the failures were in the joins, so the pitches were judged against them.\n\n**Transition in:** `elaboration`: The roadmap, which starts from the February 2027 review. → The review itself.\n\n**Order of paragraphs** (`chronological`): The request and the incidents first, then the pitches that answered them, then the option Noor added, then the three questions she asked of all of them, then the March decision; the questions only make sense once all three options are on the table.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | context | In February 2027 the CEO asks Noor Visser, whose technology team is fourteen people working with an agency, for a recommendation after Black Friday's stale stock cost about €96,000 and other incidents left orders with conflicting statuses, refunds issued twice and prices inconsistent across channels; two firms then pitch rebuilds, both citing the oversell. | statistic: About €96,000 of Black Friday costs from stale stock; conflicting order statuses, double refunds, inconsistent prices. |  |\n| p08 | evidence | The two pitches were an outside consultancy's composable rebuild (a new system assembled from separate services) over about eighteen months and Kestrel & Pine's own agency's headless storefront for about €240,000 over nine months plus a second runtime; Noor recommended against the headless rebuild after measuring that the storefront's slow response to taps (INP 310 ms on mobile, illustrative) came from scripts of eleven apps, not from how the storefront was built. | scenario: Consultancy: composable rebuild, about 18 months. Agency: headless storefront, about €240,000, nine months, a second runtime.; statistic: Field INP of 310 ms at the 75th percentile on mobile on the NL storefront, traced to scripts from eleven apps (illustrative). | `sequence`: The request and the incidents the pitches cited. → What the two pitches proposed and how the headless one was judged. |\n| p09 | context | Noor added a third option the review costed but nobody pitched, an enterprise suite priced on a share of online sales and implemented by a partner over about twelve months, because a suite is the usual alternative a board asks about. | scenario: Enterprise suite: storefront, B2B portal, order management, promotions; share of online sales; about 12 months. | `additional_support`: The two pitches. → A third option Noor added for comparison. |\n| p10 | analysis | With the headless pitch set aside, Noor compares three options (the consultancy's rebuild, the suite, and staying on the platform and adding what is missing, which she frames herself) and asks three questions of each: what failed (checkout held at 38 orders a minute; stock propagation, order ownership and product data did not), what differentiates the business, and what each option costs over three years including people and exit. | statistic: Checkout held at 38 orders per minute in the Black Friday peak hour. | `sequence`: The three options on the table. → The three questions she judges them by. |\n| p11 | claim | The March 2027 decision declines both pitches, keeps the shop platform and adds an order management system with availability management and a product information management system, leaving two questions for later: the store tills in 2028 and the whole choice at a 2029 review. | fact: W4: stay on the platform; OMS, PIM and availability beside it; POS evaluated 2028; review 2029. | `cause_effect`: The three questions and their answers. → The decision they led to. |\n\n### Four Ways to Cover the Map\n\n**Controlling idea** (`comparison`, id `shapes`): A merchant covers the capability map with four basic shapes, two mixes matter at Kestrel & Pine's size, and a hosted platform surrounded by specialist layers is the further shape most merchants run.\n\n**Advances the thesis** (S2): Gives the vocabulary of options the build rule and the cost comparison choose between, and shows stay and surround is a shape, not indecision.\n\n**Transition in:** `elaboration`: The March decision to keep the shop platform and add hubs beside it. → The ways to cover the capability map it was chosen from.\n\n**Order of paragraphs** (`large_to_small`): The decision is placed among the ways to cover the map, and the section announces its own count (four shapes, two mixes, the surrounded platform); then the terms and the table of the four shapes, then the mixes, then the shape Kestrel & Pine chose; each later paragraph narrows the field toward the chosen shape.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p12 | claim | The March decision was a choice among ways to cover the capability map, which no vendor covers well: four basic shapes, two common mixes of them and the surrounded platform most merchants run. |  |  |\n| p13 | comparison | Three terms recur in the chapter and the table (SaaS, GMV and composable, the style the 2020 acronym MACH named), and the table of the four basic shapes shows that every shape leaves the merchant some joins to own, differing in how many, in who runs the parts and in how they are priced. | source: MACH Alliance's 2026 reframing as Open, Composable and Connected.; table: Shape, what you buy, who runs it, integration burden, typical pricing, examples. | `elaboration`: The four basic shapes, announced. → The terms needed to read them and the table that compares them. |\n| p14 | comparison | Two mixed shapes matter for a merchant of Kestrel & Pine's size: ERP-centered commerce, where the ERP is the hub and the web shop a front end, and the specialist group, several specialist products under one owner that reduce the joins at the price of concentrating layers under that owner. | fact: Microsoft documented in September 2026 that its Shopify connector is preinstalled for new Business Central sign-ups.; case: Katapull, formed 31 March 2025, eight labels after acquiring Picqer on 7 October 2026; vendor-stated 4,500+ customers and 140+ marketplaces. | `additional_support`: The four basic shapes in the table. → The two mixes between them that matter at this size. |\n| p15 | claim | The last shape, a hosted platform surrounded by specialist layers that own the facts it cannot own well and an integration platform that joins them, is the one most merchants have and the one Kestrel & Pine chose deliberately. | figure: Figure 1: stay and surround. | `contrast`: The basic shapes and the two mixes. → The surrounded platform most merchants actually run, which Kestrel & Pine chose. |\n\n### What to Build: Differentiation Against Commodity\n\n**Controlling idea** (`claim`, id `build`): Build what customers choose you for and nobody sells, buy what every merchant needs and own the joins; at Kestrel & Pine that means buying the checkout and the hubs and owning the integration rules, with a trap on either side of the rule.\n\n**Advances the thesis** (S3): States and applies the rule that decides which shape covers which capability.\n\n**Transition in:** `cause_effect`: The shapes on offer. → The rule for choosing among them capability by capability.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The rule first, then its application to Kestrel & Pine capability by capability, then the two traps that lie on either side of it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p16 | claim | With the shapes on the table, the question is which shape covers which capability, and the rule is to build what customers choose you for and nobody sells, buy what every merchant needs and assemble when the joins are the thing you must own. |  |  |\n| p17 | example | At Kestrel & Pine the test is short: shoppers choose it for jackets, brand and stores, not its cart, but they do notice whether available stock is there and whether order status agrees, so the Waypoint decisions beside W4 buy an availability service as a module of the OMS (W1), the OMS itself (W2) and a PIM (W3), and W5 makes integration standards the one thing the team builds. | table: Capability, differentiates?, decision in 2027, reasoning: storefront and checkout kept; ATP bought as an OMS module with own rules; OMS; PIM; integration standards built; delivery promise later.; figure: Figure 2: buy the core, own the joins. | `example`: The rule. → Its application to Kestrel & Pine. |\n| p18 | analysis | The two traps are symmetrical: building a commodity is the Giant's Boots, and customizing a bought core until it is a build is the Forked Platform. |  | `contrast`: The rule applied correctly. → The two ways to break it. |\n\n### Total Cost of Ownership: The Lines the Quote Leaves Out\n\n**Controlling idea** (`analysis`, id `tco`): Total cost of ownership is everything a choice costs over its life; priced that way over 2027–2029, the subscription is the smallest line and stay and surround costs about €1.33M against about €3.2M for the composable rebuild or the suite.\n\n**Advances the thesis** (S4): Supplies the cost comparison the thesis says decides the choice and prices Kestrel & Pine's three options.\n\n**Transition in:** `sequence`: The rule for what to build and what to buy. → What each choice costs once every line is counted.\n\n**Order of paragraphs** (`large_to_small`): The definition and the vendor's own list first, then the full list of nine lines so the reader has the frame, then how pricing models and payment fees shape the first lines and what they reveal, then Kestrel & Pine's three options priced with all the lines, then what the comparison shows, confirmed by the running spend.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p19 | definition | Total cost of ownership is everything a choice costs over its life; Shopify's own replatforming guide lists migration, ongoing and hidden costs but omits the two lines a merchant pays most for, the people who own the integrations after the agency leaves and the exit. | quotation: Shopify's guide (18 March 2026): migration costs, ongoing costs, hidden costs. |  |\n| p23a | evidence | In full, a three-year comparison has nine lines to price, and each line beyond the subscription is usually forgotten by someone. | table: TCO line, what it is, who forgets it: subscription, GMV share and transaction fees, payment processing, apps (41 at Kestrel & Pine, 6 unused), agency, integration, people, migration, exit.; figure: Figure 3: total cost of ownership; the quote prices one line, the others decide the total. | `elaboration`: The two lines the vendor's list omits. → The full list of nine lines and who forgets each. |\n| p20 | evidence | Pricing models shape the cost line: a flat tier forces upgrades on product limits, subscriptions with GMV thresholds grow with sales, and an enterprise contract may add a variable fee based on revenue. | statistic: Commerce.com 0.9% above $33,333 monthly GMV; Shopware paid plan above €1M GMV a year; Saleor 0.8% above $200,000 a month (accessed November 2026).; quotation: Shopify Plus: 'a variable platform fee based on your revenue and business model'. | `elaboration`: The nine lines, starting with the subscription and the GMV share. → How the vendor's pricing model shapes those first lines. |\n| p22 | evidence | Payment fees are the platform's largest revenue line at Shopify and Lightspeed, and a merchant that brings its own payment provider pays a transaction fee on Shopify's tiers. | statistic: Lightspeed: transaction revenue $815M against subscription revenue $371M, year to March 2026; Shopify third-party transaction fees 0.2% to 2%. | `additional_support`: Fees linked to sales. → Fees linked to payments. |\n| p23 | analysis | Pricing encodes the vendor's architecture bet: GMV pricing assumes it owns checkout, per-order pricing that it sees every order, per-request pricing that it sits in the request path, and peak days cost money on all three. |  | `cause_effect`: The pricing models and payment fees. → What they reveal about the vendor's architecture bet. |\n| p24 | evidence | Kestrel & Pine's three options priced over 2027–2029 as incremental cost over today's run-rate, from ledger prices and labeled assumptions, come to about €3.2M for the composable rebuild, about €3.19M for the suite and about €1.33M for stay and surround. | table: Subscriptions, one-time build, retainer, added people, revenue at risk, three-year total, exit cost for options A, B and C; OMS €4,500 and PIM €1,800 a month, OMS €320,000, PIM €110,000, integration standards €150,000, two integration engineers; M&S 2014 8% fall as the revenue-at-risk assumption. | `example`: The nine lines and how pricing shapes them. → Those lines applied to Kestrel & Pine's three options. |\n| p25 | analysis | The comparison shows three things that generalize (subscriptions are a small share of every total except the suite's, people and agency together cost about twice the subscriptions in the rebuild and persist after the build, revenue at risk is a cost only the option that never cuts over avoids), and today's €2.6 million spend makes the same point: subscriptions of about €200,000 a year and the agency at €168,000. | statistic: €2.6M technology spend 2026; subscriptions about €200,000 a year; agency €168,000.; figure: Figure 4: three options over three years. | `cause_effect`: The three totals. → What they show beyond the fictional numbers. |\n\n### Lock-In and the Cost of Leaving\n\n**Controlling idea** (`explanation`, id `lock-in`): Exit cost is designed in at purchase or never: read what the contract promises, know what the Data Act may and may not settle, and ask the exit questions before signing, because the Lynchpin is lock-in by another name.\n\n**Advances the thesis** (S5): Prices the exit line the cost table only rated and says how to keep it low.\n\n**Transition in:** `elaboration`: The exit line, rated high, high and moderate in the cost table. → What lock-in and exit cost are and how to keep them low.\n\n**Order of paragraphs** (`large_to_small`): The definitions first, then what the vendor's contract promises, then what the law adds, then the questions the merchant asks itself, then the failure pattern that results when nobody asks them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p27 | definition | The cost table rated the exit from each option high, high and moderate: vendor lock-in is the condition in which leaving costs more than staying, the natural result of data, URLs, customizations and integrations accumulating in one place, and exit cost is the price of leaving, designed in at purchase or never. |  |  |\n| p28 | evidence | What the platform promises matters: Shopify's standard terms provide the services 'as is', without warranty of uninterrupted service and with the right to modify them without notice, so the merchant reads its own contract, not the marketing uptime. | quotation: Shopify Terms of Service (20 October 2026): 'as is' and 'as available'; 'does not warrant that the Services will be uninterrupted'; modification 'without notice and at any time'. | `elaboration`: Lock-in in general. → What one platform's contract actually promises. |\n| p29 | evidence | The EU Data Act requires providers of data processing services to enable switching and, from 12 January 2027, to charge no switching fees, but whether it covers hosted commerce platforms is an open legal question as of November 2026. | source: Regulation (EU) 2023/2854, applicable from 12 September 2025: switching rights in the contract, at least 30 days to retrieve data, no switching charges from 12 January 2027, custom-built services exempt. | `additional_support`: What the contract promises. → What the law adds. |\n| p30 | recommendation (list) | Whatever the law settles, the merchant asks the exit questions before signing: data export, URLs and redirects, ownership of customizations, app data, re-pointing integrations, and the contract's term, notice and GMV floor. |  | `contrast`: The law's unsettled scope. → The questions that hold whatever the law settles. |\n| p31 | example | The Lynchpin is lock-in by another name, a capability customers depend on running through one vendor, connector, agency or person with no exit plan, and Kestrel & Pine had three in January 2027, none chosen in a platform decision but each grown up around the platform it had chosen. | case: The EDI consultant, the agency's scripts, the ERP partner's platform-to-ERP connector. | `example`: The exit questions. → What happens when they are never asked. |\n\n### Decision Criteria\n\n**Controlling idea** (`explanation`, id `criteria`): Five criteria (business model, scale stage, team, differentiation, time and risk) decide more than any feature list.\n\n**Advances the thesis** (S6): Turns the review's three questions into criteria any merchant can apply.\n\n**Transition in:** `sequence`: Shapes, the build rule, the cost lines and exit. → The criteria that combine them into a decision.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p32 | explanation | Five criteria (business model, scale stage, team, differentiation, time and risk) combine the shapes, the build rule, the cost lines and the exit into a decision, and each pushes toward a shape. | table: Criterion, what to ask, what it pushes toward. |  |\n\n### Trade-Offs\n\n**Controlling idea** (`recommendation`, id `trade-offs`): Set side by side, the shapes trade time to live, integration and upgrade burden, flexibility, cost shape and exit, and the author's recommendation follows: keep a hosted platform and surround it when checkout is a commodity, and weigh suite against composable on the people line only at several brands with a platform team.\n\n**Advances the thesis** (S6, S2): Compares the shapes on every dimension and states the conditional recommendation.\n\n**Transition in:** `cause_effect`: The five criteria. → How the shapes compare on them, and what follows.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p33 | recommendation | The trade-offs table sets the four basic shapes and the specialist group side by side (stay and surround is the hosted-platform column with layers added), and the recommendation follows from the five criteria with conditions: keep a hosted platform and surround it when checkout is a commodity, weigh a suite against a composable assembly on the people line at several brands with a platform team, build only what customers choose you for, and remember an assembly commits the merchant to owning every join. | table: Suite, hosted platform plus apps, composable assembly, custom build, specialist group on time to live, integration burden, upgrade burden, flexibility, cost shape, exit, fits when. |  |\n\n### Across Scale Stages: When It Fits and When It Limits\n\n**Controlling idea** (`comparison`, id `stages`): The typical choice changes with scale stage, and the right time to replatform is almost never when the problems appear, because they appear in the joins; a platform change becomes rational at the Group stage, when the core itself is the limit.\n\n**Advances the thesis** (S6): Says when stay and surround stops being the answer.\n\n**Transition in:** `elaboration`: The recommendation's conditions, among them several brands and a platform team. → How the choice changes stage by stage.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p34 | synthesis | Across the four stages, the right time to replatform is almost never the time the problems appear, because they appear in the joins; Kestrel & Pine's stage-3 incidents were ownership problems, and a platform change becomes rational at stage 4, when several brands or a vendor-scale concern make the core the limit. | table: Stage, typical choice, what becomes necessary, warning signs the choice is outgrown. |  |\n\n### Recording the Decision\n\n**Controlling idea** (`explanation`, id `recording`): W4 is recorded as a decision record with its context, decision and consequences, so the 2029 review can test its assumptions instead of reconstructing them.\n\n**Advances the thesis** (S5): Keeps the decision reviewable at the conditions the stage table names.\n\n**Transition in:** `cause_effect`: The stage table's conditions under which stay and surround stops being right. → Writing those conditions into the W4 decision record.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p39 | explanation | Because the stage table says when the answer stops being right, Noor records the assumptions behind W4 for a later review to test, as as an architecture decision record in Michael Nygard's 2011 format, stating the context (a platform that held while integrations failed, a fourteen-person team with an agency), the decision (keep checkout, add order, availability and product management) and the consequences (fees and extension limits continue, the merchant owns the integrations, separate records and exports preserve a later move), so the 2029 review can compare those assumptions with what happened. | source: Nygard, Documenting Architecture Decisions, 15 November 2011. |  |\n\n### In Practice\n\n**Controlling idea** (`evidence`, id `practice`): The public record shows the vendors of replacement selling layers and retreating from what they do not do well, a vendor claim that says nothing about a merchant's people line, and a build decision paid for at the first peak.\n\n**Advances the thesis** (S2, S4): Supplies dated public evidence for the shapes and the cost lines.\n\n**Transition in:** `additional_support`: Kestrel & Pine's recorded decision. → Public evidence outside Kestrel & Pine that points the same way.\n\n**Order of paragraphs** (`large_to_small`): The market first (vendors' turn and retreat), then one vendor's claim, then one retailer's build decision and what it cost at peak.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p35 | evidence | The clearest public evidence that layers beat replacement for mid-sized merchants comes from the vendors who sell replacement, whose 2025–2026 moves turned toward layers and whose own survey names integration complexity as a concern. | fact: commercetools cut about 10% of staff on 26 February 2025, launched AgenticLift 21 January 2026; Adobe Commerce Optimizer beside a kept backend; Commerce.com revenue up 0.1% (6 August 2026) with softer B2C replatforming; MACH Alliance survey (18 February 2026) 37% cite integration complexity. |  |\n| p36 | evidence | Vendors retreat from what they do not do well, so a merchant should expect its platform vendor to push logistics, returns and EDI to partners and read a vendor's strategic review as a signal of which products will be funded. | fact: Shopify sold the majority of Shopify Logistics to Flexport (6 June 2023, 13% equity stake); Lightspeed's strategic review closed 6 February 2025 naming its growth engines. | `additional_support`: The vendors' turn toward layers. → The vendors' retreat from what they do not do well. |\n| p37 | analysis | A vendor's total-cost claim may be true for its sample and still say nothing about a merchant's people line or exit, so the reader asks for the unit, date, definition and baseline before comparing vendors. | quotation: Shopify enterprise page: '33% lower average total cost of ownership' for a surveyed sample with GMV $50M–$500M. | `contrast`: What vendors do. → What vendors claim, and how to read it. |\n| p38 | example | Target's 2009 decision to build its own online platform, taking it back from Amazon, had reasons at its size, and its cost was paid not in the build but at the first peak, when the site crashed in 2011. | case: Target announced on 7 August 2009 it would build its own platform; launched 2011; crashed on the Missoni launch of 13 September 2011, cause never confirmed. | `contrast`: Vendors' claims for buying. → A retailer's decision to build. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`cause_effect`, id `wrong`): A platform decision fails slowly, and each failure is detected organizationally before it is technical.\n\n**Advances the thesis** (S3, S4, S5): Lists how the traps, the forgotten cost lines and missing exit plans show up, with detection and recovery.\n\n**Transition in:** `contrast`: Public evidence, ending with a build decision paid for at the first peak. → The slow ways a platform decision goes wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p42 | cause_effect (list) | The platform decision fails in slow ways detected organizationally first: the Lynchpin at renewal, the Forked Platform, the Giant's Boots bought with a brochure, the pricing cliff, the vendor changing direction, and a right quote with a wrong TCO. | fact: Zalando's Connected Retail to be discontinued by 30 June 2027 (announced April 2026); Magento 1's end of life on 30 June 2020. |  |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The build rule, the three-year cost and the exit questions are three tests that point the same way once the failures have been located: when the core held and the joins failed, a new core prices the subscription and leaves the failing joins to be rebuilt, while keeping the platform, buying the hubs and owning the joins answers what failed at less than half the cost and with a date to look again.\n\n**So what:** A reader facing a platform pitch can test it against measured failures, price it on people, agency, revenue at risk and exit before the subscription, and record the answer with a review date: at Kestrel & Pine about €1.33M against about €3.2M.\n\n**Callback:** The introduction's merchant with late stock updates, missing orders and a proposal for a new platform. Paragraph p43 answers that merchant's proposal with the chapter's three tests and Kestrel & Pine's result.\n\n**Takeaway** (`course_of_action`): Before any platform comparison, list what failed and where it lives, apply the build rule capability by capability, price every option on people, agency, migration, revenue at risk and exit, ask the exit questions, and write the decision record with the conditions and date for revisiting it.\n\n**Hand-off** to [Moving Without Burning the Bridge: Replatforming and Migration](replatforming-and-migration.html): `problem_solution`: W4's stay and surround, which still leaves Kestrel & Pine to introduce an OMS and a PIM beside a running platform without creating the duplicates and gaps the hubs exist to remove. → How to move a platform or a fact's owner one seam at a time: the documented failures of moving on one date, the strangler approach, parallel runs, data migration, cutover and rollback, and the 2027 PIM and OMS seams around the Black Friday freeze.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p43 | synthesis | The opening merchant's proposal can now be answered: find where the failures live, and if the core held and the joins failed, the build rule and the three-year cost point the same way, to keeping the platform, buying the hubs and owning the joins, which at Kestrel & Pine cost about €1.33M against about €3.2M and carries a 2029 review date. | reasoning: The opening merchant set against the chapter's tests and Kestrel & Pine's result. |  |\n| p44 | synthesis (list) | Established: the subscription is a minority of total cost; vendors themselves sell layers beside an existing core; the Data Act's dates are set and its scope for commerce platforms is not; decision records keep a platform decision reviewable. |  | `conclusion_summary`: The chapter's answer to the opening. → What of it is established. |\n| p45 | synthesis (list) | Depends on context: stay and surround until the core limits the business; composable for a team that owns every join; GMV pricing, which aligns the vendor with growth and raises exit cost; the specialist group, depending on its exit terms per label. |  | `contrast`: What is established. → What depends on the merchant's context. |\n| p46 | recommendation (list) | The author's synthesis: price people, agency and exit before the subscription, and treat build as a decision about ownership, because the thing worth building at a mid-sized merchant is the rules for who owns which fact and how copies are reconciled. |  | `sequence`: What depends on context. → The author's own position. |\n| p47 | recommendation (list) | Nine questions turn the chapter into a review a reader can run: what is broken and where, what differentiates, three-year cost, owners of integrations, pricing thresholds, export, ownership of code, the contract's promises and the decision record. |  | `cause_effect`: The author's position. → The questions that put it to work. |\n| p48 | transition | Staying is only half a decision: Kestrel & Pine still has to introduce an OMS and a PIM beside a running platform without creating the duplicates and gaps the hubs exist to remove, which is the subject of the next chapter. |  | `problem_solution`: The decision to stay, recorded and reviewable. → The migration problem it leaves. |\n\n## Non-goals\n\n- The platform landscape vendor by vendor, with pricing pages and the 2023–2026 timeline. See [Suites, SaaS, Open Source and Composable: The Platform Landscape in 2026](commerce-platform-landscape.html).\n- The composable movement's history. See [Case: commercetools, Shopware and the Composable Movement](case-composable-movement.html).\n- How to migrate once the decision is made: strangler seams, parallel runs, cutover, rollback, the Target, Finish Line and M&S cases. See [Moving Without Burning the Bridge: Replatforming and Migration](replatforming-and-migration.html).\n- The scale stages as a model and the multi-brand platform decision. See [What Changes at Each Scale: From First Store to Group](commerce-scaling-stages.html).\n- Ownership maps, vendor management, contracts and agency relationships in depth. See [Who Builds and Who Owns: Teams, Vendors, Agencies and Governance](organizing-commerce-engineering.html).\n- Architecture styles (monolith, microservices, composable as a style); app governance and the Forked Platform mechanics. See [Monolith, Modular Monolith, Microservices, Composable: What the Evidence Says](commerce-architecture-styles.html), [Apps, Plugins and Functions: Extensibility and Ecosystem Governance](extensibility-and-app-ecosystems.html).\n- The headless storefront evaluation in full (Core Web Vitals, rendering models). See [Delivering the Storefront: Themes, Headless, Rendering and Performance](storefront-architecture.html).\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-11-13** — After the confirming round 4 (ESCALATE: 14 pass, 20 fail, 10 blocking, all draft faults; round 4 is past the revision budget), the cheap, plainly right fixes were made without another round: transitions into the order's-journey paragraph ('That comparison matters for every order'), the thesis paragraph (tied to Kestrel & Pine's choice), payment fees ('Beyond the fees linked to sales') and the Lynchpin ('When nobody asks those questions'); the opening's choices point to where the chapter names them; Noor's three options counted plainly, with staying framed by her; the 2028 till evaluation introduced as a question left for later; the late ERP gloss removed (ERP is known from Part I); the €2.6M sum simplified (72,000 returns dropped from the prose; the ledger figure stands behind it); the Zalando bullet without nested parentheses; a repeated sentence on pricing models cut. The report is stale after these edits. Rejected: A fifth round.; Changing the KEY POINTS bullet that total cost is 'dominated by payment fees, agency and partner work, the peo review merged (p40); the vendor history (AgenticLift, Commerce Optimizer) cut from the fifth-shape paragraph (p15) because In Practice gives it as evidence; 'composable rebuild' glossed at first use (p08). Rejected: Merging Decision Criteria, Trade-Offs and Across Scale Stages into one section: they are house headings, and the scale stages the criteria table names are known from Part I, so the forward reference the rubric saw is not one for this reader.; Moving the decision record next to the review: the declared reason keeps it in In Practice, read against the shapes and costs.\n- **2026-11-13** — Added the units the contract asks for and the published chapter lacked: a thesis paragraph (p05) and a roadmap (p06) in the introduction, the measured reason the headless pitch was declined (in p08, from the storefront-architecture ledger line, as the journal spec's so_what requires), and a conclusion paragraph (p43) that answers the opening merchant's proposal (synthesis, so-what, callback). 'Hosted platform' is replaced by 'the shop platform' where the text means Kestrel & Pine's own product (book-wide vocabulary). Rejected: Inferring the headless decline from the joins argument: the ledger gives the measured reason.\n- **2026-11-07** — Built the chapter around the February 2027 review with three concrete options rather than an abstract taxonomy, so the TCO table has three real columns. Rejected a four-column table with custom build, because no one at a €48M merchant proposes it and the column would be filler. (Carried from spec.md; the options follow ruling 13a.)\n- **2026-11-07** — Priced the TCO as incremental cost over today's run-rate, leaving out lines common to all options (ERP, WMS, connector, returns portal, iPaaS, payment processing), so the comparison is readable and the assumptions are few. Rejected a full absolute TCO, which would have required inventing salary and PSP figures the ledger does not hold. (Carried from spec.md.)\n- **2026-11-07** — Used the Ma <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
