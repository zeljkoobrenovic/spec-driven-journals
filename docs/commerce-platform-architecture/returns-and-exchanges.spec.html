<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/18-returns-and-exchanges/index.md) and its former spec.md, whose Non-goals, Modalities, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter, plus the units the contract asks for and the published chapter did not have (a thesis paragraph p03, a roadmap p05, a paragraph introducing the requirements table p23 and a conclusion synthesis p51); these are listed in decision_log. It is a contract, not a description.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The nine steps of a return (request, eligibility, label, transit, receiving, inspection, disposition, settlement, stock) with their records and owners, and the dispositions (restocked, processing required, not restocked, missing).\n- **Know:** The two records of a return (the return, which owns intent and money; the reverse fulfillment, which owns work and stock) and the disposition that joins them.\n- **Know:** The EU right of withdrawal read as data: four dates per order line and the three 14-day clocks, and the trader's right to wait for the goods or proof of sending.\n- **Believe:** For goods like apparel and equipment, the warehouse's disposition, not the request or the carrier scan, should release the refund and the restock.\n- **Believe:** The refund trigger and the single refund writer are decided before a returns product is chosen.\n- **Be able to:** Write the returns integration contract: the trigger, the writer, the key, the restock rule and the four dates per line.\n- **Be able to:** Say how an exchange is modeled and what releases the replacement, and how marketplace and store returns enter the return record.\n\n**Audience:** Readers new to commerce architecture; most of all the engineer or product manager who must connect a returns portal, a warehouse and a payment provider, and next the operations and finance leaders who need to see why 'refund on request' and 'refund on inspection' are architecture decisions (Noor Visser and Sanne de Wit at Kestrel & Pine).\n\n**Already knows:**\n\n- What buying and returning something online is like from the shopper's side; roughly what an API, a database and a queue are.\n- Kestrel & Pine, its people, its warehouse at Duiven and stores, its incidents in outline (the Double Refund among them) and the names of the sixteen failure patterns.\n- From Part I: the thirteen steps of an order, promise and handoff, the three status lines (money, goods, returns), 'system', 'the shop platform' for the hosted product and 'commerce platform' for the whole set of systems, the four scale stages (Starting, Growing, Omnichannel, Group), system of record, single writer, events, idempotency and reconciliation, the Waypoint decisions W1 to W8.\n- Glosses already given: PSP, WMS, ERP, iPaaS, EDI, webhook, API call, SKU, channel, marketplace connector, 3PL, order hub and order management system, availability service, D2C, B2B, PIM, POS.\n- From Part II: available-to-promise, one writer each for on hand and committed, promotions with discounts allocated to lines.\n- From Part III: refunds as new payments with one writer and a key; one order record with three status lines; one invoice per shipment and credit notes as the only correction.\n- From the earlier chapters of Part IV: the warehouse system as the only writer of on-hand stock and the fulfillment order it accepts or rejects; one normalizing carrier layer and scans mapped to one vocabulary; the store as an order source, stock location and payment path, with store stock committed only when staff confirm and one refund path per order at the counter.\n\n**Does not yet know:**\n\n- Return rate measures (items, orders, value) and bracketing.\n- RMA, reverse fulfillment, disposition and its four values, reverse logistics.\n- The EU right of withdrawal and its articles.\n- Returns portals as a product category; instant exchange and exchange with a balance.\n- Marketplace-run returns and their clocks.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a return refunded by support on a carrier scan and again by the portal on inspection, the reader names the missing decisions and the event that should release the refund. *Probe:* A customer sees on the carrier's tracking that her return was delivered to the warehouse and asks support for her refund; the agent sees the payment and no refund in the payment provider's console and refunds by hand; days later the returns portal refunds again after inspection. Using only this chapter: which decisions were missing, and which event should release the refund? | `custom` | cold_reader | major |\n| AC-2 | Given a restock on request and an exchange released by a carrier scan, the reader says what is wrong and what should trigger each. *Probe:* A returned jacket is put back into sellable stock as soon as the return is requested, and the exchange replacement ships when the carrier scans the return parcel at the warehouse. Using only this chapter: what is wrong with each, and what should trigger them? | `custom` | cold_reader | major |\n| AC-3 | The reader can compute the withdrawal deadlines for one return and say whether the trader may wait for the goods. *Probe:* Using only this chapter: a customer received her goods on 15 April and told the shop on 19 April that she was withdrawing. By when must she send the goods back, by when must the shop refund, and may the shop wait for the goods? | `custom` | cold_reader | minor |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict the chapter's sections and the kind of evidence it uses. *Probe:* After reading only the introduction: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as sections[].paragraphs[]. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** How does a return travel back through the systems, and how do you make sure the money, the stock and the books all agree?\n\n> **Claim:** A return travels as two records: the return request on the order side and the reverse fulfillment in the warehouse, joined by the warehouse's disposition, its verdict on each item. Money, stock and books agree when that disposition releases the refund, or the replacement order held until then, one system issues the refund with the return id as its key, stock rises only on a 'restocked' disposition, and the credit note follows the refund.\n\n**Disputed by:** The view that a return is a refund button: the refund goes out when the customer asks or when the carrier scan shows the parcel at the warehouse, whichever system an agent has open may issue it, the unit goes back into stock on arrival, and finance corrects the books at month-end.\n\n**So what:** In January 2027 Kestrel & Pine refunded 212 returns twice, €19,400: customers saw 'delivered to Duiven' on the tracking, support refunded in the payment provider's console, and the portal refunded again on inspection, and neither request named the return. At 72,000 return parcels a year and a 24% item return rate, the way back is a main road. A merchant that accepts the claim decides the refund trigger, the single refund writer and the restock rule before it chooses a returns product, and keeps four dates per order line (delivery, withdrawal notice, goods sent, refund) so the 14-day clocks can be computed.\n\n**How and why:** The request says what the customer intends to send, not what arrives; only the inspection at the bench shows what came back and whether it can be sold again, so a refund or restock on request or on scan pays for empty boxes and resells worn jackets. EU law lets the trader withhold the refund until the goods or proof of sending arrive and then requires it within 14 days of the notice, so refund on inspection is lawful if the clock is tracked. A payment provider executes every valid refund request, so two systems that can refund without a shared key both pay. Marketplaces and stores start returns the merchant did not, so the return record must accept their authorizations and refunds under their own ids. An exchange is a held new order released by the disposition, because a method such as iDEAL cannot hold money. The credit note records money that has actually moved back, so it follows the confirmed refund and the books match the provider's records.\n\n**Supporting claims**\n\n- **S1** — A return travels as two records: the return request on the order side, which owns intent and money, and the reverse fulfillment in the warehouse, which owns work and stock, joined by the disposition, the warehouse's verdict on each item.\n- **S2** — For goods like apparel and equipment the disposition, not the request, the carrier scan or receipt, releases the refund and the restock; this is lawful because the trader may wait for the goods and must then refund within 14 days of the notice, so the four dates per line are kept.\n- **S3** — One system issues the refund with the return id as its key, stock rises only on a 'restocked' disposition from the warehouse system, and the credit note follows the confirmed refund at the allocated line price; these are decided before a returns product is chosen.\n- **S4** — Returns started on marketplaces and at store counters enter the same return record under their own ids, with the marketplace's clocks exposed and the portal request closed before a store pays.\n- **S5** — An exchange is a new order created at request time that holds the replacement unit and is released by a resellable disposition, because a method such as iDEAL cannot hold money.\n\n## Role in the part\n\nCarries the part's rules onto the way back: the warehouse's disposition as the event that releases money and stock, one refund writer keyed on the return id, and returns started by stores and marketplaces entering the same record. Supports P4-1, P4-4 of part `part-4`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in scene to the body: the Double Refund and Noor's question first, then the steps, records, law and decisions that answer it; `comparison` in choices and stages: the four decisions and their options, then the options by scale stage; `chronological` in in-practice: Eva's exchange from 19 to 22 April 2027)\n\nThe Kestrel & Pine scene comes first so that every later term arrives as part of the answer to Noor's question after the Double Refund. The nine steps come next because every later section names a step, a record or the disposition. How the pieces fit follows: the two records and the flows between them need the steps. The law comes after the flows because it sets how long the refund flow may wait for the disposition, and before the choices because the refund-trigger table states each trigger's legal position. The four decisions then use the records, the flows and the law. Marketplace and store returns follow the decisions because they are returns whose trigger and writer the merchant does not control. The stages place the decisions and the external returns by scale. Eva's exchange comes after the rules so that each row of her table can be read against them, and the failures come last because each is read against the rule that prevents it. Moving the choices before the law would leave the trigger table's legal column unexplained; moving Eva's exchange before the two records would show a disposition before the reader knows what it joins.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): A customer sends back a jacket that does not fit and asks for the next size. The returns portal knows the request, the warehouse must inspect the original and find a replacement, and finance must record any adjustment. Marking the return complete in one system does not complete the others' work.\n\n**Bridge:** Anyone who has returned an online purchase has waited for a refund or a replacement without knowing which system was holding it up; the previous chapter has just ended with a web order brought back to a store counter. → At one item in four, the return is a main flow, so the question is on which event, and by which system, money, stock and books move.\n\n**Thesis statement** (KEY POINTS callout (bullets 1 and 2) and paragraph p03): A return travels as two records, the return request on the order side and the reverse fulfillment in the warehouse, joined by the warehouse's disposition; money, stock and books agree when that disposition releases the refund or the held replacement order, one system issues the refund with the return id as its key, stock rises only on a 'restocked' disposition, and the credit note follows the refund.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p05):\n\n- Set the scene at Kestrel & Pine, where one item in four comes back, with what returns cost, and the Double Refund that led to Noor's question. *Kept in:* scene.\n- Name the nine steps of a return. *Kept in:* steps.\n- Show how the systems and the two records fit together. *Kept in:* pieces.\n- Read the EU withdrawal law as data. *Kept in:* law.\n- Set out the four decisions of a returns design. *Kept in:* choices.\n- Bring in returns started on marketplaces and at store counters. *Kept in:* channels.\n- Place the design across the four scale stages. *Kept in:* stages.\n- Follow Eva's exchange day by day. *Kept in:* in-practice.\n- List how returns go wrong. *Kept in:* wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A customer who sends back a jacket that does not fit and asks for the next size needs the returns portal, the warehouse and finance each to do its own work; marking the return complete in one system does not complete the others, so the customer can be left waiting while the jacket or the money is counted wrongly. | scenario: A jacket sent back for the next size, with the portal holding the request, the warehouse the inspection and replacement, and finance the adjustment. |  |\n| p02 | explanation | At Kestrel & Pine's volume, almost one online item in four comes back, so disconnected decisions become a routine source of errors (two systems refunding the same return, stock offered before inspection), and a return process must record each step and authorize the next. | statistic: Almost one in four online items returned. | `cause_effect`: One return that needs several systems to act. → What happens when that is multiplied by one item in four. |\n| p03 | claim | The chapter's answer: a return travels as two records, the return request (RMA) on the order side and the reverse fulfillment in the warehouse, joined by the warehouse's disposition, its verdict on each item; money, stock and books agree when that disposition releases the refund or the held replacement order, one system issues the refund with the return id as its key, stock rises only on a 'restocked' disposition, and the credit note follows the refund. |  | `problem_solution`: Disconnected decisions that refund twice or restock before inspection. → The chapter's answer: two records joined by the disposition, and one event and one writer for each of money, stock and books. |\n| p04 | context | Where we are: after the previous chapter's web order brought back to a store counter, Eva's jacket comes back by post; delivered on 15 April 2027, she requests size L on 19 April, Duiven receives and inspects the jacket on 22 April and dispatches the L, and a €199 iDEAL refund is the separate alternative she did not choose. | case: Eva's Ridgewalker jacket: delivered 15 April 2027, exchange M to L requested 19 April, received and inspected at Duiven 22 April, L dispatched the same day; refund variant €199 by iDEAL. | `example`: The answer stated in general, and the previous chapter's return at a store counter. → Eva's jacket, which comes back by post, as the case the chapter follows. |\n| p05 | transition | The chapter first sets the scene at Kestrel & Pine, with what returns cost and Noor's question, then names the nine steps of a return, shows how the systems and the two records fit, reads the EU withdrawal law as data, sets out the four decisions of a returns design, brings in returns started on marketplaces and at store counters, places them across the four scale stages, follows Eva's exchange day by day and lists how returns go wrong, using Kestrel & Pine's figures, public platform data models, the EU directive, marketplace rules and industry surveys as evidence; neighbouring chapters own the money, the warehouse work, the credit note and the full journey. |  | `sequence`: Eva's exchange as the case to follow. → The order in which the chapter answers how her return keeps money, stock and books in agreement. |\n\n## Sections\n\n### Setting the Scene at Kestrel & Pine: One Item in Four\n\n**Controlling idea** (`context`, id `scene`): At Kestrel & Pine, as across the industry, the return path is a main road (72,000 parcels a year, a quarter of items), and the returns portal bought to tame it created the Double Refund because nobody had decided on which event, and by which system, money, stock and books move.\n\n**Advances the thesis** (S2, S3): Gives the case the thesis answers: a main flow, two systems that could refund, and no agreed event for the refund.\n\n**Transition in:** `elaboration`: The roadmap's first stop: Kestrel & Pine and Noor's question. → Kestrel & Pine's returns as they stood in 2026.\n\n**Order of paragraphs** (`chronological`): Kestrel & Pine's volumes first, then what a return rate measures, how the industry's rates compare and what returns cost, then the portal that handles them, then the January 2027 incident the portal caused, then Noor's February question; the question needs the incident, and the incident needs the portal. The industry rates sit beside Kestrel & Pine's own, which they are compared with (moved here after both flow readers of round 1 found them out of place among the steps).\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | evidence | Kestrel & Pine took back 72,000 parcels in 2026 against 336,000 shipped, with a 24% item return rate and a 19% order return rate; partial returns and bracketing explain why the two measures differ. | statistic: 72,000 return parcels; 336,000 parcels shipped; 24% of items; 19% of orders; bracketing (ordering two sizes to keep one). |  |\n| p07 | evidence | 28% of returns are exchanges and 61% of returned items are resold as new, and the returns bench at Duiven handles about 280 parcels a day with two people, five for three weeks after Black Friday. | statistic: 28% exchanges; 61% resold as new; about 280 parcels a day, two people, five for three weeks after Black Friday (illustrative). | `additional_support`: How many items come back. → What happens to them and who handles them. |\n| p08 | definition | The return rate estimates how much selling and shipping work will be followed by return work, and any figure must say whether it counts items, orders or sales value. |  | `contrast`: Kestrel & Pine's own return figures and what happens to the items. → What a return rate measures, so those figures can be compared with others. |\n| p09 | evidence | Industry surveys put US online returns at about a fifth of sales value, with free returns influencing where most shoppers buy and a measurable share judged fraudulent, and apparel near a quarter of orders, mostly for size or fit; none of these measures matches Kestrel & Pine's directly. | statistic: NRF with Happy Returns: $890 billion US returns 2024; $849.9 billion projected 2025; 19.3% of online sales value; 9% judged fraudulent; free returns influencing 76%. Coresight 2023: 24.4% of online apparel orders, size or fit in 53%. | `example`: What a return rate counts. → Published industry rates, each with its base. |\n| p10 | analysis | Most of a return's cost is invisible in the order system, and policy is the lever that moves the rate, which needs the return record to capture the reason, the size ordered against the size kept and the disposition. |  | `cause_effect`: How large return rates are. → What returns cost and which data lets a merchant reduce them. |\n| p11 | description | Since 2025 a hosted returns portal checks eligibility, collects reasons, offers exchange or refund, issues labels and, after inspection, asks the shop platform's API for the refund, at €650 a month plus €0.95 per return. | fact: Returns portal since 2025; €650/month plus €0.95 per return; refunds through the shop platform's API. | `sequence`: What returns cost and the data that lets a merchant reduce them. → The software Kestrel & Pine uses to handle the customer's side of its returns. |\n| p12 | example | The portal fixed the e-mail returns process and created the Double Refund: in January 2027, 212 returns (€19,400) were refunded twice because support refunded by hand in the PSP console when tracking showed the parcel at Duiven, the portal refunded again after inspection two to five days later, and neither request named the return. | case: The Double Refund: 212 returns, €19,400, January 2027, most recovered; agents refunding in the PSP console on the 'delivered to Duiven' scan; the portal refunding on inspection; no return id on either request. | `contrast`: The portal bought to fix returns. → The incident the portal caused. |\n| p13 | claim | Reviewing the incident in February, Noor Visser asked for money, stock and books which event moves each and which system moves it, and nobody could answer for all three; that is the chapter's question. | figure: Figure 1: three whiteboard columns (money, stock, books), each fed by one arrow from a single disposition. | `cause_effect`: The Double Refund. → The question it made Noor ask. |\n\n### What a Return Is, Step by Step\n\n**Controlling idea** (`definition`, id `steps`): A return passes through nine steps, each with a record, an owner and a typical failure, and four terms drawn from them carry the rest of the chapter.\n\n**Advances the thesis** (S1, S2): Defines the records and the disposition the thesis joins.\n\n**Transition in:** `elaboration`: Noor's question about money, stock and books. → The steps a return passes through, which the answer has to name.\n\n**Order of paragraphs** (`large_to_small`): The nine steps first, then the four terms drawn from them; the terms name records and events in the table, so they cannot come first.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | definition | A return passes through nine steps (request, eligibility, label, transit, receiving, inspection, disposition, settlement, stock), each with a record, an owner and a way to go wrong. | table: Nine steps with what happens, the record, who acts and what can go wrong. |  |\n| p15 | definition | Four terms carry the chapter: the RMA is the merchant's 'you may send this back', the disposition is the warehouse's verdict and the most important event because it is the first moment the merchant knows what came back, an exchange is a return paired with a new order, and reverse logistics is the whole backward operation. |  | `elaboration`: The nine steps. → The four terms the rest of the chapter relies on. |\n\n### How the Pieces Fit Together\n\n**Controlling idea** (`explanation`, id `pieces`): A return loops through six systems as two records, the return on the order side and the reverse fulfillment in the warehouse, which meet at the disposition; each flow between them has its own freshness, key and fallback.\n\n**Advances the thesis** (S1, S3): Establishes the two records and the disposition that joins them, and the key and trigger each flow carries.\n\n**Transition in:** `elaboration`: The nine steps and their owners. → How the systems that own them connect.\n\n**Order of paragraphs** (`large_to_small`): The six-system loop first, then the two records within it, then the public data models that document the split, then the flows between the systems; the requirements per flow use both records.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p16 | description | Seen from outside, a return is a loop through six systems; in the target design after Waypoint the OMS is the order record, while in April 2027 the shop platform still plays that role. | figure: Figure 2: the return loop through six systems, with the disposition releasing refund, restock and credit note and the order record as the only system that may ask for a refund. |  |\n| p17 | claim | The return request records what the customer wants to send and the merchant accepts, and reverse fulfillment records the physical work of receiving and inspecting it; keeping them apart stops a request being mistaken for goods back on the shelf. |  | `elaboration`: The loop through six systems. → The two records the loop carries. |\n| p18 | evidence | Shopify's documentation models the return as the buyer's intent to send items back, with statuses from requested to closed once every item has a restock decision. | quotation: A return 'represents the intent of a buyer to ship one or more items from an order back to a merchant'; statuses REQUESTED, OPEN, DECLINED, CLOSED, CANCELED. | `example`: The two records in principle. → The clearest public model of the first one. |\n| p19 | evidence | Shopify models the second record as a reverse fulfillment order, the work of processing the return, with four dispositions: restocked, processing required, not restocked and missing. | quotation: Reverse fulfillment order 'represents the work that's required to process a return'; reverse delivery; dispositions RESTOCKED, PROCESSING_REQUIRED, NOT_RESTOCKED, MISSING. | `sequence`: Shopify's return record. → Its separate record for the warehouse work. |\n| p20 | evidence | commercetools keeps the same two concerns as two states per return item, a shipment state and a payment state. | fact: Shipment state Advised or Returned, then BackInStock or Unusable; payment state NonRefundable or Initial, then Refunded or NotRefunded. | `similarity`: Shopify's two records. → The same split in a different platform. |\n| p21 | analysis | The split is the pattern: the first record is about intent and money and belongs to the order side, the second about work and stock and belongs to the warehouse, and they meet at the disposition. | figure: Figure 3: the return's lifecycle, customer's side, warehouse's side, settlement waiting for a disposition. | `conclusion_summary`: Two platforms that separate the records. → The pattern the chapter takes from them. |\n| p22 | analysis | Each flow between the systems has its own requirements; in the design this chapter argues for, the refund and the restock wait for the disposition, the credit note waits for the refund, and the messages that carry money are keyed on the return, while only the eligibility check reads the order as it stands because the customer is waiting. | table: Six flows (eligibility, received and disposition, refund, restock, credit note, status) by freshness, consistency, speed and behaviour when the other side is down; speeds marked as assumptions. | `elaboration`: The two records meeting at the disposition. → What each flow between the systems must guarantee. |\n\n### The Law: Fourteen Days, Three Times Over\n\n**Controlling idea** (`explanation`, id `law`): In the EU the right to return is law, and its articles become data requirements: four dates per order line, the delivery option kept, product exemption attributes, and the trader's right to wait for the goods that makes refund on inspection lawful.\n\n**Advances the thesis** (S2): Shows that refund on inspection is lawful if the clock from the notice is tracked, and where the merchant's own policy sits above the law.\n\n**Transition in:** `cause_effect`: The flows that move money only on the disposition. → The law that sets how long the merchant may wait.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p23 | evidence (list) | The flows make the refund wait for the disposition and the law decides how long it may wait: Directive 2011/83/EU gives a distance buyer 14 days from possession to withdraw, obliges the trader to refund within 14 days of the notice by the same means while letting it wait for the goods or proof of sending, gives the consumer 14 days to send the goods back, and lists the information duty, the twelve-month extension and the exceptions. | quotation: Articles 9(1), 9(2)(b), 10, 13(1)-(3), 14(1)-(2), 6(1)(h)-(i) and 16, quoted; adopted 25 October 2011, Official Journal 22 November 2011, applicable from 13 June 2014. |  |\n| p24 | analysis | Read as requirements, the directive asks for four dates per order line, the delivery option and its standard-rate equivalent, and product exemption attributes, and Article 13(3) is the legal basis for refund on inspection. |  | `cause_effect`: The articles as the law states them. → What the systems must store to obey them. |\n| p25 | context | Kestrel & Pine's own commercial policy sits on top of the statutory rules: free returns within 14 days of delivery in all three countries. |  | `contrast`: What the law requires of every trader. → What Kestrel & Pine's own policy adds on top. |\n\n### The Choices\n\n**Controlling idea** (`comparison`, id `choices`): Four decisions shape a returns architecture (who runs the customer's side, which event releases the refund, which one system issues it, how exchanges work), and the refund trigger and writer come before the product.\n\n**Advances the thesis** (S2, S3, S5): Sets out the trigger, writer and exchange decisions and argues for inspection, one writer and held exchanges.\n\n**Transition in:** `sequence`: The law's clocks and the right to wait. → The decisions a merchant takes within them.\n\n**Order of paragraphs** (`comparison`): The four decisions in the order a merchant meets them: the product that runs the customer's side, with the table of the four answers across all decisions directly after it, then the trigger, the writer and the amount it refunds, and the exchange model, then the author's rule; the rule needs all four decisions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p26 | claim | Four decisions shape a returns architecture, each with a few realistic answers. |  |  |\n| p27 | description | The customer's side can be run by hand at the Starting stage or by the platform's own returns, which model the return and the reverse fulfillment. |  | `sequence`: The four decisions. → The first: who runs the customer's side, starting with the simplest answers. |\n| p28 | evidence | A specialist returns portal adds labels, exchanges, store credit and drop-off networks, as the claims of Loop, Narvar, Returnista and Happy Returns show. | source: Loop ('Originally built for Shopify', steers to exchanges or store credit, '5,000+ brands'); Narvar ('1,500+ global brands'); Returnista (Amsterdam, '1,000+ brands in Europe'); Happy Returns ('a UPS company', '10,000 Return Bar locations'). | `sequence`: The manual and platform answers. → The specialist portal. |\n| p29 | description | Order management products list returns orchestration and cross-channel returns as modules, and a table sets the four answers side by side, differing mainly in which system computes eligibility and which may refund. | table: Manual, platform's own returns, returns portal, OMS module compared on eligibility, labels, exchanges, refund writer, marketplace and store returns, and stage fit. | `sequence`: The returns portal. → The fourth answer: the OMS. |\n| p30 | comparison | The second decision, which event releases the refund, caused the Double Refund and is a policy choice with a legal floor: request, carrier scan, receipt or inspection, each with its wait, risk and legal position. | table: Four triggers by customer wait, merchant's risk, legal position under Directive 2011/83/EU, and fit; inspection is Kestrel & Pine's choice. | `sequence`: Who runs the customer's side, and the four answers compared. → The decision that caused the Double Refund. |\n| p31 | claim | The refund can be issued by the portal, the OMS or the ERP, and any one works but two at once produces the Boomerang (the Double Refund was one case); the money-side rules are one writer, the return id as key and a daily comparison, and the amount, stated in one sentence, is the line price after allocated discounts, which W5's export carries. | case: 190 returned jackets refunded at €159.20 instead of €143.28 (November 2026) because the order-level discount was not allocated to lines; W5's integration contract adds the allocated net price per line. | `sequence`: Which event releases the refund. → Which one system issues it. |\n| p32 | comparison | Exchanges can be held orders released on a resellable disposition (Kestrel & Pine's model, needed where the method cannot hold money, as with iDEAL), instant exchanges secured on a card, or exchanges with a balance, and steering to exchanges keeps the revenue for one more parcel. | quotation: Shopify: 'Release the exchange and collect a balance'; Loop and Returnista steering to exchanges and store credit. | `sequence`: Who issues the refund and for how much. → How the replacement in an exchange is released. |\n| p33 | recommendation | The author's rule: choose the refund trigger and writer before the product, write both into the integration contract, and let the disposition be the trigger unless the goods are cheap enough that fraud costs less than waiting; at Kestrel & Pine's prices inspection is the only defensible trigger. |  | `conclusion_summary`: The four decisions and the options compared. → The order in which to take them and the author's answer. |\n\n### Returns From Marketplaces and Stores\n\n**Controlling idea** (`explanation`, id `channels`): Marketplaces and store counters start returns and refunds the merchant did not, so the return record must accept them under their own ids and expose their clocks, or support refunds twice and finance misses the first refund.\n\n**Advances the thesis** (S4): Extends the single record and single writer to returns the merchant did not start.\n\n**Transition in:** `contrast`: The merchant's own decisions about trigger and writer. → Returns whose trigger and writer the merchant does not control.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The claim first, then Amazon's and Zalando's rules as evidence, then what the record must do, then the store counter as the mirror case. Stating what the record must accept before the evidence would ask the reader to take it on trust; putting the store counter first would separate the marketplace evidence from its conclusion.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p34 | claim | A marketplace can authorize a return or refund it outside the merchant's portal, and such a return still has to reconcile with the merchant's records. |  |  |\n| p35 | evidence | Amazon's seller rules set the window, authorize most returns automatically, issue labels, give the seller 24 hours to respond and two days to refund after receipt before Amazon may refund automatically, and can charge an A-to-z claim to the seller. | source: Amazon seller guidance, April 2025: 30 days from estimated delivery; automatic authorization and prepaid labels in the US; 'respond to requests within 24 hours'; refunds 'within two days of receiving returns, or Amazon may issue an automatic refund'; A-to-z claims. | `example`: Marketplaces acting outside the merchant's portal. → Amazon's rules for seller-fulfilled orders. |\n| p36 | evidence | For orders the marketplace fulfils itself, it receives and grades the return and charges a fee, as Zalando's ZEOS network of about 20 returns centres shows. | fact: ZEOS: 'around 20 returns centres', November 2024. | `additional_support`: Seller-fulfilled marketplace returns. → Returns of orders the marketplace fulfils. |\n| p37 | analysis | The return record must therefore accept RMAs and refunds it did not create, keyed by the marketplace's return id, and expose the marketplace's clocks as deadlines, or a second refund or a missed first one follows. |  | `cause_effect`: Marketplaces that authorize, grade and refund. → What the merchant's record must accept. |\n| p38 | example | A web order returned at a store counter is the mirror case: the till must find the order, record the return and restock, and the portal request must be closed before anything is paid, which Kestrel & Pine does by hand until the POS and the shop platform are linked. | case: A web order returned at the Nijmegen counter; stores refund web orders only after support closes the portal request (illustrative). | `similarity`: Returns started by a marketplace. → Returns started at the merchant's own store counter. |\n\n### Across Scale Stages: When It Fits and When It Limits\n\n**Controlling idea** (`comparison`, id `stages`): The shape of a return and the law do not change with scale; the number of channels a return comes from and systems that could act on it do, and the Growing stage is where the refund trigger and writer must be fixed.\n\n**Advances the thesis** (S3, S4): Places the trigger and writer decision at the stage where a portal, a warehouse and an ERP first all hold the return.\n\n**Transition in:** `sequence`: Returns from the merchant's own channels, marketplaces and stores. → How the arrangement changes as a merchant grows.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p39 | comparison | Marketplaces and stores multiply where a return can start and growth multiplies it further; across the four stages the return's shape and the law stay fixed while channels and systems multiply, so Stage 2, when a portal, a warehouse and an ERP first all hold a copy of the return, is where the trigger and writer must be fixed. | table: Starting, Growing, Omnichannel and Group: what is typical, what becomes necessary, and the signs the stage is ending. |  |\n\n### In Practice\n\n**Controlling idea** (`example`, id `in-practice`): Eva's exchange from 19 to 22 April 2027 shows each system acting once on the disposition, and the refund variant shows what the trigger, the one writer and the key prevent.\n\n**Advances the thesis** (S1, S2, S3, S5): Shows the two records, the disposition as trigger, one keyed refund and the held exchange on one return.\n\n**Transition in:** `example`: The stages and what each makes necessary. → The pattern in public examples and in Eva's return.\n\n**Order of paragraphs** (`chronological`): A one-sentence bridge from the public models, then Eva's return in time order, then the refund that did not happen on the same dates; the variant refers back to the dated table.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p40 | transition | The public models already cited show the pattern in general; Kestrel & Pine's own case shows it on one return. |  |  |\n| p41 | example | Eva's exchange from 19 to 22 April 2027 runs as the design says: the portal opens return R-20270419-1 and a held order for size L, the bench grades the jacket restocked at 10:15 on 22 April, the shop platform closes the return and releases the held order, L ships in the 13:00 wave, and the ERP's credit note and new invoice net to zero. | case: Dated table: return R-20270419-1, order #1072455, exchange order #1072455-X1 (€0 balance), PostNL first scan 20 April, disposition restocked 22 April 10:15, 13:00 wave, credit note and new invoice that night; days canonical, hours illustrative. | `example`: Public models of the pattern. → The pattern applied to Eva's return. |\n| p42 | example | Had Eva chosen a refund, the disposition would have triggered one €199 refund keyed on R-20270419-1, well inside the 3 May deadline, and a refund in the PSP console on the carrier scan would have been the Double Refund, which the February 2027 fix (the portal as the only refund writer with the return id as key, a read-only console, a daily comparison) prevents. | case: Refund variant: €199 by iDEAL, keyed on the return id, credit note; legal deadline 3 May (14 days from the 19 April notice); refund on day three; support console read-only since February 2027. | `contrast`: The exchange Eva chose. → The refund she could have chosen. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`cause_effect`, id `wrong`): Returns fail in seven recurring ways, and each is detected by a report or a reconciliation and prevented by the trigger, the single writer, the key or the one record.\n\n**Advances the thesis** (S2, S3, S4, S5): Shows each rule of the thesis by the failure it prevents.\n\n**Transition in:** `contrast`: Eva's return working as designed. → The ways the same path fails.\n\n**Order of paragraphs** (`order_of_importance`): Money failures first because they cost the most and opened the chapter (the double refund, the refund without a return), then stock, then the two failures that come from records the merchant did not create or released too early (external returns, exchanges), then the clock and the customer's view; the customer's view comes last because it hands on to the next chapter.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p43 | transition | Eva's return worked because each system acted once on the right event; where one of those rules is missing, the same path fails in seven ways. |  |  |\n| p44 | cause_effect | The double refund (the Boomerang) comes from two writers and no key; it is detected by the daily refund comparison and prevented by one writer, the return id as key and a read-only console. | figure: Figure 4: two writers without a key paid twice, one writer with the return id paid once. | `elaboration`: Seven ways the path fails. → The first: the double refund. |\n| p45 | cause_effect | A refund on request or on scan pays for parcels that never arrive or hold a different item; it is detected by refunds with no 'received' event and prevented by refunding on inspection. |  | `additional_support`: The previous failure and its remedy. → Another way the return path fails. |\n| p46 | cause_effect | A phantom restock (the Phantom Stock) puts a worn item back on sale when stock rises before grading; it is detected by the weekly reconciliation and prevented by letting stock move only on a restocked disposition from the WMS, the single writer of on-hand stock under W1. |  | `additional_support`: The previous failure and its remedy. → Another way the return path fails. |\n| p47 | cause_effect | A parcel with no RMA, from an unimported marketplace return or an old label, lands in a 'no RMA' queue, is matched after the fact, and is prevented by importing every marketplace return under its own id. |  | `additional_support`: The previous failure and its remedy. → Another way the return path fails. |\n| p48 | cause_effect | An exchange released by a scan or shipped instantly can go out for a return that never comes; it is detected by shipped exchanges with open returns and prevented by release on disposition or a held card. |  | `additional_support`: The previous failure and its remedy. → Another way the return path fails. |\n| p49 | cause_effect | A refund issued after the 14-day deadline because the bench fell behind is detected by a return-aging report against the Article 13 clock and prevented by putting returns in the Black Friday plan. |  | `additional_support`: The previous failure and its remedy. → Another way the return path fails. |\n| p50 | cause_effect | A three-system status (Schrödinger's Order), where portal, warehouse and provider disagree about a refund, as the Three-Status Order's eleven tickets showed for a two-parcel order, is resolved by one status built from the same events for customer and agent. |  | `additional_support`: The previous failure and its remedy. → Another way the return path fails. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The jacket sent back for the next size, the Double Refund and the failures look like separate problems in the portal, the console, the bench and the calendar. They are one sequence broken in different places: money or stock moved before the warehouse's disposition, by more than one system, or after the clock ran out. One rule set repairs them all: the disposition releases money and stock, each action has one writer and a key, and the dates that drive the law's clocks are kept.\n\n**So what:** A merchant can write the returns integration contract (trigger, writer, key, restock rule, four dates per line) before choosing a returns product; Kestrel & Pine's February 2027 fix was a rule, a key, a read-only console and a daily comparison, not a new product.\n\n**Callback:** The opening's jacket sent back for the next size, which needed the portal, the warehouse and finance each to finish their part. The first paragraph of the conclusion says which event each of those systems acts on and why acting once on the disposition keeps them in agreement.\n\n**Takeaway** (`course_of_action`): Decide the refund trigger, the single refund writer and its key, and the restock rule before buying a returns product; keep four dates per line with an aging report someone reads weekly; and take the nine questions to your own company.\n\n**Hand-off** to [Where Is My Order? Notifications, Service and the Customer Record](customer-service-and-notifications.html): `cause_effect`: The return closed on the disposition, the refund or the exchange sent, and the few messages Eva saw of all this. → Why the customer's messages, the status page and the agent's view must be built from the events of the whole part in one record, and what the eleven tickets of the Three-Status Order cost without it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p51 | synthesis | The opening's jacket needs the portal, the warehouse, the payment provider and the ERP to act once each and in order; the Double Refund, the phantom restock and the missed deadline are that order broken, and one set of rules (the disposition releases money and stock, one writer and a key per action, the dates kept) repairs all three, so that no refund is paid twice, no worn item is sold as new and no refund misses the legal deadline; Kestrel & Pine's February 2027 fix applied the first two rules to refunds. | reasoning: The opening's jacket set against the failures and the February 2027 fix (read-only console, one writer, return id as key, daily comparison). |  |\n| p52 | synthesis (list) | Established: a return is two records joined by the disposition; EU consumers may withdraw within 14 days and the trader must refund within 14 days of the notice but may wait for the goods; return rates near a quarter and measurable fraud make returns a first-class flow; marketplaces own their returns' policy and clocks. |  | `conclusion_summary`: The chapter's answer in one rule set. → What is settled by public sources. |\n| p53 | synthesis (list) | Depends on context: the refund trigger by the goods' value and fraud, the portal or OMS module by stage and channels, and held or instant exchanges by payment method and goods' price. |  | `contrast`: What is settled. → What depends on the merchant's situation. |\n| p54 | recommendation (list) | The author's synthesis: decide the trigger, the single writer and the restock rule before buying a returns product, and treat the 14-day clocks as data requirements with a weekly aging report. |  | `sequence`: What depends on context. → The author's own rules. |\n| p55 | recommendation (list) | Nine questions test a returns design: the refund trigger, the single writer and its key, what the warehouse reports, the four dates, eligibility inputs, external returns, the exchange model, the refund amount and aged returns. |  | `elaboration`: The author's rules. → The questions that test them at the reader's own company. |\n| p56 | transition | With the item back on the shelf, the money back or the L on its way and the books agreeing, Eva saw only a few messages, which are right only if they, the status page and the agent read the same events; when they read different systems one customer writes eleven tickets about one order, as in the Three-Status Order, the subject of the next chapter. |  | `cause_effect`: The questions about the return path. → What the customer saw of it, and why that view must come from the same events. |\n\n## Non-goals\n\n- Refund mechanics at the PSP (asynchronous refunds, failed refunds, chargebacks, idempotency keys in depth); this chapter fixes only the trigger, the writer and the key. See [Taking the Money: Payment Providers, Authorization, Capture and Refunds](commerce-payments.html).\n- The credit note, VAT on returns and what the ERP posts. See [Tax, Invoices and the Books: From Order to Ledger](tax-invoicing-and-ledger.html).\n- Warehouse receiving, put-away and the fulfillment-order handshake; this chapter uses the disposition as the warehouse's output. See [Pick, Pack, Ship: Warehouse Management and Fulfillment](warehouse-and-fulfillment.html).\n- Return-in-store mechanics and the POS. See [Stores Are Systems Too: Point of Sale and Omnichannel Fulfillment](stores-and-omnichannel.html).\n- Marketplace return feeds and fees. See [Selling on Someone Else's Platform: Marketplaces and Channel Integration](marketplaces-and-channel-integration.html).\n- The full consumer-law calendar (Omnibus price rules, accessibility, GPSR); only the withdrawal right is treated here. See [Rules Turned Into Requirements: Consumer, Payment, Invoicing and Platform Regulation](commerce-regulation.html).\n- Notifications and the status page for returns. See [Where Is My Order? Notifications, Service and the Customer Record](customer-service-and-notifications.html).\n- The step-by-step journey of Eva's return. See [Journey 2: The Jacket Comes Back](journey-return-and-exchange.html).\n- Return fraud scoring in depth (fraud-prevention in the LISTED journal).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Check report after round 3 (the confirming round) is ESCALATE (19 pass, 19 fail) and stale after the closing fixes of 2026-11-12. Remaining open-ended points from one round only: the NRF dates in the scene's survey paragraph are hard to parse; the first-person 'my rule' arrives abruptly (house style keeps the author's labelled judgement); one reader found the Eva preview in the introduction gives away the outcome (the spec's p04 asks for it); the ZEOS sentence reads as a stray fact to one reader; the hand-off paragraph after the Questions list felt detached to one reader.\n- Needs the author: whether any chapter should state a cost per disposition. The ledger's returns-and-exchanges line holds an illustrative disposition split beyond the 61% resold as new (27% resold after processing, 9% recycled or donated, 3% missing or wrong item); this chapter states only the 39% not resold as new, and no ledger line gives a cost per disposition.\n\n## Decision log\n\n- **2026-11-07** — Made the two-record model and the refund-trigger decision the spine, rather than a tour of returns portals, because the n cy-regulation.md, _research/brief-checkout-payments-tax.md — Return rates, portals, the return data model, the 14-day right and its application date, refund semantics (carried from spec.md).\n- **External**\n  - Shopify developer documentation (returns apps; ReverseFulfillmentOrderDispositionType), n.d., accessed 2026-11 — The two-record model, statuses and dispositions, exchanges with a balance.\n  - commercetools Orders API, n.d., accessed 2026-11 — Return item shipment and payment states.\n  - Directive 2011/83/EU, Official Journal 2011-11-22 — The right of withdrawal, reimbursement, the consumer's obligations, the information duty, the extension and the exceptions.\n  - NRF with Appriss Retail (2023-12-22) and Happy Returns (2024-12-05, 2025-10-15); Coresight (2023-04-04) — Return rates and economics.\n  - Amazon seller guidance (2025-04-15); Zalando ZEOS announcement (2024-11-21) — Marketplace returns.\n  - Loop, Narvar, Returnista, Happy Returns vendor sites, n.d., accessed 2026-11 — The returns-portal category.\n\n## Changelog\n\n- **2026-11-12** — Closing fixes after the confirming round 3 (ESCALATE): clocks sentence corrected to the quoted articles, trigger table introduced, transitions at the rates subsection and the marketplace section, thesis sentence split, refund writer in April 2027 stated, roadmap aligned. Check report stale.\n- **2026-11-12** — Resolved after round 2 by the author's standing instruction: directive quotes verified, application date wording follows Article 28(2), one open question left for the author (cost per disposition).\n- **2026-11-12** — After draft-check round 2: policy sentence moved to the law section, failures transition paragraph added, refund amount cut to one sentence, failure names mapped to the opening patterns, transitions added; paragraphs renumbered p01-p56.\n- **2026-11-12** — After draft-check round 1: return-rate paragraphs moved into the scene, refund amount merged into decision 3, comparison table moved to decision 1, transitions and roadmap updated, paragraphs renumbered p01-p55.\n- **2026-11-12** — Converted from spec.md to an outcome spec: intent, thesis, role and acceptance criteria copied from the journal spec; supporting claims, sections, paragraphs, transitions, introduction and conclusion reconstructed from the published chapter; record-keeping sections carried over; thesis paragraph (p03), roadmap (p05), requirements paragraph (p23) and conclusion synthesis (p51) added; p04 and p56 aligned with the journal spec's transitions. Flow rubric (sound with notes): refund amount moved into The Choices (p32), In Practice's public-examples paragraph cut to a bridge (p41), paragraphs renumbered. Status draft.\n- **2026-11-07** — Visual layer: redrew 2 mermaid diagrams as illustrations and added 2 conceptual figures (article-illustrator).\n- **2026-11-07** — Final consistency pass: ledger-as-document reference rephrased.\n- **2026-11-07** — Editorial review pass: post-Waypoint refund writer aligned with the journey ledger (OMS through the platform refund API), NRF 2025 figures marked as projections, iDEAL defined.\n- **2026-11-07** — Initial spec and article.\n"}]}]}</script>

    (function () {

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';

                    html += '</tr></thead><tbody>';

                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';

                    const firstMatch = line.match(bullet) || line.match(ordered);

                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
