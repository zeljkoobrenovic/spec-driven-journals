<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published page (posts/part-5-intro/index.md, 421 words by check_draft's count, nine units) and its former spec.md, then revised the same day (see decision_log); the page was revised to match. One spec paragraph per unit; the KEY POINTS callout, Figure 2 (the outside channels) and Figure 3 (the four promises and their one source) are evidence of the claim paragraph (p04); Figure 1 (outside parties set the rules) is evidence of the hook (p01). The standalone 'Begin with' line is now the headed closing (p09).\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Part V answers four questions in order: how marketplace listings, stock and orders join the merchant's systems; what changes when the buyer is a company; how structured documents are exchanged with trading partners and what e-invoicing mandates require; and what the ERP should own and how fast each kind of fact must reach it.\n- **Know:** Each outside channel brings an outside party that sets the rules (a marketplace's scorecard, a chain's penalties, a mandate's legal date), and connectors that should translate the channel's requirements without owning prices, stock or orders.\n- **Know:** The ERP's role behind every channel, announced before the B2B and EDI chapters assign it terms, credit, wholesale prices and invoices: it keeps the books and receives orders, shipments and payments from the systems that own them, and the last chapter argues why.\n- **Be able to:** Pick the Part V chapter that answers the decision in front of them.\n\n**Audience:** Readers new to commerce architecture (engineers, product managers, wholesale and marketplace leads) at a merchant that sells beyond its own storefront, who have read Parts I to IV and are about to start the channel chapters, or who arrive with one marketplace, wholesale, EDI or ERP decision in hand and want the chapter that answers it.\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side; roughly what an API, a database and a queue are.\n- Part I: the thirteen steps of an order, promise and handoff, the three status lines, system of record, single writer, events, idempotency and reconciliation; the glosses for PSP, WMS, ERP, iPaaS, EDI, webhook, SKU, channel, marketplace connector, 3PL, OMS, availability service, D2C, B2B, PIM and POS; the four scale stages.\n- Parts II and III: one owner per product, price, discount and stock fact; available-to-promise; checkout creating the order once; one order record with three status lines; one invoice per shipment.\n- Part IV: the warehouse system as the only writer of on-hand stock; one carrier layer and a computed delivery promise; stores; returns with one refund writer; notifications, status page and service screen as read models over one order record.\n- Kestrel & Pine in outline: a fictional outdoor brand, its systems, its incidents, the Waypoint program; Eva's jacket order of 13 April 2027 and the Duiven warehouse.\n\n**Does not yet know:**\n\n- Despatch advice (glossed here as a shipment notice); e-invoicing mandates (only named here; owned by edi-and-e-invoicing).\n- Seller performance metrics, stock allocation per channel, credit checks and the hub decision: each owned by a Part V chapter and only named here.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader of this page alone can name the four chapters' subjects in reading order. *Probe:* After reading only this page: what will each of the next four chapters tell you, in order? | `intro_predicts_content` | cold_reader | major |\n| AC-2 | A reader of this page alone can say why extra sales through outside channels can turn into deductions, and what decides whether they do. *Probe:* Using only this page: why can a sale through a marketplace or a retail chain end in a penalty or a deduction, and what does the merchant have to decide to prevent it? | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** What changes when orders arrive from outside the merchant's own shop, and what must the merchant's systems do to keep the promises made to the parties outside?\n\n> **Claim:** Orders from outside the shop arrive through an intermediary that translates, such as a channel connector or an EDI provider, from an outside party that scores, charges back or imposes legal deadlines. The merchant keeps its promises only when no intermediary is the system of record for any value, every channel's order is created in one order record, each value sent out comes from its one owner, and no sale waits on the ERP.\n\n**Disputed by:** The view that each outside channel is a sales decision served by its own tool: the marketplace connector, the B2B portal, the EDI provider and the ERP each hold the orders, stock and prices their channel needs, the ERP is the natural hub everything connects through, and the outside party's scorecard, chargebacks and mandates are problems for operations and finance rather than requirements on the integrations.\n\n**So what:** Kestrel & Pine's Part V incidents were values taken from a copy or from a system that did not own them, or orders kept in the tool they arrived through: about 160 marketplace orders in the Black Friday Oversell, 140 of them seller cancellations, and a strike from bol; two days of stale stock to bol from the Deprecated Endpoint; 38% of 9,400 wholesale orders keyed into the ERP by hand; Bergzicht's €14,200 deduction for despatch advices written before packing; an eleven-day January close. A merchant that accepts the claim decides, before it adds a channel, where that channel's orders are created, which system computes each value the outside party receives, and who owns that party's rules and dates.\n\n**How and why:** An outside party acts on what it is sent without asking again and enforces its own rules: a marketplace sells the stock number it was last sent and counts each seller cancellation and late confirmation; a chain's receiving scans pallet labels against the despatch advice; a mandate's network rejects an invoice that lacks a required field. An intermediary that keeps its own copy sends a stale or invented value when the copy lags or a flow fails silently, and an order kept in the channel's own tool is invisible to the warehouse, support and finance. The ERP changes in audited releases on a finance cycle, so a stock figure or an order routed through it moves at that pace.\n\n**Supporting claims**\n\n- **P5-1** — Every outside channel's order (a marketplace order, seller- or marketplace-fulfilled; a wholesale order from the portal, keyed in or confirmed after a punchout; an EDI order) is created once in the merchant's one order record, keyed on the outside party's identifier and flagged by channel, and is never kept only in the tool it arrived through.\n- **P5-2** — An intermediary (the channel connector, the EDI provider, the ERP partner's connector) translates between systems and owns no fact; the merchant owns its contract: the fields, their direction and cadence, the system of record for each, the partner's guideline and API versions with their dates, and a named internal owner.\n- **P5-3** — Each value sent to an outside party, or used to accept its order, comes from the one system that owns it: a channel's stock number from one available-to-promise calculation, prices from the pricing source with effective dates, terms and credit from the ERP's receivables at order placement, the despatch advice from the warehouse's pack confirmation, and the invoice from the ERP's confirmed shipment.\n- **P5-4** — Outside parties enforce rules the merchant does not negotiate (a marketplace's performance thresholds and API retirement dates, a chain's message guideline and chargebacks, a country's e-invoicing mandate), so each rule becomes a freshness requirement on a flow or a dated obligation with an owner, and a monitor shows when it is missed.\n- **P5-5** — The ERP is the system of record for finance (postings, invoices, receivables, purchasing, stock value, item cost, and business customers' prices, terms and credit); it receives orders, shipments and payments by batch from their owners, publishes what it owns for channels as events, and stays out of every real-time path.\n\n## Role in the part\n\nPerforms the part's opening: states the part thesis in its three key points, places the part beside Eva's order through two Amazon.de orders, a shop's pre-season order and Bergzicht's 240-unit reorder, and gives the reading order.\n\n## Flow\n\n**Pattern:** `large_to_small` (also `prerequisite_order` in chapters: the four chapter paragraphs, in the part's reading order; `prerequisite_order` in p04: the rule follows the facts and glosses (B2B portal, ERP, keyed orders, connector, EDI) that p02 and p03 introduce; the order record is known from Part III)\n\nThe page opens on the part's puzzle (the same jacket sold through a marketplace or a chain can end in a penalty or a deduction), then narrows: to Kestrel & Pine as that merchant, the size of its outside channels and the B2B portal and ERP, with keyed orders that exist only in the ERP; to the concrete routes the part follows for the jacket, set against the single shop of Parts II to IV and passing through a connector or an EDI provider. The rule follows as a prerequisite step: it names the keyed orders, the connector and the ERP that p02 and p03 introduce, and the order record known from Part III, and the chapter order closes it; then one paragraph per chapter; and a one-paragraph closing that names the opening's cause and where to start. The company comes before the routes so the buyers are known as its customers (readers of rounds 1 and 2 asked for this); put the rule first and it answers a problem with no channels in it; put the chapters first and they point at a rule the reader has not met.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): A merchant can sell the same jacket through its own shop, a marketplace or a retail chain, yet the marketplace can penalize late dispatch and the chain can deduct money for the wrong pallet labels, so an extra sale handled like a consumer checkout can end in a deduction or a delayed payment.\n\n**Bridge:** The opening's merchant, now Kestrel & Pine with its outside channels, and the single shop of Parts II to IV, whose order the merchant's own checkout created (chapter 19's hand-off). → The same jacket on routes where someone else's system creates the order: two Amazon.de orders of 13 April 2027, one fulfilled by the merchant and one by the marketplace; a shop's pre-season purchase; Bergzicht Outdoor's 240-unit reorder on three pallets; with Kestrel & Pine's €3.0 million of marketplace sales and €12.0 million from 1,100 wholesale accounts, 62% of whose orders arrive through the B2B portal and 38% are keyed into the ERP.\n\n**Thesis statement** (KEY POINTS bullets 1 to 3 and paragraph p04): Where each order becomes authoritative decides whether outside channels keep their promises: every channel's order is created in the order record; connectors translate while prices, stock and orders keep their owner, so each promise sent out comes from its owner; and availability never waits on a scheduled finance-system update.\n\n**Roadmap** (paragraph p04 (last sentence)):\n\n- Four chapters apply the rule in turn: marketplaces, business buyers, the documents exchanged with trading partners, and last the ERP. *Kept in:* chapters.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | A merchant can sell the same jacket through its own shop, a marketplace or a retail chain, but each outside party sets conditions (a marketplace penalizes late dispatch, a chain requires pallet labels and invoices), so handling the extra sale like a consumer checkout can end in deductions or delayed payment. | figure: Figure 1: a merchant's building surrounded by a marketplace with a scorecard, a retail chain with a penalty ticket and an authority with a circled calendar date; the caption names the e-invoicing mandate. |  |\n| p02 | context | Kestrel & Pine, the fictional outdoor brand, earns €3.0 million through marketplaces and €12.0 million from 1,100 wholesale accounts in 2026; 62% of wholesale orders arrive through the B2B portal and 38% are keyed by hand into the ERP, which keeps finance and purchasing records, so keyed orders exist only in the ERP, outside the order record. | statistic: €3.0M marketplaces, €12.0M from 1,100 wholesale accounts, 62% portal, 38% keyed into the ERP (fictional). | `elaboration`: The opening's merchant selling the jacket through a marketplace and a retail chain. → Kestrel & Pine as that merchant: the size of its outside channels, and the B2B portal and ERP through which wholesale orders arrive, with keyed orders that exist only in the ERP. |\n| p03 | context | Unlike in Parts II to IV, someone else's system creates the order and a connector or an EDI provider translates it: the part's examples are routes for the same jacket (two Amazon.de orders on 13 April 2027; a pre-season purchase by De Kaap Buitensport, an outdoor shop; a 240-unit reorder on three pallets by Bergzicht Outdoor, a retail chain), all sharing the warehouse and books of Eva's order. | scenario: Two Amazon.de orders of 13 April 2027; De Kaap Buitensport's pre-season purchase; Bergzicht's 240-unit reorder on three pallets (fictional). | `contrast`: The single-shop journey of Parts II to IV (chapter 19's hand-off) and Kestrel & Pine's outside channels. → Orders that someone else's system creates and an intermediary (a connector or an EDI provider) translates, as the part's concrete examples. |\n| p04 | claim | The part's claim and roadmap: the keyed orders and the opening's penalties come from one decision, where each order becomes authoritative; every channel's order should be created in the order record, and connectors translate while prices, stock and orders keep their owner, so each promise sent out (stock, price and credit, pallet contents, the invoice) comes from its owner (KEY POINTS bullet 3 adds that availability never waits on the ERP); the chapters take marketplaces, business buyers, trading-partner documents, then the ERP. | reasoning: KEY POINTS callout: every outside channel is a way into the same order record; the intermediaries translate and must not own; outside parties keep score and set the calendar, so availability never waits on a scheduled finance update.; figure: Figure 2: three kinds of outside party, three intermediaries that translate (the marketplace connector, the B2B portal and the EDI provider), one order record every channel's order is created in, an ERP that receives daily batches and feeds no channel directly (its wholesale prices and credit leave it only as events).; figure: Figure 3: four promises to outside parties (stock a marketplace may sell, price and credit a shop gets, what is on each pallet, what is owed as a legal invoice) and the one system allowed to make each; the caption glosses chargeback (a buyer's deduction) and strike (a marketplace penalty). | `cause_effect`: The keyed orders of p02, the routes of p03 and the opening's penalties. → The one decision both come from, the rule the part argues, then the chapter order. |\n\n## Sections\n\n### Chapters in this part\n\n**Controlling idea** (`description`, id `chapters`): Each of the four chapters decides one question about orders from outside the shop and names one Kestrel & Pine case; each builds on, or turns from, the one before it.\n\n**Advances the thesis** (P5-1, P5-2, P5-3, P5-4, P5-5): Each paragraph introduces the chapter that argues one or more of the part's supporting claims, so the list is the part's argument in outline.\n\n**Transition in:** `elaboration`: The rule and the chapter order announced in p04. → One paragraph per chapter: its subject in bold, its case and what it decides.\n\n**Order of paragraphs** (`prerequisite_order`): Marketplaces come first because their orders are closest to the consumer order of Parts II to IV, so only the outside party and the connector are new; the B2B chapter turns from consumers to companies and assigns terms, credit and wholesale prices to the ERP; the EDI chapter needs those accounts and contract prices for its largest buyers' documents; the ERP chapter comes last because it gathers what the earlier chapters hand the ERP. Putting B2B first would teach the order-record rule on negotiated agreements; putting the ERP earlier would argue its role before the reader has seen what channels need from it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | description | The marketplace chapter covers listings, imported orders, stock allocation and seller performance: stale stock causes cancellations and penalties, a retired connector interface left one channel outdated for two days, and the connector needs a technical contract and a responsible owner. | scenario: Stale stock causing cancellations and penalties (the Black Friday Oversell); two days of stale stock after a retired API version (the Deprecated Endpoint) (fictional). |  |\n| p06 | description | The B2B chapter turns from consumer buyers to companies, with accounts, negotiated prices, payment terms and credit limits: De Kaap's purchase, held over its credit limit, shows that accepting an order takes more than checking stock, so finance's terms must reach the portal reliably. | scenario: De Kaap Buitensport's pre-season order of 25 February 2027, held by the ERP over its €15,000 credit limit (fictional). | `contrast`: The marketplace's consumer buyer. → Buyers that are companies, with agreements a consumer checkout cannot express. |\n| p07 | description | For the largest buyers, the EDI chapter follows structured orders, despatch advices (shipment notices) and invoices: Bergzicht's €14,200 deduction for mismatched pallet labels shows the shipment notice must describe what was packed, and the chapter separates trading-partner requirements from dated e-invoicing mandates. | scenario: Bergzicht's €14,200 deduction for despatch advices whose pallet labels did not match what arrived (fictional; the ASN Chargeback). | `elaboration`: The wholesale channel of the B2B chapter. → Its largest buyers, who send documents from their own systems. |\n| p08 | description | Last, the ERP chapter gives the ERP a clear financial and purchasing role: the ERP partner's connector, which took three weeks to understand, shows the cost of undocumented ownership, and finance can take complete batches while stock availability needs a faster route. | scenario: The partner-built connector Noor Visser and Ruben Alves spent three weeks reconstructing (fictional). | `sequence`: The chapters before it and what they hand the ERP. → The last chapter: the ERP's own role. |\n\n## Conclusion: Where to Begin\n\n**Synthesis:** The chapters' cases (the stale stock, the credit hold and the deduction) began as orders outside the order record or promises from the wrong system, which no single chapter paragraph says of all of them.\n\n**So what:** The reader knows the penalties are settled by where an order is created and which system sends each value, not by more channels or tools, and starts with the marketplaces.\n\n**Callback:** The opening's jacket sold through a marketplace or a chain that ends in a penalty or a deduction (p01). The closing names the cause of those penalties.\n\n**Takeaway** (`course_of_action`): Begin with marketplaces-and-channel-integration.\n\n**Hand-off** to [Selling on Someone Else's Platform: Marketplaces and Channel Integration](marketplaces-and-channel-integration.html): `elaboration`: The part introduction's first question, marketplace listings, imported orders, stock allocation and seller performance, and the two Amazon.de orders of 13 April 2027. → What the marketplace grades, what the channel connector may and may not hold, and where marketplace orders and marketplace-held stock belong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | synthesis | The chapters' cases, the stale stock, the credit hold and the deduction, began as orders outside the order record or promises from the wrong system; begin with the marketplace chapter. |  |  |\n\n## Non-goals\n\n- Teaching any chapter's content (seller metrics, allocation policies, credit checks, EDI messages, mandates, the hub decision); the page summarizes and does not re-argue. See [Selling on Someone Else's Platform: Marketplaces and Channel Integration](marketplaces-and-channel-integration.html), [Selling to Businesses: Accounts, Contract Prices, Quotes and Approvals](b2b-commerce.html), [Documents Between Companies: EDI, Punchout and E-Invoicing](edi-and-e-invoicing.html), [The Back Office: ERP Integration and Who Is the Hub](erp-and-back-office-integration.html).\n- The Waypoint decisions in detail. See [Meet Kestrel & Pine](meet-kestrel-and-pine.html).\n- Integration mechanics (events, idempotency, contracts). See [Part VI — INTEGRATION: Making Separate Systems Behave Like One](part-6.html).\n- The part's closing (the four incidents read together as one fault, set against the opening's jacket). See [The Back Office: ERP Integration and Who Is the Hub](erp-and-back-office-integration.html).\n- Scale-stage comparisons (each chapter has its own table).\n- External factual claims; the page makes none of its own.\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-11-12** — After the confirming draft-check round 3 (escalate: 14 passed, 17 failed; 8 blocking, all at fault in the draft), cheap fixes applied without another round, as th     (function () {
        const data = JSON.parse(document.getElementById('data').textContent);

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';

                    continue;

                const h = line.match(/^(#{1,6})\s+(.*)$/);

                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {

                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;

                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];

                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {

                            if (!nxt.trim()) break;

                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
