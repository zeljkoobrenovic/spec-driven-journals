<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/46-case-shopify/index.md) and its former spec.md, whose Non-goals, Modalities, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter, plus the units the contract asks for and the published chapter did not have (a thesis paragraph, a roadmap that announces every section, and a synthesis that answers the opening question); the three one-line 'Sources:' notes under the tables are folded into the paragraphs that introduce those tables, and the two opening paragraphs on dating the evidence are merged. These are recorded in decision_log.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Shopify's business with its own definitions (GMV, merchant, MRR): FY2025 revenue of $11.56 billion, about three quarters merchant solutions that the 10-K says are correlated with GMV; Shopify Payments carrying 65.6% of GMV and resold from licensed processors (Stripe, PayPal, Adyen) by Shopify entities that state they are not licensed as a payment institution; one multi-tenant, 'single branch' Rails platform.\n- **Know:** The architecture record by date: the 2019 componentization, the 2020 state (2.8 million lines, 37 components, each depending on over half of the others), Packwerk kept as a gate on new base-layer dependencies, the February 2024 retrospective's admission that domains and boundaries 'do not reflect the way Shopify's code actually functions'; the Storefront Renderer carved out for measured latency behind a verifier; pods (2016–2018) and shop moves by shard balancing (2021), with the shop as sharding key and unit of isolation.\n- **Know:** The landlord's cadence: checkout.liquid and Shopify Scripts withdrawn on published dates (announced February 2023; August 2024, August 2025, 30 June 2026), replaced by sandboxed extension points and Functions; webhooks at-least-once and unordered, retried 8 times over 4 hours and deleted after 8 consecutive failures, with reconciliation jobs expected of the consumer; API versions every three months, each supported for at least twelve months; rate limits per app per store; the agent interface (Storefront MCP, May 2025) replaced by UCP endpoints in 2026, with no EU buyer market on any agentic channel page read at the cut-off.\n- **Know:** Peak figures with their definitions (BFCM 2025: $14.6 billion unaudited GMV, 489 million edge against 117 million app-server requests a minute) and where the evidence stops (today's topology, the checkout queue, merchant counts, Shop Pay claims, Sidekick's availability date).\n- **Believe:** The useful Shopify for a merchant is the landlord's behavior, not the architecture: it changes the platform under everyone on dates it publishes.\n- **Believe:** Shopify's own record undermines the slogan made from it: it did not split its monolith into clean domains; it learned which gate was worth keeping.\n- **Be able to:** List for their own platform which extension points and API versions their apps and connectors depend on, with support ends and owners.\n- **Be able to:** Explain why a webhook-fed integration needs idempotent handling, a reconciliation job and a check that its subscription still exists.\n- **Be able to:** Ask any SaaS vendor for its unit of isolation and whether it can move or restore one tenant alone.\n\n**Audience:** Newcomers to commerce architecture; most of all the engineer or architect who hears 'Shopify kept a monolith' or 'just use Functions' in a review and needs the dated sources. Product managers and leaders whose brand rents a hosted shop platform are the second readers: for them the chapter describes the landlord's behavior (extension points withdrawn on dates, API windows, rate limits, agent channels switched on by default).\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side; roughly what an API, a database and a queue are.\n- Kestrel & Pine, its people, its ten incidents in outline (among them the Black Friday Oversell and the Deprecated Endpoint) and the names of the sixteen failure patterns (among them the Giant's Boots, the Pulled Rug, the Secret Agent and the Forked Platform).\n- From Part I: the thirteen steps of an order, promise and handoff, the three status lines, 'system', 'the shop platform' for the hosted product Kestrel & Pine rents and 'commerce platform' for the whole set of systems, the four scale stages (Starting, Growing, Omnichannel, Group), bounded context, system of record, single writer, events, idempotency and reconciliation, the Waypoint decisions W1 to W8.\n- Glosses already given: PSP, WMS, ERP, iPaaS, EDI, webhook, API call, SKU, channel, marketplace connector, 3PL, order hub and order management system (OMS), availability service, D2C, B2B, PIM, POS.\n- From Parts II to X: available-to-promise; checkout creating the order once; authorization, capture, settlement and payout; app scopes, the app governance rule and the ownership map; API versioning and deprecation; peak planning; agent readiness (W8).\n- From the Part XI introduction: the four cases are read from dated sources researched on 7 November 2026, with documented, widely reported and inferred claims kept apart, and each case ends with what the evidence could not establish.\n\n**Does not yet know:**\n\n- Shopify's reporting definitions: GMV (as Shopify defines it), merchant, MRR, Payments penetration, subscription and merchant solutions.\n- Multi-tenant, single branch, monolith, modular monolith, component, Packwerk, shard, sharding key, pod, Storefront Renderer.\n- Theme, Liquid, headless, Hydrogen, Oxygen, Storefront API, Lighthouse score; checkout extensibility, Shopify Functions, WebAssembly, Shop Pay, PCI DSS, payment orchestration.\n- Scope, OAuth, HMAC signature, rate limit, API version window; BFCM, CDN, edge and app-server requests; MCP, UCP, Catalog, agent profile, trust tier, Sidekick.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a silent integration failure after an outage, the reader explains it from the platform's documented webhook contract and names the merchant-side disciplines that prevent it. *Probe:* A merchant's stock-sync connector, fed by its hosted platform's webhooks, was down for five hours on a Friday night after its host failed. On Monday the stock on a marketplace is wrong and the connector logs no errors. Using only this chapter: what probably happened, and what should the merchant have had in place? | `custom` | cold_reader | major |\n| AC-2 | The reader separates the Shopify practices a renting merchant should adopt from the machinery it should not copy, with the reason. *Probe:* Using only this chapter: which Shopify practices should a merchant that rents a hosted platform adopt, which should it not, and why? | `custom` | cold_reader | major |\n| AC-3 | The reader can correct the slogan 'Shopify modularized its monolith' from the chapter's sources. *Probe:* A colleague says Shopify proves that a monolith can be split into clean domain modules without microservices. Using only this chapter: what does Shopify's record say? | `custom` | cold_reader | minor |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict the chapter's sections and the kind of evidence it uses. *Probe:* After reading only the introduction: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as sections[].paragraphs[]. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** What does Shopify's dated public record show about running millions of shops on one platform, and what should a merchant that rents a hosted platform do about it?\n\n> **Claim:** Shopify's dated record shows one codebase, deployed as one unit and isolated by shop into database pods, serving millions of shops for a vendor whose revenue moves with the shops' sales and which changes the platform under every merchant on published dates, agent interface included. A renting merchant should plan for those dates (pin connectors to dated API versions, reconcile webhook-fed flows, track extension-point sunsets), not copy pods, shard moves or edge rendering.\n\n**Disputed by:** The view that renting a hosted platform hands the architecture to the vendor: the platform's scale and engineering make its integrations reliable and its interfaces stable, so the merchant need only choose apps. A related reading, which the claim also rejects, takes Shopify's lesson for others to be a modular monolith with clean domain boundaries.\n\n**So what:** A merchant on any hosted platform budgets for the vendor's change cadence. Kestrel & Pine takes four lessons: (1) a reconciliation job for every integration (W5); (2) every connector pinned to a dated API version with its support end on the ownership map, after the Deprecated Endpoint's two days of stale stock on bol (W5); (3) nothing customized in checkout that the platform could withdraw, under the app governance rule approved alongside Waypoint; (4) agent readiness through product, availability and order-status APIs and no channel-specific agent build (W8). It rents the pods, renderer and checkout, which is W4.\n\n**How and why:** Three quarters of Shopify's FY2025 revenue is merchant solutions that move with merchants' sales, so Shopify protects its own revenue by keeping checkout under its control, changing it on its own schedule while every merchant absorbs the change (the chapter's labeled inference). A single-branch, multi-tenant platform ships every change to every merchant at once, so it keeps checkout upgrade-safe by replacing free-form access with sandboxed extension points and retiring the old ones on announced dates. Its webhook contract promises at-least-once, unordered delivery and deletes a subscription after eight consecutive failures, so a consumer without idempotency and reconciliation loses facts without logging an error. Pods, shard moves and an edge renderer answer the load of millions of shops, which one merchant does not have. The same cadence reached the agent interface: the Storefront MCP tools of May 2025 were replaced by UCP endpoints within a year, so a channel-specific agent build would already have needed rebuilding.\n\n**Supporting claims**\n\n- **S1** — Shopify's revenue moves with its merchants' sales: in FY2025 three quarters was merchant solutions that the 10-K calls correlated with GMV, two thirds of GMV ran through Shopify Payments, which Shopify resells from licensed processors, and the whole runs as one multi-tenant, single-branch platform, so checkout and payment are its protected paths and every change ships to every merchant at once.\n- **S2** — Shopify kept one codebase deployed as one unit; its 2019 to 2024 posts record that domain boundaries did not match how the code works, that durable value came from file ownership and one gate against new base-layer dependencies, and that the one hot path carved out, the Storefront Renderer, was split for measured latency behind a verifier.\n- **S3** — The shop is Shopify's sharding key and unit of isolation: shops live in pods with their own datastores and are moved whole, machinery for millions of shops that a merchant does not copy but turns into a question for every vendor: what is your unit of isolation, and can you move or restore my tenant alone?\n- **S4** — The platform sets the terms every merchant and integrator works under and changes them on published dates: checkout's free-form access withdrawn from 2023 to 2026 for sandboxed extension points, webhooks that are at-least-once, unordered and deleted after eight consecutive failures, API versions supported for at least twelve months, rate limits per app per store, and an agent interface replaced within a year.\n- **S5** — Read with their definitions, Shopify's practices divide into disciplines that transfer to a merchant scaled down (pinning, reconciliation, boundary gates, shadow comparison, load tests on the money paths, isolation questions) and machinery only millions of shops need; Kestrel & Pine takes four lessons that each match a Waypoint decision already made and changes none of its architecture.\n- **S6** — The case rests on dated sources of different ages and kinds, kept apart as documented, widely reported or inferred, and the public record stops short of Shopify's current topology, checkout queue, merchant counts, Shop Pay claims and agent-channel terms.\n\n## Role in the part\n\nGives the part a hosted platform's own record, separating the landlord's change cadence and integration contract that a renting merchant must plan for from the machinery only millions of shops need. Supports P11-1, P11-5 of part `part-11`.\n\n## Flow\n\n**Pattern:** `grouping` (also `large_to_small` in business to inventory: the business that pays for the platform, then the architecture inside it, then the parts of the order it runs; `chronological` in monolith, pods, checkout and ai: each section's evidence in date order)\n\nSections are grouped by subject, each with its own dated evidence, because the reader's question is what the record supports and the age of the evidence differs by subject. 'How to Read This Case' comes first because every later claim is marked by its rules. The business comes before the architecture because it explains the priorities (checkout and payment protected, every change shipped to everyone) the later sections rely on. The monolith precedes the pods because the pods split the data under the one codebase. The parts of the order follow in the order's steps (pages, checkout, payment, stock), then the contract that every app and integration works under, which needs those parts named; peak days follow the rate limits they stress, and the agent surface comes last of the evidence because its argument for adapters needs the cadence the checkout and contract sections have already shown. 'What Transfers' needs all of the evidence, and 'Where the Evidence Stops' bounds it before the take-away. Putting the transfer table first would assert lessons before their evidence; putting the contract before checkout would leave the withdrawn extension points without their timeline.\n\n## Introduction\n\n**Hook** (`intriguing_example`): A merchant that rents a hosted shop platform needs to know which work the platform takes on and which work its own team will still operate; Shopify is the kind of platform Kestrel & Pine rents, and the useful question is what the vendor's choices make easier or harder for the merchant's integrations and operations.\n\n**Bridge:** The Part XI introduction told the reader to begin with the platform for merchants, the kind Kestrel & Pine rents, read for modularity, tenant isolation, checkout extensions and integration contracts. → Shopify's dated record, from its 10-K to its agent surface, read for which work the landlord takes on and which practices a renting merchant adopts.\n\n**Thesis statement** (KEY POINTS callout and paragraph p04): Shopify's dated record shows one codebase, deployed as one unit and split by shop into isolated database pods, serving millions of shops for a vendor whose revenue moves with those shops' sales and which changes the platform under every merchant on published dates, agent interface included. A renting merchant should plan for those dates (pin connectors to dated API versions, reconcile webhook-fed flows, track extension-point sunsets) and not copy pods, shard moves or edge rendering.\n\n**Roadmap** (Paragraph p05):\n\n- Say how the evidence is read. *Kept in:* method.\n- Follow the money through the business. *Kept in:* business.\n- The architecture: the monolith that stayed and the shop as the unit of isolation. *Kept in:* monolith, pods.\n- The parts of the order the platform runs: storefront, checkout, payment, inventory states. *Kept in:* storefront, checkout, payments, inventory.\n- The contract apps work under. *Kept in:* ecosystem.\n- Peak days and the agent surface. *Kept in:* peak, ai.\n- What transfers, including what Kestrel & Pine takes, and where the evidence stops. *Kept in:* transfers, evidence.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A merchant that rents a hosted shop platform needs to know which work the platform takes on and which stays its own; Shopify is the kind of platform Kestrel & Pine rents, and for such a merchant the vendor is in effect a landlord, so the useful question is what the vendor's choices make easier or harder for the merchant. | example: Shopify as an instance of the hosted, shared platform type the book's fictional merchant rents. |  |\n| p02 | context | The evidence comes in two kinds and ages: business figures from the FY2025 annual filing and the quarter to September 2026, and architecture accounts from 2018 (pods), 2019 (components), 2021 (shard balancing) and a 2024 retrospective, which describe decisions made under earlier constraints, not today's design, so each is dated. | fact: FY2025 10-K and the Q3 2026 filings; engineering posts of 2018, 2019, 2021 and February 2024. | `elaboration`: Shopify's published accounts and the question of what they mean for the merchant. → What those accounts are, how old each is, and why the chapter dates them. |\n| p03 | context | In the order's journey a jacket purchase needs pages built from product records, checkout, payment, stock and messages to the warehouse; Shopify documents a counterpart for each, and the chapters that explain those concepts are linked rather than re-taught. | example: The jacket order's steps and the linked chapters (inventory-and-availability, storefront-architecture, cart-and-checkout, commerce-payments, api-contracts-and-versioning, extensibility-and-app-ecosystems). | `place`: The dated evidence the chapter will use. → Where in the order's journey that evidence applies. |\n| p04 | claim | The chapter's claim: Shopify's dated record shows one codebase, deployed as one unit and split by shop into isolated database groups called pods, serving millions of shops for a vendor whose revenue moves with those shops' sales and which changes the platform under every merchant on dates it publishes, its agent interface included; a renting merchant should plan for those dates (pin connectors to dated API versions, reconcile webhook-fed flows, track extension-point sunsets) and not copy pods, shard moves or edge rendering. |  | `cause_effect`: The counterparts Shopify documents for each step of the order. → What the record as a whole shows and what a renting merchant should do about it. |\n| p05 | transition | The roadmap: after a note on reading the evidence, the chapter covers the business, the architecture (the monolith that stayed, the shop as the unit of isolation), the parts of the order the platform runs (storefront, checkout, payment, inventory states), the contract apps work under, peak days and the agent surface, and ends with what transfers, including what Kestrel & Pine takes, and where the evidence stops; its evidence is Shopify's filings, engineering posts, documentation and changelog. |  | `sequence`: The chapter's claim. → The order in which the chapter tests it and the kind of evidence it uses. |\n\n## Sections\n\n### How to Read This Case\n\n**Controlling idea** (`context`, id `method`): Company claims are marked documented, widely reported or inferred, older evidence keeps its age, and the research stops at 7 November 2026 with named gaps.\n\n**Advances the thesis** (S6): Sets the rules by which every later claim about Shopify is read and bounded.\n\n**Transition in:** `sequence`: The roadmap's first step. → The rules for reading the evidence.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | definition | Every company claim is marked as documented, widely reported through secondary sources, or an explicitly labeled inference, and older architecture evidence keeps its age because it may describe a replaced system. |  |  |\n| p07 | context | The research stops at 7 November 2026, and the record has seven gaps, all listed in the last section. | fact: The research cut-off and the list of unverified areas. | `elaboration`: The three kinds of claim and the age of evidence. → The cut-off date and where the gaps are listed. |\n\n### The Business: Where the Money Comes From\n\n**Controlling idea** (`evidence`, id `business`): Read with Shopify's own definitions, three quarters of its revenue moves with what merchants sell, two thirds of which is paid through Shopify Payments, and one multi-tenant, single-branch platform carries it all.\n\n**Advances the thesis** (S1): Establishes the business shape that explains why checkout is protected and why every change reaches every merchant.\n\n**Transition in:** `sequence`: How claims are read and dated. → The first subject: where Shopify's money comes from.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): Definitions and the figures first, then what the revenue lines mean with the labeled inference, then the 10-K's technology statement, which the later sections rely on for 'multi-tenant' and 'single branch'.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | evidence | Shopify's financial measures must be read with its own definitions (GMV counts facilitated orders net of refunds and is not revenue; a merchant is a unique paying shop; MRR is the subscription run-rate), and on those definitions the FY2025 and Q3 2026 figures show GMV, revenue, the subscription and merchant lines, Payments penetration, MRR, merchants, apps and employees. | table: FY2025, FY2024 and Q3 2026 figures: GMV $378.4 billion (+29%), revenue $11.56 billion (+30%), subscription solutions $2.8 billion (24%), merchant solutions $8.8 billion (76%), Payments penetration 65.6%, MRR $205 million, 'millions' of merchants, 'more than 21,000' apps, about 7,600 employees; Q3 2026 GMV $119.1 billion, revenue $3.74 billion, penetration 68%. |  |\n| p09 | analysis | Three quarters of revenue is merchant solutions that the 10-K says are correlated with GMV, two thirds of GMV is paid through Shopify Payments, small merchants dominate the plan count while Plus generates most GMV, and Payments rests on two suppliers; read together, this makes Shopify a payments-and-platform business whose checkout and payment flow are its most protected paths. | quotation: 'directionally correlated with the level of GMV'; the plan-mix sentences; 'we currently rely on two suppliers', Stripe and PayPal, on twelve-month agreements.; reasoning: > **INFERENCE, NOT DOCUMENTED:** callout (the author's labeled reasoning): a payments-and-platform business whose subscription is the entry ticket; checkout and payment protected as the revenue paths; one single-branch codebase serving small shops that need defaults and large ones that need extension points, hence Plus-only advanced checkout customization. | `elaboration`: The revenue lines in the table. → What each line contains and what the mix means. |\n| p10 | definition | The 10-K describes the technology as one multi-tenant cloud system built largely on Ruby on Rails and run as 'single branch' software on third-party cloud services, so many merchants share one running system and every change ships to all of them. | quotation: 'a multi-tenant cloud-based system'; Rails as 'the technology that powers much of the Shopify platform'; ''single branch' software, which means that all of our merchants use the latest version of Shopify'; Google Cloud Platform. | `additional_support`: The business shape. → The 10-K's one-paragraph description of the technology that carries it. |\n\n### The Monolith That Stayed: 2019 to 2024\n\n**Controlling idea** (`evidence`, id `monolith`): Shopify kept one deployment unit from 2019 to 2024; its own posts show domain boundaries that did not hold, durable value from ownership and one gate, and a single carve-out made for latency.\n\n**Advances the thesis** (S2): Gives the dated record behind 'Shopify kept a monolith' and corrects the slogan 'Shopify modularized its monolith'.\n\n**Transition in:** `cause_effect`: One single-branch platform serving millions of shops. → How Shopify organized the codebase behind it.\n\n**Order of paragraphs** (`chronological`): The posts in date order (2019, 2020, 2020, 2024) so the reader sees the plan, its state, the tool, and the retrospective's admissions in the order Shopify learned them; the labeled reading of the whole follows the last admission, and the Storefront Renderer, the one exception to 'one deployment unit', comes last.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p11 | definition | A monolith is one deployable application holding all the shop's logic and a modular monolith keeps one deployment but divides the code into named modules with enforced boundaries; Shopify's account of choosing the second over services runs from 2019 to 2024 and is more candid than the slogan. |  |  |\n| p12 | evidence | In February 2019 Shopify rejected microservices for their costs and instead labeled about 6,000 classes by business domain, aiming at components with clean interfaces and exclusive data ownership; the isolation let it replace a legacy tax engine (evidence age: seven years). | quotation: 'one of the largest Ruby on Rails codebases in existence'; 'the downsides of the monolith were outweighing the benefits'; the listed costs of microservices; 'a clean, dedicated interface', 'exclusive ownership of its associated data'. | `time`: The two kinds of monolith. → Shopify's 2019 choice and plan. |\n| p13 | evidence | By September 2020 the core had 2.8 million lines and 37 components, each depending on over half of the others, but ownership had paid off: every file had a stewardship team, exceptions went to the owning component and upgrades were spread across teams (evidence age: six years). | statistic: 'over 2.8 million lines of Ruby code', 37 components, a 400-member Architecture Guild; 'every component depended on over half of all the other components'; 'every file has a stewardship team assigned'. | `time`: The 2019 plan. → Its state a year and a half later. |\n| p14 | description | Packwerk, open-sourced the same month, is the tool that survived: it checks references between packages and records existing violations so teams stop new ones without fixing everything at once. | quotation: 'stop new ones without fixing everything at once'. | `additional_support`: The 2020 state of the components. → The tool released alongside it. |\n| p15 | evidence | The February 2024 retrospective, the latest first-party architecture account, records the tool's limits (privacy checks removed in version 3.0, common ways of loading code invisible to it, many months to isolate one base package, problems found faster than teams could fix them) and says Shopify kept it only because it holds the line against new dependencies at the base layer. | quotation: 'were removed from Packwerk with the release of version 3.0'; 'untracked and invisible to the tool'; 'took many months of hard work'; 'vastly outpaced'; 'we have discussed removing Packwerk from our monolith'; 'has provided value in holding the line against new dependencies at the base layer'. | `time`: Packwerk as released in 2020. → What Shopify said about it four years later, and why it stayed. |\n| p16 | analysis | The retrospective's central admission is that domains and their boundaries do not reflect how Shopify's code functions, so components were demoted to organizational groupings; the honest reading of 2019 to 2024 is that file ownership and one cheap gate paid off while enforced domain boundaries did not, inside one deployment unit throughout. | quotation: 'domains and the boundaries between them do not reflect the way Shopify's code actually functions in practice'; 'top-level organizational tools for grouping one or more packages'.; reasoning: > **INFERENCE, NOT DOCUMENTED:** callout (the author's labeled reasoning): not 'Shopify modularized its monolith' but seven years of learning that boundaries drawn on an organization chart do not match runtime coupling; commerce-architecture-styles draws the general lesson. | `emphasis`: The retrospective's account of the tool and why it was kept. → Its admission about the domains themselves, and the reading of the whole period. |\n| p17 | example | The one documented carve-out is the Storefront Renderer, rewritten from 2019 because storefront code has stricter performance needs, reading from replicas behind three cache layers and rolled out with a verifier comparing old and new responses and circuit breakers falling back to the old path: a split made for latency, not team autonomy (evidence age: six years). | fact: Rewrite begun January 2019; 'always reads from dedicated read replicas'; three cache layers; '4x to 6x faster' (August 2020); verifier on live traffic; circuit breakers. | `contrast`: One deployment unit kept throughout. → The one documented exception and why it was made. |\n\n### The Shop as the Unit of Isolation: Pods and Moves\n\n**Controlling idea** (`evidence`, id `pods`): Shopify shards by shop and isolates shops in pods that are moved whole; for a merchant this is not machinery to copy but a question to ask every vendor.\n\n**Advances the thesis** (S3): Documents the shop as the unit of isolation and turns it into the merchant's question to vendors.\n\n**Transition in:** `contrast`: One codebase and one deployment unit. → How the data under that codebase is split and isolated.\n\n**Order of paragraphs** (`chronological`): 2018 pods, 2021 moves, then the later datastore claims that are often misquoted with the labeled reading, then what the merchant does with it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | evidence | Shopify sharded by shop in 2015 when the database could no longer grow on one server, and because one failed shard could then take down the platform it reorganized in 2016 into pods, sets of shops on fully isolated datastores, served by shared workers that talk to one pod at a time (evidence age: eight years). | quotation: 'could no longer be scaled by buying a bigger server'; 'A pod consists of a set of shops that live on a fully isolated set of datastores'; 'all shared resources can only ever communicate to a single pod at a time'; a Pod Mover 'in a minute'. |  |\n| p19 | process | The 2021 shard-balancing post shows the mechanism that persisted: shop_id as the sharding key, a routing table from domains to pods, a three-phase move (Ghostferry, a Shopify copying tool, copies rows while the shop stays live) with downtime only at a brief cutover, and placement by measured load and simulation that narrowed the spread between shards from almost four times to about two (evidence age: five years). | quotation: 'we can attach a shop_id to all shop-owned tables and have it serve as a sharding key'; Ghostferry copy and replay, cutover lock, routing update; 'The only opportunity for downtime is during the cutover'; 'almost four times' to 'closer to two times'.; figure: Figure 1: the shop as sharding key and the pod as unit of isolation (routing, containment, moves). | `time`: Pods as designed in 2016-2018. → How a shop is moved between them, as documented in 2021. |\n| p20 | analysis | Two later datastore claims are often misread as about the core platform: the 2024 Vitess post concerns only the Shop app, and a vendor's 2026 blog about Shopify's database is unconfirmed by Shopify; read with the 2019 and 2021 posts, the pod remains the documented unit of isolation, coexisting with Google Cloud to at least 2021,  | quotation: 'Shop app has different properties than the rest of Shopify' (January 2024); a database vendor's February 2026 blog recapping a talk.; reasoning: > **INFERENCE, NOT DOCUMENTED:** callout (the author's labeled reasoning): the pod as unit of isolation, failure and recovery; whether the topology survived the move to Google Cloud is undocumented; a 2019 backup post and the 2021 post both describe shards on Google Cloud. | `contrast`: The documented 2018 and 2021 mechanism. → Later claims that go beyond the documents. |\n| p21 | recommendation | For a merchant none of this is machinery to copy; it is a question to ask any SaaS vendor from the Growing stage: what is your unit of isolation, and can you move or restore my tenant alone? |  | `cause_effect`: The shop as Shopify's unit of isolation. → What a merchant does with that fact. |\n\n### Storefront Delivery\n\n**Controlling idea** (`description`, id `storefront`): Shopify offers three rendering models over one shared cart, checkout and Storefront API, and it polices performance at submission, which for an app-heavy themed store makes the app gate the relevant fact.\n\n**Advances the thesis** (S4): Shows the platform setting the terms (shared checkout, performance gates on themes and apps) under which a merchant builds its pages.\n\n**Transition in:** `sequence`: The architecture inside the platform. → The first part of the order the merchant sees: the pages.\n\n**Order of paragraphs** (`large_to_small`): What a rendering model decides, the three models, then the specific performance gates and what they imply.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p22 | definition | A storefront's rendering model decides which software turns product and cart data into pages and who maintains that software. |  |  |\n| p23 | description | Shopify offers three rendering models side by side: themes in its template language Liquid rendered by the Storefront Renderer (modular since Online Store 2.0 in 2021), Hydrogen hosted on Oxygen as its headless toolkit, and any framework against the GraphQL-only Storefront API with three access modes and limits aimed at bots, not buyers. | quotation: Online Store 2.0 'fully modular' (Unite, June 2021); Hydrogen 'our modern React-based framework' (2022) and 'Shopify's headless toolkit' (2026); the Storefront API 'is available only in GraphQL'; 'requests from real buyers aren't subject to a fixed request-per-minute limit'; bots limited 'most strictly when unsigned'. | `elaboration`: What a rendering model decides. → The three models Shopify offers. |\n| p24 | analysis | The performance gates are specific: a minimum Lighthouse score of 60 for Theme Store themes, at most ten points lost per public app, and an admin report that names theme code and apps as causes of slowness; under all three models the cart, checkout and Storefront API are the shared substrate, and the app gate is the fact that matters for Kestrel & Pine's themed storefront with 41 apps. | quotation: 'a minimum average Lighthouse performance score of 60'; 'shouldn't reduce Lighthouse performance scores by more than 10 points'; 'some features can slow down your site'.; reasoning: > **INFERENCE, NOT DOCUMENTED:** callout (the author's labeled reasoning): a headless storefront still hands off to Shopify's checkout; apps are the usual cause of slow stores and are policed at submission because they cannot be policed after installation; storefront-architecture treats the headless decision. | `elaboration`: The three rendering models. → The performance rules that apply across them. |\n\n### Checkout: Freedom Withdrawn on a Schedule\n\n**Controlling idea** (`evidence`, id `checkout`): From 2021 to 2026 Shopify withdrew free-form checkout customization on published dates and replaced it with sandboxed extension points under hard limits, trading merchant freedom for an upgrade-safe checkout it can change under everyone at once.\n\n**Advances the thesis** (S4, S1): The dated reference case for 'the platform will withdraw an extension point'; checkout is where single branch and the revenue model meet.\n\n**Transition in:** `sequence`: The pages, which hand off to the shared checkout. → The checkout itself and how its rules changed.\n\n**Order of paragraphs** (`chronological`): The timeline first, then what replaced the freedom with the labeled reading of the arc.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p25 | evidence | Checkout is where single branch and the revenue model meet, and its history from June 2021 to August 2026 is a timeline of freedoms withdrawn on published dates, from checkout.liquid to Shopify Scripts and script tags. | table: Unite 29 June 2021; Winter '23 (9 February 2023); the 13 February 2023 changelog; checkout.liquid stopped 13 August 2024 and 28 August 2025; Scripts editing ends 15 April 2026 and execution 30 June 2026; non-Plus script tags 26 August 2026. |  |\n| p26 | analysis | What replaced the freedom is checkout extensibility: fixed slots for app interface extensions, a branding API, web pixels, and Shopify Functions, backend logic compiled to WebAssembly and invoked by the platform in checkout order under hard limits, with custom Functions and advanced customization only on Plus; read as a whole, the arc traded merchant freedom for an upgrade-safe, PCI-contained checkout Shopify can change under everyone at once, the reference case for planning for withdrawn extension points. | quotation: Functions 'allow developers to customize the backend logic of Shopify'; a 256 KiB module, 10 MiB of memory, about 11 million instructions for carts up to 200 lines; 'advanced checkout customization features are available only on the Shopify Plus plan'.; reasoning: > **INFERENCE, NOT DOCUMENTED:** callout (the author's labeled reasoning): free-form access withdrawn over three and a half years with dated deadlines, replaced by sandboxed points; the Forked Platform made impossible by design, the Pulled Rug done with notice.; figure: Figure 2: an open checkout workshop, then a sealed console with fixed plug-in slots. | `problem_solution`: Free-form access withdrawn. → What replaced it, and the reading of the whole arc. |\n\n### Payments: Orchestration, Not a License\n\n**Controlling idea** (`evidence`, id `payments`): Shopify earns from payments without being a payment institution: it owns the checkout, the Shop Pay wallet and the merchant contract and resells licensed processing.\n\n**Advances the thesis** (S1): Explains how two thirds of GMV runs through Shopify Payments, with Shop Pay in front, while the 10-K names two suppliers.\n\n**Transition in:** `sequence`: The checkout and Shop Pay, included with Shopify Payments. → The payment behind the checkout.\n\n**Order of paragraphs** (`large_to_small`): What orchestration is, then the terms that show who holds the license, then the wallet the buyer sees in front of it with the labeled reading; the wallet comes after the terms because it is 'included as part of Shopify Payments', and the reading needs both.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p27 | definition | Payment orchestration means the platform sends the checkout's payments through separate providers that move the money. |  |  |\n| p28 | evidence | Shopify Payments is the clearest public example of a platform that earns from payments without being a payment institution: its European terms state that no Shopify entity is licensed as a bank or payment institution and name Stripe, PayPal and Adyen as processors. | quotation: 'None of the Shopify entities listed above are licensed as a bank, payment institution, or money services business'; Shopify International Limited (Ireland); Stripe Payments Europe, PayPal (Europe), Adyen N.V. for the Netherlands, Belgium and Germany; 41 countries. | `example`: What payment orchestration is. → Shopify Payments as the clearest public example. |\n| p29 | analysis | Shop Pay, the accelerated checkout included with Shopify Payments, is the wallet the buyer sees in front of that processing, with vendor conversion claims from an unpublished study and a documented 32% of orders over the 2025 Black Friday weekend; read together, Shopify owns the checkout, the wallet and the merchant contract and resells licensed processing, so whoever owns the checkout owns the payment revenue, licensed or not. | quotation: 'an accelerated checkout option', 'included as part of Shopify Payments'; 'as much as 50% better conversion compared to guest checkout' (2023 study, unpublished); 32% of orders, BFCM 2025.; reasoning: > **INFERENCE, NOT DOCUMENTED:** callout (the author's labeled reasoning): orchestration over licensed processors explains the 10-K's two-supplier concentration risk; commerce-payments owns the mechanics. | `elaboration`: The licensed processors behind Shopify Payments. → The wallet the buyer sees in front of them, and the reading of the whole. |\n\n### Inventory States, Briefly\n\n**Controlling idea** (`description`, id `inventory`): Shopify records stock per location in exclusive states, added in steps from 2023 to 2026, but holds no B2B allocation and computes no cross-location available-to-promise, which belongs beside the platform.\n\n**Advances the thesis** (S5): Marks where the platform's work ends and the merchant's begins, which is why W1 buys an availability service beside it.\n\n**Transition in:** `sequence`: Checkout and payment. → The stock the order draws on.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p30 | description | Shopify's inventory model holds stock per location in exclusive states (available, committed, reserved, damaged, safety stock, quality control, on hand as their sum, incoming apart), added in steps through 5 August 2026, but holds no per-customer B2B allocation and computes no cross-location available-to-promise, which is why Kestrel & Pine's W1 buys an availability service beside the platform. | quotation: available 'the inventory that a merchant can sell'; committed 'set aside'; safety_stock 'to help guard against overselling'; on_hand 'the total number of units that are physically at a location'; states added February 2023, August 2023 and 5 August 2026. |  |\n\n### The Ecosystem: Apps, Scopes, Webhooks and Versions\n\n**Controlling idea** (`evidence`, id `ecosystem`): Shopify's documentation states the contract every app and integration works under (scopes, webhooks that may be lost, duplicated or reordered, dated API versions and rate limits), and three merchant rules follow from it.\n\n**Advances the thesis** (S4): Gives the documented contract behind pinning, idempotency, reconciliation and subscription checks.\n\n**Transition in:** `sequence`: The parts of the order the platform runs. → The contract under which apps and integrations reach those parts.\n\n**Order of paragraphs** (`grouping`): Why apps are part of the merchant's architecture, then the App Store's business and governance, then webhooks, then versions and rate limits with the three rules that follow; webhooks before versions because the first rule (reconcile) is the one the reader needs first.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p31 | claim | Third-party apps add behavior to the shared platform through APIs and notifications, so their permissions, delivery guarantees and upgrade obligations are part of the merchant's architecture. |  |  |\n| p32 | evidence | The App Store is a business (over 21,000 apps, 0% revenue share on the first $1 million and 15% above) and a governance regime: OAuth before anything else, no apps on APIs deprecated within 90 days, three privacy compliance webhooks, and scopes the merchant approves at install. | quotation: 'immediately authorize using OAuth before any other steps occur'; 'apps using APIs that will be deprecated within 90 days can't be submitted'; 'your app will be rejected'; 'which store data your app can read and write'; read_orders covering 'orders created within the last 60 days'. | `elaboration`: Apps as part of the merchant's architecture. → The App Store's business and governance. |\n| p33 | evidence | Webhooks are the integration contract, and Shopify's own words say delivery is not guaranteed or ordered, duplicates must be ignored by id, reconciliation jobs are expected, and a subscription is deleted after eight consecutive failures over four hours of retries. | quotation: 'Webhook delivery isn't always guaranteed'; 'Shopify doesn't guarantee ordering within a topic...'; 'ignore duplicate deliveries using X-Shopify-Webhook-Id'; 'use reconciliation jobs...'; 'it retries 8 times over the next 4 hours'; 'after 8 consecutive failures, the subscription is automatically deleted'; HMAC signature; 13 billion webhooks in 2021. | `additional_support`: Access to data through scopes. → How data changes reach an app: webhooks. |\n| p34 | analysis | API versions are dated (a new one every three months, each supported at least twelve months, the REST Admin API legacy since October 2024) and rate limits are per app per store by plan; three rules follow: idempotent consumers with reconciliation (W5), a check that the subscription still exists, and rate limits treated as a tenancy budget on a peak day. | quotation: 'Shopify releases a new API version every three months', 'supported for a minimum of 12 months', 'falls forward'; 'a legacy API as of October 1, 2024'; 100, 1,000 and 2,000 points a second; 'Shopify might temporarily reduce API rate limits to protect platform stability'.; figure: Figure 3: the documented integration contract (scopes, rate limits, at-least-once unordered webhooks, reconciliation, dated versions).; reasoning: > **INFERENCE, NOT DOCUMENTED:** callout (the author's labeled reasoning): idempotency and reconciliation are W5 in Shopify's own words; a connector down for five hours on a Friday night has no subscription on Saturday morning; a polling connector can starve another app. | `additional_support`: The webhook contract. → Versions and rate limits, and the rules that follow from the whole contract. |\n\n### Peak Days With Definitions\n\n**Controlling idea** (`evidence`, id `peak`): Shopify's Black Friday figures are useful only with their caveats, and its documented preparation, scaled down, gives a merchant a program for its own connectors, ERP and WMS.\n\n**Advances the thesis** (S5): Separates the transferable peak practices from figures and machinery at Shopify's scale.\n\n**Transition in:** `cause_effect`: Rate limits as a peak-day constraint. → Shopify's own peak days and how it prepares for them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p35 | evidence | Shopify's Black Friday-Cyber Monday figures for 2023 to 2025 are unaudited, not directly comparable across years and report no order count, and must be read with those caveats. | table: BFCM 2023-2025: sales $9.3, $11.5 and $14.6 billion; peak sales per minute $4.2, $4.6 and $5.1 million; peak load; database queries and writes; Shop Pay; merchants with their best day. |  |\n| p36 | analysis | Shopify's preparation is documented for 2023 (full-scale tests with part of the traffic bypassing the CDN and an abort switch) and 2025 (capacity planning from March, game days on the money paths, five scale tests that exposed errors and rate-limit paths), with the checkout queue documented only in 2018; scaled down, the transferable practices are testing at forecast load with caches bypassed, rehearsing failure on the money paths and decoupling payment from order creation. | quotation: 'full-scale approach'; 'bypass the CDN for a portion of the traffic'; 'started in March with capacity planning'; 'critical journeys'; '146 million requests per minute and 80,000+ checkouts per minute'; 'core operations threw errors and checkout queues backed up'; 2018: 'processing payments at checkout happens separately from creating orders'.; reasoning: > **INFERENCE, NOT DOCUMENTED:** callout (the author's labeled reasoning): edge requests about four times app-server requests; a platform peak-to-average ratio of about two against a single merchant's 41-times spike; the practices scaled down to connectors, ERP and WMS. | `elaboration`: The peak figures and their caveats. → How Shopify prepares for them and what that means for a merchant. |\n\n### AI and the Agent Surface: Rebuilt Within a Year\n\n**Controlling idea** (`evidence`, id `ai`): Shopify's admin assistant and its agent-facing interfaces are different uses; the agent interface was replaced within a year, and no EU buyer market is in scope.\n\n**Advances the thesis** (S4): The agent interface is the newest example of the platform changing under every merchant on published dates.\n\n**Transition in:** `sequence`: The integration contract and peak days. → The newest surface on the platform: AI.\n\n**Order of paragraphs** (`chronological`): Sidekick (2023-2026), then the agent interface in date order, then its geography, which is what a European merchant needs and closes the section.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p37 | description | Shopify's AI for merchants and its interfaces for outside agents are different uses with different permissions; Sidekick, the admin assistant announced in 2023, runs reports and proposes changes with the merchant's approval, and its general-availability date and growth figure are unverified or vendor claims. | fact: Sidekick announced July 2023; 21 May 2025 capabilities 'with the merchant's approval'; help page (accessed November 2026); 4.2-times growth in daily sessions (Fall 2026 edition, vendor figure). |  |\n| p38 | evidence | The agent-facing side is the clearest dated example of protocol churn: the Storefront MCP server of May 2025, Agentic Storefronts for every merchant in December 2025, the Universal Commerce Protocol and Agentic plan in January 2026, and by November 2026 the MCP catalog and cart tools removed in favor of UCP endpoints with agent profiles and trust tiers. | quotation: 'available to every merchant' (10 December 2025); 'no monthly fee', 'from 1.9% + €0.25' (11 January 2026); 'were removed', UCP 'now provides these capabilities'; 'requires authenticated or signed requests'; 'higher trust tiers unlock broader access, including direct checkout completion'; caching at most fifteen minutes; 'endpoint URLs might change'. | `contrast`: The admin assistant, which proposes. → The interfaces for outside agents, which can buy. |\n| p39 | analysis | The geography is the fact a European merchant needs: the ChatGPT channel requires selling to US customers, Google's direct checkout serves only the US, Canada and Australia, and no EU buyer market is in scope on any page read at the cut-off, which makes a platform that replaced its agent interface within a year the strongest argument for adapters over one internal API. | quotation: 'your store must sell to customers in the United States'; OpenAI's March 2026 retreat from in-chat checkout; Google channel limits. | `cause_effect`: The interface's churn. → Where it is available and what that means for a European merchant. |\n\n### What Transfers to a Merchant, and What Does Not\n\n**Controlling idea** (`synthesis`, id `transfers`): Read with their evidence, Shopify's practices split into disciplines a merchant adopts scaled down and machinery only Shopify needs; Kestrel & Pine takes four lessons already in Waypoint and none of the architecture.\n\n**Advances the thesis** (S5): Draws the case's lessons for a renting merchant and ties them to Waypoint.\n\n**Transition in:** `conclusion_summary`: The dated record across business, architecture, checkout, the contract, peak and AI. → Which of it transfers to a merchant.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p40 | comparison | The author's synthesis, row by row with its dated evidence, is that the disciplines transfer to a merchant: the shop as unit of isolation as a question to vendors, gates on new boundary violations, carving hot paths behind a verifier, dated versions, reconciled webhooks, sandboxed extension points, rate-limit budgets and scaled-down load tests. | table: Nine rows: Shopify practice, evidence, transfers or not, and how. |  |\n| p41 | claim | Only Shopify needs the rest (pods balanced by simulation, a worldwide edge renderer, an observability platform at 100 million events a second, a readiness program from March); copying that is the Giant's Boots, while copying the disciplines and reading the vendor's changelog gives the useful part. | fact: An observability platform ingesting 100 million events a second at peak (a vendor's account of a 2026 talk). | `contrast`: The practices that transfer. → The machinery that does not. |\n| p42 | recommendation | Kestrel & Pine takes four lessons, each already in Waypoint: idempotent, reconciled integrations (W5); connectors pinned to dated API versions after the Deprecated Endpoint's two days of stale stock on bol (W5); nothing customized in checkout that the platform could withdraw (the app governance rule); agent readiness through APIs and no channel-specific build (W8); the architecture itself it rents, which is W4, stay and surround. | scenario: W4, W5, W8, the Deprecated Endpoint (two days of stale stock on bol), the app governance rule.; figure: Figure 4: a landlord with a calendar of published dates and a small shop running inventory, pin, test and reconcile. | `example`: What transfers in general. → What the book's merchant takes. |\n\n### Where the Evidence Stops\n\n**Controlling idea** (`context`, id `evidence`): The public record does not establish today's topology, the checkout queue, merchant and app counts beyond Shopify's words, Shop Pay's claims, Sidekick's and the agent channels' terms, the new database, or Scripts' earlier deadline.\n\n**Advances the thesis** (S6): Bounds every lesson by what the dated record cannot show.\n\n**Transition in:** `contrast`: What the merchant takes from the record. → What the record does not establish.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p43 | context (list) | Seven areas lie beyond the public evidence: today's topology, the checkout queue, merchant and app counts, Shop Pay's figures, Sidekick's and the agent channels' terms, the new database, and the earlier Scripts deadline. | fact: The seven gaps, each with what is and is not available. |  |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The business, the architecture, the checkout timeline, the integration contract and the agent surface give one answer to the opening question: the landlord takes on the machinery (one codebase, pods, the renderer, the checkout and its peak) and changes the platform under everyone on dates it publishes, while the merchant keeps the joins (every connector pinned, every webhook-fed flow reconciled, every extension point's sunset tracked).\n\n**So what:** A merchant on any hosted platform budgets for the vendor's change cadence as maintenance work with owners and dates, and asks its vendors for their unit of isolation and their contract terms, instead of copying the vendor's machinery or assuming the vendor's scale makes its integrations reliable.\n\n**Callback:** The opening question: which work the platform takes on and which work the merchant's team still operates. p44 answers it with the record the chapter has read: the machinery is the landlord's, the joins and the calendar are the merchant's.\n\n**Takeaway** (`course_of_action`): Inventory every app, connector and extension point with its API version, support end and owner; reconcile every webhook-fed flow and check that its subscription still exists; keep custom behavior out of the checkout; ask each vendor for its unit of isolation.\n\n**Hand-off** to [Case: Amazon, From Monolith to Services to the Everything Store](case-amazon.html): `contrast`: Shopify as the landlord: a platform company that rents shops to merchants and changes the platform under them on published dates. → Amazon, a retailer that built its own shop, opened its operations to other sellers and now sells its machinery to other shops and admits agents on its own terms.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p44 | synthesis | The record answers the opening question: the landlord runs the machinery and changes it under every merchant on dates it publishes, so the merchant's work is at the joins, every connector pinned, every webhook-fed flow reconciled and every extension point's sunset tracked. | reasoning: The opening question, the sections' findings, the thesis. |  |\n| p45 | synthesis | Established: revenue three quarters merchant solutions with two thirds of GMV through orchestrated Payments; one Rails codebase, multi-tenant and single-branch, sharded by shop into pods, with Packwerk kept as a gate; an explicit integration contract; extension points withdrawn on published dates. |  | `conclusion_summary`: The chapter's answer in one paragraph. → The points that are established, with their sources. |\n| p46 | analysis | Depends on context: the modular-monolith lesson applies only to owned code, a readiness calendar belongs where a merchant's peak breaks (for Kestrel & Pine the integration lugins and Functions: Extensibility and Ecosystem Governance](extensibility-and-app-ecosystems.html), [From Cart to Confirmation: Checkout Orchestration](cart-and-checkout.html), [Delivering the Storefront: Themes, Headless, Rendering and Performance](storefront-architecture.html).\n- API governance, versioning and webhook design; peak planning. See [Promises Between Systems: API Contracts, Webhooks and Versioning](api-contracts-and-versioning.html), [Black Friday Every Year: Peak Load, Resilience and Recovery](peak-load-and-reliability.html).\n- Agentic commerce protocols, EU constraints and the readiness list; payments mechanics. See [Assistants and Agents: AI in Commerce and What Is Real in 2026](ai-and-agentic-commerce.html), [Taking the Money: Payment Providers, Authorization, Capture and Refunds](commerce-payments.html), [Payments for Finance Architects: Eleven Reasons the Numbers Disagree](../finance-systems-architecture/payments-fundamentals.html).\n- Any description of Shopify's current pod topology, component count, checkout queue design or Catalog API terms; the chapter says the evidence stops there.\n- Comparisons with other platforms' internals. See [Case: commercetools, Shopware and the Composable Movement](case-composable-movement.html), [Suites, SaaS, Open Source and Composable: The Platform Landscape in 2026](commerce-platform-landscape.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Before print: the pod and shard topology after the Google Cloud migration, the component count after 2024 and the deploy cadence after 2023 are undocumented; if Shopify publishes a newer architecture retrospective, the evidence-age flags should be revised.\n- Before print: the Scripts earlier deadline (August 2025) and its extension were seen only in search snippets; a reviewer with the changelog archive can confirm or drop the note.\n- Before print: the Catalog API reference page returned 404 at the cut-off; its commercial terms and regional availabi
