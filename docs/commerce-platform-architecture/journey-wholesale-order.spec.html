<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/39-journey-wholesale-order/index.md) and its former spec.md, whose Non-goals, Modalities, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter, plus the units the contract asks for and the published chapter did not have (the contrast with Journeys 1 and 2, the thesis and roadmap paragraphs, the reading paragraph of the January table and the conclusion's synthesis); these are listed under decision_log.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The six EDI messages of one wholesale order (ORDERS, CONTRL, ORDRSP, DESADV, INVOIC, RECADV) with the system each is generated from, the three GS1 identifiers (GTIN, GLN, SSCC), and the fifteen steps from the order message to cash application.\n- **Know:** Bergzicht's spring reorder in the late-2027 design: ORDERS on 6 April 2027 for 240 units across 18 SKUs, €19,860 excluding VAT; validation of items, contract prices and credit against the ERP; allocation in the availability service; three pallets with SSCC labels from the WMS at pack; the DESADV from the pack confirmation before the pallets leave; delivery to Zwolle and the INVOIC on 9 April (€24,030.60 gross); payment due 9 May as a SEPA transfer to be matched.\n- **Know:** The ASN Chargeback of Q3 2026 (€14,200: despatch advices generated by the ERP at release with ERP pallet numbers while the WMS printed its own labels), why it went unseen for a quarter, W6's rules, and the Peppol variant for Ardennes Trail Co. (40 jackets, €3,800, ordered 21 April 2027, invoiced 23 April, due 23 May).\n- **Believe:** Each wholesale document is a promise in the buyer's contract, usually with a penalty.\n- **Believe:** The despatch advice must be written by the system that packed the pallets.\n- **Believe:** E-invoicing mandates change an invoice's format and transport, not its owner.\n- **Be able to:** Say, for each document in their own wholesale flow, which system generates it and whether that system saw the fact it states.\n- **Be able to:** Keep a partner card per trading partner (GLNs, guideline version, messages, test status, contacts, an owner) and detect deductions as cases with evidence.\n\n**Audience:** Readers new to commerce architecture, in particular anyone who meets EDI for the first time as a wall of capital letters: the integration engineer handed a trading-partner guideline, the product manager asked why a deduction appeared, the finance analyst matching a short payment.\n\n**Already knows:**\n\n- Kestrel & Pine, its people, its 2026 and January 2027 incidents in outline (including the ASN Chargeback by name) and the names of the sixteen failure patterns.\n- From Part I: the thirteen steps of an order, promise and handoff, the three status lines, 'system', 'the shop platform' and 'commerce platform', business models and the four scale stages, the capability map, bounded context, system of record, single writer, events, idempotency and reconciliation, the Waypoint decisions W1 to W8.\n- Glosses already given: PSP, WMS, ERP, iPaaS, EDI, webhook, API call, SKU, channel, marketplace connector, 3PL, order hub and order management system, availability service, D2C, B2B, PIM, POS.\n- From Parts II and III: product, variant, SKU and GTIN; prices frozen at order placement; available-to-promise and per-channel buffers; one order record; one invoice per shipment, credit notes as the only correction, the monthly match of invoices, payouts and bank lines.\n- From Part IX so far: Journey 1 (Eva's order #1072455 of 13 April 2027 replayed through the late-2027 design, the step table and handoff requirements) and Journey 2 (its return and exchange).\n\n**Does not yet know:**\n\n- The EDI messages ORDERS, CONTRL, ORDRSP, DESADV, INVOIC, RECADV; the GLN and the SSCC; VAN and AS2; a message implementation guideline, mapping and the partner card.\n- Allocation for a wholesale order; the four-way match; payment terms, receivable, cash application, dunning; Peppol, access point, the four-corner model, EN 16931, UBL, BIS Billing 3.0; intra-EU supply with reverse charge and VIES.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given deductions for mismatched pallets, the reader names the despatch advice's source as the cause and the system that should write it, rather than blaming the warehouse or the EDI provider. *Probe:* A supplier's ERP sends a retail chain's despatch advice when it releases an order to the warehouse, numbering the pallets itself; the warehouse system prints its own pallet labels at packing. Months later the chain's payments arrive short, with deduction codes, on invoices that are correct. Using only this chapter: what is wrong, why did nobody notice, and what should change? | `custom` | cold_reader | major |\n| AC-2 | The reader can say where an EDI order should become an order record and what protects that step. *Probe:* An EDI order arrives, the network redelivers it an hour later, two lines carry prices that differ from the contract, and the team's habit is to key EDI orders into the EDI provider's web portal and the ERP. Using only this chapter: what should happen to this order, and why? | `custom` | cold_reader | major |\n| AC-3 | The reader can say what an e-invoicing mandate changes in the invoice flow and what it does not. *Probe:* A Dutch supplier's Belgian business customer stops accepting PDF invoices. Using only this chapter: what changes in the supplier's invoicing, what stays the same, and is the supplier obliged? | `custom` | cold_reader | major |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict the chapter's sections and the kind of evidence it uses. *Probe:* After reading only the introduction: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as sections[].paragraphs[]. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** How does a wholesale reorder by EDI run from order to invoice, and where does it fail?\n\n> **Claim:** A wholesale reorder runs as a chain of documents, each a contractual promise: the order message becomes one order record in the OMS, keyed on the buyer's location number and purchase-order number; the warehouse system writes the despatch advice from the pallets as packed; the ERP writes the invoice from the shipped lines; and the money arrives thirty days later as a bank transfer to match. It fails where a document is written by a system that did not see the fact it states.\n\n**Disputed by:** The view that EDI is a translation job owned by an EDI provider or a consultant: map the ERP's order to the retailer's format, generate the despatch advice and the invoice from the order, and treat deductions as a finance matter.\n\n**So what:** A merchant that accepts the claim asks, for each document, which system generates it and whether that system touched the goods, keeps one partner card per trading partner with an owner, and treats every short payment as a case with evidence. In Q3 2026 Kestrel & Pine's ERP generated Bergzicht's despatch advices at release, with its own pallet numbers, while the WMS printed different labels at pack; nine deliveries produced €14,200 in deductions, unseen for a quarter because they arrived as short payments on correct invoices and only an external consultant could read the mapping. Under W6, Waypoint's EDI rule, the WMS prints the SSCC at pack and sends the despatch advice from its pack confirmation, and Bergzicht's 6 April 2027 reorder (240 units, €19,860) arrives on 9 April with a matching notice and is invoiced that day for €24,030.60, due 9 May. For Ardennes Trail Co. in Namur the same ERP invoice travels over Peppol: the format and transport change, the owner does not.\n\n**How and why:** The buyer's receiving scans each pallet's SSCC and books the contents listed for it in the despatch advice without counting, and its four-way match of order, despatch advice, receipt and invoice pays short whatever disagrees, under purchasing conditions with fees per message and per refused delivery (Jumbo's, for example). Only the system that built a pallet knows what is on it, so a notice written from the order states what should have shipped, not what did. Networks redeliver messages and buyers resend after timeouts, so the order record needs the GLN and PO number as its key; contract prices and credit limits live in the ERP, so validation reads them there; and an issued invoice is immutable, so it is written from the shipped lines.\n\n**Supporting claims**\n\n- **S1** — A wholesale order is a chain of documents (order, order response, despatch advice, invoice), each a promise in the buyer's purchasing conditions with a penalty behind it, tied together by three GS1 identifiers: the GTIN for the item, the GLN for the location and the SSCC for the pallet.\n- **S2** — The order message becomes one order record in the OMS, validated against the items, contract prices and credit limit the ERP owns and keyed on the buyer's GLN plus PO number so that a redelivered message does nothing, and its stock is committed in the availability service so every channel sees it within seconds.\n- **S3** — The despatch advice must be written by the warehouse system from the pallets as packed (the SSCC printed at pack, the DESADV sent from the pack confirmation before the truck leaves), because only the system that built a pallet knows what is on it and the buyer's receiving books what the notice says without counting.\n- **S4** — The invoice is the ERP's, written once from the shipped lines, and the money arrives thirty days later as a bank transfer that must be matched to invoices; an e-invoicing mandate changes the invoice's format and transport, not its owner.\n- **S5** — On the January 2027 landscape the ERP wrote the despatch advice at release while the WMS printed its own labels, and €14,200 of deductions in Q3 2026 went unseen for a quarter; wholesale fails where a document is written by a system that did not see the fact it states, and it is caught by a partner card, a compliance scorecard and a case per short payment.\n\n## Role in the part\n\nWalks Bergzicht's EDI reorder from the order message to the matched bank transfer through the late-2027 design with W6 in force, tells the ASN Chargeback as the failure path, runs a Belgian customer's Peppol invoice as the variant and compares the January 2027 path. Supports P9-3, P9-5 of part `part-9`.\n\n## Flow\n\n**Pattern:** `chronological` (also `grouping` in handoffs, january, chargeback, wrong: the walk read back as requirements, a comparison and the failures)\n\nThe order, its documents and the step table come first because every step refers to them; the sections then walk the reorder in the order it lives (message in, allocation, packing and despatch advice, invoice and money). Only after the reader has seen every document written do the later sections read the walk back: what each handoff requires, the same order on the January 2027 landscape, the ASN Chargeback that landscape produced, and further failures. The Peppol variant follows the invoice section because it varies that step; placed later it would interrupt the despatch-advice thread that runs from the handoff table's DESADV row to the chargeback. Putting the chargeback before the walk would explain a failure of a document the reader has not seen written; putting it before the January comparison would describe a failure on a landscape the reader has not been shown; putting the January comparison first would contrast a design the reader has not seen work; and the chargeback and the further failures sit together so the failure material is read in one place, just before the conclusion that calls back to it.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): A retail chain orders pallets of clothing and expects its receiving system to recognize what arrives. The supplier must send the shipment notice in the agreed format and label the pallets so they match it. A correct physical delivery can still be held up or penalized when those records disagree.\n\n**Bridge:** A delivery that is physically right: the goods ordered, on time, at the right dock. → The documents that travel with it between two companies' systems, which decide whether that delivery is received and paid; at Kestrel & Pine a quarter of revenue moves this way.\n\n**Thesis statement** (KEY POINTS callout (bullets 1 to 3) and paragraph p05): Each wholesale document is a promise in the buyer's contract and must be written by the system that knows the fact it states: the order message becomes one order record in the order management system, keyed on the buyer's location number and purchase-order number; the warehouse system writes the despatch advice from the pallets as packed; the ERP writes the invoice from the shipped lines; and the money arrives thirty days later as a bank transfer to match. The order fails where a document is written by a system that did not see the fact it states.\n\n**Roadmap** (Paragraph p06):\n\n- Set out the order, the setting of the walk and the documents and identifiers it uses. *Kept in:* order.\n- Give all fifteen steps in one table. *Kept in:* steps.\n- Follow the order in, through allocation, through packing and the despatch advice, and to the invoice and the money. *Kept in:* orders-in, allocation, despatch, invoice.\n- Run a Belgian customer's Peppol invoice as a variant of the invoice step. *Kept in:* peppol.\n- State what each handoff requires. *Kept in:* handoffs.\n- Compare the same order on the January 2027 landscape. *Kept in:* january.\n- Walk the ASN Chargeback as the failure path. *Kept in:* chargeback.\n- End with five more failures and how each is caught. *Kept in:* wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A retail chain expects its receiving system to recognize the pallets that arrive, so the supplier's shipment notice and pallet labels must match; a correct delivery can still be held up or penalized when those records disagree, and EDI carries the orders, notices and invoices between the companies' systems. | figure: Figure 1: the order, the despatch advice with a pallet, the invoice and the money, exchanged in front of a contract scroll. |  |\n| p02 | context | Wholesale earns a quarter of Kestrel & Pine's revenue from 1,100 accounts, its largest customer orders by EDI, and its orders are about fourteen times larger than web orders, so a mislabeled pallet or unreadable notice becomes a substantial deduction. | statistic: €12.0M of €48.0M revenue; 1,100 active accounts; average wholesale order €1,277 against €92 online. | `cause_effect`: Records that must match for a delivery to be accepted. → What such mismatches cost at Kestrel & Pine's wholesale volume. |\n| p03 | comparison | Journeys 1 and 2 followed a consumer who ordered at a checkout, paid at once and received a parcel; here the buyer is a company whose order arrives as a message nobody typed, whose goods leave on pallets with a despatch advice and whose money arrives thirty days later against an invoice, so the jobs stay the same while the documents, approvals and timing differ. |  | `contrast`: Journeys 1 and 2: a consumer who orders at a checkout, pays at once and receives a parcel, and the same Duiven stock and systems behind her. → A buyer that is a company: an order message, pallets with a despatch advice, money thirty days later. |\n| p04 | context | In the order's journey, Bergzicht's order commits 240 units at Duiven on 6 April 2027, which reduces what the online shop may offer Eva a week later, so wholesale and consumer channels compete for the same stock. | fact: 240 units committed on 6 April 2027; Eva orders on 13 April. | `elaboration`: A company as buyer, with documents and timing of its own. → Where its order sits beside Eva's in the same April, on the same stock. |\n| p05 | claim | The chapter's answer in short: each document is a promise in the buyer's contract and must be written by the system that knows the fact it states (the order record by the OMS keyed on the buyer's location and purchase-order numbers, the despatch advice by the warehouse system from the pallets as packed, the invoice by the ERP from the shipped lines, the money matched as a bank transfer), and the order fails where a document is written by a system that did not see its fact. |  | `problem_solution`: Documents that differ from a consumer order's, drawing on the stock Eva also buys from. → Which system should write each one, stated as the chapter's claim. |\n| p06 | transition | The chapter first sets out the order, the setting and the documents and identifiers, gives the fifteen steps in one table, and follows the order in, through allocation, packing and the despatch advice, to the invoice and the money, with a Belgian customer's Peppol invoice as a variant of the invoice step; it then states what each handoff requires, compares the January 2027 landscape (the systems that had run through 2026), walks the ASN Chargeback that landscape produced and ends with five more failures, using the replayed reorder, GS1 standards, retailers' published conditions and e-invoicing rules as evidence. |  | `sequence`: The claim. → The order in which the chapter argues it. |\n\n## Sections\n\n### The Order, the Setting and the Rules of This Walk\n\n**Controlling idea** (`description`, id `order`): The walk replays Bergzicht's 6 April 2027 reorder, with the ledger's facts, through the late-2027 design with W6 in force, and uses six EDI messages and three GS1 identifiers whose generating systems decide whether the documents are right.\n\n**Advances the thesis** (S1): Fixes the buyer, the order, the design it runs through and the documents and identifiers before the walk starts.\n\n**Transition in:** `elaboration`: The roadmap's first item: the order, the setting and the documents. → The buyer.\n\n**Order of paragraphs** (`prerequisite_order`): The buyer and the order come first, then the design the order is replayed through, then the vocabulary of messages and identifiers the steps use; the step table cannot be read before the reader knows the messages, and the messages mean little before the order they carry.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | description | Bergzicht Outdoor is a fictional Dutch chain of 38 shops with a distribution center in Zwolle, buying €2.1 million a year from Kestrel & Pine by EDI since 2025, its buyer Pieter Smit working with Head of Wholesale Lea Moreau. | fact: 38 shops; Zwolle DC; €2.1M a year; EDI since 2025; Pieter Smit and Lea Moreau. |  |\n| p08 | description | On 6 April 2027 an ORDERS message asks for 240 units across 18 SKUs of Ridgewalker jackets and Trailhead fleeces, €19,860 excluding VAT at contract prices. | fact: 6 April 2027; 240 units; 18 SKUs; €19,860 excl. VAT. | `sequence`: The buyer. → Its order. |\n| p09 | description | The order ships on three pallets with SSCC labels, the DESADV comes from the pack confirmation, the pallets reach Zwolle on 9 April with the invoice the same day, payment is due 9 May, and times within a day and credit figures are illustrative. | fact: Three pallets; DESADV at pack confirmation; delivery and INVOIC 9 April; due 9 May. | `sequence`: The order message. → What happens to the goods and the invoice. |\n| p10 | context | As in Journey 1, the order is replayed through the late-2027 design (W1, W2 with EDI orders through the OMS from 8 December 2027, W3 and W6's rules for SSCC, DESADV and partner cards); the real April order ran on the January landscape, which a later section compares, and the ASN Chargeback is told as it happened on that landscape. | fact: EDI and manual wholesale orders through the OMS from 8 December 2027; W6: SSCC labels by the WMS at pack, DESADV from the WMS confirmation, one partner card per trading partner. | `elaboration`: The order's facts. → The design the order is walked through, and the landscape it really ran on. |\n| p11 | definition | Six EDI messages carry this journey (ORDERS, CONTRL, ORDRSP, DESADV, INVOIC and RECADV), each named in EDIFACT (as EANCOM) and X12 and each generated by a named system, with ORDERS, INVOIC and DESADV the three most implemented. | table: ORDERS, CONTRL, ORDRSP, DESADV, INVOIC, RECADV with X12 twin, plain meaning, sender and generating system.; statistic: GS1 implementation survey (2021): ORDERS, INVOIC and DESADV the most implemented EANCOM messages. | `sequence`: The setting of the walk. → The documents the walk exchanges. |\n| p12 | definition | Three GS1 identifiers tie the documents together: the GTIN says what a unit is, the GLN says who and where, and the SSCC says this pallet and is the only key for a logistic unit used with EDI. | quotation: GS1 General Specifications 26.0: the SSCC is 'the only GS1 key that SHALL be used as the identifier of a logistic unit' and 'is used with EDI communications'. | `elaboration`: The messages. → The identifiers inside them. |\n| p13 | analysis | A despatch advice lists, per SSCC, the GTINs and quantities on that pallet, so a warehouse system that cannot print an SSCC per pallet and report its contents cannot produce a compliant despatch advice. |  | `cause_effect`: The SSCC as the pallet's key. → What a despatch advice therefore requires of the warehouse system. |\n\n### Fifteen Steps in One Table\n\n**Controlling idea** (`process`, id `steps`): The whole reorder fits one table of fifteen steps from ORDERS received to cash application, and the two steps where a document is written about physical goods are where the chapter's argument lies.\n\n**Advances the thesis** (S1, S3): Shows the chain of documents and their systems at a glance and singles out the despatch-advice rows.\n\n**Transition in:** `sequence`: The documents and identifiers. → The steps in which they are exchanged.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | process | With the documents and identifiers named, the whole reorder fits one table of fifteen steps from the ORDERS message to cash application, each with its system, data, promise, failure and chapter. | table: Fifteen steps from ORDERS received on Tuesday 6 April 09:12 to payment and cash application by 9 May, with system, data, promise made, what could fail and chapter. |  |\n| p15 | analysis | Rows 10 and 11, the SSCC labels and the DESADV, are where a document is written about physical goods by a system that may or may not have touched them, which makes them the chapter's subject. | figure: Figure 2: the reorder in the late-2027 architecture, from order message to bank transfer. | `emphasis`: Fifteen steps. → The two that matter most. |\n\n### ORDERS In: From Message to Order Record\n\n**Controlling idea** (`process`, id `orders-in`): The order message is acknowledged, mapped, validated against the ERP's data and created once in the OMS, keyed on the GLN plus PO number, before Kestrel & Pine makes its first promise in the order response.\n\n**Advances the thesis** (S2): Shows where the EDI order becomes an order record and what protects that step.\n\n**Transition in:** `sequence`: The step table's first rows. → The order message arriving.\n\n**Order of paragraphs** (`chronological`): The steps run in the order the message lives them: arrival and syntax receipt, mapping, validation, creation, the key that protects creation, and the response; the response cannot be explained before the validation that decides it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p16 | process | At 09:12 on Tuesday the interchange arrives in Kestrel & Pine's mailbox at a VAN, a provider-run network chosen over per-partner AS2 links, and the CONTRL it returns says the message parsed, not that it was agreed. | source: RFC 4130 (2005) for AS2. |  |\n| p17 | explanation | Mapping translates each buyer's own guideline into Kestrel & Pine's order record, so EDI costs per partner, and in the target design the mapping runs in the iPaaS and is described on W6's partner card owned by Ruben Alves, where in 2026 it lived in one consultant's head. | quotation: SPS Commerce 10-K for 2025: suppliers 'connect once and immediately transact with thousands of trading partners'. | `sequence`: A message that parsed. → Translating it into an order. |\n| p18 | process (list) | Validation in the OMS checks items, contract prices and credit against data the ERP owns, answering a price mismatch in the order response and making a credit hold a visible state. | quotation: Microsoft Learn (October 2026): 'Most businesses manage customer records, payment terms, and credit limits in Business Central and export them'.; scenario: Credit limit €450,000 with €188,000 open, labelled an assumption. | `sequence`: The mapped message. → The checks that make it an acceptable order. |\n| p19 | claim | The order is created once in the OMS, with channel EDI, the PO number as reference, NET 30 and the same number family as web orders (W2), not in the ERP or the EDI portal; the ERP receives it for posting. | source: Shopify Admin API 2026-10 defines NET as 'due a set number of days after the invoice is issued'. | `sequence`: A validated order. → Where it is created. |\n| p20 | explanation | Idempotency protects creation: the OMS keys it on Bergzicht's GLN plus PO number, so a redelivered or resent ORDERS finds the order and does nothing, where without the key Kestrel & Pine would ship 480 units and invoice twice. | source: Stripe's idempotent-requests documentation. | `elaboration`: Creating the order once. → The key that makes 'once' hold when messages repeat. |\n| p21 | process | The ORDRSP on Tuesday afternoon accepts all 18 lines for delivery on 9 April, Kestrel & Pine's first promise in the journey, which the availability service lets the OMS make honestly. |  | `sequence`: One order record. → The response that promises it back to the buyer. |\n\n### Allocation: Whose Stock Is It?\n\n**Controlling idea** (`explanation`, id `allocation`): A wholesale order holds stock for days while every channel keeps selling, so its allocation must be committed in the availability service, visible to every channel within seconds.\n\n**Advances the thesis** (S2): Shows the stock half of turning the message into one order everyone can see.\n\n**Transition in:** `cause_effect`: The response that the availability service lets the OMS make honestly. → How the stock behind that promise is held.\n\n**Order of paragraphs** (`problem_solution`): The difference from a web order comes first, then the one place the answer lives with a worked figure, then the two business rules that follow; the rules make no sense before the reader sees the shared shelf.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p22 | comparison | A wholesale order takes stock differently from a web order: Bergzicht's 240 units are allocated three days before they ship while the storefronts, marketplaces and B2B portal keep selling from the same shelves. |  |  |\n| p23 | example | In the target design the availability service computes available-to-promise per channel from the WMS's stock events (W1), so the commitment shows everywhere within seconds: 36 moss M jackets on hand, 12 to Bergzicht and one buffer leave 23 for Eva's storefront, while in January 2027 the ERP's order reached the platform an hour later at best. | scenario: 12 women's moss M Ridgewalkers; 36 on hand; buffer one; 23 available to the NL storefront on 6 April, the number Eva sees on 13 April; labelled an assumption.; figure: Figure 3: one shelf, two buyers: 36 on hand, 12 to Bergzicht, one buffer, 23 for the storefront. | `problem_solution`: Stock held for days while other channels sell. → Where the commitment is recorded and how fast every channel sees it. |\n| p24 | recommendation | Two B2B rules follow: large accounts get allocations, not promises, and shortfalls are negotiated in the order response, not canceled. |  | `cause_effect`: One place where the allocation is committed. → The business rules that follow from it. |\n\n### Pick to Pallet, Label and Despatch Advice: The Document That Costs Money\n\n**Controlling idea** (`process`, id `despatch`): The WMS prints each pallet's SSCC at pack and writes the DESADV from that record before the truck leaves, because the buyer's receiving trusts the notice and its contract charges when it is wrong.\n\n**Advances the thesis** (S3, S1): Shows the despatch advice written by the system that packed the pallets, and the buyer rules that make it a priced promise.\n\n**Transition in:** `sequence`: Stock allocated to Bergzicht. → The instruction to ship it and the packing.\n\n**Order of paragraphs** (`chronological`): The goods move from fulfillment order to pack to notice; the buyer's rules come at the moment the notice is sent, because that is when they bind; the arrival at Zwolle closes the physical journey. Putting the rules before packing would explain a penalty before the reader has seen what it is charged for.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p25 | process | On Tuesday afternoon the OMS sends the WMS a fulfillment order at the wholesale service level, and Duiven runs the wholesale wave after the morning's parcel waves. | quotation: Manhattan: its warehouse product handles 'wholesale, retail, and direct orders at the same time'. |  |\n| p26 | claim | Packing is the moment of truth: as each pallet is closed the WMS prints its SSCC and records which cartons and GTINs are on it, W6's first rule, so the label describes the pallet as built, not the order. |  | `sequence`: The fulfillment order. → The pallets being built and labelled. |\n| p27 | claim | The DESADV is written from that record at pack confirmation on Thursday 8 April and reaches Bergzicht before the pallets leave Duiven, W6's second rule: sent from the WMS's confirmation, not from the ERP. | fact: DESADV at pack confirmation, Thursday 8 April (illustrative day), before the pallets leave. | `cause_effect`: A pack record per pallet. → The notice written from it. |\n| p28 | evidence | Jumbo's published rules show why the buyer cares and what it costs: every delivery must be preceded by a DESADV, one without it is refused, the SSCC label links pallet and message, and its purchasing conditions forfeit €70 per non-compliant message and charge €250 per order line delivered less than 90% on time and in full. | quotation: Jumbo DC guidelines (October 2025, translated): 'Every delivery to our mechanized DC must be preceded by a DESADV message'; 'A delivery without an accompanying DESADV message cannot be processed and is therefore refused!'; 'The SSCC label forms the link with the DESADV despatch message'.; quotation: Jumbo purchasing conditions, 9 April 2026 (translated): €70 per message, refusal, €250 per order line. | `cause_effect`: The notice sent before the truck. → Why the buyer insists on it. |\n| p29 | evidence | bol has required SSCC labels on every logistic unit since 31 December 2021 and Walmart's on-time-in-full program carried a 3% fee at its 2017 introduction; Bergzicht's conditions are fictional and take this shape. | source: bol SSCC page (accessed 2026-11); Talk Business & Politics, 2017. | `additional_support`: One retailer's rules and penalties. → Two more retailers with the same shape. |\n| p30 | process | The pallets reach Zwolle on Friday 9 April, where receiving scans each SSCC, finds it in the DESADV and books the contents without counting; Bergzicht sends no RECADV, so the only evidence of receipt is what is not deducted. | fact: Delivered 9 April; Bergzicht sends no RECADV. | `time`: The buyer's rules for a notice. → The delivery those rules apply to. |\n\n### Invoice, Terms and the Money Thirty Days Later\n\n**Controlling idea** (`process`, id `invoice`): The ERP invoices from the shipped lines, the buyer matches it against order, notice and receipt, and the money arrives thirty days later as a bank transfer that cash application must match.\n\n**Advances the thesis** (S4): Shows the invoice's owner and the money as a receivable to match, not a payment event.\n\n**Transition in:** `sequence`: The pallets received at Zwolle. → The invoice for what was delivered.\n\n**Order of paragraphs** (`chronological`): Invoice, the buyer's match, the books, then the transfer and its matching follow the calendar from 9 April to 9 May; the four-way match must come before the money because it decides what is paid.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p31 | claim | The invoice is the ERP's and is written from what shipped: on Friday the ERP issues the INVOIC for €19,860 net, €4,170.60 VAT and €24,030.60 gross, due 9 May, with the legally required contents, immutable once issued and corrected only by credit note. | fact: €19,860 + €4,170.60 VAT at 21% = €24,030.60; due 9 May.; quotation: Odoo 18.0: a credit note 'is the only legal method for canceling, refunding, or modifying a validated invoice'. |  |\n| p32 | explanation | On Bergzicht's side the invoice meets the four-way match of purchase order, despatch advice, receipt scan and invoice, and any line that disagrees is paid short with a deduction code. |  | `cause_effect`: An invoice written from the shipped lines. → What the buyer does with it. |\n| p33 | explanation | The ERP posts a receivable of €24,030.60 and revenue of €19,860 at delivery on 9 April under IFRS 15, so for thirty days Kestrel & Pine carries Bergzicht's credit risk. | source: IFRS 15, effective 2018: revenue when control passes. | `sequence`: The buyer's match. → The seller's books. |\n| p34 | process | The money arrives by SEPA transfer with remittance information, possibly in seconds since instant transfers became mandatory in October 2025, and the work is cash application, with reminders and an order hold the OMS must show when payment is late. | source: Regulation (EU) 2024/886 on instant credit transfers.; figure: Figure 4: each wholesale document has its own system of truth. | `time`: A receivable for thirty days. → The day the money comes back. |\n\n### The Variant: A Belgian Shop's Peppol Invoice\n\n**Controlling idea** (`comparison`, id `peppol`): A Belgian shop's order invoiced over Peppol shows that an e-invoicing mandate changes the invoice's format, VAT treatment and transport, and adds a transmission state, while the ERP stays its owner.\n\n**Advances the thesis** (S4): Shows that the invoice's owner holds under a different format and network.\n\n**Transition in:** `contrast`: Bergzicht's EDI invoice and the money that settles it. → A variant of the invoice step: a small business customer whose invoice travels over Peppol.\n\n**Order of paragraphs** (`large_to_small`): The order, then the Belgian rule, then what Peppol is, then what the ERP produces and how it differs from EDI, then the neighbouring countries; the comparison table needs Peppol explained first.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p35 | example | Ardennes Trail Co., a fictional shop in Namur, orders 40 Ridgewalker jackets at €95 through the B2B portal on 21 April 2027 for €3,800, shipped by bpost and invoiced on 23 April, due 23 May; up to the invoice it is Eva's journey with a company account and terms. | fact: 40 jackets, €3,800, 21 April, 23 April, 23 May. |  |\n| p36 | context | Belgium has required structured e-invoices over Peppol between Belgian businesses since 1 January 2026, with fines and a tolerance period but no postponement; whether it reaches a Dutch supplier without a Belgian establishment is not settled by the sources read, and Kestrel & Pine sends Peppol invoices to all Belgian business customers either way. | quotation: einvoice.belgium.be (18 September 2024): 'Sending a PDF invoice by e-mail or via a platform will no longer be enough'; fines of €1,500, €3,000 and €5,000; tolerance announced December 2025. | `cause_effect`: A Belgian business customer. → The Belgian rule for its invoices. |\n| p37 | definition | Peppol is an open network and document standard: each company connects through an access point in a four-corner model, and the document is a BIS Billing 3.0 invoice in UBL implementing EN 16931. | source: OpenPeppol; BIS Billing 3.0.21, published 20 May 2026, mandatory 17 August 2026; type codes 380 and 381. | `elaboration`: A mandate to use Peppol. → What Peppol is. |\n| p38 | comparison | The ERP produces the same invoice in substance, differing in VAT (0% intra-EU supply with reverse charge after a VIES check) and transport (through the access points), and transmission becomes a state of the invoice the ERP must hold. | table: EDI INVOIC to Bergzicht versus Peppol invoice to Ardennes Trail: content, purpose, addressing, transport, validation, legal position in November 2026. | `cause_effect`: The Peppol network and format. → What the ERP's invoice becomes on it. |\n| p39 | synthesis | Germany requires businesses to receive e-invoices since 2025 and tolerates EDI through 2027, ViDA brings cross-border digital reporting from July 2030, and through all of it the invoice's owner stays the same while its format and delivery receipt change. | source: German BMF FAQ; European Commission ViDA page (adopted 11 March 2025). | `similarity`: Belgium's mandate. → The neighbouring rules, and what they all leave unchanged. |\n\n### What Each Handoff Requires\n\n**Controlling idea** (`analysis`, id `handoffs`): Read against freshness, consistency, latency and availability, wholesale's handoffs are slower than the consumer journey's but stricter on consistency, and the DESADV handoff tolerates no failure but holding the truck.\n\n**Advances the thesis** (S2, S3, S4): Turns the walk into a specification of each join, and singles out the despatch advice.\n\n**Transition in:** `conclusion_summary`: Bergzicht's walk from message to money, and the invoice variant. → The joins of Bergzicht's order, specified.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p40 | analysis | The four questions asked of every join give wholesale a different profile from the consumer journey: slower almost everywhere, stricter on consistency, with one hard deadline, the truck. | table: Seven handoffs from ORDERS in to the bank, with freshness, consistency, latency, availability and style (W5); latencies illustrative. |  |\n| p41 | analysis | The DESADV row is the one with no tolerance: freshness, consistency and the deadline bind at once, and the only safe failure is to hold the truck. |  | `emphasis`: Seven handoff specifications. → The one that tolerates nothing. |\n\n### The Same Order in January 2027\n\n**Controlling idea** (`comparison`, id `january`): On the January 2027 landscape, where the reorder actually ran, the same systems held the order in the ERP, committed stock an hour late and wrote the despatch advice at release; what changes in the late-2027 design is who writes each document.\n\n**Advances the thesis** (S5): Holds the systems constant and shows that the differences are owners and joins.\n\n**Transition in:** `contrast`: The late-2027 handoffs, with the DESADV row that tolerates nothing. → The landscape the April order really ran on, which had run through 2026.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p42 | comparison | In April 2027 the reorder actually ran on the January landscape with the same ERP, WMS and EDI provider, and side by side the two paths differ in where the order lives, who can read the mapping, how fast stock is committed, which system writes the despatch advice and from what the invoice is written. | table: Late 2027 versus January 2027: where the order lives, who reads the mapping, stock, SSCC and DESADV, invoice, deductions. |  |\n\n### The Failure Path: The ASN Chargeback\n\n**Controlling idea** (`example`, id `chargeback`): In Q3 2026 the ERP wrote despatch advices at release while the WMS printed its own labels, costing €14,200 unseen for a quarter; W6 supplies the detection and the evidence that were missing, and names what can still go wrong.\n\n**Advances the thesis** (S5, S3): Shows the failure the despatch-advice rule prevents, why it stayed hidden, and how it is caught now.\n\n**Transition in:** `cause_effect`: The January landscape, where the ERP wrote the despatch advice at release. → The failure that path produced in Q3 2026.\n\n**Order of paragraphs** (`chronological`): Mechanism, consequence, why it was unseen, then detection, recovery and residual failures: the remedies only make sense against the mechanism and the silence.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p43 | context | That January path produced the ASN Chargeback in the third quarter of 2026, which cost €14,200. | fact: Q3 2026; €14,200. |  |\n| p44 | cause_effect | The old ERP flow generated the DESADV when it released the order to the warehouse, with its own pallet numbers and expected contents, while the WMS packed the actual goods and printed its own labels. | fact: ERP-generated DESADV at release with ERP pallet numbers; WMS labels at pack. | `cause_effect`: The incident. → Its mechanism. |\n| p45 | cause_effect | Bergzicht therefore received pallets whose numbers or contents did not match the notice, or notices after the truck, each forcing a manual count and a contractual fee; nine Q3 deliveries produced the October 2026 deduction. | fact: Nine deliveries; deduction in the October 2026 remittance (illustrative count). | `cause_effect`: Notice and labels written by different systems. → What the buyer's receiving saw. |\n| p46 | analysis | Nobody saw it for a quarter because the deductions arrived as unexplained short payments on correct invoices, finance, wholesale and the warehouse each saw one piece, only the consultant could read the mapping (the Lynchpin), and nobody owned the contract's demand for pallet-level content (the Pulled Rug). |  | `contrast`: A costly, repeated failure. → Why it stayed invisible. |\n| p47 | recommendation | In the target design three signals replace the silence: a compliance scorecard on the partner card, an alarm on any negative acknowledgement, and a case opened for every short payment naming the invoice, the DESADV and the deduction code. |  | `problem_solution`: A failure nobody saw. → The signals that detect it now. |\n| p48 | analysis | A deduction can be disputed only with evidence that the DESADV described the pallets as shipped, which W6 produces; the €14,200 was not disputed because that evidence did not exist. |  | `sequence`: Detection. → Recovery. |\n| p49 | recommendation | W6 still leaves failures to guard against: a DESADV sent after the truck, a negative CONTRL left unread, a quantity changed after sending and a reused SSCC serial, each with its fix. | figure: Figure 5: in January 2027 the despatch advice described the order while the pallets described the pack; after W6 one system writes both. | `contrast`: What W6 fixes. → What can still go wrong after it. |\n\n### When It Goes Wrong Along This Path\n\n**Controlling idea** (`example`, id `wrong`): Beyond the ASN path, five recurring wholesale failures each have a detection and a recovery, and all reduce to write-off, retry or compensation.\n\n**Advances the thesis** (S5): Shows the remaining failures sit at handoffs and are caught by keys, cases and partner cards.\n\n**Transition in:** `example`: The ASN path and what can still go wrong after W6. → Five more failures on this path.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p50 | example (list) | Beyond the ASN path, five failures recur in wholesale: the duplicate ORDERS, the change after allocation, the short pick, the remittance that names nothing and the guideline revision are each caught by a key, a re-validation, the shipped quantity, a cash-application rule or the partner card. | scenario: A transfer of €23,214.80 against three invoices and two deductions (illustrative). |  |\n| p51 | synthesis | Hohpe's three recoveries, write-off, retry and compensating action, cover all five; in wholesale the compensation is a credit note and the write-off is a deduction nobody disputed. | source: Gregor Hohpe, 'Starbucks does not use two-phase commit' (2004). | `conclusion_summary`: Five failures and their recoveries. → The three kinds of recovery they reduce to. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The opening's puzzle, a correct delivery penalized, is a document written by the wrong system. Replayed through the late-2027 design, Bergzicht's three pallets arrive with labels and a despatch advice from one pack confirmation, are booked without counting and invoiced from what shipped; in Q3 2026 the same warehouse shipped every unit and Kestrel & Pine still lost €14,200, because the ERP had described the order instead of the pallets. Each wholesale document is safe when the system that saw its fact writes it, and an e-invoice changes the format and transport, not the writer.\n\n**So what:** A supplier that asks, for each document, which system writes it and whether that system saw the fact, keeps a partner card per buyer and opens a case for every short payment finds its deductions before the buyer's receiving does.\n\n**Callback:** The introduction's hook: a retail chain whose receiving system must recognize what arrives, where a correct physical delivery can still be held up or penalized when the records disagree. The reader can now say which record disagreed in Kestrel & Pine's case and which system should have written it.\n\n**Takeaway** (`course_of_action`): List every document you exchange with each trading partner, write next to it the system that generates it and whether that system saw the fact it states, and put each partner on a one-page partner card with an owner.\n\n**Hand-off** to [Journey 4: Black Friday, Hour by Hour](journey-peak-day.html): `emphasis`: The first three journeys' chain of handoffs, walked on an ordinary April week: Bergzicht's pallets and Eva's parcel leaving the same warehouse. → The day that is not ordinary: the same chain at about forty times its normal load on Black Friday 2026, when the handoffs' delays and copies turned into an oversell, and the plan that rehearses the 2027 evening.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p52 | synthesis | The opening's correct delivery that is penalized turns out to be a document written by the wrong system: in the late-2027 design Bergzicht's pallets, notice and invoice all come from the systems that saw the facts, while in Q3 2026 the same warehouse shipped every unit and €14,200 was lost because the ERP described the order instead of the pallets, so a supplier that asks of each document who writes it and whether that system saw the fact finds its deductions before the buyer does. | reasoning: The opening's penalized delivery set against the late-2027 walk and the Q3 2026 incident. |  | nd the storefronts kept selling it for two hours. |  | `emphasis`: The questions about one ordinary wholesale order. → The same chain on a day that is not ordinary, in the next chapter. |\n\n## Non-goals\n\n- Teaching B2B commerce features (company accounts, contract pricing, quotes, approvals, credit limits) in depth. See [Selling to Businesses: Accounts, Contract Prices, Quotes and Approvals](b2b-commerce.html).\n- EDI standards, transports, providers, mapping and the e-invoicing calendar in depth; the regulatory calendar. See [Documents Between Companies: EDI, Punchout and E-Invoicing](edi-and-e-invoicing.html), [Rules Turned Into Requirements: Consumer, Payment, Invoicing and Platform Regulation](commerce-regulation.html).\n- The ERP's role and the hub debate; invoicing, credit notes and the ledger. See [The Back Office: ERP Integration and Who Is the Hub](erp-and-back-office-integration.html), [Tax, Invoices and the Books: From Order to Ledger](tax-invoicing-and-ledger.html).\n- Warehouse operations beyond the pallet, SSCC and DESADV steps. See [Pick, Pack, Ship: Warehouse Management and Fulfillment](warehouse-and-fulfillment.html).\n- Punchout and procurement integration, and the marketplace variant of a wholesale-like order.\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-11-13** — Auto-resolved by the author's standing instruction of 2026-11-12 after the confirming round 3 (escalate: 10 major at fault in the draft, 2 at fault in the spec). (1) Spec: the two failure lists side by side both named the guideline revision; both readers asked for one list, so the revision is cut from 'What can still go wrong after W6' and kept in the five further failures, whose opening now says they come beyond the risks W6 leaves (rule 3). (2) Spec: the Peppol variant's position after the invoice section stays; the readers of round 3 asked for different moves (between the invoice and the money, after the failures, after the handoffs), so the current position sta                 s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
